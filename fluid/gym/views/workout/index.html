<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antrenman modu</title>
<link rel="stylesheet" href="../../components/fit.css">
<script src="../../lib/fluid.js"></script>
<script src="../../components/exercise-data.js"></script>
<script src="../../lib/youtube.js"></script>

<style>
  html, body.fit { height: 100%; }
  body.fit { padding: 0; overflow: hidden; font-size: 16px; }
  #app { height: 100%; display: flex; flex-direction: column; }
  header.top { flex: none; padding: 10px 14px 8px; border-bottom: 1px solid var(--fl-border, #e4e7ec); background: var(--fl-bg, #fff); }
  .row1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .stabs { display: flex; gap: 6px; }
  .stabs button { min-height: 44px; padding: 0 22px; font-size: 18px; font-weight: 650; border-radius: 999px;
    border: 2px solid var(--fl-border, #e4e7ec); background: var(--fl-bg, #fff); color: inherit; cursor: pointer; }
  .stabs button[aria-pressed="true"] { background: var(--fit-accent); border-color: var(--fit-accent); color: #fff; }
  .sp { flex: 1; }
  .clock { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .clock small { font-size: 12px; font-weight: 500; color: var(--fl-muted, #6b7280); margin-right: 6px; }
  .mini { min-height: 44px; padding: 0 14px; font: inherit; font-size: 14px; font-weight: 600; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--fl-border, #e4e7ec); background: var(--fl-surface, #f5f7fa); color: inherit; }
  .mini.save { border-color: var(--fit-accent); color: var(--fit-accent); }
  .prog { display: flex; gap: 3px; margin-top: 8px; }
  .prog button { flex: 1; height: 16px; min-width: 0; padding: 0; border: 0; border-radius: 4px; cursor: pointer; background: var(--fl-border, #e4e7ec); position: relative; }
  .prog button.done { background: var(--fit-accent); opacity: .55; }
  .prog button.cur { background: var(--fit-accent); }
  .prog button::after { content: ""; position: absolute; inset: -14px 0; }
  .stepname { display: flex; align-items: baseline; gap: 10px; margin-top: 6px; font-size: 13px; color: var(--fl-muted, #6b7280); }
  .stepname b { color: var(--fit-accent); font-size: 15px; }
  main { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px; }
  .stage { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
  @media (min-width: 720px) { .stage.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  #card { min-width: 0; }
  #ctl { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  footer.nav { flex: none; display: flex; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--fl-border, #e4e7ec); background: var(--fl-bg, #fff); }
  footer.nav button { flex: 1; min-height: 56px; font: inherit; font-size: 20px; font-weight: 700; border-radius: 12px; cursor: pointer;
    border: 2px solid var(--fl-border, #e4e7ec); background: var(--fl-surface, #f5f7fa); color: inherit; }
  footer.nav button.next { background: var(--fit-accent); border-color: var(--fit-accent); color: #fff; }
  footer.nav button:disabled { opacity: .35; cursor: default; }
  button:focus-visible { outline: 3px solid var(--fit-accent); outline-offset: 2px; }
  .big { min-height: 64px; width: 100%; font: inherit; font-size: 22px; font-weight: 700; border-radius: 14px; border: 0; cursor: pointer;
    background: var(--fit-accent); color: #fff; }
  .big.alt { background: var(--fl-surface, #f5f7fa); color: inherit; border: 2px solid var(--fl-border, #e4e7ec); }
  .btn { min-height: 48px; padding: 0 18px; font: inherit; font-size: 16px; font-weight: 600; border-radius: 10px; cursor: pointer;
    border: 2px solid var(--fl-border, #e4e7ec); background: var(--fl-bg, #fff); color: inherit; }
  .target { background: var(--fl-surface, #f5f7fa); border: 1px solid var(--fl-border, #e4e7ec); border-radius: 12px; padding: 12px 14px; }
  .target .t1 { font-size: 26px; font-weight: 750; }
  .target .t2 { margin-top: 2px; font-size: 16px; }
  .target .t3 { margin-top: 4px; font-size: 14px; color: var(--fl-muted, #6b7280); }
  .last { margin-top: 8px; font-size: 16px; font-weight: 600; }
  .last.up { color: var(--fl-good, #15803d); }
  .hint { display: inline-block; margin-top: 4px; padding: 4px 10px; border-radius: 999px; background: var(--fl-good, #15803d); color: #fff; font-size: 14px; font-weight: 700; }
  .sec { font-size: 12px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--fl-muted, #6b7280); margin: 0 0 6px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { min-height: 44px; padding: 0 16px; font: inherit; font-size: 15px; font-weight: 600; border-radius: 999px; cursor: pointer;
    border: 2px solid var(--fl-border, #e4e7ec); background: var(--fl-bg, #fff); color: inherit; }
  .chip.on { background: var(--fit-warm); border-color: var(--fit-warm); color: #fff; }
  .sets { display: flex; flex-direction: column; gap: 8px; }
  .srow { display: grid; grid-template-columns: minmax(96px, 1.2fr) 1fr 1fr; gap: 8px; align-items: center; }
  .sbtn { min-height: 52px; font: inherit; font-size: 18px; font-weight: 700; border-radius: 12px; cursor: pointer;
    border: 2px solid var(--fl-border, #e4e7ec); background: var(--fl-bg, #fff); color: inherit; }
  .sbtn.cur { border-color: var(--fit-accent); color: var(--fit-accent); }
  .sbtn.on { background: var(--fl-good, #15803d); border-color: var(--fl-good, #15803d); color: #fff; }
  .fld { display: flex; flex-direction: column; font-size: 11px; color: var(--fl-muted, #6b7280); }
  .fld input { min-height: 44px; width: 100%; font: inherit; font-size: 18px; font-weight: 600; padding: 0 8px; text-align: center;
    border: 1px solid var(--fl-border, #e4e7ec); border-radius: 10px; background: var(--fl-bg, #fff); color: inherit; }
  .rest { border-radius: 14px; padding: 12px 14px; text-align: center; color: #fff; background: var(--fit-accent); }
  .rest.over { background: var(--fit-warm); }
  .rest.ready { background: var(--fl-good, #15803d); }
  .rest .rl { font-size: 14px; opacity: .95; }
  .rest .rt { font-size: 44px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .rest .rs { margin-top: 6px; background: rgba(255,255,255,.22); color: #fff; border: 0; min-height: 44px; padding: 0 16px; border-radius: 10px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  .timer { text-align: center; padding: 16px 10px; border-radius: 16px; background: var(--fl-surface, #f5f7fa); border: 1px solid var(--fl-border, #e4e7ec); }
  .timer .tv { font-size: 88px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; color: var(--fit-accent); }
  .timer .tv.over { color: var(--fit-warm); }
  .timer .tl { font-size: 15px; color: var(--fl-muted, #6b7280); margin-top: 6px; }
  .adj { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 12px; }
  .adj span { min-width: 90px; text-align: center; font-size: 20px; font-weight: 700; }
  .adj .btn { min-width: 64px; font-size: 24px; }
  details.cues { background: var(--fl-surface, #f5f7fa); border: 1px solid var(--fl-border, #e4e7ec); border-radius: 12px; padding: 10px 14px; }
  details.cues summary { cursor: pointer; font-weight: 650; min-height: 32px; display: flex; align-items: center; }
  details.cues ul { margin: 6px 0 0; padding-left: 20px; }
  .form { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; }
  .form input { width: 24px; height: 24px; }
  .msg { font-size: 13px; color: var(--fl-muted, #6b7280); min-height: 18px; }
  .msg.ok { color: var(--fl-good, #15803d); } .msg.err { color: var(--fl-bad, #dc2626); }
  .done { text-align: center; padding: 30px 10px; }
  .done h2 { font-size: 30px; margin: 0 0 10px; }
  .listn { font-size: 15px; font-weight: 650; color: var(--fl-muted, #6b7280); }
  @media (max-width: 520px) {
    .stabs button { padding: 0 16px; }
    .timer .tv { font-size: 72px; }
    .rest .rt { font-size: 48px; }
    .srow { grid-template-columns: 1fr 1fr 1fr; }
  }
</style>
</head>
<body class="fit" data-session="sali">
<div id="app">
  <header class="top">
    <div class="row1">
      <div class="stabs" id="stabs"></div>
      <fl-block-picker compact></fl-block-picker>
      <span class="sp"></span>
      <span class="clock"><small>Geçen süre</small><span id="clock">0:00</span></span>
      <button class="mini save" id="saveBtn" type="button">Kaydet</button>
    </div>
    <div class="prog" id="prog" role="group" aria-label="Seans adımları"></div>
    <div class="stepname"><b id="stepTitle"></b><span id="stepCount"></span></div>
  </header>
  <main id="main"><div class="stage" id="stage"><div id="card"></div><div id="ctl"></div></div></main>
  <footer class="nav">
    <button type="button" id="backBtn">← Geri</button>
    <button type="button" id="nextBtn" class="next">İleri →</button>
  </footer>
</div>
<script>
(function () {
  'use strict';
  var SESS = window.FIT_SESSIONS || {}, EX = window.FIT_EXERCISES || {}, META = window.FIT_SESSION_META || {};
  var KEY = 'fluid-workout-v1', LOG = 'workspace-log/antrenman-log.jsonl';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
  var mmss = function (s) { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + pad(s % 60); };
  var today = function () { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };

  /* ---------- state ---------- */
  var ROOT;
  function load() {
    try { ROOT = JSON.parse(localStorage.getItem(KEY)); } catch (e) { ROOT = null; }
    if (!ROOT || ROOT.date !== today()) ROOT = { date: today(), session: null, last: ROOT && ROOT.last || null, s: {} };
    if (!ROOT.session) {
      var dow = new Date().getDay();
      ROOT.session = dow === 2 ? 'sali' : dow === 5 ? 'cuma' : (ROOT.last && SESS[ROOT.last] ? ROOT.last : 'sali');
    }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(ROOT)); } catch (e) {} }
  function S() {
    var k = ROOT.session;
    if (!ROOT.s[k]) ROOT.s[k] = { step: 0, t0: 0, t1: 0, ex: {}, list: {}, cardio: {}, hold: null, rest: null, saved: 0 };
    return ROOT.s[k];
  }
  function block() { return window.FIT_currentBlock ? FIT_currentBlock() : 1; }
  // the session's steps for the active block (variants resolved; ids differ per variant)
  function steps() { return window.FIT_sessionSteps ? FIT_sessionSteps(ROOT.session) : (SESS[ROOT.session] || []); }
  function cur() { return steps()[S().step]; }
  function exState(st) {
    var s = S();
    if (!s.ex[st.id]) {
      var w = [], n = st.sets || 1, i;
      for (i = 0; i < n; i++) w.push({ done: 0, kg: '', reps: '' });
      var wu = []; for (i = 0; i < (st.warmupSets || 0); i++) wu.push(0);
      s.ex[st.id] = { warm: wu, work: w, form: true };
    }
    var ex = s.ex[st.id];
    // per-side moves: each set is done once both sides are done
    if (st.perSide) ex.work.forEach(function (x) { if (!x.sides) x.sides = [x.done, x.done]; });
    return ex;
  }
  function touch() { var s = S(); if (!s.t0) s.t0 = Date.now(); }

  /* ---------- sound ---------- */
  var AC = null;
  function unlock() {
    try {
      if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === 'suspended') AC.resume();
    } catch (e) {}
  }
  function beep(n) {
    n = n || 2;
    try { if (navigator.vibrate) navigator.vibrate(n === 1 ? 200 : [200, 100, 200, 100, 300]); } catch (e) {}
    try {
      if (!AC) return;
      for (var i = 0; i < n; i++) {
        var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + i * 0.28;
        o.type = 'sine'; o.frequency.value = 880; o.connect(g); g.connect(AC.destination);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.4, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
        o.start(t); o.stop(t + 0.25);
      }
    } catch (e) {}
  }

  /* ---------- log ---------- */
  var history = {}; // slug -> {date, sets:[{kg,reps,form}]}
  var logMsg = '';
  function parseLog(text) {
    var by = {}, out = {};
    String(text || '').split('\n').forEach(function (l) {
      l = l.trim(); if (!l) return;
      try { var r = JSON.parse(l); if (r && r.exercise && r.date) (by[r.exercise] = by[r.exercise] || []).push(r); } catch (e) {}
    });
    Object.keys(by).forEach(function (slug) {
      var recs = by[slug], dates = recs.map(function (r) { return r.date; }).sort();
      var pastDates = dates.filter(function (d) { return d !== today(); });
      var d = pastDates.length ? pastDates[pastDates.length - 1] : dates[dates.length - 1];
      var sets = recs.filter(function (r) { return r.date === d; }).sort(function (a, b) { return a.set - b.set; });
      out[slug] = { date: d, sets: sets };
    });
    return out;
  }
  function loadLog() {
    if (!window.fluid) return Promise.resolve();
    return window.fluid.readFile(LOG).then(function (t) { history = parseLog(t); }, function () { history = {}; });
  }
  // top of the rep range: "8–12 / kol" -> 12, "5" -> 5; text targets ("tükenişe 2 kala") -> 0
  function repHi(st) { var m = String(st.reps || '').match(/^\s*(\d+)(?:\s*[–-]\s*(\d+))?/); return m ? +(m[2] || m[1]) : (st.holdSec ? st.holdSec[1] : 0); }
  function amountTxt(st) {
    if (st.holdSec) return st.holdSec[0] + '–' + st.holdSec[1] + ' sn' + (st.perSide ? ' / taraf' : '');
    var r = String(st.reps || ''), m = r.match(/^([\d–\-\s]+)(.*)$/);
    return m ? m[1].trim() + ' tekrar' + (m[2].trim() ? ' ' + m[2].trim() : '') : r;
  }
  function lastInfo(st) {
    var h = history[st.slug]; if (!h || !h.sets.length) return null;
    var sets = h.sets, reps = sets.map(function (x) { return +x.reps || 0; });
    var kgs = sets.map(function (x) { return +x.kg || 0; }), kg = Math.max.apply(null, kgs);
    var same = reps.every(function (r) { return r === reps[0]; });
    var txt = (same ? sets.length + '×' + reps[0] : reps.join(' / ')) + (st.holdSec ? ' sn' : '') + (kg ? ' @ ' + kg + ' kg' : '');
    var hi = repHi(st), good = sets.every(function (x) { return x.form !== false; });
    var up = !!kg && !st.holdSec && hi > 0 && sets.length >= (st.sets || 1) && reps.every(function (r) { return r >= hi; }) && good;
    var upBw = !kg && !st.holdSec && hi > 0 && sets.length >= (st.sets || 1) && reps.every(function (r) { return r >= hi; }) && good;
    return { txt: txt, up: up || upBw, kg: kg, date: h.date };
  }
  function records() {
    var out = [], s = S();
    steps().forEach(function (st) {
      if (st.type !== 'exercise') return;
      var e = s.ex[st.id]; if (!e) return;
      e.work.forEach(function (w, i) {
        if (!w.done) return;
        var r = { date: ROOT.date, session: ROOT.session, block: st.block || block(), exercise: st.slug, set: i + 1,
          kg: w.kg === '' ? null : +w.kg, reps: w.reps === '' ? null : +w.reps, form: e.form !== false };
        if (st.perSide) r.perSide = true;
        out.push(r);
      });
    });
    return out;
  }
  function saveLog() {
    var recs = records(), el = $('saveBtn');
    if (!recs.length) { logMsg = 'Kaydedilecek tamamlanmış set yok.'; renderMsg('err'); return Promise.resolve(); }
    if (!window.fluid) { logMsg = 'Kayıt şu an kullanılamıyor.'; renderMsg('err'); return Promise.resolve(); }
    el.disabled = true;
    return window.fluid.readFile(LOG).catch(function () { return ''; }).then(function (old) {
      var keep = String(old || '').split('\n').filter(function (l) {
        l = l.trim(); if (!l) return false;
        try { var r = JSON.parse(l); return !(r.date === ROOT.date && r.session === ROOT.session); } catch (e) { return true; }
      });
      var text = keep.concat(recs.map(function (r) { return JSON.stringify(r); })).join('\n') + '\n';
      return window.fluid.writeFile(LOG, text);
    }).then(function () {
      S().saved = Date.now(); save(); logMsg = recs.length + ' set kaydedildi.'; renderMsg('ok');
      return loadLog().then(function () {});
    }, function (e) { logMsg = 'Kaydedilemedi: ' + (e && e.message || e); renderMsg('err'); })
      .then(function () { el.disabled = false; });
  }
  function renderMsg(cls) { var m = $('msg'); if (m) { m.textContent = logMsg; m.className = 'msg ' + (cls || ''); } }

  /* ---------- navigation ---------- */
  var cardKey = '';
  function go(i) {
    var n = steps().length, s = S();
    i = Math.max(0, Math.min(n, i));
    if (i === s.step) return;
    touch();
    s.step = i; s.hold = null; s.rest = null; save(); render();
    if (i >= n) finish();
  }
  function finish() { var s = S(); if (!s.t1) { s.t1 = Date.now(); save(); } saveLog(); }
  function setSession(k) {
    if (k === ROOT.session) return;
    ROOT.session = k; ROOT.last = k; save(); cardKey = ''; render();
  }

  /* ---------- actions ---------- */
  function listIdx(st) { return S().list[st.id] || 0; }
  function nextListItem(st) {
    var s = S(), i = listIdx(st);
    s.hold = null;
    if (i + 1 >= st.items.length) { go(s.step + 1); return; }
    s.list[st.id] = i + 1; save(); render();
  }
  function prevListItem(st) { var s = S(), i = listIdx(st); s.hold = null; s.list[st.id] = i - 1; save(); render(); }
  function cardioState(st) {
    var s = S();
    if (!s.cardio[st.id]) s.cardio[st.id] = { min: st.lo || st.min, total: 0, endAt: 0, left: 0, running: false, beeped: false };
    return s.cardio[st.id];
  }
  function cardioLeft(c) { return c.running ? (c.endAt - Date.now()) / 1000 : (c.total ? c.left / 1000 : c.min * 60); }
  function cardioToggle(st) {
    var c = cardioState(st); touch();
    if (c.running) { c.left = c.endAt - Date.now(); c.running = false; }
    else {
      if (!c.total) { c.total = c.min * 60000; c.left = c.total; c.beeped = false; }
      c.endAt = Date.now() + c.left; c.running = true;
    }
    save(); render();
  }
  function cardioAdj(st, d) {
    var c = cardioState(st);
    if (c.total || c.running) {
      var add = d * 60000;
      if (c.running) c.endAt += add; else c.left += add;
      c.min = Math.max(1, c.min + d);
    } else c.min = Math.max(1, Math.min(60, c.min + d));
    save(); render();
  }
  function cardioReset(st) { var c = cardioState(st); c.total = 0; c.running = false; c.beeped = false; save(); render(); }

  function holdStart(st, sec) {
    var s = S(); touch();
    if (s.hold) { s.hold = null; } else { s.hold = { start: Date.now(), sec: sec, beeped: false }; }
    save(); render();
  }
  function nextWork(e) { for (var i = 0; i < e.work.length; i++) if (!e.work[i].done) return i; return -1; }
  function setDone(st, i, noRest) {
    var e = exState(st), w = e.work[i], s = S(); touch();
    if (w.done) { w.done = 0; if (w.sides) w.sides = [0, 0]; save(); renderCtl(); return; }
    if (st.perSide && !w.sides[0]) { w.sides[0] = 1; s.rest = null; save(); renderCtl(); return; }
    if (w.sides) w.sides = [1, 1];
    w.done = 1;
    if (w.kg === '' && i > 0 && e.work[i - 1].kg !== '') w.kg = e.work[i - 1].kg;
    if (w.reps === '') { var m = String(st.reps || '').match(/(\d+)\D*$/); if (m && !st.holdSec) w.reps = ''; }
    if (!noRest && nextWork(e) >= 0 && st.restSec) s.rest = { start: Date.now(), lo: st.restSec[0], hi: st.restSec[1], beeped: 0 };
    else s.rest = null;
    save(); renderCtl();
  }
  function primary() {
    var st = cur(), s = S(); unlock();
    if (!st) return;
    if (st.type === 'cardio') cardioToggle(st);
    else if (st.type === 'list') {
      var it = st.items[listIdx(st)];
      if (it.holdSec) holdStart(st, it.holdSec); else nextListItem(st);
    } else {
      var e = exState(st), i = nextWork(e);
      if (i >= 0) { syncInputs(); setDone(st, i); }
      else go(s.step + 1);
    }
  }
  function syncInputs() {
    var st = cur(); if (!st || st.type !== 'exercise') return;
    var e = exState(st);
    document.querySelectorAll('input[data-f]').forEach(function (el) {
      var i = +el.dataset.i; if (e.work[i]) e.work[i][el.dataset.f] = el.value;
    });
  }

  /* ---------- render ---------- */
  function renderTop() {
    var ss = ROOT.session, ks = Object.keys(SESS);
    document.body.dataset.session = ss;
    $('stabs').innerHTML = ks.map(function (k) {
      return '<button type="button" data-ses="' + k + '" aria-pressed="' + (k === ss) + '">' + esc((META[k] && META[k].label) || k) + '</button>';
    }).join('');
    var s = S(), st = steps();
    $('prog').innerHTML = st.map(function (x, i) {
      return '<button type="button" data-go="' + i + '" class="' + (i < s.step ? 'done' : i === s.step ? 'cur' : '') + '" title="' + esc(x.name) + '" aria-label="' + esc((i + 1) + '. ' + x.name) + '"></button>';
    }).join('');
    var c = cur();
    $('stepTitle').textContent = c ? c.name : 'Seans bitti';
    $('stepCount').textContent = c ? (s.step + 1) + ' / ' + st.length : '';
    $('backBtn').disabled = s.step === 0;
    var last = s.step >= st.length - 1;
    $('nextBtn').textContent = !c ? 'Bitti' : last ? 'Seansı bitir ✓' : 'İleri →';
    $('nextBtn').disabled = !c;
  }

  function SZ() { return window.innerWidth < 720 ? 'm' : 'l'; }
  function cardHtml(st) {
    if (st.type === 'cardio') {
      return '<fl-exercise slug="' + esc(st.slug || 'bike') + '" compact media="photo,anim" size="' + SZ() + '" dose="' + esc(st.detail || '') + '"></fl-exercise>';
    }
    if (st.type === 'list') {
      var it = st.items[listIdx(st)];
      return '<fl-exercise slug="' + esc(it.slug) + '" compact media="photo,anim" size="' + SZ() + '" dose="' + esc(it.dose || '') + '" index="' + (listIdx(st) + 1) + '"></fl-exercise>';
    }
    return '<fl-exercise slug="' + esc(st.slug) + '" compact media="photo,anim" size="' + SZ() + '"></fl-exercise>';
  }

  function cuesHtml(slug) {
    var e = EX[slug]; if (!e || !((e.cues || []).length || e.avoid)) return '';
    return '<details class="cues"><summary>Püf noktaları</summary><ul>' +
      (e.cues || []).map(function (c) { return '<li><b>Doğru:</b> ' + esc(c) + '</li>'; }).join('') +
      (e.avoid ? '<li><b>Kaçın:</b> ' + esc(e.avoid) + '</li>' : '') + '</ul></details>';
  }

  function ctlHtml(st) {
    var s = S();
    if (!st) {
      var n = records().length;
      return '<div class="done"><h2>Seans bitti 🎉</h2><div>' + n + ' set tamamladın. Toplam süre ' + mmss(((s.t1 || Date.now()) - (s.t0 || Date.now())) / 1000) + '.</div>' +
        '<p><button class="btn" data-act="save" type="button">Kaydet</button></p><div class="msg" id="msg">' + esc(logMsg) + '</div></div>';
    }
    if (st.type === 'cardio') {
      var c = cardioState(st), left = cardioLeft(c), started = c.total > 0;
      return '<div class="timer"><div class="tv' + (left < 0 ? ' over' : '') + '" id="cardioT">' + (left < 0 ? '+' : '') + mmss(Math.abs(left)) + '</div>' +
        '<div class="tl" id="cardioL">' + (left < 0 ? 'Süre doldu, bırakabilirsin' : started ? (c.running ? 'Sürüyor' : 'Duraklatıldı') : 'Hedef ' + (st.lo || st.min) + '–' + st.hi + ' dk') + '</div>' +
        '<div class="adj"><button class="btn" data-act="cm" type="button" aria-label="1 dk azalt">−1</button><span>' + c.min + ' dk</span><button class="btn" data-act="cp" type="button" aria-label="1 dk artır">+1</button></div></div>' +
        '<button class="big" data-act="primary" type="button">' + (c.running ? '❚❚ Duraklat' : started ? '▶ Devam' : '▶ Başlat') + '</button>' +
        (started ? '<button class="btn" data-act="cr" type="button">Sıfırla</button>' : '');
    }
    if (st.type === 'list') {
      var i = listIdx(st), it = st.items[i], h = s.hold, out = '';
      out += '<div class="listn">' + (i + 1) + ' / ' + st.items.length + ' hareket</div>';
      if (it.holdSec) {
        var el = h ? (Date.now() - h.start) / 1000 : 0, rem = h ? Math.max(0, h.sec - el) : it.holdSec;
        out += '<div class="timer"><div class="tv" id="holdT">' + Math.ceil(rem) + '</div><div class="tl">saniye' + (/taraf/.test(it.dose || '') ? ' · her taraf için tekrarla' : '') + '</div></div>' +
          '<button class="big" data-act="primary" type="button">' + (h ? '❚❚ Durdur' : '▶ ' + it.holdSec + ' sn başlat') + '</button>';
      } else {
        out += '<div class="target"><div class="t1">' + esc(it.dose || '') + '</div><div class="t3">Yavaş ve kontrollü yap.</div></div>';
      }
      out += '<div style="display:flex;gap:10px">' + (i > 0 ? '<button class="btn" data-act="lprev" type="button" style="flex:1">← Önceki</button>' : '') +
        '<button class="' + (it.holdSec ? 'btn' : 'big') + '" data-act="lnext" type="button" style="flex:2">' + (i + 1 >= st.items.length ? 'Sonraki adım →' : 'Sonraki →') + '</button></div>';
      return out;
    }
    // exercise
    var e = exState(st), cur_ = nextWork(e), li = lastInfo(st), out2 = '';
    var amount = amountTxt(st);
    var ex = EX[st.slug] || {};
    out2 += '<div class="target"><div class="t1">' + st.sets + ' set × ' + esc(amount) + '</div>' +
      (ex.rir ? '<div class="t2">' + esc(ex.rir) + '</div>' : '') +
      '<div class="t3">Dinlenme: ' + (st.restSec ? (st.restSec[0] === st.restSec[1] ? mmss(st.restSec[0]) : mmss(st.restSec[0]) + '–' + mmss(st.restSec[1])) + ' dk' : '—') + '</div>' +
      (li ? '<div class="last' + (li.up ? ' up' : '') + '">Geçen sefer: ' + esc(li.txt) + '</div>' + (li.up ? '<span class="hint">Ağırlığı artır ↑</span>' : '') :
        '<div class="last" style="color:var(--fl-muted,#6b7280);font-weight:500">Geçen sefer: kayıt yok</div>') + '</div>';
    if (cur_ >= 0) out2 += '<button class="big" data-act="primary" type="button">' + (st.perSide ? (e.work[cur_].sides[0] ? 'Sağ taraf bitti ✓' : 'Sol taraf bitti ✓') : 'Set bitti ✓') + '</button>' +
      (st.perSide ? '<div class="t3" style="font-size:14px;color:var(--fl-muted,#6b7280)">Önce sol, sonra sağ; dinlenme iki taraf bitince başlar.</div>' : '');
    else out2 += '<button class="big" data-act="primary" type="button">Sonraki hareket →</button>';
    out2 += '<div id="restBox"></div>';
    if (e.warm.length) {
      out2 += '<div><p class="sec">Isınma setleri</p><div class="chips">' + e.warm.map(function (d, k) {
        return '<button type="button" class="chip' + (d ? ' on' : '') + '" data-act="warm" data-i="' + k + '" aria-pressed="' + !!d + '">Isınma ' + (k + 1) + (d ? ' ✓' : '') + '</button>';
      }).join('') + '</div></div>';
    }
    out2 += '<div><p class="sec">Çalışma setleri</p><div class="sets">' + e.work.map(function (w, k) {
      var ph = li && li.sets ? '' : '';
      var hs = history[st.slug] && history[st.slug].sets[k];
      var lbl = 'Set ' + (k + 1) + (w.done ? ' ✓' : st.perSide && w.sides && w.sides[0] ? ' · sol ✓' : '');
      return '<div class="srow"><button type="button" class="sbtn' + (w.done ? ' on' : k === cur_ ? ' cur' : '') + '" data-act="setbtn" data-i="' + k + '">' + lbl + '</button>' +
        '<label class="fld">kg<input inputmode="decimal" data-f="kg" data-i="' + k + '" value="' + esc(w.kg) + '" placeholder="' + (hs && hs.kg != null ? hs.kg : '—') + '"></label>' +
        '<label class="fld">' + (st.holdSec ? 'saniye' : 'tekrar') + (st.perSide ? ' / taraf' : '') + '<input inputmode="numeric" data-f="reps" data-i="' + k + '" value="' + esc(w.reps) + '" placeholder="' + (hs && hs.reps != null ? hs.reps : '—') + '"></label></div>';
    }).join('') + '</div></div>';
    out2 += '<label class="form"><input type="checkbox" data-act="form"' + (e.form !== false ? ' checked' : '') + '> Formum iyiydi</label>';
    out2 += cuesHtml(st.slug);
    return out2;
  }

  function renderCtl() {
    var st = cur();
    $('ctl').innerHTML = ctlHtml(st) + (st ? '<div class="msg" id="msg">' + esc(logMsg) + '</div>' : '');
    tick();
  }
  function render() {
    renderTop();
    var st = cur(), key = ROOT.session + '|' + block() + '|' + S().step + '|' + (st && st.type === 'list' ? listIdx(st) : '');
    if (key !== cardKey) {
      cardKey = key;
      $('card').innerHTML = st ? cardHtml(st) : '';
      $('main').scrollTop = 0;
    }
    $('stage').className = 'stage' + (st ? ' two' : '');
    $('card').style.display = '';
    renderCtl();
  }

  /* ---------- timers ---------- */
  function tick() {
    var s = S(), now = Date.now(), c;
    $('clock').textContent = s.t0 ? mmss(((s.t1 || now) - s.t0) / 1000) : '0:00';
    var st = cur(); if (!st) return;
    if (st.type === 'cardio') {
      c = cardioState(st);
      var left = cardioLeft(c), t = $('cardioT');
      if (c.running && t) {
        t.textContent = (left < 0 ? '+' : '') + mmss(Math.abs(left)); t.className = 'tv' + (left < 0 ? ' over' : '');
        if (left < 0 && !c.beeped) { c.beeped = true; save(); beep(3); var l = $('cardioL'); if (l) l.textContent = 'Süre doldu, bırakabilirsin'; }
      }
    } else if (st.type === 'list' && s.hold) {
      var rem = s.hold.sec - (now - s.hold.start) / 1000, ht = $('holdT');
      if (rem <= 0) {
        beep(2); nextListItem(st);
      } else if (ht) ht.textContent = Math.ceil(rem);
    } else if (st.type === 'exercise' && s.rest) {
      var r = s.rest, el = (now - r.start) / 1000, box = $('restBox'); if (!box) return;
      var cls, label, val;
      if (el < r.lo) { cls = 'rest'; label = 'Dinlen'; val = mmss(Math.ceil(r.lo - el)); }
      else if (el < r.hi) { cls = 'rest over'; label = 'Hazırsan başla (en geç ' + mmss(r.hi) + ')'; val = '+' + mmss(el - r.lo); }
      else { cls = 'rest ready'; label = 'Dinlenme bitti, sıradaki sete!'; val = '+' + mmss(el - r.lo); }
      if (el >= r.lo && !r.beeped) { r.beeped = 1; save(); beep(2); }
      if (el >= r.hi && r.beeped < 2) { r.beeped = 2; save(); beep(1); }
      var html = '<div class="' + cls + '"><div class="rl">' + label + '</div><div class="rt">' + val + '</div><button class="rs" data-act="skip" type="button">Dinlenmeyi atla</button></div>';
      if (box.dataset.h !== cls + label) { box.dataset.h = cls + label; box.innerHTML = html; }
      else { box.querySelector('.rt').textContent = val; }
    }
    if (st.type === 'exercise' && !s.rest) { var b = $('restBox'); if (b && b.innerHTML) { b.innerHTML = ''; b.dataset.h = ''; } }
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-ses],[data-go],[data-act]'); if (!t) return;
    unlock();
    var st = cur(), s = S();
    if (t.dataset.ses) return setSession(t.dataset.ses);
    if (t.dataset.go != null) return go(+t.dataset.go);
    var a = t.dataset.act, i = +t.dataset.i;
    if (a === 'primary') primary();
    else if (a === 'save') saveLog();
    else if (a === 'lnext') nextListItem(st);
    else if (a === 'lprev') prevListItem(st);
    else if (a === 'cm') cardioAdj(st, -1);
    else if (a === 'cp') cardioAdj(st, 1);
    else if (a === 'cr') cardioReset(st);
    else if (a === 'skip') { s.rest = null; save(); tick(); }
    else if (a === 'warm') { touch(); var e = exState(st); e.warm[i] = e.warm[i] ? 0 : 1; save(); renderCtl(); }
    else if (a === 'setbtn') { syncInputs(); setDone(st, i); }
    else if (a === 'form') { exState(st).form = t.checked; save(); }
  });
  document.addEventListener('input', function (ev) {
    var el = ev.target; if (!el.dataset || !el.dataset.f) return;
    var st = cur(), e = exState(st); e.work[+el.dataset.i][el.dataset.f] = el.value; touch(); save();
  });
  $('backBtn').addEventListener('click', function () {
    var st = cur(), s = S(); unlock();
    if (st && st.type === 'list' && listIdx(st) > 0) { prevListItem(st); return; }
    go(s.step - 1);
    var p = cur(); if (p && p.type === 'list' && s.step < steps().length) { /* keep position */ }
  });
  $('nextBtn').addEventListener('click', function () {
    var st = cur(), s = S(); unlock();
    if (st && st.type === 'exercise') syncInputs();
    if (st && st.type === 'list' && listIdx(st) + 1 < st.items.length) { nextListItem(st); return; }
    go(s.step + 1);
  });
  $('saveBtn').addEventListener('click', function () { unlock(); syncInputs(); saveLog(); });
  document.addEventListener('keydown', function (ev) {
    var tg = ev.target && ev.target.tagName;
    if (tg === 'INPUT' || tg === 'TEXTAREA' || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (ev.key === ' ' || ev.code === 'Space') { ev.preventDefault(); primary(); }
    else if (ev.key === 'ArrowRight') { ev.preventDefault(); $('nextBtn').click(); }
    else if (ev.key === 'ArrowLeft') { ev.preventDefault(); $('backBtn').click(); }
  });
  document.addEventListener('visibilitychange', tick);

  /* ---------- start ---------- */
  load(); ROOT.last = ROOT.session; save();
  render();
  if (window.FIT_onBlockChange) FIT_onBlockChange(function () { S().rest = null; render(); });
  setInterval(tick, 500);
  loadLog().then(function () { if (cur() && cur().type === 'exercise') renderCtl(); });
})();
</script>
</body>
</html>

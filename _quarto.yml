project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
    - "**/*.ipynb"
    - "!workspace/**"
  resources:
    - CNAME
    - fonts/**
    - papers/**
    - slides/**

website:
  title: "Barış Deniz Sağlam"
  site-url: https://barisdeniz.is-a.dev
  search: false
  navbar:
    title: false
    collapse: false
    pinned: false
    background: light
    left:
      - text: Home
        href: index.html
      - text: Writing
        href: writing.html
      - text: Projects
        href: projects.html
      - text: CV
        href: cv.html
  page-footer:
    center: "[privacy](/privacy.html) · [cookie preferences](#cookie-preferences)"

format:
  html:
    theme: theme.scss
    include-in-header: _consent.html
    toc: false
    grid:
      body-width: 720px
    anchor-sections: false
    highlight-style: github

execute:
  freeze: auto

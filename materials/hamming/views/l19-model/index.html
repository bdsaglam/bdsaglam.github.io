nt-size:20px}.lab a{color:var(--pal-accent)}.source{font-size:15px} </style></head><body><main><header><h1>After Lecture 19: when totals reverse the comparison</h1><span id="tag" class="tag"></span></header><section class="body"><div id="lab" class="lab"></div><article class="lesson"><h2 id="title"></h2><p id="question" class="question"></p><div id="defs" class="defs"></div><div id="formula" class="formula"></div><ol id="tries"></ol><div id="take" class="take"></div></article></section><footer><button id="prev">← Previous</button><span class="pages" id="pages"></span><span class="source">Hamming · Lecture 19 · manual study</span><button id="next">Next →</button></footer></main><script>
const slides=[{"id": "mix", "title": "Win in each group, lose overall", "time": "After \u00b7 13:31\u201315:36", "q": "Can a total reverse both comparisons inside it?", "kind": "mix", "defs": "Invented benchmark, not historical admissions data. Model A succeeds on 90% of easy tasks and 30% of hard tasks. Model B scores 80% and 20%.", "formula": "", "tries": ["Start with A assigned 20 easy tasks out of 100.", "Increase A\u2019s easy-task count; B keeps 80 easy tasks. Watch the total reverse."], "take": "A total combines ability and task mix. The within-group advantage alone does not fix the total."}, {"id": "mix-table", "title": "Count successes before combining rates", "time": "After \u00b7 13:31\u201315:36", "q": "Where does the apparent contradiction come from?", "kind": "table", "defs": "Each model gets 100 tasks, but their task difficulty differs. Counts are invented for an exact example.", "formula": "", "tries": ["Compare A with B in each row.", "Add successes, then compare totals."], "take": "The totals answer performance on two different task distributions.", "headers": ["Task group", "A: successes / tasks", "B: successes / tasks"], "rows": [["Easy", "$18 / 20 = 90\\%$", "$64 / 80 = 80\\%$"], ["Hard", "$24 / 80 = 30\\%$", "$4 / 20 = 20\\%$"], ["Total", "$42 / 100 = 42\\%$", "$68 / 100 = 68\\%$"]]}, {"id": "weighted", "title": "A total is a weighted average", "time": "After \u00b7 15:05\u201315:36", "q": "How does task mix enter the reported score?", "kind": "proof", "defs": "$w$: fraction of easy tasks for A. $R_A$: A\u2019s total success rate. Its group rates are 0.9 and 0.3.", "formula": "$R_A=0.9w+0.3(1-w)$", "tries": ["Guess why the hard fraction is one minus the easy fraction.", "Reveal the count-based derivation."], "take": "Weights describe who or what entered the data. They are part of the claim.", "rows": [["0.9(100w)=90w", "Count A’s successes on the easy tasks"], ["0.3(100(1-w))=30(1-w)", "Count A’s successes on the remaining hard tasks"], ["R_A=[ umes the task mix is irrelevant.", "A changed mix can lower the total even when each group improves."], ["Inspect group scores and compare a common mix", "Assumes measured groups capture a relevant source of difficulty.", "This tests the mix explanation and makes the comparison explicit."], ["Discard all aggregate metrics", "Assumes totals can never answer a useful question.", "A total is useful when its target population and weights are stated."]], "answer": 1}];let page=0,revealed=0,picked=-1;let values={fraction:.5,mix:20,shared:50,a:100,b:0,bug:false,drivers:20,reacted:false};const $=x=>document.getElementById(x);const math=()=>{if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})};

ntrols"></div>';draw()}math()}
function bars(rows,max){$('visual').innerHTML=rows.map((r,i)=>`<div class="barrow"><div class="barlabel"><span>${r[0]}</span><span>${r[1].toFixed(1)}${r[2]||''}</span></div><div class="track"><div class="bar ${i%2?'alt':''}" style="width:${Math.max(0,Math.min(100,100*r[1]/max))}%"></div></div></div>`).join('')}

if(k==='mix'){let w=values.mix/100;bars([['A on easy tasks',90,'%'],['B on easy tasks',80,'%'],['A on hard tasks',30,'%'],['B on hard tasks',20,'%'],['A total on its mix',30+60*w,'%'],['B total: 80 easy tasks',68,'%']],100);slider('mix',0,100,1,'A easy-task count');$('readout').textContent=`A gets ${values.mix} easy and ${100-values.mix} hard tasks; B gets 80 easy and 20 hard.`}

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>The physicist's counts</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../../components/theme.js"></script>
<style>
/* Colors come from the theme palette (../../components/theme.js): grey for exact values and inputs, blue for
   outputs and the reader's choice, amber only for proof lights, red only for a failed check. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft);
  --red:var(--pal-red); --redbg:var(--pal-red-bg);
  --tint:var(--pal-soft-hover); --rim:var(--pal-soft-3);
  --u:clamp(16px,1.35vw,20px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 24px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(6px,1vh,12px) 24px;overflow:hidden}
footer{display:flex;align-items:center;gap:10px;padding:8px 24px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Slide frame: widget on the left (3/5), text on the right (2/5). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(18px,2.4vw,40px)}
.widget{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(6px,1vh,10px);overflow:hidden}
.widget>*{max-width:100%;min-width:0}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(6px,1.1vh,12px);overflow:hidden}
.tag{font:13px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(20px,1.9vw,28px);line-height:1.2;margin:0;font-weight:650}
.question{margin:0;font-size:clamp(16px,1.3vw,18px);font-weight:600}
.case{margin:0;font-size:16px}
.formula{font-size:clamp(18px,1.7vw,24px)}
.formula .katex-display{margin:.2em 0}
.sym{margin:0;font-size:16px;color:var(--muted)}
.tries{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.tries li::marker{color:var(--accent);font-weight:600}
.takeaway{margin:0;padding:10px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}
.echo{margin:0;font-size:16px;line-height:1.35}
.echo .src{color:var(--muted);font-size:14px}
.kicker{font-size:14px;color:var(--muted);margin:0 0 2px}
.blk{display:flex;flex-direction:column;gap:2px}

/* Controls, readouts, legend */
.sliders{display:flex;gap:8px 20px;flex-wrap:wrap;width:100%;align-items:center}
.btnrow{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center}
.btnrow .lab{font-size:16px;color:var(--muted);margin-right:2px}
.slide-ctl{display:flex;align-items:center;gap:8px;font-size:16px;flex-wrap:wrap}
.slide-ctl input{width:clamp(120px,12vw,190px);vertical-align:middle;accent-color:var(--accent)}
.slide-ctl .val{min-width:44px}
.btn{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--pal-panel);color:var(--fg);border-radius:8px;cursor:pointer;font-size:16px;line-height:1.3}
.btn.on{background:var(--chip);border-color:var(--accent);color:var(--pal-accent-deep)}
.btn:disabled{opacity:.4;cursor:default}
.readouts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.readout{flex:1 1 150px;min-width:0;padding:4px 10px;border-radius:10px;background:var(--pal-soft);font-size:16px;overflow-wrap:anywhere;overflow:hidden}
.readout .k{color:var(--pal-text-2);font-size:15px}
.readout .val{font-size:17px;font-weight:600;line-height:1.55}
.readouts.inline{flex:1 1 280px;width:auto}
.readouts.inline .readout{display:flex;gap:2px 8px;align-items:baseline;flex-wrap:wrap;flex:1 1 140px}
.readout.bad{background:var(--redbg);color:var(--red)}
.readout.bad .k{color:var(--red)}
.legend{display:flex;gap:4px 16px;flex-wrap:wrap;font-size:16px;color:var(--pal-text-2);align-items:center;padding-bottom:6px}
.sw{display:inline-block;width:22px;height:0;vertical-align:middle;margin-right:6px}
.chip{display:inline-block;width:16px;height:12px;vertical-align:middle;margin-right:6px;border-radius:2px}
.ldot{display:inline-block;width:7px;height:7px;border-radius:50%;vertical-align:middle;margin:0 8px 0 4px}
.ltri{display:inline-block;width:0;height:0;vertical-align:middle;margin:0 7px 0 3px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid var(--accent)}
.ltick{display:inline-block;width:3px;height:14px;vertical-align:middle;margin:0 8px 0 4px}

/* Plots fill the height left in the widget column */
.fill{flex:1 1 0;min-height:90px;position:relative;width:100%}
.fill>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.takeholder{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.takeholder .takeaway{align-self:stretch}

/* Proof slides: test and picture on the left, the proof (fl-proof-steps) on the right */
.slide.proof-slide,.slide.wide{grid-template-columns:minmax(0,11fr) minmax(0,9fr)}
.slide.side-proof{grid-template-columns:minmax(0,9fr) minmax(0,11fr)}
.slide.proof-slide .side,.slide.side-proof .side{justify-content:flex-start}
.fill.proofpic{min-height:150px}
.slide.proof-slide .slide-ctl input{width:clamp(90px,9vw,140px)}
.part{margin:0;font-weight:600;color:var(--muted)}
.test{display:flex;flex-direction:column;gap:3px;font-size:16px}
.test .tries{gap:3px}
.model{margin:0;padding:8px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}

/* Decision slides: the problem and its sketch, three cards and the reveal on the left; question, formula,
   try-steps, AI echo and takeaway on the right. */
.slide.decision{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:clamp(20px,2.6vw,40px)}
.decision .widget{gap:6px}
.decision .side{justify-content:space-evenly;gap:clamp(8px,1.6vh,16px)}
.decision h2{font-size:clamp(20px,1.85vw,27px)}
.decision .q{margin:0;font-size:clamp(17px,1.45vw,20px);font-weight:600;line-height:1.35}
.decision .fx{margin:0;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--tint);font-size:clamp(17px,1.5vw,21px);line-height:1.4}
.decision .ai{margin:0;font-size:16px;line-height:1.4}
.decision .ai .src{color:var(--muted);font-size:14px}
.decision .takeaway{padding:10px 14px;line-height:1.4}
.decision .tries{gap:5px;font-size:16px;line-height:1.4}
.decision .hold{color:var(--muted);font-style:italic;background:var(--tint);border:1px dashed var(--line);border-radius:6px;padding:8px 12px;margin:0;font-size:16px;line-height:1.4}
.prob{flex:0 0 auto;border:1px solid var(--line);border-radius:10px;padding:6px 14px;background:var(--tint);font-size:16px;line-height:1.4}
.prob.has-sketch{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:4px 14px;align-items:center}
.prob .lead{font-weight:650;color:var(--muted)}
.prob p{margin:0}
.prob .sketch{position:relative;height:clamp(104px,18vh,136px);min-width:0}
.prob .sketch .fill{position:absolute;inset:0;min-height:0}
.opts{flex:0 0 auto;display:flex;flex-direction:column;gap:clamp(4px,0.5vw,7px)}
.opt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:0 14px;padding:clamp(5px,0.6vw,9px) 12px;border:1px solid var(--line);border-radius:10px;background:var(--pal-panel);color:inherit;text-align:left;cursor:pointer;min-width:0;font:inherit}
.opt .lhs{display:flex;flex-direction:column;gap:2px;min-width:0}
.opt .rhs{display:flex;flex-direction:column;gap:3px;min-width:0;border-left:1px solid var(--pal-soft-2);padding-left:14px}
.opt:not([aria-disabled="true"]):hover{border-color:var(--accent)}
.opt[aria-disabled="true"]{cursor:default}
.opt .top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:16px}
.opt .letter{font-weight:700;color:var(--accent)}
.opt .who{font-size:14px;color:var(--muted);text-align:right}
.opt .body{font-size:clamp(16px,1.3vw,18px);line-height:1.3}
.opt .asm{margin:0;font-size:16px;line-height:1.3;color:var(--muted)}
.opt .verdict{font-size:16px;line-height:1.3;color:var(--fg)}
.opt .verdict.idle{color:var(--muted);font-style:italic}
.opt.on{box-shadow:inset 0 0 0 2px var(--pal-ink)}
.opt.chooser{background:var(--chip);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.opt.chooser .who{color:var(--pal-accent-deep);font-weight:600}
.opt.chooser .letter{color:var(--pal-accent-deep)}
.reveal{flex:1 1 auto;min-height:0;border:1px solid var(--line);border-radius:10px;padding:6px 14px;font-size:16px;display:flex;flex-direction:column;justify-content:center;gap:5px}
.reveal.idle{background:var(--tint);color:var(--muted)}
.rv{margin:0;line-height:1.35}
.rv .k{font-weight:650;color:var(--pal-accent-deep)}
.rv .t{color:var(--muted);font-size:14px;white-space:nowrap}
.rv.hold{color:var(--muted)}
.decision .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px}
.decision .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--pal-on-accent);padding:6px 16px}

/* Short windows (1100x620 and similar): tighter spacing, body text stays 16px */
@media (max-height: 680px){
  header{padding-top:4px}
  #stage{padding:4px 24px}
  footer{padding:4px 24px}
  .widget{gap:5px}
  .side{gap:4px}
  .tries{gap:2px}
  .sym,.tries,.takeaway,.case,.echo,.test,.model{line-height:1.25}
  .takeaway{padding:6px 10px}
  .formula{font-size:19px}
  h2{font-size:20px}
  .question{font-size:16px}
  .fill{min-height:80px}
  .readout{padding:2px 8px}
  .readout .val{line-height:1.45}
  .fill.proofpic{min-height:130px}
  .model{padding:5px 10px}
  .test .tries{gap:1px}
  .btn{padding:3px 10px}
  .decision h2{font-size:20px}
  .decision .side{gap:4px}
  .decision .tries{gap:2px;line-height:1.3}
  .decision .takeaway{padding:6px 12px}
  .decision .fx{padding:5px 12px}
  .decision .hold{padding:5px 10px}
  .reveal{gap:2px;padding:4px 12px}
  .rv{line-height:1.25}
  .opts{gap:3px}
  .opt{padding:3px 12px}
  .opt .body,.opt .asm,.opt .verdict{line-height:1.22}
  .prob{padding:3px 12px;line-height:1.28}
  .prob .sketch{height:96px}
}
</style>
</head>
<body>
<header>Lecture 17 · The physicist's counts</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script src="../../components/proof-steps.js"></script>
<script>
// Numbers on these slides come from lectures/17-digital-filters-part-iv/checks.py and were re-run with node
// (workspace/l17-materials-2026-10-24/l17-counts-steps/numbers.mjs). Noise: mulberry32, seeds noted below.

// ---------- palette and redraw ----------
let COL = {};
const PAL_NAMES = ['bg', 'ink', 'fg', 'text-2', 'muted', 'muted-2', 'grey', 'guide', 'grid', 'line', 'panel', 'soft', 'soft-2',
  'accent', 'accent-2', 'accent-3', 'accent-deep', 'accent-tint', 'accent-soft', 'on-accent', 'grey-bar', 'slate-2',
  'amber', 'amber-bg', 'amber-ink', 'red'];
function readPalette() {
  const o = {};
  for (const n of PAL_NAMES) o[n.replace(/-(\w)/g, (_, c) => c.toUpperCase())] = FluidTheme.color(n);
  return o;
}
let PLOTS = [];
window.addEventListener('fluid-themechange', () => PLOTS.forEach(p => p.redraw()));

// ---------- DOM helpers ----------
const $ = s => document.querySelector(s);
const NSV = 'http://www.w3.org/2000/svg', NHT = 'http://www.w3.org/1999/xhtml';
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false }], throwOnError: false };
function tex(node) { if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH); return node; }
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function hh(tag, cls, ...kids) { const e = h(tag, cls); for (const k of kids) if (k) e.append(k); return e; }
function mark(e, kind, id, title) { e.dataset.item = kind; if (id != null) e.dataset.id = id; if (title != null) e.dataset.title = title; return e; }
function emit(kind, data) {
  try { if (window.fluid && typeof window.fluid.emit === 'function') Promise.resolve(window.fluid.emit(kind, data)).catch(() => {}); }
  catch (e) { /* the view works without the bridge */ }
}
function fx(x, d) { const y = Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x; return y.toFixed(d); }
function sn(x, d) { return String(+fx(x, d == null ? 3 : d)); }

// ---------- controls ----------
// A labelled range input. o: {id, min, max, step, value, fmt(v) -> TeX-ready text, onInput(v)}.
function ctl(label, o) {
  const wrap = h('label', 'slide-ctl');
  const lab = setTex(h('span'), label);
  const inp = h('input');
  inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step; inp.value = o.value;
  mark(inp, 'control', o.id, o.id);
  const val = h('span', 'val');
  const show = v => setTex(val, o.fmt(v));
  inp.addEventListener('input', () => { show(+inp.value); o.onInput(+inp.value); });
  show(o.value);
  wrap.append(lab, inp, val);
  return { el: wrap, input: inp, set(v) { inp.value = v; show(v); } };
}
// A row of buttons that pick one choice. choices: [[id, label], ...]; getCur() gives the current id.
function choiceRow(label, choices, getCur, onPick) {
  const row = hh('div', 'btnrow', label ? setTex(h('span', 'lab'), label) : null);
  const btns = choices.map(([id, text]) => {
    const b = mark(h('button', 'btn'), 'control', id);
    setTex(b, text);
    b.addEventListener('click', () => { onPick(id); paint(); });
    row.append(b);
    return [id, b];
  });
  function paint() { btns.forEach(([id, b]) => b.classList.toggle('on', id === getCur())); }
  paint();
  return { el: row, paint };
}
function button(id, label, onClick) {
  const b = mark(h('button', 'btn'), 'control', id);
  setTex(b, label);
  b.addEventListener('click', onClick);
  return b;
}
function readout(id, label) {
  const box = mark(h('div', 'readout'), 'readout', id);
  const k = setTex(h('div', 'k'), label);
  const v = h('div', 'val');
  box.append(k, v);
  return { el: box, set(text, bad) { setTex(v, text); box.classList.toggle('bad', !!bad); }, label(t) { setTex(k, t); } };
}
// Legend: items {color (CSS), text, kind: 'line' | 'dash' | 'chip' | 'dot' | 'tri' | 'tick'}.
function legend(items) {
  const d = h('div', 'legend');
  for (const it of items) {
    const s = h('span');
    let sw;
    if (it.kind === 'chip') { sw = h('span', 'chip'); sw.style.background = it.color; }
    else if (it.kind === 'dot') { sw = h('span', 'ldot'); sw.style.background = it.color; }
    else if (it.kind === 'tri') { sw = h('span', 'ltri'); sw.style.borderTopColor = it.color; }
    else if (it.kind === 'tick') { sw = h('span', 'ltick'); sw.style.background = it.color; }
    else { sw = h('span', 'sw'); sw.style.borderTop = '3px ' + (it.kind === 'dash' ? 'dashed' : 'solid') + ' ' + it.color; }
    s.append(sw, setTex(h('span'), it.text));
    d.append(s);
  }
  return d;
}
function sym(text) { return setTex(h('p', 'sym'), text); }
function caseLine(text) { return setTex(h('p', 'case'), text); }
function triesList(items) { return hh('ol', 'tries', ...items.map(t => setTex(h('li'), t))); }
// The takeaway appears after the first try: on the first click, drag or slider move in the widget, or on "Show".
function takeBox(widget, text) {
  const holder = h('div', 'takeholder');
  const btn = mark(h('button', 'btn'), 'control', 'show-takeaway');
  setTex(btn, 'Show the takeaway');
  const tk = setTex(h('p', 'takeaway'), text);
  tk.hidden = true;
  const show = () => { tk.hidden = false; btn.hidden = true; };
  btn.addEventListener('click', show);
  for (const ev of ['input', 'click', 'pointerdown']) widget.addEventListener(ev, show);
  holder.append(btn, tk);
  return holder;
}
// An AI echo under the takeaway: the mechanism in a few sentences, the source small.
function echoBlock(text, src) {
  const p = setTex(h('p', 'echo'), text);
  if (src) p.append(' ', h('span', 'src', '(' + src + ')'));
  return hh('div', 'blk', h('div', 'kicker', 'Same move in AI research'), p);
}
// The side column of a content slide, after the frame's tag, title, question and formula.
function sideStd(widget, side, o) {
  if (o.case) side.querySelector('.question').after(caseLine(o.case));
  if (o.sym) { const f = side.querySelector('.formula'); const s = sym(o.sym); if (f) f.before(s); else side.append(s); }
  if (o.tries) side.append(triesList(o.tries));
  if (o.take) side.append(takeBox(widget, o.take));
  if (o.echo) side.append(echoBlock(o.echo, o.src));
}

// ---------- SVG helpers ----------
function svgNode(tag, attrs, parent) {
  const e = document.createElementNS(NSV, tag);
  for (const k in attrs) if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function svgRoot(w, ht) { return svgNode('svg', { viewBox: '0 0 ' + w + ' ' + ht, role: 'img', 'font-family': 'system-ui, sans-serif', 'font-size': 14 }); }
function svgText(parent, x, y, s, attrs) {
  const t = svgNode('text', Object.assign({ x: x, y: y, fill: COL.muted, 'font-size': 14 }, attrs || {}), parent);
  t.textContent = s;
  return t;
}
// A KaTeX label inside an SVG: a foreignObject holding a rendered formula. o: {w, ht, anchor, size, fill, bg, bold}.
function svgTex(parent, x, y, s, o) {
  o = o || {};
  const w = o.w || 220, ht = o.ht || 26, anchor = o.anchor || 'middle';
  const x0 = anchor === 'end' ? x - w : anchor === 'start' ? x : x - w / 2;
  const fo = svgNode('foreignObject', { x: x0, y: y - ht / 2, width: w, height: ht }, parent);
  const d = document.createElementNS(NHT, 'div');
  const jc = anchor === 'end' ? 'flex-end' : anchor === 'start' ? 'flex-start' : 'center';
  d.setAttribute('style', 'display:flex;align-items:center;height:100%;white-space:nowrap;font-size:' +
    (o.size || 15) + 'px;color:' + (o.fill || COL.text2) + ';justify-content:' + jc + (o.bold ? ';font-weight:600' : ''));
  const span = document.createElementNS(NHT, 'span');
  span.textContent = s;
  if (o.bg) span.setAttribute('style', 'background:' + o.bg + ';border-radius:5px;padding:1px 6px');
  d.appendChild(span);
  fo.appendChild(d);
  tex(span);
  return fo;
}
// The same label with a halo in the page color, so it reads over a curve or bars.
function haloTex(parent, x, y, s, o) {
  const fo = svgTex(parent, x, y, s, o);
  fo.firstChild.style.textShadow = '0 0 3px ' + COL.bg + ', 0 0 3px ' + COL.bg + ', 0 0 2px ' + COL.bg;
  return fo;
}
function line(svg, x1, y1, x2, y2, o) { return svgNode('line', Object.assign({ x1, y1, x2, y2 }, o || {}), svg); }
function dot(svg, x, y, r, fill, o) { return svgNode('circle', Object.assign({ cx: x, cy: y, r, fill }, o || {}), svg); }
function rect(svg, x, y, w, ht, o) { return svgNode('rect', Object.assign({ x, y, width: Math.max(0, w), height: Math.max(0, ht) }, o || {}), svg); }
function glowRect(svg, x, y, w, ht, pad) {
  pad = pad == null ? 4 : pad;
  return rect(svg, x - pad, y - pad, w + 2 * pad, ht + 2 * pad, { rx: 6, fill: COL.amberBg, stroke: COL.amber, 'stroke-width': 1.5 });
}

// ---------- numbers: counts, the made-up record, spectra ----------
const PI = Math.PI, TAU = 2 * PI;
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;

}
// A Poisson count with mean mu (Knuth's product of uniforms, in pieces of at most 200 so exp(-mu) never underflows).
function poisson(rnd, mu) {
  let n = 0;
  while (mu > 0) {
    const m = Math.min(mu, 200); mu -= m;
    const L = Math.exp(-m); let p = 1;
    for (;;) { p *= rnd(); if (p <= L) break; n++; }
  }
  return n;
}
// The made-up record (Hamming gives no counts): 256 energy channels, three peaks on a broad hump.
// mu_k = 30 + 300 exp(-((k-128)/70)^2/2) + 150 sum over c in {70,125,185} of exp(-((k-c)/13)^2/2):
// 86.4 at channel 0, 479.7 at channel 125 (checks.py).
const NCH = 256, TRUE_PEAKS = [70, 125, 185];
const MU = Float64Array.from({ length: NCH }, (_, k) => {
  let m = 30 + 300 * Math.exp(-0.5 * ((k - 128) / 70) ** 2);
  for (const c of TRUE_PEAKS) m += 150 * Math.exp(-0.5 * ((k - c) / 13) ** 2);
  return m;
});
const MU_TOP = 125, MU_EDGE = 0;
// One run of the record: a Poisson count in every channel. Seed s gives the same run on every slide; steps 1, 5
// and 6 open on REC_SEED (peaks found at f_c = 0.0125, 0.025, 0.1, 0.2: 1, 3, 7, 33).
const REC_SEED = 5;
function recordRun(s) { const r = mulberry32(5000 + s); return Float64Array.from(MU, m => poisson(r, m)); }
const COSN = Float64Array.from({ length: NCH }, (_, j) => Math.cos(TAU * j / NCH));
const SINN = Float64Array.from({ length: NCH }, (_, j) => Math.sin(TAU * j / NCH));
// X_k = sum_n x_n e^{-i 2 pi k n / N} for k = 0..N/2.
function dftHalf(x) {
  const re = new Float64Array(NCH / 2 + 1), im = new Float64Array(NCH / 2 + 1);
  for (let k = 0; k <= NCH / 2; k++) {
    let a = 0, b = 0;
    for (let n = 0; n < NCH; n++) { const j = (k * n) % NCH; a += x[n] * COSN[j]; b -= x[n] * SINN[j]; }
    re[k] = a; im[k] = b;
  }
  return { re, im };
}
// Keep the waves with f <= fc (f = k/256 cycles per channel); with deriv, multiply each by i 2 pi f first.
// The same smoothing as checks.py (rfft, mask, irfft).
function lowpass(x, fc, deriv, X) {
  X = X || dftHalf(x);
  const y = new Float64Array(NCH);
  for (let k = 0; k <= NCH / 2; k++) {
    const f = k / NCH;
    if (f > fc + 1e-12) continue;
    let a = X.re[k], b = X.im[k];
    if (deriv) { const w = TAU * f; const a2 = -b * w; b = a * w; a = a2; }
    const wgt = (k === 0 || k === NCH / 2) ? 1 : 2;
    for (let n = 0; n < NCH; n++) { const j = (k * n) % NCH; y[n] += wgt * (a * COSN[j] - b * SINN[j]) / NCH; }
  }
  return y;
}
// Peaks: downward zero crossings of the smoothed slope, in channels 8 to 247 (as checks.py).
function findPeaks(d) { const out = []; for (let n = 8; n < 247; n++) if (d[n] > 0 && d[n + 1] <= 0) out.push(n); return out; }
function spreadOf(a) { const m = a.reduce((s, v) => s + v, 0) / a.length; return Math.sqrt(a.reduce((s, v) => s + (v - m) * (v - m), 0) / (a.length - 1)); }
// Exact spread of sqrt(n) for a Poisson count n with mean mu: sums over the probabilities.
function sqrtSpread(mu) {
  const top = Math.ceil(mu + 40 * Math.sqrt(mu) + 60);
  let lf = 0, m1 = 0, m2 = 0;
  for (let n = 0; n <= top; n++) {
    if (n > 1) lf += Math.log(n);
    const p = Math.exp(n * Math.log(mu) - mu - lf);
    m1 += p * Math.sqrt(n); m2 += p * n;
  }

}
// Power of the noise-free record in square-root units, P_k = |X_k|^2/N (bins 1..10: 1710, 146, 5.53, 74.3, 31.1,
// 1.31, 0.057, 0.027, 0.148, 0.023). One run adds the noise floor 1/4, the variance of sqrt(n).
const REC_P = (() => { const X = dftHalf(Float64Array.from(MU, Math.sqrt)); return Array.from({ length: NCH / 2 + 1 }, (_, k) => (X.re[k] ** 2 + X.im[k] ** 2) / NCH); })();

// Nice ticks between a and b, about n of them.
function niceTicks(a, b, n) {

  for (let v = Math.ceil(a / st) * st; v <= b + 1e-9; v += st) out.push(+v.toFixed(10));

}

// The record with its jitter band. o: {run (counts), compact}. Top: one run as dots, the mean as a grey line,

function bandPath(P, f) {

  return { fill: polyline(P, up) + polyline(P, dn.reverse()).replace('M', 'L') + 'Z', up: polyline(P, up), dn: polyline(P, dn) };

// ---------- 1. Big counts jitter more ----------
const MU1 = [1, 2, 4, 9, 25, 50, 100, 200, 400, 1000];
// 500 runs of one count; batch b (the "New runs" press) and mu fix the seed.
function histRuns(mu, b) { const r = mulberry32(7919 * b + 31 * mu + 1); return Array.from({ length: 500 }, () => poisson(r, mu)); }
function slideJitter(widget, side) {

    haloTex(svg, P.X(mu) - 4, P.T + 12, '$\\mu$', { w: 30, anchor: 'end', size: 15, fill: COL.ink });
    svgTex(svg, P.L, 12, 'grey bars: how often each count came up in $500$ runs', { w: W - P.L, anchor: 'start', size: 15, fill: COL.text2 });
    svgTex(svg, (P.L + W - P.R) / 2, H - 9, 'count $n$ in one run' + (bw > 1 ? ' (bars ' + bw + ' wide)' : ''), { w: 260, size: 14 });

// Reveal a decision once; later calls change nothing. by: 'user' (a pick or the button) or 'cue'.
function revealDecision(id, by) {
  const st = DSTATE[id];
  if (!st || st.open) return false;
  st.open = true;
  emit('view.action', { action: 'reveal', step: id, by: by });
  return true;
}
function mountDecision(s, widget, side) {
  const D = DECISIONS[s.id], st = DSTATE[s.id], open = st.open;
  const redraw = () => goTo(cur, true);
  const prob = mark(h('div', 'prob' + (D.sketch ? ' has-sketch' : '')), 'problem', s.id);
  prob.append(hh('p', '', h('span', 'lead', 'The problem.'), document.createTextNode(' '), setTex(h('span'), D.problem)));

    card.setAttribute('role', 'button');
    card.setAttribute('aria-disabled', open ? 'true' : 'false');
    card.tabIndex = open ? -1 : 0;
    card.classList.toggle('on', st.pick === L);
    card.classList.toggle('chooser', open && k === D.chooser);
    const who = [];

    if (open && k === D.chooser) who.push(D.who);
    const top = hh('div', 'top', h('span', 'letter', L), h('span', 'who', who.join(', ')));

}

// ---------- 5. Move the cutoff, change the answer ----------
const FC5 = [0.0125, 0.016, 0.02, 0.025, 0.03, 0.04, 0.05, 0.07, 0.1, 0.15, 0.2, 0.3, 0.5];

// ---------- 7. Why it's true: a square root evens out the jitter ----------
const MU7 = [4, 9, 16, 25, 50, 100, 200, 400, 700, 1000];
function slideWhySqrt(widget, side) {
  let mi = MU7.indexOf(200), lit = '';
  const sl = ctl('average count', { id: 'mu', min: 0, max: MU7.length - 1, step: 1, value: mi, fmt: v => '$\\mu=' + MU7[v] + '$', onInput: v => { mi = v; update(); } });
  const rS = readout('sqrt-spread', 'spread of $\\sqrt n$, exact');
  const rT = readout('slope', 'tangent slope $\\frac{1}{2\\sqrt\\mu}$');
  // The picture: a window of the same size at every mu (80 counts wide, 5 units of sqrt n tall) that follows mu,
  // so the count's band visibly widens with mu while its image through the curve keeps its height.
  const plot = plotBox((svg, W, H) => {
    const mu = MU7[mi], s = Math.sqrt(mu), a = mu - s, b = mu + s, ya = Math.sqrt(a), yb = Math.sqrt(b), m = 1 / (2 * s);
    const X0 = Math.max(0, mu - 40), Y0 = Math.max(0, s - 2.5);
    const P = scales(W, H, { x0: X0, x1: X0 + 80, y0: Y0, y1: Y0 + 5, L: 44, R: 12, T: 30, B: 50 });
    const CAP = {
      tangent: String.raw`amber: the tangent at $\mu$, slope $\frac{1}{2\sqrt\mu}$`,
      bands: String.raw`amber: the spread of $n$, times the slope, is the spread of $\sqrt n$`,
      equal: String.raw`amber: the image is $2\sqrt\mu\cdot\frac{1}{2\sqrt\mu}=1$ tall, at every $\mu$` }[lit];
    picCaption(svg, W, CAP, 'the same window at every $\\mu$: $80$ counts wide, $5$ units of $\\sqrt n$ tall');
    const clipId = 'win-clip';
    svgNode('rect', { x: P.L, y: P.T, width: P.pw, height: P.ph }, svgNode('clipPath', { id: clipId }, svgNode('defs', {}, svg)));
    const xa = P.X(a), xb = P.X(b), ytop = P.Y(yb), ybot = P.Y(ya);
    rect(svg, xa, P.T, xb - xa, P.ph, { fill: COL.accentTint, 'data-item': 'mark', 'data-id': 'x-band' });
    rect(svg, P.L, ytop, P.pw, ybot - ytop, { fill: COL.accentTint, 'data-item': 'mark', 'data-id': 'y-band' });
    if (lit === 'bands') glowRect(svg, xa, P.base - 5, xb - xa, 10, 3);
    if (lit === 'bands' || lit === 'equal') glowRect(svg, P.L - 5, ytop, 10, ybot - ytop, 3);
    if (lit === 'equal') glowRect(svg, P.L, ytop, P.pw, ybot - ytop, 1);
    axes(svg, P);
    niceTicks(X0, X0 + 80, 5).forEach(v => svgText(svg, P.X(v), P.base + 16, String(v), { 'text-anchor': 'middle' }));
    niceTicks(Y0, Y0 + 5, 5).forEach(v => svgText(svg, P.L - 8, P.Y(v) + 5, String(v), { 'text-anchor': 'end' }));
    svgTex(svg, W - P.R, H - 9, 'count $n$', { w: 100, anchor: 'end', size: 14 });
    haloTex(svg, P.L + 6, P.T + 9, '$\\sqrt n$', { w: 40, anchor: 'start', size: 14, fill: COL.muted });
    line(svg, xa, P.base, xb, P.base, { stroke: COL.accent, 'stroke-width': 5, 'data-item': 'mark', 'data-id': 'x-bracket' });
    line(svg, P.L, ytop, P.L, ybot, { stroke: COL.accent, 'stroke-width': 5, 'data-item': 'mark', 'data-id': 'y-bracket' });
    const cpts = []; for (let i = 0; i <= 200; i++) { const xv = X0 + 80 * i / 200; cpts.push([xv, Math.sqrt(xv)]); }
    const curveD = cpts.map((q, i) => (i ? 'L' : 'M') + P.X(q[0]).toFixed(1) + ' ' + (P.base - (q[1] - Y0) / 5 * P.ph).toFixed(1)).join('');
    const tY = xv => P.base - (s + m * (xv - mu) - Y0) / 5 * P.ph;
    const tline = `M${P.X(X0)} ${tY(X0)}L${P.X(X0 + 80)} ${tY(X0 + 80)}`;
    if (lit === 'tangent') glowLine(svg, tline, 11).setAttribute('clip-path', 'url(#' + clipId + ')');
    const g = svgNode('g', { 'clip-path': 'url(#' + clipId + ')' }, svg);
    // guides from the band's ends up to the curve and across to the image
    for (const [xv, yv] of [[a, ya], [b, yb]]) svgNode('path', { d: `M${P.X(xv)} ${P.base}L${P.X(xv)} ${P.Y(yv)}L${P.L} ${P.Y(yv)}`, fill: 'none', stroke: COL.muted, 'stroke-dasharray': '3 3', 'stroke-width': 1.3 }, g);
    svgNode('path', { d: curveD, fill: 'none', stroke: COL.slate2, 'stroke-width': 2.6, 'data-item': 'mark', 'data-id': 'curve' }, g);
    svgNode('path', { d: tline, fill: 'none', stroke: COL.accent, 'stroke-width': 2.2, 'stroke-dasharray': '8 4', 'data-item': 'mark', 'data-id': 'tangent' }, g);
    dot(svg, P.X(mu), P.Y(s), 4.5, COL.accent, { stroke: COL.bg, 'stroke-width': 1.5 });
    // labels where the marks sit
    const bx = Math.min(Math.max((xa + xb) / 2, P.L + 120), W - P.R - 120);
    svgTex(svg, bx, P.base + 34, 'band $\\mu\\pm\\sqrt\\mu$: $' + sn(2 * s, 1) + '$ wide', { w: 240, size: 15, fill: COL.accentDeep, bold: true });
    const right = mu <= 25;
    haloTex(svg, right ? W - P.R - 6 : P.L + 10, ytop - 13, 'its image: $' + fx(yb - ya, 2) + '$ tall, so $\\pm\\tfrac12$', { w: 260, anchor: right ? 'end' : 'start', size: 15, fill: COL.accentDeep, bold: true });
  }, 'proofpic');
  function update() {
    const mu = MU7[mi];
    rS.set('$' + fx(sqrtSpread(mu), 3) + '$');
    rT.set('$' + sn(1 / (2 * Math.sqrt(mu)), 4) + '$');
    plot.redraw();
  }
  const test = testBlock('Test it', [
    String.raw`Guess the spread of $\sqrt n$ at $\mu=400$, then set it: $0.500$. At $\mu=9$: $0.513$.`,
    String.raw`$\mu=25$ and $\mu=100$: $0.504$ and $0.501$, the same for counts four times apart. Cases are evidence, not proof.`]);
  widget.append(hh('div', 'sliders', sl.el, hh('div', 'readouts inline', rS.el, rT.el)), plot.wrap,
    legend([{ kind: 'line', color: 'var(--pal-slate-2)', text: 'grey: the curve $\\sqrt n$' }, { kind: 'dash', color: 'var(--pal-accent)', text: 'blue dashed: its tangent at $\\mu$' },
      { kind: 'chip', color: 'var(--pal-accent-tint)', text: 'shaded: the band and its image' }]),
    test, modelLine('the square root is flatter where counts are bigger, and exactly flat enough to cancel their bigger jitter.'));
  proofRight(side, {
    id: 'sqrt-evens',
    goal: { words: String.raw`if $n$ is near $\mu$ with spread $\sqrt\mu$, then $\sqrt n$ has spread about $\tfrac12$, whatever $\mu$.` },
    facts: [
      { words: String.raw`a count near $\mu$ has spread $\sqrt\mu$`, ref: 'step 1' },
      { words: 'near $\\mu$ a smooth curve is close to its tangent line', ref: 'Primer · Derivatives, step 11' },
      { words: String.raw`the slope of $\sqrt x$ is $\frac{1}{2\sqrt x}$: the slope of $y^2$ is $2y$, read the other way` }],
    lines: [
      { tex: String.raw`\sqrt n\approx\sqrt\mu+\dfrac{n-\mu}{2\sqrt\mu}`, move: 'Use an earlier result', choices: ['Take a limit', 'Change variables'],
        why: String.raw`the tangent line at $\mu$, slope $\frac{1}{2\sqrt\mu}$`, highlight: 'tangent' },
      { tex: String.raw`\text{spread of }\sqrt n\approx\dfrac{1}{2\sqrt\mu}\times\text{spread of }n`, move: 'Unfold the definition', choices: ['Compare or bound', 'Rearrange'],
        why: String.raw`a spread is a typical distance from the average: the constant $\sqrt\mu$ moves both together; the factor stretches every distance`, highlight: 'bands' },
      { tex: String.raw`=\dfrac{\sqrt\mu}{2\sqrt\mu}=\dfrac12`, move: 'Rearrange', choices: ['Telescope', 'Use symmetry'],
        why: String.raw`put in the spread $\sqrt\mu$ of $n$; $\sqrt\mu$ cancels`, highlight: 'equal' }],
    lookBack: [
      { q: 'Where does it fail?',
        a: String.raw`When $n$ wanders far from $\mu$, the tangent is a poor guide: spread $0.63$ at $\mu=1$, $0.55$ at $4$, $0.504$ at $25$.` },
      { q: 'At 29:15 Hamming names noise that grows like the value itself, as in floating point numbers. Which transform evens that?',
        a: String.raw`The log: slope $\frac1\mu$ times a spread proportional to $\mu$ is a constant. Noise of $10\%$: spread $0.100$ in log units at $50$ and at $5000$.` },
      { q: 'What did the proof use about counts?',
        a: String.raw`Only spread $=\sqrt{\text{mean}}$. Any noise with that law is evened out by the square root.` }] },
    test, key => { lit = key || ''; plot.redraw(); });
  update();
}

// ---------- frame ----------
const SLIDES = [
  { id: 'counts-jitter', kind: 'content', tag: 'Lecture 12:00 to 13:03', title: 'Big counts jitter more',
    question: 'How much does a count change from run to run, and where is the physicist’s record noisiest?',
    formula: String.raw`$$\text{spread of }n\approx\sqrt\mu,\qquad\frac{\text{spread}}{\mu}\approx\frac{1}{\sqrt\mu}$$`, mount: slideJitter },
  { id: 'pick-energy-axis', kind: 'decision', tag: 'Lecture 14:37, answer 15:42', title: 'The expert thinks signals live in time. What do you tell him?',
    question: 'Kaiser cannot apply his filter theory to counts against energy. How do you unblock him?' },
  { id: 'pick-cutoff', kind: 'decision', tag: 'Lecture 13:03, answer 16:20', title: 'Where does the signal end and the noise begin?',
    question: 'The derivative must cut off high frequencies. How do you find where to cut?' },
  { id: 'ninety-five', kind: 'sideproof', tag: 'Lecture 16:44 to 17:16', title: 'How much noise does the cutoff remove?',
    question: 'Hamming says about 95% of the noise goes. Where does 95% come from, and what about the derivative?',
    mount: slideNinety },
  { id: 'cutoff-picks-peaks', kind: 'content', wide: true, tag: 'Lecture 17:46 to 18:25', title: 'Move the cutoff, change the answer',
    question: 'If you may move the cutoff after seeing the result, what can you find?',
    formula: String.raw`$$\sqrt n\ \xrightarrow{\ \text{keep } f\le f_c\ }\ \text{smooth}\ \xrightarrow{\ \text{slope}\ }\ \text{peaks}$$`, mount: slidePeaks },
  { id: 'pick-sqrt', kind: 'decision', tag: 'Lecture 17:16, answer 18:25', title: 'Counts of very different sizes go into one filter. What do you feed it?',
    question: 'The filter adds neighbouring values with fixed weights. What should those values be?' },
  { id: 'why-sqrt', kind: 'proof', tag: 'Lecture 19:18 to 25:01', title: 'Why it’s true: a square root evens out the jitter',
    question: String.raw`Why does $\sqrt n$ jitter by about $\tfrac12$, whatever the count?`, mount: slideWhySqrt },
];

let cur = 0, shownId = null, endSent = false;
function goTo(i, same) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  if (shownId !== null && shownId !== s.id) emit('view.step', { step: s.id });
  shownId = s.id;
  const stage = $('#stage');
  stage.innerHTML = '';
  PLOTS = [];
  COL = readPalette();
  const widget = h('div', 'widget');
  const side = h('div', 'side');
  side.append(h('div', 'tag', s.tag), setTex(h('h2'), s.title));
  side.append(setTex(h('p', s.kind === 'decision' ? 'q' : 'question'), s.question));
  if (s.formula) side.append(setTex(h('div', 'formula'), s.formula));
  const cls = 'slide' + ({ proof: ' proof-slide', decision: ' decision', sideproof: ' side-proof' }[s.kind] || '') + (s.wide ? ' wide' : '');
  const sec = mark(h('section', cls), 'step', s.id, s.title.replace(/\$/g, ''));
  sec.append(widget, side);
  stage.append(sec);
  stage.scrollTop = 0;
  if (s.kind === 'decision') mountDecision(s, widget, side);
  else s.mount(widget, side);
  tex(sec);
  if (cur === SLIDES.length - 1 && !endSent) { endSent = true; emit('view.action', { action: 'deck-end' }); }
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, k) => d.classList.toggle('on', k === cur));
}
// A cue is a state. {step} goes to the step and does nothing if it is shown. {step, reveal: true}
// also reveals that decision, once; a revealed decision stays revealed.
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i < 0) return;
  const changed = msg.reveal === true && SLIDES[i].kind === 'decision' && revealDecision(SLIDES[i].id, 'cue');
  if (i !== cur || changed) goTo(i);
}
(function init() {
  const dots = $('#dots');
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = s.title.replace(/\$/g, '');
    b.addEventListener('click', () => goTo(i));
    dots.appendChild(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],textarea,select')) return;
    if (e.target && e.target.classList && e.target.classList.contains('opt') && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault(); e.target.click(); return;
    }
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
})();
</script>

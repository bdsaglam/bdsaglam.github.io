<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Lecture 11 review: Huffman codes, parity, and the weighted check</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../../components/theme.js"></script>
<style>
/* Colors: grey for exact values and inputs, blue for outputs and the reader's choice,
   amber for what the newest proof line is about, red only for a failed check. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft); --red:var(--pal-red);
  --u:clamp(16px,1.35vw,20px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 24px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(6px,1vh,12px) 24px;overflow:hidden}
footer{display:flex;align-items:center;gap:10px;padding:8px 24px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Content slide: widget on the left (3/5), text on the right (2/5). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(18px,2.4vw,40px)}
.widget{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(5px,0.9vh,9px);overflow:hidden}
.widget>*{max-width:100%;min-width:0}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(6px,1.1vh,12px);overflow:hidden}
.tag{font:14px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(20px,1.9vw,28px);line-height:1.2;margin:0;font-weight:650}
.question{margin:0;font-size:clamp(16px,1.3vw,18px);font-weight:600}
.formula{font-size:clamp(17px,1.5vw,22px)}
.sym{margin:0;font-size:16px;color:var(--muted)}
.tries{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.tries li::marker{color:var(--accent);font-weight:600}
.where{margin:0;font-size:16px}
.where b{color:var(--accent)}
.takeaway{margin:0;padding:10px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px;transition:opacity .2s}

/* Controls and readouts */
.sliders{display:flex;gap:8px 22px;flex-wrap:wrap;width:100%;align-items:center}
.slide-ctl{display:flex;align-items:center;gap:8px;font-size:16px}
.slide-ctl input{width:clamp(110px,10vw,160px);vertical-align:middle;accent-color:var(--accent)}
.slide-ctl .val{min-width:50px;white-space:nowrap}
.btn{font:inherit;padding:5px 11px;border:1px solid var(--line);background:var(--pal-panel);border-radius:8px;cursor:pointer;font-size:16px;line-height:1.3}
.btn.on{background:var(--chip);border-color:var(--accent);color:var(--pal-accent-deep)}
.btn:disabled{color:var(--muted);cursor:default;opacity:.6}
.btnrow{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap}
.btnrow .lab{font-size:16px;color:var(--muted);margin-right:2px}
.readouts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.readout{flex:1 1 120px;min-width:0;padding:3px 8px;border-radius:10px;background:var(--pal-soft);font-size:15px;overflow-wrap:anywhere}
.readout .k{color:var(--muted);font-size:14px}
.readout .val{font-size:16px;font-weight:600}
.legend{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:15px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:20px;height:0;vertical-align:middle;margin-right:6px}
.chip{display:inline-block;width:18px;height:12px;vertical-align:middle;margin-right:6px;border-radius:2px}
.note{min-height:34px;display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;font-size:16px;padding:2px 10px;border-radius:8px;background:var(--pal-soft);border:1px solid var(--pal-grid)}
.note.ask{background:var(--pal-amber-row);border-color:var(--pal-amber-bg)}
.note .good{color:var(--accent);font-weight:600}

/* Plots fill the space left in the widget column */
.fill{flex:1 1 0;min-height:120px;position:relative;width:100%}
.fill>svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* Proof slides: test and picture on the left, the proof (fl-proof-steps) on the right */
.slide.proof-slide{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(18px,2.2vw,34px)}
.slide.proof-slide h2{font-size:clamp(20px,1.75vw,26px)}
.slide.proof-slide .side{gap:clamp(4px,0.8vh,9px)}
.slide.proof-slide .side{justify-content:flex-start}
.slide.proof-slide .slide-ctl input{width:clamp(90px,8vw,130px)}
.slide.proof-slide .slide-ctl .val{min-width:40px}
.slide.proof-slide .sliders{gap:6px 14px}
.slide.proof-slide .fill{min-height:180px}
.readouts.inline .readout{display:flex;gap:4px 8px;align-items:baseline;flex-wrap:wrap}
.part{margin:0;font-weight:600;color:var(--muted)}
.test{display:flex;flex-direction:column;gap:3px;font-size:16px}
.test .tries{gap:3px}
.model{margin:0;padding:7px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}

/* Decision slides: the problem, three cards and the reveal on the left; question, try-steps,
   AI echo and takeaway on the right. */
.slide.decision{grid-template-columns:minmax(0,2.05fr) minmax(0,1fr);gap:clamp(20px,2.6vw,40px)}
.decision .widget{gap:6px}
.decision .side{justify-content:space-evenly;gap:clamp(8px,1.8vh,18px)}
.decision h2{font-size:clamp(23px,2.3vw,32px)}
.decision .q{margin:0;font-size:clamp(17px,1.55vw,21px);font-weight:600;line-height:1.35}
.decision .fx{margin:0;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--pal-soft);font-size:clamp(17px,1.6vw,22px);line-height:1.4}
.decision .kicker{font-size:14px;color:var(--muted);margin:0 0 3px}
.decision .blk{display:flex;flex-direction:column;gap:3px}
.decision .ai{margin:0;font-size:16px;line-height:1.4}
.decision .ai .src{color:var(--muted);font-size:14px}
.decision .takeaway{padding:11px 14px;line-height:1.4}
.decision .tries{gap:6px;font-size:clamp(16px,1.35vw,18px);line-height:1.4}
.decision .hold{color:var(--muted);font-style:italic;background:var(--pal-soft);border:1px dashed var(--line);border-radius:6px;padding:9px 12px;margin:0;font-size:16px;line-height:1.4}
.prob{flex:0 0 auto;border:1px solid var(--line);border-radius:10px;padding:6px 14px;background:var(--pal-soft);font-size:16px;line-height:1.4}
.prob .lead{font-weight:650;color:var(--muted)}
.prob p{margin:0}
.opts{flex:0 0 auto;display:flex;flex-direction:column;gap:clamp(4px,0.5vw,8px)}
.opt{display:grid;grid-template-columns:minmax(0,0.78fr) minmax(0,1.22fr);gap:0 14px;padding:clamp(6px,0.7vw,10px) 12px;border:1px solid var(--line);border-radius:10px;background:var(--pal-panel);color:inherit;text-align:left;cursor:pointer;min-width:0;font:inherit}
.opt .lhs{display:flex;flex-direction:column;gap:3px;min-width:0}
.opt .rhs{display:flex;flex-direction:column;gap:3px;min-width:0;border-left:1px solid var(--pal-soft-2);padding-left:14px}
.opt:not([aria-disabled="true"]):hover{border-color:var(--accent)}
.opt[aria-disabled="true"]{cursor:default}
.opt .top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:16px}
.opt .letter{font-weight:700;color:var(--accent)}
.opt .who{font-size:14px;color:var(--muted);text-align:right}
.opt .body{font-size:clamp(16px,1.4vw,19px);line-height:1.3}
.opt .asm{margin:0;font-size:clamp(16px,1.3vw,18px);line-height:1.33;color:var(--muted)}
.opt .verdict{font-size:clamp(16px,1.3vw,18px);line-height:1.33;color:var(--fg)}
.opt .verdict.idle{color:var(--muted);font-style:italic}
.opt.on{box-shadow:inset 0 0 0 2px var(--pal-ink)}
.opt.chooser{background:var(--chip);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.opt.chooser .who{color:var(--accent);font-weight:600}
.reveal{flex:1 1 auto;min-height:0;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:clamp(16px,1.25vw,18px);display:flex;flex-direction:column;justify-content:center;gap:6px}
.reveal.idle{background:var(--pal-soft);color:var(--muted)}
.rv{margin:0;line-height:1.38}
.rv .k{font-weight:650;color:var(--accent)}
.rv .t{color:var(--muted);font-size:14px;white-space:nowrap}
.rv.hold{color:var(--muted)}
.decision .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px}
.decision .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--pal-on-accent);padding:6px 16px}

/* Short windows (1100x620 and similar): tighter spacing, body text stays 16px */
@media (max-height: 680px){
  header{padding-top:4px}
  #stage{padding:4px 24px}
  footer{padding:4px 24px}
  .widget{gap:4px}
  .side{gap:4px}
  .tries{gap:2px}
  .sym,.where,.tries,.test,.model{line-height:1.22}
  .readout{padding:2px 8px}
  .takeaway{padding:6px 10px}
  .formula{font-size:18px}
  h2{font-size:20px}
  .fill{min-height:100px}
  .note{min-height:30px;padding:1px 8px}
  .model{padding:5px 10px}
  .btn{padding:3px 9px}
  .slide-ctl input{width:100px}
  .slide.proof-slide .slide-ctl input{width:64px}
  .slide.proof-slide .slide-ctl .val{min-width:30px}
  .slide.proof-slide .sliders{gap:4px 10px}
  .slide.proof-slide .fill{min-height:165px}
  .decision h2{font-size:23px}
  .decision .side{gap:7px}
  .decision .tries{gap:2px;line-height:1.3}
  .decision .takeaway{padding:7px 12px}
  .reveal{gap:3px;padding:5px 12px}
  .rv{line-height:1.28}
  .opts{gap:3px}
  .opt{padding:4px 12px}
  .opt .body,.opt .asm,.opt .verdict{line-height:1.25}
  .prob{padding:4px 12px;line-height:1.3}
}
</style>
</head>
<body>
<header id="head">Lecture 11 review · Huffman codes, parity, and the weighted check</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script src="../../components/proof-steps.js"></script>
<style>
.fx{margin:0;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--pal-soft);font-size:clamp(17px,1.6vw,22px);line-height:1.4}
.prow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hlist{flex:1 1 0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:4px}
.hrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:10px;align-items:center}
.hlab{font-size:16px}
.hbar{height:18px;background:var(--pal-accent);border-radius:3px;min-width:4px}
.ltable{flex:1 1 0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:4px;font-size:16px}
.lrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:8px}
.lrow.lhead{color:var(--muted);font-size:14px;background:var(--pal-soft)}
.bitrow{display:flex;gap:8px;flex-wrap:wrap}
.btn.bit{min-width:52px;font-size:20px;font-weight:600;padding:6px 0}
.btn.bit.on{background:var(--accent);color:var(--pal-on-accent);border-color:var(--accent)}
.cwgrid{flex:1 1 0;min-height:0;display:flex;flex-wrap:wrap;align-content:center;gap:10px}
.cw{display:inline-flex;flex-direction:column;align-items:center;min-width:72px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--pal-panel);font-size:16px}
.cw .dg{color:var(--muted);font-size:14px}
</style>
<script>
// ---------- palette ----------
// COL holds the palette colours for the SVG being drawn. fillPlot reads it at every paint, so a draw always
// uses the current theme. PLOTS are the plots on the current slide: a theme switch repaints them, and the
// slider and pick state (DOM and closures) stays.
let COL = {};
const PAL_NAMES = ['accent', 'amber', 'amber-bg', 'grey', 'ink', 'line', 'muted', 'panel', 'soft', 'text-2'];
function readPalette() {
  const o = {};
  for (const n of PAL_NAMES) o[n.replace(/-(\w)/g, (_, c) => c.toUpperCase())] = FluidTheme.color(n);
  return o;
}
let PLOTS = [];
window.addEventListener('fluid-themechange', () => PLOTS.forEach(p => p.redraw()));

// ---------- DOM and drawing helpers ----------
const $ = s => document.querySelector(s);
const NSV = 'http://www.w3.org/2000/svg', NHT = 'http://www.w3.org/1999/xhtml';
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false } ], throwOnError: false };
// Render $...$ in a node. If the CDN did not load, the text stays as typed.
function tex(node) {
  if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH);
  return node;
}
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function hh(tag, cls, ...kids) {
  const e = h(tag, cls);
  for (const k of kids) if (k) e.append(k);
  return e;
}
function mark(e, kind, id, title) {
  e.dataset.item = kind;
  if (id != null) e.dataset.id = id;
  if (title != null) e.dataset.title = title;
  return e;
}
function svgNode(tag, attrs, parent) {
  const e = document.createElementNS(NSV, tag);
  for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function svgRoot(w, ht) {
  return svgNode('svg', { viewBox: '0 0 ' + w + ' ' + ht, role: 'img', 'font-family': 'system-ui, sans-serif', 'font-size': 14 });
}
function svgText(parent, x, y, s, attrs) {
  const t = svgNode('text', Object.assign({ x: x, y: y, fill: COL.muted, 'font-size': 14 }, attrs || {}), parent);
  t.textContent = s;
  return t;
}
// A KaTeX label over an SVG: a foreignObject holding a rendered formula. o.bg paints a background.
function svgTex(parent, x, y, s, o) {
  o = o || {};
  const w = o.w || 220, ht = o.ht || 26, anchor = o.anchor || 'middle';
  const x0 = anchor === 'end' ? x - w : anchor === 'start' ? x : x - w / 2;
  const fo = svgNode('foreignObject', { x: x0, y: y - ht / 2, width: w, height: ht }, parent);
  const d = document.createElementNS(NHT, 'div');
  const jc = anchor === 'end' ? 'flex-end' : anchor === 'start' ? 'flex-start' : 'center';
  d.setAttribute('style', 'display:flex;align-items:center;height:100%;white-space:nowrap;font-size:' +
    (o.size || 15) + 'px;color:' + (o.fill || 'var(--pal-text-2)') + ';justify-content:' + jc);
  const span = document.createElementNS(NHT, 'span');
  span.textContent = s;
  if (o.bg) span.setAttribute('style', 'background:' + o.bg + ';border-radius:5px;padding:1px 5px');
  if (o.halo) span.setAttribute('style', 'text-shadow:0 0 3px var(--pal-bg),0 0 3px var(--pal-bg),0 0 2px var(--pal-bg)');
  d.appendChild(span);
  fo.appendChild(d);
  tex(span);
  return fo;
}
const haloTex = (parent, x, y, s, o) => svgTex(parent, x, y, s, Object.assign({ halo: true }, o || {}));
function path(svg, pts, attrs, close) {
  const d = 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L') + (close ? 'Z' : '');
  return svgNode('path', Object.assign({ d: d, fill: 'none' }, attrs), svg);
}
function dot(svg, x, y, color, r) {
  return svgNode('circle', { cx: x, cy: y, r: r || 5, fill: color, stroke: COL.panel, 'stroke-width': 1.5 }, svg);
}
// Tick label: KaTeX if it has $, plain text otherwise.
function tick(svg, x, y, s, anchor) {
  return s.indexOf('$') >= 0 ? svgTex(svg, x, y, s, { w: 80, size: 14, anchor: anchor || 'middle', fill: 'var(--pal-muted)' }) :
    svgText(svg, x, y + 5, s, { 'text-anchor': anchor || 'middle' });
}
// A labelled range input. label and the value text are LaTeX-ready.
function slider(label, o) {
  const wrap = h('label', 'slide-ctl');
  const lab = tex(h('span', '', label));
  const val = h('span', 'val', '');
  const inp = h('input');
  inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step; inp.value = o.value;
  mark(inp, 'control', o.id, o.name || o.id);
  wrap.append(lab, inp, val);
  const fmtv = o.fmt || String;
  const api = {
    el: wrap, input: inp,
    get value() { return +inp.value; },
    set(v) { inp.value = v; api.show(); },
    show() { setTex(val, fmtv(+inp.value)); },
  };
  inp.addEventListener('input', () => { api.show(); if (o.onInput) o.onInput(+inp.value); });
  api.show();
  return api;
}
// A readout box: label and value are LaTeX-ready text.
function readout(id, label) {
  const box = mark(h('div', 'readout'), 'readout', id);
  const k = h('div', 'k');
  setTex(k, label);
  const v = h('div', 'val');
  box.append(k, v);
  return { el: box, set(text) { setTex(v, text); }, label(text) { setTex(k, text); } };
}
function legend(items) {
  const d = h('div', 'legend');
  for (const it of items) {
    const s = h('span');
    const sw = it.chip ? h('span', 'chip') : h('span', 'sw');
    if (it.chip) { sw.style.background = it.color; if (it.ring) { sw.style.background = 'var(--pal-panel)'; sw.style.border = '2px solid ' + it.color; sw.style.borderRadius = '50%'; sw.style.width = '13px'; sw.style.height = '13px'; } }
    else sw.style.borderTop = (it.width || 2) + 'px ' + (it.dash ? 'dashed' : 'solid') + ' ' + it.color;
    const t = h('span');
    setTex(t, it.text);
    s.append(sw, t);
    d.appendChild(s);
  }
  return d;
}
// A plot that takes the height left in its box. draw(svg, W, H) runs on every resize and may
// return a geometry object (wrap._geo) that the pointer handlers use.
function fillPlot(box, draw) {
  const wrap = h('div', 'fill');
  box.append(wrap);
  let key = '';
  const paint = force => {
    const w = Math.floor(wrap.clientWidth), ht = Math.floor(wrap.clientHeight);
    if (w < 60 || ht < 60) return;
    if (!force && key === w + 'x' + ht) return;
    key = w + 'x' + ht;
    const svg = svgRoot(w, ht);
    COL = readPalette();
    wrap._geo = draw(svg, w, ht) || null;
    wrap.replaceChildren(svg);
  };
  new ResizeObserver(() => paint(false)).observe(wrap);
  const plot = { wrap, redraw: () => paint(true) };
  PLOTS.push(plot);
  return plot;
}
function sym(text) { return setTex(h('p', 'sym'), text); }
function triesList(items) { return hh('ol', 'tries', ...items.map(t => setTex(h('li'), t))); }
function takeLine(text) { return setTex(h('p', 'takeaway'), text); }
function noticeLine(text) { const p = h('p', 'where'); p.append(h('b', '', 'Notice: ')); p.append(setTex(h('span'), text)); return p; }
// Session events. With no bridge, nothing is sent and the view still works.
function emit(kind, data) {
  try {
    if (window.fluid && typeof window.fluid.emit === 'function') Promise.resolve(window.fluid.emit(kind, data)).catch(() => {});
  } catch (e) { /* no bridge */ }
}

// ---------- proof slides: shared parts ----------
// Amber marks what the newest proof line is about, in the picture and in the proof.
// Amber: COL.amber and COL.amberBg in SVG; var(--pal-amber), var(--pal-amber-bg) in HTML.
function glowPath(svg, pts, wdt) {
  return path(svg, pts, { stroke: COL.amberBg, 'stroke-width': wdt || 12, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
}
function glowFill(svg, pts) {
  return path(svg, pts, { fill: COL.amberBg, 'fill-opacity': .9, stroke: COL.amber, 'stroke-width': 1.5 }, true);
}
function glowDot(svg, x, y, r) {
  return svgNode('circle', { cx: x, cy: y, r: r || 9, fill: COL.amberBg, stroke: COL.amber, 'stroke-width': 1.5 }, svg);
}
// While a proof line is lit, a caption in the top row says what the amber part is.
function litCaption(svg, W, text) { svgTex(svg, W / 2, 13, text, { w: W - 8, size: 15, fill: 'var(--pal-ink)', bg: 'var(--pal-amber-bg)' }); }
function plainCaption(svg, W, text) { svgTex(svg, W / 2, 13, text, { w: W - 8, size: 14, fill: 'var(--pal-muted)' }); }
// Left column of a proof slide: controls, the picture, legend, readouts, the test, the model.
function proofLeft(widget, o) {
  for (const row of o.controls || []) widget.append(row);
  const plot = fillPlot(widget, o.draw);
  widget.append(legend(o.legend));
  if (o.readouts && o.readouts.length) widget.append(hh('div', 'readouts' + (o.inline ? ' inline' : ''), ...o.readouts.map(r => r.el)));
  const test = hh('div', 'test', h('p', 'part', 'Test it'), triesList(o.tests));
  const model = h('p', 'model');
  model.append(h('span', 'part', 'The picture: '), setTex(h('span'), o.model));
  widget.append(test, model);
  return { redraw: plot.redraw, wrap: plot.wrap, test: test };
}
// Right column: the proof. Each revealed line lights its part of the picture; once the proof is
// done, the look-back questions take the place of the test under the picture.
function proofRight(side, spec, plot, onLight) {
  const el = document.createElement('fl-proof-steps');
  el.onEvent = d => emit('view.action', d);
  el.onHighlight = key => onLight(key);
  el.lookBackHost = plot.test;
  el.lookBackHint = 'Look back: under the picture.';
  el.data = spec;
  side.append(el);
  return el;
}

// ---------- numbers (checked with Python: see lectures/11-.../design.md) ----------
const fixed = (v, d) => (Math.abs(v) < 0.5 * Math.pow(10, -d) ? 0 : v).toFixed(d);
const short = (v, d) => { let s = fixed(v, d == null ? 3 : d); if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, ''); return s === '-0' ? '0' : s; };
const binom = (n, k) => { if (k < 0 || k > n) return 0; let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return r; };

// Slide 1 data: Hamming's case, P1..P5 = 4/10, 2/10, 2/10, 1/10, 1/10 (03:42).
const HP = [['A', 0.4], ['B', 0.2], ['C', 0.2], ['D', 0.1], ['E', 0.1]];
const HMERGE = [['D', 'E', 'DE'], ['B', 'C', 'BC'], ['A', 'DE', 'ADE'], ['BC', 'ADE', 'all']];
const HCODE = { A: '00', B: '10', C: '11', D: '010', E: '011' };
// Slide 3 data: the same probabilities, two tie-break rules (both give L = 2.2).
const RULE = {
  low: { name: 'Rule A: merged symbol goes low', len: { A: 1, B: 3, C: 2, D: 4, E: 4 }, code: { A: '0', B: '110', C: '10', D: '1110', E: '1111' } },
  high: { name: 'Rule B: merged symbol goes high', len: { A: 2, B: 2, C: 2, D: 3, E: 3 }, code: HCODE } };
const avgLen = (lenOf) => HP.reduce((s, [n, p]) => s + p * lenOf[n], 0);
const varLen = (lenOf) => { const m = avgLen(lenOf); return HP.reduce((s, [n, p]) => s + p * (lenOf[n] - m) * (lenOf[n] - m), 0); };

// Slide 6 data: weighted check S = sum k x_k mod 37, k = 1..4; base code has S = 0.
const P37 = 37;
const S37 = xs => ((xs.reduce((s, x, i) => s + (i + 1) * x, 0) % P37) + P37) % P37;

// ---------- small builders ----------
function fxLine(text) { return setTex(h('p', 'fx'), text); }
function btnCtl(label, id, fn) { const b = mark(h('button', 'btn'), 'control', id); setTex(b, label); b.addEventListener('click', fn); return b; }
function prow(...kids) { return hh('div', 'prow', ...kids); }
function legendRow(items) { return legend(items); }
function svgLabel(svg, x, y, s, o) { return svgTex(svg, x, y, s, Object.assign({ w: 120, size: 15, fill: 'var(--pal-text-2)' }, o || {})); }

// ---------- slide 1: huffman (03:12 to 05:52) ----------
function slideHuffman(widget, side) {
  let items = HP.map(([n, p]) => ({ n, p })), k = 0, split = false;
  const list = h('div', 'hlist');
  const rM = readout('merges', 'merges done');
  const rL = readout('avg-length', 'average length $L=\\sum_i p_i\\,l_i$');
  const bMerge = btnCtl('Merge the two least likely', 'merge', () => {
    if (k < HMERGE.length && !split) {
      const [a, b, o] = HMERGE[k];
      const ia = items.find(t => t.n === a), ib = items.find(t => t.n === b);
      items = items.filter(t => t !== ia && t !== ib);
      items.unshift({ n: o === 'all' ? 'one code' : o, p: ia.p + ib.p, merged: true });
      k++;
    }
    draw();
  });
  const bSplit = btnCtl('Split back', 'split', () => {
    if (k === HMERGE.length) { split = true; items = HP.map(([n, p]) => ({ n, p })); }
    draw();
  });
  function draw() {
    list.replaceChildren();
    for (const t of items) {
      const row = h('div', 'hrow');
      const lab = h('div', 'hlab');
      let s = '$' + t.n + '$ · $p=' + short(t.p, 2) + '$';
      if (split) s += ' · code $' + HCODE[t.n] + '$';
      setTex(lab, s);
      const bar = h('div', 'hbar');
      bar.style.width = Math.round(t.p * 100) + '%';
      row.append(lab, bar);
      list.append(row);
    }
    rM.set(String(k) + ' of ' + HMERGE.length);
    rL.set(split ? '$' + short(avgLen(Object.fromEntries(HP.map(([n]) => [n, HCODE[n].length]))), 2) + '$' : 'after split');
    bMerge.disabled = k >= HMERGE.length || split;
    bSplit.disabled = k < HMERGE.length || split;
    tex(list);
  }
  widget.append(prow(bMerge, bSplit), list,
    legendRow([{ chip: true, color: 'var(--pal-accent)', text: 'bar: probability $p$ of the symbol or merged group' }]),
    hh('div', 'readouts', rM.el, rL.el));
  side.append(fxLine(String.raw`$L=\sum_i p_i\,l_i$`));
  side.append(triesList([
    'Press merge four times. Say which two join each time before you press.',
    'Before you split, guess $L$ from the bars. Then press split and check.',
    'Notice: the two $0.1$ symbols get the longest codes.']));
  side.append(takeLine('Merge the two least likely, and the code falls out of the tree.'));
  draw();
}

// ---------- slide 2: huffman-optimal, proof (01:34 to 05:52) ----------
function slideHuffmanOptimal(widget, side) {
  let pm = 0.3, pn = 0.2, lm = 3, ln = 2, lit = '';
  const sPm = slider('$p_m$', { id: 'pm', name: 'probability of symbol m', min: 0.05, max: 0.5, step: 0.05, value: pm,
    fmt: v => '$' + v.toFixed(2) + '$', onInput: v => { pm = v; redraw(); } });
  const sPn = slider('$p_{m+1}$', { id: 'pn', name: 'probability of symbol m+1', min: 0.05, max: 0.5, step: 0.05, value: pn,
    fmt: v => '$' + v.toFixed(2) + '$', onInput: v => { pn = v; redraw(); } });
  const sLm = slider('$l_m$', { id: 'lm', name: 'length of symbol m', min: 1, max: 5, step: 1, value: lm,
    fmt: v => '$' + v + '$', onInput: v => { lm = v; redraw(); } });
  const sLn = slider('$l_{m+1}$', { id: 'ln', name: 'length of symbol m+1', min: 1, max: 5, step: 1, value: ln,
    fmt: v => '$' + v + '$', onInput: v => { ln = v; redraw(); } });
  const rC = readout('change', 'change in $L$ from the swap: $L\'-L$');
  const rS = readout('sign', 'sign of the change');
  const change = () => (pm - pn) * (ln - lm);
  function draw(svg, W, H) {
    const base = H - 40, sc = (H - 70) / 0.5;
    const col = (x0, label, a1, a2, litOn) => {
      svgLabel(svg, x0 + 90, 13, label, { w: 240, size: 15, fill: 'var(--pal-ink)' });
      [[pm, a1, '$p_m$'], [pn, a2, '$p_{m+1}$']].forEach(([p, l, name], i) => {
        const x = x0 + 30 + i * 100, hgt = p * sc;
        svgNode('rect', { x: x, y: base - hgt, width: 70, height: hgt, fill: litOn ? COL.amberBg : COL.line, stroke: litOn ? COL.amber : COL.muted, 'stroke-width': 1.5 }, svg);
        svgLabel(svg, x + 35, base - hgt - 12, name + '$=' + short(p, 2) + '$', { w: 110, size: 14 });
        svgLabel(svg, x + 35, base + 14, '$l=' + l + '$', { w: 80, size: 14 });
      });
    };
    col(0, 'before: symbol m gets $l_m$', lm, ln, lit === 'pair' || lit === 'merge');
    col(W / 2, 'after the swap: lengths exchanged', ln, lm, lit === 'after' || lit === 'merge');
    svgNode('line', { x1: W / 2 - 6, y1: base - 24, x2: W / 2 - 4, y2: base - 24, stroke: COL.muted }, svg);
    svgLabel(svg, W / 2, H - 6, 'Bars: height is $p$. Labels: the length $l$ of each symbol.', { w: W - 10, size: 14, fill: 'var(--pal-muted)' });
    if (lit === 'sign') svgLabel(svg, W / 2, 14, '$(p_m-p_{m+1})>0$ and $(l_{m+1}-l_m)<0$', { w: W - 10, size: 15, fill: 'var(--pal-ink)', bg: 'var(--pal-amber-bg)' });
    return null;
  }
  const plot = proofLeft(widget, {
    controls: [hh('div', 'sliders', sPm.el, sPn.el, sLm.el, sLn.el)],
    draw: draw,
    legend: [
      { chip: true, color: 'var(--pal-line)', text: 'grey bars: the code as it is' },
      { chip: true, color: 'var(--pal-amber-bg)', text: 'amber: the part the newest line is about' }],
    readouts: [rC, rS],
    tests: [
      String.raw`Guess: if $p_m>p_{m+1}$ and $l_m>l_{m+1}$, does swapping the lengths make $L$ smaller? Keep $p_m=0.3$, $p_{m+1}=0.2$, $l_m=3$, $l_{m+1}=2$, and read the change.`,
      'The readout is negative for these values. A few cases are evidence, not proof: the proof is on the right.'],
    model: String.raw`the two symbols share the two lengths. Swapping them moves the long word to the less likely symbol, so $L$ drops.` });
  const redraw = () => { rC.set('$' + short(change(), 2) + '$'); rS.set(change() < 0 ? 'smaller' : change() > 0 ? 'larger' : 'same'); plot.redraw(); };
  redraw();
  proofRight(side, {
    id: 'huffman-optimal',
    goal: { tex: String.raw`L \text{ is least for Huffman's code}`,
      words: 'For any probabilities, no code has a smaller $L$ than Huffman\'s.' },
    facts: [
      { words: String.raw`Symbols $m$, $m+1$; every other term of $L$ stays (01:34).` }],
    lines: [
      { tex: String.raw`\text{assume } p_m>p_{m+1},\ l_m>l_{m+1}`, move: 'Name a piece', choices: ['Change variables', 'Use symmetry'],
        why: 'the bad order: the more likely symbol has the longer word', highlight: 'pair' },
      { tex: String.raw`L'-L=(p_m-p_{m+1})(l_{m+1}-l_m)`, move: 'Rearrange', choices: ['Compute it two ways', 'Telescope'],
        why: 'swap the two lengths: only these two terms change', highlight: 'after' },
      { tex: String.raw`p_m-p_{m+1}>0,\ \ l_{m+1}-l_m<0\ \Rightarrow\ L'-L<0`, move: 'Compare or bound', choices: ['Use symmetry', 'Take a limit'],
        why: 'a positive number times a negative one is negative', highlight: 'sign' },
      { tex: String.raw`L'<L`, move: 'Contradiction', choices: ['Induction', 'Take a limit'],
        why: 'the swap beats the code, so the bad order is never optimal', highlight: 'after' },
      { tex: String.raw`L_n=L_{n-1}+p_a+p_b`, move: 'Induction', choices: ['Use symmetry', 'Telescope'],
        why: 'merge the two least likely: one symbol fewer, $L$ grows by their sum', highlight: 'merge' }],
    lookBack: [
      { q: String.raw`Where does the swap argument fail if $p_m=p_{m+1}$?`,
        a: String.raw`Then $p_m-p_{m+1}=0$ and the swap changes nothing, so equal probabilities can take either order.` },
      { q: 'Why does the proof need induction too?',
        a: 'The swap only puts the lengths in order. Induction shows which two symbols to merge, so the smaller problem has the same rule.' }] }, plot, key => { lit = key || ''; plot.redraw(); });
  side.append(fxLine(String.raw`$L'-L=(p_m-p_{m+1})(l_{m+1}-l_m)$`));
}

// ---------- slide 4: white-noise (20:39 to 23:45) ----------
function slideWhiteNoise(widget, side) {
  let n = 10, p = 0.02;
  const sN = slider('$n$', { id: 'n', name: 'bits in one block', min: 1, max: 30, step: 1, value: n,
    fmt: v => '$' + v + '$', onInput: v => { n = v; redraw(); } });
  const sP = slider('$p$', { id: 'p', name: 'chance one bit is wrong', min: 0.005, max: 0.3, step: 0.005, value: p,
    fmt: v => '$' + v.toFixed(3) + '$', onInput: v => { p = v; redraw(); } });
  const rP0 = readout('P0', '$P_0=(1-p)^n$');
  const rP1 = readout('P1', '$P_1=np(1-p)^{n-1}$');
  const rR = readout('ratio', '$P_2/P_1$ and $np/2$');
  const K = [0, 1, 2, 3];
  const probs = () => K.map(k => binom(n, k) * Math.pow(p, k) * Math.pow(1 - p, n - k));
  widget.append(hh('div', 'sliders', sN.el, sP.el));
  widget.append(legendRow([{ chip: true, color: 'var(--pal-accent)', text: 'blue bars: $P_k$, the chance of $k$ errors' }]));
  const plot = fillPlot(widget, (svg, W, H) => {
    const base = H - 40, top = 40, pr = probs(), mx = 1;
    const bw = (W - 80) / K.length;
    K.forEach((k, i) => {
      const x = 40 + i * bw + bw * 0.2, bwid = bw * 0.6, hgt = pr[i] / mx * (base - top);
      svgNode('rect', { x: x, y: base - hgt, width: bwid, height: hgt, fill: COL.accent, 'fill-opacity': 0.85 }, svg);
      svgLabel(svg, x + bwid / 2, base - hgt - 12, '$' + short(pr[i], 3) + '$', { w: 110, size: 15, fill: 'var(--pal-ink)' });
      svgLabel(svg, x + bwid / 2, base + 16, k + (k === 1 ? ' error' : ' errors'), { w: 110, size: 15 });
    });
    svgNode('line', { x1: 36, y1: base, x2: W - 36, y2: base, stroke: COL.muted }, svg);
    return null;
  });
  widget.append(hh('div', 'readouts', rP0.el, rP1.el, rR.el));
  function redraw() {
    rP0.set('$' + short(Math.pow(1 - p, n), 3) + '$');
    rP1.set('$' + short(n * p * Math.pow(1 - p, n - 1), 3) + '$');
    const pr = probs();
    rR.set('$' + short(pr[2] / pr[1], 3) + '$ and $' + short(n * p / 2, 3) + '$');
    plot.redraw();
  }
  side.append(sym(String.raw`$C(n,k)=\binom nk$: the ways to pick the $k$ wrong bits among $n$. Example: sent $1011$, received $1001$: one error, $n=4$, $k=1$.`));
  side.append(fxLine(String.raw`$P_k=\binom nk\,p^k(1-p)^{n-k}$`));
  side.append(triesList([
    'Set $n=10$ and $p=0.01$. Guess $P_0$ first, then read it.',
    'Raise $n$ to $30$. Watch $P_2/P_1$ against $np/2$.',
    'Notice: when $np$ is small, each extra error costs about $np/(k+1)$, not $np$.']));
  side.append(takeLine('When $np$ is small, two errors are rare, and each extra one is rarer again.'));
  redraw();
}

// ---------- slide 5: parity-and-2-of-5 (18:34 to 24:49) ----------
function slideParity(widget, side) {
  let bits = [1, 0, 1, 1, 1];   // four data bits, then the even-parity bit (total ones = 4)
  const bitBtns = bits.map((_, i) => {
    const b = mark(h('button', 'btn bit'), 'control', 'bit-' + (i + 1));
    b.addEventListener('click', () => { bits[i] = 1 - bits[i]; redraw(); });
    return b;
  });
  const rOnes = readout('ones', 'ones in the 5 bits');
  const rPar = readout('parity', 'parity check');
  const words = [];
  for (let m = 0; m < 32; m++) { const w = [0, 1, 2, 3, 4].map(i => (m >> i) & 1); if (w.reduce((a, b) => a + b, 0) === 2) words.push(w); }
  const grid = h('div', 'cwgrid');
  function redraw() {
    bitBtns.forEach((b, i) => { b.textContent = String(bits[i]); b.classList.toggle('on', bits[i] === 1); });
    const ones = bits.reduce((a, b) => a + b, 0);
    rOnes.set('$' + ones + '$');
    rPar.set(ones % 2 === 0 ? 'even: no error seen' : 'odd: error seen');
    grid.replaceChildren();
    for (let d = 0; d < 10; d++) {
      const w = words[d];
      const c = hh('span', 'cw', setTex(h('span'), '$' + w.join('') + '$'), setTex(h('span', 'dg'), '$' + d + '$'));
      grid.append(c);
    }
    tex(grid);
  }
  widget.append(setTex(h('p', 'part'), 'Part 1. Four data bits and one parity bit. Click a bit to flip it (noise).'),
    hh('div', 'bitrow', ...bitBtns),
    hh('div', 'readouts', rOnes.el, rPar.el),
    setTex(h('p', 'part'), String.raw`Part 2. The 2-out-of-5 code: $\binom52=10$ words, one per digit. Each word has exactly two $1$s.`),
    grid,
    legendRow([{ chip: true, color: 'var(--pal-accent)', text: 'blue button: a $1$ bit' }]));
  side.append(sym(String.raw`Parity: an extra bit that makes the total number of $1$s even. Noise: each bit flips on its own.`));
  side.append(fxLine(String.raw`$\binom52=10,\qquad \binom73=35$`));
  side.append(triesList([
    'Click two bits. Does the parity check see it? Predict first.',
    'Click one bit of a 2-out-of-5 word in part 2. Is it still a legal word?',
    'Notice: a single flip changes the count of $1$s by one, so the check fails.']));
  side.append(takeLine('One parity bit catches one error; it misses two. A count code catches any single change.'));
  redraw();
}

// ---------- slide 6: mod-37, proof (29:33 to 33:12; running sums 31:40) ----------
function slideMod37(widget, side) {
  let xs = [19, 1, 4, 1], base = xs.slice(), lit = '';   // S = 0 for the base code
  const sl = [0, 1, 2, 3].map(i => slider('$x_' + (i + 1) + '$', { id: 'x' + (i + 1), name: 'symbol ' + (i + 1) + ', weight ' + (i + 1), min: 0, max: 36, step: 1, value: xs[i],
    fmt: v => '$' + v + '$', onInput: v => { xs[i] = v; redraw(); } }));
  const bChange = btnCtl('Change $x_3$ by $+1$', 'change', () => { xs[2] = (xs[2] + 1) % 37; redraw(); });
  const bSwap = btnCtl('Swap $x_2$ and $x_3$', 'swap', () => { [xs[1], xs[2]] = [xs[2], xs[1]]; redraw(); });
  const bReset = btnCtl('Reset to the valid code', 'reset', () => { xs = base.slice(); sl.forEach((s, i) => s.set(xs[i])); redraw(); });
  const rS = readout('check', 'check $S=\\sum_k k\\,x_k \\bmod 37$');
  const rV = readout('valid', 'valid?');
  const drawMod = (svg, W, H) => {
    const cell = (W - 40) / 37, y0 = 60, ch = 40;
    const S0 = S37(base), S1 = S37(xs);
    // Amber: the check after the example change the newest line talks about, or the reader's own error.
    const chg = xs.slice(); chg[2] = (chg[2] + 1) % 37;
    const sw = xs.slice(); [sw[1], sw[2]] = [sw[2], sw[1]];
    const amberAt = lit === 'swap' ? S37(sw) : lit ? S37(chg) : (S1 !== S0 ? S1 : -1);
    for (let v = 0; v < 37; v++) {
      const fill = v === S0 ? COL.grey : v === amberAt ? COL.amberBg : COL.soft;
      svgNode('rect', { x: 20 + v * cell, y: y0, width: cell - 2, height: ch, fill: fill, stroke: v === 0 ? COL.ink : COL.line, 'stroke-width': v === 0 ? 2 : 1 }, svg);
      if (v % 6 === 0 || v === 36) svgLabel(svg, 20 + v * cell + cell / 2, y0 + ch + 16, String(v), { w: 40, size: 14 });
    }
    svgLabel(svg, 20 + cell / 2, y0 - 14, 'valid: $0$', { w: 90, size: 15, fill: 'var(--pal-ink)' });
    svgLabel(svg, W / 2, 16, S1 === 0 ? 'the check is $0$: the code is valid' : 'grey: the valid value $0$ is at the left; amber: the new check $' + S1 + '$', { w: W - 10, size: 15, fill: 'var(--pal-ink)', bg: S1 === 0 ? null : 'var(--pal-amber-bg)' });
    svgLabel(svg, W / 2, H - 14, 'Every cell is a check value mod 37. A change must land in another cell.', { w: W - 10, size: 14, fill: 'var(--pal-muted)' });
    return null;
  };
  let plotCtl = null;
  function redraw() {
    const S1 = S37(xs);
    sl.forEach((s, i) => { if (+s.input.value !== xs[i]) s.set(xs[i]); });
    rS.set('$' + S1 + '$');
    rV.set(S1 === 0 ? 'yes' : 'no: error caught');
    if (plotCtl) plotCtl.redraw();
  }
  plotCtl = proofLeft(widget, {
    controls: [hh('div', 'sliders', ...sl.map(s => s.el)), prow(bChange, bSwap, bReset)],
    draw: drawMod,
    legend: [{ chip: true, color: 'var(--pal-grey)', text: 'grey: the valid value $0$ before the change' }, { chip: true, color: 'var(--pal-amber-bg)', text: 'amber: the check after the change' }],
    readouts: [rS, rV],
    tests: [
      String.raw`Change $x_3$ by $+1$ and read the check. Then swap $x_2$ and $x_3$ and read it again.`,
      'Every change tried gives a nonzero check. A few cases are evidence, not proof.'],
    model: String.raw`the check is a point on a ring of $37$ cells. A valid code sits at cell $0$; an error moves it to another cell.` });
  redraw();
  proofRight(side, {
    id: 'mod-37',
    goal: { tex: String.raw`S=\sum_k k\,x_k \bmod 37 = 0 \text{ for a valid code}`,
      words: String.raw`One change, or a swap of two symbols, makes $S\ne0$.` },
    facts: [
      { words: String.raw`$37$ is prime: its only divisors are $1$ and $37$.` }],
    lines: [
      { tex: String.raw`\text{change } x_j \text{ by } d,\ d\ne0 \text{ mod } 37`, move: 'Name a piece', choices: ['Change variables', 'Use symmetry'],
        why: 'one symbol changes; $d$ is the change and $j$ its weight', highlight: 'change' },
      { tex: String.raw`S'-S=j\,d`, move: 'Rearrange', choices: ['Compute it two ways', 'Telescope'],
        why: 'only the term with weight $j$ moves', highlight: 'change' },
      { tex: String.raw`37\nmid j\,d`, move: 'Contradiction', choices: ['Compare or bound', 'Induction'],
        why: 'if $37\\mid jd$ then $37\\mid j$ or $37\\mid d$ (prime); neither holds', highlight: 'change' },
      { tex: String.raw`\text{swap } x_i=a,\ x_j=b\ (i<j):\ S'-S=(j-i)(a-b)`, move: 'Rearrange', choices: ['Name a piece', 'Change variables'],
        why: 'the two weights swap places; the difference is $(j-i)(a-b)$', highlight: 'swap' },
      { tex: String.raw`37\nmid (j-i)(a-b)\ \text{ when } 0<j-i<37,\ a\ne b`, move: 'Contradiction', choices: ['Compare or bound', 'Induction'],
        why: 'the same prime argument: $j-i$ and $a-b$ are not multiples of $37$', highlight: 'swap' }],
    lookBack: [
      { q: 'Why must the modulus be prime?',
        a: String.raw`With modulus $6$, weight $2$ and change $3$ give $2\cdot3=6\equiv0$: the error is missed. Prime $37$ leaves no such pair.` },
      { q: 'How do you compute $S$ with additions only?',
        a: 'Running sums: add the symbols one at a time, then add those totals (31:40). ISBN-10 does the same with mod $11$ and $X$ for $10$.' }] }, plotCtl, key => { lit = key || ''; plotCtl.redraw(); });
  side.append(fxLine(String.raw`$S=\sum_{k} k\,x_k \bmod 37$`));
}

// ---------- frame ----------
const SLIDES = [
  { id: 'huffman', kind: 'content', tag: 'Lecture 03:12 to 05:52', title: 'Merge the two least likely, then split back',
    question: 'How do you find the best code when you know each symbol\'s probability?',
    symbols: String.raw`$p_i$: probability of symbol $i$. $l_i$: length of its code word. $L$: the average length. Hamming's case: $0.4,\ 0.2,\ 0.2,\ 0.1,\ 0.1$.`,
    mount: slideHuffman },
  { id: 'huffman-optimal', kind: 'proof', tag: 'Lecture 01:34 to 05:52', title: 'Why likely symbols get short codes',
    question: 'If a code gives a likely symbol the longer word, can the code be optimal?',
    symbols: String.raw`$m$, $m+1$: two neighbours in the order of probability. $L'$: the average after the swap. Look at the two terms that change.`,
    mount: slideHuffmanOptimal },
  { id: 'low-variance', kind: 'content', tag: 'Lecture 08:33 to 10:05', title: 'Equal averages, different spread',
    question: 'Two merge choices give the same $L$. Which code is easier to live with?',
    symbols: String.raw`Variance of the lengths: how far the word lengths spread around the average $L$. Short spread: messages have a predictable length.`,
    mount: slideLowVariance },
  { id: 'white-noise', kind: 'content', tag: 'Lecture 20:39 to 23:45', title: 'How many bits will be wrong in one block?',
    question: 'If each bit is wrong with probability $p$, independently, what is the chance of $0$, $1$, or $2$ errors in $n$ bits?',
    mount: slideWhiteNoise },
  { id: 'parity-and-2-of-5', kind: 'content', tag: 'Lecture 18:34 to 24:49', title: 'One parity bit, and the 2-out-of-5 code',
    question: 'How can a code notice an error without knowing where it is?',
    mount: slideParity },
  { id: 'mod-37', kind: 'proof', tag: 'Lecture 29:33 to 33:12 (running sums 31:40)', title: 'The weighted check that catches one change',
    question: 'Can one weighted sum mod 37 catch the mistakes people make when they type a code?',
    symbols: String.raw`$x_k$: symbol $k$, value $0$ to $36$. $k$: its weight. $S$: the check, $0$ for a valid code.`,
    mount: slideMod37 }
];

let cur = 0, shownId = null, endSent = false;
function goTo(i) {
  PLOTS = [];
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  if (shownId !== null && shownId !== s.id) emit('view.step', { step: s.id });
  shownId = s.id;
  const stage = $('#stage');
  stage.innerHTML = '';
  const widget = h('div', 'widget');
  const side = h('div', 'side');
  side.append(h('div', 'tag', s.tag), setTex(h('h2'), s.title));
  side.append(setTex(h('p', 'question'), s.question));
  if (s.symbols) side.append(sym(s.symbols));
  const cls = 'slide' + (s.kind === 'proof' ? ' proof-slide' : '');
  const sec = mark(h('section', cls), 'step', s.id, s.title.replace(/\$/g, ''));
  sec.append(widget, side);
  stage.append(sec);
  stage.scrollTop = 0;
  s.mount(widget, side);
  // On a content slide the takeaway is dimmed until the reader has tried a control.
  const tk = s.kind === 'content' ? side.querySelector('.takeaway') : null;
  if (tk) {
    tk.classList.add('dim');
    const openTk = () => tk.classList.remove('dim');
    sec.addEventListener('input', openTk);
    sec.addEventListener('click', e => { if (e.target.closest('[data-item="control"],[data-item="preset"]')) openTk(); });
    sec.addEventListener('pointerdown', e => { if (e.target.closest('[data-item="control"]')) openTk(); });
  }
  tex(sec);
  if (cur === SLIDES.length - 1 && !endSent) { endSent = true; emit('view.action', { action: 'deck-end' }); }
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, k) => d.classList.toggle('on', k === cur));
}
// A cue is a state: go to that step, do nothing if it is shown.
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i < 0) return;
  if (i !== cur) goTo(i);
}
(function init() {
  const dots = $('#dots');
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = s.title.replace(/\$/g, '');
    b.addEventListener('click', () => goTo(i));
    dots.appendChild(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],textarea,select')) return;
    if (e.target && e.target.classList && e.target.classList.contains('opt') && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault(); e.target.click(); return;
    }
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
})();
</script>

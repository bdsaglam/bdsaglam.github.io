<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primer · Vectors</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../../components/theme.js"></script>
<style>
/* Colors: white page, one accent (blue). Grey for other arrows, black for the sum, red only for a failed check. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft); --red:var(--pal-red);
  --u:clamp(16px,1.35vw,20px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 24px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(6px,1vh,12px) 24px}
footer{display:flex;align-items:center;gap:10px;padding:8px 24px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Slide frame: widget on the left (3/5), text on the right (2/5). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(18px,2.4vw,40px)}
.widget{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(4px,0.8vh,8px);padding-bottom:6px;overflow:hidden}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(6px,1.1vh,12px);overflow:hidden}
.tag{font:13px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(20px,1.9vw,28px);line-height:1.2;margin:0;font-weight:650}
.question{margin:0;font-size:clamp(16px,1.3vw,18px);font-weight:600}
.formula{font-size:clamp(18px,1.8vw,26px)}
.formula.small{font-size:clamp(16px,1.5vw,21px)}
.formulas{display:flex;flex-direction:column;gap:2px}
.formula .katex-display,.formulas .katex-display{margin:.2em 0}
.sym{margin:0;font-size:16px;color:var(--muted)}
.name i{font-style:italic}
.tries{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.tries li::marker{color:var(--accent);font-weight:600}
.where{margin:0;font-size:16px}
.takeaway{margin:0;padding:10px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}

/* Controls and readouts */
.sliders{display:flex;gap:8px 24px;flex-wrap:wrap;width:100%;align-items:center}
.sliders.tight{gap:6px 16px}
.slide-ctl{display:flex;align-items:center;gap:8px;font-size:16px}
.slide-ctl input{width:clamp(120px,11vw,170px);vertical-align:middle;accent-color:var(--accent)}
.slide-ctl .val{min-width:52px}
.btn{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--pal-panel);border-radius:8px;cursor:pointer;font-size:16px}
.btn.on{background:var(--chip);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btnrow .btn{padding:3px 10px}
.readouts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.readout{flex:1 1 130px;min-width:0;padding:4px 8px;border-radius:10px;background:var(--pal-soft);font-size:15px;overflow-wrap:anywhere}
.readout .k{color:var(--muted);font-size:14px}
.readout .val{font-size:16px;font-weight:600}
.readout.bad .val{color:var(--red)}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:15px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:20px;height:0;vertical-align:middle;margin-right:6px}
.chip{display:inline-block;width:18px;height:12px;vertical-align:middle;margin-right:6px;border-radius:2px}

/* The plot takes the height left in the widget column */
.fill{flex:1 1 0;min-height:80px;position:relative;width:100%}
.fill>svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* Proof slides: test and picture on the left, the proof (fl-proof-steps) on the right */
.slide.proof-slide{grid-template-columns:minmax(0,11fr) minmax(0,9fr)}
.slide.proof-slide .side{justify-content:flex-start}
.slide.proof-slide .fill{min-height:100px}
.slide.proof-slide .slide-ctl input{width:clamp(90px,8vw,130px)}
.slide.proof-slide .slide-ctl .val{min-width:40px}
.slide.proof-slide .sliders{gap:6px 18px}
.slide.proof-slide .legend{gap:4px 12px}
.part{margin:0;font-weight:600;color:var(--muted)}
.test{display:flex;flex-direction:column;gap:3px}
.test .tries{gap:3px}
.model{margin:0;padding:8px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}
.sliders.narrow{gap:6px 14px}
.sliders.narrow .slide-ctl input,.slide.proof-slide .sliders.narrow .slide-ctl input{width:clamp(64px,6vw,96px)}
.sliders.narrow .slide-ctl .val,.slide.proof-slide .sliders.narrow .slide-ctl .val{min-width:22px}

/* Short windows (1100x620 and similar): tighter spacing, body text stays 16px */
@media (max-height: 680px){
  header{padding-top:4px}
  #stage{padding:4px 24px}
  footer{padding:4px 24px}
  .widget{gap:5px}
  .side{gap:4px}
  .tries{gap:3px}
  .sym,.where,.tries{line-height:1.25}
  .readout{padding:3px 8px}
  .takeaway{padding:6px 10px}
  .model{padding:5px 10px}
  .formula{font-size:20px}
  h2{font-size:20px}
  .fill{min-height:110px}
  .slide.proof-slide .fill{min-height:90px}
}
</style>
</head>
<body>
<header>Primer · Vectors, dot products, distances</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script src="../../components/proof-steps.js"></script>
<script>
// ---------- DOM and drawing helpers ----------
const $ = s => document.querySelector(s);

// ---------- palette and redraw ----------
// COL holds the palette colors for the SVG being drawn: a plot re-reads it at every paint, and the slide
// re-reads it when it is shown. A theme switch redraws the plots and keeps every control's state.
let COL = {};
const PAL_NAMES = ['accent', 'amber', 'amber-bg', 'blue-light', 'blue-strong', 'grey', 'grid', 'bg', 'ink', 'muted', 'red', 'text-3', 'slate-2', 'slate-3', 'slate-4', 'text-2'];
function readPalette() {
  const o = {};
  for (const n of PAL_NAMES) o[n.replace(/-(\w)/g, (_, c) => c.toUpperCase())] = FluidTheme.color(n);
  return o;
}
let PLOTS = [];   // the plots on the current slide
window.addEventListener('fluid-themechange', () => { COL = readPalette(); PLOTS.forEach(p => p.redraw()); });
const NSV = 'http://www.w3.org/2000/svg', NHT = 'http://www.w3.org/1999/xhtml';
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false } ], throwOnError: false };
// Render $...$ and $$...$$ in a node. If the CDN did not load, the text stays as typed.
function tex(node) {
  if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH);
  return node;
}
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function hh(tag, cls, ...kids) {
  const e = h(tag, cls);
  for (const k of kids) if (k) e.append(k);
  return e;
}
function mark(e, kind, id, title) {
  e.dataset.item = kind;
  if (id != null) e.dataset.id = id;
  if (title != null) e.dataset.title = title;
  return e;
}
function svgNode(tag, attrs, parent) {
  const e = document.createElementNS(NSV, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function svgRoot(w, ht) {
  return svgNode('svg', { viewBox: '0 0 ' + w + ' ' + ht, role: 'img', 'font-family': 'system-ui, sans-serif', 'font-size': 14 });
}
function svgText(parent, x, y, s, attrs) {
  const t = svgNode('text', Object.assign({ x: x, y: y, fill: COL.muted }, attrs || {}), parent);
  t.textContent = s;
  return t;
}
// A KaTeX label over an SVG: a foreignObject holding a rendered formula. o.bg gives it a background.
function svgTex(parent, x, y, s, o) {
  o = o || {};
  const w = o.w || 220, ht = 26, anchor = o.anchor || 'middle';
  const x0 = anchor === 'end' ? x - w : anchor === 'start' ? x : x - w / 2;
  const fo = svgNode('foreignObject', { x: x0, y: y - ht / 2, width: w, height: ht }, parent);
  const d = document.createElementNS(NHT, 'div');
  const jc = anchor === 'end' ? 'flex-end' : anchor === 'start' ? 'flex-start' : 'center';
  d.setAttribute('style', 'display:flex;align-items:center;height:100%;white-space:nowrap;font-size:' +
    (o.size || 15) + 'px;color:' + (o.fill || COL.text2) + ';justify-content:' + jc);
  const span = document.createElementNS(NHT, 'span');
  span.textContent = s;
  if (o.bg) span.setAttribute('style', 'background:' + o.bg + ';border-radius:5px;padding:1px 6px');
  d.appendChild(span);
  fo.appendChild(d);
  tex(span);
  return fo;
}
// Same label with a white halo, so it reads over a line or a shape.
function haloTex(parent, x, y, s, o) {
  const fo = svgTex(parent, x, y, s, o);
  fo.firstChild.style.textShadow = '0 0 3px ' + COL.bg + ', 0 0 3px ' + COL.bg + ', 0 0 2px ' + COL.bg;
  return fo;
}
// A labelled range input. label is LaTeX-ready text; fmt gives the value text.
function slider(label, o) {
  const wrap = h('label', 'slide-ctl');
  const lab = tex(h('span', '', label));
  const val = h('span', 'val', '');
  const inp = h('input');
  inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step; inp.value = o.value;
  mark(inp, 'control', o.id, o.name || o.id);
  wrap.append(lab, inp, val);
  const fmt = o.fmt || String;
  const api = {
    el: wrap,
    input: inp,
    get value() { return +inp.value; },
    set(v) { inp.value = v; api.show(); },
    show() { setTex(val, fmt(+inp.value)); },
  };
  inp.addEventListener('input', () => { api.show(); if (o.onInput) o.onInput(+inp.value); });
  api.show();
  return api;
}
// A readout box: label and value are LaTeX-ready text.
function readout(id, label) {
  const box = mark(h('div', 'readout'), 'readout', id);
  const k = h('div', 'k');
  setTex(k, label);
  const v = h('div', 'val');
  box.append(k, v);
  return { el: box, set(text) { setTex(v, text); }, label(text) { setTex(k, text); } };
}
// A legend: each item says what its mark means. dash: dashed line; chip: filled square.
function legend(items) {
  const d = h('div', 'legend');
  for (const it of items) {
    const s = h('span');
    const sw = it.chip ? h('span', 'chip') : h('span', 'sw');
    if (it.chip) sw.style.background = it.color;
    else sw.style.borderTop = '2px ' + (it.dash ? 'dashed' : 'solid') + ' ' + it.color;
    if (it.dotted) sw.style.borderTop = '3px dotted ' + it.color;
    const t = h('span');
    setTex(t, it.text);
    s.append(sw, t);
    d.appendChild(s);
  }
  return d;
}
// A plot that takes the height left in its box. draw(svg, W, H) runs on every resize and on redraw().
function fillPlot(box, draw) {
  const wrap = h('div', 'fill');
  box.append(wrap);
  let key = '';
  const paint = force => {
    const w = Math.floor(wrap.clientWidth), ht = Math.floor(wrap.clientHeight);
    if (w < 60 || ht < 60) return;
    if (!force && key === w + 'x' + ht) return;
    key = w + 'x' + ht;
    COL = readPalette();
    const svg = svgRoot(w, ht);
    draw(svg, w, ht);
    wrap.replaceChildren(svg);
    tex(svg);
  };
  new ResizeObserver(() => paint(false)).observe(wrap);
  const plot = { redraw: () => paint(true) };
  PLOTS.push(plot);
  return plot;
}
// Session events. Optional: with no bridge, nothing is sent.
function emit(kind, data) {
  try {
    if (window.fluid && typeof window.fluid.emit === 'function') Promise.resolve(window.fluid.emit(kind, data)).catch(() => {});
  } catch (e) { /* the view works without the bridge */ }
}
function sym(text) { return setTex(h('p', 'sym'), text); }
// "Names that explain": the word in italics, then how its name points at the idea.
function nameLine(html) { const p = h('p', 'sym name'); p.innerHTML = html; return tex(p); }
function triesList(items) { return hh('ol', 'tries', ...items.map(t => setTex(h('li'), t))); }
function takeLine(text) { return setTex(h('p', 'takeaway'), text); }
function whereLine(text) { return setTex(h('p', 'where'), text); }
const fmt2 = x => (Math.abs(x) < 0.005 ? 0 : x).toFixed(2);

// ---------- plane geometry (2D plots) ----------
// Maps math coordinates to pixels: x and y from -R to R, the square fits the box below `top`.
function plane(svg, W, H, R, top) {
  const L = 14, Rm = 14, T = top || 14, B = 14;
  const pw = W - L - Rm, ph = H - T - B;
  const s = Math.min(pw, ph) / (2 * R);
  const cx = L + pw / 2, cy = T + ph / 2;
  const X = x => cx + x * s, Y = y => cy - y * s;
  for (let i = -Math.floor(R); i <= Math.floor(R); i++) {
    const c = i === 0 ? COL.grey : COL.grid;
    svgNode('line', { x1: X(i), y1: Y(-R), x2: X(i), y2: Y(R), stroke: c }, svg);
    svgNode('line', { x1: X(-R), y1: Y(i), x2: X(R), y2: Y(i), stroke: c }, svg);
  }
  svgTex(svg, X(R) - 4, Y(0) + 16, '$x_1$', { w: 40, anchor: 'end', size: 15 });
  svgTex(svg, X(0) + 12, Y(R) + 12, '$x_2$', { w: 40, anchor: 'start', size: 15 });
  return { X, Y, s, R };
}
// The same with its own x and y ranges (one scale for both), clipped to the window: draw into the returned g.
let clipCount = 0;
function planeXY(svg, W, H, b, top) {
  const L = 14, Rm = 14, T = top || 14, B = 14;
  const pw = W - L - Rm, ph = H - T - B;
  const s = Math.min(pw / (b.x1 - b.x0), ph / (b.y1 - b.y0));
  const ox = L + (pw - s * (b.x1 - b.x0)) / 2 - s * b.x0, oy = T + (ph - s * (b.y1 - b.y0)) / 2 + s * b.y1;
  const X = x => ox + x * s, Y = y => oy - y * s;
  for (let i = Math.ceil(b.x0); i <= Math.floor(b.x1); i++)
    svgNode('line', { x1: X(i), y1: Y(b.y0), x2: X(i), y2: Y(b.y1), stroke: i === 0 ? COL.grey : COL.grid }, svg);
  for (let j = Math.ceil(b.y0); j <= Math.floor(b.y1); j++)
    svgNode('line', { x1: X(b.x0), y1: Y(j), x2: X(b.x1), y2: Y(j), stroke: j === 0 ? COL.grey : COL.grid }, svg);
  svgTex(svg, X(b.x1) - 4, Y(0) + 16, '$x_1$', { w: 40, anchor: 'end', size: 15 });
  svgTex(svg, X(0) + 8, Y(b.y1) + 12, '$x_2$', { w: 40, anchor: 'start', size: 15 });
  const id = 'clip-' + (++clipCount);
  const cp = svgNode('clipPath', { id: id }, svgNode('defs', {}, svg));
  svgNode('rect', { x: X(b.x0), y: Y(b.y1), width: s * (b.x1 - b.x0), height: s * (b.y1 - b.y0) }, cp);
  const g = svgNode('g', { 'clip-path': 'url(#' + id + ')' }, svg);
  return { X, Y, s, g, b };
}
// An arrow from (x0, y0) to (x, y) in math coordinates (from the origin when o.from is not given).
function arrow(svg, P, x, y, o) {
  const f = o.from || [0, 0];
  const x0 = P.X(f[0]), y0 = P.Y(f[1]), x1 = P.X(x), y1 = P.Y(y);
  const len = Math.hypot(x1 - x0, y1 - y0);
  if (len < 4) return;
  const ux = (x1 - x0) / len, uy = (y1 - y0) / len, hl = Math.min(12, len * 0.6), hw = hl / 2;
  const attrs = { x1: x0, y1: y0, x2: x1 - ux * hl, y2: y1 - uy * hl, stroke: o.color, 'stroke-width': o.w || 3, 'data-item': 'mark', 'data-id': o.id };
  if (o.dash) attrs['stroke-dasharray'] = o.dash;
  svgNode('line', attrs, svg);
  const pts = [[x1, y1], [x1 - ux * hl - uy * hw, y1 - uy * hl + ux * hw], [x1 - ux * hl + uy * hw, y1 - uy * hl - ux * hw]];
  svgNode('polygon', { points: pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '), fill: o.color, 'data-item': 'mark', 'data-id': o.id + '-head' }, svg);
}
// A plain segment between two math points.
function seg(svg, P, x0, y0, x1, y1, o) {
  const attrs = { x1: P.X(x0), y1: P.Y(y0), x2: P.X(x1), y2: P.Y(y1), stroke: o.color, 'stroke-width': o.w || 2, 'data-item': 'mark', 'data-id': o.id || 'segment' };
  if (o.dash) attrs['stroke-dasharray'] = o.dash;
  return svgNode('line', attrs, svg);
}
// Draws the angle between two directions a and b, at the point `at`, as an arc of radius r (in units).
function angleArc(svg, P, a, b, r, at) {
  const o = at || [0, 0];
  const na = Math.hypot(a[0], a[1]), nb = Math.hypot(b[0], b[1]);
  if (na < 1e-9 || nb < 1e-9) return;
  const ua = [a[0] / na, a[1] / na], ub = [b[0] / nb, b[1] / nb];
  const cross = ua[0] * ub[1] - ua[1] * ub[0];
  const p1 = [P.X(o[0] + r * ua[0]), P.Y(o[1] + r * ua[1])], p2 = [P.X(o[0] + r * ub[0]), P.Y(o[1] + r * ub[1])];
  const rp = r * P.s, sweep = cross > 0 ? 0 : 1;
  return svgNode('path', { d: 'M' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1) + ' A' + rp.toFixed(1) + ' ' + rp.toFixed(1) +
    ' 0 0 ' + sweep + ' ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1), fill: 'none', stroke: COL.ink, 'stroke-width': 1.5,
    'data-item': 'mark', 'data-id': 'angle-arc' }, svg);
}

// ---------- proofs: shared parts ----------
// Amber marks what the newest proof line is about, in the picture and in the proof.
function glowLine(svg, x0, y0, x1, y1, w) {
  return svgNode('line', { x1: x0.toFixed(1), y1: y0.toFixed(1), x2: x1.toFixed(1), y2: y1.toFixed(1), stroke: COL.amberBg, 'stroke-width': w || 12, 'stroke-linecap': 'round' }, svg);
}
function glowSeg(svg, P, x0, y0, x1, y1, w) { return glowLine(svg, P.X(x0), P.Y(y0), P.X(x1), P.Y(y1), w); }
function glowPoly(svg, pts) {
  return svgNode('polygon', { points: pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '), fill: COL.amberBg, 'fill-opacity': .9, stroke: COL.amber, 'stroke-width': 1.5 }, svg);
}
function glowDot(svg, x, y, r) { return svgNode('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: r || 12, fill: COL.amberBg, stroke: COL.amber, 'stroke-width': 1.5 }, svg); }
function glowArc(svg, P, a, b, r, at) {
  const arc = angleArc(svg, P, a, b, r, at);
  if (arc) { arc.setAttribute('stroke', COL.amberBg); arc.setAttribute('stroke-width', 12); arc.removeAttribute('data-item'); }
}
// While a proof line is lit, a caption in the picture's top row says what the amber part is.
function litCaption(svg, W, text) { svgTex(svg, W / 2, 13, text, { w: W - 8, size: 15, fill: COL.ink, bg: COL.amberBg }); }
function plotTitle(svg, W, text) { svgTex(svg, W / 2, 13, text, { w: W - 8, size: 15, fill: COL.muted }); }
// A proof element. host: where the look-back questions appear once the proof is done.
function proofEl(spec, host, onLight, hint) {
  const el = document.createElement('fl-proof-steps');
  el.onEvent = d => emit('view.action', d);
  el.onHighlight = key => onLight(key);
  el.lookBackHost = host;
  el.lookBackHint = hint || 'Look back: under the picture.';
  el.data = spec;
  return el;
}
// Left column of a proof slide: controls, the picture, legend, readouts, the test, the mental model.
function proofLeft(widget, o) {
  if (o.controls && o.controls.length) widget.append(hh('div', 'sliders' + (o.cls ? ' ' + o.cls : ''), ...o.controls));
  const plot = fillPlot(widget, o.draw);
  widget.append(legend(o.legend));
  if (o.readouts && o.readouts.length) widget.append(hh('div', 'readouts', ...o.readouts.map(r => r.el)));
  const test = hh('div', 'test', h('p', 'part', 'Test it'), triesList(o.tests));
  const model = h('p', 'model');
  model.append(h('span', 'part', 'The picture: '), tex(h('span', '', o.model)));
  widget.append(test, model);
  plot.test = test;
  return plot;
}
// Right column: the proof. Each revealed line lights its part of the picture; once the proof is
// done, the look-back questions take the place of the test under the picture.
function proofRight(side, spec, plot, onLight, hint) {
  const el = proofEl(spec, plot.test, onLight, hint);
  side.append(el);
  return el;
}

// ---------- step 1: a vector is a list, and a point (with a two-line proof in the side column) ----------

  const plot = proofLeft(widget, {
    controls: ctl.map(c => c.el), cls: 'narrow',
    draw: (svg, W, H) => {

      if (lit === 'vu') { glowSeg(svg, P, 0, 0, v[0], v[1]); glowSeg(svg, P, v[0], v[1], s0, s1); }

      svgTex(svg, P.X(s0 + 0.45), P.Y(s1 + 0.25), '$u+v$', { w: 130, size: 17, fill: COL.ink });

      'Set $u=(3,1)$, a walk 3 km east and 1 km north, and $v=(1,2)$: the sum (solid arrow) ends at $(4,3)$. Change only $u_1$: only the first number of the sum moves.',
      'Follow the other dashed path, $v$ first: the same end. Always? A few cases are evidence, not proof.'],

    proofEl({

// ---------- step 2: the length of a vector ----------
function slideLength(widget, side) {
  const a = [3, 4, 0, 0];

    const sq = a.map(x => x * x), tot = sq.reduce((s, x) => s + x, 0);
    const L = 50, Rm = 20, T = 30, B = 52, base = H - B, ph = base - T;
    const ymax = Math.max(tot, 1) * 1.12;

    const slot = (W - L - Rm) / 5, bw = slot * 0.6;
    for (let i = 0; i < 5; i++) {

      const x = L + i * slot + (slot - bw) / 2, y = Y(val);
      svgNode('rect', { x: x.toFixed(1), y: y.toFixed(1), width: bw.toFixed(1), height: Math.max(0, base - y).toFixed(1),
        fill: i < 4 ? COL.grey : COL.accent, 'data-item': 'mark', 'data-id': i < 4 ? 'side-' + (i + 1) : 'total' }, svg);
      svgText(svg, x + bw / 2, y - 7, String(val), { 'text-anchor': 'middle', 'font-size': 15, fill: COL.ink });
      svgTex(svg, x + bw / 2, base + 22, i < 4 ? '$a_' + (i + 1) + '^2$' : '$d^2$', { w: 90, size: 16 });
    }
  });
  widget.append(hh('div', 'readouts', rD2.el, rD.el));
  widget.append(legend([
    { color: COL.grey, chip: true, text: '$a_i^2$: one square for each side' },
    { color: COL.accent, chip: true, text: '$d^2$: the total of the squares' }]));
  function update() {
    const tot = a.reduce((s, x) => s + x * x, 0), d = Math.sqrt(tot);
    rD2.set('$' + tot + '$');

  }

  side.append(
    sym('$a_i$: the length of side $i$. $d$: the diagonal, the length $|a|$ of the vector $a$ from 0 to the far corner. Example: a box with sides $3$, $4$, $12$ has a diagonal of $13$. Why: step 3.'),
    nameLine('<i>diagonal</i>: Greek <i>dia</i>, across, and <i>gōnia</i>, angle: the line across the box from corner to corner.'),
    triesList([
      'Start with sides $3, 4, 0, 0$. The diagonal is $5$.',
      'Set $a_3=12$. The third bar is $144$ tall, and $d=13$.',
      'Set $a_4=1$. The total goes from $169$ to $170$, so $d$ grows only to about $13.04$.']),
    takeLine('Each side adds its square, and the length is the square root of the total.'));

// ---------- step 3: why the length is the square root of the sum of squares (proof) ----------
// The box with sides a1 (right), a2 (into the page), a3 (up), and its two right triangles laid flat.
function drawBox(svg, W, H, a, lit) {
  const [a1, a2, a3] = a, d2 = Math.hypot(a1, a2), d3 = Math.hypot(d2, a3);
  const CAP = {
    names: 'amber: $d_2$ crosses the floor, $d_3$ the whole box',
    floor: 'amber: the floor triangle, legs $a_1$ and $a_2$, long side $d_2$',
    stand: 'amber: the standing triangle, legs $d_2$ and $a_3$, long side $d_3$',
    step: 'amber: each new side stands at right angles on the last diagonal',
    root: 'amber: the long diagonal, $d_3=\\sqrt{a_1^2+a_2^2+a_3^2}$' }[lit];
  if (CAP) litCaption(svg, W, CAP);
  else plotTitle(svg, W, 'the box, then its two right triangles laid flat');
  const top = 34, bot = 30, kx = 0.433, ky = 0.25;   // depth: half a unit per unit, drawn at 30 degrees
  const bw = a1 + kx * a2, bh = a3 + ky * a2;
  const needW = Math.max(bw + a1 + d2, 0.1), needH = Math.max(bh, a2, a3, 0.1);
  const s = Math.min(70, (W - 250) / needW, (H - top - bot) / needH);
  const total = s * needW + 230, x0 = Math.max(16, (W - total) / 2 + 16), y0 = H - bot;
  const Pb = (x, y, z) => [x0 + s * (x + kx * y), y0 - s * (z + ky * y)];
  const line = (p, q, o) => svgNode('line', Object.assign({ x1: p[0].toFixed(1), y1: p[1].toFixed(1), x2: q[0].toFixed(1), y2: q[1].toFixed(1), stroke: COL.grey, 'stroke-width': 1.5 }, o || {}), svg);
  const O = Pb(0, 0, 0), A = Pb(a1, 0, 0), B = Pb(a1, a2, 0), C = Pb(0, a2, 0);
  const O2 = Pb(0, 0, a3), A2 = Pb(a1, 0, a3), B2 = Pb(a1, a2, a3), C2 = Pb(0, a2, a3);
  // flat triangles: the floor (a1 across, a2 up) and the standing one (d2 across, a3 up)
  const xf = x0 + s * bw + 78, xs = xf + s * a1 + 82;
  const F = [[xf, y0], [xf + s * a1, y0], [xf + s * a1, y0 - s * a2]];
  const S = [[xs, y0], [xs + s * d2, y0], [xs + s * d2, y0 - s * a3]];
  if (lit === 'floor') { glowPoly(svg, [O, A, B]); glowPoly(svg, F); }
  if (lit === 'stand' || lit === 'step') { glowPoly(svg, [O, B, B2]); glowPoly(svg, S); }
  if (lit === 'names') { glowLine(svg, O[0], O[1], B[0], B[1], 10); glowLine(svg, O[0], O[1], B2[0], B2[1], 10);
    glowLine(svg, F[0][0], F[0][1], F[2][0], F[2][1], 10); glowLine(svg, S[0][0], S[0][1], S[2][0], S[2][1], 10); }
  if (lit === 'root') { glowLine(svg, O[0], O[1], B2[0], B2[1], 12); glowLine(svg, S[0][0], S[0][1], S[2][0], S[2][1], 12); }
  // box edges: the three at the hidden back corner C are dashed
  for (const [p, q] of [[O, A], [A, B], [O, O2], [A, A2], [B, B2], [O2, A2], [A2, B2], [B2, C2], [C2, O2]]) line(p, q, { 'data-item': 'mark', 'data-id': 'edge' });
  for (const [p, q] of [[O, C], [C, B], [C, C2]]) line(p, q, { 'stroke-dasharray': '4 4', 'stroke-width': 1 });
  line(O, A, { stroke: COL.text3, 'stroke-width': 2.5 }); line(A, B, { stroke: COL.text3, 'stroke-width': 2.5 }); line(B, B2, { stroke: COL.text3, 'stroke-width': 2.5 });
  line(O, B, { stroke: COL.slate4, 'stroke-width': 2.5, 'stroke-dasharray': '7 4', 'data-item': 'mark', 'data-id': 'd2' });
  line(O, B2, { stroke: COL.accent, 'stroke-width': 3, 'data-item': 'mark', 'data-id': 'd3' });
  const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
  if (a1 > 0) haloTex(svg, mid(O, A)[0], mid(O, A)[1] + 14, '$a_1$', { w: 40, size: 15 });
  if (a2 > 0) haloTex(svg, mid(A, B)[0] + 16, mid(A, B)[1] + 8, '$a_2$', { w: 40, size: 15, anchor: 'start' });
  if (a3 > 0) haloTex(svg, mid(B, B2)[0] + 8, mid(B, B2)[1], '$a_3$', { w: 40, size: 15, anchor: 'start' });
  if (d3 > 0) haloTex(svg, mid(O, B2)[0] - 8, mid(O, B2)[1] - 4, '$d_3$', { w: 40, size: 16, fill: COL.blueStrong, anchor: 'end' });
  if (d2 > 0 && a3 > 0) haloTex(svg, Pb(a1 * 0.62, a2 * 0.62, 0)[0] - 4, Pb(a1 * 0.62, a2 * 0.62, 0)[1] - 12, '$d_2$', { w: 40, size: 15, fill: COL.slate2, anchor: 'end' });
  // the flat triangles, with their right angles marked
  const tri = (T, c, labels, id) => {
    svgNode('polygon', { points: T.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '), fill: 'none', stroke: COL.grey, 'stroke-width': 2, 'data-item': 'mark', 'data-id': id }, svg);
    line(T[0], T[2], { stroke: c, 'stroke-width': 3 });
    if (T[1][0] - T[0][0] > 12 && T[1][1] - T[2][1] > 12)
      svgNode('path', { d: 'M' + (T[1][0] - 10) + ' ' + T[1][1] + ' L' + (T[1][0] - 10) + ' ' + (T[1][1] - 10) + ' L' + T[1][0] + ' ' + (T[1][1] - 10), fill: 'none', stroke: COL.ink, 'stroke-width': 1 }, svg);
    haloTex(svg, (T[0][0] + T[1][0]) / 2, T[0][1] + 13, labels[0], { w: 110, size: 15 });
    haloTex(svg, T[1][0] + 6, (T[1][1] + T[2][1]) / 2, labels[1], { w: 110, size: 15, anchor: 'start' });
    haloTex(svg, (T[0][0] + T[2][0]) / 2 - 6, (T[0][1] + T[2][1]) / 2 - 8, labels[2], { w: 120, size: 15, fill: c === COL.accent ? COL.blueStrong : COL.slate3, anchor: 'end' });
  };
  const n = x => Number.isInteger(x) ? String(x) : x.toFixed(2);
  tri(F, COL.slate4, ['$a_1=' + a1 + '$', '$a_2=' + a2 + '$', '$d_2=' + n(d2) + '$'], 'floor-triangle');
  tri(S, COL.accent, ['$d_2=' + n(d2) + '$', '$a_3=' + a3 + '$', '$d_3=' + n(d3) + '$'], 'standing-triangle');

function slideWhyLength(widget, side) {

// ---------- step 4: the dot product sees the angle ----------
function slideDot(widget, side) {
  const u = [3, 1], v = [1, 2];
  const sl = (label, arr, i, id) => slider(label, { id: id, name: id, min: -3, max: 3, step: 1, value: arr[i],
    onInput: x => { arr[i] = x; update(); } });
  const ctl = [sl('$u_1$', u, 0, 'u1'), sl('$u_2$', u, 1, 'u2'), sl('$v_1$', v, 0, 'v1'), sl('$v_2$', v, 1, 'v2')];
  const rDot = readout('dot', '$u\\cdot v$');
  const rNu = readout('norm-u', '$|u|$');
  const rNv = readout('norm-v', '$|v|$');
  const rCos = readout('cos', '$\\cos\\theta$');
  const rTh = readout('theta', '$\\theta$, the angle');
  widget.append(hh('div', 'sliders tight', ...ctl.map(c => c.el)));
  const plot = fillPlot(widget, (svg, W, H) => {
    const P = plane(svg, W, H, 4.5);
    arrow(svg, P, v[0], v[1], { color: COL.muted, id: 'v' });
    arrow(svg, P, u[0], u[1], { color: COL.accent, id: 'u' });
    angleArc(svg, P, u, v, 1.1);
    const nu = Math.hypot(u[0], u[1]), nv = Math.hypot(v[0], v[1]);
    if (nu > 0 && nv > 0) {
      const c = Math.max(-1, Math.min(1, (u[0] * v[0] + u[1] * v[1]) / (nu * nv)));
      const mid = Math.atan2(u[1], u[0]) + (Math.atan2(v[1], v[0]) - Math.atan2(u[1], u[0])) / 2;
      const th = Math.acos(c) * 180 / Math.PI;
      svgTex(svg, P.X(1.75 * Math.cos(mid)), P.Y(1.75 * Math.sin(mid)), '$' + th.toFixed(1) + '^\\circ$', { w: 90, size: 16, fill: COL.ink });
    }
    svgTex(svg, P.X(u[0] + 0.4), P.Y(u[1] - 0.25), '$u$', { w: 60, size: 17, fill: COL.accent });
    svgTex(svg, P.X(v[0] + 0.4), P.Y(v[1] + 0.2), '$v$', { w: 60, size: 17, fill: COL.text3 });
  });
  const cubes = [2, 3, 10, 100].map(n => readout('cube-' + n, '$n=' + n + '$ cube diagonal'));
  cubes.forEach((c, i) => {
    const n = [2, 3, 10, 100][i];
    const cs = 1 / Math.sqrt(n), deg = Math.acos(cs) * 180 / Math.PI;
    c.set('$\\cos\\theta=' + cs.toFixed(3) + '$, $' + deg.toFixed(1) + '^\\circ$');
  });
  widget.append(hh('div', 'readouts', rDot.el, rNu.el, rNv.el, rCos.el, rTh.el));
  widget.append(hh('div', 'readouts', ...cubes.map(c => c.el)));
  widget.append(legend([
    { color: COL.accent, text: '$u$: blue arrow' },
    { color: COL.muted, text: '$v$: grey arrow' },
    { color: COL.ink, text: 'arc: the angle $\\theta$' }]));
  function update() {
    const dot = u[0] * v[0] + u[1] * v[1];
    const nu = Math.hypot(u[0], u[1]), nv = Math.hypot(v[0], v[1]);
    rDot.set('$' + dot + '$');
    rNu.set('$' + nu.toFixed(2) + '$');
    rNv.set('$' + nv.toFixed(2) + '$');
    if (nu > 0 && nv > 0) {
      const c = Math.max(-1, Math.min(1, dot / (nu * nv)));
      rCos.set('$' + c.toFixed(3) + '$');
      rTh.set('$' + (Math.acos(c) * 180 / Math.PI).toFixed(1) + '^\\circ$');
    } else {
      rCos.set('$\\text{undefined}$');
      rTh.set('$\\text{undefined}$');
    }
    plot.redraw();
  }
  update();

  side.append(
    setTex(h('div', 'formula'), '$$u\\cdot v=\\sum_i u_i v_i=|u|\\,|v|\\cos\\theta$$'),
    sym('$u\\cdot v$: the dot product; multiply number by number, then add. $\\theta$: the angle between the arrows. Example: $(3,1)\\cdot(1,2)=3+2=5$. Why it holds: step 5. The cube diagonals: step 6.'),
    triesList([
      'Read the angle for $u=(3,1)$, $v=(1,2)$: $45^\\circ$.',

    takeLine('Dot product zero means the two vectors are perpendicular.'));
}

// ---------- step 5: why the dot product is |u||v| cos theta (proof) ----------
function drawDotProof(svg, W, H, u, v, lit) {
  const CAP = {
    side: 'amber: the third side, from the tip of $v$ to the tip of $u$: the arrow $u-v$',
    legs: 'amber: $D$ by Pythagoras, legs $u_1-v_1$ and $u_2-v_2$',
    expand: 'amber: $D^2$ written with $|u|^2$, $|v|^2$ and $u\\cdot v$',
    angle: 'amber: the same triangle, by its two sides and the angle $\\theta$',
    both: 'amber: two ways to write $D^2$' }[lit];
  if (CAP) litCaption(svg, W, CAP);
  const P = plane(svg, W, H, 3.6, 28);
  const nu = Math.hypot(u[0], u[1]), nv = Math.hypot(v[0], v[1]);
  if (lit === 'side' || lit === 'legs' || lit === 'expand' || lit === 'both') glowSeg(svg, P, v[0], v[1], u[0], u[1]);
  if (lit === 'expand' || lit === 'angle') { glowSeg(svg, P, 0, 0, u[0], u[1]); glowSeg(svg, P, 0, 0, v[0], v[1]); }
  if (lit === 'angle' || lit === 'both') glowArc(svg, P, u, v, 1.1);
  if (lit === 'legs') {
    glowSeg(svg, P, v[0], v[1], u[0], v[1], 9); glowSeg(svg, P, u[0], v[1], u[0], u[1], 9);
    seg(svg, P, v[0], v[1], u[0], v[1], { color: COL.ink, w: 1.5, dash: '2 3', id: 'leg-1' });
    seg(svg, P, u[0], v[1], u[0], u[1], { color: COL.ink, w: 1.5, dash: '2 3', id: 'leg-2' });
    if (Math.abs(u[0] - v[0]) > 0.4) haloTex(svg, P.X((u[0] + v[0]) / 2), P.Y(v[1]) + (u[1] > v[1] ? 14 : -14), '$u_1-v_1$', { w: 80, size: 14, fill: COL.ink });
    if (Math.abs(u[1] - v[1]) > 0.4) haloTex(svg, P.X(u[0]) + 6, P.Y((u[1] + v[1]) / 2), '$u_2-v_2$', { w: 80, size: 14, fill: COL.ink, anchor: 'start' });
  }
  seg(svg, P, v[0], v[1], u[0], u[1], { color: COL.ink, dash: '6 4', w: 2, id: 'third-side' });
  arrow(svg, P, v[0], v[1], { color: COL.muted, id: 'v' });
  arrow(svg, P, u[0], u[1], { color: COL.accent, id: 'u' });
  angleArc(svg, P, u, v, 1.1);
  if (nu > 0 && nv > 0) {
    const mid = Math.atan2(u[1], u[0]) + (Math.atan2(v[1], v[0]) - Math.atan2(u[1], u[0])) / 2;
    const r = Math.abs(Math.atan2(v[1], v[0]) - Math.atan2(u[1], u[0])) > Math.PI ? -1.6 : 1.6;
    haloTex(svg, P.X(r * Math.cos(mid)), P.Y(r * Math.sin(mid)), '$\\theta$', { w: 30, size: 16, fill: COL.ink });
  }
  const dx = u[0] - v[0], dy = u[1] - v[1], dl = Math.hypot(dx, dy);
  if (dl > 0.3) haloTex(svg, P.X((u[0] + v[0]) / 2 - 0.45 * dy / dl), P.Y((u[1] + v[1]) / 2 + 0.45 * dx / dl), '$D$', { w: 30, size: 16, fill: COL.ink });
  svgTex(svg, P.X(u[0] + 0.4), P.Y(u[1] - 0.25), '$u$', { w: 60, size: 17, fill: COL.accent });
  svgTex(svg, P.X(v[0] + 0.4), P.Y(v[1] + 0.2), '$v$', { w: 60, size: 17, fill: COL.text3 });
}

  proofRight(side, {

    facts: [

      { words: 'law of cosines: sides $a$, $b$ with the angle $\\theta$ between them; the third side $c$ has $c^2=a^2+b^2-2ab\\cos\\theta$', ref: 'Primer · Waves, step 11' }],
    lines: [

      { tex: 'D^2=\\sum\\nolimits_i (u_i-v_i)^2', move: 'Unfold the definition',
        why: 'a length squared is the sum of the squares of the numbers (step 3)', choices: ['Rearrange', 'Change variables'], highlight: 'legs' },
      { tex: 'D^2=|u|^2+|v|^2-2\\,u\\cdot v', move: 'Rearrange',
        why: 'expand $(u_i-v_i)^2=u_i^2-2u_iv_i+v_i^2$ and add over $i$: the three sums are $|u|^2$, $|v|^2$ and $2\\,u\\cdot v$', choices: ['Add zero or multiply by one', 'Telescope'], highlight: 'expand' },
      { tex: 'D^2=|u|^2+|v|^2-2\\,|u|\\,|v|\\cos\\theta', move: 'Use an earlier result',
        why: 'the law of cosines on the triangle $0$, $u$, $v$', choices: ['Unfold the definition', 'Compare or bound'], highlight: 'angle' },
      { tex: 'u\\cdot v=|u|\\,|v|\\cos\\theta', move: 'Compute it two ways',
        why: 'lines 3 and 4 are both $D^2$: set them equal; $|u|^2+|v|^2$ cancels, then divide by $-2$', choices: ['Undo with the inverse', 'Contradiction'], highlight: 'both' }],
    lookBack: [
      { q: 'Where does the law of cosines come from?',
        a: 'Primer · Waves, step 11 proved it for arrows tip to tail: $|a+b|^2=|a|^2+|b|^2+2|a||b|\\cos\\varphi$. Here the third side is $u+(-v)$, and $-v$ makes the angle $180^\\circ-\\theta$ with $u$, whose cosine is $-\\cos\\theta$.' },
      { q: 'What does $u\\cdot v=0$ say?',
        a: '$\\cos\\theta=0$, so $\\theta=90^\\circ$ when neither vector is $0$: dot product zero means perpendicular (step 4). The sign says more: $u\\cdot v>0$ means an angle under $90^\\circ$.' },
      { q: 'What about 10 or 100 dimensions?',
        a: 'No protractor reaches there, so $\\cos\\theta=u\\cdot v/(|u|\\,|v|)$ becomes the definition of the angle; the proof shows it is the angle you measure in 2 and 3 dimensions. Step 6 uses it.' }] },
    plot, key => { lit = key || ''; plot.redraw(); });
  function update() {
    const s = u[0] * v[0] + u[1] * v[1], nu = Math.hypot(u[0], u[1]), nv = Math.hypot(v[0], v[1]);
    rS.set('$' + s + '$');
    if (nu > 0 && nv > 0) {
      const th = Math.atan2(v[1], v[0]) - Math.atan2(u[1], u[0]);   // the drawn angle, not the dot product
      rM.set('$' + fmt2(nu * nv * Math.cos(th)) + '$');
    } else rM.set('$0$ (an arrow of length $0$)');
    rD.set('$' + ((u[0] - v[0]) ** 2 + (u[1] - v[1]) ** 2) + '$');
    plot.redraw();
  }
  update();
}

// ---------- step 6: why the cube diagonal has cos = 1/sqrt(n) (proof) ----------
function drawCube(svg, W, H, n, lit) {
  const CAP = {
    vectors: 'amber: the diagonal $\\mathbf 1$ and the axis direction $e_1$',
    dot: 'amber: $\\mathbf 1\\cdot e_1=1$, the part of the diagonal along axis 1',
    length: 'amber: the diagonal, length $\\sqrt n$ (step 3)',
    cos: 'amber: $\\cos\\theta$ is the part along the axis over the length',
    limit: 'amber: as $n$ grows, $\\theta$ climbs toward $90^\\circ$' }[lit];
  if (CAP) litCaption(svg, W, CAP);
  const top = 34, bot = 46, th = Math.acos(1 / Math.sqrt(n)), hgt = Math.sqrt(n - 1);
  // left: the right triangle 0, e1, 1 (base 1 along axis 1, the other n-1 sides together standing up)
  const Wl = Math.min(W * 0.42, 320), Hl = H - top - bot;
  const ox = Math.min(104, Wl * 0.34), oy = top + Hl;
  const s = Math.min(Wl - ox - 70, Hl / Math.max(hgt, 1));
  const tipX = ox + s, tipY = oy - s * hgt;
  if (!CAP) svgTex(svg, 8, 13, 'the triangle $0$, $e_1$, $\\mathbf 1$', { w: Wl, anchor: 'start', size: 15, fill: COL.muted });
  if (lit === 'vectors' || lit === 'dot') glowLine(svg, ox, oy, tipX, oy, 12);
  if (lit === 'vectors' || lit === 'length') glowLine(svg, ox, oy, tipX, tipY, 12);
  svgNode('line', { x1: ox, y1: oy, x2: ox + s + 56, y2: oy, stroke: COL.grey }, svg);
  svgTex(svg, ox + s + 58, oy, 'axis 1', { w: 60, anchor: 'start', size: 14, fill: COL.muted });
  if (hgt > 0) {
    svgNode('line', { x1: tipX, y1: oy, x2: tipX, y2: tipY, stroke: COL.ink, 'stroke-width': 1.5, 'stroke-dasharray': '2 3', 'data-item': 'mark', 'data-id': 'other-sides' }, svg);
    if (s * hgt > 14 && s > 14) svgNode('path', { d: 'M' + (tipX - 9) + ' ' + oy + ' L' + (tipX - 9) + ' ' + (oy - 9) + ' L' + tipX + ' ' + (oy - 9), fill: 'none', stroke: COL.ink }, svg);
    haloTex(svg, tipX + 8, (oy + tipY) / 2, '$\\sqrt{n-1}=' + hgt.toFixed(2) + '$', { w: 130, anchor: 'start', size: 15, fill: COL.ink });
  }
  const P = { X: x => ox + x * s, Y: y => oy - y * s, s: s };
  arrow(svg, P, 1, 0, { color: COL.muted, id: 'e1', w: 3.5 });
  arrow(svg, P, 1, hgt, { color: COL.accent, id: 'diagonal', w: 3 });
  haloTex(svg, ox + s / 2, oy + 16, '$e_1$, length $1$', { w: 110, size: 15, fill: COL.text2 });
  if (hgt > 0.05) haloTex(svg, (ox + tipX) / 2 - 8, (oy + tipY) / 2 - 6, '$|\\mathbf 1|=\\sqrt{' + n + '}$', { w: 120, anchor: 'end', size: 15, fill: COL.blueStrong });
  else haloTex(svg, ox + s / 2, oy - 18, '$\\mathbf 1=e_1$', { w: 80, size: 15, fill: COL.blueStrong });
  if (hgt > 0) {
    const r = Math.min(34, s * 0.45);
    if (lit === 'cos') svgNode('path', { d: 'M' + (ox + r) + ' ' + oy + ' A' + r + ' ' + r + ' 0 0 0 ' + (ox + r * Math.cos(th)).toFixed(1) + ' ' + (oy - r * Math.sin(th)).toFixed(1), fill: 'none', stroke: COL.amberBg, 'stroke-width': 12 }, svg);
    svgNode('path', { d: 'M' + (ox + r) + ' ' + oy + ' A' + r + ' ' + r + ' 0 0 0 ' + (ox + r * Math.cos(th)).toFixed(1) + ' ' + (oy - r * Math.sin(th)).toFixed(1), fill: 'none', stroke: COL.ink, 'stroke-width': 1.5, 'data-item': 'mark', 'data-id': 'angle-arc' }, svg);
    haloTex(svg, ox + (r + 12) * Math.cos(th / 2) + 4, oy - (r + 12) * Math.sin(th / 2), '$\\theta$', { w: 24, size: 15, fill: COL.ink });
  }
  // right: theta against n, n on a log axis
  const x0 = Wl + 90, x1 = W - 20, yb = H - bot, yt = top + 6;
  const X = m => x0 + Math.log10(m) / 2 * (x1 - x0), Y = d => yb - d / 95 * (yb - yt);
  if (!CAP) svgTex(svg, (x0 + x1) / 2, 13, 'the angle $\\theta$ for each $n$', { w: x1 - x0 + 60, size: 15, fill: COL.muted });
  for (const d of (yb - yt < 170 ? [0, 45, 90] : [0, 30, 45, 60, 90])) {
    svgNode('line', { x1: x0, y1: Y(d), x2: x1, y2: Y(d), stroke: d === 90 ? COL.grey : COL.grid, 'stroke-dasharray': d === 90 ? '6 4' : '' }, svg);
    svgTex(svg, x0 - 6, Y(d), '$' + d + '^\\circ$', { w: 50, anchor: 'end', size: 14 });
  }
  for (const m of [1, 2, 3, 4, 10, 30, 100]) svgTex(svg, X(m), yb + 14, '$' + m + '$', { w: 40, size: 14 });
  svgTex(svg, x1, yb + 32, '$n$, dimensions (log scale)', { w: 220, anchor: 'end', size: 14, fill: COL.muted });
  svgNode('line', { x1: x0, y1: yt - 4, x2: x0, y2: yb, stroke: COL.grey }, svg);
  svgNode('line', { x1: x0, y1: yb, x2: x1, y2: yb, stroke: COL.grey }, svg);
  const curve = (m0, m1) => { let d = ''; for (let i = 0; i <= 120; i++) { const m = Math.pow(10, Math.log10(m0) + (Math.log10(m1) - Math.log10(m0)) * i / 120);
    d += (i ? 'L' : 'M') + X(m).toFixed(1) + ' ' + Y(Math.acos(1 / Math.sqrt(m)) * 180 / Math.PI).toFixed(1); } return d; };
  if (lit === 'limit') {
    svgNode('path', { d: curve(10, 100), fill: 'none', stroke: COL.amberBg, 'stroke-width': 12, 'stroke-linecap': 'round' }, svg);
    glowLine(svg, X(10), Y(90), x1, Y(90), 8);
  }
  svgNode('path', { d: curve(1, 100), fill: 'none', stroke: COL.accent, 'stroke-width': 2.5, 'data-item': 'mark', 'data-id': 'angle-curve' }, svg);
  const deg = th * 180 / Math.PI;
  if (lit === 'cos') glowDot(svg, X(n), Y(deg), 12);
  svgNode('circle', { cx: X(n).toFixed(1), cy: Y(deg).toFixed(1), r: 6, fill: COL.ink, 'data-item': 'mark', 'data-id': 'your-n' }, svg);
  haloTex(svg, X(n) + (n > 40 ? -10 : 10), Y(deg) + 16, '$n=' + n + '$: $' + deg.toFixed(1) + '^\\circ$', { w: 150, anchor: n > 40 ? 'end' : 'start', size: 15, fill: COL.ink });
}

function slideProjection(widget, side) {
  const u = [3, 4];
  const st = { phi: 45 };

  const rC = readout('rebuild', 'rebuilt $u$ from both');

  const plot = fillPlot(widget, (svg, W, H) => {
    const P = plane(svg, W, H, 5.5);
    const t = st.phi * Math.PI / 180;
    const e = [Math.cos(t), Math.sin(t)], f = [-Math.sin(t), Math.cos(t)];

    haloTex(svg, P.X(5.1 * e[0]) + 14, P.Y(5.1 * e[1]) + 4, '$v$', { w: 60, size: 17, fill: COL.text2 });
    haloTex(svg, P.X(4.7 * f[0]), P.Y(4.7 * f[1]) - 14, '$v^{\\perp}$', { w: 80, size: 17, fill: COL.muted });
    haloTex(svg, P.X(a / 2 * e[0] - 0.45 * f[0]), P.Y(a / 2 * e[1] - 0.45 * f[1]), '$a$', { w: 40, size: 17, fill: COL.blueStrong });

    { color: COL.blueLight, text: 'thick: the shadow of $u$ on $v$, length $a$' },

    { color: COL.ink, dotted: true, text: 'dotted: drop from the tip of $u$' }]));

    const t = st.phi * Math.PI / 180;
    const e = [Math.cos(t), Math.sin(t)], f = [-Math.sin(t), Math.cos(t)];
    const a = u[0] * e[0] + u[1] * e[1], b = u[0] * f[0] + u[1] * f[1];

    rB.set('$' + b.toFixed(2) + '$');

  side.append(
    setTex(h('div', 'formula'), '$$u=a\\,v+b\\,v^{\\perp}$$'),
    sym('$v$: a unit vector at angle $\\varphi$. $v^{\\perp}$: the same, turned $90^\\circ$. $a=u\\cdot v$ and $b=u\\cdot v^{\\perp}$. For $u=(3,4)$ the first coordinate is $3$. Why: step 8.'),
    nameLine('<i>orthogonal</i>: Greek <i>orthogōnios</i>, right-angled (<i>orthos</i>, right, and <i>gōnia</i>, angle): Hamming\'s word for perpendicular (L14 41:15).'),

// ---------- step 8: why each coordinate is one dot product (proof) ----------
// u = (3,4); v at angle phi; the second direction w at angle phi + beta (w is v-perp at 90 degrees).
function drawShadowProof(svg, W, H, phi, beta, lit) {
  const CAP = {
    parts: 'amber: the walk $a$ along $v$, then $b$ along $v^{\\perp}$, ends at $u$',
    dot: 'amber: dot with $v$: each piece\'s shadow on $v$, added',
    perp: 'amber: $v$ has length $1$, and $v^{\\perp}$ stands at $90^\\circ$ to it',
    shadow: 'amber: the shadow of $u$ on $v$ is the coordinate $a$',
    other: 'amber: the same on $v^{\\perp}$: the shadow is $b$' }[lit];
  if (CAP) litCaption(svg, W, CAP);
  const P = planeXY(svg, W, H, { x0: -3, x1: 6, y0: -2, y1: 6.8 }, 28), S = P.g, u = [3, 4], D = Math.PI / 180;
  const e = [Math.cos(phi * D), Math.sin(phi * D)], w = [Math.cos((phi + beta) * D), Math.sin((phi + beta) * D)];
  const p = u[0] * e[0] + u[1] * e[1], q = u[0] * w[0] + u[1] * w[1];
  const det = e[0] * w[1] - e[1] * w[0], a = (u[0] * w[1] - u[1] * w[0]) / det, b = (e[0] * u[1] - e[1] * u[0]) / det;
  const R = [p * e[0] + q * w[0], p * e[1] + q * w[1]], miss = Math.hypot(R[0] - u[0], R[1] - u[1]);
  const right = beta === 90;
  // glows first, so the marks sit on top
  if (lit === 'parts') { glowSeg(S, P, 0, 0, a * e[0], a * e[1]); glowSeg(S, P, a * e[0], a * e[1], u[0], u[1]); }
  if (lit === 'dot' || lit === 'shadow') glowSeg(S, P, 0, 0, p * e[0], p * e[1], 14);
  if (lit === 'dot') glowSeg(S, P, u[0], u[1], p * e[0], p * e[1], 8);
  if (lit === 'perp') { glowSeg(S, P, 0, 0, e[0], e[1], 12); glowSeg(S, P, 0, 0, w[0], w[1], 12); }
  if (lit === 'other') { glowSeg(S, P, 0, 0, q * w[0], q * w[1], 14); glowSeg(S, P, u[0], u[1], q * w[0], q * w[1], 8); }
  seg(S, P, -20 * e[0], -20 * e[1], 20 * e[0], 20 * e[1], { color: COL.muted, w: 1.5, id: 'v-line' });
  seg(S, P, -20 * w[0], -20 * w[1], 20 * w[0], 20 * w[1], { color: COL.grey, w: 1.5, dash: '6 4', id: 'w-line' });
  seg(S, P, 0, 0, p * e[0], p * e[1], { color: COL.blueLight, w: 9, id: 'shadow' });
  seg(S, P, u[0], u[1], p * e[0], p * e[1], { color: COL.ink, w: 1.5, dash: '2 3', id: 'drop' });
  if (lit === 'other') seg(S, P, u[0], u[1], q * w[0], q * w[1], { color: COL.ink, w: 1.5, dash: '2 3', id: 'drop-2' });
  // the walk: a along v, then b along the second direction
  seg(S, P, 0, 0, a * e[0], a * e[1], { color: COL.ink, w: 1.5, dash: '7 4', id: 'piece-a' });
  seg(S, P, a * e[0], a * e[1], u[0], u[1], { color: COL.ink, w: 1.5, dash: '7 4', id: 'piece-b' });
  if (right) {
    const k = 0.35, c1 = [k * e[0], k * e[1]], c2 = [k * (e[0] + w[0]), k * (e[1] + w[1])], c3 = [k * w[0], k * w[1]];
    svgNode('path', { d: 'M' + P.X(c1[0]) + ' ' + P.Y(c1[1]) + ' L' + P.X(c2[0]) + ' ' + P.Y(c2[1]) + ' L' + P.X(c3[0]) + ' ' + P.Y(c3[1]), fill: 'none', stroke: COL.ink, 'stroke-width': 1.2 }, S);
  }
  arrow(S, P, e[0], e[1], { color: COL.text2, w: 3.5, id: 'v' });
  arrow(S, P, w[0], w[1], { color: COL.muted, w: 3.5, id: 'w' });
  arrow(S, P, u[0], u[1], { color: COL.accent, w: 3.5, id: 'u' });
  // the point rebuilt from the two dot products
  const bad = miss > 0.02;
  svgNode('circle', { cx: P.X(R[0]).toFixed(1), cy: P.Y(R[1]).toFixed(1), r: 8, fill: 'none', stroke: bad ? COL.red : COL.ink, 'stroke-width': 2, 'data-item': 'mark', 'data-id': 'rebuilt' }, S);
  if (bad) haloTex(S, P.X(R[0]) + 12, P.Y(R[1]), 'rebuilt: misses $u$', { w: 160, anchor: 'start', size: 15, fill: COL.red });
  // each line's label sits near where it leaves the window, on the end farther from u
  const lab = d => {
    const ex = dd => { let t = 1e9; const B = P.b;
      if (dd[0] > 1e-9) t = Math.min(t, (B.x1 - 0.9) / dd[0]); if (dd[0] < -1e-9) t = Math.min(t, (B.x0 + 0.9) / dd[0]);
      if (dd[1] > 1e-9) t = Math.min(t, (B.y1 - 0.7) / dd[1]); if (dd[1] < -1e-9) t = Math.min(t, (B.y0 + 0.7) / dd[1]); return t; };
    const p1 = [ex(d) * d[0], ex(d) * d[1]], m = [-d[0], -d[1]], p2 = [ex(m) * m[0], ex(m) * m[1]];
    return Math.hypot(p1[0] - 3, p1[1] - 4) > 1.6 && Math.hypot(p1[0], p1[1] - P.b.y1) > 1.4 ? p1 : p2;
  };
  const lv = lab(e), lw = lab(w);
  haloTex(svg, P.X(lv[0] + 0.35 * w[0]), P.Y(lv[1] + 0.35 * w[1]), '$v$', { w: 40, size: 17, fill: COL.text2 });
  haloTex(svg, P.X(lw[0] + 0.5 * e[0]), P.Y(lw[1] + 0.5 * e[1]), right ? '$w=v^{\\perp}$' : '$w$', { w: 100, size: 17, fill: COL.muted });
  if (Math.abs(a) > 0.6) haloTex(S, P.X(a / 2 * e[0] + 0.45 * Math.sin(phi * D)), P.Y(a / 2 * e[1] - 0.45 * Math.cos(phi * D)), '$a$', { w: 30, size: 17, fill: COL.ink });
  if (Math.abs(b) > 0.6) haloTex(S, P.X(a * e[0] + b / 2 * w[0] + 0.35 * e[0]), P.Y(a * e[1] + b / 2 * w[1] + 0.35 * e[1]), '$b$', { w: 30, size: 17, fill: COL.ink });
  svgTex(S, P.X(u[0]) - 12, P.Y(u[1]) - 14, '$u$', { w: 60, size: 17, fill: COL.accent, anchor: 'end' });
}

// ---------- step 10: why the straight line is never longer (proof) ----------
// u = (3,0); v has length L at angle theta to u and starts at the tip of u.
function drawTri(svg, W, H, th, L, lit) {
  const CAP = {
    straight: 'amber: the straight side, $|u+v|$',
    expand: 'amber: $|u+v|^2$ written with $u$, $v$ and $u\\cdot v$',
    angle: 'amber: the turn $\\theta$; $\\cos\\theta\\le1$, equal only at $\\theta=0$',
    walk: 'amber: the walk $u$ then $v$, length $|u|+|v|$',
    both: 'amber: the straight side against the walk' }[lit];
  if (CAP) litCaption(svg, W, CAP);
  else plotTitle(svg, W, 'from $0$ to the tip of $u+v$: straight, or by the corner');
  const top = 30, bot = 10, xa = -1.0, xb = 7.4, ya = -0.9, yb = 4.4;
  const s = Math.min((W - 20) / (xb - xa), (H - top - bot) / (yb - ya));
  const ox = (W - s * (xb - xa)) / 2 - s * xa, oy = top + s * yb;
  const P = { X: x => ox + x * s, Y: y => oy - y * s, s: s };
  const t = th * Math.PI / 180, S = [3 + L * Math.cos(t), L * Math.sin(t)];
  svgNode('line', { x1: P.X(xa), y1: P.Y(0), x2: P.X(xb), y2: P.Y(0), stroke: COL.grid }, svg);
  if (lit === 'straight' || lit === 'expand' || lit === 'both') glowSeg(svg, P, 0, 0, S[0], S[1], 14);
  if (lit === 'expand' || lit === 'walk' || lit === 'both') { glowSeg(svg, P, 0, 0, 3, 0, 14); glowSeg(svg, P, 3, 0, S[0], S[1], 14); }
  if (lit === 'angle' && th > 0) glowArc(svg, P, [1, 0], [Math.cos(t), Math.sin(t)], 0.8, [3, 0]);
  seg(svg, P, 3, 0, 4.3, 0, { color: COL.muted, w: 1.5, dash: '2 3', id: 'straight-on' });
  arrow(svg, P, 3, 0, { color: COL.accent, id: 'u' });
  arrow(svg, P, S[0], S[1], { color: COL.muted, id: 'v', from: [3, 0] });
  arrow(svg, P, S[0], S[1], { color: COL.ink, id: 'sum', w: 2.5 });
  if (th > 0) {
    angleArc(svg, P, [1, 0], [Math.cos(t), Math.sin(t)], 0.8, [3, 0]);
    haloTex(svg, P.X(3 + 1.1 * Math.cos(t / 2)), P.Y(1.1 * Math.sin(t / 2)), '$\\theta$', { w: 30, size: 15, fill: COL.ink });
  }
  const sl = Math.hypot(S[0], S[1]);
  haloTex(svg, P.X(1.5), P.Y(0) + 16, '$|u|=3$', { w: 80, size: 15, fill: COL.blueStrong });
  const vm = [3 + 0.8 * L * Math.cos(t), 0.8 * L * Math.sin(t)];   // near the tip, clear of the arc
  haloTex(svg, P.X(vm[0] + 0.5 * Math.sin(t)) + 4, P.Y(vm[1] - 0.5 * Math.cos(t)) + (th < 20 ? 12 : 0), '$|v|=' + L + '$', { w: 80, size: 15, fill: COL.text3, anchor: 'start' });
  if (sl > 0.5) haloTex(svg, P.X(S[0] / 2 - 0.5 * S[1] / sl), P.Y(S[1] / 2 + 0.5 * S[0] / sl) - (th < 20 ? 12 : 0), '$|u+v|=' + sl.toFixed(2) + '$', { w: 130, size: 15, fill: COL.ink });
}

        why: 'multiply out as for $(a+b)^2$; the dot product splits over sums (step 8)', choices: ['Telescope', 'Use symmetry'], highlight: 'expand' },
      { tex: '\\le|u|^2+2\\,|u|\\,|v|+|v|^2', move: 'Compare or bound',
        why: '$u\\cdot v=|u|\\,|v|\\cos\\theta$ and $\\cos\\theta\\le1$', choices: ['Add zero or multiply by one', 'Take a limit'], highlight: 'angle' },
      { tex: '=(|u|+|v|)^2', move: 'Rearrange',
        why: 'the same square, read backwards: $(a+b)^2=a^2+2ab+b^2$', choices: ['Compute it two ways', 'Induction'], highlight: 'walk' },
      { tex: '|u+v|\\le|u|+|v|', move: 'Undo with the inverse',
        why: 'take square roots: both sides are $\\ge0$, so the order stays', choices: ['Contradiction', 'Unfold the definition'], highlight: 'both' }],
    lookBack: [
      { q: 'When are the two equal?',
        a: 'Only line 3 can lose length. It is an equality only when $\\cos\\theta=1$, $\\theta=0$: $v$ points the way $u$ points, and the walk has no corner.' },
      { q: 'What about $L_1$, $L_\\infty$, and bits?',
        a: 'Number by number, $|u_i+v_i|\\le|u_i|+|v_i|$. Add over $i$ for $L_1$, or take the largest for $L_\\infty$. On bits, $|x_i-y_i|$ is $1$ where they differ, so $L_1$ counts the differing places: Hamming distance obeys the rule too (L12 27:34).' },
      { q: 'Beyond three dimensions?',
        a: 'There step 5 defines $\\theta$, and that needs $|u\\cdot v|\\le|u|\\,|v|$ first (the Cauchy–Schwarz inequality). Its proof: $|u-tv|^2\\ge0$ for every number $t$; put in $t=\\frac{u\\cdot v}{v\\cdot v}$, the shadow of step 8.' }] },
    plot, key => { lit = key || ''; plot.redraw(); }, CLOSING);
  side.querySelector('fl-proof-steps').primerMoves = PRIMER_MOVES;
  side.querySelector('fl-proof-steps').endNote = NEXT;
  function update() {
    const t = th * Math.PI / 180, S = [3 + L * Math.cos(t), L * Math.sin(t)];
    rS.set('$' + Math.hypot(S[0], S[1]).toFixed(2) + '$');
    rW.set('$' + (3 + L).toFixed(2) + '$');
    rD.set('$' + fmt2(3 * L * Math.cos(t)) + '\\le' + (3 * L).toFixed(2) + '$');
    plot.redraw();
  }
  update();
}
// The view's close. The primer's last proof lists every move the primer's proofs used, in order of first
// use, once it is proved, so the list never gives a pick away; the last step names what comes next.
const CLOSING = 'Look back: under the picture.';
const PRIMER_MOVES = ['Unfold the definition', 'Rearrange', 'Name a piece', 'Use an earlier result', 'Induction', 'Undo with the inverse', 'Compute it two ways', 'Take a limit', 'Use symmetry', 'Compare or bound'];
const NEXT = 'Next: Primer · Series.';

// ---------- frame ----------
const SLIDES = [
  { id: 'vector-sum', title: 'A vector is a list of numbers, and a point', tag: 'Used in L9 04:52',
    question: 'What is a vector, and why treat a list of numbers as a point?',
    formula: String.raw`$$u+v=(u_i+v_i)_{i=1}^{n}$$`, mount: slideVector },
  { id: 'length', title: 'The length of a vector', tag: 'Used in L9 05:22',
    question: 'How long is a vector with $n$ numbers?',
    formula: String.raw`$$d=\sqrt{a_1^2+a_2^2+\cdots+a_n^2}$$`, mount: slideLength },
  { id: 'why-length', proof: true, title: String.raw`Why it's true: $d=\sqrt{a_1^2+\cdots+a_n^2}$`, tag: 'Used in L9 05:22',
    question: 'Why is the diagonal of a box the square root of the sum of the squares of its sides?', mount: slideWhyLength },
  { id: 'dot-product', title: 'The dot product sees the angle', tag: 'Used in L9 24:28 to 26:33',
    question: 'How do the numbers of two vectors tell you the angle between them?',
    mount: slideDot },
  { id: 'why-dot-angle', proof: true, title: String.raw`Why it's true: $u\cdot v=|u|\,|v|\cos\theta$`, tag: 'Used in L9 24:28 to 26:33',
    question: 'Why does multiplying number by number and adding give the lengths times the cosine of the angle?', mount: slideWhyDot },
  { id: 'why-cube-diagonal', proof: true, title: String.raw`Why it's true: $\cos\theta=1/\sqrt n$`, tag: 'Used in L9 24:28 to 25:32',
    question: String.raw`What angle does the diagonal of an $n$-dimensional cube make with each axis, and why does it near $90^\circ$?`, mount: slideWhyCube },
  { id: 'projection', title: 'Shadows, and perpendicular coordinates', tag: 'Used in L14 41:15',
    question: 'What is the shadow of one vector on another, and why do perpendicular directions make coordinates easy?',
    mount: slideProjection },
  { id: 'why-shadow', proof: true, title: String.raw`Why it's true: $a=u\cdot v$ and $b=u\cdot v^{\perp}$`, tag: 'Used in L14 41:15',
    question: 'Why is each coordinate one dot product when the two directions are perpendicular unit vectors?', mount: slideWhyShadow },
  { id: 'distances', title: 'Other distances', tag: 'Used in L9 34:00 to 41:13 · L12 27:34 · L23 33:00',
    question: 'Is the distance always the straight line? Which points count as near?',
    mount: slideDistances },
  { id: 'why-triangle', proof: true, title: String.raw`Why it's true: $|u+v|\le|u|+|v|$`, tag: 'Used in L9 35:03 · L12 27:34',
    question: 'Why is the straight line never longer than a walk with a corner?', mount: slideWhyTriangle },
];

let cur = 0, shownId = null, endSent = false;
function goTo(i) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  if (shownId !== null && shownId !== s.id) emit('view.step', { step: s.id });
  shownId = s.id;
  const stage = $('#stage');
  stage.innerHTML = '';
  PLOTS = [];
  COL = readPalette();
  const widget = h('div', 'widget');
  const side = hh('div', 'side',
    h('div', 'tag', s.tag),
    setTex(h('h2'), s.title),
    setTex(h('p', 'question'), s.question),
    s.formula ? setTex(h('div', 'formula'), s.formula) : null);
  const sec = mark(h('section', 'slide' + (s.proof ? ' proof-slide' : '')), 'step', s.id, s.title);
  sec.append(widget, side);
  stage.append(sec);
  stage.scrollTop = 0;
  s.mount(widget, side);
  if (cur === SLIDES.length - 1) {
    if (!endSent) { endSent = true; emit('view.action', { action: 'deck-end' }); }
  }
  tex(sec);
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, i) => d.classList.toggle('on', i === cur));
}
// A cue is a state: go to the named step, and do nothing if it is already shown.
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i >= 0 && i !== cur) goTo(i);
}
(function init() {
  const dots = $('#dots');
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = s.title;
    b.addEventListener('click', () => goTo(i));
    dots.appendChild(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],textarea,select')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
})();
</script>

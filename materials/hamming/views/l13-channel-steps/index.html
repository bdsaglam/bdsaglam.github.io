<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noisy channel: why random codes work</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../../components/theme.js"></script>
<style>
/* Colors: white page, one accent (blue), red only for a failing check or the H(s) limit. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft);
  --red:var(--pal-red); --redbg:var(--pal-red-bg);
  --u:clamp(16px,1.35vw,20px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-panel);display:flex;flex-direction:column;overflow:hidden}
header{padding:10px 28px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(8px,1.2vh,16px) 28px}
footer{display:flex;align-items:center;gap:10px;padding:10px 28px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Slide frame: widget on the left (3/5), text on the right (2/5). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(20px,2.6vw,44px)}
.widget{min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(8px,1.2vh,14px);overflow:auto}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(10px,1.8vh,18px)}
.tag{font:14px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(22px,2.3vw,34px);line-height:1.2;margin:0;font-weight:650}
.formula{font-size:clamp(22px,2.4vw,34px)}
.line-txt{margin:0;font-size:clamp(16px,1.35vw,19px)}

/* Controls and readouts */
.sliders{display:flex;gap:10px 28px;flex-wrap:wrap;width:100%}
.slide-ctl{display:flex;align-items:center;gap:10px;font-size:16px}
.slide-ctl input{width:clamp(140px,14vw,200px);vertical-align:middle;accent-color:var(--accent)}
.slide-ctl .val{min-width:56px}
.btn{font:inherit;padding:7px 16px;border:1px solid var(--line);background:var(--pal-panel);border-radius:8px;cursor:pointer}
.btn.on{background:var(--chip);border-color:var(--accent);color:var(--pal-accent-deep)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--pal-panel)}
.btn:disabled{opacity:.4;cursor:default}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.readouts{display:flex;gap:10px;flex-wrap:wrap;width:100%}
.readout{flex:1 1 180px;min-width:0;padding:10px 14px;border-radius:10px;background:var(--pal-soft);font-size:16px;overflow-wrap:anywhere}
.readout .k{color:var(--muted);font-size:15px}
.readout .val{font-size:18px;font-weight:600;margin-top:2px}
.readout.bad{background:var(--redbg);color:var(--red)}
.note{color:var(--muted);width:100%;margin:0;font-size:16px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:16px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:22px;height:0;vertical-align:middle;margin-right:6px}
.plot{width:100%;min-width:0}
.plot svg{display:block;width:100%;height:auto;max-height:46vh}
.row{display:flex;gap:16px;align-items:flex-start;width:100%}
.row>.plot{flex:1 1 0;min-width:0}
.row>.chan{flex:0 0 250px}
.tbl{border-collapse:collapse;font-size:16px;width:100%}
.tbl th,.tbl td{padding:6px 10px;border-bottom:1px solid var(--pal-soft-2);text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr.ref td{color:var(--muted)}
.scroll{width:100%;overflow:auto;max-height:34vh}
.card{padding:14px 16px;border:1px solid var(--line);border-radius:10px;width:100%;display:flex;flex-direction:column;gap:12px}
.card .q{font-size:18px;font-weight:600}

/* Derivation: one line per click; each line is an equation and a short reason */
.proof{display:flex;flex-direction:column;width:100%;min-width:0}
.proof-line{display:grid;grid-template-columns:34px minmax(0,1fr);gap:2px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--pal-soft-3)}
.proof-num{font:16px ui-monospace,Menlo,monospace;color:var(--muted)}
.proof-eq{font-size:clamp(19px,1.9vw,26px);min-width:0}
.proof-eq .katex-display{margin:0;text-align:left}
.proof-eq .katex-display>.katex{text-align:left}
.proof-why{grid-column:2;margin:0;color:var(--muted);font-size:16px}
/* Slides var-sum, ratio-difference, clt: the plot is as tall as its widget; numbered tries; takeaway */
.fill{flex:1 1 0;min-height:200px;position:relative;width:100%}
.fill>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tries{margin:0;padding-left:26px;display:flex;flex-direction:column;gap:8px;font-size:16px}
.tries li::marker{color:var(--accent);font-weight:600}
.mc-ex{grid-column:1/-1;color:var(--muted)}
.mc-nrow{flex-wrap:nowrap;gap:6px}.mc-nrow .btn{padding:6px 8px;flex:1}
.mc-defs{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;padding:10px 14px;background:var(--chip);border-radius:8px;font-size:16px;line-height:1.35}
.takeaway{margin:0;padding:12px 14px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}
.note16{margin:0;font-size:16px;color:var(--muted)}
/* derivation in the side column: compact lines so it fits in place of the tries */
.derive .proof-line{padding:3px 0;grid-template-columns:26px minmax(0,1fr)}
.derive .proof-eq{font-size:clamp(17px,1.45vw,20px)}
.derive .proof-why{font-size:16px;line-height:1.25}
.derive .proof{gap:0}
/* Slides two-spheres, miss-chance: the failure list, one-line readouts, a tight slider row and table */
.fail-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px 12px;align-items:center;font-size:16px}
.fail-txt{margin:0}
.tbl.tight th,.tbl.tight td{padding:2px 8px;font-size:16px}
.sliders.tight{gap:6px 12px}
.sliders.tight .slide-ctl{gap:6px}
.sliders.tight .slide-ctl input{width:96px}
.sliders.tight .slide-ctl .val{min-width:0}
.rd-list{display:flex;flex-direction:column;gap:6px;width:100%}
.rd-list .readout{flex:none}
.readout.row1{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 12px}
.readout.row1 .k{font-size:16px;color:var(--muted);min-width:0}
.readout.row1 .val{margin-top:0;font-size:18px;font-weight:600;white-space:nowrap}
/* var-sum: one block of bits through the channel, above the histogram */
.strip-wrap{width:100%;display:flex;flex-direction:column;gap:4px}
.strip{width:100%;display:flex;flex-direction:column;gap:3px;padding:8px 12px;border:1px solid var(--line);border-radius:10px}
.bitrow{display:flex;align-items:center;gap:10px;white-space:nowrap}
.bitlab{flex:0 0 150px;font-size:15px;color:var(--muted)}
.bits{font:15px/1.35 ui-monospace,Menlo,monospace}
.bit{display:inline-block;width:1.1em;text-align:center}
.bit.grp{margin-left:.6em}
.bit.hit{color:var(--red);font-weight:700;background:var(--redbg);border-radius:3px}
.bitsum{margin-left:auto;font-size:15px}
.strip-note{margin:0;font-size:15px;color:var(--muted)}
/* Slides codebook, random-bound, random-rate, average-to-one */
.cbtop{display:flex;gap:14px;align-items:stretch;width:100%}
.cbw>.cbtop{flex:1 1 auto;min-height:200px}
.cbtop>.cbl{align-self:flex-start}
.cbtop>.cbl{flex:0 0 44%;min-width:0}
.cbtop>.cbr{flex:1 1 0;min-width:0;display:flex;flex-direction:column}
.cbt{border-collapse:collapse;font-size:16px;width:100%}
.cbt th,.cbt td{padding:0 8px;vertical-align:middle;line-height:22px;height:22px;border-bottom:1px solid var(--pal-soft-2);text-align:left;white-space:nowrap}
.cbt th{color:var(--muted);font-weight:500}
.cbt tbody tr{cursor:pointer}
.cbt td{height:var(--rh,22px)}
.cbt tbody tr:hover td{background:var(--pal-soft-hover)}
.cbt tr.on td{background:var(--chip)}
.cbbits{font:16px/1 ui-monospace,Menlo,monospace;white-space:nowrap}
.cbrow{display:flex;align-items:center;gap:10px;white-space:nowrap}
.cbrow .bitlab{flex:0 0 130px;font-size:16px;color:var(--muted)}
.rwrap{position:relative;display:inline-block;width:clamp(120px,12vw,170px);vertical-align:middle}
.rwrap input,.sliders.tight .rwrap input{width:100%;vertical-align:middle;accent-color:var(--accent)}
.ctick{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--pal-ink);pointer-events:none}
.budget{position:relative;display:flex;width:100%;height:30px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--pal-panel)}
.budget .seg{height:100%;flex:0 0 0}
.budget .one{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--pal-ink)}
.sq{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px;border:1px solid var(--pal-line)}
/* Widgets with several rows: rows keep their height, the plot takes what is left */
.cbw>*{flex-shrink:0}
.cbw>.fill{flex-shrink:1}
.cbw>.readout{flex:none}
.rd2{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;width:100%}
.rd2 .readout.row1{padding:5px 10px}
.cbw .readouts .readout{padding:6px 10px}
.cbw .strip{padding:6px 10px}
.cbverdict.bad{color:var(--red);font-weight:600}
</style>
</head>
<body>
<header>Noisy channel: why random codes work</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script>
// LOGIC-START
// Pure math and the Monte Carlo core. No DOM here.
let epoch = 0; // bumped on every step change; a stale Monte Carlo run stops itself
const log2 = Math.log2;
// Binary entropy H(x) in bits.
function Hb(x) { if (x <= 0 || x >= 1) return 0; return -x * log2(x) - (1 - x) * log2(1 - x); }
// log2 C(n,k) for k = 0..K, built one term at a time.
function logCRow(n, K) {
  const r = new Float64Array(K + 1);
  for (let k = 1; k <= K; k++) r[k] = r[k - 1] + log2((n - k + 1) / k);
  return r;
}
// log2 of a sum of 2^x, by log-sum-exp.
function lse(xs) {
  let m = -Infinity;
  for (const x of xs) if (x > m) m = x;
  if (m === -Infinity) return -Infinity;
  let s = 0;
  for (const x of xs) s += Math.pow(2, x - m);
  return m + log2(s);
}
// log2 V(n,K) = log2 of the sum of C(n,k) for k <= K.
function log2V(n, K) { return lse(logCRow(n, K)); }
// P(X > K) for X ~ Binomial(n, p).
function tailP(n, p, K) {
  if (K >= n) return 0;
  const lc = logCRow(n, n);
  const terms = [];
  for (let k = K + 1; k <= n; k++) terms.push(lc[k] + k * log2(p) + (n - k) * log2(1 - p));
  return Math.pow(2, lse(terms));
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function randBits(rnd, nb) {
  if (nb <= 0) return 0;
  const v = Math.floor(rnd() * 4294967296);
  return nb >= 32 ? v >>> 0 : (v & ((1 << nb) - 1)) >>> 0;
}
function pop32(x) {
  x = x >>> 0;
  x = x - ((x >>> 1) & 0x55555555);
  x = (x & 0x33333333) + ((x >>> 2) & 0x33333333);
  return Math.imul((x + (x >>> 4)) & 0x0f0f0f0f, 0x01010101) >>> 24;
}
// Random code book of 2^k words of n bits (n <= 64), 2000 random messages through a binary symmetric
// channel with flip chance Q, decoded to the nearest codeword. Ties count as errors. Work runs in chunks.
// onDone gets the block error and 2000 sampled pair distances.
function mcRun(n, k, Q, my, onProgress, onDone) {
  const M = Math.pow(2, k), TOT = 2000;
  const seed = 1000003 * n + 7919 * k + 17;
  const rnd = mulberry32(seed);
  const lo = new Uint32Array(M), hi = new Uint32Array(M);
  for (let i = 0; i < M; i++) {
    lo[i] = randBits(rnd, Math.min(n, 32));
    hi[i] = randBits(rnd, Math.max(0, n - 32));
  }
  const pr = mulberry32(seed + 1);
  const dists = [];
  while (dists.length < 2000) {
    const i = Math.floor(pr() * M), j = Math.floor(pr() * M);
    if (i === j) continue;
    dists.push(pop32((lo[i] ^ lo[j]) >>> 0) + pop32((hi[i] ^ hi[j]) >>> 0));
  }
  const rn = mulberry32(seed + 2);
  let t = 0, errs = 0;
  const per = Math.max(1, Math.floor(2e6 / M));
  function step() {
    if (my !== epoch) return;
    const end = Math.min(TOT, t + per);
    for (; t < end; t++) {
      const m = Math.floor(rn() * M);
      let rl = lo[m], rh = hi[m];
      for (let b = 0; b < n; b++) {
        if (rn() < Q) {
          if (b < 32) rl = (rl ^ (1 << b)) >>> 0;
          else rh = (rh ^ (1 << (b - 32))) >>> 0;
        }
      }
      let best = 99, cnt = 0, who = -1;
      for (let j = 0; j < M; j++) {
        const d = pop32((rl ^ lo[j]) >>> 0) + pop32((rh ^ hi[j]) >>> 0);
        if (d < best) { best = d; cnt = 1; who = j; }
        else if (d === best) cnt++;
      }
      if (cnt !== 1 || who !== m) errs++;
    }
    onProgress(t / TOT);
    if (t < TOT) setTimeout(step, 0);
    else onDone({ err: errs / TOT, dists: dists });
  }
  step();
}
// LOGIC-END

// ---------- DOM and math helpers ----------
const $ = s => document.querySelector(s);
const NSV = 'http://www.w3.org/2000/svg', NHT = 'http://www.w3.org/1999/xhtml';
// The last Monte Carlo book {n, k, Q, dists}; the Monte Carlo steps share it.
let lastRun = null;
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false } ], throwOnError: false };
// Render $...$ and $$...$$ in a node. If the CDN did not load, the text stays as typed.
function tex(node) {
  if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH);
  return node;
}
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function hh(tag, cls, ...kids) {
  const e = h(tag, cls);
  for (const k of kids) if (k) e.append(k);
  return e;
}
function mark(e, kind, id, title) {
  e.dataset.item = kind;
  if (id != null) e.dataset.id = id;
  if (title != null) e.dataset.title = title;
  return e;
}
// A palette literal becomes var(--pal-<name>): theme.js updates CSS variables on a theme switch,
// so SVG and inline styles drawn with these follow the theme with no redraw.
const PAL = {'#6b7280': 'muted', '#2563eb': 'accent', '#9ca3af': 'grey', '#111': 'ink', '#111111': 'ink', '#374151': 'text-2', '#c81e1e': 'red', '#93c5fd': 'accent-3', '#dbeafe': 'accent-tint', '#1d4ed8': 'accent-deep', '#4b5563': 'text-3', '#b45309': 'hue-orange-ink', '#d97706': 'hue-orange', '#15803d': 'green', '#eceef2': 'soft-3', '#f3f4f6': 'soft', '#e5e7eb': 'soft-2', '#eef0f3': 'grid', '#d1d5db': 'line', '#fdecec': 'red-bg', '#eff6ff': 'accent-soft', '#f9fafb': 'soft-hover', '#fff': 'panel', '#ffffff': 'panel', '#1f2937': 'fg', '#1e40af': 'accent-ink', '#1a7f37': 'good-line', '#dafbe1': 'good-bg'};
function pv(v) {
  if (typeof v !== 'string') return v;
  return v.replace(/#(?:[0-9a-fA-F]{6}|[0-9a-fA-F]{3})\b/g, m => PAL[m.toLowerCase()] ? 'var(--pal-' + PAL[m.toLowerCase()] + ')' : m);
}
function svgNode(tag, attrs, parent) {
  const e = document.createElementNS(NSV, tag);
  for (const k in attrs) {
    if (k === 'fill' || k === 'stroke') e.style.setProperty(k, pv(attrs[k])); else e.setAttribute(k, attrs[k]);
  }
  if (parent) parent.appendChild(e);
  return e;
}
function svgRoot(w, ht) {
  return svgNode('svg', { viewBox: '0 0 ' + w + ' ' + ht, role: 'img', 'font-family': 'system-ui, sans-serif', 'font-size': 14 });
}
function svgText(parent, x, y, s, attrs) {
  const t = svgNode('text', Object.assign({ x: x, y: y, fill: '#6b7280' }, attrs || {}), parent);
  t.textContent = s;
  return t;
}
// A KaTeX label placed over an SVG: a foreignObject holding a rendered formula.
// anchor: 'middle' (default), 'start' or 'end', as for svg text.
function svgTex(parent, x, y, s, o) {
  o = o || {};
  const w = o.w || 220, ht = 26, anchor = o.anchor || 'middle';
  const x0 = anchor === 'end' ? x - w : anchor === 'start' ? x : x - w / 2;
  const fo = svgNode('foreignObject', { x: x0, y: y - ht / 2, width: w, height: ht }, parent);
  const d = document.createElementNS(NHT, 'div');
  const jc = anchor === 'end' ? 'flex-end' : anchor === 'start' ? 'flex-start' : 'center';
  d.setAttribute('style', 'display:flex;align-items:center;height:100%;white-space:nowrap;font-size:' +
    (o.size || 15) + 'px;color:' + pv(o.fill || '#374151') + ';justify-content:' + jc);
  // One inline span inside the flex box, so spaces between words and math survive.
  const span = document.createElementNS(NHT, 'span');
  span.textContent = s;
  d.appendChild(span);
  fo.appendChild(d);
  tex(span);
  return fo;
}
// A small number for a readout: plain decimals, or a LaTeX power of ten for tiny values.
function sci(x) {
  if (x === 0) return '0';
  if (Math.abs(x) >= 0.01) return x.toFixed(4);
  const parts = x.toExponential(2).split('e');
  return '$' + parts[0] + '\\times 10^{' + parseInt(parts[1], 10) + '}$';
}
// A labelled range input. label is LaTeX-ready text; fmt gives the value text (LaTeX-ready).
function slider(label, o) {
  const wrap = h('label', 'slide-ctl');
  const lab = tex(h('span', '', label));
  const val = h('span', 'val', '');
  const inp = h('input');
  inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step; inp.value = o.value;
  mark(inp, 'control', o.id, o.name || o.id);
  wrap.append(lab, inp, val);
  const fmt = o.fmt || String;
  const api = {
    el: wrap,
    input: inp,
    get value() { return +inp.value; },
    show() { setTex(val, fmt(+inp.value)); },
    setMax(m) { inp.max = m; if (+inp.value > m) inp.value = m; api.show(); },
    set(v) { inp.value = v; api.show(); },
  };
  inp.addEventListener('input', () => { api.show(); if (o.onInput) o.onInput(+inp.value); });
  api.show();
  return api;
}
// A readout box: label and value are LaTeX-ready text.
function readout(id, label) {
  const box = mark(h('div', 'readout'), 'readout', id);
  const k = h('div', 'k');
  setTex(k, label);
  const v = h('div', 'val');
  box.append(k, v);
  return { el: box, set(text, bad) { setTex(v, text); box.classList.toggle('bad', !!bad); } };
}
function legend(items) {
  const d = h('div', 'legend');
  for (const it of items) {
    const s = h('span');
    const sw = h('span', 'sw');
    sw.style.borderTop = '2px ' + (it.dash ? 'dashed' : 'solid') + ' ' + pv(it.color);
    const t = h('span');
    setTex(t, it.text);
    s.append(sw, t);
    d.appendChild(s);
  }
  return d;
}
// A derivation shown one line at a time. steps: [equation in $$...$$, short reason].
function derivation(box, steps) {
  let shown = 0;
  const rows = steps.map(([eq, why], i) => {
    const row = mark(hh('div', 'proof-line',
      h('span', 'proof-num', (i + 1) + '.'),
      h('div', 'proof-eq', eq),
      h('p', 'proof-why', why)), 'line', 'line-' + (i + 1));
    row.hidden = true;

// ---------- step 2: errors pile up at nQ ----------

  const Y = p => base - (p / (ymax * 1.08)) * (base - T);
  const svg = svgRoot(W, PH);
  svgNode('line', { x1: L, y1: base, x2: W - R, y2: base, stroke: '#9ca3af' }, svg);
  for (let i = 0; i <= 6; i++) {

    svgText(svg, X(t), base + 18, t.toFixed(2), { 'text-anchor': 'middle' });
  }
  svgTex(svg, (L + W - R) / 2, PH - 9, '$k/n$, error fraction', { w: 300 });
  const spacing = X(1 / n) - X(0);
  const bw = Math.max(1, Math.min(12, 0.8 * spacing));
  for (let k = 0; k <= n && k / n <= 0.3 + 1e-12; k++) {
    const x = X(k / n), y = Y(pm[k]);
    svgNode('rect', {
      x: (x - bw / 2).toFixed(2), y: y.toFixed(2), width: bw.toFixed(2),
      height: Math.max(0, base - y).toFixed(2), fill: k > K ? '#c81e1e' : '#9ca3af',
    }, svg);

  if (Q <= 0.3) {
    svgNode('line', { x1: X(Q), y1: T, x2: X(Q), y2: base, stroke: '#2563eb', 'stroke-dasharray': '4 3' }, svg);
    svgTex(svg, X(Q) + 6, T + 12, '$Q$', { w: 60, anchor: 'start', fill: '#2563eb' });
  }
  if (s <= 0.3) {

  }
  return svg;
}

// ---------- step 4: proof that V <= 2^(nH(s)) ----------
function slideSphereProof(box) {
  derivation(box, [
    [String.raw`$$1 = \sum_{k=0}^{n} \binom{n}{k}\, s^{k}(1-s)^{n-k}$$`, 'all error counts $k$ together have probability 1'],
    [String.raw`$$\ge \sum_{k \le ns} \binom{n}{k}\, s^{k}(1-s)^{n-k}$$`, 'drop the terms with $k > ns$'],
    [String.raw`$$\ge V\, s^{ns}(1-s)^{n-ns}$$`, 'since $s < \\tfrac12$, the factor grows as $k$ falls'],
    [String.raw`$$= V\, 2^{-nH(s)}$$`, 'the logs of $s^{ns}(1-s)^{n-ns}$ give $-nH(s)$'],
    [String.raw`$$V \le 2^{nH(s)}$$`, 'line 1 is at least line 4, so divide'],
  ]);

// Curves over n = 10..2000 (log spaced): the miss term d, the confusion term 2^{-n(1-H(s)-R)}, and their sum, all in log10.
function rateCurves(R, Q, e2) {
  const s = Q + e2, gap = 1 - Hb(s) - R, L2 = Math.log10(2), out = [];
  for (let i = 0; i <= 90; i++) {
    const n = Math.round(10 * Math.pow(200, i / 90));
    if (out.length && out[out.length - 1].n === n) continue;
    const d = tailP(n, Q, Math.floor(n * s + 1e-9));
    const ld = d > 0 ? Math.log10(d) : -400;
    const lb = -n * gap * L2;
    const m = Math.max(ld, lb);
    const ls = m + Math.log10(Math.pow(10, ld - m) + Math.pow(10, lb - m));
    out.push({ n, ld, lb, ls });
  }
  return out;
}

const AB_N = 16, AB_M = 16, AB_SENDS = 300, AB_BOOKS = 200, AB_BIN = 0.02;
// Block error rate of each of AB_BOOKS random books, each measured with AB_SENDS seeded sends.
function bookRates(Q, no) {
  const out = [];
  for (let b = 0; b < AB_BOOKS; b++) {
    const rb = mulberry32(no * 100003 + b * 7 + 3), rs = mulberry32(no * 100003 + b * 7 + 4);
    const words = [];
    for (let m = 0; m < AB_M; m++) words.push(randBits(rb, AB_N));
    let errs = 0;
    for (let t = 0; t < AB_SENDS; t++) {
      const m = Math.floor(rs() * AB_M);
      let rw = words[m];
      for (let i = 0; i < AB_N; i++) if (rs() < Q) rw ^= 1 << (AB_N - 1 - i);
      let best = 99, cnt = 0, who = -1;
      for (let j = 0; j < AB_M; j++) {
        const d = pop32(rw ^ words[j]);
        if (d < best) { best = d; cnt = 1; who = j; } else if (d === best) cnt++;
      }
      if (cnt !== 1 || who !== m) errs++;
    }
    out.push(errs / AB_SENDS);
  }
  return out;
}

function bookSize(n, R) {

  const lg = Math.log10(n) + e * Math.log10(2), p = Math.floor(lg), mant = Math.pow(10, lg - p);
  return String.raw`$${n}\cdot 2^{${e}} \approx ${mant.toFixed(1)}\times 10^{${p}}$ bits`;
}

function distSvg(r) {
  const nn = r.n, QQ = r.Q, e2 = 0.02;
  const W = 680, PH = 250, L = 44, R = 14, T = 22, B = 40;
  const base = PH - B;
  const cnt = new Array(nn + 1).fill(0);
  for (const d of r.dists) cnt[d]++;
  const cmax = Math.max(1, ...cnt);
  const bw = (W - L - R) / (nn + 1);
  const Yc = c => base - (c / cmax) * (base - T);
  const svg = svgRoot(W, PH);
  svgNode('line', { x1: L, y1: base, x2: W - R, y2: base, stroke: '#9ca3af' }, svg);
  for (let d = 0; d <= nn; d++) {
    const c = cnt[d];
    svgNode('rect', {
      x: (L + d * bw + 1).toFixed(2), y: Yc(c).toFixed(2), width: Math.max(1, bw - 2).toFixed(2),
      height: Math.max(0, base - Yc(c)).toFixed(2), fill: '#9ca3af',
    }, svg);
    if (nn <= 16 || d % 8 === 0) svgText(svg, L + (d + 0.5) * bw, base + 18, String(d), { 'text-anchor': 'middle' });
  }
  svgText(svg, (L + W - R) / 2, PH - 6, 'distance between two codewords (bits)', { 'text-anchor': 'middle' });
  const xv = v => L + (v + 0.5) * bw;
  const marks = [[nn / 2, '#2563eb'], [nn * QQ, '#c81e1e'], [nn * (QQ + e2), '#15803d']];
  for (const [v, col] of marks) {
    svgNode('line', { x1: xv(v), y1: T, x2: xv(v), y2: base, stroke: col, 'stroke-width': 2, 'stroke-dasharray': '4 3' }, svg);
  }
  svgText(svg, W - R, T - 7, 'sampled from ' + r.dists.length + ' pairs', { 'text-anchor': 'end' });
  return svg;
}

// Standard normal CDF. erf: Abramowitz and Stegun 7.1.26, error below 1.5e-7.
function erf(x) {
  const s = x < 0 ? -1 : 1; x = Math.abs(x);
  const t = 1 / (1 + 0.3275911 * x);
  const y = 1 - ((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
  return s * y;
}

const VAR_PROOF = [

  [String.raw`$$= \mathrm{Var}\,X + \mathrm{Var}\,Y + 2\,\mathrm{Cov}(X,Y)$$`, 'expand the square'],
  [String.raw`$$\mathrm{Cov}(X,Y) = 0$$`, 'independent: the cross term averages out, since positive and negative deviations cancel'],
  [String.raw`$$\mathrm{Var}(S_n) = n\,\mathrm{Var}(X)$$`, 'add the $n$ bits: each one adds its variance'],
  [String.raw`$$\sigma(S_n) = \sqrt{n}\,\sigma(X)$$`, 'the square root undoes the square']

// Seeded runs of S_n = X_1 + ... + X_n, each X_i a bit that is 1 with chance Q.
function simSums(n, Q, seed, runs) {
  const rnd = mulberry32(seed);

  for (let r = 0; r < runs; r++) {
    let s = 0;
    for (let i = 0; i < n; i++) if (rnd() < Q) s++;

  }

}
// One block of n bits through the channel: a random sent word, flip indicators X_i (chance Q), the received word.
function blockDraw(n, Q, seed) {
  const rnd = mulberry32(seed * 977 + 31);
  const sent = [], x = [];
  for (let i = 0; i < n; i++) { sent.push(rnd() < 0.5 ? 1 : 0); x.push(rnd() < Q ? 1 : 0); }
  const recv = sent.map((b, i) => b ^ x[i]);

function moments(lo, ps) {
  let mu = 0, v = 0;
  ps.forEach((p, j) => { mu += p * (lo + j); });
  ps.forEach((p, j) => { v += p * (lo + j - mu) ** 2; });
  return { mu, v };
}
// Exact law of the sum of n copies: d[K] = P(sum of the offsets j = K), for offsets j = 0..m-1.
function sumDist(ps, n) {
  let d = [1];
  for (let i = 0; i < n; i++) {
    const nd = new Float64Array(d.length + ps.length - 1);
    for (let a = 0; a < d.length; a++) {
      if (!d[a]) continue;
      for (let b = 0; b < ps.length; b++) nd[a + b] += d[a] * ps[b];
    }
    d = nd;
  }
  return d;
}
// Largest gap between the CDF of the standardized sum and the normal CDF. The gap is largest
// just before or at a jump of the step function, so those points are enough.
function ksGap(d, n, lo, mu, sigma) {
  const sd = sigma * Math.sqrt(n);
  let prev = 0, best = 0;
  for (let K = 0; K < d.length; K++) {
    const phi = normCdf((n * (lo - mu) + K) / sd);
    const after = prev + d[K];
    best = Math.max(best, Math.abs(prev - phi), Math.abs(after - phi));
    prev = after;
  }
  return best;
}
function fmt4(x) { return String(Number(x.toFixed(4))); }

    setTex(h('p', 'note16'), 'Needs independent terms with finite variance. The bars here are exact.'));
}

// erfc with relative error below 1.2e-7 (Numerical Recipes erfcc), so tails far out stay accurate.
function erfcAcc(x) {
  const z = Math.abs(x), t = 1 / (1 + 0.5 * z);
  const ans = t * Math.exp(-z * z - 1.26551223 + t * (1.00002368 + t * (0.37409196 + t * (0.09678418 +
    t * (-0.18628806 + t * (0.27886807 + t * (-1.13520398 + t * (1.48851587 + t * (-0.82215223 + t * 0.17087277)))))))));
  return x >= 0 ? ans : 2 - ans;
}
// Upper tail of the standard normal: 1 - Phi(z).
function normSf(z) { return 0.5 * erfcAcc(z / Math.SQRT2); }
// log2 of the binomial pmf P(k) for k = 0..n, computed in log space.
function binomLog2Pmf(n, p) {
  const lc = logCRow(n, n), lp = new Float64Array(n + 1);
  for (let k = 0; k <= n; k++) lp[k] = lc[k] + k * log2(p) + (n - k) * log2(1 - p);
  return lp;
}
// Seeded draws of k ~ Binomial(n, Q) by inverse CDF, plus a random direction for each draw.
function sphereSample(n, Q, seed, runs) {
  const lp = binomLog2Pmf(n, Q), cdf = new Float64Array(n + 1);
  let acc = 0;
  for (let k = 0; k <= n; k++) { acc += Math.pow(2, lp[k]); cdf[k] = acc; }
  const rk = mulberry32(seed * 2 + 1), ra = mulberry32(seed * 2 + 2);
  const ks = [], ang = [];
  for (let r = 0; r < runs; r++) {
    const u = rk() * acc;
    let lo = 0, hi = n;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (cdf[mid] >= u) hi = mid; else lo = mid + 1; }
    ks.push(lo);
    ang.push(ra() * 2 * Math.PI);
  }
  return { ks, ang };
}

    const sc = R / (st.Q + st.e2);             // px per unit of k/n
    const Rin = st.Q * sc;
    const at = (k, a) => { const rr = Math.min(rim - 4, k / st.n * sc); return [cx + rr * Math.cos(a), cy + rr * Math.sin(a)]; };
    const cls = k => (k <= st.K1 ? 'inside' : k <= st.K2 ? 'between' : 'outside');
    const COL = { inside: '#2563eb', between: '#93c5fd', outside: '#c81e1e' };
    const TIT = { inside: 'inside the inner circle', between: 'between the circles', outside: 'outside the outer circle: a miss' };
    if (!recv) {
      for (const c of ['between', 'inside', 'outside']) {
        const g = svgNode('g', { 'data-item': 'mark', 'data-id': 'dots-' + c, 'data-title': TIT[c] }, svg);
        st.ks.forEach((k, i) => {
          if (cls(k) !== c) return;
          const [x, y] = at(k, st.ang[i]);
          svgNode('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: 2.6, fill: COL[c], 'fill-opacity': 0.8 }, g);
        });
      }
    } else {
      const [x, y] = at(st.ks[0], st.ang[0]);
      svgNode('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: 5, fill: COL[cls(st.ks[0])], 'data-item': 'mark', 'data-id': 'sent-word', 'data-title': 'the word sent' }, svg);
    }
    svgNode('circle', { cx, cy, r: Rin, fill: 'none', stroke: '#2563eb', 'stroke-width': 2, 'data-item': 'mark', 'data-id': 'ring-nq' }, svg);
    svgNode('circle', { cx, cy, r: R, fill: 'none', stroke: '#374151', 'stroke-width': 2, 'stroke-dasharray': '6 4', 'data-item': 'mark', 'data-id': 'ring-outer' }, svg);
    svgNode('circle', { cx, cy, r: 6, fill: '#111', 'data-item': 'mark', 'data-id': 'center' }, svg);
    // The center dot's label sits in the left margin, with a leader line like the two ring labels.
    const leftX = cx - rim - 8;
    svgNode('line', { x1: cx - 8, y1: cy, x2: leftX, y2: cy, stroke: '#111', 'stroke-width': 1 }, svg);
    svgTex(svg, leftX - 4, cy - 10, recv ? String.raw`$b$: the word` : String.raw`$a_i$: the code word`, { w: 150, anchor: 'end', fill: '#111' });
    svgTex(svg, leftX - 4, cy + 9, recv ? 'received' : 'sent', { w: 150, anchor: 'end', fill: '#111' });
    // Ring labels sit in the right margin, outside the dots, each with a leader to its ring.
    const rightX = cx + rim + 8;
    const yO = cy + R * Math.sin(-0.45), xO = cx + R * Math.cos(-0.45);
    svgNode('line', { x1: xO.toFixed(1), y1: yO.toFixed(1), x2: rightX, y2: yO.toFixed(1), stroke: '#374151', 'stroke-width': 1 }, svg);
    svgTex(svg, rightX + 4, yO - 10, String.raw`$n(Q+\varepsilon_2)$`, { w: 150, anchor: 'start', fill: '#374151' });
    svgTex(svg, rightX + 4, yO + 9, 'with a safety margin', { w: 150, anchor: 'start', fill: '#374151' });
    const yI = cy + Rin * Math.sin(0.45), xI = cx + Rin * Math.cos(0.45);
    svgNode('line', { x1: xI.toFixed(1), y1: yI.toFixed(1), x2: rightX, y2: yI.toFixed(1), stroke: '#2563eb', 'stroke-width': 1 }, svg);
    svgTex(svg, rightX + 4, yI - 10, String.raw`$nQ$`, { w: 150, anchor: 'start', fill: '#1d4ed8' });
    svgTex(svg, rightX + 4, yI + 9, 'flips on average', { w: 150, anchor: 'start', fill: '#1d4ed8' });
    svgText(svg, 12, 18, 'direction means nothing; distance = flipped bits, as a share of n', { fill: '#4b5563', 'font-size': 15 });
    if (recv) svgTex(svg, 12, H - 12, String.raw`$\text{other code words sit about }n/2\text{ away, off the chart}$`, { w: 420, anchor: 'start', fill: '#4b5563' });
    return svg;
  }
  function sync() {
    nb.forEach(([v, b]) => b.classList.toggle('on', v === n));
    recvBtn.classList.toggle('on', recv);
    legSent.hidden = recv; legRecv.hidden = !recv;
    readRow.hidden = recv; failBox.hidden = !recv;
    const K1 = Math.floor(n * Q + 1e-9), K2 = Math.floor(n * (Q + e2) + 1e-9);
    const sample = sphereSample(n, Q, seed, RUNS);
    let c1 = 0, c2 = 0;
    for (const k of sample.ks) { if (k > K1) c1++; if (k > K2) c2++; }
    rIn.set((c1 / RUNS).toFixed(3) + ', exact ' + sci(tailP(n, Q, K1)));
    rOut.set((c2 / RUNS).toFixed(3) + ', exact ' + sci(tailP(n, Q, K2)));
    st = { n, Q, e2, K1, K2, ks: sample.ks, ang: sample.ang };
    plot.redraw();
  }
  sync();
}

// ---------- step: how the miss chance is computed ----------
const MISS_TRIES = [
  String.raw`Click $n = 10^{2}$. Exact and Gaussian are close. Chebyshev is above 1, so it says nothing yet.`,
  String.raw`Click $n = 10^{3}$, then $n = 10^{4}$. All three fall toward 0. The Gaussian falls below the exact value far out.`,
  String.raw`Chebyshev is loose, but it needs only the variance. That is all the proof needs.`
];
function missSide(side) {
  side.style.justifyContent = 'flex-start';
  side.style.gap = 'clamp(6px,1.1vh,12px)';
  const f = setTex(h('div', 'formula'), String.raw`$$P(k>r) \le \frac{Q(1-Q)}{n\,\varepsilon_2^2}$$`);
  f.style.fontSize = 'clamp(20px,1.9vw,26px)';
  const tries = triesList(MISS_TRIES);
  const alg = h('div', 'derive');
  alg.hidden = true;
  alg.append(hh('div', 'proof', hh('div', 'proof-line',
    h('span', 'proof-num', '1.'),
    setTex(h('div', 'proof-eq'), String.raw`$P(|k-nQ|\ge n\varepsilon_2) \le \frac{\mathrm{Var}(k)}{(n\varepsilon_2)^2} = \frac{nQ(1-Q)}{n^2\varepsilon_2^2}$`),
    setTex(h('p', 'proof-why'), String.raw`Chebyshev with $t = n\varepsilon_2$, and $\mathrm{Var}(k) = nQ(1-Q)$`))));
  const takeaway = setTex(h('p', 'takeaway'), String.raw`Hamming only needs the miss chance to go to 0 as $n$ grows, and $\frac{Q(1-Q)}{n\varepsilon_2^2}$ already shows that.`);
  const btn = mark(h('button', 'btn', 'Show the derivation'), 'control', 'show-derivation');
  btn.addEventListener('click', () => {
    const open = alg.hidden;
    alg.hidden = !open;
    tries.hidden = open;
    btn.textContent = open ? 'Back to the tries' : 'Show the derivation';
    btn.classList.toggle('on', open);
    if (open) emit('view.action', { action: 'reveal', what: 'derivation' });
  });
  side.append(f, hh('div', 'actions', btn), tries, alg, takeaway);
}
function slideMiss(box) {
  const RNS = [2, 3, 4];
  let e = 2, Q = 0.1, e2 = 0.02, st = null;
  const pRow = h('div', 'actions');
  const pre = RNS.map(ex => {
    const b = mark(h('button', 'btn'), 'control', 'n1e' + ex);
    setTex(b, '$n = 10^{' + ex + '}$');
    b.addEventListener('click', () => { e = ex; sN.set(ex); emit('view.action', { action: 'n', n: Math.pow(10, ex) }); sync(); });
    pRow.append(b);
    return [ex, b];
  });
  const sN = slider(String.raw`$n$`, { id: 'n', name: 'block size', min: 1, max: 5, step: 0.01, value: e, fmt: nLabel, onInput: v => { e = v; sync(); } });
  const sQ = slider(String.raw`$Q$`, { id: 'Q', name: 'flip chance', min: 0.01, max: 0.3, step: 0.01, value: Q, fmt: v => v.toFixed(2), onInput: v => { Q = v; sync(); } });
  const sE = slider(String.raw`$\varepsilon_2$`, { id: 'e2', name: 'extra radius', min: 0.005, max: 0.1, step: 0.005, value: e2, fmt: v => v.toFixed(3), onInput: v => { e2 = v; sync(); } });
  box.append(pRow, hh('div', 'sliders tight', sN.el, sQ.el, sE.el));
  const plot = fillPlot(box, drawMiss);
  box.querySelector('.fill').style.minHeight = '160px';   // this slide has more rows above the chart
  const rE = rowReadout('exact', String.raw`Exact: $\sum_{k>r}\binom{n}{k}Q^k(1-Q)^{n-k}$`);
  const rG = rowReadout('gauss', String.raw`Gaussian: $1-\Phi(z)$, $z=(\lfloor r\rfloor+0.5-nQ)/\sigma$, $\sigma=\sqrt{nQ(1-Q)}$`);
  const rC = rowReadout('cheb', String.raw`Chebyshev: $\frac{Q(1-Q)}{n\varepsilon_2^2}$`);
  const tb = h('tbody');
  const tbl = hh('table', 'tbl tight', thRow(['$n$', 'exact', 'Gaussian', 'Chebyshev']), tb);
  box.append(hh('div', 'rd-list', rE.el, rG.el, rC.el), tbl);

  function drawMiss(svg, W, H) {
    const L = 46, R = 12, T = 14, B = 40, base = H - B, pw = W - L - R;
    const { lo, hi, pm, K, r, mu, sd } = st;
    const X = k => L + (k - lo) / (hi - lo) * pw;
    let pk = 0;
    for (let k = lo; k <= hi; k++) pk = Math.max(pk, pm[k]);
    const ymax = Math.max(pk, normPdf(0) / sd) * 2.0;   // headroom: the top of the plot holds the labels
    const Y = p => base - p / ymax * (base - T);
    const bw = Math.max(1, 0.8 * pw / (hi - lo + 1));
    for (let k = lo; k <= hi; k++) {
      const y = Y(pm[k]);
      svgNode('rect', {
        x: (X(k) - bw / 2).toFixed(2), y: y.toFixed(2), width: bw.toFixed(2), height: Math.max(0, base - y).toFixed(2),
        fill: k > K ? '#c81e1e' : '#9ca3af', 'data-item': 'mark', 'data-id': k > K ? 'miss-bars' : 'bars',
      }, svg);
    }
    let d = '';
    for (let i = 0; i <= 200; i++) {
      const x = lo + (hi - lo) * i / 200;
      d += (i ? ' L' : 'M') + X(x).toFixed(1) + ' ' + Y(normPdf((x - mu) / sd) / sd).toFixed(1);
    }
    svgNode('path', { d: d, fill: 'none', stroke: '#2563eb', 'stroke-width': 2.5, 'data-item': 'mark', 'data-id': 'gaussian' }, svg);
    svgNode('line', { x1: L, y1: base, x2: W - R, y2: base, stroke: '#9ca3af' }, svg);
    for (let i = 0; i <= 4; i++) {
      const k = Math.round(lo + (hi - lo) * i / 4);
      svgText(svg, X(k), base + 18, String(k), { 'text-anchor': i === 0 ? 'start' : i === 4 ? 'end' : 'middle', 'font-size': 15 });
    }
    svgTex(svg, (L + W - R) / 2, H - 10, String.raw`$k\text{, flipped bits}$`, { w: 200 });
    svgNode('line', { x1: X(r).toFixed(1), y1: T, x2: X(r).toFixed(1), y2: base, stroke: '#111', 'stroke-dasharray': '4 3', 'data-item': 'mark', 'data-id': 'r-line' }, svg);
    // Direct labels: the bars, the curve, the line at r, and the miss tail.
    haloTex(svg, L + 6, T + 12, String.raw`$P(k)=\binom{n}{k}Q^k(1-Q)^{n-k}$`, { w: 300, anchor: 'start', fill: '#374151' });
    haloTex(svg, L + 6, T + 30, String.raw`$\text{chance of exactly }k\text{ flips}$`, { w: 220, anchor: 'start', fill: '#374151' });
    const rightSide = X(r) > (L + W - R) * 0.55;
    haloTex(svg, rightSide ? X(r) - 6 : X(r) + 6, T + 10, String.raw`$r = n(Q+\varepsilon_2)$`, { w: 200, anchor: rightSide ? 'end' : 'start', fill: '#111' });
    haloTex(svg, W - R, T + 50, String.raw`$\text{Gaussian }\mathcal N(nQ,\,nQ(1-Q))$`, { w: 260, anchor: 'end', fill: '#1d4ed8' });
    const missRight = X(r) + 150 < W - R;   // the miss label goes right of the line when there is room, else left
    haloTex(svg, missRight ? X(r) + 6 : X(r) - 6, T + 74, String.raw`$k > r\text{: a miss}$`, { w: 140, anchor: missRight ? 'start' : 'end', fill: 'var(--pal-red)' });
    return svg;
  }
  function sync() {
    const n = Math.round(Math.pow(10, e)), s = Q + e2, r = n * s, K = Math.floor(r + 1e-9);
    const mu = n * Q, sd = Math.sqrt(n * Q * (1 - Q));
    const lp = binomLog2Pmf(n, Q), pm = lp.map(x => Math.pow(2, x));
    const exact = K >= n ? 0 : Math.pow(2, lse(lp.subarray(K + 1)));
    const gauss = normSf((K + 0.5 - mu) / sd);
    const cheb = Q * (1 - Q) / (n * e2 * e2);
    let lo = Math.max(0, Math.floor(Math.min(mu - 6 * sd, K)));
    let hi = Math.min(n, Math.ceil(Math.max(mu + 6 * sd, K + sd)));
    if (hi <= lo) hi = Math.min(n, lo + 1);
    st = { n, r, K, mu, sd, lo, hi, pm, exact, gauss, cheb };
    pre.forEach(([ex, b]) => b.classList.toggle('on', Math.abs(e - ex) < 0.005));
    rE.set(sci(exact));
    rG.set(sci(gauss));
    rC.set(cheb.toFixed(4) + (cheb > 1 ? ' (bound above 1: useless here)' : ''), cheb > 1);
    const trs = [2, 3, 4].map(ex => {
      const nn = Math.pow(10, ex), KK = Math.floor(nn * (Q + e2) + 1e-9);
      const mm = nn * Q, sg = Math.sqrt(nn * Q * (1 - Q));
      const tr = mark(h('tr'), 'row', 'n' + nn, 'n = ' + nn);
      tr.append(h('td', '', String(nn)),
        h('td', '', sci(tailP(nn, Q, KK))),
        h('td', '', sci(normSf((KK + 0.5 - mm) / sg))),
        h('td', '', (Q * (1 - Q) / (nn * e2 * e2)).toFixed(4)));
      return tr;
    });
    tb.replaceChildren(...trs);
    tex(tb);
    plot.redraw();
  }
  sync();
}

// ---------- frame ----------
const SLIDES = [
  { id: 'capacity', title: 'Capacity of the binary symmetric channel', tag: 'Lecture 14:14', mount: slideCapacity,
    formula: String.raw`$$C = 1 - H(Q)$$`,
    lines: ['Each bit flips with chance $Q$.', 'At $Q = 0.9$, flip every received bit back.', 'So $C$ at $Q = 0.9$ equals $C$ at $Q = 0.1$.'] },
  { id: 'var-sum', title: 'Variances add up', tag: 'Lecture 17:32', mount: slideVarSum, sideMount: varSumSide,
    lines: [String.raw`Why does the error count of a block vary only like $\sqrt{n}$?`] },
  { id: 'ratio-difference', title: 'The ratio settles, the difference grows', tag: 'Lecture 18:34', mount: slideRatio, sideMount: ratioSide,
    lines: ['How can errors spread out more and still concentrate?'] },
  { id: 'clt', title: 'Sums look Gaussian', tag: 'Lecture 19:04', mount: slideCLT, sideMount: cltSide,
    lines: ['Why is the error count bell-shaped, whatever one bit does?'] },
  { id: 'lln-watch', title: 'Watch the spread shrink', tag: 'Lecture 17:32', mount: slideLLNClip,
    formula: String.raw`$$\sigma\!\left(\tfrac{k}{n}\right) = \sqrt{\tfrac{Q(1-Q)}{n}}$$`,
    lines: [String.raw`$k$ bits flip out of $n$, each with chance $Q$.`,
      String.raw`As $n$ grows, $k/n$ sits ever closer to $Q$.`,
      String.raw`Next: try it yourself.`] },
  { id: 'lln', title: 'Errors pile up at $nQ$', tag: 'Lecture 17:32', mount: slideLLN,
    formula: String.raw`$$\sigma = \sqrt{nQ(1-Q)}$$`,
    lines: [String.raw`Each block has $n$ bits, and each flips with chance $Q$.`,
      String.raw`The spread $\sigma$ grows with $\sqrt{n}$, but $\sigma / n$ shrinks.`,
      String.raw`So the tail past $s = Q + e_2$ shrinks too.`] },
  { id: 'two-spheres', title: 'Two spheres around the sent word', tag: 'Lecture 16:27', mount: slideTwoSpheres, sideMount: twoSpheresSide,
    lines: ['Why does Hamming draw a second, larger sphere?'] },
  { id: 'miss-chance', title: 'How the miss chance is computed', tag: 'Lecture 19:04', mount: slideMiss, sideMount: missSide,
    lines: ['How do we get a number like 0.017 for landing outside the big sphere?'] },
  { id: 'sphere-volume', title: 'How big is a sphere of radius $ns$?', tag: 'Lecture 28:40', mount: slideSphere,
    formula: String.raw`$$\frac{1}{n}\log_2 V(n,\lfloor ns\rfloor) \le H(s)$$`,
    lines: ['$V(n,t)$ counts the words within $t$ bit flips of a point.',
      String.raw`Per dimension, $\frac{1}{n}\log_2 V$ climbs toward $H(s)$ as $n$ grows.`,
      'The next step shows why it never passes $H(s)$.'] },
  { id: 'sphere-proof', title: String.raw`Why the sphere stays below $2^{nH(s)}$`, tag: 'Lecture 28:40', mount: slideSphereProof,
    formula: String.raw`$$V(n,\lfloor ns\rfloor) \le 2^{nH(s)}$$`,
    lines: ['The binomial terms of all error counts add up to 1.',
      String.raw`Each sphere term is at least the $k = ns$ term.`,
      String.raw`So $V$ is at most $2^{nH(s)}$, for every $n$.`] },
  { id: 'sphere-hamming', title: "Hamming's route: ratio of neighbors", tag: 'Lecture 28:40', mount: slideHamming,
    formula: String.raw`$$\frac{\binom{n}{k-1}}{\binom{n}{k}} = \frac{k}{n-k+1}$$`,
    lines: ['Neighboring binomial terms have this ratio.',
      String.raw`For $k \le ns$, the ratio stays below $\frac{s}{1-s}$.`,
      String.raw`A geometric sum then gives the limit $H(s)$ too.`] },
  { id: 'sphere-packing', title: 'Perfect codes fill the space', tag: 'Lecture 28:40', mount: slidePacking,
    formula: String.raw`$$\frac{M\,V(n,t)}{2^{n}} = 1$$`,
    lines: ['Each codeword owns a sphere of radius $t$.',
      'Hamming $(7,4)$ and Golay $(23,12)$ fill all $2^n$ words, with no overlap.',
      'Shannon allows a small overlap instead.'] },
  { id: 'codebook', title: 'A code book made by coin tosses', tag: 'Lecture 23:55', mount: slideCodebook, sideMount: codebookSide,
    lines: ['What exactly is a random code book, and how is it used?'] },
  { id: 'random-bound', title: 'Why another word rarely lands in the sphere', tag: 'Lecture 25:33', mount: slideBoundBook, sideMount: boundSide,
    lines: [String.raw`How likely is a wrong code word inside the sphere around $b$?`] },
  { id: 'random-rate', title: String.raw`The rate limit: $R < 1 - H(Q)$`, tag: 'Lecture 27:08', mount: slideRateLimit, sideMount: rateSide,
    lines: ['How many messages can the book hold before confusions win?'] },
  { id: 'average-to-one', title: 'If the average is good, one book is good', tag: 'Lecture 31:48', mount: slideAverage, sideMount: averageSide,
    lines: ['Averaging over all books: how does that give one real code?'] },
  { id: 'monte-carlo', title: 'Try it: random codes in your browser', tag: 'Lecture 32:19', mount: slideMC, sideMount: mcSide,
    lines: ['How well does a random code book work, and what does it cost?'] },
  { id: 'monte-carlo-distances', title: String.raw`Codewords sit about $n/2$ apart`, tag: 'Lecture 31:15', mount: slideDistances,
    formula: String.raw`$$d(c_i, c_j) \approx \frac{n}{2}$$`,
    lines: ['Each bar counts pairs of codewords at that distance.',
      String.raw`Most pairs sit near $n/2$.`,
      String.raw`So spheres of radius $n(Q + e_2)$ rarely overlap.`] },
  { id: 'monte-carlo-predict', title: String.raw`Predict first: double $n$, keep the rate`, tag: 'Lecture 32:19', mount: slidePredict,
    formula: String.raw`$$\frac{k}{n} = \frac{1}{4}$$`,
    lines: ['Does the block error fall?',
      String.raw`What happens to the book, $n\,2^k$ bits?`,
      'Check your answer against the table on the previous step.'] },
];

let cur = 0;
let shownId = null;
function goTo(i) {
  epoch++;
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  if (shownId !== null && shownId !== s.id) emit('view.step', { step: s.id });
  shownId = s.id;
  const stage = $('#stage');
  stage.innerHTML = '';
  const widget = h('div', 'widget');
  const side = hh('div', 'side',
    h('div', 'tag', s.tag),
    setTex(h('h2'), s.title),
    s.formula ? h('div', 'formula', s.formula) : null,
    ...s.lines.map(t => h('p', 'line-txt', t)));
  if (s.sideMount) s.sideMount(side);   // optional: a slide adds more to its text column
  const sec = mark(h('section', 'slide'), 'step', s.id, s.title.replace(/\$/g, ''));
  sec.append(widget, side);
  stage.append(sec);
  stage.scrollTop = 0;
  s.mount(widget);
  tex(sec);
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, i) => d.classList.toggle('on', i === cur));
}
// A cue is a state: go to the named step, and do nothing if it is already shown.
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i >= 0 && i !== cur) goTo(i);
}
(function init() {
  const dots = $('#dots');
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = s.title.replace(/\$/g, '');
    b.addEventListener('click', () => goTo(i));
    dots.appendChild(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],textarea,select')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
})();

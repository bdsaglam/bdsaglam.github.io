<style>
/* Same look as l13-shannon-moves: white page, blue accent. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft);
  --u:clamp(16px,1.35vw,20px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-panel);display:flex;flex-direction:column;overflow:hidden}
header{padding:10px 28px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(6px,1.2vh,14px) 28px}
footer{display:flex;align-items:center;gap:10px;padding:8px 28px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Slide frame: the problem, cards and reveal on the left (about 3/5); question, try-steps, AI echo on the right (2/5). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:clamp(20px,2.6vw,40px)}
.widget{min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(9px,2.2vh,20px)}
.tag{font:15px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(24px,2.4vw,34px);line-height:1.2;margin:0;font-weight:650}
.q{margin:0;font-size:clamp(17px,1.6vw,21px);font-weight:600;line-height:1.35}
.fx{margin:0;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--pal-soft-hover);font-size:clamp(18px,1.7vw,23px);line-height:1.4}
.kicker{font-size:14px;color:var(--muted);margin:0 0 4px}
.blk{display:flex;flex-direction:column;gap:4px}
.ai{margin:0;font-size:16px;line-height:1.4}
.takeaway{margin:0;padding:12px 14px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px;line-height:1.4}
.tries{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:8px;font-size:clamp(16px,1.4vw,19px);line-height:1.4}
.tries li::marker{color:var(--accent);font-weight:600}
.hold{color:var(--muted);font-style:italic;background:var(--pal-soft-hover);border:1px dashed var(--line);border-radius:6px;padding:11px 12px;margin:0;font-size:16px;line-height:1.4}

/* The problem box */
.prob{flex:0 0 auto;border:1px solid var(--line);border-radius:10px;padding:6px 14px;background:var(--pal-soft-hover);font-size:16px;line-height:1.4}
.prob .lead{font-weight:650;color:var(--muted)}
.prob p{margin:0}

/* The three cards: sized by their content, so no card holds a blank band */
.opts{flex:0 0 auto;display:flex;flex-direction:column;gap:clamp(4px,0.5vw,8px)}
.opt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 14px;padding:clamp(6px,0.75vw,11px) 12px;border:1px solid var(--line);border-radius:10px;background:var(--pal-panel);color:inherit;text-align:left;cursor:pointer;min-width:0;font:inherit}
.opt .lhs{display:flex;flex-direction:column;gap:3px;min-width:0}
.opt .rhs{display:flex;flex-direction:column;gap:3px;min-width:0;border-left:1px solid var(--pal-soft-2);padding-left:14px}
.opt:not([aria-disabled="true"]):hover{border-color:var(--accent)}
.opt[aria-disabled="true"]{cursor:default}
.opt .top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:16px}
.opt .letter{font-weight:700;color:var(--accent)}
.opt .who{font-size:14px;color:var(--muted);text-align:right}
.opt .body{font-size:clamp(17px,1.5vw,20px);line-height:1.3}
.opt .asm{margin:0;font-size:clamp(16px,1.4vw,19px);line-height:1.35;color:var(--muted)}
.opt .verdict{font-size:clamp(16px,1.4vw,19px);line-height:1.35;color:var(--fg)}
.opt .verdict.idle{color:var(--muted);font-style:italic}
.opt.on{box-shadow:inset 0 0 0 2px var(--pal-ink)}
.opt.hamming{background:var(--chip);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.opt.hamming .who{color:var(--pal-accent-deep);font-weight:600}

/* The reveal fills what is left. Before a pick it holds the show-answer button, centred. */
.reveal{flex:1 1 auto;min-height:0;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:clamp(16px,1.3vw,18px);display:flex;flex-direction:column;justify-content:center;gap:6px}
.reveal .rv.hold{color:var(--muted)}
.reveal.idle{background:var(--pal-soft-hover);color:var(--muted)}
.rv{margin:0;line-height:1.4}
.rv .k{font-weight:650;color:var(--accent)}
.rv .t{color:var(--muted);font-size:14px;white-space:nowrap}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.btn{font:inherit;padding:7px 16px;border:1px solid var(--line);background:var(--pal-panel);border-radius:8px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--pal-on-accent)}
.btn:disabled{opacity:.4;cursor:default}
/* Short windows: tighter chrome and gaps, same type sizes */
@media (max-height:660px){
  header{padding-top:6px}
  #stage{padding:4px 28px}
  footer{padding:5px 28px}
  .reveal{gap:3px;padding:5px 12px}
  .takeaway{padding:8px 12px}
  .rv{line-height:1.3}
  .opts{gap:3px}
  .opt{padding:5px 12px}
  .widget{gap:5px}
  .side{gap:6px}
}
</style>

<body>
<header>You be Hamming: how he modeled it. Hamming 1995, Lecture 14 (digital filters, part I).</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script>
// ---------- helpers ----------
const $ = s => document.querySelector(s);
// $...$ and $$...$$ render with KaTeX. If the CDN did not load, the text stays as typed.
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false } ], throwOnError: false };
function tex(node) {
  if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH);
  return node;
}
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function hh(tag, cls, ...kids) {
  const e = h(tag, cls);
  for (const k of kids) if (k) e.append(k);
  return e;
}
function mark(e, kind, id, title) {
  e.dataset.item = kind;
  if (id != null) e.dataset.id = id;
  if (title != null) e.dataset.title = title;
  return e;
}
// Session events. With no bridge, nothing is sent and the view still works.
function emit(kind, data) {
  try {
    if (window.fluid && typeof window.fluid.emit === 'function') Promise.resolve(window.fluid.emit(kind, data)).catch(() => {});
  } catch (e) { /* no bridge */ }
}

// ---------- the eight moves, in the order of the lecture's video ----------
// options: three ways to model the problem, each with what it assumes and a verdict.
// hamming: the index of Hamming's card. reveal: three lines, each with the lecture time where Hamming says it.
// The one formula each step puts on the right, in the lecture's own notation.
const FORMULA = {
  'why-sinusoids': String.raw`$y_n = H(f)\, e^{i2\pi fn}$`,
  'unit-sampling': String.raw`$\omega = 2\pi f$, with $f$ in rotations per sample`,
  'think-in-the-band': String.raw`$\cos 2\pi(k+a)n = \cos 2\pi an$, for integers $k$ and $n$`,
  'step-size': String.raw`$N = \dfrac{1}{f_{\max}\,\Delta t}$ samples per cycle`,
  'sanity-check': String.raw`$f_{\max} < \dfrac{1}{2\,\Delta t}$`,
  'let-sampling-demodulate': String.raw`$\cos A\cos B=\tfrac12[\cos(A-B)+\cos(A+B)]$`,
  'smoother-from-fit': String.raw`$a=\bar u=\tfrac15\sum_{k=-2}^{2}u_k$`,
  'split-even-odd': String.raw`$f(x)=\tfrac12[f(x)+f(-x)]+\tfrac12[f(x)-f(-x)]$`
};
const TRIES = ['Read the problem.', 'Pick the model you would use.', 'Read every verdict, not only yours.'];
const SLIDES = [
  { id: 'why-sinusoids', tag: 'Lecture 07:23', title: 'Which functions should build a signal?',
    question: 'Which set of functions should you use, when many sets could work?',
    problem: 'Any complete set of functions can represent a signal. Electrical engineers still use only sinusoids. What should decide the choice?',
    hamming: 2,
    options: [
      { text: 'Sinusoids, because voices and AC power are sinusoids.', assumes: 'Assumes the signals you meet are already periodic.', verdict: 'True for those signals. Pulses and clicks are not periodic, so this fails.' },
      { text: 'Polynomials. Any complete set works, so use the simplest.', assumes: 'Assumes all complete sets are equally useful.', verdict: String.raw`Fails under sampling: on the points $t=-2,\dots,2$, $t^5$ equals $5t^3-4t$.` },
      { text: String.raw`Ask which functions a shift and a linear system leave unchanged: $e^{i2\pi fn}$.`, assumes: 'Assumes the right set is the one your operations keep simple.', verdict: 'A system only scales each one, by a single number. Every operation stays simple.' }
    ],
    reveal: [
      { k: 'Hamming\'s move', v: String.raw`Ask which functions a time-invariant linear system returns unchanged in shape. Those are the complex exponentials $e^{i2\pi fn}$.`, t: '08:25' },
      { k: 'What it bought', v: 'Each frequency is scaled by one number, the transfer function, which is the eigenvalue.', t: '10:34' },
      { k: 'What it cost', v: String.raw`Complex exponentials need complex numbers, so a real signal is a pair of them. Hamming says the algebra is simpler.`, t: '15:13' }
    ],
    ai: 'A convolution layer is linear and shift-invariant. The Fourier basis turns it into one multiply per frequency, which is why FFT convolution is fast.',
    takeaway: 'Pick the basis that your operations leave simple.' },

  { id: 'unit-sampling', tag: 'Lecture 11:06', title: 'Which units should time use?',
    question: 'How can a radar and an economist share one equation?',
    problem: 'Radar changes in microseconds. Economic data change in years. Each field keeps its own units, so their equations look different.',
    hamming: 2,
    options: [
      { text: 'Keep each field\'s own units.', assumes: 'Assumes the fields never need to compare results.', verdict: 'Each field keeps its own formulas, so a result does not carry across.' },
      { text: 'Measure frequency in radians per second.', assumes: String.raw`Assumes a sine should keep its $2\pi$ factor in the units.`, verdict: 'Better, but each equation still uses its own seconds, so the scales differ.' },
      { text: String.raw`Stretch time so samples fall at $0, 1, 2, \dots$, and measure frequency in rotations per sample.`, assumes: 'Assumes you can sample at equal steps, as equipment does.', verdict: 'One equation for every field. No scale factors are left.' }
    ],
    reveal: [
      { k: 'Hamming\'s move', v: String.raw`Sample at the integers $0, 1, 2, \dots$. Measure frequency in rotations per sample.`, t: '11:37' },
      { k: 'What it bought', v: 'Microseconds and years give the same equations once time counts samples.', t: '11:37' },
      { k: 'What it cost', v: String.raw`Calculus wants radians. In rotations, each derivative gets a $2\pi$ factor.`, t: '36:01' }
    ],
    ai: 'RoPE (Su et al., 2021) rotates each pair of query and key values by an angle that grows with token position. Its frequencies are in radians per token, the sample unit of text.',
    takeaway: 'Remove scale factors so that every field shares one equation.' },

  { id: 'think-in-the-band', tag: 'Lecture 13:41', title: 'What happens to the high frequencies?',
    question: 'After sampling, what do you keep of the frequencies above the limit?',
    problem: 'A high frequency, sampled at equal steps, looks the same as a lower one. Network people carry the high frequencies along. What should the model keep?',
    hamming: 2,
    options: [
      { text: 'Carry the periodic copies along.', assumes: 'Assumes every copy is worth keeping.', verdict: 'Correct, but the copies repeat forever, so the model never closes.' },
      { text: 'Ignore aliasing.', assumes: 'Assumes a high frequency leaves the samples unchanged.', verdict: 'Wrong: a high frequency shows up as a low one in the samples.' },
      { text: String.raw`Treat the high frequencies as gone. Everything lives in $-\tfrac12 \le f \le \tfrac12$.`, assumes: 'Assumes the samples cannot tell the copies apart.', verdict: 'One band only. Energy from above is added into it, and cannot be undone.' }
    ],
    reveal: [
      { k: 'Hamming\'s move', v: String.raw`Once sampled, keep only the low band: $-\tfrac12 \le f \le \tfrac12$.`, t: '13:41' },
      { k: 'What it bought', v: String.raw`Every high frequency becomes a frequency inside that band, so one band is enough.`, t: '13:11' },
      { k: 'What it cost', v: String.raw`The high frequency cannot be recovered without outside information. A sine at $f=\tfrac12$ samples to all zeros.`, t: '14:12' }
    ],
    ai: 'A pixel grid holds stripes only up to half a cycle per pixel. Finer stripes show up as false coarse stripes, called moiré. It is the same fold as aliasing.',
    takeaway: 'Model only what the data can still tell you.' },

  { id: 'step-size', tag: 'Lecture 16:14', title: 'How small must the step be?',
    question: 'How do you choose a step size when the usual error bound is out of reach?',
    problem: 'You solve 28 differential equations. Halving the step doubles the work. The usual error bound needs a fifth derivative, which nobody can give.',
    hamming: 2,
    options: [
      { text: 'Use the textbook error bound, from the fifth derivative.', assumes: 'Assumes someone can estimate the fifth derivative.', verdict: 'Sound in theory, but no one can estimate that derivative here.' },
      { text: 'Shrink the step until the answers stop changing.', assumes: 'Assumes you can pay for each smaller run.', verdict: 'Works, but each halving doubles the cost.' },
      { text: String.raw`Treat the step as sampling. Ask the client for the top frequency, then test samples per cycle on $y''+y=0$.`, assumes: 'Assumes the client can name a top frequency.', verdict: 'Turns an unknown into a question the client can answer.' }
    ],
    reveal: [
      { k: 'Hamming\'s move', v: 'Ask the client for the top frequency that matters: 10 cycles per second. Choose the step from it.', t: '17:46' },
      { k: 'What it bought', v: String.raw`On $y''+y=0$, whose exact answer is $\cos t$, seven steps per cycle matched it.`, t: '18:48' },
      { k: 'What it cost', v: 'Finite and one-sided data need more samples: about 2 per cycle with infinite data, then 4, then 8.', t: '18:17' }
    ],
    ai: 'Neural ODE models (Chen et al., 2018) run a learned ODE through a solver. Its step count sets the cost of each forward pass, so the tolerance is a budget choice.',
    takeaway: 'Replace a quantity nobody knows with one the client can tell you, then calibrate on the simplest case.' },

  { id: 'sanity-check', tag: 'Lecture 20:20', title: 'Is that step size possible?',
    question: 'How do you judge someone else\'s number when you cannot check every line?',
    problem: 'A contractor uses a thousandth to a ten-thousandth of a second per step to simulate a Nike launch. Should you trust the step?',
    hamming: 2,
    options: [
      { text: 'Trust it. The contractor is an expert.', assumes: 'Assumes expertise rules out arithmetic errors.', verdict: 'A claim, not a check. It tells you nothing about the step.' },
      { text: 'Rerun their code and compare the output.', assumes: 'Assumes the code is where any mistake lives.', verdict: 'Repeats the same mistake if the setup itself is wrong.' },
      { text: 'Estimate the highest frequency the model can carry. Compare it with the step.', assumes: 'Assumes a rough estimate of the top frequency is enough.', verdict: 'Off by about 100 times here, so a bug is likely.' }
    ],
    reveal: [
      { k: 'Hamming\'s move', v: 'Estimate the highest frequency the stick model can carry, then compare it with the step. The gap was about a factor of 100.', t: '21:23' },
      { k: 'What it bought', v: 'A rough number that shows a bug exists, before anyone finds it.', t: '21:23' },
      { k: 'What it cost', v: 'The estimate shows a bug, not where it is. A register that overflowed by 7 bits was the cause.', t: '21:23' }
    ],
    ai: 'Before a long training run, estimate its compute as about six times the parameters times the tokens. A measured run far off that number points to a bug, not to a surprise.',
    takeaway: 'An order-of-magnitude estimate is a debugging tool. If it and the result differ by 100 times, look for a bug first.' },

  { id: 'let-sampling-demodulate', tag: 'Lecture 21:55', title: 'Can sampling bring a signal down?',
    question: 'How can you bring a high-frequency signal down before you compute with it?',
    problem: 'A signal sits at a very high frequency. Sampling it fast enough for its raw frequency costs too much. What else can bring it down?',
    hamming: 2,
    options: [
      { text: 'Demodulation equipment: a large rack that shifts the band down.', assumes: 'Assumes a rack is the only way to shift a band.', verdict: 'Works, but the rack is large and costly.' },
      { text: 'Sample fast enough for the raw frequency.', assumes: 'Assumes the computer can handle that rate.', verdict: 'Valid, but at very high rates you cannot compute anything.' },
      { text: 'Sample slowly on purpose, so aliasing shifts the band down.', assumes: 'Assumes the band sits inside one zone.', verdict: 'Cheap, with no rack, when the band sits inside one zone.' }
    ],
    reveal: [
      { k: 'Hamming\'s move', v: 'Sample on purpose. If the band sits inside one zone, sampling alone brings it down.', t: '23:58' },
      { k: 'What it bought', v: 'The demodulation rack goes away. The sampling does its work.', t: '23:58' },
      { k: 'What it cost', v: String.raw`The band must sit inside one zone, a stretch of width $1$ in $f$. A band in the second zone comes back reversed.`, t: '24:29' }
    ],
    ai: 'Software radios sample a band above their converter\'s limit on purpose. The band folds down into the first zone, so a cheaper converter can capture it.',
    takeaway: 'Turn the artifact into the tool. If the band sits in one zone, sampling brings it down.' },

  { id: 'smoother-from-fit', tag: 'Lecture 27:08', title: 'How do you design a smoother?',
    question: 'Where do the weights of a smoothing filter come from?',
    problem: 'You want each noisy value replaced by a smooth one, from the values near it. What should set the weights?',
    hamming: 2,
    options: [
      { text: 'Pick the weights by feel.', assumes: 'Assumes a good smoother can be guessed.', verdict: 'Quick, but you cannot say what each frequency does.' },
      { text: 'Specify the frequency response first: pass the low frequencies, stop the rest.', assumes: 'Assumes the ideal response is the target.', verdict: 'A clear target, but the ideal filter needs infinitely many weights.' },
      { text: 'Start from a local least-squares fit, then examine what it does to each frequency.', assumes: 'Assumes squared error is a fair measure of a fit.', verdict: 'Gives a window of weights, and its effect on each frequency can be checked.' }
    ],
    reveal: [
      { k: 'Hamming\'s move', v: 'Fit a line by least squares to the nearby values. Its middle value becomes the smoothed output.', t: '27:38' },
      { k: 'What it bought', v: String.raw`The fit is a window of fixed weights. For a straight line, each weight is $\tfrac15$.`, t: '33:29' },
      { k: 'What it cost', v: 'Least squares is a choice. Hamming says most people believe in it, but he does not claim it is right.', t: '28:42' }
    ],
    ai: 'Savitzky and Golay (1964) smooth data with a fixed local fit. Attention builds a new window at each position from the data, so no single frequency response describes it.',
    takeaway: 'Derive the tool from a principle you trust, then test it where it acts: at each frequency.' },

  { id: 'split-even-odd', tag: 'Lecture 37:04', title: 'Are all filters special cases?',
    question: 'How can a general filter reduce to problems you can solve?',
    problem: 'A filter has a free weight at each offset. Designing each one from scratch looks endless. What is a shorter route?',
    hamming: 2,
    options: [
      { text: 'Design each filter from scratch.', assumes: 'Assumes every filter is a new problem.', verdict: 'No shortcut. Each design starts over.' },
      { text: 'Allow only symmetric filters.', assumes: 'Assumes symmetric filters cover what you need.', verdict: 'Gives smoothers only. Differentiators are antisymmetric, so they are missed.' },
      { text: String.raw`Split every filter into an even part and an odd part: a smoother plus a differentiator.`, assumes: 'Assumes any filter splits this way.', verdict: 'Exact: every filter is a sum of those two parts, so two designs cover all.' }
    ],
    reveal: [
      { k: 'Hamming\'s move', v: 'Split the filter into an even part, a smoother, and an odd part, a differentiator.', t: '38:08' },
      { k: 'What it bought', v: 'Each design becomes two smaller problems: a cosine series and a sine series.', t: '38:38' },
      { k: 'What it cost', v: 'The split does not design either part. Each part still needs its own work.', t: '38:08' }
    ],
    ai: String.raw`Transformers encode position with sine and cosine pairs (Vaswani et al., 2017). Each pair holds the odd and even parts of one complex exponential, $e^{i\omega n}$.`,
    takeaway: 'Reduce the general case to special cases you can master.' }
];
// Hamming's card sits at a different letter in each step, so its position gives nothing away.
const HAMMING_AT = [1, 0, 2, 0, 1, 2, 0, 1];
SLIDES.forEach((s, i) => {
  const [mine] = s.options.splice(s.hamming, 1);
  s.options.splice(HAMMING_AT[i], 0, mine);
  s.hamming = HAMMING_AT[i];
});

// ---------- state: each step keeps its pick, so Prev and Next restore it ----------
const state = SLIDES.map(() => ({ pick: null, shown: false }));
let cur = 0, shownId = null, ended = false;
const isOpen = i => state[i].pick !== null || state[i].shown;

function whoLabel(s, st, k, L) {
  const parts = [];
  if (st.pick === L) parts.push('Your pick');
  if (k === s.hamming) parts.push('Hamming');
  return parts.join(', ');
}

function pick(L) {
  const i = cur, s = SLIDES[i];
  if (isOpen(i)) return;
  const k = 'ABC'.indexOf(L);
  state[i].pick = L;
  emit('view.action', { action: 'pick', step: s.id, option: L, correct: k === s.hamming });
  draw();
}

function showAnswer() {
  const i = cur, s = SLIDES[i];
  if (isOpen(i)) return;
  state[i].shown = true;
  emit('view.action', { action: 'show', step: s.id });
  draw();
}

// Build the current step from its data and state. Does not emit view.step (goTo does).
function draw() {
  const i = cur, s = SLIDES[i], st = state[i], open = isOpen(i);
  const sec = mark(h('section', 'slide'), 'step', s.id, s.title);

  // Left column: the problem, three cards, the reveal.
  const widget = h('div', 'widget');
  const prob = mark(h('div', 'prob'), 'problem', s.id);
  const lead = h('span', 'lead', 'The problem.');
  prob.append(hh('p', '', lead, document.createTextNode(' '), setTex(h('span'), s.problem)));

  const opts = h('div', 'opts');
  s.options.forEach((o, k) => {
    const L = 'ABC'[k];
    const card = mark(h('div', 'opt'), 'option', L, o.text);
    card.setAttribute('role', 'button');
    card.setAttribute('aria-disabled', open ? 'true' : 'false');
    card.tabIndex = open ? -1 : 0;
    card.classList.toggle('on', st.pick === L);
    card.classList.toggle('hamming', open && k === s.hamming);
    const who = open ? whoLabel(s, st, k, L) : '';
    const top = hh('div', 'top', setTex(h('span', 'letter'), L), h('span', 'who', who));
    const body = setTex(h('div', 'body'), o.text);
    const asm = setTex(h('p', 'asm'), o.assumes);
    const verdict = open
      ? setTex(h('div', 'verdict'), o.verdict)
      : h('div', 'verdict idle', 'Verdict after your pick.');
    card.append(hh('div', 'lhs', top, body), hh('div', 'rhs', asm, verdict));
    card.addEventListener('click', () => { if (!isOpen(cur)) pick(L); });
    opts.append(card);
  });

  const rev = mark(h('div', 'reveal'), 'reveal', s.id);
  if (!open) {
    rev.classList.add('idle');
    const btn = mark(h('button', 'btn primary', 'Show answer'), 'control', 'show-answer');
    btn.addEventListener('click', showAnswer);
    for (const r of s.reveal) {
      rev.append(hh('p', 'rv hold', h('span', 'k', r.k + '. '), h('span', '', 'Shown after your pick.')));
    }
    rev.append(hh('div', 'actions', btn));
  } else {
    for (const r of s.reveal) {
      const p = hh('p', 'rv', h('span', 'k', r.k + '. '));
      p.append(setTex(h('span'), r.v), h('span', 't', ' (' + r.t + ')'));
      rev.append(p);
    }
  }
  widget.append(prob, opts, rev);

  // Right column: tag, title, the question, the try-steps; after a pick, the AI echo and the takeaway.
  const side = h('div', 'side');
  side.append(h('div', 'tag', s.tag), setTex(h('h2'), s.title), setTex(h('p', 'q'), s.question));
  side.append(setTex(h('p', 'fx'), FORMULA[s.id]));
  side.append(hh('div', 'blk', h('div', 'kicker', 'Try it'), hh('ol', 'tries', ...TRIES.map(t => h('li', '', t)))));
  if (open) {
    side.append(hh('div', 'blk', h('div', 'kicker', 'Same move in AI research'), setTex(h('p', 'ai'), s.ai)));
    side.append(setTex(h('p', 'takeaway'), s.takeaway));
  } else {
    side.append(hh('div', 'blk', h('div', 'kicker', 'Same move in AI research'), h('p', 'hold ai', 'Shown after your pick.')));
    side.append(h('p', 'hold takeaway', 'Takeaway: shown after your pick.'));
  }

  sec.append(widget, side);
  $('#stage').replaceChildren(sec);
  $('#stage').scrollTop = 0;
  tex(sec);
}

function paintNav() {
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, i) => d.classList.toggle('on', i === cur));
}

function goTo(i) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  if (shownId !== null && shownId !== s.id) emit('view.step', { step: s.id });
  shownId = s.id;
  draw();
  paintNav();
  // The last step ends the deck. Sent once.
  if (cur === SLIDES.length - 1 && !ended) { ended = true; emit('view.action', { action: 'deck-end' }); }
}

// A cue is a state: go to the named step, and do nothing if it is already shown.
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i >= 0 && i !== cur) goTo(i);
}

(function init() {
  const dots = $('#dots');
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = s.title;
    b.addEventListener('click', () => goTo(i));
    dots.appendChild(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],textarea,select')) return;
    if (e.target && e.target.classList && e.target.classList.contains('opt') && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault(); e.target.click(); return;
    }
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
})();
</script>
</body>
</html>

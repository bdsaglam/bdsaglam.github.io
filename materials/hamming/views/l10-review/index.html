<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Lecture 10 review: Coding theory I</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../../components/theme.js"></script>
<style>
/* Colors: grey for exact values and inputs, blue for outputs and the reader's choice,
   amber for what the newest proof line is about, red only for a failed check. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft); --red:var(--pal-red);
  --u:clamp(16px,1.35vw,20px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 24px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(6px,1vh,12px) 24px;overflow:hidden}
footer{display:flex;align-items:center;gap:10px;padding:8px 24px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Content slide: widget on the left (3/5), text on the right (2/5). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(18px,2.4vw,40px)}
.widget{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(5px,0.9vh,9px);overflow:hidden}
.widget>*{max-width:100%;min-width:0}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(6px,1.1vh,12px);overflow:hidden}
.tag{font:14px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(20px,1.9vw,28px);line-height:1.2;margin:0;font-weight:650}
.question{margin:0;font-size:clamp(16px,1.3vw,18px);font-weight:600}
.formula{font-size:clamp(17px,1.5vw,22px)}
.sym{margin:0;font-size:16px;color:var(--muted)}
.tries{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.tries li::marker{color:var(--accent);font-weight:600}
.where{margin:0;font-size:16px}
.where b{color:var(--accent)}
.takeaway{margin:0;padding:10px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px;transition:opacity .2s}

/* Controls and readouts */
.sliders{display:flex;gap:8px 22px;flex-wrap:wrap;width:100%;align-items:center}
.slide-ctl{display:flex;align-items:center;gap:8px;font-size:16px}
.slide-ctl input{width:clamp(110px,10vw,160px);vertical-align:middle;accent-color:var(--accent)}
.slide-ctl .val{min-width:50px;white-space:nowrap}
.btn{font:inherit;padding:5px 11px;border:1px solid var(--line);background:var(--pal-panel);border-radius:8px;cursor:pointer;font-size:16px;line-height:1.3}
.btn.on{background:var(--chip);border-color:var(--accent);color:var(--pal-accent-deep)}
.btn:disabled{color:var(--muted);cursor:default;opacity:.6}
.btnrow{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap}
.btnrow .lab{font-size:16px;color:var(--muted);margin-right:2px}
.readouts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.readout{flex:1 1 120px;min-width:0;padding:3px 8px;border-radius:10px;background:var(--pal-soft);font-size:15px;overflow-wrap:anywhere}
.readout .k{color:var(--muted);font-size:14px}
.readout .val{font-size:16px;font-weight:600}
.legend{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:15px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:20px;height:0;vertical-align:middle;margin-right:6px}
.chip{display:inline-block;width:18px;height:12px;vertical-align:middle;margin-right:6px;border-radius:2px}
.note{min-height:34px;display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;font-size:16px;padding:2px 10px;border-radius:8px;background:var(--pal-soft);border:1px solid var(--pal-grid)}
.note.ask{background:var(--pal-amber-row);border-color:var(--pal-amber-bg)}
.note .good{color:var(--accent);font-weight:600}

/* Plots fill the space left in the widget column */
.fill{flex:1 1 0;min-height:120px;position:relative;width:100%}
.fill>svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* Proof slides: test and picture on the left, the proof (fl-proof-steps) on the right */
.slide.proof-slide{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(18px,2.2vw,34px)}
.slide.proof-slide h2{font-size:clamp(20px,1.75vw,26px)}
.slide.proof-slide .side{gap:clamp(4px,0.8vh,9px)}
.slide.proof-slide .side{justify-content:flex-start}
.slide.proof-slide .slide-ctl input{width:clamp(90px,8vw,130px)}
.slide.proof-slide .slide-ctl .val{min-width:40px}
.slide.proof-slide .sliders{gap:6px 14px}
.slide.proof-slide .fill{min-height:180px}
.readouts.inline .readout{display:flex;gap:4px 8px;align-items:baseline;flex-wrap:wrap}
.part{margin:0;font-weight:600;color:var(--muted)}
.test{display:flex;flex-direction:column;gap:3px;font-size:16px}
.test .tries{gap:3px}
.model{margin:0;padding:7px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}

/* Decision slides: the problem, three cards and the reveal on the left; question, try-steps,
   AI echo and takeaway on the right. */
.slide.decision{grid-template-columns:minmax(0,2.05fr) minmax(0,1fr);gap:clamp(20px,2.6vw,40px)}
.decision .widget{gap:6px}
.decision .side{justify-content:space-evenly;gap:clamp(8px,1.8vh,18px)}
.decision h2{font-size:clamp(23px,2.3vw,32px)}
.decision .q{margin:0;font-size:clamp(17px,1.55vw,21px);font-weight:600;line-height:1.35}
.decision .fx{margin:0;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--pal-soft);font-size:clamp(17px,1.6vw,22px);line-height:1.4}
.decision .kicker{font-size:14px;color:var(--muted);margin:0 0 3px}
.decision .blk{display:flex;flex-direction:column;gap:3px}
.decision .ai{margin:0;font-size:16px;line-height:1.4}
.decision .ai .src{color:var(--muted);font-size:14px}
.decision .takeaway{padding:11px 14px;line-height:1.4}
.decision .tries{gap:6px;font-size:clamp(16px,1.35vw,18px);line-height:1.4}
.decision .hold{color:var(--muted);font-style:italic;background:var(--pal-soft);border:1px dashed var(--line);border-radius:6px;padding:9px 12px;margin:0;font-size:16px;line-height:1.4}
.prob{flex:0 0 auto;border:1px solid var(--line);border-radius:10px;padding:6px 14px;background:var(--pal-soft);font-size:16px;line-height:1.4}
.prob .lead{font-weight:650;color:var(--muted)}
.prob p{margin:0}
.opts{flex:0 0 auto;display:flex;flex-direction:column;gap:clamp(4px,0.5vw,8px)}
.opt{display:grid;grid-template-columns:minmax(0,0.78fr) minmax(0,1.22fr);gap:0 14px;padding:clamp(6px,0.7vw,10px) 12px;border:1px solid var(--line);border-radius:10px;background:var(--pal-panel);color:inherit;text-align:left;cursor:pointer;min-width:0;font:inherit}
.opt .lhs{display:flex;flex-direction:column;gap:3px;min-width:0}
.opt .rhs{display:flex;flex-direction:column;gap:3px;min-width:0;border-left:1px solid var(--pal-soft-2);padding-left:14px}
.opt:not([aria-disabled="true"]):hover{border-color:var(--accent)}
.opt[aria-disabled="true"]{cursor:default}
.opt .top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:16px}
.opt .letter{font-weight:700;color:var(--accent)}
.opt .who{font-size:14px;color:var(--muted);text-align:right}
.opt .body{font-size:clamp(16px,1.4vw,19px);line-height:1.3}
.opt .asm{margin:0;font-size:clamp(16px,1.3vw,18px);line-height:1.33;color:var(--muted)}
.opt .verdict{font-size:clamp(16px,1.3vw,18px);line-height:1.33;color:var(--fg)}
.opt .verdict.idle{color:var(--muted);font-style:italic}
.opt.on{box-shadow:inset 0 0 0 2px var(--pal-ink)}
.opt.chooser{background:var(--chip);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.opt.chooser .who{color:var(--accent);font-weight:600}
.reveal{flex:1 1 auto;min-height:0;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:clamp(16px,1.25vw,18px);display:flex;flex-direction:column;justify-content:center;gap:6px}
.reveal.idle{background:var(--pal-soft);color:var(--muted)}
.rv{margin:0;line-height:1.38}
.rv .k{font-weight:650;color:var(--accent)}
.rv .t{color:var(--muted);font-size:14px;white-space:nowrap}
.rv.hold{color:var(--muted)}
.decision .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px}
.decision .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--pal-on-accent);padding:6px 16px}

/* Short windows (1100x620 and similar): tighter spacing, body text stays 16px */
@media (max-height: 680px){
  header{padding-top:4px}
  #stage{padding:4px 24px}
  footer{padding:4px 24px}
  .widget{gap:4px}
  .side{gap:4px}
  .tries{gap:2px}
  .sym,.where,.tries,.test,.model{line-height:1.22}
  .readout{padding:2px 8px}
  .takeaway{padding:6px 10px}
  .formula{font-size:18px}
  h2{font-size:20px}
  .fill{min-height:100px}
  .note{min-height:30px;padding:1px 8px}
  .model{padding:5px 10px}
  .btn{padding:3px 9px}
  .slide-ctl input{width:100px}
  .slide.proof-slide .slide-ctl input{width:64px}
  .slide.proof-slide .slide-ctl .val{min-width:30px}
  .slide.proof-slide .sliders{gap:4px 10px}
  .slide.proof-slide .fill{min-height:165px}
  .decision h2{font-size:23px}
  .decision .side{gap:7px}
  .decision .tries{gap:2px;line-height:1.3}
  .decision .takeaway{padding:7px 12px}
  .reveal{gap:3px;padding:5px 12px}
  .rv{line-height:1.28}
  .opts{gap:3px}
  .opt{padding:4px 12px}
  .opt .body,.opt .asm,.opt .verdict{line-height:1.25}
  .prob{padding:4px 12px;line-height:1.3}
}

/* Predictions, explorers, tables (Lecture 10 review) */
.predict{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.pq{margin:0;font-size:16px;font-weight:600}
.pv{margin:0;font-size:16px;color:var(--accent)}
.explorer{display:flex;flex-direction:column;gap:6px;min-height:0;flex:1 1 auto}
.waiting{flex:1 1 auto;min-height:0;margin:0;font-size:16px;color:var(--muted);font-style:italic;padding:8px 12px;border:1px dashed var(--line);border-radius:6px;background:var(--pal-soft)}
.bits{font:16px ui-monospace,Menlo,monospace;width:9ch;padding:3px 6px;border:1px solid var(--line);border-radius:6px}
.parses{margin:0;padding-left:0;list-style:none;font-size:16px;font-family:ui-monospace,Menlo,monospace}
.lab{font-size:16px;color:var(--muted)}
.tbl{border-collapse:collapse;width:100%;font-size:16px;flex:0 0 auto}
.tbl th,.tbl td{border-bottom:1px solid var(--pal-soft-2);padding:1px 5px;text-align:center;font-weight:400}
.tbl th{color:var(--muted);font-weight:600}
.tbl tr.hid{display:none}
.formula{margin:0}
</style>
</head>
<body>
<header id="head">Lecture 10 review · Coding theory I: the representation of information</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script src="../../components/proof-steps.js"></script>
<script>
// ---------- palette ----------
// COL holds the palette colours for the SVG being drawn. fillPlot reads it at every paint, so a draw always
// uses the current theme. PLOTS are the plots on the current slide: a theme switch repaints them, and the
// slider and pick state (DOM and closures) stays.
let COL = {};
const PAL_NAMES = ['accent', 'blue-pale', 'amber', 'amber-bg', 'grey', 'ink', 'line', 'muted', 'panel', 'red', 'red-pale', 'soft', 'soft-2', 'text-2'];
function readPalette() {
  const o = {};
  for (const n of PAL_NAMES) o[n.replace(/-(\w)/g, (_, c) => c.toUpperCase())] = FluidTheme.color(n);
  return o;
}
let PLOTS = [];
window.addEventListener('fluid-themechange', () => PLOTS.forEach(p => p.redraw()));

// ---------- DOM and drawing helpers ----------
const $ = s => document.querySelector(s);
const NSV = 'http://www.w3.org/2000/svg', NHT = 'http://www.w3.org/1999/xhtml';
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false } ], throwOnError: false };
// Render $...$ in a node. If the CDN did not load, the text stays as typed.
function tex(node) {
  if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH);
  return node;
}
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function hh(tag, cls, ...kids) {
  const e = h(tag, cls);
  for (const k of kids) if (k) e.append(k);
  return e;
}
function mark(e, kind, id, title) {
  e.dataset.item = kind;
  if (id != null) e.dataset.id = id;
  if (title != null) e.dataset.title = title;
  return e;
}
function svgNode(tag, attrs, parent) {
  const e = document.createElementNS(NSV, tag);
  for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function svgRoot(w, ht) {
  return svgNode('svg', { viewBox: '0 0 ' + w + ' ' + ht, role: 'img', 'font-family': 'system-ui, sans-serif', 'font-size': 14 });
}
function svgText(parent, x, y, s, attrs) {
  const t = svgNode('text', Object.assign({ x: x, y: y, fill: COL.muted, 'font-size': 14 }, attrs || {}), parent);
  t.textContent = s;
  return t;
}
// A KaTeX label over an SVG: a foreignObject holding a rendered formula. o.bg paints a background.
function svgTex(parent, x, y, s, o) {
  o = o || {};
  const w = o.w || 220, ht = o.ht || 26, anchor = o.anchor || 'middle';
  const x0 = anchor === 'end' ? x - w : anchor === 'start' ? x : x - w / 2;
  const fo = svgNode('foreignObject', { x: x0, y: y - ht / 2, width: w, height: ht }, parent);
  const d = document.createElementNS(NHT, 'div');
  const jc = anchor === 'end' ? 'flex-end' : anchor === 'start' ? 'flex-start' : 'center';
  d.setAttribute('style', 'display:flex;align-items:center;height:100%;white-space:nowrap;font-size:' +
    (o.size || 15) + 'px;color:' + (o.fill || 'var(--pal-text-2)') + ';justify-content:' + jc);
  const span = document.createElementNS(NHT, 'span');
  span.textContent = s;
  if (o.bg) span.setAttribute('style', 'background:' + o.bg + ';border-radius:5px;padding:1px 5px');
  if (o.halo) span.setAttribute('style', 'text-shadow:0 0 3px var(--pal-bg),0 0 3px var(--pal-bg),0 0 2px var(--pal-bg)');
  d.appendChild(span);
  fo.appendChild(d);
  tex(span);
  return fo;
}
const haloTex = (parent, x, y, s, o) => svgTex(parent, x, y, s, Object.assign({ halo: true }, o || {}));
function path(svg, pts, attrs, close) {
  const d = 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L') + (close ? 'Z' : '');
  return svgNode('path', Object.assign({ d: d, fill: 'none' }, attrs), svg);
}
function dot(svg, x, y, color, r) {
  return svgNode('circle', { cx: x, cy: y, r: r || 5, fill: color, stroke: COL.panel, 'stroke-width': 1.5 }, svg);
}
// Tick label: KaTeX if it has $, plain text otherwise.
function tick(svg, x, y, s, anchor) {
  return s.indexOf('$') >= 0 ? svgTex(svg, x, y, s, { w: 80, size: 14, anchor: anchor || 'middle', fill: 'var(--pal-muted)' }) :
    svgText(svg, x, y + 5, s, { 'text-anchor': anchor || 'middle' });
}
// A labelled range input. label and the value text are LaTeX-ready.
function slider(label, o) {
  const wrap = h('label', 'slide-ctl');
  const lab = tex(h('span', '', label));
  const val = h('span', 'val', '');
  const inp = h('input');
  inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step; inp.value = o.value;
  mark(inp, 'control', o.id, o.name || o.id);
  wrap.append(lab, inp, val);
  const fmtv = o.fmt || String;
  const api = {
    el: wrap, input: inp,
    get value() { return +inp.value; },
    set(v) { inp.value = v; api.show(); },
    show() { setTex(val, fmtv(+inp.value)); },
  };
  inp.addEventListener('input', () => { api.show(); if (o.onInput) o.onInput(+inp.value); });
  api.show();
  return api;
}
// A readout box: label and value are LaTeX-ready text.
function readout(id, label) {
  const box = mark(h('div', 'readout'), 'readout', id);
  const k = h('div', 'k');
  setTex(k, label);
  const v = h('div', 'val');
  box.append(k, v);
  return { el: box, set(text) { setTex(v, text); }, label(text) { setTex(k, text); } };
}
function legend(items) {
  const d = h('div', 'legend');
  for (const it of items) {
    const s = h('span');
    const sw = it.chip ? h('span', 'chip') : h('span', 'sw');
    if (it.chip) { sw.style.background = it.color; if (it.ring) { sw.style.background = 'var(--pal-panel)'; sw.style.border = '2px solid ' + it.color; sw.style.borderRadius = '50%'; sw.style.width = '13px'; sw.style.height = '13px'; } }
    else sw.style.borderTop = (it.width || 2) + 'px ' + (it.dash ? 'dashed' : 'solid') + ' ' + it.color;
    const t = h('span');
    setTex(t, it.text);
    s.append(sw, t);
    d.appendChild(s);
  }
  return d;
}
// A plot that takes the height left in its box. draw(svg, W, H) runs on every resize and may
// return a geometry object (wrap._geo) that the pointer handlers use.
function fillPlot(box, draw) {
  const wrap = h('div', 'fill');
  box.append(wrap);
  let key = '';
  const paint = force => {
    const w = Math.floor(wrap.clientWidth), ht = Math.floor(wrap.clientHeight);
    if (w < 60 || ht < 60) return;
    if (!force && key === w + 'x' + ht) return;
    key = w + 'x' + ht;
    const svg = svgRoot(w, ht);
    COL = readPalette();
    wrap._geo = draw(svg, w, ht) || null;
    wrap.replaceChildren(svg);
  };
  new ResizeObserver(() => paint(false)).observe(wrap);
  const plot = { wrap, redraw: () => paint(true) };
  PLOTS.push(plot);
  return plot;
}
function sym(text) { return setTex(h('p', 'sym'), text); }
function triesList(items) { return hh('ol', 'tries', ...items.map(t => setTex(h('li'), t))); }
function takeLine(text) { return setTex(h('p', 'takeaway'), text); }
function noticeLine(text) { const p = h('p', 'where'); p.append(h('b', '', 'Notice: ')); p.append(setTex(h('span'), text)); return p; }
// Session events. With no bridge, nothing is sent and the view still works.
function emit(kind, data) {
  try {
    if (window.fluid && typeof window.fluid.emit === 'function') Promise.resolve(window.fluid.emit(kind, data)).catch(() => {});
  } catch (e) { /* no bridge */ }
}

// ---------- proof slides: shared parts ----------
// Amber marks what the newest proof line is about, in the picture and in the proof.
// Amber: COL.amber and COL.amberBg in SVG; var(--pal-amber), var(--pal-amber-bg) in HTML.
function glowPath(svg, pts, wdt) {
  return path(svg, pts, { stroke: COL.amberBg, 'stroke-width': wdt || 12, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
}
function glowFill(svg, pts) {
  return path(svg, pts, { fill: COL.amberBg, 'fill-opacity': .9, stroke: COL.amber, 'stroke-width': 1.5 }, true);
}
function glowDot(svg, x, y, r) {
  return svgNode('circle', { cx: x, cy: y, r: r || 9, fill: COL.amberBg, stroke: COL.amber, 'stroke-width': 1.5 }, svg);
}
// While a proof line is lit, a caption in the top row says what the amber part is.
function litCaption(svg, W, text) { svgTex(svg, W / 2, 13, text, { w: W - 8, size: 15, fill: 'var(--pal-ink)', bg: 'var(--pal-amber-bg)' }); }
function plainCaption(svg, W, text) { svgTex(svg, W / 2, 13, text, { w: W - 8, size: 14, fill: 'var(--pal-muted)' }); }
// Left column of a proof slide: controls, the picture, legend, readouts, the test, the model.
function proofLeft(widget, o) {
  for (const row of o.controls || []) widget.append(row);
  const plot = fillPlot(widget, o.draw);
  widget.append(legend(o.legend));
  if (o.readouts && o.readouts.length) widget.append(hh('div', 'readouts' + (o.inline ? ' inline' : ''), ...o.readouts.map(r => r.el)));
  const test = hh('div', 'test', h('p', 'part', 'Test it'), triesList(o.tests));
  const model = h('p', 'model');
  model.append(h('span', 'part', 'The picture: '), setTex(h('span'), o.model));
  widget.append(test, model);
  return { redraw: plot.redraw, wrap: plot.wrap, test: test };
}
// Right column: the proof. Each revealed line lights its part of the picture; once the proof is
// done, the look-back questions take the place of the test under the picture.
function proofRight(side, spec, plot, onLight) {
  const el = document.createElement('fl-proof-steps');
  el.onEvent = d => emit('view.action', d);
  el.onHighlight = key => onLight(key);
  el.lookBackHost = plot.test;
  el.lookBackHint = 'Look back: under the picture.';
  if (spec.endNote) el.endNote = spec.endNote;
  el.data = spec;
  side.append(el);
  return el;
}

// ---------- Lecture 10 shared parts ----------
const PST = {};     // per-slide state, kept when a slide is mounted again
const REVEAL = {};  // step id -> reveal(by) of its prediction; a cue {step, reveal: true} calls it
const sst = id => PST[id] || (PST[id] = {});
// Exact fraction as TeX, reduced: frac2(3, 6) is \tfrac{1}{2}; a whole number stays plain.
function frac2(num, den) {
  const gcd = (x, y) => y ? gcd(y, x % y) : Math.abs(x);
  const g = gcd(num, den) || 1, a = num / g, b = den / g;
  if (b === 1) return String(a);
  return (a < 0 ? '-' : '') + '\\tfrac{' + Math.abs(a) + '}{' + b + '}';
}
// A bit string as code: \mathtt keeps 0s and 1s upright.
const bits = w => '\\mathtt{' + w + '}';

// A prediction: a question, the answers, and the reveal. onOpen() paints the answer once the reader
// has picked (or after the cue reveal). The pick is an event; the reveal is an event too.
function predictor(id, q, opts, correct, onOpen) {
  const st = sst(id);
  const box = mark(h('div', 'predict'), 'predict', id);
  box.append(setTex(h('p', 'pq'), q));
  const row = h('div', 'btnrow');
  const verdict = h('p', 'pv');
  const btns = opts.map((o, k) => {
    const b = mark(h('button', 'btn'), 'control', 'pick-' + k);
    setTex(b, o);
    b.addEventListener('click', () => {
      if (st.open) return;
      st.pick = k;
      emit('view.action', { action: 'pick', step: id, option: k, correct: k === correct });
      reveal('user');
    });
    row.append(b);
    return b;
  });
  const show = mark(h('button', 'btn'), 'control', 'show-answer');
  show.textContent = 'Show the answer';
  show.addEventListener('click', () => reveal('user'));
  row.append(show);
  box.append(row, verdict);
  function paint() {
    btns.forEach((b, k) => { b.disabled = st.open; b.classList.toggle('on', st.pick === k); });
    show.hidden = st.open;
    verdict.hidden = !st.open;
    if (st.open) setTex(verdict, st.pick == null ? 'Shown without a pick.' : st.pick === correct ? 'Right.' : 'Not this one. Read the answer below.');
  }
  function reveal(by) {
    if (st.open) return false;
    st.open = true;
    emit('view.action', { action: 'reveal', step: id, by: by });
    paint();
    onOpen();
    return true;
  }
  REVEAL[id] = reveal;
  paint();
  if (st.open) onOpen();
  return box;
}
// Bit-string parses: every way to cut s into code words.
function parseAll(words, s) {
  const out = [];
  const rec = (i, acc) => {
    if (i === s.length) { out.push(acc.join(' + ')); return; }
    for (const w of words) if (s.startsWith(w, i)) rec(i + w.length, acc.concat([w]));
  };
  if (s.length) rec(0, []);
  return out;
}
// Pairs where one code word is the start of another.
function startsPairs(words) {
  const out = [];
  for (const a of words) for (const b of words) if (a !== b && b.startsWith(a)) out.push(a + ' is the start of ' + b);
  return out;
}

// ---------- slide 1: decodable (predict, then read the parses) ----------
const CODES = { A: ['0', '10', '110', '111'], B: ['0', '01', '011', '111'], C: ['0', '01', '10', '11'] };
function slideDecodable(widget, side) {
  const st = sst('decodable');
  if (!st.code) { st.code = 'C'; st.text = '010'; }
  const explorer = h('div', 'explorer');
  const waiting = h('p', 'waiting', 'The code, the string and its splits appear after your pick.');
  const codeRow = h('div', 'btnrow');
  const codeBtn = {};
  for (const k of Object.keys(CODES)) {
    const b = mark(h('button', 'btn'), 'control', 'code-' + k);
    b.textContent = 'Code ' + k;
    b.addEventListener('click', () => { st.code = k; paintEx(); });
    codeBtn[k] = b;
    codeRow.append(b);
  }
  const inp = mark(h('input', 'bits'), 'control', 'string');
  inp.type = 'text'; inp.maxLength = 12; inp.size = 12; inp.value = st.text;
  inp.setAttribute('aria-label', 'bit string');
  inp.addEventListener('input', () => { inp.value = inp.value.replace(/[^01]/g, ''); st.text = inp.value; paintEx(); });
  const strRow = hh('div', 'btnrow', h('span', 'lab', 'Bits:'), inp);
  for (const s of ['010', '0111', '1100', '0111111']) {
    const b = mark(h('button', 'btn'), 'preset', s);
    b.textContent = s;
    b.addEventListener('click', () => { st.text = s; inp.value = s; paintEx(); });
    strRow.append(b);
  }
  const list = h('ul', 'parses');
  const rWords = readout('code-words', 'code words');
  const rWays = readout('ways', 'splits of this string');
  const rPre = readout('prefix', 'a word starts another');
  const readouts = hh('div', 'readouts', rWords.el, rWays.el, rPre.el);
  explorer.append(codeRow, strRow, readouts, hh('p', 'sym', 'Each line is one way to cut the bits into code words:'), list);
  explorer.hidden = true;
  function paintEx() {
    const words = CODES[st.code];
    for (const k of Object.keys(codeBtn)) codeBtn[k].classList.toggle('on', k === st.code);
    rWords.set(words.map((w, i) => '$S_{' + (i + 1) + '}=' + bits(w) + '$').join(' '));
    const ps = parseAll(words, st.text);
    list.replaceChildren(...(st.text ? ps : ['Type a string of 0s and 1s.']).map(p => setTex(h('li'), p)));
    rWays.set(!st.text ? '' : ps.length === 0 ? 'none: no split' : ps.length === 1 ? '1 way' : ps.length + ' ways');
    const pairs = startsPairs(words);
    rPre.set(pairs.length ? pairs.map(p => p.replace(/^(\S+)/, '$1')).join('; ') : 'none: you know each word at its last bit');
    tex(explorer);
  }
  const pred = predictor('decodable', String.raw`Predict first. Code C reads the string $010$. In how many ways can you cut it into code words?`,
    ['1 way', '2 ways', '3 ways'], 1, () => { explorer.hidden = false; waiting.hidden = true; paintEx(); });
  waiting.hidden = !!sst('decodable').open;
  widget.append(pred, waiting, explorer);
  side.append(setTex(h('p', 'formula'), String.raw`$\text{no code word is the start of another}$`));
  side.append(setTex(h('p', 'sym'), String.raw`$S_i$: a code word, its bits. A message is a string of code words, and the receiver sees only the bits.`));
  side.append(triesList([
    String.raw`Pick one answer for code C and $010$. Then read the splits.`,
    String.raw`Switch to code B, type $0111111$. Can you name the first word before the last bit?`,
    String.raw`Click code A and type $110111$. Where does each word end?`]));
  side.append(takeLine('One way to cut the bits is the must. Knowing each word at its last bit is the wish.'));
}

// ---------- slide 2: decoding-tree (build a prefix code as a tree) ----------
function slideTree(widget, side) {
  const st = sst('decoding-tree');
  if (!st.leaves) st.leaves = [];
  const D = 3, DEN = 8;
  const note = h('div', 'note', '');
  note.append(setTex(h('span'), 'Click a node to make it a word. Its whole subtree is then blocked.'));
  const status = w => {
    if (st.leaves.includes(w)) return 'leaf';
    if (st.leaves.some(x => w.startsWith(x))) return 'blocked';
    if (st.leaves.some(x => x.startsWith(w))) return 'branch';
    return 'free';
  };
  const say = text => { note.replaceChildren(setTex(h('span'), text)); };
  function clickNode(w) {
    if (!w) return say('The root is the empty word, not a code word.');
    const s = status(w);
    if (s === 'leaf') { st.leaves = st.leaves.filter(x => x !== w); say('Removed the word $\\mathtt{' + w + '}$. Its subtree is free again.'); }
    else if (s === 'free') { st.leaves.push(w); say('The word $\\mathtt{' + w + '}$ has length $' + w.length + '$. Nothing below it can be a word now.'); }
    else if (s === 'blocked') { const b = st.leaves.find(x => w.startsWith(x)); say('Blocked: $\\mathtt{' + b + '}$ is a word, and $\\mathtt{' + w + '}$ starts with it.'); }
    else say('A word lies below $\\mathtt{' + w + '}$, so this node stays a branch.');
    plot.redraw(); paintReadouts();
  }
  const plot = fillPlot(widget, (svg, W, H) => {
    const top = 34, gap = (H - top - 26) / D, nodes = [];
    for (let d = 0; d <= D; d++) for (let i = 0; i < (1 << d); i++) {
      nodes.push({ w: d ? i.toString(2).padStart(d, '0') : '', d: d, x: (i + 0.5) * W / (1 << d), y: top + d * gap });
    }
    const pos = {};
    nodes.forEach(n => { pos[n.w] = n; });
    for (const n of nodes) if (n.d) {
      const p = pos[n.w.slice(0, -1)];
      svgNode('line', { x1: p.x, y1: p.y, x2: n.x, y2: n.y, stroke: COL.line, 'stroke-width': 2 }, svg);
    }
    plainCaption(svg, W, 'Root: the empty word. Each step down adds one bit.');
    for (const n of nodes) {
      const s = status(n.w);
      const g = mark(svgNode('g', { style: n.d ? 'cursor:pointer' : '' }, svg), 'control', n.w || 'root');
      const fill = s === 'leaf' ? COL.accent : s === 'branch' ? COL.soft2 : s === 'blocked' ? COL.soft : COL.panel;
      const stroke = s === 'leaf' ? COL.accent : s === 'blocked' ? COL.line : COL.muted;
      svgNode('circle', { cx: n.x, cy: n.y, r: n.d ? 16 : 6, fill: fill, stroke: stroke, 'stroke-width': 1.5, 'stroke-dasharray': s === 'blocked' ? '4 3' : null }, g);
      if (n.d) svgText(g, n.x, n.y + 5, n.w, { 'text-anchor': 'middle', fill: s === 'leaf' ? 'var(--pal-on-accent)' : 'var(--pal-fg)', 'font-size': 13 });
      if (n.d) g.addEventListener('click', () => clickNode(n.w));
    }
    if (st.leaves.length) { /* leaves are drawn above */ }
  });
  const rWords = readout('words', 'code words');
  const rK = readout('kraft', 'Kraft sum $K=\\sum_i 2^{-l_i}$');
  const rFree = readout('free', 'share of the tree still free');
  function paintReadouts() {
    const num = st.leaves.reduce((s, w) => s + Math.pow(2, D - w.length), 0);
    rWords.set(st.leaves.length ? st.leaves.map(w => '$' + bits(w) + '$').join(' ') : 'none yet');
    rK.set(st.leaves.length ? '$' + frac2(num, DEN) + '$' : '$0$');
    rFree.set('$' + frac2(DEN - num, DEN) + '$');
  }
  const legend0 = legend([
    { chip: true, color: 'var(--pal-accent)', text: 'blue: a code word; its length is its depth' },
    { chip: true, color: 'var(--pal-soft-2)', text: 'grey: a branch with a word below' },
    { chip: true, color: 'var(--pal-soft)', text: 'dashed: blocked by a word above' }]);
  const presets = h('div', 'btnrow');
  presets.append(h('span', 'lab', 'Try:'));
  for (const [name, ws] of [['A: 0, 10, 110, 111', ['0', '10', '110', '111']], ['Equal: 00, 01, 10, 11', ['00', '01', '10', '11']], ['Clear', []]]) {
    const b = mark(h('button', 'btn'), 'preset', name);
    b.textContent = name;
    b.addEventListener('click', () => { st.leaves = ws.slice(); say('Set: ' + (ws.length ? ws.join(', ') : 'no words') + '.'); plot.redraw(); paintReadouts(); });
    presets.append(b);
  }
  widget.append(presets, note, legend0, hh('div', 'readouts', rWords.el, rK.el, rFree.el));
  paintReadouts();
  side.append(setTex(h('p', 'formula'), String.raw`$K=\sum_i 2^{-l_i}$, with $l_i$ the depth of word $i$'s leaf`));
  side.append(setTex(h('p', 'sym'), String.raw`$l_i$: the length of word $i$, which is its depth. A word is the path of bits from the root to its leaf.`));
  side.append(triesList([
    String.raw`Click $0$. Before you look: how many of the eight 3-bit words start with $0$?`,
    String.raw`Click $10$. Which 3-bit words are still free?`,
    String.raw`Click $110$ and $111$. What is $K$ now?`]));
  side.append(takeLine('A word blocks everything under it, so no word can start another.'));
}

// ---------- slide 3: average-length (predict which code is shorter) ----------
const LEAN = ['0', '10', '110', '1110', '1111'], BUSHY = ['00', '01', '10', '110', '111'];
const CHANCES = {
  halves: { name: 'Halves', den: 16, num: [8, 4, 2, 1, 1] },   // 1/2, 1/4, 1/8, 1/16, 1/16
  equal: { name: 'Equal', den: 5, num: [1, 1, 1, 1, 1] }       // 1/5 each
};
function slideAverage(widget, side) {
  const st = sst('average-length');
  if (!st.dist) st.dist = 'halves';
  const explorer = h('div', 'explorer');
  const waiting = h('p', 'waiting', 'The table and the averages appear after your pick.');
  const presetRow = h('div', 'btnrow');
  presetRow.append(h('span', 'lab', 'Chances:'));
  const dBtn = {};
  for (const k of Object.keys(CHANCES)) {
    const b = mark(h('button', 'btn'), 'preset', k);
    b.textContent = CHANCES[k].name;
    b.addEventListener('click', () => { st.dist = k; paint(); });
    dBtn[k] = b;
    presetRow.append(b);
  }
  const table = h('table', 'tbl');
  const rLean = readout('L-lean', 'average length, lean code');
  const rBushy = readout('L-bushy', 'average length, bushy code');
  const rWin = readout('shorter', 'shorter on average');
  const readouts = hh('div', 'readouts', rLean.el, rBushy.el, rWin.el);
  explorer.append(presetRow, table, readouts);
  explorer.hidden = true;
  function paint() {
    const c = CHANCES[st.dist];
    for (const k of Object.keys(dBtn)) dBtn[k].classList.toggle('on', k === st.dist);
    const head = ['Symbol', '$p$', 'Lean', '$l$', '$p\\,l$', 'Bushy', '$l$', '$p\\,l$'];
    const thead = h('thead'), trh = h('tr');
    head.forEach(t => trh.append(setTex(h('th'), t)));
    thead.append(trh);
    const body = h('tbody');
    let sumL = 0, sumB = 0;
    for (let i = 0; i < 5; i++) {
      const tr = h('tr');
      const lw = LEAN[i], bw = BUSHY[i], ll = lw.length, bl = bw.length;
      sumL += c.num[i] * ll; sumB += c.num[i] * bl;
      const cells = [
        '$S_{' + (i + 1) + '}$', '$' + frac2(c.num[i], c.den) + '$', '$' + bits(lw) + '$', '$' + ll + '$',
        '$' + frac2(c.num[i] * ll, c.den) + '$', '$' + bits(bw) + '$', '$' + bl + '$', '$' + frac2(c.num[i] * bl, c.den) + '$'];
      cells.forEach(t => tr.append(setTex(h('td'), t)));
      body.append(tr);
    }
    const tot = h('tr');
    ['', '', '', '', '', '', '', ''].forEach((_, k) => tot.append(h('td')));
    tot.children[0].textContent = 'Average';
    setTex(tot.children[4], '$L=' + frac2(sumL, c.den) + '$');
    setTex(tot.children[7], '$L=' + frac2(sumB, c.den) + '$');
    body.append(tot);
    table.replaceChildren(thead, body);
    tex(table);
    rLean.set('$' + frac2(sumL, c.den) + '$');
    rBushy.set('$' + frac2(sumB, c.den) + '$');
    rWin.set(sumL < sumB ? 'lean, by $' + frac2(sumB - sumL, c.den) + '$' : sumB < sumL ? 'bushy, by $' + frac2(sumL - sumB, c.den) + '$' : 'the same');
  }
  const pred = predictor('average-length', String.raw`Predict first. The chances are $\tfrac12,\tfrac14,\tfrac18,\tfrac1{16},\tfrac1{16}$. Which code has the shorter average length $L$?`,
    ['Lean: lengths 1, 2, 3, 4, 4', 'Bushy: lengths 2, 2, 2, 3, 3', 'Neither: the same'], 0,
    () => { explorer.hidden = false; waiting.hidden = true; paint(); });
  waiting.hidden = !!sst('average-length').open;
  widget.append(pred, waiting, explorer);
  side.append(setTex(h('p', 'formula'), String.raw`$L=\sum_i p_i\,l_i$`));
  side.append(setTex(h('p', 'sym'), String.raw`$p_i$: the chance that symbol $i$ is sent; the chances add to $1$. $l_i$: the length of its word in bits. $L$: the average bits per symbol, a weighted average.`));
  side.append(triesList([
    String.raw`Keep Halves. Read the $p\,l$ columns. Which code has the smaller sum?`,
    String.raw`Switch to Equal. Which code wins now? Why?`,
    String.raw`Hamming says (20:26): nearly equal chances favor a bushy code. Does your reading agree?`]));
  side.append(takeLine('The better code depends on the chances, not only on the words.'));
}

// ---------- slide 4: kraft (proof: a prefix code obeys K <= 1) ----------
function slideKraft(widget, side) {
  let L = [1, 2, 3, 3], lit = '';
  const sl = [0, 1, 2, 3].map(i => slider('$l_{' + (i + 1) + '}$', {
    id: 'l' + (i + 1), name: 'length of word ' + (i + 1), min: 1, max: 5, step: 1, value: L[i],
    fmt: v => '$' + v + '$', onInput: v => { L[i] = v; update(); } }));
  const rK = readout('kraft-sum', 'Kraft sum $K=\\sum_i 2^{-l_i}$');
  const rFit = readout('fits', 'verdict');
  function kr() {
    const D = Math.max(...L);
    const num = L.reduce((s, l) => s + Math.pow(2, D - l), 0);
    return { num: num, den: Math.pow(2, D) };
  }
  function update() {
    const k = kr();
    rK.set('$' + frac2(k.num, k.den) + '$');
    rFit.set(k.num <= k.den ? 'fits: a prefix code exists' : 'too big: no prefix code');
    plot.redraw();
  }
  const plot = proofLeft(widget, {
    controls: [hh('div', 'sliders', ...sl.map(s => s.el))],
    draw: (svg, W, H) => {
      const k = kr(), K = k.num / k.den;
      const x0 = 26, x1 = W - 26, scale = Math.max(1, K);
      const X = v => x0 + v / scale * (x1 - x0);
      const yb = H * 0.42, hb = Math.max(60, H * 0.3);
      if (lit === 'halves') litCaption(svg, W, 'Halves of the bar: the two subtrees $T_0$ and $T_1$.');
      else if (lit === 'shift') litCaption(svg, W, 'One level deeper: each word takes half its old share.');
      else if (lit === 'sum') litCaption(svg, W, 'Two halves, each at most $\\tfrac12$: the total is at most $1$.');
      else plainCaption(svg, W, 'The bar is all words. A word of length $l$ takes the share $2^{-l}$.');
      svgNode('rect', { x: X(0), y: yb, width: X(1) - X(0), height: hb, fill: COL.soft, stroke: COL.grey }, svg);
      const sorted = L.slice().sort((a, b) => a - b);
      let c = 0;
      sorted.forEach((l, i) => {
        const w = Math.pow(2, -l);
        const a = X(c), b = X(c + w);
        const inside = Math.min(b, X(1)), out = Math.max(a, X(1));
        const fill = lit === 'shift' ? COL.amberBg : COL.bluePale;
        if (inside > a) svgNode('rect', { x: a, y: yb, width: inside - a, height: hb, fill: fill, stroke: lit === 'shift' ? COL.amber : COL.accent, 'stroke-width': lit === 'shift' ? 2.5 : 1 }, svg);
        if (b > X(1) && a < X(1)) svgNode('rect', { x: X(1), y: yb, width: b - X(1), height: hb, fill: COL.redPale, stroke: COL.red }, svg);
        if (out < b && a >= X(1)) svgNode('rect', { x: a, y: yb, width: b - a, height: hb, fill: COL.redPale, stroke: COL.red }, svg);
        if (b - a >= 24) haloTex(svg, (a + b) / 2, yb + hb / 2, '$S_{' + (i + 1) + '}$', { w: 60, size: 15, fill: 'var(--pal-fg)' });
        if (b - a >= 24) svgTex(svg, (a + b) / 2, yb + hb + 14, '$l=' + l + '$', { w: 60, size: 14, fill: 'var(--pal-muted)' });
        c += w;
      });
      svgNode('line', { x1: X(1), y1: yb - 8, x2: X(1), y2: yb + hb + 8, stroke: COL.ink, 'stroke-width': 2 }, svg);
      svgTex(svg, X(1), yb - 16, '$1$', { w: 40, size: 15, fill: 'var(--pal-ink)' });
      svgNode('line', { x1: X(0.5), y1: yb - 4, x2: X(0.5), y2: yb + hb + 4, stroke: lit === 'halves' ? COL.amber : COL.muted, 'stroke-width': lit === 'halves' ? 3 : 1.5, 'stroke-dasharray': '5 4' }, svg);
      svgTex(svg, X(0.25), yb + hb + 40, '$T_0$: words that start $0$', { w: 220, size: 14, fill: 'var(--pal-text-2)' });
      svgTex(svg, X(0.75), yb + hb + 40, '$T_1$: words that start $1$', { w: 220, size: 14, fill: 'var(--pal-text-2)' });
      if (K > 1) svgTex(svg, (X(1) + x1) / 2, yb - 36, 'overflow beyond $1$', { w: 200, size: 14, fill: 'var(--pal-red)' });
      return null;
    },
    legend: [
      { chip: true, color: 'var(--pal-blue-pale)', text: 'blue: a word, share $2^{-l}$' },
      { chip: true, color: 'var(--pal-red-pale)', text: 'red: share past the line at $1$' },
      { color: 'var(--pal-muted)', width: 1.5, dash: true, text: 'dashed: the root split' }],
    readouts: [rK, rFit],
    tests: [
      String.raw`Guess: all four lengths $2$. Is there a prefix code? Yes: $00,01,10,11$, and $K=1$.`,
      String.raw`Set $1,2,2,3$. Do $2,2,3$ fit beside the length-$1$ word? $K=\tfrac98$: no.`],
    model: String.raw`a word of length $l$ takes $2^{-l}$ of the bar. The two halves are the root's subtrees.` });
  proofRight(side, {
    id: 'kraft',
    goal: { tex: String.raw`K=\sum_i 2^{-l_i}\le1`, words: 'for every prefix code; $l_i$ is the depth of word $i$ (21:27)' },
    facts: [
      { words: 'A prefix code is a tree: each word is a leaf, and its length is its depth (11:45).' },
      { words: 'Induction on the longest word, $L$. Subtrees of a tree of depth $L$ have depth below $L$.' }],
    lines: [
      { tex: String.raw`K(T_0)\le1\ \text{and}\ K(T_1)\le1`, move: 'Induction', choices: ['Take a limit', 'Contradiction'],
        why: 'the hypothesis for the two shallower subtrees', highlight: 'halves' },
      { tex: String.raw`K(T)=\tfrac12K(T_0)+\tfrac12K(T_1)`, move: 'Unfold the definition', choices: ['Name a piece', 'Change variables'],
        why: 'one level deeper halves each term: $2^{-l}$ becomes $\\tfrac12\\,2^{-l}$', highlight: 'shift' },
      { tex: String.raw`K(T)\le\tfrac12\cdot1+\tfrac12\cdot1=1`, move: 'Rearrange', choices: ['Use an earlier result', 'Telescope'],
        why: 'put line 1 into line 2; the halves add to $1$', highlight: 'sum' },
      { tex: String.raw`\text{base }L=0:\ K=1;\ \text{so}\ K\le1\text{ for every prefix code}`, move: 'Induction', choices: ['Contradiction', 'Take a limit'],
        why: 'base: the empty word; the step covers deeper trees' }],
    lookBack: [
      { q: 'Does the proof need base 2?',
        a: String.raw`No. In base $b$ the same argument gives $\sum_i b^{-l_i}\le1$. Hamming: a ternary base puts a three in the sum (21:27).` },
      { q: 'Does $K\\le1$ give a prefix code?',
        a: 'Yes. The next slide builds one from any lengths with $K\\le1$, so the lengths of a prefix code are possible exactly when $K\\le1$.' },
      { q: 'Why do $1,2,2,3$ fail?',
        a: String.raw`The length-$1$ word takes $\tfrac12$. The words $2,2,3$ must fit in the other half: $\tfrac14+\tfrac14+\tfrac18=\tfrac58>\tfrac12$.` }] },
    plot, key => { lit = key || ''; plot.redraw(); });
  update();
}

// ---------- slide 5: kraft-binary-point (predict a word, then build the words) ----------
const KB_L = [2, 2, 3, 3, 4, 4, 4, 4];
function slideBinaryPoint(widget, side) {
  const st = sst('kraft-binary-point');
  if (st.shown == null) st.shown = 0;
  const explorer = h('div', 'explorer');
  const waiting = h('p', 'waiting', 'The bar and the words appear after your pick.');
  const cum = [];
  let run = 0;
  KB_L.forEach(l => { cum.push(run); run += Math.pow(2, 4 - l); });  // start of each symbol, in sixteenths
  const starts = cum.map(v => v / 16);
  const words = KB_L.map((l, i) => cum[i].toString(2).padStart(4, '0').slice(0, l));
  const binOf = i => {
    const b4 = cum[i].toString(2).padStart(4, '0').replace(/0+$/, '');
    return b4 ? '$0.' + bits(b4) + '_2$' : '$0$';
  };
  const btnRow = h('div', 'btnrow');
  const nextB = mark(h('button', 'btn'), 'control', 'next-symbol'); nextB.textContent = 'Next symbol';
  const allB = mark(h('button', 'btn'), 'control', 'show-all'); allB.textContent = 'Show all';
  const resetB = mark(h('button', 'btn'), 'control', 'reset'); resetB.textContent = 'Reset';
  nextB.addEventListener('click', () => { st.shown = Math.min(8, st.shown + 1); paint(); });
  allB.addEventListener('click', () => { st.shown = 8; paint(); });
  resetB.addEventListener('click', () => { st.shown = 0; paint(); });
  btnRow.append(nextB, allB, resetB);
  const table = h('table', 'tbl');
  explorer.append(btnRow);
  const plot = fillPlot(explorer, (svg, W, H) => {
    const x0 = 22, x1 = W - 22, yb = H * 0.38, hb = Math.max(56, H * 0.36);
    const X = v => x0 + v * (x1 - x0);
    plainCaption(svg, W, 'The bar is $[0,1)$. Each word gets a piece, starting where the last one ends.');
    svgNode('rect', { x: x0, y: yb, width: x1 - x0, height: hb, fill: COL.soft, stroke: COL.grey }, svg);
    KB_L.forEach((l, i) => {
      const a = X(starts[i]), b = X(starts[i] + Math.pow(2, -l));
      const shown = i < st.shown;
      const last = i === st.shown - 1;
      svgNode('rect', { x: a, y: yb, width: b - a, height: hb, fill: last ? COL.amberBg : shown ? COL.bluePale : COL.panel, stroke: last ? COL.amber : shown ? COL.accent : COL.grey, 'stroke-dasharray': shown ? null : '4 3' }, svg);
      if (shown && b - a >= 30) haloTex(svg, (a + b) / 2, yb + hb / 2, '$S_{' + (i + 1) + '}$', { w: 50, size: 15, fill: 'var(--pal-fg)' });
    });
    svgTex(svg, X(0), yb + hb + 14, '$0$', { w: 40, size: 14, fill: 'var(--pal-muted)', anchor: 'start' });
    svgTex(svg, X(1), yb + hb + 14, '$1$', { w: 40, size: 14, fill: 'var(--pal-muted)', anchor: 'end' });
    svgTex(svg, X(0.5), yb + hb + 14, '$\\tfrac12$', { w: 60, size: 14, fill: 'var(--pal-muted)' });
    return null;
  });
  function paint() {
    [...table.tBodies[0].rows].forEach((tr, i) => tr._cells.forEach((t, j) => {
      const td = tr.cells[j];
      if (j < 2 || i < st.shown) setTex(td, t); else td.textContent = '?';
    }));
    nextB.disabled = st.shown >= 8;
    plot.redraw();
  }
  const thead = h('thead'), hr = h('tr');
  ['Symbol', 'Length $l$', 'Start', 'Start in binary', 'Word: first $l$ digits'].forEach(t => hr.append(setTex(h('th'), t)));
  thead.append(hr);
  const tbody = h('tbody');
  KB_L.forEach((l, i) => {
    const tr = h('tr');
    const cells = ['$S_{' + (i + 1) + '}$', '$' + l + '$', '$' + frac2(cum[i], 16) + '$', binOf(i), '$' + bits(words[i]) + '$'];
    tr._cells = cells;
    cells.forEach(() => tr.append(h('td')));
    tbody.append(tr);
  });
  table.replaceChildren(thead, tbody);
  explorer.append(table);
  plot.wrap.style.flex = '0 0 132px';
  plot.wrap.style.minHeight = '0';
  explorer.hidden = true;
  const pred = predictor('kraft-binary-point', String.raw`Predict first. The lengths are $2,2,3,3,4,4,4,4$ in that order. Which word goes to symbol 5, the first of length $4$?`,
    ['1000', '1100', '1011'], 1,
    () => { explorer.hidden = false; waiting.hidden = true; if (st.shown < 5) st.shown = 5; paint(); tex(explorer); });
  waiting.hidden = !!sst('kraft-binary-point').open;
  widget.append(pred, waiting, explorer);
  side.append(setTex(h('p', 'formula'), String.raw`$\text{start}_i=\sum_{j<i}2^{-l_j}$, and word $i$ = the first $l_i$ digits of $\text{start}_i$`));
  side.append(setTex(h('p', 'sym'), String.raw`$0.b_1b_2\dots_2=\sum_k b_k2^{-k}$: a binary fraction. $\tfrac12=0.1_2$, $\tfrac34=0.11_2$. Lengths sum to $1$.`));
  side.append(triesList([
    String.raw`Click Next symbol three times. Check each start: it is the sum of the earlier $2^{-l}$.`,
    String.raw`Take symbol 4. Does any later piece of the bar fall inside its piece?`,
    String.raw`Count the words that start with $1$. Which share of the bar do they cover?`]));
  side.append(takeLine('Sort by length, start each word where the last one ends, and cut its start to its length.'));
}

// ---------- slide 6: mcmillan (uniquely decodable codes obey K <= 1 too) ----------
function bigTex(v) {
  if (v < 1e6) return String(Math.round(v));
  const [m, e] = v.toExponential(1).split('e+');
  return m + '\\times10^{' + e + '}';
}
function slideMcMillan(widget, side) {
  let K = 1.05, ell = 4, lit = '';
  const NMAX = 150, YMAX = 1400;
  const crossing = () => { for (let n = 1; n <= NMAX; n++) if (Math.pow(K, n) > n * ell - n + 1 + 1e-12) return n; return 0; };
  const sK = slider('$K$', { id: 'K', name: 'Kraft sum K', min: 0.95, max: 1.10, step: 0.01, value: K,
    fmt: v => '$' + v.toFixed(2) + '$', onInput: v => { K = v; update(); } });
  const sE = slider('$\\ell$', { id: 'ell', name: 'longest word ell', min: 1, max: 6, step: 1, value: ell,
    fmt: v => '$' + v + '$', onInput: v => { ell = v; update(); } });
  const rCross = readout('crossing', 'first $n$ with $K^n>n\\ell-n+1$');
  const rTop = readout('top', '$K^{150}$');
  function update() {
    if (K <= 1 + 1e-12) rCross.set('never: $K^n\\le1\\le n\\ell-n+1$');
    else { const c = crossing(); rCross.set(c ? '$n=' + c + '$' : 'beyond $n=150$'); }
    rTop.set('$' + bigTex(Math.pow(K, NMAX)) + '$');
    plot.redraw();
  }
  const plot = proofLeft(widget, {
    controls: [hh('div', 'sliders', sK.el, sE.el)],
    draw: (svg, W, H) => {
      const padL = 46, padB = 34, padT = 26, padR = 14;
      const X = n => padL + n / NMAX * (W - padL - padR);
      const Y = v => H - padB - Math.min(v, YMAX) / YMAX * (H - padB - padT);
      if (lit === 'expand') litCaption(svg, W, 'Blue: $K^n$, the $n$th power of the Kraft sum');
      else if (lit === 'line') litCaption(svg, W, 'Grey: $n\\ell-n+1$, the most that $n$ words of length up to $\\ell$ can hold');
      else if (lit === 'exp') litCaption(svg, W, 'Blue: $K^n$ passes any straight line in the end');
      else if (lit === 'cross') litCaption(svg, W, 'The crossing: where $K^n$ overtakes the line');
      else plainCaption(svg, W, 'Blue: $K^n$. Grey: the line $n\\ell-n+1$. Both for $n$ from $0$ to $150$.');
      svgNode('line', { x1: padL, y1: H - padB, x2: W - padR, y2: H - padB, stroke: COL.grey }, svg);
      svgNode('line', { x1: padL, y1: padT, x2: padL, y2: H - padB, stroke: COL.grey }, svg);
      for (const n of [0, 50, 100, 150]) tick(svg, X(n), H - padB + 14, '$' + n + '$');
      tick(svg, padL - 6, Y(1000) + 5, '$1000$', 'end');
      tick(svg, padL - 6, Y(0) + 5, '$0$', 'end');
      const line = [], curve = [];
      for (let n = 0; n <= NMAX; n++) { line.push([X(n), Y(n * ell - n + 1)]); curve.push([X(n), Y(Math.pow(K, n))]); }
      path(svg, line, { stroke: lit === 'line' ? COL.amber : COL.muted, 'stroke-width': lit === 'line' ? 5 : 2.5 });
      path(svg, curve, { stroke: lit === 'expand' || lit === 'exp' ? COL.amber : COL.accent, 'stroke-width': lit === 'expand' || lit === 'exp' ? 5 : 2.5 });
      const c = crossing();
      if (lit === 'cross' && c && K > 1) glowDot(svg, X(c), Y(Math.pow(K, c)), 9);
      return null;
    },
    legend: [
      { color: 'var(--pal-accent)', width: 3, text: 'blue: $K^n$' },
      { color: 'var(--pal-muted)', width: 3, text: 'grey: $n\\ell-n+1$, the bound' }],
    readouts: [rCross, rTop],
    tests: [
      String.raw`Guess: $K=1.00$. Does the blue curve pass the grey line? No: $1\le n\ell-n+1$.`,
      String.raw`Guess: $K=1.05$, $\ell=4$. How far out is the first crossing? $n=121$.` ],
    model: String.raw`$K^n$ outgrows every straight line, so a decodable code cannot have $K>1$.` });
  proofRight(side, {
    id: 'mcmillan',
    goal: { tex: String.raw`K=\sum_i 2^{-l_i}\le1`, words: 'for every uniquely decodable code (27:18)' },
    facts: [
      { words: 'Uniquely decodable: two messages never share a bit string.' },
      { words: '$N_k$: the strings of $n$ words with total length $k$.' }],
    lines: [
      { tex: String.raw`K^n=\sum_{s}2^{-|s|}`, move: 'Rearrange', choices: ['Name a piece', 'Telescope'],
        why: 's: a string of $n$ words; $|s|$: its total length', highlight: 'expand' },
      { tex: String.raw`K^n=\sum_{k=n}^{n\ell}N_k\,2^{-k}`, move: 'Name a piece', choices: ['Change variables', 'Use symmetry'],
        why: 'group the strings by total length $k$' },
      { tex: String.raw`K^n\le n\ell-n+1`, move: 'Compare or bound', choices: ['Take a limit', 'Induction'],
        why: 'unique decoding gives $N_k\\le2^k$, so each of the $n\\ell-n+1$ terms is at most $1$', highlight: 'line' },
      { tex: String.raw`K>1\ \Rightarrow\ K^n/n\to\infty`, move: 'Take a limit', choices: ['Induction', 'Use symmetry'],
        why: 'exponential beats a line (Exponentials, step 8)', highlight: 'exp' },
      { tex: String.raw`K\le1`, move: 'Contradiction', choices: ['Induction', 'Compare or bound'],
        why: 'if $K>1$, line 3 fails for large $n$', highlight: 'cross' }],
    lookBack: [
      { q: 'Why does the proof need $n$ large?',
        a: String.raw`For small $n$ the line is above $K^n$. At $K=1.05$, $\ell=4$ the first crossing is at $n=121$. One large $n$ is enough for the proof.` },
      { q: 'Where does unique decoding enter?',
        a: String.raw`In $N_k\le2^k$ (line 3). Without it, two strings of words would share one bit string, and $N_k$ could be larger.` },
      { q: 'Does it use instantaneous decoding?',
        a: 'No. Only unique decoding is used, so every decodable code obeys $K\\le1$. That is why Hamming can keep to instantaneous codes (14:21).' }],
    maxLines: 6,
    endNote: 'Next: Lecture 11, coding theory II.' },
    plot, key => { lit = key || ''; plot.redraw(); });
  update();
}

// ---------- frame ----------
const SLIDES = [
  { id: 'decodable', kind: 'content', tag: 'Lecture 10 09:35 to 11:45', title: 'Can one bit string mean two messages?',
    question: 'Which codes can you read without a guess, and when do you know each word?', mount: slideDecodable },
  { id: 'decoding-tree', kind: 'content', tag: 'Lecture 10 11:45 to 12:47', title: 'Build a code as a tree you walk',
    question: 'How do you choose words so that no word starts another?', mount: slideTree },
  { id: 'average-length', kind: 'content', tag: 'Lecture 10 17:14 to 19:55', title: 'Which code is shorter on average?',
    question: 'Two codes both decode. Which one needs fewer bits per symbol, and does the answer depend on the chances?', mount: slideAverage },
  { id: 'kraft', kind: 'proof', tag: 'Lecture 10 21:27 to 23:34', title: 'Why the Kraft sum is at most 1',
    question: 'Can a prefix code have too many short words?',
    symbols: String.raw`$l_i$: the length of word $i$, its depth in the tree. $K=\sum_i 2^{-l_i}$: the Kraft sum. $T_0$, $T_1$: the subtrees under the root, for words that start $0$ and for those that start $1$.`,
    mount: slideKraft },
  { id: 'kraft-binary-point', kind: 'content', tag: 'Lecture 10 29:56 to 31:37', title: 'Build the words from the lengths',
    question: 'If the lengths fit, how do you pick the words themselves?', mount: slideBinaryPoint },
  { id: 'mcmillan', kind: 'proof', tag: 'Lecture 10 27:18 to 28:53', title: 'Why decodable codes obey the same sum',
    question: 'Can a code that you decode only at the end break the sum?',
    symbols: String.raw`$K$: the Kraft sum. $K^n$: the $n$th power, $n$ words in a row. $\ell$: the longest word. $N_k$: how many strings of $n$ words have total length $k$.`,
    mount: slideMcMillan }
];

let cur = 0, shownId = null, endSent = false;
function goTo(i) {
  PLOTS = [];
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  if (shownId !== null && shownId !== s.id) emit('view.step', { step: s.id });
  shownId = s.id;
  const stage = $('#stage');
  stage.innerHTML = '';
  const widget = h('div', 'widget');
  const side = h('div', 'side');
  side.append(h('div', 'tag', s.tag), setTex(h('h2'), s.title));
  side.append(setTex(h('p', 'question'), s.question));
  if (s.symbols) side.append(sym(s.symbols));
  const sec = mark(h('section', 'slide' + (s.kind === 'proof' ? ' proof-slide' : '')), 'step', s.id, s.title.replace(/\$/g, ''));
  sec.append(widget, side);
  stage.append(sec);
  stage.scrollTop = 0;
  s.mount(widget, side);
  // On a content slide the takeaway is dimmed until the reader has used a control.
  const tk = s.kind === 'content' ? side.querySelector('.takeaway') : null;
  if (tk) {
    tk.classList.add('dim');
    const openTk = () => tk.classList.remove('dim');
    sec.addEventListener('input', openTk);
    sec.addEventListener('click', e => { if (e.target.closest('[data-item="control"],[data-item="preset"]')) openTk(); });
    sec.addEventListener('pointerdown', e => { if (e.target.closest('[data-item="control"]')) openTk(); });
  }
  tex(sec);
  if (cur === SLIDES.length - 1 && !endSent) { endSent = true; emit('view.action', { action: 'deck-end' }); }
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, k) => d.classList.toggle('on', k === cur));
}
// A cue is a state. {step} goes to the step and does nothing if it is shown. {step, reveal: true}
// also reveals that step's prediction (once; a revealed prediction stays revealed).
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i < 0) return;
  if (i !== cur) goTo(i);
  if (msg.reveal === true && REVEAL[msg.step]) REVEAL[msg.step]('cue');
}
(function init() {
  const dots = $('#dots');
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = s.title.replace(/\$/g, '');
    b.addEventListener('click', () => goTo(i));
    dots.appendChild(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],textarea,select')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
})();
</script>

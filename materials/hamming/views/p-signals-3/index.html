<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primer · Signals: convolution, filters in a row, short records</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../../components/theme.js"></script>
<style>
/* Colors come from the theme palette (../../components/theme.js): one accent (blue), amber only for proof lights, red only for a failed check. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft);
  --red:var(--pal-red); --redbg:var(--pal-red-bg);
  --u:clamp(16px,1.35vw,20px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 24px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(6px,1vh,12px) 24px}
footer{display:flex;align-items:center;gap:10px;padding:8px 24px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Slide frame: widget on the left (3/5), text on the right (2/5). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(18px,2.4vw,40px)}
.widget{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(6px,1vh,10px);overflow:hidden}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(6px,1.1vh,12px);overflow:hidden}
.tag{font:13px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(20px,1.9vw,28px);line-height:1.2;margin:0;font-weight:650}
.question{margin:0;font-size:clamp(16px,1.3vw,18px);font-weight:600}
.case{margin:0;font-size:16px}
.formula{font-size:clamp(18px,1.8vw,26px)}
.formula .katex-display{margin:.2em 0}
.sym{margin:0;font-size:16px;color:var(--muted)}
.tries{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.tries li::marker{color:var(--accent);font-weight:600}
.takeaway{margin:0;padding:10px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}
.next{margin:0;font-size:16px;color:var(--muted)}

/* Controls, readouts, legend */
.sliders{display:flex;gap:8px 24px;flex-wrap:wrap;width:100%;align-items:center}
.btnrow{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center}
.btnrow .lab{font-size:16px;color:var(--muted);margin-right:2px}
.slide-ctl{display:flex;align-items:center;gap:8px;font-size:16px;flex-wrap:wrap}
.slide-ctl input{width:clamp(120px,12vw,190px);vertical-align:middle;accent-color:var(--accent)}
.slide-ctl .val{min-width:44px}
.btn{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--pal-panel);color:var(--fg);border-radius:8px;cursor:pointer;font-size:16px}
.btn.on{background:var(--chip);border-color:var(--accent);color:var(--pal-accent-deep)}
.btn:disabled{opacity:.4;cursor:default}
.readouts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.readout{flex:1 1 150px;min-width:0;padding:4px 10px;border-radius:10px;background:var(--pal-soft);font-size:16px;overflow-wrap:anywhere;overflow:hidden}
.readout .k{color:var(--pal-text-2);font-size:15px}
.readout .val{font-size:17px;font-weight:600;line-height:1.55}
.readout.bad{background:var(--redbg);color:var(--red)}
.readout.bad .k{color:var(--red)}
.legend{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:16px;color:var(--pal-text-2);align-items:center}
.sw{display:inline-block;width:22px;height:0;vertical-align:middle;margin-right:6px}
.chip{display:inline-block;width:16px;height:12px;vertical-align:middle;margin-right:6px;border-radius:2px}
.ring{display:inline-block;width:13px;height:13px;vertical-align:middle;margin-right:6px;border-radius:50%;border:2px solid var(--pal-ink)}

/* Plots fill the height left in the widget column */
.fill{flex:1 1 0;min-height:90px;position:relative;width:100%}
.fill>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.name i{font-style:italic}
.takeholder{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.takeholder .takeaway{align-self:stretch}

/* Proof slides: test and picture on the left, the proof (fl-proof-steps) on the right */
.slide.proof-slide{grid-template-columns:minmax(0,11fr) minmax(0,9fr)}
.slide.proof-slide .side{justify-content:flex-start}
.fill.proofpic{min-height:150px}
.slide.proof-slide .slide-ctl input{width:clamp(90px,9vw,140px)}
.slide.proof-slide .sliders{gap:6px 16px}
.slide.proof-slide .btn{padding:4px 10px}
.part{margin:0;font-weight:600;color:var(--muted)}
.test{display:flex;flex-direction:column;gap:3px}
.test .tries{gap:3px}
.model{margin:0;padding:8px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}

/* Short windows (1100x620 and similar): tighter spacing, body text stays 16px */
@media (max-height: 680px){
  header{padding-top:4px}
  #stage{padding:4px 24px}
  footer{padding:4px 24px}
  .widget{gap:5px}
  .side{gap:4px}
  .tries{gap:2px}
  .sym,.tries,.takeaway,.case{line-height:1.25}
  .takeaway{padding:6px 10px}
  .formula{font-size:20px}
  h2{font-size:20px}
  .question{font-size:16px}
  .fill{min-height:80px}
  .readout{padding:2px 8px}
  .readout .val{line-height:1.5}
  .fill.proofpic{min-height:130px}
  .model{padding:5px 10px}
  .test .tries{gap:1px}
  .btn{padding:4px 10px}
}
</style>
</head>
<body>
<header>Primer · Signals: convolution, filters in a row, short records</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script src="../../components/proof-steps.js"></script>
<script>
// ---------- palette and redraw ----------
// COL holds the palette for the SVG being drawn; plotBox reads it at every paint, so a draw always uses the
// current theme. A theme switch redraws the current slide's plots and keeps every control's state.
let COL = {};
const PAL_NAMES = ['bg', 'ink', 'fg', 'text-2', 'muted', 'muted-2', 'grey', 'guide', 'grid', 'line', 'panel', 'soft', 'soft-2',
  'accent', 'accent-2', 'accent-3', 'accent-deep', 'accent-tint', 'accent-soft', 'on-accent',
  'amber', 'amber-bg', 'amber-ink', 'red'];
function readPalette() {
  const o = {};
  for (const n of PAL_NAMES) o[n.replace(/-(\w)/g, (_, c) => c.toUpperCase())] = FluidTheme.color(n);
  return o;
}
let PLOTS = [];
window.addEventListener('fluid-themechange', () => PLOTS.forEach(p => p.redraw()));
// A palette color with alpha, e.g. rgbaOf(COL.accent, 0.5). Takes #rgb, #rrggbb or rgb(...).
function rgbaOf(c, a) {
  let r = 0, g = 0, b = 0;
  const m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(c.trim());
  if (m) {
    let hx = m[1]; if (hx.length === 3) hx = hx.split('').map(x => x + x).join('');
    const n = parseInt(hx, 16); r = n >> 16; g = (n >> 8) & 255; b = n & 255;
  } else {
    const v = (c.match(/[\d.]+/g) || [0, 0, 0]).map(Number); [r, g, b] = v;
  }
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

// ---------- DOM helpers ----------
const $ = s => document.querySelector(s);
const NSV = 'http://www.w3.org/2000/svg', NHT = 'http://www.w3.org/1999/xhtml';
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false }], throwOnError: false };
// Render $...$ in a node. If the CDN did not load, the text stays as typed.
function tex(node) { if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH); return node; }
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function hh(tag, cls, ...kids) { const e = h(tag, cls); for (const k of kids) if (k) e.append(k); return e; }
function mark(e, kind, id, title) { e.dataset.item = kind; if (id != null) e.dataset.id = id; if (title != null) e.dataset.title = title; return e; }
function emit(kind, data) {
  try { if (window.fluid && typeof window.fluid.emit === 'function') Promise.resolve(window.fluid.emit(kind, data)).catch(() => {}); }
  catch (e) { /* the view works without the bridge */ }
}
// Fixed decimals, with no minus sign on zero.
function fx(x, d) { const y = Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x; return y.toFixed(d); }
// A short number: up to d decimals, trailing zeros dropped.
function sn(x, d) { return String(+fx(x, d == null ? 3 : d)); }
// Common fractions as TeX, else a short decimal.
function fracTex(v) {
  const F = [[1 / 3, '\\tfrac13'], [-1 / 3, '-\\tfrac13'], [0.5, '\\tfrac12'], [-0.5, '-\\tfrac12'], [0.25, '\\tfrac14'], [2 / 3, '\\tfrac23']];
  for (const [x, t] of F) if (Math.abs(v - x) < 1e-9) return t;
  return sn(v, 3);
}
// Plain-text cell label: 1/3, 1/2, 1/4 as glyphs, blank for 0.
function cellText(v) {
  if (Math.abs(v) < 1e-9) return '';
  const G = [[1 / 3, '⅓'], [0.5, '½'], [0.25, '¼'], [-0.5, '−½']];
  for (const [x, t] of G) if (Math.abs(v - x) < 1e-9) return t;
  return sn(v, 2).replace('-', '−');
}

// ---------- controls ----------
// A labelled range input. o: {id, min, max, step, value, fmt(v) -> TeX-ready text, onInput(v)}.
function ctl(label, o) {
  const wrap = h('label', 'slide-ctl');
  const lab = setTex(h('span'), label);
  const inp = h('input');
  inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step; inp.value = o.value;
  mark(inp, 'control', o.id, o.id);
  const val = h('span', 'val');
  const show = v => setTex(val, o.fmt(v));
  inp.addEventListener('input', () => { show(+inp.value); o.onInput(+inp.value); });
  show(o.value);
  wrap.append(lab, inp, val);
  return { el: wrap, input: inp, set(v) { inp.value = v; show(v); } };
}
// A row of buttons that pick one choice. choices: [[id, label], ...]; getCur() gives the current id.
function choiceRow(label, choices, getCur, onPick) {
  const row = hh('div', 'btnrow', label ? setTex(h('span', 'lab'), label) : null);
  const btns = choices.map(([id, text]) => {
    const b = mark(h('button', 'btn'), 'control', id);
    setTex(b, text);
    b.addEventListener('click', () => { onPick(id); paint(); });
    row.append(b);
    return [id, b];
  });
  function paint() { btns.forEach(([id, b]) => b.classList.toggle('on', id === getCur())); }
  paint();
  return { el: row, paint };
}
function button(id, label, onClick) {
  const b = mark(h('button', 'btn'), 'control', id);
  setTex(b, label);
  b.addEventListener('click', onClick);
  return b;
}
// A readout box: label and value are TeX-ready text.
function readout(id, label) {
  const box = mark(h('div', 'readout'), 'readout', id);
  const k = setTex(h('div', 'k'), label);
  const v = h('div', 'val');
  box.append(k, v);
  return { el: box, set(text, bad) { setTex(v, text); box.classList.toggle('bad', !!bad); }, label(t) { setTex(k, t); } };
}
// Legend: items {color (CSS), text, kind: 'line' | 'dash' | 'chip' | 'ring'}.
function legend(items) {
  const d = h('div', 'legend');
  for (const it of items) {
    const s = h('span');
    let sw;
    if (it.kind === 'chip') { sw = h('span', 'chip'); sw.style.background = it.color; }
    else if (it.kind === 'ring') { sw = h('span', 'ring'); if (it.color) sw.style.borderColor = it.color; }
    else { sw = h('span', 'sw'); sw.style.borderTop = '3px ' + (it.kind === 'dash' ? 'dashed' : 'solid') + ' ' + it.color; }
    s.append(sw, setTex(h('span'), it.text));
    d.append(s);
  }
  return d;
}
function sym(text) { return setTex(h('p', 'sym'), text); }
function caseLine(text) { return setTex(h('p', 'case'), text); }
function nameLine(html) { const p = h('p', 'sym name'); p.innerHTML = html; return tex(p); }
function triesList(items) { return hh('ol', 'tries', ...items.map(t => setTex(h('li'), t))); }
// The takeaway appears after the first try: on the first click, drag or slider move in the widget, or on "Show".
function takeBox(widget, text) {
  const holder = h('div', 'takeholder');
  const btn = mark(h('button', 'btn'), 'control', 'show-takeaway');
  setTex(btn, 'Show the takeaway');
  const tk = setTex(h('p', 'takeaway'), text);
  tk.hidden = true;
  const show = () => { tk.hidden = false; btn.hidden = true; };
  btn.addEventListener('click', show);
  for (const ev of ['input', 'click', 'pointerdown']) widget.addEventListener(ev, show);
  holder.append(btn, tk);
  return holder;
}
// The side column of a formula slide, after the frame's tag, title, question and formula.
// o: {sym, name, tries, take, next}. The everyday case (o.case) goes right under the question.
function sideStd(widget, side, o) {
  if (o.case) side.querySelector('.question').after(caseLine(o.case));
  if (o.sym) side.append(sym(o.sym));
  if (o.name) side.append(nameLine(o.name));
  if (o.tries) side.append(triesList(o.tries));
  if (o.take) side.append(takeBox(widget, o.take));
  if (o.next) side.append(setTex(h('p', 'next'), o.next));
}

// ---------- SVG helpers ----------
function svgNode(tag, attrs, parent) {
  const e = document.createElementNS(NSV, tag);
  for (const k in attrs) if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function svgRoot(w, ht) { return svgNode('svg', { viewBox: '0 0 ' + w + ' ' + ht, role: 'img', 'font-family': 'system-ui, sans-serif', 'font-size': 14 }); }
function svgText(parent, x, y, s, attrs) {
  const t = svgNode('text', Object.assign({ x: x, y: y, fill: COL.muted, 'font-size': 14 }, attrs || {}), parent);
  t.textContent = s;
  return t;
}
// A KaTeX label inside an SVG: a foreignObject holding a rendered formula. o: {w, anchor, size, fill, bg, bold}.
function svgTex(parent, x, y, s, o) {
  o = o || {};
  const w = o.w || 220, ht = o.ht || 26, anchor = o.anchor || 'middle';
  const x0 = anchor === 'end' ? x - w : anchor === 'start' ? x : x - w / 2;
  const fo = svgNode('foreignObject', { x: x0, y: y - ht / 2, width: w, height: ht }, parent);
  const d = document.createElementNS(NHT, 'div');
  const jc = anchor === 'end' ? 'flex-end' : anchor === 'start' ? 'flex-start' : 'center';
  d.setAttribute('style', 'display:flex;align-items:center;height:100%;white-space:nowrap;font-size:' +
    (o.size || 15) + 'px;color:' + (o.fill || COL.text2) + ';justify-content:' + jc + (o.bold ? ';font-weight:600' : ''));
  const span = document.createElementNS(NHT, 'span');
  span.textContent = s;
  if (o.bg) span.setAttribute('style', 'background:' + o.bg + ';border-radius:5px;padding:1px 6px');
  d.appendChild(span);
  fo.appendChild(d);
  tex(span);
  return fo;
}
// The same label with a halo in the page color, so it reads over a curve or bars.
function haloTex(parent, x, y, s, o) {
  const fo = svgTex(parent, x, y, s, o);
  fo.firstChild.style.textShadow = '0 0 3px ' + COL.bg + ', 0 0 3px ' + COL.bg + ', 0 0 2px ' + COL.bg;
  return fo;
}
function line(svg, x1, y1, x2, y2, o) { return svgNode('line', Object.assign({ x1, y1, x2, y2 }, o || {}), svg); }
function dot(svg, x, y, r, fill, o) { return svgNode('circle', Object.assign({ cx: x, cy: y, r, fill }, o || {}), svg); }
function rect(svg, x, y, w, ht, o) { return svgNode('rect', Object.assign({ x, y, width: Math.max(0, w), height: Math.max(0, ht) }, o || {}), svg); }
// An arrow with a head. o: {color, w, dash, id}.
function arrow(svg, x1, y1, x2, y2, o) {
  const g = svgNode('g', { 'data-item': 'mark', 'data-id': o.id }, svg);
  svgNode('line', { x1, y1, x2, y2, stroke: o.color, 'stroke-width': o.w || 2.5, 'stroke-dasharray': o.dash }, g);
  const len = Math.hypot(x2 - x1, y2 - y1), hl = Math.min(9, len * 0.45);
  if (len > 3) {
    const a = Math.atan2(y2 - y1, x2 - x1), s = hl / 2;
    const bx = x2 - hl * Math.cos(a), by = y2 - hl * Math.sin(a);
    svgNode('polygon', { points: [[x2, y2], [bx - s * Math.sin(a), by + s * Math.cos(a)], [bx + s * Math.sin(a), by - s * Math.cos(a)]].map(p => p.join(',')).join(' '), fill: o.color }, g);
  }
  return g;
}
// Amber marks what the newest proof line is about.
function glowRect(svg, x, y, w, ht, pad) {
  pad = pad == null ? 4 : pad;
  return rect(svg, x - pad, y - pad, w + 2 * pad, ht + 2 * pad, { rx: 6, fill: COL.amberBg, stroke: COL.amber, 'stroke-width': 1.5 });
}
function glowLine(svg, d, wdt) { return svgNode('path', { d, fill: 'none', stroke: COL.amberBg, 'stroke-width': wdt || 10, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, svg); }
// The top row of a proof picture: what the amber part is while a line is lit, else a plain hint.
function picCaption(svg, W, litText, plainText) {
  if (litText) return svgTex(svg, W / 2, 12, litText, { w: W - 4, size: 15, fill: COL.amberInk, bg: COL.amberBg });
  if (plainText) return svgTex(svg, 4, 12, plainText, { w: W - 8, anchor: 'start', size: 15, fill: COL.muted });
  return null;
}
// A plot that takes the height left in its parent. draw(svg, W, H) runs on every resize and redraw.
function plotBox(draw, cls, weight) {
  const wrap = h('div', 'fill' + (cls ? ' ' + cls : ''));
  if (weight) wrap.style.flex = weight + ' 1 0';
  let key = '';
  const paint = force => {
    const w = Math.floor(wrap.clientWidth), ht = Math.floor(wrap.clientHeight);
    if (w < 60 || ht < 40) return;
    if (!force && key === w + 'x' + ht) return;
    key = w + 'x' + ht;
    COL = readPalette();
    const svg = svgRoot(w, ht);
    draw(svg, w, ht);
    wrap.replaceChildren(svg);
  };
  new ResizeObserver(() => paint(false)).observe(wrap);
  const plot = { wrap, redraw: () => paint(true) };
  PLOTS.push(plot);
  return plot;
}
// Axes for a plot. o: {x0, x1, y0, y1, L, R, T, B}. y values outside the range are clamped.
function plotFrame(svg, W, H, o) {
  const L = o.L == null ? 46 : o.L, R = o.R == null ? 14 : o.R, T = o.T == null ? 12 : o.T, B = o.B == null ? 40 : o.B;
  const pw = W - L - R, ph = H - T - B, base = T + ph;
  const X = x => L + (x - o.x0) / (o.x1 - o.x0) * pw;
  const Y = y => base - (Math.max(o.y0, Math.min(o.y1, y)) - o.y0) / (o.y1 - o.y0) * ph;
  line(svg, L, base, W - R, base, { stroke: COL.grey });
  line(svg, L, T, L, base, { stroke: COL.grey });
  if (o.y0 < 0 && o.y1 > 0) line(svg, L, Y(0), W - R, Y(0), { stroke: COL.grey, 'stroke-dasharray': '2 3' });
  return { X, Y, L, R, T, B, pw, ph, base, W, H };
}
function pathOf(P, pts) { return pts.map((p, i) => (i ? 'L' : 'M') + P.X(p[0]).toFixed(1) + ' ' + P.Y(p[1]).toFixed(1)).join(''); }
// Stems for values at n = 0 .. len-1. o: {vals, lo, hi, color, id, label, labelFill, values (print values),
// rings (values drawn as rings), band(n) -> true to shade, bandColor, hollow(n) -> true for an open dot, L, T, B, ticks}.
function stems(svg, W, H, o) {
  const len = o.vals.length, L = o.L == null ? 34 : o.L, R = o.R == null ? 10 : o.R, T = o.T == null ? 30 : o.T, B = o.B == null ? 22 : o.B;
  const cw = (W - L - R) / len;
  const X = n => L + (n + 0.5) * cw;
  const Y = v => T + (o.hi - Math.max(o.lo, Math.min(o.hi, v))) / (o.hi - o.lo) * (H - T - B);
  if (o.band) for (let n = 0; n < len; n++) if (o.band(n)) rect(svg, X(n) - cw / 2 + 2, T - 4, cw - 4, H - T - B + 8, { rx: 6, fill: o.bandColor || COL.accentTint });
  line(svg, L, Y(0), W - R, Y(0), { stroke: COL.grey });
  for (const t of (o.ticks || [])) svgText(svg, L - 6, Y(t) + 5, sn(t, 2).replace('-', '−'), { 'text-anchor': 'end' });
  for (let n = 0; n < len; n++) svgText(svg, X(n), H - 5, String(n + (o.n0 || 0)), { 'text-anchor': 'middle' });
  o.vals.forEach((v, n) => {
    const open = o.hollow && o.hollow(n);
    line(svg, X(n), Y(0), X(n), Y(v), { stroke: o.color, 'stroke-width': 3 });
    dot(svg, X(n), Y(v), 5.5, open ? COL.panel : o.color, { stroke: o.color, 'stroke-width': 2, 'data-item': 'mark', 'data-id': (o.id || 'stem') + '-' + n });
    if (o.values) {
      const up = v >= 0;
      haloTex(svg, X(n), Y(v) + (up ? -15 : 15), o.fmtVal ? o.fmtVal(v, n) : sn(v, 2), { w: cw + 10, size: 14, fill: COL.ink });
    }
  });
  if (o.rings) o.rings.forEach((v, n) => dot(svg, X(n), Y(v), 9.5, 'none', { stroke: COL.ink, 'stroke-width': 1.6 }));
  if (o.label) svgTex(svg, L, 12, o.label, { w: W - L - 4, anchor: 'start', size: 15, fill: o.labelFill || o.color });
  return { X, Y, cw, L, T, B };
}
// One dial per sample: a circle with the complex value as an arrow. o: {zs, scale, color, id, y, r, labels(n) -> text}.
function dialRow(svg, W, o) {
  const len = o.zs.length, cw = W / len, Rc = o.r || Math.min(cw / 2 - 6, 40);
  o.zs.forEach((z, n) => {
    const cx = (n + 0.5) * cw, cy = o.y;
    dot(svg, cx, cy, Rc, COL.panel, { stroke: COL.line });
    line(svg, cx - Rc, cy, cx + Rc, cy, { stroke: COL.soft2 });
    line(svg, cx, cy - Rc, cx, cy + Rc, { stroke: COL.soft2 });
    const k = (o.scale || 1) * (Rc - 4);
    if (Math.hypot(z.re, z.im) * k > 3) arrow(svg, cx, cy, cx + z.re * k, cy - z.im * k, { color: o.color, id: (o.id || 'z') + '-' + n });
    else dot(svg, cx, cy, 3, o.color);
    if (o.labels) svgTex(svg, cx, cy + Rc + 12, o.labels(n), { w: cw, size: 14, fill: o.labelFill || COL.text2 });
  });
  return { cw, Rc };
}

// ---------- complex numbers ----------
const PI = Math.PI, TAU = 2 * PI;
const cis = t => ({ re: Math.cos(t), im: Math.sin(t) });
const cplx = (re, im) => ({ re, im: im || 0 });
const cxAdd = (a, b) => ({ re: a.re + b.re, im: a.im + b.im });
const cxMul = (a, b) => ({ re: a.re * b.re - a.im * b.im, im: a.re * b.im + a.im * b.re });
const cxScale = (a, s) => ({ re: a.re * s, im: a.im * s });
const cxDiv = (a, b) => { const d = b.re * b.re + b.im * b.im; return { re: (a.re * b.re + a.im * b.im) / d, im: (a.im * b.re - a.re * b.im) / d }; };
const cxAbs = a => Math.hypot(a.re, a.im);
const cxArg = a => Math.atan2(a.im, a.re);
// A complex number as TeX (no $): a real number, or length and angle in degrees.
function polarTex(z, d) {
  d = d == null ? 3 : d;
  if (Math.abs(z.im) < 1e-9) return fx(z.re, d);
  let a = cxArg(z) * 180 / PI;
  return fx(cxAbs(z), d) + '\\angle{' + sn(a, 1) + '^\\circ}';
}
const cv = (x, i) => x[((i % x.length) + x.length) % x.length];   // index that wraps

// ---------- proof slides ----------
// Left column of a proof slide: controls, the picture, the test, the mental model.
function proofLeft(widget, o) {
  if (o.controls && o.controls.length) widget.append(hh('div', 'sliders', ...o.controls));
  const p = plotBox(o.draw, 'proofpic');
  widget.append(p.wrap);
  if (o.legend) widget.append(legend(o.legend));
  const test = hh('div', 'test', h('p', 'part', 'Test it'), triesList(o.tests));
  const model = h('p', 'model');
  model.append(h('span', 'part', 'The picture: '), tex(h('span', '', o.model)));
  widget.append(test, model);
  return { redraw: p.redraw, test };
}
// Right column: the proof. Each revealed line lights its part of the picture; once the proof is done,
// the look-back questions take the place of the test under the picture.
function proofRight(side, spec, plot, onLight, o) {
  o = o || {};
  const el = document.createElement('fl-proof-steps');
  el.onEvent = d => emit('view.action', d);
  el.onHighlight = key => onLight(key);
  el.lookBackHost = plot.test;
  el.lookBackHint = 'Look back: under the picture.';
  if (o.primerMoves) el.primerMoves = o.primerMoves;
  if (o.endNote) el.endNote = o.endNote;
  el.data = spec;
  side.append(el);
  return el;
}

// ---------- frame ----------
// SLIDES (defined by each view): {id, tag, title, question, formula, proof, mount(widget, side)}.
let cur = 0, shownId = null, endSent = false;
function goTo(i) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  if (shownId !== null && shownId !== s.id) emit('view.step', { step: s.id });
  shownId = s.id;
  const stage = $('#stage');
  stage.innerHTML = '';
  PLOTS = [];
  const widget = h('div', 'widget');
  const side = hh('div', 'side',
    h('div', 'tag', s.tag),
    setTex(h('h2'), s.title),
    setTex(h('p', 'question'), s.question),
    s.formula ? setTex(h('div', 'formula'), s.formula) : null);
  const sec = mark(h('section', 'slide' + (s.proof ? ' proof-slide' : '')), 'step', s.id, s.title.replace(/\$/g, ''));
  sec.append(widget, side);
  stage.append(sec);
  s.mount(widget, side);
  if (cur === SLIDES.length - 1 && !endSent) { endSent = true; emit('view.action', { action: 'deck-end' }); }
  tex(sec);
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, k) => d.classList.toggle('on', k === cur));
}
// A cue is a state: go to the named step, and do nothing if it is already shown.
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i >= 0 && i !== cur) goTo(i);
}
function startDeck() {
  const dots = $('#dots');
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = s.title.replace(/\$/g, '');
    b.addEventListener('click', () => goTo(i));
    dots.appendChild(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],input[type=number],textarea,select')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
}

// ===== p-signals-3: Convolution: filters in a row, short records =====
// Records here are long, with zeros before and after: no wrap.
const conv = (a, b) => { const o = new Array(a.length + b.length - 1).fill(0); a.forEach((x, i) => b.forEach((y, j) => { o[i + j] += x * y; })); return o; };
const SHADES = () => [COL.accent, COL.accent3, COL.muted2];
const SHADE_CSS = ['var(--pal-accent)', 'var(--pal-accent-3)', 'var(--pal-muted-2)'];
const PAIRS = {
  p35: { label: '3s then 5s', a: [1, 1, 1], b: [1, 1, 1, 1, 1] },
  p11: { label: '$(1,1)$ twice', a: [1, 1], b: [1, 1] },
  p121: { label: '$(1,2,1)$ then $(1,1)$', a: [1, 2, 1], b: [1, 1] },
};
const NEXT3 = 'Next: Primer · Signals: spectra.';
const tup = v => '(' + v.join(',') + ')';
// Stacked bars at n = 0 .. len-1. o: {len, stacks: [[{v, color}], ...] per n, ghost: [values] (dashed outline), hi, label, totals}
function stackPlot(svg, W, H, o) {
  const L = 34, R = 10, T = o.T || 30, B = 22, cw = (W - L - R) / o.len, bw = Math.min(46, cw * 0.62);
  const X = n => L + (n + 0.5) * cw, Y = v => H - B - v / o.hi * (H - T - B);
  line(svg, L, Y(0), W - R, Y(0), { stroke: COL.grey });
  for (let n = 0; n < o.len; n++) svgText(svg, X(n), H - 5, String(n), { 'text-anchor': 'middle' });
  if (o.ghost) o.ghost.forEach((v, n) => { if (v > 1e-9) rect(svg, X(n) - bw / 2, Y(v), bw, Y(0) - Y(v), { fill: 'none', stroke: COL.grey, 'stroke-dasharray': '4 3', rx: 2 }); });
  o.stacks.forEach((segs, n) => {
    let base = 0;
    segs.forEach((s, i) => {
      if (Math.abs(s.v) < 1e-9) return;
      rect(svg, X(n) - bw / 2, Y(base + s.v), bw, Y(base) - Y(base + s.v), { fill: s.color, stroke: COL.bg, 'stroke-width': 1.5, rx: 2, 'data-item': 'mark', 'data-id': (o.id || 'bar') + '-' + n + '-' + i });
      base += s.v;
    });
    if (o.totals && base > 1e-9) svgText(svg, X(n), Y(base) - 6, sn(base, 2), { 'text-anchor': 'middle', fill: COL.ink, 'font-size': 15, 'font-weight': 600 });
  });
  if (o.label) svgTex(svg, L, 12, o.label, { w: W - L - 4, anchor: 'start', size: 15, fill: o.labelFill || COL.text2 });
  return { X, Y, cw };
}

// ---------- 1. The output is a sum of echoes ----------
const ECHO_IN = { u201: [2, 0, 1], u121: [1, 2, 1] };
function slideEchoes(widget, side) {
  let key = 'u201', upto = 2;
  const h0 = [1, 1, 1], LEN = 7;
  const pick = choiceRow('input:', [['u201', '$u=(2,0,1)$'], ['u121', '$u=(1,2,1)$']], () => key, id => { key = id; update(); });
  const sl = ctl('add echoes of $u_0$ to $u_j$, $j$', { id: 'upto', min: 0, max: 2, step: 1, value: upto, fmt: v => String(v), onInput: v => { upto = v; update(); } });
  const rY = readout('output', 'the output so far');
  const inP = plotBox((svg, W, H) => {
    const u = ECHO_IN[key], sh = SHADES();
    stackPlot(svg, W, H, { len: LEN, hi: 2.6, stacks: Array.from({ length: LEN }, (_, n) => (n < u.length ? [{ v: u[n], color: sh[n] }] : [])), totals: true, id: 'u',
      label: 'input $u$: three taps, one colour each', T: 30 });
  }, null, 0.8);
  const outP = plotBox((svg, W, H) => {
    const u = ECHO_IN[key], sh = SHADES(), full = conv(u, h0);
    const stacks = Array.from({ length: LEN }, (_, n) => u.map((x, j) => ({ v: j <= upto && n - j >= 0 && n - j < 3 ? x * h0[n - j] : 0, color: sh[j] })));
    stackPlot(svg, W, H, { len: LEN, hi: Math.max(...full) * 1.25, stacks, ghost: full.concat([0, 0]), totals: true, id: 'y',
      label: 'output: one echo per tap, scaled and moved, stacked', T: 30 });
  }, null, 1.3);
  function update() {
    const u = ECHO_IN[key], y = new Array(LEN).fill(0);
    u.forEach((x, j) => { if (j <= upto) h0.forEach((c, k) => { y[j + k] += x * c; }); });
    rY.label('the output with the echoes of $u_0$ to $u_{' + upto + '}$');
    rY.set('$(' + y.slice(0, 5).join(',') + ')$' + (upto === 2 ? ': the whole output' : ''));
    pick.paint(); inP.redraw(); outP.redraw();
  }
  widget.append(pick.el, hh('div', 'sliders', sl.el), inP.wrap, outP.wrap,
    legend([{ kind: 'chip', color: SHADE_CSS[0], text: 'echo of $u_0$' }, { kind: 'chip', color: SHADE_CSS[1], text: 'echo of $u_1$' },
      { kind: 'chip', color: SHADE_CSS[2], text: 'echo of $u_2$' }, { kind: 'dash', color: 'var(--pal-grey)', text: 'dashed: the whole output' }]),
    hh('div', 'readouts', rY.el));
  sideStd(widget, side, {
    case: 'Clap three times in a hall: each clap makes its own echo, and you hear the echoes added.',
    sym: String.raw`$h=(1,1,1)$: the echo of one tap (Primer · Signals: filters, step 5). Each input sample is a tap of its own size, and a filter is linear, so the echoes add (Primer · Matrices, step 2). $u\ast h$: this sum, the convolution of $u$ and $h$.`,
    name: '<i>convolution</i>: Latin <i>convolvere</i>, to roll together. The echo rolls along the input, and what meets adds up.',
    tries: [
      String.raw`Set $j=0$: only the echo of $u_0=2$ is in, $2h=(2,2,2)$, at the first three places.`,
      String.raw`Set $j=2$: the echo of $u_2=1$ lands at $n=2,3,4$. The output is $(2,2,3,1,1)$. Where do two echoes overlap?`],
    take: String.raw`The output adds one echo per input sample, scaled by the sample and moved to its place: the convolution $u\ast h$.` });
  update();
}

// ---------- 2. Two filters in a row are one filter ----------
function slideConv(widget, side) {
  let key = 'p35';
  const pick = choiceRow('pair:', Object.keys(PAIRS).map(k => [k, PAIRS[k].label]), () => key, id => { key = id; update(); });
  const rW = readout('pair-weights', 'the weights of the pair');
  const LEN = 7;
  const aP = plotBox((svg, W, H) => {
    const { a } = PAIRS[key], sh = SHADES();
    stackPlot(svg, W, H, { len: LEN, hi: Math.max(...a) * 1.35, stacks: Array.from({ length: LEN }, (_, n) => (n < a.length ? [{ v: a[n], color: sh[n] }] : [])), totals: true, id: 'a',
      label: 'a tap through the first filter $a$: out comes the echo $a$', T: 30 });
  }, null, 0.8);
  const bP = plotBox((svg, W, H) => {
    const { a, b } = PAIRS[key], sh = SHADES(), ab = conv(a, b);
    const stacks = Array.from({ length: LEN }, (_, n) => a.map((x, j) => ({ v: n - j >= 0 && n - j < b.length ? x * b[n - j] : 0, color: sh[j] })));
    stackPlot(svg, W, H, { len: LEN, hi: Math.max(...ab) * 1.25, stacks, totals: true, id: 'ab',
      label: 'then through $b$: one echo of $b$ per bar above, added', T: 30 });
  }, null, 1.3);
  function update() {
    const { a, b } = PAIRS[key], ab = conv(a, b);
    const sa = a.reduce((p, q) => p + q, 0), sb = b.reduce((p, q) => p + q, 0);
    rW.set('$' + tup(a) + '\\ast' + tup(b) + '=' + tup(ab) + '$; total $' + (sa * sb) + '=' + sa + '\\times' + sb + '$');
    pick.paint(); aP.redraw(); bP.redraw();
  }
  widget.append(pick.el, aP.wrap, bP.wrap,
    legend([{ kind: 'chip', color: SHADE_CSS[0], text: 'from bar $0$ of $a$' }, { kind: 'chip', color: SHADE_CSS[1], text: 'from bar $1$' }, { kind: 'chip', color: SHADE_CSS[2], text: 'from bar $2$' }]),
    hh('div', 'readouts', rW.el));
  sideStd(widget, side, {
    case: 'Blur a photo twice, and you get one wider, rounder blur.',
    sym: String.raw`$a=(1,1,1)$: add 3 neighbours; $b=(1,1,1,1,1)$: add 5. Hamming calls this pair 3s then 5s. A tap through $a$ gives the echo $a$; each of its samples is a tap into $b$ (step 1).`,
    tries: [
      String.raw`3s then 5s: the tap comes out as $1,2,3,3,3,2,1$. The total is $15=3\times5$.`,
      String.raw`Press $(1,1)$ twice: $(1,2,1)$. Divided by 4 it is $\tfrac14,\tfrac12,\tfrac14$, von Hann’s weights (L15 38:14).`],
    take: String.raw`Two filters in a row act as one filter whose weights are the convolution $a\ast b$.` });
  update();
}

// ---------- 3. Convolving by hand: the table ----------
function drawTable(svg, x0, y0, cs, a, b, m, lit) {
  const J = a.length, Lb = b.length, fs = Math.min(17, cs * 0.45);
  const cell = (r, c) => [x0 + c * cs, y0 + r * cs];
  if (lit === 'table') glowRect(svg, x0 + cs, y0 + cs, Lb * cs, J * cs, 3);
  if (lit === 'slant') for (let j = 0; j < J; j++) { const l = m - j; if (l >= 0 && l < Lb) { const [x, y] = cell(j + 1, l + 1); glowRect(svg, x, y, cs, cs, 2); } }
  const box = (r, c, txt, fill, stroke, id, sw) => {
    const [x, y] = cell(r, c);
    rect(svg, x + 1, y + 1, cs - 2, cs - 2, { rx: 3, fill, stroke, 'stroke-width': sw || 1, 'data-item': 'mark', 'data-id': id });
    svgText(svg, x + cs / 2, y + cs / 2 + fs * 0.36, txt, { 'text-anchor': 'middle', 'font-size': fs, fill: COL.ink });
  };
  svgTex(svg, x0 + cs / 2, y0 + cs / 2, '$\\times$', { w: cs, size: 15, fill: COL.muted });
  b.forEach((v, l) => box(0, l + 1, String(v), COL.soft2, COL.line, 'b-' + l));
  a.forEach((v, j) => box(j + 1, 0, String(v), COL.soft2, COL.line, 'a-' + j));
  for (let j = 0; j < J; j++) for (let l = 0; l < Lb; l++) {
    const on = j + l === m;
    box(j + 1, l + 1, String(a[j] * b[l]), on ? COL.accentTint : COL.panel, on ? COL.accent : COL.line, 'ab-' + j + '-' + l, on ? 2 : 1);
  }
  svgTex(svg, x0 + cs * (Lb + 2) / 2, y0 - 12, '$b_l$, $l=0,1,\\dots$', { w: 160, size: 14, fill: COL.text2 });
  svgTex(svg, x0 - 6, y0 + cs * (J + 2) / 2, '$a_j$', { w: 34, anchor: 'end', size: 14, fill: COL.text2 });
}
const polyTex = w => w.map((c, i) => (i === 0 ? String(c) : (c === 1 ? '' : c) + (i === 1 ? 'x' : 'x^{' + i + '}'))).join('+');
function slideTable(widget, side) {
  let key = 'p35', m = 2;
  const pick = choiceRow('pair:', Object.keys(PAIRS).map(k => [k, PAIRS[k].label]), () => key, id => {
    key = id; const top = PAIRS[key].a.length + PAIRS[key].b.length - 2; sM.input.max = top; if (m > top) { m = top; sM.set(m); } update(); });
  const sM = ctl('output $m$', { id: 'm', min: 0, max: 6, step: 1, value: m, fmt: v => String(v), onInput: v => { m = v; update(); } });
  const rS = readout('slant-sum', 'the slant for $m$');
  const plot = plotBox((svg, W, H) => {
    const { a, b } = PAIRS[key], ab = conv(a, b);
    const tabH = H * 0.58;
    const cs = Math.max(20, Math.min((tabH - 40) / (a.length + 1), (W - 80) / (b.length + 1), 56));
    const x0 = 50 + Math.max(0, (W - 50 - cs * (b.length + 1)) / 2), y0 = 52;
    svgTex(svg, 4, 12, '$(' + polyTex(a) + ')(' + polyTex(b) + ')$', { w: W - 8, anchor: 'start', size: 16, fill: COL.ink });
    drawTable(svg, x0, y0, cs, a, b, m, '');
    // bars of a*b
    const bt = y0 + cs * (a.length + 1) + 30, bb = H - 22, bmax = Math.max(...ab);
    const bw = (W - 60) / ab.length, bx = k => 40 + (k + 0.5) * bw, Yv = v => bb - v / bmax * Math.max(10, bb - bt - 18);
    ab.forEach((v, k) => {
      rect(svg, bx(k) - bw * 0.3, Yv(v), bw * 0.6, bb - Yv(v), { fill: k === m ? COL.accent : COL.soft2, stroke: k === m ? 'none' : COL.grey, 'data-item': 'mark', 'data-id': 'w-' + k });
      svgText(svg, bx(k), Yv(v) - 5, String(v), { 'text-anchor': 'middle', fill: COL.ink, 'font-size': 15 });
      svgText(svg, bx(k), bb + 16, String(k), { 'text-anchor': 'middle' });
    });
    line(svg, 40, bb, W - 20, bb, { stroke: COL.grey });
    svgTex(svg, 4, bt - 8, '$a\\ast b$, one bar per $m$', { w: 200, anchor: 'start', size: 14, fill: COL.text2 });
  });
  function update() {
    const { a, b } = PAIRS[key], ab = conv(a, b), terms = [], vals = [];
    for (let j = 0; j < a.length; j++) { const l = m - j; if (l >= 0 && l < b.length) { terms.push('a_' + j + 'b_' + l); vals.push(a[j] * b[l]); } }
    rS.label('the slant for $m=' + m + '$, also the number in front of $x^{' + m + '}$');

    pick.paint(); plot.redraw();
  }
  widget.append(pick.el, hh('div', 'sliders', sM.el), plot.wrap,
    legend([{ kind: 'chip', color: 'var(--pal-accent-tint)', text: 'outlined: the cells with $j+l=m$' }, { kind: 'chip', color: 'var(--pal-accent)', text: 'blue bar: their sum, $(a\\ast b)_m$' }]),
    hh('div', 'readouts', rS.el));
  sideStd(widget, side, {
    case: 'You did this at school: in $(1+x)(1+x)$ every term meets every term, the powers add, and $1+2x+x^2$ comes out.',
    sym: String.raw`$a_j$, $b_l$: the weights of the two filters. A cell holds $a_jb_l$; its power of $x$ is $j+l$. $m$: the output position; its cells lie on one slant, $j+l=m$.`,
    tries: [

// ---------- 4. In a row, the gains multiply ----------

// ---------- 5. Why it's true: weights convolve, gains multiply ----------

// ---------- 6. A short record smears a tone ----------
const NR = 16;

    });

  }, null, 1.2);

// ---------- 8. Why it's true: the smear is D_N(f) ----------
function drawWhyLeak(svg, W, H, Nr, x, lit) {
  const f = x / Nr, th = TAU * f;
  const pts = [[0, 0]];
  for (let n = 0; n < Nr; n++) { const [a, b] = pts[n]; pts.push([a + Math.cos(th * n), b + Math.sin(th * n)]); }
  const S = pts[Nr], len = Math.hypot(S[0], S[1]);
  const CAP = {
    arrows: String.raw`amber: the $N$ arrows that $U_k$ adds, each turned $2\pi f$ past the last`,
    circle: String.raw`amber: each arrow is a chord of one circle, across the angle $2\pi f$`,
    chord: String.raw`amber: the sum, from the first tail to the last tip: a chord across $N$ times the angle`,
    curve: String.raw`amber: $|U_k|$, the sum's length over $N$, on the curve $|D_N(f)|$` }[lit];
  picCaption(svg, W, CAP, String.raw`left: the $N$ arrows of $U_k$ for a tone $fN$ bins from bin $k$; right: $|U_k|$ against $fN$`);
  const top = 30, WL = W * 0.5, bot = 50;

function slideWhyLeak(widget, side) {

  const sX = ctl('$fN$', { id: 'fN', min: -3.5, max: 3.5, step: 0.05, value: x, fmt: v => sn(v, 2), onInput: v => { x = v; plot.redraw(); } });
  const plot = proofLeft(widget, {
    controls: [pick.el, sX.el],
    draw: (svg, W, H) => drawWhyLeak(svg, W, H, Nr, x, lit),
    tests: [
      String.raw`Set $fN=0$: the arrows line up, $|U_k|=1$. At $fN=1$ they close a circle: $0$. Guess $fN=\tfrac12$ for $N=8$ ($0.641$).`,
      String.raw`Set $fN=1.5$: $0.225$ for $N=8$, $0.215$ for $N=16$. Cases are evidence, not proof.`],
    model: String.raw`$U_k$ adds $N$ unit arrows, each turned $2\pi f$ past the last. On the bin they line up; one bin off they close a circle; in between they bend into an arc whose chord is short.` });
  proofRight(side, {
    id: 'leak',
    goal: { tex: String.raw`|U_k|=\frac{|\sin N\pi f|}{N\,|\sin\pi f|}=|D_N(f)|`, words: String.raw`for the arrow tone $e^{i2\pi f_0n}$, $n<N$, with $f=f_0-\tfrac kN$. A cosine is two such tones, half size.` },
    facts: [
      { tex: String.raw`\textstyle U_k=\frac1N\sum_{n<N}u_n\,e^{-i2\pi kn/N}`, ref: 'Primer · Fourier series, step 10' },
      { words: 'unit arrows that each turn by the same angle are chords of one circle, and their sum is the chord from start to end', ref: 'Primer · Complex numbers, step 10' }],
    lines: [
      { tex: String.raw`\textstyle U_k=\frac1N\sum_{n<N}e^{i2\pi fn}`, move: 'Unfold the definition',
        why: String.raw`put the tone in; angles add, so arrow $n$ is turned $2\pi fn$`, choices: ['Name a piece', 'Use symmetry'], highlight: 'arrows' },
      { tex: String.raw`1=2R\sin\pi f`, move: 'Use an earlier result',
        why: String.raw`each unit arrow is a chord across the angle $2\pi f$ of one circle, radius $R$; half a chord is $R\sin$ of half the angle`, choices: ['Rearrange', 'Compare or bound'], highlight: 'circle' },
      { tex: String.raw`\big|\textstyle\sum_{n<N}e^{i2\pi fn}\big|=2R\,|\sin N\pi f|`, move: 'Telescope',
        why: 'the steps between neighbouring radii add up to the last radius minus the first: one chord across $N$ times the angle', choices: ['Induction', 'Take a limit'], highlight: 'chord' },
      { tex: String.raw`|U_k|=\frac{|\sin N\pi f|}{N\,|\sin\pi f|}`, move: 'Rearrange',
        why: String.raw`put in $2R=1/\sin\pi f$ from line 2, and divide by $N$`, choices: ['Undo with the inverse', 'Add zero or multiply by one'], highlight: 'curve' }],
    lookBack: [
      { q: 'Why does a tone exactly on a bin not leak?',
        a: String.raw`Then $f=\tfrac{m-k}N$, so $\sin N\pi f=0$ for every other bin: the arrows close whole circles. On its own bin $f=0$: the arrows line up, $|U_m|=1$.` },
      { q: 'How high is the first side hump?',

// ---------- 9. Fade in and out: lower side lobes ----------
const NW = 64, MREC = 5;   // record length; turns of the tone drawn in the record
const WIN = { box: () => 1, hann: (n, L) => 0.5 - 0.5 * Math.cos(TAU * n / L) };
// The smear of one arrow tone through the window, at d bins from the tone: |sum_n w_n e^{-i 2 pi d n / N}|.
function winMag(w, d) { let re = 0, im = 0; for (let n = 0; n < NW; n++) { re += w(n, NW) * Math.cos(TAU * d * n / NW); im -= w(n, NW) * Math.sin(TAU * d * n / NW); } return Math.hypot(re, im); }
const WIN_CURVES = {};
function winCurve(key) {
  if (!WIN_CURVES[key]) {
    const pk = winMag(WIN[key], 0), pts = [], db = d => 20 * Math.log10(Math.max(1e-9, winMag(WIN[key], d) / pk));
    for (let i = 0; i <= 800; i++) { const d = -8 + 16 * i / 800; pts.push([d, db(d)]); }
    let side = -999, at = 0;
    const lo = key === 'box' ? 1.02 : 2.02;
    for (let d = lo; d < lo + 1.5; d += 0.001) { const v = db(d); if (v > side) { side = v; at = d; } }
    WIN_CURVES[key] = { pts, side, at };
  }
  return WIN_CURVES[key];
}
function slideWindow(widget, side) {
  let key = 'box';

  const recP = plotBox((svg, W, H) => {
    const P = plotFrame(svg, W, H, { x0: -0.5, x1: NW - 0.5, y0: -1.2, y1: 1.2, L: 40, B: 26, T: 28 });
    const wv = n => WIN[key](n, NW);
    let d = ''; for (let i = 0; i <= 200; i++) { const t = (NW - 1) * i / 200; d += (i ? 'L' : 'M') + P.X(t).toFixed(1) + ' ' + P.Y(wv(t)).toFixed(1); }
    svgNode('path', { d, fill: 'none', stroke: COL.ink, 'stroke-width': 1.6, 'stroke-dasharray': '5 4', 'data-item': 'mark', 'data-id': 'window' }, svg);
    for (let n = 0; n < NW; n++) dot(svg, P.X(n), P.Y(wv(n) * Math.cos(TAU * MREC * n / NW)), 3, COL.muted2);
    svgTex(svg, P.L, 12, 'grey dots: the tone times the window $w_n$; dashed: $w_n$', { w: W - P.L, anchor: 'start', size: 15, fill: COL.text2 });
  }, null, 0.75);
  const specP = plotBox((svg, W, H) => {
    const c = winCurve(key), o = winCurve(key === 'box' ? 'hann' : 'box');
    const P = plotFrame(svg, W, H, { x0: -8, x1: 8, y0: -60, y1: 3, L: 46, B: 44, T: 26 });
    [-60, -40, -20, 0].forEach(v => svgText(svg, P.L - 6, P.Y(v) + 5, String(v).replace('-', '−'), { 'text-anchor': 'end' }));
    [-8, -4, -2, 0, 2, 4, 8].forEach(v => svgText(svg, P.X(v), P.base + 18, String(v).replace('-', '−'), { 'text-anchor': 'middle' }));
    svgTex(svg, (P.L + W - P.R) / 2, H - 10, 'bins from the tone, $fN$', { w: 260 });
    svgTex(svg, P.L, 12, 'the smear in dB, relative to its peak', { w: W - P.L, anchor: 'start', size: 15, fill: COL.accentDeep });
    svgNode('path', { d: pathOf(P, o.pts), fill: 'none', stroke: COL.grey, 'stroke-width': 1.2 }, svg);
    svgNode('path', { d: pathOf(P, c.pts), fill: 'none', stroke: COL.accent, 'stroke-width': 2.6, 'data-item': 'mark', 'data-id': 'smear' }, svg);
    line(svg, P.L, P.Y(c.side), W - P.R, P.Y(c.side), { stroke: COL.ink, 'stroke-dasharray': '3 3' });
    haloTex(svg, W - P.R - 4, P.Y(c.side) - 12, '$' + fx(c.side, 1) + '$ dB', { w: 110, anchor: 'end', size: 15, fill: COL.ink });

    hh('div', 'readouts', rS.el, rZ.el));

    case: 'Cut a sound off sharply and you hear a click. Fade it in and out, and the click is gone.',
    sym: String.raw`$w_n$: a weight on sample $n$ before the bins are taken; the box is $w_n=1$. Here $N=64$. dB: $20\log_{10}$ of a height ratio, so $-20$ dB is a tenth (Primer · Logarithms, step 9).`,

      String.raw`Box: the side humps start at $-13.3$ dB and fall off slowly.`,
      String.raw`Press von Hann: the side humps drop to $-31.5$ dB, and the middle hump widens from $\pm1$ to $\pm2$ bins.`],

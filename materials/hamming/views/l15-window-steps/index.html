<style>
/* Colors: grey for input or exact values, blue for output and the reader's choice, amber for the
   proof line's highlight, red only for a failed check. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft);
  /* View colors with no palette name. Light keeps the old look; dark takes palette values. */
  --v-faint:#f9fafb; --v-tint:#e0ecff; --v-hover:#bfdbfe; --v-lblue:#93c5fd; --v-box:#c7cbd1;
  --v-gridfaint:#f1f2f4; --v-band:#eceef1; --v-lbl-amber:#92400e; --v-mute-line:#6b7280; --v-lbl-blue:var(--pal-accent-deep);
  --u:clamp(16px,1.35vw,20px);
}
:root[data-fluid-theme="dark"]{
  --v-faint:var(--pal-panel); --v-tint:var(--pal-accent-soft); --v-hover:#34508a; --v-lblue:var(--pal-accent-2);
  --v-box:var(--pal-grey); --v-gridfaint:var(--pal-grid); --v-band:var(--pal-soft-2); --v-lbl-amber:var(--pal-amber-ink);
  --v-mute-line:var(--pal-muted); --v-lbl-blue:var(--pal-accent-2);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 24px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(6px,1vh,12px) 24px;overflow:hidden}
footer{display:flex;align-items:center;gap:10px;padding:8px 24px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Slide frame: widget on the left (3/5), text on the right (2/5). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(18px,2.4vw,40px)}
.widget{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(5px,0.9vh,10px);overflow:hidden}
.widget>*{max-width:100%;min-width:0}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(6px,1.1vh,12px);overflow:hidden}
.tag{font:14px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(20px,1.9vw,28px);line-height:1.2;margin:0;font-weight:650}
.question{margin:0;font-size:clamp(16px,1.3vw,18px);font-weight:600}
.formula{font-size:clamp(17px,1.5vw,22px)}
.sym{margin:0;font-size:16px;color:var(--muted)}
.sym.name i{color:var(--fg)}
.tries{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.tries li::marker{color:var(--pal-accent-deep);font-weight:600}
.takeaway{margin:0;padding:8px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px;transition:opacity .2s}
/* Dark only: at .3 the dimmed takeaway text is 2.4:1 on the dark panel; .6 keeps it dimmer than full while passing 4.5:1. */
.echo{margin:0;font-size:16px;line-height:1.35}
.echo .kick{display:block;font-size:14px;color:var(--muted)}
.echo .src{font-size:14px;color:var(--muted)}

/* Controls and readouts */
.sliders{display:flex;gap:6px 22px;flex-wrap:wrap;width:100%;align-items:center}
.slide-ctl{display:flex;align-items:center;gap:8px;font-size:16px}
.slide-ctl input{width:clamp(110px,10vw,160px);vertical-align:middle;accent-color:var(--accent)}
.slide-ctl .val{min-width:58px;white-space:nowrap}
.btn{font:inherit;padding:5px 11px;border:1px solid var(--line);background:var(--pal-panel);border-radius:8px;cursor:pointer;font-size:16px}
.btn.on{background:var(--chip);border-color:var(--accent);color:var(--pal-accent-deep)}

.btnrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grp{display:inline-flex;gap:0}
.grp .btn{border-radius:0;margin-left:-1px}
.grp .btn:first-child{border-radius:8px 0 0 8px;margin-left:0}
.grp .btn:last-child{border-radius:0 8px 8px 0}
.grp .btn.on{position:relative;z-index:1}
.readouts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.readout{flex:1 1 150px;min-width:0;padding:3px 8px;border-radius:10px;background:var(--pal-soft);font-size:15px;overflow-wrap:anywhere}
.readout .k{color:var(--muted);font-size:14px}
.readout .val{font-size:16px;font-weight:600}
.legend{display:flex;gap:4px 16px;flex-wrap:wrap;font-size:15px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:20px;height:0;vertical-align:middle;margin-right:6px}
.chip{display:inline-block;width:18px;height:12px;vertical-align:middle;margin-right:6px;border-radius:2px}

/* Proof slides: test and picture on the left, the proof (fl-proof-steps) on the right */
.slide.proof-slide{grid-template-columns:minmax(0,11fr) minmax(0,9fr)}
.slide.proof-slide .side{justify-content:flex-start;gap:6px}
.slide.proof-slide .legend{gap:2px 12px}
.part{margin:0;font-weight:600;color:var(--muted)}
.test{display:flex;flex-direction:column;gap:3px;font-size:16px}
.test .tries{gap:3px}
.model{margin:0;padding:6px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px;line-height:1.35}

/* Decision slides: problem, three cards and the reveal on the left; question, try-steps, AI echo, takeaway on the right */
.slide.decision{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)}

.decision .side{justify-content:space-evenly;gap:8px}

.decision .question{font-size:clamp(16px,1.5vw,20px);line-height:1.35}
.decision .fx{margin:0;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--v-faint);font-size:clamp(17px,1.5vw,20px);line-height:1.4}
.decision .kicker{font-size:14px;color:var(--muted);margin:0 0 3px}

.decision .tries{font-size:clamp(16px,1.4vw,18px)}
.hold{color:var(--muted);font-style:italic;background:var(--v-faint);border:1px dashed var(--line);border-radius:6px;padding:8px 12px;margin:0;font-size:16px;line-height:1.4}
.prob{flex:1 0 auto;display:flex;gap:12px;align-items:stretch;border:1px solid var(--line);border-radius:10px;padding:6px 10px 6px 14px;background:var(--v-faint);font-size:16px;line-height:1.4}
.prob .txt{flex:1 1 0;min-width:0;margin:0;align-self:center}
.prob .lead{font-weight:650;color:var(--muted)}
.prob .sketch{flex:0 0 46%;display:flex;flex-direction:column;min-height:104px}

.opts{flex:0 0 auto;display:flex;flex-direction:column;gap:clamp(4px,0.5vw,7px)}

.opt .lhs{display:flex;flex-direction:column;gap:2px;min-width:0}
.opt .rhs{display:flex;flex-direction:column;justify-content:center;min-width:0;border-left:1px solid var(--pal-soft-2);padding-left:14px}
.opt:not([aria-disabled="true"]):hover{border-color:var(--accent)}
.opt[aria-disabled="true"]{cursor:default}
.opt .top{display:flex;align-items:baseline;gap:8px;font-size:16px;line-height:1.3}
.opt .letter{font-weight:700;color:var(--pal-accent-deep)}
.opt .who{font-size:14px;line-height:1.2;color:var(--muted)}
.opt .body{font-size:16px;line-height:1.3}
.opt .asm{margin:0;font-size:16px;line-height:1.3;color:var(--muted)}
.opt .verdict{font-size:16px;line-height:1.3;color:var(--fg)}
.opt .verdict.idle{color:var(--muted);font-style:italic}
.opt.on{box-shadow:inset 0 0 0 2px var(--pal-ink)}
.opt.chosen{background:var(--chip);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.opt.chosen .who{color:var(--pal-accent-deep);font-weight:600}
.reveal{flex:0 0 auto;border:1px solid var(--line);border-radius:10px;padding:6px 14px;font-size:16px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.reveal.idle{background:var(--v-faint);color:var(--muted)}
.rv{margin:0;line-height:1.35}
.rv .k{font-weight:650;color:var(--pal-accent-deep)}
.rv .t{color:var(--muted);font-size:14px;white-space:nowrap}
.reveal .actions{display:flex;align-items:center;gap:10px;margin-top:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--pal-on-accent)}

@media (max-height: 680px){
  header{padding-top:4px}
  #stage{padding:4px 24px}
  footer{padding:4px 24px}
  .widget{gap:4px}
  .side{gap:4px}
  .tries{gap:2px}
  .sym,.tries,.echo,.model{line-height:1.22}
  .readout{padding:2px 8px}
  .takeaway{padding:5px 10px}
  .formula{font-size:18px}
  h2{font-size:20px}
  .decision h2{font-size:22px}
  .slide-ctl input{width:104px}
  .btn{padding:3px 9px}
  .opt{padding:3px 10px}
  .opts{gap:4px}
  .decision .widget{gap:4px}
  .opt .body,.opt .asm,.opt .verdict,.rv,.opt .top{line-height:1.2}
  .reveal{padding:3px 12px;gap:1px}
  .prob{padding:3px 10px 3px 12px;line-height:1.25}
  .decision .side{gap:6px}
  .decision h2{font-size:22px}
  .decision .question{font-size:17px}
  .decision .tries{font-size:16px}
}

<script>
// ---------- palette ----------
// COL holds the colors for the SVG being drawn. fillPlot sets it at paint time, so a theme switch
// redraws with the new values. SVG attributes take COL; HTML inline styles take var(--pal-*).
let COL = {};
let PLOTS = [];                       // the current slide's plots, redrawn on a theme switch
function readPalette() {
  const c = FluidTheme.color, cs = getComputedStyle(document.documentElement);
  const v = n => cs.getPropertyValue(n).trim();   // the view's own tokens (:root in the style block)
  return {
    ink: c('ink'), text2: c('text-2'), muted: c('muted'), grey: c('grey'), accent: c('accent'),
    panel: c('panel'), line: c('line'), grid: c('grid'), soft2: c('soft-2'), amber: c('amber'),
    amberBg: c('amber-bg'), amberInk: c('amber-ink'), amberRow: c('amber-row'),
    muteLine: v('--v-mute-line'), lblBlue: v('--v-lbl-blue'), lblue: v('--v-lblue'), box: v('--v-box'), gridFaint: v('--v-gridfaint'),
    band: v('--v-band'), lblAmber: v('--v-lbl-amber'), tint: v('--v-tint'), hover: v('--v-hover'),
  };
}
window.addEventListener('fluid-themechange', () => PLOTS.forEach(p => p.redraw()));
// Primer pointers, by the number each primer's footer shows (checked 2026-10-22 against each view's
// SLIDES array; p-complex/meta.json still lists an older 7-step order):
//   Complex numbers, step 3 = p-complex 'multiply'       step 7  = p-complex 'why-shadow'
//   Fourier series, step 8  = p-fourier 'smoothness'      step 10 = p-fourier 'discrete'
//   Signals: convolution, step 5 = p-signals-3 'why-convolve'   Signals: convolution, step 7 = p-signals-3 'record-length'
// ---------- math (checked with node: workspace/l15-materials-2026-10-22/l15-window-steps/check.js) ----------
// MATH-START
const PI = Math.PI;
function sinc(x) { if (Math.abs(x) < 1e-12) return 1; const p = PI * x; return Math.sin(p) / p; }
const SI_PI = 1.8519370519824662;   // Si(pi) = int_0^pi sin(s)/s ds
// 10-point Gauss-Legendre rule on [-1, 1]
const GLX = [0.1488743389816312, 0.4333953941292472, 0.6794095682990244, 0.8650633666889845, 0.9739065285171717];
const GLW = [0.2955242247147529, 0.2692667193099963, 0.2190863625159820, 0.1494513491505806, 0.0666713443086881];
function gauss(g, a, b, pieces) {
  let s = 0;
  const w = (b - a) / pieces;
  for (let p = 0; p < pieces; p++) {
    const c = a + (p + 0.5) * w, r = w / 2;
    for (let i = 0; i < 5; i++) s += GLW[i] * (g(c - r * GLX[i]) + g(c + r * GLX[i])) * r;
  }
  return s;
}
const sOverS = s => (Math.abs(s) < 1e-12 ? 1 : Math.sin(s) / s);
// Continuous windows on t in [-1/2, 1/2]; transforms in bins nu, normalized so W(0) = 1.
const WIN = {
  box: nu => sinc(nu),
  // sinc(2t): Lanczos' sigma factors as a window. W = [Si(pi(1+nu)) + Si(pi(1-nu))] / (2 pi), over Si(pi)/pi.
  sigma: nu => gauss(sOverS, PI * (nu - 1), PI * (nu + 1), 4) / (2 * PI) / (SI_PI / PI),
  hann: nu => sinc(nu) + 0.5 * (sinc(nu - 1) + sinc(nu + 1)),
};
// Raised cosine on a platform, w = a + (1 - a) cos(2 pi t): three sincs, normalized to W(0) = 1.
function platformW(a, nu) { return (a * sinc(nu) + (1 - a) / 2 * (sinc(nu - 1) + sinc(nu + 1))) / a; }
const db = x => 20 * Math.log10(Math.max(Math.abs(x), 1e-15));
// Largest |fn| on [c, c + 1]: the lobe "near c bins".
function bandMax(fn, c) {
  let m = 0;
  for (let i = 0; i <= 500; i++) m = Math.max(m, Math.abs(fn(c + i / 500)));
  return m;
}
// The first sign change of fn on [lo, hi], refined by bisection.
function firstZero(fn, lo, hi, step) {
  let x0 = lo, v0 = fn(lo);
  for (let x = lo + step; x <= hi + 1e-12; x += step) {
    const v = fn(x);
    if (v === 0) return x;
    if (v0 * v < 0) {
      let a = x0, b = x;
      for (let k = 0; k < 50; k++) { const m = (a + b) / 2; if (fn(a) * fn(m) <= 0) b = m; else a = m; }
      return (a + b) / 2;
    }
    x0 = x; v0 = v;
  }
  return null;
}
// Largest |fn| beyond z up to hi: a scan, then a golden-section refine around the best point.
function largestLobe(fn, z, hi, step) {
  let best = 0, at = z;
  for (let x = z + step; x <= hi; x += step) { const v = Math.abs(fn(x)); if (v > best) { best = v; at = x; } }
  let a = at - step, b = at + step;
  const g = 0.6180339887;
  for (let k = 0; k < 40; k++) {
    const c = b - g * (b - a), d = a + g * (b - a);
    if (Math.abs(fn(c)) > Math.abs(fn(d))) b = d; else a = c;
  }
  const x = (a + b) / 2;
  return { v: Math.abs(fn(x)), at: x };
}
function platformLobe(a, hi) {
  const fn = nu => platformW(a, nu);
  // W_a is 0 at nu = 2 for every a; near a = 4/7 that zero is double and the scan sees no sign change
  const z0 = firstZero(fn, 1, 2.05, 0.005), z = z0 == null ? 2 : Math.min(z0, 2);
  return Object.assign(largestLobe(fn, z, hi, 0.01), { zero: z });
}
// Share of energy beyond c bins (both sides), by Parseval: total = (a^2 + (1-a)^2/2) / a^2.
function platformEnergyBeyond(a, c) {
  const L = 400, n = Math.round((L - c) / 0.01), w = (L - c) / n;
  const g = nu => { const v = platformW(a, nu); return v * v; };
  let s = g(c) + g(L);
  for (let i = 1; i < n; i++) s += g(c + i * w) * (i % 2 ? 4 : 2);
  s *= w / 3;
  const k = (2 * a - 1) / a;            // far lobes go like k sin(pi nu) / (pi nu)
  s += k * k / (2 * PI * PI * L);       // the tail beyond L, averaged
  return 2 * s / ((a * a + (1 - a) * (1 - a) / 2) / (a * a));
}
// A record of N samples, n = -(N-1)/2 .. (N-1)/2. D is the sum of e^{-i 2 pi nu n / N}.
function dirichlet(nu, N) { const s = Math.sin(PI * nu / N); return Math.abs(s) < 1e-12 ? N : Math.sin(PI * nu) / s; }
function lineKernel(nu, N, win) {
  if (win === 'box') return dirichlet(nu, N) / N;
  // von Hann w = 1/2 + 1/2 cos(2 pi n / N): three shifted kernels; the weights add to N/2
  return (0.5 * dirichlet(nu, N) + 0.25 * (dirichlet(nu - 1, N) + dirichlet(nu + 1, N))) / (N / 2);
}
// Two equal lines d bins apart, added as powers (independent lines, like two stars).
function twoLines(nu, d, N, win) { const p = lineKernel(nu, N, win), q = lineKernel(nu - d, N, win); return p * p + q * q; }
// Dip at the midpoint as a share of the peak; 0 when the midpoint is the top (one peak).
function dipOf(d, N, win) {
  const mid = twoLines(d / 2, d, N, win);
  let pk = 0;
  const a = -0.5, b = d / 2;
  for (let i = 0; i <= 3000; i++) pk = Math.max(pk, twoLines(a + (b - a) * i / 3000, d, N, win));
  return pk <= mid * (1 + 1e-9) ? 0 : 1 - mid / pk;
}
// Fourier coefficients a_k, b_m for k, m = -3..3 (index k + 3); c_n for n = -6..6 (index n + 6).
function convolve(a, b) {
  const c = new Array(a.length + b.length - 1).fill(0);
  a.forEach((x, i) => b.forEach((y, j) => { c[i + j] += x * y; }));
  return c;
}
// Real part of sum_k coef_k e^{i k x}, k = index - off.
function seriesRe(coef, off, x) { let s = 0; coef.forEach((v, i) => { s += v * Math.cos((i - off) * x); }); return s; }
function seriesIm(coef, off, x) { let s = 0; coef.forEach((v, i) => { s += v * Math.sin((i - off) * x); }); return s; }
// One tone at 5.5 bins through a box of N = 32 samples (time centered): X_k = (1/N) sum x_n e^{-i 2 pi k n / N}.
const NEG = (() => {
  const N = 32, m = 5.5, re = [];
  for (let k = 0; k < 12; k++) {
    let s = 0;
    for (let i = 0; i < N; i++) { const n = i - (N - 1) / 2; s += Math.cos(2 * PI * m * n / N) * Math.cos(2 * PI * k * n / N); }
    re.push(s / N);
  }
  const sm = [];
  for (let k = 1; k <= 10; k++) sm.push(0.25 * re[k - 1] + 0.5 * re[k] + 0.25 * re[k + 1]);
  return { re, sm };   // sm[k - 1] is the smoothed value at bin k
})();
// MATH-END

// The largest side lobe of the platform window against a, and the a that makes it smallest.
const LOBE_CURVE = [];
for (let i = 0; i <= 200; i++) { const a = 0.5 + i * 0.0005; LOBE_CURVE.push([a, db(platformLobe(a, 12).v)]); }
const A_MIN = (() => {
  let lo = 0.53, hi = 0.546;
  const g = 0.6180339887, f = a => platformLobe(a, 12).v;
  for (let k = 0; k < 40; k++) { const c = hi - g * (hi - lo), d = lo + g * (hi - lo); if (f(c) < f(d)) hi = d; else lo = c; }
  return (lo + hi) / 2;
})();
const LOBE_MIN = db(platformLobe(A_MIN, 12).v);

// ---------- DOM and drawing helpers ----------
const $ = s => document.querySelector(s);
const NSV = 'http://www.w3.org/2000/svg', NHT = 'http://www.w3.org/1999/xhtml';
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false } ], throwOnError: false };
// Render $...$ and $$...$$ in a node. If the CDN did not load, the text stays as typed.
function tex(node) {
  if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH);
  return node;
}
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) {
  const e = document.createElement(tag);

// ---------- step 2: resolution, Lecture 27:00 to 30:09 ----------

    { color: 'var(--pal-grey)', text: String.raw`thin grey: each line alone` },

// ---------- step 3: corner-decay, Lecture 31:45 to 35:02 ----------
const WIN_INFO = {

  hann: { label: 'von Hann', ends: 'smooth', shape: t => 0.5 + 0.5 * Math.cos(2 * PI * t) },

// The top of each lobe from 1 to 100 bins: the largest |W| in each bin [j, j + 1].
const ENV = {};
for (const k of Object.keys(WIN)) {
  ENV[k] = [];
  for (let j = k === 'box' ? 1 : 2; j < 100; j++) { let m = 0; for (let i = 0; i <= 40; i++) m = Math.max(m, Math.abs(WIN[k](j + i / 40))); ENV[k].push([j + 0.5, m]); }
}

    { color: 'var(--pal-accent)', width: 3, text: String.raw`blue: the window $w$, and the top of each lobe of $|W|$` },
    { color: 'var(--v-lblue)', width: 2, text: String.raw`lighter blue: $|W|$ itself` },
    { color: 'var(--v-box)', width: 3, text: 'grey: the box' },
    { color: 'var(--v-mute-line)', dash: true, text: String.raw`dashed: $1/k$, $1/k^2$, $1/k^3$` }]));

    path(svg, [[f.left, f.base], [f.right, f.base]], { stroke: COL.grey });

    { color: 'var(--pal-grey)', width: 2, text: 'grey: von Hann' },
    { chip: true, color: 'var(--pal-ink)', text: 'dot: the largest side lobe' }]));
  const bot = fillPlot(widget, drawCurve);
  widget.append(hh('div', 'readouts', rL.el, r30.el, rE.el));
  function drawW(svg, W, H) {
    const f = frame(W, H, { x0: 0, x1: 40, y0: -110, y1: 0 }, { t: 10, b: 40 });
    for (const v of [-20, -40, -60, -80, -100]) path(svg, [[f.left, f.Y(v)], [f.right, f.Y(v)]], { stroke: COL.gridFaint });
    axes(svg, f, { xt: [[0, '0'], [10, '10'], [20, '20'], [30, '30'], [40, '40']],
      yt: [[0, '0'], [-20, '−20'], [-40, '−40'], [-60, '−60'], [-80, '−80'], [-100, '−100']],
      xlabel: String.raw`$\nu$: bins from the line`, ylabel: String.raw`$|W|$ in dB` });
    const curve = a => { const pts = []; for (let i = 0; i <= 2000; i++) { const nu = 40 * i / 2000; pts.push([f.X(nu), f.Y(Math.max(-110, db(platformW(a, nu))))]); } return pts; };
    path(svg, curve(0.5), { stroke: COL.grey, 'stroke-width': 1.3, 'data-item': 'mark', 'data-id': 'hann' });
    path(svg, curve(A), { stroke: COL.accent, 'stroke-width': 1.5, 'data-item': 'mark', 'data-id': 'W-a' });
    const L = platformLobe(A, 40);
    dot(svg, f.X(L.at), f.Y(db(L.v)), COL.ink, 5);
    svgTex(svg, f.X(L.at) + 9, f.Y(db(L.v)) - 12, String.raw`$${db(L.v).toFixed(1)}$ dB at $${L.at.toFixed(2)}$`, { w: 170, size: 14, anchor: 'start', fill: COL.ink, halo: true });
    // inset: the window and the step at its ends
    const iw = Math.min(240, Math.max(190, (f.right - f.left) * 0.38)), ih = Math.min(96, (f.base - f.top) * 0.42);
    const ix = f.right - iw - 4, iy = f.top + 2;
    svgNode('rect', { x: ix, y: iy, width: iw, height: ih, rx: 8, fill: COL.panel, stroke: COL.line, 'data-item': 'mark', 'data-id': 'inset' }, svg);
    const IX = t => ix + 16 + (t + 0.75) / 1.5 * (iw - 32), IY = y => iy + ih - 12 - y * (ih - 30);
    const pts = [[IX(-0.75), IY(0)], [IX(-0.5), IY(0)]];
    for (let i = 0; i <= 80; i++) { const t = -0.5 + i / 80; pts.push([IX(t), IY(A + (1 - A) * Math.cos(2 * PI * t))]); }
    pts.push([IX(0.5), IY(0)], [IX(0.75), IY(0)]);
    path(svg, pts, { stroke: COL.accent, 'stroke-width': 2 });
    svgTex(svg, ix + iw / 2, iy + 11, String.raw`$w(t)$: ends at $2a-1=${(2 * A - 1).toFixed(2)}$`, { w: iw - 4, size: 13, fill: COL.text2 });
    for (const t of [-0.5, 0.5]) svgNode('circle', { cx: IX(t), cy: IY((2 * A - 1) / 2), r: 7, fill: 'none', stroke: COL.ink, 'stroke-width': 1.2 }, svg);
    return null;
  }
  function drawCurve(svg, W, H) {
    const f = frame(W, H, { x0: 0.5, x1: 0.6, y0: -48, y1: -30 }, { t: 8, b: 42 });
    axes(svg, f, { xt: [[0.5, '0.50'], [0.52, '0.52'], [0.54, '0.54'], [0.56, '0.56'], [0.58, '0.58'], [0.6, '0.60']],
      yt: [[-30, '−30'], [-35, '−35'], [-40, '−40'], [-45, '−45']],
      xlabel: String.raw`$a$, platform height` });
    svgTex(svg, f.X(0.555), f.top + 10, 'largest side lobe (dB) against $a$', { w: 300, size: 15 });
    path(svg, LOBE_CURVE.map(([a, v]) => [f.X(a), f.Y(Math.max(-48, Math.min(-30, v)))]), { stroke: COL.ink, 'stroke-width': 2, 'data-item': 'mark', 'data-id': 'lobe-curve' });
    svgNode('circle', { cx: f.X(A_MIN), cy: f.Y(LOBE_MIN), r: 4, fill: COL.panel, stroke: COL.ink, 'stroke-width': 1.5 }, svg);
    svgTex(svg, f.X(A_MIN) + 16, f.Y(LOBE_MIN) + 13, String.raw`minimum: $a=${A_MIN.toFixed(3)}$, $${LOBE_MIN.toFixed(1)}$ dB`, { w: 260, size: 14, anchor: 'start', fill: COL.ink, halo: true });
    const L = db(platformLobe(A, 40).v);
    dot(svg, f.X(A), f.Y(Math.max(-48, Math.min(-30, L))), COL.accent, 6);
    return null;
  }
  function update() {
    const L = platformLobe(A, 40);
    rL.set('$' + db(L.v).toFixed(1) + '$ dB at $' + L.at.toFixed(2) + '$ bins');
    r30.set('$' + db(bandMax(nu => platformW(A, nu), 30)).toFixed(1) + '$ vs $' + HANN_30.toFixed(1) + '$ dB');
    rE.set('$' + sci(platformEnergyBeyond(A, 3)) + '$ vs $' + sci(HANN_E3) + '$');
    top.redraw(); bot.redraw();
  }
  side.append(
    sym(String.raw`$w=a+(1-a)\cos\frac{2\pi n}N$: a raised cosine on a platform, ends at $2a-1$. $a=0.5$ is von Hann, $a=0.54$ Hamming. $W_a$: its transform, three sincs (step 5).`),
    nameLine(String.raw`<i>minimax</i>: minimize the maximum.`),
    formula(String.raw`$\min_a\ \max_{\text{side lobes}}|W_a(\nu)|$`),
    triesList([
      String.raw`At $a=0.5$ the largest lobe is the first, $-31.5$ dB at $2.4$ bins. Raise $a$: it sinks while the lobes near $4.5$ bins rise.`,
      String.raw`They balance near $a=0.538$, at $-43.2$ dB. Hamming's rounded $0.54$ gives $-42.7$; past $0.55$ it gets worse again.`,
      String.raw`Read 30 bins: von Hann $-99$ dB, Hamming $-56$ dB. Beyond 3 bins Hamming lets in 6 times more energy (step 3: its ends jump).`]),
    takeLine(String.raw`Minimax puts the worst lobe as low as it goes and pays with leakage from far away. It suits one strong line, not every spectrum.`));
  update();
}

// ---------- frame ----------
const SLIDES = [
  { id: 'multiply-convolve', kind: 'proof', tag: 'Lecture 25:27 to 27:00',
    title: "Why it's true: multiplying two series convolves their coefficients",
    question: 'When you multiply two Fourier series, what happens to their coefficients?', mount: slideMultiply },
  { id: 'resolution', kind: 'content', tag: 'Lecture 27:00 to 30:09',
    title: 'How long must you watch to see two lines?',
    question: 'A finite record smears every line. When can you still tell two close lines apart?', mount: slideResolution },
  { id: 'corner-decay', kind: 'content', tag: 'Lecture 31:45 to 35:02',
    title: "A window's ends decide how far it leaks",
    question: 'Why does a window with corners let in power from far away?', mount: slideCorner },
  { id: 'negative-power', kind: 'decision', tag: 'Lecture 35:02',
    title: 'The spectrum says power is negative. What now?',
    question: 'Your computed power spectrum has negative values. What do you do?', mount: slideDecision('negative-power') },
  { id: 'hann-weights', kind: 'proof', tag: 'Lecture 36:40 to 37:44',
    title: "Why it's true: one-two-one smoothing is a raised-cosine window",
    question: String.raw`Why is averaging the spectrum $\tfrac14,\tfrac12,\tfrac14$ the same as multiplying the data by a raised cosine?`, mount: slideHann },
  { id: 'minimax-lobe', kind: 'decision', tag: 'Lecture 37:44',
    title: 'One strong line leaks into everything. Which window?',
    question: 'A very strong line sits away from the weak part you study. How do you keep it out?', mount: slideDecision('minimax-lobe') },
  { id: 'platform', kind: 'content', tag: 'Lecture 38:46 to 39:52',
    title: 'How high should the platform be?',
    question: 'Which platform height makes the largest side lobe smallest, and what does it cost?', mount: slidePlatform },
];

let cur = 0, shownId = null, endSent = false;
// Build the current step. Decision steps rebuild from their state; others start fresh.
function render() {
  const s = SLIDES[cur];
  const stage = $('#stage');
  stage.innerHTML = '';
  const widget = h('div', 'widget');
  const side = hh('div', 'side', h('div', 'tag', s.tag), setTex(h('h2'), s.title), setTex(h('p', 'question'), s.question));
  const cls = s.kind === 'proof' ? ' proof-slide' : s.kind === 'decision' ? ' decision' : '';
  const sec = mark(h('section', 'slide' + cls), 'step', s.id, s.title.replace(/\$/g, ''));
  sec.append(widget, side);
  stage.append(sec);
  stage.scrollTop = 0;
  PLOTS = [];
  s.mount(widget, side);
  // The takeaway of a content step is dimmed until the reader has tried a control.
  const tk = s.kind === 'content' ? side.querySelector('.takeaway') : null;
  if (tk) {
    tk.classList.add('dim');
    const open = () => tk.classList.remove('dim');
    sec.addEventListener('input', open);
    sec.addEventListener('click', e => { if (e.target.closest('[data-item="control"],[data-item="preset"]')) open(); });
  }
  tex(sec);
}
function goTo(i) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  if (shownId !== null && shownId !== s.id) emit('view.step', { step: s.id });
  shownId = s.id;
  render();
  if (cur === SLIDES.length - 1 && !endSent) { endSent = true; emit('view.action', { action: 'deck-end' }); }
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, k) => d.classList.toggle('on', k === cur));
}
// A cue is a state. {step} goes to the step; {step, reveal: true} also reveals a decision.
// A repeated cue changes nothing, and a reveal stays shown when a later {step} cue arrives.
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i < 0) return;
  let changed = false;
  if (msg.reveal === true && DEC[msg.step] && !isOpen(msg.step)) {
    decState[msg.step].shown = true;
    emit('view.action', { action: 'reveal', step: msg.step, by: 'cue' });
    changed = true;
  }
  if (i !== cur) goTo(i);
  else if (changed) render();
}
(function init() {
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = s.title.replace(/\$/g, '');
    b.addEventListener('click', () => goTo(i));
    $('#dots').append(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],textarea,select')) return;
    if (e.target && e.target.classList && e.target.classList.contains('opt')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
})();
</script>

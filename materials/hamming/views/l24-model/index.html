<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>After Lecture 24: what a model establishes</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><script src="../../components/theme.js"></script><style>*{box-sizing:border-box}body{margin:0;background:var(--pal-bg);color:var(--pal-fg);font:18px/1.42 system-ui,sans-serif}main{height:100vh;padding:26px 30px;display:grid;grid-template-rows:58px 1fr 44px;gap:15px}header,footer{display:flex;align-items:center;justify-content:space-between;gap:14px}h1{font-size:24px;margin:0}h2{font-size:29px;line-height:1.15;margin:0 0 12px}p{margin:0 0 14px}.tag{color:var(--pal-muted);font-size:16px}.body{display:grid;grid-template-columns:59% 1fr;gap:28px;min-height:0}.lab{border:1px solid var(--pal-line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:15px;background:var(--pal-panel);min-height:0}.lesson{padding:8px 0;display:flex;flex-direction:column}.question{font-size:20px}.defs{color:var(--pal-text-2);margin-bottom:14px;font-size:17px}.formula{font-size:26px;margin-bottom:10px}.take{background:var(--pal-accent-soft);padding:15px;border-radius:10px;font-size:18px;margin-top:auto}ol{padding-left:25px;margin:5px 0 18px}li{padding:4px 0}button,select{font:inherit;color:var(--pal-fg);background:var(--pal-soft);border:1px solid var(--pal-line);border-radius:8px;padding:9px 14px;cursor:pointer}button:hover{background:var(--pal-accent-soft)}button:disabled{opacity:.45;cursor:default}.chart{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.chart svg{width:100%;height:100%}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:16px}.legend span:before{content:'';display:inline-block;width:20px;height:4px;background:var(--c);margin-right:7px;vertical-align:middle}.readout{padding:13px;background:var(--pal-soft);border-radius:8px;font-size:18px;min-height:55px}.controls{display:flex;align-items:center;gap:16px}.controls label{display:flex;align-items:center;gap:16px;flex:1}input[type=range]{flex:1;accent-color:var(--pal-accent)}.intro,.choices,.proof{display:flex;flex-direction:column;flex:1;gap:17px;justify-content:center}.intro>div{border-left:4px solid var(--pal-accent);background:var(--pal-soft);padding:20px;font-size:22px}.intro small,.choice small{display:block;font-size:17px;margin-top:8px;color:var(--pal-text-2)}.choice{text-align:left;padding:18px;font-size:20px}.verdict{border-top:1px solid var(--pal-line);margin-top:10px;padding-top:10px;font-size:17px;color:var(--pal-accent-deep)}.proof-row{padding:10px;background:var(--pal-soft);font-size:22px;border-left:4px solid var(--pal-line)}.proof-row:last-child{background:var(--pal-amber-row);border-color:var(--pal-amber)}.proof-row small{display:block;font-size:16px;margin-top:3px;color:var(--pal-text-2)}.guess{font-size:17px}.guess button{font-size:16px;padding:5px 8px;margin:4px 4px 0 0}.proof{gap:10px}.choice{font-size:19px;padding:14px}.choice small,.verdict{font-size:16px;line-height:1.35}.source{color:var(--pal-muted);font-size:15px}a{color:var(--pal-accent-deep)}.pages{font-size:16px;color:var(--pal-muted)}</style></head><body><main><header><h1>After Lecture 24: what a model establishes</h1><span id="tag" class="tag"></span></header><section class="body"><div id="lab" class="lab"></div><article class="lesson"><h2 id="title"></h2><p id="question" class="question"></p><div id="defs" class="defs"></div><div id="formula" class="formula"></div><ol id="tries"></ol><div id="take" class="take"></div></article></section><footer><button id="prev">← Previous</button><span class="pages" id="pages"></span><span class="source">L24 · manual study · <a href="https://www.feynmanlectures.caltech.edu/III_01.html" target="_blank">amplitude rules</a> · <a href="https://www.nobelprize.org/uploads/2023/10/advanced-physicsprize2022-4.pdf" target="_blank">Bell scope</a></span><button id="next">Next →</button></footer></main><script>const slides=[{"id": "inverse", "kind": "inverse", "title": "Same output, different insides", "time": "After \u00b7 09:34\u201310:37", "q": "Can perfect input-output data reveal every internal parameter?", "defs": "A toy device splits an input between two hidden branches, then adds them. One branch multiplies by the slider value; the other uses its complement to three.", "tries": ["Move the first branch gain from 0 to 3.", "Notice that every input-output test still sees the same total gain."], "take": "This explicit counterexample supports Hamming\u2019s warning: observations need not identify a unique internal model."}, {"id": "inverse-proof", "kind": "proof", "title": "Prove the ambiguity", "time": "After \u00b7 supports 10:04", "q": "Why can no external input distinguish these toy devices?", "defs": "$x$: input; $y$: output. $g$: first-branch gain. The second branch has gain $3-g$. No noise or nonlinear effects are included.", "tries": ["Reveal the output one line at a time.", "Look back: what extra measurement would expose a branch?"], "take": "Every gain setting has the same external map. Measuring one internal branch would add information that the original experiment lacks.", "rows": [["y=gx+(3-g)x", "Add the two branch outputs"], ["y=[g+3-g]x", "Factor out the common input"], ["y=3x", "Cancel the hidden gain"], ["g=0\\ \\text{or}\\ g=2\\quad\\Rightarrow\\quad y=3x", "Check two different interiors"]]}, {"id": "functions", "kind": "choice", "title": "A fit that a scientist can use", "time": "After \u00b7 08:01\u201309:03", "q": "Which fitting strategy did Hamming choose?", "defs": "A collaborator needs a numerical fit. Several function families fit the observations about equally well.", "tries": ["Choose before revealing Hamming\u2019s approach."], "take": "Hamming asked which functions connected to the scientist\u2019s thinking. A meaningful fit can suggest a theory; the fit alone does not establish it.", "options": [["Ask which functions the collaborator believes matter", "Assumes a fit can help scientific interpretation.", "Hamming\u2019s choice: discuss the field, often over lunch, then calculate in those terms."], ["Always use an arbitrary high-degree polynomial", "Assumes numerical fit alone is the goal.", "It may interpolate well but may offer little physical insight."], ["Refuse to calculate without a complete theory", "Assumes understanding must precede useful computation.", "Hamming instead tried to make computation help theory develop."]], "answer": 0}, {"id": "domain", "kind": "domain", "title": "Experience can face a changed world", "time": "After \u00b7 41:28\u201342:30", "q": "What happens when a familiar rule meets a new regime?", "defs": "Toy deployment: an old rule predicts 80 successful tasks per 100 in every setting. A changed environment reduces the true expected success count. This is an invented example, not measured AI data.", "tries": ["Increase environment change.", "Compare the old rule with the simulated new regime."], "take": "The gap illustrates distribution shift. It does not prove that a simulation deserves trust: its new-regime assumptions also need evidence."}, {"id": "judgment", "kind": "choice", "title": "Expert and simulation disagree", "time": "After \u00b7 41:28", "q": "Which question should come before choosing a side?", "defs": "An experienced engineer predicts one result. A model predicts another. The technology may have changed since the engineer gained experience.", "tries": ["Pick Hamming\u2019s criterion."], "take": "His heuristic asks whether past experience transfers. In practice, audit the simulation and seek a small test in the present regime.", "options": [["Always trust the simulation", "Assumes mathematical form guarantees validity.", "No. A simulation can encode wrong assumptions."], ["Always trust the experienced person", "Assumes the old environment still applies.", "No. Familiar intuition can fail after a regime change."], ["Ask how fast the technology is changing", "Assumes experience has a domain.", "Hamming\u2019s criterion: favor experience in slow change and simulation in rapid change."]], "answer": 2}, {"id": "localize", "kind": "choice", "title": "An ablation finds a dependency", "time": "After \u00b7 24:13\u201325:14", "q": "If removing a component breaks a skill, where is the skill stored?", "defs": "AI analogy to Hamming\u2019s telephone line: ablating one attention head prevents a model from answering a class of questions.", "tries": ["Choose the narrowest justified conclusion."], "take": "The head is necessary under this intervention. A stronger localization claim needs controls, replacement tests and evidence about the computation.", "options": [["The complete skill lives only in that head", "Assumes interruption proves origin.", "Too strong: the head may relay information computed elsewhere."], ["That intervention disrupts a needed dependency", "Assumes the observed failure is real and reproducible.", "Supported. This matches the caution in Hamming\u2019s telephone-line analogy."], ["The head has no causal role", "Assumes only origins count as causes.", "Too weak: disabling it changed the outcome."]], "answer": 1}, {"id": "bell", "kind": "choice", "title": "A theorem has assumptions", "time": "After \u00b7 26:47\u201327:51; 34:40\u201337:50", "q": "What do Bell tests rule out?", "defs": "Bell inequalities constrain local hidden-variable models under their specified assumptions. Experiments violate those inequalities. They do not rule out every conceivable hidden-variable model.", "tries": ["Pick the claim that keeps the scope."], "take": "Hamming\u2019s broad remarks need this qualification. Bell violations constrain a defined class of models; they do not provide faster-than-light messaging.", "options": [["Every hidden-variable theory is impossible", "Assumes locality is irrelevant to the result.", "Too broad: nonlocal hidden-variable theories are outside that excluded class."], ["One can transmit a chosen message instantly", "Assumes correlation gives control of remote outcomes.", "No: correlated results do not supply that control."], ["The tested correlations defeat local hidden-variable models", "Assumes the Bell-test conditions apply.", "Supported, with the assumptions stated."]], "answer": 2}, {"id": "research", "kind": "choice", "title": "Prediction is a result; mechanism is another", "time": "After \u00b7 22:11\u201326:15", "q": "What is a useful next step when a model predicts well?", "defs": "An AI model predicts a new task accurately, but its internal explanation is unclear. Hamming permits useful prediction before satisfying understanding.", "tries": ["Choose an experiment that adds evidence about mechanism."], "take": "A useful prediction can stand while its explanation remains open. The next experiment should separate explanations that currently fit.", "options": [["Design an intervention where candidate mechanisms differ", "Assumes the explanations make distinct testable predictions.", "Useful: hold ordinary task accuracy fixed and test the predicted response to a targeted intervention."], ["Declare the most intuitive story proven", "Assumes familiarity is evidence for mechanism.", "A plausible story can share the same observed predictions with alternatives."], ["Discard all predictive results until intuition feels satisfied", "Assumes only fully understood models are useful.", "That would lose the value Hamming is arguing for."]], "answer": 0}];
let page=0,revealed=0,picked=-1,guess=-1;const values={phase:0,gain:1,shift:0};const $=id=>document.getElementById(id);const math=()=>{if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});};
function setPage(i){page=Math.max(0,Math.min(slides.length-1,i));revealed=0;picked=-1;guess=-1;render()}
function render(){let s=slides[page];$('title').textContent=s.title;$('tag').textContent=s.time;$('question').textContent=s.q;$('defs').innerHTML=s.defs||'';$('formula').innerHTML=s.formula||'';$('tries').innerHTML=s.tries.map(t=>'<li>'+t+'</li>').join('');$('take').textContent=s.take;$('take').style.visibility=(s.kind==='choice'&&picked<0)||(s.kind==='proof'&&revealed<s.rows.length)?'hidden':'visible';$('pages').textContent=`${page+1} / ${slides.length}`;$('prev').disabled=page===0;$('next').disabled=page===slides.length-1;let lab=$('lab');if(s.kind==='intro'){lab.innerHTML='<div class="intro">'+s.cards.map(c=>'<div data-item="case" data-title="'+c[0]+'">'+c[0]+'<small>'+c[1]+'</small></div>').join('')+'</div>';}else if(s.kind==='choice'){lab.innerHTML='<div class="choices">'+s.options.map((o,i)=>`<button class="choice" data-item="choice" data-id="${s.id}-${i}">${o[0]}${picked<0?'<small>'+o[1]+'</small>':''}${picked>=0?'<div class="verdict">'+(i===s.answer?'Supported: ':'')+o[2]+'</div>':''}</button>`).join('')+'</div><button id="answer">Show answer</button>';lab.querySelectorAll('.choice').forEach((b,i)=>b.onclick=()=>{picked=i;render()});$('answer').onclick=()=>{picked=s.answer;render()};}else if(s.kind==='proof'){let choices=revealed<s.rows.length?[s.rows[revealed][1],'Square each term before adding','Infer the hidden mechanism from the fit']:[];lab.innerHTML='<div class="proof">'+s.rows.slice(0,revealed).map(r=>'<div class="proof-row">$'+r[0]+'$<small>'+r[1]+'</small></div>').join('')+(revealed===0?'<p>Guess the next move. Each reveal adds one equation and its reason.</p>':'')+'</div>'+(choices.length?'<div class="guess">What move would you try next?<div>'+choices.map((c,i)=>`<button class="move" data-item="proof-guess" data-id="${i}">${c}</button>`).join('')+'</div><div id="feedback">'+(guess<0?'Choose a move, or reveal to check.':guess===0?'That move keeps the model and advances the argument.':'Check whether that move follows from the current assumptions.')+'</div></div>':'')+'<button id="reveal">'+(revealed<s.rows.length?'Reveal next move':'Proof complete')+'</button>';$('reveal').disabled=revealed>=s.rows.length;$('reveal').onclick=()=>{revealed++;guess=-1;render()};lab.querySelectorAll('.move').forEach((b,i)=>b.onclick=()=>{guess=i;render()});}else{lab.innerHTML='<div class="chart" id="chart"></div><div class="legend" id="legend"></div><div class="readout" id="readout"></div><div class="controls" id="controls"></div>';draw()}math()}
const col=x=>FluidTheme.color(x);const line=(x,y,X,Y,c,dash='')=>`<line x1="${x}" y1="${y}" x2="${X}" y2="${Y}" stroke="${col(c)}" stroke-width="3" ${dash?'stroke-dasharray="'+dash+'"':''}/>`;const label=(x,y,t,c='text-2',anchor='start')=>`<text x="${x}" y="${y}" fill="${col(c)}" text-anchor="${anchor}" font-size="18">${t}</text>`;
function slider(key,min,max,step,text){$('controls').innerHTML=`<label>${text}<input aria-label="${text}" type="range" min="${min}" max="${max}" step="${step}" value="${values[key]}"></label><output>${values[key]}</output>`;$('controls').querySelector('input').oninput=e=>{values[key]=+e.target.value;draw();math()};}
function plot(series,xmax,ymax,xname,yname,markers=[],xmin=0){let W=680,H=320,L=60,R=25,T=35,B=45,px=x=>L+(x-xmin)/(xmax-xmin)*(W-L-R),py=y=>H-B-y/ymax*(H-T-B),v='<svg viewBox="0 0 680 320" role="img" aria-label="'+yname+' by '+xname+'">';for(let k=0;k<=4;k++){let y=ymax*k/4;v+=line(L,py(y),W-R,py(y),'line')+label(L-8,py(y)+5,y.toFixed(1),'muted','end');let x=xmin+(xmax-xmin)*k/4;v+=label(px(x),H-18,x.toFixed(0),'muted','middle')}series.forEach(s=>{v+=`<polyline points="${s.p.map(p=>px(p[0])+','+py(p[1])).join(' ')}" fill="none" stroke="${col(s.c)}" stroke-width="3"/>`});markers.forEach(m=>v+=line(px(m),T,px(m),H-B,'guide','6 5'));v+=label(L,20,yname)+label(W-R,H-1,xname,'text-2','end')+'</svg>';$('chart').innerHTML=v;$('legend').innerHTML=series.map(s=>`<span style="--c:var(--pal-${s.c})">${s.label}</span>`).join('')+(markers.length?'<span style="--c:var(--pal-guide)">dashed: path arrival times</span>':'')}

function arrow(x,y,X,Y,c,dash=''){let a=Math.atan2(Y-y,X-x),r=10;return line(x,y,X,Y,c,dash)+`<polygon points="${X},${Y} ${X-r*Math.cos(a-.4)},${Y-r*Math.sin(a-.4)} ${X-r*Math.cos(a+.4)},${Y-r*Math.sin(a+.4)}" fill="${col(c)}"/>`}
function draw(){let s=slides[page],v='<svg viewBox="0 0 680 340" role="img" aria-label="'+s.title+'">';
if(s.kind==='phase'){let a=values.phase*Math.PI/180,ox=245,oy=185,scale=230,bx=Math.cos(a)*scale/2,by=-Math.sin(a)*scale/2;v+=line(60,oy,600,oy,'guide','5 5')+line(ox,35,ox,315,'guide','5 5');v+=arrow(ox,oy,ox+115,oy,'accent')+arrow(ox+115,oy,ox+115+bx,oy+by,'orange')+((115+bx)**2+by**2>1?arrow(ox,oy,ox+115+bx,oy+by,'ink','7 4'):'');v+=label(50,35,'arrows: amplitude contributions')+label(50,325,'horizontal: real component; vertical: imaginary component');v+=`<circle cx="${ox+115+bx}" cy="${oy+by}" r="7" fill="${col('ink')}"/>`;$('legend').innerHTML='<span style="--c:var(--pal-accent)">first contribution</span><span style="--c:var(--pal-orange)">second contribution</span><span style="--c:var(--pal-ink)">dashed: combined arrow</span>';let p=(1+Math.cos(a))/2;$('readout').innerHTML=s.id==='arrows'?`Chosen output probability: ${p.toFixed(3)}. Other output: ${(1-p).toFixed(3)}.`:`Chosen output: $P=${p.toFixed(3)}$. Other output: $1-P=${(1-p).toFixed(3)}$.`;slider('phase',0,180,1,'Relative phase (degrees)')}
if(s.kind==='inverse'){let g=values.gain;v+=line(50,170,140,170,'ink')+line(140,170,210,85,'accent')+line(140,170,210,255,'orange')+line(450,85,520,170,'accent')+line(450,255,520,170,'orange')+line(520,170,640,170,'ink');v+=`<rect x="210" y="40" width="240" height="90" rx="10" fill="${col('accent-soft')}" stroke="${col('accent')}"/><rect x="210" y="210" width="240" height="90" rx="10" fill="${col('soft')}" stroke="${col('orange')}"/>`;v+=label(228,91,'first gain: '+g.toFixed(1))+label(228,264,'second gain: '+(3-g).toFixed(1))+label(25,150,'input')+label(550,150,'add → output');$('legend').innerHTML='<span style="--c:var(--pal-accent)">first hidden branch</span><span style="--c:var(--pal-orange)">second hidden branch</span>';$('readout').innerHTML=`Input 2 gives output 6. Input 5 gives output 15. Total gain stays 3.`;slider('gain',0,3,.1,'First branch gain')}
if(s.kind==='domain'){let n=values.shift;v+=label(25,30,'expected successes per 100 tasks');for(let k=0;k<=100;k+=20)v+=line(100,290-k*2,640,290-k*2,'grid')+label(85,297-k*2,k,'muted','end');v+=`<rect x="170" y="130" width="150" height="160" fill="${col('grey-bar')}"/><rect x="430" y="${130+n*2}" width="150" height="${160-n*2}" fill="${col('accent')}"/>`;v+=label(245,320,'old rule','text-2','middle')+label(505,320,'new regime','text-2','middle');$('legend').innerHTML='<span style="--c:var(--pal-grey-bar)">fixed old prediction</span><span style="--c:var(--pal-accent)">toy true expectation</span>';$('readout').textContent=`Old prediction: 80. New regime expectation: ${80-n}. Prediction gap: ${n}.`;slider('shift',0,60,1,'Environment change')}
$('chart').innerHTML=v+'</svg>';math()}
$('prev').onclick=()=>setPage(page-1);$('next').onclick=()=>setPage(page+1);window.addEventListener('fluid-themechange',()=>{if($('chart'))draw()});window.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')setPage(page+1);if(e.key==='ArrowLeft')setPage(page-1)});render();window.addEventListener('load',math);
</script></body></html>

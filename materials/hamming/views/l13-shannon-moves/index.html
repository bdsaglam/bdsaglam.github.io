<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>You be Shannon: how the problem was modeled</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../../components/theme.js"></script>
<style>
/* Same look as l13-channel-steps: white page, blue accent, red only for a flipped bit. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft);
  --red:var(--pal-red); --redbg:var(--pal-red-bg);
  --u:clamp(16px,1.35vw,20px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-panel);display:flex;flex-direction:column;overflow:hidden}
header{padding:10px 28px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(6px,1.2vh,14px) 28px}
footer{display:flex;align-items:center;gap:10px;padding:8px 28px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Slide frame: the problem, cards and reveal on the left (about 3/5); question, try-steps, AI echo on the right (2/5). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:clamp(20px,2.6vw,40px)}
.widget{min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(8px,1.6vh,14px)}
.tag{font:15px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(22px,2.2vw,30px);line-height:1.2;margin:0;font-weight:650}
.q{margin:0;font-size:17px;font-weight:600;line-height:1.35}
.kicker{font-size:14px;color:var(--muted);margin:0 0 4px}
.blk{display:flex;flex-direction:column;gap:4px}
.ai{margin:0;font-size:16px;line-height:1.4}
.takeaway{margin:0;padding:12px 14px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px;line-height:1.4}
.tries{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:16px;line-height:1.4}
.tries li::marker{color:var(--accent);font-weight:600}

/* The problem box, with the concrete instance when there is one */
.prob{flex:0 0 auto;border:1px solid var(--line);border-radius:10px;padding:6px 14px;background:var(--pal-soft-hover);font-size:16px;line-height:1.4}
.prob .lead{font-weight:650;color:var(--muted)}
.prob p{margin:0}
.bits{margin-top:6px;display:flex;flex-direction:column;gap:2px}
.bitrow{display:flex;align-items:center;gap:10px;font:16px ui-monospace,Menlo,monospace}
.bitrow .lab{flex:0 0 74px;font:15px system-ui,sans-serif;color:var(--muted)}
.bit{display:inline-block;width:1.1em;text-align:center}
.bit.hit{color:var(--red);font-weight:700;background:var(--redbg);border-radius:3px}

/* The three cards: sized by their content, so no card holds a blank band */
.opts{flex:0 0 auto;display:flex;flex-direction:column;gap:clamp(4px,0.5vw,8px)}
.opt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 14px;padding:clamp(6px,0.75vw,11px) 12px;border:1px solid var(--line);border-radius:10px;background:var(--pal-panel);color:inherit;text-align:left;cursor:pointer;min-width:0;font:inherit}
.opt .lhs{display:flex;flex-direction:column;gap:3px;min-width:0}
.opt .rhs{display:flex;flex-direction:column;gap:3px;min-width:0;border-left:1px solid var(--pal-soft-2);padding-left:14px}
.opt:not([aria-disabled="true"]):hover{border-color:var(--accent)}
.opt[aria-disabled="true"]{cursor:default}
.opt .top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:16px}
.opt .letter{font-weight:700;color:var(--accent)}
.opt .who{font-size:14px;color:var(--muted);text-align:right}
.opt .body{font-size:clamp(17px,1.5vw,20px);line-height:1.3}
.opt .asm{margin:0;font-size:clamp(16px,1.4vw,19px);line-height:1.35;color:var(--muted)}
.opt .verdict{font-size:clamp(16px,1.4vw,19px);line-height:1.35;color:var(--fg)}
.opt .verdict.idle{color:var(--muted);font-style:italic}
.opt.on{box-shadow:inset 0 0 0 2px var(--pal-ink)}
.opt.shannon{background:var(--chip);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.opt.shannon .who{color:var(--pal-accent-deep);font-weight:600}

/* The reveal fills what is left. Before a pick it holds the show-answer button, centred. */
.reveal{flex:1 1 auto;min-height:0;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:clamp(16px,1.3vw,18px);display:flex;flex-direction:column;justify-content:center;gap:6px}
.reveal .rv.hold{color:var(--muted)}
.reveal.idle{background:var(--pal-soft-hover);color:var(--muted)}
.rv{margin:0;line-height:1.4}
.rv .k{font-weight:650;color:var(--accent)}
.rv .t{color:var(--muted);font-size:14px;white-space:nowrap}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.btn{font:inherit;padding:7px 16px;border:1px solid var(--line);background:var(--pal-panel);border-radius:8px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--pal-on-accent)}
.btn:disabled{opacity:.4;cursor:default}
.idle-txt{margin:0}
/* Short windows: tighter chrome and gaps, same type sizes */
@media (max-height:660px){
  header{padding-top:6px}
  #stage{padding:4px 28px}
  footer{padding:5px 28px}
  .reveal{gap:3px}
  .rv{line-height:1.3}
  .opts{gap:3px}
  .opt{padding:5px 12px}
  .widget{gap:5px}
}
</style>
</head>
<body>
<header>You be Shannon: how the problem was modeled. Hamming 1995, Lecture 13 (information theory).</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script>
// ---------- helpers ----------
const $ = s => document.querySelector(s);
// $...$ and $$...$$ render with KaTeX. If the CDN did not load, the text stays as typed.
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false } ], throwOnError: false };
function tex(node) {
  if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH);
  return node;
}
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function hh(tag, cls, ...kids) {
  const e = h(tag, cls);
  for (const k of kids) if (k) e.append(k);
  return e;
}
function mark(e, kind, id, title) {
  e.dataset.item = kind;
  if (id != null) e.dataset.id = id;
  if (title != null) e.dataset.title = title;
  return e;
}
// Session events. With no bridge, nothing is sent and the view still works.
function emit(kind, data) {
  try {
    if (window.fluid && typeof window.fluid.emit === 'function') Promise.resolve(window.fluid.emit(kind, data)).catch(() => {});
  } catch (e) { /* no bridge */ }
}

// ---------- the eight moves, in the order of the lecture's video ----------
// options: three ways to model the problem, each with what it assumes and a verdict.
// shannon: the index of Shannon's card. reveal: three lines, each with the lecture time where Hamming says it.
const TRIES = ['Read the problem.', 'Pick the model you would use.', 'Read every verdict, not only yours.'];
const SLIDES = [
  { id: 'leave-meaning-out', tag: 'Lecture 00:33', title: 'How much does a message tell you?',
    question: 'Which number should measure what a message tells the receiver, when messages can mean many things?',
    problem: 'A wire carries one message from a known set of possible messages. The receiver learns something from it. Which number should say how much?',
    shannon: 1,
    options: [
      { text: 'Measure the meaning: how useful the message is to the reader.', assumes: 'Assumes a message has one fixed value for everyone.', verdict: 'Real, but it depends on the reader. A wire cannot count it.' },
      { text: 'Measure the surprise: score each message by how unlikely it was.', assumes: 'Assumes you know the chance of each message.', verdict: 'Uses only the chances, so any known source can be scored.' },
      { text: 'Count the symbols: every message scores 1, whatever its chance.', assumes: 'Assumes every message is worth the same.', verdict: 'Simple, but a rare message and a common one score the same.' }
    ],
    reveal: [
      { k: 'Shannon\'s move', v: String.raw`Leave meaning out. Score a message by $\log_2(1/p)$, where $p$ is its chance.`, t: '01:06' },
      { k: 'What it bought', v: 'One number per message, and a total for any source with known chances.', t: '01:06' },
      { k: 'What it cost', v: 'The score ignores meaning. Hamming says it does not fit people.', t: '38:36' }
    ],
    ai: 'Next-token cross-entropy in a language model scores how surprised the model was by the true next token. It does not score whether the text is true or useful.',
    takeaway: 'When you need one number for a message, score its surprise under a known model, and set its meaning aside.' },

  { id: 'properties-pick-formula', tag: 'Lecture 02:10', title: 'Which formula is a surprise?',
    question: 'Which formula makes the surprises of two independent events add up?',
    problem: String.raw`A die and a coin are thrown. Their results do not depend on each other. The surprise of the pair should equal the sum of the two surprises. Which formula of the chance $p$ does that?`,
    shannon: 2,
    options: [
      { text: String.raw`$1-p$: a sure event scores 0, a rare one near 1.`, assumes: 'Assumes surprise is a straight line in the chance.', verdict: 'Fails: coin and die add to 1.33, but the pair scores 0.92.' },
      { text: String.raw`$-p\log_2 p$: the term each symbol adds to entropy.`, assumes: 'Assumes the score is weighted by the chance itself.', verdict: 'Fails: coin and die add to 0.93, but the pair scores 0.30.' },
      { text: String.raw`$\log_2(1/p)$: a fair coin scores 1 bit, a fair die 2.59 bits.`, assumes: 'Assumes surprises of independent events add.', verdict: 'Adds up: 1 + 2.59 bits equals the pair score, 3.59 bits.' }
    ],
    reveal: [
      { k: 'Shannon\'s move', v: String.raw`Write the rule first: surprises of independent events add. Then let the rule pick the formula, $\log_2(1/p)$.`, t: '02:43' },
      { k: 'What it bought', v: 'The rules leave only the logarithm, up to the choice of unit.', t: '04:20' },
      { k: 'What it cost', v: 'Continuity is an assumption, not a theorem.', t: '03:18' }
    ],
    ai: 'Shapley values (Shapley, 1953) follow from four stated axioms, and only one rule meets all four. The axioms fix the formula.',
    takeaway: 'When you need a formula, write the properties it must have first. Let them pick the formula, then check each choice you made.' },

  { id: 'simplest-channel', tag: 'Lecture 11:37', title: 'Which noisy channel to study?',
    question: 'What is the simplest noisy channel that still keeps the hard part?',
    problem: 'Bits cross a wire, and some flip. Real noise depends on many things. Which channel model would you study first?',
    bits: { sent: '01101', recv: '00101' },
    shannon: 0,
    options: [
      { text: String.raw`Each bit flips with one chance $Q$, the same for a 0 and a 1.`, assumes: 'Assumes one flip chance fits every bit.', verdict: String.raw`One parameter. Symmetry makes $Q < \tfrac12$ free.` },
      { text: 'Measure a real wire and use its table of flip chances.', assumes: 'Assumes the wire stays the same over time.', verdict: 'Accurate for that wire only. Results do not carry over.' },
      { text: 'Add Gaussian noise to the voltage on each bit.', assumes: 'Assumes the noise is smooth and continuous.', verdict: 'Realistic for radio, but its continuous output is harder math.' }
    ],
    reveal: [
      { k: 'Shannon\'s move', v: String.raw`One flip chance $Q$ for both symbols. It keeps the hard part and drops the rest.`, t: '12:08' },
      { k: 'What it bought', v: String.raw`One parameter. If $Q > \tfrac12$, flip every bit, so $Q < \tfrac12$ is free.`, t: '27:39' },
      { k: 'What it cost', v: 'Real wires are not this symmetric. Hamming calls it a cut-down version.', t: '11:37' }
    ],
    ai: 'Learning from flipped labels (Natarajan et al., NIPS 2013) studies a simple flip rate per class. The noise is simple enough to analyse, and it keeps the hard part.',
    takeaway: 'When a system is too messy to study, find the simplest model that keeps the hard part. Use one parameter if you can.' },

  { id: 'limit-before-method', tag: 'Lecture 14:14', title: 'How good can a code be?',
    question: 'What is the best rate any code could reach, and how close can a real code get?',
    problem: String.raw`A noisy wire has flip chance $Q$. You want the most bits per bit sent, with almost no errors. No best code is known. What should the goal be?`,
    shannon: 1,
    options: [
      { text: 'Build the best code you can, and report its rate.', assumes: 'Assumes building is the way to find the limit.', verdict: 'Honest, but you never know if a better code exists.' },
      { text: String.raw`Define the best rate any code could reach, $C = 1-H(Q)$. Measure codes against it.`, assumes: 'Assumes one limit exists before any code does.', verdict: String.raw`A fixed target: codes are judged against $C$.` },
      { text: 'Lower the rate until the errors vanish, then stop.', assumes: 'Assumes a low rate is the goal.', verdict: 'Easy at a low rate, but says nothing about the top rate.' }
    ],
    reveal: [
      { k: 'Shannon\'s move', v: 'Separate the limit from the method. Define capacity as the best any code could do.', t: '15:17' },
      { k: 'What it bought', v: String.raw`A target no single code defines. Rates below $C$ can have tiny error.`, t: '15:49' },
      { k: 'What it cost', v: 'Codes that come close to $C$ are long, so they are slow to build and use.', t: '33:23' }
    ],
    ai: String.raw`Chinchilla's loss law (Hoffmann et al., 2022) has an irreducible term $E$. No model goes below it, and a method closes only the gap above $E$.`,
    takeaway: 'To judge a method, first find the best any method could do. Then measure the gap to that limit, and report the gap.' },

  { id: 'turn-into-geometry', tag: 'Lecture 16:27', title: 'Where are the wrong words?',
    question: 'How do you see which code words could be confused after noise?',
    problem: String.raw`Each block of $n$ bits is a corner of an $n$-dimensional cube. Noise moves the sent corner to another corner. Which picture keeps the code words apart?`,
    shannon: 2,
    options: [
      { text: 'A table of all words, compared one by one.', assumes: 'Assumes you can store and search every word.', verdict: String.raw`Exact, but $2^n$ rows and no structure.` },
      { text: 'Sort the words by value, and keep neighbors apart.', assumes: 'Assumes close values mean close words.', verdict: 'A bit flip can jump far in value, so order says little.' },
      { text: String.raw`Points in $n$-space. Noise is a sphere; spheres must not overlap.`, assumes: 'Assumes noise has a size you can draw as a ball.', verdict: 'Each sphere counts the words it can hide. Packing gives the rate.' }
    ],
    reveal: [
      { k: 'Shannon\'s move', v: String.raw`Words are points of the $n$-cube. Noise is a sphere of radius $nQ$ around each point. Coding is packing spheres.`, t: '16:27' },
      { k: 'What it bought', v: String.raw`Counting replaces guessing: a sphere's word count $V$ says how many fit.`, t: '28:40' },
      { k: 'What it cost', v: 'Exact packing is very hard. Shannon only needs spheres that rarely overlap.', t: '31:15' }
    ],
    ai: 'Nearest-neighbor search over embeddings uses the same picture: a query finds the closest point. Support vector machines (Cortes and Vapnik, 1995) keep a margin, a free band around the decision boundary.',
    takeaway: 'When items must stay apart under noise, draw them as points. Give each point a ball the size of the noise, and count how many fit.' },

  { id: 'bigger-is-easier', tag: 'Lecture 13:12', title: 'How many errors in one block?',
    question: 'How can a random error count become predictable?',
    problem: String.raw`You send a block of $n$ bits, and each bit flips with chance $Q$. The number of errors $k$ in one block is random. How do you control it?`,
    shannon: 1,
    options: [
      { text: 'Keep blocks short, so the chance sums stay easy to work out.', assumes: 'Assumes short blocks have a steady error count.', verdict: 'Easy sums, but a short block\'s error count varies too much.' },
      { text: String.raw`Make the block long. The error count then sits near $nQ$.`, assumes: 'Assumes many bits add up to a steady count.', verdict: String.raw`Chance becomes counting: the error fraction $k/n$ settles near $Q$.` },
      { text: 'Simulate a few blocks, and keep the design that passes them.', assumes: 'Assumes a few samples show the whole picture.', verdict: 'Shows typical blocks, but says nothing about the rare bad one.' }
    ],
    reveal: [
      { k: 'Shannon\'s move', v: String.raw`Make the block so long that the error count concentrates near $nQ$.`, t: '17:32' },
      { k: 'What it bought', v: String.raw`Each block has close to $nQ$ errors. You plan for that count, not for each random bit.`, t: '18:34' },
      { k: 'What it cost', v: 'Long blocks mean long waits: a message must be long before it is encoded.', t: '33:23' }
    ],
    ai: 'Infinite-width theory of neural networks (Jacot et al., 2018) works for a similar reason: a sum over many random units settles near its mean.',
    takeaway: String.raw`When a random count is the problem, make the system bigger. The count settles near its mean, and its spread grows only like $\sqrt{n}$.` },

  { id: 'bound-dont-compute', tag: 'Lecture 22:17', title: 'Is any wrong word inside?',
    question: 'How do you bound a chance that you cannot compute exactly?',
    problem: String.raw`The received word has a sphere around it. There are $M-1$ wrong code words. Each lands inside the sphere with a small chance $d$. What is the chance that one of them lands inside?`,
    shannon: 0,
    options: [
      { text: String.raw`Add the chances: $(M-1)\,d$ is an upper bound.`, assumes: 'Assumes you can bound each wrong word on its own.', verdict: 'Loose: overlaps count twice. No independence needed.' },
      { text: 'Work out the exact chance, counting every overlap.', assumes: 'Assumes every overlap is known in full.', verdict: 'Exact, but there are too many overlaps to count.' },
      { text: 'Take one typical wrong word, and assume the others act the same.', assumes: 'Assumes all wrong words behave like one.', verdict: 'Looks fair, but it misses two words inside.' }
    ],
    reveal: [
      { k: 'Shannon\'s move', v: 'Add the chance for each wrong word. The sum bounds the chance that any one is inside: the union bound.', t: '25:33' },
      { k: 'What it bought', v: String.raw`You need only the chance $d$ for one word. The total must go to zero.`, t: '25:33' },
      { k: 'What it cost', v: 'The bound is loose: when two words are inside, it counts both.', t: '26:05' }
    ],
    ai: 'PAC bounds for a finite set of models (Valiant, 1984, for the framework) use the union bound: add the chance that each bad model looks good.',
    takeaway: 'When a chance is too hard to compute, add the small chances of its causes. The sum is a bound, and a bound is enough if it goes to zero.' },

  { id: 'average-over-choices', tag: 'Lecture 23:55', title: 'Which code book to use?',
    question: 'How can you show that a good code book exists, when you cannot build one?',
    problem: String.raw`You need one code book of $2^k$ words, each $n$ bits long, that works under noise. Building the best book by hand is out of reach. Random books vary from good to bad. How do you pick one?`,
    shannon: 2,
    options: [
      { text: 'Search: try random books, keep the best, and try again.', assumes: 'Assumes random tries will find a good book.', verdict: 'Works in practice, but gives no proof that the best one is good.' },
      { text: 'Design a structured code by algebra, such as a regular code.', assumes: 'Assumes a clever design beats chance.', verdict: 'Easy to decode, but it does not reach capacity.' },
      { text: 'Pick books at random. Show the average book is good.', assumes: 'Assumes a random book is good on average.', verdict: 'Shows a good book exists, but not which one to use.' }
    ],
    reveal: [
      { k: 'Shannon\'s move', v: 'Average over all choices. If the average is good, some single choice is good too.', t: '31:48' },
      { k: 'What it bought', v: 'A proof that a good code exists, with no need to build it.', t: '31:48' },
      { k: 'What it cost', v: 'The book is huge, and random books cannot be decoded fast.', t: '32:19' }
    ],
    ai: 'The probabilistic method (Erdős, 1947) shows that a random object has a wanted property with positive chance, so such an object exists.',
    takeaway: 'When a good object is hard to design, average over random ones. If the average passes, one of them passes too. Then ask how to find it.' }
];

// ---------- state: each step keeps its pick, so Prev and Next restore it ----------
const state = SLIDES.map(() => ({ pick: null, shown: false }));
let cur = 0, shownId = null;
const isOpen = i => state[i].pick !== null || state[i].shown;

// The bits of a sent and a received row. A bit that differs is red: the wire flipped it.
function bitRows(b) {
  const wrap = h('div', 'bits');
  for (const [lab, row] of [['sent', b.sent], ['received', b.recv]]) {
    const line = h('div', 'bitrow');
    line.append(h('span', 'lab', lab));
    for (let i = 0; i < row.length; i++) {
      const flipped = lab === 'received' && row[i] !== b.sent[i];
      line.append(h('span', 'bit' + (flipped ? ' hit' : ''), row[i]));
    }
    wrap.append(line);
  }
  return wrap;
}

function whoLabel(s, st, k, L) {
  const parts = [];
  if (st.pick === L) parts.push('Your pick');
  if (k === s.shannon) parts.push('Shannon');
  return parts.join(', ');
}

function pick(L) {
  const i = cur, s = SLIDES[i];
  if (isOpen(i)) return;
  const k = 'ABC'.indexOf(L);
  state[i].pick = L;
  emit('view.action', { action: 'pick', step: s.id, option: L, correct: k === s.shannon });
  draw();
}

function showAnswer() {
  const i = cur, s = SLIDES[i];
  if (isOpen(i)) return;
  state[i].shown = true;
  emit('view.action', { action: 'show', step: s.id });
  draw();
}

// Build the current step from its data and state. Does not emit view.step (goTo does).
function draw() {
  const i = cur, s = SLIDES[i], st = state[i], open = isOpen(i);
  const sec = mark(h('section', 'slide'), 'step', s.id, s.title);

  // Left column: the problem, three cards, the reveal.
  const widget = h('div', 'widget');
  const prob = mark(h('div', 'prob'), 'problem', s.id);
  const lead = h('span', 'lead', s.bits ? 'The problem (red bit: the wire flipped it).' : 'The problem.');
  prob.append(hh('p', '', lead, document.createTextNode(' '), setTex(h('span'), s.problem)));
  if (s.bits) prob.append(bitRows(s.bits));

  const opts = h('div', 'opts');
  s.options.forEach((o, k) => {
    const L = 'ABC'[k];
    const card = mark(h('div', 'opt'), 'option', L, o.text);
    card.setAttribute('role', 'button');
    card.setAttribute('aria-disabled', open ? 'true' : 'false');
    card.tabIndex = open ? -1 : 0;
    card.classList.toggle('on', st.pick === L);
    card.classList.toggle('shannon', open && k === s.shannon);
    const who = open ? whoLabel(s, st, k, L) : '';
    const top = hh('div', 'top', setTex(h('span', 'letter'), L), h('span', 'who', who));
    const body = setTex(h('div', 'body'), o.text);
    const asm = setTex(h('p', 'asm'), o.assumes);
    const verdict = open
      ? setTex(h('div', 'verdict'), o.verdict)
      : h('div', 'verdict idle', 'Verdict after your pick.');
    card.append(hh('div', 'lhs', top, body), hh('div', 'rhs', asm, verdict));
    card.addEventListener('click', () => { if (!isOpen(cur)) pick(L); });
    opts.append(card);
  });

  const rev = mark(h('div', 'reveal'), 'reveal', s.id);
  if (!open) {
    rev.classList.add('idle');
    const btn = mark(h('button', 'btn primary', 'Show answer'), 'control', 'show-answer');
    btn.addEventListener('click', showAnswer);
    for (const r of s.reveal) {
      rev.append(hh('p', 'rv hold', h('span', 'k', r.k + '. '), h('span', '', 'Shown after your pick.')));
    }
    rev.append(hh('div', 'actions', btn));
  } else {
    for (const r of s.reveal) {
      const p = hh('p', 'rv', h('span', 'k', r.k + '. '));
      p.append(setTex(h('span'), r.v), h('span', 't', ' (' + r.t + ')'));
      rev.append(p);
    }
  }
  widget.append(prob, opts, rev);

  // Right column: tag, title, the question, the try-steps; after a pick, the AI echo and the takeaway.
  const side = h('div', 'side');
  side.append(h('div', 'tag', s.tag), setTex(h('h2'), s.title), setTex(h('p', 'q'), s.question));
  side.append(hh('div', 'blk', h('div', 'kicker', 'Try it'), hh('ol', 'tries', ...TRIES.map(t => h('li', '', t)))));
  if (open) {
    side.append(hh('div', 'blk', h('div', 'kicker', 'Same move in AI research'), setTex(h('p', 'ai'), s.ai)));
    side.append(setTex(h('p', 'takeaway'), s.takeaway));
  }

  sec.append(widget, side);
  $('#stage').replaceChildren(sec);
  $('#stage').scrollTop = 0;
  tex(sec);
}

function paintNav() {
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, i) => d.classList.toggle('on', i === cur));
}

function goTo(i) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  if (shownId !== null && shownId !== s.id) emit('view.step', { step: s.id });
  shownId = s.id;
  draw();
  paintNav();
}

// A cue is a state: go to the named step, and do nothing if it is already shown.
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i >= 0 && i !== cur) goTo(i);
}

(function init() {
  const dots = $('#dots');
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = s.title;
    b.addEventListener('click', () => goTo(i));
    dots.appendChild(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],textarea,select')) return;
    if (e.target && e.target.classList && e.target.classList.contains('opt') && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault(); e.target.click(); return;
    }
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
})();
</script>
</body>
</html>

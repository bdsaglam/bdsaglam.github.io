<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primer · Sampling and aliasing</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../../components/theme.js"></script>
<style>
/* Colors come from the theme palette (../../components/theme.js): one accent (blue), red only for a failed check. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft);
  --red:var(--pal-red); --redbg:var(--pal-red-bg);
  --u:clamp(16px,1.35vw,20px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 24px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(6px,1vh,12px) 24px}
footer{display:flex;align-items:center;gap:10px;padding:8px 24px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Slide frame: widget on the left (3/5), text on the right (2/5). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(18px,2.4vw,40px)}
.widget{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(6px,1vh,10px);overflow:hidden}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(6px,1.1vh,12px);overflow:hidden}
.tag{font:13px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(20px,1.9vw,28px);line-height:1.2;margin:0;font-weight:650}
.question{margin:0;font-size:clamp(16px,1.3vw,18px);font-weight:600}
.formula{font-size:clamp(18px,1.8vw,26px)}
.sym{margin:0;font-size:16px;color:var(--muted)}
.where{margin:0;font-size:16px}
.tries{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.tries li::marker{color:var(--accent);font-weight:600}
.takeaway{margin:0;padding:10px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}
.takeholder{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.takeholder .takeaway{align-self:stretch}

/* Controls, readouts, legend */
.sliders{display:flex;gap:8px 24px;flex-wrap:wrap;width:100%}
.slide-ctl{display:flex;align-items:center;gap:8px;font-size:16px}
.slide-ctl input{width:clamp(120px,11vw,170px);vertical-align:middle;accent-color:var(--accent)}
.slide-ctl .val{min-width:52px}
.unitrow{display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center;font-size:16px}
.unitrow input{width:84px}
.btn{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--pal-panel);border-radius:8px;cursor:pointer;font-size:16px}
.readouts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.readout{flex:1 1 150px;min-width:0;padding:4px 8px;border-radius:10px;background:var(--pal-soft);font-size:15px;overflow-wrap:anywhere}
.readout .k{color:var(--muted);font-size:14px}
.readout .val{font-size:16px;font-weight:600}
.readout.bad{background:var(--redbg);color:var(--red)}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:16px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:20px;height:0;vertical-align:middle;margin-right:6px}
.chip{display:inline-block;width:14px;height:14px;vertical-align:middle;margin-right:6px;border-radius:50%}
.ring{display:inline-block;width:14px;height:14px;vertical-align:middle;margin-right:6px;border-radius:50%;border:2px solid var(--pal-ink);box-sizing:border-box}
.vec{margin:0;font-size:16px;width:100%;overflow:hidden}

/* Plots fill the space left in the widget column */
.fill{flex:1 1 0;min-height:120px;position:relative;width:100%}
.fill>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.fill.band{flex:0 0 86px;height:86px;min-height:0}
.fill.strip{flex:0 0 112px;height:112px;min-height:0}
.name i{font-style:italic}

/* Proof slides: test and picture on the left, the proof (fl-proof-steps) on the right */
.slide.proof-slide{grid-template-columns:minmax(0,11fr) minmax(0,9fr)}
.slide.proof-slide .side{justify-content:flex-start}
.slide.proof-slide .fill{min-height:150px}
.slide.proof-slide .slide-ctl input{width:clamp(90px,8vw,130px)}
.slide.proof-slide .slide-ctl .val{min-width:40px}
.slide.proof-slide .sliders{gap:6px 18px}
.slide.proof-slide .legend{gap:2px 12px;font-size:15px}
.slide.proof-slide .readout{flex-basis:120px;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px}
.part{margin:0;font-weight:600;color:var(--muted)}
.test{display:flex;flex-direction:column;gap:3px}
.test .tries{gap:3px}
.model{margin:0;padding:8px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}
@media (max-height: 680px){
  header{padding-top:4px}
  #stage{padding:4px 24px}
  footer{padding:4px 24px}
  .widget{gap:5px}
  .side{gap:6px}
  .tries{gap:3px}
  .sym,.where,.tries{line-height:1.2}
  .takeaway{padding:6px 10px}
  .readout{padding:3px 8px}
  .fill{min-height:110px}
  .fill.band{flex:0 0 80px;height:80px}
  .fill.strip{flex:0 0 96px;height:96px}
  h2{font-size:20px}
  .formula{font-size:18px}
  .formula .katex-display{margin:.4em 0}
  .slide.proof-slide .fill{min-height:130px}
  .model{padding:5px 10px}
  .test .tries{gap:1px}
}
</style>
</head>
<body>
<header>Primer · Sampling and aliasing</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script src="../../components/proof-steps.js"></script>
<script>
// ---------- palette and redraw ----------
// Every plot on the current slide is in PLOTS. A theme switch repaints them; sliders, picks and proof state are DOM,
// so they stay as they are.
let PLOTS = [];
window.addEventListener('fluid-themechange', () => PLOTS.forEach(p => p.redraw()));

// ---------- DOM and drawing helpers ----------
let epoch = 0;
const $ = s => document.querySelector(s);
const NSV = 'http://www.w3.org/2000/svg', NHT = 'http://www.w3.org/1999/xhtml';
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false } ], throwOnError: false };
// Keep a formula and the punctuation right after it on one line.
function glue(root) {
  if (!root || !root.querySelectorAll) return;
  for (const k of root.querySelectorAll('.katex')) {
    // auto-render puts each formula in a bare span; the punctuation follows that span
    let el = k;
    const up = k.parentNode;
    if (up && up.tagName === 'SPAN' && !up.className && up.childNodes.length === 1) el = up;
    const nx = el.nextSibling;
    if (!nx || nx.nodeType !== 3 || !el.parentNode || el.parentNode.classList.contains('nobr')) continue;
    const m = nx.textContent.match(/^[.,;:!?)]+/);
    if (!m) continue;
    const w = document.createElement('span');
    w.className = 'nobr';
    w.style.whiteSpace = 'nowrap';
    el.parentNode.insertBefore(w, el);
    w.append(el, document.createTextNode(m[0]));
    nx.textContent = nx.textContent.slice(m[0].length);
  }
}
// The proof component renders through window.renderMathInElement; give it the same glue.
if (typeof window.renderMathInElement === 'function') {
  const renderOnly = window.renderMathInElement;
  window.renderMathInElement = (el, o) => { renderOnly(el, o); glue(el); };
}
// Render $...$ and $$...$$ in a node. If the CDN did not load, the text stays as typed.
function tex(node) {
  if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH);
  return node;
}
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function hh(tag, cls, ...kids) {
  const e = h(tag, cls);
  for (const k of kids) if (k) e.append(k);
  return e;
}
function mark(e, kind, id, title) {
  e.dataset.item = kind;
  if (id != null) e.dataset.id = id;
  if (title != null) e.dataset.title = title;
  return e;
}
function svgNode(tag, attrs, parent) {
  const e = document.createElementNS(NSV, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function svgRoot(w, ht) {
  return svgNode('svg', { viewBox: '0 0 ' + w + ' ' + ht, role: 'img', 'font-family': 'system-ui, sans-serif', 'font-size': 14 });
}
function svgText(parent, x, y, s, attrs) {
  const t = svgNode('text', Object.assign({ x: x, y: y, fill: FluidTheme.color('muted') }, attrs || {}), parent);
  t.textContent = s;
  return t;
}
// A KaTeX label over an SVG: a foreignObject holding a rendered formula.
function svgTex(parent, x, y, s, o) {
  o = o || {};
  const w = o.w || 220, ht = 26, anchor = o.anchor || 'middle';
  const x0 = anchor === 'end' ? x - w : anchor === 'start' ? x : x - w / 2;
  const fo = svgNode('foreignObject', { x: x0, y: y - ht / 2, width: w, height: ht }, parent);
  const d = document.createElementNS(NHT, 'div');
  const jc = anchor === 'end' ? 'flex-end' : anchor === 'start' ? 'flex-start' : 'center';
  d.setAttribute('style', 'display:flex;align-items:center;height:100%;white-space:nowrap;font-size:' +
    (o.size || 15) + 'px;color:' + (o.fill || FluidTheme.color('text-2')) + ';justify-content:' + jc);
  const span = document.createElementNS(NHT, 'span');
  span.textContent = s;
  if (o.bg) span.setAttribute('style', 'background:' + o.bg + ';border-radius:5px;padding:1px 5px');
  if (o.halo) { const hc = FluidTheme.color('bg'); span.setAttribute('style', 'text-shadow:0 0 3px ' + hc + ',0 0 3px ' + hc + ',0 0 2px ' + hc); }
  d.appendChild(span);
  fo.appendChild(d);
  tex(span);
  return fo;
}
// A labelled range input. o: {id, min, max, step, value, fmt(v) -> text, onInput(v)}.
function ctl(label, o) {
  const wrap = h('label', 'slide-ctl');
  const lab = setTex(h('span'), label);
  const inp = h('input');
  inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step; inp.value = o.value;
  mark(inp, 'control', o.id, o.id);
  const val = h('span', 'val');
  const show = v => setTex(val, o.fmt(v));
  inp.addEventListener('input', () => { show(+inp.value); o.onInput(+inp.value); });
  show(o.value);
  wrap.append(lab, inp, val);
  return { el: wrap, set(v) { inp.value = v; show(v); } };
}
// A number box, applied as it is typed.
function numBox(label, o) {
  const wrap = h('label', 'slide-ctl');
  const inp = h('input');
  inp.type = 'number'; inp.min = o.min; inp.step = o.step; inp.value = o.value;
  inp.style.width = '84px';
  mark(inp, 'control', o.id, o.id);
  inp.addEventListener('input', () => { const v = +inp.value; if (isFinite(v) && v > 0) o.onInput(v); });
  wrap.append(setTex(h('span'), label), inp);
  return { el: wrap, set(v) { inp.value = v; } };
}
// A readout box: label and value are LaTeX-ready text. set(text, bad) turns the box red when bad.
function readout(id, label) {
  const box = mark(h('div', 'readout'), 'readout', id);
  const k = h('div', 'k');
  setTex(k, label);
  const v = h('div', 'val');
  box.append(k, v);
  return { el: box, set(text, bad) { setTex(v, text); box.classList.toggle('bad', !!bad); } };
}
// Legend items: {color (a palette name), text, dash, chip, ring}. Each mark is named right beside its swatch.
function legend(items) {
  const d = h('div', 'legend');
  for (const it of items) {
    const s = h('span');
    const sw = h('span', it.chip ? 'chip' : it.ring ? 'ring' : 'sw');
    const c = 'var(--pal-' + it.color + ')';   // HTML swatch: follows the theme by itself
    if (it.chip) sw.style.background = c;
    else if (it.ring) sw.style.borderColor = c;
    else sw.style.borderTop = '2px ' + (it.dash ? 'dashed' : 'solid') + ' ' + c;
    const t = h('span');
    setTex(t, it.text);
    s.append(sw, t);
    d.appendChild(s);
  }
  return d;
}
function sym(text) { return setTex(h('p', 'sym'), text); }
function where(text) { return setTex(h('p', 'where'), text); }
function triesList(items) { return hh('ol', 'tries', ...items.map(t => setTex(h('li'), t))); }
function takeLine(text) { return setTex(h('p', 'takeaway'), text); }
// Session events. Optional: with no bridge, nothing is sent.
function emit(kind, data) {
  try {
    if (window.fluid && typeof window.fluid.emit === 'function') Promise.resolve(window.fluid.emit(kind, data)).catch(() => {});
  } catch (e) { /* the view works without the bridge */ }
}
// The takeaway appears after the first try: on the first input or click in the widget, or on "Show".
function takeBox(widget, text) {
  const holder = h('div', 'takeholder');
  const btn = mark(h('button', 'btn'), 'control', 'show-takeaway');
  setTex(btn, 'Show the takeaway');
  const tk = takeLine(text);
  tk.hidden = true;
  const show = () => { tk.hidden = false; btn.hidden = true; };
  btn.addEventListener('click', show);
  for (const ev of ['input', 'click', 'pointerdown']) widget.addEventListener(ev, show);
  holder.append(btn, tk);
  return holder;
}
// Fixed decimals, with no minus sign on zero.
function fx(x, d) { const y = Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x; return y.toFixed(d); }
function clean(o) { const r = {}; for (const k in o) if (o[k] !== null && o[k] !== undefined) r[k] = o[k]; return r; }
function line(svg, x1, y1, x2, y2, o) { return svgNode('line', clean(Object.assign({ x1, y1, x2, y2 }, o || {})), svg); }
function dot(svg, x, y, r, fill, o) { return svgNode('circle', clean(Object.assign({ cx: x, cy: y, r, fill }, o || {})), svg); }
// A plot that takes the height left in its parent. draw(svg, W, H) runs on every resize.
function plotBox(draw, cls) {
  const wrap = h('div', 'fill' + (cls ? ' ' + cls : ''));
  let key = '';
  const paint = force => {
    const w = Math.floor(wrap.clientWidth), ht = Math.floor(wrap.clientHeight);
    if (w < 60 || ht < 40) return;
    if (!force && key === w + 'x' + ht) return;
    key = w + 'x' + ht;
    const svg = svgRoot(w, ht);
    draw(svg, w, ht);
    wrap.replaceChildren(svg);
  };
  new ResizeObserver(() => paint(false)).observe(wrap);
  const plot = { wrap, redraw: () => paint(true) };
  PLOTS.push(plot);
  return plot;
}
// Shared colors: grey = the exact wave or value, blue = samples or rounded values, red = a failed check.
const ROLE = { input: 'slate-4', out: 'accent', grid: 'grey', ink: 'ink', rule: 'soft-2', level: 'guide' };   // palette names
const COL = {};
for (const k of Object.keys(ROLE)) Object.defineProperty(COL, k, { get: () => FluidTheme.color(ROLE[k]) });   // read at paint time
const PI = Math.PI;
// Axes for a plot with the origin at the lower left: returns the maps X(x) and Y(y).
function axes(svg, W, H, o) {
  const L = o.L || 44, R = 16, T = o.T || 12, B = o.B || 50;
  const X = x => L + (x - o.x0) / (o.x1 - o.x0) * (W - L - R);
  const Y = y => T + (o.y1 - y) / (o.y1 - o.y0) * (H - T - B);
  line(svg, L, Y(0), W - R, Y(0), { stroke: COL.rule });
  line(svg, L, T, L, H - B, { stroke: COL.grid });
  line(svg, L, H - B, W - R, H - B, { stroke: COL.grid });
  for (const v of o.yt) svgText(svg, L - 8, Y(v) + 5, String(v), { 'text-anchor': 'end', 'font-size': 14 });
  for (const t of o.xt) svgText(svg, X(t), H - B + 18, String(t), { 'text-anchor': 'middle', 'font-size': 14 });
  return { X, Y, L, R, T, B };
}
// A path through many points: f(x) sampled between x0 and x1.
function curve(svg, X, Y, x0, x1, f, o) {
  let d = '';
  for (let i = 0; i <= 400; i++) {
    const x = x0 + (x1 - x0) * i / 400;
    d += (i ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(f(x)).toFixed(1);
  }
  return svgNode('path', Object.assign({ d, fill: 'none' }, o), svg);
}
const HOURS = [1, 2, 3, 4, 6, 8, 12];
// ---------- slide 1: sampling ----------
// A day's temperature, and the straight-line guess between readings every d hours.
const TEMP = t => 18 + 5 * Math.sin(2 * PI * (t - 9) / 24);
function guessAt(d, t) {
  const t0 = Math.floor(t / d) * d, t1 = t0 + d;
  return t1 === t0 ? TEMP(t0) : TEMP(t0) + (TEMP(t1) - TEMP(t0)) * (t - t0) / d;
}
function biggestGap(d) {
  let m = 0;
  for (let i = 0; i <= 480; i++) { const t = 24 * i / 480; m = Math.max(m, Math.abs(guessAt(d, t) - TEMP(t))); }
  return m;
}
function slideSampling(widget, side) {
  const st = { i: 0 };
  const cD = ctl(String.raw`$\Delta$, hours between readings`, { id: 'delta', min: 0, max: HOURS.length - 1, step: 1, value: 0,
    fmt: v => String.raw`$\Delta = ${HOURS[v]}$ h`, onInput: v => { st.i = v; update(); } });
  const rN = readout('readings', String.raw`readings per day, $24/\Delta$`);
  const rG = readout('gap', String.raw`biggest gap, guess minus curve`);
  const vec = h('div', 'vec');
  function drawDay(svg, W, H) {
    const d = HOURS[st.i];
    const a = axes(svg, W, H, { x0: 0, x1: 24, y0: 10, y1: 26, yt: [10, 14, 18, 22, 26], xt: [0, 6, 12, 18, 24] });
    curve(svg, a.X, a.Y, 0, 24, TEMP, { stroke: COL.input, 'stroke-width': 3 });
    const pts = [];
    for (let t = 0; t <= 24 + 1e-9; t += d) pts.push([a.X(t), a.Y(TEMP(t % 24))]);
    svgNode('path', { d: pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' '),
      fill: 'none', stroke: COL.out, 'stroke-width': 2, 'stroke-dasharray': '6 4' }, svg);
    for (let k = 0; k < 24 / d; k++) dot(svg, a.X(k * d), a.Y(TEMP(k * d)), 5.5, COL.out, { 'data-item': 'mark', 'data-id': 'reading-' + k });
    svgTex(svg, (a.L + W - a.R) / 2, H - 8, String.raw`$t$, hour of the day`, { w: 260, size: 15 });
  }
  const plot = plotBox(drawDay);
  function update() {
    const d = HOURS[st.i];
    rN.set(String(24 / d));
    rG.set(fx(biggestGap(d), 2) + ' °C', false);
    const items = [];
    for (let k = 0; k < 24 / d && k < 8; k++) items.push(fx(TEMP(k * d), 2));
    if (24 / d > 8) items.push(String.raw`\dots`);
    setTex(vec, String.raw`$$u=\begin{bmatrix} ${items.join(' & ')} \end{bmatrix}$$`);
    plot.redraw();
  }
  widget.append(
    hh('div', 'sliders', cD.el),
    plot.wrap,
    hh('div', 'readouts', rN.el, rG.el),
    vec,
    legend([
      { color: ROLE.input, text: String.raw`grey line: the temperature $x(t)$, continuous` },
      { color: ROLE.out, dash: true, text: String.raw`dashed blue: straight lines between readings, a guess` },
      { color: ROLE.out, chip: true, text: String.raw`blue dots: the readings $u_n$` }]));
  side.append(
    sym(String.raw`$x(t)$: the signal, here a day's temperature. $\Delta$: hours between readings. $u_n$: the $n$-th reading, a stored number.`),
    nameLine(String.raw`<i>sample</i>: the same word as <i>example</i> (Old French <i>essample</i>): a few readings stand for the whole curve.`),
    where(String.raw`A thermometer read every hour gives 24 numbers a day. Hamming uses equal steps because that is what equipment builds (L14 11:37).`),
    triesList([
      String.raw`Start at $\Delta = 1$ h. The dashed guess sits on the curve.`,
      String.raw`Set $\Delta = 6$ h. How many readings a day? Where is the guess furthest off?`,
      String.raw`Set $\Delta = 12$ h. Read the biggest gap.`]),
    takeBox(widget, String.raw`Sampling keeps the readings. Between them the curve is unknown, and a longer step loses more.`));
  update();
}

// ---------- slide 2: frequency per sample ----------
function slideFrequency(widget, side) {
  const st = { f: 1 / 6 };
  let Hz = 10, rate = 60;
  const sample = n => Math.cos(2 * PI * st.f * n);
  let hzBox, rateBox;
  const cF = ctl(String.raw`$f$, rotations per sample`, { id: 'f', min: 0, max: 1, step: 0.005, value: st.f,
    fmt: v => v.toFixed(4), onInput: v => { st.f = v; Hz = v * rate; hzBox.set(fx(Hz, 2)); update(); } });
  function setF() { st.f = Hz / rate; cF.set(st.f); update(); }
  hzBox = numBox('signal Hz', { id: 'hz', min: 0.001, step: 1, value: Hz, onInput: v => { Hz = v; setF(); } });
  rateBox = numBox('samples per second', { id: 'rate', min: 0.001, step: 1, value: rate, onInput: v => { rate = v; setF(); } });
  const rF = readout('f', String.raw`$f$, rotations per sample`);
  const rP = readout('period', String.raw`$1/f$, samples per cycle`);
  const vecA = h('div', 'vec'), vecB = h('div', 'vec');
  function drawWave(svg, W, H) {
    const a = axes(svg, W, H, { x0: 0, x1: 15, y0: -1.2, y1: 1.2, yt: [-1, 0, 1], xt: [0, 5, 10, 15] });
    curve(svg, a.X, a.Y, 0, 15, t => Math.cos(2 * PI * st.f * t), { stroke: COL.input, 'stroke-width': 3 });
    for (let n = 0; n < 16; n++) dot(svg, a.X(n), a.Y(sample(n)), 5.5, COL.out, { 'data-item': 'mark', 'data-id': 'sample-' + n });
    svgTex(svg, (a.L + W - a.R) / 2, H - 10, String.raw`$n$, sample number (the grey curve is continuous)`, { w: 520, size: 15 });
  }
  const plot = plotBox(drawWave);
  function update() {
    rF.set(st.f.toFixed(4));
    rP.set(st.f > 0 ? fx(1 / st.f, 2) : String.raw`$\infty$`);
    const row = a => Array.from({ length: 8 }, (_, i) => fx(sample(a + i), 2)).join(' & ');
    setTex(vecA, String.raw`$$u_{0\ldots7}=\begin{bmatrix} ${row(0)} \end{bmatrix}$$`);
    setTex(vecB, String.raw`$$u_{8\ldots15}=\begin{bmatrix} ${row(8)} \end{bmatrix}$$`);
    plot.redraw();
  }
  widget.append(
    hh('div', 'unitrow', hzBox.el, rateBox.el, setTex(h('span'), String.raw`so $f=\text{Hz}/\text{rate}$`)),
    hh('div', 'sliders', cF.el),
    plot.wrap,
    hh('div', 'readouts', rF.el, rP.el),
    vecA, vecB,
    legend([
      { color: ROLE.input, text: String.raw`grey line: the wave $\cos(2\pi f t)$` },
      { color: ROLE.out, chip: true, text: String.raw`blue dots: the samples $u_n$` }]));
  side.append(
    sym(String.raw`$f$: rotations per sample; one rotation is one cycle. $1/f$: samples per cycle. $n$: sample number.`),
    nameLine(String.raw`<i>frequency</i>: Latin <i>frequens</i>, repeated: how often the wave repeats.`),
    where(String.raw`The six values are those of Primer · Waves, step 6.`),
    triesList([
      String.raw`Start: 10 Hz at 60 samples a second. Count the dots in one grey cycle: 6.`,
      String.raw`Set the rate to $100$. What is $f$, and how many dots per cycle?`,
      String.raw`Set $f = 0.5$. How many dots per cycle? What is the Hz at 60 a second?`]),
    takeBox(widget, String.raw`Only Hz / rate sets the dots: 10 Hz at 60 a second and 1 Hz at 6 give the same numbers.`));
  update();
}

// ---------- slide 3: a fast wave and a slow one, same dots ----------
function slideAliasing(widget, side) {
  const st = { f: 0.9, g: 0.5 };
  const diff = () => {
    let m = 0;
    for (let n = 0; n < 16; n++) m = Math.max(m, Math.abs(Math.cos(2 * PI * st.f * n) - Math.cos(2 * PI * st.g * n)));
    return m;
  };
  const cF = ctl(String.raw`$f$, the wave with the dots`, { id: 'f', min: 0, max: 1, step: 0.005, value: st.f,
    fmt: v => v.toFixed(3), onInput: v => { st.f = v; update(); } });
  const cG = ctl(String.raw`$g$, the second wave`, { id: 'g', min: 0, max: 1, step: 0.005, value: st.g,
    fmt: v => v.toFixed(3), onInput: v => { st.g = v; update(); } });
  const rD = readout('diff', String.raw`largest difference, $n=0\ldots15$`);
  const rS = readout('same', String.raw`same dots at every whole $n$?`);
  function drawPair(svg, W, H) {
    const a = axes(svg, W, H, { x0: 0, x1: 16, y0: -1.3, y1: 1.3, yt: [-1, 0, 1], xt: [0, 4, 8, 12, 16] });
    curve(svg, a.X, a.Y, 0, 16, t => Math.cos(2 * PI * st.f * t), { stroke: COL.input, 'stroke-width': 3 });
    curve(svg, a.X, a.Y, 0, 16, t => Math.cos(2 * PI * st.g * t), { stroke: COL.out, 'stroke-width': 2, 'stroke-dasharray': '6 4' });
    for (let n = 0; n < 16; n++) {
      dot(svg, a.X(n), a.Y(Math.cos(2 * PI * st.g * n)), 9, 'none', { stroke: COL.ink, 'stroke-width': 1.5, 'data-item': 'mark', 'data-id': 'ring-' + n });
      dot(svg, a.X(n), a.Y(Math.cos(2 * PI * st.f * n)), 5.5, COL.out, { 'data-item': 'mark', 'data-id': 'sample-' + n });
    }
    svgTex(svg, (a.L + W - a.R) / 2, H - 10, String.raw`$n$, sample number`, { w: 240, size: 15 });
  }
  const plot = plotBox(drawPair);
  function update() {
    const d = diff(), same = d < 1e-6;
    rD.set(fx(d, 3));
    rS.set(same ? 'yes' : 'no', !same);
    plot.redraw();
  }
  widget.append(
    hh('div', 'sliders', cF.el, cG.el),
    plot.wrap,
    hh('div', 'readouts', rD.el, rS.el),
    legend([
      { color: ROLE.input, text: String.raw`grey line: the wave at $f$` },
      { color: ROLE.out, dash: true, text: String.raw`dashed blue: the wave at $g$` },
      { color: ROLE.out, chip: true, text: String.raw`blue dots: samples at $f$` },
      { ring: true, color: ROLE.ink, text: String.raw`open rings: samples at $g$` }]));
  side.append(
    sym(String.raw`$f$, $g$: two frequencies, in rotations per sample. $n$: whole sample numbers.`),
    nameLine(String.raw`<i>alias</i>: Latin for "at another time, otherwise": a fast wave "goes under a different name" (Hamming, L14 13:41), the name of a slow one.`),
    where(String.raw`A wagon wheel in a film can seem to turn backward for the same reason.`),
    triesList([
      String.raw`Start: $f = 0.9$, $g = 0.5$. Rings and dots are apart.`,
      String.raw`Keep $f = 0.9$. Move $g$ until every ring hides in a dot.`,
      String.raw`Set $f = 0.875$ and find the $g$ that hides the rings.`]),
    takeBox(widget, String.raw`Two waves with the same dots look the same to the computer. The samples alone cannot say which was there.`));
  update();
}

// ---------- slide 4: samples per cycle ----------
function slideSamplesPerCycle(widget, side) {
  const st = { S: 7, phi: 0 };
  const cS = ctl(String.raw`$S$, samples per cycle`, { id: 'S', min: 1, max: 12, step: 1, value: st.S,
    fmt: v => String(v), onInput: v => { st.S = v; update(); } });
  const cP = ctl(String.raw`$\varphi$, where the wave starts`, { id: 'phi', min: 0, max: 90, step: 1, value: st.phi,
    fmt: v => v + '°', onInput: v => { st.phi = v; update(); } });
  const rF = readout('f', String.raw`$f=1/S$, rotations per sample`);
  const rB = readout('band', String.raw`inside the band, $|f|\le\tfrac12$?`);
  const first = h('div', 'vec');
  function drawWave(svg, W, H) {
    const a = axes(svg, W, H, { x0: 0, x1: 2, y0: -1.3, y1: 1.3, yt: [-1, 0, 1], xt: [0, 1, 2] });
    const ph = st.phi * PI / 180;
    curve(svg, a.X, a.Y, 0, 2, t => Math.cos(2 * PI * t + ph), { stroke: COL.input, 'stroke-width': 3 });
    for (let k = 0; k < 2 * st.S; k++) {
      const t = k / st.S;
      dot(svg, a.X(t), a.Y(Math.cos(2 * PI * t + ph)), 5.5, COL.out, { 'data-item': 'mark', 'data-id': 'sample-' + k });
    }
    svgTex(svg, (a.L + W - a.R) / 2, H - 10, String.raw`$t$, in cycles`, { w: 200, size: 15 });
  }
  function drawBand(svg, W, H) {
    const L = 44, R = 16, yc = 36;
    const X = f => L + (f + 1.2) / 2.4 * (W - L - R);
    line(svg, L, yc, W - R, yc, { stroke: COL.grid });
    svgNode('rect', { x: X(-0.5), y: yc - 10, width: X(0.5) - X(-0.5), height: 20, fill: FluidTheme.color('accent-tint') }, svg);
    for (const [v, lab] of [[-0.5, String.raw`$-\tfrac12$`], [0, '$0$'], [0.5, String.raw`$\tfrac12$`]]) {
      line(svg, X(v), yc - 12, X(v), yc + 12, { stroke: COL.grid });
      svgTex(svg, X(v), yc + 26, lab, { w: 60, size: 15 });
    }
    const f = 1 / st.S, out = Math.abs(f) > 0.5 + 1e-12;
    dot(svg, X(f), yc, 7, out ? FluidTheme.color('red') : COL.out, { 'data-item': 'mark', 'data-id': 'f-marker' });
    svgTex(svg, X(f), yc - 20, String.raw`$f=1/S$`, { w: 120, size: 15, fill: out ? FluidTheme.color('red') : FluidTheme.color('accent') });
    svgTex(svg, L + 4, 12, String.raw`shaded: the band you can keep`, { anchor: 'start', w: 300, size: 14 });
  }
  const plot = plotBox(drawWave);
  const strip = plotBox(drawBand, 'strip');
  function update() {
    const f = 1 / st.S, inside = f <= 0.5 + 1e-12;
    rF.set(fx(f, 3));
    rB.set(inside ? 'yes' : 'no, too fast', !inside);
    const vals = [];
    for (let k = 0; k < st.S; k++) vals.push(fx(Math.cos(2 * PI * k / st.S + st.phi * PI / 180), 2));
    first.textContent = 'Dots in the first cycle: ' + vals.join(', ');
    plot.redraw();
    strip.redraw();
  }
  widget.append(
    hh('div', 'sliders', cS.el, cP.el),
    plot.wrap,
    strip.wrap,
    hh('div', 'readouts', rF.el, rB.el),
    first,
    legend([
      { color: ROLE.input, text: String.raw`grey line: $\cos(2\pi t+\varphi)$` },
      { color: ROLE.out, chip: true, text: String.raw`blue dots: samples at $t = k/S$` }]));
  side.append(
    sym(String.raw`$S$: samples per cycle. $\varphi$: where the wave starts; 90° is a sine. A cosine at $-f$ equals one at $f$: cosine is even (Primer · Waves, step 8).`),
    where(String.raw`CD audio: 44,100 samples a second reach 22,050 Hz. Hamming's own solver needed 7 to 10 per cycle (L19 28:42).`),
    triesList([
      String.raw`Start at $S = 7$. The dots follow the wave.`,
      String.raw`Set $\varphi = 90°$ and $S = 2$. Every dot is 0. Can you find the height?`,
      String.raw`Set $S = 1$. The band turns red: $f = 1$ is outside the band.`]),
    takeBox(widget, String.raw`Two samples per cycle is the least. At exactly two, a sine can give all zeros.`));
  update();
}

// ---------- slide 5: rounding to levels ----------
function slideQuantization(widget, side) {
  const st = { b: 3 };
  const NS = 32;
  const xs = Array.from({ length: NS }, (_, n) => 0.95 * Math.sin(2 * PI * n / 16));
  const stepOf = b => 2 / (2 ** b - 1);
  const roundTo = (x, b) => Math.round((x + 1) / stepOf(b)) * stepOf(b) - 1;
  const us = () => xs.map(x => roundTo(x, st.b));
  const cB = ctl(String.raw`$b$, bits per sample`, { id: 'b', min: 1, max: 5, step: 1, value: st.b,
    fmt: v => String(v), onInput: v => { st.b = v; update(); } });
  const rL = readout('levels', String.raw`levels, $2^b$`);
  const rE = readout('max', String.raw`largest error, $\frac{1}{2^b-1}$`);
  function drawTop(svg, W, H) {
    const a = axes(svg, W, H, { x0: -0.5, x1: NS - 0.5, y0: -1.1, y1: 1.1, yt: [-1, 0, 1], xt: [0, 8, 16, 24, 31] });
    const levels = 2 ** st.b;
    for (let j = 0; j < levels; j++) line(svg, a.L, a.Y(-1 + j * stepOf(st.b)), W - a.R, a.Y(-1 + j * stepOf(st.b)), { stroke: COL.level });
    xs.forEach((x, n) => dot(svg, a.X(n), a.Y(x), 4.5, COL.input, { 'data-item': 'mark', 'data-id': 'exact-' + n }));
    us().forEach((u, n) => svgNode('rect', { x: a.X(n) - 5, y: a.Y(u) - 5, width: 10, height: 10, fill: COL.out,
      'data-item': 'mark', 'data-id': 'round-' + n }, svg));
  }
  function drawErr(svg, W, H) {
    const a = axes(svg, W, H, { x0: -0.5, x1: NS - 0.5, y0: -0.2, y1: 0.2, yt: [-0.2, 0, 0.2], xt: [0, 8, 16, 24, 31] });
    us().forEach((u, n) => {
      const e = u - xs[n];
      line(svg, a.X(n), a.Y(0), a.X(n), a.Y(e), { stroke: COL.ink, 'stroke-width': 2 });
      dot(svg, a.X(n), a.Y(e), 3.5, COL.ink, { 'data-item': 'mark', 'data-id': 'err-' + n });
    });
  }
  const plot = plotBox(drawTop);
  const errStrip = plotBox(drawErr, 'strip');
  function update() {
    rL.set(String(2 ** st.b));
    rE.set(fx(1 / (2 ** st.b - 1), 4));
    plot.redraw();
    errStrip.redraw();
  }
  widget.append(
    hh('div', 'sliders', cB.el),
    plot.wrap,
    errStrip.wrap,
    hh('div', 'readouts', rL.el, rE.el),
    legend([
      { color: ROLE.input, chip: true, text: String.raw`grey dots: exact samples $x_n$` },
      { color: ROLE.out, chip: true, text: String.raw`blue squares: rounded $u_n$` },
      { color: ROLE.level, text: String.raw`thin lines: the $2^b$ levels` },
      { color: ROLE.ink, chip: true, text: String.raw`solid stems: error $e_n$` }]));
  side.append(
    sym(String.raw`$b$: bits per sample. $x_n$: exact, $u_n$: rounded, $e_n = u_n - x_n$.`),
    nameLine(String.raw`<i>quantize</i>: Latin <i>quantum</i>, how much: only set amounts, the levels.`),
    where(String.raw`16 bits give 65,536 levels. Hamming quantizes music this way (L7 14:02).`),
    triesList([
      String.raw`Start at $b = 3$. Blue squares sit on lines; grey dots miss by up to a step.`,
      String.raw`Set $b = 1$. Two levels. What does the wave look like?`,
      String.raw`Set $b = 5$. Are the error stems smaller? Do they look like noise?`]),
    takeBox(widget, String.raw`Each extra bit about halves the largest error. The rounding error acts like noise.`));
  update();
}

// ---------- proof slides: shared parts ----------
// Amber marks what the newest proof line is about, in the picture and in the proof.
function nameLine(html) { const p = h('p', 'sym name'); p.innerHTML = html; return tex(p); }
// The caption row: while a proof line is lit it says what the amber part is; otherwise it names the picture.
function caption(svg, W, isLit, text) {
  if (isLit) svgTex(svg, W / 2, 13, text, { w: W - 8, size: 15, fill: FluidTheme.color('amber-ink'), bg: FluidTheme.color('amber-bg') });
  else svgTex(svg, 4, 13, text, { w: W - 8, anchor: 'start', size: 15, fill: FluidTheme.color('muted') });
}
function pathD(pts) { return pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' '); }
function glowLine(svg, d, wdt) {
  return svgNode('path', { d, fill: 'none', stroke: FluidTheme.color('amber-bg'), 'stroke-width': wdt || 12, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, svg);
}
function glowDot(svg, x, y, r) { return svgNode('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: r || 11, fill: FluidTheme.color('amber-bg'), stroke: FluidTheme.color('amber'), 'stroke-width': 1.5 }, svg); }
function glowBox(svg, x, y, w, ht, pad) {
  pad = pad == null ? 4 : pad;
  return svgNode('rect', { x: (x - pad).toFixed(1), y: (y - pad).toFixed(1), width: Math.max(0, w + 2 * pad).toFixed(1),
    height: Math.max(0, ht + 2 * pad).toFixed(1), rx: 6, fill: FluidTheme.color('amber-bg'), stroke: FluidTheme.color('amber'), 'stroke-width': 1.5 }, svg);
}
// Left column of a proof slide: controls, the picture, legend, readouts, the test, the mental model.
function proofLeft(widget, o) {
  if (o.controls && o.controls.length) widget.append(hh('div', 'sliders', ...o.controls));
  const plot = plotBox(o.draw);
  widget.append(plot.wrap, legend(o.legend));
  if (o.readouts && o.readouts.length) widget.append(hh('div', 'readouts', ...o.readouts.map(r => r.el)));
  const test = hh('div', 'test', h('p', 'part', 'Test it'), triesList(o.tests));
  const model = h('p', 'model');
  model.append(h('span', 'part', 'The picture: '), tex(h('span', '', o.model)));
  widget.append(test, model);
  return { redraw: plot.redraw, test };
}
// Right column: the proof. Each revealed line lights its part of the picture; once the proof is
// done, the look-back questions take the place of the test under the picture.
function proofRight(side, spec, plot, onLight, hint) {
  const el = document.createElement('fl-proof-steps');
  el.onEvent = d => emit('view.action', d);
  el.onHighlight = key => onLight(key);
  el.lookBackHost = plot.test;
  el.lookBackHint = hint || 'Look back: under the picture.';
  el.data = spec;
  side.append(el);
  return el;
}
// A circle for sample angles: center, radius, and the point at angle a (counterclockwise from the right).
function sampleCircle(svg, W, H) {
  const r = Math.max(40, Math.min((H - 40) / 2 - 22, W * 0.19));
  const cx = 52 + r, cy = (34 + H - 6) / 2;
  const P = (rho, a) => [cx + rho * Math.cos(a), cy - rho * Math.sin(a)];
  return { r, cx, cy, P };
}
function drawCircleBase(svg, C, lit) {
  line(svg, C.cx - C.r - 12, C.cy, C.cx + C.r + 12, C.cy, { stroke: COL.grid });
  line(svg, C.cx, C.cy - C.r - 6, C.cx, C.cy + C.r + 6, { stroke: COL.rule });
  if (lit) svgNode('circle', { cx: C.cx, cy: C.cy, r: C.r, fill: 'none', stroke: FluidTheme.color('amber-bg'), 'stroke-width': 12 }, svg);
  svgNode('circle', { cx: C.cx, cy: C.cy, r: C.r, fill: 'none', stroke: FluidTheme.color('grey-blue'), 'stroke-width': 1.5, 'data-item': 'mark', 'data-id': 'circle' }, svg);
}
// A label set outside (out > 0) or inside the circle at angle a.
function circleLabel(svg, C, a, out, s) {
  const p = C.P(C.r + out, a), c = Math.cos(a);
  const anchor = out > 0 ? (c > 0.35 ? 'start' : c < -0.35 ? 'end' : 'middle') : (c > 0.35 ? 'end' : c < -0.35 ? 'start' : 'middle');
  svgTex(svg, p[0], p[1], s, { w: 70, size: 15, anchor, fill: FluidTheme.color('ink'), halo: true });
}
// The samples n = 0..15 of two cosines: f (grey line, blue dots) and g (dashed blue, rings).
function drawDotsPanel(svg, x0, x1, pT, pB, f, g, n, glowN) {
  const Xn = k => x0 + k / 16 * (x1 - x0), Yv = v => pT + (1.25 - v) / 2.5 * (pB - pT);
  line(svg, x0, pT, x0, pB, { stroke: COL.grid });
  line(svg, x0, Yv(0), x1, Yv(0), { stroke: COL.rule });
  for (const v of [1, 0, -1]) svgText(svg, x0 - 6, Yv(v) + 5, v < 0 ? '−1' : String(v), { 'text-anchor': 'end', 'font-size': 13 });
  for (const k of [0, 5, 10, 15]) svgText(svg, Xn(k), pB + 16, String(k), { 'text-anchor': 'middle', 'font-size': 13 });
  svgTex(svg, Xn(16), pB + 12, '$n$', { w: 30, size: 15 });
  if (n != null) line(svg, Xn(n), pT, Xn(n), pB, { stroke: FluidTheme.color('soft-2'), 'stroke-width': 6 });
  curve(svg, Xn, Yv, 0, 16, t => Math.cos(2 * PI * f * t), { stroke: COL.input, 'stroke-width': 2.5 });
  curve(svg, Xn, Yv, 0, 16, t => Math.cos(2 * PI * g * t), { stroke: COL.out, 'stroke-width': 1.8, 'stroke-dasharray': '6 4' });
  if (glowN) glowDot(svg, Xn(n), Yv(Math.cos(2 * PI * f * n)), 11);
  for (let k = 0; k < 16; k++) {
    dot(svg, Xn(k), Yv(Math.cos(2 * PI * g * k)), 7.5, 'none', { stroke: COL.ink, 'stroke-width': 1.4, 'data-item': 'mark', 'data-id': 'ring-' + k });
    dot(svg, Xn(k), Yv(Math.cos(2 * PI * f * k)), 4.5, COL.out, { 'data-item': 'mark', 'data-id': 'sample-' + k });
  }
}
function sameDots(f, g) {
  let m = 0;
  for (let n = 0; n < 16; n++) m = Math.max(m, Math.abs(Math.cos(2 * PI * f * n) - Math.cos(2 * PI * g * n)));
  return m;
}

// ---------- step 2: why the readings do not fix the curve (proof) ----------
function drawMiss(svg, W, H, d, c, lit) {
  const L = 44, R = 16, T = 32, axisY = H - 44;
  const split = T + Math.round((axisY - T) * 0.64);
  const X = t => L + t / 24 * (W - L - R);
  const Y = v => T + (28 - v) / 20 * (split - T);
  const sT = split + 12, sB = axisY - 6, Z = v => (sT + sB) / 2 - v * (sB - sT) / 2;
  const z = t => Math.sin(PI * t / d), y = t => TEMP(t) + c * z(t);
  const CAP = {
    z: String.raw`amber: the added wave $z(t)=\sin(\pi t/\Delta)$, half a turn per step`,
    zeros: String.raw`amber: $z$ is 0 at every reading time $t=n\Delta$`,
    same: String.raw`amber: $y$ passes through every reading $u_n$`,
    gap: String.raw`amber: midway between readings, $y-x=\pm c$` }[lit];
  caption(svg, W, !!CAP, CAP || String.raw`top: two curves through the same readings; bottom: the wave $z$ that was added`);
  const K = Math.round(24 / d), times = Array.from({ length: K + 1 }, (_, k) => k * d);
  for (const v of [10, 18, 26]) {
    line(svg, L, Y(v), W - R, Y(v), { stroke: FluidTheme.color('soft') });
    svgText(svg, L - 8, Y(v) + 5, String(v), { 'text-anchor': 'end' });

function drawLadder(svg, W, H, b, x, lit) {

    gap: String.raw`amber: $${NL}$ levels leave $${NL - 1}$ equal gaps across the height 2`,
    half: String.raw`amber: every point of this zone rounds to its level: at most half a gap away`,
    limit: b < BARS_B ? String.raw`amber: one more bit multiplies the bound by $\frac{${NL - 1}}{${2 * NL - 1}}$, just under $\tfrac12$`

  stage.scrollTop = 0;
  PLOTS = [];
  s.mount(widget, side);
  if (cur === SLIDES.length - 1 && !endSent) { endSent = true; emit('view.action', { action: 'deck-end' }); }
  tex(sec);
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, i) => d.classList.toggle('on', i === cur));
}
// A cue is a state: go to the named step, and do nothing if it is already shown.
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i >= 0 && i !== cur) goTo(i);
}
(function init() {
  const dots = $('#dots');
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = s.title.replace(/\$/g, '');
    b.addEventListener('click', () => goTo(i));
    dots.appendChild(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],input[type=number],textarea,select')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
})();
</script>
</body>

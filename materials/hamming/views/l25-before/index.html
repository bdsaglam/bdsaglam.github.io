<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Before Lecture 25: novelty and evidence</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><script src="../../components/theme.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--pal-bg);color:var(--pal-fg);font:20px/1.4 system-ui}body{padding:26px 34px}header{height:86px}h1{font-size:32px;margin:4px 0}h2{font-size:25px;margin:0 0 18px}p{margin:10px 0}.tag{font-size:16px;color:var(--pal-muted)}main{display:grid;grid-template-columns:60% 40%;height:530px;gap:0}.widget{padding:18px;background:var(--pal-soft);border:1px solid var(--pal-line);border-radius:16px;display:flex;flex-direction:column;gap:12px}.explain{padding:8px 0 0 28px;display:flex;flex-direction:column}ol{padding-left:25px;font-size:20px}li{margin:0 0 14px}.take{padding:15px;background:var(--pal-accent-soft);border-left:4px solid var(--pal-accent);margin-top:auto;font-size:21px}.source{font-size:16px;color:var(--pal-muted);margin-top:14px}.cards{display:grid;gap:10px}.card{text-align:left;border:1px solid var(--pal-line);border-radius:10px;background:var(--pal-panel);color:var(--pal-fg);padding:10px 13px;font:17px/1.25 system-ui;cursor:pointer}.card strong{display:block;font-size:20px}.card.picked{border:3px solid var(--pal-accent);padding:8px 11px}.verdict{margin-top:6px;color:var(--pal-text-2);font-size:16px}.correct{background:var(--pal-good-bg)}button{font:18px system-ui;padding:10px 16px;border:1px solid var(--pal-line);border-radius:8px;background:var(--pal-panel);color:var(--pal-fg);cursor:pointer}button:disabled{opacity:.45;cursor:default}button.active{background:var(--pal-accent-soft);border-color:var(--pal-accent)}.controls{display:flex;gap:12px;margin-top:auto}.proofline{padding:15px;border-left:4px solid var(--pal-accent);background:var(--pal-panel)}.proofline small{display:block;color:var(--pal-muted);font-size:17px}.row{display:flex;gap:12px}.tile{padding:12px;font-size:18px;border:1px solid var(--pal-line);border-radius:9px;background:var(--pal-panel)}.bridge{padding:12px;background:var(--pal-accent-soft);font-size:19px;min-height:80px}.bars{flex:1;min-height:160px;display:flex;align-items:end;justify-content:space-around;gap:16px;height:180px}.barcol{display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;width:28%;font-size:18px}.bar{background:var(--pal-accent);width:100%;min-height:20px;color:var(--pal-on-accent);display:flex;align-items:center;justify-content:center;font-size:24px}footer{height:48px;display:flex;align-items:center;gap:15px;margin-top:10px}#count{margin-right:auto;font-size:17px;color:var(--pal-muted)}a{color:var(--pal-accent-deep)}</style></head><body><header><div class="tag" id="tag"></div><h1 id="title"></h1></header><main><section class="widget" id="widget"></section><section class="explain"><h2 id="q"></h2><ol id="steps"></ol><div class="take" id="take"></div><p class="source" id="source"></p></section></main><footer><span id="count"></span><button id="prev">Previous</button><button id="next">Next</button></footer><script>const slides=[{"title": "A new result: useful to whom?", "time": "01:11\u201304:20", "q": "Which result would make someone change what they do?", "kind": "choice", "lead": "Three toy research outputs", "cards": [["Unseen number", "Multiply two random ten-digit numbers. Assume that being first is enough.", "Newness alone gives no reason for anyone to care."], ["Small useful transfer", "Use a known fitting method to cut a lab\u2019s calibration error from 10 units to 2. Assume that this error matters.", "A concrete benefit makes this worth investigating. Check the measurement and the cost."], ["Popular demo", "A million people view a demo. Assume attention proves usefulness.", "Attention shows interest. It does not establish that the method works."]], "answer": 1, "steps": ["Pick the output you would investigate first.", "Read all three verdicts. Name one piece of missing evidence."], "take": "Novelty opens a question; evidence of value makes a contribution worth pursuing.", "note": "The calibration numbers are invented for this exercise. Hamming\u2019s case: random multiplication versus a record prime."}, {"title": "Ridicule does not prove greatness", "time": "03:15\u201304:20", "q": "What breaks the argument \u201cthey laughed at a pioneer, so my mocked idea is good\u201d?", "kind": "proof", "lead": "Construct a counterexample", "lines": [["A successful pioneer was mocked.", "Accept the first premise."], ["A failed proposal was also mocked.", "This can be true at the same time."], ["Our proposal was mocked.", "It could belong to either group."], ["Its success is still unknown.", "The premises do not determine the conclusion."]], "steps": ["Before revealing, invent a bad idea someone could laugh at.", "Reveal one line at a time. Which line blocks the conclusion?"], "take": "A reaction from an audience is not a test of the idea.", "note": "This is a logical counterexample to Hamming\u2019s Fulton argument. It does not estimate the success rate of unpopular ideas."}, {"title": "Ask for a discriminating test", "time": "04:20 / application", "q": "How could you judge an AI idea that only a few people understand?", "kind": "choice", "lead": "A retrieval method claims to save work", "cards": [["Count supporters", "Ask 100 people if the idea sounds promising. Assume popularity tracks merit.", "This can test communication or demand. It does not test retrieval quality."], ["Wait for fame", "Keep the method unchanged until experts approve. Assume delay resolves uncertainty.", "Waiting alone generates no discriminating evidence."], ["Run a fixed comparison", "Compare 200 held-out queries with the current method at the same cost. Assume those queries represent the intended task.", "This tests a concrete claim. Inspect failures and whether the test task matches the real use."]], "answer": 2, "steps": ["Pick a test before seeing the verdicts.", "Say what a win on 200 queries still would not show."], "take": "Limited recognition and strong evidence can coexist; test the claim where it matters.", "note": "An invented AI application of the lecture\u2019s distinction between appreciation and value; no universal definition of creativity is claimed."}];const section="Before Lecture 25";
let index=0;const state=slides.map(()=>({pick:null,show:false,line:0,mode:0,problem:0}));
const $=s=>document.querySelector(s);function math(){if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:'$',right:'$',display:false}],throwOnError:false})}
function act(f){f(state[index]);render()}
function render(){let d=slides[index],s=state[index];$('#title').textContent=d.title;$('#tag').textContent=section+' · '+d.time;$('#q').textContent=d.q;$('#steps').innerHTML=d.steps.map(t=>'<li>'+t+'</li>').join('');$('#take').textContent=d.take;$('#take').style.visibility=s.show||!['choice','proof','forecast'].includes(d.kind)?'visible':'hidden';$('#source').textContent=d.note;$('#count').textContent=(index+1)+' / '+slides.length;$('#prev').disabled=index===0;$('#next').disabled=index===slides.length-1;let h='<h2>'+d.lead+'</h2>';
if(d.kind==='choice'){h+='<div class="cards">'+d.cards.map((c,i)=>`<button class="card ${s.pick===i?'picked':''} ${s.show&&d.answer===i?'correct':''}" data-item="option" data-id="${i}" onclick="act(s=>{s.pick=${i};s.show=true})"><strong>${c[0]}</strong>${c[1]}${s.show?'<div class="verdict">'+c[2]+'</div>':''}</button>`).join('')+'</div><div class="controls"><button onclick="act(s=>s.show=true)">Show answer</button><button onclick="act(s=>{s.pick=null;s.show=false})">Reset</button></div>'}
if(d.kind==='proof'){h+=d.lines.slice(0,s.line).map(c=>'<div class="proofline">'+c[0]+'<small>'+c[1]+'</small></div>').join('');h+='<div class="controls"><button '+(s.line===d.lines.length?'disabled':'')+' onclick="act(s=>{s.line++;s.show=s.line===slides[index].lines.length})">Next line</button><button onclick="act(s=>{s.line=0;s.show=false})">Reset</button></div>'}
if(d.kind==='hooks'){let problems=['Noisy sensor','Unequal classes','Recent change'];let bridge=['Average repeated readings: independent noise can partly cancel. Check for shared bias first.','Weight rare-class examples more heavily: they count more in the average loss. Check what target distribution you want.','Give recent observations more weight: the average follows change faster. Check the extra sensitivity to noise.'];h+='<div class="row">'+['One setting','Several hooks'].map((x,i)=>`<button class="${s.mode===i?'active':''}" onclick="act(s=>s.mode=${i})">${x}</button>`).join('')+'</div><div class="tile">Known setting: average several classroom test scores.</div><p>New problem:</p><div class="row">'+problems.map((x,i)=>`<button class="${s.problem===i?'active':''}" onclick="act(s=>s.problem=${i})">${x}</button>`).join('')+'</div><div class="bridge">'+(s.mode?bridge[s.problem]:'Only “classroom scores” is filed here. What shared structure would make the average retrievable?')+'</div><p class="source">Each hook links a task to the operation: combine contributions, with a reason for the weights.</p>'}
if(d.kind==='analogy'){let rows=[['Library catalogue → retrieval index','Both help locate a candidate. A match in the index is not proof the document answers the question.'],['Librarian’s follow-up → query clarification','Both can ask what the requester means. A model can also invent intent; check the clarification with the user.'],['Shelf location → semantic similarity','Both put some related items nearby. Embedding distance may group wording rather than the relation the task needs.']];h+=rows.map((r,i)=>'<div class="tile"><strong>'+r[0]+'</strong>'+(s.line>i?'<p>'+r[1]+'</p>':'')+'</div>').join('');h+='<div class="controls"><button '+(s.line===3?'disabled':'')+' onclick="act(s=>s.line++)">Reveal next limit</button><button onclick="act(s=>s.line=0)">Reset</button></div>'}
if(d.kind==='forecast'){let vals=s.mode?[18,12,6]:[18,18,18];h+='<div class="row">'+['Always 18 months away','Forecast shrinks'].map((x,i)=>`<button class="${s.mode===i?'active':''}" onclick="act(s=>{s.mode=${i};s.show=false})">${x}</button>`).join('')+'</div><div class="bars">'+vals.map((v,i)=>'<div class="barcol"><div class="bar" style="height:'+v*7+'px">'+v+'</div><p>Review '+(i+1)+'</p></div>').join('')+'</div><p>Filled bars: forecast months remaining. Reviews are six months apart.</p>'+(s.show?'<div class="bridge">'+(s.mode?'The falling forecast is consistent with progress. Check completed milestones before trusting it.':'Review the framing and milestones. A fixed distance can reflect a poor forecast, new scope, or a wrong problem.')+'</div>':'')+'<div class="controls"><button onclick="act(s=>s.show=true)">Show answer</button></div>'}
$('#widget').innerHTML=h;math()}
$('#prev').onclick=()=>{index--;render()};$('#next').onclick=()=>{index++;render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&index<slides.length-1){index++;render()}if(e.key==='ArrowLeft'&&index>0){index--;render()}});window.addEventListener('load',render);render();
</script></body></html>

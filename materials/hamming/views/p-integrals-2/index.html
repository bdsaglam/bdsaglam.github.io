<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primer · Integrals: techniques</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../../components/theme.js"></script>
<style>
/* Colors: white page, blue for the area and the accent, orange for the second strip, grey for the curve. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft); --orange:var(--pal-orange);
  --u:clamp(16px,1.35vw,20px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 24px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(6px,1vh,12px) 24px}
footer{display:flex;align-items:center;gap:10px;padding:8px 24px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Slide frame: widget on the left (3/5), text on the right (2/5). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(18px,2.4vw,40px)}
.widget{min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(4px,0.8vh,8px);overflow:hidden}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(6px,1.1vh,12px);overflow:hidden}
.tag{font:13px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(20px,1.9vw,28px);line-height:1.2;margin:0;font-weight:650}
.question{margin:0;font-size:clamp(16px,1.3vw,18px);font-weight:600}
.formula{font-size:clamp(18px,1.6vw,22px)}
.sym{margin:0;font-size:16px;color:var(--muted)}
.tries{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:4px;font-size:16px}
.tries li::marker{color:var(--accent);font-weight:600}
.takeaway{margin:0;padding:8px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}
.closing{margin:0;font-size:17px;font-weight:600}
.next{margin:0;font-size:16px;color:var(--muted)}

/* Controls and readouts */
.sliders{display:flex;gap:8px 24px;flex-wrap:wrap;width:100%}
.slide-ctl{display:flex;align-items:center;gap:8px;font-size:16px}
.slide-ctl input{width:clamp(120px,11vw,170px);vertical-align:middle;accent-color:var(--accent)}
.slide-ctl .val{min-width:70px}
.btn{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--pal-panel);border-radius:8px;cursor:pointer;font-size:16px}
.btn.on{background:var(--chip);border-color:var(--accent);color:var(--accent)}
.btn:disabled{color:var(--muted);cursor:default}
.readouts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.readout{flex:1 1 150px;min-width:0;padding:4px 8px;border-radius:10px;background:var(--pal-soft);font-size:15px;overflow-wrap:anywhere}
.readout .k{color:var(--muted);font-size:14px}
.readout .val{font-size:16px;font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:20px;height:0;vertical-align:middle;margin-right:6px}
.chip{display:inline-block;width:18px;height:12px;vertical-align:middle;margin-right:6px;border-radius:2px}

/* The plot fills the space left in the widget column */
.fill{flex:1 1 0;min-height:100px;position:relative;width:100%}
.fill>svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* Proof slides: test and picture on the left, the proof (fl-proof-steps) on the right */
.slide.proof-slide{grid-template-columns:minmax(0,11fr) minmax(0,9fr)}
.slide.proof-slide .side{justify-content:flex-start}
.slide.proof-slide .fill{min-height:100px}
.slide.proof-slide .slide-ctl input{width:clamp(90px,8vw,130px)}
.slide.proof-slide .slide-ctl .val{min-width:40px}
.slide.proof-slide .sliders{gap:6px 18px}
.slide.proof-slide .legend{gap:4px 12px}
.part{margin:0;font-weight:600;color:var(--muted)}
.test{display:flex;flex-direction:column;gap:3px}
.test .tries{gap:3px}
.model{margin:0;padding:8px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}

/* Short windows (1100x620 and similar): tighter spacing, text stays 16px */
@media (max-height: 680px){
  header{padding-top:4px}
  #stage{padding:4px 24px}
  footer{padding:4px 24px}
  .widget{gap:4px}
  .side{gap:4px}
  .tries{gap:2px}
  .sym,.tries{line-height:1.2}
  .readout{padding:3px 8px}
  .takeaway{padding:6px 10px}
  .formula{font-size:18px}
  h2{font-size:20px}
}
</style>
</head>
<body>
<header>Primer · Integrals: techniques</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script src="../../components/proof-steps.js"></script>
<script>
// ---------- helpers ----------
const $ = s => document.querySelector(s);

// ---------- palette and redraw ----------
// COL holds the palette colors for the SVG being drawn: a plot re-reads it at every paint, and the slide
// re-reads it when it is shown. A theme switch redraws the plots and keeps every control's state.
let COL = {};
const PAL_NAMES = ['accent', 'accent-2', 'amber', 'amber-bg', 'amber-deep', 'blue-deep', 'blue-light', 'blue-pale', 'blue-strong', 'grey', 'bg', 'ink', 'line', 'muted', 'orange', 'orange-bright', 'orange-deep', 'orange-soft', 'panel', 'text-2'];
function readPalette() {
  const o = {};
  for (const n of PAL_NAMES) o[n.replace(/-(\w)/g, (_, c) => c.toUpperCase())] = FluidTheme.color(n);
  return o;
}
let PLOTS = [];   // the plots on the current slide
window.addEventListener('fluid-themechange', () => { COL = readPalette(); PLOTS.forEach(p => p.redraw()); });
const NSV = 'http://www.w3.org/2000/svg', NHT = 'http://www.w3.org/1999/xhtml';
const PI = Math.PI;
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false } ], throwOnError: false };
// Render $...$ and $$...$$ in a node. If the CDN did not load, the text stays as typed.
function tex(node) {
  if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH);
  return node;
}
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function hh(tag, cls, ...kids) {
  const e = h(tag, cls);
  for (const k of kids) if (k) e.append(k);
  return e;
}
function mark(e, kind, id, title) {
  e.dataset.item = kind;
  if (id != null) e.dataset.id = id;
  if (title != null) e.dataset.title = title;
  return e;
}
function svgNode(tag, attrs, parent) {
  const e = document.createElementNS(NSV, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function svgText(parent, x, y, s, attrs) {
  const t = svgNode('text', Object.assign({ x: x, y: y, fill: COL.muted, 'font-size': 14 }, attrs || {}), parent);
  t.textContent = s;
  return t;
}
// A KaTeX label over an SVG: a foreignObject holding a rendered formula.
function svgTex(parent, x, y, s, o) {
  o = o || {};
  const w = o.w || 220, ht = 26, anchor = o.anchor || 'middle';
  const x0 = anchor === 'end' ? x - w : anchor === 'start' ? x : x - w / 2;
  const fo = svgNode('foreignObject', { x: x0, y: y - ht / 2, width: w, height: ht }, parent);
  const d = document.createElementNS(NHT, 'div');
  const jc = anchor === 'end' ? 'flex-end' : anchor === 'start' ? 'flex-start' : 'center';
  d.setAttribute('style', 'display:flex;align-items:center;height:100%;white-space:nowrap;font-size:' +
    (o.size || 15) + 'px;color:' + (o.fill || COL.text2) + ';justify-content:' + jc);
  const span = document.createElementNS(NHT, 'span');
  span.textContent = s;
  if (o.bg) span.setAttribute('style', 'background:' + o.bg + ';border-radius:5px;padding:1px 5px');
  d.appendChild(span);
  fo.appendChild(d);
  tex(span);
  return fo;
}
// Tick label: LaTeX if it has $, plain text otherwise.
function tickLabel(svg, x, y, s, anchor) {
  return s.indexOf('$') >= 0 ? svgTex(svg, x, y, s, { w: 90, size: 14, anchor: anchor }) :
    svgText(svg, x, y + 5, s, { 'text-anchor': anchor, 'font-size': 14 });
}
function path(svg, pts, attrs, close) {
  const d = 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L') + (close ? 'Z' : '');
  return svgNode('path', Object.assign({ d: d, fill: 'none' }, attrs), svg);
}
function dot(svg, x, y, color) {
  return svgNode('circle', { cx: x, cy: y, r: 5, fill: color, stroke: COL.panel, 'stroke-width': 1.5 }, svg);
}
// Plot frame: linear scales from data ranges to the box, with room for labels (m overrides the margins).
function frame(W, H, o, m) {
  const M = Object.assign({ l: 70, r: 20, t: 14, b: 58 }, m || {});
  const X = v => M.l + (v - o.x0) * (W - M.l - M.r) / (o.x1 - o.x0);
  const Y = v => H - M.b - (v - o.y0) * (H - M.t - M.b) / (o.y1 - o.y0);
  return { X: X, Y: Y };
}
// Axes with tick pairs [value, label] and LaTeX axis labels.
function axes(svg, f, o) {
  const left = f.X(o.x0), base = f.Y(o.y0), right = f.X(o.x1), top = f.Y(o.y1);
  path(svg, [[left, top], [left, base], [right, base]], { stroke: COL.grey, 'stroke-width': 1 });
  for (const [v, s] of o.xt) {
    svgNode('line', { x1: f.X(v), x2: f.X(v), y1: base, y2: base + 4, stroke: COL.grey }, svg);
    tickLabel(svg, f.X(v), base + 18, s, 'middle');
  }
  for (const [v, s] of o.yt) {
    svgNode('line', { x1: left - 4, x2: left, y1: f.Y(v), y2: f.Y(v), stroke: COL.grey }, svg);
    tickLabel(svg, left - 8, f.Y(v), s, 'end');
  }
  svgTex(svg, (left + right) / 2, f.Y(o.y0) + 42, o.xlabel, { w: 420, size: 15 });
  const mid = (top + base) / 2;
  const fo = svgTex(svg, 16, mid, o.ylabel, { w: 320, size: 15 });
  fo.setAttribute('transform', 'rotate(-90 16 ' + mid + ')');
}
// Draw into a box that fills its column; redraws when the box changes size.
function fillPlot(box, draw) {
  const go = () => {
    box.textContent = '';
    const W = Math.max(200, box.clientWidth), H = Math.max(160, box.clientHeight);
    const svg = svgNode('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'font-family': 'system-ui, sans-serif' });
    box.append(svg);
    COL = readPalette();
    draw(svg, W, H);
  };
  PLOTS.push({ redraw: go });
  go();
  if (window.ResizeObserver) new ResizeObserver(go).observe(box);
  return go;
}
// A labelled range input. label is LaTeX-ready text; fmt returns the value text (LaTeX-ready).
function slider(label, o) {
  const wrap = h('label', 'slide-ctl');
  const lab = tex(h('span', '', label));
  const val = h('span', 'val');
  const inp = h('input');
  inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step; inp.value = o.value;
  mark(inp, 'control', o.id, o.id);
  wrap.append(lab, inp, val);
  const fmt = o.fmt || String;
  const api = { el: wrap, input: inp, show() { setTex(val, fmt(+inp.value)); } };
  inp.addEventListener('input', () => { api.show(); o.onInput(+inp.value); });
  api.show();
  return api;
}
// A readout box: label and value are LaTeX-ready text.
function readout(id, label) {
  const box = mark(h('div', 'readout'), 'readout', id);
  const k = h('div', 'k');
  setTex(k, label);
  const v = h('div', 'val');
  box.append(k, v);
  return { el: box, set(text) { setTex(v, text); } };
}
function legend(items) {
  const d = h('div', 'legend');
  for (const it of items) {
    const s = h('span');
    const sw = it.chip ? h('span', 'chip') : h('span', 'sw');
    if (it.chip) sw.style.background = it.color;
    else sw.style.borderTop = '2px ' + (it.dash ? 'dashed' : 'solid') + ' ' + it.color;
    const t = h('span');
    setTex(t, it.text);
    s.append(sw, t);
    d.append(s);
  }
  return d;
}
function sym(text) { return setTex(h('p', 'sym'), text); }
function triesList(items) { return hh('ol', 'tries', ...items.map(t => setTex(h('li'), t))); }
function takeLine(text) { return setTex(h('p', 'takeaway'), text); }
// Session events. Optional: with no bridge, nothing is sent.
function emit(kind, data) {
  try {
    if (window.fluid && typeof window.fluid.emit === 'function') Promise.resolve(window.fluid.emit(kind, data)).catch(() => {});
  } catch (e) { /* the view works without the bridge */ }
}
// A number with d decimals, without a minus sign on zero.
function fixed(v, d) { return (Math.abs(v) < 0.5 * Math.pow(10, -d) ? 0 : v).toFixed(d); }
// Simpson's rule, for the numeric readouts that test a formula.
function simpson(g, a, b, n) {
  n = n || 400;
  const w = (b - a) / n;
  let s = g(a) + g(b);
  for (let i = 1; i < n; i++) s += g(a + i * w) * (i % 2 ? 4 : 2);
  return s * w / 3;
}

// ---------- proof slides: shared parts ----------
// Amber marks what the newest proof line is about, in the picture and in the proof.
function glowPath(svg, pts, wdt) {
  return path(svg, pts, { stroke: COL.amberBg, 'stroke-width': wdt || 12, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
}
function glowFill(svg, pts) {
  return path(svg, pts, { fill: COL.amberBg, 'fill-opacity': .9, stroke: COL.amber, 'stroke-width': 1.5 }, true);
}
// Points along an arc of radius rho from angle a0 to a1, through the map P(rho, a).
function arcPts(P, rho, a0, a1) {
  const n = Math.max(8, Math.ceil(Math.abs(a1 - a0) * 48)), pts = [];
  for (let i = 0; i <= n; i++) pts.push(P(rho, a0 + (a1 - a0) * i / n));
  return pts;
}
// The region between radii r0 and r1 and angles a0 and a1 (a wedge when r0 is 0).
function sectorPts(P, r0, r1, a0, a1) {
  return arcPts(P, r1, a0, a1).concat(r0 > 0 ? arcPts(P, r0, a1, a0) : [P(0, a0)]);
}
// While a proof line is lit, a caption in the title row says what the amber part is.
function litCaption(svg, W, text) {
  svgTex(svg, W / 2, 12, text, { w: W - 8, size: 15, fill: COL.ink, bg: COL.amberBg });
}
function plainCaption(svg, W, text) {
  svgTex(svg, W / 2, 12, text, { w: W - 8, size: 14, fill: COL.muted });
}
const PM = { t: 32 };   // proof pictures leave a row on top for the caption
// The region between a curve g and the x axis from a to b, in screen points.
function underPts(f, g, a, b, n) {
  n = n || 80;
  const pts = [[f.X(a), f.Y(0)]];
  for (let i = 0; i <= n; i++) { const x = a + (b - a) * i / n; pts.push([f.X(x), f.Y(g(x))]); }
  pts.push([f.X(b), f.Y(0)]);
  return pts;
}
function boxPts(f, x0, x1, y0, y1) {
  return [[f.X(x0), f.Y(y0)], [f.X(x0), f.Y(y1)], [f.X(x1), f.Y(y1)], [f.X(x1), f.Y(y0)]];
}
// Left column of a proof slide: controls, the picture, legend, readouts, the test, the mental model.
function proofLeft(widget, o) {
  if (o.controls && o.controls.length) widget.append(hh('div', 'sliders', ...o.controls));
  const box = h('div', 'fill');
  widget.append(box);
  const redraw = fillPlot(box, o.draw);
  widget.append(legend(o.legend));
  if (o.readouts && o.readouts.length) widget.append(hh('div', 'readouts', ...o.readouts.map(r => r.el)));
  const test = hh('div', 'test', h('p', 'part', 'Test it'), triesList(o.tests));
  const model = h('p', 'model');
  model.append(h('span', 'part', 'The picture: '), tex(h('span', '', o.model)));
  widget.append(test, model);
  return { redraw: redraw, test: test };
}
// Right column: the proof. Each revealed line lights its part of the picture; once the proof is
// done, the look-back questions take the place of the test under the picture.
function proofRight(side, spec, plot, onLight, hint) {
  const el = document.createElement('fl-proof-steps');
  el.onEvent = d => emit('view.action', d);
  el.onHighlight = key => onLight(key);
  el.lookBackHost = plot.test;
  el.lookBackHint = hint || 'Look back: under the picture.';
  el.data = spec;
  side.append(el);
  return el;
}

// ---------- slide 1: substitution ----------
function slideSub(widget, side) {
  let x0 = PI / 6, x1 = PI / 2;
  const rU = readout('u', 'in $u=\\sin x$: from $\\sin x_0$ to $\\sin x$');
  const rA = readout('area', 'area from $x_0$ to $x$: $\\ln\\sin x-\\ln\\sin x_0$');
  // The sliders count in steps of pi/60, so pi/6, pi/2 and 5pi/6 are exact.
  const s0 = slider('$x_0$', { id: 'x0', min: 6, max: 54, step: 1, value: 10, fmt: v => '$' + (v * PI / 60).toFixed(2) + '$', onInput: v => { x0 = v * PI / 60; draw(); } });
  const s1 = slider('$x$', { id: 'x1', min: 6, max: 54, step: 1, value: 30, fmt: v => '$' + (v * PI / 60).toFixed(2) + '$', onInput: v => { x1 = v * PI / 60; draw(); } });
  const box = h('div', 'fill');
  const cot = x => Math.cos(x) / Math.sin(x);
  const clamp = y => Math.max(-3, Math.min(3, y));
  const draw = fillPlot(box, (svg, W, H) => {
    const o = { x0: 0, x1: PI, y0: -3, y1: 3, xt: [[0, '$0$'], [PI / 2, '$\\frac{\\pi}{2}$'], [PI, '$\\pi$']],
      yt: [[-3, '$-3$'], [0, '$0$'], [3, '$3$']], xlabel: '$x$', ylabel: '$\\cos x/\\sin x$' };
    const f = frame(W, H, o);
    axes(svg, f, o);
    const lo = Math.min(x0, x1), hi = Math.max(x0, x1), sg = x1 >= x0 ? 1 : -1;
    const pts = [[f.X(x0), f.Y(0)]];
    for (let i = 0; i <= 120; i++) { const x = x0 + (x1 - x0) * i / 120; pts.push([f.X(x), f.Y(clamp(cot(x)))]); }
    pts.push([f.X(x1), f.Y(0)]);
    path(svg, pts, { fill: COL.accent, 'fill-opacity': .25, stroke: 'none' }, true);
    let run = [];
    const runs = [];
    for (let i = 0; i <= 400; i++) {
      const x = 0.02 + (PI - 0.04) * i / 400, y = cot(x);
      if (Math.abs(y) > 3) { if (run.length) runs.push(run); run = []; }
      else run.push([f.X(x), f.Y(y)]);
    }
    if (run.length) runs.push(run);
    for (const r of runs) path(svg, r, { stroke: COL.text2, 'stroke-width': 2.5 });
    rU.set('$' + Math.sin(lo).toFixed(2) + '$ to $' + Math.sin(hi).toFixed(2) + '$');
    rA.set('$' + fixed(sg * (Math.log(Math.sin(hi)) - Math.log(Math.sin(lo))), 4) + '$');
  });
  widget.append(
    hh('div', 'sliders', s0.el, s1.el),
    hh('div', 'readouts', rU.el, rA.el),
    box,
    legend([
      { color: COL.text2, text: 'solid curve: $\\cos x/\\sin x$, cut at $\\pm 3$' },
      { chip: true, color: COL.bluePale, text: 'blue area: from $x_0$ to $x$' }]));
  side.append(
    sym('$u=\\sin x$, so $du=\\cos x\\,dx$. The $x$ area equals the $u$ area from $\\sin x_0$ to $\\sin x$.'),
    triesList([
      'Set $x_0=\\pi/6$ and $x=\\pi/2$. The area is $\\ln 2=0.6931$.',
      'Set $x=5\\pi/6$. The sine is $0.5$ at both ends, so the area is $0$.',
      'Swap $x_0$ and $x$. The area changes sign.']),
    takeLine('Substitution turns a hard integral into one you know, $\\int du/u=\\ln u$. Hamming says the skill is recognizing the pattern (L22 29:59). Why it works: step 2.'));
}

// ---------- slide 2: integration by parts ----------
function slideBy(widget, side) {
  let k = 1;
  const rK = readout('k', 'bar chosen: $k$');
  const rB = readout('bk', 'value: $b_k=2(-1)^{k+1}/k$');
  const sl = slider('$k$', { id: 'k', min: 1, max: 8, step: 1, value: 1, fmt: v => '$' + v + '$', onInput: v => { k = v; draw(); } });

function slideGamma(widget, side) {
  let n = 4;
  const fact = m => { let p = 1; for (let i = 2; i <= m; i++) p *= i; return p; };
  const rA = readout('area', 'area under $t^{n-1}e^{-t}$, numeric');
  const rF = readout('fact', 'exact: $\\Gamma(n)=(n-1)!$');
  const sl = slider('$n$', { id: 'n', min: 1, max: 6, step: 1, value: 4, fmt: v => '$' + v + '$', onInput: v => { n = v; draw(); } });
  const box = h('div', 'fill');
  const f_ = (t, m) => Math.pow(t, m - 1) * Math.exp(-t);
  const draw = fillPlot(box, (svg, W, H) => {
    let peak = 0;
    for (let t = 0.01; t < 16; t += 0.01) peak = Math.max(peak, f_(t, n));
    const top = Math.ceil(peak * 1.15 * 10) / 10;
    const o = { x0: 0, x1: 16, y0: 0, y1: top, xt: [[0, '$0$'], [4, '$4$'], [8, '$8$'], [12, '$12$'], [16, '$16$']],
      yt: [[0, '0'], [top / 2, (top / 2).toFixed(1)], [top, top.toFixed(1)]], xlabel: '$t$', ylabel: '$t^{n-1}e^{-t}$' };
    const fr = frame(W, H, o);
    axes(svg, fr, o);
    const pts = [[fr.X(0), fr.Y(0)]];
    for (let i = 0; i <= 1600; i++) {
      const t = 16 * i / 1600;
      pts.push([fr.X(t), fr.Y(f_(t, n))]);
    }
    pts.push([fr.X(16), fr.Y(0)]);
    path(svg, pts, { fill: COL.accent, 'fill-opacity': .25, stroke: 'none' }, true);
    const curve = pts.slice(1, -1);
    path(svg, curve, { stroke: COL.text2, 'stroke-width': 2.5 });
    rA.set('$' + simpson(t => f_(t, n), 0, 60, 6000).toFixed(2) + '$');   // to 60, past the plot: the tail counts
    rF.set('$' + fact(n - 1) + '$');
  });
  widget.append(
    hh('div', 'sliders', sl.el),
    hh('div', 'readouts', rA.el, rF.el),
    box,
    legend([
      { color: COL.text2, text: 'solid curve: $t^{n-1}e^{-t}$ for the chosen $n$' },
      { chip: true, color: COL.bluePale, text: 'blue area: $\\Gamma(n)$' }]));
  side.append(
    sym('$t$: the variable under the integral. $n$: picks the curve $t^{n-1}e^{-t}$. For whole $n$, $\\Gamma(n)$ equals $(n-1)!=1\\cdot2\\cdots(n-1)$.'),
    triesList([
      'Set $n=4$. The area is $3!=6$.',
      'Step down to $n=3$: the area is $2$. Going up one step multiplied it by $3$.',
      'Predict the area for $n=5$, then check it. Why the pattern holds: step 7.']),
    takeLine('The integral gives $(n-1)!$ and fills in values between the whole numbers; step 9 gives $\\Gamma(1/2)=\\sqrt{\\pi}$.'));
}

// ---------- step 2: why substitution works (proof) ----------
const cotF = x => Math.cos(x) / Math.sin(x), invF = u => 1 / u;
const NSTRIP = 6, PAIR = 2;   // six strips; the third one is the pair the proof follows
// A small plot inside the box (l, t, w, ht), with tick pairs [value, label].
function panel(svg, box, o) {
  const X = v => box.l + (v - o.x0) / (o.x1 - o.x0) * box.w, Y = v => box.t + box.ht - (v - o.y0) / (o.y1 - o.y0) * box.ht;
  path(svg, [[X(o.x0), Y(o.y1)], [X(o.x0), Y(o.y0)], [X(o.x1), Y(o.y0)]], { stroke: COL.grey });
  for (const [v, s] of o.xt) { svgNode('line', { x1: X(v), x2: X(v), y1: Y(o.y0), y2: Y(o.y0) + 4, stroke: COL.grey }, svg); tickLabel(svg, X(v), Y(o.y0) + 17, s, 'middle'); }
  for (const [v, s] of o.yt) { svgNode('line', { x1: X(o.x0) - 4, x2: X(o.x0), y1: Y(v), y2: Y(v), stroke: COL.grey }, svg); tickLabel(svg, X(o.x0) - 7, Y(v), s, 'end'); }
  svgTex(svg, X(o.x1) - 2, Y(o.y0) + 17, o.xlabel, { w: 40, anchor: 'end', size: 15 });
  return { X: X, Y: Y };
}
function drawSubProof(svg, W, Hh, x0, x1, lit) {
  const top = 34, bot = 30, gap = 46, lw = (W - 44 - gap - 30) * 0.56, rw = (W - 44 - gap - 30) - lw;
  const yt = [[0, '0'], [1, '1'], [2, '2'], [3, '3']];
  const fL = panel(svg, { l: 44, t: top + 18, w: lw, ht: Hh - top - 18 - bot }, { x0: 0, x1: 1.65, y0: 0, y1: 3.4,
    xt: [[PI / 6, '$\\frac{\\pi}{6}$'], [PI / 3, '$\\frac{\\pi}{3}$'], [PI / 2, '$\\frac{\\pi}{2}$']], yt: yt, xlabel: '$x$' });
  const fR = panel(svg, { l: 44 + lw + gap, t: top + 18, w: rw, ht: Hh - top - 18 - bot }, { x0: 0, x1: 1.1, y0: 0, y1: 3.4,
    xt: [[0.5, '0.5'], [1, '1']], yt: yt, xlabel: '$u$' });
  const CAP = {
    u: String.raw`amber: the $u$ area under $\frac1u$; its antiderivative is $\ln u$`,
    pair: String.raw`amber: a strip $h$ wide at $x$; its image is $\Delta u\approx u'(x)\,h$ wide`,
    match: String.raw`amber: heights $\frac{\cos x}{\sin x}$ and $\frac1u$, widths $h$ and $\Delta u\approx\cos x\,h$: same area`,
    areas: String.raw`amber: the whole $x$ area and the whole $u$ area, equal` }[lit];
  if (CAP) litCaption(svg, W, CAP);
  else {
    svgTex(svg, 44 + lw / 2, top - 4, String.raw`$\frac{\cos x}{\sin x}$ over $x$`, { w: lw, size: 15, fill: COL.muted });
    svgTex(svg, 44 + lw + gap + rw / 2, top - 4, String.raw`$\frac1u$ over $u=\sin x$`, { w: rw + 40, size: 15, fill: COL.muted });
  }
  const xs = i => x0 + (x1 - x0) * i / NSTRIP;
  for (let i = 0; i < NSTRIP; i++) {
    const attrs = { fill: COL.accent, 'fill-opacity': i % 2 ? .16 : .38, stroke: 'none', 'data-item': 'mark' };
    path(svg, underPts(fL, cotF, xs(i), xs(i + 1), 24), Object.assign({ 'data-id': 'x-strip-' + (i + 1) }, attrs), true);
    path(svg, underPts(fR, invF, Math.sin(xs(i)), Math.sin(xs(i + 1)), 24), Object.assign({ 'data-id': 'u-strip-' + (i + 1) }, attrs), true);
  }
  if (lit === 'u' || lit === 'areas') glowFill(svg, underPts(fR, invF, Math.sin(x0), Math.sin(x1), 80));
  if (lit === 'areas') glowFill(svg, underPts(fL, cotF, x0, x1, 80));
  const a = xs(PAIR), b = xs(PAIR + 1);
  if (lit === 'pair' || lit === 'match') {
    glowFill(svg, underPts(fL, cotF, a, b, 24));
    glowFill(svg, underPts(fR, invF, Math.sin(a), Math.sin(b), 24));
    svgTex(svg, (fL.X(a) + fL.X(b)) / 2, fL.Y(0) - 11, '$h$', { w: 30, size: 15, fill: COL.ink });
    svgTex(svg, (fR.X(Math.sin(a)) + fR.X(Math.sin(b))) / 2, fR.Y(0) - 11, '$\\Delta u$', { w: 40, size: 15, fill: COL.ink });
  }
  if (lit === 'match') {
    svgTex(svg, fL.X(b) + 4, fL.Y(cotF(a)) - 4, '$\\frac{\\cos x}{\\sin x}$', { w: 60, anchor: 'start', size: 15, fill: COL.ink });
    svgTex(svg, fR.X(Math.sin(b)) + 4, fR.Y(invF(Math.sin(a))) - 4, '$\\frac1u$', { w: 40, anchor: 'start', size: 15, fill: COL.ink });

    const x = 0.3 + (1.65 - 0.3) * i / 160; cL.push([fL.X(x), fL.Y(Math.min(3.4, cotF(x)))]);
    const u = 0.295 + (1.1 - 0.295) * i / 160; cR.push([fR.X(u), fR.Y(Math.min(3.4, invF(u)))]);

  for (const x of [x0, x1]) {
    svgNode('circle', { cx: fL.X(x), cy: fL.Y(0), r: 3.5, fill: COL.ink }, svg);
    svgNode('circle', { cx: fR.X(Math.sin(x)), cy: fR.Y(0), r: 3.5, fill: COL.ink }, svg);
  }
}

// The curve (u, v) = (x, sin x) for x from 0 to pi/2: the rectangle u v splits into int v du and int u dv.
function drawPartsProof(svg, W, Hh, x, hs, lit) {
  const o = { x0: 0, x1: 1.75, y0: 0, y1: 1.15, xt: [[0, '$0$'], [0.5, '$0.5$'], [1, '$1$'], [PI / 2, '$\\frac{\\pi}{2}$']],
    yt: [[0, '$0$'], [0.5, '$0.5$'], [1, '$1$']], xlabel: '$u=x$', ylabel: '$v=\\sin x$' };
  const f = frame(W, Hh, o, PM);
  const he = Math.max(0, Math.min(hs, PI / 2 - x)), v = Math.sin(x), v2 = Math.sin(x + he);
  const CAP = {
    strips: String.raw`amber: the rectangle's growth: top strip $u\,\Delta v$, side strip $v\,\Delta u$, corner`,
    corner: String.raw`amber: the corner $\Delta u\,\Delta v$, small times small`,
    fill: String.raw`amber: the two areas fill the rectangle $uv$`,
    left: String.raw`amber: $\int u\,dv$, the rectangle minus $\int v\,du$` }[lit];
  if (CAP) litCaption(svg, W, CAP);
  else plainCaption(svg, W, String.raw`walk along the curve $(u,v)=(x,\sin x)$; the rectangle $u\times v$ grows`);
  axes(svg, f, o);
  const curvePts = (a, b) => { const p = []; for (let i = 0; i <= 60; i++) { const t = a + (b - a) * i / 60; p.push([f.X(t), f.Y(Math.sin(t))]); } return p; };
  const leftRegion = [[f.X(0), f.Y(0)]].concat(curvePts(0, x), [[f.X(0), f.Y(v)]]);
  path(svg, underPts(f, Math.sin, 0, x, 60), { fill: COL.accent, 'fill-opacity': .28, stroke: 'none', 'data-item': 'mark', 'data-id': 'v-du' }, true);
  path(svg, leftRegion, { fill: COL.orange, 'fill-opacity': .3, stroke: 'none', 'data-item': 'mark', 'data-id': 'u-dv' }, true);
  if (lit === 'fill') glowFill(svg, boxPts(f, 0, x, 0, v));
  if (lit === 'left') glowFill(svg, leftRegion);
  if (lit === 'strips' && he > 0) { glowFill(svg, boxPts(f, 0, x, v, v2)); glowFill(svg, boxPts(f, x, x + he, 0, v)); }
  if ((lit === 'strips' || lit === 'corner') && he > 0) glowFill(svg, boxPts(f, x, x + he, v, v2));
  path(svg, boxPts(f, 0, x, 0, v), { stroke: COL.ink, 'stroke-width': 1.5, 'stroke-dasharray': '6 4', 'data-item': 'mark', 'data-id': 'rectangle' }, true);
  if (he > 0) {
    path(svg, boxPts(f, 0, x, v, v2), { stroke: COL.orange, 'stroke-width': 1.5 }, true);
    path(svg, boxPts(f, x, x + he, 0, v), { stroke: COL.accent, 'stroke-width': 1.5 }, true);
    path(svg, boxPts(f, x, x + he, v, v2), { stroke: COL.ink, 'stroke-width': 1.5 }, true);
    svgTex(svg, f.X(x / 2), f.Y(v2) - 12, '$u\\,\\Delta v$', { w: 70, size: 15, fill: COL.orangeDeep });
    svgTex(svg, f.X(x + he) + 6, f.Y(v / 2), '$v\\,\\Delta u$', { w: 70, anchor: 'start', size: 15, fill: COL.blueDeep });
  }
  path(svg, curvePts(0, PI / 2), { stroke: COL.text2, 'stroke-width': 2.5 });
  dot(svg, f.X(x), f.Y(v), COL.ink);
  if (x > 0.6) {
    svgTex(svg, f.X(x * 0.28), f.Y(v * 0.68), '$\\int u\\,dv$', { w: 70, size: 15, fill: COL.orangeDeep });
    svgTex(svg, f.X(x * 0.7), f.Y(v * 0.28), '$\\int v\\,du$', { w: 70, size: 15, fill: COL.blueDeep });
  }
}

// ---------- step 5: why b_k = 2(-1)^(k+1)/k (proof) ----------

    halves: String.raw`amber: the left half, the mirror image of the right: $x\sin kx$ is even`,
    parts: String.raw`amber: $-\frac{x\cos kx}{k}$, the $uv$ part; at $x=\pi$ it is $-\frac{\pi(-1)^k}{k}$`,
    ends: String.raw`amber: the right half, $-\frac{\pi(-1)^k}{k}=` + fixed(end, 3) + String.raw`$, which is $\frac{\pi}{2}b_k$` }[lit];

  for (const [a, b] of arches) {

  const yt = [];

  const o = { x0: 0, x1: 16, y0: 0, y1: top, xt: [[0, '$0$'], [4, '$4$'], [8, '$8$'], [12, '$12$'], [16, '$16$']],
    yt: yt, xlabel: '$t$', ylabel: '$t^{n-1}e^{-t}$' };

    parts: String.raw`amber: $t^{n-1}e^{-t}$ and $(n-1)\,t^{n-2}e^{-t}$, the two curves of line 1`,
    tail: String.raw`amber: the ends of $t^{n-1}e^{-t}$: 0 at $t=0$, dying out as $t\to\infty$`,

  path(svg, underPts(f, t => gPow(t, n), 0, 16, 320), { fill: COL.accent, 'fill-opacity': .25, stroke: 'none', 'data-item': 'mark', 'data-id': 'area' }, true);
  if (lit === 'parts') { glowPath(svg, line(t => gPow(t, n), 0, 16), 9); glowPath(svg, line(dash, 0, 16), 9); }

// ---------- step 8: why a polar patch is r dr dθ (proof) ----------
const TH0 = 0.35;   // the patch starts this many radians above the x axis
function fmtArea(v) {

function drawPatch(svg, W, Hh, r, dr, dth, lit) {

  const S = Math.max(80, Math.min(ph, W * 0.46));

  const cx = 8 + S / 2, cy = top + ph / 2;

  const a0 = TH0, a1 = TH0 + dth, N = Math.round(2 * PI / dth);

    wedge: String.raw`amber: the wedge $W(r+dr)$, the share $d\theta/2\pi$ of the disc`,
    two: String.raw`amber: $W(r)$, cut out of $W(r+dr)$; the patch is what is left`,
    split: String.raw`amber: the rectangle $dr\times r\,d\theta$, area $r\,dr\,d\theta$`,
    extra: String.raw`amber: the slivers outside the rectangle, $\tfrac12\,dr^2\,d\theta$ in all`,
    limit: String.raw`amber: the side $dr$; as it shrinks, the slivers vanish` }[lit];
  if (CAP) litCaption(svg, W, CAP);

  svgNode('circle', { cx: cx, cy: cy, r: U }, cp);
  const g = svgNode('g', { 'clip-path': 'url(#disc-clip)' }, svg);

    const v = k * 0.2;

    const rho = r + k * m * dr;

    path(svg, sectorPts(P, 0, r + dr, a0, a1), { stroke: COL.amber, 'stroke-width': 2, 'stroke-dasharray': '4 3' }, true);
    if (r > 0) glowFill(svg, sectorPts(P, 0, r, a0, a1));
  }
  path(svg, sectorPts(P, r, r + dr, a0, a1), { fill: COL.orangeBright, stroke: COL.orange, 'stroke-width': 1.5, 'data-item': 'mark', 'data-id': 'patch' }, true);
  if (lit === 'wedge') {   // the whole wedge, patch included
    glowFill(svg, sectorPts(P, 0, r + dr, a0, a1));
    path(svg, sectorPts(P, r, r + dr, a0, a1), { stroke: COL.orange, 'stroke-width': 1.5 }, true);
  }
  svgNode('circle', { cx: cx, cy: cy, r: U, fill: 'none', stroke: COL.muted, 'stroke-width': 1.5 }, svg);
  const am = (a0 + a1) / 2;
  if (r * U > 22) {

    const q = P(r / 2, am);

  }

  // The patch, magnified and turned so that its middle points up.

      glowFill(svg, pts);
    }
  }
  if (lit === 'limit') glowPath(svg, [Q(r, hlf), Q(r + dr, hlf)], 12);
  path(svg, patchPts, { stroke: COL.orange, 'stroke-width': 2 }, true);
  if (r > 0) path(svg, rect, { stroke: COL.ink, 'stroke-width': 1.5, 'stroke-dasharray': '5 4', 'data-item': 'mark', 'data-id': 'rectangle' }, true);
  const mid = Q(r + dr / 2, hlf);
  svgTex(svg, mid[0] + 8, mid[1], '$dr$', { w: 50, anchor: 'start', size: 15, fill: COL.ink, bg: lit === 'limit' ? COL.amberBg : null });
  const inner = Z(0, r), outer = Z(0, r + dr);
  svgTex(svg, inner[0], inner[1] + 15, r > 0 ? '$r\\,d\\theta$' : '$r\\,d\\theta=0$', { w: 90, size: 15, fill: COL.ink });
  svgTex(svg, outer[0], outer[1] - 13, '$(r+dr)\\,d\\theta$', { w: 130, size: 15, fill: COL.ink });
  if (rx1[0] - rx0[0] > 84 && rx1[1] - rx0[1] > 26)
    svgTex(svg, zcx, (rx0[1] + rx1[1]) / 2, '$r\\,dr\\,d\\theta$', { w: 90, size: 15, fill: COL.ink });
}
function slidePatch(widget, side) {
  let r = 0.4, dr = 0.1, nw = 12, lit = '';
  const dth = () => 2 * PI / nw;
  const sR = slider('$r$', { id: 'r', min: 0, max: 0.8, step: 0.01, value: r, fmt: v => '$' + v.toFixed(2) + '$', onInput: v => { r = v; update(); } });
  const sD = slider('$dr$', { id: 'dr', min: 0.01, max: 0.2, step: 0.005, value: dr, fmt: v => '$' + v.toFixed(3) + '$', onInput: v => { dr = v; update(); } });
  // Moving right widens the wedge: the input runs over minus the number of wedges in a turn.
  const sT = slider('$d\\theta$', { id: 'dtheta', min: -125, max: -6, step: 1, value: -nw, fmt: v => '$' + (2 * PI / -v).toFixed(3) + '$', onInput: v => { nw = -v; update(); } });
  const rE = readout('exact', 'exact area of the patch');
  const rM = readout('main', String.raw`$r\,dr\,d\theta$`);
  const rQ = readout('ratio', 'ratio of the two');
  const plot = proofLeft(widget, {
    controls: [sR.el, sD.el, sT.el],
    draw: (svg, W, Hh) => drawPatch(svg, W, Hh, r, dr, dth(), lit),
    legend: [
      { color: COL.grey, text: String.raw`grey: $dx\,dy$` },
      { color: COL.accent2, text: 'blue: polar grid' },
      { chip: true, color: COL.orangeBright, text: 'orange: patch' },
      { dash: true, color: COL.ink, text: String.raw`dashed: $dr\times r\,d\theta$` }],
    readouts: [rE, rM, rQ],
    tests: [
      String.raw`Which blue cells are bigger? Move $r$ from $0.4$ to $0.8$: the patch nearly doubles, $0.02356$ to $0.04451$. Squares never change.`,
      String.raw`Shrink $dr$ to $0.01$: the ratio falls to $1.0125$. Cases are evidence, not proof.`],
    model: String.raw`Zoomed in, the patch is almost a rectangle, $dr$ by the arc $r\,d\theta$ (a radian cuts an arc one radius long, Primer · Waves, step 4). Twice as far out, twice as wide: that is the $r$.` });
  proofRight(side, {
    id: 'polar-patch',
    goal: { tex: String.raw`\frac{\text{patch area}}{r\,dr\,d\theta}\to1\ \text{ as } dr\to0`,
      words: String.raw`for the patch from $r>0$ to $r+dr$, angle $d\theta$.` },
    facts: [
      { tex: String.raw`\pi\rho^2`, words: String.raw`is the area of a disc of radius $\rho$` },
      { words: String.raw`a full turn is $2\pi$ radians`, ref: 'Primer · Waves, step 4' }],
    lines: [
      { tex: String.raw`W(\rho)=\tfrac{d\theta}{2\pi}\,\pi\rho^2=\tfrac12\rho^2\,d\theta`, move: 'Use symmetry',
        why: String.raw`$W(\rho)$: the wedge out to $\rho$. A turn of the disc moves one wedge onto the next: all are equal`,
        choices: ['Unfold the definition', 'Compute it two ways'], highlight: 'wedge' },
      { tex: String.raw`\text{patch}=W(r+dr)-W(r)`, move: 'Unfold the definition',
        why: 'the big wedge with the small one cut out', choices: ['Telescope', 'Name a piece'], highlight: 'two' },
      { tex: String.raw`\text{patch}=r\,dr\,d\theta+\tfrac12\,dr^2\,d\theta`, move: 'Rearrange',
        why: String.raw`line 1 gives $\tfrac12\big((r+dr)^2-r^2\big)d\theta$; expand, and $r^2$ cancels. The first part is the rectangle`,
        choices: ['Use an earlier result', 'Add zero or multiply by one'], highlight: 'split' },
      { tex: String.raw`\frac{\tfrac12\,dr^2\,d\theta}{r\,dr\,d\theta}=\frac{dr}{2r}`, move: 'Compare or bound',
        why: String.raw`the extra part is smaller than the main part by the factor $dr/2r$`, choices: ['Rearrange', 'Contradiction'], highlight: 'extra' },
      { tex: String.raw`\frac{\text{patch area}}{r\,dr\,d\theta}=1+\frac{dr}{2r}\to1`, move: 'Take a limit',
        why: String.raw`let $dr\to0$, $r>0$ fixed: in a sum of patches, $r\,dr\,d\theta$ can stand for the area`,
        choices: ['Compare or bound', 'Induction'], highlight: 'limit' }],
    lookBack: [
      { q: 'What did the proof use?',
        a: String.raw`The disc area $\pi\rho^2$ and a turn of $2\pi$ radians (in degrees each patch carries an extra $\pi/180$). The arc $r\,d\theta$ was only in the picture; the proof confirms it.` },
      { q: String.raw`What happens at $r=0$?`,
        a: String.raw`The patch is a thin triangle, $\tfrac12dr^2\,d\theta$, and $r\,dr\,d\theta=0$: the ratio fails. No harm: the patches at the center make a disc of area $\pi\,dr^2\to0$.` },
      { q: 'Where does the same idea go?',
        a: String.raw`A ring of patches has area $2\pi r\,dr$, circumference times width, like Hamming's shells in $n$ dimensions (L9 17:06). In 3D: $r^2\sin\varphi\,dr\,d\varphi\,d\theta$, to recognize only.` }] },
    plot, key => { lit = key || ''; plot.redraw(); });
  function update() {
    const t = dth(), ex = 0.5 * ((r + dr) * (r + dr) - r * r) * t, mn = r * dr * t;
    rE.set(fmtArea(ex));
    rM.set(r > 0 ? fmtArea(mn) : '$0$');
    rQ.set(r > 0 ? '$' + (ex / mn).toFixed(4) + '$' : String.raw`none: $r\,dr\,d\theta=0$`);
    plot.redraw();
  }
  update();
}

// ---------- step 9: the bell curve through polar coordinates (proof) ----------
let I_SUM = 0;   // the area under e^{-x^2} by thin rectangles, for the test
for (let i = 0; i < 16000; i++) { const x = -8 + (i + 0.5) * 0.001; I_SUM += Math.exp(-x * x) * 0.001; }
function drawBell(svg, W, Hh, R, lit) {
  const top = 24, bot = 4, ph = Hh - top - bot;
  const S = Math.max(100, Math.min(ph, W * 0.5));
  const CAP = {
    axes: String.raw`amber: the same area $I$, once along $x$ and once along $y$`,
    cell: String.raw`amber: one cell, a column $e^{-x^2}e^{-y^2}\,dx\,dy$; all cells add to the volume`,
    circle: String.raw`amber: on this circle the height $e^{-(x^2+y^2)}=e^{-r^2}$ is the same all round`,
    patch: String.raw`amber: a polar patch, height $e^{-r^2}$, base $r\,dr\,d\theta$ (step 8)`,
    wedge: String.raw`amber: one wedge out to $\infty$, volume $\tfrac12\,d\theta$`,
    all: String.raw`amber: all the way round, $2\pi\cdot\tfrac12=\pi$` }[lit];
  if (CAP) litCaption(svg, W, CAP);
  const u = S / 6.6, cx = W - 6 - S / 2, cy = top + ph / 2;
  // Left: the curve e^{-x^2} and its area I.
  const L0 = 44, L1 = Math.max(L0 + 100, W - S - 34), B = top + ph - 22, T = top + 10;
  const X = x => L0 + (x + 3) / 6 * (L1 - L0), Y = y => B - y / 1.05 * (B - T);
  if (!CAP) svgTex(svg, (L0 + L1) / 2, 12, 'the area $I$ under $e^{-x^2}$', { w: L1 - L0 + 40, size: 14, fill: COL.muted });
  const curve = [];
  for (let i = 0; i <= 160; i++) { const x = -3 + 6 * i / 160; curve.push([X(x), Y(Math.exp(-x * x))]); }
  path(svg, [[X(-3), Y(0)]].concat(curve, [[X(3), Y(0)]]), { fill: COL.accent, 'fill-opacity': .25, stroke: 'none', 'data-item': 'mark', 'data-id': 'area-I' }, true);
  if (lit === 'axes') glowPath(svg, curve, 10);
  path(svg, curve, { stroke: COL.text2, 'stroke-width': 2.5 });
  path(svg, [[L0, T], [L0, B], [L1, B]], { stroke: COL.grey, 'stroke-width': 1 });
  for (const v of [-2, -1, 0, 1, 2]) {
    svgNode('line', { x1: X(v), x2: X(v), y1: B, y2: B + 4, stroke: COL.grey }, svg);
    svgText(svg, X(v), B + 18, String(v), { 'text-anchor': 'middle' });
  }
  for (const v of [0, 1]) svgText(svg, L0 - 8, Y(v) + 5, String(v), { 'text-anchor': 'end' });
  svgTex(svg, X(0), Y(0.35), '$I$', { w: 40, size: 17, fill: COL.blueDeep });
  svgTex(svg, L1 - 4, B + 18, '$x$', { w: 30, size: 15, anchor: 'end' });

  // Right: the round bell e^{-(x^2+y^2)} seen from above, with a grid of squares.
  if (!CAP) svgTex(svg, W - 4, 12, 'the bell $e^{-(x^2+y^2)}$ from above', { w: S + 120, anchor: 'end', size: 14, fill: COL.muted });
  const P = (rho, a) => [cx + rho * Math.cos(a) * u, cy - rho * Math.sin(a) * u];
  const grad = svgNode('radialGradient', { id: 'gbell', cx: '50%', cy: '50%', r: '50%' }, svgNode('defs', {}, svg));
  for (let i = 0; i <= 12; i++) {
    const rr = 3 * i / 12;
    svgNode('stop', { offset: (100 * i / 12) + '%', 'stop-color': COL.accent, 'stop-opacity': Math.exp(-rr * rr).toFixed(4) }, grad);
  }
  svgNode('circle', { cx: cx, cy: cy, r: 3 * u, fill: 'url(#gbell)', 'data-item': 'mark', 'data-id': 'bell' }, svg);
  for (let k = -6; k <= 6; k++) {
    const v = k * 0.5;
    svgNode('line', { x1: cx + v * u, x2: cx + v * u, y1: cy - 3 * u, y2: cy + 3 * u, stroke: COL.grey, 'stroke-opacity': .55 }, svg);
    svgNode('line', { y1: cy + v * u, y2: cy + v * u, x1: cx - 3 * u, x2: cx + 3 * u, stroke: COL.grey, 'stroke-opacity': .55 }, svg);
  }
  if (lit === 'axes') { glowPath(svg, [[cx - 3.2 * u, cy], [cx + 3.2 * u, cy]], 9); glowPath(svg, [[cx, cy - 3.2 * u], [cx, cy + 3.2 * u]], 9); }
  if (lit === 'cell' || lit === 'circle') glowFill(svg, [[cx + 1 * u, cy - 1 * u], [cx + 1.5 * u, cy - 1 * u], [cx + 1.5 * u, cy - 0.5 * u], [cx + 1 * u, cy - 0.5 * u]]);
  if (lit === 'circle') svgNode('circle', { cx: cx, cy: cy, r: Math.hypot(1.25, 0.75) * u, fill: 'none', stroke: COL.amberBg, 'stroke-width': 8 }, svg);
  if (lit === 'patch') glowFill(svg, sectorPts(P, 1.25, 1.75, 0.35, 0.75));
  if (lit === 'wedge') glowFill(svg, sectorPts(P, 0, 3, 0.35, 0.75));
  if (lit === 'all') svgNode('circle', { cx: cx, cy: cy, r: 3 * u, fill: 'none', stroke: COL.amberBg, 'stroke-width': 10 }, svg);
  svgNode('line', { x1: cx - 3.2 * u, x2: cx + 3.2 * u, y1: cy, y2: cy, stroke: COL.muted }, svg);
  svgNode('line', { x1: cx, x2: cx, y1: cy - 3.2 * u, y2: cy + 3.2 * u, stroke: COL.muted }, svg);
  for (const v of [-2, 2]) {
    svgText(svg, cx + v * u, cy + 16, String(v), { 'text-anchor': 'middle', 'font-size': 13 });
    svgText(svg, cx - 6, cy - v * u + 4, String(v), { 'text-anchor': 'end', 'font-size': 13 });
  }
  svgTex(svg, cx + 3.15 * u, cy + 14, '$x$', { w: 30, size: 15 });
  svgTex(svg, cx + 12, cy - 3.15 * u, '$y$', { w: 30, size: 15 });
  if (R > 0) svgNode('circle', { cx: cx, cy: cy, r: R * u, fill: 'none', stroke: COL.ink, 'stroke-width': 2, 'stroke-dasharray': '6 4', 'data-item': 'mark', 'data-id': 'disc-R' }, svg);
  if (R > 0.3) svgTex(svg, cx - R * u * 0.72 - 10, cy + R * u * 0.72 + 10, '$R$', { w: 30, size: 15, fill: COL.ink });
}
function slideDouble(widget, side) {
  let R = 1, lit = '';
  const sl = slider('radius $R$', { id: 'R', min: 0, max: 3, step: 0.05, value: R, fmt: v => '$' + v.toFixed(2) + '$', onInput: v => { R = v; update(); } });
  const rV = readout('vol', 'volume over the disc');
  const rT = readout('target', String.raw`all of it: $\pi$`);
  const rI = readout('I-sum', String.raw`$I$ by thin rectangles`);
  rT.set('$' + PI.toFixed(4) + '$');
  rI.set('$' + I_SUM.toFixed(4) + '$');
  const plot = proofLeft(widget, {
    controls: [sl.el],
    draw: (svg, W, Hh) => drawBell(svg, W, Hh, R, lit),
    legend: [
      { chip: true, color: COL.blueLight, text: 'blue: the bell, strongest at the centre' },
      { color: COL.grey, text: String.raw`grey: $dx\,dy$ squares` },
      { dash: true, color: COL.ink, text: 'dashed: radius $R$' }],
    readouts: [rV, rT, rI],
    tests: [
      String.raw`Guess: about 1 high and 2 wide, so a bit under 2. Thin rectangles give $1.7725=\sqrt{\pi}$.`,
      String.raw`Set $R=1$: the disc holds $1.986$, $63\%$ of $\pi$; at $R=3$, $3.1412$. Evidence, not proof.`],
    model: String.raw`The volume under the round bell is $I\cdot I$. The bell is round, so cut that volume into rings, not squares: each ring has one height $e^{-r^2}$, and the patch brings an $r$.` });
  proofRight(side, {
    id: 'bell-integral',
    goal: { tex: String.raw`\textstyle I=\int_{-\infty}^{\infty}e^{-x^2}\,dx=\sqrt{\pi}` },
    facts: [
      { tex: String.raw`\iint f\,dx\,dy`, words: String.raw`is the volume under $f$` },
      { tex: String.raw`dx\,dy\to r\,dr\,d\theta`, words: 'for a polar patch', ref: 'step 8' }],
    lines: [
      { tex: String.raw`\textstyle I\cdot I=\int e^{-x^2}dx\int e^{-y^2}dy`, move: 'Unfold the definition',
        why: String.raw`$I$ twice, each from $-\infty$ to $\infty$; the second copy uses the letter $y$, which changes nothing`,
        choices: ['Name a piece', 'Take a limit'], highlight: 'axes' },
      { tex: String.raw`\textstyle =\iint e^{-x^2}e^{-y^2}\,dx\,dy`, move: 'Rearrange',
        why: String.raw`each integral is a sum of thin strips (Integrals: area, step 3); a product of sums is the sum of all products, $(a+b)(c+d)=ac+ad+bc+bd$: one column per grid cell`,
        choices: ['Telescope', 'Compute it two ways'], highlight: 'cell' },
      { tex: String.raw`\textstyle =\iint e^{-(x^2+y^2)}\,dx\,dy`, move: 'Use an earlier result',
        why: String.raw`$e^ae^b=e^{a+b}$ (Primer · Exponentials, step 2): the height depends only on $r^2=x^2+y^2$`,
        choices: ['Rearrange', 'Use symmetry'], highlight: 'circle' },
      { tex: String.raw`\textstyle =\int_0^{2\pi}\!\!\int_0^{\infty}e^{-r^2}\,r\,dr\,d\theta`, move: 'Compute it two ways',
        why: String.raw`the same volume, cut into polar patches: height $e^{-r^2}$, base $r\,dr\,d\theta$ (step 8)`,
        choices: ['Use symmetry', 'Take a limit'], highlight: 'patch' },
      { tex: String.raw`\textstyle \int_0^{\infty}e^{-r^2}\,r\,dr=\tfrac12\int_0^{\infty}e^{-u}\,du=\tfrac12`, move: 'Change variables',
        why: String.raw`$u=r^2$, so $r\,dr=du/2$ (step 1); $\int_0^\infty e^{-u}du=1$`,
        choices: ['Use an earlier result', 'Undo with the inverse'], highlight: 'wedge' },
      { tex: String.raw`I^2=2\pi\cdot\tfrac12=\pi,\quad I=\sqrt{\pi}`, move: 'Undo with the inverse',
        why: String.raw`no $\theta$ inside: the turn gives $2\pi$. Then the square root, as $I>0$`,
        choices: ['Rearrange', 'Contradiction'], highlight: 'all' }],
    lookBack: [
      { q: 'Where did the bell need to be round?',
        a: String.raw`In line 4: $e^{-r^2}$ has one height on each circle. For $e^{-x^4}$ the trick fails: $x^4+y^4$ changes around a circle.` },
      { q: String.raw`Why does the extra $r$ matter?`,
        a: String.raw`$e^{-r^2}$ has no antiderivative you can write down; $e^{-r^2}r$ is the slope of $-\tfrac12e^{-r^2}$. The patch supplies that $r$.` },
      { q: 'What else does it give?',
        a: String.raw`$\Gamma(\tfrac12)=\sqrt{\pi}$ (step 6): put $t=x^2$ in $\int_0^\infty t^{-1/2}e^{-t}\,dt$. The normal curve's $\tfrac1{\sqrt{2\pi}}$ comes from it (Primer · Distributions).` }] },
    plot, key => { lit = key || ''; plot.redraw(); }, CLOSING);
  side.querySelector('fl-proof-steps').primerMoves = PRIMER_MOVES;
  side.querySelector('fl-proof-steps').endNote = NEXT;
  function update() {
    rV.set('$' + (PI * (1 - Math.exp(-R * R))).toFixed(4) + '$');
    plot.redraw();
  }
  update();
}

// ---------- frame ----------
const SLIDES = [
  { id: 'substitution', title: 'How does substitution work?', tag: 'Used in L22 29:59-32:35 · L9 12:48 · L7 11:26',
    question: String.raw`Why is $\int \cos x/\sin x\,dx$ the same as $\int du/u$?`,
    formula: String.raw`$$\int\frac{\cos x}{\sin x}\,dx=\int\frac{du}{u}=\ln\sin x$$`, mount: slideSub },
  { id: 'why-substitution', proof: true, title: String.raw`Why it's true: $\int\frac{\cos x}{\sin x}\,dx=\ln\sin x$`, tag: 'Used in L22 29:59-32:35 · L9 12:48 · L7 11:26',
    question: String.raw`Why may you trade $\cos x\,dx$ for $du$?`, mount: slideWhySub },
  { id: 'by-parts', title: 'How does integration by parts work?', tag: 'Used in L9 07:28 · L14 40:13 · L15 31:45',
    question: String.raw`Why do the Fourier coefficients of $x$ shrink like $1/k$?`,
    formula: String.raw`$$\int u\,dv=uv-\int v\,du$$`, mount: slideBy },
  { id: 'why-by-parts', proof: true, title: String.raw`Why it's true: $\int u\,dv=uv-\int v\,du$`, tag: 'Used in L9 07:28 · L14 40:13 · L15 31:45',
    question: String.raw`Where does the rule for parts come from?`, mount: slideWhyParts },
  { id: 'why-bk', proof: true, title: String.raw`Why it's true: $b_k=2(-1)^{k+1}/k$`, tag: 'Used in L14 40:13 · L15 31:45',
    question: String.raw`How does one step of parts give the bars of step 3?`, mount: slideWhyBk },
  { id: 'gamma', title: 'An integral can define a new function', tag: 'Used in L9 11:08-11:42',
    question: String.raw`Which integral gives $(n-1)!$, and why does the pattern hold?`,
    formula: String.raw`$$\Gamma(n)=\int_0^\infty t^{n-1}e^{-t}\,dt$$`, mount: slideGamma },
  { id: 'why-gamma', proof: true, title: String.raw`Why it's true: $\Gamma(n)=(n-1)!$`, tag: 'Used in L9 11:08-11:42',
    question: String.raw`Why does the area under $t^{n-1}e^{-t}$ count a factorial?`, mount: slideWhyGamma },
  { id: 'polar-patch', proof: true, title: String.raw`Why it's true: a polar patch has area $r\,dr\,d\theta$`, tag: 'Used in L9 14:26 · L9 17:06',
    question: String.raw`Why is a small polar patch $r\,dr\,d\theta$, and not just $dr\,d\theta$?`,
    mount: slidePatch },
  { id: 'double-integral', proof: true, title: String.raw`Why it's true: $\int_{-\infty}^{\infty}e^{-x^2}dx=\sqrt{\pi}$`, tag: 'Used in L9 13:51-15:28 · L20 06:49',
    question: String.raw`What is the total area under the bell curve $e^{-x^2}$?`,
    mount: slideDouble },
];
// The view's close. The primer's last proof lists every move the primer's proofs used, in order of first
// use, once it is proved, so the list never gives a pick away; the last step names what comes next.
const CLOSING = 'Look back: under the picture.';
const PRIMER_MOVES = ['Name a piece', 'Compare or bound', 'Rearrange', 'Use symmetry', 'Take a limit', 'Telescope', 'Use an earlier result', 'Unfold the definition', 'Change variables', 'Undo with the inverse', 'Induction', 'Compute it two ways'];
const NEXT = 'Next: Primer · Vectors.';

let cur = 0, shownId = null, endSent = false;
function goTo(i) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  if (shownId !== null && shownId !== s.id) emit('view.step', { step: s.id });
  shownId = s.id;
  const stage = $('#stage');
  stage.innerHTML = '';
  PLOTS = [];
  COL = readPalette();
  const widget = h('div', 'widget');
  const side = hh('div', 'side',
    h('div', 'tag', s.tag),
    setTex(h('h2'), s.title),
    setTex(h('p', 'question'), s.question),
    s.formula ? setTex(h('div', 'formula'), s.formula) : null);
  const sec = mark(h('section', 'slide' + (s.proof ? ' proof-slide' : '')), 'step', s.id, s.title.replace(/\$/g, ''));
  sec.append(widget, side);
  stage.append(sec);
  stage.scrollTop = 0;
  s.mount(widget, side);
  if (cur === SLIDES.length - 1 && !endSent) { endSent = true; emit('view.action', { action: 'deck-end' }); }
  tex(sec);
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, i) => d.classList.toggle('on', i === cur));
}
// A cue is a state: go to the named step, and do nothing if it is already shown.
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i >= 0 && i !== cur) goTo(i);
}
(function init() {
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = s.title.replace(/\$/g, '');
    b.addEventListener('click', () => goTo(i));
    $('#dots').append(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],textarea,select')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
})();
</script>

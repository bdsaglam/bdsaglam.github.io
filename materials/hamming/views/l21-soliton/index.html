<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solitons: a pulse that holds its shape</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><script src="../../components/theme.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:var(--pal-bg);color:var(--pal-fg);font:18px/1.42 system-ui,sans-serif}main{height:100vh;padding:24px 30px;display:grid;grid-template-rows:50px 1fr 48px;gap:16px}header,footer{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:24px;margin:0}h2{font-size:30px;line-height:1.15;margin:0 0 16px}.body{display:grid;grid-template-columns:59% 1fr;gap:28px;min-height:0}.lab{display:flex;flex-direction:column;gap:16px;min-height:0;padding:22px;border:1px solid var(--pal-line);border-radius:14px;background:var(--pal-panel)}.lesson{display:flex;flex-direction:column;padding:8px 0;min-height:0}p{margin:0 0 15px}.question{font-size:21px}.defs{font-size:17px;color:var(--pal-text-2)}ol{padding-left:26px;margin:0 0 18px}li{padding:4px 0}.take{margin-top:auto;border-radius:10px;padding:16px;background:var(--pal-accent-soft)}.tag,.source,.pages{font-size:16px;color:var(--pal-muted)}a{color:var(--pal-accent-deep)}button{font:inherit;color:var(--pal-fg);border:1px solid var(--pal-line);border-radius:8px;padding:9px 14px;background:var(--pal-soft);cursor:pointer}button:hover{background:var(--pal-accent-soft)}button:disabled{opacity:.45;cursor:default}#dots{display:flex;gap:6px}#dots button{padding:6px 10px;font-size:16px}#dots .active{border-color:var(--pal-accent);background:var(--pal-accent-soft)}.chart{flex:1;min-height:0;position:relative}.chart svg{width:100%;height:100%}.legend{display:flex;gap:20px;flex-wrap:wrap;font-size:16px}.legend span:before{content:'';display:inline-block;width:24px;height:4px;background:var(--c);vertical-align:middle;margin-right:7px}.readout{padding:13px;background:var(--pal-soft);border-radius:8px;min-height:55px;font-size:17px}.controls{display:flex;align-items:center;gap:14px}.controls label{display:flex;align-items:center;gap:18px;flex:1}input{flex:1;accent-color:var(--pal-accent)}.cards{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}.card{padding:19px;border-left:4px solid var(--pal-accent);border-radius:5px;background:var(--pal-soft);font-size:21px}.card small{display:block;color:var(--pal-text-2);font-size:17px;margin-top:7px}.choice{text-align:left;font-size:20px;padding:17px}.choice small{display:block;color:var(--pal-text-2);font-size:16px;margin-top:7px}.verdict{font-size:17px;margin-top:9px;padding-top:9px;border-top:1px solid var(--pal-line);color:var(--pal-accent-deep)}.choice.picked{border-color:var(--pal-accent)}.hint{font-size:16px;color:var(--pal-muted)}
</style></head><body><main><header><h1>Solitons: a pulse that holds its shape</h1><span class="tag" id="tag"></span></header><section class="body"><div id="lab" class="lab"></div><article class="lesson"><h2 id="title"></h2><p id="question" class="question"></p><p id="defs" class="defs"></p><ol id="tries"></ol><div class="take" id="take"></div></article></section><footer><button id="prev">← Previous</button><div id="dots"></div><span class="source"><a href="https://www.youtube.com/watch?v=LdpRtfPv6fQ&t=1269s" target="_blank" rel="noopener">Hamming · 21:09–23:16</a> · <a href="https://archive.nptel.ac.in/content/storage2/courses/115101008/modules/module5/lec37/1.2.html" target="_blank" rel="noopener">optics</a> · <a href="https://arxiv.org/abs/1508.03120" target="_blank" rel="noopener">balance</a></span><button id="next">Next →</button></footer></main><script>
const slides=[
{id:'pulse',kind:'pulse',title:'A traveling bump that stays a bump',time:'21:40 · shape',q:'Can a short flash travel without spreading into its neighbors?',defs:'A soliton is a localized wave that keeps its shape. In a fiber it is still a light pulse. The plot follows the pulse: time is measured relative to its moving center.',tries:['Move the distance slider from 0 to 4.','Compare the pulse width and peak height.'],take:'The soliton keeps its power profile in this ideal lossless model. An equally shaped pulse with dispersion alone spreads out.'},
{id:'dispersion',kind:'dispersion',title:'One flash contains many frequencies',time:'21:40 · why pulses spread',q:'Why can a single-mode fiber still spread a pulse?',defs:'A short flash is made from a band of optical frequencies. They can have different group delays even when they follow the same spatial mode.',tries:['Increase travel distance.','Notice how the same launch pulse gets wider and lower.'],take:'Dispersion is unequal timing across frequencies. Single-mode does not mean single-frequency.'},
{id:'kerr',kind:'kerr',title:'Strong light changes the glass response',time:'22:12 · the nonlinear medium',q:'How can the pulse itself supply a counter-effect?',defs:'In ordinary silica, stronger light slightly raises the refractive index. The intense center changes its optical phase more than the weak edges. This is the Kerr effect.',tries:['Raise pulse strength. The phase change grows most at the center.','Read the two edge labels: the frequency changes in opposite directions.'],take:'Self-phase modulation means a pulse changes its own phase. On its own it changes frequency content, not the pulse’s power envelope.'},
{id:'balance',kind:'choice',title:'Which combination can hold the pulse?',time:'22:12 · predict, then check',q:'What must be true for the ordinary bright fiber soliton?',defs:'Self-phase modulation shifts the rising edge toward lower frequencies and the falling edge toward higher frequencies. Anomalous dispersion delays the lower frequencies more.',tries:['Pick the explanation you would test.','Reveal every verdict and connect it to the first plot.'],take:'The leading edge is delayed and the trailing edge advances. At the matched shape, width, and power, the nonlinear and dispersive changes balance continuously.'},
{id:'limits',kind:'limits',title:'A balance needs the right conditions',time:'22:44–23:16 · amplification',q:'Does “keeps its shape” mean a real cable needs no care?',defs:'Hamming describes the appeal of optical amplification. His discussion compares a promising signaling method with a mature engineering system.',tries:['Select a real-world disturbance.','Ask which part of the ideal balance it changes.'],take:'Loss, amplifier noise, and higher-order effects remain. Gain can support soliton transmission, but raising the peak alone does not guarantee the correct pulse shape.'}
];
let page=0,data=null,pick=-1,dist=0,strength=.65,limit=0;const $=id=>document.getElementById(id);const c=n=>FluidTheme.color(n);const text=(x,y,t,color='text-2',anchor='start',size=18)=>`<text x="${x}" y="${y}" fill="${c(color)}" text-anchor="${anchor}" font-size="${size}">${t}</text>`;const line=(x,y,X,Y,color='guide',dash='')=>`<line x1="${x}" y1="${y}" x2="${X}" y2="${Y}" stroke="${c(color)}" stroke-width="2" stroke-dasharray="${dash}"/>`;
function chart(curves,opts={}){let W=680,H=330,L=54,R=22,T=30,B=55,px=x=>L+(x+10)/20*(W-L-R),py=y=>H-B-y/1.12*(H-T-B);let v=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.label||'Relative optical power across time within the pulse'}">`;for(let y of [0,.5,1])v+=line(L,py(y),W-R,py(y),'line')+text(L-9,py(y)+6,y,'muted','end',16);for(let x of [-10,-5,0,5,10])v+=text(px(x),H-B+26,x,'muted','middle',16);for(let s of curves)v+=`<polyline points="${data.x.map((x,i)=>px(x)+','+py(s.y[i])).join(' ')}" fill="none" stroke="${c(s.color)}" stroke-width="${s.width||3}" stroke-dasharray="${s.dash||''}"/>`;v+=text(L,19,opts.yname||'Relative optical power')+text(W-R,H-1,'Time within pulse (scaled)','text-2','end',17);if(opts.edges){v+=text(130,120,'Rising edge','text-2','middle',17)+text(130,145,'lower frequency','orange','middle',17)+text(550,120,'Falling edge','text-2','middle',17)+text(550,145,'higher frequency','accent-deep','middle',17);v+=line(200,150,280,185,'orange')+line(480,150,400,185,'accent');}v+='</svg>';$('chart').innerHTML=v;}
function legend(items){$('legend').innerHTML=items.map(a=>`<span style="--c:var(--pal-${a[1]})">${a[0]}</span>`).join('')}
function controls(label,min,max,step,value,callback){$('controls').innerHTML=`<label>${label}<input type="range" aria-label="${label}" min="${min}" max="${max}" step="${step}" value="${value}"></label><output>${Number(value).toFixed(2)}</output>`;$('controls').querySelector('input').oninput=e=>{callback(+e.target.value);draw()}}
function draw(){if(!data)return;let s=slides[page],initial=data.x.map(x=>1/Math.cosh(x)**2);if(s.kind==='pulse'||s.kind==='dispersion'){let linear=data.linear[Math.round(dist*20)];chart(s.kind==='pulse'?[{y:initial,color:'accent',width:4},{y:linear,color:'orange',dash:'8 5',width:3}]:[{y:initial,color:'slate-4',dash:'5 5'},{y:linear,color:'orange',width:4}]);legend(s.kind==='pulse'?[['solid: balanced soliton','accent'],['dashed: dispersion only','orange']]:[['dashed: launched pulse','slate-4'],['solid: dispersion only','orange']]);$('readout').textContent=`Distance: ${dist.toFixed(2)} dispersion lengths. ${dist===0?'The two power profiles coincide at launch.':'Dispersion-only peak: '+Math.max(...linear).toFixed(2)+'. Soliton peak: 1.00.'}`;controls('Travel distance',0,4,.05,dist,v=>dist=v);$('hint').textContent='Same launch shape and peak. Ideal lossless propagation; scaled units, not kilometers.';}else if(s.kind==='kerr'){chart([{y:initial,color:'slate-4',dash:'5 5'},{y:initial.map(y=>y*strength),color:'hue-purple',width:4}],{yname:'Normalized profile / phase change',label:'Schematic pulse power and Kerr-induced phase change',edges:true});legend([['dashed: power-envelope shape','slate-4'],['solid: added phase (own scale)','hue-purple']]);$('readout').textContent=strength===0?'No intensity-dependent phase change at zero strength.':'The center gets the largest phase change. The frequency shift comes from how phase changes across each edge.';controls('Pulse strength',0,1,.05,strength,v=>strength=v);$('hint').textContent='Schematic Kerr effect alone: each curve uses its own vertical scale. Edge labels describe positive Kerr response.';}}
function render(){const s=slides[page];$('title').textContent=s.title;$('tag').textContent=s.time;$('question').textContent=s.q;$('defs').textContent=s.defs;$('tries').innerHTML=s.tries.map(t=>'<li>'+t+'</li>').join('');$('take').textContent=s.take;$('prev').disabled=page===0;$('next').disabled=page===slides.length-1;$('dots').innerHTML=slides.map((s,i)=>`<button aria-label="Slide ${i+1}: ${s.title}" class="${i===page?'active':''}">${i+1}</button>`).join('');$('dots').querySelectorAll('button').forEach((b,i)=>b.onclick=()=>go(i));let lab=$('lab');if(['pulse','dispersion','kerr'].includes(s.kind)){lab.innerHTML='<div id="chart" class="chart"></div><div id="legend" class="legend"></div><div id="readout" class="readout"></div><div id="controls" class="controls"></div><div class="hint" id="hint"></div>';if(data)draw();else $('chart').textContent='Loading pulse profiles…';}else if(s.kind==='choice'){const opts=[['Eliminate all dispersion','Assumes a pulse needs no dispersive effect.','That removes one side of this soliton balance. Kerr phase changes would remain.'],['Match nonlinear response and anomalous dispersion','Assumes power, width, and shape are chosen together.','This is the conventional fundamental bright-soliton mechanism.'],['Increase power without limit','Assumes more nonlinear response always helps.','Excess power changes the dynamics; it does not keep this fundamental profile fixed.']];lab.innerHTML='<div class="cards">'+opts.map((o,i)=>`<button class="choice ${pick===i?'picked':''}" data-item="prediction" data-id="balance-${i}">${o[0]}${pick<0?'<small>'+o[1]+'</small>':''}${pick>=0?'<div class="verdict">'+(i===1?'Supported. ':'')+o[2]+'</div>':''}</button>`).join('')+'</div><button id="answer">Show answer</button><div class="hint">The effects act together throughout the fiber; this is not a sequence of two separate devices.</div>';lab.querySelectorAll('.choice').forEach((b,i)=>b.onclick=()=>{pick=i;render()});$('answer').onclick=()=>{pick=1;render()};}else{const effects=[['Fiber loss','The peak falls. Nonlinear phase change weakens, so the original balance no longer holds.'],['Amplifier noise','Gain replaces energy but also introduces fluctuations. Pulse timing and shape can be disturbed.'],['Extra physical effects','Higher-order dispersion and Raman response can change the pulse or its frequency. The simple model omits them.']];lab.innerHTML='<div class="controls">'+effects.map((e,i)=>`<button data-item="disturbance" data-id="${i}" aria-pressed="${i===limit}">${e[0]}</button>`).join('')+'</div><div class="cards"><div class="card" data-item="effect" data-title="'+effects[limit][0]+'">'+effects[limit][0]+'<small>'+effects[limit][1]+'</small></div><div class="card">Amplify and preserve the balance<small>Distributed gain or carefully spaced amplifiers can support propagation. Their design must account for the changing power along the fiber.</small></div></div><div class="hint">Hamming does not report which signaling method the Japan cable actually selected.</div>';lab.querySelectorAll('.controls button').forEach((b,i)=>b.onclick=()=>{limit=i;render()});}}
function go(i){page=Math.max(0,Math.min(slides.length-1,i));render()}$('prev').onclick=()=>go(page-1);$('next').onclick=()=>go(page+1);window.addEventListener('fluid-themechange',()=>{if($('chart'))draw()});document.addEventListener('keydown',e=>{if(document.activeElement.tagName==='INPUT')return;if(e.key==='ArrowRight')go(page+1);if(e.key==='ArrowLeft')go(page-1)});render();fetch('data.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{data=d;render()}).catch(()=>{$('lab').textContent='Pulse profiles could not load. Reload this view to retry.'});
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>After Lecture 22: test what the learner can do</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><script src="../../components/theme.js"></script><style>*{box-sizing:border-box}body{margin:0;background:var(--pal-bg);color:var(--pal-fg);font:18px/1.42 system-ui,sans-serif}main{height:100vh;padding:26px 30px;display:grid;grid-template-rows:58px 1fr 44px;gap:15px}header,footer{display:flex;align-items:center;justify-content:space-between;gap:14px}h1{font-size:24px;margin:0}h2{font-size:29px;line-height:1.15;margin:0 0 12px}p{margin:0 0 14px}.tag{color:var(--pal-muted);font-size:16px}.body{display:grid;grid-template-columns:59% 1fr;gap:28px;min-height:0}.lab{border:1px solid var(--pal-line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:15px;background:var(--pal-panel);min-height:0}.lesson{padding:8px 0;display:flex;flex-direction:column}.question{font-size:20px}.defs{color:var(--pal-text-2);margin-bottom:14px;font-size:17px}.formula{font-size:26px;margin-bottom:10px}.take{background:var(--pal-accent-soft);padding:15px;border-radius:10px;font-size:18px;margin-top:auto}ol{padding-left:25px;margin:5px 0 18px}li{padding:4px 0}button,select{font:inherit;color:var(--pal-fg);background:var(--pal-soft);border:1px solid var(--pal-line);border-radius:8px;padding:9px 14px;cursor:pointer}button:hover{background:var(--pal-accent-soft)}button:disabled{opacity:.45;cursor:default}.chart{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.chart svg{width:100%;height:100%}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:16px}.legend span:before{content:'';display:inline-block;width:20px;height:4px;background:var(--c);margin-right:7px;vertical-align:middle}.readout{padding:13px;background:var(--pal-soft);border-radius:8px;font-size:18px;min-height:55px}.controls{display:flex;align-items:center;gap:16px}.controls label{display:flex;align-items:center;gap:16px;flex:1}input[type=range]{flex:1;accent-color:var(--pal-accent)}.intro,.choices,.proof{display:flex;flex-direction:column;flex:1;gap:17px;justify-content:center}.intro>div{border-left:4px solid var(--pal-accent);background:var(--pal-soft);padding:20px;font-size:22px}.intro small,.choice small{display:block;font-size:17px;margin-top:8px;color:var(--pal-text-2)}.choice{text-align:left;padding:18px;font-size:20px}.verdict{border-top:1px solid var(--pal-line);margin-top:10px;padding-top:10px;font-size:17px;color:var(--pal-accent-deep)}.proof-row{padding:10px;background:var(--pal-soft);font-size:22px;border-left:4px solid var(--pal-line)}.proof-row:last-child{background:var(--pal-amber-row);border-color:var(--pal-amber)}.proof-row small{display:block;font-size:16px;margin-top:3px;color:var(--pal-text-2)}.guess{font-size:17px}.guess button{font-size:16px;padding:5px 8px;margin:4px 4px 0 0}.proof{gap:10px}.choice{font-size:19px;padding:14px}.choice small,.verdict{font-size:16px;line-height:1.35}.source{color:var(--pal-muted);font-size:15px}a{color:var(--pal-accent-deep)}.pages{font-size:16px;color:var(--pal-muted)}.tile{background:var(--pal-soft);border-left:4px solid var(--pal-accent);padding:16px;font-size:21px}.tile small{display:block;font-size:17px;color:var(--pal-text-2);margin-top:8px}.tiles{display:flex;flex-direction:column;justify-content:center;gap:18px;flex:1}.barrow{display:grid;grid-template-columns:130px 1fr 55px;gap:12px;align-items:center;margin:18px 0;font-size:17px}.track{height:50px;background:var(--pal-soft-2)}.bar{height:100%;background:var(--pal-accent)}.bar.control{background:var(--pal-grey)}.bars{flex:1;display:flex;flex-direction:column;justify-content:center}.bars h3{font-size:19px;margin:8px 0}.readout{line-height:1.5}.proof-row{font-size:21px}.choices{gap:10px}.choice{padding:9px 12px;font-size:18px}.choice small,.verdict{font-size:16px;line-height:1.3}.choice small{margin-top:5px}.verdict{margin-top:6px;padding-top:6px}.choices~.readout{font-size:16px;padding:9px;line-height:1.3}.verdict{font-size:16px}.lesson .take{font-size:17px}.source{font-size:14px}</style></head><body><main><header><h1>After Lecture 22: test what the learner can do</h1><span id="tag" class="tag"></span></header><section class="body"><div id="lab" class="lab"></div><article class="lesson"><h2 id="title"></h2><p id="question" class="question"></p><div id="defs" class="defs"></div><div id="formula" class="formula"></div><ol id="tries"></ol><div id="take" class="take"></div></article></section><footer><button id="prev">← Previous</button><span class="pages" id="pages"></span><span class="source">L22 · manual study · <a href="https://www.youtube.com/watch?v=zA3-mLhajkk" target="_blank" rel="noopener">lecture source</a></span><button id="next">Next →</button></footer></main><script>const slides=[{"id": "novelty", "kind": "experiment", "title": "A better score can hide a worse method", "time": "After \u00b7 05:09", "q": "Could extra attention make a weak lesson look successful?", "defs": "Hypothetical scores: both classes start at 60. The method itself costs 2 points. The new lesson also receives extra attention. These are invented values, not study data.", "tries": ["Move extra attention from 0 to 8.", "Find when the new lesson appears to beat the ordinary class."], "take": "Observed improvement mixes causes. Hamming\u2019s warning motivates a control; this toy does not establish the size of any real attention effect."}, {"id": "control", "kind": "experiment", "title": "Give the comparison equal attention", "time": "After \u00b7 supports 06:11", "q": "What happens if both classes get the same extra attention?", "defs": "The same hypothetical lesson effect is \u22122 points. Compare against an active control: another lesson with equal time, encouragement, and expectations.", "tries": ["Raise extra attention again.", "Compare the bars: the gap should remain \u22122."], "take": "An active control can balance attention. Real studies must also address assignment, baseline skill, attrition, and how outcomes are scored.", "matched": true}, {"id": "proof", "kind": "proof", "title": "Why the shared boost cancels", "time": "After \u00b7 supports 06:11", "q": "Under which assumption does subtraction isolate the method?", "defs": "Baseline score: 60. $a$: a shared attention boost. The toy lesson effect is \u22122 points. Assume the effects add and the boost is equal in both groups.", "tries": ["Guess the next move before revealing it.", "Explain why unequal attention would break the cancellation."], "take": "Cancellation depends on the equal-boost assumption. Random assignment helps balance groups, but cannot by itself force equal expectations.", "rows": [["60+a-2", "New-lesson score: baseline, boost, lesson effect"], ["60+a", "Control score: baseline and the same boost"], ["(60+a-2)-(60+a)", "Subtract comparable scores"], ["(60+a-2)-(60+a)=-2", "Cancel the shared terms"]]}, {"id": "branches", "kind": "choices", "title": "One wrong click, two possible minds", "time": "After \u00b7 18:06", "q": "Can a wrong answer reveal why the learner clicked it?", "defs": "A branching lesson logs \u201cwrong, wrong, right.\u201d One student is confused. Another knows the answers and is exploring the explanations. The visible log can be identical.", "tries": ["Choose the next observation.", "Notice which assumption each choice adds."], "take": "An action is evidence, not a complete model of a learner. Ask for an explanation or test performance on a fresh task.", "choices": [["Assign low ability from the log", "Assumes every wrong click is an attempted correct answer.", "Fails for deliberate exploration, the behavior Hamming describes."], ["Ask the learner to explain a fresh answer", "Assumes the explanation reveals relevant reasoning.", "Adds evidence that helps distinguish the two cases."], ["Assign high ability from fast clicks", "Assumes speed separates knowledge from guessing.", "Fast guessing can produce the same signal."]], "answer": "Hamming reports able students choosing wrong answers out of boredom. The proposed probe is our extension."}, {"id": "pattern", "kind": "pattern", "title": "Can you see the same pattern in a disguise?", "time": "After \u00b7 31:34", "q": "What must change, and what must stay, for a known rule to apply?", "defs": "First use a familiar rule: a log reverses the derivative of \u201cone divided by the input.\u201d In card A, $u>0$ is the input. In each card, check whether the numerator is the derivative of the denominator. Work where $\\sin x>0$.", "tries": ["Predict which two cards share the log pattern.", "Reveal the match; do not calculate a full integral yet."], "take": "Matching a relation is different from matching the printed symbols. The next slide checks the disguised case line by line."}, {"id": "derivation", "kind": "proof", "title": "Check the disguise by differentiation", "time": "After \u00b7 supports 32:35", "q": "Why does the log of sine fit the second card?", "defs": "We use one earlier fact: the derivative of log of an input is one divided by that input. Also, the derivative of sine is cosine. Here $x$ is an angle, $C$ is an arbitrary constant, and $\\sin x>0$.", "tries": ["Guess which derivative supplies the numerator.", "Reveal each line, then explain the chain rule in words."], "take": "The outer log contributes the denominator; the inner sine contributes the numerator. This is the relation the symbols hide.", "rows": [["\\frac{d}{dx}\\ln(\\sin x)=\\frac{1}{\\sin x}\\frac{d}{dx}\\sin x", "Chain rule: outer derivative times inner derivative"], ["\\frac{d}{dx}\\ln(\\sin x)=\\frac{\\cos x}{\\sin x}", "Differentiate the inner sine"], ["\\int\\frac{\\cos x}{\\sin x}\\,dx=\\ln(\\sin x)+C", "Reverse differentiation; add a constant"]]}, {"id": "automate", "kind": "choices", "title": "Keep the ability when the tool changes", "time": "After \u00b7 33:06", "q": "If software integrates for you, where will you practice recognition?", "defs": "The goal is to recognize one mathematical structure in different settings. A symbolic tool now performs the mechanical integration.", "tries": ["Choose a replacement task.", "Check which part of the goal each task exercises."], "take": "Use automation to free time, then deliberately spend some of it on the ability the old task was meant to build.", "choices": [["Copy ten tool outputs", "Assumes repeated exposure is enough.", "Completes ten answers but asks for little independent recognition."], ["Ban the tool entirely", "Assumes every old calculation is necessary practice.", "Retains effort but does not show which effort serves the goal."], ["Match structures, predict, then verify with the tool", "Assumes recognition is the intended ability.", "Best aligned here: the learner supplies the mapping before seeing the answer."]], "answer": "Hamming asks where to replace the lost challenge. This task is one possible answer, not his prescribed teaching method."}, {"id": "transfer", "kind": "transfer", "title": "Audit an AI tutor with a transfer test", "time": "After \u00b7 connects to 28:24 and 32:35", "q": "Can supported success and independent learning point in different directions?", "defs": "Hypothetical trial: 100 learners per group. Both groups receive equal study time and attention. A later test uses changed problems with no tutor. These invented counts illustrate an evaluation choice.", "tries": ["Switch between assisted practice and the later test.", "State which tutor you would choose for independent performance."], "take": "Tutor A wins assisted practice; Tutor B wins this independent test. The choice follows the goal. Neither table alone proves a general educational benefit."}];
let page=0;const states=slides.map(()=>({reveal:0,choice:false,value:0,toggle:false}));
const $=id=>document.getElementById(id);
function math(){if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:'$',right:'$',display:false}],throwOnError:false});}
function bars(rows){return '<div class="bars">'+rows.map(([label,v,cls])=>`<div class="barrow"><span>${label}</span><div class="track"><div class="bar ${cls||''}" style="width:${v}%"></div></div><span>${v}</span></div>`).join('')+'</div>';}
function draw(){const s=slides[page],st=states[page];$('title').textContent=s.title;$('question').textContent=s.q;$('defs').innerHTML=s.defs;$('tag').textContent=s.time;$('formula').innerHTML=s.formula||'';$('tries').innerHTML=s.tries.map(x=>'<li>'+x+'</li>').join('');$('take').textContent=s.take;$('pages').textContent=`${page+1} / ${slides.length}`;$('prev').disabled=page===0;$('next').disabled=page===slides.length-1;
let h='';
if(s.kind==='tiles')h='<div class="tiles">'+s.tiles.map(t=>`<div class="tile">${t[0]}<small>${t[1]}</small></div>`).join('')+'</div>';
if(s.kind==='choices'){h='<div class="choices">'+s.choices.map((c,i)=>`<button class="choice" data-choice="${i}" data-item="choice" data-id="${s.id}-${i}">${c[0]}<small>${c[1]}</small>${st.choice?'<div class="verdict">'+c[2]+'</div>':''}</button>`).join('')+'</div><button id="answer">Show answer</button>'+(st.choice?'<div class="readout">'+s.answer+'</div>':'');}
if(s.kind==='proof'){h='<div class="proof">'+s.rows.slice(0,st.reveal).map(r=>`<div class="proof-row">$${r[0]}$<small>${r[1]}</small></div>`).join('')+'</div><div class="guess">Before revealing: which move comes next?</div><button id="reveal" '+(st.reveal>=s.rows.length?'disabled':'')+'>Reveal next line</button>';}
if(s.kind==='experiment'){const a=st.value;h='<div class="legend">Blue: new lesson · Grey: comparison lesson<br>Bar length: score out of 100</div>'+bars([['New lesson',58+a,''],[s.matched?'Active control':'Ordinary class',60+(s.matched?a:0),'control']])+`<div class="readout">Difference: ${-2+(s.matched?0:a)} points. Extra attention: ${a} points.</div><label class="controls">Extra attention <input id="amount" type="range" min="0" max="12" value="${a}"></label>`;}
if(s.kind==='load'){h='<div class="legend">Blue rectangle: load in one lift · Full height: 250 pounds</div><div style="flex:1;display:flex;align-items:end;justify-content:center;gap:30px;padding:20px">'+(st.toggle?'<div style="height:50%;width:38%;background:var(--pal-accent);color:var(--pal-on-accent);display:grid;place-items:center">Lift 1 · 125</div><div style="height:50%;width:38%;background:var(--pal-accent);color:var(--pal-on-accent);display:grid;place-items:center">Lift 2 · 125</div>':'<div style="height:100%;width:50%;background:var(--pal-accent);color:var(--pal-on-accent);display:grid;place-items:center">Lift 1 · 250</div>')+'</div><div class="readout">Total: 250 pounds. Largest single load: '+(st.toggle?'125':'250')+' pounds.</div><button id="toggle">Switch schedule</button>';}
if(s.kind==='pattern'){h='<div class="tiles"><div class="tile">A · Familiar input<small>$\\int \\frac{1}{u}\\,du$</small></div><div class="tile">B · New symbols<small>$\\int \\frac{\\cos x}{\\sin x}\\,dx$</small></div><div class="tile">C · A missing factor<small>$\\int \\frac{1}{\\sin x}\\,dx$</small></div></div><button id="answer">Reveal the matching pair</button>'+(st.choice?'<div class="readout">A and B share the pattern. In B, cosine is the derivative of sine. C is missing that numerator; the same direct log rule does not fit.</div>':'');}
if(s.kind==='transfer'){h='<div class="legend">Blue: Tutor A · Grey: Tutor B<br>Bar length: learners correct out of 100</div><h3>'+(st.toggle?'Later: new task, no tutor':'Practice: tutor available')+'</h3>'+bars(st.toggle?[['Tutor A',55,''],['Tutor B',70,'control']]:[['Tutor A',95,''],['Tutor B',80,'control']])+'<div class="readout">'+(st.toggle?'Tutor B leads by 15 learners on independent transfer.':'Tutor A leads by 15 learners during assisted practice.')+'</div><button id="toggle">Switch test conditions</button>';}
$('lab').innerHTML=h;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{st.choice=true;draw()});if($('answer'))$('answer').onclick=()=>{st.choice=true;draw()};if($('reveal'))$('reveal').onclick=()=>{st.reveal++;draw()};if($('amount'))$('amount').oninput=e=>{st.value=+e.target.value;draw()};if($('toggle'))$('toggle').onclick=()=>{st.toggle=!st.toggle;draw()};math();}
function setPage(i){page=i;draw()}$('prev').onclick=()=>setPage(Math.max(0,page-1));$('next').onclick=()=>setPage(Math.min(slides.length-1,page+1));window.addEventListener('fluid-themechange',draw);window.addEventListener('load',draw);draw();
</script></body></html>

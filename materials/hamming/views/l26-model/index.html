<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>After Lecture 26: keep expertise current</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><script src="../../components/theme.js"></script><style>*{box-sizing:border-box}body{margin:0;background:var(--pal-bg);color:var(--pal-fg);font:18px/1.42 system-ui,sans-serif}main{height:100vh;padding:26px 30px;display:grid;grid-template-rows:58px 1fr 44px;gap:15px}header,footer{display:flex;align-items:center;justify-content:space-between;gap:14px}h1{font-size:24px;margin:0}h2{font-size:29px;line-height:1.15;margin:0 0 12px}p{margin:0 0 14px}.tag{color:var(--pal-muted);font-size:16px}.body{display:grid;grid-template-columns:59% 1fr;gap:28px;min-height:0}.lab{border:1px solid var(--pal-line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:15px;background:var(--pal-panel);min-height:0}.lesson{padding:8px 0;display:flex;flex-direction:column}.question{font-size:20px}.defs{color:var(--pal-text-2);margin-bottom:14px;font-size:17px}.formula{font-size:26px;margin-bottom:10px}.take{background:var(--pal-accent-soft);padding:15px;border-radius:10px;font-size:18px;margin-top:auto}ol{padding-left:25px;margin:5px 0 18px}li{padding:4px 0}button,select{font:inherit;color:var(--pal-fg);background:var(--pal-soft);border:1px solid var(--pal-line);border-radius:8px;padding:9px 14px;cursor:pointer}button:hover{background:var(--pal-accent-soft)}button:disabled{opacity:.45;cursor:default}.chart{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.chart svg{width:100%;height:100%}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:16px}.legend span:before{content:'';display:inline-block;width:20px;height:4px;background:var(--c);margin-right:7px;vertical-align:middle}.readout{padding:13px;background:var(--pal-soft);border-radius:8px;font-size:18px;min-height:55px}.controls{display:flex;align-items:center;gap:16px}.controls label{display:flex;align-items:center;gap:16px;flex:1}input[type=range]{flex:1;accent-color:var(--pal-accent)}.intro,.choices,.proof{display:flex;flex-direction:column;flex:1;gap:17px;justify-content:center}.intro>div{border-left:4px solid var(--pal-accent);background:var(--pal-soft);padding:20px;font-size:22px}.intro small,.choice small{display:block;font-size:17px;margin-top:8px;color:var(--pal-text-2)}.choice{text-align:left;padding:18px;font-size:20px}.verdict{border-top:1px solid var(--pal-line);margin-top:10px;padding-top:10px;font-size:17px;color:var(--pal-accent-deep)}.proof-row{padding:10px;background:var(--pal-soft);font-size:22px;border-left:4px solid var(--pal-line)}.proof-row:last-child{background:var(--pal-amber-row);border-color:var(--pal-amber)}.proof-row small{display:block;font-size:16px;margin-top:3px;color:var(--pal-text-2)}.guess{font-size:17px}.guess button{font-size:16px;padding:5px 8px;margin:4px 4px 0 0}.proof{gap:10px}.choice{font-size:19px;padding:14px}.choice small,.verdict{font-size:16px;line-height:1.35}.source{color:var(--pal-muted);font-size:15px}a{color:var(--pal-accent-deep)}.pages{font-size:16px;color:var(--pal-muted)}.audit-card{padding:20px;text-align:left;font-size:21px}.audit-card small{display:block;margin-top:12px;font-size:18px}.table{width:100%;border-collapse:collapse;font-size:22px}.table td,.table th{padding:23px 14px;border-bottom:1px solid var(--pal-line);text-align:left}.table th{font-size:18px}.big{font-size:36px;color:var(--pal-accent-deep)}.bars{display:flex;flex-direction:column;gap:30px;justify-content:center;flex:1}.bar{height:46px;background:var(--pal-accent);min-width:3px}.barrow>span{display:block;margin-bottom:8px}.marker{border-left:3px solid var(--pal-amber);height:100%}.readout{min-height:68px}.choice{line-height:1.35}</style></head><body><main><header><h1>After Lecture 26: keep expertise current</h1><span id="tag" class="tag"></span></header><section class="body"><div id="lab" class="lab"></div><article class="lesson"><h2 id="title"></h2><p id="question" class="question"></p><div id="defs" class="defs"></div><div id="formula" class="formula"></div><ol id="tries"></ol><div id="take" class="take"></div></article></section><footer><button id="prev">← Previous</button><span class="pages" id="pages"></span><span class="source">L26 · manual study · <a href="https://www.youtube.com/watch?v=KWNBzAgAiMc" target="_blank">lecture source</a></span><button id="next">Next →</button></footer></main><script>const slides=[{"id": "pump", "kind": "choice", "title": "What did \u201cimpossible\u201d assume?", "time": "After \u00b7 08:01\u201310:04", "q": "Does a changed mechanism refute the old proof?", "defs": "Hamming contrasts ordinary suction with a device using valves and local pressure changes. This exercise tests the logic; it does not simulate or verify the reported pump.", "tries": ["Pick the strongest conclusion."], "take": "A counterexample outside the assumptions limits a theorem\u2019s scope; it does not refute the theorem.", "options": [["Every pressure limit is false", "Assumes one different device refutes all pressure reasoning.", "No. A model of plain suction need not describe a different powered mechanism."], ["Check whether the mechanism satisfies the proof\u2019s assumptions", "Assumes a proof applies only inside its stated model.", "This is Hamming\u2019s point at 09:33: inspect the assumptions."], ["The device must be a good engineering choice", "Assumes feasibility implies efficiency.", "Hamming explicitly says he is not claiming it is a good method."]], "answer": 1}, {"id": "cost", "kind": "cost", "title": "A past failure meets a faster machine", "time": "After \u00b7 31:56", "q": "When does a formerly infeasible computation become feasible?", "defs": "Toy batch: 1,000,000 operations. The deadline is 10 seconds. Only machine speed changes; data movement and all other costs are held fixed.", "tries": ["Start at 10,000 operations per second.", "Increase the speed; find the deadline crossing."], "take": "A changed resource can invalidate the old verdict even when the algorithm is unchanged."}, {"id": "cost-proof", "kind": "proof", "title": "Derive the speed threshold", "time": "After \u00b7 31:56", "q": "Which assumption makes the old verdict expire?", "defs": "$s$: operations per second. $T$: seconds for the fixed million-operation batch. The deadline remains 10 seconds.", "tries": ["Guess the next move, then reveal one line.", "Look back: what if memory transfer time dominates instead?"], "take": "The threshold follows only under the stated compute-only cost model.", "rows": [["T=10^6/s", "Divide work by rate"], ["10^6/s\\leq10", "Require the deadline"], ["s\\geq100000", "Multiply by positive speed, then divide by ten"]]}, {"id": "prob", "kind": "attention", "title": "A rare useful idea can still merit a test", "time": "After \u00b7 20:29; 33:29", "q": "How much belief makes one cheap test worth doing?", "defs": "Toy units: a useful outside idea yields 100 units after testing; an unhelpful one yields zero. The test always costs 2 units. Ignore every later cost for now.", "tries": ["Move your probability estimate from zero upward.", "Find where the expected net value changes sign."], "take": "Probability and cost make openness actionable. A positive expectation is conditional, not a guarantee."}, {"id": "expect-proof", "kind": "proof", "title": "Price one bounded test", "time": "After \u00b7 20:29; 33:29", "q": "Why is the break-even probability two percent?", "defs": "$p$: chance the idea proves useful. $E$: expected net value in toy units. Useful payoff is 100; testing costs 2 in either outcome.", "tries": ["Predict the next move before each reveal.", "Look back: which inputs are judgments rather than measured facts?"], "take": "This is an authored decision model, not Hamming\u2019s formula or evidence for his historical generalization.", "rows": [["E=p(100-2)+(1-p)(-2)", "Weight the two net outcomes"], ["E=100p-2", "Collect the terms"], ["E>0\\iff p>0.02", "Solve the inequality"]]}, {"id": "budget", "kind": "choice", "title": "A positive test still uses time", "time": "After \u00b7 20:29\u201322:34", "q": "Does a positive expected value mean you must take the test?", "defs": "The previous toy test has a positive expected value of 3 units. Another task uses the same hour and has an expected value of 8 units. These values include each task\u2019s direct costs.", "tries": ["Choose under a strict one-hour budget."], "take": "An attention budget adds opportunity cost. Hamming leaves the career tradeoff to the listener.", "options": [["Take the 8-unit task", "Assumes these comparable expectations capture your goals.", "Best for this one-hour expected-value objective. The forgone alternative matters."], ["Take both", "Assumes an extra hour is available.", "The stated budget allows only one."], ["Always test outsiders", "Assumes openness has no competing cost.", "Hamming explicitly warns that listening to everyone can consume all your time."]], "answer": 0}, {"id": "joint", "kind": "choice", "title": "Measure the combined system", "time": "After \u00b7 25:14", "q": "What test matches Hamming\u2019s aim for computing?", "defs": "Analysts solve 80 of 100 toy cases. A machine alone solves 50. Of the machine\u2019s 50, twenty are cases the analysts miss. Assume cases can be routed correctly without extra cost.", "tries": ["Pick the evaluation that reveals complementarity."], "take": "Under this ideal routing assumption, the team can solve all 100. Real deployments must measure routing cost and new errors.", "options": [["Compare 80 with 50 and stop", "Assumes the two solve the same cases.", "The totals hide the overlap."], ["Count only machine speed", "Assumes faster answers solve the relevant failures.", "Speed misses whether the team gains capability."], ["Test the team, including the 20 missed cases", "Assumes the tool may complement the analysts.", "This matches Hamming\u2019s stated question: what can people and machines do together?"]], "answer": 2}, {"id": "org", "kind": "cooperate", "title": "A local win can destroy a shared result", "time": "After \u00b7 38:12\u201341:22", "q": "Why does withholding useful knowledge harm the whole system?", "defs": "Authored toy: the old group can help a new group integrate a replacement system. The table shows two different measures: local reward points and delivered value units. These are illustrative, not Bell Labs data.", "tries": ["Switch between withholding and sharing.", "Compare local credit with the combined value."], "take": "If local rewards favor obstruction, the organization must make cooperation visible and worthwhile."}, {"id": "limits", "kind": "choice", "title": "Do the stories establish a universal rule?", "time": "After \u00b7 34:02\u201334:32", "q": "What can the lecture\u2019s anecdotes support?", "defs": "Hamming says his stories are not perfect knowledge. He admits that some experts who stuck to their principles were right, and some new ideas were wrong.", "tries": ["Choose the conclusion the evidence can carry."], "take": "Use the lecture to generate checks on your judgment. It does not estimate the frequency of expert error.", "options": [["Most major advances always come from outsiders", "Assumes selected stories establish a general rate.", "The stories do not provide the comparison population needed to measure this."], ["Expertise is useless", "Assumes expert mistakes erase their knowledge.", "Hamming says experts know a lot and acknowledges cases where they are right."], ["Audit assumptions, including your own", "Assumes the stories expose possible failure modes.", "Supported as practical advice, with Hamming\u2019s stated exceptions."]], "answer": 2}];

let page=0,revealed=0,picked=-1,guess=-1;const values={speed:10000,prob:0,share:0},opened={};const $=id=>document.getElementById(id);const math=()=>{if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:'$',right:'$',display:false}],throwOnError:false})};
function setPage(i){page=Math.max(0,Math.min(slides.length-1,i));revealed=0;picked=-1;guess=-1;render()}
function render(){let s=slides[page];$('title').textContent=s.title;$('tag').textContent=s.time;$('question').textContent=s.q;$('defs').innerHTML=s.defs||'';$('formula').innerHTML=s.formula||'';$('tries').innerHTML=s.tries.map(t=>'<li>'+t+'</li>').join('');$('take').textContent=s.take;$('take').style.visibility=(s.kind==='choice'&&picked<0)||(s.kind==='proof'&&revealed<s.rows.length)?'hidden':'visible';$('pages').textContent=`${page+1} / ${slides.length}`;$('prev').disabled=page===0;$('next').disabled=page===slides.length-1;let lab=$('lab');
if(s.kind==='intro'){lab.innerHTML='<div class="intro">'+s.cards.map(c=>'<div data-item="case" data-title="'+c[0]+'">'+c[0]+'<small>'+c[1]+'</small></div>').join('')+'</div>'}
else if(s.kind==='audit'){lab.innerHTML='<div class="intro">'+s.cards.map((c,i)=>`<button class="audit-card" data-item="assumption" data-id="${i}">${c[0]}<small>${opened[i]?c[1]:'Click to inspect this assumption'}</small></button>`).join('')+'</div>';lab.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{opened[i]=!opened[i];render()})}
else if(s.kind==='choice'){lab.innerHTML='<div class="choices">'+s.options.map((o,i)=>`<button class="choice" data-item="choice" data-id="${s.id}-${i}">${o[0]}${picked<0?'<small>'+o[1]+'</small>':''}${picked>=0?'<div class="verdict">'+(i===s.answer?'Supported: ':'')+o[2]+'</div>':''}</button>`).join('')+'</div><button id="answer">Show answer</button>';lab.querySelectorAll('.choice').forEach((b,i)=>b.onclick=()=>{picked=i;render()});$('answer').onclick=()=>{picked=s.answer;render()}}
else if(s.kind==='proof'){let opts=revealed<s.rows.length?[s.rows[revealed][1],'Ignore the stated cost','Treat possibility as certainty']:[];lab.innerHTML='<div class="proof">'+s.rows.slice(0,revealed).map(r=>'<div class="proof-row">$'+r[0]+'$<small>'+r[1]+'</small></div>').join('')+(revealed===0?'<p>Make a guess before revealing the next line.</p>':'')+'</div>'+(opts.length?'<div class="guess">Which move comes next?<div>'+opts.map((c,i)=>`<button class="move" data-item="proof-guess" data-id="${i}">${c}</button>`).join('')+'</div><div>'+ (guess<0?'Choose a move, then check.':guess===0?'That move follows from the stated model.':'That move drops a condition the model needs.')+'</div></div>':'')+'<button id="reveal">'+(revealed<s.rows.length?'Reveal next line':'Proof complete')+'</button>';$('reveal').disabled=revealed>=s.rows.length;$('reveal').onclick=()=>{revealed++;guess=-1;render()};lab.querySelectorAll('.move').forEach((b,i)=>b.onclick=()=>{guess=i;render()})}
else{lab.innerHTML='<div class="bars" id="chart"></div><div class="readout" id="readout"></div><div class="controls" id="controls"></div>';draw()}math()}
function slider(key,min,max,step,label){$('controls').innerHTML=`<label>${label}<input aria-label="${label}" type="range" min="${min}" max="${max}" step="${step}" value="${values[key]}"></label><output>${values[key]}</output>`;$('controls').querySelector('input').oninput=e=>{values[key]=+e.target.value;draw();math()}}
function bar(label,value,max,color='accent'){return `<div class="barrow"><span>${label}: ${value}</span><div style="background:var(--pal-grid)"><div class="bar" style="width:${100*value/max}%;background:var(--pal-${color})"></div></div></div>`}
function draw(){let s=slides[page];if(s.kind==='cost'){let t=1e6/values.speed;$('chart').innerHTML=bar('Blue: batch time in seconds',t,100)+bar('Amber: deadline in seconds',10,100,'amber')+'<p>Both bars use the same scale: full width is 100 seconds.</p>';$('readout').innerHTML=`$T=${t.toFixed(2)}$ seconds. ${t<=10?'Meets':'Misses'} the 10-second deadline.`;slider('speed',10000,200000,1000,'Speed (operations per second)')}
else if(s.kind==='attention'){let p=values.prob/100,e=100*p-2;$('chart').innerHTML=bar('Blue: expected useful payoff',100*p,20)+bar('Amber: certain test cost',2,20,'amber')+'<p>Both bars use the same toy-value scale: full width is 20 units.</p>';$('readout').innerHTML=`$p=${p.toFixed(2)}$. Expected net value: $E=${e.toFixed(1)}$. ${e>0?'Positive':e<0?'Negative':'Break-even'}.`;slider('prob',0,20,1,'Chance of useful idea (percent)')}
else if(s.kind==='cooperate'){let v=values.share;$('chart').innerHTML='<table class="table"><tr><th>Outcome</th><th>Withhold</th><th>Share</th></tr><tr><td>Local reward points</td><td>10</td><td>6</td></tr><tr><td>Organization value units</td><td>10</td><td>24</td></tr></table>';$('readout').innerHTML=`Selected: <strong>${v?'share':'withhold'}</strong>. Local credit: ${v?6:10}. Combined value: <span class="big">${v?24:10}</span>.`;$('controls').innerHTML='<button id="withhold">Withhold</button><button id="share">Share</button>';$('withhold').onclick=()=>{values.share=0;draw()};$('share').onclick=()=>{values.share=1;draw()}}math()}
$('prev').onclick=()=>setPage(page-1);$('next').onclick=()=>setPage(page+1);window.addEventListener('fluid-themechange',()=>{if($('chart'))draw()});window.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')setPage(page+1);if(e.key==='ArrowLeft')setPage(page-1)});render();window.addEventListener('load',math);
</script></body></html>

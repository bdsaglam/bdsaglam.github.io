<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Before Lecture 19: what makes a simulation believable?</title><script src="../../components/theme.js"></script><script src="../../lib/fluid.js"></script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font:18px/1.42 system-ui;color:var(--pal-fg);background:var(--pal-bg)}main{height:100%;display:grid;grid-template-rows:66px 1fr 62px;padding:20px 28px;gap:12px}header,footer{display:flex;align-items:center;justify-content:space-between;gap:18px}header{border-bottom:1px solid var(--pal-line)}.tag{color:var(--pal-muted);font-size:15px}h1{font-size:23px;margin:0}h2{font-size:31px;line-height:1.15;margin:0 0 12px}.body{display:grid;grid-template-columns:60% 40%;min-height:0}.lab{display:flex;flex-direction:column;background:var(--pal-soft);border:1px solid var(--pal-line);border-radius:12px;padding:16px;gap:10px;min-height:0}.lesson{padding:20px 0 10px 28px;display:flex;flex-direction:column;min-height:0}.question{font-size:21px;margin:0 0 16px}.formula{font-size:23px;padding:12px;background:var(--pal-accent-soft);border-radius:8px;margin:8px 0 12px}.defs{font-size:17px;color:var(--pal-text-2)}ol{padding-left:24px;margin:8px 0}li{margin-bottom:9px}.take{margin-top:auto;padding:12px;border-left:4px solid var(--pal-accent);background:var(--pal-accent-soft);font-size:18px}.chart{flex:1;min-height:0;position:relative}svg{width:100%;height:100%;display:block}.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:44px}button,select{font:inherit;color:var(--pal-fg);background:var(--pal-panel);border:1px solid var(--pal-line);border-radius:7px;padding:9px 15px;cursor:pointer}button:hover{border-color:var(--pal-accent)}button:disabled{opacity:.4;cursor:default}input{accent-color:var(--pal-accent)}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:16px}.legend span:before{content:'━';margin-right:7px;color:var(--c)}.readout{font-size:19px;min-height:30px}.proof{height:100%;display:flex;flex-direction:column;gap:14px;justify-content:center}.proof-row{font-size:23px;background:var(--pal-panel);border-left:4px solid var(--pal-amber);padding:16px}.proof-row small{display:block;font-size:17px;color:var(--pal-muted);margin-top:7px}.choices{display:flex;flex-direction:column;gap:14px;justify-content:center;height:100%}.choice{text-align:left;padding:14px;font-size:18px}.choice small{display:block;font-size:16px;color:var(--pal-muted);margin-top:7px}.verdict{color:var(--pal-accent);font-size:17px}.intro{display:grid;gap:18px;align-content:center;height:100%}.intro div{background:var(--pal-panel);padding:22px;border-left:4px solid var(--pal-accent);font-size:23px}.intro small{display:block;font-size:18px;color:var(--pal-muted);margin-top:5px}footer{border-top:1px solid var(--pal-line);padding-top:12px}.pages{font-size:16px;color:var(--pal-muted)}.source{font-size:14px;color:var(--pal-muted)}.bigtable{width:100%;border-collapse:collapse;font-size:22px;margin:auto 0}.bigtable th,.bigtable td{padding:18px 10px;text-align:left;border-bottom:1px solid var(--pal-line)}.bigtable th{font-size:18px;color:var(--pal-muted)}.barrow{margin:6px 0;font-size:19px}.track{height:22px;background:var(--pal-grid);position:relative}.bar{height:100%;background:var(--pal-accent)}.bar.alt{background:var(--pal-orange)}.barlabel{display:flex;justify-content:space-between}.diagram{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:auto 0}.node{padding:25px;background:var(--pal-panel);border:2px solid var(--pal-accent);border-radius:12px;font-size:26px}.node small{display:block;font-size:18px;margin-top:8px}.explain{padding:18px;background:var(--pal-panel);font-size:20px}.lab a{color:var(--pal-accent)}.source{font-size:15px} </style></head><body><main><header><h1>Before Lecture 19: what makes a simulation believable?</h1><span id="tag" class="tag"></span></header><section class="body"><div id="lab" class="lab"></div><article class="lesson"><h2 id="title"></h2><p id="question" class="question"></p><div id="defs" class="defs"></div><div id="formula" class="formula"></div><ol id="tries"></ol><div id="take" class="take"></div></article></section><footer><button id="prev">← Previous</button><span class="pages" id="pages"></span><span class="source">Hamming · Lecture 19 · manual study</span><button id="next">Next →</button></footer></main><script>
const slides=[{"id": "purpose", "title": "Two tests for one simulation", "time": "Before \u00b7 00:30\u201301:33", "q": "What would make a believable-looking tennis game useful?", "kind": "choice", "defs": "You want to predict real bounce heights, not just entertain visitors.", "formula": "", "tries": ["Pick the strongest evidence. Then inspect all three verdicts."], "take": "Verification checks the computation. Validation checks the model against its intended use.", "options": [["Ask a tennis player whether it looks right", "Assumes visual familiarity detects the relevant errors.", "Useful feedback, but an unmeasured bounce error can remain."], ["Compare predicted and measured bounces", "Assumes the measurements cover the intended use.", "This directly tests relevance for bounce prediction."], ["Use a much faster computer", "Assumes computation speed determines physical accuracy.", "A faster machine repeats the same wrong law faster."]], "answer": 1}, {"id": "bounce", "title": "A plausible game can miss the bounce", "time": "Before \u00b7 07:12\u201308:15", "q": "Can correct arithmetic still predict the wrong height?", "kind": "bounce", "defs": "Drop a ball from 2 meters. The toy model returns a chosen fraction of that height. The measured rebound is 1.2 meters.", "formula": "", "tries": ["Change the retained height fraction.", "Match the measurement. Ask whether one match proves every bounce."], "take": "Matching one drop is a calibration. A new drop height tests whether the rule transfers."}, {"id": "checks", "title": "Name the claim each check supports", "time": "Before \u00b7 21:21\u201322:55", "q": "What does a passing check actually establish?", "kind": "choice", "defs": "A tennis solver matches an exact solution of its no-drag equations. Real tennis balls experience air drag.", "formula": "", "tries": ["Choose the conclusion the check supports."], "take": "A computation can solve the chosen equations accurately while those equations omit an important effect.", "options": [["The solver passes this known-answer test", "Assumes the reference solution is correct.", "Yes. This supports implementation correctness for this case."], ["The tennis game predicts real shots", "Assumes the omitted drag cannot matter.", "The reference contains the same omission; reality remains unchecked."], ["The solver is correct for every input", "Assumes one passing case covers every code path.", "One case cannot establish universal correctness."]], "answer": 0}, {"id": "transfer", "title": "The test must match the decision", "time": "Before \u00b7 03:38\u201305:10", "q": "Which change makes an old validation result less useful?", "kind": "choice", "defs": "A flight trainer passed checks for one aircraft. A new version changes its control response.", "formula": "", "tries": ["Predict what needs to be checked again."], "take": "AI connection: a simulator checked on one robot, task mix, or user population needs new evidence after that setting changes.", "options": [["Keep the old approval because the graphics match", "Assumes appearance captures the changed response.", "Appearance does not test control dynamics."], ["Add more training episodes immediately", "Assumes repetition repairs model mismatch.", "More exposure can teach the wrong response more firmly."], ["Recheck the changed control behavior", "Assumes validity has a domain of use.", "Hamming warns that missing a new aircraft effect can train a pilot to fail."]], "answer": 2}];let page=0,revealed=0,picked=-1;let values={fraction:.5,mix:20,shared:50,a:100,b:0,bug:false,drivers:20,reacted:false};const $=x=>document.getElementById(x);const math=()=>{if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})};
function setPage(i){page=Math.max(0,Math.min(slides.length-1,i));revealed=0;picked=-1;render()}
function render(){let s=slides[page];$('title').textContent=s.title;$('tag').textContent=s.time;$('question').textContent=s.q;$('defs').innerHTML=s.defs;$('formula').innerHTML=s.formula;$('formula').style.display=s.formula?'':'none';$('tries').innerHTML=s.tries.map(t=>'<li>'+t+'</li>').join('');$('take').textContent=s.take;$('pages').textContent=`${page+1} / ${slides.length}`;$('prev').disabled=page===0;$('next').disabled=page===slides.length-1;let lab=$('lab');lab.innerHTML='';if(s.kind==='proof'){lab.innerHTML='<div class="proof">'+s.rows.slice(0,revealed).map(r=>'<div class="proof-row">$'+r[0]+'$<small>'+r[1]+'</small></div>').join('')+(revealed===0?'<div class="intro"><div>Predict the first move.<small>Reveal one equation and its reason at a time.</small></div></div>':'')+'</div><button id="reveal">'+(revealed<s.rows.length?'Reveal next move':'Proof complete')+'</button>';$('reveal').disabled=revealed>=s.rows.length;$('reveal').onclick=()=>{revealed++;render()};}else if(s.kind==='choice'){lab.innerHTML='<div class="choices">'+s.options.map((o,i)=>`<button class="choice" data-item="choice" data-id="${s.id}-${i}">${o[0]}<small>${o[1]}</small>${picked>=0?'<div class="verdict">'+(i===s.answer?'✓ ':'')+o[2]+'</div>':''}</button>`).join('')+'</div><button id="answer">Show answer</button>';lab.querySelectorAll('.choice').forEach((b,i)=>b.onclick=()=>{picked=i;render()});$('answer').onclick=()=>{picked=s.answer;render()};}else if(s.kind==='table'){lab.innerHTML='<table class="bigtable"><thead><tr>'+s.headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+s.rows.map((r,i)=>'<tr data-item="task-group" data-id="group-'+i+'">'+r.map(t=>'<td>'+t+'</td>').join('')+'</tr>').join('')+'</tbody></table><p class="explain">A faces 80 hard tasks. B faces only 20 hard tasks.</p>'}else{lab.innerHTML='<div id="visual" style="flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center"></div><div id="readout" class="readout"></div><div id="controls" class="controls"></div>';draw()}math()}
function bars(rows,max){$('visual').innerHTML=rows.map((r,i)=>`<div class="barrow"><div class="barlabel"><span>${r[0]}</span><span>${r[1].toFixed(1)}${r[2]||''}</span></div><div class="track"><div class="bar ${i%2?'alt':''}" style="width:${Math.max(0,Math.min(100,100*r[1]/max))}%"></div></div></div>`).join('')}
function slider(key,min,max,step,label){$('controls').innerHTML=`<label>${label} <input aria-label="${label}" type="range" min="${min}" max="${max}" step="${step}" value="${values[key]}"></label><output>${values[key]}</output>`;$('controls').querySelector('input').oninput=e=>{values[key]=+e.target.value;draw();math()}}
function draw(){let k=slides[page].kind;if(k==='bounce'){bars([['Model rebound height',2*values.fraction,' m'],['Measured rebound height',1.2,' m']],2);slider('fraction',.1,.9,.05,'Retained height fraction');$('readout').textContent='Drop height: 2 m. Model minus measurement: '+(2*values.fraction-1.2).toFixed(2)+' m.'}
if(k==='mix'){let w=values.mix/100;bars([['A on easy tasks',90,'%'],['B on easy tasks',80,'%'],['A on hard tasks',30,'%'],['B on hard tasks',20,'%'],['A total on its mix',30+60*w,'%'],['B total: 80 easy tasks',68,'%']],100);slider('mix',0,100,1,'A easy-task count');$('readout').textContent=`A gets ${values.mix} easy and ${100-values.mix} hard tasks; B gets 80 easy and 20 hard.`}
if(k==='standard'){let w=values.shared/100;bars([['A on common mix',30+60*w,'%'],['B on common mix',20+60*w,'%']],100);slider('shared',0,100,1,'Shared easy-task percentage');$('readout').textContent='A stays ahead by 10 percentage points. Both totals move with the task mix.'}
if(k==='reaction'){let a=values.a,b=values.b;$('visual').innerHTML=`<div class="diagram"><div class="node">State A<small>${a.toFixed(2)} particles</small></div><div class="node">State B<small>${b.toFixed(2)} particles</small></div></div><div class="explain">One transfer: remove from A; ${values.bug?'BUG: remove from':'add to'} B.</div>`;$('readout').textContent=`Total: ${(a+b).toFixed(2)} particles · initial total: 100`;$('controls').innerHTML='<button id="step">One step</button><button id="reset">Reset counts</button><label><input id="bug" type="checkbox"> Sign bug</label>';$('bug').checked=values.bug;$('step').onclick=()=>{let d=.1*values.a;values.a-=d;values.b+=values.bug?-d:d;draw()};$('reset').onclick=()=>{values.a=100;values.b=0;draw()};$('bug').onchange=e=>{values.bug=e.target.checked;draw()}}
if(k==='routing'){let n=values.drivers;bars([['Route A current time',10+.1*n,' min'],['Route B current time',10+.1*(100-n),' min']],20);$('readout').textContent=values.reacted?'Everyone followed the old forecast. The chosen route now takes 20 minutes.':'Before reaction: route A takes 12 minutes; route B takes 18 minutes.';$('controls').innerHTML='<button id="react">Send everyone to faster route</button><button id="reset">Reset</button>';$('react').disabled=values.reacted;$('react').onclick=()=>{values.drivers=n<50?100:0;values.reacted=true;draw()};$('reset').onclick=()=>{values.drivers=20;values.reacted=false;draw()}}
math()}
$('prev').onclick=()=>setPage(page-1);$('next').onclick=()=>setPage(page+1);window.addEventListener('fluid-themechange',()=>{if($('visual'))draw()});window.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')setPage(page+1);if(e.key==='ArrowLeft')setPage(page-1)});render();window.addEventListener('load',math);
</script></body></html>

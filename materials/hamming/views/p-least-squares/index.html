<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primer · Least squares</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../../components/theme.js"></script>
<style>
/* Colors: white page, one accent (blue), red only for a failing check or the cube limit. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft);
  --red:var(--pal-red); --redbg:var(--pal-red-bg);
  /* heat map ends: small E is --map-lo (dark), large E is --map-hi (light); dark uses dim ends so light labels read */
  --map-lo:var(--pal-blue-deep); --map-hi:var(--pal-accent-soft);
  --u:clamp(16px,1.35vw,20px);
}
:root[data-fluid-theme="dark"]{--map-lo:var(--pal-accent-soft); --map-hi:var(--pal-blue-pale)}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 24px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(6px,1vh,12px) 24px}
footer{display:flex;align-items:center;gap:10px;padding:8px 24px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Slide frame: widget on the left (3/5), text on the right (2/5). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(18px,2.4vw,40px)}
.widget{min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(6px,1vh,10px);overflow:hidden}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(6px,1.1vh,12px);overflow:hidden}
.tag{font:13px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(20px,1.9vw,28px);line-height:1.2;margin:0;font-weight:650}
.question{margin:0;font-size:clamp(16px,1.3vw,18px);font-weight:600}
.formula{font-size:clamp(18px,1.8vw,26px)}
.sym{margin:0;font-size:16px;color:var(--muted)}
.tries{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.tries li::marker{color:var(--accent);font-weight:600}
.where{margin:0;font-size:16px}
.where b{color:var(--accent)}
.takeaway{margin:0;padding:10px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}
.closing{margin:0;font-size:17px;font-weight:600}
.next{margin:0;font-size:16px;color:var(--muted)}

/* Controls and readouts */
.sliders{display:flex;gap:8px 24px;flex-wrap:wrap;width:100%}
.sliders.tight{gap:6px 16px}
.slide-ctl{display:flex;align-items:center;gap:8px;font-size:16px}
.slide-ctl input{width:clamp(120px,11vw,170px);vertical-align:middle;accent-color:var(--accent)}
.slide-ctl .val{min-width:52px}
.btn{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--pal-panel);border-radius:8px;cursor:pointer;font-size:16px}
.btn.on{background:var(--chip);border-color:var(--accent);color:var(--pal-accent-deep)}
.guess{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;width:100%}
.guess .btnrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.guess .verdict{margin:0;font-size:16px}
.readouts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.readout{flex:1 1 150px;min-width:0;padding:4px 8px;border-radius:10px;background:var(--pal-soft);font-size:15px;overflow-wrap:anywhere}
.readout .k{color:var(--muted);font-size:14px}
.readout .val{font-size:16px;font-weight:600}
.readout.bad{background:var(--redbg);color:var(--red)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:20px;height:0;vertical-align:middle;margin-right:6px}
.chip{display:inline-block;width:18px;height:12px;vertical-align:middle;margin-right:6px;border-radius:2px}

/* Plots fill the space left in the widget column */
.fill{flex:1 1 0;min-height:120px;position:relative;width:100%}
.fill>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.plot-static svg{display:block;width:100%;height:auto}
.row{display:flex;gap:12px;align-items:stretch;width:100%;min-height:200px;flex:1 1 0}
.diagram{flex:0 0 auto;display:flex;align-items:stretch}
.diagram svg{display:block;height:100%;width:auto;aspect-ratio:250/252}
.panel{display:flex;flex-direction:column;gap:0;padding:2px 0 2px 10px;border-left:3px solid var(--line)}
.panel .pl{font-weight:650;color:var(--accent);font-size:16px}
.panel p{margin:0;font-size:16px;line-height:1.2}
.panel.seen{border-left:none;background:var(--chip);border-radius:8px;padding:8px 10px}
.panel.seen .pl{color:var(--fg)}
.strip-row{display:flex;align-items:center;gap:10px;width:100%}
.strip-lab{flex:0 0 170px;font-size:15px;color:var(--muted)}
.strip-row svg{flex:1 1 auto;width:100%;height:26px;display:block}
.row-line{display:flex;align-items:center;gap:8px;width:100%}
.row-line svg{flex:1 1 auto;width:100%;height:14px;display:block}
.row-k{flex:0 0 60px;font-size:15px;color:var(--muted)}
.why{margin:0;font-size:16px;line-height:1.3}
.tbox{display:flex;flex-direction:column;gap:4px;width:100%}
.triple{display:grid;grid-template-columns:max-content repeat(10,28px);gap:3px 4px;align-items:center}
.triple .tn{font-size:13px;color:var(--muted);text-align:center}
.triple .tl{font-size:15px;padding-right:8px;white-space:nowrap}
.triple .tc{height:22px;display:flex;align-items:center;justify-content:center;border-radius:4px;background:var(--pal-soft-2);font:16px ui-monospace,Menlo,monospace}
.triple .tc.flip{background:var(--red);color:var(--pal-on-accent);font-weight:700}
.rows{display:flex;flex-direction:column;gap:3px;width:100%}
.proof-line{display:grid;grid-template-columns:30px minmax(0,1fr);gap:0 8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--pal-soft-3)}
.proof-num{font:15px ui-monospace,Menlo,monospace;color:var(--muted)}
.proof-eq{font-size:17px;min-width:0}
.proof-why{grid-column:2;margin:0;color:var(--muted);font-size:16px;line-height:1.2}
.proof{display:flex;flex-direction:column;width:100%}
.panel p.cite{font-size:14px;color:var(--muted);line-height:1.15}
.pgrid{display:grid;grid-template-columns:max-content repeat(10,30px);gap:4px;align-items:center;justify-content:start}
.pgrid .ax{font-size:13px;color:var(--muted);text-align:center}
.pc{width:30px;height:30px;padding:0;border:0;border-radius:4px;background:var(--pal-blue-pale);cursor:pointer}
.pc.on{background:var(--accent);box-shadow:0 0 0 2px var(--pal-ink)}
.steps{position:absolute;inset:0;z-index:3;background:var(--pal-panel);display:flex;flex-direction:column;gap:8px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.widget{position:relative}
/* Short windows (1100x620 and similar): tighter spacing, body text stays 16px */
@media (max-height: 680px){
  header{padding-top:4px}
  #stage{padding:4px 24px}
  footer{padding:4px 24px}
  .widget{gap:5px}
  .side{gap:6px}
  .tries{gap:3px}
  .sym,.where,.tries{line-height:1.2}
  .panel p{line-height:1.15}
  .side{gap:4px}
  .proof-line{padding:1px 0}
  .guess{gap:3px;padding:6px 8px}
  .fill{min-height:110px}
  .readout{padding:3px 8px}
  .takeaway{padding:6px 10px}
  .formula{font-size:20px}
  .pc{width:20px;height:20px}
  .pgrid{grid-template-columns:max-content repeat(10,20px)}
  h2{font-size:20px}
}
</style>
<style>
/* Extra pieces for this primer: a row table, bar rows, and the same proof-line look. */
.ntable{border-collapse:collapse;width:100%;font-size:16px}
.ntable th,.ntable td{padding:3px 6px;border-bottom:1px solid var(--pal-soft-3);text-align:center;font-weight:400}
.ntable th{color:var(--muted);font-size:15px}
.bar-row{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:16px}
.bar-lab{font-size:16px}
.bar-track{position:relative;height:22px;background:var(--pal-soft);border-radius:4px;overflow:hidden}
.bar-fill{position:absolute;top:0;bottom:0;background:var(--accent)}
.bar-mid{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--pal-ink)}
.bar-val{text-align:right;font-weight:600}
.eqs{display:flex;flex-direction:column;gap:2px;width:100%}
.eqs .proof-line{padding:3px 0}
.stack{display:flex;flex-direction:column;gap:6px;width:100%}
.fill>table{position:absolute;inset:0;width:100%;height:100%}
/* Tighter derivation lines and display formulas, so the text column fits the frame. */
.proof-line{padding:2px 0}
.proof-eq{font-size:16px}
.formula{font-size:clamp(18px,1.6vw,22px)}
@media (max-height: 680px){ .side{gap:3px} .proof-line{padding:1px 0} }
.ntable tr{height:auto}

/* Proof slides: test and picture on the left, the proof (fl-proof-steps) on the right */
.slide.proof-slide{grid-template-columns:minmax(0,11fr) minmax(0,9fr)}
.slide.proof-slide .side{justify-content:flex-start}
.slide.proof-slide .fill{min-height:150px}
.slide.proof-slide .slide-ctl input{width:clamp(96px,8.5vw,140px)}
.slide.proof-slide .slide-ctl .val{min-width:44px}
.slide.proof-slide .sliders{gap:6px 18px;align-items:center}
.slide.proof-slide .legend{gap:4px 14px}
.part{margin:0;font-weight:600;color:var(--muted)}
.test{display:flex;flex-direction:column;gap:3px}
.test .tries{gap:3px}
.model{margin:0;padding:8px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}
.name i{font-style:italic}
.pick{cursor:pointer}
.pick:focus{outline:none}
@media (max-height: 680px){
  .slide.proof-slide .fill{min-height:110px}
  .model{padding:5px 10px}
  .test .tries{gap:1px}
  .test{gap:1px}
}
</style>
</head>
<body>
<header>Primer · Least squares</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script src="../../components/proof-steps.js"></script>
<script>
// ---------- DOM and drawing helpers ----------
// ---------- palette and redraw ----------
// COL holds the palette colors for the SVG being drawn. fillPlot reads it at every paint, so a draw always
// uses the current theme. Light values are the old literals, so the light theme is unchanged.
let COL = {};
const PAL_NAMES = ['ink', 'text-2', 'text-3', 'muted', 'grey', 'grid', 'guide', 'line', 'slate-2', 'accent', 'accent-soft',
  'accent-tint', 'blue-deep', 'soft', 'soft-2', 'soft-hover', 'panel', 'bg', 'amber', 'amber-bg', 'amber-ink',
  'hue-orange-ink'];
function readPalette() {
  const o = {};
  for (const n of PAL_NAMES) o[n.replace(/-(\w)/g, (_, c) => c.toUpperCase())] = FluidTheme.color(n);
  return o;
}
let PLOTS = [];   // the plots on the current slide; a theme switch redraws them, and keeps every control's state
window.addEventListener('fluid-themechange', () => PLOTS.forEach(p => p.redraw()));
let epoch = 0;
const $ = s => document.querySelector(s);
const NSV = 'http://www.w3.org/2000/svg', NHT = 'http://www.w3.org/1999/xhtml';
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false } ], throwOnError: false };
// Render $...$ and $$...$$ in a node. If the CDN did not load, the text stays as typed.
function tex(node) {
  if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH);
  return node;
}
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function hh(tag, cls, ...kids) {
  const e = h(tag, cls);
  for (const k of kids) if (k) e.append(k);
  return e;
}
function mark(e, kind, id, title) {
  e.dataset.item = kind;
  if (id != null) e.dataset.id = id;
  if (title != null) e.dataset.title = title;
  return e;
}
function svgNode(tag, attrs, parent) {
  const e = document.createElementNS(NSV, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function svgRoot(w, ht) {
  return svgNode('svg', { viewBox: '0 0 ' + w + ' ' + ht, role: 'img', 'font-family': 'system-ui, sans-serif', 'font-size': 14 });
}
function svgText(parent, x, y, s, attrs) {
  const t = svgNode('text', Object.assign({ x: x, y: y, fill: COL.muted }, attrs || {}), parent);
  t.textContent = s;
  return t;
}
// A KaTeX label over an SVG: a foreignObject holding a rendered formula.
function svgTex(parent, x, y, s, o) {
  o = o || {};
  const w = o.w || 220, ht = 26, anchor = o.anchor || 'middle';
  const x0 = anchor === 'end' ? x - w : anchor === 'start' ? x : x - w / 2;
  const fo = svgNode('foreignObject', { x: x0, y: y - ht / 2, width: w, height: ht }, parent);
  const d = document.createElementNS(NHT, 'div');
  const jc = anchor === 'end' ? 'flex-end' : anchor === 'start' ? 'flex-start' : 'center';
  d.setAttribute('style', 'display:flex;align-items:center;height:100%;white-space:nowrap;font-size:' +
    (o.size || 15) + 'px;color:' + (o.fill || COL.text2) + ';justify-content:' + jc);
  const span = document.createElementNS(NHT, 'span');
  span.textContent = s;
  if (o.bg) span.setAttribute('style', 'background:' + o.bg + ';border-radius:5px;padding:1px 5px');
  d.appendChild(span);
  fo.appendChild(d);
  tex(span);
  return fo;
}
// Same label with a halo in the page color, so it reads over a curve or bars.
function haloTex(parent, x, y, s, o) {
  const fo = svgTex(parent, x, y, s, o);
  fo.firstChild.style.textShadow = `0 0 3px ${COL.bg}, 0 0 3px ${COL.bg}, 0 0 2px ${COL.bg}`;
  return fo;
}
// A small number for a readout: plain decimals, or a LaTeX power of ten for tiny values.
function sci(x) {
  if (x === 0) return '0';
  if (Math.abs(x) >= 0.01) return x.toFixed(4);
  const parts = x.toExponential(2).split('e');
  return '$' + parts[0] + '\\times 10^{' + parseInt(parts[1], 10) + '}$';
}
// A labelled range input. label is LaTeX-ready text; fmt gives the value text.
function slider(label, o) {
  const wrap = h('label', 'slide-ctl');
  const lab = tex(h('span', '', label));
  const val = h('span', 'val', '');
  const inp = h('input');
  inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step; inp.value = o.value;
  mark(inp, 'control', o.id, o.name || o.id);
  wrap.append(lab, inp, val);
  const fmt = o.fmt || String;
  const api = {
    el: wrap,
    input: inp,
    get value() { return +inp.value; },
    show() { setTex(val, fmt(+inp.value)); },
  };
  inp.addEventListener('input', () => { api.show(); if (o.onInput) o.onInput(+inp.value); });
  api.show();
  return api;
}
// A readout box: label and value are LaTeX-ready text.
function readout(id, label) {
  const box = mark(h('div', 'readout'), 'readout', id);
  const k = h('div', 'k');
  setTex(k, label);
  const v = h('div', 'val');
  box.append(k, v);
  return { el: box, set(text, bad) { setTex(v, text); box.classList.toggle('bad', !!bad); } };
}
function legend(items) {
  const d = h('div', 'legend');
  for (const it of items) {
    const s = h('span');
    const sw = it.chip ? h('span', 'chip') : h('span', 'sw');
    if (it.chip) sw.style.background = it.color;
    else sw.style.borderTop = '2px ' + (it.dash ? 'dashed' : 'solid') + ' ' + it.color;
    const t = h('span');
    setTex(t, it.text);
    s.append(sw, t);
    d.appendChild(s);
  }
  return d;
}
// A plot that takes the height left in its box. draw(svg, W, H) runs on every resize.
function fillPlot(box, draw) {
  const wrap = h('div', 'fill');
  box.append(wrap);
  let key = '';
  const paint = force => {
    const w = Math.floor(wrap.clientWidth), ht = Math.floor(wrap.clientHeight);
    if (w < 60 || ht < 60) return;
    if (!force && key === w + 'x' + ht) return;
    key = w + 'x' + ht;
    COL = readPalette();
    const svg = svgRoot(w, ht);
    draw(svg, w, ht);
    wrap.replaceChildren(svg);
  };
  new ResizeObserver(() => paint(false)).observe(wrap);
  const plot = { redraw: () => paint(true) };
  PLOTS.push(plot);
  return plot;
}
// A histogram with an optional exact curve, marks (dashed lines with labels) and x ticks.
// o: {x0, x1, S, counts, curve(x) -> density, marks: [{x, label, y}], xlabel}
function histPlot(svg, W, H, o) {
  const L = 46, R = 14, T = 16, B = 52, base = H - B, pw = W - L - R;
  const bins = o.counts.length, bw = (o.x1 - o.x0) / bins;
  const X = x => L + (x - o.x0) / (o.x1 - o.x0) * pw;
  const bars = o.counts.map(c => c / (o.S * bw));
  const cur = [];
  for (let i = 0; i <= 200; i++) cur.push(o.curve ? o.curve(o.x0 + (o.x1 - o.x0) * i / 200) : 0);
  let ymax = 0;
  for (const v of bars) if (v > ymax) ymax = v;
  for (const v of cur) if (isFinite(v) && v > ymax) ymax = v;
  ymax = ymax > 0 ? ymax * 1.15 : 1;
  const Y = v => base - v / ymax * (base - T);
  svgNode('line', { x1: L, y1: base, x2: W - R, y2: base, stroke: COL.grey }, svg);
  svgNode('line', { x1: L, y1: T, x2: L, y2: base, stroke: COL.grey }, svg);
  const bwPx = pw / bins;
  bars.forEach((dv, i) => {
    const x = L + i * bwPx, y = Y(dv);
    svgNode('rect', { x: x.toFixed(2), y: y.toFixed(2), width: Math.max(0.5, bwPx - 1).toFixed(2),
      height: Math.max(0, base - y).toFixed(2), fill: COL.grey, 'data-item': 'mark', 'data-id': 'bars' }, svg);
  });
  if (o.curve) {
    let d = '';
    for (let i = 0; i <= 200; i++) {
      const x = o.x0 + (o.x1 - o.x0) * i / 200;
      d += (i ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(isFinite(cur[i]) ? cur[i] : 0).toFixed(1);
    }
    svgNode('path', { d: d, fill: 'none', stroke: COL.accent, 'stroke-width': 2.5, 'data-item': 'mark', 'data-id': 'curve' }, svg);
  }
  for (let i = 0; i <= 4; i++) {
    const v = o.x0 + (o.x1 - o.x0) * i / 4;
    svgText(svg, X(v), base + 18, String(Math.round(v * 100) / 100), { 'text-anchor': 'middle', 'font-size': 15 });
  }
  for (const m of (o.marks || [])) {
    if (m.x < o.x0 || m.x > o.x1) continue;
    svgNode('line', { x1: X(m.x).toFixed(1), y1: T, x2: X(m.x).toFixed(1), y2: base, stroke: COL.ink, 'stroke-dasharray': '4 3', 'data-item': 'mark', 'data-id': m.id || 'mark' }, svg);
    haloTex(svg, X(m.x), m.y || T + 8, m.label, { w: 130, size: 15, fill: COL.ink });
  }
  svgTex(svg, (L + W - R) / 2, H - 12, o.xlabel, { w: 340, size: 15 });
  return svg;
}
function sym(text) { return setTex(h('p', 'sym'), text); }
function triesList(items) { return hh('ol', 'tries', ...items.map(t => setTex(h('li'), t))); }
function whereLine(text) {
  const p = h('p', 'where');
  const s = h('span');
  setTex(s, text);
  p.append(h('b', '', 'Where you meet it: '), s);
  return p;
}
function takeLine(text) { return setTex(h('p', 'takeaway'), text); }
// A prediction box: the user commits to one guess and sees the verdict and the answer at once;
// the slider is there to watch it happen. A wrong answer key fails loudly instead of marking every guess wrong.
function guessBox(prompt, choices, answer, reveal, hint) {
  if (!choices.some(([id]) => id === answer)) throw new Error('guessBox: answer ' + answer + ' is not a choice');
  let chosen = null;
  const el = h('div', 'guess');
  const row = h('div', 'btnrow');
  const out = h('p', 'verdict');
  const btns = choices.map(([id, label]) => {
    const b = mark(h('button', 'btn'), 'control', 'guess-' + id);
    setTex(b, label);
    b.addEventListener('click', () => {
      chosen = id;
      emit('view.action', { action: 'guess', guess: id, correct: id === answer });
      refresh();
    });
    row.append(b);
    return [id, b, label];
  });
  function refresh() {
    btns.forEach(([id, b]) => b.classList.toggle('on', id === chosen));
    if (chosen === null) setTex(out, 'Commit to one guess first.');
    else setTex(out, (chosen === answer ? 'Right. ' : 'Not this one. ') + 'The answer: ' + reveal + ' ' + (hint || 'Move the slider to see it.'));
  }
  el.append(setTex(h('p', 'verdict'), prompt), row, out);
  refresh();
  return { el: el, moved() {} };
}
// Session events. Optional: with no bridge, nothing is sent.
function emit(kind, data) {
  try {
    if (window.fluid && typeof window.fluid.emit === 'function') Promise.resolve(window.fluid.emit(kind, data)).catch(() => {});
  } catch (e) { /* the view works without the bridge */ }
}


// ---------- the four points, and the sums they give ----------
const PTS = [[0, 1], [1, 2], [2, 2], [3, 4]];
const dot = (u, v) => u.reduce((s, t, i) => s + t * v[i], 0);
const sseOf = (f, pts) => pts.reduce((s, [x, y]) => s + (y - f(x)) ** 2, 0);
// The least-squares line from the two normal equations (step 3 derives them).
function lineOf(pts) {
  const n = pts.length;
  const sx = pts.reduce((s, [x]) => s + x, 0), sy = pts.reduce((s, [, y]) => s + y, 0);
  const sxx = pts.reduce((s, [x]) => s + x * x, 0), sxy = pts.reduce((s, [x, y]) => s + x * y, 0);
  const det = n * sxx - sx * sx;
  return { a: (sy * sxx - sx * sxy) / det, b: (n * sxy - sx * sy) / det };
}
// Solve M c = v by Gaussian elimination with partial pivoting.
function solveSys(M, v) {
  const n = v.length, A = M.map((row, i) => [...row, v[i]]);
  for (let i = 0; i < n; i++) {
    let p = i;
    for (let k = i + 1; k < n; k++) if (Math.abs(A[k][i]) > Math.abs(A[p][i])) p = k;
    [A[i], A[p]] = [A[p], A[i]];
    for (let k = i + 1; k < n; k++) {
      const f = A[k][i] / A[i][i];
      for (let j = i; j <= n; j++) A[k][j] -= f * A[i][j];
    }
  }
  const x = new Array(n).fill(0);
  for (let i = n - 1; i >= 0; i--) {
    let s = A[i][n];
    for (let j = i + 1; j < n; j++) s -= A[i][j] * x[j];
    x[i] = s / A[i][i];
  }
  return x;
}
// Least squares for any family of curves: basis functions f_j(x), coefficients c_j.
function fitFamily(basis, xs, ys) {
  const F = xs.map(x => basis.map(f => f(x)));
  const k = basis.length, M = [], v = [];
  for (let i = 0; i < k; i++) {
    M.push([]);
    for (let j = 0; j < k; j++) M[i].push(xs.reduce((s, _, t) => s + F[t][i] * F[t][j], 0));
    v.push(xs.reduce((s, _, t) => s + F[t][i] * ys[t], 0));
  }
  const c = solveSys(M, v);
  const E = xs.reduce((s, _, t) => s + (ys[t] - dot(F[t], c)) ** 2, 0);
  return { c, E, at: x => dot(basis.map(f => f(x)), c) };
}

// Axes for an x-y plot. Returns the maps from data to pixels.
function axes2d(svg, W, H, o) {
  const L = 52, R = 18, T = 14, B = 46, base = H - B;
  const X = x => L + (x - o.x0) / (o.x1 - o.x0) * (W - L - R);
  const Y = y => base - (y - o.y0) / (o.y1 - o.y0) * (base - T);
  svgNode('line', { x1: L, y1: base, x2: W - R, y2: base, stroke: COL.grey }, svg);
  svgNode('line', { x1: L, y1: T, x2: L, y2: base, stroke: COL.grey }, svg);
  for (const v of o.xt) svgText(svg, X(v), base + 18, String(v), { 'text-anchor': 'middle', 'font-size': 15 });
  for (const v of o.yt) svgText(svg, L - 8, Y(v) + 5, String(v), { 'text-anchor': 'end', 'font-size': 15 });
  svgTex(svg, (L + W - R) / 2, H - 8, o.xlabel, { w: 320, size: 15 });
  svgTex(svg, L + 4, T + 8, o.ylabel, { w: 260, anchor: 'start', size: 15, fill: COL.ink });
  return { X, Y, L, R, T, base };
}
// Two decimals, with no "-0.00" for a value that rounds to zero.
const f2 = v => (Math.abs(v) < 0.005 ? 0 : v).toFixed(2);
// A dot-product bar: zero in the middle, value to the left or right, scale +-8.
function dotBar(label, id) {
  const row = mark(h('div', 'bar-row'), 'readout', id);
  const lab = setTex(h('div', 'bar-lab'), label);
  const track = h('div', 'bar-track');
  const fill = h('div', 'bar-fill');
  track.append(fill, h('div', 'bar-mid'));
  const val = h('div', 'bar-val');
  row.append(lab, track, val);
  return {
    el: row,
    set(v) {
      const pct = Math.min(50, Math.abs(v) / 8 * 50);
      fill.style.left = v < 0 ? (50 - pct) + '%' : '50%';
      fill.style.width = pct + '%';
      val.textContent = f2(v);
    },
  };
}
// One numbered line of a derivation, shown at once (static) or one per click (revealed).
function proofLine(n, eq, why) {
  return hh('div', 'proof-line', h('span', 'proof-num', String(n)), setTex(h('div', 'proof-eq'), eq), setTex(h('p', 'proof-why'), why));
}

// ---------- proof slides: shared parts ----------
// Amber marks what the newest proof line is about, in the picture and in the proof.
function litSet(key) { return new Set(String(key || '').split(/\s+/).filter(Boolean)); }
function glowPath(svg, d, wdt) {
  return svgNode('path', { d: d, fill: 'none', stroke: COL.amberBg, 'stroke-width': wdt || 12, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, svg);
}
function glowDot(svg, x, y, r) { return svgNode('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: r || 12, fill: COL.amberBg, stroke: COL.amber, 'stroke-width': 1.5 }, svg); }
function glowBox(svg, x, y, w, ht, pad) {

// While a proof line is lit, a caption in the picture's top row says what the amber part is.
function litCaption(svg, W, text) { svgTex(svg, W / 2, 12, text, { w: W - 8, size: 15, fill: COL.amberInk, bg: COL.amberBg }); }
function nameLine(html) { const p = h('p', 'sym name'); p.innerHTML = html; return tex(p); }
// Left column of a proof slide: controls, the picture, legend, readouts, the test, the mental model.
function proofLeft(widget, o) {

function proofRight(side, spec, plot, onLight) {

// Axes inside a box {x, y, w, h} of the SVG. Returns the maps from data to pixels.
function axesIn(svg, box, o) {
  const L = box.x + 40, R = box.x + box.w - 10, T = box.y + 10, base = box.y + box.h - 40;
  const X = x => L + (x - o.x0) / (o.x1 - o.x0) * (R - L);
  const Y = y => base - (y - o.y0) / (o.y1 - o.y0) * (base - T);
  svgNode('line', { x1: L, y1: base, x2: R, y2: base, stroke: COL.grey }, svg);
  svgNode('line', { x1: L, y1: T, x2: L, y2: base, stroke: COL.grey }, svg);
  for (const v of o.xt) svgText(svg, X(v), base + 17, String(v), { 'text-anchor': 'middle', 'font-size': 14 });
  for (const v of o.yt) svgText(svg, L - 7, Y(v) + 5, String(v), { 'text-anchor': 'end', 'font-size': 14 });
  svgTex(svg, (L + R) / 2, base + 31, o.xlabel, { w: R - L + 20, size: 14 });
  if (o.ylabel) haloTex(svg, L + 6, T + 9, o.ylabel, { w: 120, anchor: 'start', size: 14, fill: COL.text2 });

}
// A clip rectangle, so lines that leave a panel are cut at its edge.
let clipN = 0;
function clipRect(svg, x, y, w, ht) {
  const id = 'clip' + (++clipN);
  const cp = svgNode('clipPath', { id }, svgNode('defs', {}, svg));

}

// ---------- step 1: best-fit (Lecture 14, 27:38 and 28:42) ----------
function slideBest(widget, side) {
  const LINES = [
    { id: 'A', f: () => 2, color: 'muted', dash: '6 4', at: 3.3, label: String.raw`$A$: $y=2$`, y0: 2, above: true },
    { id: 'B', f: x => 0.9 + 0.9 * x, color: 'accent', dash: null, at: 3.3, label: String.raw`$B$: $y=0.9+0.9x$`, y0: 0, above: false },
    { id: 'C', f: x => 1 + x, color: 'hueOrangeInk', dash: '2 4', at: 3.3, label: String.raw`$C$: $y=1+x$`, y0: 0, above: true },
  ];
  const E = {};
  for (const L of LINES) E[L.id] = sseOf(L.f, PTS);
  let shown = null;

  const g = guessBox(String.raw`Guess first: which line has the smallest total of squared errors?`,
    [['A', '$A$'], ['B', '$B$'], ['C', '$C$']], 'B',
    String.raw`$B$, with $E=0.70$. Line $C$ passes through three points, but its miss at $(2,2)$ costs $1$, so $E=1$.`,
    'Click a line to see its squares.');
  const chips = LINES.map(L => {
    const b = mark(h('button', 'btn'), 'control', 'show-' + L.id, 'line ' + L.id);
    setTex(b, String.raw`Squares for $${L.id}$`);
    b.addEventListener('click', () => { shown = L.id; emit('view.action', { action: 'show-line', line: L.id }); refresh(); });
    return b;
  });
  const rE = {};
  for (const L of LINES) rE[L.id] = readout('e-' + L.id, String.raw`$E$ for $${L.id}$`);

  let plot = null;
  function drawBest(svg, W, H) {
    const A = axes2d(svg, W, H, { x0: -0.4, x1: 3.4, y0: 0, y1: 4.9, xt: [0, 1, 2, 3], yt: [0, 1, 2, 3, 4],
      xlabel: String.raw`$x$, position`, ylabel: String.raw`$y$, reading` });
    const ppu = (A.base - A.T) / 4.9;   // pixels per unit of y
    for (const L of LINES) {
      const d = 'M' + A.X(-0.4) + ' ' + A.Y(L.f(-0.4)) + ' L' + A.X(3.4) + ' ' + A.Y(L.f(3.4));
      const attrs = { d, fill: 'none', stroke: COL[L.color], 'stroke-width': 2.5, 'data-item': 'mark', 'data-id': 'line-' + L.id };
      if (L.dash) attrs['stroke-dasharray'] = L.dash;
      svgNode('path', attrs, svg);
    }
    if (shown) {
      const L = LINES.find(q => q.id === shown);
      for (const [x, y] of PTS) {
        const fx = L.f(x), r = y - fx, side = Math.abs(r) * ppu;
        svgNode('line', { x1: A.X(x), y1: A.Y(y), x2: A.X(x), y2: A.Y(fx), stroke: COL.muted, 'stroke-dasharray': '3 3', 'data-item': 'mark', 'data-id': 'miss' }, svg);
        svgNode('rect', { x: A.X(x) + 6, y: A.Y(Math.max(y, fx)), width: side, height: side,
          fill: COL.grey, 'fill-opacity': 0.55, stroke: COL.muted, 'data-item': 'mark', 'data-id': 'square-' + x }, svg);
      }
    }
    // direct labels: A and C at the right end, B at the left end, each clear of the others
    const where = {
      A: [3.3, 2.16, 'end'],
      B: [-0.35, LINES[1].f(-0.35) - 0.3, 'start'],
      C: [3.3, LINES[2].f(3.3) + 0.22, 'end'],
    };
    for (const L of LINES) {
      const [x, y, anc] = where[L.id];
      haloTex(svg, A.X(x), A.Y(y), L.label, { w: 190, anchor: anc, size: 15, fill: COL[L.color] });
    }
    PTS.forEach(([x, y]) => {
      svgNode('circle', { cx: A.X(x), cy: A.Y(y), r: 6, fill: COL.ink, 'data-item': 'mark', 'data-id': 'point-' + x }, svg);
      if (x === 3) haloTex(svg, A.X(x) + 10, A.Y(y) + 18, String.raw`$(${x},${y})$`, { w: 80, anchor: 'start', size: 14, fill: COL.ink });
      else haloTex(svg, A.X(x) - 10, A.Y(y) - 16, String.raw`$(${x},${y})$`, { w: 80, anchor: 'end', size: 14, fill: COL.ink });
    });
  }
  function refresh() {
    chips.forEach((b, i) => b.classList.toggle('on', LINES[i].id === shown));
    for (const L of LINES) rE[L.id].set(E[L.id].toFixed(2));
    plot.redraw();
  }

  widget.append(g.el, hh('div', 'readouts', rE.A.el, rE.B.el, rE.C.el), hh('div', 'sliders', ...chips));
  plot = fillPlot(widget, drawBest);
  widget.append(legend([
    { chip: true, color: 'var(--pal-ink)', text: String.raw`filled dots: the four points you measured` },
    { chip: true, color: 'color-mix(in srgb, var(--pal-grey) 60%, transparent)', text: String.raw`grey squares: $r^2$ for the chosen line; dashed: its miss $r$` },
  ]));
  refresh();

  side.append(
    sym(String.raw`$(x,y)$: a point you measured. $r$: the vertical miss from a point to a line. $E$: the sum of the squared misses.`),
    nameLine(String.raw`$r$ for <i>residual</i>, from Latin <i>residuum</i>, what is left over: the part of $y$ the line does not explain.`),
    setTex(h('div', 'formula'), String.raw`$$E=\sum_i\,(y_i-a-bx_i)^2$$`),
    triesList([
      String.raw`Guess, then click each line. Read $E$ for $A$, $B$, $C$.`,
      String.raw`Line $C$ hits three points exactly. Why is it not the best?`,
      String.raw`The best line is the one with the smallest $E$.`,
    ]),
    takeLine(String.raw`The best line has the smallest total of squared misses.`),
    whereLine(String.raw`Hamming, L14 28:42: "most of you believe least squares is a good thing to do ... i'm not saying it is."`));
}

// ---------- step 2: calculus (Lecture 14, 27:38 to 30:48) ----------
const AMIN = -0.5, AMAX = 2.5, BMIN = -0.5, BMAX = 2.0;   // the (a, b) window of the bowl, steps 2 and 3
const Eab = (aa, bb) => sseOf(x => aa + bb * x, PTS);
function mapColor(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function rgbOf(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function cellColor(e, c0, c1) {
  const t = Math.min(1, Math.sqrt(e) / Math.sqrt(12));
  return 'rgb(' + c0.map((v, i) => Math.round(v + (c1[i] - v) * t)).join(',') + ')';
}
// The bowl E(a, b) as a heat map on axes A (dark is small).
function drawHeat(svg, A, NA, NB) {
  const da = (AMAX - AMIN) / NA, db = (BMAX - BMIN) / NB;
  const c0 = rgbOf(mapColor('--map-lo')), c1 = rgbOf(mapColor('--map-hi'));
  const cw = A.X(AMIN + da) - A.X(AMIN), chh = A.Y(BMIN) - A.Y(BMIN + db);
  for (let i = 0; i < NA; i++) for (let j = 0; j < NB; j++) {
    const a0 = AMIN + (i + 0.5) * da, b0 = BMIN + (j + 0.5) * db;
    svgNode('rect', { x: A.X(AMIN + i * da).toFixed(2), y: A.Y(BMIN + (j + 1) * db).toFixed(2),
      width: (cw + 0.6).toFixed(2), height: (chh + 0.6).toFixed(2), fill: cellColor(Eab(a0, b0), c0, c1), 'data-item': 'mark', 'data-id': 'cell' }, svg);
  }
}
// The two slopes of E at (a, b), and the sums they come from.
function slopesAt(a, b) {
  let sr = 0, sxr = 0;
  for (const [x, y] of PTS) { const r = y - a - b * x; sr += r; sxr += x * r; }
  return { sr, sxr, da: -2 * sr, db: -2 * sxr };
}
function slideCalc(widget, side) {
  let a = 0, b = 0, showBottom = false;
  const sA = slider(String.raw`$a$, intercept`, { id: 'a', name: 'a, intercept', min: AMIN, max: AMAX, step: 0.01, value: a,
    fmt: v => v.toFixed(2), onInput: v => { a = v; update(); } });
  const sB = slider(String.raw`$b$, slope`, { id: 'b', name: 'b, slope', min: BMIN, max: BMAX, step: 0.01, value: b,
    fmt: v => v.toFixed(2), onInput: v => { b = v; update(); } });
  const rDa = readout('dE-da', String.raw`$\partial E/\partial a$ here`);
  const rDb = readout('dE-db', String.raw`$\partial E/\partial b$ here`);
  const rE = readout('E-here', String.raw`$E$ here`);
  const bottom = mark(h('button', 'btn', 'Show the bottom'), 'control', 'show-bottom');
  bottom.addEventListener('click', () => { showBottom = true; bottom.disabled = true; emit('view.action', { action: 'show-bottom' }); plot.redraw(); });

  let plot = null;
  function drawBowl(svg, W, H) {
    const A = axes2d(svg, W, H, { x0: AMIN, x1: AMAX, y0: BMIN, y1: BMAX, xt: [0, 1, 2], yt: [0, 1, 2],
      xlabel: String.raw`$a$, intercept`, ylabel: String.raw`$b$, slope` });
    drawHeat(svg, A, 60, 50);
    if (showBottom) {
      const cx = A.X(0.9), cy = A.Y(0.9), s = 9;
      svgNode('path', { d: `M${cx - s} ${cy} L${cx + s} ${cy} M${cx} ${cy - s} L${cx} ${cy + s}`, stroke: COL.bg, 'stroke-width': 4, 'data-item': 'mark', 'data-id': 'minimum-halo' }, svg);
      svgNode('path', { d: `M${cx - s} ${cy} L${cx + s} ${cy} M${cx} ${cy - s} L${cx} ${cy + s}`, stroke: COL.ink, 'stroke-width': 2, 'data-item': 'mark', 'data-id': 'minimum' }, svg);
      haloTex(svg, cx + 14, cy - 12, String.raw`minimum $(0.9,\ 0.9)$`, { w: 190, anchor: 'start', size: 15, fill: COL.ink });
    }
    const px = A.X(a), py = A.Y(b);
    svgNode('circle', { cx: px, cy: py, r: 7, fill: COL.ink, stroke: COL.panel, 'stroke-width': 2, 'data-item': 'mark', 'data-id': 'you' }, svg);
    haloTex(svg, px + 12, py + 16, String.raw`$(a,b)$ here`, { w: 120, anchor: 'start', size: 15, fill: COL.ink });
  }
  function update() {
    const s = slopesAt(a, b);
    rDa.set(f2(s.da));
    rDb.set(f2(s.db));
    rE.set(f2(Eab(a, b)));
    plot.redraw();
  }

  widget.append(hh('div', 'sliders', sA.el, sB.el, bottom), hh('div', 'readouts', rDa.el, rDb.el, rE.el));
  plot = fillPlot(widget, drawBowl);
  widget.append(legend([
    { chip: true, color: 'var(--map-lo)', text: String.raw`dark: small $E$` },
    { chip: true, color: 'var(--map-hi)', text: String.raw`the other end: large $E$` },
    { chip: true, color: 'var(--pal-ink)', text: String.raw`filled dot: your $(a,b)$` },
  ]));
  update();

  side.append(
    sym(String.raw`$E(a,b)$: the total of squared misses of the line $y=a+bx$. $\partial E/\partial a$: its slope as $a$ moves with $b$ held (Primer · Derivatives, step 9). Both equations hold at $a=b=0.9$; step 3 proves them.`),
    setTex(h('div', 'formula'), String.raw`$$\begin{aligned}\tfrac{\partial E}{\partial a}=0:&\quad 4a+6b=9\\ \tfrac{\partial E}{\partial b}=0:&\quad 6a+14b=18\end{aligned}$$`),
    triesList([
      String.raw`Set $a=1.5$, $b=0.5$. The $a$-slope is $0$, but the $b$-slope is $-4$: one zero slope is not the bottom.`,
      String.raw`Set $a=b=0.9$, where both equations hold. Both slopes read $0$. Press Show the bottom.`,
    ]),
    takeLine(String.raw`At the best line both slopes are zero: two equations for the two unknowns.`),
    whereLine(String.raw`Hamming, L14 29:14: "the variables are a and b so i differentiate this minimum with respect to a and ... with respect to b."`));
}

// ---------- step 3: why both slopes zero give the two equations (proof) ----------
function drawWhyEq(svg, W, H, a, b, lit, shown) {
  const Ls = litSet(lit);
  const CAP = {
    slices: String.raw`amber: the two ways to move from $(a,b)$: $a$ alone, or $b$ alone`,
    misses: String.raw`amber: the misses $r_i=y_i-a-bx_i$ of your line`,
    weights: String.raw`amber: $a$ up shifts your line; $b$ up turns it about $x=0$`,

// ---------- step 8: which functions to fit (Lectures 24, 26, 27) ----------
const XS8 = [0, 1, 2, 3, 4, 5, 6, 7];
const YS8 = [1.33, 1.87, 1.8, 0.17, -1.03, -2.12, -1.6, -0.27];
const FAMILIES = {
  line: { name: 'Line', params: 2, basis: [x => 1, x => x], f: String.raw`$$y\approx c_0+c_1x$$`, label: 'line' },
  parabola: { name: 'Parabola', params: 3, basis: [x => 1, x => x, x => x * x], f: String.raw`$$y\approx c_0+c_1x+c_2x^2$$`, label: 'parabola' },
  sine: { name: 'Sine, period 8', params: 3, basis: [x => 1, x => Math.cos(2 * Math.PI * x / 8), x => Math.sin(2 * Math.PI * x / 8)],
    f: String.raw`$$y\approx c_0+c_1\cos\tfrac{2\pi x}{8}+c_2\sin\tfrac{2\pi x}{8}$$`, label: 'sine, period 8' },
};
function slideFamily(widget, side) {
  let which = 'line';
  const fits = {};
  for (const k in FAMILIES) fits[k] = fitFamily(FAMILIES[k].basis, XS8, YS8);
  const chips = {};
  for (const k in FAMILIES) {
    const b = mark(h('button', 'btn', FAMILIES[k].name), 'control', 'family-' + k, FAMILIES[k].name);
    b.addEventListener('click', () => { which = k; emit('view.action', { action: 'show-family', family: k }); refresh(); });
    chips[k] = b;
  }
  const rP = readout('params', 'parameters');
  const rE = readout('E-family', String.raw`$E$, squared misses`);
  const formulaBox = h('div', 'formula');
  let plot = null;
  function drawFam(svg, W, H) {
    const A = axes2d(svg, W, H, { x0: -0.5, x1: 7.5, y0: -3, y1: 3, xt: [0, 1, 2, 3, 4, 5, 6, 7], yt: [-2, 0, 2],
      xlabel: String.raw`$x$, position (0 to 7)`, ylabel: String.raw`$y$, value` });
    const fam = FAMILIES[which], fit = fits[which];
    let d = '';
    for (let i = 0; i <= 200; i++) {
      const x = -0.5 + i * 8 / 200;
      d += (i ? 'L' : 'M') + A.X(x).toFixed(1) + ' ' + A.Y(fit.at(x)).toFixed(1);
    }
    svgNode('path', { d, fill: 'none', stroke: COL.accent, 'stroke-width': 2.5, 'data-item': 'mark', 'data-id': 'fit-' + which }, svg);
    haloTex(svg, A.X(7.3), A.Y(fit.at(7)) + (which === 'sine' ? 18 : -18), String.raw`blue: best ${fam.label}`, { w: 220, anchor: 'end', size: 15, fill: COL.accent });
    XS8.forEach((x, i) => svgNode('circle', { cx: A.X(x), cy: A.Y(YS8[i]), r: 6, fill: COL.ink, 'data-item': 'mark', 'data-id': 'data-' + x }, svg));
  }
  function refresh() {
    for (const k in chips) chips[k].classList.toggle('on', k === which);
    rP.set(String(FAMILIES[which].params));
    rE.set(fits[which].E.toFixed(2));
    setTex(formulaBox, FAMILIES[which].f);
    plot.redraw();
  }
  widget.append(hh('div', 'sliders', chips.line, chips.parabola, chips.sine), hh('div', 'readouts', rP.el, rE.el));
  plot = fillPlot(widget, drawFam);
  widget.append(legend([
    { chip: true, color: 'var(--pal-ink)', text: String.raw`filled dots: eight measured values` },
    { color: 'var(--pal-accent)', text: String.raw`blue: the best curve in the family you chose` },
  ]));
  refresh();

  side.append(
    sym(String.raw`The family: the curves you allow. Least squares picks the best of them.`),
    formulaBox,
    triesList([
      String.raw`Click Line, then Parabola: $E$ is $6.46$, then $5.47$.`,
      String.raw`Click Sine, period 8: $E$ is $0.12$.`,
      String.raw`Which family would you pick before seeing the dots?`,
    ]),
    takeLine(String.raw`The family sets how close any fit can get: a line cannot bend to a wave, however many points you add.`),
    whereLine(String.raw`Hamming's client knew frequencies, not polynomials (L26 13:43). Planck fit the form physics suggested (L24 08:01). Model error and data error both sit in $E$ (L27 16:18).`));
}

// ---------- frame ----------
const SLIDES = [
  { id: 'best-fit', title: 'What is a best fit, and why squares?', tag: 'Used in L14 27:38 · L14 28:42',
    question: String.raw`Four readings do not sit on one line. What makes one line a better fit, and why squares?`, mount: slideBest },
  { id: 'calculus', title: 'Calculus finds the bottom', tag: 'Used in L14 29:14 · L14 30:17',
    question: 'How do you find $a$ and $b$ without trying lines?', mount: slideCalc },
  { id: 'why-normal-equations', proof: true, title: String.raw`Why it's true: $4a+6b=9$, $6a+14b=18$`, name: "Why it's true: 4a+6b=9, 6a+14b=18", tag: 'Used in L14 29:14 · L14 30:17',
    question: String.raw`Why do two zero slopes give these two equations?`, mount: slideWhyEq },
  { id: 'more-parameters', title: 'A parabola: three unknowns, three equations', tag: 'Used in L14 30:48 · L14 31:20',
    question: 'With one more unknown, what do the equations look like?', mount: slideParab },
  { id: 'why-normal-matrix', proof: true, title: String.raw`Why it's true: $X^\top X\,c=X^\top y$`, name: "Why it's true: XᵀXc = Xᵀy", tag: 'Used in L14 30:48 · L14 31:20',
    question: String.raw`Where does $X^\top X$ come from?`, mount: slideWhyMat },
  { id: 'projection', title: 'The fit is a shadow of the data', tag: 'Used in L14 41:15 to 41:46',
    question: 'At the best line, what is left over, and how does it relate to the model?', mount: slideProj },
  { id: 'why-projection', proof: true, title: String.raw`Why it's true: the shadow is the closest line`, tag: 'Used in L14 41:15 to 41:46',
    question: String.raw`Why is no line closer to $y$ than $\hat y$?`, mount: slideWhyShadow },
  { id: 'family', title: 'Which functions should you fit?', tag: 'Used in L26 13:11 to 14:13 · L24 08:01 · L27 16:18',
    question: 'What can the fit bend to, and who decides that?', mount: slideFamily },
];
// The view's close. The primer's last proof lists every move the primer's proofs used, in order of first
// use, once it is proved, so the list never gives a pick away; the last step names what comes next.
const PRIMER_MOVES = ['Use an earlier result', 'Name a piece', 'Rearrange', 'Unfold the definition', 'Add zero or multiply by one', 'Compare or bound'];
const LAST_PROOF = 'why-projection';
const NEXT = 'Next: Primer · Fourier series, where the columns are waves.';

let cur = 0, shownId = null, endSent = false;
function goTo(i) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  if (shownId !== null && shownId !== s.id) emit('view.step', { step: s.id });
  shownId = s.id;
  const stage = $('#stage');
  PLOTS = [];
  stage.innerHTML = '';
  const widget = h('div', 'widget');
  const side = hh('div', 'side',
    h('div', 'tag', s.tag),
    setTex(h('h2'), s.title),
    setTex(h('p', 'question'), s.question));
  const sec = mark(h('section', 'slide' + (s.proof ? ' proof-slide' : '')), 'step', s.id, s.name || s.title.replace(/\$/g, ''));
  sec.append(widget, side);
  stage.append(sec);
  stage.scrollTop = 0;
  s.mount(widget, side);
  if (s.id === LAST_PROOF) side.querySelector('fl-proof-steps').primerMoves = PRIMER_MOVES;
  if (cur === SLIDES.length - 1) {
    side.append(h('p', 'next', NEXT));
    if (!endSent) { endSent = true; emit('view.action', { action: 'deck-end' }); }
  }
  tex(sec);
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, i) => d.classList.toggle('on', i === cur));
}
// A cue is a state: go to the named step, and do nothing if it is already shown.
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i >= 0 && i !== cur) goTo(i);
}
(function init() {
  const dots = $('#dots');
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = s.name || s.title.replace(/\$/g, '');
    b.addEventListener('click', () => goTo(i));
    dots.appendChild(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],textarea,select')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
})();
</script>

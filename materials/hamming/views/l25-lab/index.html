<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>After Lecture 25: practice creative judgment</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><script src="../../components/theme.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--pal-bg);color:var(--pal-fg);font:20px/1.4 system-ui}body{padding:26px 34px}header{height:86px}h1{font-size:32px;margin:4px 0}h2{font-size:25px;margin:0 0 18px}p{margin:10px 0}.tag{font-size:16px;color:var(--pal-muted)}main{display:grid;grid-template-columns:60% 40%;height:530px;gap:0}.widget{padding:18px;background:var(--pal-soft);border:1px solid var(--pal-line);border-radius:16px;display:flex;flex-direction:column;gap:12px}.explain{padding:8px 0 0 28px;display:flex;flex-direction:column}ol{padding-left:25px;font-size:20px}li{margin:0 0 14px}.take{padding:15px;background:var(--pal-accent-soft);border-left:4px solid var(--pal-accent);margin-top:auto;font-size:21px}.source{font-size:16px;color:var(--pal-muted);margin-top:14px}.cards{display:grid;gap:10px}.card{text-align:left;border:1px solid var(--pal-line);border-radius:10px;background:var(--pal-panel);color:var(--pal-fg);padding:10px 13px;font:17px/1.25 system-ui;cursor:pointer}.card strong{display:block;font-size:20px}.card.picked{border:3px solid var(--pal-accent);padding:8px 11px}.verdict{margin-top:6px;color:var(--pal-text-2);font-size:16px}.correct{background:var(--pal-good-bg)}button{font:18px system-ui;padding:10px 16px;border:1px solid var(--pal-line);border-radius:8px;background:var(--pal-panel);color:var(--pal-fg);cursor:pointer}button:disabled{opacity:.45;cursor:default}button.active{background:var(--pal-accent-soft);border-color:var(--pal-accent)}.controls{display:flex;gap:12px;margin-top:auto}.proofline{padding:15px;border-left:4px solid var(--pal-accent);background:var(--pal-panel)}.proofline small{display:block;color:var(--pal-muted);font-size:17px}.row{display:flex;gap:12px}.tile{padding:12px;font-size:18px;border:1px solid var(--pal-line);border-radius:9px;background:var(--pal-panel)}.bridge{padding:12px;background:var(--pal-accent-soft);font-size:19px;min-height:80px}.bars{flex:1;min-height:160px;display:flex;align-items:end;justify-content:space-around;gap:16px;height:180px}.barcol{display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;width:28%;font-size:18px}.bar{background:var(--pal-accent);width:100%;min-height:20px;color:var(--pal-on-accent);display:flex;align-items:center;justify-content:center;font-size:24px}footer{height:48px;display:flex;align-items:center;gap:15px;margin-top:10px}#count{margin-right:auto;font-size:17px;color:var(--pal-muted)}a{color:var(--pal-accent-deep)}</style></head><body><header><div class="tag" id="tag"></div><h1 id="title"></h1></header><main><section class="widget" id="widget"></section><section class="explain"><h2 id="q"></h2><ol id="steps"></ol><div class="take" id="take"></div><p class="source" id="source"></p></section></main><footer><span id="count"></span><button id="prev">Previous</button><button id="next">Next</button></footer><script>const slides=[{"title": "Would you sign the paper?", "time": "07:32\u201309:40", "q": "Can applying a textbook method be a creative contribution?", "kind": "choice", "lead": "Your least-squares method solves a magnetics problem", "cards": [["Decline the paper", "Your technique is familiar in mathematics. Assume only a new technique counts.", "This ignores whether the destination field gained a useful capability."], ["Sign, with clear credit", "The application matters to the field. Assume the contribution is the transfer.", "Hamming\u2019s choice after advice. State what was borrowed and what the application adds. He retained reservations."], ["Claim a new method", "The magnetics experts did not use it. Assume that makes the technique itself new.", "New to an application is not the same as inventing least squares."]], "answer": 1, "steps": ["Choose before revealing the advice.", "Read every verdict. What would you need to verify in the destination field?"], "take": "The difficult step may be seeing a useful connection, even when executing it is easy.", "note": "Source: Hamming\u2019s magnetics paper and his physicist friend\u2019s circuit-theory transfer, 08:02\u201309:40."}, {"title": "Give one idea more ways back", "time": "20:40\u201323:15", "q": "Why can you know a method yet fail to recall it when needed?", "kind": "hooks", "lead": "Stored idea: a weighted average", "steps": ["Select \u201cone setting\u201d; inspect what a new problem can retrieve.", "Select \u201cseveral hooks\u201d; click each problem to see the bridge."], "take": "A hook names shared structure, not just a second keyword.", "note": "The weighted-average examples are teaching cases. Hamming\u2019s source case is Tukey connecting polarized light to radar."}, {"title": "Borrow the move, test the match", "time": "19:38\u201320:40", "q": "How far can an analogy carry you?", "kind": "analogy", "lead": "A library suggests an AI retrieval design", "steps": ["Reveal each connection and its limit.", "Choose one limit. Name a test before carrying the analogy further."], "take": "An analogy suggests the next experiment; it does not prove that the systems are equivalent.", "note": "An invented AI exercise based on Hamming\u2019s warning that a useful analogy can be loose and partial."}, {"title": "Which assumption does the work?", "time": "18:34\u201319:38", "q": "How can cleaning up an explanation reveal an unnecessary assumption?", "kind": "proof", "lead": "Toy claim: a shuffled list keeps its largest value", "lines": [["Start with the values 2, 9, 4.", "The largest value is 9."], ["Shuffle to 4, 2, 9.", "Only their order changes."], ["Every old value is still present.", "A shuffle removes no entries and adds none."], ["The largest value is unchanged.", "The argument never required positive values."]], "steps": ["Predict whether negative entries would break the claim.", "Reveal the argument. Point to the fact that actually matters."], "take": "Remove an assumption only after checking where the argument uses it.", "note": "A small proof exercise, not a claim that every creative result admits this exact cleanup. Hamming\u2019s example asks whether continuity was used."}, {"title": "An insight needs an attempt to break it", "time": "17:01\u201318:04", "q": "What should follow the feeling that you have found the answer?", "kind": "choice", "lead": "A retriever finds every answer in a small development set", "cards": [["Publish the success rate", "All 20 examples worked. Assume these are representative.", "The observation is real but the general claim is not yet tested."], ["Tune until the chart is perfect", "Keep changing the retriever on those 20 examples. Assume more tuning means more evidence.", "Tuning can improve the system while making this set weaker evidence of generalization."], ["Find a failure case", "Try an unseen query whose relevant document uses different wording. Assume the intended claim includes this case.", "A failure narrows the claim or points to a revision. A pass still does not prove every case."]], "answer": 2, "steps": ["Pick the next move.", "Read all verdicts. Write the claim a failure would actually contradict."], "take": "A failed attempt can sharpen the problem if you record what it rules out.", "note": "This is an invented AI application of Hamming\u2019s discussion of false solutions and checking what an answer requires."}, {"title": "Is the finish line moving?", "time": "29:32\u201332:39", "q": "When should persistence trigger a review of the problem?", "kind": "forecast", "lead": "Two invented project histories", "steps": ["Switch between projects. Bars show months still forecast at each review.", "Predict which history deserves a problem review, then reveal the check."], "take": "Repeatedly unchanged distance is a warning signal; inspect evidence before deciding to stop.", "note": "Toy forecasts illustrate Hamming\u2019s nonlinear-filter case. They are not data about a real researcher or a stopping rule."}, {"title": "Make a small change observable", "time": "27:24\u201328:27 / application", "q": "How can a mental habit become something you can practice?", "kind": "choice", "lead": "You read a useful method but recall it only in its original field", "cards": [["Promise a new personality", "Resolve to be more creative from now on. Assume intention changes habits.", "No cue or action makes success observable."], ["Add one bridge after reading", "After each paper, write one other task with the same structure and one limit. Assume the bridge can be checked.", "A small repeated action practices the retrieval habit from the lecture. Review whether the bridge helped later."], ["Copy Hamming\u2019s deadline tactic", "Promise a result every Monday. Assume pressure works the same for everyone.", "Hamming explicitly said this depended on his pride and self-confidence; it may not fit you."]], "answer": 1, "steps": ["Choose a habit you could try after one paper.", "Name the next paper and the concrete bridge you would write."], "take": "Change one repeatable action, then inspect what it did for you.", "note": "This exercise combines Hamming\u2019s small-step advice with his retrieval-hook practice; it is a proposed practice, not an established creativity treatment."}];const section="After Lecture 25";
let index=0;const state=slides.map(()=>({pick:null,show:false,line:0,mode:0,problem:0}));
const $=s=>document.querySelector(s);function math(){if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:'$',right:'$',display:false}],throwOnError:false})}
function act(f){f(state[index]);render()}
function render(){let d=slides[index],s=state[index];$('#title').textContent=d.title;$('#tag').textContent=section+' · '+d.time;$('#q').textContent=d.q;$('#steps').innerHTML=d.steps.map(t=>'<li>'+t+'</li>').join('');$('#take').textContent=d.take;$('#take').style.visibility=s.show||!['choice','proof','forecast'].includes(d.kind)?'visible':'hidden';$('#source').textContent=d.note;$('#count').textContent=(index+1)+' / '+slides.length;$('#prev').disabled=index===0;$('#next').disabled=index===slides.length-1;let h='<h2>'+d.lead+'</h2>';
if(d.kind==='choice'){h+='<div class="cards">'+d.cards.map((c,i)=>`<button class="card ${s.pick===i?'picked':''} ${s.show&&d.answer===i?'correct':''}" data-item="option" data-id="${i}" onclick="act(s=>{s.pick=${i};s.show=true})"><strong>${c[0]}</strong>${c[1]}${s.show?'<div class="verdict">'+c[2]+'</div>':''}</button>`).join('')+'</div><div class="controls"><button onclick="act(s=>s.show=true)">Show answer</button><button onclick="act(s=>{s.pick=null;s.show=false})">Reset</button></div>'}
if(d.kind==='proof'){h+=d.lines.slice(0,s.line).map(c=>'<div class="proofline">'+c[0]+'<small>'+c[1]+'</small></div>').join('');h+='<div class="controls"><button '+(s.line===d.lines.length?'disabled':'')+' onclick="act(s=>{s.line++;s.show=s.line===slides[index].lines.length})">Next line</button><button onclick="act(s=>{s.line=0;s.show=false})">Reset</button></div>'}
if(d.kind==='hooks'){let problems=['Noisy sensor','Unequal classes','Recent change'];let bridge=['Average repeated readings: independent noise can partly cancel. Check for shared bias first.','Weight rare-class examples more heavily: they count more in the average loss. Check what target distribution you want.','Give recent observations more weight: the average follows change faster. Check the extra sensitivity to noise.'];h+='<div class="row">'+['One setting','Several hooks'].map((x,i)=>`<button class="${s.mode===i?'active':''}" onclick="act(s=>s.mode=${i})">${x}</button>`).join('')+'</div><div class="tile">Known setting: average several classroom test scores.</div><p>New problem:</p><div class="row">'+problems.map((x,i)=>`<button class="${s.problem===i?'active':''}" onclick="act(s=>s.problem=${i})">${x}</button>`).join('')+'</div><div class="bridge">'+(s.mode?bridge[s.problem]:'Only “classroom scores” is filed here. What shared structure would make the average retrievable?')+'</div><p class="source">Each hook links a task to the operation: combine contributions, with a reason for the weights.</p>'}
if(d.kind==='analogy'){let rows=[['Library catalogue → retrieval index','Both help locate a candidate. A match in the index is not proof the document answers the question.'],['Librarian’s follow-up → query clarification','Both can ask what the requester means. A model can also invent intent; check the clarification with the user.'],['Shelf location → semantic similarity','Both put some related items nearby. Embedding distance may group wording rather than the relation the task needs.']];h+=rows.map((r,i)=>'<div class="tile"><strong>'+r[0]+'</strong>'+(s.line>i?'<p>'+r[1]+'</p>':'')+'</div>').join('');h+='<div class="controls"><button '+(s.line===3?'disabled':'')+' onclick="act(s=>s.line++)">Reveal next limit</button><button onclick="act(s=>s.line=0)">Reset</button></div>'}
if(d.kind==='forecast'){let vals=s.mode?[18,12,6]:[18,18,18];h+='<div class="row">'+['Always 18 months away','Forecast shrinks'].map((x,i)=>`<button class="${s.mode===i?'active':''}" onclick="act(s=>{s.mode=${i};s.show=false})">${x}</button>`).join('')+'</div><div class="bars">'+vals.map((v,i)=>'<div class="barcol"><div class="bar" style="height:'+v*7+'px">'+v+'</div><p>Review '+(i+1)+'</p></div>').join('')+'</div><p>Filled bars: forecast months remaining. Reviews are six months apart.</p>'+(s.show?'<div class="bridge">'+(s.mode?'The falling forecast is consistent with progress. Check completed milestones before trusting it.':'Review the framing and milestones. A fixed distance can reflect a poor forecast, new scope, or a wrong problem.')+'</div>':'')+'<div class="controls"><button onclick="act(s=>s.show=true)">Show answer</button></div>'}
$('#widget').innerHTML=h;math()}
$('#prev').onclick=()=>{index--;render()};$('#next').onclick=()=>{index++;render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&index<slides.length-1){index++;render()}if(e.key==='ArrowLeft'&&index>0){index--;render()}});window.addEventListener('load',render);render();
</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>A filter by demands, and the jump no sum can make</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../../components/theme.js"></script>
<style>
/* Colors: grey for exact values and inputs, blue for outputs and the reader's choice,
   amber for what the newest proof line is about, red only for a failed check. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft); --red:var(--pal-red);
  --u:clamp(16px,1.35vw,20px);
  /* Light-only tints and series colors: no palette entry has the same light value, so light keeps its
     old look and the dark values below come from the palette. */
  --tint:#f9fafb; --rim:#eceef2; --warn-rim:#f5d48a; --k9:#93c5fd; --k19:#3b82f6; --k39:#1e3a8a;
  --ink-blue:#1e3a8a; --warn-ink:#b45309; --shade:16%;
}
:root[data-fluid-theme="dark"]{
  --tint:var(--pal-soft); --rim:var(--pal-line); --warn-rim:var(--pal-amber-bg);
  --k9:var(--pal-accent-2); --k19:var(--pal-accent); --k39:var(--pal-ink);
  --ink-blue:var(--pal-accent); --warn-ink:var(--pal-amber); --shade:30%;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 24px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(6px,1vh,12px) 24px;overflow:hidden}
footer{display:flex;align-items:center;gap:10px;padding:8px 24px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Content slide: widget on the left (3/5), text on the right (2/5). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(18px,2.4vw,40px)}
.widget{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(5px,0.9vh,9px);overflow:hidden}
.widget>*{max-width:100%;min-width:0}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(6px,1.1vh,12px);overflow:hidden}
.tag{font:14px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(20px,1.9vw,28px);line-height:1.2;margin:0;font-weight:650}
.question{margin:0;font-size:clamp(16px,1.3vw,18px);font-weight:600}
.formula{font-size:clamp(17px,1.5vw,22px)}
.sym{margin:0;font-size:16px;color:var(--muted)}
.tries{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.tries li::marker{color:var(--pal-accent-deep);font-weight:600}
.where{margin:0;font-size:16px}
.where b{color:var(--pal-accent-deep)}
.takeaway{margin:0;padding:10px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px;transition:opacity .2s}

/* Controls and readouts */
.sliders{display:flex;gap:8px 22px;flex-wrap:wrap;width:100%;align-items:center}
.slide-ctl{display:flex;align-items:center;gap:8px;font-size:16px}
.slide-ctl input{width:clamp(110px,10vw,160px);vertical-align:middle;accent-color:var(--accent)}
.slide-ctl .val{min-width:50px;white-space:nowrap}
.btn{font:inherit;padding:5px 11px;border:1px solid var(--line);background:var(--pal-panel);border-radius:8px;cursor:pointer;font-size:16px;line-height:1.3}
.btn.on{background:var(--chip);border-color:var(--accent);color:var(--pal-accent-deep)}
.btn:disabled{color:var(--muted);cursor:default;opacity:.6}
.btnrow{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap}
.btnrow .lab{font-size:16px;color:var(--muted);margin-right:2px}
.readouts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.readout{flex:1 1 120px;min-width:0;padding:3px 8px;border-radius:10px;background:var(--pal-soft);font-size:15px;overflow-wrap:anywhere}
.readout .k{color:var(--muted);font-size:14px}
.readout .val{font-size:16px;font-weight:600}
.legend{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:15px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:20px;height:0;vertical-align:middle;margin-right:6px}
.chip{display:inline-block;width:18px;height:12px;vertical-align:middle;margin-right:6px;border-radius:2px}
.note{min-height:34px;display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;font-size:16px;padding:2px 10px;border-radius:8px;background:var(--tint);border:1px solid var(--rim)}
.note.ask{background:var(--pal-amber-row);border-color:var(--warn-rim)}
.note .good{color:var(--pal-accent-deep);font-weight:600}

/* Plots fill the space left in the widget column */
.fill{flex:1 1 0;min-height:120px;position:relative;width:100%}
.fill>svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* Proof slides: test and picture on the left, the proof (fl-proof-steps) on the right */
.slide.proof-slide{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(18px,2.2vw,34px)}
.slide.proof-slide h2{font-size:clamp(20px,1.75vw,26px)}
.slide.proof-slide .side{gap:clamp(4px,0.8vh,9px)}
.slide.proof-slide .side{justify-content:flex-start}
.slide.proof-slide .slide-ctl input{width:clamp(90px,8vw,130px)}
.slide.proof-slide .slide-ctl .val{min-width:40px}
.slide.proof-slide .sliders{gap:6px 14px}
.slide.proof-slide .fill{min-height:180px}
.readouts.inline .readout{display:flex;gap:4px 8px;align-items:baseline;flex-wrap:wrap}
.part{margin:0;font-weight:600;color:var(--muted)}
.test{display:flex;flex-direction:column;gap:3px;font-size:16px}
.test .tries{gap:3px}
.model{margin:0;padding:7px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}

/* Decision slides: the problem, three cards and the reveal on the left; question, try-steps,
   AI echo and takeaway on the right. */
.slide.decision{grid-template-columns:minmax(0,2.05fr) minmax(0,1fr);gap:clamp(20px,2.6vw,40px)}
.decision .widget{gap:6px}
.decision .side{justify-content:space-evenly;gap:clamp(8px,1.8vh,18px)}
.decision h2{font-size:clamp(23px,2.3vw,32px)}
.decision .q{margin:0;font-size:clamp(17px,1.55vw,21px);font-weight:600;line-height:1.35}
.decision .fx{margin:0;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--tint);font-size:clamp(17px,1.6vw,22px);line-height:1.4}
.decision .kicker{font-size:14px;color:var(--muted);margin:0 0 3px}
.decision .blk{display:flex;flex-direction:column;gap:3px}
.decision .ai{margin:0;font-size:16px;line-height:1.4}
.decision .ai .src{color:var(--muted);font-size:14px}
.decision .takeaway{padding:11px 14px;line-height:1.4}
.decision .tries{gap:6px;font-size:clamp(16px,1.35vw,18px);line-height:1.4}
.decision .hold{color:var(--muted);font-style:italic;background:var(--tint);border:1px dashed var(--line);border-radius:6px;padding:9px 12px;margin:0;font-size:16px;line-height:1.4}
.prob{flex:0 0 auto;border:1px solid var(--line);border-radius:10px;padding:6px 14px;background:var(--tint);font-size:16px;line-height:1.4}
.prob .lead{font-weight:650;color:var(--muted)}
.prob p{margin:0}
.opts{flex:0 0 auto;display:flex;flex-direction:column;gap:clamp(4px,0.5vw,8px)}
.opt{display:grid;grid-template-columns:minmax(0,0.78fr) minmax(0,1.22fr);gap:0 14px;padding:clamp(6px,0.7vw,10px) 12px;border:1px solid var(--line);border-radius:10px;background:var(--pal-panel);color:inherit;text-align:left;cursor:pointer;min-width:0;font:inherit}
.opt .lhs{display:flex;flex-direction:column;gap:3px;min-width:0}
.opt .rhs{display:flex;flex-direction:column;gap:3px;min-width:0;border-left:1px solid var(--pal-soft-2);padding-left:14px}
.opt:not([aria-disabled="true"]):hover{border-color:var(--accent)}
.opt[aria-disabled="true"]{cursor:default}
.opt .top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:16px}
.opt .letter{font-weight:700;color:var(--pal-accent-deep)}
.opt .who{font-size:14px;color:var(--muted);text-align:right}
.opt .body{font-size:clamp(16px,1.4vw,19px);line-height:1.3}
.opt .asm{margin:0;font-size:clamp(16px,1.3vw,18px);line-height:1.33;color:var(--muted)}
.opt .verdict{font-size:clamp(16px,1.3vw,18px);line-height:1.33;color:var(--fg)}
.opt .verdict.idle{color:var(--muted);font-style:italic}
.opt.on{box-shadow:inset 0 0 0 2px var(--pal-ink)}
.opt.chooser{background:var(--chip);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.opt.chooser .who{color:var(--pal-accent-deep);font-weight:600}
.reveal{flex:1 1 auto;min-height:0;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:clamp(16px,1.25vw,18px);display:flex;flex-direction:column;justify-content:center;gap:6px}
.reveal.idle{background:var(--tint);color:var(--muted)}
.rv{margin:0;line-height:1.38}
.rv .k{font-weight:650;color:var(--pal-accent-deep)}
.rv .t{color:var(--muted);font-size:14px;white-space:nowrap}
.rv.hold{color:var(--muted)}
.decision .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px}
.decision .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--pal-on-accent);padding:6px 16px}

/* Short windows (1100x620 and similar): tighter spacing, body text stays 16px */
@media (max-height: 680px){
  header{padding-top:4px}
  #stage{padding:4px 24px}
  footer{padding:4px 24px}
  .widget{gap:4px}
  .side{gap:4px}
  .tries{gap:2px}
  .sym,.where,.tries,.test,.model{line-height:1.22}
  .readout{padding:2px 8px}
  .takeaway{padding:6px 10px}
  .formula{font-size:18px}
  h2{font-size:20px}
  .fill{min-height:100px}
  .note{min-height:30px;padding:1px 8px}
  .model{padding:5px 10px}
  .btn{padding:3px 9px}
  .slide-ctl input{width:100px}
  .slide.proof-slide .slide-ctl input{width:64px}
  .slide.proof-slide .slide-ctl .val{min-width:30px}
  .slide.proof-slide .sliders{gap:4px 10px}
  .slide.proof-slide .fill{min-height:165px}
  .decision h2{font-size:23px}
  .decision .side{gap:7px}
  .decision .tries{gap:2px;line-height:1.3}
  .decision .takeaway{padding:7px 12px}
  .reveal{gap:3px;padding:5px 12px}
  .rv{line-height:1.28}
  .opts{gap:3px}
  .opt{padding:4px 12px}
  .opt .body,.opt .asm,.opt .verdict{line-height:1.25}
  .prob{padding:4px 12px;line-height:1.3}
}
</style>
</head>
<body>
<header id="head">Lecture 15 · A filter by demands, and the jump no sum can make</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script src="../../components/proof-steps.js"></script>
<script>
// ---------- numbers (checked against lectures/15-digital-filters-part-ii/checks.py, and with node) ----------
const PI = Math.PI;
// A number with d decimals, without a minus sign on zero.
const fixed = (v, d) => (Math.abs(v) < 0.5 * Math.pow(10, -d) ? 0 : v).toFixed(d);
// Up to d decimals, trailing zeros dropped: 0.5, -1, 0.866.
const short = (v, d) => { let s = fixed(v, d == null ? 3 : d); if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, ''); return s === '-0' ? '0' : s; };

// Two demands: y_n = a u_{n-1} + b u_n + a u_{n+1}, H(f) = b + 2a cos 2 pi f.
const HZ = 180;                         // samples per second, so 60 Hz is f = 1/3
const HAM = { fp: 1 / 6, fs: 1 / 3 };   // Hamming's pass and stop frequencies
function solveAB(fp, fs) {
  const cp = Math.cos(2 * PI * fp), cs = Math.cos(2 * PI * fs), a = 1 / (2 * (cp - cs));
  return { a, b: -2 * a * cs };
}
const Hab = (f, a, b) => b + 2 * a * Math.cos(2 * PI * f);

// The step (0 on the left, 1 on the right of x = 0), cut after the odd wave K.
function SK(x, K) { let s = 0; for (let k = 1; k <= K; k += 2) s += Math.sin(k * x) / k; return 0.5 + 2 / PI * s; }
// Its slope, sin(2Mx) / (pi sin x) with K = 2M - 1.
function SKslope(x, K) { const M = (K + 1) / 2; return Math.abs(Math.sin(x)) < 1e-9 ? 2 * M / PI : Math.sin(2 * M * x) / (PI * Math.sin(x)); }
// Si(u) = integral of sin(s)/s from 0 to u, by the midpoint rule on a fine grid (Si(pi) = 1.851937).
const SI_H = 0.002;
const SI_T = (() => { const t = [0]; let s = 0; for (let i = 0; i < 6500; i++) { const m = (i + 0.5) * SI_H; s += Math.sin(m) / m * SI_H; t.push(s); } return t; })();
function Si(u) { const i = Math.max(0, Math.min(SI_T.length - 2, Math.floor(u / SI_H))), fr = u / SI_H - i; return SI_T[i] + fr * (SI_T[i + 1] - SI_T[i]); }

// ---------- palette ----------
// COL holds the palette colors for the SVG being drawn. fillPlot reads it at every paint, so a draw always
// uses the current theme. A theme switch redraws the plots on the slide; DOM state (sliders, picks) stays.
let COL = {};
const PAL_NAMES = ['ink', 'text-2', 'muted', 'grid', 'guide', 'grey', 'accent', 'accent-2', 'panel', 'soft-2', 'line',
  'on-accent', 'bg', 'amber', 'amber-bg', 'amber-ink', 'red'];
const VIEW_TOKENS = ['k9', 'k19', 'k39', 'ink-blue', 'warn-ink'];   // view-only colors, see the CSS :root
const camel = n => n.replace(/-(\w)/g, (_, c) => c.toUpperCase());
function readPalette() {
  const o = {};
  for (const n of PAL_NAMES) o[camel(n)] = FluidTheme.color(n);
  const cs = getComputedStyle(document.documentElement);
  for (const n of VIEW_TOKENS) o[camel(n)] = cs.getPropertyValue('--' + n).trim();
  return o;
}
let PLOTS = [];   // the plots on the current slide: a theme switch redraws them
window.addEventListener('fluid-themechange', () => PLOTS.forEach(p => p.redraw()));
// The K series colors (lighter for smaller K), read at paint time.
const kCol = k => COL[{ 9: 'k9', 19: 'k19', 39: 'k39' }[k]];

// ---------- DOM and drawing helpers ----------
const $ = s => document.querySelector(s);
const NSV = 'http://www.w3.org/2000/svg', NHT = 'http://www.w3.org/1999/xhtml';
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false } ], throwOnError: false };
// Render $...$ in a node. If the CDN did not load, the text stays as typed.
function tex(node) {
  if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH);
  return node;
}
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function hh(tag, cls, ...kids) {
  const e = h(tag, cls);
  for (const k of kids) if (k) e.append(k);
  return e;
}
function mark(e, kind, id, title) {
  e.dataset.item = kind;
  if (id != null) e.dataset.id = id;
  if (title != null) e.dataset.title = title;
  return e;
}
function svgNode(tag, attrs, parent) {
  const e = document.createElementNS(NSV, tag);
  for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function svgRoot(w, ht) {
  return svgNode('svg', { viewBox: '0 0 ' + w + ' ' + ht, role: 'img', 'font-family': 'system-ui, sans-serif', 'font-size': 14 });
}
function svgText(parent, x, y, s, attrs) {
  const t = svgNode('text', Object.assign({ x: x, y: y, fill: COL.muted, 'font-size': 14 }, attrs || {}), parent);
  t.textContent = s;
  return t;
}
// A KaTeX label over an SVG: a foreignObject holding a rendered formula. o.bg paints a background.
function svgTex(parent, x, y, s, o) {
  o = o || {};
  const w = o.w || 220, ht = o.ht || 26, anchor = o.anchor || 'middle';
  const x0 = anchor === 'end' ? x - w : anchor === 'start' ? x : x - w / 2;
  const fo = svgNode('foreignObject', { x: x0, y: y - ht / 2, width: w, height: ht }, parent);
  const d = document.createElementNS(NHT, 'div');
  const jc = anchor === 'end' ? 'flex-end' : anchor === 'start' ? 'flex-start' : 'center';
  d.setAttribute('style', 'display:flex;align-items:center;height:100%;white-space:nowrap;font-size:' +
    (o.size || 15) + 'px;color:' + (o.fill || COL.text2) + ';justify-content:' + jc);
  const span = document.createElementNS(NHT, 'span');
  span.textContent = s;
  if (o.bg) span.setAttribute('style', 'background:' + o.bg + ';border-radius:5px;padding:1px 5px');
  if (o.halo) span.setAttribute('style', 'text-shadow:0 0 3px ' + COL.bg + ',0 0 3px ' + COL.bg + ',0 0 2px ' + COL.bg);
  d.appendChild(span);
  fo.appendChild(d);
  tex(span);
  return fo;
}
const haloTex = (parent, x, y, s, o) => svgTex(parent, x, y, s, Object.assign({ halo: true }, o || {}));
function path(svg, pts, attrs, close) {
  const d = 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L') + (close ? 'Z' : '');
  return svgNode('path', Object.assign({ d: d, fill: 'none' }, attrs), svg);
}
function dot(svg, x, y, color, r) {
  return svgNode('circle', { cx: x, cy: y, r: r || 5, fill: color, stroke: COL.panel, 'stroke-width': 1.5 }, svg);
}
// Tick label: KaTeX if it has $, plain text otherwise.
function tick(svg, x, y, s, anchor) {
  return s.indexOf('$') >= 0 ? svgTex(svg, x, y, s, { w: 80, size: 14, anchor: anchor || 'middle', fill: COL.muted }) :
    svgText(svg, x, y + 5, s, { 'text-anchor': anchor || 'middle' });
}
// A labelled range input. label and the value text are LaTeX-ready.
function slider(label, o) {
  const wrap = h('label', 'slide-ctl');
  const lab = tex(h('span', '', label));
  const val = h('span', 'val', '');
  const inp = h('input');
  inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step; inp.value = o.value;
  mark(inp, 'control', o.id, o.name || o.id);
  wrap.append(lab, inp, val);
  const fmtv = o.fmt || String;
  const api = {
    el: wrap, input: inp,
    get value() { return +inp.value; },
    set(v) { inp.value = v; api.show(); },
    show() { setTex(val, fmtv(+inp.value)); },
  };
  inp.addEventListener('input', () => { api.show(); if (o.onInput) o.onInput(+inp.value); });
  api.show();
  return api;
}
// A readout box: label and value are LaTeX-ready text.
function readout(id, label) {
  const box = mark(h('div', 'readout'), 'readout', id);
  const k = h('div', 'k');
  setTex(k, label);
  const v = h('div', 'val');
  box.append(k, v);
  return { el: box, set(text) { setTex(v, text); }, label(text) { setTex(k, text); } };
}
function legend(items) {
  const d = h('div', 'legend');
  for (const it of items) {
    const s = h('span');
    const sw = it.chip ? h('span', 'chip') : h('span', 'sw');
    if (it.chip) { sw.style.background = it.color; if (it.ring) { sw.style.background = 'var(--pal-panel)'; sw.style.border = '2px solid ' + it.color; sw.style.borderRadius = '50%'; sw.style.width = '13px'; sw.style.height = '13px'; } }
    else sw.style.borderTop = (it.width || 2) + 'px ' + (it.dash ? 'dashed' : 'solid') + ' ' + it.color;
    const t = h('span');
    setTex(t, it.text);
    s.append(sw, t);
    d.appendChild(s);
  }
  return d;
}
// A plot that takes the height left in its box. draw(svg, W, H) runs on every resize and may
// return a geometry object (wrap._geo) that the pointer handlers use.
function fillPlot(box, draw) {
  const wrap = h('div', 'fill');
  box.append(wrap);
  let key = '';
  const paint = force => {
    const w = Math.floor(wrap.clientWidth), ht = Math.floor(wrap.clientHeight);
    if (w < 60 || ht < 60) return;
    if (!force && key === w + 'x' + ht) return;
    key = w + 'x' + ht;
    COL = readPalette();
    const svg = svgRoot(w, ht);
    wrap._geo = draw(svg, w, ht) || null;
    wrap.replaceChildren(svg);
  };
  new ResizeObserver(() => paint(false)).observe(wrap);
  const plot = { wrap, redraw: () => paint(true) };
  PLOTS.push(plot);
  return plot;
}
function sym(text) { return setTex(h('p', 'sym'), text); }
function triesList(items) { return hh('ol', 'tries', ...items.map(t => setTex(h('li'), t))); }
function takeLine(text) { return setTex(h('p', 'takeaway'), text); }
function noticeLine(text) { const p = h('p', 'where'); p.append(h('b', '', 'Notice: ')); p.append(setTex(h('span'), text)); return p; }
// Session events. With no bridge, nothing is sent and the view still works.
function emit(kind, data) {
  try {
    if (window.fluid && typeof window.fluid.emit === 'function') Promise.resolve(window.fluid.emit(kind, data)).catch(() => {});
  } catch (e) { /* no bridge */ }
}

// ---------- proof slides: shared parts ----------
// Amber marks what the newest proof line is about, in the picture and in the proof.
function glowPath(svg, pts, wdt) {
  return path(svg, pts, { stroke: COL.amberBg, 'stroke-width': wdt || 12, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
}
function glowFill(svg, pts) {
  return path(svg, pts, { fill: COL.amberBg, 'fill-opacity': .9, stroke: COL.amber, 'stroke-width': 1.5 }, true);
}
function glowDot(svg, x, y, r) {
  return svgNode('circle', { cx: x, cy: y, r: r || 9, fill: COL.amberBg, stroke: COL.amber, 'stroke-width': 1.5 }, svg);
}
// While a proof line is lit, a caption in the top row says what the amber part is.
function litCaption(svg, W, text) { svgTex(svg, W / 2, 13, text, { w: W - 8, size: 15, fill: COL.amberInk, bg: COL.amberBg }); }
function plainCaption(svg, W, text) { svgTex(svg, W / 2, 13, text, { w: W - 8, size: 14, fill: COL.muted }); }
// Left column of a proof slide: controls, the picture, legend, readouts, the test, the model.
function proofLeft(widget, o) {
  for (const row of o.controls || []) widget.append(row);
  const plot = fillPlot(widget, o.draw);
  widget.append(legend(o.legend));
  if (o.readouts && o.readouts.length) widget.append(hh('div', 'readouts' + (o.inline ? ' inline' : ''), ...o.readouts.map(r => r.el)));
  const test = hh('div', 'test', h('p', 'part', 'Test it'), triesList(o.tests));
  const model = h('p', 'model');
  model.append(h('span', 'part', 'The picture: '), setTex(h('span'), o.model));
  widget.append(test, model);
  return { redraw: plot.redraw, wrap: plot.wrap, test: test };
}
// Right column: the proof. Each revealed line lights its part of the picture; once the proof is
// done, the look-back questions take the place of the test under the picture.
function proofRight(side, spec, plot, onLight) {
  const el = document.createElement('fl-proof-steps');
  el.onEvent = d => emit('view.action', d);
  el.onHighlight = key => onLight(key);
  el.lookBackHost = plot.test;
  el.lookBackHint = 'Look back: under the picture.';
  el.data = spec;
  side.append(el);
  return el;
}

// ---------- step 2: two-demands (04:55 to 14:05) ----------
function slideTwoDemands(widget, side) {
  let fp = HAM.fp, fs = HAM.fs, hz = 30, mix = false, curve = false, cursorN = 5, drag = null;
  // Predict H at 0, 1/4 and 1/2 for Hamming's filter before the output and the curve show.
  const pred = { 0: null, 45: null, 90: null };
  const PRED = {
    0: { lab: 'H(0)', ans: 1.5, ansTex: String.raw`\tfrac32`, opts: [[String.raw`$1$`, 1], [String.raw`$\tfrac32$`, 1.5], [String.raw`$\tfrac12$`, 0.5]],
      note: 'all ones come out as $1.5$: the filter lifts the mean by half.' },
    45: { lab: String.raw`H(\tfrac14)`, ans: 0.5, ansTex: String.raw`\tfrac12`, opts: [[String.raw`$1$`, 1], [String.raw`$\tfrac12$`, 0.5], [String.raw`$0$`, 0]],
      note: 'the output is half the input.' },
    90: { lab: String.raw`H(\tfrac12)`, ans: -0.5, ansTex: String.raw`-\tfrac12`, opts: [[String.raw`$\tfrac12$`, 0.5], [String.raw`$0$`, 0], [String.raw`$-\tfrac12$`, -0.5]],
      note: 'the output is half the input, sign flipped.' } };
  const isHam = () => Math.abs(fp - HAM.fp) < 1e-9 && Math.abs(fs - HAM.fs) < 1e-9;
  const gated = () => !mix && !curve && (hz in pred) && pred[hz] === null;
  const input = n => mix ? Math.cos(2 * PI * n / 6) + Math.cos(2 * PI * n / 3) : Math.cos(2 * PI * hz / HZ * n);

  const CH = [['$0$', 0], [String.raw`$\tfrac16$`, 30], [String.raw`$\tfrac14$`, 45], [String.raw`$\tfrac13$`, 60], [String.raw`$\tfrac12$`, 90], [String.raw`$\tfrac16+\tfrac13$`, 'mix']];
  const chips = CH.map(([t, v]) => {
    const b = mark(h('button', 'btn'), 'preset', v === 'mix' ? 'fin-mix' : 'fin-' + v + 'hz');
    setTex(b, t);
    b.addEventListener('click', () => {
      if (v === 'mix') mix = true; else { mix = false; hz = v; sF.set(v); }
      update();
    });
    b._v = v;
    return b;
  });
  const sF = slider(String.raw`$f_{in}$`, { id: 'f-in', name: 'input frequency, Hz at 180 samples per second', min: 0, max: 90, step: 1, value: hz,
    fmt: v => '$' + (v / HZ).toFixed(4) + '$ · ' + v + ' Hz at 180/s', onInput: v => { hz = v; mix = false; update(); } });
  const showCurve = mark(h('button', 'btn', 'Show the curve'), 'control', 'show-curve');
  showCurve.addEventListener('click', () => { curve = true; update(); });
  const resetH = mark(h('button', 'btn'), 'preset', 'hamming-demands');
  setTex(resetH, String.raw`Hamming: $\tfrac16$, $\tfrac13$`);
  resetH.addEventListener('click', () => { fp = HAM.fp; fs = HAM.fs; update(); });
  const note = mark(h('div', 'note'), 'readout', 'note');
  const rA = readout('a', '$a$'), rB = readout('b', '$b$'), rH0 = readout('H0', '$H(0)$'), rH5 = readout('Hhalf', String.raw`$H(\tfrac12)$`);
  widget.append(
    hh('div', 'btnrow', setTex(h('span', 'lab'), 'input $f_{in}$:'), ...chips),
    hh('div', 'sliders', sF.el, hh('div', 'btnrow', showCurve, resetH)),
    note,
    legend([
      { color: 'var(--pal-accent)', width: 3, text: String.raw`blue curve: $H(f)$` },
      { chip: true, color: 'var(--pal-grey)', text: String.raw`grey stems: input $u_n$` },
      { chip: true, color: 'var(--pal-accent)', text: String.raw`blue stems: output $y_n$` },
      { chip: true, color: 'color-mix(in srgb, var(--pal-accent) var(--shade), transparent)', text: String.raw`shaded: the three $u$ in $y_n$` }]));
  const plot = fillPlot(widget, draw);
  mark(plot.wrap, 'control', 'response-plot');
  widget.append(hh('div', 'readouts', rA.el, rB.el, rH0.el, rH5.el));

  function noteFill() {
    note.replaceChildren();
    note.classList.remove('ask');
    if (gated()) {
      const P = PRED[hz];
      note.classList.add('ask');
      note.append(setTex(h('span'), 'Predict $' + P.lab + '$ for this filter:'));
      P.opts.forEach(([t, v]) => {
        const b = mark(h('button', 'btn'), 'control', 'predict-' + hz + 'hz-' + short(v));
        setTex(b, t);
        b.addEventListener('click', () => {
          pred[hz] = v;
          emit('view.action', { action: 'predict', step: 'two-demands', f: short(hz / HZ, 4), value: v, correct: v === P.ans });
          if (pred[0] !== null && pred[45] !== null && pred[90] !== null) curve = true;
          update();
        });
        note.append(b);
      });
    } else if (!mix && (hz in pred) && pred[hz] !== null && isHam()) {
      const P = PRED[hz], right = pred[hz] === P.ans;
      if (right) note.append(h('span', 'good', 'Right.'));
      else note.append(setTex(h('span'), 'You said $' + short(pred[hz]) + '$.'));
      note.append(setTex(h('span'), '$' + P.lab + '=' + P.ansTex + '$: ' + P.note));
    } else if (mix) {
      note.append(setTex(h('span'), String.raw`Input: the sum of the two columns. Output: the $f=\tfrac16$ part alone (grey rings).`));
    } else {
      note.append(setTex(h('span'), String.raw`Drag the pass or stop handle along $f$; $a$ and $b$ are solved again.`));
    }
  }
  function update() {
    const { a, b } = solveAB(fp, fs);
    rA.set('$' + fixed(a, 4) + '$');
    rB.set('$' + fixed(b, 4) + '$');
    rH0.set(curve || pred[0] !== null ? '$' + fixed(Hab(0, a, b), 4) + '$' : 'predict first');
    rH5.set(curve || pred[90] !== null ? '$' + fixed(Hab(0.5, a, b), 4) + '$' : 'predict first');
    chips.forEach(c => c.classList.toggle('on', c._v === 'mix' ? mix : !mix && c._v === hz));
    showCurve.disabled = curve;
    noteFill();
    plot.redraw();
  }

  function draw(svg, W, Hh) {
    const L = 46, R = 16, cap = 20, pw = W - L - R;
    const avail = Math.max(120, Hh - cap - 28 - 24 - 22);
    const h1 = Math.round(avail * 0.55), h2 = avail - h1;
    const T1 = cap, B1 = T1 + h1, T2 = B1 + 28 + 24, B2 = T2 + h2;
    const X = f => L + f / 0.5 * pw, Y = v => B1 - (v + 1.25) / 3 * h1;
    const { a, b } = solveAB(fp, fs);
    // top panel: H(f)
    const clip = svgNode('clipPath', { id: 'td-clip' }, svgNode('defs', {}, svg));
    svgNode('rect', { x: L, y: T1, width: pw, height: h1 }, clip);
    path(svg, [[L, T1], [L, B1], [W - R, B1]], { stroke: COL.grey });
    for (const v of [0, 1]) svgNode('line', { x1: L, x2: W - R, y1: Y(v), y2: Y(v), stroke: COL.soft2, 'stroke-dasharray': v ? '3 3' : null }, svg);
    for (const v of [-1, 0, 1]) tick(svg, L - 8, Y(v), String(v), 'end');
    for (let i = 0; i <= 5; i++) tick(svg, X(i / 10), B1 + 14, (i / 10).toFixed(1));
    svgTex(svg, L + 2, 10, '$H(f)$', { w: 60, anchor: 'start', size: 15 });
    haloTex(svg, W - R, B1 - 11, String.raw`$f$`, { w: 30, anchor: 'end', size: 15 });
    if (curve) {
      const pts = [];
      for (let i = 0; i <= 300; i++) { const f = 0.5 * i / 300; pts.push([X(f), Y(Hab(f, a, b))]); }
      path(svg, pts, { stroke: COL.accent, 'stroke-width': 3, 'clip-path': 'url(#td-clip)', 'data-item': 'mark', 'data-id': 'H-curve' });
      const lf = Math.abs(fp) < 0.08 || Math.abs(fs) < 0.08 ? 0.47 : 0.03;
      const lv0 = Hab(lf, a, b), lv = Math.max(-1.1, Math.min(1.6, lv0));
      if (lv === lv0) haloTex(svg, X(lf) + (lf < 0.25 ? 8 : -8), Y(lv) + (lv > 1.3 ? 16 : -16), '$H(f)$', { w: 60, anchor: lf < 0.25 ? 'start' : 'end', size: 15, fill: COL.accent });
    } else {
      svgTex(svg, W - R, 10, String.raw`rest of $H(f)$ hidden: predict at $0,\ \tfrac14,\ \tfrac12$, or drag a handle`, { w: pw - 60, anchor: 'end', size: 15, fill: COL.warnInk });
      for (const k of [0, 45, 90]) if (pred[k] !== null) {
        const f = k / HZ, v = Hab(f, a, b);
        dot(svg, X(f), Y(v), COL.accent, 5);
        if (mix || k !== hz) haloTex(svg, X(f) + (f < 0.4 ? 8 : -8), Y(v) + 15, '$H=' + PRED[k].ansTex + '$', { w: 80, anchor: f < 0.4 ? 'start' : 'end', size: 15, fill: COL.accent });
      }
    }
    // the input frequency: the ratio y_n / u_n is H(f_in)
    const fins = mix ? [1 / 6, 1 / 3] : gated() ? [] : [hz / HZ];
    for (const f of fins) {
      svgNode('line', { x1: X(f), x2: X(f), y1: T1, y2: B1, stroke: COL.muted, 'stroke-dasharray': '4 3' }, svg);
      const v = Hab(f, a, b), vy = Math.max(T1 + 6, Math.min(B1 - 6, Y(v)));
      dot(svg, X(f), vy, COL.accent, 6).setAttribute('data-item', 'mark');
      const right = f < 0.36;
      haloTex(svg, X(f) + (right ? 10 : -10), vy + (v > 0.5 ? 16 : -16), String.raw`$y_n/u_n=` + fixed(v, 3) + '$', { w: 150, anchor: right ? 'start' : 'end', size: 15, fill: COL.inkBlue });
    }
    if (!mix && gated()) svgNode('line', { x1: X(hz / HZ), x2: X(hz / HZ), y1: T1, y2: B1, stroke: COL.amber, 'stroke-dasharray': '4 3' }, svg);
    // the two handles
    for (const [f, v, id, word, sub] of [[fp, 1, 'pass', 'pass', 'p'], [fs, 0, 'stop', 'stop', 's']]) {
      const x = X(f), y = Y(v);
      path(svg, [[x - 16, y], [x + 16, y]], { stroke: COL.grey, 'stroke-width': 2 });
      path(svg, [[x - 12, y - 4], [x - 16, y], [x - 12, y + 4]], { stroke: COL.grey, 'stroke-width': 2 });
      path(svg, [[x + 12, y - 4], [x + 16, y], [x + 12, y + 4]], { stroke: COL.grey, 'stroke-width': 2 });
      svgNode('circle', { cx: x, cy: y, r: 8, fill: COL.panel, stroke: COL.accent, 'stroke-width': 3, 'data-item': 'control', 'data-id': 'handle-' + id, style: 'cursor:ew-resize' }, svg);
      const anchor = f > 0.4 ? 'end' : f < 0.06 ? 'start' : 'middle';
      haloTex(svg, x, v ? y - 19 : y + 19, word + ' $f_' + sub + '=' + f.toFixed(3) + '$', { w: 150, anchor, size: 15, fill: COL.ink });
    }
    // the bracket formula between the panels
    const n = cursorN;
    const yb = B1 + 28 + 10;
    if (gated()) svgTex(svg, L, yb, 'output hidden until you predict', { w: pw, anchor: 'start', size: 15, fill: COL.muted });
    else {
      const u0 = input(n - 1), u1 = input(n), u2 = input(n + 1), y = a * u0 + b * u1 + a * u2;
      const p = v => (short(v, 2).startsWith('-') ? '(' + short(v, 2) + ')' : short(v, 2));
      const lead = isHam() ? String.raw`y_{${n}}=\tfrac12(u_{${n - 1}}+u_{${n}}+u_{${n + 1}})` : String.raw`y_{${n}}`;
      svgTex(svg, L, yb, '$' + lead + '=' + p(a) + String.raw`\cdot` + p(u0) + '+' + p(b) + String.raw`\cdot` + p(u1) + '+' + p(a) + String.raw`\cdot` + p(u2) + '=' + short(y, 2) + '$',
        { w: pw, anchor: 'start', size: 15, fill: COL.ink });
    }
    // bottom panel: input and output stems
    const RG = mix ? 2.3 : 1.7;
    const X2 = k => L + (k + 0.5) / 13 * pw, Y2 = v => (T2 + B2) / 2 - v / RG * (h2 / 2);
    const clip2 = svgNode('clipPath', { id: 'td-clip2' }, svg.querySelector('defs'));
    svgNode('rect', { x: L, y: T2 - 2, width: pw, height: h2 + 4 }, clip2);
    svgNode('rect', { x: X2(n - 1) - 10, y: T2, width: X2(n + 1) - X2(n - 1) + 20, height: h2, fill: COL.accent, 'fill-opacity': FluidTheme.isDark() ? 0.28 : 0.10, 'data-item': 'mark', 'data-id': 'bracket' }, svg);
    path(svg, [[L, T2], [L, B2]], { stroke: COL.grey });
    svgNode('line', { x1: L, x2: W - R, y1: Y2(0), y2: Y2(0), stroke: COL.grey }, svg);
    for (const v of mix ? [-1, 0, 1, 2] : [-1, 0, 1]) tick(svg, L - 8, Y2(v), String(v), 'end');
    for (let k = 0; k <= 12; k++) tick(svg, X2(k), B2 + 13, String(k));
    svgTex(svg, W - R, B2 + 13, '$n$', { w: 30, anchor: 'end', size: 15 });
    const g = svgNode('g', { 'clip-path': 'url(#td-clip2)' }, svg);
    for (let k = 0; k <= 12; k++) {
      const u = input(k), x = X2(k) - 4;
      svgNode('line', { x1: x, x2: x, y1: Y2(0), y2: Y2(u), stroke: COL.grey, 'stroke-width': 2.5 }, g);
      svgNode('circle', { cx: x, cy: Y2(u), r: 4, fill: COL.grey }, g);
      if (mix) svgNode('circle', { cx: X2(k) + 4, cy: Y2(Math.cos(2 * PI * k / 6)), r: 7.5, fill: 'none', stroke: COL.muted, 'stroke-width': 1.5 }, g);
    }
    if (!gated()) {
      for (let k = 1; k <= 11; k++) {
        const y = a * input(k - 1) + b * input(k) + a * input(k + 1), x = X2(k) + 4;
        svgNode('line', { x1: x, x2: x, y1: Y2(0), y2: Y2(y), stroke: COL.accent, 'stroke-width': k === n ? 3.5 : 2.5 }, g);
        svgNode('circle', { cx: x, cy: Y2(y), r: k === n ? 5 : 4, fill: COL.accent }, g);
      }
    } else {
      haloTex(svg, L + pw / 2, Y2(0) + h2 * 0.3, String.raw`blue output stems: hidden until you predict`, { w: pw, size: 15, fill: COL.muted });
    }
    return { X, Y, invX: px => (px - L) / pw * 0.5, T2, B2, toN: px => (px - L) / pw * 13 - 0.5 };
  }

  const at = e => { const r = plot.wrap.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  plot.wrap.addEventListener('pointerdown', e => {
    const g = plot.wrap._geo; if (!g) return;
    const p = at(e);
    const dp = Math.hypot(p.x - g.X(fp), p.y - g.Y(1)), ds = Math.hypot(p.x - g.X(fs), p.y - g.Y(0));
    if (Math.min(dp, ds) > 22) return;
    drag = dp <= ds ? 'p' : 's';
    plot.wrap.setPointerCapture(e.pointerId);
    e.preventDefault();
    curve = true;
    update();
  });
  plot.wrap.addEventListener('pointermove', e => {
    const g = plot.wrap._geo; if (!g) return;
    const p = at(e);
    if (drag) {
      const f = Math.max(0, Math.min(0.5, Math.round(g.invX(p.x) * 120) / 120));   // snap to 1/120
      const other = drag === 'p' ? fs : fp;
      if (Math.abs(f - other) < 3 / 120 - 1e-9) return;   // two demands too close need huge weights
      if (drag === 'p') fp = f; else fs = f;
      update();
    } else if (p.y > g.T2 - 12 && p.y < g.B2 + 12) {
      const n = Math.max(1, Math.min(11, Math.round(g.toN(p.x))));
      if (n !== cursorN) { cursorN = n; plot.redraw(); }
    }
  });
  const end = () => { drag = null; };
  plot.wrap.addEventListener('pointerup', end);
  plot.wrap.addEventListener('pointercancel', end);

  side.append(
    // pointers: p-matrices 'solve', p-waves 'values', p-complex 'shadow'
    sym(String.raw`$u_n$ input, $y_n$ output. Symmetric, so only $a$, $b$ are free. The demands $H(\tfrac16)=1$ (pass) and $H(\tfrac13)=0$ (stop) give $a=b=\tfrac12$ (Primer · Matrices, step 4). At $f=\tfrac16$ the input is $1,\tfrac12,-\tfrac12,-1,\dots$ (Primer · Waves, step 6).`),
    setTex(h('div', 'formula'), String.raw`$H(f)=b+2a\cos 2\pi f$`),
    sym(String.raw`from $a e^{-i2\pi f}+b+a e^{i2\pi f}$: a cosine is two half arrows (Primer · Complex numbers, step 6).`),
    triesList([
      String.raw`Pick $f_{in}=0$ (all ones) and predict before you look; then $\tfrac14$ and $\tfrac12$.`,
      String.raw`Drag pass to $0.05$ and stop to $0.25$. Now $H(\tfrac12)=-1.05$: the fastest wiggle passes at full size, flipped.`,
      String.raw`60 Hz wanders (12:51). At 180 samples/s it is $f=\tfrac13$. Slide to 55 Hz: $16\%$ gets through.`]),
    noticeLine('only the demanded points are fixed; between them the cosine goes where it likes.'),
    takeLine(String.raw`$k+1$ free coefficients meet $k+1$ demands exactly, and nothing else is controlled.`));
  update();
}

// ---------- step 4: not-uniform (proof, 15:56 to 18:37) ----------
function slideNotUniform(widget, side) {
  let mode = 'fourier', K = 9, n = 10, eps = 0.1, lit = '';
  const bF = mark(h('button', 'btn on'), 'control', 'mode-fourier');

  const sN = slider('$n$', { id: 'n', name: 'power n', min: 1, max: 100, step: 1, value: n, fmt: v => '$' + v + '$', onInput: v => { n = v; update(); } });
  const sE = slider(String.raw`$\varepsilon$`, { id: 'eps', name: 'tube half-width', min: 0.05, max: 0.4, step: 0.01, value: eps, fmt: v => '$' + v.toFixed(2) + '$', onInput: v => { eps = v; update(); } });
  const rG = readout('largest-gap', 'largest gap');

  function setMode(m) {
    mode = m;
    bF.classList.toggle('on', m === 'fourier');

  }
  bF.addEventListener('click', () => { setMode('fourier'); update(); });
  bP.addEventListener('click', () => { setMode('power'); update(); });
  const plot = proofLeft(widget, {
    controls: [hh('div', 'sliders', bF, bP, sK.el, sN.el, sE.el)],
    draw: draw,
    legend: [
      { color: 'var(--pal-muted)', width: 3, text: String.raw`grey: step $f$` },
      { color: 'var(--pal-accent)', width: 3, text: String.raw`blue: $S_K$` },
      { chip: true, color: 'color-mix(in srgb, var(--pal-grey) 30%, transparent)', text: String.raw`shaded: tube $\pm\varepsilon$` },
      { color: 'var(--pal-red)', width: 3, text: 'red: outside it' }],
    readouts: [rG, rP],
    tests: [
      String.raw`Guess: with enough terms, does $S_K$ fit in a tube of $\varepsilon=0.1$? Raise $K$ to $99$: it leaves the tube beside the jump at every $K$.`,

    plot, key => { lit = key || ''; if (lit && mode !== 'fourier') setMode('fourier'); update(); });

  function update() {

  function draw(svg, W, Hh) {

      : [[0, '0'], [0.25, '0.25'], [0.5, '0.5'], [0.75, '0.75'], [1, '1']];
    for (const [v, s] of xt) { svgNode('line', { x1: X(v), x2: X(v), y1: B, y2: B + 4, stroke: COL.grey }, svg); tick(svg, X(v), B + 15, s); }
    svgTex(svg, W - R, B - 12, '$x$', { w: 30, anchor: 'end', size: 15 });
    // the curve
    const N = four ? 1400 : 500;
    const g = x => four ? SK(x, K) : Math.pow(x, n);
    const lim = x => four ? (x > 0 ? 1 : 0) : (x < 1 ? 0 : 1);
    const pts = [];
    for (let i = 0; i <= N; i++) { const x = x0 + (x1 - x0) * i / N; pts.push([x, g(x)]); }
    if (four && lit === 'near0') {

      path(svg, [[X(0), Y(1)], [X(x1), Y(1)]], { stroke: COL.muted, 'stroke-width': 3 });

      haloTex(svg, X(x0) + 4, Y(eps) - 12, String.raw`tube $f\pm\varepsilon$`, { w: 120, anchor: 'start', size: 15, fill: COL.muted });
    } else {

    let run = [];

    // the proof's light

      const c = 0.5, x = X(0), yc = Y(c);

        if (lit === 'larger') haloTex(svg, x + 16, Y(0.08), String.raw`sum $\ge1$: one is $\ge\tfrac12$`, { w: 200, anchor: 'start', size: 15, fill: COL.ink });

  }
  setMode('fourier');

}

    const z1 = U ? PI : PI / (2 * M);
    if (lit === 'area') glowFill(svg, [[X(0), Y2(0)], ...spts.filter(p => p[0] <= z1).map(p => [X(p[0]), Y2(p[1])]), [X(z1), Y2(0)]]);
    if (lit === 'slope') glowPath(svg, spts.map(p => [X(p[0]), Y2(p[1])]), 10);
    if (U) {
      const lp = []; for (let i = 1; i <= 300; i++) { const t = x1 * i / 300; lp.push([X(t), Y2(Math.sin(t) / (PI * t))]); }
      path(svg, [[X(0), Y2(1 / PI)], ...lp], { stroke: COL.text2, 'stroke-width': 1.6, 'stroke-dasharray': '6 4' });
    }
    path(svg, spts.map(p => [X(p[0]), Y2(p[1])]), { stroke: Kc === 9 ? COL.accent2 : kCol(Kc), 'stroke-width': 2.5, 'data-item': 'mark', 'data-id': 'slope' });
    if (lit === 'zeros') {
      for (let j = 1; j * PI / (2 * M) <= x1 + 1e-9; j++) glowDot(svg, X(j * PI / (2 * M)), Y2(0), 7);
    }
    if (lit === 'peak') glowDot(svg, X(PI), Y2(0), 8);
    haloTex(svg, W - R - 4, T2 + 13, lab, { w: pw, anchor: 'end', size: 15, fill: COL.text2, ht: 24 });
    return null;
  }
}

// ---------- decision slides ----------
const D_TRIES = ['Read the problem.', 'Pick what you would do before he says it.', 'Read every verdict, not only yours.'];
const DECISIONS = {
  'smallest-filter': {
    problem: String.raw`Even students who took a course on digital filters are not sure how a short formula removes frequencies from a stream of numbers (04:21). Hamming wants them to see it happen.`,
    formula: String.raw`$y_n=\sum_k c_k\,u_{n+k}$`,
    chooser: 1, who: 'Hamming',
    options: [
      { text: String.raw`Prove it in general: $e^{i2\pi fn}$ goes in, $H(f)\,e^{i2\pi fn}$ comes out.`,
        assumes: 'a general proof is the same as understanding.',
        verdict: 'True and short (Lecture 14), but no number is ever seen being removed.' },
      { text: 'Build the smallest filter that can do it: two coefficients, two demands. Feed it exact cosines and check every output by hand.',
        assumes: 'the whole mechanism is already in the smallest case.',
        verdict: String.raw`All mental arithmetic: one frequency passes unchanged, the other comes out $0$, and their sum splits.` },
      { text: 'Run a recorded signal through a long filter and compare the plots.',
        assumes: 'a cleaner curve shows how it works.',
        verdict: 'Convincing to the eye, but no number can be checked, nor which frequency went where.' }],
    reveal: [
      { k: "Hamming's move", v: String.raw`Design the simplest filter, $y_n=a\,u_{n-1}+b\,u_n+a\,u_{n+1}$, and run it on numbers.`, t: '04:30' },
      { k: 'What it bought', v: 'You watch it split the input into frequencies, multiply each by its eigenvalue, and add them back.', t: '09:43' },
      { k: 'What it cost', v: 'Two demands fix two points; every other frequency is left to chance (next step).', t: '10:14' }],
    ai: 'Nanda et al. (2023) reverse-engineered a small transformer trained on modular addition. It adds the way this filter filters: numbers become waves at a few frequencies, and trig identities "convert addition to rotation about a circle."',
    src: 'arXiv 2301.05217',
    takeaway: 'Shrink the problem until every number can be checked by hand.' },
  'spend-coefficients': {
    problem: String.raw`The ideal low-pass is $1$ up to the cutoff $f_c$, then $0$: a jump. A symmetric filter with $2k+1$ weights leaves $k+1$ numbers $c_0,\dots,c_k$ to choose; no sum of cosines can jump.`,
    formula: String.raw`$H(f)=c_0+2\sum_{j=1}^{k}c_j\cos 2\pi fj$`,
    symbols: String.raw`$c_j$: the weight $j$ steps away, $c_{-j}=c_j$. The verdicts use $f_c=0.25$.`,
    chooser: 2, who: 'Hamming',
    options: [
      { text: String.raw`Nail $k+1$ values exactly, as with the two-coefficient filter.`,
        assumes: 'only the demanded frequencies matter.',
        verdict: String.raw`$9$ weights, pinned at $f=0,0.1,0.2$ (pass), $0.3,0.4$ (stop): $H(0.35)=-0.31$, $H(\tfrac12)=1.00$. Nothing else is controlled.` },
      { text: 'Make the largest error as small as possible (minimax).',
        assumes: 'the worst frequency is what matters.',
        verdict: String.raw`At a jump no continuous curve beats an error of $\tfrac12$ (step 4). It needs a free band at the cutoff and an iterative search.` },
      { text: String.raw`Make the average squared error small: expand the ideal shape in cosines, keep the first $k+1$ terms.`,
        assumes: 'error spread over all frequencies is what matters.',
        verdict: String.raw`One integral per coefficient. But beside the jump it overshoots: $10.0\%$ with $9$ weights, still $8.96\%$ with $101$.` }],
    reveal: [
      { k: "Hamming's move", v: 'Expand the ideal shape in cosines and cut it off: "we will get a least squares approximation" (book).', t: '14:40 to 15:20' },
      { k: 'What it bought', v: 'Each coefficient is one integral; more terms never change the earlier ones (Primer · Fourier series, step 6).', t: 'book' },
      { k: 'What it cost', v: 'The overshoot at the jump, fought for fifteen minutes. At 38:14 he picks minimax for another error: the largest side lobe.', t: '16:29' }],
    takeaway: 'Choose the error measure first; it decides where the error goes.' }
};
const DSTATE = {};
Object.keys(DECISIONS).forEach(id => { DSTATE[id] = { pick: null, open: false }; });
// Reveal a decision once; later calls change nothing. by: 'user' (a pick or the button) or 'cue'.
function revealDecision(id, by) {
  const st = DSTATE[id];
  if (!st || st.open) return false;
  st.open = true;
  emit('view.action', { action: 'reveal', step: id, by: by });
  return true;
}
function mountDecision(s, widget, side, sec) {
  const D = DECISIONS[s.id], st = DSTATE[s.id], open = st.open;
  const redraw = () => goTo(cur, true);
  const prob = mark(h('div', 'prob'), 'problem', s.id);
  prob.append(hh('p', '', h('span', 'lead', 'The problem.'), document.createTextNode(' '), setTex(h('span'), D.problem)));
  const opts = h('div', 'opts');
  D.options.forEach((o, k) => {
    const L = 'ABC'[k];
    const card = mark(h('div', 'opt'), 'card', L, o.text.replace(/\$/g, ''));
    card.setAttribute('role', 'button');
    card.setAttribute('aria-disabled', open ? 'true' : 'false');
    card.tabIndex = open ? -1 : 0;
    card.classList.toggle('on', st.pick === L);
    card.classList.toggle('chooser', open && k === D.chooser);
    const who = [];
    if (st.pick === L) who.push('Your pick');
    if (open && k === D.chooser) who.push(D.who);
    const top = hh('div', 'top', h('span', 'letter', L), h('span', 'who', who.join(', ')));
    const asm = setTex(h('p', 'asm'), 'Assumes: ' + o.assumes);
    const verdict = open ? setTex(h('div', 'verdict'), o.verdict) : h('div', 'verdict idle', 'Verdict after your pick.');
    card.append(hh('div', 'lhs', top, setTex(h('div', 'body'), o.text)), hh('div', 'rhs', asm, verdict));
    card.addEventListener('click', () => {
      if (DSTATE[s.id].open) return;
      st.pick = L;
      emit('view.action', { action: 'pick', step: s.id, option: L, correct: k === D.chooser });
      revealDecision(s.id, 'user');
      redraw();
    });
    opts.append(card);
  });
  const rev = mark(h('div', 'reveal'), 'reveal', s.id);
  if (!open) {
    rev.classList.add('idle');
    for (const r of D.reveal) rev.append(hh('p', 'rv hold', h('span', 'k', r.k + '. '), h('span', '', 'Shown after your pick.')));
    const btn = mark(h('button', 'btn primary', 'Show answer'), 'control', 'show-answer');
    btn.addEventListener('click', () => { if (revealDecision(s.id, 'user')) redraw(); });
    rev.append(hh('div', 'actions', btn));
  } else {
    for (const r of D.reveal) {
      const p = hh('p', 'rv', h('span', 'k', r.k + '. '));
      p.append(setTex(h('span'), r.v), h('span', 't', ' (' + r.t + ')'));
      rev.append(p);
    }
  }
  widget.append(prob, opts, rev);
  side.append(setTex(h('p', 'fx'), D.formula));
  if (D.symbols) side.append(sym(D.symbols));
  side.append(hh('div', 'blk', h('div', 'kicker', 'Try it'), hh('ol', 'tries', ...D_TRIES.map(t => h('li', '', t)))));
  if (D.ai) {
    if (open) {
      const p = setTex(h('p', 'ai'), D.ai);
      p.append(' ', h('span', 'src', '(' + D.src + ')'));
      side.append(hh('div', 'blk', h('div', 'kicker', 'Same move in AI research'), p));
    } else side.append(hh('div', 'blk', h('div', 'kicker', 'Same move in AI research'), h('p', 'hold ai', 'Shown after your pick.')));
  }
  side.append(open ? takeLine(D.takeaway) : h('p', 'hold', 'Takeaway: shown after your pick.'));
}

// ---------- frame ----------
const SLIDES = [
  { id: 'smallest-filter', kind: 'decision', tag: 'Lecture 04:00, answer 04:30', title: 'How do you show that a filter really filters?',
    question: 'How do you make the "miracle" of a digital filter something you can check?' },
  { id: 'two-demands', kind: 'content', tag: 'Lecture 04:55 to 14:05', title: 'Two demands, and the rest of the curve',
    question: String.raw`Hamming fixed $H$ at two frequencies. What does his filter do to all the others?`, mount: slideTwoDemands },
  { id: 'spend-coefficients', kind: 'decision', tag: 'Lecture 14:05, answer 15:20', title: 'How should a few cosines approximate a sharp cutoff?',
    question: String.raw`You have $k+1$ coefficients and want a sharp low-pass. Which error do you make small?` },
  { id: 'not-uniform', kind: 'proof', tag: 'Lecture 15:56 to 18:37', title: 'Why the error beside a jump never shrinks',
    question: 'Can more terms bring the partial sum close to the jump everywhere at once?',
    symbols: String.raw`$f$: the step. $S_K$: its Fourier series cut after wave $K$. Gap at $x$: $|S_K(x)-f(x)|$. Uniform: Latin uniformis, of one form, the same closeness at every $x$.`,
    mount: slideNotUniform },
  { id: 'squeeze', kind: 'proof', tag: 'Lecture 18:37 to 19:40 (and 16:29)', title: 'The overshoot is one shape, squeezed',
    question: 'Why does the peak beside the jump stay 9% high however many terms you take?',
    symbols: String.raw`$K=2M-1$: the last wave. $u=2Mx$: position in ripples. $\mathrm{Si}(u)=\int_0^u\frac{\sin s}{s}ds$: no closed form; $\mathrm{Si}(\pi)=1.8519$.`,
    mount: slideSqueeze },
];

let cur = 0, shownId = null, endSent = false;
function goTo(i, same) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  if (shownId !== null && shownId !== s.id) emit('view.step', { step: s.id });
  shownId = s.id;
  const stage = $('#stage');
  stage.innerHTML = '';
  PLOTS = [];
  const widget = h('div', 'widget');
  const side = h('div', 'side');
  side.append(h('div', 'tag', s.tag), setTex(h('h2'), s.title));
  side.append(setTex(h('p', s.kind === 'decision' ? 'q' : 'question'), s.question));
  if (s.symbols) side.append(sym(s.symbols));
  const cls = 'slide' + (s.kind === 'proof' ? ' proof-slide' : s.kind === 'decision' ? ' decision' : '');
  const sec = mark(h('section', cls), 'step', s.id, s.title.replace(/\$/g, ''));
  sec.append(widget, side);
  stage.append(sec);
  stage.scrollTop = 0;
  if (s.kind === 'decision') mountDecision(s, widget, side, sec);
  else s.mount(widget, side);
  // On a content slide the takeaway is dimmed until the user has tried a control.
  const tk = s.kind === 'content' ? side.querySelector('.takeaway') : null;
  if (tk) {
    tk.classList.add('dim');
    const openTk = () => tk.classList.remove('dim');
    sec.addEventListener('input', openTk);
    sec.addEventListener('click', e => { if (e.target.closest('[data-item="control"],[data-item="preset"]')) openTk(); });
    sec.addEventListener('pointerdown', e => { if (e.target.closest('[data-item="control"]')) openTk(); });
  }
  tex(sec);
  if (cur === SLIDES.length - 1 && !endSent) { endSent = true; emit('view.action', { action: 'deck-end' }); }
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, k) => d.classList.toggle('on', k === cur));
}
// A cue is a state. {step} goes to the step and does nothing if it is shown. {step, reveal: true}
// also reveals that decision, once; a revealed decision stays revealed.
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i < 0) return;
  const changed = msg.reveal === true && SLIDES[i].kind === 'decision' && revealDecision(SLIDES[i].id, 'cue');
  if (i !== cur || changed) goTo(i);
}
(function init() {
  const dots = $('#dots');
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = s.title.replace(/\$/g, '');
    b.addEventListener('click', () => goTo(i));
    dots.appendChild(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],textarea,select')) return;
    if (e.target && e.target.classList && e.target.classList.contains('opt') && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault(); e.target.click(); return;
    }
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
})();
</script>

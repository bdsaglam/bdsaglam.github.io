<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codes as spheres in the n-cube</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="../../components/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
/* Colors: white page, one accent (blue), red only for a failing check. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line); --surface:var(--pal-soft);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft); --good:var(--pal-good-line);
  --u:clamp(16px,1.35vw,20px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:10px 28px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(8px,1.2vh,16px) 28px}
footer{display:flex;align-items:center;gap:10px;padding:10px 28px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Slide frame: widget on the left (60%), text on the right (40%). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(20px,2.6vw,44px)}
.widget{min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.side{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(10px,1.8vh,18px)}
.tag{font:14px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(22px,2.3vw,34px);line-height:1.2;margin:0;font-weight:650}
.formula{font-size:clamp(22px,2.4vw,34px)}
.line-txt{margin:0}

/* Controls */
button{font:inherit;color:var(--fg)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toolbar{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;min-height:40px}
.hint{margin:0;color:var(--muted);font-size:16px}
.btn,.preset{padding:6px 14px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer}
.btn[aria-pressed="true"],.preset[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--pal-on-accent)}

/* Cube (SVG) */
.cubebox{height:420px;min-height:0}
#cube{display:block;width:100%;height:100%}
#cube .vertex{cursor:pointer}
#cube .vertex:focus{outline:none}
#cube .fo{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--fg);pointer-events:none;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:16px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%}
.info{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px;line-height:1.4}
.info p{margin:0 0 6px}
.info p:last-child{margin-bottom:0}

/* Calculator */
.calc{display:flex;flex-direction:column;gap:14px}
.fields{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;font-size:18px}
.field input{width:84px;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 22px;align-items:center;font-size:18px}
.grid .k{color:var(--fg)}
.grid .v{font-weight:600;text-align:right}
.grid .big{font-size:28px;color:var(--accent)}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--good);color:var(--pal-on-accent);font-weight:600;font-size:16px}
.muted{color:var(--muted);font-size:16px}
.note{margin:0;font-size:16px;color:var(--muted)}
.note.bad{color:var(--pal-red)}
</style>
</head>
<body>
<header>Lecture 12: error-correcting codes</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script>
(function () {
'use strict';

// Math: $...$ is rendered by KaTeX auto-render. TEX() gives KaTeX HTML for SVG labels.
var MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false } ], throwOnError: false };
function tex(n) { if (n && typeof renderMathInElement === 'function') renderMathInElement(n, MATH); return n; }
function TEX(s) { return window.katex ? katex.renderToString(s, { throwOnError: false }) : s; }
function fo(x, y, w, h, cls, html) {
  return '<foreignObject x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '"><div xmlns="http://www.w3.org/1999/xhtml" class="fo ' + cls + '">' + html + '</div></foreignObject>';
}
var $ = function (s) { return document.querySelector(s); };

// ---- cube geometry (SVG viewBox 330 x 340) ----
// Cabinet projection: the front face is a square, the back face is shifted up and right.
// Corners are bit strings. Bit 1 is the first character.
var LABELS = ['000', '001', '010', '011', '100', '101', '110', '111'];
var X0 = 40, Y0 = 292, S = 170;               // screen position of corner 000 and the unit length
var EX = [1, 0], EY = [0, 1], EZ = [0.5, 0.45];  // unit steps along bits 1, 2, 3 (y up)
function pos(s) {
  var a = +s[0], b = +s[1], c = +s[2];
  var x = a * EX[0] + b * EY[0] + c * EZ[0];
  var y = a * EX[1] + b * EY[1] + c * EZ[1];
  return { x: X0 + S * x, y: Y0 - S * y };
}
var CUBE_MID = { x: X0 + S * 0.75, y: Y0 - S * 0.725 };

/*LOGIC*/
function ham(a, b) {
  var d = 0;
  for (var i = 0; i < 3; i++) if (a[i] !== b[i]) d++;
  return d;
}
function neighbors(s) { return LABELS.filter(function (t) { return ham(s, t) === 1; }); }
function binomBig(n, k) {
  // C(n,k) with BigInt; each step divides exactly
  var N = BigInt(n), r = 1n;
  for (var i = 0n; i < BigInt(k); i++) r = r * (N - i) / (i + 1n);
  return r;
}
// Sphere bound for length n and radius k. V = sum_{i<=k} C(n,i); M = floor(2^n / V); m = floor(log2 M).
function calc(n, k) {
  var total = 1n << BigInt(n);
  var terms = [], V = 0n;
  for (var i = 0; i <= k; i++) {
    var c = binomBig(n, i);
    terms.push(c);
    V += c;
  }
  var bound = total / V;                        // floor(2^n / V), V >= 1
  var bits = bound > 0n ? bound.toString(2).length - 1 : 0;   // floor(log2(bound))
  var perfect = total % V === 0n;
  return { terms: terms, V: V, total: total, bound: bound, bits: bits, perfect: perfect };
}
/*END LOGIC*/

// COL holds the palette for the cube being drawn. render() reads it on every paint, so a theme switch redraws it.
var COL = {};
function readPalette() {
  var c = function (n) { return FluidTheme.color(n); };
  return {
    dist: [c('accent'), c('hue-green'), c('hue-orange'), c('hue-purple')],
    sphereA: c('accent'), sphereB: c('hue-pink'),
    grey2: c('grey-2'), ink2: c('ink-2'), panel: c('panel')
  };
}
var PLOTS = [];   // the redraw of each widget on the current slide
window.addEventListener('fluid-themechange', function () { PLOTS.forEach(function (f) { f(); }); });
var COUNTS = [1, 3, 3, 1];

// ---------- step 1: corners, distance, L1 ----------
function cubeWidget(box, side) {
  box.innerHTML =
    '<div class="toolbar">' +
      '<button type="button" class="btn" id="codebtn" aria-pressed="false" data-item="control" data-id="code">Code $\\{000, 111\\}$</button>' +
      '<span class="muted">Click a corner: it becomes the center. Shift-click a second corner to compare.</span>' +
    '</div>' +
    '<div class="cubebox"><svg id="cube" viewBox="0 0 330 340" preserveAspectRatio="xMidYMid meet" role="img" aria-label="3-cube with 8 corners"></svg></div>' +
    '<div class="legend" id="legend"></div>' +
    '<div class="info" id="info"></div>';
  var svg = box.querySelector('#cube');
  var legend = box.querySelector('#legend');
  var info = box.querySelector('#info');
  var codeBtn = box.querySelector('#codebtn');
  var state = { center: '000', pair: null, code: false };

  function colorOf(s) {
    if (state.code) return ham(s, '000') <= 1 ? COL.sphereA : COL.sphereB;
    return COL.dist[ham(s, state.center)];
  }

  function render() {
    COL = readPalette();
    var c = state.center;
    var cp = pos(c);
    var out = '';
    // edges: corners that differ in one bit
    LABELS.forEach(function (a) { LABELS.forEach(function (b) {
      if (a < b && ham(a, b) === 1) {
        var p = pos(a), q = pos(b);
        out += '<line x1="' + p.x + '" y1="' + p.y + '" x2="' + q.x + '" y2="' + q.y + '" stroke="' + COL.grey2 + '" stroke-width="1.5"/>';
      }
    }); });
    // dashed line for the compared pair
    if (state.pair) {
      var q0 = pos(state.pair);
      out += '<line x1="' + cp.x + '" y1="' + cp.y + '" x2="' + q0.x + '" y2="' + q0.y + '" stroke="' + COL.ink2 + '" stroke-width="1.5" stroke-dasharray="4 3"/>';
    }
    // radius-1 sphere around the center, drawn as a dashed ring on each neighbor
    if (!state.code) {
      neighbors(c).forEach(function (n) {
        var p = pos(n);
        out += '<circle cx="' + p.x + '" cy="' + p.y + '" r="22" fill="none" stroke="' + COL.dist[1] + '" stroke-width="1.5" stroke-dasharray="3 2"/>';
      });
    }
    // corners
    LABELS.forEach(function (s) {
      var p = pos(s);
      var fill = colorOf(s);
      var isCenter = s === c && !state.code;
      var isPair = s === state.pair;
      var stroke = isCenter ? COL.ink2 : COL.panel;
      var sw = isCenter ? 3 : 2;
      out += '<g class="vertex" data-item="vertex" data-id="' + s + '" data-title="' + s + '" tabindex="0" role="button" aria-label="corner ' + s + '">';
      if (isPair) out += '<circle cx="' + p.x + '" cy="' + p.y + '" r="18" fill="none" stroke="' + COL.ink2 + '" stroke-width="1.5"/>';
      out += '<circle cx="' + p.x + '" cy="' + p.y + '" r="12" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + sw + '"/>';
      // label pushed away from the cube middle
      var dx = p.x - CUBE_MID.x, dy = p.y - CUBE_MID.y;
      var len = Math.hypot(dx, dy) || 1;
      var lx = p.x + (dx / len) * 34, ly = p.y + (dy / len) * 30;
      out += fo(lx - 28, ly - 11, 56, 22, 'c', TEX(s));
      out += '</g>';
    });
    svg.innerHTML = out;

    // legend
    if (state.code) {
      legend.innerHTML =
        '<span><i class="sw" style="background:' + COL.sphereA + '"></i>sphere of $000$</span>' +
        '<span><i class="sw" style="background:' + COL.sphereB + '"></i>sphere of $111$</span>';
    } else {
      legend.innerHTML = [0, 1, 2, 3].map(function (d) {
        return '<span><i class="sw" style="background:' + COL.dist[d] + '"></i>distance ' + d + ': ' + COUNTS[d] + '</span>';
      }).join('') + '<span class="muted">corners</span>';
    }
    tex(legend);

    // info text
    var parts = [];
    if (!state.pair && !state.code) {
      parts.push('<p>Center $' + c + '$. Colors show the distance from it.</p>');
      parts.push('<p>Radius-1 sphere: $' + c + '$ and its neighbors ' + neighbors(c).map(function (n) { return '$' + n + '$'; }).join(', ') + '.</p>');
    }
    if (state.pair) {
      var d = ham(c, state.pair);
      parts.push('<p><b>$' + c + '$ and $' + state.pair + '$</b></p>' +
        '<p>$\\text{Hamming} = L_1 = ' + d + '$<br>$L_2 = \\sqrt{' + d + '} \\approx ' + Math.sqrt(d).toFixed(3) + '$<br>$L_\\infty = 1$</p>' +
        '<p>On cube corners, $L_\\infty$ calls every pair distance 1. Only $L_1$ tells them apart, so it is the distance Hamming used.</p>');
    }
    if (state.code) {
      parts.push('<p><b>Code $\\{000, 111\\}$</b></p>' +
        '<p>Two spheres of radius 1, one around $000$ and one around $111$. Together they cover all 8 corners with no overlap.</p>' +
        '<p>This is the 3-bit repetition code. Minimum distance $3$, corrects $1$ error. It is perfect.</p>');
    }
    info.innerHTML = parts.join('');
    tex(info);
  }

  svg.addEventListener('click', function (e) {
    var g = e.target.closest('[data-item="vertex"]');
    if (!g) return;
    var id = g.dataset.id;
    if (e.shiftKey) {
      state.pair = (id === state.center) ? null : id;
    } else {
      state.center = id;
      state.pair = null;
    }
    render();
  });
  svg.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var g = e.target.closest && e.target.closest('[data-item="vertex"]');
    if (!g) return;
    e.preventDefault();
    state.center = g.dataset.id;
    state.pair = null;
    render();
  });
  codeBtn.addEventListener('click', function () {
    state.code = !state.code;
    codeBtn.setAttribute('aria-pressed', String(state.code));
    render();
  });
  PLOTS.push(render);
  render();
}

// ---------- step 2: sphere-bound calculator ----------
var PRESETS = [['7', '1', '$(7,1)$ Hamming'], ['15', '1', '$(15,1)$'], ['23', '3', '$(23,3)$ Golay']];
function calcWidget(box) {
  box.innerHTML =
    '<div class="calc">' +
      '<div class="fields">' +
        '<label class="field"><span>$n$ bits</span><input id="n" type="number" min="1" max="31" value="7" data-item="control" data-id="n"></label>' +
        '<label class="field"><span>$k$ errors corrected</span><input id="k" type="number" min="0" max="5" value="1" data-item="control" data-id="k"></label>' +
      '</div>' +
      '<div class="presets">' + PRESETS.map(function (p) {
        return '<button type="button" class="preset" data-n="' + p[0] + '" data-k="' + p[1] + '" aria-pressed="false" data-item="preset" data-id="' + p[0] + ',' + p[1] + '">' + p[2] + '</button>';
      }).join('') + '</div>' +
      '<div class="grid">' +
        '<span class="k">$V = \\sum_{i=0}^{k} \\binom{n}{i}$</span><span class="v" id="vterms"></span>' +
        '<span class="k">Words in the cube $2^n$</span><span class="v" id="total"></span>' +
        '<span class="k">Max code words $M = \\lfloor 2^n / V \\rfloor$</span><span class="v" id="bound"></span>' +
        '<span class="k">Max message bits $m = \\lfloor \\log_2 M \\rfloor$</span><span class="v big" id="bits"></span>' +
        '<span class="k">Parity bits $n - m$</span><span class="v" id="parity"></span>' +
        '<span class="k">Perfect code?</span><span id="badge"></span>' +
      '</div>' +
    '</div>';
  var nEl = box.querySelector('#n'), kEl = box.querySelector('#k');

  function clampInt(el, lo, hi, fallback) {
    var v = parseInt(el.value, 10);
    if (isNaN(v)) v = fallback;
    return Math.min(hi, Math.max(lo, v));
  }
  function update() {
    var n = clampInt(nEl, 1, 31, 7);
    var k = clampInt(kEl, 0, 5, 1);
    var r = calc(n, k);
    var sum = r.terms.map(String).join(' + ');
    box.querySelector('#vterms').textContent = '$' + sum + ' = ' + r.V + '$';
    box.querySelector('#total').textContent = '$' + r.total + '$';
    box.querySelector('#bound').textContent = '$' + r.bound + '$';
    box.querySelector('#bits').textContent = '$' + r.bits + '$';
    box.querySelector('#parity').textContent = '$' + (n - r.bits) + '$';
    box.querySelector('#badge').innerHTML = r.perfect
      ? '<span class="badge">perfect</span> $V$ divides $2^n$'
      : '<span class="muted">not perfect: $V$ does not divide $2^n$</span>';
    tex(box);
    box.querySelectorAll('.preset').forEach(function (b) {
      b.setAttribute('aria-pressed', String(+b.dataset.n === n && +b.dataset.k === k));
    });
  }
  nEl.addEventListener('input', update);
  kEl.addEventListener('input', update);
  nEl.addEventListener('change', function () { nEl.value = clampInt(nEl, 1, 31, 7); update(); });
  kEl.addEventListener('change', function () { kEl.value = clampInt(kEl, 0, 5, 1); update(); });
  box.querySelectorAll('.preset').forEach(function (b) {
    b.addEventListener('click', function () { nEl.value = b.dataset.n; kEl.value = b.dataset.k; update(); });
  });
  update();
}

// ---------- frame ----------
var SLIDES = [
  { id: 'step-1', title: 'Words are corners of the cube', tag: 'Lecture 30:11',
    formula: String.raw`$$d_H(a,b) = \sum_{i=1}^{n} \lvert a_i - b_i \rvert$$`,
    lines: ['Corners are bit strings. Hamming distance counts the bits that differ.',
      'On the cube that is the $L_1$ distance, the sum of the coordinate differences.',
      'On corners, $L_\\infty$ gives 1 for every pair, so only $L_1$ tells them apart.'],
    mount: function (box, side) { cubeWidget(box, side); } },
  { id: 'step-2', title: 'Sphere bound: how many code words fit', tag: 'Lecture 34:58',
    formula: String.raw`$$\sum_{i=0}^{k}\binom{n}{i} \le 2^{\,n-m}$$`,
    lines: ['$n$ is the word length, $m$ the message bits, $n - m$ the parity bits.',
      'Each code word needs its own sphere of $V$ words, and the spheres must fit in $2^n$.',
      'A perfect code fills every word: $V$ divides $2^n$.'],
    mount: function (box) { calcWidget(box); } }
];

// Session events. Optional: an older server has no fluid.emit, and then nothing is sent.
function emitEvent(kind, data) {
  if (!window.fluid || typeof fluid.emit !== 'function') return;
  Promise.resolve().then(function () { fluid.emit(kind, data); }).catch(function () {});
}
var cur = 0;
function goTo(i) {
  var was = cur;
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  var s = SLIDES[cur];
  var stage = $('#stage');
  stage.innerHTML = '';
  PLOTS = [];
  var widget = document.createElement('div');
  widget.className = 'widget';
  var side = document.createElement('div');
  side.className = 'side';
  side.innerHTML = '<div class="tag">' + s.tag + '</div><h2>' + s.title + '</h2><div class="formula">' + s.formula + '</div>' +
    s.lines.map(function (t) { return '<p class="line-txt">' + t + '</p>'; }).join('');
  var sec = document.createElement('section');
  sec.className = 'slide';
  sec.dataset.item = 'step';
  sec.dataset.id = s.id;
  sec.dataset.title = s.title;
  sec.append(widget, side);
  stage.append(sec);
  stage.scrollTop = 0;
  s.mount(widget, side);
  tex(sec);
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  Array.prototype.forEach.call($('#dots').children, function (d, k) { d.classList.toggle('on', k === cur); });
  if (cur !== was) emitEvent('view.step', { step: s.id });
}
// A cue is a state: go to the named step, and do nothing if it is already shown.
function onCue(msg) {
  var i = SLIDES.findIndex(function (s) { return s.id === (msg && msg.step); });
  if (i >= 0 && i !== cur) goTo(i);
}
(function init() {
  var dots = $('#dots');
  SLIDES.forEach(function (s, i) {
    var b = document.createElement('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1) + ': ' + s.title);
    b.title = s.title;
    b.addEventListener('click', function () { goTo(i); });
    dots.append(b);
  });
  $('#prev').addEventListener('click', function () { goTo(cur - 1); });
  $('#next').addEventListener('click', function () { goTo(cur + 1); });
  document.addEventListener('keydown', function (e) {
    if (e.target && e.target.matches && e.target.matches('input[type=text],input[type=range],textarea,select,input[type=number]')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof fluid.onCue === 'function') fluid.onCue(onCue);
})();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primer · Complex numbers</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../../components/theme.js"></script>
<style>
/* Colors come from the theme palette (../../components/theme.js): one accent (blue), red only for a failing check or the cube limit. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft);
  --red:var(--pal-red); --redbg:var(--pal-red-bg);
  --u:clamp(16px,1.35vw,20px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 24px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(6px,1vh,12px) 24px}
footer{display:flex;align-items:center;gap:10px;padding:8px 24px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Slide frame: widget on the left (3/5), text on the right (2/5). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(18px,2.4vw,40px)}
.widget{min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(6px,1vh,10px);overflow:hidden}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(6px,1.1vh,12px);overflow:hidden}
.tag{font:13px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(20px,1.9vw,28px);line-height:1.2;margin:0;font-weight:650}
.question{margin:0;font-size:clamp(16px,1.3vw,18px);font-weight:600}
.formula{font-size:clamp(18px,1.8vw,26px)}
.sym{margin:0;font-size:16px;color:var(--muted)}
.tries{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.tries li::marker{color:var(--accent);font-weight:600}
.where{margin:0;font-size:16px}
.where b{color:var(--accent)}
.takeaway{margin:0;padding:10px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}
.closing{margin:0;font-size:17px;font-weight:600}
.next{margin:0;font-size:16px;color:var(--muted)}

/* Controls and readouts */
.sliders{display:flex;gap:8px 24px;flex-wrap:wrap;width:100%}
.sliders.tight{gap:6px 16px}
.slide-ctl{display:flex;align-items:center;gap:8px;font-size:16px}
.slide-ctl input{width:clamp(120px,11vw,170px);vertical-align:middle;accent-color:var(--accent)}
.slide-ctl .val{min-width:52px}
.btn{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--pal-panel);border-radius:8px;cursor:pointer;font-size:16px}
.btn.on{background:var(--chip);border-color:var(--accent);color:var(--pal-accent-deep)}
.guess{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;width:100%}
.guess .btnrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.guess .verdict{margin:0;font-size:16px}
.readouts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.readout{flex:1 1 150px;min-width:0;padding:4px 8px;border-radius:10px;background:var(--pal-soft);font-size:15px;overflow-wrap:anywhere}
.readout .k{color:var(--muted);font-size:14px}
.readout .val{font-size:16px;font-weight:600}
.readout.bad{background:var(--redbg);color:var(--red)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:20px;height:0;vertical-align:middle;margin-right:6px}
.chip{display:inline-block;width:18px;height:12px;vertical-align:middle;margin-right:6px;border-radius:2px}

/* Plots fill the space left in the widget column */
.fill{flex:1 1 0;min-height:120px;position:relative;width:100%}
.fill>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.plot-static svg{display:block;width:100%;height:auto}
.row{display:flex;gap:12px;align-items:stretch;width:100%;min-height:200px;flex:1 1 0}
.diagram{flex:0 0 auto;display:flex;align-items:stretch}
.diagram svg{display:block;height:100%;width:auto;aspect-ratio:250/252}
.panel{display:flex;flex-direction:column;gap:0;padding:2px 0 2px 10px;border-left:3px solid var(--line)}
.panel .pl{font-weight:650;color:var(--accent);font-size:16px}
.panel p{margin:0;font-size:16px;line-height:1.2}
.panel.seen{border-left:none;background:var(--chip);border-radius:8px;padding:8px 10px}
.panel.seen .pl{color:var(--fg)}
.strip-row{display:flex;align-items:center;gap:10px;width:100%}
.strip-lab{flex:0 0 170px;font-size:15px;color:var(--muted)}
.strip-row svg{flex:1 1 auto;width:100%;height:26px;display:block}
.row-line{display:flex;align-items:center;gap:8px;width:100%}
.row-line svg{flex:1 1 auto;width:100%;height:14px;display:block}
.row-k{flex:0 0 60px;font-size:15px;color:var(--muted)}
.why{margin:0;font-size:16px;line-height:1.3}
.tbox{display:flex;flex-direction:column;gap:4px;width:100%}
.triple{display:grid;grid-template-columns:max-content repeat(10,28px);gap:3px 4px;align-items:center}
.triple .tn{font-size:13px;color:var(--muted);text-align:center}
.triple .tl{font-size:15px;padding-right:8px;white-space:nowrap}
.triple .tc{height:22px;display:flex;align-items:center;justify-content:center;border-radius:4px;background:var(--pal-soft-2);font:16px ui-monospace,Menlo,monospace}
.triple .tc.flip{background:var(--red);color:var(--pal-on-accent);font-weight:700}
.rows{display:flex;flex-direction:column;gap:3px;width:100%}
.proof-line{display:grid;grid-template-columns:30px minmax(0,1fr);gap:0 8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--pal-soft-3)}
.proof-num{font:15px ui-monospace,Menlo,monospace;color:var(--muted)}
.proof-eq{font-size:17px;min-width:0}
.proof-why{grid-column:2;margin:0;color:var(--muted);font-size:16px;line-height:1.2}
.proof{display:flex;flex-direction:column;width:100%}
.panel p.cite{font-size:14px;color:var(--muted);line-height:1.15}
.pgrid{display:grid;grid-template-columns:max-content repeat(10,30px);gap:4px;align-items:center;justify-content:start}
.pgrid .ax{font-size:13px;color:var(--muted);text-align:center}
.pc{width:30px;height:30px;padding:0;border:0;border-radius:4px;background:var(--pal-blue-pale);cursor:pointer}
.pc.on{background:var(--accent);box-shadow:0 0 0 2px var(--pal-ink)}
.steps{position:absolute;inset:0;z-index:3;background:var(--pal-panel);display:flex;flex-direction:column;gap:8px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.widget{position:relative}
/* Short windows (1100x620 and similar): tighter spacing, body text stays 16px */
@media (max-height: 680px){
  header{padding-top:4px}
  #stage{padding:4px 24px}
  footer{padding:4px 24px}
  .widget{gap:5px}
  .side{gap:6px}
  .tries{gap:3px}
  .sym,.where,.tries{line-height:1.2}
  .panel p{line-height:1.15}
  .side{gap:4px}
  .proof-line{padding:1px 0}
  .guess{gap:3px;padding:6px 8px}
  .fill{min-height:110px}
  .readout{padding:3px 8px}
  .takeaway{padding:6px 10px}
  .formula{font-size:20px}
  .pc{width:20px;height:20px}
  .pgrid{grid-template-columns:max-content repeat(10,20px)}
  h2{font-size:20px}
}
/* Primer additions: unit row, button rows, phasor rows, heat map, takeaway placeholder */
.unitrow{display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center;font-size:16px}
.unitrow input{width:84px}
.btnrow{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center}
.btnrow .lab{font-size:16px;color:var(--muted);margin-right:2px}
.rowlab{margin:0;font-size:16px;color:var(--muted);line-height:1.2}
.vec{margin:0;font-size:16px;width:100%;overflow:hidden}
.heatrow{display:flex;gap:18px;align-items:flex-start;width:100%}
.heatwrap{flex:0 0 auto;display:flex}
.heat{display:grid;gap:2px;align-items:center;justify-items:center;font-size:14px;color:var(--muted)}
.hc{width:20px;height:20px;border:1px solid var(--pal-soft-2);border-radius:3px;background:var(--pal-panel)}
.hlab{font-size:14px;color:var(--muted);text-align:center}
.badge{max-width:280px;padding:10px 12px;border:2px dashed var(--line);border-radius:10px;font-size:16px;line-height:1.3}
.readcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:8px}
.readcol .readout{flex:0 0 auto}
.readout.wide{flex:2 1 0}
.fill.small{min-height:90px}
.takeholder{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.takeholder .takeaway{align-self:stretch}
.fill.fixed78{flex:0 0 72px;height:72px;min-height:0}
.row.plane{min-height:150px}
.legend{margin-bottom:6px;font-size:16px}
.ratios .readout{padding:2px 6px}
.ratios .readout .k{font-size:13px}
.ratios .readout .val{font-size:15px}
.fill.stemrow{flex:0 0 112px;height:112px;min-height:0}
.fill.lam{min-height:80px}
@media (max-height: 680px){ .fill.fixed78{flex:0 0 62px;height:62px} }
.ratios{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%}
.ratios .readout{flex:none}
.name i{font-style:italic}

/* Proof slides: test and picture on the left, the proof (fl-proof-steps) on the right */
.slide.proof-slide{grid-template-columns:minmax(0,11fr) minmax(0,9fr)}
.slide.proof-slide .side{justify-content:flex-start}
.slide.proof-slide .fill{min-height:100px}
.slide.proof-slide .slide-ctl input{width:clamp(80px,7vw,120px)}
.slide.proof-slide .slide-ctl .val{min-width:44px}
.slide.proof-slide .sliders{gap:4px 16px}
.slide.proof-slide .legend{gap:2px 12px;margin-bottom:0;font-size:15px}
.slide.proof-slide .readout{flex-basis:120px}
.part{margin:0;font-weight:600;color:var(--muted)}
.test{display:flex;flex-direction:column;gap:3px}
.test .tries{gap:3px}
.model{margin:0;padding:6px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px;line-height:1.3}
@media (max-height: 680px){
  .slide.proof-slide .slide-ctl{gap:6px}
  .slide.proof-slide .slide-ctl input{width:64px}
  .slide.proof-slide .slide-ctl .val{min-width:30px}
  .slide.proof-slide .sliders{gap:2px 12px}
  .model{padding:4px 10px;line-height:1.25}
  .test .tries{gap:1px}
  .slide.proof-slide .readout{padding:2px 8px}
}
</style>
</head>
<body>
<header>Primer · Complex numbers</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script src="../../components/proof-steps.js"></script>
<script>
// ---------- DOM and drawing helpers ----------
let epoch = 0;
const $ = s => document.querySelector(s);
const NSV = 'http://www.w3.org/2000/svg', NHT = 'http://www.w3.org/1999/xhtml';
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false } ], throwOnError: false };
// Render $...$ and $$...$$ in a node. If the CDN did not load, the text stays as typed.
function tex(node) {
  if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH);
  return node;
}
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function hh(tag, cls, ...kids) {
  const e = h(tag, cls);
  for (const k of kids) if (k) e.append(k);
  return e;
}
function mark(e, kind, id, title) {
  e.dataset.item = kind;
  if (id != null) e.dataset.id = id;
  if (title != null) e.dataset.title = title;
  return e;
}
function svgNode(tag, attrs, parent) {
  const e = document.createElementNS(NSV, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function svgRoot(w, ht) {
  return svgNode('svg', { viewBox: '0 0 ' + w + ' ' + ht, role: 'img', 'font-family': 'system-ui, sans-serif', 'font-size': 14 });
}
function svgText(parent, x, y, s, attrs) {
  const t = svgNode('text', Object.assign({ x: x, y: y, fill: COL.muted }, attrs || {}), parent);
  t.textContent = s;
  return t;
}
// A KaTeX label over an SVG: a foreignObject holding a rendered formula.
function svgTex(parent, x, y, s, o) {
  o = o || {};
  const w = o.w || 220, ht = 26, anchor = o.anchor || 'middle';
  const x0 = anchor === 'end' ? x - w : anchor === 'start' ? x : x - w / 2;
  const fo = svgNode('foreignObject', { x: x0, y: y - ht / 2, width: w, height: ht }, parent);
  const d = document.createElementNS(NHT, 'div');
  const jc = anchor === 'end' ? 'flex-end' : anchor === 'start' ? 'flex-start' : 'center';
  d.setAttribute('style', 'display:flex;align-items:center;height:100%;white-space:nowrap;font-size:' +
    (o.size || 15) + 'px;color:' + (o.fill || COL.text2) + ';justify-content:' + jc);
  const span = document.createElementNS(NHT, 'span');
  span.textContent = s;
  if (o.bg) span.setAttribute('style', 'background:' + o.bg + ';border-radius:5px;padding:1px 5px');
  d.appendChild(span);
  fo.appendChild(d);
  tex(span);
  return fo;
}
// Same label with a white halo, so it reads over a curve or bars.
function haloTex(parent, x, y, s, o) {
  const fo = svgTex(parent, x, y, s, o);
  fo.firstChild.style.textShadow = '0 0 3px ' + COL.bg + ', 0 0 3px ' + COL.bg + ', 0 0 2px ' + COL.bg;
  return fo;
}
// A small number for a readout: plain decimals, or a LaTeX power of ten for tiny values.
function sci(x) {
  if (x === 0) return '0';
  if (Math.abs(x) >= 0.01) return x.toFixed(4);
  const parts = x.toExponential(2).split('e');
  return '$' + parts[0] + '\\times 10^{' + parseInt(parts[1], 10) + '}$';
}
// A labelled range input. label is LaTeX-ready text; fmt gives the value text.
function slider(label, o) {
  const wrap = h('label', 'slide-ctl');
  const lab = tex(h('span', '', label));
  const val = h('span', 'val', '');
  const inp = h('input');
  inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step; inp.value = o.value;
  mark(inp, 'control', o.id, o.name || o.id);
  wrap.append(lab, inp, val);
  const fmt = o.fmt || String;
  const api = {
    el: wrap,
    input: inp,
    get value() { return +inp.value; },
    show() { setTex(val, fmt(+inp.value)); },
  };
  inp.addEventListener('input', () => { api.show(); if (o.onInput) o.onInput(+inp.value); });
  api.show();
  return api;
}
// A readout box: label and value are LaTeX-ready text.
function readout(id, label) {
  const box = mark(h('div', 'readout'), 'readout', id);
  const k = h('div', 'k');
  setTex(k, label);
  const v = h('div', 'val');
  box.append(k, v);
  return { el: box, set(text, bad) { setTex(v, text); box.classList.toggle('bad', !!bad); } };
}
function legend(items) {
  const d = h('div', 'legend');
  for (const it of items) {
    const s = h('span');
    const sw = it.chip ? h('span', 'chip') : h('span', 'sw');
    if (it.chip) sw.style.background = it.color;
    else sw.style.borderTop = '2px ' + (it.dash ? 'dashed' : 'solid') + ' ' + it.color;
    const t = h('span');
    setTex(t, it.text);
    s.append(sw, t);
    d.appendChild(s);
  }
  return d;
}
function sym(text) { return setTex(h('p', 'sym'), text); }
function triesList(items) { return hh('ol', 'tries', ...items.map(t => setTex(h('li'), t))); }
function takeLine(text) { return setTex(h('p', 'takeaway'), text); }
// Session events. Optional: with no bridge, nothing is sent.
function emit(kind, data) {
  try {
    if (window.fluid && typeof window.fluid.emit === 'function') Promise.resolve(window.fluid.emit(kind, data)).catch(() => {});
  } catch (e) { /* the view works without the bridge */ }
}
// ---------- primer helpers: N = 8 samples, circular (the ends wrap) ----------
const N = 8, PI = Math.PI;
// Palette for the SVG being drawn. plotBox sets COL at every paint, so a draw always uses the current theme.
// Role names keep the old meaning: input = grey arrow, out = blue arrow, light = light blue, dark = dark arrow.
let COL = {};
function readPalette() {
  const c = n => FluidTheme.color(n);
  return {
    input: c('slate-4'), out: c('accent'), light: c('blue-light'), dark: c('text-2'), ink: c('ink'),
    grid: c('grey'), muted: c('muted'), text2: c('text-2'), text3: c('text-3'), panel: c('panel'), soft: c('soft'), soft2: c('soft-2'),
    line: c('line'), halo: c('bg'), amber: c('amber'), amberBg: c('amber-bg'), amberInk: c('amber-ink'),
    bluePale: c('blue-pale'),
  };
}
// Legend swatches are HTML, so they take CSS variables: they follow the theme with no redraw.
const SW = { input: 'var(--pal-text-3)', out: 'var(--pal-accent)', light: 'var(--pal-blue-light)', dark: 'var(--pal-text-2)',
  ink: 'var(--pal-ink)', grey: 'var(--pal-grey)', bluePale: 'var(--pal-blue-pale)' };
// The plots on the current slide. A theme switch redraws them; sliders, picks and proof state are DOM, so they stay.
let PLOTS = [];
window.addEventListener('fluid-themechange', () => PLOTS.forEach(p => p.redraw()));
const cis = t => ({ re: Math.cos(t), im: Math.sin(t) });
const realC = x => ({ re: x, im: 0 });
const cxAdd = (a, b) => ({ re: a.re + b.re, im: a.im + b.im });
const cxDiv = (a, b) => { const d = b.re * b.re + b.im * b.im; return { re: (a.re * b.re + a.im * b.im) / d, im: (a.im * b.re - a.re * b.im) / d }; };
const cxAbs = a => Math.hypot(a.re, a.im);
const cxArg = a => Math.atan2(a.im, a.re);
// Fixed decimals, with no minus sign on zero.
function fx(x, d) { const y = Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x; return y.toFixed(d); }
const cv = (x, i) => x[((i % N) + N) % N];   // circular index
const zeros = () => new Array(N).fill(0);
const vadd = (a, b) => a.map((x, i) => x + b[i]);
// Real filters on 8 samples.
const realAvg = x => x.map((_, n) => (cv(x, n - 1) + cv(x, n) + cv(x, n + 1)) / 3);
const realGain = x => x.map((v, n) => n * v);
const realMed = x => x.map((_, n) => [cv(x, n - 1), cv(x, n), cv(x, n + 1)].sort((p, q) => p - q)[1]);
const realShift = x => x.map((_, n) => cv(x, n - 1));          // (Su)_n = u_{n-1}
// Taps: y_n = sum_j c_j u_{n-j}, circular. [[j, c_j], ...]
const AVG = [[-1, 1 / 3], [0, 1 / 3], [1, 1 / 3]];
const LAG = [[0, 0.5], [1, 0.5]];
function applyTaps(taps, u) {
  return u.map((_, n) => taps.reduce((acc, [j, c]) => {
    const x = cv(u, n - j);
    return { re: acc.re + c * x.re, im: acc.im + c * x.im };
  }, { re: 0, im: 0 }));
}
// H(f) = sum_j c_j e^{-i 2 pi f j}; the eigenvalue of wave e_k is H(k/8).
function Hof(taps, f) {
  return taps.reduce((acc, [j, c]) => cxAdd(acc, { re: c * Math.cos(2 * PI * f * j), im: -c * Math.sin(2 * PI * f * j) }), { re: 0, im: 0 });
}
// Complex number as TeX (no $ signs): real part, or |z| and angle in degrees.
function fmtTex(z) {
  if (Math.abs(z.im) < 1e-9) return fx(z.re, 3);
  return fx(cxAbs(z), 3) + '\\angle{' + fx(cxArg(z) * 180 / PI, 1) + '^\\circ}';
}
function clean(o) { const r = {}; for (const k in o) if (o[k] !== null && o[k] !== undefined) r[k] = o[k]; return r; }
function line(svg, x1, y1, x2, y2, o) { return svgNode('line', clean(Object.assign({ x1, y1, x2, y2 }, o || {})), svg); }
function dot(svg, x, y, r, fill, o) { return svgNode('circle', clean(Object.assign({ cx: x, cy: y, r, fill }, o || {})), svg); }
// Arrow with a head. o: {color, w, dash, id}.
function arrow(svg, x1, y1, x2, y2, o) {
  const g = svgNode('g', clean({ 'data-item': 'mark', 'data-id': o.id }), svg);
  svgNode('line', clean({ x1, y1, x2, y2, stroke: o.color, 'stroke-width': o.w || 2.5, 'stroke-dasharray': o.dash }), g);
  const len = Math.hypot(x2 - x1, y2 - y1);
  if (len > 2) {
    const a = Math.atan2(y2 - y1, x2 - x1), L = 9, s = 4.5;
    const bx = x2 - L * Math.cos(a), by = y2 - L * Math.sin(a);
    const pts = [[x2, y2], [bx - s * Math.sin(a), by + s * Math.cos(a)], [bx + s * Math.sin(a), by - s * Math.cos(a)]];
    svgNode('polygon', { points: pts.map(p => p.join(',')).join(' '), fill: o.color }, g);
  }
  return g;
}
// A plot that takes the height left in its parent. draw(svg, W, H) runs on every resize.
// Returns the element to append and a redraw function.
function plotBox(draw, cls) {
  const wrap = h('div', 'fill' + (cls ? ' ' + cls : ''));
  let key = '';
  const paint = force => {
    const w = Math.floor(wrap.clientWidth), ht = Math.floor(wrap.clientHeight);
    if (w < 60 || ht < 40) return;
    if (!force && key === w + 'x' + ht) return;
    key = w + 'x' + ht;
    COL = readPalette();
    const svg = svgRoot(w, ht);
    draw(svg, w, ht);
    wrap.replaceChildren(svg);
  };
  new ResizeObserver(() => paint(false)).observe(wrap);
  const plot = { wrap, redraw: () => paint(true) };
  PLOTS.push(plot);
  return plot;
}
// Stems for one value per sample n = 0..7. o: {vals, lo, hi, ticks, color, id, label,
// on(n) -> filled (default true), hollow (dashed values), rings (values drawn as rings)}.
function stems(svg, W, H, o) {
  const L = 36, R = 12, T = 36, B = 22;
  const X = n => L + (n + 0.5) * (W - L - R) / N;
  const Y = v => T + (o.hi - v) / (o.hi - o.lo) * (H - T - B);
  line(svg, L, Y(0), W - R, Y(0), { stroke: COL.grid });
  line(svg, L, T, L, H - B, { stroke: COL.soft2 });
  for (const t of o.ticks) svgText(svg, L - 6, Y(t) + 5, fx(t, 1).replace(/\.0$/, ''), { 'text-anchor': 'end', 'font-size': 14 });
  for (let n = 0; n < N; n++) svgText(svg, X(n), H - 5, String(n), { 'text-anchor': 'middle', 'font-size': 14 });
  if (o.hollow) o.hollow.forEach((v, n) => {
    if (Math.abs(v) > 1e-9) {
      line(svg, X(n), Y(0), X(n), Y(v), { stroke: COL.input, 'stroke-dasharray': '4 3' });
      dot(svg, X(n), Y(v), 5, COL.panel, { stroke: COL.input, 'stroke-width': 2 });
    }
  });
  o.vals.forEach((v, n) => {
    const on = o.on ? o.on(n) : true;
    if (on) {
      line(svg, X(n), Y(0), X(n), Y(v), { stroke: o.color, 'stroke-width': 3 });
      dot(svg, X(n), Y(v), 5.5, o.color, { 'data-item': 'mark', 'data-id': (o.id || 'stem') + '-' + n });
    } else {
      dot(svg, X(n), Y(v), 5, COL.panel, { stroke: o.color, 'stroke-width': 2 });
    }
  });
  if (o.rings) o.rings.forEach((v, n) => dot(svg, X(n), Y(v), 9, 'none', { stroke: COL.ink, 'stroke-width': 1.5 }));
  if (o.label) svgTex(svg, L + 6, 14, o.label, { anchor: 'start', w: W - L - 20, size: 15, fill: o.color });
  return { X, Y };
}
// Phasor row: one circle per sample, the arrow is the complex sample at scale sc.
function phasors(svg, W, H, zs, sc, color, id) {
  const cw = W / N, Rc = Math.min(cw, H - 16) / 2 - 3, cy = (H - 14) / 2;
  zs.forEach((z, n) => {
    const cx = (n + 0.5) * cw;
    dot(svg, cx, cy, Rc, COL.panel, { stroke: COL.soft2 });
    line(svg, cx - Rc, cy, cx + Rc, cy, { stroke: COL.soft });
    line(svg, cx, cy - Rc, cx, cy + Rc, { stroke: COL.soft });
    const k = sc * (Rc - 5);
    arrow(svg, cx, cy, cx + z.re * k, cy - z.im * k, { color, id: id + '-' + n });
    svgText(svg, cx, H - 2, String(n), { 'text-anchor': 'middle', 'font-size': 13 });
  });
}
// A labelled range input. o: {id, min, max, step, value, fmt(v) -> text, onInput(v)}.
function ctl(label, o) {
  const wrap = h('label', 'slide-ctl');
  const lab = setTex(h('span'), label);
  const inp = h('input');
  inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step; inp.value = o.value;
  mark(inp, 'control', o.id, o.id);
  const val = h('span', 'val');
  const show = v => setTex(val, o.fmt(v));
  inp.addEventListener('input', () => { show(+inp.value); o.onInput(+inp.value); });
  show(o.value);
  wrap.append(lab, inp, val);
  return { el: wrap, set(v) { inp.value = v; show(v); } };
}
// A number box, applied as it is typed.
function numBox(label, o) {
  const wrap = h('label', 'slide-ctl');
  const inp = h('input');
  inp.type = 'number'; inp.min = o.min; inp.step = o.step; inp.value = o.value;
  inp.style.width = '84px';
  mark(inp, 'control', o.id, o.id);
  inp.addEventListener('input', () => { const v = +inp.value; if (isFinite(v) && v > 0) o.onInput(v); });
  wrap.append(setTex(h('span'), label), inp);
  return { el: wrap, set(v) { inp.value = v; } };
}
// The takeaway appears after the first try: on the first click or press in the widget, or on "Show".
function takeBox(widget, text) {
  const holder = h('div', 'takeholder');
  const btn = mark(h('button', 'btn'), 'control', 'show-takeaway');
  setTex(btn, 'Show the takeaway');
  const tk = takeLine(text);
  tk.hidden = true;
  const show = () => { tk.hidden = false; btn.hidden = true; };
  btn.addEventListener('click', show);
  for (const ev of ['input', 'click', 'pointerdown']) widget.addEventListener(ev, show);
  holder.append(btn, tk);
  return holder;
}
// ---------- primer helpers: complex numbers ----------
const cxMul = (a, b) => ({ re: a.re * b.re - a.im * b.im, im: a.re * b.im + a.im * b.re });
const cxScale = (a, k) => ({ re: a.re * k, im: a.im * k });
// A complex value as LaTeX text, without $ signs: a + bi with d decimals.
function cxTex(z, d) {
  const im = Math.abs(z.im) < 0.5 * Math.pow(10, -d) ? 0 : z.im;
  return fx(z.re, d) + (im < 0 ? ' - ' : ' + ') + fx(Math.abs(im), d) + 'i';
}
// An angle in radians shown in degrees, in (-180, 180].
const degN = rad => ((rad * 180 / PI) % 360 + 540) % 360 - 180;
const degTxt = rad => fx(degN(rad), 1) + '°';
// A button that runs onClick; the id marks it as a control.
function actBtn(id, label, onClick) {
  const b = mark(h('button', 'btn'), 'control', id);
  setTex(b, label);
  b.addEventListener('click', onClick);
  return b;
}
// Complex plane with labelled axes. R: half-width in units. Returns X(re), Y(im), sc, cx, cy.
function cplane(svg, W, H, R) {
  const cx = W / 2, cy = H / 2, sc = (Math.min(W, H) / 2 - 24) / R;
  const X = re => cx + re * sc, Y = im => cy - im * sc;
  line(svg, 6, cy, W - 6, cy, { stroke: COL.grid });
  line(svg, cx, 6, cx, H - 6, { stroke: COL.grid });
  svgTex(svg, W - 44, cy + 14, String.raw`$\mathrm{Re}$`, { w: 50, anchor: 'start', size: 15 });
  svgTex(svg, cx + 6, 14, String.raw`$\mathrm{Im}$`, { w: 50, anchor: 'start', size: 15 });
  return { X, Y, sc, cx, cy };
}
function unitCircle(svg, P, r) {
  svgNode('circle', { cx: P.cx, cy: P.cy, r: r * P.sc, fill: 'none', stroke: COL.line, 'stroke-dasharray': '4 4' }, svg);
}
// Label at the tip of an arrow.
function tipTex(svg, x, y, s, color) {
  return svgTex(svg, x + 10, y - 12, s, { w: 90, anchor: 'start', size: 16, fill: color });
}
// A name line: what a term's name means and how it points at the idea. html may hold <i> and $...$.
function nameLine(html) { const p = h('p', 'sym name'); p.innerHTML = html; return tex(p); }
// Partial sum S_K = sum over n < K of (i t)^n / n!, the first K terms of e^{i t}.
function partialExp(t, K) {
  let s = { re: 0, im: 0 }, term = { re: 1, im: 0 };
  for (let n = 0; n < K; n++) {
    s = cxAdd(s, term);
    term = cxScale(cxMul(term, { re: 0, im: t }), 1 / (n + 1));
  }
  return s;
}

// ---------- 1. a complex number is an arrow ----------
function slideI(widget, side) {
  const st = { a: 1, b: 0 };
  const cA = ctl(String.raw`$a$, real part`, { id: 'a', min: -2, max: 2, step: 0.05, value: 1,
    fmt: v => v.toFixed(2), onInput: v => { st.a = v; update(); } });
  const cB = ctl(String.raw`$b$, imaginary part`, { id: 'b', min: -2, max: 2, step: 0.05, value: 0,
    fmt: v => v.toFixed(2), onInput: v => { st.b = v; update(); } });
  const setZ = (a, b) => { st.a = a; st.b = b; cA.set(a); cB.set(b); update(); };
  const bI = actBtn('times-i', String.raw`multiply by $i$`, () => setZ(-st.b, st.a));
  const bOne = actBtn('reset', String.raw`reset to $1$`, () => setZ(1, 0));
  const rZ = readout('z', String.raw`$z=a+bi$`);
  const rLen = readout('len', String.raw`$|z|=\sqrt{a^2+b^2}$, length`);
  const rAng = readout('angle', String.raw`$\arg z$, angle`);
  function drawPlane(svg, W, H) {
    const P = cplane(svg, W, H, 3);
    unitCircle(svg, P, 1);
    const z = { re: st.a, im: st.b }, iz = cxMul({ re: 0, im: 1 }, z);
    arrow(svg, P.X(0), P.Y(0), P.X(iz.re), P.Y(iz.im), { color: COL.input, dash: '6 4', id: 'iz' });
    tipTex(svg, P.X(iz.re), P.Y(iz.im), String.raw`$iz$`, COL.text3);
    arrow(svg, P.X(0), P.Y(0), P.X(z.re), P.Y(z.im), { color: COL.out, id: 'z' });
    tipTex(svg, P.X(z.re), P.Y(z.im), String.raw`$z$`, COL.out);
  }
  const plane = plotBox(drawPlane);
  function update() {
    const z = { re: st.a, im: st.b };
    rZ.set('$' + cxTex(z, 2) + '$');
    rLen.set(fx(cxAbs(z), 3));
    rAng.set(degTxt(cxArg(z)));
    plane.redraw();
  }
  widget.append(
    hh('div', 'sliders', cA.el, cB.el),
    hh('div', 'btnrow', bI, bOne),
    plane.wrap,
    hh('div', 'readouts', rZ.el, rLen.el, rAng.el),
    legend([
      { color: SW.out, text: String.raw`blue arrow: $z=a+bi$` },
      { color: SW.input, dash: true, text: String.raw`grey dashed arrow: $iz$, after a quarter turn` },
      { color: SW.grey, dash: true, text: String.raw`dashed circle: length $1$` }]));
  side.append(
    sym(String.raw`$z=a+bi$ is the arrow $(a,b)$, a vector of two numbers (Primer · Vectors): $a$ steps right, $b$ steps up. $i$ is the arrow $(0,1)$. Example: $z=1+i$ has length $\sqrt2$ and angle $45^\circ$.`),
    nameLine('<i>complex</i>: from Latin <i>complexus</i>, woven together (<i>com-</i>, together; <i>plectere</i>, to weave): one number woven from two parts, $a$ and $b$.'),
    triesList([
      String.raw`Press multiply by $i$ once. The arrow turns a quarter turn: $1$ becomes $i$.`,
      String.raw`Press it again. The arrow points left, at $-1$. So $i^2=-1$.`,
      String.raw`Set $a=1$ and $b=1$. The length is $\sqrt2\approx1.414$ and the angle is $45^\circ$.`]),
    takeBox(widget, String.raw`A complex number holds a length and an angle in one object. Multiplying by $i$ turns it a quarter turn.`));
  update();
}

// ---------- 2. multiplying: lengths multiply, angles add ----------
function slideMul(widget, side) {
  const st = { a: 1, b: 1, pick: 'same' };
  const wOf = { same: () => ({ re: st.a, im: st.b }), i: () => ({ re: 0, im: 1 }), two: () => ({ re: 2, im: 0 }) };
  const cA = ctl(String.raw`$a$, real part of $z$`, { id: 'a', min: -2, max: 2, step: 0.05, value: 1,
    fmt: v => v.toFixed(2), onInput: v => { st.a = v; update(); } });
  const cB = ctl(String.raw`$b$, imaginary part of $z$`, { id: 'b', min: -2, max: 2, step: 0.05, value: 1,
    fmt: v => v.toFixed(2), onInput: v => { st.b = v; update(); } });
  const presets = [['same', String.raw`$w=z$`], ['i', String.raw`$w=i$`], ['two', String.raw`$w=2$`]];
  const pBtns = presets.map(([id, label]) => actBtn('w-' + id, label, () => { st.pick = id; update(); }));
  const rMag = readout('mag', String.raw`$|z|\,|w|$`);
  const rMagP = readout('mag-p', String.raw`$|zw|$, the blue length`);
  const rAng = readout('ang', String.raw`$\arg z+\arg w$`);
  const rAngP = readout('ang-p', String.raw`$\arg(zw)$, the blue angle`);
  const zw = () => cxMul({ re: st.a, im: st.b }, wOf[st.pick]());
  function drawPlane(svg, W, H) {
    const z = { re: st.a, im: st.b }, w = wOf[st.pick](), p = cxMul(z, w);
    const P = cplane(svg, W, H, Math.max(3, 1.1 * cxAbs(p), cxAbs(z), cxAbs(w)));
    arrow(svg, P.X(0), P.Y(0), P.X(z.re), P.Y(z.im), { color: COL.input, id: 'z' });
    tipTex(svg, P.X(z.re), P.Y(z.im), String.raw`$z$`, COL.text3);
    arrow(svg, P.X(0), P.Y(0), P.X(w.re), P.Y(w.im), { color: COL.dark, id: 'w' });
    tipTex(svg, P.X(w.re), P.Y(w.im), String.raw`$w$`, COL.dark);
    arrow(svg, P.X(0), P.Y(0), P.X(p.re), P.Y(p.im), { color: COL.out, id: 'zw' });
    tipTex(svg, P.X(p.re), P.Y(p.im), String.raw`$zw$`, COL.out);
  }
  const plane = plotBox(drawPlane);
  function update() {
    const z = { re: st.a, im: st.b }, w = wOf[st.pick](), p = zw();
    pBtns.forEach((b, i) => b.classList.toggle('on', presets[i][0] === st.pick));
    rMag.set(fx(cxAbs(z) * cxAbs(w), 3));
    rMagP.set(fx(cxAbs(p), 3));
    rAng.set(degTxt(cxArg(z) + cxArg(w)));
    rAngP.set(degTxt(cxArg(p)));
    plane.redraw();
  }
  widget.append(
    hh('div', 'sliders', cA.el, cB.el),
    hh('div', 'btnrow', setTex(h('span', 'lab'), String.raw`w:`), ...pBtns),
    plane.wrap,
    hh('div', 'readouts', rMag.el, rMagP.el, rAng.el, rAngP.el),
    legend([
      { color: SW.input, text: String.raw`grey arrow: $z$` },
      { color: SW.dark, text: String.raw`solid arrow: $w$` },
      { color: SW.out, text: String.raw`blue arrow: $zw$, the product` }]));
  side.append(
    sym(String.raw`$z=a+bi$ and $w$: two complex numbers. $zw$: their product. Example: $z=w=1+i$ gives $zw=(1+i)^2=2i$.`),
    triesList([
      String.raw`Keep $w=z=1+i$. The blue arrow is $2i$: length $2=\sqrt2\cdot\sqrt2$, angle $90^\circ=45^\circ+45^\circ$.`,
      String.raw`Press $w=i$. The blue arrow is the grey $z$ turned a quarter turn.`,
      String.raw`Press $w=2$. The blue arrow is $z$ made twice as long: length $2\sqrt2$.`]),
    takeBox(widget, String.raw`Multiplying complex numbers multiplies their lengths and adds their angles. So $(1+i)^2=2i$.`));
  update();
}

// ---------- 6. adding many arrows ----------
function slideSum(widget, side) {
  const st = { N: 1, deg: 0 };
  const sumOf = (N, x) => { let s = { re: 0, im: 0 }; for (let k = -N; k <= N; k++) s = cxAdd(s, cis(k * x)); return s; };
  const closed = (N, x) => Math.abs(Math.sin(x / 2)) < 1e-9 ? 2 * N + 1 : Math.sin((N + 0.5) * x) / Math.sin(x / 2);
  const cN = ctl(String.raw`$N$, arrows on each side`, { id: 'N', min: 1, max: 8, step: 1, value: 1,
    fmt: v => String(v), onInput: v => { st.N = v; update(); } });
  const cX = ctl(String.raw`$x$, angle step`, { id: 'x', min: 0, max: 360, step: 1, value: 0,
    fmt: v => v + '°', onInput: v => { st.deg = v; update(); } });
  const rS = readout('sum', String.raw`$S$, the sum`);
  const rLen = readout('len', String.raw`$|S|$, its length`);
  const rCf = readout('closed', String.raw`closed form, same value`);
  function drawPlane(svg, W, H) {
    const N = st.N, x = st.deg * PI / 180;
    const P = cplane(svg, W, H, 2 * N + 1);
    let pen = { re: 0, im: 0 };
    for (let k = -N; k <= N; k++) {
      const u = cis(k * x), nxt = cxAdd(pen, u);
      arrow(svg, P.X(pen.re), P.Y(pen.im), P.X(nxt.re), P.Y(nxt.im), { color: COL.light, w: 2, id: 'k' + (k + N) });
      pen = nxt;
    }
    arrow(svg, P.X(0), P.Y(0), P.X(pen.re), P.Y(pen.im), { color: COL.out, w: 3.5, id: 'S' });
    tipTex(svg, P.X(pen.re), P.Y(pen.im), String.raw`$S$`, COL.out);
  }
  const plane = plotBox(drawPlane);
  function update() {
    const N = st.N, x = st.deg * PI / 180, S = sumOf(N, x);
    rS.set('$' + cxTex(S, 2) + '$');
    rLen.set(fx(cxAbs(S), 3));
    rCf.set(fx(closed(N, x), 3));
    plane.redraw();
  }
  widget.append(
    hh('div', 'sliders', cN.el, cX.el),
    plane.wrap,
    hh('div', 'readouts', rS.el, rLen.el, rCf.el),
    legend([
      { color: SW.light, text: String.raw`thin blue arrows: $e^{ikx}$ for $k=-N$ to $N$, added tip to tail` },
      { color: SW.out, text: String.raw`blue arrow: their sum $S$` }]));
  side.append(
    sym(String.raw`$k$: the index, from $-N$ to $N$. $e^{ikx}$: a unit arrow at angle $kx$. The closed form is the geometric sum of Primer · Series, step 3, with ratio $e^{ix}$.`),
    triesList([
      String.raw`The start is $N=1$, $x=0^\circ$. The three arrows point the same way: $|S|=3$.`,
      String.raw`Set $x=120^\circ$. The arrows at $-120^\circ$, $0^\circ$ and $120^\circ$ close into a loop: $S=0$.`,
      String.raw`Set $N=8$ and $x=45^\circ$. Seventeen arrows add to length $1$, not $17$.`]),
    takeBox(widget, String.raw`Arrows add as vectors, so their sum can be much shorter than the total of their lengths.`));
  update();
}

// ---------- 7. differentiating e^{i w t} ----------
function slideDeriv(widget, side) {
  const st = { w: 2, t: 0 };
  const cW = ctl(String.raw`$\omega$, radians per unit of $t$`, { id: 'omega', min: 0, max: 8, step: 0.05, value: 2,
    fmt: v => v.toFixed(2), onInput: v => { st.w = v; update(); } });
  const cT = ctl(String.raw`$t$, time`, { id: 't', min: 0, max: 6.28, step: 0.01, value: 0,
    fmt: v => v.toFixed(2), onInput: v => { st.t = v; update(); } });
  const rZ = readout('z', String.raw`$|z|$, length of $z=e^{i\omega t}$`);
  const rD = readout('dz', String.raw`$\left|\dfrac{dz}{dt}\right|$, should be $\omega$`);
  const rN = readout('num', String.raw`numeric slope, $h=10^{-4}$`);
  const slope = () => {
    const w = st.w, t = st.t, hh_ = 1e-4;
    return { re: (Math.cos(w * (t + hh_)) - Math.cos(w * t)) / hh_, im: (Math.sin(w * (t + hh_)) - Math.sin(w * t)) / hh_ };
  };
  function drawPlane(svg, W, H) {
    const z = cis(st.w * st.t), dz = cxMul({ re: 0, im: st.w }, z);
    const P = cplane(svg, W, H, Math.max(1.2, 1.1 * st.w));
    unitCircle(svg, P, 1);
    arrow(svg, P.X(0), P.Y(0), P.X(dz.re), P.Y(dz.im), { color: COL.dark, id: 'dz' });
    svgTex(svg, P.X(dz.re) - 10, P.Y(dz.im) - 12, String.raw`$\tfrac{dz}{dt}$`, { w: 90, anchor: 'end', size: 16, fill: COL.dark });
    arrow(svg, P.X(0), P.Y(0), P.X(z.re), P.Y(z.im), { color: COL.out, id: 'z' });
    tipTex(svg, P.X(z.re), P.Y(z.im), String.raw`$z$`, COL.out);
  }
  const plane = plotBox(drawPlane);
  function update() {
    const z = cis(st.w * st.t);
    rZ.set(fx(cxAbs(z), 3));
    rD.set(fx(st.w * cxAbs(z), 3));
    rN.set('$' + cxTex(slope(), 2) + '$');
    plane.redraw();
  }
  widget.append(
    hh('div', 'sliders', cW.el, cT.el),
    plane.wrap,
    hh('div', 'readouts', rZ.el, rD.el, rN.el),
    legend([
      { color: SW.out, text: String.raw`blue arrow: $z=e^{i\omega t}$, length $1$` },
      { color: SW.dark, text: String.raw`solid arrow: $\tfrac{dz}{dt}=i\omega z$, length $\omega$` },
      { color: SW.grey, dash: true, text: String.raw`dashed circle: length $1$` }]));
  side.append(

// ---------- proof slides: shared parts ----------
// Amber marks what the newest proof line is about, in the picture and in the proof.
const C = (re, im) => ({ re, im });
const O0 = C(0, 0);
const toPx = (P, zs) => zs.map(z => [P.X(z.re), P.Y(z.im)]);
function pathPts(svg, pts, attrs, close) {
  const d = 'M' + pts.map(q => q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join('L') + (close ? 'Z' : '');
  return svgNode('path', Object.assign({ d, fill: 'none' }, attrs), svg);
}
function glowPts(svg, pts, w) {

}
function glowFill(svg, pts) { return pathPts(svg, pts, { fill: COL.amberBg, 'fill-opacity': .9, stroke: COL.amber, 'stroke-width': 1.5 }, true); }
function glowDot(svg, x, y, r) { return svgNode('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: r || 11, fill: COL.amberBg, stroke: COL.amber, 'stroke-width': 1.5 }, svg); }
// Points of an arc round (cx, cy) in px, radius r px, from angle a0 to a1 (radians, counterclockwise as in the plane).
function arcPx(cx, cy, r, a0, a1) {

  for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; pts.push([cx + r * Math.cos(a), cy - r * Math.sin(a)]); }
  return pts;
}
// The caption row of a proof picture: what the amber part is while a line is lit, else what the picture shows.
function caption(svg, W, lit, texts, idle) {
  const t = lit ? texts[lit] : null;
  if (t) svgTex(svg, W / 2, 13, t, { w: W - 8, size: 15, fill: COL.amberInk, bg: COL.amberBg });
  else svgTex(svg, W / 2, 13, idle, { w: W - 8, size: 15, fill: COL.muted });
}
// A complex plane below the caption row. o: {top, R (half-size in units, centered on 0)} or
// {top, fit: {x0, x1, y0, y1}} to show that box. Axes through 0 when 0 is in view.
function plane(svg, W, H, o) {
  const top = o.top || 0, m = 20;
  let sc, cre, cim;
  if (o.fit) {
    const f = o.fit;
    sc = Math.min((W - 2 * m) / Math.max(1e-6, f.x1 - f.x0), (H - top - 2 * m) / Math.max(1e-6, f.y1 - f.y0));
    cre = (f.x0 + f.x1) / 2; cim = (f.y0 + f.y1) / 2;
  } else { sc = (Math.min(W, H - top) / 2 - m) / o.R; cre = 0; cim = 0; }
  const cx = W / 2, cy = top + (H - top) / 2;
  const X = re => cx + (re - cre) * sc, Y = im => cy - (im - cim) * sc;
  const x0 = X(0), y0 = Y(0);
  if (y0 > top && y0 < H) {
    line(svg, 4, y0, W - 4, y0, { stroke: COL.grid });
    svgTex(svg, W - 40, y0 + 13, String.raw`$\mathrm{Re}$`, { w: 40, anchor: 'start', size: 14 });
  }
  if (x0 > 0 && x0 < W) {

}
function boxOf(zs, m) {

}
function circleU(svg, P, c, r, attrs) {

function arrowU(svg, P, a, b, o) { return arrow(svg, P.X(a.re), P.Y(a.im), P.X(b.re), P.Y(b.im), o); }

// A label just past the tip of the arrow from a to b, on the side it points to.
function endLabel(svg, P, a, b, s, color, o) {

  pathPts(svg, [[bx + ux, by + uy], [bx + ux + vx, by + uy + vy], [bx + vx, by + vy]], { stroke: COL.muted, 'stroke-width': 1.2 });

// Left column of a proof slide: controls, the picture, legend, readouts, the test, the mental model.
function proofLeft(widget, o) {

// Right column: the proof. Each revealed line lights its part of the picture; once the proof is

// ---------- step 2: why multiplying by i is a quarter turn (proof) ----------

    legs: String.raw`amber: the two pieces of $z$, $a$ and $bi$; line 1 gives each a factor $i$`,
    iz: String.raw`amber: $iz=-b+ai$: $b$ steps left, then $a$ steps up`,
    turn: String.raw`amber: $z$ and its legs turned a quarter turn: $1\to i$, $i\to-1$; it lands on $iz$` },
    String.raw`$z$ with its legs $a$ and $bi$; $iz$ with its legs`);

// ---------- step 4: why lengths multiply and angles add (proof) ----------

  rightMark(svg, P, z, cxScale(z, -1), iz, 9);
  arrowU(svg, P, z, tanEnd, { color: COL.dark, id: 'slope' });
  arrowU(svg, P, z, secEnd, { color: COL.dark, dash: '6 4', w: 2, id: 'secant' });
  endLabel(svg, P, z, tanEnd, String.raw`$i\omega z$`, COL.dark);
  endLabel(svg, P, z, secEnd, 'secant', COL.dark, { size: 14 });
}
function slideWhyDeriv(widget, side) {
  const st = { w: 2, t: 0.5, h: 0.5 };
  let lit = '';
  const cW = ctl(String.raw`$\omega$`, { id: 'omega', min: 0.5, max: 3, step: 0.05, value: st.w, fmt: val2, onInput: v => { st.w = v; update(); } });
  const cT = ctl('$t$', { id: 't', min: 0, max: 6.28, step: 0.01, value: st.t, fmt: val2, onInput: v => { st.t = v; update(); } });
  const cH = ctl('$h$', { id: 'h', min: 0.001, max: 1, step: 0.001, value: st.h, fmt: v => v.toFixed(3), onInput: v => { st.h = v; update(); } });
  const rSec = readout('secant', String.raw`secant $\tfrac{z(t+h)-z(t)}{h}$`);
  const rTan = readout('slope', String.raw`$i\omega z$`);
  const rLen = readout('lens', String.raw`secant length, and $\omega$`);
  const plot = proofLeft(widget, {
    controls: [cW.el, cT.el, cH.el],
    draw: (svg, W, Hh) => drawDerivProof(svg, W, Hh, st, lit),
    legend: [
      { color: SW.out, text: String.raw`blue: $z=e^{i\omega t}$` },
      { color: SW.grey, text: String.raw`grey: $z(t+h)$` },
      { color: SW.dark, dash: true, text: 'secant' },
      { color: SW.dark, text: String.raw`slope $i\omega z$` }],
    readouts: [rSec, rTan, rLen],
    tests: [
      String.raw`Shrink $h$ from $0.5$ to $0.001$: the dashed secant closes in on the solid arrow, and its readout on $i\omega z$.`,
      String.raw`Set $\omega=3$, $h=0.5$: the secant is $2.727$ long; at $h=0.001$ it is $3.000$. Cases are evidence, not proof.`],
    model: String.raw`In a short time $h$ the arrow turns by $\omega h$, the same small turn wherever it is. So the change is $z$ times a fixed small step, about $i\omega h$.` });
  proofRight(side, {
    id: 'derivative',
    goal: { tex: String.raw`\frac{d}{dt}e^{i\omega t}=i\omega\,e^{i\omega t}`, words: String.raw`for every $t$. Write $z(t)=e^{i\omega t}$.` },
    facts: [
      { tex: String.raw`\tfrac{dz}{dt}=\lim_{h\to0}\tfrac{z(t+h)-z(t)}{h}`, ref: 'Primer · Derivatives, step 2' },
      { words: String.raw`angles add (step 4); $e^{i\theta}=\cos\theta+i\sin\theta$ (step 5)` }],
    lines: [
      { tex: String.raw`\textstyle\frac{z(t+h)-z(t)}{h}=z(t)\,\frac{e^{i\omega h}-1}{h}`, move: 'Use an earlier result',
        why: String.raw`$z(t+h)=z(t)\,e^{i\omega h}$: angles add (step 4). Take out $z(t)$`, choices: ['Rearrange', 'Name a piece'], highlight: 'secant' },
      { tex: String.raw`\textstyle\frac{e^{i\omega h}-1}{h}=\frac{\cos\omega h-1}{h}+i\,\frac{\sin\omega h}{h}`, move: 'Use an earlier result',
        why: String.raw`Euler's formula at $\theta=\omega h$`, choices: ['Change variables', 'Compare or bound'], highlight: 'parts' },
      { tex: String.raw`\textstyle\frac{\cos\omega h-1}{h}\to0,\qquad\frac{\sin\omega h}{h}\to\omega`, move: 'Take a limit',
        why: String.raw`$h\to0$: $\omega$ times the slopes of $\cos$ and $\sin$ at $0$, which are $0$ and $1$ (Primer · Waves, step 12)`,
        choices: ['Compare or bound', 'Contradiction'], highlight: 'limit' },
      { tex: String.raw`\textstyle\frac{dz}{dt}=z(t)\,(0+i\omega)=i\omega\,e^{i\omega t}`, move: 'Unfold the definition',
        why: 'the limit of line 1', choices: ['Rearrange', 'Use symmetry'], highlight: 'tangent' }],
    lookBack: [
      { q: String.raw`What did the proof use about $e^{i\omega t}$?`,
        a: String.raw`Only that a later arrow is the earlier one times a fixed factor, $z(t+h)=z(t)\,e^{i\omega h}$. So the slope is $z$ times a fixed number, as for $e^{rt}$.` },
      { q: 'What does a second derivative do?',
        a: String.raw`Turn and stretch twice: $(i\omega)^2=-\omega^2$, so $z''=-\omega^2z$, pointing back at the center. With $\omega=1$: $y''=-y$ of Primer · Waves, step 12.` }] },
    plot, key => { lit = key || ''; plot.redraw(); }, CLOSING);
  side.querySelector('fl-proof-steps').primerMoves = PRIMER_MOVES;
  side.querySelector('fl-proof-steps').endNote = NEXT;
  function update() {
    const d = derivParts(st);
    rSec.set('$' + cxTex(d.sec, 3) + '$');
    rTan.set('$' + cxTex(d.tan, 3) + '$');
    rLen.set(fx(cxAbs(d.sec), 3) + ' and ' + fx(st.w, 3));
    plot.redraw();
  }
  update();
}
// The view's close. The primer's last proof lists every move the primer's proofs used, in order of first
// use, once it is proved, so the list never gives a pick away; the last step names what comes next.
const CLOSING = 'Look back: under the picture.';
const PRIMER_MOVES = ['Rearrange', 'Unfold the definition', 'Compute it two ways', 'Use an earlier result', 'Name a piece', 'Induction', 'Use symmetry', 'Add zero or multiply by one', 'Telescope', 'Take a limit'];
const NEXT = 'Next: Primer · Matrices.';

// ---------- frame ----------
const SLIDES = [
  { id: 'i-arrow', title: 'A complex number is an arrow in a plane', tag: 'Used in L14 14:43 · L16 00:35',
    question: String.raw`What is a complex number, and what does it buy you?`,
    formula: String.raw`$$i^2=-1$$`, mount: slideI },
  { id: 'why-quarter-turn', proof: true, title: String.raw`Why it's true: multiplying by $i$ is a quarter turn`, tag: 'Used in L14 14:43 · L16 00:35',
    question: String.raw`Why does multiplying by $i$ turn every arrow a quarter turn counterclockwise?`, mount: slideWhyTurn },
  { id: 'multiply', title: 'Multiplying adds angles and multiplies lengths', tag: 'Used in L16 17:55-19:29',
    question: String.raw`What does multiplying two complex numbers do to length and angle?`,
    formula: String.raw`$$\begin{aligned}|zw|&=|z|\,|w|\\ \arg(zw)&=\arg z+\arg w\end{aligned}$$`, mount: slideMul },
  { id: 'why-multiply', proof: true, title: String.raw`Why it's true: lengths multiply, angles add`, tag: 'Used in L16 17:55-19:29',
    question: String.raw`Why does $zw$ have length $|z|\,|w|$ and angle $\arg z+\arg w$?`, mount: slideWhyMul },
  { id: 'euler', proof: true, title: String.raw`Why it's true: $e^{i\theta}=\cos\theta+i\sin\theta$`, tag: 'Used in L14 14:43-15:13',
    question: String.raw`Why does putting $i\theta$ into the series of $e^x$ give the unit arrow at angle $\theta$?`, mount: slideEuler },
  { id: 'shadow', title: 'The turning arrow as a complex number', tag: 'Used in L14 14:43 · L15 04:55-05:28 · L16 00:35',
    question: String.raw`How does a complex number turn the arrow of a wave, sample by sample?`,
    formula: String.raw`$$A\cos(2\pi fn+\varphi)=\operatorname{Re}\!\big(A e^{i\varphi}\,e^{i2\pi fn}\big)$$`, mount: slideComplex },
  { id: 'why-shadow', proof: true, title: String.raw`Why it's true: the shadow is $A\cos(2\pi fn+\varphi)$`, tag: 'Used in L14 14:43 · L15 04:55-05:28 · L16 00:35',
    question: String.raw`Why does one multiplication per sample trace a cosine, and why is $\cos\theta$ two half arrows?`, mount: slideWhyShadow },
  { id: 'product', proof: true, title: String.raw`Why it's true: $\cos A\cos B=\tfrac12[\cos(A+B)+\cos(A-B)]$`, tag: 'Used in L14 25:33-26:36 · L16 11:07',
    question: String.raw`How do trig identities come for free?`, mount: slideProduct },
  { id: 'sum-arrows', title: 'Adding many arrows can cancel', tag: 'Used in L15 27:00-27:30 · L16 24:45-25:16',
    question: String.raw`What happens when you add many arrows?`,
    formula: String.raw`$$\sum_{k=-N}^{N}e^{ikx}=\frac{\sin\big((N+\tfrac12)x\big)}{\sin(x/2)}$$`, mount: slideSum },
  { id: 'why-sum-arrows', proof: true, title: String.raw`Why it's true: the closed form of a sum of arrows`, tag: 'Used in L15 27:00-27:30 · L16 24:45-25:16',
    question: String.raw`Why do $2N+1$ arrows, each turned $x$ from the last, add to a ratio of two sines?`, mount: slideWhySum },
  { id: 'derivative', title: String.raw`Differentiating turns an arrow and multiplies it by $\omega$`, tag: 'Used in L17 16:44',
    question: String.raw`What does differentiating do to $e^{i\omega t}$?`,
    formula: String.raw`$$\frac{d}{dt}e^{i\omega t}=i\omega\,e^{i\omega t}$$`, mount: slideDeriv },
  { id: 'why-derivative', proof: true, title: String.raw`Why it's true: $\tfrac{d}{dt}e^{i\omega t}=i\omega\,e^{i\omega t}$`, tag: 'Used in L17 16:44',
    question: String.raw`Why is the slope of the turning arrow $i\omega$ times the arrow?`, mount: slideWhyDeriv },
];
// A title in plain text, for data-title and the dots' tooltips.
const plainTitle = s => s.title.replace(/\\tfrac\{d\}\{dt\}/g, 'd/dt').replace(/\\tfrac12/g, '½').replace(/\\theta/g, 'θ')
  .replace(/\\omega/g, 'ω').replace(/\\varphi/g, 'φ').replace(/\\pi/g, 'π').replace(/\\(cos|sin)/g, '$1 ').replace(/\\,/g, ' ')
  .replace(/[${}]/g, '').replace(/ +/g, ' ').replace(/ ([=)\]+])/g, '$1');

let cur = 0, shownId = null, endSent = false;
function goTo(i) {
  epoch++;
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  if (shownId !== null && shownId !== s.id) emit('view.step', { step: s.id });
  shownId = s.id;
  const stage = $('#stage');
  stage.innerHTML = '';
  PLOTS = [];
  const widget = h('div', 'widget');
  const side = hh('div', 'side',
    h('div', 'tag', s.tag),
    setTex(h('h2'), s.title),
    setTex(h('p', 'question'), s.question),
    s.formula ? setTex(h('div', 'formula'), s.formula) : null);
  const sec = mark(h('section', 'slide' + (s.proof ? ' proof-slide' : '')), 'step', s.id, plainTitle(s));
  sec.append(widget, side);
  stage.append(sec);
  stage.scrollTop = 0;
  s.mount(widget, side);
  if (cur === SLIDES.length - 1 && !endSent) { endSent = true; emit('view.action', { action: 'deck-end' }); }
  tex(sec);
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, i) => d.classList.toggle('on', i === cur));
}
// A cue is a state: go to the named step, and do nothing if it is already shown.
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i >= 0 && i !== cur) goTo(i);
}
(function init() {
  const dots = $('#dots');
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = plainTitle(s);
    b.addEventListener('click', () => goTo(i));
    dots.appendChild(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],input[type=number],textarea,select')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
})();
</script>

<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Before Lecture 18: one step at a time</title><script src="../../components/theme.js"></script><script src="../../lib/fluid.js"></script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font:18px/1.42 system-ui;color:var(--pal-fg);background:var(--pal-bg)}main{height:100%;display:grid;grid-template-rows:66px 1fr 62px;padding:20px 28px;gap:12px}header,footer{display:flex;align-items:center;justify-content:space-between;gap:18px}header{border-bottom:1px solid var(--pal-line)}.tag{color:var(--pal-muted);font-size:15px}h1{font-size:23px;margin:0}h2{font-size:31px;line-height:1.15;margin:0 0 12px}.body{display:grid;grid-template-columns:60% 40%;min-height:0}.lab{display:flex;flex-direction:column;background:var(--pal-soft);border:1px solid var(--pal-line);border-radius:12px;padding:16px;gap:10px;min-height:0}.lesson{padding:20px 0 10px 28px;display:flex;flex-direction:column;min-height:0}.question{font-size:21px;margin:0 0 16px}.formula{font-size:23px;padding:12px;background:var(--pal-accent-soft);border-radius:8px;margin:8px 0 12px}.defs{font-size:17px;color:var(--pal-text-2)}ol{padding-left:24px;margin:8px 0}li{margin-bottom:9px}.take{margin-top:auto;padding:12px;border-left:4px solid var(--pal-accent);background:var(--pal-accent-soft);font-size:18px}.chart{flex:1;min-height:0;position:relative}svg{width:100%;height:100%;display:block}.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:44px}button,select{font:inherit;color:var(--pal-fg);background:var(--pal-panel);border:1px solid var(--pal-line);border-radius:7px;padding:9px 15px;cursor:pointer}button:hover{border-color:var(--pal-accent)}button:disabled{opacity:.4;cursor:default}input{accent-color:var(--pal-accent)}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:16px}.legend span:before{content:'━';margin-right:7px;color:var(--c)}.readout{font-size:19px;min-height:30px}.proof{height:100%;display:flex;flex-direction:column;gap:14px;justify-content:center}.proof-row{font-size:24px;background:var(--pal-panel);border-left:4px solid var(--pal-amber);padding:16px}.proof-row small{display:block;font-size:17px;color:var(--pal-muted);margin-top:7px}.choices{display:flex;flex-direction:column;gap:14px;justify-content:center;height:100%}.choice{text-align:left;padding:18px;font-size:19px}.choice small{display:block;font-size:16px;color:var(--pal-muted);margin-top:7px}.verdict{color:var(--pal-accent);font-size:17px}.intro{display:grid;gap:18px;align-content:center;height:100%}.intro div{background:var(--pal-panel);padding:22px;border-left:4px solid var(--pal-accent);font-size:23px}.intro small{display:block;font-size:18px;color:var(--pal-muted);margin-top:5px}footer{border-top:1px solid var(--pal-line);padding-top:12px}.pages{font-size:16px;color:var(--pal-muted)}.source{font-size:14px;color:var(--pal-muted)}</style></head><body><main><header><h1>Before Lecture 18: one step at a time</h1><span id="tag" class="tag"></span></header><section class="body"><div id="lab" class="lab"></div><article class="lesson"><h2 id="title"></h2><p id="question" class="question"></p><div id="defs" class="defs"></div><div id="formula" class="formula"></div><ol id="tries"></ol><div id="take" class="take"></div></article></section><footer><button id="prev">← Previous</button><span class="pages" id="pages"></span><span class="source">Hamming · Lecture 18 · manual study</span><button id="next">Next →</button></footer></main><script>
const slides=[{"id": "why", "title": "A simulator repeats a small guess", "time": "Before \u00b7 03:44\u201306:21", "q": "How can a machine predict a changing system?", "kind": "intro", "defs": "No new symbols yet.", "formula": "", "tries": ["Imagine cooling tea: the hotter it is, the faster it loses heat.", "A simulator asks how much changes in a short moment, then repeats."], "take": "After this primer: read an update rule, try its steps, and tell physical instability from numerical instability.", "cards": [["A concrete need", "Predict the tea temperature without waiting an hour."], ["A reusable move", "Read the current temperature \u2192 estimate the cooling \u2192 update."], ["Where this matters", "Hamming\u2019s moving shells and weather blocks; rollout models in AI."], ["Three small chapters", "Build one step \u2192 justify it \u2192 test its stability."]]}, {"id": "step", "title": "Take one small step", "time": "Before \u00b7 03:44", "q": "What does \u201cuse the current forces\u201d mean?", "kind": "euler", "defs": "Here $x$ is excess tea temperature above the room, in degrees. The subscript counts steps; $h$ is the step duration.", "formula": "$x_{k+1}=x_k-hx_k$", "tries": ["Set the time step to 0.2. Click \u201cOne step\u201d several times.", "The blue dots cool by 20% of the remaining excess each step."], "take": "The rule reuses the current state. It does not predict the whole curve at once."}, {"id": "why-euler", "title": "Why this update is an approximation", "time": "Before \u00b7 03:44", "q": "Where does the stepping rule come from?", "kind": "proof", "defs": "Here $h$ is a short time step; $x(t)$ is excess temperature.", "formula": "$x'(t)=-x(t)$", "tries": ["Guess the next line, then reveal one move.", "The exact local slope becomes a finite-step estimate."], "take": "Euler\u2019s rule freezes the slope for one step. Smaller steps reduce that local approximation.", "rows": [["x'(t)=\\lim_{h\\to0}\\frac{x(t+h)-x(t)}h", "Definition: instantaneous cooling rate"], ["\\frac{x(t+h)-x(t)}h\\approx-x(t)", "Approximate: use a short, finite interval"], ["x(t+h)\\approx x(t)-hx(t)", "Multiply by the interval and rearrange"], ["x_{k+1}=x_k-hx_k", "Define the computed sequence by this rule"]]}, {"id": "stability", "title": "A cooling system can look explosive", "time": "Before \u00b7 06:21\u201309:40", "q": "Can the program create instability that the real model lacks?", "kind": "euler-stability", "defs": "Same cooling model; the blue line joins computed steps. The green line is exact cooling.", "formula": "$x_{k+1}=(1-h)x_k$", "tries": ["Move the time step above 2. Watch the alternating dots grow.", "Return below 1. The computed tea cools without overshooting."], "take": "Physical stability and the stability of a numerical method are separate questions."}, {"id": "why-stable", "title": "A test for this stepping rule", "time": "Before \u00b7 09:40", "q": "When does an error shrink on every step?", "kind": "proof", "defs": "Let $e_k$ be the difference between two computed temperatures at step $k$.", "formula": "$e_{k+1}=(1-h)e_k$", "tries": ["Predict the condition before revealing.", "Notice that this proof concerns Euler\u2019s cooling rule, not every simulator."], "take": "For positive time steps, errors decay exactly when the step is smaller than 2 in these units.", "rows": [["e_{k+1}=(1-h)e_k", "Subtract two copies of the same update"], ["|e_{k+1}|=|1-h|\\,|e_k|", "Take magnitudes"], ["|1-h|<1", "Each step must multiply error by less than one"], ["0<h<2", "Solve the two inequalities"]]}];let page=0,revealed=0,picked=-1,step=0;const values={h:.2,a:1.1,w:1,g:1.15,n:32};const $=x=>document.getElementById(x);const math=()=>{if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});};
function emit(kind,data){if(window.fluid)fluid.emit(kind,data)}
function setPage(i){page=Math.max(0,Math.min(slides.length-1,i));revealed=0;picked=-1;step=0;render();emit('view.step',{step:slides[page].id})}
function render(){let s=slides[page];$('title').textContent=s.title;$('tag').textContent=s.time;$('question').textContent=s.q;$('defs').innerHTML=s.defs;$('formula').innerHTML=s.formula;$('formula').style.display=s.formula?'':'none';$('tries').innerHTML=s.tries.map(t=>'<li>'+t+'</li>').join('');$('take').textContent=s.take;$('pages').textContent=`${page+1} / ${slides.length}`;$('prev').disabled=page===0;$('next').disabled=page===slides.length-1;let lab=$('lab');lab.innerHTML='';if(s.kind==='proof'){lab.innerHTML='<div class="proof">'+s.rows.slice(0,revealed).map(r=>'<div class="proof-row">$'+r[0]+'$<small>'+r[1]+'</small></div>').join('')+(revealed===0?'<div class="intro"><div>Predict the first move.<small>Each click reveals one equation and the reason for it.</small></div></div>':'')+'</div><button id="reveal">'+(revealed<s.rows.length?'Reveal next move':'Proof complete')+'</button>';$('reveal').disabled=revealed>=s.rows.length;$('reveal').onclick=()=>{revealed++;render()};}else if(s.kind==='intro'){lab.innerHTML='<div class="intro">'+s.cards.map(c=>'<div>'+c[0]+'<small>'+c[1]+'</small></div>').join('')+'</div>';}else if(s.kind==='choice'){lab.innerHTML='<div class="choices">'+s.options.map((o,i)=>`<button class="choice" data-item="choice" data-id="${s.id}-${i}">${o[0]}<small>${o[1]}</small>${picked>=0?'<div class="verdict">'+(i===s.answer?'✓ ':'')+o[2]+'</div>':''}</button>`).join('')+'</div><button id="answer">Show answer</button>';lab.querySelectorAll('.choice').forEach((b,i)=>b.onclick=()=>{picked=i;render();emit('view.action',{action:'prediction',step:s.id,choice:i})});$('answer').onclick=()=>{picked=s.answer;render()};}else{lab.innerHTML='<div class="chart" id="chart"></div><div class="legend" id="legend"></div><div class="readout" id="readout"></div><div class="controls" id="controls"></div>';draw();}math();}
function chart(series,{xmin=0,xmax=20,ymin=0,ymax=3,xlabel='step',ylabel='value',circle=false}={}){const W=circle?371:700,H=365,L=56,R=20,T=24,B=46,px=x=>L+(x-xmin)/(xmax-xmin)*(W-L-R),py=y=>H-B-(y-ymin)/(ymax-ymin)*(H-T-B);let v=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${ylabel} by ${xlabel}">`;for(let i=0;i<=4;i++){let y=ymin+(ymax-ymin)*i/4;v+=`<line x1="${L}" x2="${W-R}" y1="${py(y)}" y2="${py(y)}" stroke="${FluidTheme.color('line')}"/><text x="${L-8}" y="${py(y)+5}" text-anchor="end" fill="${FluidTheme.color('muted')}" font-size="15">${y.toFixed(2)}</text>`;}for(let i=0;i<=4;i++){let x=xmin+(xmax-xmin)*i/4;v+=`<text x="${px(x)}" y="${H-23}" text-anchor="middle" fill="${FluidTheme.color('muted')}" font-size="15">${x.toFixed(xmax<5?1:0)}</text>`;}series.forEach(s=>{v+=`<polyline points="${s.p.map(p=>`${px(p[0])},${py(p[1])}`).join(' ')}" fill="none" stroke="${FluidTheme.color(s.color)}" stroke-width="3"/>`;if(s.dots)s.p.forEach(p=>v+=`<circle cx="${px(p[0])}" cy="${py(p[1])}" r="4" fill="${FluidTheme.color(s.color)}"/>`)});v+=`<text x="${W/2}" y="${H-2}" text-anchor="middle" fill="${FluidTheme.color('muted')}" font-size="16">${xlabel}</text><text x="${L}" y="16" fill="${FluidTheme.color('muted')}" font-size="16">${ylabel}</text></svg>`;$('chart').innerHTML=v;$('legend').innerHTML=series.map(s=>`<span style="--c:var(--pal-${s.color})">${s.label}</span>`).join('');}
function slider(key,min,max,inc,label){$('controls').innerHTML=`<label>${label} <input aria-label="${label.replace(/\$/g,'')}" type="range" min="${min}" max="${max}" step="${inc}" value="${values[key]}"></label><output>${values[key]}</output>`;$('controls').querySelector('input').oninput=e=>{values[key]=+e.target.value;draw();math()};}
function draw(){let s=slides[page],h=values.h;
if(s.kind==='euler'||s.kind==='euler-stability'){if(s.kind==='euler'){let p=Array.from({length:step+1},(_,k)=>[k*h,10*Math.pow(1-h,k)]);chart([{p,label:'computed temperature',color:'accent',dots:true}],{xmax:4,ymax:10,xlabel:'time',ylabel:'excess temperature (degrees)'});$('readout').innerHTML=`Step ${step}: excess temperature ${p.at(-1)[1].toFixed(2)} degrees`;$('controls').innerHTML='<button id="one">One step</button><button id="reset">Reset</button><label>Time step <select id="h"><option>0.1</option><option>0.2</option><option>0.5</option></select></label>';$('h').value=h;$('h').onchange=e=>{values.h=+e.target.value;step=0;draw()};$('one').disabled=step>=Math.floor(4/h);$('one').onclick=()=>{step++;draw()};$('reset').onclick=()=>{step=0;draw()};}else{let p=Array.from({length:9},(_,k)=>[k*h,Math.pow(1-h,k)]),q=Array.from({length:101},(_,k)=>[k*8*h/100,Math.exp(-k*8*h/100)]),ym=Math.max(1,...p.map(z=>Math.abs(z[1])));chart([{p,label:'Euler steps',color:'accent',dots:true},{p:q,label:'exact cooling',color:'green'}],{xmax:8*h,ymin:-ym,ymax:ym,xlabel:'time',ylabel:'excess temperature'});slider('h',.2,2.5,.1,'Time step');$('readout').innerHTML=`Per-step multiplier: ${(1-h).toFixed(2)}. ${h<2?'Errors shrink.':h===2?'Errors keep their magnitude.':'Errors grow.'}`;}}
if(s.kind==='sensitivity'){let a=values.a,p=Array.from({length:21},(_,k)=>[k,0]),q=p.map(([k,y])=>[k,.01*Math.pow(a,k)]);chart([{p,label:'start at 0',color:'accent'},{p:q,label:'start at 0.01',color:'orange'}],{ymax:Math.max(.012,.0105*Math.pow(a,20)),xlabel:'step',ylabel:'state'});slider('a',.8,1.3,.01,'Multiplier');$('readout').innerHTML=`Gap at step 20: ${(0.01*Math.pow(a,20)).toFixed(4)} (started at 0.01)`;}
if(s.kind==='local'){let w=values.w,p=Array.from({length:101},(_,i)=>[i*.02,(i*.02)**2]),q=[[0,-1],[2,3]];chart([{p,label:'squared response',color:'accent'},{p:q,label:'local straight line',color:'orange'},{p:[[w,w*w]],label:'chosen size',color:'accent',dots:true}],{xmax:2,ymin:-1,ymax:4,xlabel:'relative wing size',ylabel:'toy response'});slider('w',.1,2,.01,'Relative wing size');$('readout').innerHTML=`True response ${(w*w).toFixed(3)} · linear estimate ${(2*w-1).toFixed(3)} · error ${((w-1)**2).toFixed(3)}`;}
if(s.kind==='clipping'){let x=0,z=0,p=[[0,0]],q=[[0,0]];for(let k=0;k<12;k++){let u=k<6?.4:-.4;x=Math.min(1,x+u);z+=u;p.push([k+1,x]);q.push([k+1,Math.min(1,z)])}chart([{p,label:'clip stored state',color:'accent',dots:true},{p:q,label:'clip output only',color:'orange',dots:true}],{xmax:12,ymin:-1.5,ymax:1.5,xlabel:'step (reverse command after 6)',ylabel:'displayed actuator position'});$('readout').textContent='At step 7: state-clipped output 0.60; output-only clipping still shows 1.00.';$('controls').innerHTML='<button id="reverse">Replay explanation</button>';$('reverse').onclick=()=>{ $('readout').textContent='Output-only clipping stored 2.40 at step 6. A reverse step leaves 2.00 internally, so the output stays at 1.00.';};}
if(s.kind==='relay'){let g=values.g;let series=Array.from({length:5},(_,j)=>({p:Array.from({length:61},(_,k)=>[k/15,Math.pow(g,j)*Math.exp(-k/15)]),label:'station '+(j+1),color:['accent','green','orange','hue-purple','ink'][j]}));chart(series,{xmax:4,ymax:Math.max(1,Math.pow(g,4))*1.05,xlabel:'time after each pulse arrives',ylabel:'pulse amplitude'});slider('g',.6,1.5,.05,'Peak gain');$('readout').innerHTML=`Station 5 peak: ${Math.pow(g,4).toFixed(3)}. Every curve still decays in time.`;}
if(s.kind==='circle'){let n=values.n,h=2*Math.PI/n,x=1,y=0,p=[[x,y]];for(let k=0;k<n;k++){[x,y]=[x-h*y,y+h*x];p.push([x,y])}let exact=Array.from({length:201},(_,k)=>[Math.cos(k*Math.PI/100),Math.sin(k*Math.PI/100)]);let bound=Math.max(1.2,...p.flat().map(Math.abs))*1.05;chart([{p:exact,label:'exact unit circle',color:'green'},{p,label:'Euler trajectory',color:'accent'},{p:[[1,0]],label:'start',color:'orange',dots:true}],{xmin:-bound,xmax:bound,ymin:-bound,ymax:bound,xlabel:'horizontal position',ylabel:'vertical position',circle:true});$('controls').innerHTML='<label>Steps per turn <select id="n"><option>16</option><option>32</option><option>64</option><option>128</option></select></label>';$('n').value=n;$('n').onchange=e=>{values.n=+e.target.value;draw()};$('readout').textContent=`Endpoint misses start by ${Math.hypot(x-1,y).toFixed(3)}. Radius ends at ${Math.hypot(x,y).toFixed(3)}.`;}
math();}
$('prev').onclick=()=>setPage(page-1);$('next').onclick=()=>setPage(page+1);window.addEventListener('fluid-themechange',()=>{if($('chart'))draw()});window.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')setPage(page+1);if(e.key==='ArrowLeft')setPage(page-1)});if(window.fluid)fluid.onCue(m=>{if(m.step){let i=slides.findIndex(s=>s.id===m.step);if(i>=0)setPage(i)}});render();document.addEventListener('DOMContentLoaded',math);window.addEventListener('load',math);
</script></body></html>

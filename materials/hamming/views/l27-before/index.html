<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Before Lecture 27: agreement and truth</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><script src="../../components/theme.js"></script><style>*{box-sizing:border-box}body{margin:0;background:var(--pal-bg);color:var(--pal-fg);font:18px/1.42 system-ui,sans-serif}main{height:100vh;padding:26px 30px;display:grid;grid-template-rows:58px 1fr 44px;gap:15px}header,footer{display:flex;align-items:center;justify-content:space-between;gap:14px}h1{font-size:24px;margin:0}h2{font-size:29px;line-height:1.15;margin:0 0 12px}p{margin:0 0 14px}.tag{color:var(--pal-muted);font-size:16px}.body{display:grid;grid-template-columns:59% 1fr;gap:28px;min-height:0}.lab{border:1px solid var(--pal-line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:15px;background:var(--pal-panel);min-height:0}.lesson{padding:8px 0;display:flex;flex-direction:column}.question{font-size:20px}.defs{color:var(--pal-text-2);margin-bottom:14px;font-size:17px}.formula{font-size:26px;margin-bottom:10px}.take{background:var(--pal-accent-soft);padding:15px;border-radius:10px;font-size:18px;margin-top:auto}ol{padding-left:25px;margin:5px 0 18px}li{padding:4px 0}button,select{font:inherit;color:var(--pal-fg);background:var(--pal-soft);border:1px solid var(--pal-line);border-radius:8px;padding:9px 14px;cursor:pointer}button:hover{background:var(--pal-accent-soft)}button:disabled{opacity:.45;cursor:default}.chart{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.chart svg{width:100%;height:100%}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:16px}.legend span:before{content:'';display:inline-block;width:20px;height:4px;background:var(--c);margin-right:7px;vertical-align:middle}.readout{padding:13px;background:var(--pal-soft);border-radius:8px;font-size:18px;min-height:55px}.controls{display:flex;align-items:center;gap:16px}.controls label{display:flex;align-items:center;gap:16px;flex:1}input[type=range]{flex:1;accent-color:var(--pal-accent)}.intro,.choices,.proof{display:flex;flex-direction:column;flex:1;gap:17px;justify-content:center}.intro>div{border-left:4px solid var(--pal-accent);background:var(--pal-soft);padding:20px;font-size:22px}.intro small,.choice small{display:block;font-size:17px;margin-top:8px;color:var(--pal-text-2)}.choice{text-align:left;padding:18px;font-size:20px}.verdict{border-top:1px solid var(--pal-line);margin-top:10px;padding-top:10px;font-size:17px;color:var(--pal-accent-deep)}.proof-row{padding:10px;background:var(--pal-soft);font-size:22px;border-left:4px solid var(--pal-line)}.proof-row:last-child{background:var(--pal-amber-row);border-color:var(--pal-amber)}.proof-row small{display:block;font-size:16px;margin-top:3px;color:var(--pal-text-2)}.guess{font-size:17px}.guess button{font-size:16px;padding:5px 8px;margin:4px 4px 0 0}.proof{gap:10px}.choice{font-size:19px;padding:14px}.choice small,.verdict{font-size:16px;line-height:1.35}.source{color:var(--pal-muted);font-size:15px}a{color:var(--pal-accent-deep)}.pages{font-size:16px;color:var(--pal-muted)}</style></head><body><main><header><h1>Before Lecture 27: agreement and truth</h1><span id="tag" class="tag"></span></header><section class="body"><div id="lab" class="lab"></div><article class="lesson"><h2 id="title"></h2><p id="question" class="question"></p><div id="defs" class="defs"></div><div id="formula" class="formula"></div><ol id="tries"></ol><div id="take" class="take"></div></article></section><footer><button id="prev">← Previous</button><span class="pages" id="pages"></span><span class="source">L27 · manual study · <a href="https://www.youtube.com/watch?v=N-0kk-qDpuI" target="_blank">lecture on YouTube</a></span><button id="next">Next →</button></footer></main><script>const slides=[{"id": "scale", "kind": "bias", "title": "A scale can agree with itself", "time": "Before \u00b7 prepares 14:13", "q": "Does a tight group of readings show that a scale is right?", "defs": "A 100-gram calibration weight is weighed ten times. The scale has an adjustable offset; the same small fluctuations repeat. This is a teaching model.", "tries": ["Move the offset to 12 grams.", "Compare the cluster with the known weight."], "take": "Repeating a measurement reveals scatter. A known reference can expose a shared offset."}, {"id": "calibration", "kind": "choice", "title": "Which check can find the offset?", "time": "Before \u00b7 prepares 07:32", "q": "What would add information that repeated weighing cannot?", "defs": "The ten readings agree within one gram, but their common offset is unknown.", "tries": ["Pick the check that can challenge the instrument."], "take": "A check needs an independent connection to the quantity you care about.", "options": [["Repeat the unknown object 1,000 times", "Assumes the offset disappears with repetition.", "More repeats reduce random scatter, but preserve a common offset."], ["Weigh a trusted reference mass", "Assumes the reference is independently reliable.", "Supported: compare the reading with a value established independently."], ["Read the maker\u2019s accuracy plate", "Assumes advertised accuracy establishes current calibration.", "The plate is a specification, not a fresh check."]], "answer": 1}, {"id": "precision", "kind": "choice", "title": "Two different questions", "time": "Before \u00b7 prepares 14:44", "q": "What do \u201crepeatable\u201d and \u201caccurate\u201d ask?", "defs": "A scale reads 111.8, 112.0 and 112.2 grams for a known 100-gram weight.", "tries": ["Choose the statement supported by these three readings."], "take": "Precision concerns agreement between readings. Accuracy concerns agreement with the target.", "options": [["The scale is precise and accurate", "Assumes agreement implies correctness.", "The 12-gram offset contradicts accuracy here."], ["Nothing can be learned", "Assumes imperfect data carries no information.", "We can see both tight scatter and a substantial offset."], ["The scale is precise but inaccurate", "Assumes the reference really is 100 grams.", "Supported in this controlled case: tight scatter, wrong center."]], "answer": 2}];
let page=0,revealed=0,picked=-1,guess=-1;const values={offset:0,transaction:0,sample:25,bonus:0,mix:20};const $=id=>document.getElementById(id);const math=()=>{if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});};
function setPage(i){page=Math.max(0,Math.min(slides.length-1,i));revealed=0;picked=-1;guess=-1;render()}
function render(){let s=slides[page];$('title').textContent=s.title;$('tag').textContent=s.time;$('question').textContent=s.q;$('defs').innerHTML=s.defs||'';$('formula').innerHTML=s.formula||'';$('tries').innerHTML=s.tries.map(t=>'<li>'+t+'</li>').join('');$('take').textContent=s.take;$('take').style.visibility=(s.kind==='choice'&&picked<0)||(s.kind==='proof'&&revealed<s.rows.length)?'hidden':'visible';$('pages').textContent=`${page+1} / ${slides.length}`;$('prev').disabled=page===0;$('next').disabled=page===slides.length-1;let lab=$('lab');if(s.kind==='intro'){lab.innerHTML='<div class="intro">'+s.cards.map(c=>'<div data-item="case" data-title="'+c[0]+'">'+c[0]+'<small>'+c[1]+'</small></div>').join('')+'</div>';}else if(s.kind==='choice'){lab.innerHTML='<div class="choices">'+s.options.map((o,i)=>`<button class="choice" data-item="choice" data-id="${s.id}-${i}">${o[0]}${picked<0?'<small>'+o[1]+'</small>':''}${picked>=0?'<div class="verdict">'+(i===s.answer?'Supported: ':'')+o[2]+'</div>':''}</button>`).join('')+'</div><button id="answer">Show answer</button>';lab.querySelectorAll('.choice').forEach((b,i)=>b.onclick=()=>{picked=i;render()});$('answer').onclick=()=>{picked=s.answer;render()};}else if(s.kind==='proof'){let choices=revealed<s.rows.length?[s.rows[revealed][1],'Assume more data removes every error','Ignore the stated assumptions']:[];lab.innerHTML='<div class="proof">'+s.rows.slice(0,revealed).map(r=>'<div class="proof-row">$'+r[0]+'$<small>'+r[1]+'</small></div>').join('')+(revealed===0?'<p>Guess the next move. Each reveal adds one equation and its reason.</p>':'')+'</div>'+(choices.length?'<div class="guess">What move would you try next?<div>'+choices.map((c,i)=>`<button class="move" data-item="proof-guess" data-id="${i}">${c}</button>`).join('')+'</div><div id="feedback">'+(guess<0?'Choose a move, or reveal to check.':guess===0?'That move uses the stated assumptions and advances the proof.':'Check whether that move follows from the current assumptions.')+'</div></div>':'')+'<button id="reveal">'+(revealed<s.rows.length?'Reveal next move':'Proof complete')+'</button>';$('reveal').disabled=revealed>=s.rows.length;$('reveal').onclick=()=>{revealed++;guess=-1;render()};lab.querySelectorAll('.move').forEach((b,i)=>b.onclick=()=>{guess=i;render()});}else{lab.innerHTML='<div class="chart" id="chart"></div><div class="legend" id="legend"></div><div class="readout" id="readout"></div><div class="controls" id="controls"></div>';draw()}math()}

const C=n=>FluidTheme.color(n);const line=(x,y,X,Y,c,dash='')=>`<line x1="${x}" y1="${y}" x2="${X}" y2="${Y}" stroke="${C(c)}" stroke-width="3" stroke-dasharray="${dash}"/>`;const label=(x,y,t,c='text-2',a='start')=>`<text x="${x}" y="${y}" fill="${C(c)}" font-size="19" text-anchor="${a}">${t}</text>`;
function slider(k,min,max,step,name){$('controls').innerHTML=`<label>${name}<input aria-label="${name}" type="range" min="${min}" max="${max}" step="${step}" value="${values[k]}"></label><output>${values[k]}</output>`;$('controls').querySelector('input').oninput=e=>{values[k]=+e.target.value;draw();math()}}
function draw(){let s=slides[page],v='<svg viewBox="0 0 680 340" role="img" aria-label="'+s.title+'">';
if(s.kind==='bias'){let b=values.offset,px=x=>65+x*22;v+=label(35,30,'Ten readings of the same 100-gram weight');v+=line(px(0),60,px(0),270,'ink','6 5')+label(px(0),310,'100','ink','middle');for(let i=0;i<10;i++){let x=px(b+[-.5,.2,-.2,.5,0,.3,-.3,.1,-.1,0][i]);v+=`<circle cx="${x}" cy="${80+i*19}" r="6" fill="${C('accent')}"/>`;}for(let x=5;x<=25;x+=5)v+=label(px(x),310,100+x,'muted','middle');v+=label(650,337,'reading (grams)','text-2','end');$('legend').innerHTML='<span style="--c:var(--pal-ink)">dashed line: known weight</span><span style="--c:var(--pal-accent)">dots: repeated readings</span>';$('readout').textContent=`Average reading: ${100+b} grams. Offset: ${b} grams. Same scatter at every setting.`;slider('offset',0,24,1,'Common offset (grams)')}
if(s.kind==='inventory'){let t=values.transaction,stock=[5,8,-1,3],texts=['Start with five parts','Receive three parts','Withdraw nine parts','Receive four parts'];v+=label(30,35,'Stock after each recorded transaction');for(let i=0;i<=t;i++){let x=80+i*165,y=210-stock[i]*13;v+=`<rect x="${x}" y="${Math.min(y,210)}" width="90" height="${Math.abs(stock[i]*13)}" fill="${C(stock[i]<0?'red':'accent')}"/>`+label(x+45,stock[i]<0?250:y-15,stock[i],stock[i]<0?'red':'ink','middle')+label(x+45,300,i===0?'start':'step '+i,'text-2','middle');}v+=line(40,210,650,210,'ink');$('legend').innerHTML='<span style="--c:var(--pal-accent)">bar: parts remaining</span><span style="--c:var(--pal-red)">failed check: negative stock</span>';$('readout').textContent=texts[t]+'. '+(t>=2?'Step 2 requires a missing receipt, a wrong count, or an invalid assumption.':'Does the next transaction remain possible?');slider('transaction',0,3,1,'Recorded transaction')}
if(s.kind==='sample'){let n=values.sample,cheap=16+100/n,clean=4;v+=label(30,30,'Expected squared error (percentage points squared)');for(let i=0;i<2;i++){let val=[cheap,clean][i],x=170+i*260,h=val*10;v+=`<rect x="${x}" y="${280-h}" width="140" height="${h}" fill="${C(i?'accent':'orange')}"/>`+label(x+70,270-h,val.toFixed(2),'ink','middle')+label(x+70,320,i?'audited 25':'cheap sample','text-2','middle')}v+=line(80,280-160,640,280-160,'guide','6 5')+label(610,110,'bias floor: 16','muted','end');$('legend').innerHTML='<span style="--c:var(--pal-orange)">cheap: four-point bias</span><span style="--c:var(--pal-accent)">audited: zero bias</span>';$('readout').innerHTML=`Cheap sample: $16+100/${n}=${cheap.toFixed(2)}$. Audited sample: $100/25=4$. These are invented assumptions.`;slider('sample',25,1000,25,'Cheap sample size')}
if(s.kind==='drift'){let b=values.bonus,px=x=>60+x*60,py=y=>290-(y-40)*4;for(let y=40;y<=100;y+=20)v+=line(60,py(y),660,py(y),'grid')+label(48,py(y)+6,y,'muted','end');v+=line(60,py(60),660,py(60),'ink','7 5')+`<polyline points="${Array.from({length:11},(_,i)=>px(i)+','+py(60+(i>=5?b:0))).join(' ')}" fill="none" stroke="${C('accent')}" stroke-width="4"/>`;for(let x=0;x<=10;x+=2)v+=label(px(x),320,x,'muted','middle');v+=line(px(5),30,px(5),295,'guide','4 4')+label(30,25,'score')+label(650,340,'year','text-2','end');$('legend').innerHTML='<span style="--c:var(--pal-accent)">solid: reported score</span><span style="--c:var(--pal-ink)">dashed: true score</span><span style="--c:var(--pal-guide)">vertical: rule changes</span>';$('readout').textContent=`True score stays 60. Reported score jumps by ${b} points in year five.`;slider('bonus',0,30,1,'Reporting bonus')}
if(s.kind==='mixture'){let w=values.mix,a=30+.6*w;v+=label(30,30,'Score (points out of 100)');[90,30,a].forEach((h,i)=>{let x=110+i*190;v+=`<rect x="${x}" y="${280-h*2.3}" width="100" height="${h*2.3}" fill="${C(i===2?'accent':'grey-bar')}"/>`+label(x+50,265-h*2.3,h.toFixed(0),'ink','middle')+label(x+50,320,['easy','hard','mixture'][i],'text-2','middle')});$('legend').innerHTML='<span style="--c:var(--pal-grey-bar)">fixed task scores</span><span style="--c:var(--pal-accent)">current weighted average</span>';$('readout').innerHTML=`Easy share: ${w}%. Mixture score: $${(w/100).toFixed(2)}\\times90+${(1-w/100).toFixed(2)}\\times30=${a.toFixed(0)}$.`;slider('mix',0,100,10,'Easy-task share (%)')}
$('chart').innerHTML=v+'</svg>';math()}
$('prev').onclick=()=>setPage(page-1);$('next').onclick=()=>setPage(page+1);window.addEventListener('fluid-themechange',()=>{if($('chart'))draw()});window.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')setPage(page+1);if(e.key==='ArrowLeft')setPage(page-1)});render();window.addEventListener('load',math);
</script></body></html>

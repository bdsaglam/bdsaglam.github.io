<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>The FFT: fast, accurate, periodic, and blind to phase</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../../components/theme.js"></script>
<style>
/* Colors come from the theme palette (../../components/theme.js): grey for inputs and exact values, accent for
   outputs and the reader's choice, amber only for proof lights, red only for a failed check. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft);
  --red:var(--pal-red); --redbg:var(--pal-red-bg);
  --tint:var(--pal-soft-hover); --rim:var(--pal-soft-3);
  --u:clamp(16px,1.35vw,20px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 24px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(6px,1vh,12px) 24px;overflow:hidden}
footer{display:flex;align-items:center;gap:10px;padding:8px 24px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Slide frame: widget on the left (3/5), text on the right (2/5). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(18px,2.4vw,40px)}
.widget{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(6px,1vh,10px);overflow:hidden}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(6px,1.1vh,12px);overflow:hidden}
.tag{font:13px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(20px,1.9vw,28px);line-height:1.2;margin:0;font-weight:650}
.question{margin:0;font-size:clamp(16px,1.3vw,18px);font-weight:600}
.case{margin:0;font-size:16px}
.formula{font-size:clamp(18px,1.7vw,24px)}
.formula .katex-display{margin:.15em 0}
.sym{margin:0;font-size:16px;color:var(--muted)}
.recall b{color:var(--pal-text-2);font-weight:600}
.tries{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.tries li::marker{color:var(--accent);font-weight:600}
.takeaway{margin:0;padding:10px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}
.aiblk{display:flex;flex-direction:column;gap:2px;align-self:stretch}
.kicker{font-size:14px;color:var(--muted);margin:0}
.ai{margin:0;font-size:16px;line-height:1.35}
.ai .src{color:var(--muted);font-size:14px}
.ai code{font:14px ui-monospace,Menlo,monospace;background:var(--pal-soft);padding:0 3px;border-radius:3px}
.predict{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.predict .said{font-size:16px;color:var(--pal-text-2)}

/* Controls, readouts, legend */
.sliders{display:flex;gap:8px 24px;flex-wrap:wrap;width:100%;align-items:center}
.btnrow{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center}
.btnrow .lab{font-size:16px;color:var(--muted);margin-right:2px}
.slide-ctl{display:flex;align-items:center;gap:8px;font-size:16px;flex-wrap:wrap}
.slide-ctl input{width:clamp(120px,12vw,190px);vertical-align:middle;accent-color:var(--accent)}
.slide-ctl .val{min-width:44px}
.btn{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--pal-panel);color:var(--fg);border-radius:8px;cursor:pointer;font-size:16px}
.btn.on{background:var(--chip);border-color:var(--accent);color:var(--pal-accent-deep)}
.btn:disabled{opacity:.4;cursor:default}
.readouts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.readout{flex:1 1 150px;min-width:0;padding:4px 10px;border-radius:10px;background:var(--pal-soft);font-size:16px;overflow-wrap:anywhere;overflow:hidden}
.readout.wide{flex-basis:100%}
.readout .k{color:var(--pal-text-2);font-size:15px}
.readout .val{font-size:17px;font-weight:600;line-height:1.55}
.readout.bad{background:var(--redbg);color:var(--red)}
.readout.bad .k{color:var(--red)}
.legend{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:16px;color:var(--pal-text-2);align-items:center}
.sw{display:inline-block;width:22px;height:0;vertical-align:middle;margin-right:6px}
.chip{display:inline-block;width:16px;height:12px;vertical-align:middle;margin-right:6px;border-radius:2px}
.note{margin:0;font-size:16px;color:var(--pal-text-2)}

/* Plots fill the height left in the widget column */
.fill{flex:1 1 0;min-height:90px;position:relative;width:100%}
.fill>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.takeholder{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.takeholder .takeaway{align-self:stretch}

/* Proof slides: test and picture on the left, the proof (fl-proof-steps) on the right */
.slide.proof-slide{grid-template-columns:minmax(0,11fr) minmax(0,9fr)}
.slide.proof-slide .side{justify-content:flex-start}
.fill.proofpic{min-height:150px}
.slide.proof-slide .slide-ctl input{width:clamp(90px,9vw,140px)}
.slide.proof-slide .sliders{gap:6px 16px}
.slide.proof-slide .btn{padding:4px 10px}
.part{margin:0;font-weight:600;color:var(--muted)}
.test{display:flex;flex-direction:column;gap:3px}
.test .tries{gap:3px}
.model{margin:0;padding:8px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}
.picread{font-size:16px;color:var(--pal-text-2)}

/* Decision slides: the problem, three cards and the reveal on the left; question, try-steps,
   AI echo and takeaway on the right. */
.slide.decision{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:clamp(20px,2.6vw,40px)}
.decision .widget{gap:6px}
.decision .side{justify-content:space-evenly;gap:clamp(8px,1.6vh,16px)}
.decision h2{font-size:clamp(20px,1.9vw,26px)}
.decision .q{margin:0;font-size:clamp(16px,1.4vw,19px);font-weight:600;line-height:1.35}
.decision .fx{margin:0;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:var(--tint);font-size:clamp(17px,1.5vw,20px);line-height:1.4}
.decision .blk{display:flex;flex-direction:column;gap:3px}
.decision .takeaway{padding:10px 14px;line-height:1.4}
.decision .tries{gap:5px;font-size:clamp(16px,1.3vw,18px);line-height:1.4}
.decision .hold{color:var(--muted);font-style:italic;background:var(--tint);border:1px dashed var(--line);border-radius:6px;padding:8px 12px;margin:0;font-size:16px;line-height:1.4}
.prob{flex:0 0 auto;display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--tint);font-size:16px;line-height:1.38}
.prob .lead{font-weight:650;color:var(--muted)}
.prob p{margin:0;flex:1 1 0;min-width:0}
.sketch{flex:0 0 clamp(150px,14vw,190px);height:clamp(92px,14vh,112px);position:relative}
.sketch>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.opts{flex:0 0 auto;display:flex;flex-direction:column;gap:clamp(4px,0.5vw,7px)}
.opt{display:grid;grid-template-columns:minmax(0,0.85fr) minmax(0,1.15fr);gap:0 14px;padding:clamp(5px,0.6vw,9px) 12px;border:1px solid var(--line);border-radius:10px;background:var(--pal-panel);color:inherit;text-align:left;cursor:pointer;min-width:0;font:inherit}
.opt .lhs{display:flex;flex-direction:column;gap:3px;min-width:0}
.opt .rhs{display:flex;flex-direction:column;gap:3px;min-width:0;border-left:1px solid var(--pal-soft-2);padding-left:14px}
.opt:not([aria-disabled="true"]):hover{border-color:var(--accent)}
.opt[aria-disabled="true"]{cursor:default}
.opt .top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:16px}
.opt .letter{font-weight:700;color:var(--pal-accent-deep)}
.opt .who{font-size:14px;color:var(--muted);text-align:right}
.opt .body{font-size:clamp(16px,1.3vw,18px);line-height:1.3}
.opt .asm{margin:0;font-size:16px;line-height:1.3;color:var(--muted)}
.opt .verdict{font-size:16px;line-height:1.3;color:var(--fg)}
.opt .verdict.idle{color:var(--muted);font-style:italic}
.opt.on{box-shadow:inset 0 0 0 2px var(--pal-ink)}
.opt.chooser{background:var(--chip);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.opt.chooser .who{color:var(--pal-accent-deep);font-weight:600}
.opt.lesson{border:2px dashed var(--accent)}
.opt.lesson .who{color:var(--pal-accent-deep);font-weight:600}
.reveal{flex:1 1 auto;min-height:0;border:1px solid var(--line);border-radius:10px;padding:6px 14px;font-size:clamp(16px,1.35vw,18px);display:flex;flex-direction:column;justify-content:space-evenly;gap:5px}
.reveal.idle{background:var(--tint);color:var(--muted)}
.rv{margin:0;line-height:1.36}
.rv .k{font-weight:650;color:var(--pal-accent-deep)}
.rv .t{color:var(--muted);font-size:14px;white-space:nowrap}
.rv.hold{color:var(--muted)}
.decision .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px}
.decision .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--pal-on-accent);padding:6px 16px}

/* Short windows (1100x620 and similar): tighter spacing, body text stays 16px */
@media (max-height: 680px){
  header{padding-top:4px}
  #stage{padding:4px 24px}
  footer{padding:4px 24px}
  .widget{gap:5px}
  .side{gap:4px}
  .tries{gap:2px}
  .sym,.tries,.takeaway,.case,.ai{line-height:1.25}
  .takeaway{padding:6px 10px}
  .formula{font-size:17px}
  .formula .katex-display{margin:0}
  .side{gap:3px}
  .question,.recall{line-height:1.25}
  h2{font-size:20px}
  .question{font-size:16px}
  .fill{min-height:80px}
  .readout{padding:2px 8px}
  .readout .val{line-height:1.45}
  .fill.proofpic{min-height:130px}
  .model{padding:5px 10px}
  .test .tries{gap:1px}
  .btn{padding:4px 10px}
  .decision h2{font-size:20px}
  .decision .side{gap:6px}
  .decision .tries{gap:2px;line-height:1.3}
  .decision .takeaway{padding:6px 12px}
  .decision .hold{padding:6px 10px;line-height:1.3}
  .reveal{gap:3px;padding:4px 12px}
  .rv{line-height:1.26}
  .opts{gap:3px}
  .opt{padding:4px 12px}
  .opt .body,.opt .asm,.opt .verdict{line-height:1.22}
  .prob{padding:4px 12px;line-height:1.28}
}
</style>
</head>
<body>
<header id="head"></header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script src="../../components/proof-steps.js"></script>
<script>
// Numbers on these slides are checked against lectures/16-digital-filters-part-iii/checks.py.

// ---------- palette and redraw ----------
// COL holds the palette for the SVG being drawn; plotBox reads it at every paint, so a draw always uses the
// current theme. A theme switch redraws the current slide's plots and keeps every control's state.
let COL = {};
const PAL_NAMES = ['bg', 'ink', 'fg', 'text-2', 'muted', 'muted-2', 'grey', 'grey-blue', 'guide', 'grid', 'line', 'panel', 'soft', 'soft-2',
  'accent', 'accent-2', 'accent-3', 'accent-deep', 'accent-tint', 'accent-soft', 'on-accent',
  'amber', 'amber-bg', 'amber-ink', 'red'];
function readPalette() {
  const o = {};
  for (const n of PAL_NAMES) o[n.replace(/-(\w)/g, (_, c) => c.toUpperCase())] = FluidTheme.color(n);
  return o;
}
let PLOTS = [];
window.addEventListener('fluid-themechange', () => PLOTS.forEach(p => p.redraw()));

// ---------- DOM helpers ----------
const $ = s => document.querySelector(s);
const NSV = 'http://www.w3.org/2000/svg', NHT = 'http://www.w3.org/1999/xhtml';
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false }], throwOnError: false };
// Render $...$ in a node. If the CDN did not load, the text stays as typed.
function tex(node) { if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH); return node; }
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function hh(tag, cls, ...kids) { const e = h(tag, cls); for (const k of kids) if (k) e.append(k); return e; }
function mark(e, kind, id, title) { e.dataset.item = kind; if (id != null) e.dataset.id = id; if (title != null) e.dataset.title = title; return e; }
function emit(kind, data) {
  try { if (window.fluid && typeof window.fluid.emit === 'function') Promise.resolve(window.fluid.emit(kind, data)).catch(() => {}); }
  catch (e) { /* the view works without the bridge */ }
}
// Fixed decimals, with no minus sign on zero.
function fx(x, d) { const y = Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x; return y.toFixed(d); }
// A short number: up to d decimals, trailing zeros dropped.
function sn(x, d) { return String(+fx(x, d == null ? 3 : d)); }
// A number in TeX with a real minus sign.
function nt(x, d) { return sn(x, d); }
// Scientific notation as TeX: 1.30\times10^{-7}.
function sciTex(x, d) {
  if (!x) return '0';
  let e = Math.floor(Math.log10(Math.abs(x))), m = (x / Math.pow(10, e)).toFixed(d);
  if (Math.abs(+m) >= 10) { e += 1; m = (x / Math.pow(10, e)).toFixed(d); }
  return m + '\\times10^{' + e + '}';
}

// ---------- controls ----------
// A labelled range input. o: {id, min, max, step, value, fmt(v) -> TeX-ready text, onInput(v)}.
function ctl(label, o) {
  const wrap = h('label', 'slide-ctl');
  const lab = setTex(h('span'), label);
  const inp = h('input');
  inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step; inp.value = o.value;
  mark(inp, 'control', o.id, o.id);
  const val = h('span', 'val');
  const show = v => setTex(val, o.fmt(v));
  inp.addEventListener('input', () => { show(+inp.value); o.onInput(+inp.value); });
  show(o.value);
  wrap.append(lab, inp, val);
  return { el: wrap, input: inp, set(v) { inp.value = v; show(v); } };
}
// A row of buttons that pick one choice. choices: [[id, label], ...]; getCur() gives the current id.
function choiceRow(label, choices, getCur, onPick) {
  const row = hh('div', 'btnrow', label ? setTex(h('span', 'lab'), label) : null);
  const btns = choices.map(([id, text]) => {
    const b = mark(h('button', 'btn'), 'control', id);
    setTex(b, text);
    b.addEventListener('click', () => { onPick(id); paint(); });
    row.append(b);
    return [id, b];
  });
  function paint() { btns.forEach(([id, b]) => b.classList.toggle('on', id === getCur())); }
  paint();
  return { el: row, paint };
}
function button(id, label, onClick) {
  const b = mark(h('button', 'btn'), 'control', id);
  setTex(b, label);
  b.addEventListener('click', onClick);
  return b;
}
// A readout box: label and value are TeX-ready text.
function readout(id, label, wide) {
  const box = mark(h('div', 'readout' + (wide ? ' wide' : '')), 'readout', id);
  const k = setTex(h('div', 'k'), label);
  const v = h('div', 'val');
  box.append(k, v);
  return { el: box, set(text, bad) { setTex(v, text); box.classList.toggle('bad', !!bad); }, label(t) { setTex(k, t); } };
}
// Legend: items {color (CSS), text, kind: 'line' | 'dash' | 'chip'}.
function legend(items) {
  const d = h('div', 'legend');
  for (const it of items) {
    const s = h('span');
    let sw;
    if (it.kind === 'chip') { sw = h('span', 'chip'); sw.style.background = it.color; }
    else { sw = h('span', 'sw'); sw.style.borderTop = '3px ' + (it.kind === 'dash' ? 'dashed' : 'solid') + ' ' + it.color; }
    s.append(sw, setTex(h('span'), it.text));
    d.append(s);
  }
  return d;
}
function sym(text) { return setTex(h('p', 'sym'), text); }
function caseLine(text) { return setTex(h('p', 'case'), text); }
// The one earlier fact a slide builds on, with its pointer.
function recallLine(text) { const p = h('p', 'sym recall'); p.append(h('b', '', 'From before: ')); p.append(setTex(h('span'), text)); return p; }
function triesList(items) { return hh('ol', 'tries', ...items.map(t => (t instanceof Node ? hh('li', '', t) : setTex(h('li'), t)))); }
function aiBlock(ai) {
  const p = h('p', 'ai');
  p.innerHTML = ai.html;
  tex(p);
  p.append(' ', h('span', 'src', '(' + ai.src + ')'));
  return hh('div', 'aiblk', h('p', 'kicker', ai.kicker || 'In AI research'), p);
}
// The takeaway appears after the first try: on the first click, drag or slider move in the widget, or on "Show".
// An AI echo, when the slide has one, appears with it.
function takeBox(widget, text, ai, aiHost) {
  const holder = h('div', 'takeholder');
  const btn = mark(h('button', 'btn'), 'control', 'show-takeaway');
  setTex(btn, 'Show the takeaway');
  const tk = setTex(h('p', 'takeaway'), text);
  tk.hidden = true;
  const aiEl = ai ? aiBlock(ai) : null;
  if (aiEl) aiEl.hidden = true;
  const show = () => { tk.hidden = false; btn.hidden = true; if (aiEl) aiEl.hidden = false; };
  btn.addEventListener('click', show);
  for (const ev of ['input', 'click', 'pointerdown']) widget.addEventListener(ev, show);
  holder.append(btn, tk);
  if (aiEl) (aiHost || holder).append(aiEl);
  return holder;
}
// The side column of a content slide, after the frame's tag, title, question and formula.
// o: {case, recall, sym, tries, take, ai}. The everyday case goes right under the question.
function sideStd(widget, side, o) {
  if (o.case) side.querySelector('.question').after(caseLine(o.case));
  if (o.recall) side.append(recallLine(o.recall));
  if (o.sym) side.append(sym(o.sym));
  if (o.tries) side.append(triesList(o.tries));
  if (o.take) side.append(takeBox(widget, o.take, o.ai, o.aiHost));
}

// ---------- SVG helpers ----------
function svgNode(tag, attrs, parent) {
  const e = document.createElementNS(NSV, tag);
  for (const k in attrs) if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function svgRoot(w, ht) { return svgNode('svg', { viewBox: '0 0 ' + w + ' ' + ht, role: 'img', 'font-family': 'system-ui, sans-serif', 'font-size': 14 }); }
function svgText(parent, x, y, s, attrs) {
  const t = svgNode('text', Object.assign({ x: x, y: y, fill: COL.muted, 'font-size': 14 }, attrs || {}), parent);
  t.textContent = s;
  return t;
}
// A KaTeX label inside an SVG: a foreignObject holding a rendered formula. o: {w, ht, anchor, size, fill, bg, bold}.
function svgTex(parent, x, y, s, o) {
  o = o || {};
  const w = o.w || 220, ht = o.ht || 26, anchor = o.anchor || 'middle';
  const x0 = anchor === 'end' ? x - w : anchor === 'start' ? x : x - w / 2;
  const fo = svgNode('foreignObject', { x: x0, y: y - ht / 2, width: w, height: ht }, parent);
  const d = document.createElementNS(NHT, 'div');
  const jc = anchor === 'end' ? 'flex-end' : anchor === 'start' ? 'flex-start' : 'center';
  d.setAttribute('style', 'display:flex;align-items:center;height:100%;white-space:nowrap;font-size:' +
    (o.size || 15) + 'px;color:' + (o.fill || COL.text2) + ';justify-content:' + jc + (o.bold ? ';font-weight:600' : ''));
  const span = document.createElementNS(NHT, 'span');
  span.textContent = s;
  if (o.bg) span.setAttribute('style', 'background:' + o.bg + ';border-radius:5px;padding:1px 6px');
  d.appendChild(span);
  fo.appendChild(d);
  tex(span);
  return fo;
}
// The same label with a halo in the page color, so it reads over a curve or bars.
function haloTex(parent, x, y, s, o) {
  const fo = svgTex(parent, x, y, s, o);
  fo.firstChild.style.textShadow = '0 0 3px ' + COL.bg + ', 0 0 3px ' + COL.bg + ', 0 0 2px ' + COL.bg;
  return fo;
}

    const P = plotFrame(svg, W, H, { x0: 0, x1: 2 * T1, y0: -11, y1: 11.5, L: 40, R: 12, T: 28, B: 40 });
    for (const t of [-10, 0, 10]) svgText(svg, P.L - 6, P.Y(t) + 5, String(t).replace('-', '−'), { 'text-anchor': 'end', fill: COL.text2 });
    for (const s of [1, -1]) line(svg, P.L, P.Y(s * st.rms), W - P.R, P.Y(s * st.rms), { stroke: COL.muted, 'stroke-dasharray': '5 4' });
    const pts = [];
    for (let i = 0; i <= 900; i++) { const t = 2 * i / 900; pts.push([t * T1, toneAt(ph, t)]); }
    svgNode('path', { d: pathOf(P, pts), fill: 'none', stroke: COL.accent, 'stroke-width': 2 }, svg);
    let im = 0; pts.forEach((p, i) => { if (Math.abs(p[1]) > Math.abs(pts[im][1])) im = i; });
    haloTex(svg, P.X(pts[im][0]) + 8, P.Y(pts[im][1]) + (pts[im][1] > 0 ? 6 : -6), 'peak $' + sn(st.peak, 2) + '$', { w: 110, anchor: 'start', size: 14, fill: COL.accentDeep, bold: true });
    line(svg, P.X(T1), P.T, P.X(T1), P.base, { stroke: COL.line, 'stroke-dasharray': '3 3' });
    [0, T1, 2 * T1].forEach((t, i) => svgTex(svg, P.X(t), P.base + 14, sn(t, 1) + ' ms', { w: 70, size: 14, fill: COL.text2, anchor: ['start', 'middle', 'end'][i] }));
    svgTex(svg, P.L + P.pw / 2, H - 9, 'time: two periods of $4.5$ ms', { w: P.pw, size: 14, fill: COL.text2 });
    svgTex(svg, P.L, 12, 'the waveform $x(t)$; dashed: $\\pm$rms', { w: W - P.L, anchor: 'start', size: 15, fill: COL.accentDeep });
  }, null, 1.5);
  const barP = plotBox((svg, W, H) => {
    const L = 40, R = 12, T = 28, B = 22, cw = (W - L - R) / TONE_K;
    const Y = v => T + (0.62 - v) / 0.62 * (H - T - B);
    line(svg, L, Y(0), W - R, Y(0), { stroke: COL.grey });
    for (let k = 1; k <= TONE_K; k++) {
      rect(svg, L + (k - 1) * cw + cw * 0.2, Y(0.5), cw * 0.6, Y(0) - Y(0.5), { fill: COL.grey, 'data-item': 'mark', 'data-id': 'harm-' + k });
      svgText(svg, L + (k - 0.5) * cw, H - 5, String(TONE_F * k), { 'text-anchor': 'middle', fill: COL.text2 });
    }
    svgTex(svg, L, 12, 'power of each harmonic, in Hz: all $\\tfrac12$, in every mode', { w: W - L, anchor: 'start', size: 15, fill: COL.text2 });
  }, null, 0.7);
  function update() {
    const st = toneStats(mode);
    rP.set('$' + fx(st.peak, 3) + '$'); rR.set('$' + fx(st.rms, 3) + '$'); rC.set('$' + fx(st.crest, 2) + '$');
    pick.paint(); waveP.redraw();
  }
  widget.append(hh('div', 'sliders', pick.el, listen), waveP.wrap, barP.wrap, hh('div', 'readouts', rP.el, rR.el, rC.el));
  sideStd(widget, side, {
    case: 'A held violin note sounds much the same from any seat, though the hall shifts its overtones against each other.',
    recall: 'the click and the hiss share a spectrum and sound different (step 6).',
    sym: 'A $220$ Hz note: 10 harmonics of height $1$. $\\varphi_k$: the phase of harmonic $k$, where its wave starts.',
    tries: [
      'Aligned: a sharp spike each period, peak/rms $4.47$. Spread out: an even wave, $1.92$. The bars stay put.',
      'Listen to each: the same pitch, a close sound; Aligned may sound a bit buzzier. The ear “does to some extent detect a phase” (21:01).',
      'In step 6 the phases moved sound across a whole second; here they only reshape each $4.5$ ms period.'],
    take: 'For a steady sound the ear mostly ignores phase, so a voice line could drop it. When timing carries the message (a click, a radar echo, phase modulation) the phase is the message.' });
  update();
}

// ---------- slides ----------
const SLIDES = [
  { id: 'same-price', title: 'Add first, multiply once', tag: 'Lecture 07:55 to 11:07',
    question: 'How can a Fourier sum use fewer multiplications?',
    formula: '$$\\textstyle\\sum_{n=0}^{7}u_n\\cos\\frac{2\\pi kn}{8}$$', mount: slideSamePrice },
  { id: 'fft-again', kind: 'decision', title: 'Tukey asks again. What do you do?', tag: 'Lecture 11:07, answer 12:10',
    question: 'An idea failed on your old machine. Years later, on a new machine, someone suggests it again. What do you do?' },
  { id: 'fft-accuracy', title: 'Is the fast method less accurate?', tag: 'Lecture 14:16 to 15:49',
    question: 'Tricks that save work usually lose digits. Does the FFT?',
    formula: '$$\\text{error}=\\frac{\\text{rms}(\\text{computed}-\\text{exact})}{\\text{rms}(\\text{exact})}$$', mount: slideAccuracy },
  { id: 'seam-trend', title: 'The FFT repeats your record', tag: 'Lecture 15:49 to 16:53 · again 23:40 to 25:46',
    question: 'What does the FFT assume outside your record, and what does that do to a trend?',
    formula: '$$u_n=R\\,\\frac nN+0.1\\sin\\frac{2\\pi\\cdot6n}{N}$$', mount: slideSeam },
  { id: 'why-ramp-leaks', kind: 'proof', title: 'Why it’s true: a trend leaks like $1/k$', tag: 'Lecture 16:53 to 17:55 · book p. 120',
    question: 'Why does a straight-line record leak into every bin, and by how much?', mount: slideWhyRamp },
  { id: 'click-and-hiss', title: 'Same spectrum, different sound', tag: 'Lecture 17:55 to 18:57',
    question: 'The power spectrum keeps how much of each frequency there is. What does the phase it drops hold?',
    formula: '$$|U_k|=\\tfrac{1}{64}\\ \\text{ for every }k$$', mount: slideClick },
  { id: 'why-half', kind: 'proof', title: 'Why it’s true: the spectrum keeps about half the numbers', tag: 'Lecture 18:57 to 19:29',
    question: 'For $N$ real samples, how many numbers does the power spectrum keep, and how many does it lose?', mount: slideWhyHalf },
  { id: 'steady-tone', title: 'Does the ear hear phase?', tag: 'Lecture 19:29 to 22:04',
    question: 'The telephone company threw phase away. When can you do that, and when not?',
    formula: '$$x(t)=\\textstyle\\sum_{k=1}^{10}\\cos\\big(2\\pi\\cdot220k\\,t+\\varphi_k\\big)$$', mount: slideTone },
];

// ---------- frame ----------
let cur = 0, shownId = null, endSent = false;
function goTo(i, same) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  if (shownId !== null && shownId !== s.id) emit('view.step', { step: s.id });
  shownId = s.id;
  const stage = $('#stage');
  stage.innerHTML = '';
  PLOTS = [];
  const widget = h('div', 'widget');
  const dec = s.kind === 'decision';
  const side = hh('div', 'side',
    h('div', 'tag', s.tag),
    setTex(h('h2'), s.title),
    setTex(h('p', dec ? 'q' : 'question'), s.question),
    s.formula ? setTex(h('div', 'formula'), s.formula) : null);
  const cls = 'slide' + (s.kind === 'proof' ? ' proof-slide' : dec ? ' decision' : '');
  const sec = mark(h('section', cls), 'step', s.id, s.title.replace(/\$/g, ''));
  sec.append(widget, side);
  stage.append(sec);
  if (dec) mountDecision(s, widget, side); else s.mount(widget, side);
  if (cur === SLIDES.length - 1 && !endSent) { endSent = true; emit('view.action', { action: 'deck-end' }); }
  tex(sec);
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, k) => d.classList.toggle('on', k === cur));
}
// A cue is a state. {step} goes to the step and does nothing if it is shown. {step, reveal: true}
// also reveals that decision, once; a revealed decision stays revealed.
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i < 0) return;
  const changed = msg.reveal === true && SLIDES[i].kind === 'decision' && revealDecision(SLIDES[i].id, 'cue');
  if (i !== cur || changed) goTo(i);
}
(function init() {
  setTex($('#head'), 'Lecture 16 · The FFT: fast, accurate, periodic, and blind to phase. Here $N$ counts samples.');
  const dots = $('#dots');
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = s.title.replace(/\$/g, '');
    b.addEventListener('click', () => goTo(i));
    dots.appendChild(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],input[type=number],textarea,select')) return;
    if (e.target && e.target.classList && e.target.classList.contains('opt') && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault(); e.target.click(); return;
    }
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
})();
</script>

  practiceParts(widget, side, {
    seen: [String.raw`A random point in the cube lands in the ball with chance $V_n/2^{n}$, and in $n$ dimensions most of the ball’s volume lies in its outer layer (the thin-shell step). Betancourt says the same for typical targets: volume is “largest out in the tails, away from the mode”.`, { cite: 'Betancourt (2017), arXiv:1701.02434, section 1.3.' }],
    helps: [String.raw`A Gaussian vector points in a uniformly random direction. Divide it by its length, and it is a uniform point on the sphere; every try is kept.`, { cite: 'Standard fact, not from a paper.' }],
    bites: [String.raw`Rejection keeps $V_n/2^{n}$ of the tries: about $1$ in $400$ at $n = 10$, and about $4\times10^{7}$ tries per point at $n = 20$.`, { cite: 'Volume of the unit ball: standard formula.' }],
    fails: [String.raw`Natural images occupy a thin, low-dimensional set inside pixel space: image datasets have very low intrinsic dimension relative to their pixels. Points sampled from the ball are not images.`, { cite: 'Pope et al. (2021), arXiv:2104.08894.' }],
    tries: [String.raw`Set $n = 20$. The count grows by about $10^{5}$ from $n = 10$.`],
    take: 'In high dimensions, filling the space wastes nearly every try. Sample the shell, or the data’s own shape.',
  });
  update();
}

// 3. Latent interpolation: straight line drops toward the middle; slerp stays on the shell.
function slideSlerpP(widget, side) {
  const n = 100, rnd = mulberry32(4242), sq = Math.sqrt(n);
  const a = gaussVec(rnd, n, new Float64Array(n)), b = gaussVec(rnd, n, new Float64Array(n));
  const ua = a.map(x => x / Math.sqrt(a.reduce((s, y) => s + y * y, 0)));
  const ub = b.map(x => x / Math.sqrt(b.reduce((s, y) => s + y * y, 0)));
  const om = Math.acos(Math.max(-1, Math.min(1, ua.reduce((s, x, i) => s + x * ub[i], 0))));
  let t = 0.5, plot = null;
  const linAt = tt => a.map((x, i) => (1 - tt) * x + tt * b[i]);
  const slerpAt = tt => { const s = Math.sin(om); return ua.map((x, i) => (Math.sin((1 - tt) * om) * x + Math.sin(tt * om) * ub[i]) / s * sq); };
  const normR = v => Math.sqrt(v.reduce((s, x) => s + x * x, 0)) / sq;
  const sl = slider(String.raw`$t$, position from $a$ to $b$`, { id: 't', name: 'position t', min: 0, max: 1, step: 0.01, value: t, fmt: v => v.toFixed(2), onInput: v => { t = v; update(); } });
  const rLin = readout('lin', String.raw`straight line: norm $/\sqrt{n}$`);
  const rSl = readout('slerp', String.raw`slerp: norm $/\sqrt{n}$`);
  widget.append(hh('div', 'sliders', sl.el), legend([{ color: 'var(--pal-grey)', text: 'grey: straight line' }, { color: 'var(--pal-accent)', text: 'blue: slerp' }, { color: 'var(--pal-ink)', text: String.raw`dashed: $\sqrt{n}$`, dash: true }]));
  plot = fillPlot(widget, drawS);
  widget.append(hh('div', 'readouts', rLin.el, rSl.el));
  function drawS(svg, W, H) {
    const L = 46, R = 14, T = 14, B = 44, base = H - B, pw = W - L - R;
    const X = tt => L + tt * pw, Y = v => base - v / 1.2 * (base - T);
    svgNode('line', { x1: L, y1: base, x2: W - R, y2: base, stroke: COL.grey }, svg);
    svgNode('line', { x1: L, y1: T, x2: L, y2: base, stroke: COL.grey }, svg);
    for (const v of [0, 0.5, 1]) svgText(svg, L - 8, Y(v) + 5, String(v), { 'text-anchor': 'end' });
    for (const tt of [0, 0.5, 1]) svgText(svg, X(tt), base + 18, String(tt), { 'text-anchor': 'middle', 'font-size': 15 });
    let dl = '', ds = '';
    for (let i = 0; i <= 100; i++) {
      const tt = i / 100;
      dl += (i ? 'L' : 'M') + X(tt).toFixed(1) + ' ' + Y(normR(linAt(tt))).toFixed(1);
      ds += (i ? 'L' : 'M') + X(tt).toFixed(1) + ' ' + Y(normR(slerpAt(tt))).toFixed(1);
    }
    svgNode('path', { d: dl, fill: 'none', stroke: COL.grey, 'stroke-width': 2.5, 'data-item': 'mark', 'data-id': 'straight' }, svg);
    svgNode('path', { d: ds, fill: 'none', stroke: COL.accent, 'stroke-width': 2.5, 'data-item': 'mark', 'data-id': 'slerp' }, svg);
    svgNode('line', { x1: L, y1: Y(1), x2: W - R, y2: Y(1), stroke: COL.ink, 'stroke-dasharray': '4 3' }, svg);
    svgNode('line', { x1: X(t), y1: T, x2: X(t), y2: base, stroke: COL.muted, 'stroke-dasharray': '2 3' }, svg);
    svgTex(svg, (L + W - R) / 2, H - 12, String.raw`$t$, position between $a$ and $b$`, { w: 300, size: 15 });
    haloTex(svg, L + 8, Y(1) - 12, String.raw`$\sqrt{n}$`, { w: 60, anchor: 'start', size: 15, fill: COL.ink });
  }
  function update() {
    rLin.set(normR(linAt(t)).toFixed(3));
    rSl.set(normR(slerpAt(t)).toFixed(3));
    plot.redraw();
  }
  practiceParts(widget, side, {
    seen: [String.raw`The midpoint of two prior samples is $(a+b)/2$. Its squared norm is about $n/2$, because the cross term averages to $0$, so its norm is $\sqrt{n/2}=0.71\sqrt{n}$: inside the shell, where the prior has little mass.`, { cite: 'White (2016), arXiv:1609.04468.' }],
    helps: [String.raw`Slerp follows the arc between the two directions and rescales to $\sqrt{n}$. Every point then has the norm of a prior sample, and White reports sharper samples.`, { cite: 'White (2016), arXiv:1609.04468.' }],
    bites: [String.raw`A straight line through a Gaussian latent dips toward the middle. At $n = 100$ the midpoint’s norm is about $7$, against $\sqrt{100}=10$ (our simulation).`, { cite: 'Our simulation at n = 100.' }],
    fails: [String.raw`Slerp keeps the arc on the prior’s shell only if the prior is an isotropic Gaussian. A learned latent may have another shape, and then the arc can leave its mass.`, { cite: 'Reasoning from the assumption.' }],
    tries: [String.raw`Set $t = 0.5$. The straight line dips; slerp stays on the dashed line.`],
    take: 'Interpolate along the shell, not across the empty middle.',
  });
  update();
}

// 4. Unrelated vectors: a shared offset pushes cosines up; the random floor is 1/sqrt(d).
function slidePerpP(widget, side) {
  const d = 100;
  let c = 0, plot = null, data = [];
  const sl = slider(String.raw`$c$, shared offset per coordinate`, { id: 'c', name: 'shared offset', min: 0, max: 2, step: 0.1, value: c, fmt: v => v.toFixed(1), onInput: v => { c = v; update(); } });
  const rMean = readout('mean', 'measured mean cosine');
  const rForm = readout('formula', String.raw`$c^{2}/(1+c^{2})$`);
  const rFloor = readout('floor', String.raw`random floor $1/\sqrt{d}$`);
  widget.append(hh('div', 'sliders', sl.el), legend([{ chip: true, color: 'var(--pal-accent)', text: 'dots: cosine of one random pair' }, { chip: true, color: 'var(--pal-ink)', text: 'solid bar: measured mean' }]));
  plot = fillPlot(widget, drawP);
  widget.append(hh('div', 'readouts', rMean.el, rForm.el, rFloor.el));
  function update() {
    const rnd = mulberry32(5150 + Math.round(c * 10)), cs = [];
    for (let p = 0; p < 200; p++) {
      const u = gaussVec(rnd, d, new Float64Array(d)), v = gaussVec(rnd, d, new Float64Array(d));
      let du = 0, dv = 0, dd = 0;
      for (let i = 0; i < d; i++) { const x = u[i] + c, y = v[i] + c; du += x * x; dv += y * y; dd += x * y; }
      cs.push(dd / Math.sqrt(du * dv));
    }
    data = cs;
    rMean.set(mean(cs).toFixed(3));
    rForm.set((c * c / (1 + c * c)).toFixed(3));
    rFloor.set((1 / Math.sqrt(d)).toFixed(3));
    plot.redraw();
  }
  function drawP(svg, W, H) {
    const L = 30, R = 30, T = 14, B = 44, base = H - B, pw = W - L - R;
    const X = x => L + (x + 1) / 2 * pw;
    svgNode('line', { x1: L, y1: (T + base) / 2, x2: W - R, y2: (T + base) / 2, stroke: COL.grey }, svg);
    data.forEach((x, i) => {
      svgNode('circle', { cx: X(x).toFixed(1), cy: ((T + base) / 2 + ((i * 29) % 11 - 5) * 6).toFixed(1), r: 4, fill: COL.accent, opacity: 0.7, 'data-item': 'mark', 'data-id': 'pair-' + i }, svg);
    });
    const m = mean(data);
    svgNode('line', { x1: X(m).toFixed(1), y1: T, x2: X(m).toFixed(1), y2: base, stroke: COL.ink, 'stroke-width': 2, 'data-item': 'mark', 'data-id': 'mean' }, svg);
    for (const v of [-1, 0, 1]) svgText(svg, X(v), base + 18, String(v), { 'text-anchor': 'middle', 'font-size': 15 });
    svgTex(svg, (L + W - R) / 2, H - 12, String.raw`cosine between two random vectors`, { w: 320, size: 15 });
  }
  practiceParts(widget, side, {
    seen: [String.raw`Two random unit vectors have a cosine with spread $1/\sqrt{d}$ (the near-perpendicular step). Elhage et al.: models store more sparse features than dimensions, each in a nearly orthogonal direction, so the leak from another active feature is about $1/\sqrt{d}=0.036$ at $d=768$.`, { cite: 'Elhage et al. (2022), arXiv:2209.10652 (abstract); the 1/√d leak is our calculation.' }],
    helps: [String.raw`If few features are active at once, the leaks are rare. Many features then fit in one space, each with a small error.`, { cite: 'Elhage et al. (2022), arXiv:2209.10652.' }],
    bites: [String.raw`If the vectors share an offset $c$ in every coordinate, both point partly along it, so their cosine is $c^{2}/(1+c^{2})$: $0.50$ at $c = 1$ (our simulation). The $1/\sqrt{d}$ floor is gone.`, { cite: 'Ethayarajh (2019), arXiv:1909.00512: representations are “not isotropic in any layer”.' }],
    fails: [String.raw`The $1/\sqrt{d}$ floor needs vectors spread evenly over all directions. Measure the mean cosine of a model’s embeddings: a high mean means the floor is wrong.`, { cite: 'Ethayarajh (2019), arXiv:1909.00512.' }],
    tries: [String.raw`Set $c = 0$, then $c = 1$. The random parts do not change; the cosines move up to about $0.5$.`],
    take: 'Nearly perpendicular needs isotropic vectors. Check the mean cosine first.',
  });
  update();
}

// 5. Intrinsic dimension: the gap depends on the dimension the points really use.
function slideIntrinsicP(widget, side) {
  const KS = [2, 5, 10, 50, 200, 1000];
  let ki = 1, plot = null;
  function gapK(k) {
    const rnd = mulberry32(77 + k), q = gaussVec(rnd, k, new Float64Array(k)), x = new Float64Array(k);
    let mn = Infinity, mx = 0;
    for (let m = 0; m < 100; m++) {
      gaussVec(rnd, k, x);
      let s = 0;
      for (let i = 0; i < k; i++) { const t = x[i] - q[i]; s += t * t; }
      const dd = Math.sqrt(s);
      if (dd < mn) mn = dd;
      if (dd > mx) mx = dd;
    }
    return (mx - mn) / mn;
  }
  const gaps = KS.map(gapK);
  const sl = slider(String.raw`$k$, intrinsic dimension`, { id: 'k', name: 'intrinsic dimension', min: 0, max: KS.length - 1, step: 1, value: ki, fmt: v => String(KS[v]), onInput: v => { ki = v; update(); } });
  const rGap = readout('gap', String.raw`gap ratio at this $k$`);
  const rNum = readout('numbers', 'numbers per point, fixed');
  widget.append(hh('div', 'sliders', sl.el), legend([{ chip: true, color: 'var(--pal-grey)', text: 'bars: gap ratio for each k, 100 points' }, { chip: true, color: 'var(--pal-accent)', text: 'blue: your k' }]));
  plot = fillPlot(widget, drawI);
  widget.append(hh('div', 'readouts', rGap.el, rNum.el));
  rNum.set('1000');
  function update() { rGap.set(gaps[ki].toFixed(3)); plot.redraw(); }
  function drawI(svg, W, H) {
    const L = 46, R = 14, T = 14, B = 44, base = H - B, pw = W - L - R, bw = pw / KS.length;
    const ymax = Math.max(...gaps) * 1.1;
    const Y = v => base - v / ymax * (base - T);
    svgNode('line', { x1: L, y1: base, x2: W - R, y2: base, stroke: COL.grey }, svg);
    svgNode('line', { x1: L, y1: T, x2: L, y2: base, stroke: COL.grey }, svg);
    KS.forEach((k, j) => {
      svgNode('rect', { x: (L + j * bw + bw * 0.15).toFixed(1), y: Y(gaps[j]).toFixed(1), width: (bw * 0.7).toFixed(1),
        height: (base - Y(gaps[j])).toFixed(1), fill: j === ki ? COL.accent : COL.grey, 'data-item': 'mark', 'data-id': 'k-' + k }, svg);
      svgText(svg, L + j * bw + bw / 2, base + 18, String(k), { 'text-anchor': 'middle', 'font-size': 15 });
    });
    svgTex(svg, (L + W - R) / 2, H - 12, String.raw`$k$, intrinsic dimension`, { w: 260, size: 15 });
  }
  practiceParts(widget, side, {
    seen: [String.raw`Each distance is a sum of $n$ squared pieces, so its relative spread shrinks like $1/\sqrt{n}$, and all distances look alike (the distances step). Beyer et al. show the nearest-to-farthest gap shrinks as dimension grows.`, { cite: 'Beyer et al. (1999), “When Is ‘Nearest Neighbor’ Meaningful?”, ICDT.' }],
    helps: [String.raw`Real data sit on a low-dimensional set, so the gap follows the few real directions: about $15$ at $k = 2$, against $0.1$ at $k = 1000$ (our simulation).`, { cite: 'Pope et al. (2021), arXiv:2104.08894.' }],
    bites: [String.raw`Hubs are points that land in many others’ nearest-neighbor lists. In our simulation of 300 Gaussian points, the most popular is in the 5-nearest lists of 64 others at $d = 100$, against 11 at $d = 3$.`, { cite: 'Radovanović et al. (2010), JMLR 11; the counts are our simulation.' }],
    fails: [String.raw`The shrinking gap assumes independent coordinates. Correlated coordinates behave like their intrinsic dimension, so count that, not the numbers per point.`, { cite: 'Reasoning from the assumption.' }],
    tries: [String.raw`Set $k = 2$, then $k = 1000$. Read the gap bars.`],
    take: 'Predict the gap from the intrinsic dimension, not from the number of numbers per point.',
  });
  update();
}

// 6. Small aligned changes add up: worst case grows like n, random signs like sqrt(n).
function slideLinfP(widget, side) {
  const NL = [10, 30, 100, 300, 1000];
  const Wt = gaussVec(mulberry32(606), 1000, new Float64Array(1000));
  let ni = 2, eps = 0.01, plot = null;
  const sN = slider(String.raw`$n$, inputs`, { id: 'n', name: 'inputs', min: 0, max: NL.length - 1, step: 1, value: ni, fmt: v => String(NL[v]), onInput: v => { ni = v; update(); } });
  const sE = slider(String.raw`$\varepsilon$, change per input`, { id: 'eps', name: 'change per input', min: 0.001, max: 0.1, step: 0.001, value: eps, fmt: v => v.toFixed(3), onInput: v => { eps = v; update(); } });
  const rA = readout('aligned', String.raw`aligned: $\varepsilon\sum_i |w_i|$`);
  const rR = readout('random', String.raw`random signs: $\varepsilon\,\|w\|_2$`);
  widget.append(hh('div', 'sliders tight', sN.el, sE.el), legend([{ chip: true, color: 'var(--pal-accent)', text: 'blue: every input moved against the score' }, { chip: true, color: 'var(--pal-grey)', text: 'grey: every input moved at random' }]));
  plot = fillPlot(widget, drawL);
  widget.append(hh('div', 'readouts', rA.el, rR.el));
  function vals() {
    const n = NL[ni];
    let s1 = 0, s2 = 0;
    for (let i = 0; i < n; i++) { s1 += Math.abs(Wt[i]); s2 += Wt[i] * Wt[i]; }
    return { aligned: eps * s1, random: eps * Math.sqrt(s2) };
  }
  function update() {
    const v = vals();
    rA.set(v.aligned.toFixed(3));
    rR.set(v.random.toFixed(3));
    plot.redraw();
  }
  function drawL(svg, W, H) {
    const L = 46, R = 14, T = 14, B = 52, base = H - B, pw = W - L - R;
    const v = vals(), ymax = Math.max(v.aligned, 1e-9) * 1.15;
    const Y = x => base - x / ymax * (base - T);
    svgNode('line', { x1: L, y1: base, x2: W - R, y2: base, stroke: COL.grey }, svg);
    svgNode('line', { x1: L, y1: T, x2: L, y2: base, stroke: COL.grey }, svg);
    const bars = [[v.aligned, COL.accent, 'aligned'], [v.random, COL.grey, 'random']];
    bars.forEach(([val, col, lab], j) => {
      const x = L + (j + 0.5) * pw / 2 - pw / 8;
      svgNode('rect', { x: x.toFixed(1), y: Y(val).toFixed(1), width: (pw / 4).toFixed(1), height: (base - Y(val)).toFixed(1), fill: col, 'data-item': 'mark', 'data-id': lab }, svg);
      svgTex(svg, x + pw / 8, base + 20, lab === 'aligned' ? String.raw`aligned $\varepsilon\sum|w_i|$` : String.raw`random $\varepsilon\|w\|_2$`, { w: 220, size: 14 });
    });
    svgTex(svg, (L + W - R) / 2, H - 12, String.raw`change in the score $w\cdot x$`, { w: 260, size: 15 });
  }
  practiceParts(widget, side, {
    seen: [String.raw`Each input moved by $\varepsilon$ in the direction that pushes the score up changes the linear score $w\cdot x$ by $\varepsilon\sum_i|w_i|$: every change adds to the score. Goodfellow et al. argue this linearity is the cause.`, { cite: 'Goodfellow, Shlens and Szegedy (2014), arXiv:1412.6572.' }],
    helps: [String.raw`Train on the attacked inputs as well as the clean ones. Goodfellow et al. report lower test error on MNIST for a maxout network trained this way.`, { cite: 'Goodfellow et al. (2014), arXiv:1412.6572.' }],
    bites: [String.raw`That sum grows like $n$: about $0.8\,\varepsilon n$ for Gaussian weights. At $n = 1000$, $\varepsilon = 0.01$, it is about $8$; random signs give about $0.2$.`, { cite: 'Our simulation; E|w| = √(2/π) for Gaussian weights.' }],
    fails: [String.raw`The sum is a worst case, with every change aligned to its weight. Real networks are only roughly linear, so $8$ is an upper estimate.`, { cite: 'Reasoning from the assumption.' }],
    tries: [String.raw`Set $n = 1000$, $\varepsilon = 0.01$. Compare the two bars.`],
    take: 'Many small aligned changes add up. Random ones mostly cancel.',
  });
  update();
}

// 7. Text: the most likely word is not the typical one (toy next-word distribution).
function slideDecodeP(widget, side) {
  const raw = [0.30, 0.20, 0.15, 0.10, 0.08, 0.06, 0.06, 0.05];
  const tot = raw.reduce((a, b) => a + b, 0);
  const p = raw.map(x => x / tot);
  const H = p.reduce((s, x) => s - x * log2(x), 0);
  let delta = 0.5, plot = null;
  const sD = slider(String.raw`$\delta$, allowed gap in bits`, { id: 'delta', name: 'allowed gap', min: 0, max: 2.5, step: 0.05, value: delta, fmt: v => v.toFixed(2), onInput: v => { delta = v; update(); } });
  const rH = readout('H', String.raw`entropy $H$, bits per word`);
  const rKept = readout('kept', 'words kept');
  const rMass = readout('mass', 'probability kept');
  widget.append(hh('div', 'sliders', sD.el), legend([{ chip: true, color: 'var(--pal-accent)', text: 'blue: kept, surprise within δ of H' }, { chip: true, color: 'var(--pal-grey)', text: 'grey: dropped' }]));
  plot = fillPlot(widget, drawD);
  widget.append(hh('div', 'readouts', rH.el, rKept.el, rMass.el));
  rH.set(H.toFixed(3));
  function kept() { return p.map(x => Math.abs(-log2(x) - H) <= delta + 1e-9); }
  function update() {
    const kp = kept();
    rKept.set(String(kp.filter(Boolean).length) + ' of ' + p.length);
    rMass.set(p.reduce((s, x, i) => s + (kp[i] ? x : 0), 0).toFixed(3));
    plot.redraw();
  }
  function drawD(svg, W, H2) {
    const L = 46, R = 14, T = 14, B = 52, base = H2 - B, pw = W - L - R, bw = pw / p.length;
    const Y = v => base - v / 0.36 * (base - T);
    const kp = kept();
    svgNode('line', { x1: L, y1: base, x2: W - R, y2: base, stroke: COL.grey }, svg);
    svgNode('line', { x1: L, y1: T, x2: L, y2: base, stroke: COL.grey }, svg);
    for (const v of [0, 0.1, 0.2, 0.3]) svgText(svg, L - 8, Y(v) + 5, v.toFixed(1), { 'text-anchor': 'end' });
    p.forEach((x, j) => {
      svgNode('rect', { x: (L + j * bw + bw * 0.15).toFixed(1), y: Y(x).toFixed(1), width: (bw * 0.7).toFixed(1),
        height: (base - Y(x)).toFixed(1), fill: kp[j] ? COL.accent : COL.grey, 'data-item': 'mark', 'data-id': 'word-' + (j + 1) }, svg);
      svgText(svg, L + j * bw + bw / 2, base + 18, String(j + 1), { 'text-anchor': 'middle', 'font-size': 15 });
    });
    svgTex(svg, (L + W - R) / 2, H2 - 12, String.raw`word rank (1 is the most likely), bar: probability`, { w: 380, size: 14 });
    haloTex(svg, L + 8, T + 10, String.raw`word 1 is the most likely: surprise $-\log_2 p_1 = 1.7$ bits`, { w: 380, anchor: 'start', size: 14, fill: COL.ink });
  }
  practiceParts(widget, side, {
    seen: [String.raw`A typical text has about the same surprise per word, $H$. Meister et al. keep words whose surprise $-\log_2 p$ is near $H$. Holtzman et al. found that always taking likely words gives text that is “bland and strangely repetitive”.`, { cite: 'Meister et al. (2022), arXiv:2202.00666; Holtzman et al. (2019), arXiv:1904.09751.' }],
    helps: [String.raw`Keep words with $|{-\log_2 p}-H|\le\delta$. Meister et al. report quality matching top-k and nucleus sampling, with less repetition.`, { cite: 'Meister et al. (2022), arXiv:2202.00666.' }],
    bites: [String.raw`In this toy distribution the most likely word has surprise $1.7$ bits, against an average $H = 2.7$ bits. Always taking it picks a word far from the average.`, { cite: 'Toy numbers, our calculation.' }],
    fails: [String.raw`This toy distribution is not a model. Real text has context, so typicality is per step, given the words so far.`, { cite: 'Reasoning from the assumption.' }],
    tries: [String.raw`Set $\delta = 0.5$: the most likely word is dropped. Set $\delta = 2.5$: every word is kept.`],
    take: 'Typical text comes from words whose surprise matches the average.',
  });
  update();
}

  { id: 'shell-practice', title: 'In practice: filling a ball by rejection', tag: 'In practice · Betancourt, 2017',
    question: String.raw`How many random tries does a uniform sample from a ball cost as $n$ grows?`, mount: slideBallP },
  { id: 'perpendicular', title: 'Random directions are nearly perpendicular', tag: 'Lecture 9, 24:28 to 27:06',
    question: String.raw`How close to perpendicular are two random directions in $n$ dimensions?`,

let cur = 0, shownId = null, endSent = false;
function goTo(i) {
  epoch++;
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  if (shownId !== null && shownId !== s.id) emit('view.step', { step: s.id });
  shownId = s.id;
  const stage = $('#stage');
  stage.innerHTML = '';
  PLOTS = [];
  const widget = h('div', 'widget');
  const side = hh('div', 'side',
    h('div', 'tag', s.tag),
    setTex(h('h2'), s.title),
    setTex(h('p', 'question'), s.question),
    s.formula ? setTex(h('div', 'formula'), s.formula) : null);
  const sec = mark(h('section', 'slide'), 'step', s.id, s.title.replace(/\$/g, ''));
  sec.append(widget, side);
  stage.append(sec);
  stage.scrollTop = 0;
  s.mount(widget, side);
  if (cur === SLIDES.length - 1) {
    side.append(
      setTex(h('p', 'closing'), String.raw`In high dimensions, random things are predictable: every length is near its typical value.`),
      setTex(h('p', 'next'), 'Next: where high dimensions show up in your work, and how to use them.'));
    if (!endSent) { endSent = true; emit('view.action', { action: 'deck-end' }); }
  }
  tex(sec);
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, i) => d.classList.toggle('on', i === cur));
}
// A cue is a state: go to the named step, and do nothing if it is already shown.
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i >= 0 && i !== cur) goTo(i);
}
(function init() {
  const dots = $('#dots');
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = s.title.replace(/\$/g, '');
    b.addEventListener('click', () => goTo(i));
    dots.appendChild(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],textarea,select')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
})();
</script>

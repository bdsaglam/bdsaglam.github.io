<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primer · Feedback: loops that settle, add up, or explode</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../../components/theme.js"></script>
<style>
/* Colors come from the theme palette (../../components/theme.js): one accent (blue), amber only for proof lights, red only for a failed check. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft);
  --red:var(--pal-red); --redbg:var(--pal-red-bg);
  --u:clamp(16px,1.35vw,20px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 24px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(6px,1vh,12px) 24px}
footer{display:flex;align-items:center;gap:10px;padding:8px 24px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Slide frame: widget on the left (3/5), text on the right (2/5). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(18px,2.4vw,40px)}
.widget{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(6px,1vh,10px);overflow:hidden}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(6px,1.1vh,12px);overflow:hidden}
.tag{font:13px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(20px,1.9vw,28px);line-height:1.2;margin:0;font-weight:650}
.question{margin:0;font-size:clamp(16px,1.3vw,18px);font-weight:600}
.case{margin:0;font-size:16px}
.formula{font-size:clamp(18px,1.8vw,26px)}
.formula .katex-display{margin:.2em 0}
.sym{margin:0;font-size:16px;color:var(--muted)}
.tries{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.tries li::marker{color:var(--accent);font-weight:600}
.takeaway{margin:0;padding:10px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}
.next{margin:0;font-size:16px;color:var(--muted)}

/* Controls, readouts, legend */
.sliders{display:flex;gap:8px 24px;flex-wrap:wrap;width:100%;align-items:center}
.btnrow{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center}
.btnrow .lab{font-size:16px;color:var(--muted);margin-right:2px}
.slide-ctl{display:flex;align-items:center;gap:8px;font-size:16px;flex-wrap:wrap}
.slide-ctl input{width:clamp(120px,12vw,190px);vertical-align:middle;accent-color:var(--accent)}
.slide-ctl .val{min-width:44px}
.btn{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--pal-panel);color:var(--fg);border-radius:8px;cursor:pointer;font-size:16px}
.btn.on{background:var(--chip);border-color:var(--accent);color:var(--pal-accent-deep)}
.btn:disabled{opacity:.4;cursor:default}
.readouts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.readout{flex:1 1 150px;min-width:0;padding:4px 10px;border-radius:10px;background:var(--pal-soft);font-size:16px;overflow-wrap:anywhere;overflow:hidden}
.readout .k{color:var(--pal-text-2);font-size:15px}
.readout .val{font-size:17px;font-weight:600;line-height:1.55}
.readout.bad{background:var(--redbg);color:var(--red)}
.readout.bad .k{color:var(--red)}
.legend{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:16px;color:var(--pal-text-2);align-items:center}
.sw{display:inline-block;width:22px;height:0;vertical-align:middle;margin-right:6px}
.chip{display:inline-block;width:16px;height:12px;vertical-align:middle;margin-right:6px;border-radius:2px}
.ring{display:inline-block;width:13px;height:13px;vertical-align:middle;margin-right:6px;border-radius:50%;border:2px solid var(--pal-ink)}

/* Plots fill the height left in the widget column */
.fill{flex:1 1 0;min-height:90px;position:relative;width:100%}
.fill>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.name i{font-style:italic}
.takeholder{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.takeholder .takeaway{align-self:stretch}

/* Proof slides: test and picture on the left, the proof (fl-proof-steps) on the right */
.slide.proof-slide{grid-template-columns:minmax(0,11fr) minmax(0,9fr)}
.slide.proof-slide .side{justify-content:flex-start}
.fill.proofpic{min-height:150px}
.slide.proof-slide .slide-ctl input{width:clamp(90px,9vw,140px)}
.slide.proof-slide .sliders{gap:6px 16px}
.slide.proof-slide .btn{padding:4px 10px}
.part{margin:0;font-weight:600;color:var(--muted)}
.test{display:flex;flex-direction:column;gap:3px}
.test .tries{gap:3px}
.model{margin:0;padding:8px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}

/* Short windows (1100x620 and similar): tighter spacing, body text stays 16px */
@media (max-height: 680px){
  header{padding-top:4px}
  #stage{padding:4px 24px}
  footer{padding:4px 24px}
  .widget{gap:5px}
  .side{gap:4px}
  .tries{gap:2px}
  .sym,.tries,.takeaway,.case{line-height:1.25}
  .takeaway{padding:6px 10px}
  .formula{font-size:20px}
  h2{font-size:20px}
  .question{font-size:16px}
  .fill{min-height:80px}
  .readout{padding:2px 8px}
  .readout .val{line-height:1.5}
  .fill.proofpic{min-height:130px}
  .model{padding:5px 10px}
  .test .tries{gap:1px}
  .btn{padding:4px 10px}
}
</style>
</head>
<body>
<header>Primer · Feedback: loops that settle, add up, or explode</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script src="../../components/proof-steps.js"></script>
<script>
// ---------- palette and redraw ----------
// COL holds the palette for the SVG being drawn; plotBox reads it at every paint, so a draw always uses the
// current theme. A theme switch redraws the current slide's plots and keeps every control's state.
let COL = {};
const PAL_NAMES = ['bg', 'ink', 'fg', 'text-2', 'muted', 'muted-2', 'grey', 'guide', 'grid', 'line', 'panel', 'soft', 'soft-2',
  'accent', 'accent-2', 'accent-3', 'accent-deep', 'accent-tint', 'accent-soft', 'on-accent',
  'amber', 'amber-bg', 'amber-ink', 'red'];
function readPalette() {
  const o = {};
  for (const n of PAL_NAMES) o[n.replace(/-(\w)/g, (_, c) => c.toUpperCase())] = FluidTheme.color(n);
  return o;
}
let PLOTS = [];
window.addEventListener('fluid-themechange', () => PLOTS.forEach(p => p.redraw()));
// A palette color with alpha, e.g. rgbaOf(COL.accent, 0.5). Takes #rgb, #rrggbb or rgb(...).
function rgbaOf(c, a) {
  let r = 0, g = 0, b = 0;
  const m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(c.trim());
  if (m) {
    let hx = m[1]; if (hx.length === 3) hx = hx.split('').map(x => x + x).join('');
    const n = parseInt(hx, 16); r = n >> 16; g = (n >> 8) & 255; b = n & 255;
  } else {
    const v = (c.match(/[\d.]+/g) || [0, 0, 0]).map(Number); [r, g, b] = v;
  }
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

// ---------- DOM helpers ----------
const $ = s => document.querySelector(s);
const NSV = 'http://www.w3.org/2000/svg', NHT = 'http://www.w3.org/1999/xhtml';
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false }], throwOnError: false };
// Render $...$ in a node. If the CDN did not load, the text stays as typed.
function tex(node) { if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH); return node; }
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function hh(tag, cls, ...kids) { const e = h(tag, cls); for (const k of kids) if (k) e.append(k); return e; }
function mark(e, kind, id, title) { e.dataset.item = kind; if (id != null) e.dataset.id = id; if (title != null) e.dataset.title = title; return e; }
function emit(kind, data) {
  try { if (window.fluid && typeof window.fluid.emit === 'function') Promise.resolve(window.fluid.emit(kind, data)).catch(() => {}); }
  catch (e) { /* the view works without the bridge */ }
}
// Fixed decimals, with no minus sign on zero.
function fx(x, d) { const y = Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x; return y.toFixed(d); }
// A short number: up to d decimals, trailing zeros dropped.
function sn(x, d) { return String(+fx(x, d == null ? 3 : d)); }
// Common fractions as TeX, else a short decimal.
function fracTex(v) {
  const F = [[1 / 3, '\\tfrac13'], [-1 / 3, '-\\tfrac13'], [0.5, '\\tfrac12'], [-0.5, '-\\tfrac12'], [0.25, '\\tfrac14'], [2 / 3, '\\tfrac23']];
  for (const [x, t] of F) if (Math.abs(v - x) < 1e-9) return t;
  return sn(v, 3);
}
// Plain-text cell label: 1/3, 1/2, 1/4 as glyphs, blank for 0.
function cellText(v) {
  if (Math.abs(v) < 1e-9) return '';
  const G = [[1 / 3, '⅓'], [0.5, '½'], [0.25, '¼'], [-0.5, '−½']];
  for (const [x, t] of G) if (Math.abs(v - x) < 1e-9) return t;
  return sn(v, 2).replace('-', '−');
}

// ---------- controls ----------
// A labelled range input. o: {id, min, max, step, value, fmt(v) -> TeX-ready text, onInput(v)}.
function ctl(label, o) {
  const wrap = h('label', 'slide-ctl');
  const lab = setTex(h('span'), label);
  const inp = h('input');
  inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step; inp.value = o.value;
  mark(inp, 'control', o.id, o.id);
  const val = h('span', 'val');
  const show = v => setTex(val, o.fmt(v));
  inp.addEventListener('input', () => { show(+inp.value); o.onInput(+inp.value); });
  show(o.value);
  wrap.append(lab, inp, val);
  return { el: wrap, input: inp, set(v) { inp.value = v; show(v); } };
}
// A row of buttons that pick one choice. choices: [[id, label], ...]; getCur() gives the current id.
function choiceRow(label, choices, getCur, onPick) {
  const row = hh('div', 'btnrow', label ? setTex(h('span', 'lab'), label) : null);
  const btns = choices.map(([id, text]) => {
    const b = mark(h('button', 'btn'), 'control', id);
    setTex(b, text);
    b.addEventListener('click', () => { onPick(id); paint(); });
    row.append(b);
    return [id, b];
  });
  function paint() { btns.forEach(([id, b]) => b.classList.toggle('on', id === getCur())); }
  paint();
  return { el: row, paint };
}
function button(id, label, onClick) {
  const b = mark(h('button', 'btn'), 'control', id);
  setTex(b, label);
  b.addEventListener('click', onClick);
  return b;
}
// A readout box: label and value are TeX-ready text.
function readout(id, label) {
  const box = mark(h('div', 'readout'), 'readout', id);
  const k = setTex(h('div', 'k'), label);
  const v = h('div', 'val');
  box.append(k, v);
  return { el: box, set(text, bad) { setTex(v, text); box.classList.toggle('bad', !!bad); }, label(t) { setTex(k, t); } };
}
// Legend: items {color (CSS), text, kind: 'line' | 'dash' | 'chip' | 'ring'}.
function legend(items) {
  const d = h('div', 'legend');
  for (const it of items) {
    const s = h('span');
    let sw;
    if (it.kind === 'chip') { sw = h('span', 'chip'); sw.style.background = it.color; }
    else if (it.kind === 'ring') { sw = h('span', 'ring'); if (it.color) sw.style.borderColor = it.color; }
    else { sw = h('span', 'sw'); sw.style.borderTop = '3px ' + (it.kind === 'dash' ? 'dashed' : 'solid') + ' ' + it.color; }
    s.append(sw, setTex(h('span'), it.text));
    d.append(s);
  }
  return d;
}
function sym(text) { return setTex(h('p', 'sym'), text); }
function caseLine(text) { return setTex(h('p', 'case'), text); }
function nameLine(html) { const p = h('p', 'sym name'); p.innerHTML = html; return tex(p); }
function triesList(items) { return hh('ol', 'tries', ...items.map(t => setTex(h('li'), t))); }
// The takeaway appears after the first try: on the first click, drag or slider move in the widget, or on "Show".
function takeBox(widget, text) {
  const holder = h('div', 'takeholder');
  const btn = mark(h('button', 'btn'), 'control', 'show-takeaway');
  setTex(btn, 'Show the takeaway');
  const tk = setTex(h('p', 'takeaway'), text);
  tk.hidden = true;
  const show = () => { tk.hidden = false; btn.hidden = true; };
  btn.addEventListener('click', show);
  for (const ev of ['input', 'click', 'pointerdown']) widget.addEventListener(ev, show);
  holder.append(btn, tk);
  return holder;
}
// The side column of a formula slide, after the frame's tag, title, question and formula.
// o: {sym, name, tries, take, next}. The everyday case (o.case) goes right under the question.
function sideStd(widget, side, o) {
  if (o.case) side.querySelector('.question').after(caseLine(o.case));
  if (o.sym) side.append(sym(o.sym));
  if (o.name) side.append(nameLine(o.name));
  if (o.tries) side.append(triesList(o.tries));
  if (o.take) side.append(takeBox(widget, o.take));
  if (o.next) side.append(setTex(h('p', 'next'), o.next));
}

// ---------- SVG helpers ----------
function svgNode(tag, attrs, parent) {
  const e = document.createElementNS(NSV, tag);
  for (const k in attrs) if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function svgRoot(w, ht) { return svgNode('svg', { viewBox: '0 0 ' + w + ' ' + ht, role: 'img', 'font-family': 'system-ui, sans-serif', 'font-size': 14 }); }
function svgText(parent, x, y, s, attrs) {
  const t = svgNode('text', Object.assign({ x: x, y: y, fill: COL.muted, 'font-size': 14 }, attrs || {}), parent);
  t.textContent = s;
  return t;
}
// A KaTeX label inside an SVG: a foreignObject holding a rendered formula. o: {w, anchor, size, fill, bg, bold}.
function svgTex(parent, x, y, s, o) {
  o = o || {};
  const w = o.w || 220, ht = o.ht || 26, anchor = o.anchor || 'middle';
  const x0 = anchor === 'end' ? x - w : anchor === 'start' ? x : x - w / 2;
  const fo = svgNode('foreignObject', { x: x0, y: y - ht / 2, width: w, height: ht }, parent);
  const d = document.createElementNS(NHT, 'div');
  const jc = anchor === 'end' ? 'flex-end' : anchor === 'start' ? 'flex-start' : 'center';
  d.setAttribute('style', 'display:flex;align-items:center;height:100%;white-space:nowrap;font-size:' +
    (o.size || 15) + 'px;color:' + (o.fill || COL.text2) + ';justify-content:' + jc + (o.bold ? ';font-weight:600' : ''));
  const span = document.createElementNS(NHT, 'span');
  span.textContent = s;
  if (o.bg) span.setAttribute('style', 'background:' + o.bg + ';border-radius:5px;padding:1px 6px');
  d.appendChild(span);
  fo.appendChild(d);
  tex(span);
  return fo;
}
// The same label with a halo in the page color, so it reads over a curve or bars.
function haloTex(parent, x, y, s, o) {
  const fo = svgTex(parent, x, y, s, o);
  fo.firstChild.style.textShadow = '0 0 3px ' + COL.bg + ', 0 0 3px ' + COL.bg + ', 0 0 2px ' + COL.bg;
  return fo;
}
function line(svg, x1, y1, x2, y2, o) { return svgNode('line', Object.assign({ x1, y1, x2, y2 }, o || {}), svg); }
function dot(svg, x, y, r, fill, o) { return svgNode('circle', Object.assign({ cx: x, cy: y, r, fill }, o || {}), svg); }
function rect(svg, x, y, w, ht, o) { return svgNode('rect', Object.assign({ x, y, width: Math.max(0, w), height: Math.max(0, ht) }, o || {}), svg); }
// An arrow with a head. o: {color, w, dash, id}.
function arrow(svg, x1, y1, x2, y2, o) {
  const g = svgNode('g', { 'data-item': 'mark', 'data-id': o.id }, svg);
  svgNode('line', { x1, y1, x2, y2, stroke: o.color, 'stroke-width': o.w || 2.5, 'stroke-dasharray': o.dash }, g);
  const len = Math.hypot(x2 - x1, y2 - y1), hl = Math.min(9, len * 0.45);
  if (len > 3) {
    const a = Math.atan2(y2 - y1, x2 - x1), s = hl / 2;
    const bx = x2 - hl * Math.cos(a), by = y2 - hl * Math.sin(a);
    svgNode('polygon', { points: [[x2, y2], [bx - s * Math.sin(a), by + s * Math.cos(a)], [bx + s * Math.sin(a), by - s * Math.cos(a)]].map(p => p.join(',')).join(' '), fill: o.color }, g);
  }
  return g;
}
// Amber marks what the newest proof line is about.
function glowRect(svg, x, y, w, ht, pad) {
  pad = pad == null ? 4 : pad;
  return rect(svg, x - pad, y - pad, w + 2 * pad, ht + 2 * pad, { rx: 6, fill: COL.amberBg, stroke: COL.amber, 'stroke-width': 1.5 });
}
function glowLine(svg, d, wdt) { return svgNode('path', { d, fill: 'none', stroke: COL.amberBg, 'stroke-width': wdt || 10, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, svg); }
// The top row of a proof picture: what the amber part is while a line is lit, else a plain hint.
function picCaption(svg, W, litText, plainText) {
  if (litText) return svgTex(svg, W / 2, 12, litText, { w: W - 4, size: 15, fill: COL.amberInk, bg: COL.amberBg });
  if (plainText) return svgTex(svg, 4, 12, plainText, { w: W - 8, anchor: 'start', size: 15, fill: COL.muted });
  return null;
}
// A plot that takes the height left in its parent. draw(svg, W, H) runs on every resize and redraw.
function plotBox(draw, cls, weight) {
  const wrap = h('div', 'fill' + (cls ? ' ' + cls : ''));
  if (weight) wrap.style.flex = weight + ' 1 0';
  let key = '';
  const paint = force => {
    const w = Math.floor(wrap.clientWidth), ht = Math.floor(wrap.clientHeight);
    if (w < 60 || ht < 40) return;
    if (!force && key === w + 'x' + ht) return;
    key = w + 'x' + ht;
    COL = readPalette();
    const svg = svgRoot(w, ht);
    draw(svg, w, ht);
    wrap.replaceChildren(svg);
  };
  new ResizeObserver(() => paint(false)).observe(wrap);
  const plot = { wrap, redraw: () => paint(true) };
  PLOTS.push(plot);
  return plot;
}
// Axes for a plot. o: {x0, x1, y0, y1, L, R, T, B}. y values outside the range are clamped.
function plotFrame(svg, W, H, o) {
  const L = o.L == null ? 46 : o.L, R = o.R == null ? 14 : o.R, T = o.T == null ? 12 : o.T, B = o.B == null ? 40 : o.B;
  const pw = W - L - R, ph = H - T - B, base = T + ph;
  const X = x => L + (x - o.x0) / (o.x1 - o.x0) * pw;
  const Y = y => base - (Math.max(o.y0, Math.min(o.y1, y)) - o.y0) / (o.y1 - o.y0) * ph;
  line(svg, L, base, W - R, base, { stroke: COL.grey });
  line(svg, L, T, L, base, { stroke: COL.grey });
  if (o.y0 < 0 && o.y1 > 0) line(svg, L, Y(0), W - R, Y(0), { stroke: COL.grey, 'stroke-dasharray': '2 3' });
  return { X, Y, L, R, T, B, pw, ph, base, W, H };
}
function pathOf(P, pts) { return pts.map((p, i) => (i ? 'L' : 'M') + P.X(p[0]).toFixed(1) + ' ' + P.Y(p[1]).toFixed(1)).join(''); }
// Stems for values at n = 0 .. len-1. o: {vals, lo, hi, color, id, label, labelFill, values (print values),
// rings (values drawn as rings), band(n) -> true to shade, bandColor, hollow(n) -> true for an open dot, L, T, B, ticks}.
function stems(svg, W, H, o) {
  const len = o.vals.length, L = o.L == null ? 34 : o.L, R = o.R == null ? 10 : o.R, T = o.T == null ? 30 : o.T, B = o.B == null ? 22 : o.B;
  const cw = (W - L - R) / len;
  const X = n => L + (n + 0.5) * cw;
  const Y = v => T + (o.hi - Math.max(o.lo, Math.min(o.hi, v))) / (o.hi - o.lo) * (H - T - B);

// ---------- frame ----------
// SLIDES (defined by each view): {id, tag, title, question, formula, proof, mount(widget, side)}.
let cur = 0, shownId = null, endSent = false;
function goTo(i) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  if (shownId !== null && shownId !== s.id) emit('view.step', { step: s.id });
  shownId = s.id;
  const stage = $('#stage');
  stage.innerHTML = '';
  PLOTS = [];
  const widget = h('div', 'widget');
  const side = hh('div', 'side',
    h('div', 'tag', s.tag),
    setTex(h('h2'), s.title),
    setTex(h('p', 'question'), s.question),
    s.formula ? setTex(h('div', 'formula'), s.formula) : null);
  const sec = mark(h('section', 'slide' + (s.proof ? ' proof-slide' : '')), 'step', s.id, s.title.replace(/\$/g, ''));
  sec.append(widget, side);
  stage.append(sec);
  s.mount(widget, side);
  if (cur === SLIDES.length - 1 && !endSent) { endSent = true; emit('view.action', { action: 'deck-end' }); }
  tex(sec);
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, k) => d.classList.toggle('on', k === cur));
}
// A cue is a state: go to the named step, and do nothing if it is already shown.
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i >= 0 && i !== cur) goTo(i);
}
function startDeck() {
  const dots = $('#dots');
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = s.title.replace(/\$/g, '');
    b.addEventListener('click', () => goTo(i));
    dots.appendChild(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],input[type=number],textarea,select')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
}

// ===== shared by the three p-feedback views =====
// Loops in the form y_n = a*y_{n-1} + u_n (one form for the whole primer).

// A run of the loop y_n = a*y_{n-1} + u for n = 1..N, from y_0.
function runLoop(a, u, y0, N) { const y = [y0]; for (let n = 1; n <= N; n++) y.push(a * y[n - 1] + u); return y; }
// A seeded generator (mulberry32) and a normal draw.
function mulberry32(seed) {

  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

// A plain number for a label: d decimals at most, minus sign as a real minus.
function pn(v, d) { return sn(v, d == null ? 2 : d).replace('-', '−'); }
// A number as TeX: like sn, with a thin space in thousands.
function tn(v, d) { return sn(v, d == null ? 3 : d); }
// A bare number in SVG with a halo in the page color, so it reads over lines.
function valText(svg, x, y, s, o) {

    stroke: COL.bg, 'stroke-width': 3.5, 'paint-order': 'stroke', 'stroke-linejoin': 'round', 'font-weight': o.bold ? 600 : 400 }, svg);

// Stems for values at n = 0 .. len-1, with a sparse n axis and marks for values off the chart.
// o: {vals, lo, hi, color, id, L, R, T, B, every (n label step), showVal(n) -> bool, fmtVal(v, n), hiN, bandColor,
//     ticks, label, labelFill, rings (array, drawn as rings), ringColor(n), zeroLabel, n0, axisLabel}
function stemsN(svg, W, H, o) {
  const len = o.vals.length, L = o.L == null ? 46 : o.L, R = o.R == null ? 12 : o.R, T = o.T == null ? 30 : o.T;
  const B = o.B == null ? (o.axisLabel ? 44 : 24) : o.B;
  const cw = (W - L - R) / len;
  const X = n => L + (n + 0.5) * cw;
  const Y = v => T + (o.hi - Math.max(o.lo, Math.min(o.hi, v))) / (o.hi - o.lo) * (H - T - B);
  const geo = { X, Y, cw, L, R, T, B, W, H };
  if (o.pre) o.pre(geo);   // drawn under everything else (proof lights)
  if (o.hiN != null && o.hiN >= 0 && o.hiN < len) rect(svg, X(o.hiN) - cw / 2 + 1, T - 8, cw - 2, H - T - B + 12, { rx: 5, fill: o.bandColor || COL.accentTint });
  for (const t of (o.ticks || [])) {
    if (t < o.lo || t > o.hi) continue;
    line(svg, L, Y(t), W - R, Y(t), { stroke: COL.grid });
    svgText(svg, L - 6, Y(t) + 5, pn(t, 2), { 'text-anchor': 'end' });

  const every = o.every || 1, ny = H - B + 18;

  if (o.axisLabel) svgTex(svg, L + (W - L - R) / 2, H - 10, o.axisLabel, { w: 260, size: 14, fill: COL.muted });
  const base = Y(Math.max(o.lo, Math.min(o.hi, 0)));
  const sw = cw > 16 ? 3 : 2, rd = Math.min(5.5, Math.max(3, cw * 0.22));
  o.vals.forEach((v, n) => {
    const off = v > o.hi ? 1 : v < o.lo ? -1 : 0;
    const col = o.colorOf ? o.colorOf(n) : o.color;
    line(svg, X(n), base, X(n), Y(v), { stroke: col, 'stroke-width': sw });
    if (off) {
      const y = Y(v), s = Math.max(5, rd + 1);

    } else dot(svg, X(n), Y(v), rd, o.hollow && o.hollow(n) ? COL.panel : col, { stroke: col, 'stroke-width': 2, 'data-item': 'mark', 'data-id': (o.id || 'stem') + '-' + n });
    if (o.showVal && o.showVal(n)) {

      if (o.rings && !off) valText(svg, X(n) + rd + 7, Y(v) - 7, o.fmtVal ? o.fmtVal(v, n) : pn(v, 2), { fill: COL.ink, size: o.valSize || 13, anchor: 'start' });
      else valText(svg, X(n), y, o.fmtVal ? o.fmtVal(v, n) : pn(v, 2), { fill: COL.ink, size: o.valSize || 13 });
    }
  });
  if (o.rings) o.rings.forEach((v, n) => { if (v == null) return; dot(svg, X(n), Y(v), rd + 4, 'none', { stroke: o.ringColor ? o.ringColor(n) : COL.ink, 'stroke-width': 1.8 }); });

// A y range that holds the values and 0, with a little room; clamped to [cap0, cap1].

  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);

// A value label: 2 decimals, or one significant digit when it is small but not 0.

// The complex plane: axes, the unit circle, labels. P(z) gives the pixel point of z. o: {fill (inside), label}
function cplane(svg, cx, cy, s, ext, o) {

// Block diagram parts.

// A polyline with an arrow head at its end. pts: [[x, y], ...]

// A ruler for a loop factor: zones with labels above, ticks below, marks with a label higher up, and a marker.
// o: {min, max, y, zones: [{x0, x1, fill, text}], ticks, marks: [{x, text}], at, sym (TeX name at the left)}
function ruler(svg, W, H, o) {
  const L = o.L == null ? 40 : o.L, R = o.R == null ? 20 : o.R, y = o.y == null ? H * 0.58 : o.y;
  const X = v => L + (v - o.min) / (o.max - o.min) * (W - L - R);

  for (const m of (o.marks || [])) {

    if (m.text) svgTex(svg, X(m.x) - 4, y - 48, m.text, { w: 160, anchor: 'end', size: 14, fill: COL.ink });

    line(svg, x, y - 15, x, y + 15, { stroke: COL.accent, 'stroke-width': 4, 'data-item': 'mark', 'data-id': 'marker' });

// Complex helpers.
const cxPow = (z, n) => { const r = Math.pow(cxAbs(z), n), t = cxArg(z) * n; return { re: r * Math.cos(t), im: r * Math.sin(t) }; };

// Roots of lambda^2 = d1*lambda + d2: {real: bool, l1, l2} (complex: l1 has im > 0).
function roots2(d1, d2) {

// ---------- 1. Each value from the last: a bank balance ----------
function slideBank(widget, side) {
  let rate = 5, dep = 100;

  const run = () => runLoop(1 + rate / 100, dep, Y0, NY);
  const sR = ctl('interest', { id: 'rate', min: 0, max: 10, step: 1, value: rate, fmt: v => v + '%', onInput: v => { rate = v; update(); } });
  const sD = ctl('deposit each year', { id: 'deposit', min: 0, max: 200, step: 50, value: dep, fmt: v => String(v), onInput: v => { dep = v; update(); } });
  const r1 = readout('year-1', 'year $1$, from year $0$'), r2 = readout('year-2', 'year $2$, from year $1$');
  const plot = plotBox((svg, W, H) => {
    const y = run(), a = 1 + rate / 100, hi = Math.max(...y) * 1.08;
    const S = stemsN(svg, W, H, { vals: y, lo: 0, hi, color: COL.accent, id: 'y', showVal: () => true, fmtVal: v => pn(v, 0),
      ticks: niceTicks(0, hi, 4), label: 'blue: the balance $y_n$ after $n$ years', labelFill: COL.accentDeep, T: 56, axisLabel: 'year $n$' });
    // the rule, drawn once between year 0 and year 1
    const x0 = S.X(0), x1 = S.X(1), yt = Math.min(S.Y(y[0]), S.Y(y[1])) - 30;
    svgNode('path', { d: `M${x0} ${yt + 8} Q ${(x0 + x1) / 2} ${yt - 14} ${x1} ${yt + 8}`, fill: 'none', stroke: COL.ink, 'stroke-width': 1.5 }, svg);
    svgNode('polygon', { points: `${x1},${yt + 9} ${x1 - 7},${yt + 1} ${x1 + 2},${yt}`, fill: COL.ink }, svg);
    haloTex(svg, x0 - 6, yt - 20, '$\\times' + sn(a, 2) + ',\\ +' + dep + '$', { w: 160, anchor: 'start', size: 15, fill: COL.ink });
  });
  function update() {
    const y = run(), a = sn(1 + rate / 100, 2);
    r1.set('$y_1=' + a + '\\cdot1000+' + dep + '=' + tn(y[1], 2) + '$');
    r2.set('$y_2=' + a + '\\cdot' + tn(y[1], 2) + '+' + dep + '=' + tn(y[2], 2) + '$');

// ---------- 2. A loop feeds its output back in: one clap ----------
function drawLoop(svg, W, H, o) {
  // o: {u, back, y, n, a}
  const ym = H * 0.36, yb = H * 0.8, xs = W * 0.26, r = 15;
  const bx = W * 0.40, bw = W * 0.26, bh = 46, xo = W * 0.84;
  svgTex(svg, 6, ym - 22, 'clap in: $u_{' + o.n + '}=' + o.u + '$', { w: xs - 20, anchor: 'start', size: 15, fill: COL.text2 });
  wire(svg, [[6, ym], [xs - r - 1, ym]], { color: COL.muted2 });
  sumNode(svg, xs, ym, r);
  wire(svg, [[xs + r, ym], [bx, ym]]);
  blockBox(svg, bx, ym - bh / 2, bw, bh, 'amplifier and speaker', { id: 'speaker', size: 15 });
  wire(svg, [[bx + bw, ym], [W - 8, ym]], { color: COL.accent, w: 2.5 });
  svgTex(svg, W - 6, ym - 22, 'out: $y_{' + o.n + '}=' + o.y + '$', { w: W * 0.32, anchor: 'end', size: 15, fill: COL.accentDeep, bold: true });
  // feedback path
  svgNode('path', { d: `M${xo} ${ym} L${xo} ${yb} L${W * 0.66} ${yb}`, fill: 'none', stroke: COL.ink, 'stroke-width': 2 }, svg);
  const fx0 = W * 0.36, fw = W * 0.30;
  blockBox(svg, fx0, yb - 22, fw, 44, 'one trip later, $\\times a$', { id: 'back', size: 15 });
  wire(svg, [[fx0, yb], [xs, yb], [xs, ym + r + 1]]);
  svgTex(svg, xs + 8, yb + 34, 'comes back: $a\\,y_{' + (o.n - 1) + '}=' + o.back + '$', { w: W * 0.6, anchor: 'start', size: 15, fill: COL.text2 });
}
function slideEcho(widget, side) {

// ---------- 3. A moving average of the loss settles ----------
const EMA_N = 80, EMA_DROP = 30, EMA_NOISE = normals(20261024, EMA_N).map(v => 0.25 * v);
const emaLevel = n => (n < EMA_DROP ? 2 : 1);
function emaRun(a, noisy) {
  const u = Array.from({ length: EMA_N }, (_, n) => emaLevel(n) + (noisy ? EMA_NOISE[n] : 0));
  const y = [emaLevel(0)];
  for (let n = 1; n < EMA_N; n++) y.push(a * y[n - 1] + (1 - a) * u[n]);
  return { u, y };
}
function slideEma(widget, side) {
  let a = 0.9, noisy = true;
  const sA = ctl('$a$', { id: 'a', min: 0, max: 0.98, step: 0.01, value: a, fmt: v => sn(v, 2), onInput: v => { a = v; update(); } });
  const pick = choiceRow('', [['noise-on', 'noise on'], ['noise-off', 'noise off']], () => (noisy ? 'noise-on' : 'noise-off'), id => { noisy = id === 'noise-on'; update(); });
  const rG = readout('gap', 'gap left 10 steps after the drop');
  const plot = plotBox((svg, W, H) => {
    const { u, y } = emaRun(a, noisy);
    const P = plotFrame(svg, W, H, { x0: -1, x1: EMA_N, y0: 0, y1: 3, L: 40, T: 30, B: 40 });
    for (const t of [1, 2, 3]) { line(svg, P.L, P.Y(t), W - P.R, P.Y(t), { stroke: COL.grid }); svgText(svg, P.L - 6, P.Y(t) + 5, String(t), { 'text-anchor': 'end' }); }
    svgText(svg, P.L - 6, P.Y(0) + 5, '0', { 'text-anchor': 'end' });
    for (let n = 0; n < EMA_N; n += 10) svgText(svg, P.X(n), H - 18, String(n), { 'text-anchor': 'middle' });
    svgTex(svg, W - P.R, H - 8, 'training step $n$', { w: 170, anchor: 'end', size: 14, fill: COL.muted });
    // the loss level, dashed
    svgNode('path', { d: `M${P.X(0)} ${P.Y(2)} L${P.X(EMA_DROP - 0.5)} ${P.Y(2)} L${P.X(EMA_DROP - 0.5)} ${P.Y(1)} L${P.X(EMA_N - 1)} ${P.Y(1)}`, fill: 'none', stroke: COL.ink, 'stroke-width': 1.3, 'stroke-dasharray': '5 4', 'data-item': 'mark', 'data-id': 'level' }, svg);
    u.forEach((v, n) => dot(svg, P.X(n), P.Y(v), 2.6, COL.grey, { 'data-item': 'mark', 'data-id': 'u-' + n }));
    svgNode('path', { d: pathOf(P, y.map((v, n) => [n, v])), fill: 'none', stroke: COL.accent, 'stroke-width': 2.8, 'data-item': 'mark', 'data-id': 'y' }, svg);
    // the gap 10 steps after the drop (noise off only)
    if (!noisy) {
      const n1 = EMA_DROP + 9, g = y[n1] - 1, x = P.X(n1);
      line(svg, x + 6, P.Y(1), x + 6, P.Y(y[n1]), { stroke: COL.ink, 'stroke-width': 2 });
      line(svg, x + 2, P.Y(1), x + 10, P.Y(1), { stroke: COL.ink, 'stroke-width': 2 });
      line(svg, x + 2, P.Y(y[n1]), x + 10, P.Y(y[n1]), { stroke: COL.ink, 'stroke-width': 2 });
      haloTex(svg, x + 14, P.Y(1 + g / 2) - (g < 0.15 ? 18 : 0), 'gap at step ' + n1 + ': ' + sn(g, 3), { w: 220, anchor: 'start', size: 14, fill: COL.ink });
    }
    haloTex(svg, P.X(EMA_DROP + 1), P.Y(2.75), 'the loss drops from $2$ to $1$ at step ' + EMA_DROP, { w: 340, anchor: 'start', size: 14, fill: COL.text2 });
  });
  function update() {
    rG.set('$a^{10}=' + sn(a, 2) + '^{10}=' + sn(Math.pow(a, 10), 3) + '$');
    pick.paint(); plot.redraw();
  }
  widget.append(hh('div', 'sliders', sA.el, pick.el), plot.wrap,
    legend([{ kind: 'chip', color: 'var(--pal-grey)', text: 'grey dots: the loss $u_n$' }, { kind: 'line', color: 'var(--pal-accent)', text: 'blue: the smoothed loss $y_n$' }, { kind: 'dash', color: 'var(--pal-ink)', text: 'dashed: the loss level' }]),
    hh('div', 'readouts', rG.el));
  sideStd(widget, side, {
    case: 'Training dashboards smooth a noisy loss curve. Each smoothed value keeps 0.9 of the last smoothed value and takes 0.1 of the new loss.',
    sym: String.raw`$u_n$: the loss at training step $n$; $y_n$: the smoothed loss. This is step 2’s loop with the input $(1-a)\,u_n$.`,
    tries: [
      String.raw`Press noise off and keep $a=0.9$. After the drop, the gap to the new level shrinks by $0.9$ each step: 10 steps on, $0.9^{10}=0.349$ of it is left.`,
      String.raw`Set $a=0.97$: smoother but slower, $0.97^{10}=0.737$ of the gap is left.`,
      String.raw`Press noise on and set $a=0$: no smoothing at all, $y_n=u_n$.`],
    take: String.raw`With $0<a<1$ the loop forgets the old level by a factor $a$ each step, so it settles on the input’s level; a larger $a$ is smoother and slower.` });
  update();
}

// ---------- 4. Settle, add up, or explode ----------
const FATE_PRESETS = [['p-settle', 'settle, $a=0.5$', 0.5], ['p-flip', 'flip, $a=-0.5$', -0.5], ['p-add', 'add up, $a=1$', 1], ['p-explode', 'explode, $a=1.1$', 1.1]];
function fateText(a) {
  if (Math.abs(a - 1) < 1e-9) return 'adds up: $y_n=n$, without end';
  if (Math.abs(a + 1) < 1e-9) return 'swings $0, 1, 0, 1, \\dots$ forever';
  if (Math.abs(a) < 1) return 'settles at $y^*=\\frac{1}{1-a}=' + sn(1 / (1 - a), 3) + '$';
  return a > 1 ? 'explodes upward' : 'explodes, flipping sign';
}
function slideFates(widget, side) {
  let a = 0.5;
  const NF = 15;
  const sA = ctl('$a$', { id: 'a', min: -1.5, max: 1.5, step: 0.05, value: a, fmt: v => sn(v, 2), onInput: v => { a = v; update(); } });
  const pick = choiceRow('', FATE_PRESETS.map(p => [p[0], p[1]]), () => (FATE_PRESETS.find(p => Math.abs(p[2] - a) < 1e-9) || [''])[0],
    id => { a = FATE_PRESETS.find(p => p[0] === id)[2]; sA.set(a); update(); });
  const rF = readout('fate', 'what the loop does');
  const plot = plotBox((svg, W, H) => {
    const y = runLoop(a, 1, 0, NF);
    const [lo, hi] = rangeOf(y, 2.2, -8, 16);
    const S = stemsN(svg, W, H, { vals: y, lo, hi, color: COL.accent, id: 'y', showVal: () => true, fmtVal: vfmt,
      ticks: niceTicks(lo, hi, 4), label: 'blue: $y_n$, with the same input $1$ at every step; dashed: the resting value $y^*$', labelFill: COL.accentDeep, axisLabel: 'step $n$' });
    if (Math.abs(a) < 1) {
      const ys = 1 / (1 - a);
      line(svg, S.L, S.Y(ys), W - S.R, S.Y(ys), { stroke: COL.ink, 'stroke-width': 1.5, 'stroke-dasharray': '6 4', 'data-item': 'mark', 'data-id': 'rest' });
    }
  }, null, 1.6);
  const rul = plotBox((svg, W, H) => {
    ruler(svg, W, H, { min: -1.5, max: 1.5,
      zones: [{ x0: -1.5, x1: -1, fill: COL.soft2, text: 'explodes, flipping' }, { x0: -1, x1: 1, fill: COL.accentSoft, text: 'settles' }, { x0: 1, x1: 1.5, fill: COL.soft2, text: 'explodes' }],
      ticks: [-1.5, -1, -0.5, 0, 0.5, 1, 1.5], marks: [{ x: 1, text: 'adds up at $a=1$' }], at: a, sym: '$a$' });
  }, null, 0.62);
  function update() { rF.set(fateText(a)); pick.paint(); plot.redraw(); rul.redraw(); }
  widget.append(pick.el, hh('div', 'sliders', sA.el), plot.wrap, rul.wrap, hh('div', 'readouts', rF.el));
  sideStd(widget, side, {
    case: String.raw`Put the same $1$ in at every step, from $y_0=0$: $y_n=a\,y_{n-1}+1$.`,
    sym: String.raw`$y^*$: the resting value, with $y^*=a\,y^*+1$: once there, the loop stays. The transient: the part $y_n-y^*$ that dies away.`,
    name: '<i>transient</i>: Latin <i>transire</i>, to pass: the part of the output that passes.',
    tries: [
      String.raw`Press settle: $0, 1, 1.5, 1.75, \dots$ closes in on $y^*=2$.`,
      String.raw`Press add up: $0, 1, 2, 3, \dots$ The loop sums its input and grows without end: Hamming’s integrator (L16 35:50).`,
      String.raw`Press explode, then flip: $1.1$ runs away; $-0.5$ jumps above and below $y^*=\tfrac23$ and settles.`],
    take: String.raw`With a steady input a loop settles when $-1<a<1$, adds up when $a=1$, and explodes when $|a|>1$.` });
  update();
}

// ---------- 5. Too strong a correction flips the error ----------
function slideOvercorrect(widget, side) {
  let k = 0.5;

  const rA = readout('factor', 'each correction multiplies the error by');
  const plot = plotBox((svg, W, H) => {

    const [lo, hi] = rangeOf(e, 4, -20, 24);
    stemsN(svg, W, H, { vals: e, lo, hi, color: COL.accent, id: 'e', showVal: () => true, fmtVal: vfmt, ticks: niceTicks(lo, hi, 4),
      label: 'blue: the error $e_n$ after correction $n$', labelFill: COL.accentDeep, axisLabel: 'correction $n$' });
  }, null, 1.6);
  const rul = plotBox((svg, W, H) => {

      zones: [{ x0: 0, x1: 1, fill: COL.accentSoft, text: 'closes in from one side' }, { x0: 1, x1: 2, fill: COL.accentTint, text: 'overshoots, settles' }, { x0: 2, x1: 2.5, fill: COL.soft2, text: 'flips and grows' }],
      ticks: [0, 0.5, 1, 1.5, 2, 2.5], at: k, sym: '$k$' });
  }, null, 0.62);
  function update() { rA.set('$1-k=' + sn(1 - k, 2) + '$'); plot.redraw(); rul.redraw(); }
  widget.append(hh('div', 'sliders', sK.el), plot.wrap, rul.wrap, hh('div', 'readouts', rA.el));
  sideStd(widget, side, {
    case: 'Learning to drive, you see the car drift toward the curb and yank the wheel. Now you head for the other lane (Hamming, L17 06:01).',
    sym: String.raw`$e_n$: how far off you are after correction $n$, from $e_0=4$. $k$: how strong each correction is; $k=1$ removes exactly the error you see. This is step 4’s loop with $a=1-k$ and no input.`,
    tries: [
      String.raw`Keep $k=0.5$: $4, 2, 1, 0.5$. Half the error each time, never past zero.`,
      String.raw`Set $k=1.5$: $4, -2, 1, -0.5$. Each correction overshoots, but by less each time.`,
      String.raw`Set $k=2.5$: $4, -6, 9, -13.5$. Each overshoot is bigger than the last.`],
    take: String.raw`Correcting by more than the error flips it to the other side; correct by more than twice the error ($k>2$), and each flip grows.` });
  update();
}

// ---------- 6. Why it's true: the gap shrinks by a each step ----------
function drawWhyGap(svg, W, H, a, y0, lit) {
  const NG = 12, y = runLoop(a, 1, y0, NG), one = Math.abs(a - 1) < 1e-9, ys = one ? null : 1 / (1 - a);
  const CAP = {
    rest: String.raw`amber: the resting value $y^*$, which the rule leaves unchanged`,
    one: String.raw`amber: one step multiplies the gap by $a$`,
    all: String.raw`amber: every gap is $a^n$ times the first`,
    limit: String.raw`amber: for $|a|<1$ the gaps shrink to $0$` }[lit];
  picCaption(svg, W, CAP, String.raw`blue: $y_n=a\,y_{n-1}+1$; dashed: $y^*$; bars: the gap $y_n-y^*$`);
  const vals = y.concat(ys == null ? [] : [ys]);
  const [lo, hi] = rangeOf(vals, 1, -12, 16);
  let gx, gw;
  const lights = S => {
    gx = n => S.X(n) + S.cw * 0.26; gw = Math.max(4, S.cw * 0.18);
    if (lit === 'limit') glowRect(svg, S.X(6) - S.cw / 2, S.T - 6, S.X(NG) - S.X(6) + S.cw, S.H - S.T - S.B + 10, 0);
    if (ys == null) return;
    if (lit === 'rest') glowLine(svg, `M${S.L} ${S.Y(ys)} L${W - S.R} ${S.Y(ys)}`, 12);
    for (let n = 0; n <= NG; n++) {
      const top = S.Y(Math.max(y[n], ys)), bot = S.Y(Math.min(y[n], ys));
      if ((lit === 'one' && (n === 1 || n === 2)) || lit === 'all') glowRect(svg, gx(n) - gw / 2, top, gw, Math.max(1, bot - top), 3);
    }
  };
  const S = stemsN(svg, W, H, { vals: y, lo, hi, color: COL.accent, id: 'y', T: 40, B: 52, L: 52, ticks: niceTicks(lo, hi, 4), pre: lights });
  if (ys != null) {
    line(svg, S.L, S.Y(ys), W - S.R, S.Y(ys), { stroke: COL.ink, 'stroke-width': 1.5, 'stroke-dasharray': '6 4', 'data-item': 'mark', 'data-id': 'rest' });
    haloTex(svg, W - S.R - 2, S.Y(ys) + (S.Y(ys) < S.T + 30 ? 16 : -14), '$y^*=' + sn(ys, 3) + '$', { w: 120, anchor: 'end', size: 15, fill: COL.ink });
    for (let n = 0; n <= NG; n++) {
      const g = y[n] - ys, top = S.Y(Math.max(y[n], ys)), bot = S.Y(Math.min(y[n], ys));
      const lit1 = (lit === 'one' && (n === 1 || n === 2)) || lit === 'all';
      rect(svg, gx(n) - gw / 2, top, gw, Math.max(1, bot - top), { fill: lit1 ? COL.amber : COL.accent3, 'data-item': 'mark', 'data-id': 'gap-' + n });
      valText(svg, S.X(n), H - 9, pn(g, 2), { size: 12, fill: COL.text2 });
    }
    svgText(svg, 6, H - 9, 'gap', { 'font-size': 13, fill: COL.muted });
    if (lit === 'one') haloTex(svg, (gx(1) + gx(2)) / 2, Math.min(S.Y(y[1]), S.Y(ys)) - 14, '$\\times a$', { w: 60, size: 16, fill: COL.amberInk, bg: COL.amberBg });
  } else svgTex(svg, W / 2, H - 28, 'no resting value at $a=1$: the loop adds $1$ each step', { w: W - 10, size: 15, fill: COL.ink });
}

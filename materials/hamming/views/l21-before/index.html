<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Before Lecture 21: guiding light</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><script src="../../components/theme.js"></script><style>*{box-sizing:border-box}body{margin:0;background:var(--pal-bg);color:var(--pal-fg);font:18px/1.42 system-ui,sans-serif}main{height:100vh;padding:26px 30px;display:grid;grid-template-rows:58px 1fr 44px;gap:15px}header,footer{display:flex;align-items:center;justify-content:space-between;gap:14px}h1{font-size:24px;margin:0}h2{font-size:29px;line-height:1.15;margin:0 0 12px}p{margin:0 0 14px}.tag{color:var(--pal-muted);font-size:16px}.body{display:grid;grid-template-columns:59% 1fr;gap:28px;min-height:0}.lab{border:1px solid var(--pal-line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:15px;background:var(--pal-panel);min-height:0}.lesson{padding:8px 0;display:flex;flex-direction:column}.question{font-size:20px}.defs{color:var(--pal-text-2);margin-bottom:14px;font-size:17px}.formula{font-size:26px;margin-bottom:10px}.take{background:var(--pal-accent-soft);padding:15px;border-radius:10px;font-size:18px;margin-top:auto}ol{padding-left:25px;margin:5px 0 18px}li{padding:4px 0}button,select{font:inherit;color:var(--pal-fg);background:var(--pal-soft);border:1px solid var(--pal-line);border-radius:8px;padding:9px 14px;cursor:pointer}button:hover{background:var(--pal-accent-soft)}button:disabled{opacity:.45;cursor:default}.chart{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.chart svg{width:100%;height:100%}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:16px}.legend span:before{content:'';display:inline-block;width:20px;height:4px;background:var(--c);margin-right:7px;vertical-align:middle}.readout{padding:13px;background:var(--pal-soft);border-radius:8px;font-size:18px;min-height:55px}.controls{display:flex;align-items:center;gap:16px}.controls label{display:flex;align-items:center;gap:16px;flex:1}input[type=range]{flex:1;accent-color:var(--pal-accent)}.intro,.choices,.proof{display:flex;flex-direction:column;flex:1;gap:17px;justify-content:center}.intro>div{border-left:4px solid var(--pal-accent);background:var(--pal-soft);padding:20px;font-size:22px}.intro small,.choice small{display:block;font-size:17px;margin-top:8px;color:var(--pal-text-2)}.choice{text-align:left;padding:18px;font-size:20px}.verdict{border-top:1px solid var(--pal-line);margin-top:10px;padding-top:10px;font-size:17px;color:var(--pal-accent-deep)}.proof-row{padding:10px;background:var(--pal-soft);font-size:22px;border-left:4px solid var(--pal-line)}.proof-row:last-child{background:var(--pal-amber-row);border-color:var(--pal-amber)}.proof-row small{display:block;font-size:16px;margin-top:3px;color:var(--pal-text-2)}.guess{font-size:17px}.guess button{font-size:16px;padding:5px 8px;margin:4px 4px 0 0}.proof{gap:10px}.choice{font-size:19px;padding:14px}.choice small,.verdict{font-size:16px;line-height:1.35}.source{color:var(--pal-muted);font-size:15px}a{color:var(--pal-accent-deep)}.pages{font-size:16px;color:var(--pal-muted)}</style></head><body><main><header><h1>Before Lecture 21: guiding light</h1><span id="tag" class="tag"></span></header><section class="body"><div id="lab" class="lab"></div><article class="lesson"><h2 id="title"></h2><p id="question" class="question"></p><div id="defs" class="defs"></div><div id="formula" class="formula"></div><ol id="tries"></ol><div id="take" class="take"></div></article></section><footer><button id="prev">← Previous</button><span class="pages" id="pages"></span><span class="source">L21 · manual study · <a href="https://ocw.mit.edu/courses/3-15-electrical-optical-magnetic-materials-and-devices-fall-2006/1b318e5a5a7d1ba5a21d9ddf6edc5c63_lecture15_16.pdf" target="_blank" rel="noopener">optics source</a></span><button id="next">Next →</button></footer></main><script>const slides=[{"id": "why", "kind": "intro", "title": "Light can carry a conversation", "time": "Before \u00b7 01:42\u201303:14", "q": "How can a strand of glass guide a useful signal?", "defs": "Fiber optics sends information as light through a glass core. Imagine replacing a crowded bundle of telephone wires with thin strands.", "cards": [["The old problem", "Manhattan\u2019s cable ducts were filling up. More capacity could mean digging up streets."], ["What you will be able to do", "Explain when a boundary reflects a ray, and distinguish guidance from carrying more bits."], ["Where this matters", "Lecture 21: guidance at 02:43 and cladding at 09:32. AI work: communication links between computing devices."]], "tries": ["Start with a ray hitting a glass boundary.", "Then name the angles and derive the reflection threshold."], "take": "Map: play with the boundary \u2192 name the angles \u2192 derive the threshold. This is a ray model, not the full wave theory of a fiber."}, {"id": "ray", "kind": "ray", "title": "A shallow approach stays inside", "time": "Before \u00b7 02:43", "q": "Can light reach the outside at every angle?", "defs": "The blue ray starts in the core: refractive index $n_1=1.50$. The cladding has $n_2=1.45$. A larger index means light moves more slowly. The dashed line is perpendicular to the boundary.", "formula": "", "tries": ["Move the angle from 20 to 80 degrees.", "Watch the outgoing ray slide toward the boundary, then disappear."], "take": "Beyond a threshold, the ideal boundary reflects all the light back into the core. \u201cTotal internal reflection\u201d names exactly that event."}, {"id": "name", "kind": "raylaw", "title": "Measure from the perpendicular", "time": "Before \u00b7 02:43; 09:32", "q": "Which angle and which material determine the threshold?", "defs": "Keep the same core and cladding indices. $\\theta$: incoming angle from the perpendicular; $\\phi$: outgoing angle. The sketch uses rays at a flat boundary.", "formula": "$n_1\\sin\\theta=n_2\\sin\\phi$", "tries": ["Move the incoming angle toward 75 degrees.", "Notice that a larger angle from the perpendicular means a shallower approach to the boundary."], "take": "Snell\u2019s law is the starting physical law here. A lower-index cladding permits total internal reflection; it is not a metallic mirror."}, {"id": "threshold", "kind": "proof", "title": "Find the last outgoing ray", "time": "Before \u00b7 supports 02:43; 09:32", "q": "Why does this example stop transmitting near 75 degrees?", "defs": "Keep the same core and cladding. $\\theta_c$ is the critical incoming angle. The last outgoing ray runs along the boundary.", "formula": "", "rows": [["n_1\\sin\\theta_c=n_2\\sin90^\\circ", "Set the outgoing ray along the boundary"], ["\\sin\\theta_c=n_2/n_1", "Divide by the core index"], ["\\theta_c=\\arcsin(1.45/1.50)\\approx75.2^\\circ", "Invert sine and insert the two indices"], ["\\theta>\\theta_c\\Rightarrow (n_1/n_2)\\sin\\theta>1", "Test whether an outgoing sine is possible"]], "tries": ["Guess each next move before revealing it.", "Look back: why must the core index exceed the cladding index?"], "take": "Above the critical angle, Snell\u2019s law would require a sine larger than one. There is no propagating refracted ray in this ideal model."}, {"id": "limits", "kind": "choice", "title": "A sketch does not decide the fiber", "time": "Before \u00b7 06:54; 08:29", "q": "Does a thinner strand by itself guarantee that every ray is guided?", "defs": "Our sketch fixed a launch angle and two indices. A real fiber also has a diameter, wavelength, bends, and wave modes.", "options": [["Yes: thin means every ray skims the wall", "Assumes diameter alone controls the launch angle.", "No. A poorly launched ray can still fall below the critical angle."], ["No: guidance also needs the right angles and indices", "Assumes the boundary conditions still matter.", "Correct. Diameter also matters in the wave description, which this ray sketch does not solve."], ["No: glass must have a metallic mirror", "Assumes only a mirror can reflect all the light.", "No. Total internal reflection does not need a metal coating."]], "answer": 1, "tries": ["Pick the statement the boundary experiment supports."], "take": "Hamming gives an intuitive thin-fiber argument. Keep its scope clear: single-mode behavior requires a wave model, not this ray sketch alone."}];
let page=0,revealed=0,picked=-1,guess=-1;const values={angle:60,rate:10000,path:10,earth:10};const $=id=>document.getElementById(id);const math=()=>{if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});};
function setPage(i){page=Math.max(0,Math.min(slides.length-1,i));revealed=0;picked=-1;guess=-1;render()}
function render(){let s=slides[page];$('title').textContent=s.title;$('tag').textContent=s.time;$('question').textContent=s.q;$('defs').innerHTML=s.defs||'';$('formula').innerHTML=s.formula||'';$('tries').innerHTML=s.tries.map(t=>'<li>'+t+'</li>').join('');$('take').textContent=s.take;$('pages').textContent=`${page+1} / ${slides.length}`;$('prev').disabled=page===0;$('next').disabled=page===slides.length-1;let lab=$('lab');if(s.kind==='intro'){lab.innerHTML='<div class="intro">'+s.cards.map(c=>'<div data-item="case" data-title="'+c[0]+'">'+c[0]+'<small>'+c[1]+'</small></div>').join('')+'</div>';}else if(s.kind==='choice'){lab.innerHTML='<div class="choices">'+s.options.map((o,i)=>`<button class="choice" data-item="choice" data-id="${s.id}-${i}">${o[0]}${picked<0?'<small>'+o[1]+'</small>':''}${picked>=0?'<div class="verdict">'+(i===s.answer?'Supported: ':'')+o[2]+'</div>':''}</button>`).join('')+'</div><button id="answer">Show answer</button>';lab.querySelectorAll('.choice').forEach((b,i)=>b.onclick=()=>{picked=i;render()});$('answer').onclick=()=>{picked=s.answer;render()};}else if(s.kind==='proof'){let choices=revealed<s.rows.length?[s.rows[revealed][1],'Change the physical model','Ignore the limiting case']:[];lab.innerHTML='<div class="proof">'+s.rows.slice(0,revealed).map(r=>'<div class="proof-row">$'+r[0]+'$<small>'+r[1]+'</small></div>').join('')+(revealed===0?'<p>Guess the next move. Each reveal adds one equation and its reason.</p>':'')+'</div>'+(choices.length?'<div class="guess">What move would you try next?<div>'+choices.map((c,i)=>`<button class="move" data-item="proof-guess" data-id="${i}">${c}</button>`).join('')+'</div><div id="feedback">'+(guess<0?'Choose a move, or reveal to check.':guess===0?'That move keeps the model and advances the argument.':'Check whether that move follows from the current assumptions.')+'</div></div>':'')+'<button id="reveal">'+(revealed<s.rows.length?'Reveal next move':'Proof complete')+'</button>';$('reveal').disabled=revealed>=s.rows.length;$('reveal').onclick=()=>{revealed++;guess=-1;render()};lab.querySelectorAll('.move').forEach((b,i)=>b.onclick=()=>{guess=i;render()});}else{lab.innerHTML='<div class="chart" id="chart"></div><div class="legend" id="legend"></div><div class="readout" id="readout"></div><div class="controls" id="controls"></div>';draw()}math()}
const col=x=>FluidTheme.color(x);const line=(x,y,X,Y,c,dash='')=>`<line x1="${x}" y1="${y}" x2="${X}" y2="${Y}" stroke="${col(c)}" stroke-width="3" ${dash?'stroke-dasharray="'+dash+'"':''}/>`;const label=(x,y,t,c='text-2',anchor='start')=>`<text x="${x}" y="${y}" fill="${col(c)}" text-anchor="${anchor}" font-size="18">${t}</text>`;
function slider(key,min,max,step,text){$('controls').innerHTML=`<label>${text}<input aria-label="${text}" type="range" min="${min}" max="${max}" step="${step}" value="${values[key]}"></label><output>${values[key]}</output>`;$('controls').querySelector('input').oninput=e=>{values[key]=+e.target.value;draw();math()};}
function plot(series,xmax,ymax,xname,yname,markers=[],xmin=0){let W=680,H=320,L=60,R=25,T=35,B=45,px=x=>L+(x-xmin)/(xmax-xmin)*(W-L-R),py=y=>H-B-y/ymax*(H-T-B),v='<svg viewBox="0 0 680 320" role="img" aria-label="'+yname+' by '+xname+'">';for(let k=0;k<=4;k++){let y=ymax*k/4;v+=line(L,py(y),W-R,py(y),'line')+label(L-8,py(y)+5,y.toFixed(1),'muted','end');let x=xmin+(xmax-xmin)*k/4;v+=label(px(x),H-18,x.toFixed(0),'muted','middle')}series.forEach(s=>{v+=`<polyline points="${s.p.map(p=>px(p[0])+','+py(p[1])).join(' ')}" fill="none" stroke="${col(s.c)}" stroke-width="3"/>`});markers.forEach(m=>v+=line(px(m),T,px(m),H-B,'guide','6 5'));v+=label(L,20,yname)+label(W-R,H-1,xname,'text-2','end')+'</svg>';$('chart').innerHTML=v;$('legend').innerHTML=series.map(s=>`<span style="--c:var(--pal-${s.c})">${s.label}</span>`).join('')+(markers.length?'<span style="--c:var(--pal-guide)">dashed: path arrival times</span>':'')}
function draw(){let s=slides[page];if(s.kind==='ray'||s.kind==='raylaw'){let a=values.angle*Math.PI/180,ratio=1.5/1.45*Math.sin(a),tir=ratio>1,hit=[350,160],x=350-145*Math.tan(a),v='<svg viewBox="0 0 680 340" role="img" aria-label="Ray at a core and cladding boundary">';v+=`<rect x="0" y="160" width="680" height="180" fill="${col('accent-soft')}"/><rect x="0" y="0" width="680" height="160" fill="${col('soft')}"/>`;v+=line(0,160,680,160,'ink')+line(350,20,350,320,'guide','6 5');let length=190;v+=line(350-length*Math.sin(a),160+length*Math.cos(a),350,160,'accent');if(tir)v+=line(350,160,350+length*Math.sin(a),160+length*Math.cos(a),'accent');else{let b=Math.asin(ratio);v+=line(350,160,350+length*Math.sin(b),160-length*Math.cos(b),'orange');v+=line(350,160,350+length*Math.sin(a),160+length*Math.cos(a),'grey','5 5')}let arc=[];for(let i=0;i<=20;i++){let t=a*i/20;arc.push([350-48*Math.sin(t),160+48*Math.cos(t)])}v+=`<polyline points="${arc.map(z=>z.join(',')).join(' ')}" fill="none" stroke="${col('accent')}" stroke-width="2"/>`;v+=label(18,35,'cladding: lower index')+label(18,318,'core: higher index')+label(365,55,'perpendicular')+label(280,232,'incoming angle')+'</svg>';$('chart').innerHTML=v;$('legend').innerHTML='<span style="--c:var(--pal-accent)">incoming / fully reflected ray</span><span style="--c:var(--pal-orange)">outgoing ray</span><span style="--c:var(--pal-grey)">partial reflection (schematic)</span>';$('readout').textContent=`Incoming angle: ${values.angle} degrees. ${tir?'Total internal reflection.':'Outgoing angle: '+(Math.asin(ratio)*180/Math.PI).toFixed(1)+' degrees.'}`;slider('angle',20,85,1,'Incoming angle (degrees)')}
if(s.kind==='bits'){let r=values.rate,end=100+1000/r*1000;plot([{p:[[0,0],[100,0],[end,1000],[360,1000]],c:'accent',label:'cumulative delivered bits'}],360,1000,'time (milliseconds)','delivered bits');$('readout').textContent=`First-bit leading edge: 100 ms. Whole message: ${end.toFixed(0)} ms. Rate: ${r} bits per second.`;slider('rate',5000,20000,1000,'Bit rate')}
if(s.kind==='spread'){let a=values.path*Math.PI/180,late=100/Math.cos(a),times=[100,100+(late-100)/2,late],sigma=1.6,p=Array.from({length:241},(_,i)=>{let t=90+i*.16;return[t,times.reduce((sum,z)=>sum+Math.exp(-.5*((t-z)/sigma)**2),0)/3]}),base=Array.from({length:241},(_,i)=>{let t=90+i*.16;return[t,Math.exp(-.5*((t-100)/sigma)**2)]});plot([{p:base,c:'grey',label:'one straight path'},{p,c:'accent',label:'mean of three delayed copies'}],130,1.1,'arrival time (nanoseconds)','relative pulse height',times,90);$('readout').textContent=`Straight arrival: 100 ns. Last arrival: ${late.toFixed(2)} ns. Spread: ${(late-100).toFixed(2)} ns. Toy equal path weights.`;slider('path',0,35,1,'Ray angle from axis (degrees)')}
if(s.kind==='cost'){let e=values.earth;plot([{p:[[0,20],[40,60]],c:'orange',label:'copper: equipment + excavation'},{p:[[0,35],[40,35]],c:'accent',label:'fiber: equipment only'}],40,65,'copper excavation cost','total cost (toy units)',[e]);$('readout').textContent=`Copper: ${20+e}. Fiber: 35. ${e===15?'The options tie.':e>15?'Fiber is cheaper by '+(e-15)+'.':'Copper is cheaper by '+(15-e)+'.'}`;$('legend').lastElementChild.textContent='dashed: selected excavation cost';slider('earth',0,40,1,'Excavation cost')}
math()}
$('prev').onclick=()=>setPage(page-1);$('next').onclick=()=>setPage(page+1);window.addEventListener('fluid-themechange',()=>{if($('chart'))draw()});window.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')setPage(page+1);if(e.key==='ArrowLeft')setPage(page-1)});render();window.addEventListener('load',math);

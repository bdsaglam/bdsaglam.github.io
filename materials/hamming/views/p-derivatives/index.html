<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primer: Limits and derivatives</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../../components/theme.js"></script>
<style>
/* Colors: white page, one accent (blue), red only for a failing check, amber for the newest proof line. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft);
  --red:var(--pal-red); --redbg:var(--pal-red-bg);
  --u:clamp(16px,1.35vw,20px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 24px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(6px,1vh,12px) 24px}
footer{display:flex;align-items:center;gap:10px;padding:8px 24px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:7px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Slide frame: widget on the left (3/5), text on the right (2/5). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);grid-template-rows:minmax(0,1fr);gap:clamp(18px,2.4vw,40px)}
.widget{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(6px,1vh,10px);overflow:hidden}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(4px,0.8vh,8px);overflow:hidden}
.tag{font:13px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(18px,1.7vw,24px);line-height:1.15;margin:0;font-weight:650}
.question{margin:0;font-size:clamp(16px,1.2vw,17px);line-height:1.3;font-weight:600}
.formula{font-size:clamp(17px,1.6vw,22px);line-height:1.3}
.sym{margin:0;font-size:16px;color:var(--muted)}
.name i{font-style:italic}
.tries{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.tries li::marker{color:var(--accent);font-weight:600}
.note{margin:0;font-size:16px;color:var(--muted)}
.takeaway{margin:0;padding:6px 10px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px;line-height:1.3}

/* Controls and readouts */
.sliders{display:flex;gap:8px 24px;flex-wrap:wrap;width:100%;align-items:center}
.slide-ctl{display:flex;align-items:center;gap:8px;font-size:16px}
.slide-ctl input{width:clamp(120px,11vw,170px);vertical-align:middle;accent-color:var(--accent)}
.slide-ctl .val{min-width:52px}
.btn{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--pal-panel);border-radius:8px;cursor:pointer;font-size:16px}
.btn.on{background:var(--chip);border-color:var(--accent);color:var(--pal-accent-deep)}
.btnrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.readouts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.readout{flex:1 1 130px;min-width:0;padding:4px 8px;border-radius:10px;background:var(--pal-soft);font-size:15px;overflow-wrap:anywhere}
.readout .k{color:var(--muted);font-size:14px}
.readout .val{font-size:16px;font-weight:600}
.readout.bad{background:var(--redbg);color:var(--red)}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:15px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:20px;height:0;vertical-align:middle;margin-right:6px}
.chip{display:inline-block;width:18px;height:12px;vertical-align:middle;margin-right:6px;border-radius:2px}
.rule{margin:0;font-size:16px}

/* Plots fill the space left in the widget column */
.fill{flex:1 1 0;min-height:120px;position:relative;width:100%}
.fill>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.twoplots{display:flex;gap:12px;flex:1 1 0;min-height:160px;width:100%}
.twoplots .cell{flex:1 1 0;min-width:0;display:flex;flex-direction:column;position:relative}

/* Difference tables */
.dt{display:grid;grid-template-columns:max-content repeat(7,minmax(0,1fr));grid-auto-rows:minmax(30px,1fr);gap:6px 4px;align-items:center;width:100%;flex:1 1 0;min-height:0}
.dt .x{font-size:14px;color:var(--muted);text-align:center}
.dt .lab{font-size:16px;padding-right:8px;white-space:nowrap}
.dt .c{height:100%;min-height:30px;display:flex;align-items:center;justify-content:center;border-radius:4px;background:var(--pal-soft);font:16px ui-monospace,Menlo,monospace}
.dt .c.const{background:var(--accent);color:var(--pal-on-accent);font-weight:700}
.dt .c.empty{background:transparent}
.dt.dt-proof{grid-template-columns:max-content repeat(7,minmax(0,1fr)) max-content;grid-auto-rows:minmax(26px,1fr)}
.dt .form{font-size:16px;padding:2px 6px;white-space:nowrap;border-radius:5px}
.dt .lit,.dt .c.lit{background:var(--pal-amber-bg);color:var(--pal-ink);outline:1.5px solid var(--pal-amber)}
.tbox{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:6px}
.tcap{margin:0;font-size:15px;color:var(--muted);text-align:center;padding:1px 6px;border-radius:5px;align-self:center}
.tcap.on{background:var(--pal-amber-bg);color:var(--pal-ink)}

/* Proof slides: test and picture on the left, the proof (fl-proof-steps) on the right */
.slide.proof-slide{grid-template-columns:minmax(0,11fr) minmax(0,9fr)}
.slide.proof-slide .side,.side.with-proof{justify-content:flex-start}
.slide.proof-slide .fill{min-height:100px}
.slide.proof-slide .slide-ctl input{width:clamp(90px,8vw,130px)}
.slide.proof-slide .slide-ctl .val{min-width:40px}
.slide.proof-slide .sliders{gap:6px 18px}
.slide.proof-slide .legend{gap:4px 12px}
.part{margin:0;font-weight:600;color:var(--muted)}
.test{display:flex;flex-direction:column;gap:3px;padding-bottom:4px}
.test .tries{gap:3px}
.model{margin:0;padding:8px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px;line-height:1.3}

/* Short windows (1100x620 and similar): tighter spacing, body text stays 16px */
@media (max-height: 680px){
  header{padding-top:2px}
  #stage{padding:2px 24px}
  footer{padding:2px 24px}
  footer .btn{padding:3px 10px}
  .tag{font-size:12px;line-height:1.2}
  .widget{gap:4px}
  .side{gap:3px}
  .tries{gap:2px}
  .question{line-height:1.2}
  .sym,.tries,.note{line-height:1.2}
  .readout{padding:3px 8px}
  .takeaway{padding:4px 10px}
  .dt{grid-auto-rows:minmax(26px,1fr)}
  .dt.dt-proof{grid-auto-rows:minmax(22px,1fr);gap:4px 4px}
  .dt .c{min-height:22px}
  .twoplots{min-height:140px}
  h2{font-size:18px}
  .formula{font-size:18px}
  .model{padding:4px 10px;line-height:1.2}
  .test .tries{gap:1px}
  .legend{line-height:1.2}
}
</style>
</head>
<body>
<header>Primer · Limits and derivatives</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script src="../../components/proof-steps.js"></script>
<script>
// ---------- DOM and drawing helpers ----------
const $ = s => document.querySelector(s);

// ---------- palette and redraw ----------
// COL holds the palette colors for the SVG being drawn: a plot re-reads it at every paint, and the slide
// re-reads it when it is shown. A theme switch redraws the plots and keeps every control's state.
let COL = {};
const PAL_NAMES = ['accent', 'accent-2', 'amber', 'amber-bg', 'blue-deep', 'blue-light', 'blue-strong', 'accent-tint', 'grey', 'soft-3', 'guide', 'bg', 'ink', 'line', 'muted', 'panel', 'text-3', 'soft', 'soft-2', 'text-2'];
function readPalette() {
  const o = {};
  for (const n of PAL_NAMES) o[n.replace(/-(\w)/g, (_, c) => c.toUpperCase())] = FluidTheme.color(n);
  return o;
}
let PLOTS = [];   // the plots on the current slide
window.addEventListener('fluid-themechange', () => { COL = readPalette(); PLOTS.forEach(p => p.redraw()); });
const NSV = 'http://www.w3.org/2000/svg', NHT = 'http://www.w3.org/1999/xhtml';
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false } ], throwOnError: false };
// Render $...$ and $$...$$ in a node. If the CDN did not load, the text stays as typed.
function tex(node) {
  if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH);
  return node;
}
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function hh(tag, cls, ...kids) {
  const e = h(tag, cls);
  for (const k of kids) if (k) e.append(k);
  return e;
}
function mark(e, kind, id, title) {
  e.dataset.item = kind;
  if (id != null) e.dataset.id = id;
  if (title != null) e.dataset.title = title;
  return e;
}
function svgNode(tag, attrs, parent) {
  const e = document.createElementNS(NSV, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function svgRoot(w, ht) {
  return svgNode('svg', { viewBox: '0 0 ' + w + ' ' + ht, role: 'img', 'font-family': 'system-ui, sans-serif', 'font-size': 14 });
}
function svgText(parent, x, y, s, attrs) {
  const t = svgNode('text', Object.assign({ x: x, y: y, fill: COL.muted }, attrs || {}), parent);
  t.textContent = s;
  return t;
}
// A KaTeX label over an SVG: a foreignObject holding a rendered formula. o.bg gives it a background.
function svgTex(parent, x, y, s, o) {
  o = o || {};
  const w = o.w || 220, ht = o.ht || 26, anchor = o.anchor || 'middle';
  const x0 = anchor === 'end' ? x - w : anchor === 'start' ? x : x - w / 2;
  const fo = svgNode('foreignObject', { x: x0, y: y - ht / 2, width: w, height: ht }, parent);
  const d = document.createElementNS(NHT, 'div');
  const jc = anchor === 'end' ? 'flex-end' : anchor === 'start' ? 'flex-start' : 'center';
  d.setAttribute('style', 'display:flex;align-items:center;height:100%;white-space:nowrap;font-size:' +
    (o.size || 15) + 'px;color:' + (o.fill || COL.text2) + ';justify-content:' + jc);
  const span = document.createElementNS(NHT, 'span');
  span.textContent = s;
  if (o.bg) span.setAttribute('style', 'background:' + o.bg + ';border-radius:5px;padding:1px 5px');
  d.appendChild(span);
  fo.appendChild(d);
  tex(span);
  return fo;
}
// Same label with a white halo, so it reads over a curve or bars.
function haloTex(parent, x, y, s, o) {
  const fo = svgTex(parent, x, y, s, o);
  fo.firstChild.style.textShadow = '0 0 3px ' + COL.bg + ', 0 0 3px ' + COL.bg + ', 0 0 2px ' + COL.bg;
  return fo;
}
// A labelled range input. label is LaTeX-ready text; fmt gives the value text.
function slider(label, o) {
  const wrap = h('label', 'slide-ctl');
  const lab = tex(h('span', '', label));
  const val = h('span', 'val', '');
  const inp = h('input');
  inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step; inp.value = o.value;
  mark(inp, 'control', o.id, o.name || o.id);
  wrap.append(lab, inp, val);
  const fmt = o.fmt || String;
  const api = {
    el: wrap,
    input: inp,
    get value() { return +inp.value; },
    show() { setTex(val, fmt(+inp.value)); },
  };
  inp.addEventListener('input', () => { api.show(); if (o.onInput) o.onInput(+inp.value); });
  api.show();
  return api;
}
// A readout box: label and value are LaTeX-ready text.
function readout(id, label) {
  const box = mark(h('div', 'readout'), 'readout', id);
  const k = h('div', 'k');
  setTex(k, label);
  const v = h('div', 'val');
  box.append(k, v);
  return { el: box, set(text, bad) { setTex(v, text); box.classList.toggle('bad', !!bad); } };
}
function legend(items) {
  const d = h('div', 'legend');
  for (const it of items) {
    const s = h('span');
    const sw = it.chip ? h('span', 'chip') : h('span', 'sw');
    if (it.chip) { sw.style.background = it.color; if (it.border) sw.style.border = '1.5px solid ' + it.border; }
    else sw.style.borderTop = '2px ' + (it.dash ? 'dashed' : it.dot ? 'dotted' : 'solid') + ' ' + it.color;
    const t = h('span');
    setTex(t, it.text);
    s.append(sw, t);
    d.appendChild(s);
  }
  return d;
}
// A plot that takes the height left in its box. draw(svg, W, H) runs on every resize.
function fillPlot(box, draw) {
  const wrap = h('div', 'fill');
  box.append(wrap);
  let key = '';
  const paint = force => {
    const w = Math.floor(wrap.clientWidth), ht = Math.floor(wrap.clientHeight);
    if (w < 60 || ht < 60) return;
    if (!force && key === w + 'x' + ht) return;
    key = w + 'x' + ht;
    COL = readPalette();
    const svg = svgRoot(w, ht);
    draw(svg, w, ht);
    wrap.replaceChildren(svg);
  };
  new ResizeObserver(() => paint(false)).observe(wrap);
  const plot = { redraw: () => paint(true) };
  PLOTS.push(plot);
  return plot;
}
// A small number for a readout: plain decimals, or a LaTeX power of ten for tiny values.
function sci(x) {
  if (x === 0) return '0';
  if (Math.abs(x) >= 0.01) return x.toFixed(4);
  const parts = x.toExponential(2).split('e');
  return '$' + parts[0] + '\\times 10^{' + parseInt(parts[1], 10) + '}$';
}
function sym(text) { return setTex(h('p', 'sym'), text); }
function nameLine(html) { const p = h('p', 'sym name'); p.innerHTML = html; return tex(p); }
function triesList(items) { return hh('ol', 'tries', ...items.map(t => setTex(h('li'), t))); }
function takeLine(text) { return setTex(h('p', 'takeaway'), text); }
// Session events. Optional: with no bridge, nothing is sent.
function emit(kind, data) {
  try {
    if (window.fluid && typeof window.fluid.emit === 'function') Promise.resolve(window.fluid.emit(kind, data)).catch(() => {});
  } catch (e) { /* the view works without the bridge */ }
}

// ---------- plot helpers: one frame, axes with KaTeX labels, curves, marks ----------
const PL = { L: 54, R: 16, T: 14, B: 46 };
function scaleOf(W, H, P, M) {
  M = M || PL;
  const pw = W - M.L - M.R, ph = H - M.T - M.B;
  return {
    X: x => M.L + (x - P.x0) / (P.x1 - P.x0) * pw,
    Y: y => M.T + ph - (y - P.y0) / (P.y1 - P.y0) * ph,
    base: M.T + ph, M: M,
  };
}
function fmtNum(v) { return String(Math.round(v * 1000) / 1000); }
function axes(svg, W, H, P, S) {
  const M = S.M;
  svgNode('line', { x1: M.L, y1: S.base, x2: W - M.R, y2: S.base, stroke: COL.grey }, svg);
  svgNode('line', { x1: M.L, y1: M.T, x2: M.L, y2: S.base, stroke: COL.grey }, svg);
  for (const v of P.xt) svgText(svg, S.X(v), S.base + 18, fmtNum(v), { 'text-anchor': 'middle', 'font-size': 15 });
  for (const v of P.yt) svgText(svg, M.L - 8, S.Y(v) + 5, fmtNum(v), { 'text-anchor': 'end', 'font-size': 15 });
  if (P.xlabel) svgTex(svg, (M.L + W - M.R) / 2, H - 13, P.xlabel, { w: 320, size: 15 });
  if (P.ylabel) haloTex(svg, M.L + 6, M.T + 10, P.ylabel, { w: 220, size: 15, anchor: 'start', fill: COL.ink });
}
let CLIP_N = 0;
// Clip marks to the plot box, so a curve that leaves the range stops at the edge.
function plotClip(svg, S, W) {
  const id = 'pclip' + (++CLIP_N);
  const cp = svgNode('clipPath', { id: id }, svgNode('defs', {}, svg));
  svgNode('rect', { x: S.M.L, y: S.M.T, width: W - S.M.L - S.M.R, height: S.base - S.M.T }, cp);
  return 'url(#' + id + ')';
}
function ptsD(pts, close) {
  return pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ') + (close ? ' Z' : '');
}
// The path of y = f(x). A null or non-finite value lifts the pen (a hole in the curve).
function curveD(S, f, x0, x1, n) {
  let d = '', pen = false;
  n = n || 240;
  for (let i = 0; i <= n; i++) {
    const x = x0 + (x1 - x0) * i / n, y = f(x);
    if (y === null || y === undefined || !isFinite(y)) { pen = false; continue; }
    d += (pen ? 'L' : 'M') + S.X(x).toFixed(1) + ' ' + S.Y(y).toFixed(1);
    pen = true;
  }
  return d;
}
function curve(svg, S, f, x0, x1, attrs) {
  const a = Object.assign({ fill: 'none', 'stroke-width': 2.5, 'data-item': 'mark' }, attrs || {});
  a.d = curveD(S, f, x0, x1);
  return svgNode('path', a, svg);
}
// A straight segment between two data points.
function seg(svg, S, xa, ya, xb, yb, attrs) {
  const a = Object.assign({ 'stroke-width': 2.5, 'data-item': 'mark' }, attrs || {});
  a.x1 = S.X(xa).toFixed(1); a.y1 = S.Y(ya).toFixed(1); a.x2 = S.X(xb).toFixed(1); a.y2 = S.Y(yb).toFixed(1);
  return svgNode('line', a, svg);
}
// A dot at a data point.
function dotAt(svg, S, x, y, fill, id) {
  return svgNode('circle', { cx: S.X(x).toFixed(1), cy: S.Y(y).toFixed(1), r: 6, fill: fill, stroke: COL.panel,
    'stroke-width': 2, 'data-item': 'mark', 'data-id': id }, svg);
}
const DASH = '5 4';

// ---------- proof slides: shared parts ----------
// Amber marks what the newest proof line is about, in the picture and in the proof.
function glowPath(svg, d, w) {
  return svgNode('path', { d: d, fill: 'none', stroke: COL.amberBg, 'stroke-width': w || 12, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, svg);
}
function glowFill(svg, d) { return svgNode('path', { d: d, fill: COL.amberBg, stroke: COL.amber, 'stroke-width': 1.5, 'stroke-linejoin': 'round' }, svg); }
function glowDot(svg, x, y, r) { return svgNode('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: r || 12, fill: COL.amberBg, stroke: COL.amber, 'stroke-width': 1.5 }, svg); }
function glowBox(svg, x, y, w, ht, pad) {
  pad = pad == null ? 4 : pad;
  return svgNode('rect', { x: (x - pad).toFixed(1), y: (y - pad).toFixed(1), width: Math.max(0, w + 2 * pad).toFixed(1),
    height: Math.max(0, ht + 2 * pad).toFixed(1), rx: 6, fill: COL.amberBg, stroke: COL.amber, 'stroke-width': 1.5 }, svg);
}
// The picture's title row: grey when it names the picture, amber when it says what the newest line is about.
function plotTitle(svg, W, text, lit) {
  svgTex(svg, W / 2, 13, text, { w: W - 8, size: 15, fill: lit ? COL.ink : COL.muted, bg: lit ? COL.amberBg : null });
}
// Left column of a proof slide: controls, the picture, legend, readouts, the test, the mental model.
function proofLeft(widget, o) {
  if (o.controls && o.controls.length) widget.append(hh('div', 'sliders', ...o.controls));
  let plot;
  if (o.box) { widget.append(o.box); plot = { redraw: o.redraw }; }
  else plot = fillPlot(widget, o.draw);
  widget.append(legend(o.legend.concat([{ chip: true, color: COL.amberBg, text: 'amber: the newest proof line' }])));
  if (o.readouts && o.readouts.length) widget.append(hh('div', 'readouts', ...o.readouts.map(r => r.el)));
  const test = hh('div', 'test', h('p', 'part', 'Test it'), triesList(o.tests));
  widget.append(test);
  if (o.model) {
    const model = h('p', 'model');
    model.append(h('span', 'part', 'The picture: '), tex(h('span', '', o.model)));
    widget.append(model);
  }
  plot.test = test;
  return plot;
}
// Right column: the proof. Each revealed line lights its part of the picture; once the proof is
// done, the look-back questions take the place of the test under the picture.
function proofRight(side, spec, plot, onLight, hint) {
  const el = document.createElement('fl-proof-steps');
  el.onEvent = d => emit('view.action', d);
  el.onHighlight = key => onLight(key);
  el.lookBackHost = plot.test;
  el.lookBackHint = hint || 'Look back: under the picture.';
  el.data = spec;
  side.append(el);
  return el;
}

// ---------- step 1: a limit ----------

// ---------- step 3: the derivative as a slope you approach (with its two-line proof) ----------

    svgNode('path', { d: legsD, stroke: COL.muted, 'stroke-dasharray': '2 3', 'stroke-width': 1.8, fill: 'none', 'data-item': 'mark', 'data-id': 'run-rise' }, svg);
    if (h0 >= 0.5) {

    }
    seg(svg, S, 1, s(1), 1 + h0, top, { stroke: COL.accent, 'stroke-width': 3 });

    lines: [

// ---------- step 5: why the power rule holds (proof) ----------

  if (sT[3] > 20) haloTex(svg, X(f / 2), Y(g + dg / 2), String.raw`$f\Delta g$`, { w: 60, size: 15, fill: COL.blueDeep });

  const tick = (x0, y0, x1, y1) => svgNode('path', { d: ptsD([[x0, y0], [x1, y1]]), stroke: COL.muted, 'stroke-width': 1.5 }, svg);
  tick(X(0), Y(0) + 7, X(f) - 2, Y(0) + 7); tick(X(f) + 2, Y(0) + 7, X(f + df), Y(0) + 7);
  svgTex(svg, X(f / 2), Y(0) + 18, '$f=x$', { w: 80, size: 15, fill: COL.ink, ht: 22 });
  if (sR[2] > 18) svgTex(svg, X(f + df / 2), Y(0) + 18, String.raw`$\Delta f$`, { w: 40, size: 15, fill: COL.ink, ht: 22 });
  tick(X(0) - 7, Y(0), X(0) - 7, Y(g) + 2); tick(X(0) - 7, Y(g) - 2, X(0) - 7, Y(g + dg));

}

        a: String.raw`Line 2 divides by $k$. If $u$ is flat near $x$, $k=0$ for some small $h$ (try $x=-0.05$, $h=0.1$). For those $h$ the quotient is 0, and a full proof treats them apart.` },
      { q: 'What does a longer chain give?',
        a: String.raw`One factor per link: $\frac{d}{dx}f(g(u(x)))=f'(g)\,g'(u)\,u'(x)$. Backpropagation computes this product link by link, from the loss back to each weight.` }] },
    plot, key => { lit = key || ''; plot.redraw(); });
  function update() {
    const fn = CHAIN[fi], u0 = fn.u(x), u1 = fn.u(x + hs), k = u1 - u0, df = Math.exp(u1) - Math.exp(u0);
    r1.set(fmtSig(k / hs));
    if (Math.abs(k) < 1e-12) { r2.set(String.raw`no value: $k=0$`); r3.set(String.raw`no value: $k=0$`); }
    else { r2.set((df / k).toFixed(4)); r3.set((k / hs * df / k).toFixed(4)); }
    r4.set((df / hs).toFixed(4));
    plot.redraw();
  }
  update();
}

// ---------- step 8: finding a peak ----------
function slideMaximum(widget, side) {
  let a = 3, b = 7, zi = 50;
  const f = z => Math.pow(z, a) * Math.pow(1 - z, b);
  const fp = z => Math.pow(z, a - 1) * Math.pow(1 - z, b - 1) * (a * (1 - z) - b * z);
  const peak = () => a / (a + b);
  const g = z => f(z) / f(peak());      // scaled so the peak is 1
  const gp = z => fp(z) / f(peak());    // slope of g
  const sA = slider(String.raw`$a$, heads`, { id: 'a', name: 'a', min: 1, max: 8, step: 1, value: a,
    fmt: v => '$a=' + v + '$', onInput: v => { a = v; update(); } });
  const sB = slider(String.raw`$b$, tails`, { id: 'b', name: 'b', min: 1, max: 8, step: 1, value: b,
    fmt: v => '$b=' + v + '$', onInput: v => { b = v; update(); } });
  const sZ = slider(String.raw`$z$, heads chance`, { id: 'z', name: 'z', min: 1, max: 99, step: 1, value: zi,
    fmt: v => '$z=' + (v / 100).toFixed(2) + '$', onInput: v => { zi = v; update(); } });
  const rZ = readout('z', String.raw`your $z$`);
  const rS = readout('slope', String.raw`slope of $g$ at $z$`);
  const rP = readout('peak', String.raw`peak $z^*=\dfrac{a}{a+b}$`);
  const rQ = readout('is-peak', String.raw`at the peak?`);
  widget.append(legend([
    { color: COL.grey, text: String.raw`grey: $g(z)=z^a(1-z)^b$, scaled to peak $1$` },
    { color: COL.accent, dash: true, text: String.raw`dashed: slope of $g$ at your $z$` },
    { color: COL.ink, dash: true, text: String.raw`dashed: the peak $z^*$` },
  ]), hh('div', 'sliders', sA.el, sB.el, sZ.el));
  const plot = fillPlot(widget, drawMax);
  widget.append(hh('div', 'readouts', rZ.el, rS.el, rP.el, rQ.el));
  function drawMax(svg, W, H) {
    const P = { x0: 0, x1: 1, y0: 0, y1: 1.3, xt: [0, 0.25, 0.5, 0.75, 1], yt: [0, 0.5, 1],
      xlabel: String.raw`$z$, chance of heads`, ylabel: String.raw`$g$` };
    const S = scaleOf(W, H, P);
    axes(svg, W, H, P, S);
    curve(svg, S, g, 0, 1, { stroke: COL.grey });
    const z = zi / 100, zs = peak();
    seg(svg, S, zs, 0, zs, 1.1, { stroke: COL.ink, 'stroke-dasharray': DASH, 'stroke-width': 1.5 });
    haloTex(svg, S.X(zs) + 6, S.Y(1.2), String.raw`peak $z^*=` + zs.toFixed(3) + '$', { w: 200, size: 15, anchor: 'start', fill: COL.ink });
    const z0 = Math.max(0, z - 0.2), z1 = Math.min(1, z + 0.2);
    seg(svg, S, z0, g(z) + gp(z) * (z0 - z), z1, g(z) + gp(z) * (z1 - z), { stroke: COL.accent, 'stroke-dasharray': DASH, 'stroke-width': 2 });
    dotAt(svg, S, z, g(z), COL.accent, 'dot');
  }
  function update() {
    const z = zi / 100, zs = peak();
    rZ.set('$' + z.toFixed(2) + '$');
    const sl0 = Math.abs(gp(z)) < 5e-4 ? 0 : gp(z);
    rS.set(sl0.toFixed(3));
    rP.set('$' + zs.toFixed(3) + '$');
    const near = Math.abs(z - zs) < 0.005;
    rQ.set(near ? 'yes, slope $0$' : 'no', false);
    plot.redraw();
  }
  update();
  side.append(
    sym(String.raw`$a$: heads seen. $b$: tails seen. One specific sequence of them, with heads chance $z$, has chance $z^a(1-z)^b$.`),
    triesList([
      String.raw`Set $a=3$, $b=7$, then $z$ to $0.30$. The slope reads $0$.`,
      String.raw`Move $z$ a little left of the peak: the slope is positive. A little right: negative.`,
    ]),
    setTex(h('p', 'note'), String.raw`In Lecture 2, $z^a(1-z)^b$ is the growth rate of Hamming's S-curve, so its peak is where the S-curve climbs fastest.`),
    takeLine(String.raw`A smooth peak has zero slope: solve for zero slope, then check that the answer is a peak.`),
  );
}

// ---------- step 9: why the peak is at a/(a+b) (proof) ----------
function drawPeak(svg, W, Hh, a, b, z, lit) {
  const g0 = t => Math.pow(t, a) * Math.pow(1 - t, b), zs = a / (a + b), top = g0(zs);
  const g = t => g0(t) / top;
  const gp = t => Math.pow(t, a - 1) * Math.pow(1 - t, b - 1) * (a - (a + b) * t) / top;
  const line = t => a - (a + b) * t;
  const CAP = {
    slope: String.raw`amber: the slope $g'(z)$ at your $z$`,
    line: String.raw`amber: $g'$ is a positive factor times this straight line`,
    sign: String.raw`amber: the factor is positive, so $g'$ has the sign of the line`,
    zero: String.raw`amber: the line is 0 only at $z=\frac{a}{a+b}$`,
    peak: 'amber: rising before, falling after: the top' }[lit];
  plotTitle(svg, W, CAP || String.raw`top: $g$, scaled to height 1; bottom: the line $a-(a+b)z$`, !!CAP);
  const split = Hh * 0.5, ym = Math.max(a, b) + 0.6;
  const P1 = { x0: 0, x1: 1, y0: 0, y1: 1.25, xt: [], yt: [0, 1] };
  const S1 = scaleOf(W, Hh, P1, { L: 50, R: 16, T: 36, B: Hh - split });
  const P2 = { x0: 0, x1: 1, y0: -ym, y1: ym, xt: [0, 0.25, 0.5, 0.75, 1], yt: [0], xlabel: String.raw`$z$, chance of heads` };
  const S2 = scaleOf(W, Hh, P2, { L: 50, R: 16, T: split + 14, B: 40 });
  // frames
  svgNode('line', { x1: 50, y1: S1.base, x2: W - 16, y2: S1.base, stroke: COL.grey }, svg);
  svgNode('line', { x1: 50, y1: 36, x2: 50, y2: S1.base, stroke: COL.grey }, svg);
  for (const v of P1.yt) svgText(svg, 42, S1.Y(v) + 5, String(v), { 'text-anchor': 'end', 'font-size': 15 });
  axes(svg, W, Hh, P2, S2);
  svgNode('line', { x1: 50, y1: S2.Y(0), x2: W - 16, y2: S2.Y(0), stroke: COL.grey, 'stroke-dasharray': '2 3' }, svg);
  // sign regions under the line
  const posD = ptsD([[S2.X(0), S2.Y(0)], [S2.X(0), S2.Y(a)], [S2.X(zs), S2.Y(0)]], true);
  const negD = ptsD([[S2.X(zs), S2.Y(0)], [S2.X(1), S2.Y(-b)], [S2.X(1), S2.Y(0)]], true);
  if (lit === 'sign') { glowFill(svg, posD); glowFill(svg, negD); }
  else {
    svgNode('path', { d: posD, fill: COL.accentTint, 'data-item': 'mark', 'data-id': 'plus' }, svg);
    svgNode('path', { d: negD, fill: COL.soft2, 'data-item': 'mark', 'data-id': 'minus' }, svg);
  }
  if (lit === 'line') glowPath(svg, ptsD([[S2.X(0), S2.Y(a)], [S2.X(1), S2.Y(-b)]]), 12);
  svgNode('path', { d: ptsD([[S2.X(0), S2.Y(a)], [S2.X(1), S2.Y(-b)]]), stroke: COL.text2, 'stroke-width': 2.5, fill: 'none', 'data-item': 'mark', 'data-id': 'line' }, svg);
  haloTex(svg, S2.X(0.99), S2.Y(ym) + 9, String.raw`line $a-(a+b)z$`, { w: 160, anchor: 'end', size: 15, fill: COL.text2 });
  // the curve and its slope
  const curD = curveD(S1, g, 0, 1);
  if (lit === 'peak') { glowPath(svg, curveD(S1, g, 0, zs), 10); glowPath(svg, curveD(S1, g, zs, 1), 10); glowDot(svg, S1.X(zs), S1.Y(1), 11); }
  const zt0 = Math.max(0, z - 0.18), zt1 = Math.min(1, z + 0.18);
  const tanD = ptsD([[S1.X(zt0), S1.Y(g(z) + gp(z) * (zt0 - z))], [S1.X(zt1), S1.Y(g(z) + gp(z) * (zt1 - z))]]);
  const clip = plotClip(svg, S1, W);
  if (lit === 'slope') glowPath(svgNode('g', { 'clip-path': clip }, svg), tanD, 12);
  svgNode('path', { d: curD, stroke: COL.grey, 'stroke-width': 2.5, fill: 'none', 'data-item': 'mark', 'data-id': 'curve' }, svg);
  svgNode('path', { d: tanD, stroke: COL.accent, 'stroke-dasharray': DASH, 'stroke-width': 2, fill: 'none', 'clip-path': clip, 'data-item': 'mark', 'data-id': 'tangent' }, svg);
  dotAt(svg, S1, z, g(z), COL.accent, 'dot');
  svgTex(svg, 56, 44, '$g$', { w: 30, anchor: 'start', size: 15, fill: COL.ink });
  // the peak, through both panels
  if (lit === 'zero') { glowDot(svg, S2.X(zs), S2.Y(0), 11); glowPath(svg, ptsD([[S1.X(zs), S1.Y(1.1)], [S2.X(zs), S2.base]]), 8); }
  svgNode('line', { x1: S1.X(zs), y1: S1.Y(1.1), x2: S2.X(zs), y2: S2.base, stroke: COL.ink, 'stroke-dasharray': DASH, 'stroke-width': 1.5, 'data-item': 'mark', 'data-id': 'peak' }, svg);
  const right = zs < 0.6;
  haloTex(svg, S1.X(zs) + (right ? 6 : -6), S1.Y(1.17), String.raw`peak $\frac{a}{a+b}=` + zs.toFixed(3) + '$', { w: 220, anchor: right ? 'start' : 'end', size: 15, fill: COL.ink, ht: 30 });
  svgNode('circle', { cx: S2.X(z).toFixed(1), cy: S2.Y(line(z)).toFixed(1), r: 5, fill: COL.accent, 'data-item': 'mark', 'data-id': 'line-dot' }, svg);
}
function slideWhyPeak(widget, side) {
  let a = 3, b = 7, z = 0.2, lit = '';
  const sA = slider('$a$', { id: 'a', name: 'heads a', min: 1, max: 8, step: 1, value: a, onInput: v => { a = v; update(); } });
  const sB = slider('$b$', { id: 'b', name: 'tails b', min: 1, max: 8, step: 1, value: b, onInput: v => { b = v; update(); } });
  const sZ = slider('$z$', { id: 'z', name: 'heads chance z', min: 0.01, max: 0.99, step: 0.01, value: z, fmt: v => v.toFixed(2), onInput: v => { z = v; update(); } });

    tests: [

      String.raw`Try $a=2$, $b=3$: the top moves to $0.4$. Cases are evidence, not proof.`],
    model: String.raw`The slope is a positive factor times a straight line, and a line crosses zero once: one top.` });
  proofRight(side, {
    id: 'peak',
    goal: { words: String.raw`for whole $a,b\ge1$, $g(z)=z^a(1-z)^b$ rises up to $z=\frac{a}{a+b}$, then falls.` },
    facts: [
      { words: String.raw`product rule $(fg)'=f'g+fg'$, power rule`, ref: 'step 4' },
      { words: 'chain rule', ref: 'step 6' }],
    lines: [
      { tex: String.raw`g'=a\,z^{a-1}(1-z)^b-b\,z^a(1-z)^{b-1}`, move: 'Use an earlier result',
        why: String.raw`product and power rules; the chain rule on $(1-z)^b$ brings the $-1$`, choices: ['Unfold the definition', 'Rearrange'], highlight: 'slope' },
      { tex: String.raw`g'=z^{a-1}(1-z)^{b-1}\,\big[a-(a+b)z\big]`, move: 'Rearrange',
        why: String.raw`take out $z^{a-1}(1-z)^{b-1}$; then $a(1-z)-bz=a-(a+b)z$`, choices: ['Name a piece', 'Add zero or multiply by one'], highlight: 'line' },
      { tex: String.raw`z^{a-1}(1-z)^{b-1}>0\ \text{ for } 0<z<1`, move: 'Compare or bound',
        why: String.raw`so $g'$ has the sign of the line $a-(a+b)z$`, choices: ['Use symmetry', 'Take a limit'], highlight: 'sign' },
      { tex: String.raw`a-(a+b)z=0\iff z=\frac{a}{a+b}`, move: 'Rearrange',
        why: String.raw`add $(a+b)z$, then divide by $a+b$`, choices: ['Undo with the inverse', 'Contradiction'], highlight: 'zero' },
      { tex: String.raw`z<\tfrac{a}{a+b}:\ g'>0;\qquad z>\tfrac{a}{a+b}:\ g'<0`, move: 'Compare or bound',
        why: 'the line falls through zero once: the curve rises, then falls. A peak', choices: ['Induction', 'Take a limit'], highlight: 'peak' }],
    lookBack: [
      { q: 'Why check the sign, when the slope is already zero?',
        a: String.raw`Slope 0 also happens at a valley or a flat bend: $x^3$ has slope 0 at 0 and no peak there. The change from $+$ to $-$ is what makes a peak.` },
      { q: 'What does the peak mean for coins?',
        a: String.raw`After $a$ heads and $b$ tails, $\frac{a}{a+b}$ is the heads chance that makes what you saw most likely: the share of heads. This is maximum likelihood, the rule behind most model training.` }] },
    plot, key => { lit = key || ''; plot.redraw(); });

// ---------- step 10: partial derivatives ----------
function slidePartial(widget, side) {
  const X = [0, 1, 2], Y = [1, 3, 4];
  let a = 0.5, b = 1;
  const E = (aa, bb) => X.reduce((s, x, i) => s + (Y[i] - aa - bb * x) ** 2, 0);
  const dA = () => -2 * X.reduce((s, x, i) => s + (Y[i] - a - b * x), 0);
  const dB = () => -2 * X.reduce((s, x, i) => s + x * (Y[i] - a - b * x), 0);
  const sA = slider(String.raw`$a$, intercept`, { id: 'a', name: 'a', min: -1, max: 3, step: 0.001, value: a,
    fmt: v => '$a=' + v.toFixed(3) + '$', onInput: v => { a = v; update(); } });
  const sB = slider(String.raw`$b$, slope`, { id: 'b', name: 'b', min: -0.5, max: 3, step: 0.001, value: b,
    fmt: v => '$b=' + v.toFixed(3) + '$', onInput: v => { b = v; update(); } });
  const best = mark(h('button', 'btn'), 'control', 'best-fit');
  setTex(best, 'Best fit');
  best.addEventListener('click', () => {
    a = 1.167; b = 1.5;
    sA.input.value = a; sB.input.value = b; sA.show(); sB.show(); update();
  });
  const rDA = readout('da', String.raw`$\partial E/\partial a$`);
  const rDB = readout('db', String.raw`$\partial E/\partial b$`);
  const rL = readout('loss', String.raw`squared misses $E(a,b)$`);
  widget.append(legend([
    { color: COL.ink, text: String.raw`solid dots: the data $(0,1)$, $(1,3)$, $(2,4)$` },
    { color: COL.accent, text: String.raw`blue: the line $y=a+bx$` },
    { color: COL.grey, text: String.raw`grey: $E(a)$ with $b$ held` },
    { color: COL.accent, dash: true, text: String.raw`dashed: slope in $a$` },
  ]), hh('div', 'sliders', sA.el, sB.el), hh('div', 'btnrow', best));
  const cells = [h('div', 'cell'), h('div', 'cell')];
  widget.append(hh('div', 'twoplots', ...cells));
  const plotL = fillPlot(cells[0], drawLine);
  const plotR = fillPlot(cells[1], drawLoss);
  widget.append(hh('div', 'readouts', rDA.el, rDB.el, rL.el));
  function drawLine(svg, W, H) {
    const P = { x0: -0.3, x1: 2.4, y0: 0, y1: 5, xt: [0, 1, 2], yt: [0, 2, 4], xlabel: String.raw`$x$`, ylabel: String.raw`$y$` };
    const S = scaleOf(W, H, P);
    axes(svg, W, H, P, S);
    seg(svg, S, P.x0, a + b * P.x0, P.x1, a + b * P.x1, { stroke: COL.accent, 'stroke-width': 2.5 });
    X.forEach((x, i) => dotAt(svg, S, x, Y[i], COL.ink, 'point-' + i));
  }
  function drawLoss(svg, W, H) {
    const xs = [];
    for (let i = 0; i <= 100; i++) xs.push(-1 + 5 * i / 100);
    const top = Math.max(...xs.map(v => E(v, b)));
    const y1 = Math.max(4, Math.ceil(top / 10) * 10);
    const P = { x0: -1, x1: 4, y0: 0, y1: y1, xt: [-1, 0, 1, 2, 3, 4], yt: [0, y1 / 2, y1], xlabel: String.raw`$a$`, ylabel: String.raw`$E$` };
    const S = scaleOf(W, H, P);
    axes(svg, W, H, P, S);
    curve(svg, S, v => E(v, b), P.x0, P.x1, { stroke: COL.grey });
    const l0 = E(a, b), d0 = dA();
    seg(svg, S, a - 0.8, l0 + d0 * (-0.8), a + 0.8, l0 + d0 * 0.8, { stroke: COL.accent, 'stroke-dasharray': DASH, 'stroke-width': 2 });
    dotAt(svg, S, a, l0, COL.accent, 'dot');
  }
  function update() {
    rDA.set(dA().toFixed(2));
    rDB.set(dB().toFixed(2));
    rL.set(E(a, b).toFixed(3));
    plotL.redraw();
    plotR.redraw();
  }
  update();
  side.append(
    setTex(h('div', 'formula'), String.raw`$$\begin{aligned}\frac{\partial E}{\partial a}&=-2\sum_i (y_i-a-bx_i)\\ \frac{\partial E}{\partial b}&=-2\sum_i x_i\,(y_i-a-bx_i)\end{aligned}$$`),
    sym(String.raw`$E(a,b)=\sum_i (y_i-a-bx_i)^2$: the squared misses of the line. A partial derivative moves one knob and holds the other.`),
    triesList([
      String.raw`Set $a=0.5$, $b=1$. Both slopes are negative: raising $a$ or $b$ lowers $E$.`,
      String.raw`Hold $b=1$ and move $a$ until the dashed slope reads $0.00$. That is the lowest point of the grey curve.`,
      String.raw`Press Best fit. Both slopes read $0.00$: $a=7/6$, $b=3/2$, and $E=1/6$.`,
    ]),
    takeLine(String.raw`A partial derivative is one knob's slope with the other knobs held. At the bottom of the bowl, every partial is zero.`),
    setTex(h('p', 'note'), String.raw`Primer · Least squares, step 3 solves both $=0$.`),
  );
}

// ---------- step 11: why the partials of E are those sums (proof) ----------
function fmt2(v) { const s = String(+v.toFixed(2)); return s === '-0' ? '0' : s; }
function drawMisses(svg, W, Hh, a, b, mode, lit) {

  const a2 = m === 'a' ? a + STEP : a, b2 = m === 'b' ? b + STEP : b;
  const sum = r.reduce((s, v) => s + v, 0);
  const CAP = {
    misses: String.raw`amber: the misses $r_i=y_i-a-bx_i$, one per point`,
    shift: String.raw`amber: $a$ up by $0.5$ lowers every miss by $0.5$`,
    square: String.raw`amber: each squared miss has slope $2r_i\cdot(-1)$ in $a$`,
    sum: String.raw`amber: add them: $-2(` + r.map(fmt2).join('+').replace(/\+-/g, '-') + ')=' + fmt2(-2 * sum) + '$',
    tilt: String.raw`amber: $b$ up by $0.5$ lowers miss $i$ by $0.5\,x_i$` }[lit];
  plotTitle(svg, W, CAP || String.raw`dashed: the line after a step of $0.5$ in $` + m + '$', !!CAP);
  const P = { x0: -0.3, x1: 2.75, y0: -0.2, y1: 5.2, xt: [0, 1, 2], yt: [0, 2, 4], xlabel: '$x$', ylabel: '$y$' };
  const S = scaleOf(W, Hh, P, { L: 44, R: 12, T: 34, B: 40 });
  axes(svg, W, Hh, P, S);
  const clip = plotClip(svg, S, W);
  const g = svgNode('g', { 'clip-path': clip }, svg);
  X.forEach((x, i) => {
    const yl = a + b * x, yl2 = a2 + b2 * x;
    if (lit === 'misses') glowPath(g, ptsD([[S.X(x), S.Y(Y[i])], [S.X(x), S.Y(yl)]]), 12);

    ]),
    takeLine(String.raw`A degree-$k$ polynomial has constant $k$-th differences. The second difference is its curvature.`),
  );
}

// ---------- step 15: why degree k gives constant k-th differences (proof) ----------
function slideWhyDiff(widget, side) {
  const XS = [0, 1, 2, 3, 4, 5, 6];
  const FORM = { 2: ['x^2', '2x+1', '2', '0', '0'], 3: ['x^3', '3x^2+3x+1', '6x+6', '6', '0'], 4: ['x^4', '4x^3+6x^2+4x+1', '12x^2+24x+14', '24x+36', '24'] };
  const LAB = ['f', '\\Delta f', '\\Delta^2 f', '\\Delta^3 f', '\\Delta^4 f'];
  const FACT = { 2: 2, 3: 6, 4: 24 };
  const diff = arr => arr.slice(1).map((v, i) => v - arr[i]);
  let k = 3, lit = '';
  const chips = [2, 3, 4].map(d => {
    const b = mark(h('button', 'btn' + (d === k ? ' on' : '')), 'control', 'deg-' + d);
    setTex(b, '$x^' + d + '$');
    b.addEventListener('click', () => { k = d; draw(); });
    return b;
  });
  const cap = h('p', 'tcap');
  const table = h('div', 'dt dt-proof');
  const box = hh('div', 'tbox', cap, table);
  const rC = readout('const', 'the constant row');
  const rF = readout('fact', String.raw`$c\,k!$ with $c=1$`);
  const plot = proofLeft(widget, {
    controls: [hh('div', 'btnrow', ...chips)],
    box: box, redraw: () => draw(),
    legend: [
      { chip: true, color: COL.accent, text: 'blue cells: the constant row' },
      { chip: true, color: COL.soft, border: COL.line, text: 'grey: entries and their steps' }],
    readouts: [rC, rF],
    tests: [
      String.raw`Pick $x^3$: the rows read $3x^2+3x+1$, $6x+6$, $6$. Check one: $\Delta f(2)=27-8=19=3\cdot4+3\cdot2+1$.`,
      String.raw`Pick $x^4$ and guess the constant row before you look. Cases are evidence, not proof.`],
    model: String.raw`Each difference turns $x^k$ into $k\,x^{k-1}$ plus lower powers, as a slope does. So each row loses one degree, and after $k$ rows only a constant is left.` });
  function draw() {
    chips.forEach((b, i) => b.classList.toggle('on', [2, 3, 4][i] === k));
    const rows = [];
    let row = XS.map(x => Math.pow(x, k));
    rows.push(row);
    for (let j = 1; j <= 4; j++) { row = diff(row); rows.push(row); }
    table.replaceChildren();
    table.append(h('div', 'x', ''), ...XS.map(x => h('div', 'x', 'x=' + x)), h('div', 'x', 'as a polynomial'));
    rows.forEach((rw, j) => {
      const isConst = j === k, litRow = lit === 'const' && j === k;
      const lab = setTex(h('div', 'lab'), '$' + LAB[j] + '$');
      if (litRow) lab.classList.add('lit');
      table.append(lab);
      for (let i = 0; i < 7; i++) {
        const filled = i < rw.length;
        const c = h('div', 'c' + (filled ? (isConst ? ' const' : '') : ' empty'));
        c.textContent = filled ? String(rw[i]) : '';
        if (filled) c.dataset.item = 'cell';
        const litDiff = lit === 'diff' && ((j === 0 && (i === 2 || i === 3)) || (j === 1 && i === 2));
        if (filled && (litRow || litDiff)) c.classList.add('lit');
        table.append(c);
      }
      const fm = setTex(h('div', 'form'), '$' + FORM[k][j] + '$');
      if (lit === 'drop' || litRow || (lit === 'lead' && j === 1)) fm.classList.add('lit');
      table.append(fm);
    });
    const f2 = Math.pow(2, k), f3 = Math.pow(3, k);
    const CAP = {
      diff: String.raw`amber: $\Delta f(2)=f(3)-f(2)=` + f3 + '-' + f2 + '=' + (f3 - f2) + '$',
      lead: String.raw`amber: $\Delta x^{` + k + '}=' + FORM[k][1] + String.raw`$; it starts with $` + k + 'x^{' + (k - 1) + '}$',
      drop: 'amber: each row is a polynomial one degree lower',
      const: String.raw`amber: after $` + k + String.raw`$ rows, the constant $` + k + '!=' + FACT[k] + '$' }[lit];
    setTex(cap, CAP || 'each row lists the steps of the row above; on the right, the row as a polynomial in $x$');
    cap.classList.toggle('on', !!CAP);
    rC.set(String.raw`$\Delta^{` + k + String.raw`} f$ is all $` + rows[k][0] + '$');
    rF.set('$' + k + '!=' + FACT[k] + '$');
  }
  proofRight(side, {
    id: 'differences',
    goal: { tex: String.raw`\Delta^k p=c\,k!`, words: String.raw`at every $x$, for $p(x)=c\,x^k+$ lower powers.` },
    facts: [{ tex: String.raw`\Delta f(x)=f(x+1)-f(x)`, ref: 'step 13' }],
    lines: [
      { tex: String.raw`\Delta x^k=(x+1)^k-x^k`, move: 'Unfold the definition',
        why: 'the step from one entry to the next', choices: ['Name a piece', 'Change variables'], highlight: 'diff' },
      { tex: String.raw`(x+1)^k=x^k+k\,x^{k-1}+\text{lower powers}`, move: 'Rearrange',
        why: String.raw`multiply out $k$ factors $(x+1)$: take one $1$ and $k-1$ copies of $x$, in $k$ ways`, choices: ['Induction', 'Compute it two ways'], highlight: 'lead' },
      { tex: String.raw`\Delta\big(c\,x^k+\cdots\big)=c\,k\,x^{k-1}+\text{lower powers}`, move: 'Rearrange',
        why: String.raw`$x^k$ cancels; $\Delta$ of a sum is the sum of the $\Delta$s, and each lower power drops too`, choices: ['Telescope', 'Use symmetry'], highlight: 'drop' },
      { tex: String.raw`\Delta^k p=c\,k(k-1)\cdots1=c\,k!`, move: 'Induction',
        why: 'line 3 on each row: one degree less and one more factor, down to degree 0', choices: ['Use an earlier result', 'Take a limit'], highlight: 'const' }],
    lookBack: [
      { q: 'How is this like the slope?',
        a: String.raw`Slopes do the same with $h\to0$ in place of a step of 1: $x^k$ turns into exactly $k\,x^{k-1}$ (step 4). So taking the slope of $x^k$ $k$ times also leaves $k!$.` },
      { q: 'What happens one row further?',
        a: String.raw`$\Delta^{k+1}p=0$: the steps of a constant row are all 0 (see the bottom rows for $x^2$). A table whose rows never reach a constant is no polynomial.` }] },
    plot, key => { lit = key || ''; draw(); }, CLOSING);
  side.querySelector('fl-proof-steps').primerMoves = PRIMER_MOVES;
  side.querySelector('fl-proof-steps').endNote = NEXT;
  draw();
}

// The view's close. The primer's last proof lists every move the primer's proofs used, in order of first
// use, once it is proved, so the list never gives a pick away; the last step names what comes next.
const CLOSING = 'Look back: under the picture.';
const PRIMER_MOVES = ['Rearrange', 'Take a limit', 'Name a piece', 'Induction', 'Use an earlier result', 'Compare or bound', 'Add zero or multiply by one', 'Unfold the definition', 'Use symmetry'];
const NEXT = 'Next: Primer · Waves.';

// ---------- the slides, in order: id, title, tag, question, formula, mount ----------
const SLIDES = [
  { id: 'limit', title: 'A limit: the value a formula closes in on', tag: 'Used in L15 22:49 · L14 34:30 · L9 10:05',
    question: 'What is a limit, and why do we need one?',
    formula: String.raw`$\displaystyle \lim_{x\to 0}\frac{\sin x}{x}=1$`, mount: slideLimit },
  { id: 'secant', sideProof: true, title: 'The derivative: a slope you approach', tag: 'Used in L20 00:35 · L22 32:04',
    question: 'What is a derivative?',
    formula: String.raw`$s'(1)=\displaystyle\lim_{h\to 0}\frac{s(1+h)-s(1)}{h}$`, mount: slideSecant },
  { id: 'rules', title: 'Derivatives by rules, even for a machine', tag: 'Used in L7 12:28 · L20 06:49',
    question: 'Why can a machine take derivatives by rules?',
    formula: String.raw`$\dfrac{d}{dx}\,e^{u(x)}=e^{u(x)}\,u'(x)$`, mount: slideRules },
  { id: 'why-power-rule', proof: true, title: String.raw`Why it's true: $\frac{d}{dx}x^n=n\,x^{n-1}$`, tag: 'Used in L7 12:28 · L20 06:49',
    question: String.raw`Why does the slope of $x^n$ come out as $n\,x^{n-1}$?`, mount: slideWhyPower },
  { id: 'why-exp-slope', proof: true, title: String.raw`Why it's true: $\frac{d}{dx}e^x=e^x$`, tag: 'Used in L7 12:28 · L20 06:49',
    question: String.raw`Why is the slope of $e^x$ equal to $e^x$ itself?`, mount: slideWhyExp },
  { id: 'why-chain-rule', proof: true, title: String.raw`Why it's true: $\frac{d}{dx}f(u(x))=f'(u)\,u'(x)$`, tag: 'Used in L7 12:28 · L20 06:49',
    question: 'Why do the slopes multiply when one function sits inside another?', mount: slideWhyChain },
  { id: 'maximum', title: 'Finding a peak: set the slope to zero', tag: 'Used in L2 ch.',
    question: 'How do you find a maximum?',
    formula: String.raw`$\dfrac{d}{dz}\,z^a(1-z)^b=0$ at $z=\dfrac{a}{a+b}$`, mount: slideMaximum },
  { id: 'why-peak', proof: true, title: String.raw`Why it's true: the peak is at $z=\frac{a}{a+b}$`, tag: 'Used in L2 ch.',
    question: String.raw`Why is the top exactly at $a/(a+b)$, and how do we know it is a top?`, mount: slideWhyPeak },
  { id: 'partial', title: 'Partial derivatives: one knob at a time', tag: 'Used in L14 27:38-32:58 · L6 41:32',
    question: 'What is a partial derivative?',
    formula: null, mount: slidePartial },
  { id: 'why-partials', proof: true, title: String.raw`Why it's true: $\frac{\partial E}{\partial a}=-2\sum_i(y_i-a-bx_i)$`, tag: 'Used in L14 27:38-32:58 · L6 41:32',
    question: String.raw`Where do the $-2$, the sum, and the extra $x_i$ in $\partial E/\partial b$ come from?`, mount: slideWhyPartials },
  { id: 'tangent', title: 'The tangent line, and where it fails', tag: 'Used in L18 12:16 · L18 22:08',
    question: 'What is the tangent line good for, and when does it fail?',
    formula: null, mount: slideTangent },
  { id: 'why-tangent-gap', proof: true, title: String.raw`Why it's true: the gap is $\frac{x^2}{1+x}$`, tag: 'Used in L18 12:16 · L18 22:08',
    question: String.raw`Why is $1-x$ the tangent, and why is its miss about $x^2$?`, mount: slideWhyGap },
  { id: 'differences', title: 'Differences: the derivative of a table', tag: 'Used in L3 12:36-13:08 · L20 23:30',
    question: 'What are differences, and what do they tell you about a table?',
    formula: String.raw`$\Delta f(x)=f(x+1)-f(x)$`, mount: slideDifferences },
  { id: 'why-differences', proof: true, title: String.raw`Why it's true: degree $k$ gives constant $k$-th differences`, tag: 'Used in L3 12:36-13:08 · L20 23:30',
    question: 'Why does each difference lower the degree by one, and which constant is left?', mount: slideWhyDiff },
];

let cur = 0, shownId = null, endSent = false;
function goTo(i) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  if (shownId !== null && shownId !== s.id) emit('view.step', { step: s.id });
  shownId = s.id;
  const stage = $('#stage');
  stage.innerHTML = '';
  PLOTS = [];
  COL = readPalette();
  const widget = h('div', 'widget');
  const side = hh('div', 'side' + (s.sideProof ? ' with-proof' : ''),
    h('div', 'tag', s.tag),
    setTex(h('h2'), s.title),
    setTex(h('p', 'question'), s.question),
    s.formula ? setTex(h('div', 'formula'), s.formula) : null);
  const sec = mark(h('section', 'slide' + (s.proof ? ' proof-slide' : '')), 'step', s.id, s.title.replace(/\$/g, ''));
  sec.append(widget, side);
  stage.append(sec);
  stage.scrollTop = 0;
  s.mount(widget, side);
  if (cur === SLIDES.length - 1) {
    if (!endSent) { endSent = true; emit('view.action', { action: 'deck-end' }); }
  }
  tex(sec);
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, i) => d.classList.toggle('on', i === cur));
}
// A cue is a state: go to the named step, and do nothing if it is already shown.
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i >= 0 && i !== cur) goTo(i);
}
(function init() {
  const dots = $('#dots');
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = s.title.replace(/\$/g, '');
    b.addEventListener('click', () => goTo(i));
    dots.appendChild(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],textarea,select')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Lecture 2 review: digits, limits and S-curves</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../../components/theme.js"></script>
<style>
/* Colors: grey for exact values and inputs, blue for outputs and the reader's choice,
   amber for what the newest proof line is about, red only for a failed check. */
:root{
  --tint:#f9fafb;                     /* light only: no palette entry; dark is --pal-soft below */
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft); --red:var(--pal-red);
  --u:clamp(16px,1.35vw,20px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 24px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(6px,1vh,12px) 24px;overflow:hidden}
footer{display:flex;align-items:center;gap:10px;padding:8px 24px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Content slide: widget on the left (3/5), text on the right (2/5). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(18px,2.4vw,40px)}
.widget{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(5px,0.9vh,9px);overflow:hidden}
.widget>*{max-width:100%;min-width:0}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(6px,1.1vh,12px);overflow:hidden}
.tag{font:14px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(20px,1.9vw,28px);line-height:1.2;margin:0;font-weight:650}
.question{margin:0;font-size:clamp(16px,1.3vw,18px);font-weight:600}
.formula{font-size:clamp(17px,1.5vw,22px)}
.sym{margin:0;font-size:16px;color:var(--muted)}
.tries{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.tries li::marker{color:var(--accent);font-weight:600}
.where{margin:0;font-size:16px}
.where b{color:var(--accent)}
.takeaway{margin:0;padding:10px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px;transition:opacity .2s}

/* Controls and readouts */
.sliders{display:flex;gap:8px 22px;flex-wrap:wrap;width:100%;align-items:center}
.slide-ctl{display:flex;align-items:center;gap:8px;font-size:16px}
.slide-ctl input{width:clamp(110px,10vw,160px);vertical-align:middle;accent-color:var(--accent)}
.slide-ctl .val{min-width:50px;white-space:nowrap}
.btn{font:inherit;padding:5px 11px;border:1px solid var(--line);background:var(--pal-panel);border-radius:8px;cursor:pointer;font-size:16px;line-height:1.3}
.btn.on{background:var(--chip);border-color:var(--accent);color:var(--pal-accent-deep)}
.btn:disabled{color:var(--muted);cursor:default;opacity:.6}
.btnrow{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap}
.btnrow .lab{font-size:16px;color:var(--muted);margin-right:2px}
.readouts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.readout{flex:1 1 120px;min-width:0;padding:3px 8px;border-radius:10px;background:var(--pal-soft);font-size:15px;overflow-wrap:anywhere}
.readout .k{color:var(--muted);font-size:14px}
.readout .val{font-size:16px;font-weight:600}
.legend{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:15px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:20px;height:0;vertical-align:middle;margin-right:6px}
.chip{display:inline-block;width:18px;height:12px;vertical-align:middle;margin-right:6px;border-radius:2px}
.note{min-height:34px;display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;font-size:16px;padding:2px 10px;border-radius:8px;background:var(--tint);border:1px solid var(--pal-soft-2)}
.note.ask{background:var(--pal-amber-row);border-color:var(--pal-amber-bg)}
.note .good{color:var(--accent);font-weight:600}

/* Plots fill the space left in the widget column */
.fill{flex:1 1 0;min-height:120px;position:relative;width:100%}
.fill>svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* Proof slides: test and picture on the left, the proof (fl-proof-steps) on the right */
.slide.proof-slide{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(18px,2.2vw,34px)}
.slide.proof-slide h2{font-size:clamp(20px,1.75vw,26px)}
.slide.proof-slide .side{gap:clamp(4px,0.8vh,9px)}
.slide.proof-slide .side{justify-content:flex-start}
.slide.proof-slide .slide-ctl input{width:clamp(90px,8vw,130px)}
.slide.proof-slide .slide-ctl .val{min-width:40px}
.slide.proof-slide .sliders{gap:6px 14px}
.slide.proof-slide .fill{min-height:180px}
.readouts.inline .readout{display:flex;gap:4px 8px;align-items:baseline;flex-wrap:wrap}
.part{margin:0;font-weight:600;color:var(--muted)}
.test{display:flex;flex-direction:column;gap:3px;font-size:16px}
.test .tries{gap:3px}
.model{margin:0;padding:7px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}

/* Decision slides: the problem, three cards and the reveal on the left; question, try-steps,
   AI echo and takeaway on the right. */
.slide.decision{grid-template-columns:minmax(0,2.05fr) minmax(0,1fr);gap:clamp(20px,2.6vw,40px)}
.decision .widget{gap:6px}
.decision .side{justify-content:space-evenly;gap:clamp(8px,1.8vh,18px)}
.decision h2{font-size:clamp(23px,2.3vw,32px)}
.decision .q{margin:0;font-size:clamp(17px,1.55vw,21px);font-weight:600;line-height:1.35}
.decision .fx{margin:0;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--tint);font-size:clamp(17px,1.6vw,22px);line-height:1.4}
.decision .kicker{font-size:14px;color:var(--muted);margin:0 0 3px}
.decision .blk{display:flex;flex-direction:column;gap:3px}
.decision .ai{margin:0;font-size:16px;line-height:1.4}
.decision .ai .src{color:var(--muted);font-size:14px}
.decision .takeaway{padding:11px 14px;line-height:1.4}
.decision .tries{gap:6px;font-size:clamp(16px,1.35vw,18px);line-height:1.4}
.decision .hold{color:var(--muted);font-style:italic;background:var(--tint);border:1px dashed var(--line);border-radius:6px;padding:9px 12px;margin:0;font-size:16px;line-height:1.4}
.prob{flex:0 0 auto;border:1px solid var(--line);border-radius:10px;padding:6px 14px;background:var(--tint);font-size:16px;line-height:1.4}
.prob .lead{font-weight:650;color:var(--muted)}
.prob p{margin:0}
.opts{flex:0 0 auto;display:flex;flex-direction:column;gap:clamp(4px,0.5vw,8px)}
.opt{display:grid;grid-template-columns:minmax(0,0.78fr) minmax(0,1.22fr);gap:0 14px;padding:clamp(6px,0.7vw,10px) 12px;border:1px solid var(--line);border-radius:10px;background:var(--pal-panel);color:inherit;text-align:left;cursor:pointer;min-width:0;font:inherit}
.opt .lhs{display:flex;flex-direction:column;gap:3px;min-width:0}
.opt .rhs{display:flex;flex-direction:column;gap:3px;min-width:0;border-left:1px solid var(--pal-soft-2);padding-left:14px}
.opt:not([aria-disabled="true"]):hover{border-color:var(--accent)}
.opt[aria-disabled="true"]{cursor:default}
.opt .top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:16px}
.opt .letter{font-weight:700;color:var(--accent)}
.opt .who{font-size:14px;color:var(--muted);text-align:right}
.opt .body{font-size:clamp(16px,1.4vw,19px);line-height:1.3}
.opt .asm{margin:0;font-size:clamp(16px,1.3vw,18px);line-height:1.33;color:var(--muted)}
.opt .verdict{font-size:clamp(16px,1.3vw,18px);line-height:1.33;color:var(--fg)}
.opt .verdict.idle{color:var(--muted);font-style:italic}
.opt.on{box-shadow:inset 0 0 0 2px var(--pal-ink)}
.opt.chooser{background:var(--chip);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.opt.chooser .who{color:var(--pal-accent-deep);font-weight:600}
.reveal{flex:1 1 auto;min-height:0;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:clamp(16px,1.25vw,18px);display:flex;flex-direction:column;justify-content:center;gap:6px}
.reveal.idle{background:var(--tint);color:var(--muted)}
.rv{margin:0;line-height:1.38}
.rv .k{font-weight:650;color:var(--accent)}
.rv .t{color:var(--muted);font-size:14px;white-space:nowrap}
.rv.hold{color:var(--muted)}
.decision .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px}
.decision .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--pal-on-accent);padding:6px 16px}

:root[data-fluid-theme="dark"]{--tint:var(--pal-soft)}

/* Short windows (1100x620 and similar): tighter spacing, body text stays 16px */
@media (max-height: 680px){
  header{padding-top:4px}
  #stage{padding:4px 24px}
  footer{padding:4px 24px}
  .widget{gap:4px}
  .side{gap:4px}
  .tries{gap:2px}
  .sym,.where,.tries,.test,.model{line-height:1.22}
  .readout{padding:2px 8px}
  .takeaway{padding:6px 10px}
  .formula{font-size:18px}
  h2{font-size:20px}
  .fill{min-height:100px}
  .note{min-height:30px;padding:1px 8px}
  .model{padding:5px 10px}
  .btn{padding:3px 9px}
  .slide-ctl input{width:100px}
  .slide.proof-slide .slide-ctl input{width:64px}
  .slide.proof-slide .slide-ctl .val{min-width:30px}
  .slide.proof-slide .sliders{gap:4px 10px}
  .slide.proof-slide .fill{min-height:165px}
  .decision h2{font-size:23px}
  .decision .side{gap:7px}
  .decision .tries{gap:2px;line-height:1.3}
  .decision .takeaway{padding:7px 12px}
  .reveal{gap:3px;padding:5px 12px}
  .rv{line-height:1.28}
  .opts{gap:3px}
  .opt{padding:4px 12px}
  .opt .body,.opt .asm,.opt .verdict{line-height:1.25}
  .prob{padding:4px 12px;line-height:1.3}
}
</style>
</head>
<body>
<header id="head">Lecture 2 review · Foundations of the digital revolution</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script src="../../components/proof-steps.js"></script>
<script>

// ---------- numbers (checked with node and python: see lectures/02-foundations-of-the-digital-discrete-revolution/design.md) ----------
const PI = Math.PI;
// A number with d decimals, without a minus sign on zero.
const fixed = (v, d) => (Math.abs(v) < 0.5 * Math.pow(10, -d) ? 0 : v).toFixed(d);
// A small positive number for KaTeX: 0.318, or 1.72\times10^{-5}.
function sci(v) {
  if (v === 0) return '0';
  if (v >= 0.001) return v.toFixed(3);
  let e = Math.floor(Math.log10(v)), m = v / Math.pow(10, e);
  if (m >= 9.995) { m = 1; e += 1; }
  return m.toFixed(2) + '\\times10^{' + e + '}';
}
// erfc with a relative error below 1.2e-7 for x >= 0 (Numerical Recipes erfcc), so tiny tails stay right.
function erfcc(z) {
  const t = 1 / (1 + 0.5 * z);
  return t * Math.exp(-z * z - 1.26551223 + t * (1.00002368 + t * (0.37409196 + t * (0.09678418 +
    t * (-0.18628806 + t * (0.27886807 + t * (-1.13520398 + t * (1.48851587 +
    t * (-0.82215223 + t * 0.17087277)))))))));
}
// Q(x): the chance that standard normal noise is above x.
const Qf = x => 0.5 * erfcc(x / Math.SQRT2);
// Analog chain: noise power adds stage after stage. Signal power 1, noise power s*s per stage.
const snrDb = (n, s) => 10 * Math.log10(1 / (n * s * s));
// Digital chain: each repeater errs with p = Q(0.5/s) (the decision is at half the pulse height).
// Chance that some bit is wrong after n repeaters: 1 - (1-p)^n, computed without rounding to 1.
const digitalErr = (n, s) => -Math.expm1(n * Math.log1p(-Qf(0.5 / s)));
// Exponential y' = k y, and logistic y' = k y (L - y) with y(0) = 1: y = L / (1 + (L-1) e^{-kLt}).
const expo = (t, k) => Math.exp(k * t);
const logi = (t, k, L) => L / (1 + (L - 1) * Math.exp(-k * L * t));
// Rescaled logistic: z' = z(1-z) has z(tau) = A e^tau / (1 + A e^tau), A = z0/(1-z0).
const Sz = (tau, A) => A * Math.exp(tau) / (1 + A * Math.exp(tau));
// Gamma (Lanczos, g = 7) and the Beta function, for the total time from z = 0 to z = 1.
function gammaFn(x) {
  const c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
    -176.61503916999385, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  if (x < 0.5) return PI / (Math.sin(PI * x) * gammaFn(1 - x));
  x -= 1;
  let a = c[0];
  const t = x + 7.5;
  for (let i = 1; i < 9; i++) a += c[i] / (x + i);
  return Math.sqrt(2 * PI) * Math.pow(t, x + 0.5) * Math.exp(-t) * a;
}
// Time from z = 0 to z = 1 for z' = z^a (1-z)^b: the integral of 1/(z^a (1-z)^b), which is B(1-a, 1-b).
// It is finite only when a < 1 and b < 1.
const totalTime = (a, b) => (a < 1 && b < 1) ? gammaFn(1 - a) * gammaFn(1 - b) / gammaFn(2 - a - b) : null;
// Steepest point and its slope for z' = z^a (1-z)^b.
const steepZ = (a, b) => a / (a + b);
const steepSlope = (a, b) => Math.pow(a, a) * Math.pow(b, b) / Math.pow(a + b, a + b);
// Solution by Runge-Kutta 4 from (0, z0); h < 0 runs backward. The value stays inside (0, 1).
const clampZ = z => Math.min(1 - 1e-9, Math.max(1e-9, z));
function trace(f, z0, h, n) {
  const out = [[0, z0]];
  let z = z0, t = 0;
  for (let i = 0; i < n; i++) {
    const k1 = f(z), k2 = f(clampZ(z + h * k1 / 2)), k3 = f(clampZ(z + h * k2 / 2)), k4 = f(clampZ(z + h * k3));
    z = clampZ(z + h * (k1 + 2 * k2 + 2 * k3 + k4) / 6);
    t += h;
    out.push([t, z]);
  }
  return out;
}
// The time at which a monotone path first reaches level v (linear interpolation), or null.
function crossing(pts, v) {
  for (let i = 0; i + 1 < pts.length; i++) {
    const [t0, z0] = pts[i], [t1, z1] = pts[i + 1];
    if ((z0 - v) * (z1 - v) <= 0 && z1 !== z0) return t0 + (v - z0) * (t1 - t0) / (z1 - z0);
  }
  return null;
}

// ---------- palette (theme.js): read at paint time, redraw on a theme switch ----------
let COL = {};                       // palette for the SVG being drawn
const PAL_NAMES = ['ink', 'text-2', 'muted', 'grid', 'line', 'grey', 'accent', 'panel', 'bg',
  'amber', 'amber-bg', 'amber-ink'];
function readPalette() {
  const o = {};
  for (const n of PAL_NAMES) o[n.replace(/-(\w)/g, (_, c) => c.toUpperCase())] = FluidTheme.color(n);
  return o;
}
let PLOTS = [];                     // the current slide's plots
window.addEventListener('fluid-themechange', () => PLOTS.forEach(p => p.redraw()));

// ---------- DOM and drawing helpers ----------
const $ = s => document.querySelector(s);
const NSV = 'http://www.w3.org/2000/svg', NHT = 'http://www.w3.org/1999/xhtml';
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false } ], throwOnError: false };
// Render $...$ in a node. If the CDN did not load, the text stays as typed.
function tex(node) {
  if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH);
  return node;
}
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function hh(tag, cls, ...kids) {
  const e = h(tag, cls);
  for (const k of kids) if (k) e.append(k);
  return e;
}
function mark(e, kind, id, title) {
  e.dataset.item = kind;
  if (id != null) e.dataset.id = id;
  if (title != null) e.dataset.title = title;
  return e;
}
function svgNode(tag, attrs, parent) {
  const e = document.createElementNS(NSV, tag);
  for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function svgRoot(w, ht) {
  return svgNode('svg', { viewBox: '0 0 ' + w + ' ' + ht, role: 'img', 'font-family': 'system-ui, sans-serif', 'font-size': 14 });
}
function svgText(parent, x, y, s, attrs) {
  const t = svgNode('text', Object.assign({ x: x, y: y, fill: COL.muted, 'font-size': 14 }, attrs || {}), parent);
  t.textContent = s;
  return t;
}
// A KaTeX label over an SVG: a foreignObject holding a rendered formula. o.bg paints a background.
function svgTex(parent, x, y, s, o) {
  o = o || {};
  const w = o.w || 220, ht = o.ht || 26, anchor = o.anchor || 'middle';
  const x0 = anchor === 'end' ? x - w : anchor === 'start' ? x : x - w / 2;
  const fo = svgNode('foreignObject', { x: x0, y: y - ht / 2, width: w, height: ht }, parent);
  const d = document.createElementNS(NHT, 'div');
  const jc = anchor === 'end' ? 'flex-end' : anchor === 'start' ? 'flex-start' : 'center';
  d.setAttribute('style', 'display:flex;align-items:center;height:100%;white-space:nowrap;font-size:' +
    (o.size || 15) + 'px;color:' + (o.fill || COL.text2) + ';justify-content:' + jc);
  const span = document.createElementNS(NHT, 'span');
  span.textContent = s;
  if (o.bg) span.setAttribute('style', 'background:' + o.bg + ';border-radius:5px;padding:1px 5px');
  if (o.halo) span.setAttribute('style', 'text-shadow:0 0 3px ' + COL.bg + ',0 0 3px ' + COL.bg + ',0 0 2px ' + COL.bg);
  d.appendChild(span);
  fo.appendChild(d);
  tex(span);
  return fo;
}
const haloTex = (parent, x, y, s, o) => svgTex(parent, x, y, s, Object.assign({ halo: true }, o || {}));
function path(svg, pts, attrs, close) {
  const d = 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L') + (close ? 'Z' : '');
  return svgNode('path', Object.assign({ d: d, fill: 'none' }, attrs), svg);
}
function dot(svg, x, y, color, r) {
  return svgNode('circle', { cx: x, cy: y, r: r || 5, fill: color, stroke: COL.panel, 'stroke-width': 1.5 }, svg);
}
// Tick label: KaTeX if it has $, plain text otherwise.
function tick(svg, x, y, s, anchor) {
  return s.indexOf('$') >= 0 ? svgTex(svg, x, y, s, { w: 80, size: 14, anchor: anchor || 'middle', fill: COL.muted }) :
    svgText(svg, x, y + 5, s, { 'text-anchor': anchor || 'middle' });
}
// A labelled range input. label and the value text are LaTeX-ready.
function slider(label, o) {
  const wrap = h('label', 'slide-ctl');
  const lab = tex(h('span', '', label));
  const val = h('span', 'val', '');
  const inp = h('input');
  inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step; inp.value = o.value;
  mark(inp, 'control', o.id, o.name || o.id);
  wrap.append(lab, inp, val);
  const fmtv = o.fmt || String;
  const api = {
    el: wrap, input: inp,
    get value() { return +inp.value; },
    set(v) { inp.value = v; api.show(); },
    show() { setTex(val, fmtv(+inp.value)); },
  };
  inp.addEventListener('input', () => { api.show(); if (o.onInput) o.onInput(+inp.value); });
  api.show();
  return api;
}
// A readout box: label and value are LaTeX-ready text.
function readout(id, label) {
  const box = mark(h('div', 'readout'), 'readout', id);
  const k = h('div', 'k');
  setTex(k, label);
  const v = h('div', 'val');
  box.append(k, v);
  return { el: box, set(text) { setTex(v, text); }, label(text) { setTex(k, text); } };
}
function legend(items) {
  const d = h('div', 'legend');
  for (const it of items) {
    const s = h('span');
    const sw = it.chip ? h('span', 'chip') : h('span', 'sw');
    if (it.chip) { sw.style.background = it.color; if (it.ring) { sw.style.background = 'var(--pal-panel)'; sw.style.border = '2px solid ' + it.color; sw.style.borderRadius = '50%'; sw.style.width = '13px'; sw.style.height = '13px'; } }
    else sw.style.borderTop = (it.width || 2) + 'px ' + (it.dash ? 'dashed' : 'solid') + ' ' + it.color;
    const t = h('span');
    setTex(t, it.text);
    s.append(sw, t);
    d.appendChild(s);
  }
  return d;
}
// A plot that takes the height left in its box. draw(svg, W, H) runs on every resize and may
// return a geometry object (wrap._geo) that the pointer handlers use.
function fillPlot(box, draw) {
  const wrap = h('div', 'fill');
  box.append(wrap);
  let key = '';
  const paint = force => {
    const w = Math.floor(wrap.clientWidth), ht = Math.floor(wrap.clientHeight);
    if (w < 60 || ht < 60) return;
    if (!force && key === w + 'x' + ht) return;
    key = w + 'x' + ht;
    COL = readPalette();
    const svg = svgRoot(w, ht);
    wrap._geo = draw(svg, w, ht) || null;
    wrap.replaceChildren(svg);
  };
  new ResizeObserver(() => paint(false)).observe(wrap);
  const plot = { wrap, redraw: () => paint(true) };
  PLOTS.push(plot);
  return plot;
}
function sym(text) { return setTex(h('p', 'sym'), text); }
function triesList(items) { return hh('ol', 'tries', ...items.map(t => setTex(h('li'), t))); }
function takeLine(text) { return setTex(h('p', 'takeaway'), text); }
function noticeLine(text) { const p = h('p', 'where'); p.append(h('b', '', 'Notice: ')); p.append(setTex(h('span'), text)); return p; }
// Session events. With no bridge, nothing is sent and the view still works.
function emit(kind, data) {
  try {
    if (window.fluid && typeof window.fluid.emit === 'function') Promise.resolve(window.fluid.emit(kind, data)).catch(() => {});
  } catch (e) { /* no bridge */ }
}

// ---------- proof slides: shared parts ----------
// Amber marks what the newest proof line is about, in the picture and in the proof.
function glowPath(svg, pts, wdt) {
  return path(svg, pts, { stroke: COL.amberBg, 'stroke-width': wdt || 12, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
}
function glowFill(svg, pts) {
  return path(svg, pts, { fill: COL.amberBg, 'fill-opacity': .9, stroke: COL.amber, 'stroke-width': 1.5 }, true);
}
function glowDot(svg, x, y, r) {
  return svgNode('circle', { cx: x, cy: y, r: r || 9, fill: COL.amberBg, stroke: COL.amber, 'stroke-width': 1.5 }, svg);
}
// While a proof line is lit, a caption in the top row says what the amber part is.
function litCaption(svg, W, text) { svgTex(svg, W / 2, 13, text, { w: W - 8, size: 15, fill: COL.amberInk, bg: COL.amberBg }); }
function plainCaption(svg, W, text) { svgTex(svg, W / 2, 13, text, { w: W - 8, size: 14, fill: COL.muted }); }
// Left column of a proof slide: controls, the picture, legend, readouts, the test, the model.
function proofLeft(widget, o) {
  for (const row of o.controls || []) widget.append(row);
  const plot = fillPlot(widget, o.draw);
  widget.append(legend(o.legend));
  if (o.readouts && o.readouts.length) widget.append(hh('div', 'readouts' + (o.inline ? ' inline' : ''), ...o.readouts.map(r => r.el)));
  const test = hh('div', 'test', h('p', 'part', 'Test it'), triesList(o.tests));
  const model = h('p', 'model');
  model.append(h('span', 'part', 'The picture: '), setTex(h('span'), o.model));
  widget.append(test, model);
  return { redraw: plot.redraw, wrap: plot.wrap, test: test };
}
// Right column: the proof. Each revealed line lights its part of the picture; once the proof is
// done, the look-back questions take the place of the test under the picture.
function proofRight(side, spec, plot, onLight) {
  const el = document.createElement('fl-proof-steps');
  el.onEvent = d => emit('view.action', d);
  el.onHighlight = key => onLight(key);
  el.lookBackHost = plot.test;
  el.lookBackHint = 'Look back: under the picture.';
  el.data = spec;
  side.append(el);
  return el;
}


// ---------- plot axes shared by the slides ----------
// g: x0, x1, y0, y1; xt, yt tick values; fx, fy tick text makers; xl, yl labels (KaTeX ready);
// ox, wd: the panel's left edge and width, for two panels in one plot.
function axesFrame(svg, W, H, g) {
  const Lm = 56, Rm = 14, Tm = 28, Bm = 44;
  const ox = g.ox || 0, wd = g.wd || W;
  const X = v => ox + Lm + (v - g.x0) / (g.x1 - g.x0) * (wd - Lm - Rm);
  const Y = v => H - Bm - (v - g.y0) / (g.y1 - g.y0) * (H - Tm - Bm);
  svgNode('rect', { x: ox + Lm, y: Tm, width: wd - Lm - Rm, height: H - Tm - Bm, fill: COL.panel, stroke: COL.line }, svg);
  for (const v of g.xt || []) {
    svgNode('line', { x1: X(v), x2: X(v), y1: Tm, y2: H - Bm, stroke: COL.grid }, svg);
    tick(svg, X(v), H - Bm + 14, g.fx ? g.fx(v) : String(v), 'middle');
  }
  for (const v of g.yt || []) {
    svgNode('line', { x1: ox + Lm, x2: ox + wd - Rm, y1: Y(v), y2: Y(v), stroke: COL.grid }, svg);
    tick(svg, ox + Lm - 6, Y(v), g.fy ? g.fy(v) : String(v), 'end');
  }
  if (g.xl) svgTex(svg, ox + wd - Rm, H - 10, g.xl, { w: 260, size: 15, anchor: 'end', fill: COL.text2 });
  if (g.yl) svgTex(svg, ox + Lm, 13, g.yl, { w: 300, size: 15, anchor: 'start', fill: COL.text2 });
  return { X, Y, W, H, Lm, Rm, Tm, Bm, x0: g.x0, x1: g.x1, y0: g.y0, y1: g.y1 };
}
// The content slide's tail: the formula, the try-steps, and the takeaway (dimmed until a control moves).
function contentSide(side, o) {
  if (o.formula) side.append(setTex(h('div', 'formula'), o.formula));
  side.append(h('p', 'part', 'Try it'), triesList(o.tries), takeLine(o.takeaway));
}

// ---------- content: the amplifier chain ----------
function slideChain(widget, side) {
  let n = 60, s = 0.1;
  const sN = slider(String.raw`$n$`, { id: 'stages', name: 'number of stages', min: 1, max: 60, step: 1, value: n, fmt: v => '$' + v + '$', onInput: v => { n = v; update(); } });
  const sS = slider(String.raw`$\sigma$`, { id: 'sigma', name: 'noise per stage, as a share of the pulse height', min: 0.05, max: 0.5, step: 0.01, value: s, fmt: v => '$' + v.toFixed(2) + '$', onInput: v => { s = v; update(); } });
  const rA = readout('analog', String.raw`analog SNR after $n$ stages`);
  const rD = readout('digital', String.raw`digital: chance one bit is wrong`);
  widget.append(hh('div', 'sliders', sN.el, sS.el));
  const plot = fillPlot(widget, draw);
  widget.append(legend([
    { color: 'var(--pal-accent)', width: 3, text: String.raw`blue, left: analog SNR after $n$ stages` },
    { color: 'var(--pal-text-2)', width: 3, text: String.raw`solid line, right: digital chance a bit is wrong, log scale` },
    { color: 'var(--pal-muted)', width: 2, dash: true, text: String.raw`dashed, left: $0$ dB, signal equal to noise` }]),
    hh('div', 'readouts', rA.el, rD.el));
  function draw(svg, W, H) {
    const half = (W - 14) / 2;
    const xt = [1, 10, 20, 30, 40, 50, 60];
    const a = axesFrame(svg, W, H, { ox: 0, wd: half, x0: 1, x1: 60, y0: -10, y1: 30, xt, yt: [-10, 0, 10, 20, 30], xl: String.raw`$n$: stages`, yl: 'analog: SNR in dB' });
    svgNode('line', { x1: a.X(1), x2: a.X(60), y1: a.Y(0), y2: a.Y(0), stroke: COL.muted, 'stroke-width': 2, 'stroke-dasharray': '6 5' }, svg);
    const pa = [];
    for (let k = 1; k <= 60; k++) pa.push([a.X(k), a.Y(snrDb(k, s))]);
    path(svg, pa, { stroke: COL.accent, 'stroke-width': 3 });
    dot(svg, a.X(n), a.Y(snrDb(n, s)), COL.accent, 6);
    const b = axesFrame(svg, W, H, { ox: half + 14, wd: half, x0: 1, x1: 60, y0: -30, y1: 0, xt, yt: [-30, -20, -10, 0], fy: v => '$10^{' + v + '}$', xl: String.raw`$n$: repeaters`, yl: 'digital: chance a bit is wrong' });
    const pd = [];
    for (let k = 1; k <= 60; k++) pd.push([b.X(k), b.Y(Math.max(-30, Math.log10(digitalErr(k, s))))]);
    path(svg, pd, { stroke: COL.text2, 'stroke-width': 3 });
    dot(svg, b.X(n), b.Y(Math.max(-30, Math.log10(digitalErr(n, s)))), COL.text2, 6);
    return null;
  }
  function update() {
    rA.set('$' + snrDb(n, s).toFixed(1) + '\\,\\mathrm{dB}$');
    rD.set('$' + sci(digitalErr(n, s)) + '$');
    plot.redraw();
  }
  update();
  contentSide(side, {
    formula: String.raw`$$\begin{aligned}\mathrm{SNR}_n&=\frac{1}{n\sigma^2}\\ p&=Q\!\left(\frac{1}{2\sigma}\right)\\ \text{chain error}&=1-(1-p)^n\end{aligned}$$`,
    tries: [
      String.raw`Set $n=60$ and $\sigma=0.10$. Which readout is worse at the far end?`,
      String.raw`Raise $\sigma$ to $0.30$. Predict which readout breaks first.`,
      String.raw`Set $n=1$. One repeater alone errs on about $5\%$ of bits.`],
    takeaway: 'Digital keeps every bit right while the noise per stage stays small; analog loses a little at every stage.' });
}

// ---------- content: exponential against logistic ----------
function slideExp(widget, side) {
  let k = 0.5, L = 10, t = 4;
  const sK = slider(String.raw`$k$`, { id: 'k', name: 'rate k', min: 0.1, max: 1, step: 0.05, value: k, fmt: v => '$' + v.toFixed(2) + '$', onInput: v => { k = v; update(); } });
  const sL = slider(String.raw`$L$`, { id: 'L', name: 'limit L', min: 2, max: 100, step: 1, value: L, fmt: v => '$' + v + '$', onInput: v => { L = v; update(); } });
  const sT = slider(String.raw`$t$`, { id: 't', name: 'time t', min: 0, max: 10, step: 0.1, value: t, fmt: v => '$' + v.toFixed(1) + '$', onInput: v => { t = v; update(); } });
  const rE = readout('exp', String.raw`exponential $e^{kt}$ at $t$`);
  const rL = readout('logi', String.raw`logistic $y(t)$ at $t$, with $y(0)=1$`);
  const rS = readout('start', String.raw`logistic's first slope $k(L-1)$`);
  widget.append(hh('div', 'sliders', sK.el, sL.el, sT.el));
  const plot = fillPlot(widget, draw);
  widget.append(legend([
    { color: 'var(--pal-muted)', width: 3, text: String.raw`grey: exponential $y'=ky$` },
    { color: 'var(--pal-accent)', width: 3, text: String.raw`blue: logistic $y'=ky(L-y)$` },
    { color: 'var(--pal-muted)', width: 2, dash: true, text: String.raw`dashed: the limit $y=L$` }]),
    hh('div', 'readouts', rE.el, rL.el, rS.el));
  function draw(svg, W, H) {
    const Ymax = 1.2 * L;
    const step = [0.5, 1, 2, 5, 10, 20, 50].find(q => Ymax / q <= 6) || 50;
    const yt = [];
    for (let v = 0; v <= Ymax + 1e-9; v += step) yt.push(Math.round(v * 1000) / 1000);
    const g = axesFrame(svg, W, H, { x0: 0, x1: 10, y0: 0, y1: Ymax, xt: [0, 2, 4, 6, 8, 10], yt, xl: String.raw`$t$: time`, yl: String.raw`$y$: size` });
    svgNode('line', { x1: g.X(0), x2: g.X(10), y1: g.Y(L), y2: g.Y(L), stroke: COL.muted, 'stroke-width': 2, 'stroke-dasharray': '6 5' }, svg);
    const pe = [], pl = [];
    for (let q = 0; q <= 10.0001; q += 0.1) {
      if (expo(q, k) <= Ymax) pe.push([g.X(q), g.Y(expo(q, k))]);
      pl.push([g.X(q), g.Y(logi(q, k, L))]);
    }
    path(svg, pe, { stroke: COL.muted, 'stroke-width': 2.5 });
    path(svg, pl, { stroke: COL.accent, 'stroke-width': 3 });
    dot(svg, g.X(t), g.Y(Math.min(expo(t, k), Ymax)), COL.muted, 5);
    dot(svg, g.X(t), g.Y(logi(t, k, L)), COL.accent, 5);
    return null;
  }
  const fmt = v => v >= 1000 ? String(Math.round(v)) : v.toFixed(2);
  function update() {
    rE.set('$' + fmt(expo(t, k)) + '$');
    rL.set('$' + fmt(logi(t, k, L)) + '$');
    rS.set('$' + fmt(k * (L - 1)) + '$');
    plot.redraw();
  }
  update();
  contentSide(side, {
    formula: String.raw`$$y'=ky\qquad\text{and}\qquad y'=ky(L-y)$$`,
    tries: [
      String.raw`Set $L=2$. Both curves start with slope $k$. Predict where the blue one bends away from the grey, then move $t$ to find it.`,
      String.raw`Set $L=100$ and $k=0.5$. Predict the time the grey curve reaches $100$: $t=\ln(100)/0.5\approx9.2$. Check it.`,
      String.raw`Move $t$ to $10$. The grey curve keeps climbing. Where does the blue one stop?`],
    takeaway: String.raw`Growth in proportion to size never stops. Growth in proportion to the room left, $L-y$, does.` });
}

// ---------- proof: the limited growth equation ----------
function slideLogistic(widget, side) {
  let z0 = 0.25, lit = '';
  const sZ = slider(String.raw`$z_0$`, { id: 'z0', name: 'value of z at time 0', min: 0.05, max: 0.95, step: 0.05, value: z0, fmt: v => '$' + v.toFixed(2) + '$', onInput: v => { z0 = v; update(); } });
  const rA = readout('A', String.raw`$A=\dfrac{z_0}{1-z_0}$`);
  const rS = readout('slope0', String.raw`slope at $\tau=0$: $z_0(1-z_0)$`);
  function draw(svg, W, H) {
    const dashAttr = { 'stroke-dasharray': '6 5', stroke: COL.muted, 'stroke-width': 2 };
    const g = axesFrame(svg, W, H, { x0: -6, x1: 6, y0: 0, y1: 1, xt: [-6, -4, -2, 0, 2, 4, 6], yt: [0, 0.25, 0.5, 0.75, 1], xl: String.raw`$\tau$: time`, yl: String.raw`$z$: size` });
    const A = z0 / (1 - z0), s = z0 * (1 - z0);
    const pts = [];
    for (let q = -6; q <= 6.0001; q += 0.05) pts.push([g.X(q), g.Y(Sz(q, A))]);
    const tan = [[g.X(-1.6), g.Y(z0 - 1.6 * s)], [g.X(1.6), g.Y(z0 + 1.6 * s)]];
    if (lit === 'ends') {
      glowPath(svg, [[g.X(-6), g.Y(0)], [g.X(6), g.Y(0)]], 10);
      glowPath(svg, [[g.X(-6), g.Y(1)], [g.X(6), g.Y(1)]], 10);
    }
    svgNode('line', Object.assign({ x1: g.X(-6), x2: g.X(6), y1: g.Y(0), y2: g.Y(0) }, dashAttr), svg);
    svgNode('line', Object.assign({ x1: g.X(-6), x2: g.X(6), y1: g.Y(1), y2: g.Y(1) }, dashAttr), svg);
    svgTex(svg, g.X(5.6), g.Y(1) - 13, '$z=1$', { w: 60, size: 14, anchor: 'end', fill: COL.text2 });
    svgTex(svg, g.X(5.6), g.Y(0) - 13, '$z=0$', { w: 60, size: 14, anchor: 'end', fill: COL.text2 });
    if (lit === 'curve') glowPath(svg, pts, 12);
    path(svg, pts, { stroke: COL.accent, 'stroke-width': 3 });
    if (lit === 'tangent') glowPath(svg, tan, 12);
    path(svg, tan, { stroke: COL.ink, 'stroke-width': 2 });
    if (lit === 'point') glowDot(svg, g.X(0), g.Y(z0), 10);
    dot(svg, g.X(0), g.Y(z0), COL.accent, 5);
    return null;
  }
  const plot = proofLeft(widget, {
    controls: [hh('div', 'sliders', sZ.el)],
    draw: draw,
    legend: [
      { color: 'var(--pal-accent)', width: 3, text: String.raw`blue: $z(\tau)$, the solution` },
      { color: 'var(--pal-muted)', width: 2, dash: true, text: String.raw`dashed: the limits $z=0$ and $z=1$` },
      { color: 'var(--pal-ink)', width: 2, text: String.raw`solid line: slope $z(1-z)$ at $\tau=0$` }],
    readouts: [rA, rS],
    tests: [
      String.raw`Guess: does $z$ reach $1$ in a finite time? Test $A=\tfrac13$ at $\tau=10$: $z=0.99986$. Cases are evidence, not proof.`,
      String.raw`Check the slope at $\tau=0$ for $z_0=\tfrac14$: $z(1-z)=\tfrac{3}{16}=0.1875$.`],
    model: String.raw`the curve climbs fastest at $z=\tfrac12$, where $z(1-z)$ is largest, and levels off at $0$ and $1$.` });
  function update() {
    rA.set('$' + (z0 / (1 - z0)).toFixed(3) + '$');
    rS.set('$' + (z0 * (1 - z0)).toFixed(4) + '$');
    plot.redraw();
  }
  update();
  const proof = {
    id: 'logistic-solve',
    goal: { tex: String.raw`z=\dfrac{Ae^{\tau}}{1+Ae^{\tau}}\ \text{ solves }\ \dfrac{dz}{d\tau}=z(1-z)`,
      words: String.raw`$A=z_0/(1-z_0)$` },
    facts: [],
    lines: [
      { tex: String.raw`y=Lz,\quad \tau=kLt\quad\Rightarrow\quad \dfrac{dz}{d\tau}=z(1-z)`, move: 'Change variables',
        choices: ['Name a piece', 'Use symmetry'],
        why: String.raw`$L\,dz/dt=kL^2z(1-z)$: the constants go`, highlight: 'curve' },
      { tex: String.raw`\dfrac{dz}{z(1-z)}=d\tau`, move: 'Rearrange', choices: ['Take a limit', 'Name a piece'],
        why: 'the $z$ parts go to one side, the $\\tau$ part to the other', highlight: 'tangent' },
      { tex: String.raw`\dfrac{1}{z(1-z)}=\dfrac{1}{z}+\dfrac{1}{1-z}`, move: 'Rearrange', choices: ['Use symmetry', 'Telescope'],
        why: String.raw`over one denominator: $(1-z)+z=1$`, highlight: 'ends' },
      { tex: String.raw`\ln\dfrac{z}{1-z}=\tau+C`, move: 'Use an earlier result', choices: ['Undo with the inverse', 'Take a limit'],
        why: 'integrate $1/z$ and $1/(1-z)$ (Integrals, step 9)', highlight: 'curve' },
      { tex: String.raw`\dfrac{z}{1-z}=A\,e^{\tau},\quad A=e^{C}`, move: 'Undo with the inverse', choices: ['Name a piece', 'Contradiction'],
        why: String.raw`take $e$ to both sides: $e^{\ln u}=u$; name $A=e^C$`, highlight: 'point' },
      { tex: String.raw`z=\dfrac{Ae^{\tau}}{1+Ae^{\tau}}`, move: 'Rearrange', choices: ['Induction', 'Compare or bound'],
        why: String.raw`collect $z$: $z(1+Ae^{\tau})=Ae^{\tau}$`, highlight: 'curve' }],
    lookBack: [
      { q: 'Where does the division by $z(1-z)$ fail?',
        a: String.raw`At $z=0$ and $z=1$, the two constant solutions. The formula reaches $0$ only as $A\to0$, and $1$ only as $\tau\to\infty$.` },
      { q: 'What are the limits?',
        a: String.raw`As $\tau\to-\infty$, $z\to0$. As $\tau\to\infty$, $z\to1$. At $\tau=0$, $z=A/(1+A)$.` }] };
  proofRight(side, proof, plot, key => { lit = key || ''; plot.redraw(); });
}


// ---------- content: every solution is the same curve, slid in time ----------
function slideSame(widget, side) {
  const curves = [];
  const f = z => z * (1 - z);
  const bClr = mark(h('button', 'btn'), 'control', 'clear');
  setTex(bClr, 'Clear the curves');
  const rT = readout('t1090', String.raw`time from $z=0.1$ to $z=0.9$, last curve`);
  const rN = readout('count', 'curves you started');
  bClr.addEventListener('click', () => { curves.length = 0; update(); });
  widget.append(hh('div', 'btnrow', bClr));
  const plot = fillPlot(widget, draw);
  widget.append(legend([
    { color: 'var(--pal-grey)', width: 2, text: String.raw`short lines: the slope $z(1-z)$ at each point` },
    { color: 'var(--pal-accent)', width: 3, text: 'blue: a solution you started by clicking' }]),
    hh('div', 'readouts', rT.el, rN.el));
  plot.wrap.addEventListener('click', e => {
    const geo = plot.wrap._geo;
    if (!geo) return;
    const r = plot.wrap.getBoundingClientRect();
    const tau = geo.x0 + (e.clientX - r.left - geo.Lm) / (geo.W - geo.Lm - geo.Rm) * (geo.x1 - geo.x0);
    const z = geo.y0 + (geo.H - geo.Bm - (e.clientY - r.top)) / (geo.H - geo.Tm - geo.Bm) * (geo.y1 - geo.y0);
    if (tau < 0 || tau > 10 || z <= 0.01 || z >= 0.99) return;
    const fwd = trace(f, z, 0.01, 1000);
    const bwd = trace(f, z, -0.01, 600).reverse();
    const pts = bwd.concat(fwd.slice(1)).map(([t, zz]) => [t + tau, zz]);
    curves.push({ pts, tau, z });
    update();
  });
  function draw(svg, W, H) {
    const g = axesFrame(svg, W, H, { x0: 0, x1: 10, y0: 0, y1: 1, xt: [0, 2, 4, 6, 8, 10], yt: [0, 0.25, 0.5, 0.75, 1], xl: String.raw`$\tau$: time`, yl: String.raw`$z$: size` });
    for (let x = 1; x <= 9; x += 1) {
      for (let z = 0.05; z < 1; z += 0.1) {
        const s = f(z), r = 0.42;
        svgNode('line', { x1: g.X(x - r), y1: g.Y(z - r * s), x2: g.X(x + r), y2: g.Y(z + r * s), stroke: COL.grey, 'stroke-width': 1.5 }, svg);
      }
    }
    for (const c of curves) {
      path(svg, c.pts.map(([t, zz]) => [g.X(t), g.Y(zz)]), { stroke: COL.accent, 'stroke-width': 3 });
      dot(svg, g.X(c.tau), g.Y(c.z), COL.accent, 5);
    }
    return g;
  }
  function update() {
    const last = curves[curves.length - 1];
    if (last) {
      const t1 = crossing(last.pts, 0.1), t9 = crossing(last.pts, 0.9);
      rT.set(t1 !== null && t9 !== null ? '$' + (t9 - t1).toFixed(2) + '$' : 'not in view');
    } else rT.set('click the plot');
    rN.set(String(curves.length));
    plot.redraw();
  }
  update();
  contentSide(side, {
    formula: String.raw`$$\frac{dz}{d\tau}=z(1-z)$$`,
    tries: [
      String.raw`Click at height $z=0.5$ at one time, then at $z=0.5$ at a later time. Are the two blue curves the same shape?`,
      String.raw`Click at $z=0.1$. Read the time to reach $z=0.9$. Compare it with $2\ln 9=4.39$.`],
    takeaway: 'The start time only picks where you look. The shape is always the same curve.' });
}

// ---------- content: z' = z^a (1-z)^b ----------
function slideGeneral(widget, side) {
  let a = 0.5, b = 0.5;
  const f = z => Math.pow(z, a) * Math.pow(1 - z, b);
  const sA = slider(String.raw`$a$`, { id: 'a', name: 'exponent a', min: 0.1, max: 2, step: 0.1, value: a, fmt: v => '$' + v.toFixed(1) + '$', onInput: v => { a = v; update(); } });
  const sB = slider(String.raw`$b$`, { id: 'b', name: 'exponent b', min: 0.1, max: 2, step: 0.1, value: b, fmt: v => '$' + v.toFixed(1) + '$', onInput: v => { b = v; update(); } });
  const rZ = readout('zstar', String.raw`steepest point $z^*=\dfrac{a}{a+b}$`);
  const rM = readout('slope', String.raw`slope there, $f(z^*)$`);
  const rT = readout('time', String.raw`time from $z=0$ to $z=1$`);
  widget.append(hh('div', 'sliders', sA.el, sB.el));
  const plot = fillPlot(widget, draw);
  widget.append(legend([
    { color: 'var(--pal-muted)', width: 2, dash: true, text: String.raw`dashed: $z^*$, the steepest point` },
    { color: 'var(--pal-accent)', width: 3, text: String.raw`blue: one solution, $z=\tfrac12$ at $t=0$` },
    { color: 'var(--pal-grey)', width: 2, text: String.raw`short lines: the slope $f(z)=z^a(1-z)^b$` }]),
    hh('div', 'readouts', rZ.el, rM.el, rT.el));
  function draw(svg, W, H) {
    const g = axesFrame(svg, W, H, { x0: -8, x1: 8, y0: 0, y1: 1, xt: [-8, -4, 0, 4, 8], yt: [0, 0.25, 0.5, 0.75, 1], xl: String.raw`$t$: time`, yl: String.raw`$z$: size` });
    for (let x = -6; x <= 6; x += 2) {
      for (let z = 0.1; z < 0.95; z += 0.2) {
        const s = f(z), r = 0.8;
        svgNode('line', { x1: g.X(x - r), y1: g.Y(z - r * s), x2: g.X(x + r), y2: g.Y(z + r * s), stroke: COL.grey, 'stroke-width': 1.5 }, svg);
      }
    }
    const zs = steepZ(a, b);
    svgNode('line', { x1: g.X(-8), x2: g.X(8), y1: g.Y(zs), y2: g.Y(zs), stroke: COL.muted, 'stroke-width': 2, 'stroke-dasharray': '6 5' }, svg);
    const fw = trace(f, 0.5, 0.02, 400);
    const bw = trace(f, 0.5, -0.02, 400).reverse();
    path(svg, bw.concat(fw.slice(1)).map(([t, z]) => [g.X(t), g.Y(z)]), { stroke: COL.accent, 'stroke-width': 3 });
    return g;
  }
  function update() {
    rZ.set('$' + steepZ(a, b).toFixed(3) + '$');
    rM.set('$' + steepSlope(a, b).toFixed(4) + '$');
    const T = totalTime(a, b);
    rT.set(T === null ? String.raw`$\infty$, infinite` : '$' + T.toFixed(3) + '$');
    plot.redraw();
  }
  update();
  contentSide(side, {
    formula: String.raw`$$z'=z^a(1-z)^b$$`,
    tries: [
      String.raw`Keep $a=b=\tfrac12$. Read $z^*$ and the slope there. The total time is $\pi$: the curve $z=\tfrac{1+\sin t}{2}$ runs from $0$ to $1$.`,
      String.raw`Set $a=2$ and $b=1$. Predict $z^*$, then read it. Which exponent makes the total time infinite?`,
      String.raw`Set $a=b=0.9$ and read the total time. It is $B(0.1,0.1)\approx19.7$. Why so long?`],
    takeaway: String.raw`Finite range needs both exponents below $1$. Then the time from $0$ to $1$ is $B(1-a,1-b)$.` });
}

// ---------- decisions ----------
const D_TRIES = ['Read the problem.', 'Pick what you would do before he says it.', 'Read every verdict, not only yours.'];
const DECISIONS = {
  'amplifier-decision': {
    problem: String.raw`A voice must cross 3000 miles, with an amplifier about every 50 miles. Each has a gain of 100, so the total gain is $100^{60}=10^{120}$. Each stage also adds some noise (01:02).`,
    formula: String.raw`$G=100^{60}=10^{120}$`,
    symbols: String.raw`$G$: the total gain. $60$ stages, since $3000/50=60$.`,
    chooser: 1, who: 'Hamming',
    options: [
      { text: 'Build every amplifier very accurately, and keep it that way.',
        assumes: 'each stage can be made clean enough.',
        verdict: 'Possible, but every amplifier must be built and kept very carefully (01:33). Noise that gets in early is amplified all the way along.' },
      { text: 'At each stage, decide if each pulse is a 0 or a 1, and send a fresh, clean pulse.',
        assumes: 'small noise can be thrown away at each stage.',
        verdict: 'The noise is removed, not amplified, so the stages do not add up (02:05).' },
      { text: 'Make the wire quieter, so less noise gets in.',
        assumes: 'all the noise comes from the wire.',
        verdict: 'Helps the wire only. The amplifiers add their own noise at every stage (01:33).' }],
    reveal: [
      { k: "Hamming's move", v: 'Send pulses. A repeater decides 0 or 1 and sends a clean pulse. It copies the signal, not the noise.', t: '02:05' },
      { k: 'What it bought', v: 'Much simpler equipment and much higher accuracy, even with some noise at every stage.', t: '02:36' },
      { k: 'What it cost', v: 'A repeater can decide wrong when the noise is too big. The next step shows how often.', t: '02:05' }],
    takeaway: 'Clean up the signal at each stage, and the noise never piles up.' },
  'digital-move': {
    problem: String.raw`One method still grows fast along its S-curve. Another is close to its limit $L$. A new method can start a new S-curve near the old limit, or it may not. The book says "it is not clear" (ch. 2).`,
    formula: String.raw`$y'=ky(L-y)$: fast in the middle, flat at the limit $L$`,
    symbols: 'Hamming\'s limits for one processor: molecules, the speed of signals, and heat (25:06 to 25:38, ch. 2).',
    chooser: 2, who: 'Hamming',
    options: [
      { text: 'Keep improving the old method until it stops growing, then switch.',
        assumes: 'the old curve will show when to switch.',
        verdict: 'A new curve may start "from around the saturation level of the old one" (ch. 2). You would start late.' },
      { text: 'Wait until the new method beats the old one on your own data.',
        assumes: 'a method is worth learning only once it is already better.',
        verdict: 'Safe. But you skip the early part of the new curve, when it is still cheap to learn.' },
      { text: 'Put a small part of your work on the new method now, while the old curve still grows.',
        assumes: 'early practice on the next curve pays off later.',
        verdict: 'A small cost now. If the new curve never comes, the cost is only the practice.' }],
    reveal: [
      { k: "Hamming's move", v: 'Watch for the next S-curve, which "takes off from around the saturation level of the old one" (ch. 2).', t: '27:11' },
      { k: 'What it bought', v: 'A head start, while the new method is still cheap to try and the old one still pays.', t: 'book' },
      { k: 'What it cost', v: 'Hamming is not sure whether parallel computers fit the old S-curve or start a new one. So the bet can be wrong.', t: '28:11' }],
    takeaway: 'Watch the limit of your present curve, and start on the next one before you need it.' }
};
const DSTATE = {};
Object.keys(DECISIONS).forEach(id => { DSTATE[id] = { pick: null, open: false }; });

// Reveal a decision once; later calls change nothing. by: 'user' (a pick or the button) or 'cue'.
function revealDecision(id, by) {
  const st = DSTATE[id];
  if (!st || st.open) return false;
  st.open = true;
  emit('view.action', { action: 'reveal', step: id, by: by });
  return true;
}
function mountDecision(s, widget, side, sec) {
  const D = DECISIONS[s.id], st = DSTATE[s.id], open = st.open;
  const redraw = () => goTo(cur, true);
  const prob = mark(h('div', 'prob'), 'problem', s.id);
  prob.append(hh('p', '', h('span', 'lead', 'The problem.'), document.createTextNode(' '), setTex(h('span'), D.problem)));
  const opts = h('div', 'opts');
  D.options.forEach((o, k) => {
    const L = 'ABC'[k];
    const card = mark(h('div', 'opt'), 'card', L, o.text.replace(/\$/g, ''));
    card.setAttribute('role', 'button');
    card.setAttribute('aria-disabled', open ? 'true' : 'false');
    card.tabIndex = open ? -1 : 0;
    card.classList.toggle('on', st.pick === L);
    card.classList.toggle('chooser', open && k === D.chooser);
    const who = [];
    if (st.pick === L) who.push('Your pick');
    if (open && k === D.chooser) who.push(D.who);
    const top = hh('div', 'top', h('span', 'letter', L), h('span', 'who', who.join(', ')));
    const asm = setTex(h('p', 'asm'), 'Assumes: ' + o.assumes);
    const verdict = open ? setTex(h('div', 'verdict'), o.verdict) : h('div', 'verdict idle', 'Verdict after your pick.');
    card.append(hh('div', 'lhs', top, setTex(h('div', 'body'), o.text)), hh('div', 'rhs', asm, verdict));
    card.addEventListener('click', () => {
      if (DSTATE[s.id].open) return;
      st.pick = L;
      emit('view.action', { action: 'pick', step: s.id, option: L, correct: k === D.chooser });
      revealDecision(s.id, 'user');
      redraw();
    });
    opts.append(card);
  });
  const rev = mark(h('div', 'reveal'), 'reveal', s.id);
  if (!open) {
    rev.classList.add('idle');
    for (const r of D.reveal) rev.append(hh('p', 'rv hold', h('span', 'k', r.k + '. '), h('span', '', 'Shown after your pick.')));
    const btn = mark(h('button', 'btn primary', 'Show answer'), 'control', 'show-answer');
    btn.addEventListener('click', () => { if (revealDecision(s.id, 'user')) redraw(); });
    rev.append(hh('div', 'actions', btn));
  } else {
    for (const r of D.reveal) {
      const p = hh('p', 'rv', h('span', 'k', r.k + '. '));
      p.append(setTex(h('span'), r.v), h('span', 't', ' (' + r.t + ')'));
      rev.append(p);
    }
  }
  widget.append(prob, opts, rev);
  side.append(setTex(h('p', 'fx'), D.formula));
  if (D.symbols) side.append(sym(D.symbols));
  side.append(hh('div', 'blk', h('div', 'kicker', 'Try it'), hh('ol', 'tries', ...D_TRIES.map(t => h('li', '', t)))));
  if (D.ai) {
    if (open) {
      const p = setTex(h('p', 'ai'), D.ai);
      p.append(' ', h('span', 'src', '(' + D.src + ')'));
      side.append(hh('div', 'blk', h('div', 'kicker', 'Same move in AI research'), p));
    } else side.append(hh('div', 'blk', h('div', 'kicker', 'Same move in AI research'), h('p', 'hold ai', 'Shown after your pick.')));
  }
  side.append(open ? takeLine(D.takeaway) : h('p', 'hold', 'Takeaway: shown after your pick.'));
}


// ---------- frame ----------
const SLIDES = [
  { id: 'amplifier-decision', kind: 'decision', tag: 'Lecture 00:31 to 02:05', title: 'How do you send a voice across the continent?',
    question: 'Each stage adds noise. What do you build so the voice still comes out clear?' },
  { id: 'amplifier-chain', kind: 'content', tag: 'Lecture 02:36 to 03:40 (repeaters at 02:05)', title: 'Noise piles up in one chain, not in the other',
    question: String.raw`Each stage adds noise of size $\sigma$. What is left at the far end of the chain?`,
    symbols: String.raw`$\sigma$: noise per stage, as a share of the pulse height. Signal power: $1$.`,
    mount: slideChain },
  { id: 'exp-to-logistic', kind: 'content', tag: 'Lecture 23:01 to 24:04', title: 'Growth that stops at a limit',
    question: String.raw`Growth in proportion to size never stops. What does a limit $L$ change?`,
    symbols: String.raw`$y$: the size. $k$: the rate. $L$: the limit. $y'$: the slope, the rate of change (Primer · Derivatives, step 2).`,
    mount: slideExp },
  { id: 'logistic-solve', kind: 'proof', tag: 'Lecture 24:04 to 24:34', title: 'Solving the limited growth equation',
    question: String.raw`After the constants go away, how do you solve $z'=z(1-z)$?`,
    symbols: String.raw`$z$: the size as a share of the limit, from $0$ to $1$. $\tau=kLt$: the new time. $A$: a constant, set by the start.`,
    mount: slideLogistic },
  { id: 'same-curve-slid', kind: 'content', tag: 'Lecture 26:09 to 26:40', title: 'Every solution is one curve, slid in time',
    question: String.raw`The slope depends only on $z$. What does that do to the curves?`,
    symbols: String.raw`$\tau$: time. $z$: size. The rule $z'=z(1-z)$ has no $\tau$ in it, so the slope at one height never changes.`,
    mount: slideSame },
  { id: 'generalized-growth', kind: 'content', tag: 'Lecture 25:38 to 26:09; book ch. 2', title: 'Change the exponents, and the curve moves',
    question: String.raw`For $z^a(1-z)^b$, where is the curve steepest, and does it reach $1$ in a finite time?`,
    symbols: String.raw`$a$, $b$: the exponents. $z^*$: the steepest point. For $a=b=\tfrac12$ the solution is $z=\tfrac{1+\sin t}{2}$ (book ch. 2).`,
    mount: slideGeneral },
  { id: 'digital-move', kind: 'decision', tag: 'Lecture 27:11 to 28:42', title: 'Where do you put your next bet?',
    question: 'One method still grows fast, and another is near its limit. Where do you spend your time next?' }
];


let cur = 0, shownId = null, endSent = false;
function goTo(i, same) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  if (shownId !== null && shownId !== s.id) emit('view.step', { step: s.id });
  shownId = s.id;
  const stage = $('#stage');
  stage.innerHTML = '';
  PLOTS = [];
  const widget = h('div', 'widget');
  const side = h('div', 'side');
  side.append(h('div', 'tag', s.tag), setTex(h('h2'), s.title));
  side.append(setTex(h('p', s.kind === 'decision' ? 'q' : 'question'), s.question));
  if (s.symbols) side.append(sym(s.symbols));
  const cls = 'slide' + (s.kind === 'proof' ? ' proof-slide' : s.kind === 'decision' ? ' decision' : '');
  const sec = mark(h('section', cls), 'step', s.id, s.title.replace(/\$/g, ''));
  sec.append(widget, side);
  stage.append(sec);
  stage.scrollTop = 0;
  if (s.kind === 'decision') mountDecision(s, widget, side, sec);
  else s.mount(widget, side);
  // On a content slide the takeaway is dimmed until the user has tried a control.
  const tk = s.kind === 'content' ? side.querySelector('.takeaway') : null;
  if (tk) {
    tk.classList.add('dim');
    const openTk = () => tk.classList.remove('dim');
    sec.addEventListener('input', openTk);
    sec.addEventListener('click', e => { if (e.target.closest('[data-item="control"],[data-item="preset"]')) openTk(); });
    sec.addEventListener('pointerdown', e => { if (e.target.closest('[data-item="control"]')) openTk(); });
  }
  tex(sec);
  if (cur === SLIDES.length - 1 && !endSent) { endSent = true; emit('view.action', { action: 'deck-end' }); }
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, k) => d.classList.toggle('on', k === cur));
}
// A cue is a state. {step} goes to the step and does nothing if it is shown. {step, reveal: true}
// also reveals that decision, once; a revealed decision stays revealed.
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i < 0) return;
  const changed = msg.reveal === true && SLIDES[i].kind === 'decision' && revealDecision(SLIDES[i].id, 'cue');
  if (i !== cur || changed) goTo(i);
}
(function init() {
  const dots = $('#dots');
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = s.title.replace(/\$/g, '');
    b.addEventListener('click', () => goTo(i));
    dots.appendChild(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],textarea,select')) return;
    if (e.target && e.target.classList && e.target.classList.contains('opt') && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault(); e.target.click(); return;
    }
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
})();
</script>

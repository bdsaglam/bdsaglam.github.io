<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>After Lecture 23: test the assumptions</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><script src="../../components/theme.js"></script><style>*{box-sizing:border-box}body{margin:0;background:var(--pal-bg);color:var(--pal-fg);font:18px/1.42 system-ui,sans-serif}main{height:100vh;padding:26px 30px;display:grid;grid-template-rows:58px 1fr 44px;gap:15px}header,footer{display:flex;align-items:center;justify-content:space-between;gap:14px}h1{font-size:24px;margin:0}h2{font-size:29px;line-height:1.15;margin:0 0 12px}p{margin:0 0 14px}.tag{color:var(--pal-muted);font-size:16px}.body{display:grid;grid-template-columns:59% 1fr;gap:28px;min-height:0}.lab{border:1px solid var(--pal-line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:15px;background:var(--pal-panel);min-height:0}.lesson{padding:8px 0;display:flex;flex-direction:column}.question{font-size:20px}.defs{color:var(--pal-text-2);margin-bottom:14px;font-size:17px}.formula{font-size:26px;margin-bottom:10px}.take{background:var(--pal-accent-soft);padding:15px;border-radius:10px;font-size:18px;margin-top:auto}ol{padding-left:25px;margin:5px 0 18px}li{padding:4px 0}button,select{font:inherit;color:var(--pal-fg);background:var(--pal-soft);border:1px solid var(--pal-line);border-radius:8px;padding:9px 14px;cursor:pointer}button:hover{background:var(--pal-accent-soft)}button:disabled{opacity:.45;cursor:default}.chart{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.chart svg{width:100%;height:100%}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:16px}.legend span:before{content:'';display:inline-block;width:20px;height:4px;background:var(--c);margin-right:7px;vertical-align:middle}.readout{padding:13px;background:var(--pal-soft);border-radius:8px;font-size:18px;min-height:55px}.controls{display:flex;align-items:center;gap:16px}.controls label{display:flex;align-items:center;gap:16px;flex:1}input[type=range]{flex:1;accent-color:var(--pal-accent)}.intro,.choices,.proof{display:flex;flex-direction:column;flex:1;gap:17px;justify-content:center}.intro>div{border-left:4px solid var(--pal-accent);background:var(--pal-soft);padding:20px;font-size:22px}.intro small,.choice small{display:block;font-size:17px;margin-top:8px;color:var(--pal-text-2)}.choice{text-align:left;padding:18px;font-size:20px}.verdict{border-top:1px solid var(--pal-line);margin-top:10px;padding-top:10px;font-size:17px;color:var(--pal-accent-deep)}.proof-row{padding:10px;background:var(--pal-soft);font-size:22px;border-left:4px solid var(--pal-line)}.proof-row:last-child{background:var(--pal-amber-row);border-color:var(--pal-amber)}.proof-row small{display:block;font-size:16px;margin-top:3px;color:var(--pal-text-2)}.guess{font-size:17px}.guess button{font-size:16px;padding:5px 8px;margin:4px 4px 0 0}.proof{gap:10px}.choice{font-size:19px;padding:14px}.choice small,.verdict{font-size:16px;line-height:1.35}.source{color:var(--pal-muted);font-size:15px}a{color:var(--pal-accent-deep)}.pages{font-size:16px;color:var(--pal-muted)} .bit{font-size:48px;min-width:65px}.bits{display:flex;justify-content:center;gap:9px}.big{font-size:30px;text-align:center}.center{display:flex;flex:1;flex-direction:column;justify-content:center;gap:28px}.dots{display:flex;gap:5px}.dots button{padding:4px 7px;font-size:13px}.card{padding:20px;background:var(--pal-soft);border-left:4px solid var(--pal-accent)}.proof-row{font-size:21px}.source{font-size:14px}</style></head><body><main><header><h1>After Lecture 23: test the assumptions</h1><span id="tag" class="tag"></span></header><section class="body"><div id="lab" class="lab"></div><article class="lesson"><h2 id="title"></h2><p id="question" class="question"></p><div id="defs" class="defs"></div><div id="formula" class="formula"></div><ol id="tries"></ol><div id="take" class="take"></div></article></section><footer><button id="prev">← Previous</button><span class="pages" id="pages"></span><div id="dots" class="dots"></div><span class="source">L23 · manual study · <a href="https://www.youtube.com/watch?v=Km9_rBUGYYk" target="_blank">lecture source</a></span><button id="next">Next →</button></footer></main><script>const slides=[{"id": "dist", "kind": "distance", "title": "Which candidate is closer?", "time": "After \u00b7 33:00", "q": "Can the choice of distance reverse a nearest neighbor?", "defs": "Toy query: the origin. Candidate A differs by four units on one feature. Candidate B differs by three on each of two features. Both features use the same units.", "tries": ["Choose each distance in turn.", "Watch which candidate wins."], "take": "A distance states what kinds of differences count. In AI, choose and test it against the retrieval task."}, {"id": "distproof", "kind": "proof", "title": "Three questions, three distances", "time": "After \u00b7 supports 33:00", "q": "Why does the winner change?", "defs": "Two nonnegative feature errors are $a$ and $b$. Total error, straight-line length, and worst error answer different questions.", "tries": ["Reveal one rule at a time.", "Look back: what happens if one feature is measured in centimeters and the other in meters?"], "take": "For binary strings, counting mismatches gives Hamming distance; the Euclidean distance is its square root, so the two rank binary pairs the same way.", "rows": [["d_1=a+b:\\quad A=4,\\ B=6", "Add absolute feature errors"], ["d_2=\\sqrt{a^2+b^2}:\\quad A=4,\\ B=\\sqrt{18}", "Apply Pythagoras to the error triangle"], ["d_\\infty=\\max(a,b):\\quad A=4,\\ B=3", "Keep the largest error"]]}, {"id": "limit", "kind": "limit", "title": "A smooth curve develops a jump", "time": "After \u00b7 28:24", "q": "Does a limit of continuous curves have to stay continuous?", "defs": "Each curve raises a number between zero and one to a positive whole-number power. The endpoint stays at one while nearby values shrink.", "tries": ["Raise the power. Compare the endpoint with a nearby point.", "Move the probe closer to one. Can you keep the height large?"], "take": "Every finite curve is continuous. The limiting function jumps at the endpoint."}, {"id": "limitproof", "kind": "proof", "title": "Pointwise convergence is too weak", "time": "After \u00b7 supports 28:24", "q": "Where exactly does continuity fail?", "defs": "$x$: position in $[0,1]$. $n$: positive whole-number power. We keep $x$ fixed before taking the limit.", "tries": ["Reveal the interior and endpoint separately.", "Look back: why does choosing a new point for every power change the question?"], "take": "The limit exists at every fixed point, but it is discontinuous at one. That is enough to refute the original claim.", "rows": [["f_n(x)=x^n,\\quad 0\\le x<1:\\quad x^n\\to0", "A fixed factor below one shrinks repeatedly"], ["f_n(1)=1^n=1", "The endpoint never shrinks"], ["f(x)=0\\ (x<1),\\quad f(1)=1", "Combine the two pointwise limits"], ["\\lim_{x\\uparrow1}f(x)=0\\ne f(1)", "The left limit disagrees with the endpoint"]]}, {"id": "uniform", "kind": "uniform", "title": "One bound for the whole interval", "time": "After \u00b7 supports 28:24", "q": "What extra control prevents the jump?", "defs": "Pointwise convergence lets the required power depend on the point. Uniform convergence requires one error bound to cover every point at once.", "tries": ["Raise the power and watch the moving probe.", "Compare its error with the horizontal tolerance line."], "take": "The moving probe stays at height one-half. The convergence cannot be uniform on the whole closed interval."}, {"id": "uniformproof", "kind": "proof", "title": "Why uniform convergence preserves continuity", "time": "After \u00b7 supports 28:24", "q": "How does one shared bound repair the theorem?", "defs": "$f_n$: continuous approximating curves; $f$: their uniform limit. Fix a point $a$ and a desired positive error $\\varepsilon$.", "tries": ["Guess how to split the target error.", "Look back: which step requires a bound for every point at once?"], "take": "The middle term uses continuity of one finite curve. The outer terms use the shared uniform bound.", "rows": [["|f(x)-f(a)|\\le |f(x)-f_n(x)|+|f_n(x)-f_n(a)|+|f_n(a)-f(a)|", "Insert the approximating curve; use triangle inequality"], ["|f(t)-f_n(t)|<\\varepsilon/3\\quad\\text{for all }t", "Choose one curve using uniform convergence"], ["|x-a|<\\delta\\Rightarrow |f_n(x)-f_n(a)|<\\varepsilon/3", "Use continuity of that chosen curve"], ["|f(x)-f(a)|<\\varepsilon", "Add three bounds; continuity follows"]]}, {"id": "model", "kind": "choice", "title": "The proof passed. Deploy?", "time": "After \u00b7 23:11; 39:51", "q": "What remains after a model\u2019s theorem is proved?", "defs": "An AI retriever is proved optimal under independent query features. In deployment, two query features often move together. This is a new illustrative case.", "tries": ["Choose the next step before reading the verdicts."], "take": "A theorem certifies an implication under its assumptions. Data must test whether those assumptions fit the application.", "options": [["Deploy because the proof is valid", "Assumes the model\u2019s assumptions fit production.", "The deduction can be correct while the independence assumption fails."], ["Reject all formal analysis", "Assumes a mismatch makes every mathematical insight useless.", "The theorem still identifies which assumption needs examination."], ["Test dependence and compare a revised model", "Assumes modeling and deduction require separate evidence.", "This follows Hamming\u2019s concern with matching mathematics to the world; it is our exercise, not a decision he reported."]], "answer": 2}, {"id": "halt", "kind": "choice", "title": "A universal stopping checker?", "time": "After \u00b7 38:18", "q": "Could one program always decide whether any other program stops?", "defs": "Assume a checker always terminates and answers correctly for every program and input. A program can receive its own code as data.", "tries": ["Predict what happens when a contrary program is fed its own code."], "take": "A checker can work for restricted classes. The impossibility concerns one total, correct checker for all programs and inputs.", "options": [["Yes, wait long enough", "Assumes observing a long run distinguishes slow from infinite.", "Waiting never certifies that an arbitrary unfinished computation will run forever."], ["No, make a program contradict its prediction", "Assumes the checker can be called as a subroutine.", "The diagonal program reverses the checker\u2019s answer about its own code. The next slide gives the contradiction."], ["No program can ever be proved to stop", "Assumes a universal impossibility forbids individual proofs.", "Too strong: a fixed loop counting from one to ten can be proved to terminate."]], "answer": 1}, {"id": "haltproof", "kind": "proof", "title": "Make the checker wrong either way", "time": "After \u00b7 supports 38:18", "q": "Why is the assumed universal checker impossible?", "defs": "$H(p,p)$: the checker\u2019s answer about program $p$ on its own code. Build $D$ to loop if the answer is \u201chalts,\u201d and halt otherwise. This is a halting proof, not a proof of G\u00f6del\u2019s theorems.", "tries": ["Reveal both possible answers about $D$.", "Look back: where do we use that the checker itself always terminates?"], "take": "Both answers contradict what the constructed program does. Therefore the assumed universal checker cannot exist.", "rows": [["D(p):\\quad H(p,p)=\\text{halts}\\Rightarrow\\text{loop}", "Define the contrary program"], ["H(D,D)=\\text{halts}\\Rightarrow D(D)\\text{ loops}", "The first possible answer is wrong"], ["H(D,D)=\\text{loops}\\Rightarrow D(D)\\text{ halts}", "The other possible answer is wrong"], ["\\text{No total, correct }H\\text{ exists}", "Exhaust the two answers"]]}];
let page=0,revealed=0,picked=-1,guess=-1;const values={flips:0,metric:'total',power:2,probe:.9};const $=id=>document.getElementById(id);const math=()=>{if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});};
function setPage(i){page=Math.max(0,Math.min(slides.length-1,i));revealed=0;picked=-1;guess=-1;render()}
function render(){let s=slides[page];$('title').textContent=s.title;$('tag').textContent=s.time;$('question').textContent=s.q;$('defs').innerHTML=s.defs||'';$('formula').innerHTML=s.formula||'';$('tries').innerHTML=s.tries.map(t=>'<li>'+t+'</li>').join('');$('take').textContent=s.kind==='choice'&&picked<0?'Choose a card to test your judgment.':s.take;$('dots').innerHTML=slides.map((x,i)=>'<button aria-label="Slide '+(i+1)+'" '+(i===page?'disabled':'')+'>'+String(i+1)+'</button>').join('');$('dots').querySelectorAll('button').forEach((b,i)=>b.onclick=()=>setPage(i));$('pages').textContent=`${page+1} / ${slides.length}`;$('prev').disabled=page===0;$('next').disabled=page===slides.length-1;let lab=$('lab');if(s.kind==='choice'){lab.innerHTML='<div class="choices">'+s.options.map((o,i)=>`<button class="choice" data-item="choice" data-id="${s.id}-${i}">${o[0]}${picked<0?'<small>'+o[1]+'</small>':''}${picked>=0?'<div class="verdict">'+(i===s.answer?'Supported: ':'')+o[2]+'</div>':''}</button>`).join('')+'</div><button id="answer" data-id="show-answer">Show the answer</button>';lab.querySelectorAll('.choice').forEach((b,i)=>b.onclick=()=>{picked=i;render()});$('answer').onclick=()=>{picked=s.answer;render()};}else if(s.kind==='proof'){let choices=revealed<s.rows.length?[s.rows[revealed][1],'Change the assumptions','Use the conclusion as an assumption']:[];lab.innerHTML='<div class="proof">'+s.rows.slice(0,revealed).map(r=>'<div class="proof-row">$'+r[0]+'$<small>'+r[1]+'</small></div>').join('')+(revealed===0?'<p>Predict the next move. Each click reveals one equation and its reason.</p>':'')+'</div>'+(choices.length?'<div class="guess">Which move follows?<div>'+choices.map((c,i)=>`<button class="move" data-item="proof-guess" data-id="${i}">${c}</button>`).join('')+'</div><div>'+(guess<0?'Pick a move, or reveal to check.':guess===0?'That move advances the argument.':'Check whether that move preserves the stated problem.')+'</div></div>':'')+'<button id="reveal" data-id="next-line">'+(revealed<s.rows.length?'Reveal next move':'Proof complete')+'</button>';$('reveal').disabled=revealed>=s.rows.length;$('reveal').onclick=()=>{revealed++;guess=-1;render()};lab.querySelectorAll('.move').forEach((b,i)=>b.onclick=()=>{guess=i;render()});}else{lab.innerHTML='<div class="chart" id="chart"></div><div class="legend" id="legend"></div><div class="readout" id="readout"></div><div class="controls" id="controls"></div>';draw()}math()}
const col=x=>FluidTheme.color(x);const line=(x,y,X,Y,c,dash='')=>`<line x1="${x}" y1="${y}" x2="${X}" y2="${Y}" stroke="${col(c)}" stroke-width="3" ${dash?'stroke-dasharray="'+dash+'"':''}/>`;const label=(x,y,t,c='text-2',anchor='start')=>`<text x="${x}" y="${y}" fill="${col(c)}" text-anchor="${anchor}" font-size="18">${t}</text>`;
function draw(){let s=slides[page];if(s.kind==='flip'){$('chart').innerHTML='<div class="center"><div class="big">Sent bit: 0</div><div class="bits"><button id="flip" class="bit" aria-label="Flip the bit">'+(values.flips%2)+'</button></div><div class="big">'+values.flips+' flips applied</div></div>';$('legend').textContent='Button: current bit state';$('readout').textContent=values.flips%2?'One unmatched flip changes the bit.':'An even number of flips restores the bit.';$('flip').onclick=()=>{values.flips++;draw()};$('controls').innerHTML='<button id="reset">Reset flips</button>';$('reset').onclick=()=>{values.flips=0;draw()}}
if(s.kind==='distance'){let names={total:'Total absolute error',straight:'Straight-line distance',worst:'Largest feature error'},a=4,b=values.metric==='total'?6:values.metric==='straight'?Math.sqrt(18):3;$('chart').innerHTML='<div class="center"><div class="card big">A: errors (4, 0)</div><div class="card big">B: errors (3, 3)</div><div class="big">'+(a<b?'A':a>b?'B':'Tie')+' is closer</div></div>';$('legend').textContent='Cards: feature errors relative to the query';$('readout').textContent=`${names[values.metric]}: A = ${a}, B = ${b.toFixed(2)}.`;$('controls').innerHTML='<label>Distance <select aria-label="Distance">'+Object.entries(names).map(([k,v])=>'<option value="'+k+'" '+(k===values.metric?'selected':'')+'>'+v+'</option>').join('')+'</select></label>';$('controls').querySelector('select').onchange=e=>{values.metric=e.target.value;draw()}}
if(s.kind==='limit'||s.kind==='uniform'){let n=values.power,probe=s.kind==='uniform'?Math.pow(.5,1/n):values.probe,W=670,H=320,L=55,R=22,T=35,B=48,px=x=>L+x*(W-L-R),py=y=>H-B-y*(H-T-B),v='<svg viewBox="0 0 670 320" role="img" aria-label="Continuous power curve and discontinuous pointwise limit">';for(let k=0;k<=4;k++){let a=k/4;v+=line(L,py(a),W-R,py(a),'line')+label(L-8,py(a)+5,a,'muted','end')+label(px(a),H-18,a,'muted','middle')}v+=line(L,py(0),px(1),py(0),'grey','7 5');v+='<circle cx="'+px(1)+'" cy="'+py(0)+'" r="6" fill="'+col('panel')+'" stroke="'+col('grey')+'" stroke-width="3"/><circle cx="'+px(1)+'" cy="'+py(1)+'" r="6" fill="'+col('grey')+'"/>';let p=Array.from({length:401},(_,i)=>{let x=i/400;return px(x)+','+py(x**n)});v+='<polyline points="'+p.join(' ')+'" fill="none" stroke="'+col('accent')+'" stroke-width="4"/>';if(s.kind==='uniform')v+=line(L,py(.1),W-R,py(.1),'orange','4 5');v+=line(px(probe),py(0),px(probe),py(probe**n),'amber')+'<circle cx="'+px(probe)+'" cy="'+py(probe**n)+'" r="7" fill="'+col('amber')+'"/>';v+=label(L,21,'height')+label(W-R,H-1,'position','text-2','end')+'</svg>';$('chart').innerHTML=v;$('legend').innerHTML='<span style="--c:var(--pal-accent)">solid: finite power curve</span><span style="--c:var(--pal-grey)">dashed and endpoint dot: limit</span><span style="--c:var(--pal-amber)">probe error above limit</span>'+(s.kind==='uniform'?'<span style="--c:var(--pal-orange)">tolerance: 0.1</span>':'');$('readout').innerHTML='$n='+n+'$, $x='+probe.toFixed(4)+'$, $x^n='+(probe**n).toFixed(4)+'$'+(s.kind==='uniform'?'. Probe chosen as $x=2^{-1/n}$; hence $x^n=1/2$.':'');$('controls').innerHTML='<label>Power <input aria-label="Power" type="range" min="1" max="100" value="'+n+'"></label>'+(s.kind==='limit'?'<label>Probe <input aria-label="Probe" type="range" min="0.5" max="0.999" step="0.001" value="'+values.probe+'"></label>':'');$('controls').querySelectorAll('input').forEach((el,i)=>el.oninput=e=>{values[i===0?'power':'probe']=+e.target.value;draw();math()})}
math()}
$('prev').onclick=()=>setPage(page-1);$('next').onclick=()=>setPage(page+1);window.addEventListener('fluid-themechange',()=>{if($('chart'))draw()});window.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')setPage(page+1);if(e.key==='ArrowLeft')setPage(page-1)});render();window.addEventListener('load',math);
</script></body></html>

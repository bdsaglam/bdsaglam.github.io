<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primer: exponentials</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../../components/theme.js"></script>
<style>
/* Colors: white page, one accent (blue), red only for a failing check. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft);
  --red:var(--pal-red); --redbg:var(--pal-red-bg);
  --u:clamp(16px,1.35vw,20px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 24px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(6px,1vh,12px) 24px}
footer{display:flex;align-items:center;gap:10px;padding:8px 24px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Slide frame: widget on the left (3/5), text on the right (2/5). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(18px,2.4vw,40px)}
.widget{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(6px,1vh,10px);overflow:hidden}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(6px,1.1vh,12px);overflow:hidden}
.tag{font:13px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(20px,1.9vw,28px);line-height:1.2;margin:0;font-weight:650}
.question{margin:0;font-size:clamp(16px,1.3vw,18px);font-weight:600}
.formula{font-size:clamp(18px,1.8vw,26px)}
.formula .katex-display{margin:.25em 0}
.sym{margin:0;font-size:16px;color:var(--muted)}
.tries{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.tries li::marker{color:var(--accent);font-weight:600}
.takeaway{margin:0;padding:10px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}
.closing{margin:0;font-size:17px;font-weight:600}
.next{margin:0;font-size:16px;color:var(--muted)}
.where{margin:0;font-size:16px}
.where b{color:var(--accent)}

/* Controls and readouts */
.sliders{display:flex;gap:8px 24px;flex-wrap:wrap;width:100%}
.slide-ctl{display:flex;align-items:center;gap:8px;font-size:16px}
.slide-ctl input{width:clamp(120px,11vw,170px);vertical-align:middle;accent-color:var(--accent)}
.slide-ctl .val{min-width:52px}
.btn{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--pal-panel);border-radius:8px;cursor:pointer;font-size:16px}
.btn.on{background:var(--chip);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.readouts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.readout{flex:1 1 150px;min-width:0;padding:4px 8px;border-radius:10px;background:var(--pal-soft);font-size:15px;overflow-wrap:anywhere}
.readout .k{color:var(--muted);font-size:14px}
.readout .val{font-size:16px;font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:20px;height:0;vertical-align:middle;margin-right:6px}
.chip{display:inline-block;width:18px;height:12px;vertical-align:middle;margin-right:6px;border-radius:2px}

/* Plots fill the space left in the widget column */
.fill{flex:1 1 0;min-height:120px;position:relative;width:100%}
.fill>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.chain{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:1fr;gap:4px;width:100%;min-width:0;flex:1 1 0;min-height:140px}
.amp{min-width:0;display:flex;align-items:center;justify-content:center;background:var(--pal-soft-2);border-radius:4px;font-size:15px;color:var(--pal-text-2)}
.amp.on{background:var(--accent);color:var(--pal-on-accent)}
.amp.start{background:var(--pal-panel);border:1px solid var(--line)}
.bars{display:flex;flex-direction:column;gap:6px;width:100%}

/* Proof slides: test and picture on the left, the proof (fl-proof-steps) on the right */
.slide.proof-slide{grid-template-columns:minmax(0,11fr) minmax(0,9fr)}
.slide.proof-slide .side{justify-content:flex-start}
.slide.proof-slide .fill{min-height:100px}
.slide.proof-slide .slide-ctl input{width:clamp(96px,8.5vw,140px)}
.slide.proof-slide .slide-ctl .val{min-width:36px}
.slide.proof-slide .sliders{gap:6px 18px}
.part{margin:0;font-weight:600;color:var(--muted)}
.test{display:flex;flex-direction:column;gap:3px}
.test .tries{gap:3px}
.model{margin:0;padding:8px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}
.name i{font-style:italic}
</style>
</head>
<body>
<header>Primer · Logarithms and exponentials: exponentials</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script src="../../components/proof-steps.js"></script>
<script>
// ---------- DOM and drawing helpers ----------
const NSV = 'http://www.w3.org/2000/svg', NHT = 'http://www.w3.org/1999/xhtml';
const $ = s => document.querySelector(s);

// ---------- palette and redraw ----------
// COL holds the palette colors for the SVG being drawn: a plot re-reads it at every paint, and the slide
// re-reads it when it is shown. A theme switch redraws the plots and keeps every control's state.
let COL = {};
const PAL_NAMES = ['accent', 'accent-2', 'amber', 'amber-bg', 'amber-muted', 'blue-light', 'grey', 'grey-bar', 'grid', 'bg', 'ink', 'muted', 'on-accent', 'soft', 'soft-2', 'text-2'];
function readPalette() {
  const o = {};
  for (const n of PAL_NAMES) o[n.replace(/-(\w)/g, (_, c) => c.toUpperCase())] = FluidTheme.color(n);
  return o;
}
let PLOTS = [];   // the plots on the current slide
window.addEventListener('fluid-themechange', () => { COL = readPalette(); PLOTS.forEach(p => p.redraw()); });
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false } ], throwOnError: false };
// Render $...$ in a node. If the CDN did not load, the text stays as typed.
function tex(node) {
  if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH);
  return node;
}
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function hh(tag, cls, ...kids) {
  const e = h(tag, cls);
  for (const k of kids) if (k) e.append(k);
  return e;
}
function mark(e, kind, id, title) {
  e.dataset.item = kind;
  if (id != null) e.dataset.id = id;
  if (title != null) e.dataset.title = title;
  return e;
}
function svgNode(tag, attrs, parent) {
  const e = document.createElementNS(NSV, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function svgRoot(w, ht) {
  return svgNode('svg', { viewBox: '0 0 ' + w + ' ' + ht, role: 'img', 'font-family': 'system-ui, sans-serif', 'font-size': 14 });
}
function svgText(parent, x, y, s, attrs) {
  const t = svgNode('text', Object.assign({ x: x, y: y, fill: COL.muted }, attrs || {}), parent);
  t.textContent = s;
  return t;
}
// A KaTeX label over an SVG: a foreignObject holding a rendered formula.
function svgTex(parent, x, y, s, o) {
  o = o || {};
  const w = o.w || 120, ht = 26, anchor = o.anchor || 'middle';
  const x0 = anchor === 'end' ? x - w : anchor === 'start' ? x : x - w / 2;
  const fo = svgNode('foreignObject', { x: x0, y: y - ht / 2, width: w, height: ht }, parent);
  const d = document.createElementNS(NHT, 'div');
  const jc = anchor === 'end' ? 'flex-end' : anchor === 'start' ? 'flex-start' : 'center';
  d.setAttribute('style', 'display:flex;align-items:center;height:100%;white-space:nowrap;font-size:' +
    (o.size || 15) + 'px;color:' + (o.fill || COL.text2) + ';justify-content:' + jc);
  const span = document.createElementNS(NHT, 'span');
  span.textContent = s;
  if (o.bg) span.setAttribute('style', 'background:' + o.bg + ';border-radius:5px;padding:1px 5px');
  d.appendChild(span);
  fo.appendChild(d);
  tex(span);
  return fo;
}
// Same label with a white halo, so it reads over a curve or bars.
function haloTex(parent, x, y, s, o) {
  const fo = svgTex(parent, x, y, s, o);
  fo.firstChild.style.textShadow = '0 0 3px ' + COL.bg + ', 0 0 3px ' + COL.bg + ', 0 0 2px ' + COL.bg;
  return fo;
}
// A labelled range input. label is LaTeX-ready text; fmt gives the value text.
function slider(label, o) {
  const wrap = h('label', 'slide-ctl');
  const lab = tex(h('span', '', label));
  const val = h('span', 'val', '');
  const inp = h('input');
  inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step; inp.value = o.value;
  mark(inp, 'control', o.id, o.name || o.id);
  wrap.append(lab, inp, val);
  const fmt = o.fmt || String;
  const api = {
    el: wrap,
    input: inp,
    get value() { return +inp.value; },
    show() { setTex(val, fmt(+inp.value)); },
  };
  inp.addEventListener('input', () => { api.show(); if (o.onInput) o.onInput(+inp.value); });
  api.show();
  return api;
}
// A readout box: label and value are LaTeX-ready text.
function readout(id, label) {
  const box = mark(h('div', 'readout'), 'readout', id);
  const k = h('div', 'k');
  setTex(k, label);
  const v = h('div', 'val');
  box.append(k, v);
  return { el: box, set(text) { setTex(v, text); } };
}
function legend(items) {
  const d = h('div', 'legend');
  for (const it of items) {
    const s = h('span');
    const sw = it.chip ? h('span', 'chip') : h('span', 'sw');
    if (it.chip) sw.style.background = it.color;
    else sw.style.borderTop = '2px ' + (it.dash ? 'dashed' : 'solid') + ' ' + it.color;
    const t = h('span');
    setTex(t, it.text);
    s.append(sw, t);
    d.appendChild(s);
  }
  return d;
}
// A plot that takes the height left in its box. draw(svg, W, H) runs on every resize.
function fillPlot(box, draw) {
  const wrap = h('div', 'fill');
  box.append(wrap);
  let key = '';
  const paint = force => {
    const w = Math.floor(wrap.clientWidth), ht = Math.floor(wrap.clientHeight);
    if (w < 60 || ht < 60) return;
    if (!force && key === w + 'x' + ht) return;
    key = w + 'x' + ht;
    COL = readPalette();
    const svg = svgRoot(w, ht);
    draw(svg, w, ht);
    wrap.replaceChildren(svg);
  };
  new ResizeObserver(() => paint(false)).observe(wrap);
  const plot = { redraw: () => paint(true) };
  PLOTS.push(plot);
  return plot;
}
function sym(text) { return setTex(h('p', 'sym'), text); }
function triesList(items) { return hh('ol', 'tries', ...items.map(t => setTex(h('li'), t))); }
function takeLine(text) { return setTex(h('p', 'takeaway'), text); }
// Session events. Optional: with no bridge, nothing is sent.
function emit(kind, data) {
  try {
    if (window.fluid && typeof window.fluid.emit === 'function') Promise.resolve(window.fluid.emit(kind, data)).catch(() => {});
  } catch (e) { /* the view works without the bridge */ }
}

// ---------- proof slides: shared parts ----------
// Amber marks what the newest proof line is about, in the picture and in the proof.
function litSet(key) { return new Set(String(key || '').split(/\s+/).filter(Boolean)); }
function glowBox(svg, x, y, w, ht, pad) {
  pad = pad == null ? 5 : pad;
  return svgNode('rect', { x: (x - pad).toFixed(1), y: (y - pad).toFixed(1), width: Math.max(0, w + 2 * pad).toFixed(1),
    height: Math.max(0, ht + 2 * pad).toFixed(1), rx: 7, fill: COL.amberBg, stroke: COL.amber, 'stroke-width': 1.5 }, svg);
}
function glowPath(svg, d, wdt) {
  return svgNode('path', { d: d, fill: 'none', stroke: COL.amberBg, 'stroke-width': wdt || 12, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, svg);
}
function glowDot(svg, x, y, r) { return svgNode('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: r || 12, fill: COL.amberBg, stroke: COL.amber, 'stroke-width': 1.5 }, svg); }
function nameLine(html) { const p = h('p', 'sym name'); p.innerHTML = html; return tex(p); }
// Left column of a proof slide: controls, the picture, legend, readouts, the test, the mental model.
function proofLeft(widget, o) {
  if (o.controls && o.controls.length) widget.append(hh('div', 'sliders', ...o.controls));
  const plot = fillPlot(widget, o.draw);
  widget.append(legend(o.legend.concat([{ chip: true, color: COL.amberBg, text: 'amber: the newest proof line' }])));
  if (o.readouts && o.readouts.length) widget.append(hh('div', 'readouts', ...o.readouts.map(r => r.el)));
  const test = hh('div', 'test', h('p', 'part', 'Test it'), triesList(o.tests));
  const model = h('p', 'model');
  model.append(h('span', 'part', 'The picture: '), tex(h('span', '', o.model)));
  widget.append(test, model);
  plot.test = test;
  return plot;
}
// Right column: the proof. Each revealed line lights its part of the picture; once the proof is
// done, the look-back questions take the place of the test under the picture.
function proofRight(side, spec, plot, onLight) {
  const el = document.createElement('fl-proof-steps');
  el.onEvent = d => emit('view.action', d);
  el.onHighlight = key => onLight(key);
  el.lookBackHost = plot.test;
  el.lookBackHint = 'Look back: under the picture.';
  el.data = spec;
  side.append(el);
  return el;
}
function bracket(svg, xa, xb, y, dir) {   // dir 1: ticks point down, -1: up
  return svgNode('path', { d: 'M' + xa.toFixed(1) + ' ' + (y + dir * 8).toFixed(1) + ' L' + xa.toFixed(1) + ' ' + y.toFixed(1) +
    ' L' + xb.toFixed(1) + ' ' + y.toFixed(1) + ' L' + xb.toFixed(1) + ' ' + (y + dir * 8).toFixed(1), fill: 'none', stroke: COL.muted, 'stroke-width': 1.5 }, svg);
}

// ---------- step 1: repeated multiplication ----------
// Hamming's chain: an amplifier of gain 100 every 50 miles over 3,000 miles, so 60 amplifiers (L2 01:33).
function slideRepeat(widget, side) {
  const NMAX = 60;
  let k = 0;
  const chain = h('div', 'chain');
  const start = mark(h('span', 'amp start'), 'mark', 'input');
  setTex(start, '$1$');
  chain.append(start);
  const amps = [];
  for (let i = 1; i <= NMAX; i++) {
    const b = mark(h('span', 'amp'), 'mark', 'amp-' + i);
    setTex(b, String.raw`$\times 100$`);
    amps.push(b);
    chain.append(b);
  }
  const sl = slider(String.raw`$k$, amplifiers`, { id: 'k', name: 'amplifiers', min: 0, max: NMAX, step: 1, value: k,
    fmt: v => String(v), onInput: v => { k = v; update(); } });
  const rG = readout('gain', String.raw`gain $G_k$`);
  const rD = readout('digits', String.raw`digits in $G_k$`);
  const pre = h('p', 'where');
  setTex(pre, String.raw`Prefixes Hamming uses (L3 24:36 to 25:10): milli $10^{-3}$, micro $10^{-6}$, nano $10^{-9}$, pico $10^{-12}$; kilo $10^{3}$, mega $10^{6}$, giga $10^{9}$, tera $10^{12}$. Also $2^{10}=1024\approx10^{3}$ and $2^{20}\approx10^{6}$ (L1 14:34).`);
  widget.append(hh('div', 'sliders', sl.el), chain,
    legend([
      { chip: true, color: COL.accent, text: String.raw`blue: the first $k$ amplifiers, each $\times 100$` },
      { chip: true, color: COL.soft2, text: 'grey: not yet in the chain' }]),
    hh('div', 'readouts', rG.el, rD.el), pre);
  function update() {
    amps.forEach((b, i) => b.classList.toggle('on', i < k));
    rG.set(k === 0 ? '$1$' : '$10^{' + (2 * k) + '}$');
    rD.set(String(2 * k + 1));
  }
  side.append(
    triesList([
      String.raw`Set $k=60$. The gain is $10^{120}$. Hamming's point: noise that enters early is amplified along with the signal (L2 01:33).`,
      String.raw`Step $k$ by one. Each amplifier adds 2 to the exponent and two digits to the number.`,
      String.raw`Compare $2^{10}$ with $10^{3}$, then $2^{20}$ with $10^{6}$. Doubling ten times is about one power of ten.`]),
    takeLine(String.raw`Repeated multiplication is a power: the exponent counts the steps, and it sets the number of digits.`));
  update();
}

// ---------- step 2: exponential growth and doubling time ----------
function drawGrowth(svg, W, Hh, D, t) {
  const L = 62, R = 24, Tp = 18, B = 56, base = Hh - B, pw = W - L - R, ph = base - Tp, XM = 60;
  const ymax = Math.pow(2, XM / D) * 1.08;
  const X = x => L + x / XM * pw, Y = v => base - v / ymax * ph;
  for (let j = 0; Math.pow(2, j) <= ymax; j++) {
    const v = Math.pow(2, j);
    svgNode('line', { x1: L, y1: Y(v), x2: W - R, y2: Y(v), stroke: COL.grid }, svg);
    svgTex(svg, L - 26, Y(v), '$2^{' + j + '}$', { w: 50, anchor: 'end', size: 14 });
  }
  svgNode('line', { x1: L, y1: base, x2: W - R, y2: base, stroke: COL.grey }, svg);
  svgNode('line', { x1: L, y1: Tp, x2: L, y2: base, stroke: COL.grey }, svg);
  for (let x = 0; x <= XM; x += 10) svgText(svg, X(x), base + 18, String(x), { 'text-anchor': 'middle', 'font-size': 14 });
  svgTex(svg, L + pw / 2, Hh - 12, String.raw`years $t$`, { w: 200, size: 15 });
  let d = '';
  for (let x = 0; x <= XM; x += 0.5) d += (x ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(Math.pow(2, x / D)).toFixed(1);
  svgNode('path', { d: d, fill: 'none', stroke: COL.accent, 'stroke-width': 2.5, 'data-item': 'mark', 'data-id': 'curve' }, svg);
  for (let j = 0; j * D <= XM; j++) {
    const x = j * D, v = Math.pow(2, j);
    svgNode('circle', { cx: X(x).toFixed(1), cy: Y(v).toFixed(1), r: 4, fill: COL.accent, 'data-item': 'mark', 'data-id': 'doubling-' + j }, svg);
    if (j > 0 && Math.abs(x - t) >= 2) svgTex(svg, X(x), Y(v) - 16, '$2^{' + j + '}$', { w: 50, size: 14 });
  }
  svgNode('line', { x1: X(t).toFixed(1), y1: Tp, x2: X(t).toFixed(1), y2: base, stroke: COL.ink, 'stroke-dasharray': '4 3', 'data-item': 'mark', 'data-id': 'year' }, svg);
  const yt = Math.pow(2, t / D);
  svgNode('circle', { cx: X(t).toFixed(1), cy: Y(yt).toFixed(1), r: 5, fill: COL.ink, 'data-item': 'mark', 'data-id': 'now' }, svg);
  haloTex(svg, X(t) + 6, Tp + 10, '$t$', { w: 40, anchor: 'start', size: 15, fill: COL.ink });
  haloTex(svg, X(t) - 8, Y(yt) - 16, String.raw`$2^{t/D}$`, { w: 90, anchor: 'end', size: 15, fill: COL.ink });
}
function slideGrowth(widget, side) {
  let D = 17, t = 34;
  const sD = slider(String.raw`$D$, years per doubling`, { id: 'D', name: 'doubling time', min: 8, max: 30, step: 1, value: D,
    fmt: v => String(v), onInput: v => { D = v; update(); } });
  const sT = slider(String.raw`$t$, years`, { id: 't', name: 'years', min: 0, max: 60, step: 1, value: t,
    fmt: v => String(v), onInput: v => { t = v; update(); } });
  const rV = readout('value', String.raw`count now, relative to the start $N/N_0$`);
  const rK = readout('doublings', String.raw`doublings so far $t/D$`);
  const rB = readout('rate', String.raw`rate $r=\ln 2/D$ per year`);
  widget.append(hh('div', 'sliders', sD.el, sT.el));
  const plot = fillPlot(widget, (svg, W, Hh) => drawGrowth(svg, W, Hh, D, t));
  widget.append(legend([
    { color: COL.accent, text: String.raw`blue: $N/N_0=2^{t/D}$, the count relative to the start` },
    { color: COL.ink, text: String.raw`dashed: the year $t$ you set`, dash: true }]),
    hh('div', 'readouts', rV.el, rK.el, rB.el));
  function update() {
    rV.set(Math.pow(2, t / D).toFixed(2));
    rK.set((t / D).toFixed(2));
    rB.set((Math.LN2 / D).toFixed(4));
    plot.redraw();
  }
  side.append(
    triesList([

// ---------- step 5: why an exponential beats a line ----------
function crossing(K, l) {
  if (K <= 1) return null;

  return null;
}
function drawBeat(svg, W, Hh, K, l) {

  const lK = Math.log10(K);

  const X = n => L + n / NX * pw, Y = dec => base - dec / decMax * ph;
  for (let d = 0; d <= decMax; d++) {
    svgNode('line', { x1: L, y1: Y(d).toFixed(1), x2: W - R, y2: Y(d).toFixed(1), stroke: COL.grid }, svg);
    svgTex(svg, L - 26, Y(d), '$10^{' + d + '}$', { w: 50, anchor: 'end', size: 14 });
  }
  svgNode('line', { x1: L, y1: base, x2: W - R, y2: base, stroke: COL.grey }, svg);
  svgNode('line', { x1: L, y1: Tp, x2: L, y2: base, stroke: COL.grey }, svg);
  for (let n = 0; n <= NX; n += 200) svgText(svg, X(n), base + 18, String(n), { 'text-anchor': 'middle', 'font-size': 14 });
  svgTex(svg, L + pw / 2, Hh - 12, String.raw`steps $n$`, { w: 200, size: 15 });

  svgNode('path', { d: dK, fill: 'none', stroke: COL.accent, 'stroke-width': 2.5, 'data-item': 'mark', 'data-id': 'exp' }, svg);
  const nStar = crossing(K, l);
  if (nStar !== null && nStar <= NX) {
    svgNode('line', { x1: X(nStar).toFixed(1), y1: Tp, x2: X(nStar).toFixed(1), y2: base, stroke: COL.ink, 'stroke-dasharray': '4 3', 'data-item': 'mark', 'data-id': 'cross' }, svg);
    haloTex(svg, X(nStar) + 6, Tp + 12, '$n^{*}=' + nStar + '$', { w: 110, anchor: 'start', size: 15, fill: COL.ink });
  }
}

// ---------- step 2: why the exponents add (proof) ----------
function bigNum(v) {
  if (v < 1e7) return v.toLocaleString('en-US');
  const e = Math.floor(Math.log10(v) + 1e-12), m = v / Math.pow(10, e);
  return '$' + m.toFixed(3) + String.raw`\times10^{` + e + '}$';
}
function drawFactors(svg, W, Hh, b, m, n, lit) {

  const x0 = L + (pw - (N * bw + (N - 1) * gap)) / 2, y = Hh * 0.5 - bh / 2;
  const X = i => x0 + i * (bw + gap), E = i => X(i) + bw;
  const yt = y - 14, yb = y + bh + 14;
  if (lit.has('groups')) {

  }
  if (lit.has('whole')) glowBox(svg, X(0), y, E(N - 1) - X(0), yb - y, 6);
  for (let i = 0; i < N; i++) {
    svgNode('rect', { x: X(i).toFixed(1), y: y.toFixed(1), width: bw.toFixed(1), height: bh.toFixed(1), rx: 4,
      fill: i < m ? COL.grey : COL.accent, 'data-item': 'mark', 'data-id': 'factor-' + (i + 1) }, svg);
    svgTex(svg, X(i) + bw / 2, y + bh / 2, '$' + b + '$', { w: bw, size: bw > 50 ? 18 : 15, fill: i < m && !FluidTheme.isDark() ? COL.ink : COL.onAccent });
  }

  const short = lw + 10 - (c2 - c1);

  bracket(svg, X(0), E(N - 1), yb, -1);
  svgTex(svg, (X(0) + E(N - 1)) / 2, yb + 20, '$' + m + '+' + n + '=' + N + '$ factors: $' + b + '^{' + N + '}$',
    { w: 300, size: 15, bg: lit.has('whole') ? COL.amberBg : null });
}

}

// ---------- step 6: why D = ln 2 / r (proof) ----------
function niceStep(x) {
  const p = Math.pow(10, Math.floor(Math.log10(x))), q = x / p;
  return (q <= 1 ? 1 : q <= 2 ? 2 : q <= 5 ? 5 : 10) * p;
}
function drawDoubling(svg, W, Hh, r, t0, lit) {

  const D = Math.LN2 / r, f = t => Math.exp(r * t), ymax = f(XM) * 1.08;
  const X = t => L + t / XM * pw, Y = v => base - v / ymax * ph;
  const step = niceStep(ymax / 4);
  for (let v = 0; v <= ymax; v += step) {
    svgNode('line', { x1: L, y1: Y(v).toFixed(1), x2: W - R, y2: Y(v).toFixed(1), stroke: COL.grid }, svg);
    svgText(svg, L - 8, Y(v) + 5, String(v), { 'text-anchor': 'end', 'font-size': 14 });
  }
  svgNode('line', { x1: L, y1: base, x2: W - R, y2: base, stroke: COL.grey }, svg);
  svgNode('line', { x1: L, y1: Tp, x2: L, y2: base, stroke: COL.grey }, svg);
  for (let x = 0; x <= XM; x += 10) svgText(svg, X(x), base + 18, String(x), { 'text-anchor': 'middle', 'font-size': 14 });
  svgTex(svg, W - R, base - 14, String.raw`years $t$`, { w: 120, anchor: 'end', size: 15 });
  svgTex(svg, L + 10, Tp + 6, String.raw`$N/N_0=e^{rt}$`, { w: 140, anchor: 'start', size: 15 });
  // Faint pairs from the starts 0, D, 2D, ...: each span of length D multiplies by 2.
  const ghosts = [];
  for (let k = 0; (k + 1) * D <= XM + 1e-9; k++) ghosts.push(k * D);
  const step2 = ta => 'M' + X(ta).toFixed(1) + ' ' + Y(f(ta)).toFixed(1) + ' L' + X(ta + D).toFixed(1) + ' ' + Y(f(ta)).toFixed(1) +
    ' L' + X(ta + D).toFixed(1) + ' ' + Y(f(ta + D)).toFixed(1);
  if (lit.has('cancel')) ghosts.forEach(ta => glowPath(svg, step2(ta), 10));
  let d = '';
  for (let x = 0; x <= XM; x += 0.5) d += (x ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(f(x)).toFixed(1);
  svgNode('path', { d: d, fill: 'none', stroke: COL.accent, 'stroke-width': 2.5, 'data-item': 'mark', 'data-id': 'curve' }, svg);
  ghosts.forEach((ta, k) => {
    svgNode('path', { d: step2(ta), fill: 'none', stroke: COL.grey, 'stroke-dasharray': '3 3', 'data-item': 'mark', 'data-id': 'span-' + k }, svg);
  });
  // The pair you choose: start t and t + D.
  const ta = t0, tb = t0 + D, ya = f(ta), yb = f(tb);

  if (lit.has('split')) glowPath(svg, 'M' + X(tb).toFixed(1) + ' ' + Y(ya).toFixed(1) + ' L' + X(tb).toFixed(1) + ' ' + Y(yb).toFixed(1), 12);
  svgNode('line', { x1: X(ta).toFixed(1), y1: Y(ya).toFixed(1), x2: X(tb).toFixed(1), y2: Y(ya).toFixed(1), stroke: COL.ink, 'stroke-dasharray': '4 3' }, svg);
  svgNode('line', { x1: X(tb).toFixed(1), y1: Y(ya).toFixed(1), x2: X(tb).toFixed(1), y2: Y(yb).toFixed(1), stroke: COL.ink, 'stroke-width': 2, 'data-item': 'mark', 'data-id': 'factor' }, svg);
  svgNode('circle', { cx: X(ta).toFixed(1), cy: Y(ya).toFixed(1), r: 5, fill: COL.ink, 'data-item': 'mark', 'data-id': 'start' }, svg);
  svgNode('circle', { cx: X(tb).toFixed(1), cy: Y(yb).toFixed(1), r: 5, fill: COL.ink, 'data-item': 'mark', 'data-id': 'end' }, svg);
  haloTex(svg, X(ta) + 4, Y(ya) + 18, String.raw`$N_0e^{rt}$`, { w: 90, anchor: 'start', size: 15, fill: COL.ink });
  const right = X(tb) + 150 < W;
  haloTex(svg, right ? X(tb) + 8 : X(tb) - 8, Y((ya + yb) / 2), String.raw`$\times e^{rD}=\times` + (yb / ya).toFixed(3) + '$',
    { w: 140, anchor: right ? 'start' : 'end', size: 15, fill: COL.ink, bg: lit.has('split') ? COL.amberBg : null });
  // D, read on the time axis.

  if (X(tb) + 210 < W) haloTex(svg, X(tb) + 8, yB, lab, { w: 200, anchor: 'start', size: 15, fill: COL.ink });

// ---------- step 9: why K^n passes every line (proof) ----------
function drawBound(svg, W, Hh, K, l, lit) {
  const L = 62, R = 24, Tp = 20, B = 56, base = Hh - B, pw = W - L - R, ph = base - Tp;
  const h = K - 1, N = 1 + 2 * l / (h * h), nStar = crossing(K, l);
  const sq = n => n * (n - 1) / 2 * h * h;
  const xmax = Math.log10(Math.max(N, nStar || 1) * 2.5);
  const nMax = Math.pow(10, xmax);
  const yMin = Math.floor(Math.log10(h * h)), yMax = Math.ceil(Math.log10(Math.max(l * nMax, sq(nMax))) + 0.3);
  const X = lx => L + lx / xmax * pw, Y = ly => base - (ly - yMin) / (yMax - yMin) * ph;
  const ystep = Math.max(1, Math.ceil((yMax - yMin) / Math.max(2, Math.floor(ph / 26))));
  for (let d = yMin; d <= yMax; d += ystep) {
    svgNode('line', { x1: L, y1: Y(d).toFixed(1), x2: W - R, y2: Y(d).toFixed(1), stroke: COL.grid }, svg);
    svgTex(svg, L - 26, Y(d), '$10^{' + d + '}$', { w: 52, anchor: 'end', size: 14 });
  }
  for (let d = 0; d <= Math.floor(xmax); d++) {
    svgNode('line', { x1: X(d).toFixed(1), y1: Tp, x2: X(d).toFixed(1), y2: base, stroke: COL.soft }, svg);
    svgTex(svg, X(d), base + 18, '$10^{' + d + '}$', { w: 52, size: 14 });
  }
  svgNode('line', { x1: L, y1: base, x2: W - R, y2: base, stroke: COL.grey }, svg);
  svgNode('line', { x1: L, y1: Tp, x2: L, y2: base, stroke: COL.grey }, svg);
  svgTex(svg, L + pw / 2, Hh - 12, String.raw`steps $n$, log scale`, { w: 220, size: 15 });
  // Three curves: the line l n, the square n(n-1)/2 h^2 (from n = 2), and K^n until it leaves the top.
  const S = 320, nExit = yMax / Math.log10(K);
  let dL = '', dS = '', dK = '';
  const pt = (lx, ly) => X(lx).toFixed(1) + ' ' + Y(ly).toFixed(1);
  for (let i = 0; i <= S; i++) {
    const lx = xmax * i / S, n = Math.pow(10, lx);
    dL += (i ? 'L' : 'M') + pt(lx, Math.log10(l * n));
    if (n >= 2) dS += (dS ? 'L' : 'M') + pt(lx, Math.log10(sq(n)));
    if (n <= nExit) dK += (dK ? 'L' : 'M') + pt(lx, n * Math.log10(K));
  }
  dS = 'M' + pt(Math.log10(2), Math.log10(sq(2))) + 'L' + dS.slice(1);
  if (nExit < nMax) dK += 'L' + pt(Math.log10(nExit), yMax);
  if (lit.has('expand')) { glowPath(svg, dK, 12); glowPath(svg, dS, 12); }
  if (lit.has('bound')) glowPath(svg, dS, 12);
  const lN = Math.log10(N);
  if (lit.has('N')) {
    glowPath(svg, 'M' + X(lN).toFixed(1) + ' ' + Tp + ' L' + X(lN).toFixed(1) + ' ' + base, 10);
    glowDot(svg, X(lN), Y(Math.log10(l * N)), 11);
  }
  svgNode('path', { d: dL, fill: 'none', stroke: COL.muted, 'stroke-width': 2.5, 'data-item': 'mark', 'data-id': 'line' }, svg);
  svgNode('path', { d: dS, fill: 'none', stroke: COL.accent2, 'stroke-width': 2.5, 'stroke-dasharray': '7 5', 'data-item': 'mark', 'data-id': 'square' }, svg);
  svgNode('path', { d: dK, fill: 'none', stroke: COL.accent, 'stroke-width': 2.5, 'data-item': 'mark', 'data-id': 'exp' }, svg);
  haloTex(svg, X(xmax * 0.06), Y(Math.log10(l * Math.pow(10, xmax * 0.06))) - 16, String.raw`$\ell n$`, { w: 50, anchor: 'start', size: 15, fill: COL.text2 });
  const lsq = Math.max(Math.log10(2) + 0.05, xmax * 0.2);
  haloTex(svg, X(lsq) + 4, Y(Math.log10(sq(Math.pow(10, lsq)))) + 18, String.raw`$\tfrac{n(n-1)}{2}h^2$`, { w: 110, anchor: 'start', size: 15, fill: COL.accent });
  if (nExit < nMax) haloTex(svg, X(Math.log10(nExit)) - 6, Tp + 12, '$K^{n}$', { w: 50, anchor: 'end', size: 15, fill: COL.accent });

  haloTex(svg, nearRight ? xN - 6 : xN + 6, Tp + 60, String.raw`proof's $N=` + Math.round(N) + '$', { w: 180, anchor: nearRight ? 'end' : 'start', size: 15, fill: COL.accent });

}

];
// The view's close. The primer's last proof lists every move the primer's proofs used, in order of first
// use, once it is proved, so the list never gives a pick away; the last step names what comes next.
const NEXT = 'Next: Primer · Logarithms.';

let cur = 0, shownId = null, endSent = false;
function goTo(i) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  if (shownId !== null && shownId !== s.id) emit('view.step', { step: s.id });
  shownId = s.id;
  const stage = $('#stage');
  stage.innerHTML = '';
  PLOTS = [];
  COL = readPalette();
  const widget = h('div', 'widget');
  const side = hh('div', 'side',
    h('div', 'tag', s.tag),
    setTex(h('h2'), s.title),
    setTex(h('p', 'question'), s.question),
    s.formula ? setTex(h('div', 'formula'), s.formula) : null,
    s.symbols ? setTex(h('p', 'sym'), s.symbols) : null,
    s.name ? nameLine(s.name) : null);
  const sec = mark(h('section', 'slide' + (s.proof ? ' proof-slide' : '')), 'step', s.id, s.title);
  sec.append(widget, side);
  stage.append(sec);
  stage.scrollTop = 0;
  s.mount(widget, side);
  if (cur === SLIDES.length - 1) {
    side.querySelector('fl-proof-steps').endNote = NEXT;
    if (!endSent) { endSent = true; emit('view.action', { action: 'deck-end' }); }
  }
  tex(sec);
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, i) => d.classList.toggle('on', i === cur));
}
// A cue is a state: go to the named step, and do nothing if it is already shown.
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i >= 0 && i !== cur) goTo(i);
}
(function init() {
  const dots = $('#dots');
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = s.title;
    b.addEventListener('click', () => goTo(i));
    dots.appendChild(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],textarea,select')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
})();
</script>
</body>
</html>

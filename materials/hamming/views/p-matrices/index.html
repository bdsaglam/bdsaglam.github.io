<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primer · Matrices and eigenvectors</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../../components/theme.js"></script>
<style>
/* Colors come from the theme palette (../../components/theme.js): one accent (blue), red only for a failing check. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft);
  --red:var(--pal-red); --redbg:var(--pal-red-bg);
  --u:clamp(16px,1.35vw,20px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 24px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(6px,1vh,12px) 24px}
footer{display:flex;align-items:center;gap:10px;padding:8px 24px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Slide frame: widget on the left (3/5), text on the right (2/5). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(18px,2.4vw,40px)}
.widget{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(6px,1vh,10px);overflow:hidden}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(6px,1.1vh,12px);overflow:hidden}
.tag{font:13px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(20px,1.9vw,28px);line-height:1.2;margin:0;font-weight:650}
.question{margin:0;font-size:clamp(16px,1.3vw,18px);font-weight:600}
.formula{font-size:clamp(18px,1.8vw,26px)}
.sym{margin:0;font-size:16px;color:var(--muted)}
.tries{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.tries li::marker{color:var(--accent);font-weight:600}
.where{margin:0;font-size:16px}
.where b{color:var(--accent)}
.takeaway{margin:0;padding:10px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}

/* Controls and readouts */
.sliders{display:flex;gap:8px 24px;flex-wrap:wrap;width:100%}
.slide-ctl{display:flex;align-items:center;gap:8px;font-size:16px}
.slide-ctl input{width:clamp(120px,11vw,170px);vertical-align:middle;accent-color:var(--accent)}
.slide-ctl .val{min-width:44px}
.five{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px 12px;width:100%}
.five .slide-ctl{flex-direction:column;align-items:stretch;gap:0}
.five .slide-ctl input{width:100%}
.five .slide-ctl .val{min-width:0}
.btn{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--pal-panel);border-radius:8px;cursor:pointer;font-size:16px}
.btn.on{background:var(--chip);border-color:var(--accent);color:var(--pal-accent-deep)}
.btnrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lead{font-size:16px;color:var(--muted)}
.readouts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.readout{flex:1 1 150px;min-width:0;padding:4px 8px;border-radius:10px;background:var(--pal-soft);font-size:15px;overflow-wrap:anywhere}
.readout .k{color:var(--muted);font-size:14px}
.readout .val{font-size:16px;font-weight:600}
.readout.bad{background:var(--redbg);color:var(--red)}
.legend{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:15px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:20px;height:0;vertical-align:middle;margin-right:6px}
.chip{display:inline-block;width:14px;height:14px;vertical-align:middle;margin-right:6px;border-radius:50%}
.legend .chip{border-radius:50%}

/* Plots fill the space left in the widget column */
.fill{flex:1 1 0;min-height:120px;position:relative;width:100%}
.fill>svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* Table of values (slide 2) */
.sgrid{display:grid;grid-template-columns:max-content repeat(5,minmax(0,1fr));gap:4px;width:100%;align-items:center;flex:1 1 auto;align-content:space-evenly;min-height:0}
.sc{height:28px;display:flex;align-items:center;justify-content:center;border-radius:4px;background:var(--pal-soft-2);font:16px ui-monospace,Menlo,monospace}
.sc.lab{background:none;justify-content:flex-start;padding-right:12px;font:16px system-ui,-apple-system,sans-serif;white-space:nowrap}
.sc.head{background:none;color:var(--muted)}
.sc.bad{background:var(--red);color:var(--pal-on-accent);font-weight:700}
.sec{grid-column:1/-1;font-size:15px;color:var(--muted);padding-top:4px}

/* Names that explain */
.name i{font-style:italic}

/* Proof slides: test and picture on the left, the proof (fl-proof-steps) on the right */
.slide.proof-slide{grid-template-columns:minmax(0,11fr) minmax(0,9fr)}
.slide.proof-slide .side{justify-content:flex-start}
.slide.proof-slide .fill{min-height:140px}
.slide.proof-slide .slide-ctl input{width:clamp(90px,8vw,130px)}
.slide.proof-slide .slide-ctl .val{min-width:30px}
.slide.proof-slide .sliders{gap:6px 18px;align-items:center}
.slide.proof-slide .legend{gap:2px 12px}
.part{margin:0;font-weight:600;color:var(--muted)}
.test{display:flex;flex-direction:column;gap:3px}
.test .tries{gap:3px}
.model{margin:0;padding:8px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}

/* Short windows (1100x620 and similar): tighter spacing, body text stays 16px */
@media (max-height: 680px){
  header{padding-top:4px}
  #stage{padding:4px 24px}
  footer{padding:4px 24px}
  .widget{gap:3px}
  .legend{font-size:15px;gap:2px 12px}
  .side{gap:6px}
  .tries{gap:3px}
  .sym,.where,.tries{line-height:1.2}
  .side{gap:4px}
  .readout{padding:2px 8px;line-height:1.2;min-height:58px}
  .slide.proof-slide .readout{min-height:0}
  .slide.proof-slide .fill{min-height:110px}
  .model{padding:5px 10px;line-height:1.25}
  .test .tries{gap:1px}
  .takeaway{padding:6px 10px}
  .formula{font-size:20px}
  .sc{height:24px}
  .fill{min-height:80px}
  h2{font-size:20px}
}
</style>
</head>
<body>
<header>Primer · Matrices and eigenvectors</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script src="../../components/proof-steps.js"></script>
<script>
// ---------- palette and redraw ----------
// COL holds the palette colors for the SVG being drawn. fillPlot reads it at every paint, so a draw always
// uses the current theme. Light values are the old literals, so the light theme is unchanged.
let COL = {};
const PAL_NAMES = ['ink', 'text-2', 'muted', 'grey', 'accent', 'accent-deep', 'panel', 'on-accent',
  'bg', 'amber', 'amber-bg', 'amber-ink', 'soft-2', 'line', 'blue-pale', 'blue-deep', 'blue-light'];
function readPalette() {
  const o = {};
  for (const n of PAL_NAMES) o[n.replace(/-(\w)/g, (_, c) => c.toUpperCase())] = FluidTheme.color(n);
  return o;
}
let PLOTS = [];   // the plots on the current slide; a theme switch redraws them, and keeps every control's state
window.addEventListener('fluid-themechange', () => PLOTS.forEach(p => p.redraw()));

// ---------- math (exact formulas) ----------
const U0 = [1, 4, 2, 8, 5];                       // slide 1 default input
// Smoother: y_k = (u_{k-1} + u_k + u_{k+1}) / 3, with zeros outside the list.
function avg3(u) { return u.map((_, k) => ((k > 0 ? u[k - 1] : 0) + u[k] + (k < u.length - 1 ? u[k + 1] : 0)) / 3); }
// Median of the same three neighbors (not linear).
function med3(u) {
  return u.map((_, k) => {
    const w = [k > 0 ? u[k - 1] : 0, u[k], k < u.length - 1 ? u[k + 1] : 0].sort((p, q) => p - q);
    return w[1];
  });
}
function addv(a, b) { return a.map((x, i) => x + b[i]); }
function same(a, b) { return a.every((x, i) => Math.abs(x - b[i]) < 1e-9); }
function fmtN(x) { return Math.abs(x - Math.round(x)) < 1e-9 ? String(Math.round(x)) : x.toFixed(2); }
// Small numbers as a LaTeX power of ten.
function sciTex(x) {
  if (x >= 0.001) return x.toFixed(4);
  const parts = x.toExponential(1).split('e');
  return '$' + parts[0] + '\\times 10^{' + parseInt(parts[1], 10) + '}$';
}

// ---------- DOM and drawing helpers ----------
let epoch = 0;
const $ = s => document.querySelector(s);
const NSV = 'http://www.w3.org/2000/svg', NHT = 'http://www.w3.org/1999/xhtml';
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false } ], throwOnError: false };
// Render $...$ and $$...$$ in a node. If the CDN did not load, the text stays as typed.
function tex(node) {
  if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH);
  return node;
}
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function hh(tag, cls, ...kids) {
  const e = h(tag, cls);
  for (const k of kids) if (k) e.append(k);
  return e;
}
function mark(e, kind, id, title) {
  e.dataset.item = kind;
  if (id != null) e.dataset.id = id;
  if (title != null) e.dataset.title = title;
  return e;
}
function svgNode(tag, attrs, parent) {
  const e = document.createElementNS(NSV, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function svgRoot(w, ht) {
  return svgNode('svg', { viewBox: '0 0 ' + w + ' ' + ht, role: 'img', 'font-family': 'system-ui, sans-serif', 'font-size': 14 });
}
function svgText(parent, x, y, s, attrs) {
  const t = svgNode('text', Object.assign({ x: x, y: y, fill: COL.muted }, attrs || {}), parent);
  t.textContent = s;
  return t;
}
// A KaTeX label over an SVG: a foreignObject holding a rendered formula.
function svgTex(parent, x, y, s, o) {
  o = o || {};
  const w = o.w || 220, ht = 26, anchor = o.anchor || 'middle';
  const x0 = anchor === 'end' ? x - w : anchor === 'start' ? x : x - w / 2;
  const fo = svgNode('foreignObject', { x: x0, y: y - ht / 2, width: w, height: ht }, parent);
  const d = document.createElementNS(NHT, 'div');
  const jc = anchor === 'end' ? 'flex-end' : anchor === 'start' ? 'flex-start' : 'center';
  d.setAttribute('style', 'display:flex;align-items:center;height:100%;white-space:nowrap;font-size:' +
    (o.size || 15) + 'px;color:' + (o.fill || COL.text2) + ';justify-content:' + jc);
  const span = document.createElementNS(NHT, 'span');
  span.textContent = s;
  if (o.bg) span.setAttribute('style', 'background:' + o.bg + ';border-radius:5px;padding:1px 5px');
  d.appendChild(span);
  fo.appendChild(d);
  tex(span);
  return fo;
}
// Same label with a white halo, so it reads over a line.
function haloTex(parent, x, y, s, o) {
  const fo = svgTex(parent, x, y, s, o);
  const halo = COL.bg;
  fo.firstChild.style.textShadow = '0 0 3px ' + halo + ', 0 0 3px ' + halo + ', 0 0 2px ' + halo;
  return fo;
}
// An arrow from p to q (pixel points) with a head at q. Too short for a head: a plain line.
function arrow(svg, p, q, col, id, wdt) {
  const dx = q[0] - p[0], dy = q[1] - p[1], len = Math.hypot(dx, dy) || 1;
  if (len < 14) {
    svgNode('line', { x1: p[0], y1: p[1], x2: q[0], y2: q[1], stroke: col, 'stroke-width': wdt || 3, 'data-item': 'mark', 'data-id': id }, svg);
    return;
  }
  const ux = dx / len, uy = dy / len;
  const bx = q[0] - ux * 10, by = q[1] - uy * 10;
  svgNode('line', { x1: p[0], y1: p[1], x2: bx, y2: by, stroke: col, 'stroke-width': wdt || 3, 'data-item': 'mark', 'data-id': id }, svg);
  const px = -uy * 6, py = ux * 6;
  svgNode('polygon', { points: q[0] + ',' + q[1] + ' ' + (bx + px) + ',' + (by + py) + ' ' + (bx - px) + ',' + (by - py),
    fill: col, 'data-item': 'mark', 'data-id': id }, svg);
}
// A labelled range input. label is LaTeX-ready text; fmt gives the value text.
function slider(label, o) {
  const wrap = h('label', 'slide-ctl');
  const lab = tex(h('span', '', label));
  const val = h('span', 'val', '');
  const inp = h('input');
  inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step; inp.value = o.value;
  mark(inp, 'control', o.id, o.name || o.id);
  wrap.append(lab, inp, val);
  const fmt = o.fmt || String;
  const api = {
    el: wrap,
    input: inp,
    get value() { return +inp.value; },
    show() { setTex(val, fmt(+inp.value)); },
  };
  inp.addEventListener('input', () => { api.show(); if (o.onInput) o.onInput(+inp.value); });
  api.show();
  return api;
}
// A readout box: label and value are LaTeX-ready text.
function readout(id, label) {
  const box = mark(h('div', 'readout'), 'readout', id);
  const k = h('div', 'k');
  setTex(k, label);
  const v = h('div', 'val');
  box.append(k, v);
  return { el: box, set(text, bad) { setTex(v, text); box.classList.toggle('bad', !!bad); } };
}
function legend(items) {
  const d = h('div', 'legend');
  for (const it of items) {
    const s = h('span');
    const sw = it.chip ? h('span', 'chip') : h('span', 'sw');
    if (it.chip) sw.style.background = it.color;
    else sw.style.borderTop = '2px ' + (it.dash ? 'dashed' : 'solid') + ' ' + it.color;
    const t = h('span');
    setTex(t, it.text);
    s.append(sw, t);
    d.appendChild(s);
  }
  return d;
}
// A plot that takes the height left in its box. draw(svg, W, H) runs on every resize.
function fillPlot(box, draw) {
  const wrap = h('div', 'fill');
  box.append(wrap);
  let key = '';
  const paint = force => {
    const w = Math.floor(wrap.clientWidth), ht = Math.floor(wrap.clientHeight);
    if (w < 60 || ht < 60) return;
    if (!force && key === w + 'x' + ht) return;
    key = w + 'x' + ht;
    COL = readPalette();
    const svg = svgRoot(w, ht);
    draw(svg, w, ht);
    wrap.replaceChildren(svg);
  };
  new ResizeObserver(() => paint(false)).observe(wrap);
  const plot = { redraw: () => paint(true) };
  PLOTS.push(plot);
  return plot;
}
function sym(text) { return setTex(h('p', 'sym'), text); }
function triesList(items) { return hh('ol', 'tries', ...items.map(t => setTex(h('li'), t))); }
function whereLine(text) {
  const p = h('p', 'where');
  const s = h('span');
  setTex(s, text);
  p.append(h('b', '', 'Where you meet it: '), s);
  return p;
}
function takeLine(text) { return setTex(h('p', 'takeaway'), text); }
// A name line: what a term's name means and how it points at the idea. html may hold <i> and $math$.
function nameLine(html) { const p = h('p', 'sym name'); p.innerHTML = html; return tex(p); }

// ---------- proof slides ----------
// Amber marks what the newest proof line is about, in the picture and in the proof.
function glowLine(svg, p, q, wdt) {
  return svgNode('path', { d: 'M' + p[0].toFixed(1) + ' ' + p[1].toFixed(1) + ' L' + q[0].toFixed(1) + ' ' + q[1].toFixed(1),
    fill: 'none', stroke: COL.amberBg, 'stroke-width': wdt || 12, 'stroke-linecap': 'round' }, svg);
}
function glowBox(svg, x, y, w, ht, pad) {
  pad = pad == null ? 4 : pad;
  return svgNode('rect', { x: (x - pad).toFixed(1), y: (y - pad).toFixed(1), width: Math.max(0, w + 2 * pad).toFixed(1),
    height: Math.max(0, ht + 2 * pad).toFixed(1), rx: 6, fill: COL.amberBg, stroke: COL.amber, 'stroke-width': 1.5 }, svg);
}
function glowDot(svg, p, r) { return svgNode('circle', { cx: p[0].toFixed(1), cy: p[1].toFixed(1), r: r || 13, fill: COL.amberBg, stroke: COL.amber, 'stroke-width': 1.5 }, svg); }
// The top row of a proof picture: what amber shows now, or (grey) how to read the picture.
function capTop(svg, W, text, lit) {
  if (lit) svgTex(svg, W / 2, 13, text, { w: W - 8, size: 15, fill: COL.amberInk, bg: COL.amberBg });
  else svgTex(svg, 4, 13, text, { w: W - 10, anchor: 'start', size: 15, fill: COL.muted });
}
// Left column of a proof slide: controls, the picture, legend, readouts, the test, the mental model.
function proofLeft(widget, o) {
  if (o.controls && o.controls.length) widget.append(hh('div', 'sliders', ...o.controls));
  const plot = fillPlot(widget, o.draw);
  widget.append(legend(o.legend));
  if (o.readouts && o.readouts.length) widget.append(hh('div', 'readouts', ...o.readouts.map(r => r.el)));
  const test = hh('div', 'test', h('p', 'part', 'Test it'), triesList(o.tests));
  const model = h('p', 'model');
  model.append(h('span', 'part', 'The picture: '), tex(h('span', '', o.model)));
  widget.append(test, model);
  plot.test = test;
  return plot;
}
// Right column: the proof. Each revealed line lights its part of the picture; once the proof is
// done, the look-back questions take the place of the test under the picture.
function proofRight(side, spec, plot, onLight, hint) {
  const el = document.createElement('fl-proof-steps');
  el.onEvent = d => emit('view.action', d);
  el.onHighlight = key => onLight(key);
  el.lookBackHost = plot.test;
  el.lookBackHint = hint || 'Look back: under the picture.';
  el.data = spec;
  side.append(el);
  return el;
}
// Session events. Optional: with no bridge, nothing is sent.
function emit(kind, data) {
  try {
    if (window.fluid && typeof window.fluid.emit === 'function') Promise.resolve(window.fluid.emit(kind, data)).catch(() => {});
  } catch (e) { /* the view works without the bridge */ }
}

// ---------- slide 1: a matrix is a table of weights ----------
function slideMachine(widget, side) {
  const u = U0.slice();
  let sel = 2, plot = null;                        // sel: 0-based output shown (y_3)
  const terms = k => [k - 1, k, k + 1].filter(j => j >= 0 && j < 5);
  const sls = u.map((v, i) => slider('$u_' + (i + 1) + '$', { id: 'u' + (i + 1), name: 'input u' + (i + 1), min: 0, max: 9, step: 1, value: v, fmt: String,
    onInput: x => { u[i] = x; update(); } }));
  const btns = [0, 1, 2, 3, 4].map(k => {
    const b = mark(h('button', 'btn'), 'control', 'out-' + (k + 1));
    setTex(b, '$y_' + (k + 1) + '$');
    b.addEventListener('click', () => { sel = k; update(); });
    return b;
  });
  const rowR = readout('row', String.raw`row of $M$ for the chosen output`);
  const rowY = readout('calc', String.raw`the weighted sum, then divided by 3`);
  widget.append(hh('div', 'five', ...sls.map(s => s.el)),
    hh('div', 'btnrow', h('span', 'lead', 'Choose an output:'), ...btns),
    legend([
      { chip: true, color: 'var(--pal-grey)', text: String.raw`grey: inputs $u_k$` },
      { chip: true, color: 'var(--pal-accent)', text: String.raw`blue: outputs $y_k$` },
      { color: 'var(--pal-accent)', text: String.raw`blue lines: weights $\tfrac13$ of the chosen output` },
      { color: 'var(--pal-line)', text: 'thin line: other wires' }]));
  plot = fillPlot(widget, draw);
  widget.append(hh('div', 'readouts', rowR.el, rowY.el));

  function draw(svg, W, H) {
    const ys = [0, 1, 2, 3, 4].map(i => 44 + (i + 0.5) * (H - 60) / 5);
    const xi = W * 0.28, xo = W * 0.72, r = 15;
    const y = avg3(u);
    svgTex(svg, xi, 14, String.raw`inputs $u$`, { w: 160, size: 16, fill: COL.text2 });
    svgTex(svg, xo, 14, String.raw`outputs $y$`, { w: 160, size: 16, fill: COL.text2 });
    for (let k = 0; k < 5; k++) for (const j of terms(k)) {
      const on = k === sel;
      svgNode('line', { x1: xi, y1: ys[j], x2: xo, y2: ys[k], stroke: on ? COL.accent : COL.line,
        'stroke-width': on ? 3 : 1.5, 'data-item': 'mark', 'data-id': 'wire-' + (j + 1) + '-' + (k + 1) }, svg);
    }
    for (let i = 0; i < 5; i++) {
      svgNode('circle', { cx: xi, cy: ys[i], r: r, fill: COL.grey, 'data-item': 'mark', 'data-id': 'in-' + (i + 1) }, svg);
      svgTex(svg, xi - 26, ys[i], '$u_{' + (i + 1) + '}=' + u[i] + '$', { anchor: 'end', w: 120, size: 16, fill: COL.text2 });
      svgNode('circle', { cx: xo, cy: ys[i], r: r, fill: i === sel ? COL.accent : COL.bluePale, 'data-item': 'mark', 'data-id': 'out-' + (i + 1) }, svg);
      svgTex(svg, xo + 26, ys[i], '$y_{' + (i + 1) + '}=' + y[i].toFixed(2) + '$', { anchor: 'start', w: 130, size: 16, fill: COL.text2 });
    }
  }
  function update() {
    btns.forEach((b, i) => b.classList.toggle('on', i === sel));
    const t = terms(sel), s = t.reduce((a, j) => a + u[j], 0);
    rowR.set('$\\left(' + [0, 1, 2, 3, 4].map(j => (t.includes(j) ? '\\tfrac13' : '0')).join(',\\ ') + '\\right)$');
    rowY.set('$\\tfrac13(' + t.map(j => 'u_' + (j + 1)).join('+') + ')=\\tfrac{' + s + '}{3}=' + (s / 3).toFixed(3) + '$');
    if (plot) plot.redraw();
  }
  side.append(
    sym(String.raw`$u$: five numbers in. $y$: five numbers out. $M$: the table of weights behind them; blank entries are $0$. Each $y_k$ averages the three inputs next to position $k$: it is the dot product of row $k$ of $M$ with $u$ (Primer · Vectors, step 4).`),
    triesList([
      String.raw`Keep $u=(1,4,2,8,5)$ and click $y_3$. The inputs $4$, $2$, $8$ give $\tfrac{14}{3}\approx4.667$.`,
      String.raw`Move $u_3$. Only $y_2$, $y_3$, $y_4$ change: the three outputs that read $u_3$.`,
      String.raw`Set $u_3=9$ and the other inputs to $0$. Which outputs read $3$?`,
    ]),
    whereLine(String.raw`every linear layer of a neural network is this table, with learned weights.`),
    takeLine(String.raw`A matrix is a table of weights: each output is a weighted sum of the inputs.`));
  update();
}

// ---------- slide 2: linear means add the inputs, and the outputs add ----------
function slideLinear(widget, side) {
  let A = 3, B = 3;                                // a: height at u_3; b: height at u_2
  const sA = slider('height of $a$ at $u_3$', { id: 'a', name: 'height of a', min: 0, max: 6, step: 1, value: A, fmt: String, onInput: v => { A = v; update(); } });
  const sB = slider('height of $b$ at $u_2$', { id: 'b', name: 'height of b', min: 0, max: 6, step: 1, value: B, fmt: String, onInput: v => { B = v; update(); } });
  const grid = h('div', 'sgrid');
  grid.append(h('div', 'sc head'));
  for (let k = 0; k < 5; k++) grid.append(setTex(h('div', 'sc head'), '$u_' + (k + 1) + '$'));
  const rowsSpec = [
    ['sec', String.raw`the two inputs`],
    ['$a$', 'a'], ['$b$', 'b'], ['$a+b$', 'ab'],
    ['sec', String.raw`smoother $M$: average of three neighbors`],
    ['$M(a+b)$', 'mab'], ['$Ma+Mb$', 'msum'],
    ['sec', String.raw`median of the same three neighbors`],
    ['$\\mathrm{med}(a+b)$', 'dab'], ['$\\mathrm{med}\\,a+\\mathrm{med}\\,b$', 'dsum'],
  ];
  const cells = {};
  for (const r of rowsSpec) {
    if (r[0] === 'sec') { grid.append(setTex(h('div', 'sec'), r[1])); continue; }
    grid.append(setTex(h('div', 'sc lab'), r[0]));
    cells[r[1]] = [0, 1, 2, 3, 4].map(() => { const c = h('div', 'sc'); grid.append(c); return c; });
  }
  const rAvg = readout('avg', String.raw`average: $M(a+b)=Ma+Mb$?`);
  const rMed = readout('med', String.raw`median: $\mathrm{med}(a+b)=\mathrm{med}\,a+\mathrm{med}\,b$?`);
  widget.append(hh('div', 'sliders', sA.el, sB.el), grid,
    legend([
      { chip: true, color: 'var(--pal-soft-2)', text: String.raw`grey: the values at $u_1$ to $u_5$` },
      { chip: true, color: 'var(--pal-red)', text: String.raw`red: the two sides differ here` }]),
    hh('div', 'readouts', rAvg.el, rMed.el));

  function update() {
    const a = [0, 0, A, 0, 0], b = [0, B, 0, 0, 0], ab = addv(a, b);
    const vals = { a: a, b: b, ab: ab, mab: avg3(ab), msum: addv(avg3(a), avg3(b)), dab: med3(ab), dsum: addv(med3(a), med3(b)) };
    for (const key in cells) cells[key].forEach((c, k) => { c.textContent = fmtN(vals[key][k]); });
    for (let k = 0; k < 5; k++) {
      const ba = Math.abs(vals.mab[k] - vals.msum[k]) > 1e-9, bm = Math.abs(vals.dab[k] - vals.dsum[k]) > 1e-9;
      cells.mab[k].classList.toggle('bad', ba); cells.msum[k].classList.toggle('bad', ba);
      cells.dab[k].classList.toggle('bad', bm); cells.dsum[k].classList.toggle('bad', bm);
    }
    const badAvg = !same(vals.mab, vals.msum), badMed = !same(vals.dab, vals.dsum);
    rAvg.set(badAvg ? 'no' : 'yes', badAvg);
    rMed.set(badMed ? 'no' : 'yes', badMed);
  }
  side.append(
    sym(String.raw`$a$, $b$: two inputs of five numbers. $M$: the smoother; it is linear (why, for every matrix: step 3). $\mathrm{med}$: the middle of the same three neighbors; it is not linear.`),
    nameLine(String.raw`<i>linear</i>: from Latin <i>līnea</i>, line. With one input, such a rule is $y=mx$: a straight line through 0.`),
    nameLine(String.raw`<i>superposition</i>: placing on top (<i>super-</i>). The answers to the parts, laid on top of each other, give the answer to the whole.`),
    triesList([
      String.raw`Keep both heights at $3$. The average rows match: $M(a+b)=(1,2,2,1,0)$ both ways.`,
      String.raw`Set $b$ to $0$. The median rows match too: with one spike there is nothing to mix.`,
      String.raw`Set $a$ to $6$. Which cells turn red?`,
    ]),
    takeLine(String.raw`A linear rule lets you split an input into parts, study each part, and add the answers.`));
  update();
}

// ---------- slide 3: solve a small system by elimination ----------
function slideSolve(widget, side) {
  let c = 1, plot = null;
  const sl = slider('$c$ in $x-y=c$', { id: 'c', name: 'right side c', min: -3, max: 5, step: 0.5, value: c, fmt: v => v.toFixed(1), onInput: v => { c = v; update(); } });
  const rX = readout('x', String.raw`$x=\tfrac{3+c}{2}$`);
  const rY = readout('y', String.raw`$y=\tfrac{3-c}{2}$`);
  const rCheck = readout('check', String.raw`check: $x+y$ and $x-y$`);
  widget.append(hh('div', 'sliders', sl.el), legend([
    { color: 'var(--pal-accent)', text: String.raw`blue line: $x+y=3$` },
    { color: 'var(--pal-muted)', text: String.raw`grey line: $x-y=c$` },
    { chip: true, color: 'var(--pal-ink)', text: String.raw`filled dot: where they cross` }]));
  plot = fillPlot(widget, draw);
  widget.append(hh('div', 'readouts', rX.el, rY.el, rCheck.el));

  function draw(svg, W, H) {
    const L = 30, R = 40, T = 14, B = 30, x0 = -2, x1 = 5, y0 = -2, y1 = 5;
    const s = Math.min((W - L - R) / (x1 - x0), (H - T - B) / (y1 - y0));
    const ox = L + ((W - L - R) - s * (x1 - x0)) / 2, oy = T + ((H - T - B) - s * (y1 - y0)) / 2;
    const X = x => ox + (x - x0) * s, Y = y => oy + (y1 - y) * s;
    svgNode('line', { x1: X(x0), y1: Y(0), x2: X(x1), y2: Y(0), stroke: COL.grey }, svg);
    svgNode('line', { x1: X(0), y1: Y(y0), x2: X(0), y2: Y(y1), stroke: COL.grey }, svg);
    for (let v = x0; v <= x1; v++) if (v !== 0) svgText(svg, X(v), Y(0) + 16, String(v), { 'text-anchor': 'middle', 'font-size': 13 });
    for (let v = y0; v <= y1; v++) if (v !== 0) svgText(svg, X(0) - 8, Y(v) + 4, String(v), { 'text-anchor': 'end', 'font-size': 13 });
    svgTex(svg, X(x1) + 14, Y(0), '$x$', { w: 30, anchor: 'start', size: 15 });
    svgTex(svg, X(0) + 14, Y(y1) + 4, '$y$', { w: 30, anchor: 'start', size: 15 });
    // x + y = 3, that is y = 3 - x, drawn across the whole box
    svgNode('line', { x1: X(x0), y1: Y(3 - x0), x2: X(x1), y2: Y(3 - x1), stroke: COL.accent, 'stroke-width': 2.5,
      'data-item': 'mark', 'data-id': 'sum-line' }, svg);
    // x - y = c, that is y = x - c, clipped to the box
    const xa = Math.max(x0, y0 + c), xb = Math.min(x1, y1 + c);
    svgNode('line', { x1: X(xa), y1: Y(xa - c), x2: X(xb), y2: Y(xb - c), stroke: COL.muted, 'stroke-width': 2.5,
      'data-item': 'mark', 'data-id': 'diff-line' }, svg);
    svgNode('circle', { cx: X((3 + c) / 2), cy: Y((3 - c) / 2), r: 6, fill: COL.ink, 'data-item': 'mark', 'data-id': 'solution' }, svg);
  }
  function update() {
    const xs = (3 + c) / 2, ys = (3 - c) / 2;
    rX.set(fmtN(xs));
    rY.set(fmtN(ys));
    rCheck.set('$' + fmtN(xs + ys) + '$ and $' + fmtN(xs - ys) + '$');
    if (plot) plot.redraw();
  }
  side.append(
    setTex(h('div', 'formula'), String.raw`$$\begin{pmatrix}1&1\\1&-1\end{pmatrix}\begin{pmatrix}x\\y\end{pmatrix}=\begin{pmatrix}3\\1\end{pmatrix}$$`),
    sym(String.raw`$x$, $y$: the two unknowns. Each equation is one line, and the solution is where both lines cross. The formula is for $c=1$. How elimination finds it: step 5.`),
    nameLine(String.raw`<i>eliminate</i>: from Latin <i>ē-</i>, out, and <i>līmen</i>, threshold: to put out of the door. Each step puts one unknown out.`),
    triesList([
      String.raw`Move $c$ to $-1$. The dot moves to $(1,2)$. Check: $1+2=3$ and $1-2=-1$.`,
      String.raw`Move $c$ to $3$. The lines cross on the $x$-axis at $(3,0)$.`,
    ]),
    whereLine(String.raw`in L15 Hamming's filter $ {y_n=a\,u_{n-1}+b\,u_n+a\,u_{n+1}}$ must keep the frequency $\tfrac16$ and kill $\tfrac13$: two linear equations, $ {b+a=1}$ and $ {b-a=0}$. Add them: $ {a=b=\tfrac12}.$`),
    takeLine(String.raw`Elimination removes one unknown at a time, at any size. Solving $ {Mu=y}$ runs step 1's machine backward: outputs to inputs.`));
  update();
}

// ---------- slide 4: an eigenvector keeps its direction ----------
function slideEigen(widget, side) {
  let th = 20, plot = null;
  const M = [[2, 1], [1, 2]];
  const mv = v => [M[0][0] * v[0] + M[0][1] * v[1], M[1][0] * v[0] + M[1][1] * v[1]];
  const sl = slider('$\\theta$, direction of $v$', { id: 'theta', name: 'angle theta', min: 0, max: 180, step: 1, value: th, fmt: v => v + '°', onInput: v => { th = v; update(); } });
  const rAng = readout('angle', String.raw`angle between $v$ and $Mv$`);
  const rStr = readout('stretch', String.raw`stretch $|Mv|/|v|$`);
  widget.append(hh('div', 'sliders', sl.el), legend([
    { color: 'var(--pal-muted)', text: String.raw`grey arrow: $v$, the direction you pick` },
    { color: 'var(--pal-accent)', text: String.raw`blue arrow: $Mv$, where $M$ sends it` },
    { color: 'var(--pal-ink)', dash: true, text: String.raw`dashed: the two eigen-directions` }]));
  plot = fillPlot(widget, draw);
  widget.append(hh('div', 'readouts', rAng.el, rStr.el));

  function draw(svg, W, H) {
    const s = Math.min(W, H) / 7.6, cx = W / 2, cy = H / 2;
    const P = (x, y) => [cx + x * s, cy - y * s];
    svgNode('line', { x1: 0, y1: cy, x2: W, y2: cy, stroke: COL.line }, svg);
    svgNode('line', { x1: cx, y1: 0, x2: cx, y2: H, stroke: COL.line }, svg);
    const e1 = [Math.SQRT1_2, Math.SQRT1_2], e2 = [-Math.SQRT1_2, Math.SQRT1_2];
    for (const [e, id] of [[e1, 'eig-1-1'], [e2, 'eig-1-minus-1']]) {
      const a = P(-3 * e[0], -3 * e[1]), b = P(3 * e[0], 3 * e[1]);
      svgNode('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: COL.ink, 'stroke-width': 1.2, 'stroke-dasharray': '6 4',
        'data-item': 'mark', 'data-id': id }, svg);
    }
    const l1 = P(2.2, 2.2), l2 = P(-2.2, 2.2);
    haloTex(svg, l1[0] + 46, l1[1] - 6, String.raw`$(1,1)$: $\lambda=3$`, { w: 170, size: 15, fill: COL.ink });
    haloTex(svg, l2[0] - 46, l2[1] - 6, String.raw`$(1,-1)$: $\lambda=1$`, { w: 170, size: 15, fill: COL.ink });
    const t = th * Math.PI / 180, v = [Math.cos(t), Math.sin(t)], w = mv(v);
    arrow(svg, [cx, cy], P(v[0], v[1]), COL.muted, 'v');
    arrow(svg, [cx, cy], P(w[0], w[1]), COL.accent, 'Mv');
  }
  function update() {
    const t = th * Math.PI / 180, v = [Math.cos(t), Math.sin(t)], w = mv(v);
    const dot = v[0] * w[0] + v[1] * w[1];
    const ang = Math.acos(Math.max(-1, Math.min(1, dot / (Math.hypot(v[0], v[1]) * Math.hypot(w[0], w[1]))))) * 180 / Math.PI;
    rAng.set(ang.toFixed(1) + '°');
    rStr.set(Math.hypot(w[0], w[1]).toFixed(3));
    if (plot) plot.redraw();
  }
  side.append(
    setTex(h('div', 'formula'), String.raw`$$Mv=\lambda v$$`),
    sym(String.raw`$M=\begin{pmatrix}2&1\\1&2\end{pmatrix}$: the matrix. $v$: a direction. $\lambda$: how far $M$ stretches $v$ along itself. Why no other direction works: step 7.`),
    nameLine(String.raw`<i>eigen</i>: German for own. The eigenvectors are the matrix's own directions, the ones it keeps.`),
    triesList([
      String.raw`Set $\theta=45^\circ$. The arrows lie on one line: $M(1,1)=(3,3)$, so $\lambda=3$.`,
      String.raw`Set $\theta=135^\circ$. The stretch is $1$: $M(1,-1)=(1,-1)$, so $\lambda=1$.`,
      String.raw`Set $\theta=20^\circ$. The arrows split. This direction is not an eigenvector.`,
    ]),
    takeLine(String.raw`An eigenvector is a direction the matrix only stretches; the stretch is its eigenvalue.`));
  update();
}

// ---------- slide 5: repeated steps keep the largest eigenvalue ----------
function slidePowers(widget, side) {
  let k = 1, plot = null;
  const sl = slider('$k$, times $M$ is applied', { id: 'k', name: 'k', min: 0, max: 10, step: 1, value: k, fmt: String, onInput: v => { k = v; update(); } });
  const rVec = readout('vec', String.raw`$M^{k}u$, exact`);
  const rW = readout('weight', String.raw`weight on $(1,1)$`);
  widget.append(hh('div', 'sliders', sl.el), legend([
    { color: 'var(--pal-accent)', text: String.raw`blue arrow: the direction of $M^{k}u$, length set to $1$` },
    { color: 'var(--pal-ink)', dash: true, text: String.raw`dashed: the eigen-directions` }]),
    legend([
    { chip: true, color: 'var(--pal-accent)', text: String.raw`blue bar: weight on $(1,1)$, eigenvalue $3$` },
    { chip: true, color: 'var(--pal-grey)', text: String.raw`grey bar: weight on $(1,-1)$, eigenvalue $1$` }]));
  plot = fillPlot(widget, draw);
  widget.append(hh('div', 'readouts', rVec.el, rW.el));

  function draw(svg, W, H) {
    const Wl = Math.floor(W * 0.5), cx = Wl / 2, cy = H / 2, s = Math.min(Wl, H) / 3.4;
    const P = (x, y) => [cx + x * s, cy - y * s];
    // M^k u = (pp, qq) exactly; its direction is what the arrow shows.
    const p3 = Math.pow(3, k), pp = (p3 + 1) / 2, qq = (p3 - 1) / 2;
    const len = Math.hypot(pp, qq), d = [pp / len, qq / len];
    const e1 = [Math.SQRT1_2, Math.SQRT1_2], e2 = [Math.SQRT1_2, -Math.SQRT1_2];
    for (const [e, id] of [[e1, 'eig-1-1'], [e2, 'eig-1-minus-1']]) {
      const a = P(-1.25 * e[0], -1.25 * e[1]), b = P(1.25 * e[0], 1.25 * e[1]);
      svgNode('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: COL.ink, 'stroke-width': 1.2, 'stroke-dasharray': '6 4',
        'data-item': 'mark', 'data-id': id }, svg);
    }
    arrow(svg, [cx, cy], P(d[0], d[1]), COL.accent, 'direction');
    const n1 = P(1.25 * Math.SQRT1_2, 1.25 * Math.SQRT1_2), n2 = P(1.25 * Math.SQRT1_2, -1.25 * Math.SQRT1_2);
    haloTex(svg, n1[0] + 34, n1[1] - 8, '$(1,1)$', { w: 80, size: 15, fill: COL.ink });
    haloTex(svg, n2[0] + 40, n2[1] + 10, '$(1,-1)$', { w: 90, size: 15, fill: COL.ink });

    // Right: the weights on the two eigenvectors, as bars. Weights are the coefficients 3^k/2 and 1/2.
    const f1 = p3 / (p3 + 1), f2 = 1 / (p3 + 1);
    const bx = Wl + 26, bw = Math.max(60, W - bx - 90);
    const rows = [[H * 0.34, f1, COL.accent, 'bar-1,1'], [H * 0.68, f2, COL.grey, 'bar-1,-1']];
    const labels = [String.raw`weight on $(1,1)$, eigenvalue $3$`, String.raw`weight on $(1,-1)$, eigenvalue $1$`];
    rows.forEach(([y, f, col, id], i) => {
      svgTex(svg, bx, y - 22, labels[i], { w: W - bx - 10, anchor: 'start', size: 15, fill: COL.text2 });
      svgNode('rect', { x: bx, y: y - 10, width: bw, height: 20, fill: 'none', stroke: COL.line }, svg);
      svgNode('rect', { x: bx, y: y - 10, width: Math.max(0, f * bw), height: 20, fill: col, 'data-item': 'mark', 'data-id': id }, svg);
      svgTex(svg, bx + bw + 8, y, sciTex(f), { w: 80, anchor: 'start', size: 15, fill: COL.ink });
    });
  }
  function update() {
    const p3 = Math.pow(3, k), pp = (p3 + 1) / 2, qq = (p3 - 1) / 2;
    rVec.set('$(' + pp + ',\\ ' + qq + ')$');
    rW.set((p3 / (p3 + 1)).toFixed(6));
    if (plot) plot.redraw();
  }
  side.append(
    setTex(h('div', 'formula'), String.raw`$$M^{k}u=\tfrac12\,3^{k}\,(1,1)+\tfrac12\,(1,-1)$$`),
    sym(String.raw`$u=(1,0)$: the start. $M^{k}$: $M$ applied $k$ times. Split $u=\tfrac12(1,1)+\tfrac12(1,-1)$: along each eigenvector, $M$ only multiplies (why the formula holds: step 9).`),
    triesList([
      String.raw`Set $k=1$: $Mu=(2,1)$. Check: $M(1,0)=(2,1)$.`,
      String.raw`Set $k=10$: $M^{10}u=(29525,\,29524)$. The arrow points almost along $(1,1)$.`,
      String.raw`Watch the grey bar. Its part stays $\tfrac12$ while the blue part grows like $3^{k}$.`,
    ]),
    whereLine(String.raw`a loop that applies the same step again and again, as in L17 03:24, is a power of a matrix.`),
    takeLine(String.raw`Repeated multiplication keeps the largest eigenvalue's part, so the direction settles on its eigenvector.`));
  update();
}

// ---------- step 3: why every matrix is linear (proof) ----------
// Inputs c*a + b, each drawn as two parts: blue c*a_j, grey b_j. Outputs drawn the same way:
// blue c*(Ma)_k, grey (Mb)_k. The chosen output's wires carry both parts as two strands.
const LIN_A = [1, 4, 2, 8, 5], LIN_B = [2, 1, 3, 2, 0];
const nbrs = k => [k - 1, k, k + 1].filter(j => j >= 0 && j < 5);
function drawStack(svg, W, H, c, sel, lit) {
  const ca = LIN_A.map(x => c * x), Ma = avg3(LIN_A).map(x => c * x), Mb = avg3(LIN_B);
  const k1 = sel + 1;
  const CAP = {
    row: String.raw`amber: $y_${k1}$ reads row ${k1}: three inputs, each times $\tfrac13$`,
    split: String.raw`amber: each wire carries a blue part and a grey part`,
    out: String.raw`amber: $y_${k1}$ = blue part $c\,(Ma)_${k1}$ + grey part $(Mb)_${k1}$`,
    scale: String.raw`amber: every blue part, in and out, is $c$ times a part of $a$`,
  };
  capTop(svg, W, CAP[lit] || String.raw`each output adds its three inputs, times $\tfrac13$`, !!CAP[lit]);
  const y0 = 56, gap = (H - y0 - 4) / 5;
  const ys = [0, 1, 2, 3, 4].map(i => y0 + (i + 0.5) * gap);
  const r = Math.max(8, Math.min(12, gap * 0.3)), xi = W * 0.47, xo = W * 0.66;
  svgTex(svg, xi + r, 38, String.raw`inputs $ca+b$`, { w: 220, anchor: 'end', size: 15, fill: COL.text2 });
  svgTex(svg, xo - r, 38, String.raw`outputs $M(ca+b)$`, { w: 240, anchor: 'start', size: 15, fill: COL.text2 });
  const xL = xi - r - 6, xR = xo + r + 6;
  const sc = Math.min((xL - 6) / 18, (W - 6 - xR) / (35 / 3));   // one fixed scale: the largest bars, at c = 2, just fit
  const bh = Math.max(10, Math.min(24, gap * 0.5));
  const wires = nbrs(sel).map(j => {
    const p = [xi + r, ys[j]], q = [xo - r, ys[sel]];
    const len = Math.hypot(q[0] - p[0], q[1] - p[1]), n = [-(q[1] - p[1]) / len, (q[0] - p[0]) / len];
    return { j, p, q, n };
  });
  // glows under everything
  if (lit === 'row' || lit === 'split') for (const w of wires) glowLine(svg, w.p, w.q, lit === 'row' ? 16 : 12);
  if (lit === 'row') for (const w of wires) glowBox(svg, xL - (ca[w.j] + LIN_B[w.j]) * sc, ys[w.j] - bh / 2, (ca[w.j] + LIN_B[w.j]) * sc + 2 * r + 8, bh, 4);

  const plot = proofLeft(widget, {

    draw: (svg, W, Hh) => drawEigenProof(svg, W, Hh, th, lit),
    legend: [
      { color: 'var(--pal-muted)', text: String.raw`grey: $v$ and its parts $p+q$, $p-q$` },
      { color: 'var(--pal-accent)', text: String.raw`blue: $Mv$ and its parts` },
      { chip: true, color: 'var(--pal-grey)', text: String.raw`dots: where each drops onto a dashed line` }],
    tests: [
      String.raw`Sweep $\theta$ from $0^\circ$ to $180^\circ$. The angle is 0 only at $45^\circ$ and $135^\circ$. 181 angles are evidence; the proof covers every direction.`,
      String.raw`Watch the gauges. Along $(1,1)$ the blue bar is always 3 times the grey; along $(1,-1)$ they match.`],
    model: String.raw`$M$ does two separate jobs: it triples the part of $v$ along $(1,1)$ and keeps the part along $(1,-1)$. A direction survives only if one part is zero.` });
  proofRight(side, {
    id: 'eigen-directions',
    goal: { tex: String.raw`Mv=\lambda v,\ v\ne0`, words: String.raw`only along $(1,1)$ with $\lambda=3$, or $(1,-1)$ with $\lambda=1$` },
    facts: [
      { words: String.raw`$M$ has rows $(2,1)$ and $(1,2)$`, ref: 'step 6' },
      { words: 'two equations can be added', ref: 'step 5' }],
    lines: [
      { tex: String.raw`2p+q=\lambda p,\ \ p+2q=\lambda q`, move: 'Unfold the definition',
        why: String.raw`$Mv=\lambda v$ row by row, for $v=(p,q)$`, choices: ['Name a piece', 'Rearrange'], highlight: 'coords' },
      { tex: String.raw`3(p+q)=\lambda(p+q),\ \ p-q=\lambda(p-q)`, move: 'Compute it two ways',
        why: 'add the two equations, then subtract them, as in step 5', choices: ['Rearrange', 'Use symmetry'], highlight: 'shadows' },
      { tex: String.raw`(\lambda-3)(p+q)=0,\ \ (\lambda-1)(p-q)=0`, move: 'Rearrange',
        why: 'move all to one side and factor', choices: ['Undo with the inverse', 'Compare or bound'], highlight: 'same' },
      { tex: String.raw`\lambda\ne3,1\ \Rightarrow\ p+q=p-q=0`, move: 'Contradiction',
        why: String.raw`suppose $\lambda$ is neither; divide by $\lambda-3$ and $\lambda-1$. Then $v=0$, but $v\ne0$`, choices: ['Compare or bound', 'Induction'], highlight: 'zero' },
      { tex: String.raw`v=p\,(1,1)\ \text{ or }\ v=p\,(1,-1)`, move: 'Rearrange',
        why: String.raw`$\lambda=3$: divide line 3 by $\lambda-1=2$, so $p=q$. $\lambda=1$: by $-2$, so $q=-p$`, choices: ['Use symmetry', 'Undo with the inverse'], highlight: 'lines' }],
    lookBack: [
      { q: 'What made it work?',
        a: String.raw`Adding and subtracting split $M$ into two separate jobs: triple $p+q$, keep $p-q$. For another matrix the right mix differs, and finding it is finding the eigenvectors. The general method, $\det(M-\lambda I)=0$, needs determinants, which this primer leaves out.` },
      { q: 'Where does it break?',
        a: String.raw`A quarter turn, with rows $(0,-1)$ and $(1,0)$, moves every direction: $-q=\lambda p$ and $p=\lambda q$ give $p=-\lambda^2p$, so $\lambda^2=-1$. No real $\lambda$ exists; the eigenvalues are $\pm i$ (Primer · Complex numbers, step 1).` }] },
    plot, key => { lit = key || ''; plot.redraw(); });
  function update() {
    const t = th * Math.PI / 180, v = [Math.cos(t), Math.sin(t)], w = [M[0][0] * v[0] + M[0][1] * v[1], M[1][0] * v[0] + M[1][1] * v[1]];
    const ang = Math.acos(Math.max(-1, Math.min(1, (v[0] * w[0] + v[1] * w[1]) / Math.hypot(w[0], w[1])))) * 180 / Math.PI;
    rA.set((ang < 0.05 ? 0 : ang).toFixed(1) + '°');
    plot.redraw();
  }
  update();
}

// ---------- step 9: why M^k u = 3^k/2 (1,1) + 1/2 (1,-1) (proof) ----------
// M^k u drawn as its two parts tip to tail, and the same after one more M: the (1,1) part triples,
// the (1,-1) part stays.
function drawPowersProof(svg, W, H, k, lit) {
  const CAP = {
    base: String.raw`amber: $u=(1,0)$ splits into $\tfrac12(1,1)$ and $\tfrac12(1,-1)$`,
    next: String.raw`amber: $M^{k+1}u$ is $M$ applied once more to $M^ku$`,
    parts: String.raw`amber: $M$ acts on each part of $M^ku$ alone`,
    eigen: String.raw`amber: the $(1,1)$ part triples; the $(1,-1)$ part stays`,
    limit: String.raw`amber: the angle to the $(1,1)$ line goes to 0`,
  };
  capTop(svg, W, CAP[lit] || String.raw`$M^ku$ and $M^{k+1}u$, each as two parts tip to tail`, !!CAP[lit]);
  const T = 30, a = Math.pow(3, k) / 2, an = 3 * a;
  const Bk = [a, a], Bn = [an, an], Sk = [a + 0.5, a - 0.5], Sn = [an + 0.5, an - 0.5];
  const xmin = 0, xmax = an + 0.5, ymin = Math.min(0, a - 0.5), ymax = an;
  const padL = 30, padR = 96, padT = 20, padB = 26;
  const s = Math.min((W - padL - padR) / (xmax - xmin), (H - T - padT - padB) / (ymax - ymin));
  const ox = padL + ((W - padL - padR) - s * (xmax - xmin)) / 2, oy = T + padT + ((H - T - padT - padB) - s * (ymax - ymin)) / 2;
  const P = p => [ox + (p[0] - xmin) * s, oy + (ymax - p[1]) * s];
  const O = P([0, 0]), D = 1.08 * an;
  if (lit === 'base') { glowLine(svg, O, P(Bk), 14); glowLine(svg, P(Bk), P(Sk), 14); }
  if (lit === 'next') { glowLine(svg, O, P(Sk), 13); glowLine(svg, O, P(Sn), 13); }
  if (lit === 'parts') { glowLine(svg, O, P(Bn), 14); glowLine(svg, P(Bn), P(Sn), 14); }
  if (lit === 'eigen') { glowLine(svg, P(Bk), P(Bn), 14); glowLine(svg, P(Bk), P(Sk), 14); glowLine(svg, P(Bn), P(Sn), 14); }
  if (lit === 'limit') glowLine(svg, O, P([D, D]), 12);
  // the two eigen-directions through the origin
  svgNode('line', { x1: O[0], y1: O[1], x2: P([D, D])[0], y2: P([D, D])[1], stroke: COL.ink, 'stroke-width': 1.2, 'stroke-dasharray': '6 4', 'data-item': 'mark', 'data-id': 'eig-1-1' }, svg);
  const e2 = Math.min(0.9, 0.12 * an);
  svgNode('line', { x1: P([-e2, e2])[0], y1: P([-e2, e2])[1], x2: P([e2, -e2])[0], y2: P([e2, -e2])[1], stroke: COL.ink, 'stroke-width': 1.2, 'stroke-dasharray': '6 4', 'data-item': 'mark', 'data-id': 'eig-1-minus-1' }, svg);
  haloTex(svg, P([D, D])[0] + 6, P([D, D])[1], '$(1,1)$', { w: 70, anchor: 'start', size: 15, fill: COL.ink });
  // parts: blue along (1,1), grey along (1,-1); the sums in black
  arrow(svg, O, P(Bn), COL.blueLight, 'part-1-1-next', 6);
  arrow(svg, O, P(Bk), COL.accent, 'part-1-1', 3);
  arrow(svg, P(Bn), P(Sn), COL.muted, 'part-1-minus-1-next', 3);
  arrow(svg, P(Bk), P(Sk), COL.muted, 'part-1-minus-1', 3);
  arrow(svg, O, P(Sk), COL.ink, 'Mku', 1.5);
  arrow(svg, O, P(Sn), COL.ink, 'Mk1u', 1.5);
  const lk = P(Sk), ln = P(Sn);
  haloTex(svg, lk[0] + 8, lk[1] + 14, '$M^ku$', { w: 70, anchor: 'start', size: 15, fill: COL.ink });
  haloTex(svg, ln[0] + 8, ln[1] + 14, '$M^{k+1}u$', { w: 90, anchor: 'start', size: 15, fill: COL.ink });
  if (lit === 'eigen') {
    const m = P([(a + an) / 2, (a + an) / 2]);
    haloTex(svg, m[0] - 14, m[1] - 14, String.raw`$\times3$`, { w: 50, anchor: 'end', size: 15, fill: COL.amberInk, bg: COL.amberBg });
    const g = P([an + 0.25, an - 0.25]);
    haloTex(svg, g[0] - 12, g[1] + 6, String.raw`$\times1$`, { w: 50, anchor: 'end', size: 15, fill: COL.amberInk, bg: COL.amberBg });
  }
  if (lit === 'limit') {
    const g = j => String(+(Math.atan(Math.pow(3, -j)) * 180 / Math.PI).toPrecision(3));
    haloTex(svg, 8, T + 14, String.raw`angle to $(1,1)$: $` + g(k) + String.raw`^\circ$, then $` + g(k + 1) + String.raw`^\circ$`, { w: 300, anchor: 'start', size: 15, fill: COL.amberInk, bg: COL.amberBg });
  }
}
function slideWhyPowers(widget, side) {
  let k = 1, lit = '';
  const sl = slider('$k$', { id: 'k', name: 'k', min: 0, max: 5, step: 1, value: k, fmt: String, onInput: v => { k = v; update(); } });
  const rK = readout('mku', String.raw`$M^ku$`);
  const rN = readout('mk1u', String.raw`$M^{k+1}u$`);
  const rA = readout('angle', String.raw`angle of $M^ku$ to $(1,1)$`);
  const plot = proofLeft(widget, {
    controls: [sl.el],
    draw: (svg, W, Hh) => drawPowersProof(svg, W, Hh, k, lit),
    legend: [
      { color: 'var(--pal-accent)', text: String.raw`blue: part along $(1,1)$` },
      { color: 'var(--pal-blue-light)', text: String.raw`lighter blue: that part after one more $M$` },
      { color: 'var(--pal-muted)', text: String.raw`grey: part $\tfrac12(1,-1)$` },
      { color: 'var(--pal-ink)', text: String.raw`filled: the sums` }],
    readouts: [rK, rN, rA],
    tests: [
      String.raw`Set $k=2$. The formula gives $\tfrac92(1,1)+\tfrac12(1,-1)=(5,4)$, and row by row $M(2,1)=(5,4)$.`,
      String.raw`Raise $k$. The blue part triples at each step; the grey part stays $\tfrac12(1,-1)$. Cases up to 5 are evidence; the proof covers every $k$.`],
    model: String.raw`Split $u$ along the two eigenvectors, and $M$ works on each part alone: one part triples at every step, the other stays. After $k$ steps the parts are $3^k$ to 1.` });
  proofRight(side, {
    id: 'powers',
    goal: { tex: String.raw`M^ku=\tfrac12\,3^k(1,1)+\tfrac12(1,-1)`, words: String.raw`for every $k\ge0$, $u=(1,0)$; and it turns to $(1,1)$` },
    facts: [
      { tex: String.raw`M(ca+db)=c\,Ma+d\,Mb`, ref: 'step 3' },
      { tex: String.raw`M(1,1)=3(1,1),\ \ M(1,-1)=(1,-1)`, ref: 'step 6' }],
    lines: [
      { tex: String.raw`M^0u=(1,0)=\tfrac12(1,1)+\tfrac12(1,-1)`, move: 'Add zero or multiply by one',
        why: String.raw`the case $k=0$: $1=\tfrac12+\tfrac12$ and $0=\tfrac12-\tfrac12$`, choices: ['Name a piece', 'Change variables'], highlight: 'base' },
      { tex: String.raw`M^{k+1}u=M\big(\tfrac12\,3^k(1,1)+\tfrac12(1,-1)\big)`, move: 'Induction',
        why: String.raw`assume the formula for $k$, and apply $M$ once more`, choices: ['Unfold the definition', 'Telescope'], highlight: 'next' },
      { tex: String.raw`=\tfrac12\,3^k\,M(1,1)+\tfrac12\,M(1,-1)`, move: 'Use an earlier result',
        why: String.raw`$M$ is linear (step 3)`, choices: ['Rearrange', 'Use symmetry'], highlight: 'parts' },
      { tex: String.raw`=\tfrac12\,3^{k+1}(1,1)+\tfrac12(1,-1)`, move: 'Use an earlier result',
        why: String.raw`the eigenvectors (step 6). This is the formula for $k+1$, so with line 1 it holds for every $k$`, choices: ['Rearrange', 'Compute it two ways'], highlight: 'eigen' },
      { tex: String.raw`3^{-k}M^ku=\tfrac12(1,1)+\tfrac12\,3^{-k}(1,-1)\to\tfrac12(1,1)`, move: 'Take a limit',
        why: String.raw`divide by $3^k$ (the length changes, the direction does not) and let $k\to\infty$`, choices: ['Compare or bound', 'Undo with the inverse'], highlight: 'limit' }],
    lookBack: [
      { q: 'What did the proof need?',
        a: String.raw`Two facts: $M$ is linear, and $u$ splits into eigenvectors. Any matrix whose eigenvectors can build every start works the same way: each part is multiplied by its own $\lambda^k$, and the largest $|\lambda|$ wins.` },
      { q: 'Where does it break?',
        a: String.raw`If the start has no part along $(1,1)$, as $u=(1,-1)$, then $M^ku=(1,-1)$ for every $k$. And if two eigenvalues have the same size, as $3$ and $-3$, neither part wins.` },
      { q: 'Where do you meet it?',
        a: String.raw`In a linear RNN the gradient meets the same $W$ at every time step, so $W^k$ appears. It vanishes if the largest $|\lambda|$ is below 1, and can explode only if it is above 1 (Pascanu et al., 2013, by this argument).` }] },
    plot, key => {
      lit = key || '';
      if (lit === 'base' && k !== 0) { k = 0; sl.input.value = 0; sl.show(); update(); }
      else plot.redraw();
    }, CLOSING);
  side.querySelector('fl-proof-steps').primerMoves = PRIMER_MOVES;
  side.querySelector('fl-proof-steps').endNote = NEXT;
  function update() {
    const p3 = Math.pow(3, k);
    rK.set('$(' + (p3 + 1) / 2 + ',\\ ' + (p3 - 1) / 2 + ')$');
    rN.set('$(' + (3 * p3 + 1) / 2 + ',\\ ' + (3 * p3 - 1) / 2 + ')$');
    rA.set(String(+(Math.atan(1 / p3) * 180 / Math.PI).toPrecision(3)) + '°');
    plot.redraw();
  }
  update();
}
// The view's close. The primer's last proof lists every move the primer's proofs used, in order of first
// use, once it is proved, so the list never gives a pick away; the last step names what comes next.
const CLOSING = 'Look back: under the picture.';
const PRIMER_MOVES = ['Unfold the definition', 'Rearrange', 'Compute it two ways', 'Contradiction', 'Add zero or multiply by one', 'Induction', 'Use an earlier result', 'Take a limit'];
const NEXT = 'Next: Primer · Least squares.';

// ---------- frame ----------
const SLIDES = [
  { id: 'machine', tag: 'Used in L14 32:58 · L15 06:01', title: 'A matrix is a machine that makes weighted sums',
    question: String.raw`What is a matrix, and why think of it as a machine?`,
    formula: String.raw`$$y=Mu,\qquad y_k=\tfrac13\,(u_{k-1}+u_k+u_{k+1})$$`, mount: slideMachine },
  { id: 'linear', tag: 'Used in L14 08:25 · L15 09:11 to 09:43', title: 'Linear: add the inputs, and the outputs add',
    question: String.raw`What does linear mean, and what is superposition?`,
    formula: String.raw`$$M(a+b)=Ma+Mb$$`, mount: slideLinear },
  { id: 'why-linear', proof: true, tag: 'Used in L14 08:25 · L15 09:11 to 09:43', title: "Why it's true: every matrix is linear",
    question: String.raw`Does $M(a+b)=Ma+Mb$ hold for every matrix?`, mount: slideWhyLinear },
  { id: 'solve', tag: 'Used in L14 31:52 · L15 06:01', title: 'Solve by elimination: two lines cross once',
    question: 'How do you solve a small linear system?', mount: slideSolve },
  { id: 'why-elimination', proof: true, tag: 'Used in L14 31:52 · L15 06:01', title: String.raw`Why it's true: $x=\tfrac{3+c}{2}$, $y=\tfrac{3-c}{2}$`,
    question: String.raw`Is the crossing always at this point, and is it the only one?`, mount: slideWhyElim },
  { id: 'eigenvector', tag: 'Used in L14 09:30 to 10:34 · L24 05:54', title: 'An eigenvector keeps its direction',
    question: 'What is an eigenvector?', mount: slideEigen },
  { id: 'why-eigen-directions', proof: true, tag: 'Used in L14 09:30 to 10:34 · L24 05:54', title: "Why it's true: only two eigen-directions",
    question: String.raw`Are $(1,1)$ and $(1,-1)$ the only directions $M$ only stretches?`, mount: slideWhyEigen },
  { id: 'powers', tag: 'Used in L14 09:30 · L17 03:24', title: 'Repeated steps keep the largest eigenvalue',
    question: 'Why do eigenvectors make a matrix simple?', mount: slidePowers },
  { id: 'why-powers', proof: true, tag: 'Used in L14 09:30 · L17 03:24', title: String.raw`Why it's true: $M^ku=\tfrac12\,3^k(1,1)+\tfrac12(1,-1)$`,
    question: String.raw`What is $M^ku$ for every $k$, and why does its direction settle on $(1,1)$?`, mount: slideWhyPowers },
];

let cur = 0, shownId = null, endSent = false;
function goTo(i) {
  epoch++;
  PLOTS = [];
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  if (shownId !== null && shownId !== s.id) emit('view.step', { step: s.id });
  shownId = s.id;
  const stage = $('#stage');
  stage.innerHTML = '';
  const widget = h('div', 'widget');
  const side = hh('div', 'side',
    h('div', 'tag', s.tag),
    setTex(h('h2'), s.title),
    setTex(h('p', 'question'), s.question),
    s.formula && !s.proof ? setTex(h('div', 'formula'), s.formula) : null);
  const sec = mark(h('section', 'slide' + (s.proof ? ' proof-slide' : '')), 'step', s.id, s.title);
  sec.append(widget, side);
  stage.append(sec);
  stage.scrollTop = 0;
  s.mount(widget, side);
  if (cur === SLIDES.length - 1) {
    if (!endSent) { endSent = true; emit('view.action', { action: 'deck-end' }); }
  }
  tex(sec);
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, i) => d.classList.toggle('on', i === cur));
}
// A cue is a state: go to the named step, and do nothing if it is already shown.
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i >= 0 && i !== cur) goTo(i);
}
(function init() {
  const dots = $('#dots');
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = s.title;
    b.addEventListener('click', () => goTo(i));
    dots.appendChild(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],textarea,select')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primer · Series: geometric and Taylor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../../components/theme.js"></script>
<style>
/* Colors come from the theme palette (../../components/theme.js): one accent (blue), red only for a failing check. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft);
  --red:var(--pal-red); --redbg:var(--pal-red-bg);
  --u:clamp(16px,1.35vw,20px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 24px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(6px,1vh,12px) 24px}
footer{display:flex;align-items:center;gap:10px;padding:8px 24px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Slide frame: widget on the left (3/5), text on the right (2/5). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(18px,2.4vw,40px)}
.widget{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(6px,1vh,10px);overflow:hidden}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(6px,1.1vh,12px);overflow:hidden}
.tag{font:14px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(20px,1.9vw,28px);line-height:1.2;margin:0;font-weight:650}
.question{margin:0;font-size:clamp(16px,1.3vw,18px);font-weight:600}
.case{margin:0;font-size:16px;color:var(--fg)}
.formula{font-size:clamp(18px,1.8vw,26px)}
.sym{margin:0;font-size:16px;color:var(--muted)}
.tries{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.tries li::marker{color:var(--accent);font-weight:600}
.takeaway{margin:0;padding:10px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}
.closing{margin:0;font-size:17px;font-weight:600}
.next{margin:0;font-size:16px;color:var(--muted)}

/* Controls and readouts */
.sliders{display:flex;gap:8px 24px;flex-wrap:wrap;width:100%}
.slide-ctl{display:flex;align-items:center;gap:8px;font-size:16px}
.slide-ctl input{width:clamp(120px,11vw,170px);vertical-align:middle;accent-color:var(--accent)}
.slide-ctl .val{min-width:52px}
.btnrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--pal-panel);border-radius:8px;cursor:pointer;font-size:16px}
.btn.on{background:var(--chip);border-color:var(--accent);color:var(--pal-accent-deep)}
.readouts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.readout{flex:1 1 150px;min-width:0;padding:4px 8px;border-radius:10px;background:var(--pal-soft);font-size:15px;overflow-wrap:anywhere}
.readout .k{color:var(--muted);font-size:14px}
.readout .val{font-size:16px;font-weight:600}
.readout.bad{background:var(--redbg);color:var(--red)}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:15px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:20px;height:0;vertical-align:middle;margin-right:6px}
.chip{display:inline-block;width:18px;height:12px;vertical-align:middle;margin-right:6px;border-radius:2px}

/* Plots fill the space left in the widget column */
.fill{flex:1 1 0;min-height:160px;position:relative;width:100%}
.fill>svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* Name lines: what a term's name means */
.name i{font-style:italic}

/* Definitions table: each series, its term t_k, and the recipe */
.defs{width:100%;border-collapse:collapse;font-size:clamp(16px,1.35vw,18px)}
.defs th{font-weight:600;font-size:15px;color:var(--muted);text-align:left;padding:0 8px 2px 0}
.defs td{padding:3px 8px 3px 0;vertical-align:middle;border-top:1px solid var(--pal-soft-3)}
.defs .ref{font-size:15px;color:var(--muted)}
.defs .expand{display:block;font-size:18px}

/* Proof slides: test and picture on the left, the proof (fl-proof-steps) on the right */
.slide.proof-slide{grid-template-columns:minmax(0,11fr) minmax(0,9fr)}
.slide.proof-slide .side{justify-content:flex-start}
.slide.proof-slide .fill{min-height:180px}
.slide.proof-slide .slide-ctl input{width:clamp(90px,8vw,130px)}
.slide.proof-slide .slide-ctl .val{min-width:30px}
.slide.proof-slide .sliders{gap:6px 18px;align-items:center}
.slide.proof-slide .legend{gap:4px 12px}
.part{margin:0;font-weight:600;color:var(--muted)}
.test{display:flex;flex-direction:column;gap:3px}
.test .tries{gap:3px}
.model{margin:0;padding:8px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}

/* Short windows (1100x620 and similar): tighter spacing, body text stays 16px */
@media (max-height: 680px){
  header{padding-top:4px}
  #stage{padding:2px 24px}
  footer{padding:3px 24px}
  .widget{gap:5px}
  .side{gap:4px}
  .tries{gap:3px}
  .sym,.tries{line-height:1.2}
  .takeaway{padding:6px 10px}
  .formula{font-size:20px}
  .fill{min-height:130px}
  .readout{padding:3px 8px}
  h2{font-size:20px}
  .defs td{padding:1px 8px 1px 0}
  .model{padding:5px 10px}
  .test .tries{gap:1px}
  .slide.proof-slide .fill{min-height:140px}
  .slide.proof-slide .side{gap:2px}
  .slide.proof-slide .tag{font-size:13px;line-height:1.2}
  .slide.proof-slide h2{line-height:1.12}
}
</style>
</head>
<body>
<header>Primer · Series: geometric and Taylor</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script src="../../components/proof-steps.js"></script>
<script>
// ---------- palette and redraw ----------
// COL holds the palette colors for the SVG being drawn. fillPlot reads it at every paint, so a draw always
// uses the current theme. Light values are the old literals, so the light theme is unchanged.
let COL = {};
const PAL_NAMES = ['ink', 'text-2', 'muted', 'grey', 'grey-blue', 'slate-2', 'accent', 'accent-2', 'accent-deep',
  'blue-deep', 'blue-pale', 'guide', 'line', 'soft', 'soft-2', 'grid', 'soft-3', 'panel', 'on-accent', 'bg',
  'amber', 'amber-bg', 'amber-ink', 'red'];
function readPalette() {
  const o = {};
  for (const n of PAL_NAMES) o[n.replace(/-(\w)/g, (_, c) => c.toUpperCase())] = FluidTheme.color(n);
  return o;
}
let PLOTS = [];   // the plots on the current slide; a theme switch redraws them, and keeps every control's state
window.addEventListener('fluid-themechange', () => PLOTS.forEach(p => p.redraw()));

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const NSV = 'http://www.w3.org/2000/svg', NHT = 'http://www.w3.org/1999/xhtml';
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false } ], throwOnError: false };
// Render $...$ and $$...$$ in a node. If the CDN did not load, the text stays as typed.
function tex(node) {
  if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH);
  return node;
}
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function hh(tag, cls, ...kids) {
  const e = h(tag, cls);
  for (const k of kids) if (k) e.append(k);
  return e;
}
function mark(e, kind, id, title) {
  e.dataset.item = kind;
  if (id != null) e.dataset.id = id;
  if (title != null) e.dataset.title = title;
  return e;
}
function svgNode(tag, attrs, parent) {
  const e = document.createElementNS(NSV, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function svgRoot(w, ht) {
  return svgNode('svg', { viewBox: '0 0 ' + w + ' ' + ht, role: 'img', 'font-family': 'system-ui, sans-serif', 'font-size': 14 });
}
function svgText(parent, x, y, s, attrs) {
  const t = svgNode('text', Object.assign({ x: x, y: y, fill: COL.muted }, attrs || {}), parent);
  t.textContent = s;
  return t;
}
// A KaTeX label over an SVG: a foreignObject holding a rendered formula.
function svgTex(parent, x, y, s, o) {
  o = o || {};
  const w = o.w || 220, ht = 26, anchor = o.anchor || 'middle';
  const x0 = anchor === 'end' ? x - w : anchor === 'start' ? x : x - w / 2;
  const fo = svgNode('foreignObject', { x: x0, y: y - ht / 2, width: w, height: ht }, parent);
  const d = document.createElementNS(NHT, 'div');
  const jc = anchor === 'end' ? 'flex-end' : anchor === 'start' ? 'flex-start' : 'center';
  d.setAttribute('style', 'display:flex;align-items:center;height:100%;white-space:nowrap;font-size:' +
    (o.size || 15) + 'px;color:' + (o.fill || COL.text2) + ';justify-content:' + jc);
  const span = document.createElementNS(NHT, 'span');
  span.textContent = s;
  if (o.bg) span.setAttribute('style', 'background:' + o.bg + ';border-radius:5px;padding:1px 5px');
  d.appendChild(span);
  fo.appendChild(d);
  tex(span);
  return fo;
}
// A slider with a KaTeX label and a value readout.
function slider(label, o) {
  const wrap = h('label', 'slide-ctl');
  const lab = tex(h('span', '', label));
  const val = h('span', 'val', '');
  const inp = h('input');
  inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step; inp.value = o.value;
  mark(inp, 'control', o.id, o.name || o.id);
  wrap.append(lab, inp, val);
  const fmt = o.fmt || String;
  const api = {
    el: wrap,
    input: inp,
    show() { val.textContent = fmt(+inp.value); },
  };
  inp.addEventListener('input', () => { api.show(); if (o.onInput) o.onInput(+inp.value); });
  api.show();
  return api;
}
// A readout box: label and value are LaTeX-ready text.
function readout(id, label) {
  const box = mark(h('div', 'readout'), 'readout', id);
  const k = h('div', 'k');
  setTex(k, label);
  const v = h('div', 'val');
  box.append(k, v);
  return { el: box, set(text, bad) { v.textContent = text; box.classList.toggle('bad', !!bad); } };
}
function legend(items) {
  const d = h('div', 'legend');
  for (const it of items) {
    const s = h('span');
    const sw = it.chip ? h('span', 'chip') : h('span', 'sw');
    if (it.chip) sw.style.background = it.color;
    else sw.style.borderTop = '2px ' + (it.dash ? 'dashed' : 'solid') + ' ' + it.color;
    const t = h('span');
    setTex(t, it.text);
    s.append(sw, t);
    d.appendChild(s);
  }
  return d;
}
// A plot that takes the height left in its box. draw(svg, W, H) runs on every resize.
function fillPlot(box, draw) {
  const wrap = h('div', 'fill');
  box.append(wrap);
  let key = '';
  const paint = force => {
    const w = Math.floor(wrap.clientWidth), ht = Math.floor(wrap.clientHeight);
    if (w < 60 || ht < 60) return;
    if (!force && key === w + 'x' + ht) return;
    key = w + 'x' + ht;
    COL = readPalette();
    const svg = svgRoot(w, ht);
    draw(svg, w, ht);
    wrap.replaceChildren(svg);
  };
  new ResizeObserver(() => paint(false)).observe(wrap);
  const plot = { redraw: () => paint(true) };
  PLOTS.push(plot);
  return plot;
}
// Axes, grid and tick labels. Returns the maps from data to pixels.
// o: {x0, x1, y0, y1, xt: [ticks], yt: [ticks], xlab, ylab, fmt}
function axes(svg, W, H, o) {
  const L = 58, R = 22, T = 34, B = 50;
  const X = x => L + (x - o.x0) / (o.x1 - o.x0) * (W - L - R);
  const Y = y => H - B - (y - o.y0) / (o.y1 - o.y0) * (H - B - T);
  const fmt = o.fmt || (v => String(+v.toFixed(3)));
  for (const y of o.yt) {
    svgNode('line', { x1: L, x2: W - R, y1: Y(y), y2: Y(y), stroke: COL.soft3 }, svg);
    svgText(svg, L - 8, Y(y) + 5, fmt(y), { 'text-anchor': 'end' });
  }
  for (const x of o.xt) {
    svgNode('line', { x1: X(x), x2: X(x), y1: T, y2: H - B, stroke: COL.soft }, svg);
    svgText(svg, X(x), H - B + 18, fmt(x), { 'text-anchor': 'middle' });
  }
  svgNode('line', { x1: L, x2: L, y1: T, y2: H - B, stroke: COL.grey }, svg);
  svgNode('line', { x1: L, x2: W - R, y1: H - B, y2: H - B, stroke: COL.grey }, svg);
  if (o.xlab) svgTex(svg, (L + W - R) / 2, H - 12, o.xlab, { w: W - L - R, size: 16 });
  if (o.ylab) svgTex(svg, 4, 12, o.ylab, { anchor: 'start', w: 260, size: 16 });
  return { X, Y, L, R, T, B, W, H };
}
// A polyline through [x, y] data points, mapped by X and Y. Points with NaN are skipped.
function line(svg, pts, X, Y, attrs) {
  const d = pts.filter(p => isFinite(p[1])).map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ');
  return svgNode('path', Object.assign({ d: d, fill: 'none' }, attrs), svg);
}
function dot(svg, x, y, r, color) {
  return svgNode('circle', { cx: x, cy: y, r: r, fill: color, stroke: COL.panel, 'stroke-width': 1.5 }, svg);
}
// Session events. Optional: with no bridge, nothing is sent.
function emit(kind, data) {
  try {
    if (window.fluid && typeof window.fluid.emit === 'function') Promise.resolve(window.fluid.emit(kind, data)).catch(() => {});
  } catch (e) { /* the view works without the bridge */ }
}
// Shared piece of every slide's right column.
function sideCommon(side, parts) {
  for (const p of parts) if (p) side.append(p);
}
function tries(items) { return hh('ol', 'tries', ...items.map(t => setTex(h('li'), t))); }
function takeaway(text) { return setTex(h('p', 'takeaway'), text); }
function sym(text) { return setTex(h('p', 'sym'), text); }
function caseLine(text) { return setTex(h('p', 'case'), text); }
function formula(text) { return setTex(h('div', 'formula'), text); }
// A name line: what the term's name means and how it points at the idea (HTML with $math$).
function nameLine(html) { const p = h('p', 'sym name'); p.innerHTML = html; return tex(p); }

// ---------- slide 1: an endless sum has a value when the partial sums settle ----------
function slideSeries(widget, side) {
  let N = 4, mode = 'halves';
  const bHalf = mark(h('button', 'btn on'), 'preset', 'halves');
  setTex(bHalf, String.raw`Halves: $1+\frac12+\frac14+\cdots$`);
  const bOnes = mark(h('button', 'btn'), 'preset', 'ones');
  setTex(bOnes, String.raw`Ones: $1+1+1+\cdots$`);
  const sl = slider(String.raw`$N$, terms added`, { id: 'N', name: 'terms', min: 1, max: 20, step: 1, value: N,
    onInput: v => { N = v; update(); } });
  const rS = readout('sum', String.raw`partial sum $S_N$`);
  const rT = readout('term', String.raw`last term $a_{N-1}$`);
  const rG = readout('gap', String.raw`distance to $2$`);
  widget.append(hh('div', 'btnrow', bHalf, bOnes), hh('div', 'sliders', sl.el), legend([
    { color: 'var(--pal-accent)', text: String.raw`blue dots: $S_N$, the sum of the first $N$ terms` },
    { color: 'var(--pal-ink)', dash: true, text: String.raw`dashed: $2$, the limit of the halves (none for ones)` }]));
  const plot = fillPlot(widget, drawSeries);
  widget.append(hh('div', 'readouts', rS.el, rT.el, rG.el));
  function setMode(m) {
    mode = m;
    bHalf.classList.toggle('on', m === 'halves');
    bOnes.classList.toggle('on', m === 'ones');
    update();
  }
  bHalf.addEventListener('click', () => setMode('halves'));
  bOnes.addEventListener('click', () => setMode('ones'));
  function partial(n) {
    let s = 0;
    for (let k = 0; k < n; k++) s += mode === 'halves' ? Math.pow(0.5, k) : 1;
    return s;
  }
  function update() {
    const s = partial(N);
    rS.set(s.toFixed(4));
    if (mode === 'halves') {
      rT.set(Math.pow(0.5, N - 1).toPrecision(3));
      rG.set(Math.pow(2, 1 - N).toPrecision(3));
    } else {
      rT.set('1');
      rG.set('no limit: grows', true);
    }
    plot.redraw();
  }
  function drawSeries(svg, W, H) {
    const ymax = mode === 'halves' ? 2.5 : 20;
    const A = axes(svg, W, H, { x0: 0, x1: 20, y0: 0, y1: ymax, xt: [0, 5, 10, 15, 20],
      yt: mode === 'halves' ? [0, 0.5, 1, 1.5, 2, 2.5] : [0, 5, 10, 15, 20],
      xlab: String.raw`$N$, number of terms`, ylab: String.raw`$S_N$, partial sum` });
    if (mode === 'halves') {
      svgNode('line', { x1: A.L, x2: W - A.R, y1: A.Y(2), y2: A.Y(2), stroke: COL.ink, 'stroke-dasharray': '6 5' }, svg);
      svgTex(svg, W - A.R - 90, A.Y(2) - 16, '$2$, the limit', { w: 170, anchor: 'end', size: 15, fill: COL.ink });
    }
    const pts = [];
    for (let n = 1; n <= N; n++) pts.push([n, partial(n)]);
    line(svg, pts, A.X, A.Y, { stroke: COL.accent, 'stroke-width': 2 });
    for (const [n, s] of pts) dot(svg, A.X(n), A.Y(s), 4, COL.accent);
  }
  update();
  side.append(
    tag('Used in L13 29:44 · L15 17:02'),
    setTex(h('h2'), 'An endless sum can have a value'),
    setTex(h('p', 'question'), 'When does an endless sum have a finite value?'),
    caseLine(String.raw`Two cakes on the table. Eat one, then half of what is left, then half again, forever. How much do you eat in all?`),
    formula(String.raw`$$S_N=\sum_{k=0}^{N-1}a_k,\qquad a_k=\left(\tfrac12\right)^{k}$$`),
    sym(String.raw`$a_k$: term $k$, the bite after $k$ bites; $S_N$: the first $N$ terms added; the endless sum is the limit of $S_N$. Why the halves reach 2: step 2.`),
    nameLine(String.raw`<i>series</i>: Latin <i>seriēs</i>, a row, from <i>serere</i>, to join: terms joined one after another into one sum.`),
    tries([
      String.raw`Set $N = 10$. The dots reach $1.998$. What is the distance to $2$?`,
      String.raw`Choose ones and drag $N$ to 20. Does $S_N$ settle to one number?`,
      String.raw`Which terms get smaller, and which do not?`]),
    takeaway(String.raw`An endless sum has a value when its partial sums settle to one number.`));
  function tag(s) { return h('div', 'tag', s); }
}

// ---------- slide 2: the geometric sum in one line ----------
function slideGeometric(widget, side) {
  let r = 0.5, N = 10;
  const sr = slider(String.raw`$r$, ratio`, { id: 'r', name: 'ratio', min: 0.1, max: 1.2, step: 0.05, value: r,
    fmt: v => v.toFixed(2), onInput: v => { r = v; update(); } });
  const sN = slider(String.raw`$N$, terms`, { id: 'N', name: 'terms', min: 1, max: 12, step: 1, value: N,
    onInput: v => { N = v; update(); } });
  const rAdd = readout('add', String.raw`add one by one: $S_N$`);
  const rF = readout('formula', String.raw`$\frac{1-r^{N}}{1-r}$`);
  const rD = readout('diff', String.raw`difference`);
  const rL = readout('limit', String.raw`limit $\frac{1}{1-r}$`);
  widget.append(hh('div', 'sliders', sr.el, sN.el), legend([
    { color: 'var(--pal-grey)', chip: true, text: String.raw`grey bars: terms $r^{k}$` },
    { color: 'var(--pal-accent)', text: String.raw`blue dots: running sum $S_k$` },
    { color: 'var(--pal-ink)', dash: true, text: String.raw`dashed: limit $\frac{1}{1-r}$, only when $r<1$` }]));
  const plot = fillPlot(widget, drawGeo);
  widget.append(hh('div', 'readouts', rAdd.el, rF.el, rD.el, rL.el));
  function sums() {
    const out = []; let s = 0;
    for (let k = 0; k < N; k++) { s += Math.pow(r, k); out.push([k, Math.pow(r, k), s]); }
    return out;
  }
  function update() {
    const rows = sums(), last = rows[rows.length - 1][2];
    const closed = (1 - Math.pow(r, N)) / (1 - r);

  }
  function drawGeo(svg, W, H) {

    const A = axes(svg, W, H, { x0: -0.5, x1: 11.5, y0: 0, y1: ymax, xt: [0, 2, 4, 6, 8, 10],

    setTex(h('p', 'question'), String.raw`How do you add $1+r+\cdots+r^{N-1}$ without adding each term?`),

}
// Tick values for the y axis, about five, in steps of 0.5, 1, 2, 5 or 10.
function niceTicks(ymax) {
  const raw = ymax / 4, p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 5, 10].map(m => m * p).find(s => s >= raw) || 10 * p;
  const out = [];
  for (let v = 0; v <= ymax + 1e-9; v += step) out.push(+v.toFixed(6));
  return out;
}

// ---------- slide 3: a polynomial copies e^x near 0 ----------
function slideTaylor(widget, side) {
  let n = 1;
  const sl = slider(String.raw`$n$, highest power`, { id: 'n', name: 'degree', min: 0, max: 8, step: 1, value: n,
    onInput: v => { n = v; update(); } });
  const rT = readout('poly', String.raw`$T_n(1)$, the polynomial at $x=1$`);
  const rE = readout('exact', String.raw`$e^{1}$, the function at $x=1$`);
  const rErr = readout('err', String.raw`error $e^{1}-T_n(1)$`);
  widget.append(hh('div', 'sliders', sl.el), legend([
    { color: 'var(--pal-accent)', text: String.raw`blue: $e^{x}$, the function` },
    { color: 'var(--pal-ink)', dash: true, text: String.raw`dashed: $T_n(x)=\sum_{k=0}^{n}\frac{x^{k}}{k!}$, the polynomial` },
    { color: 'var(--pal-ink)', chip: true, text: String.raw`dot: $x=0$, where they agree` }]));
  const plot = fillPlot(widget, drawTaylor);
  widget.append(hh('div', 'readouts', rT.el, rE.el, rErr.el));
  function T(x, deg) {
    let s = 0, f = 1;
    for (let k = 0; k <= deg; k++) { if (k > 0) f *= k; s += Math.pow(x, k) / f; }
    return s;
  }
  function update() {
    const p = T(1, n);
    rT.set(p.toFixed(4));
    rE.set(Math.E.toFixed(4));
    rErr.set((Math.E - p).toFixed(4));
    plot.redraw();
  }
  function drawTaylor(svg, W, H) {
    const A = axes(svg, W, H, { x0: -2, x1: 2, y0: -1, y1: 8, xt: [-2, -1, 0, 1, 2], yt: [-1, 0, 1, 2, 3, 4, 5, 6, 7, 8],
      xlab: String.raw`$x$`, ylab: String.raw`$y$` });
    const xs = [];
    for (let x = -2; x <= 2.0001; x += 0.02) xs.push(x);
    line(svg, xs.map(x => [x, Math.exp(x)]), A.X, A.Y, { stroke: COL.accent, 'stroke-width': 2.5 });
    line(svg, xs.map(x => [x, T(x, n)]), A.X, A.Y, { stroke: COL.ink, 'stroke-width': 2, 'stroke-dasharray': '7 5' });
    dot(svg, A.X(0), A.Y(1), 6, COL.ink);
    svgTex(svg, A.X(0) + 46, A.Y(1) - 2, String.raw`$(0,\,1)$`, { w: 120, anchor: 'start', size: 15, fill: COL.ink });
  }
  update();
  side.append(
    h('div', 'tag', 'Used in L3 13:08 · L7 12:28'),
    setTex(h('h2'), 'A polynomial that copies a function'),
    setTex(h('p', 'question'), String.raw`How can a polynomial copy $e^{x}$ near $x=0$?`),
    caseLine('Hamming let a machine differentiate a function nineteen times to get the first twenty terms of its power series (L7 12:28).'),
    formula(String.raw`$$T_n(x)=\sum_{k=0}^{n}\frac{f^{(k)}(0)}{k!}\,x^{k}$$`),
    sym(String.raw`$f^{(k)}(0)$: the $k$-th slope of $f$ at 0 (slope of the slope, and so on). The copy $T_n$ has $f$'s value and first $n$ slopes at 0. For $e^{x}$ each is 1, so $T_n(x)=\sum_{k=0}^{n}\frac{x^{k}}{k!}$. Why: step 6.`),
    nameLine(String.raw`<i>polynomial</i>: Greek <i>poly-</i>, many, and <i>nomós</i>, part: a sum of many parts, the terms $c_kx^{k}$.`),
    tries([

// ---------- slide 4: where the ln(1+x) series can be trusted ----------
function slideTrust(widget, side) {
  let n = 3, x = 0.5;
  const sn = slider(String.raw`$n$, terms`, { id: 'n', name: 'terms', min: 1, max: 30, step: 1, value: n,
    onInput: v => { n = v; update(); } });
  const sx = slider(String.raw`$x$, point`, { id: 'x', name: 'point', min: -0.9, max: 2, step: 0.1, value: x,
    fmt: v => v.toFixed(1), onInput: v => { x = v; update(); } });
  const rP = readout('partial', String.raw`$P_n(x)$, the first $n$ terms`);
  const rTrue = readout('true', String.raw`$\ln(1+x)$, the true value`);
  const rErr = readout('err', String.raw`error`);
  const rNext = readout('next', String.raw`next term $\frac{|x|^{n+1}}{n+1}$`);
  widget.append(hh('div', 'sliders', sn.el, sx.el), legend([
    { color: 'var(--pal-accent)', text: String.raw`blue: $\ln(1+x)$, the true curve` },
    { color: 'var(--pal-ink)', dash: true, text: String.raw`dashed: $P_n(x)$, the partial sum` },
    { color: 'var(--pal-ink)', chip: true, text: String.raw`dot: the point $x$ you chose` }]));
  const plot = fillPlot(widget, drawTrust);
  widget.append(hh('div', 'readouts', rP.el, rTrue.el, rErr.el, rNext.el));
  // P_n(x) = sum_{k=1}^{n} (-1)^{k+1} x^k / k
  function P(xv, deg) {
    let s = 0;
    for (let k = 1; k <= deg; k++) s += Math.pow(-1, k + 1) * Math.pow(xv, k) / k;
    return s;
  }
  function update() {
    const p = P(x, n), t = Math.log(1 + x);
    rP.set(Math.abs(p) > 1e4 ? p.toExponential(2) : p.toFixed(4), Math.abs(p - t) > 0.1);
    rTrue.set(t.toFixed(4));
    rErr.set(Math.abs(t - p) > 1e4 ? Math.abs(t - p).toExponential(2) : Math.abs(t - p).toPrecision(3), Math.abs(t - p) > 0.1);
    rNext.set((Math.pow(Math.abs(x), n + 1) / (n + 1)).toPrecision(3));

  }

    const A = axes(svg, W, H, { x0: -1.5, x1: 2.5, y0: -3, y1: 2.5, xt: [-1, 0, 1, 2], yt: [-3, -2, -1, 0, 1, 2],
      xlab: String.raw`$x$`, ylab: String.raw`$y$` });
    const clip = svgNode('clipPath', { id: 'clipPlot' }, svg);
    svgNode('rect', { x: A.L, y: A.T, width: W - A.L - A.R, height: H - A.B - A.T }, clip);
    const g = svgNode('g', { 'clip-path': 'url(#clipPlot)' }, svg);
    const xs = [];
    for (let v = -0.99; v <= 2.5001; v += 0.02) xs.push(v);
    line(g, xs.map(v => [v, Math.log(1 + v)]), A.X, A.Y, { stroke: COL.accent, 'stroke-width': 2.5 });
    const ps = [];
    for (let v = -1.5; v <= 2.5001; v += 0.02) ps.push(v);
    line(g, ps.map(v => [v, P(v, n)]), A.X, A.Y, { stroke: COL.ink, 'stroke-width': 2, 'stroke-dasharray': '7 5' });
    if (Math.abs(P(x, n)) < 3.5) dot(svg, A.X(x), A.Y(P(x, n)), 6, COL.ink);
    dot(svg, A.X(x), A.Y(Math.log(1 + x)), 6, COL.accent);
  }
  update();
  side.append(
    h('div', 'tag', 'Used in L18 22:08'),
    setTex(h('h2'), 'How far from the point can you trust it?'),
    setTex(h('p', 'question'), String.raw`For which $x$ does the series of $\ln(1+x)$ give the right answer?`),
    formula(String.raw`$$\ln(1+x)=x-\frac{x^{2}}{2}+\frac{x^{3}}{3}-\cdots$$`),
    sym(String.raw`$P_n(x)$: the first $n$ terms. The series is right for $-1<x\le1$, and nowhere else. Why: step 8.`),
    nameLine(String.raw`<i>converge</i>: Latin <i>con-</i>, together, and <i>vergere</i>, to bend: the partial sums bend in toward one value. Here they converge for $-1&lt;x\le1$.`),
    tries([
      String.raw`Set $x=0.5$ and $n=20$. The dashed curve runs through the dot, where $\ln 1.5 = 0.4055$.`,
      String.raw`Set $x=1$. The error shrinks, but slowly.`,
      String.raw`Set $x=2$ and raise $n$. The sum blows up. Compare the next term.`]),
    takeaway(String.raw`The series works for $-1<x\le1$, and the next term tells you how far to trust a short sum.`));
}

// ---------- slide 5: each term from the one before ----------
function slideTerms(widget, side) {
  let mode = 'bessel', x = 1, n = 8;
  const bB = mark(h('button', 'btn on'), 'preset', 'bessel');

    fmt: v => v.toFixed(1), onInput: v => { x = v; update(); } });
  const sn = slider(String.raw`$n$, last term`, { id: 'n', name: 'last term', min: 1, max: 15, step: 1, value: n,
    onInput: v => { n = v; update(); } });

  const rM = readout('mult', String.raw`multiplier $t_n/t_{n-1}$`);

  const rD = readout('gap', String.raw`distance to the limit`);
  widget.append(hh('div', 'btnrow', bB, bE), hh('div', 'sliders', sx.el, sn.el), legend([
    { color: 'var(--pal-grey)', chip: true, text: String.raw`grey bars: term $t_k$` },
    { color: 'var(--pal-accent)', text: String.raw`blue dots: running sum $S_k$` },
    { color: 'var(--pal-ink)', dash: true, text: String.raw`dashed: the value the sum settles to (80 terms)` }]));
  const plot = fillPlot(widget, drawTerms);
  widget.append(hh('div', 'readouts', rT.el, rM.el, rS.el, rD.el));
  // Bessel: t_k = t_{k-1} (x/2)^2 / k^2. Exponential: t_k = t_{k-1} x / k.
  function factor(k) {

  }

  }

    return terms(80).reduce((a, b) => a + b, 0);
  }
  function update() {

    rT.set(t[n].toPrecision(3));
    rM.set(factor(n).toFixed(4));
    rS.set(s.toFixed(4));

  }
  function setMode(m) {

    const t = terms(n), lim = limit();

      if (v >= 0.05 * ymax) svgText(svg, A.X(k), A.Y(v) - 6, v >= 100 ? v.toFixed(0) : v.toPrecision(3), { 'text-anchor': 'middle', fill: COL.text2, 'font-size': 12 });
    });
    const sums = []; let acc = 0;
    t.forEach((v, k) => { acc += v; sums.push([k, acc]); });
    line(svg, sums, A.X, A.Y, { stroke: COL.accent, 'stroke-width': 2 });
    for (const [k, v] of sums) dot(svg, A.X(k), A.Y(v), 4, COL.accent);
    svgNode('line', { x1: A.L, x2: W - A.R, y1: A.Y(lim), y2: A.Y(lim), stroke: COL.ink, 'stroke-dasharray': '6 5' }, svg);

  cells[0].append(tex(h('span', '', String.raw`$e^{x}=\sum_{k\ge0}\dfrac{x^{k}}{k!}$`)), h('span', 'ref', ' (step 5)'));
  setTex(cells[1], String.raw`$t_k=t_{k-1}\cdot\dfrac{x}{k}$`);
  cells[2].append(tex(h('span', '', String.raw`$I_0(x)=\sum_{k\ge0}\dfrac{(x/2)^{2k}}{(k!)^{2}}$`)),
    tex(h('span', 'expand', String.raw`$=1+\tfrac{x^{2}}{4}+\tfrac{x^{4}}{64}+\cdots$`)));
  setTex(cells[3], String.raw`$t_k=t_{k-1}\cdot\dfrac{(x/2)^{2}}{k^{2}}$`);
  side.append(
    h('div', 'tag', 'Used in L16 03:42 to 04:13'),
    setTex(h('h2'), 'Each term from the one before'),
    setTex(h('p', 'question'), 'How do you add a series quickly, without a new power for each term?'),
    defs,
    sym(String.raw`$t_k$: the term under the $\sum$; $t_0=1$ in both. Why each recipe holds: step 10.`),
    caseLine(String.raw`$I_0$ is Bessel's function. Kaiser's filter window (L16 03:42) takes its weights from it; Hamming gives only this series. Each term is a term of $e^{x/2}$, squared.`),
    tries([
      String.raw`Pick $I_0$, $x=1$: $t_1=0.25$ and $t_2=0.015625$ are $x^2/4$ and $x^4/64$ at $x=1$.`,
      String.raw`Set $x=6$: the terms rise to $t_2 = t_3 = 20.25$, then fall. Raise $n$ until the sum stops changing.`,

const HALF_TEX = ['1', String.raw`\tfrac12`, String.raw`\tfrac14`, String.raw`\tfrac18`, String.raw`\tfrac1{16}`];

    String.raw`two cakes, $2$ in all: $N$ bites in blue, what is left in the empty box`);
  const bh = Math.max(22, Math.min(42, H * 0.13)), yb = 60, ye = yb + bh;

    limit: r < 1 ? String.raw`amber: for $|r|<1$ the last bar $r^N$ shrinks to 0, so $S\to\frac{1}{1-r}=${fmtNum(1 / (1 - r))}$`

  if (lit === 'rS') glowBox(svg, X(1) - bw / 2, yB - rowH + 22, X(N) - X(1) + bw, rowH - 22, 4);

    svgTex(svg, 4, y0 - rowH / 2 + 8, name, { w: 40, anchor: 'start', size: 17, fill: COL.ink });
  }
  for (let k = 0; k <= N; k++) {

      opacity: fade && k > 0 ? 0.22 : 0.9, 'data-item': 'mark', 'data-id': 'S-' + k }, svg);
    if (k > 0) svgNode('rect', { x: (X(k) - bw / 2).toFixed(1), y: (yB - hv).toFixed(1), width: bw.toFixed(1), height: hv.toFixed(1), fill: COL.accent,
      opacity: fade && k < N ? 0.22 : 0.9, 'data-item': 'mark', 'data-id': 'rS-' + k }, svg);

  svgTex(svg, X(0), yA - sc - 11, '$1$', { w: 40, size: 15, fill: COL.ink });
  const right = X(N) + 110 < W;
  const rl = svgTex(svg, right ? X(N) - bw / 2 : X(N) + bw / 2, yB - Math.max(rN * sc, 0.5) - 11, String.raw`$r^{${N}}=${fmtNum(rN)}$`, { w: 140, anchor: right ? 'start' : 'end', size: 15, fill: COL.blueDeep });

// ---------- step 6: why c_k = f^(k)(0)/k! (proof) ----------
function factorial(n) { let f = 1; for (let i = 2; i <= n; i++) f *= i; return f; }
function expPoly(x, m) { let s = 0, t = 1; for (let j = 0; j <= m; j++) { if (j > 0) t *= x / j; s += t; } return s; }
// The copy T_n after k slopes, term by term, as TeX for katex.render. lit colors the terms a proof line is about.
function termRowTex(n, k, lit) {
  const box = t => '\\colorbox{' + COL.amberBg + '}{\\textcolor{' + COL.amberInk + '}{$' + t + '$}}';
  const head = k === 0 ? 'T_{' + n + '}(x)=' : 'T_{' + n + '}^{(' + k + ')}(x)=';
  if (k > n) return head + (lit === 'kth' || lit === 'zero' ? box('0') : '0') + String.raw`\quad\text{every term is gone}`;
  const parts = [];
  for (let j = 0; j <= n; j++) {
    if (j < k) { parts.push('\\textcolor{' + COL.grey + '}{0}'); continue; }
    const p = j - k, xs = p === 0 ? '' : p === 1 ? 'x' : 'x^{' + p + '}';
    const c = factorial(j) / factorial(j - k);
    const t = (j === k ? (k >= 2 ? k + String.raw`!\,` : '') : c === 1 ? '' : String(c)) + 'c_{' + j + '}' + xs;
    if ((lit === 'kth' && j === k) || (lit === 'zero' && j > k)) parts.push(box(t));
    else parts.push(j === k ? '\\textcolor{' + COL.accentDeep + '}{' + t + '}' : t);
  }
  return head + parts.join('+');
}

    kth: k > n ? String.raw`amber: past slope $n$ every term is gone: the copy cannot match slope $k$`
      : String.raw`amber: after $k$ slopes, $c_kx^k$ is the number $k!\,c_k$; the lower terms are 0`,
    zero: String.raw`amber: at $x=0$ the terms with an $x$ vanish, so $T_n^{(k)}(0)=k!\,c_k$`,

  const plot = proofLeft(widget, {
    controls: [hh('div', 'btnrow', bE, bB), sx.el, sk.el],
    draw: (svg, W, Hh) => drawRecipe(svg, W, Hh, mode, x, k, lit),
    legend: [
      { color: 'var(--pal-grey)', chip: true, text: String.raw`grey: terms $t_k$` },
      { color: 'var(--pal-accent)', chip: true, text: String.raw`blue: your pair` },
      { color: 'var(--pal-line)', dash: true, text: String.raw`$\times$: multiplier $t_k/t_{k-1}$` }],
    tests: [
      String.raw`Pick $e^{x}$, $x=6$: the multipliers are $6, 3, 2, 1.5, \dots$ Guess the rule in $x$ and $k$; test it at $x=2$.`,
      String.raw`Pick $I_0$. Its terms are those of $e^{x/2}$, squared. Guess its multiplier; test it at $x=6$: $9, 2.25, 1, \dots$ Cases are evidence, not proof.`],
    model: String.raw`Each term is the last one times a small fresh factor: no big power or factorial. The bars rise while it is above 1, then fall.` });
  function setMode(m) {
    mode = m;
    bE.classList.toggle('on', m === 'exp');
    bB.classList.toggle('on', m === 'bessel');
    update();
  }
  bE.addEventListener('click', () => setMode('exp'));
  bB.addEventListener('click', () => setMode('bessel'));
  side.append(
    h('div', 'tag', 'Used in L16 03:42 to 04:13'),
    setTex(h('h2'), "Why it's true: each term from the one before"),
    setTex(h('p', 'question'), String.raw`What do you multiply $t_{k-1}$ by to get $t_k$, and why that?`));
  proofRight(side, {
    id: 'term-recipe',
    goal: { words: String.raw`for every $k\ge1$, $\frac{t_k}{t_{k-1}}=\frac{x}{k}$ for $e^x$ and $\frac{(x/2)^2}{k^2}$ for $I_0$` },
    facts: [
      { tex: String.raw`t_k=\frac{x^k}{k!}`, words: String.raw`for $e^x$, $t_k=\frac{(x/2)^{2k}}{(k!)^2}$ for $I_0$`, ref: 'steps 5, 9' }],
    lines: [
      { tex: String.raw`t_k=\frac{x^k}{k!},\qquad t_{k-1}=\frac{x^{k-1}}{(k-1)!}`, move: 'Unfold the definition',
        why: String.raw`$e^x$'s terms at $k$ and $k-1$`, choices: ['Name a piece', 'Induction'], highlight: 'exp pair' },
      { tex: String.raw`\frac{t_k}{t_{k-1}}=\frac{x^k}{x^{k-1}}\cdot\frac{(k-1)!}{k!}`, move: 'Rearrange',
        why: 'divide; dividing by a fraction multiplies by it flipped', choices: ['Compute it two ways', 'Telescope'], highlight: 'exp ratio' },
      { tex: String.raw`\frac{t_k}{t_{k-1}}=\frac{x\cdot x^{k-1}}{x^{k-1}}\cdot\frac{(k-1)!}{k\cdot(k-1)!}=\frac{x}{k}`, move: 'Rearrange',
        why: String.raw`$k!=1\cdot2\cdots k$: peel the last factor off each product and cancel`,
        choices: ['Add zero or multiply by one', 'Take a limit'], highlight: 'exp all' },
      { tex: String.raw`\frac{t_k}{t_{k-1}}=\frac{(x/2)^{2k}}{(x/2)^{2k-2}}\cdot\frac{((k-1)!)^2}{(k!)^2}`, move: 'Unfold the definition',
        why: String.raw`now $I_0$: its terms at $k$ and $k-1$, divided as in line 2`, choices: ['Change variables', 'Use symmetry'], highlight: 'bes pair ratio' },
      { tex: String.raw`\frac{t_k}{t_{k-1}}=\frac{(x/2)^2}{k^2}`, move: 'Use an earlier result',
        why: String.raw`$(k!)^2=k^2\big((k-1)!\big)^2$ is line 3 squared; the power loses two factors $\frac{x}{2}$`,
        choices: ['Compare or bound', 'Name a piece'], highlight: 'bes all' }],
    lookBack: [
      { q: 'Why does a computer use the recipe?',
        a: String.raw`The definition's term 30 of $e^{20}$ needs $20^{30}=1.1\times10^{39}$, past the largest single-precision number ($3.4\times10^{38}$). The recipe gets $t_{30}=4.0\times10^{6}$ from 30 factors $\frac{20}{k}$ and never holds more than the answer.` },
      { q: 'Why does the sum always settle?',
        a: String.raw`The multiplier goes to 0, so from some term on it is below $\tfrac12$ (for $e^x$, once $k>2x$). Then the tail is under $t_n(\tfrac12+\tfrac14+\cdots)=t_n$, the last term added: Compare or bound with step 3's sum. At $x=6$: $t_{12}=4.54$, tail $3.56$.` },
      { q: 'What else does the same move give?',
        a: String.raw`$\cos x=1-\frac{x^2}{2!}+\frac{x^4}{4!}-\cdots$ (step 5: its derivatives at 0 cycle $1,0,-1,0$). Two factors peel off $(2k)!$, so the multiplier is $-\frac{x^2}{(2k)(2k-1)}$.` }] },
    plot, key => {
      lit = key || '';
      if (lit.startsWith('exp') && mode !== 'exp') setMode('exp');
      else if (lit.startsWith('bes') && mode !== 'bessel') setMode('bessel');
      else plot.redraw();
    }, CLOSING);
  side.querySelector('fl-proof-steps').primerMoves = PRIMER_MOVES;
  side.querySelector('fl-proof-steps').endNote = NEXT;
  function update() { plot.redraw(); }
  update();
}
// The view's close. The primer's last proof lists every move the primer's proofs used, in order of first
// use, once it is proved, so the list never gives a pick away; the last step names what comes next.
const CLOSING = 'Look back: under the picture.';
const PRIMER_MOVES = ['Name a piece', 'Rearrange', 'Induction', 'Take a limit', 'Compute it two ways', 'Unfold the definition', 'Use an earlier result', 'Compare or bound'];
const NEXT = 'Next: Primer · Sampling.';

// ---------- frame ----------
const SLIDES = [
  { id: 'series-what', title: 'An endless sum can have a value', tag: 'Used in L13 29:44 · L15 17:02', mount: slideSeries },
  { id: 'why-halves', proof: true, title: String.raw`Why it's true: $1+\tfrac12+\tfrac14+\cdots=2$`, tag: 'Used in L13 29:44 · L15 17:02', mount: slideWhyHalves },
  { id: 'geometric-sum', title: 'The geometric sum in one line', tag: 'Used in L13 29:44', mount: slideGeometric },
  { id: 'why-geometric-sum', proof: true, title: String.raw`Why it's true: $1+r+\cdots+r^{N-1}=\tfrac{1-r^N}{1-r}$`, tag: 'Used in L13 29:44', mount: slideWhyGeometric },
  { id: 'taylor-copy', title: 'A polynomial that copies a function', tag: 'Used in L3 13:08 · L7 12:28', mount: slideTaylor },
  { id: 'why-taylor-coefficients', proof: true, title: String.raw`Why it's true: $c_k=f^{(k)}(0)/k!$`, tag: 'Used in L3 13:08 · L7 12:28', mount: slideWhyTaylor },
  { id: 'taylor-trust', title: 'How far from the point can you trust it?', tag: 'Used in L18 22:08', mount: slideTrust },
  { id: 'why-taylor-trust', proof: true, title: "Why it's true: the error is under the next term", tag: 'Used in L18 22:08', mount: slideWhyTrust },
  { id: 'term-by-term', title: 'Each term from the one before', tag: 'Used in L16 03:42 to 04:13', mount: slideTerms },
  { id: 'why-term-recipe', proof: true, title: "Why it's true: each term from the one before", tag: 'Used in L16 03:42 to 04:13', mount: slideWhyTerms },
];

let cur = 0, shownId = null, endSent = false;
function goTo(i) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  if (shownId !== null && shownId !== s.id) emit('view.step', { step: s.id });
  shownId = s.id;
  const stage = $('#stage');
  stage.innerHTML = '';
  PLOTS = [];
  const widget = h('div', 'widget');
  const side = hh('div', 'side');
  const sec = mark(h('section', 'slide' + (s.proof ? ' proof-slide' : '')), 'step', s.id, s.title.replace(/\$/g, ''));
  sec.append(widget, side);
  stage.append(sec);
  stage.scrollTop = 0;
  s.mount(widget, side);
  if (cur === SLIDES.length - 1) {
    if (!endSent) { endSent = true; emit('view.action', { action: 'deck-end' }); }
  }
  tex(sec);
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, i) => d.classList.toggle('on', i === cur));
}
// A cue is a state: go to the named step, and do nothing if it is already shown.
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i >= 0 && i !== cur) goTo(i);
}
(function init() {
  const dots = $('#dots');
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = s.title.replace(/\$/g, '');
    b.addEventListener('click', () => goTo(i));
    dots.appendChild(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],textarea,select')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
})();
</script>

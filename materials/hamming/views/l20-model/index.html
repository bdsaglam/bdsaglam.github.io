<!doctype html><html lang="en"><head><meta charset="utf-8"><title>After Lecture 20: error and feedback lab</title><script src="../../components/theme.js"></script><script src="../../lib/fluid.js"></script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font:18px/1.42 system-ui;color:var(--pal-fg);background:var(--pal-bg)}main{height:100%;display:grid;grid-template-rows:66px 1fr 62px;padding:20px 28px;gap:12px}header,footer{display:flex;align-items:center;justify-content:space-between;gap:18px}header{border-bottom:1px solid var(--pal-line)}.tag{color:var(--pal-muted);font-size:15px}h1{font-size:23px;margin:0}h2{font-size:31px;line-height:1.15;margin:0 0 12px}.body{display:grid;grid-template-columns:60% 40%;min-height:0}.lab{display:flex;flex-direction:column;background:var(--pal-soft);border:1px solid var(--pal-line);border-radius:12px;padding:16px;gap:10px;min-height:0}.lesson{padding:20px 0 10px 28px;display:flex;flex-direction:column;min-height:0}.question{font-size:21px;margin:0 0 16px}.formula{font-size:23px;padding:12px;background:var(--pal-accent-soft);border-radius:8px;margin:8px 0 12px}.defs{font-size:17px;color:var(--pal-text-2)}ol{padding-left:24px;margin:8px 0}li{margin-bottom:9px}.take{margin-top:auto;padding:12px;border-left:4px solid var(--pal-accent);background:var(--pal-accent-soft);font-size:18px}.chart{flex:1;min-height:0;position:relative}svg{width:100%;height:100%;display:block}.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:44px}button,select{font:inherit;color:var(--pal-fg);background:var(--pal-panel);border:1px solid var(--pal-line);border-radius:7px;padding:9px 15px;cursor:pointer}button:hover{border-color:var(--pal-accent)}button:disabled{opacity:.4;cursor:default}input{accent-color:var(--pal-accent)}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:16px}.legend span:before{content:'━';margin-right:7px;color:var(--c)}.readout{font-size:19px;min-height:30px}.proof{height:100%;display:flex;flex-direction:column;gap:14px;justify-content:center}.proof-row{font-size:24px;background:var(--pal-panel);border-left:4px solid var(--pal-amber);padding:16px}.proof-row small{display:block;font-size:17px;color:var(--pal-muted);margin-top:7px}.choices{display:flex;flex-direction:column;gap:14px;justify-content:center;height:100%}.choice{text-align:left;padding:18px;font-size:19px}.choice small{display:block;font-size:16px;color:var(--pal-muted);margin-top:7px}.verdict{color:var(--pal-accent);font-size:17px}.intro{display:grid;gap:18px;align-content:center;height:100%}.intro div{background:var(--pal-panel);padding:22px;border-left:4px solid var(--pal-accent);font-size:23px}.intro small{display:block;font-size:18px;color:var(--pal-muted);margin-top:5px}footer{border-top:1px solid var(--pal-line);padding-top:12px}.pages{font-size:16px;color:var(--pal-muted)}.source{font-size:14px;color:var(--pal-muted)}.cards{display:flex;flex-direction:column;gap:14px;justify-content:center;height:100%}.cards div{padding:22px;background:var(--pal-panel);border-left:4px solid var(--pal-accent);font-size:23px}.cards small{display:block;font-size:18px;color:var(--pal-muted);margin-top:8px}.metric{padding:18px;background:var(--pal-panel);font-size:23px}.bars{height:100%;display:flex;align-items:flex-end;gap:9px;padding:30px 10px}.barcol{height:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;text-align:center;font-size:16px}.bar{background:var(--pal-accent);min-height:2px}.bar.hot{background:var(--pal-orange)}.chart{min-height:250px}a{color:var(--pal-accent)}</style></head><body><main><header><h1>After Lecture 20: error and feedback lab</h1><span id="tag" class="tag"></span></header><section class="body"><div id="lab" class="lab"></div><article class="lesson"><h2 id="title"></h2><p id="question" class="question"></p><div id="defs" class="defs"></div><div id="formula" class="formula"></div><ol id="tries"></ol><div id="take" class="take"></div></article></section><footer><button id="prev">← Previous</button><span class="pages" id="pages"></span><span class="source">Hamming · Lecture 20 · manual study</span><button id="next">Next →</button></footer></main><script>
const slides=[{"id": "bell", "title": "Inspect the error along the whole path", "time": "After \u00b7 06:49\u201308:20; 46:38", "q": "How can good endpoint agreement hide a poor middle?", "kind": "bell", "defs": "Here $x$ is progress through the run; $d(x)$ is the gap between two exact solutions. They start 0.01 apart at $x=-2$.", "formula": "$y^{\\prime}=-2xy$", "tries": ["Inspect the center, then the far edge.", "Compare the current gap with the starting gap."], "take": "This is sensitivity to the initial condition, with no numerical integration error."}, {"id": "bell-proof", "title": "Derive the changing gap", "time": "After \u00b7 06:49\u201308:20", "q": "Why does the gap grow and then shrink?", "kind": "proof", "defs": "The gap $d$ obeys the same linear equation as either trajectory. The starting location is $x=-2$.", "formula": "$d(-2)=0.01$", "tries": ["Predict where the gap reaches its maximum.", "Reveal one move at a time."], "take": "The middle gap is about 0.546, over 54 times the starting gap.", "rows": [["d^{\\prime}=-2xd", "Subtract the two differential equations"], ["d(x)=C e^{-x^2}", "Differentiate this candidate to check it"], ["C=0.01e^4", "Match the starting gap"], ["d(x)=0.01e^{4-x^2}", "At either edge: 0.01; at the center: about 0.546"]]}, {"id": "step", "title": "Use the slope ahead as a second opinion", "time": "After \u00b7 03:10\u201304:42", "q": "How does a correction improve one step?", "kind": "step", "defs": "Toy growth: an amount grows at its current rate. Start with amount 1; choose the step duration.", "formula": "$y^{\\prime}=y$", "tries": ["Choose a large time step. Compare the two endpoint guesses.", "Reduce the step. Watch both approach the exact endpoint."], "take": "The predictor uses the starting slope. The correction averages starting and predicted ending slopes."}, {"id": "step-proof", "title": "Derive the two endpoint guesses", "time": "After \u00b7 03:41\u201304:42", "q": "Where does the correction come from?", "kind": "proof", "defs": "Start with amount $y=1$. The time step is $h$. Here the slope equals the current amount.", "formula": "$y^{\\prime}=y$", "tries": ["Guess the slope at the predicted endpoint.", "Reveal the averaging move."], "take": "This is Euler prediction followed by one explicit trapezoidal correction (often called Heun\u2019s method).", "rows": [["p=1+h", "Starting amount plus duration times starting slope"], ["\\text{predicted ending slope}=p", "The toy equation says slope equals amount"], ["c=1+\\frac h2(1+p)", "Average the two slopes, then take the step"], ["c=1+h+\\frac{h^2}{2}", "Substitute the predictor"]]}, {"id": "local-global", "title": "A small local gap is not a global guarantee", "time": "After \u00b7 04:42; 07:50\u201308:20", "q": "What does the predictor\u2013corrector gap leave unmeasured?", "kind": "cards", "defs": "", "formula": "", "tries": [], "take": "The predictor\u2013corrector gap is a useful indicator; it is not an exact estimate of total error.", "cards": [["The local check asks about this step.", "Do these two nearby approximations agree when they begin at the same computed point?"], ["The global question asks about the accumulated path.", "How far is that starting point already from the true solution?"], ["The direction field can amplify previous mistakes.", "Repeat with smaller steps and inspect the outputs that matter, at the times that matter."]]}, {"id": "feedback", "title": "Let feedback protect an uncertain component", "time": "After \u00b7 24:35\u201326:09", "q": "Why can a drifting amplifier still give a steady output?", "kind": "feedback", "defs": "Toy negative-feedback amplifier. $A$: open-loop gain. The feedback fraction is fixed at one tenth.", "formula": "$\text{closed-loop gain}=A/(1+0.1A)$", "tries": ["Increase open-loop gain from 10 toward 1000.", "Compare the result with the target gain of 10."], "take": "High gain makes the result depend mainly on the feedback fraction. That fraction still needs accuracy."}, {"id": "feedback-proof", "title": "Solve the feedback loop", "time": "After \u00b7 24:35\u201326:09", "q": "How does the uncertain gain almost cancel?", "kind": "proof", "defs": "Let $u$ be input and $v$ output. The amplifier receives input minus one tenth of its own output.", "formula": "$v=A(u-0.1v)$", "tries": ["Move the output terms to the same side.", "Divide, then inspect what happens for large gain."], "take": "Feedback reduces sensitivity here; it does not make every part of every system irrelevant.", "rows": [["v+0.1Av=Au", "Collect the output terms"], ["\\frac vu=\\frac A{1+0.1A}", "Divide by the input and the output coefficient"], ["\\frac vu=\\frac {10}{1+10/A}", "Divide numerator and denominator by gain"], ["A\\to\\infty\\quad\\Rightarrow\\quad v/u\\to10", "The uncertain gain drops out of the limiting ratio"]]}];

let page=0,revealed=0,picked=-1;const values={x:-2,h:.7,A:100};let checked=false;const $=id=>document.getElementById(id);function math(){if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:'$',right:'$',display:false}],throwOnError:false})}function emit(k,d){if(window.fluid)fluid.emit(k,d)}function setPage(i){page=Math.max(0,Math.min(slides.length-1,i));revealed=0;picked=-1;checked=false;render();emit('view.step',{step:slides[page].id})}
function render(){const s=slides[page];$('title').textContent=s.title;$('tag').textContent=s.time;$('question').textContent=s.q;$('defs').innerHTML=s.defs;$('formula').innerHTML=s.formula;$('formula').style.display=s.formula?'':'none';$('tries').innerHTML=s.tries.map(t=>'<li>'+t+'</li>').join('');$('take').textContent=s.take;$('pages').textContent=`${page+1} / ${slides.length}`;$('prev').disabled=page===0;$('next').disabled=page===slides.length-1;const lab=$('lab');if(s.kind==='cards'){lab.innerHTML='<div class="cards">'+s.cards.map((c,i)=>`<div data-item="idea" data-id="${s.id}-${i}">${c[0]}<small>${c[1]}</small></div>`).join('')+'</div>'}else if(s.kind==='proof'){lab.innerHTML='<div class="proof">'+(revealed?s.rows.slice(0,revealed).map((r,i)=>`<div class="proof-row" data-item="proof" data-id="${s.id}-${i}">$${r[0]}$<small>${r[1]}</small></div>`).join(''):'<div class="cards"><div>Predict the next move.<small>Reveal one equation and its reason per click.</small></div></div>')+'</div><button id="reveal">Reveal next move</button>';$('reveal').disabled=revealed===s.rows.length;$('reveal').onclick=()=>{revealed++;render()}}else if(s.kind==='choice'){lab.innerHTML='<div class="choices">'+s.options.map((o,i)=>`<button class="choice" data-item="choice" data-id="${s.id}-${i}">${o[0]}<small>${o[1]}</small>${picked>=0?`<div class="verdict">${i===s.answer?'Hamming’s choice: ':''}${o[2]}</div>`:''}</button>`).join('')+'</div><button id="answer">Show answer</button>';lab.querySelectorAll('.choice').forEach((b,i)=>b.onclick=()=>{picked=i;render();emit('view.action',{action:'prediction',choice:i,step:s.id})});$('answer').onclick=()=>{picked=s.answer;render()};$('take').style.visibility=picked>=0?'visible':'hidden'}else{lab.innerHTML='<div class="chart" id="chart"></div><div class="legend" id="legend"></div><div class="readout" id="readout"></div><div class="controls" id="controls"></div>';draw()}if(s.kind!=='choice')$('take').style.visibility='visible';math()}
function plot(series,opt={}){const {xmin=-2,xmax=2,ymin=0,ymax=1.2,xlabel='progress',ylabel='amount'}=opt;let W=700,H=350,L=57,R=18,T=33,B=45,px=x=>L+(x-xmin)/(xmax-xmin)*(W-L-R),py=y=>H-B-(y-ymin)/(ymax-ymin)*(H-T-B),col=n=>FluidTheme.color(n);let v=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${ylabel} by ${xlabel}">`;for(let i=0;i<5;i++){let y=ymin+(ymax-ymin)*i/4;v+=`<line x1="${L}" x2="${W-R}" y1="${py(y)}" y2="${py(y)}" stroke="${col('line')}"/><text x="${L-8}" y="${py(y)+5}" text-anchor="end" fill="${col('muted')}" font-size="15">${y.toFixed(2)}</text>`;let x=xmin+(xmax-xmin)*i/4;v+=`<text x="${px(x)}" y="${H-23}" text-anchor="middle" fill="${col('muted')}" font-size="15">${x.toFixed(1)}</text>`}for(const s of series){v+=`<polyline points="${s.p.map(p=>`${px(p[0])},${py(p[1])}`).join(' ')}" fill="none" stroke="${col(s.color)}" stroke-width="3"/>`;if(s.dots)s.p.forEach(p=>{v+=`<circle cx="${px(p[0])}" cy="${py(p[1])}" r="6" fill="${col(s.color)}"/>`})}v+=`<text x="${W/2}" y="${H-2}" text-anchor="middle" fill="${col('muted')}" font-size="16">${xlabel}</text><text x="${L}" y="19" fill="${col('muted')}" font-size="16">${ylabel}</text></svg>`;$('chart').innerHTML=v;$('legend').innerHTML=series.filter(s=>s.label).map(s=>`<span style="--c:var(--pal-${s.color})">${s.label}</span>`).join('')}
function slider(key,min,max,step,label){$('controls').innerHTML=`<label>${label} <input type="range" aria-label="${label}" min="${min}" max="${max}" step="${step}" value="${values[key]}"></label><output>${values[key]}</output>`;$('controls').querySelector('input').oninput=e=>{values[key]=+e.target.value;draw();math()}}
function draw(){const kind=slides[page].kind;if(kind==='bell'){let x=values.x,base=t=>Math.exp(-t*t),d=t=>.01*Math.exp(4-t*t);plot([{p:Array.from({length:201},(_,i)=>{let t=-2+i/50;return[t,base(t)]}),label:'first exact trajectory',color:'accent'},{p:Array.from({length:201},(_,i)=>{let t=-2+i/50;return[t,base(t)+d(t)]}),label:'second exact trajectory',color:'orange'},{p:[[x,base(x)],[x,base(x)+d(x)]],label:'current gap',color:'hue-purple',dots:true}],{ymax:1.65,ylabel:'trajectory height'});slider('x',-2,2,.02,'Inspection point');$('readout').textContent=`Current gap ${d(x).toFixed(4)} · starting gap 0.0100 · amplification ${(d(x)/.01).toFixed(1)} times`}
if(kind==='step'){let h=values.h,p=1+h,c=1+h+h*h/2;plot([{p:Array.from({length:101},(_,i)=>{let t=i/100;return[t,Math.exp(t)]}),label:'exact growth curve',color:'green'},{p:[[0,1],[h,p]],label:'Euler predictor',color:'accent',dots:true},{p:[[0,1],[h,c]],label:'corrected endpoint',color:'orange',dots:true}],{xmin:0,xmax:1,ymax:2.8,ylabel:'amount',xlabel:'time'});slider('h',.1,1,.05,'Step duration');$('readout').innerHTML=`Predictor ${p.toFixed(4)} · corrector ${c.toFixed(4)} · exact ${Math.exp(h).toFixed(4)}<br>Predictor–corrector gap ${(c-p).toFixed(4)} · true corrector error ${(Math.exp(h)-c).toFixed(4)}`}
if(kind==='feedback'){let A=values.A;plot([{p:Array.from({length:201},(_,i)=>{let a=10+i*4.95;return[a,a/(1+.1*a)]}),label:'closed-loop gain',color:'accent'},{p:[[10,10],[1000,10]],label:'target gain 10',color:'orange'},{p:[[A,A/(1+.1*A)]],label:'chosen amplifier gain',color:'hue-purple',dots:true}],{xmin:10,xmax:1000,ymax:11,ylabel:'closed-loop gain',xlabel:'open-loop gain'});slider('A',10,1000,10,'Open-loop gain');$('readout').textContent=`Closed-loop gain ${(A/(1+.1*A)).toFixed(4)} · error from target ${(100*(10-A/(1+.1*A))/10).toFixed(2)} percent`}
if(kind==='noise'){const first=[10,9,13,8,11,10,15,12,9,10,8,11],fresh=[11,9,10,12,8,11,9,10,12,10,9,11];$('chart').innerHTML='<div class="bars">'+first.map((n,i)=>`<div class="barcol" data-item="score" data-id="setting-${i+1}"><span>${checked?fresh[i]:n} of 20</span><div class="bar ${i===6?'hot':''}" style="height:${(checked?fresh[i]:n)*4}%"></div><span>${i+1}</span></div>`).join('')+'</div>';$('legend').innerHTML='<span style="--c:var(--pal-accent)">settings with identical true success rate</span><span style="--c:var(--pal-orange)">winner selected on first evaluation</span>';$('readout').textContent=checked?'Setting 7: 15 of 20 originally, 9 of 20 on fresh data. Scores are fixed illustrative draws.':'Setting 7 wins with 15 of 20. Every setting has true success probability one half.';$('controls').innerHTML='<button id="fresh">'+(checked?'Show first evaluation':'Reveal fresh evaluation')+'</button>';$('fresh').onclick=()=>{checked=!checked;draw();emit('view.action',{action:'fresh-evaluation',revealed:checked})}}math()}
$('prev').onclick=()=>setPage(page-1);$('next').onclick=()=>setPage(page+1);window.addEventListener('fluid-themechange',()=>{if($('chart'))draw()});window.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')setPage(page+1);if(e.key==='ArrowLeft')setPage(page-1)});render();document.addEventListener('DOMContentLoaded',math);window.addEventListener('load',math);
</script></body></html>

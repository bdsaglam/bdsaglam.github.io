<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primer: logarithms</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../../components/theme.js"></script>
<style>
/* Colors come from the theme palette (../../components/theme.js): one accent (blue), red only for a failing check. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft);
  --red:var(--pal-red); --redbg:var(--pal-red-bg);
  --u:clamp(16px,1.35vw,20px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 24px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(6px,1vh,12px) 24px}
footer{display:flex;align-items:center;gap:10px;padding:8px 24px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Slide frame: widget on the left (3/5), text on the right (2/5). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(18px,2.4vw,40px)}
.widget{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(6px,1vh,10px);overflow:hidden}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(6px,1.1vh,12px);overflow:hidden}
.tag{font:13px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(20px,1.9vw,28px);line-height:1.2;margin:0;font-weight:650}
.question{margin:0;font-size:clamp(16px,1.3vw,18px);font-weight:600}
.formula{font-size:clamp(18px,1.8vw,26px)}
.formula .katex-display{margin:.25em 0}
.sym{margin:0;font-size:16px;color:var(--muted)}
.tries{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.tries li::marker{color:var(--accent);font-weight:600}
.takeaway{margin:0;padding:10px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}
.closing{margin:0;font-size:17px;font-weight:600}
.next{margin:0;font-size:16px;color:var(--muted)}
.where{margin:0;font-size:16px}
.where b{color:var(--accent)}

/* Controls and readouts */
.sliders{display:flex;gap:8px 24px;flex-wrap:wrap;width:100%}
.slide-ctl{display:flex;align-items:center;gap:8px;font-size:16px}
.slide-ctl input{width:clamp(120px,11vw,170px);vertical-align:middle;accent-color:var(--accent)}
.slide-ctl .val{min-width:52px}
.btn{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--pal-panel);border-radius:8px;cursor:pointer;font-size:16px}
.btn.on{background:var(--chip);border-color:var(--accent);color:var(--pal-accent-deep)}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.readouts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.readout{flex:1 1 150px;min-width:0;padding:4px 8px;border-radius:10px;background:var(--pal-soft);font-size:15px;overflow-wrap:anywhere}
.readout .k{color:var(--muted);font-size:14px}
.readout .val{font-size:16px;font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:20px;height:0;vertical-align:middle;margin-right:6px}
.chip{display:inline-block;width:18px;height:12px;vertical-align:middle;margin-right:6px;border-radius:2px}

/* Plots fill the space left in the widget column */
.fill{flex:1 1 0;min-height:120px;position:relative;width:100%}
.fill>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.chain{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:1fr;gap:4px;width:100%;min-width:0;flex:1 1 0;min-height:140px}
.amp{min-width:0;display:flex;align-items:center;justify-content:center;background:var(--pal-soft-2);border-radius:4px;font-size:15px;color:var(--pal-text-2)}
.amp.on{background:var(--accent);color:var(--pal-on-accent)}
.amp.start{background:var(--pal-panel);border:1px solid var(--line)}
.bars{display:flex;flex-direction:column;gap:6px;width:100%}

/* Proof slides: test and picture on the left, the proof (fl-proof-steps) on the right */
.slide.proof-slide{grid-template-columns:minmax(0,11fr) minmax(0,9fr)}
.slide.proof-slide .side{justify-content:flex-start}
.slide.proof-slide .fill{min-height:100px}
.slide.proof-slide .slide-ctl input{width:clamp(96px,8.5vw,140px)}
.slide.proof-slide .slide-ctl .val{min-width:36px}
.slide.proof-slide .sliders{gap:6px 18px}
.part{margin:0;font-weight:600;color:var(--muted)}
.test{display:flex;flex-direction:column;gap:3px}
.test .tries{gap:3px}
.model{margin:0;padding:8px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}
.name i{font-style:italic}
</style>
</head>
<body>
<header>Primer · Logarithms and exponentials: logarithms</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script src="../../components/proof-steps.js"></script>
<script>
// ---------- palette and redraw ----------
// COL holds the palette colors for the SVG being drawn. fillPlot reads it at every paint, so a draw always
// uses the current theme. Light values are the old literals, so the light theme is unchanged.
let COL = {};
const PAL_NAMES = ['ink', 'text-2', 'muted', 'grid', 'guide', 'grey', 'accent', 'accent-2', 'panel', 'on-accent',
  'bg', 'amber', 'amber-bg', 'amber-ink'];
function readPalette() {
  const o = {};
  for (const n of PAL_NAMES) o[n.replace(/-(\w)/g, (_, c) => c.toUpperCase())] = FluidTheme.color(n);
  return o;
}
let PLOTS = [];   // the plots on the current slide; a theme switch redraws them, and keeps every control's state
window.addEventListener('fluid-themechange', () => PLOTS.forEach(p => p.redraw()));

// ---------- DOM and drawing helpers ----------
const NSV = 'http://www.w3.org/2000/svg', NHT = 'http://www.w3.org/1999/xhtml';
const $ = s => document.querySelector(s);
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false } ], throwOnError: false };
// Render $...$ in a node. If the CDN did not load, the text stays as typed.
function tex(node) {
  if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH);
  return node;
}
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function hh(tag, cls, ...kids) {
  const e = h(tag, cls);
  for (const k of kids) if (k) e.append(k);
  return e;
}
function mark(e, kind, id, title) {
  e.dataset.item = kind;
  if (id != null) e.dataset.id = id;
  if (title != null) e.dataset.title = title;
  return e;
}
function svgNode(tag, attrs, parent) {
  const e = document.createElementNS(NSV, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function svgRoot(w, ht) {
  return svgNode('svg', { viewBox: '0 0 ' + w + ' ' + ht, role: 'img', 'font-family': 'system-ui, sans-serif', 'font-size': 14 });
}
function svgText(parent, x, y, s, attrs) {
  const t = svgNode('text', Object.assign({ x: x, y: y, fill: COL.muted }, attrs || {}), parent);
  t.textContent = s;
  return t;
}
// A KaTeX label over an SVG: a foreignObject holding a rendered formula.
function svgTex(parent, x, y, s, o) {
  o = o || {};
  const w = o.w || 120, ht = 26, anchor = o.anchor || 'middle';
  const x0 = anchor === 'end' ? x - w : anchor === 'start' ? x : x - w / 2;
  const fo = svgNode('foreignObject', { x: x0, y: y - ht / 2, width: w, height: ht }, parent);
  const d = document.createElementNS(NHT, 'div');
  const jc = anchor === 'end' ? 'flex-end' : anchor === 'start' ? 'flex-start' : 'center';
  d.setAttribute('style', 'display:flex;align-items:center;height:100%;white-space:nowrap;font-size:' +
    (o.size || 15) + 'px;color:' + (o.fill || COL.text2) + ';justify-content:' + jc);
  const span = document.createElementNS(NHT, 'span');
  span.textContent = s;
  if (o.bg) span.setAttribute('style', 'background:' + o.bg + ';border-radius:5px;padding:1px 5px');
  d.appendChild(span);
  fo.appendChild(d);
  tex(span);
  return fo;
}
// Same label with a white halo, so it reads over a curve or bars.
function haloTex(parent, x, y, s, o) {
  const fo = svgTex(parent, x, y, s, o);
  fo.firstChild.style.textShadow = '0 0 3px ' + COL.bg + ', 0 0 3px ' + COL.bg + ', 0 0 2px ' + COL.bg;
  return fo;
}
// A labelled range input. label is LaTeX-ready text; fmt gives the value text.
function slider(label, o) {
  const wrap = h('label', 'slide-ctl');
  const lab = tex(h('span', '', label));
  const val = h('span', 'val', '');
  const inp = h('input');
  inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step; inp.value = o.value;
  mark(inp, 'control', o.id, o.name || o.id);
  wrap.append(lab, inp, val);
  const fmt = o.fmt || String;
  const api = {
    el: wrap,
    input: inp,
    get value() { return +inp.value; },
    show() { setTex(val, fmt(+inp.value)); },
  };
  inp.addEventListener('input', () => { api.show(); if (o.onInput) o.onInput(+inp.value); });
  api.show();
  return api;
}
// A readout box: label and value are LaTeX-ready text.
function readout(id, label) {
  const box = mark(h('div', 'readout'), 'readout', id);
  const k = h('div', 'k');
  setTex(k, label);
  const v = h('div', 'val');
  box.append(k, v);
  return { el: box, set(text) { setTex(v, text); } };
}
function legend(items) {
  const d = h('div', 'legend');
  for (const it of items) {
    const s = h('span');
    const sw = it.chip ? h('span', 'chip') : h('span', 'sw');
    if (it.chip) sw.style.background = it.color;
    else sw.style.borderTop = '2px ' + (it.dash ? 'dashed' : 'solid') + ' ' + it.color;
    const t = h('span');
    setTex(t, it.text);
    s.append(sw, t);
    d.appendChild(s);
  }
  return d;
}
// A plot that takes the height left in its box. draw(svg, W, H) runs on every resize.
function fillPlot(box, draw) {
  const wrap = h('div', 'fill');
  box.append(wrap);
  let key = '';
  const paint = force => {
    const w = Math.floor(wrap.clientWidth), ht = Math.floor(wrap.clientHeight);
    if (w < 60 || ht < 60) return;
    if (!force && key === w + 'x' + ht) return;
    key = w + 'x' + ht;
    COL = readPalette();
    const svg = svgRoot(w, ht);
    draw(svg, w, ht);
    wrap.replaceChildren(svg);
  };
  new ResizeObserver(() => paint(false)).observe(wrap);
  const plot = { redraw: () => paint(true) };
  PLOTS.push(plot);
  return plot;
}
function sym(text) { return setTex(h('p', 'sym'), text); }
function triesList(items) { return hh('ol', 'tries', ...items.map(t => setTex(h('li'), t))); }
function takeLine(text) { return setTex(h('p', 'takeaway'), text); }
// Session events. Optional: with no bridge, nothing is sent.
function emit(kind, data) {
  try {
    if (window.fluid && typeof window.fluid.emit === 'function') Promise.resolve(window.fluid.emit(kind, data)).catch(() => {});
  } catch (e) { /* the view works without the bridge */ }
}

// ---------- proof slides: shared parts ----------
// Amber marks what the newest proof line is about, in the picture and in the proof.
// Amber colors are read from the palette at paint time: COL.amber, COL.amberBg.
function litSet(key) { return new Set(String(key || '').split(/\s+/).filter(Boolean)); }
function glowBox(svg, x, y, w, ht, pad) {
  pad = pad == null ? 5 : pad;
  return svgNode('rect', { x: (x - pad).toFixed(1), y: (y - pad).toFixed(1), width: Math.max(0, w + 2 * pad).toFixed(1),
    height: Math.max(0, ht + 2 * pad).toFixed(1), rx: 7, fill: COL.amberBg, stroke: COL.amber, 'stroke-width': 1.5 }, svg);
}
function glowPath(svg, d, wdt) {
  return svgNode('path', { d: d, fill: 'none', stroke: COL.amberBg, 'stroke-width': wdt || 12, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, svg);
}
function glowDot(svg, x, y, r) { return svgNode('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: r || 12, fill: COL.amberBg, stroke: COL.amber, 'stroke-width': 1.5 }, svg); }
function nameLine(html) { const p = h('p', 'sym name'); p.innerHTML = html; return tex(p); }
// Left column of a proof slide: controls, the picture, legend, readouts, the test, the mental model.
function proofLeft(widget, o) {
  if (o.controls && o.controls.length) widget.append(hh('div', 'sliders', ...o.controls));
  const plot = fillPlot(widget, o.draw);
  widget.append(legend(o.legend.concat([{ chip: true, color: 'var(--pal-amber-bg)', text: 'amber: the newest proof line' }])));
  if (o.readouts && o.readouts.length) widget.append(hh('div', 'readouts', ...o.readouts.map(r => r.el)));
  const test = hh('div', 'test', h('p', 'part', 'Test it'), triesList(o.tests));
  const model = h('p', 'model');
  model.append(h('span', 'part', 'The picture: '), tex(h('span', '', o.model)));
  widget.append(test, model);
  plot.test = test;
  return plot;
}
// Right column: the proof. Each revealed line lights its part of the picture; once the proof is
// done, the look-back questions take the place of the test under the picture.
function proofRight(side, spec, plot, onLight) {
  const el = document.createElement('fl-proof-steps');
  el.onEvent = d => emit('view.action', d);
  el.onHighlight = key => onLight(key);
  el.lookBackHost = plot.test;
  el.lookBackHint = 'Look back: under the picture.';
  el.data = spec;
  side.append(el);
  return el;
}
function bracket(svg, xa, xb, y, dir) {   // dir 1: ticks point down, -1: up
  return svgNode('path', { d: 'M' + xa.toFixed(1) + ' ' + (y + dir * 8).toFixed(1) + ' L' + xa.toFixed(1) + ' ' + y.toFixed(1) +
    ' L' + xb.toFixed(1) + ' ' + y.toFixed(1) + ' L' + xb.toFixed(1) + ' ' + (y + dir * 8).toFixed(1), fill: 'none', stroke: COL.muted, 'stroke-width': 1.5 }, svg);
}


// ---------- step 1: what a logarithm counts ----------
// A ruler of doublings: the position of x is log2 x. The share alive uses Hamming's 17-year doubling (L1 11:28).
function drawRuler(svg, W, Hh, T) {   // T: the number to reach, shown as x
  const L = 40, R = 40, pw = W - L - R, y = Hh * 0.5;
  const X = k => L + k / 10 * pw;
  svgNode('line', { x1: L, y1: y, x2: W - R, y2: y, stroke: COL.grey, 'stroke-width': 2 }, svg);
  for (let k = 0; k <= 10; k++) {
    svgNode('line', { x1: X(k).toFixed(1), y1: y - 10, x2: X(k).toFixed(1), y2: y + 10, stroke: COL.muted }, svg);
    svgTex(svg, X(k), y + 30, '$2^{' + k + '}$', { w: 60, size: 15 });
  }
  svgTex(svg, L + pw / 2, y + 66, String.raw`$k$ doublings from 1: the value $2^{k}$ under each tick`, { w: 420, size: 15 });
  const pos = Math.log2(T), xm = X(pos);
  svgNode('line', { x1: xm.toFixed(1), y1: y - 96, x2: xm.toFixed(1), y2: y, stroke: COL.ink, 'stroke-dasharray': '4 3', 'data-item': 'mark', 'data-id': 'target' }, svg);
  svgNode('circle', { cx: xm.toFixed(1), cy: y, r: 7, fill: COL.accent, 'data-item': 'mark', 'data-id': 'log2T' }, svg);
  haloTex(svg, xm, y - 112, String.raw`$x=` + T + String.raw`$, $\log_2 x=` + pos.toFixed(2) + '$', { w: 300, size: 15, fill: COL.ink });
}
function slideLogDoub(widget, side) {
  let T = 10;
  const sT = slider(String.raw`$x$, the number to reach`, { id: 'T', name: 'target', min: 1, max: 1000, step: 1, value: T,
    fmt: v => String(v), onInput: v => { T = v; update(); } });
  const rLog = readout('log2', String.raw`doublings from 1 to $x$: $\log_2 x$`);
  widget.append(hh('div', 'sliders', sT.el));
  const plot = fillPlot(widget, (svg, W, Hh) => drawRuler(svg, W, Hh, T));
  widget.append(legend([
    { chip: true, color: 'var(--pal-accent)', text: String.raw`blue dot: $\log_2 x$, where $x$ sits on the ruler` },
    { color: 'var(--pal-ink)', text: String.raw`dashed: the line down from $x$`, dash: true }]),
    hh('div', 'readouts', rLog.el));
  function update() {
    rLog.set(Math.log2(T).toFixed(2));
    plot.redraw();
  }
  side.append(
    triesList([
      String.raw`Set $x=10$: the dot is at $3.32$, between $2^{3}$ and $2^{4}$. Hamming uses this number for the working life of a scientist (step 2).`,
      String.raw`Set $x=64$: the dot sits on the tick $2^{6}$. Whole numbers of doublings land on ticks.`]),
    takeLine(String.raw`$\log_2 x$ counts doublings: the exponent that gives $x$.`));
  update();
}

// ---------- step 2: products become sums (a slide rule) ----------
function drawRule(svg, W, Hh, a, b, o) {
  o = o || {};
  const proof = !!o.proof, lit = o.lit || new Set();
  const L = 50, R = 50, pw = W - L - R;
  const X = v => L + v / 2 * pw;                  // v is log10 of the number; 0 to 2 covers 1 to 100
  const la = Math.log10(a), lb = Math.log10(b), lab = la + lb;
  const rowA = Hh * 0.16, rowB = Hh * 0.34, rowT = Hh * 0.54, axisY = Hh * 0.78;
  if (proof) {   // the proof's lit parts, drawn first so the marks sit on top
    if (lit.has('sticks')) { glowBox(svg, X(0), rowA - 11, X(la) - X(0), 22, 4); glowBox(svg, X(0), rowB - 11, X(lb) - X(0), 22, 4); }
    if (lit.has('ends')) [[la, rowA], [lb, rowB]].forEach(([v, ry]) => {
      glowPath(svg, 'M' + X(v).toFixed(1) + ' ' + (ry + 11) + ' L' + X(v).toFixed(1) + ' ' + axisY, 8);
      glowDot(svg, X(v), axisY, 10);
    });
    if (lit.has('joined')) glowBox(svg, X(0), rowT - 11, X(lab) - X(0), 22, 6);
    if (lit.has('total')) glowPath(svg, 'M' + X(lab).toFixed(1) + ' ' + (rowT + 12) + ' L' + X(lab).toFixed(1) + ' ' + axisY, 10);
  }
  const stick = (y, v0, v1, color, id) => svgNode('rect', { x: X(v0).toFixed(1), y: (y - 11).toFixed(1), width: (X(v1) - X(v0)).toFixed(1),
    height: 22, fill: color, 'data-item': 'mark', 'data-id': id }, svg);
  stick(rowA, 0, la, COL.grey, 'stick-a');
  svgTex(svg, X(la) + 10, rowA, proof ? String.raw`$m=\log_{10}x$, the stick for $x=` + a.toFixed(1) + '$'
    : String.raw`$\log_{10}a$: the stick for $a=` + a.toFixed(1) + '$', { w: 300, anchor: 'start', size: 15 });
  stick(rowB, 0, lb, COL.accent, 'stick-b');
  svgTex(svg, X(lb) + 10, rowB, proof ? String.raw`$n=\log_{10}y$, the stick for $y=` + b.toFixed(1) + '$'
    : String.raw`$\log_{10}b$: the stick for $b=` + b.toFixed(1) + '$', { w: 300, anchor: 'start', size: 15 });
  stick(rowT, 0, la, COL.grey, 'total-a');
  stick(rowT, la, lab, COL.accent, 'total-b');
  if (proof) {
    svgTex(svg, X(la / 2), rowT, '$m$', { w: 60, size: 15, fill: FluidTheme.isDark() ? COL.onAccent : COL.ink });
    svgTex(svg, X(la + lb / 2), rowT, '$n$', { w: 60, size: 15, fill: COL.onAccent });
  } else {
    svgTex(svg, X(la / 2), rowT - 22, String.raw`$\log_{10}a$`, { w: 90, size: 15 });
    svgTex(svg, X(la + lb / 2), rowT - 22, String.raw`$\log_{10}b$`, { w: 90, size: 15 });
  }
  if (proof) [[la, rowA, 'x', COL.grey], [lb, rowB, 'y', COL.accent]].forEach(([v, ry, nm, c]) => {
    svgNode('line', { x1: X(v).toFixed(1), y1: ry + 11, x2: X(v).toFixed(1), y2: axisY, stroke: c, 'stroke-dasharray': '2 3', 'data-item': 'mark', 'data-id': 'to-' + nm }, svg);
    svgNode('circle', { cx: X(v).toFixed(1), cy: axisY, r: 4, fill: c }, svg);
    haloTex(svg, X(v) - 6, axisY - 12, '$' + nm + '$', { w: 30, anchor: 'end', size: 15, fill: COL.ink });
  });

  });
  // The dB scale: the two stages as arrows end to end, and the whole chain's dB.
  const yR = Hh - 34, Xd = v => L + (v + 40) / 80 * pw, top = yc + 54;
  const ya1 = top + (yR - top) * 0.18, ya2 = top + (yR - top) * 0.48;
  if (lit.has('arrows')) {
    glowPath(svg, 'M' + Xd(0).toFixed(1) + ' ' + ya1 + ' L' + Xd(d1).toFixed(1) + ' ' + ya1, 14);
    glowPath(svg, 'M' + Xd(d1).toFixed(1) + ' ' + ya2 + ' L' + Xd(d1 + d2).toFixed(1) + ' ' + ya2, 14);
  }
  svgNode('line', { x1: L, y1: yR, x2: W - R, y2: yR, stroke: COL.grey, 'stroke-width': 2 }, svg);
  for (let v = -40; v <= 40; v += 10) {
    svgNode('line', { x1: Xd(v).toFixed(1), y1: yR - 6, x2: Xd(v).toFixed(1), y2: yR + 6, stroke: COL.muted }, svg);
    svgTex(svg, Xd(v), yR + 20, '$' + (v > 0 ? '+' : '') + v + '$', { w: 50, size: 14 });
  }
  svgNode('line', { x1: Xd(d1).toFixed(1), y1: ya1, x2: Xd(d1).toFixed(1), y2: ya2, stroke: COL.guide, 'stroke-dasharray': '2 3' }, svg);
  arrow(svg, Xd(0), Xd(d1), ya1, COL.grey, 'arrow-1');
  arrow(svg, Xd(d1), Xd(d1 + d2), ya2, COL.accent, 'arrow-2');
  // Each arrow's label sits past its far end, on the side with room.
  const lab = (x0, x1, y, text) => {
    const hi = Math.max(x0, x1), lo = Math.min(x0, x1), toRight = hi + 170 < W || lo - 170 < L;
    svgTex(svg, toRight ? hi + 10 : lo - 10, y, text, { w: 170, anchor: toRight ? 'start' : 'end', size: 14, fill: COL.text2 });
  };
  lab(Xd(0), Xd(d1), ya1, String.raw`stage 1: $` + (d1 >= 0 ? '+' : '') + d1.toFixed(2) + '$ dB');
  lab(Xd(d1), Xd(d1 + d2), ya2, String.raw`stage 2: $` + (d2 >= 0 ? '+' : '') + d2.toFixed(2) + '$ dB');
  if (lit.has('total')) glowPath(svg, 'M' + Xd(dt).toFixed(1) + ' ' + (ya2 + 8) + ' L' + Xd(dt).toFixed(1) + ' ' + yR, 10);
  svgNode('line', { x1: Xd(dt).toFixed(1), y1: ya2 + 8, x2: Xd(dt).toFixed(1), y2: yR, stroke: COL.ink, 'stroke-dasharray': '4 3', 'data-item': 'mark', 'data-id': 'total' }, svg);
  svgNode('circle', { cx: Xd(dt).toFixed(1), cy: yR, r: 5, fill: COL.ink }, svg);
  const right = Xd(dt) + 230 < W;
  haloTex(svg, right ? Xd(dt) + 8 : Xd(dt) - 8, yR - 14, String.raw`chain: $10\log_{10}(G_1G_2)=` + dt.toFixed(2) + '$', { w: 230, anchor: right ? 'start' : 'end', size: 14, fill: COL.ink });
}
function slideWhyDb(widget, side) {
  const GS = [0.01, 0.1, 0.5, 1, 2, 4, 10, 20, 50, 100];
  let i1 = 9, i2 = 2, lit = '';
  const s1 = slider('$G_1$', { id: 'G1', name: 'stage 1 gain', min: 0, max: GS.length - 1, step: 1, value: i1, fmt: v => String(GS[v]), onInput: v => { i1 = v; update(); } });
  const s2 = slider('$G_2$', { id: 'G2', name: 'stage 2 gain', min: 0, max: GS.length - 1, step: 1, value: i2, fmt: v => String(GS[v]), onInput: v => { i2 = v; update(); } });
  const plot = proofLeft(widget, {
    controls: [s1.el, s2.el],
    draw: (svg, W, Hh) => drawChainDb(svg, W, Hh, GS[i1], GS[i2], litSet(lit)),
    legend: [
      { color: 'var(--pal-grey)', text: 'grey: stage 1' },
      { color: 'var(--pal-accent)', text: 'blue: stage 2' },
      { color: 'var(--pal-ink)', dash: true, text: 'dashed: the whole chain' }],
    readouts: [],
    tests: [
      String.raw`Set $G_1=100$, $G_2=0.5$: the chain gives 50, and $20+(-3.01)=16.99$ dB $=10\log_{10}50$.`,
      String.raw`Try more pairs: the two stage labels always add up to the chain's label. Matching cases are evidence, not proof.`],
    model: String.raw`dB is a log, so it measures each power ratio as a length. Stages in a chain multiply the power, so their lengths lie end to end.` });
  proofRight(side, {
    id: 'db-add',
    goal: { tex: String.raw`10\log_{10}\tfrac{P_3}{P_1}=10\log_{10}\tfrac{P_2}{P_1}+10\log_{10}\tfrac{P_3}{P_2}`, words: 'for any powers $P_1,P_2,P_3>0$ along the chain.' },
    facts: [
      { tex: String.raw`\mathrm{dB}=10\log_{10}\tfrac{P_\text{out}}{P_\text{in}}`, ref: 'step 9' },
      { tex: String.raw`\log(xy)=\log x+\log y`, ref: 'step 4' }],
    lines: [
      { tex: String.raw`\frac{P_3}{P_1}=\frac{P_2}{P_1}\cdot\frac{P_3}{P_2}`, move: 'Add zero or multiply by one',
        why: String.raw`multiply by $P_2/P_2=1$: the middle power splits the chain`, choices: ['Rearrange', 'Name a piece'], highlight: 'middle' },
      { tex: String.raw`10\log_{10}\tfrac{P_3}{P_1}=10\log_{10}\Big(\tfrac{P_2}{P_1}\cdot\tfrac{P_3}{P_2}\Big)`, move: 'Unfold the definition',
        why: 'the dB of the whole chain', choices: ['Undo with the inverse', 'Use symmetry'], highlight: 'total' },
      { tex: String.raw`=10\log_{10}\tfrac{P_2}{P_1}+10\log_{10}\tfrac{P_3}{P_2}`, move: 'Use an earlier result',
        why: 'the log of a product (step 4)', choices: ['Rearrange', 'Telescope'], highlight: 'arrows' }],
    lookBack: [
      { q: 'What else does the same idea give?',
        a: String.raw`The 20 for amplitudes: power goes as $A^2$, and $10\log_{10}(A_2/A_1)^2=20\log_{10}(A_2/A_1)$. And $+3$ dB doubles power: $10\log_{10}2=3.01$.` },
      { q: String.raw`Why must $P_2$ be the same on both sides?`,
        a: String.raw`It is stage 1's output and stage 2's input. If stage 2 loads stage 1 and changes $P_2$, gains measured alone no longer multiply.` }] },
    plot, key => { lit = key || ''; plot.redraw(); });
  function update() { plot.redraw(); }
  update();
}

  { id: 'why-working-life', proof: true, title: String.raw`Why it's true: $L=D\log_2 10\approx56$ years`, tag: 'Used in L1 11:59 to 13:00 · L1 16:43',

// The view's close. The primer's last proof lists every move the primer's proofs used, in order of first
// use, once it is proved, so the list never gives a pick away; the last step names what comes next.
const PRIMER_MOVES = ['Unfold the definition', 'Rearrange', 'Change variables', 'Use an earlier result', 'Take a limit', 'Undo with the inverse', 'Name a piece', 'Compare or bound', 'Add zero or multiply by one'];
const NEXT = 'Next: Primer · Derivatives.';

let cur = 0, shownId = null, endSent = false;
function goTo(i) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  if (shownId !== null && shownId !== s.id) emit('view.step', { step: s.id });
  shownId = s.id;
  const stage = $('#stage');
  stage.innerHTML = '';
  PLOTS = [];
  const widget = h('div', 'widget');
  const side = hh('div', 'side',
    h('div', 'tag', s.tag),
    setTex(h('h2'), s.title),
    setTex(h('p', 'question'), s.question),
    s.formula ? setTex(h('div', 'formula'), s.formula) : null,
    s.symbols ? setTex(h('p', 'sym'), s.symbols) : null,
    s.name ? nameLine(s.name) : null);
  const sec = mark(h('section', 'slide' + (s.proof ? ' proof-slide' : '')), 'step', s.id, s.title);
  sec.append(widget, side);
  stage.append(sec);
  stage.scrollTop = 0;
  s.mount(widget, side);
  if (cur === SLIDES.length - 1) {
    const proof = side.querySelector('fl-proof-steps');
    if (proof) proof.primerMoves = PRIMER_MOVES;
    side.querySelector('fl-proof-steps').endNote = NEXT;
    if (!endSent) { endSent = true; emit('view.action', { action: 'deck-end' }); }
  }
  tex(sec);
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, i) => d.classList.toggle('on', i === cur));
}
// A cue is a state: go to the named step, and do nothing if it is already shown.
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i >= 0 && i !== cur) goTo(i);
}
(function init() {
  const dots = $('#dots');
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = s.title;
    b.addEventListener('click', () => goTo(i));
    dots.appendChild(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],textarea,select')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
})();
</script>

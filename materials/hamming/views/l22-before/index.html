<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Before Lecture 22: choose the ability</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><script src="../../components/theme.js"></script><style>*{box-sizing:border-box}body{margin:0;background:var(--pal-bg);color:var(--pal-fg);font:18px/1.42 system-ui,sans-serif}main{height:100vh;padding:26px 30px;display:grid;grid-template-rows:58px 1fr 44px;gap:15px}header,footer{display:flex;align-items:center;justify-content:space-between;gap:14px}h1{font-size:24px;margin:0}h2{font-size:29px;line-height:1.15;margin:0 0 12px}p{margin:0 0 14px}.tag{color:var(--pal-muted);font-size:16px}.body{display:grid;grid-template-columns:59% 1fr;gap:28px;min-height:0}.lab{border:1px solid var(--pal-line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:15px;background:var(--pal-panel);min-height:0}.lesson{padding:8px 0;display:flex;flex-direction:column}.question{font-size:20px}.defs{color:var(--pal-text-2);margin-bottom:14px;font-size:17px}.formula{font-size:26px;margin-bottom:10px}.take{background:var(--pal-accent-soft);padding:15px;border-radius:10px;font-size:18px;margin-top:auto}ol{padding-left:25px;margin:5px 0 18px}li{padding:4px 0}button,select{font:inherit;color:var(--pal-fg);background:var(--pal-soft);border:1px solid var(--pal-line);border-radius:8px;padding:9px 14px;cursor:pointer}button:hover{background:var(--pal-accent-soft)}button:disabled{opacity:.45;cursor:default}.chart{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.chart svg{width:100%;height:100%}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:16px}.legend span:before{content:'';display:inline-block;width:20px;height:4px;background:var(--c);margin-right:7px;vertical-align:middle}.readout{padding:13px;background:var(--pal-soft);border-radius:8px;font-size:18px;min-height:55px}.controls{display:flex;align-items:center;gap:16px}.controls label{display:flex;align-items:center;gap:16px;flex:1}input[type=range]{flex:1;accent-color:var(--pal-accent)}.intro,.choices,.proof{display:flex;flex-direction:column;flex:1;gap:17px;justify-content:center}.intro>div{border-left:4px solid var(--pal-accent);background:var(--pal-soft);padding:20px;font-size:22px}.intro small,.choice small{display:block;font-size:17px;margin-top:8px;color:var(--pal-text-2)}.choice{text-align:left;padding:18px;font-size:20px}.verdict{border-top:1px solid var(--pal-line);margin-top:10px;padding-top:10px;font-size:17px;color:var(--pal-accent-deep)}.proof-row{padding:10px;background:var(--pal-soft);font-size:22px;border-left:4px solid var(--pal-line)}.proof-row:last-child{background:var(--pal-amber-row);border-color:var(--pal-amber)}.proof-row small{display:block;font-size:16px;margin-top:3px;color:var(--pal-text-2)}.guess{font-size:17px}.guess button{font-size:16px;padding:5px 8px;margin:4px 4px 0 0}.proof{gap:10px}.choice{font-size:19px;padding:14px}.choice small,.verdict{font-size:16px;line-height:1.35}.source{color:var(--pal-muted);font-size:15px}a{color:var(--pal-accent-deep)}.pages{font-size:16px;color:var(--pal-muted)}.tile{background:var(--pal-soft);border-left:4px solid var(--pal-accent);padding:16px;font-size:21px}.tile small{display:block;font-size:17px;color:var(--pal-text-2);margin-top:8px}.tiles{display:flex;flex-direction:column;justify-content:center;gap:18px;flex:1}.barrow{display:grid;grid-template-columns:130px 1fr 55px;gap:12px;align-items:center;margin:18px 0;font-size:17px}.track{height:50px;background:var(--pal-soft-2)}.bar{height:100%;background:var(--pal-accent)}.bar.control{background:var(--pal-grey)}.bars{flex:1;display:flex;flex-direction:column;justify-content:center}.bars h3{font-size:19px;margin:8px 0}.readout{line-height:1.5}.proof-row{font-size:21px}.choices{gap:10px}.choice{padding:9px 12px;font-size:18px}.choice small,.verdict{font-size:16px;line-height:1.3}.choice small{margin-top:5px}.verdict{margin-top:6px;padding-top:6px}.choices~.readout{font-size:16px;padding:9px;line-height:1.3}.verdict{font-size:16px}.lesson .take{font-size:17px}.source{font-size:14px}</style></head><body><main><header><h1>Before Lecture 22: choose the ability</h1><span id="tag" class="tag"></span></header><section class="body"><div id="lab" class="lab"></div><article class="lesson"><h2 id="title"></h2><p id="question" class="question"></p><div id="defs" class="defs"></div><div id="formula" class="formula"></div><ol id="tries"></ol><div id="take" class="take"></div></article></section><footer><button id="prev">← Previous</button><span class="pages" id="pages"></span><span class="source">L22 · manual study · <a href="https://www.youtube.com/watch?v=zA3-mLhajkk" target="_blank" rel="noopener">lecture source</a></span><button id="next">Next →</button></footer></main><script>const slides=[{"id": "purpose", "kind": "tiles", "title": "What should a learning tool leave you able to do?", "time": "Before \u00b7 connects to 22:42", "q": "A tutor solves your problem. What should remain after you close it?", "defs": "Computer aided instruction uses a computer to help someone learn. The hard question is which lasting ability the help develops.", "tries": ["Compare the two outcomes on the left.", "Name one task you want to do alone after studying."], "take": "You will separate task completion from ability, design a fair comparison, and test a pattern in a new disguise.", "tiles": [["A finished answer", "A tutor writes a correct solution in 30 seconds."], ["A lasting ability", "Tomorrow you can solve a changed problem without the tutor."], ["Three chapters", "Before: choose the goal. After: compare fairly, test transfer, decide what to automate."]]}, {"id": "ability", "kind": "choices", "title": "Choose the outcome before the tool", "time": "Before \u00b7 connects to 24:14", "q": "Which test answers whether someone can debug a new program?", "defs": "A student completes ten exercises with an AI tutor. You want evidence of independent debugging, not only completed exercises.", "tries": ["Pick the strongest test.", "Read why the other two answer different questions."], "take": "A useful test resembles the ability you want to claim.", "choices": [["Count completed exercises", "Assumes help used during practice will remain available.", "Measures supported output; it does not isolate independent debugging."], ["Give a new bug without the tutor", "Assumes the bug requires the same skill in a changed case.", "Best match for the stated independent-debugging goal."], ["Ask whether the tutor felt clear", "Assumes a feeling of clarity predicts performance.", "Useful experience feedback, but it does not demonstrate debugging."]], "answer": "This is our exercise design, not a claim about a particular AI system."}, {"id": "load", "kind": "load", "title": "Two easy lifts or one hard lift?", "time": "Before \u00b7 connects to 23:12", "q": "Does the same total work imply the same peak challenge?", "defs": "This is a toy model of Hamming\u2019s weightlifting analogy, not a physiological model. Each rectangle is one lift; height is its load.", "tries": ["Toggle between the two schedules.", "Compare total load with the largest load in one lift."], "take": "The total can stay fixed while a defining demand changes. In learning, name the demand before removing it."}, {"id": "prediction", "kind": "choices", "title": "What would persuade you?", "time": "Before \u00b7 connects to 13:25", "q": "A new tutor is popular. Which extra observation bears on learning?", "defs": "Two hundred learners choose the new tutor. Reach and preference are useful facts. They do not yet answer whether it teaches the target skill.", "tries": ["Pick the evidence closest to the learning question.", "Keep your choice in mind while watching."], "take": "Decide what success means before the demonstration makes you want to believe.", "choices": [["More cities connect", "Assumes geographic access is the target.", "Supports access, not a claim about learning."], ["More users say they like it", "Assumes preference is the target.", "Supports satisfaction, not independent skill."], ["Comparable learners solve new tasks later", "Assumes assignment and test conditions permit a fair comparison.", "Addresses learning; the after-view builds the comparison."]], "answer": "Hamming asks whether students learn more, better, or faster at 13:25. The test here makes that question concrete."}];
let page=0;const states=slides.map(()=>({reveal:0,choice:false,value:0,toggle:false}));
const $=id=>document.getElementById(id);
function math(){if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:'$',right:'$',display:false}],throwOnError:false});}
function bars(rows){return '<div class="bars">'+rows.map(([label,v,cls])=>`<div class="barrow"><span>${label}</span><div class="track"><div class="bar ${cls||''}" style="width:${v}%"></div></div><span>${v}</span></div>`).join('')+'</div>';}
function draw(){const s=slides[page],st=states[page];$('title').textContent=s.title;$('question').textContent=s.q;$('defs').innerHTML=s.defs;$('tag').textContent=s.time;$('formula').innerHTML=s.formula||'';$('tries').innerHTML=s.tries.map(x=>'<li>'+x+'</li>').join('');$('take').textContent=s.take;$('pages').textContent=`${page+1} / ${slides.length}`;$('prev').disabled=page===0;$('next').disabled=page===slides.length-1;
let h='';
if(s.kind==='tiles')h='<div class="tiles">'+s.tiles.map(t=>`<div class="tile">${t[0]}<small>${t[1]}</small></div>`).join('')+'</div>';
if(s.kind==='choices'){h='<div class="choices">'+s.choices.map((c,i)=>`<button class="choice" data-choice="${i}" data-item="choice" data-id="${s.id}-${i}">${c[0]}<small>${c[1]}</small>${st.choice?'<div class="verdict">'+c[2]+'</div>':''}</button>`).join('')+'</div><button id="answer">Show answer</button>'+(st.choice?'<div class="readout">'+s.answer+'</div>':'');}
if(s.kind==='proof'){h='<div class="proof">'+s.rows.slice(0,st.reveal).map(r=>`<div class="proof-row">$${r[0]}$<small>${r[1]}</small></div>`).join('')+'</div><div class="guess">Before revealing: which move comes next?</div><button id="reveal" '+(st.reveal>=s.rows.length?'disabled':'')+'>Reveal next line</button>';}
if(s.kind==='experiment'){const a=st.value;h='<div class="legend">Blue: new lesson · Grey: comparison lesson<br>Bar length: score out of 100</div>'+bars([['New lesson',58+a,''],[s.matched?'Active control':'Ordinary class',60+(s.matched?a:0),'control']])+`<div class="readout">Difference: ${-2+(s.matched?0:a)} points. Extra attention: ${a} points.</div><label class="controls">Extra attention <input id="amount" type="range" min="0" max="12" value="${a}"></label>`;}
if(s.kind==='load'){h='<div class="legend">Blue rectangle: load in one lift · Full height: 250 pounds</div><div style="flex:1;display:flex;align-items:end;justify-content:center;gap:30px;padding:20px">'+(st.toggle?'<div style="height:50%;width:38%;background:var(--pal-accent);color:var(--pal-on-accent);display:grid;place-items:center">Lift 1 · 125</div><div style="height:50%;width:38%;background:var(--pal-accent);color:var(--pal-on-accent);display:grid;place-items:center">Lift 2 · 125</div>':'<div style="height:100%;width:50%;background:var(--pal-accent);color:var(--pal-on-accent);display:grid;place-items:center">Lift 1 · 250</div>')+'</div><div class="readout">Total: 250 pounds. Largest single load: '+(st.toggle?'125':'250')+' pounds.</div><button id="toggle">Switch schedule</button>';}
if(s.kind==='pattern'){h='<div class="tiles"><div class="tile">A · Familiar input<small>$\\int \\frac{1}{u}\\,du$</small></div><div class="tile">B · New symbols<small>$\\int \\frac{\\cos x}{\\sin x}\\,dx$</small></div><div class="tile">C · A missing factor<small>$\\int \\frac{1}{\\sin x}\\,dx$</small></div></div><button id="answer">Reveal the matching pair</button>'+(st.choice?'<div class="readout">A and B share the pattern. In B, cosine is the derivative of sine. C is missing that numerator; the same direct log rule does not fit.</div>':'');}
if(s.kind==='transfer'){h='<div class="legend">Blue: Tutor A · Grey: Tutor B<br>Bar length: learners correct out of 100</div><h3>'+(st.toggle?'Later: new task, no tutor':'Practice: tutor available')+'</h3>'+bars(st.toggle?[['Tutor A',55,''],['Tutor B',70,'control']]:[['Tutor A',95,''],['Tutor B',80,'control']])+'<div class="readout">'+(st.toggle?'Tutor B leads by 15 learners on independent transfer.':'Tutor A leads by 15 learners during assisted practice.')+'</div><button id="toggle">Switch test conditions</button>';}
$('lab').innerHTML=h;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{st.choice=true;draw()});if($('answer'))$('answer').onclick=()=>{st.choice=true;draw()};if($('reveal'))$('reveal').onclick=()=>{st.reveal++;draw()};if($('amount'))$('amount').oninput=e=>{st.value=+e.target.value;draw()};if($('toggle'))$('toggle').onclick=()=>{st.toggle=!st.toggle;draw()};math();}
function setPage(i){page=i;draw()}$('prev').onclick=()=>setPage(Math.max(0,page-1));$('next').onclick=()=>setPage(Math.min(slides.length-1,page+1));window.addEventListener('fluid-themechange',draw);window.addEventListener('load',draw);draw();
</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primer · Fourier series</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../../components/theme.js"></script>
<style>
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft);
  --red:var(--pal-red); --redbg:var(--pal-red-bg);
  --u:clamp(16px,1.35vw,20px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 24px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(6px,1vh,12px) 24px}
footer{display:flex;align-items:center;gap:10px;padding:8px 24px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Slide frame: widget on the left (3/5), text on the right (2/5). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(18px,2.4vw,40px)}
.widget{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(5px,1vh,10px);overflow:hidden}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(6px,1.1vh,12px);overflow:hidden}
.tag{font:13px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(20px,1.9vw,28px);line-height:1.2;margin:0;font-weight:650}
.question{margin:0;font-size:clamp(16px,1.3vw,18px);font-weight:600}
.formula{font-size:clamp(17px,1.7vw,23px)}
.formula .katex-display{margin:.3em 0}
.sym{margin:0;font-size:16px;color:var(--muted)}
.tries{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.tries li::marker{color:var(--accent);font-weight:600}
.takeaway{margin:0;padding:10px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}
.takeaway.pending{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--pal-panel);border-left:4px dashed var(--line);color:var(--muted)}

/* Controls, readouts, legends */
.btn{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--pal-panel);border-radius:8px;cursor:pointer;font-size:16px}
.btn.on{background:var(--chip);border-color:var(--accent);color:var(--pal-accent-deep)}
.btn:disabled{opacity:.45;cursor:default}
.btnrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chips .chip-lab{font-size:15px;color:var(--muted);min-width:70px}
.chips .btn{padding:3px 9px;font-size:15px}
.slide-ctl{display:flex;align-items:center;gap:8px;font-size:16px}
.slide-ctl input{width:clamp(110px,10vw,150px);vertical-align:middle;accent-color:var(--accent)}
.slide-ctl .val{min-width:40px}
.readouts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.readout{flex:1 1 150px;min-width:0;padding:4px 8px;border-radius:10px;background:var(--pal-soft);font-size:15px;overflow-wrap:anywhere}
.readout .k{color:var(--muted);font-size:14px}
.readout .val{font-size:16px;font-weight:600}
.legend{display:flex;gap:2px 16px;flex-wrap:wrap;font-size:15px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:20px;height:0;vertical-align:middle;margin-right:6px}
.chip{display:inline-block;width:18px;height:12px;vertical-align:middle;margin-right:6px;border-radius:2px}

/* Plots fill the height left in the widget */
.fill{flex:1 1 0;min-height:120px;position:relative;width:100%}
.fill>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.row2{display:flex;gap:12px;align-items:stretch;flex:1 1 0;min-height:0}
.aside{flex:0 0 226px;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:15px}
.aside .asideh{color:var(--muted);font-size:14px}
.gram{font-size:15px;overflow-wrap:anywhere}
.clist{display:flex;flex-direction:column;gap:1px;font-size:15px}

/* Proof slides: test and picture on the left, the proof (fl-proof-steps) on the right */
.slide.proof-slide{grid-template-columns:minmax(0,11fr) minmax(0,9fr)}
.slide.proof-slide .side{justify-content:flex-start}
.slide.proof-slide .question{margin-bottom:14px}
.slide.proof-slide .fill{min-height:100px}
.slide.proof-slide .slide-ctl input{width:clamp(90px,8vw,130px)}
.slide.proof-slide .slide-ctl .val{min-width:30px}
.slide.proof-slide .legend{gap:2px 12px}
.slide.proof-slide .chips .btn{padding:3px 7px}
.slide.proof-slide .chips .chip-lab{min-width:0}
.ctlrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 22px}
.part{margin:0;font-weight:600;color:var(--muted)}
.test{display:flex;flex-direction:column;gap:3px}
.test .tries{gap:3px}
.model{margin:0;padding:8px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}
.name i{font-style:italic}

/* Short windows (1100x620 and similar): tighter spacing, text stays 16px */
@media (max-height: 680px){
  header{padding-top:4px}
  #stage{padding:4px 24px}
  footer{padding:4px 24px}
  .widget{gap:4px}
  .side{gap:5px}
  .tries{gap:2px}
  .sym,.tries{line-height:1.2}
  .takeaway{padding:6px 10px}
  .formula{font-size:19px}
  .fill{min-height:110px}
  .readout{padding:3px 8px}
  .aside{flex-basis:200px}
  h2{font-size:20px}
  .model{padding:5px 10px}
  .test .tries{gap:1px}
  .slide.proof-slide h2{font-size:19px}
  .slide.proof-slide .question{margin-bottom:0}
}
</style>
</head>
<body>
<header>Primer · Fourier series</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script src="../../components/proof-steps.js"></script>
<script>
// ---------- palette and redraw ----------
// COL holds the palette colors for the SVG being drawn. fillBox sets it at every paint, so a draw always uses
// the current theme; no color is cached at load. Light values are the old literals, so light looks as before.
let COL = {};
const PAL_NAMES = ['accent', 'accent-2', 'accent-deep', 'accent-ink', 'accent-soft', 'accent-tint', 'amber', 'amber-bg', 'amber-ink', 'blue-deep', 'blue-light', 'blue-pale', 'blue-strong', 'fg', 'grey', 'grey-blue', 'guide', 'bg', 'hue-orange', 'ink', 'line', 'muted', 'panel', 'slate-2', 'soft', 'soft-2', 'soft-3', 'soft-hover', 'text-2'];
function readPalette() {
  const o = {};
  for (const n of PAL_NAMES) o[n.replace(/-(\w)/g, (_, c) => c.toUpperCase())] = FluidTheme.color(n);
  return o;
}
let PLOTS = [];   // the plots on the current slide; a theme switch redraws them, and keeps every control's state
window.addEventListener('fluid-themechange', () => PLOTS.forEach(p => p.redraw()));

// ---------- helpers (same frame as the other slide views) ----------
const $ = s => document.querySelector(s);
const NSV = 'http://www.w3.org/2000/svg', NHT = 'http://www.w3.org/1999/xhtml';
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false } ], throwOnError: false };
// Render $...$ and $$...$$ in a node. If the CDN did not load, the text stays as typed.
function tex(node) {
  if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH);
  return node;
}
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function hh(tag, cls, ...kids) {
  const e = h(tag, cls);
  for (const k of kids) if (k) e.append(k);
  return e;
}
function mark(e, kind, id, title) {
  e.dataset.item = kind;
  if (id != null) e.dataset.id = id;
  if (title != null) e.dataset.title = title;
  return e;
}
function svgNode(tag, attrs, parent) {
  const e = document.createElementNS(NSV, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function svgRoot(w, ht) {
  return svgNode('svg', { viewBox: '0 0 ' + w + ' ' + ht, role: 'img', 'font-family': 'system-ui, sans-serif', 'font-size': 14 });
}
function svgText(parent, x, y, s, attrs) {
  const t = svgNode('text', Object.assign({ x: x, y: y, fill: COL.muted }, attrs || {}), parent);
  t.textContent = s;
  return t;
}
// A KaTeX label over an SVG: a foreignObject holding a rendered formula.
function svgTex(parent, x, y, s, o) {
  o = o || {};
  const w = o.w || 220, ht = 26, anchor = o.anchor || 'middle';
  const x0 = anchor === 'end' ? x - w : anchor === 'start' ? x : x - w / 2;
  const fo = svgNode('foreignObject', { x: x0, y: y - ht / 2, width: w, height: ht }, parent);
  if (o.dim) fo.setAttribute('class', 'dim');
  const d = document.createElementNS(NHT, 'div');
  const jc = anchor === 'end' ? 'flex-end' : anchor === 'start' ? 'flex-start' : 'center';
  d.setAttribute('style', 'display:flex;align-items:center;height:100%;white-space:nowrap;font-size:' +
    (o.size || 15) + 'px;color:' + (o.fill || 'var(--pal-text-2)') + ';justify-content:' + jc);
  const span = document.createElementNS(NHT, 'span');
  span.textContent = s;
  if (o.bg) span.setAttribute('style', 'background:' + o.bg + ';border-radius:5px;padding:1px 5px');
  d.appendChild(span);
  fo.appendChild(d);
  tex(span);
  return fo;
}
// Same label with a white halo, so it reads over a curve.
function haloTex(parent, x, y, s, o) {
  const fo = svgTex(parent, x, y, s, o);
  fo.firstChild.style.textShadow = '0 0 3px var(--pal-bg), 0 0 3px var(--pal-bg), 0 0 2px var(--pal-bg)';
  return fo;
}
// A plot that takes the height left in its box. draw(svg, W, H) runs on every resize.
function fillBox(box, draw) {
  const wrap = h('div', 'fill');
  box.append(wrap);
  let key = '';
  const paint = force => {
    const w = Math.floor(wrap.clientWidth), ht = Math.floor(wrap.clientHeight);
    if (w < 60 || ht < 60) return;
    if (!force && key === w + 'x' + ht) return;
    key = w + 'x' + ht;
    const svg = svgRoot(w, ht);
    COL = readPalette();
    draw(svg, w, ht);
    wrap.replaceChildren(svg);
  };
  new ResizeObserver(() => paint(false)).observe(wrap);
  const plot = { wrap: wrap, redraw: () => paint(true) };
  PLOTS.push(plot);
  return plot;
}
// A readout box: label and value are KaTeX-ready text.
function readout(id, label) {
  const box = mark(h('div', 'readout'), 'readout', id);
  const k = h('div', 'k');
  setTex(k, label);
  const v = h('div', 'val');
  box.append(k, v);
  return {
    el: box,
    label(t) { setTex(k, t); },
    set(text, bad) { setTex(v, text); box.classList.toggle('bad', !!bad); },
  };
}
function legend(items) {
  const d = h('div', 'legend');
  for (const it of items) {
    const s = h('span');
    const sw = it.chip ? h('span', 'chip') : h('span', 'sw');
    if (it.chip) sw.style.background = it.color;
    else sw.style.borderTop = '2px ' + (it.dash ? 'dashed' : 'solid') + ' ' + it.color;
    const t = h('span');
    setTex(t, it.text);
    s.append(sw, t);
    d.appendChild(s);
  }
  return d;
}
// A row of toggle chips. items: [[id, KaTeX label]]. onPick(id) on click.
function chipRow(label, items, initial, onPick, prefix) {
  const row = h('div', 'chips');
  row.append(setTex(h('span', 'chip-lab'), label));
  const btns = items.map(([id, t]) => {
    const b = mark(h('button', 'btn'), 'control', prefix + '-' + id);
    setTex(b, t);
    b.addEventListener('click', () => onPick(id));
    row.append(b);
    return [id, b];
  });
  return {
    el: row,
    set(id) { btns.forEach(([i, b]) => b.classList.toggle('on', i === id)); },
  };
}
// A labelled range input whose label and range can change.
function ctlSlider(id, name, min, max, value, fmt, onInput) {
  const wrap = h('label', 'slide-ctl');
  const lab = h('span');
  const val = h('span', 'val');
  const inp = h('input');
  inp.type = 'range'; inp.min = min; inp.max = max; inp.step = 1; inp.value = value;
  mark(inp, 'control', id, name);
  wrap.append(lab, inp, val);
  const api = {
    el: wrap, input: inp,
    show() { setTex(val, fmt(+inp.value)); },
    label(t) { setTex(lab, t); },
    range(mx, v) { inp.max = mx; inp.value = v; api.show(); },
  };
  inp.addEventListener('input', () => { api.show(); onInput(+inp.value); });
  return api;
}
function sym(text) { return setTex(h('p', 'sym'), text); }
function triesList(items) { return hh('ol', 'tries', ...items.map(t => setTex(h('li'), t))); }
// The takeaway waits for the first try: a dashed placeholder with a Show button keeps the column full.
function takeSlot(text) {
  const box = h('div', 'takeaway pending');
  const btn = mark(h('button', 'btn', 'Show'), 'control', 'show-takeaway');
  box.append(h('span', '', 'Takeaway: after your first try.'), btn);
  let shown = false;
  function reveal() {
    if (shown) return;
    shown = true;
    box.className = 'takeaway';
    box.replaceChildren();
    setTex(box, text);
  }
  btn.addEventListener('click', reveal);
  return { el: box, reveal: reveal };
}
// Session events. Optional: with no bridge, nothing is sent.
function emit(kind, data) {
  try {
    if (window.fluid && typeof window.fluid.emit === 'function') Promise.resolve(window.fluid.emit(kind, data)).catch(() => {});
  } catch (e) { /* the view works without the bridge */ }
}

// ---------- math: N = 8 samples, frequency k means k full cycles over the 8 samples ----------
const TAU = 2 * Math.PI, N = 8;
const SAMPLES = [0, 1, 2, 3, 4, 5, 6, 7];
const U0 = [4, 3, 1, 0, 1, 0, 2, 3];                 // default input, energy 40
const WV = {};                                        // basis waves, as functions of an angle x
function wave(id, tex, kind, k) {
  const f = kind === 'one' ? () => 1 : kind === 'cos' ? x => Math.cos(k * x) : x => Math.sin(k * x);
  WV[id] = { id: id, tex: tex, kind: kind, k: k, f: f };
}
wave('one', String.raw`$1$`, 'one', 0);
wave('c1', String.raw`$\cos 1$`, 'cos', 1);
wave('s1', String.raw`$\sin 1$`, 'sin', 1);
wave('c2', String.raw`$\cos 2$`, 'cos', 2);
wave('s2', String.raw`$\sin 2$`, 'sin', 2);
wave('c3', String.raw`$\cos 3$`, 'cos', 3);
wave('s3', String.raw`$\sin 3$`, 'sin', 3);
wave('c4', String.raw`$\cos 4$`, 'cos', 4);
wave('s4', String.raw`$\sin 4$`, 'sin', 4);
const TERM_IDS = ['one', 'c1', 's1', 'c2', 's2', 'c3', 's3', 'c4'];   // order of the projection terms
const CH_WAVES = [['one', WV.one.tex], ['c1', WV.c1.tex], ['s1', WV.s1.tex], ['c2', WV.c2.tex], ['s2', WV.s2.tex],
  ['c3', WV.c3.tex], ['s3', WV.s3.tex], ['c4', WV.c4.tex], ['s4', WV.s4.tex]];
const sampleVec = f => SAMPLES.map(n => f(TAU * n / N));
const dot = (a, b) => a.reduce((s, v, i) => s + v * b[i], 0);
const GRID = Array.from({ length: 1000 }, (_, i) => -Math.PI + TAU * (i + 0.5) / 1000);
const CURVE_X = Array.from({ length: 201 }, (_, i) => -Math.PI + TAU * i / 200);
const contDot = (f, g) => GRID.reduce((s, x) => s + f(x) * g(x), 0) * TAU / 1000;
const num = x => Math.abs(x) < 1e-9 ? '0' : String(+x.toFixed(3));
const stripD = s => s.replace(/\$/g, '');
// Modified Bessel I_k(1), by its series. Used for the e^{cos x} coefficients.
function besselI1(k) {
  let s = 0;
  for (let m = 0; m < 30; m++) s += Math.pow(0.5, 2 * m + k) / (factorial(m) * factorial(m + k));
  return s;
}
function factorial(n) { let f = 1; for (let i = 2; i <= n; i++) f *= i; return f; }
// Solve A x = b for a small square system (Gauss-Jordan with pivoting).
function solveLin(A, b) {
  const n = b.length, M = A.map((row, i) => row.concat([b[i]]));
  for (let i = 0; i < n; i++) {
    let p = i;
    for (let r = i + 1; r < n; r++) if (Math.abs(M[r][i]) > Math.abs(M[p][i])) p = r;
    [M[i], M[p]] = [M[p], M[i]];
    for (let r = 0; r < n; r++) {
      if (r === i) continue;
      const f = M[r][i] / M[i][i];
      for (let c = i; c <= n; c++) M[r][c] -= f * M[i][c];
    }
  }
  return M.map((row, i) => row[n] / row[i]);
}

// ---------- step 2: waves at different frequencies are perpendicular ----------
function slideOrth(widget, side) {
  let a = 'c1', b = 'c2', cont = false;
  const take = takeSlot(String.raw`Waves at different frequencies are perpendicular, so each frequency can be measured on its own.`);
  const user = fn => id => { take.reveal(); fn(id); };
  const rowA = chipRow(String.raw`wave $w_1$`, CH_WAVES, a, user(id => { a = id; update(); }), 'w1');
  const rowB = chipRow(String.raw`wave $w_2$`, CH_WAVES, b, user(id => { b = id; update(); }), 'w2');
  const rowM = chipRow('view', [['samples', 'samples'], ['cont', String.raw`continuous, $[-\pi,\pi]$`]],
    'samples', user(id => { cont = id === 'cont'; update(); }), 'view');
  const legS = legend([
    { color: 'var(--pal-grey-blue)', text: String.raw`grey-blue stems: $w_1$` },
    { color: 'var(--pal-fg)', text: String.raw`solid stems: $w_2$` },
    { color: 'var(--pal-accent)', text: String.raw`blue stems: $w_1 w_2$, the product` }]);
  const legC = legend([
    { color: 'var(--pal-grey-blue)', text: String.raw`grey-blue curve: $w_1$` },
    { color: 'var(--pal-fg)', text: String.raw`solid curve: $w_2$` },
    { color: 'var(--pal-accent-3)', chip: true, text: String.raw`blue area: product above $0$` },
    { color: 'var(--pal-guide)', chip: true, text: String.raw`grey area: product below $0$` }]);
  widget.append(rowA.el, rowB.el, rowM.el, legS, legC);
  const plot = fillBox(widget, drawOrth);
  const rD = readout('dot', '');
  const rS = readout('self', String.raw`$w_1\cdot w_1$, same wave twice`);
  widget.append(hh('div', 'readouts', rD.el, rS.el));
  side.append(
    sym(String.raw`$\cos k$: $\cos\frac{2\pi kn}{8}$ at $n=0,\dots,7$, so $f=k/8$ rotations per sample. Example: $\cos 1=(1,\ 0.71,\ 0,\ -0.71,\ -1,\ -0.71,\ 0,\ 0.71)$. $w_1\cdot w_2$: multiply sample by sample, then add (Primer · Vectors, step 4). Hamming's word for perpendicular is orthogonal (Primer · Vectors, step 7).`),
    setTex(h('div', 'formula'), String.raw`$$\cos k\cdot\cos m=0 \text{ for } k\ne m$$`),
    triesList([
      String.raw`Keep $\cos 1$ and $\cos 2$. The stems at $n=0$ and $n=4$ are $+1$ and $-1$ and cancel: the dot product is $0$.`,
      String.raw`Set both waves to $\cos 1$: the dot product is $4$. Set both to $1$: it is $8$. Turn on continuous: the same pairs give $\pi$ and $2\pi$.`,
      String.raw`Set wave 1 to $\sin 4$. Every sample is $0$, so every product is $0$.`]),
    take.el);
  function update() {
    rowA.set(a); rowB.set(b); rowM.set(cont ? 'cont' : 'samples');
    legS.hidden = cont; legC.hidden = !cont;
    rD.label(cont ? String.raw`$w_1\cdot w_2$ as an integral, $\int_{-\pi}^{\pi}w_1w_2\,dx$` : String.raw`$w_1\cdot w_2$, sum over samples`);
    const fa = WV[a].f, fb = WV[b].f;
    let d, s;
    if (cont) { d = contDot(fa, fb); s = contDot(fa, fa); }
    else { const va = sampleVec(fa), vb = sampleVec(fb); d = dot(va, vb); s = dot(va, va); }
    rD.set(num(d));
    rS.set(num(s));
    plot.redraw();
  }
  function drawOrth(svg, Wd, H) {
    const L = 124, R = 14, AX = 24, pw = Wd - L - R, ph = (H - AX) / 3;
    const A = (ph / 2 - 8) / 1.2;          // pixels per unit; values stay within plus or minus 1
    const fa = WV[a].f, fb = WV[b].f;
    const rows = [
      { lab: String.raw`$w_1=` + stripD(WV[a].tex) + '$', col: COL.greyBlue, fn: fa, id: 'w1' },

// ---------- step 6: least squares with perpendicular waves ----------
const FOUR_LEN = [1, 3, 5, 7, 8];   // columns used for m = 0..4 frequencies
const LS_NAMES = [String.raw`$\frac{a_0}{2}$`, String.raw`$a_1$`, String.raw`$b_1$`, String.raw`$a_2$`, String.raw`$b_2$`,
  String.raw`$a_3$`, String.raw`$b_3$`, String.raw`$a_4$`];
const POW_NAMES = [String.raw`$1$`, String.raw`$n$`, String.raw`$n^2$`];
const LS_COLS = TERM_IDS.map((id, i) => ({ name: LS_NAMES[i], g: t => WV[id].f(TAU * t / N) }));
function colsOf(md, lv) {
  if (md === 'fourier') return LS_COLS.slice(0, FOUR_LEN[lv]);

// Least squares of the default input on the chosen columns.

  const r = vecs.map(a => dot(a, U0));
  const c = solveLin(G, r);
  const fitv = SAMPLES.map((_, n) => c.reduce((s, cj, j) => s + cj * vecs[j][n], 0));
  const err = dot(U0.map((v, n) => v - fitv[n]), U0.map((v, n) => v - fitv[n]));
  return { cols: cols, G: G, c: c, err: err };
}
function slideLS(widget, side) {

    sym(String.raw`$X$: one column per wave ($m=1$: $1$, $\cos 1$, $\sin 1$). Fit $\hat u=Xc$ from $X^\top Xc=X^\top u$ (Primer · Least squares, step 4); perpendicular columns make $X^\top X$ diagonal.`),
    setTex(h('div', 'formula'), String.raw`$$\hat c_j=\frac{u\cdot x_j}{x_j\cdot x_j}$$`),
    triesList([
      String.raw`Press $m=1$, then $2$, $3$, $4$. The error falls $15.5 \to 2.136 \to 1.136 \to 0.5 \to 0$; earlier coefficients stay put.`,
      String.raw`Switch to powers, degree $1$ to $2$. The constant moves from $2.333$ to $4.25$: powers are not perpendicular, so a new column moves the others.`,
      String.raw`Read the drop when $m$ goes up. At $m=3$ it is $0.636=4(a_3^2+b_3^2)$; at $m=4$ it is $0.5=8a_4^2$.`]),
    take.el);

  }

function besselTable() { const t = []; for (let k = 0; k <= 49; k++) t.push(besselI1(k)); return t; }

      String.raw`Choose sawtooth $x$: $A_k=2/k$, by parts in Primer · Integrals: techniques, step 5. Overshoot: $3.87\%$ at $K=9$, $7.95\%$ at $K=49$.`]),
    take.el);
  function drawFun(svg, Wd, H) {
    const F = SM[fk];

    svgText(svg, L - 6, Y(0) + 5, '0', { 'text-anchor': 'end', 'font-size': 14 });
    [[-2 * Math.PI, '$-2\\pi$'], [-Math.PI, '$-\\pi$'], [0, '$0$'], [Math.PI, '$\\pi$'], [2 * Math.PI, '$2\\pi$']]
      .forEach(([x, lab]) => svgTex(svg, X(x), base + 13, lab, { w: 60, size: 15 }));
    const pts = Array.from({ length: 601 }, (_, i) => -2 * Math.PI + 4 * Math.PI * i / 600);
    let df = '', ds = '';

    });
    svgNode('path', { d: df, fill: 'none', stroke: COL.greyBlue, 'stroke-width': 3, 'data-item': 'mark', 'data-id': 'f' }, svg);
    svgNode('path', { d: ds, fill: 'none', stroke: COL.accent, 'stroke-width': 2, 'data-item': 'mark', 'data-id': 'S-K' }, svg);
    if (ov) {

      haloTex(svg, X(ov.x) + 10, Y(ov.y) + 4, '$' + ov.pct.toFixed(2) + '\\%$ overshoot', { anchor: 'start', w: 200, size: 15, fill: COL.ink });

    svgTex(svg, Wd - R - 4, base + 16, '$k$', { w: 30, size: 15, anchor: 'end' });
    [1, -1, -3, -5, -7].forEach(e => svgTex(svg, L - 4, Y(Math.pow(10, e)), '$10^{' + e + '}$', { w: 50, size: 14, anchor: 'end' }));
    [[1, '$1/k$'], [2, '$1/k^2$'], [3, '$1/k^3$']].forEach(([p, lab]) => {
      let d = '';
      for (let k = 1; k <= 49; k++) d += (k > 1 ? 'L' : 'M') + X(k).toFixed(1) + ' ' + Y(Math.pow(k, -p)).toFixed(1);

  }
  function update() {

    sl.range(49, K);

    rOv.set(ov ? ov.pct.toFixed(2) : 'none (no jump)');

  }
  update();
}

// ---------- step 1: a few waves add up to a shape ----------
// Two shapes, both built from odd frequencies only. The square wave is odd (sines); |x| is even (cosines).
const SHP = {
  sq: { lo: -1.6, hi: 1.6,
    f: x => ((x % TAU) + TAU) % TAU < Math.PI ? 1 : -1,
    S: (T, x) => { let s = 0; for (let k = 1; k <= 2 * T - 1; k += 2) s += 4 / (Math.PI * k) * Math.sin(k * x); return s; },
    term: (k, x) => 4 / (Math.PI * k) * Math.sin(k * x),
    tex: String.raw`$$S_K(x)=\frac{4}{\pi}\sum_{k\ \mathrm{odd}\le K}\frac{\sin kx}{k}$$` },
  ab: { lo: -0.6, hi: 3.6,
    f: x => Math.abs(x),
    S: (T, x) => { let s = Math.PI / 2; for (let k = 1; k <= 2 * T - 1; k += 2) s -= 4 / (Math.PI * k * k) * Math.cos(k * x); return s; },
    term: (k, x) => -4 / (Math.PI * k * k) * Math.cos(k * x),
    tex: String.raw`$$S_K(x)=\frac{\pi}{2}-\frac{4}{\pi}\sum_{k\ \mathrm{odd}\le K}\frac{\cos kx}{k^2}$$` },
};
function slideShape(widget, side) {
  let fk = 'sq', T = 1;
  const take = takeSlot(String.raw`Whole-number frequencies, with the right weights, build a shape. Each new term is smaller.`);
  const user = fn => (...args) => { take.reveal(); fn(...args); };
  const rowF = chipRow('shape $f$', [['sq', 'square wave'], ['ab', String.raw`$|x|$`]], fk,
    user(id => { fk = id; update(); }), 'shape');
  const sl = ctlSlider('terms', 'terms', 1, 5, T, v => String(v), user(v => { T = v; update(); }));
  sl.label(String.raw`terms $T$`);
  const legF = legend([
    { color: 'var(--pal-grey-blue)', text: String.raw`grey-blue: $f$, the shape` },
    { color: 'var(--pal-accent)', text: String.raw`blue: $S_K$, the sum of its waves` },
    { color: 'var(--pal-hue-orange)', text: String.raw`amber: the newest term alone` }]);
  const rK = readout('K', String.raw`highest frequency $K=2T-1$`);
  const rGap = readout('gap', String.raw`mean squared gap $\frac{1}{2\pi}\int(f-S_K)^2$`);
  widget.append(rowF.el, hh('div', 'sliders', sl.el), legF);
  const plot = fillBox(widget, drawShape);
  widget.append(hh('div', 'readouts', rK.el, rGap.el));
  const fNode = setTex(h('div', 'formula'), '');
  side.append(
    sym(String.raw`$f$: the shape, repeated every $2\pi$. $S_K$: the sum of its waves up to $K$. Example: the square wave is $+1$ on $(0,\pi)$, then $-1$. Its first term is $\frac{4}{\pi}\sin x$. Step 9 proves the weights.`),
    fNode,
    triesList([
      String.raw`Square wave, terms $1$: the blue curve is one sine wave. Terms $5$: the top flattens and the sides steepen.`,
      String.raw`Choose $|x|$. Its waves are cosines only: the shape is even, $f(-x)=f(x)$. The square wave is odd, so it has sines only.`,
      String.raw`Watch the amber line shrink as $k$ grows. The gap falls at each step.`]),
    take.el);
  function drawShape(svg, Wd, H) {
    const F = SHP[fk];
    const L = 44, R = 14, Tp = 12, B = 24, base = H - B, pw = Wd - L - R;
    const X = x => L + (x + Math.PI) / TAU * pw;
    const Y = v => base - (v - F.lo) / (F.hi - F.lo) * (base - Tp);
    svgNode('line', { x1: L, x2: Wd - R, y1: Y(0), y2: Y(0), stroke: COL.line }, svg);
    svgText(svg, L - 6, Y(0) + 5, '0', { 'text-anchor': 'end', 'font-size': 14 });
    [[-Math.PI, '$-\\pi$'], [0, '$0$'], [Math.PI, '$\\pi$']].forEach(([x, lab]) => svgTex(svg, X(x), base + 13, lab, { w: 60, size: 15 }));
    const pts = Array.from({ length: 401 }, (_, i) => -Math.PI + TAU * i / 400);
    const trace = (fn, id, stroke, w) => {
      let d = '';
      pts.forEach((x, i) => { d += (i ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(fn(x)).toFixed(1); });
      svgNode('path', { d: d, fill: 'none', stroke: stroke, 'stroke-width': w, 'data-item': 'mark', 'data-id': id }, svg);
    };
    trace(F.f, 'f', COL.greyBlue, 3);
    trace(x => F.S(T, x), 'S-K', COL.accent, 2.5);
    trace(x => F.term(2 * T - 1, x), 'newest', COL.hueOrange, 2);   // drawn last, so it shows at terms 1
  }
  function update() {
    rowF.set(fk);
    sl.range(5, T);
    const F = SHP[fk];
    rK.set(String(2 * T - 1));
    let e = 0;
    for (const x of GRID) e += (F.f(x) - F.S(T, x)) ** 2;
    e /= GRID.length;
    rGap.set(e < 0.001 ? e.toExponential(1) : e.toFixed(3));
    setTex(fNode, F.tex);
    plot.redraw();
  }
  update();
}

// ---------- step 10: N samples give N frequency sizes, and the FFT is fast ----------
const DFT_IN = { default: U0, tone: Array.from({ length: N }, (_, n) => Math.cos(TAU * 2 * n / N)) };
// |U_k| = |1/N sum_n u_n e^{-i 2 pi k n / N}| for k = 0..N-1
function dftMag(u) {
  return Array.from({ length: N }, (_, k) => {
    let re = 0, im = 0;
    for (let n = 0; n < N; n++) { const a = -TAU * k * n / N; re += u[n] * Math.cos(a); im += u[n] * Math.sin(a); }
    return Math.hypot(re, im) / N;
  });
}
const fmtCount = v => Math.round(v).toLocaleString('en-US');
function slideDiscrete(widget, side) {
  let inp = 'default', M = 8;
  const take = takeSlot(String.raw`$N$ samples give $N$ frequency sizes; the FFT finds them in about $N\log_2 N$ steps, not $N^2$.`);
  const user = fn => (...args) => { take.reveal(); fn(...args); };
  const rowI = chipRow('input $u$', [['default', 'default'], ['tone', String.raw`one tone, $k=2$`]], inp,
    user(id => { inp = id; update(); }), 'input');
  const rowN = chipRow('operations for $N$', [[8, '8'], [1024, '1024'], [10000, '10000']], M,
    user(id => { M = id; update(); }), 'size');
  const legB = legend([
    { color: 'var(--pal-accent)', chip: true, text: String.raw`blue bars: $k=0$ to $4$` },
    { color: 'var(--pal-guide)', chip: true, text: String.raw`grey bars: $k=5$ to $7$, equal to $|U_{8-k}|$` }]);
  const rN2 = readout('n2', String.raw`direct sum: $N^2$ steps`);
  const rNl = readout('nlogn', String.raw`FFT: $N\log_2 N$ steps`);
  const rRatio = readout('ratio', String.raw`ratio $N/\log_2 N$`);
  widget.append(rowI.el, legB);
  const plot = fillBox(widget, drawBars);
  widget.append(rowN.el, hh('div', 'readouts', rN2.el, rNl.el, rRatio.el));
  side.append(
    sym(String.raw`$U_k$: a complex number for $f=k/N$; $|U_k|$: its size. The $N$ samples are one period. Example: $|U_0|=1.75$, the mean of $u$.`),
    setTex(h('div', 'formula'), String.raw`$$U_k=\frac{1}{N}\sum_{n=0}^{N-1}u_n\,e^{-i2\pi kn/N}$$`),
    triesList([
      String.raw`Pick one tone: bars at $k=2$ and $6$, both $0.5$. A cosine is two opposite arrows (Primer · Complex numbers, step 6); $\tfrac68$ is the alias of $-\tfrac28$ (Primer · Sampling, step 5).`,
      String.raw`Pick default: bars $k=5,6,7$ copy $k=3,2,1$.`,
      String.raw`Set $N$ to $10000$: direct sums need $10^8$ steps, the FFT about $1.3\times10^5$.`]),
    take.el);
  function drawBars(svg, Wd, H) {
    const L = 44, R = 14, Tp = 12, B = 26, base = H - B, pw = Wd - L - R, YMAX = 2;
    const Y = v => base - v / YMAX * (base - Tp);
    const mags = dftMag(DFT_IN[inp]);
    const slot = pw / N;
    svgNode('line', { x1: L, x2: Wd - R, y1: base, y2: base, stroke: COL.grey }, svg);
    [0, 1, 2].forEach(v => svgText(svg, L - 6, Y(v) + 5, String(v), { 'text-anchor': 'end', 'font-size': 14 }));
    for (let k = 0; k < N; k++) {
      const v = mags[k], x = L + k * slot + slot * 0.2, w = slot * 0.6;
      svgNode('rect', { x: x, y: Y(v), width: w, height: base - Y(v), fill: k > N / 2 ? COL.guide : COL.accent,
        'data-item': 'mark', 'data-id': 'ck-' + k }, svg);
      svgText(svg, x + w / 2, Y(v) - 5, num(v), { 'text-anchor': 'middle', 'font-size': 14, fill: COL.fg });
      svgText(svg, x + w / 2, base + 17, String(k), { 'text-anchor': 'middle', 'font-size': 14 });
    }
    svgTex(svg, Wd - R - 4, base + 17, '$k$', { w: 30, size: 15, anchor: 'end' });
    svgTex(svg, L + 6, Tp + 4, String.raw`$|U_k|$ of the 8 samples`, { anchor: 'start', w: 200, size: 15, fill: COL.text2 });
  }
  function update() {
    rowI.set(inp);
    rowN.set(M);
    rN2.set(fmtCount(M * M));
    rNl.set(fmtCount(M * Math.log2(M)));
    rRatio.set((M / Math.log2(M)).toFixed(1));
    plot.redraw();
  }
  update();
}

// ---------- proof slides: shared parts ----------
// Amber marks what the newest proof line is about, in the picture.
const litSet = s => new Set(String(s || '').split(' ').filter(Boolean));
function glowBox(svg, x, y, w, ht, pad) {
  pad = pad == null ? 4 : pad;
  return svgNode('rect', { x: (x - pad).toFixed(1), y: (y - pad).toFixed(1), width: Math.max(0, w + 2 * pad).toFixed(1),
    height: Math.max(0, ht + 2 * pad).toFixed(1), rx: 6, fill: COL.amberBg, stroke: COL.amber, 'stroke-width': 1.2 }, svg);
}
function glowPath(svg, d, wdt) {
  return svgNode('path', { d: d, fill: 'none', stroke: COL.amberBg, 'stroke-width': wdt || 10, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, svg);
}
function glowDot(svg, x, y, r) {
  return svgNode('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: r || 9, fill: COL.amberBg, stroke: COL.amber, 'stroke-width': 1.2 }, svg);
}
const polyD = pts => pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
// An arrow from (x1, y1) to (x2, y2) with a small head.
function arrow(svg, x1, y1, x2, y2, col, w, id) {
  const g = svgNode('g', id ? { 'data-item': 'mark', 'data-id': id } : {}, svg);
  const len = Math.hypot(x2 - x1, y2 - y1);
  if (len < 0.5) return g;
  const ux = (x2 - x1) / len, uy = (y2 - y1) / len, s = Math.min(9, len * 0.45);
  svgNode('line', { x1: x1.toFixed(1), y1: y1.toFixed(1), x2: (x2 - ux * s * 0.6).toFixed(1), y2: (y2 - uy * s * 0.6).toFixed(1),
    stroke: col, 'stroke-width': w || 2 }, g);
  const bx = x2 - ux * s, by = y2 - uy * s;
  svgNode('polygon', { points: [x2, y2, bx - uy * s * 0.45, by + ux * s * 0.45, bx + uy * s * 0.45, by - ux * s * 0.45]
    .map(v => v.toFixed(1)).join(' '), fill: col }, g);
  return g;
}
// The title row of a proof picture: what amber shows while a line is lit, otherwise what the picture is.
function picCaption(svg, W, litText, plain) {
  if (litText) svgTex(svg, W / 2, 12, litText, { w: W - 8, size: 15, fill: COL.amberInk, bg: COL.amberBg });
  else svgTex(svg, 4, 12, plain, { w: W - 8, anchor: 'start', size: 15, fill: COL.muted });
}
function nameLine(html) { const p = h('p', 'sym name'); p.innerHTML = html; return tex(p); }
// Left column of a proof slide: controls, the picture, legend, readouts, the test, the mental model.
function proofLeft(widget, o) {
  for (const c of o.controls || []) widget.append(c);
  const plot = fillBox(widget, o.draw);
  widget.append(legend(o.legend));
  if (o.readouts && o.readouts.length) widget.append(hh('div', 'readouts', ...o.readouts.map(r => r.el)));
  const test = hh('div', 'test', h('p', 'part', 'Test it'), triesList(o.tests));
  const model = h('p', 'model');
  model.append(h('span', 'part', 'The picture: '), tex(h('span', '', o.model)));
  widget.append(test, model);
  plot.test = test;
  return plot;
}
// Right column: the proof. Each revealed line lights its part of the picture; once the proof is
// done, the look-back questions take the place of the test under the picture.
function proofRight(side, spec, plot, onLight, hint) {
  const el = document.createElement('fl-proof-steps');
  el.onEvent = d => emit('view.action', d);
  el.onHighlight = key => onLight(key);
  el.lookBackHost = plot.test;
  el.lookBackHint = hint || 'Look back: under the picture.';
  el.data = spec;
  side.append(el);
  return el;
}

// ---------- step 3: why different waves are perpendicular (proof) ----------
const cosSamples = j => SAMPLES.map(n => Math.cos(TAU * j * n / N));
const sumC = j => cosSamples(j).reduce((s, v) => s + v, 0);
const cosLab = j => j < 0 ? String.raw`\cos(${j})` : String.raw`\cos ${j}`;
function drawWhyOrth(svg, W, H, k, m, lit) {
  const L = litSet(lit), T = 30, B = 22, jm = k - m, jp = k + m;
  const cap = L.has('product') ? String.raw`amber: the product, sample by sample; it adds to $\cos ${k}\cdot\cos ${m}$`
    : L.has('split') ? String.raw`amber: the two half waves, at $k-m=${jm}$ and $k+m=${jp}$`
    : L.has('arrows') ? String.raw`amber: the arrows $z^n$; the samples are their shadows`
    : L.has('chain') ? String.raw`amber: the 8 arrows $z^n$ laid head to tail`
    : L.has('zero') ? String.raw`amber: the sums; both are $0$ when $k\ne m$` : '';
  picCaption(svg, W, cap, String.raw`left: stems over $n=0,\dots,7$; right: the arrows of each half wave`);
  const SW = Math.round(W * 0.54), LL = 100, RR = 62, pw = SW - LL - RR, rowH = (H - T - B) / 3;
  const X = n => LL + (n + 0.5) * pw / N, A = rowH / 2 - 7;
  const prod = SAMPLES.map(n => Math.cos(TAU * k * n / N) * Math.cos(TAU * m * n / N));
  const rows = [
    { lab: String.raw`$\cos ${k}\,\cos ${m}$`, col: COL.accent, v: prod, key: 'product', id: 'prod' },
    { lab: String.raw`$\tfrac12${cosLab(jm)}$`, col: COL.greyBlue, v: cosSamples(jm).map(x => x / 2), key: 'split', id: 'half-minus' },
    { lab: String.raw`$\tfrac12${cosLab(jp)}$`, col: COL.fg, v: cosSamples(jp).map(x => x / 2), key: 'split', id: 'half-plus' }];
  rows.forEach((r, i) => {
    const y0 = T + i * rowH, zy = y0 + rowH / 2;
    if (L.has(r.key)) glowBox(svg, 2, y0 + 2, SW - RR - 2, rowH - 4, 0);
    svgNode('line', { x1: LL - 6, x2: SW - RR + 4, y1: zy, y2: zy, stroke: COL.line }, svg);
    svgTex(svg, 4, zy, r.lab, { anchor: 'start', w: LL - 8, size: 15 });
    r.v.forEach((v, n) => {
      const x = X(n), y = zy - A * v;
      svgNode('line', { x1: x, x2: x, y1: zy, y2: y, stroke: r.col, 'stroke-width': 2 }, svg);
      svgNode('circle', { cx: x, cy: y, r: 3.5, fill: r.col, 'data-item': 'mark', 'data-id': r.id + '-' + n }, svg);
    });
    const s = r.v.reduce((a, b) => a + b, 0);
    if (L.has('zero')) glowBox(svg, SW - RR + 10, zy - 11, RR - 14, 22, 1);
    svgTex(svg, SW - 4, zy, '$\\Sigma=' + num(s) + '$', { anchor: 'end', w: RR - 6, size: 15, fill: COL.ink });
  });
  SAMPLES.forEach(n => svgText(svg, X(n), H - 6, String(n), { 'text-anchor': 'middle', 'font-size': 14 }));
  svgTex(svg, LL - 12, H - 10, '$n$', { anchor: 'end', w: 30, size: 15 });
  // Right: the arrows z^n of each half wave, from the centre (light) and head to tail (dark).
  // Two figures, side by side when the space is wide, else one above the other.
  const x0 = SW + 8, RW = W - x0 - 2, RH = H - T, wide = RW > RH * 0.9;
  const FW = wide ? RW / 2 : RW, FH = wide ? RH : RH / 2;
  [[jm, COL.greyBlue, 'minus'], [jp, COL.fg, 'plus']].forEach(([j, col, id], i) => {
    const fx = x0 + (wide ? i * FW : 0), top = T + (wide ? 0 : i * FH);
    svgTex(svg, fx + FW / 2, top + 9, String.raw`$C_{${j}}=${num(sumC(j))}$`, { w: FW, size: 15, fill: col === COL.fg ? COL.ink : COL.slate2 });
    const cx = fx + FW / 2, cy = top + 20 + (FH - 22) / 2;
    if (((j % N) + N) % N === 0) {   // all 8 arrows point one way: the chain runs straight to 8
      const s = (FW - 16) / N;
      if (L.has('arrows') || L.has('chain')) glowPath(svg, 'M' + (fx + 8) + ' ' + cy + ' L' + (fx + 8 + N * s) + ' ' + cy, 12);
      for (let n = 0; n < N; n++) arrow(svg, fx + 8 + n * s, cy, fx + 8 + (n + 1) * s, cy, col, 2, 'arrow-' + id + '-' + n);
      if (L.has('zero')) glowDot(svg, fx + 8 + N * s, cy, 8);

      { tex: String.raw`U_{N-k}=\tfrac1N\textstyle\sum_n u_n\,\overline{e^{-i2\pi kn/N}}=\overline{U_k}`, move: 'Use symmetry',
        why: String.raw`each arrow mirrors one of $U_k$; a real $u_n$ only stretches it`,
        choices: ['Compute it two ways', 'Contradiction'], highlight: 'mirror' },
      { tex: String.raw`|U_{N-k}|=\sqrt{a^2+(-b)^2}=\sqrt{a^2+b^2}=|U_k|`, move: 'Unfold the definition',
        why: String.raw`with $U_k=a+bi$: a mirror image has the same length`, choices: ['Compare or bound', 'Take a limit'], highlight: 'ends' }],
    lookBack: [
      { q: String.raw`Where does the tone's $0.5$ at $k=2$ and $k=6$ come from?`,
        a: String.raw`$\cos\frac{2\pi2n}{8}=\tfrac12e^{i2\pi2n/8}+\tfrac12e^{-i2\pi2n/8}$, two half arrows (Primer · Complex numbers, step 6), and line 2 turns $e^{-i2\pi2n/8}$ into $e^{i2\pi6n/8}$. The wave's height 1 splits into $U_2=U_6=\tfrac12$.` },
      { q: String.raw`What about $k=0$ and $k=N/2$?`,
        a: String.raw`Each is its own mirror image, so $U_0$ and $U_4$ are real. For the default input, $U_0=1.75$, the mean, and $U_4=\tfrac18\sum_n(-1)^nu_n=0.25$.` }] },
    plot, key => { lit = key || ''; plot.redraw(); });
  function update() {
    rowI.set(inp); sl.show();
    plot.redraw();
  }
  update();
}

// ---------- step 12: why the FFT takes N log2 N steps (proof) ----------
function fftRows(n) {   // each row splits every box into its even and odd positions
  const rows = [[Array.from({ length: n }, (_, i) => i)]];
  while (rows[rows.length - 1][0].length > 1)
    rows.push(rows[rows.length - 1].flatMap(b => [b.filter((_, i) => i % 2 === 0), b.filter((_, i) => i % 2 === 1)]));
  return rows;
}
function drawWhyFFT(svg, W, H, n, lit) {
  const L = litSet(lit), T = 30, rows = fftRows(n), lev = rows.length - 1, RR = 150;
  const cap = L.has('split') ? String.raw`amber: the sum over all samples, split into even and odd $n$`
    : L.has('halves') ? String.raw`amber: two sums of the same kind, each over ${n / 2} samples`
    : L.has('share') ? String.raw`amber: outputs $k$ and $k+${n / 2}$ use the same $E_k$ and $O_k$`
    : L.has('join') ? String.raw`amber: joining the two halves: one step per output, $${n}$ in all`
    : L.has('levels') ? String.raw`amber: $${lev}$ rows to join, $${n}$ steps each: $${lev}\times${n}=${lev * n}$` : '';
  picCaption(svg, W, cap, String.raw`the samples split into even and odd, again and again; right: the cost`);
  const x0 = 6, TW = W - RR - x0, rowH = (H - T - 2) / (lev + 2), bh = Math.min(28, rowH - 8);
  const rowY = r => T + 2 + (r + 1) * rowH + (rowH - bh) / 2;   // r = -1 is the outputs strip
  // Outputs strip: the N values N U_k.
  const sy = rowY(-1), cw = TW / n;
  if (L.has('share')) { glowBox(svg, x0, sy, TW / 2 - 4, bh, 3); glowBox(svg, x0 + TW / 2 + 4, sy, TW / 2 - 4, bh, 3); }
  for (let q = 0; q < n; q++) {
    svgNode('rect', { x: x0 + q * cw + 1, y: sy, width: cw - 2, height: bh, rx: 3, fill: q < n / 2 ? COL.accentSoft : COL.softHover, stroke: COL.guide, 'data-item': 'mark', 'data-id': 'out-' + q }, svg);
    svgText(svg, x0 + (q + 0.5) * cw, sy + bh / 2 + 5, String(q), { 'text-anchor': 'middle', 'font-size': 13, fill: COL.text2 });
  }
  svgTex(svg, W - 2, sy + bh / 2, String.raw`outputs $NU_k$`, { anchor: 'end', w: RR - 8, size: 14 });
  // The tree of splits.
  rows.forEach((boxes, r) => {
    const y = rowY(r), slot = TW / boxes.length;
    boxes.forEach((b, i) => {
      const bx = x0 + i * slot + 2, bwid = slot - 4;
      if (r > 0) {
        const py = rowY(r - 1) + bh, px = x0 + (Math.floor(i / 2) + 0.5) * (TW / rows[r - 1].length);
        svgNode('line', { x1: px, y1: py, x2: bx + bwid / 2, y2: y, stroke: COL.guide }, svg);
      }
      if ((L.has('split') && r === 0) || (L.has('halves') && r === 1)) glowBox(svg, bx, y, bwid, bh, 3);
      const fill = r === 1 ? (i === 0 ? COL.accentTint : COL.soft) : COL.panel;
      svgNode('rect', { x: bx, y: y, width: bwid, height: bh, rx: 4, fill: fill, stroke: COL.grey, 'data-item': 'mark', 'data-id': 'box-' + r + '-' + i }, svg);
      const txt = b.join(' ');
      if (r === 1) svgTex(svg, bx + bwid / 2, y + bh / 2, (i === 0 ? '$E$: ' : '$O$: ') + txt, { w: bwid, size: 13, fill: COL.fg });
      else svgText(svg, bx + bwid / 2, y + bh / 2 + 5, txt, { 'text-anchor': 'middle', 'font-size': 13, fill: COL.fg });
    });
    if (r > 0) {   // joining row r back into row r-1 costs one step per output
      const ly = (rowY(r - 1) + bh + rowY(r)) / 2;
      if (L.has('levels') || (L.has('join') && r === 1)) glowBox(svg, W - RR + 10, ly - 10, RR - 14, 20, 1);
      svgText(svg, W - 6, ly + 5, 'join: ' + n + ' steps', { 'text-anchor': 'end', 'font-size': 14, fill: COL.ink });
    }
  });
}
function slideWhyFFT(widget, side) {
  let n = 8, lit = '';
  const rowN = chipRow('samples $N$', [[4, '4'], [8, '8'], [16, '16']], n, id => { n = id; update(); }, 'fft-n');
  const rD = readout('direct', String.raw`direct sums: $N^2$`);
  const rF = readout('fft', String.raw`FFT: $N\log_2N$`);
  const rR = readout('ratio', String.raw`ratio $N/\log_2N$`);
  const plot = proofLeft(widget, {
    controls: [rowN.el],
    draw: (svg, W, Hh) => drawWhyFFT(svg, W, Hh, n, lit),
    legend: [
      { color: 'var(--pal-accent-tint)', chip: true, text: String.raw`$E$: the even samples` },
      { color: 'var(--pal-soft)', chip: true, text: String.raw`$O$: the odd samples` },
      { color: 'var(--pal-guide)', text: 'lines: each box splits in two' }],
    readouts: [rD, rF, rR],
    tests: [
      String.raw`Pick $N=8$: the samples split 3 times, down to single samples. Joining each row back costs 8 steps. Guess the total for $N=16$, then pick it.`,
      String.raw`At $N=16$, compare the readouts: $64$ against $256$. Cases are evidence, not proof.`],
    model: String.raw`Split the samples into even and odd, then split each half again, until single samples are left: $\log_2N$ rows. Joining one row back costs one multiply-add per output, $N$ in all.` });
  proofRight(side, {
    id: 'fft-count',
    goal: { tex: String.raw`T(N)=N\log_2N`, words: String.raw`for $N$ a power of 2; direct sums take $N^2$.` },
    facts: [
      { tex: String.raw`NU_k=\textstyle\sum_nu_n\,w^{nk}`, words: String.raw`with $w=e^{-i2\pi/N}$`, ref: 'step 10' },
      { words: String.raw`$\log_2N$ halvings take $N$ to 1`, ref: 'Primer · Logarithms, step 1' }],
    lines: [
      { tex: String.raw`NU_k=\textstyle\sum_mu_{2m}w^{2mk}+\sum_mu_{2m+1}w^{(2m+1)k}`, move: 'Rearrange',
        why: String.raw`split into even samples $n=2m$ and odd samples $n=2m+1$`, choices: ['Telescope', 'Use symmetry'], highlight: 'split' },
      { tex: String.raw`NU_k=E_k+w^k\,O_k`, move: 'Name a piece',
        why: String.raw`$E_k=\sum_mu_{2m}(w^2)^{mk}$, the same sum for $\frac N2$ samples, as $w^2=e^{-i2\pi/(N/2)}$; $O_k$ alike`,
        choices: ['Change variables', 'Unfold the definition'], highlight: 'halves' },
      { tex: String.raw`E_{k+N/2}=E_k,\ \ O_{k+N/2}=O_k`, move: 'Use an earlier result',
        why: String.raw`the extra factor is $(w^2)^{mN/2}=1$, whole turns (Complex numbers, step 5): $\frac N2$ values serve all $N$ outputs`, choices: ['Use symmetry', 'Add zero or multiply by one'], highlight: 'share' },
      { tex: String.raw`T(N)=2\,T(\tfrac N2)+N,\ \ T(1)=0`, move: 'Name a piece',
        why: String.raw`$T(N)$: steps (a multiply and an add) for $N$ samples: two halves, then one per output`,
        choices: ['Compute it two ways', 'Rearrange'], highlight: 'join' },
      { tex: String.raw`T(N)=N\log_2N`, move: 'Induction',
        why: String.raw`true at $N=1$; if true at $\frac N2$, $T(N)=N(\log_2N-1)+N$`, choices: ['Telescope', 'Take a limit'], highlight: 'levels' }],
    lookBack: [
      { q: String.raw`Where are the $N\log_2N$ steps in the picture?`,
        a: String.raw`$\log_2N$ rows of splitting, and $N$ steps to join each row back. $N=8$: 3 rows of 8, 24 steps against 64. $N=1024$: about 100 times fewer than $N^2$.` },
      { q: String.raw`What if $N$ is not a power of 2?`,
        a: String.raw`Line 1 needs an even count at every level. Splitting into 3 or 5 parts works the same way, with a few more steps per row, so any $N$ made of small factors stays fast: $10000=2^4\cdot5^4$.` }] },
    plot, key => { lit = key || ''; plot.redraw(); });
  side.querySelector('fl-proof-steps').primerMoves = PRIMER_MOVES;
  side.querySelector('fl-proof-steps').endNote = NEXT;
  function update() {
    rowN.set(n);
    rD.set(fmtCount(n * n)); rF.set(fmtCount(n * Math.log2(n))); rR.set(String(+(n / Math.log2(n)).toFixed(1)));
    plot.redraw();
  }
  update();
}
// The view's close. The primer's last proof lists every move the primer's proofs used, in order of first
// use, once it is proved, so the list never gives a pick away; the last step names what comes next.
const PRIMER_MOVES = ['Unfold the definition', 'Use an earlier result', 'Name a piece', 'Compare or bound', 'Rearrange', 'Use symmetry', 'Compute it two ways', 'Induction'];
const NEXT = 'Next: Primer · Signals: filters.';

// ---------- frame ----------
const SLIDES = [
  { id: 'shape', title: 'A few waves add up to a shape',
    tag: 'Used in L14 07:23, 37:36–38:38 · L7 14:33',
    question: 'What is a Fourier series, and why build a shape from waves?', mount: slideShape },
  { id: 'orthogonal', title: 'Waves at different frequencies are perpendicular',
    tag: 'Used in L14 39:11 · L16 07:21–08:59',
    question: 'Why can each frequency be measured on its own?', mount: slideOrth },
  { id: 'why-orthogonal', proof: true, title: String.raw`Why it's true: $\cos k\cdot\cos m=0$`,
    tag: 'Used in L14 39:11 · L16 07:21–08:59',
    question: String.raw`Why do different waves give dot product $0$?`, mount: slideWhyOrth },
  { id: 'projection', title: 'A coefficient is a projection',

  { id: 'why-projection', proof: true, title: String.raw`Why it's true: $a_k=\frac{u\cdot\cos k}{\cos k\cdot\cos k}$`,
    tag: 'Used in L14 40:13 · L16 01:06, 08:27',
    question: 'Why does one dot product find one weight?', mount: slideWhyProj },
  { id: 'least-squares', title: 'Least squares: a cut-off series is the best fit',

  { id: 'why-best-fit', proof: true, title: "Why it's true: a cut-off series is the best fit",
    tag: 'Used in L14 41:15 · L15 13:55',
    question: 'Why do the coefficients stay put as waves are added?', mount: slideWhyFit },
  { id: 'smoothness', title: 'Smoother functions need fewer terms',
    tag: 'Used in L15 15:25–18:37, 31:45 · L23 28:24',

  { id: 'why-decay', proof: true, title: String.raw`Why it's true: a jump gives $\frac{1}{k}$, a kink $\frac{1}{k^2}$`,
    tag: 'Used in L15 15:25–18:37, 31:45 · L23 28:24',
    question: String.raw`Where does the $\frac{1}{k}$ come from, and why $\frac{1}{k^2}$ for a kink?`, mount: slideWhyDecay },
  { id: 'discrete', title: 'N samples give N frequency sizes',

  { id: 'why-mirror', proof: true, title: String.raw`Why it's true: $|U_{N-k}|=|U_k|$`,
    tag: 'Used in L16 08:27 · L16 17:55',
    question: String.raw`Why do the bars past $k=N/2$ copy the first half?`, mount: slideWhyMirror },
  { id: 'why-fft', proof: true, title: String.raw`Why it's true: the FFT takes $N\log_2N$ steps`,
    tag: 'Used in L16 09:30 · L16 14:16–14:47',
    question: 'Why does halving again and again save work?', mount: slideWhyFFT },
];

let cur = 0, shownId = null, endSent = false;
function goTo(i) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  if (shownId !== null && shownId !== s.id) emit('view.step', { step: s.id });
  shownId = s.id;
  const stage = $('#stage');
  stage.innerHTML = '';
  const widget = h('div', 'widget');
  const side = hh('div', 'side',
    h('div', 'tag', s.tag),
    setTex(h('h2'), s.title),
    setTex(h('p', 'question'), s.question));
  const sec = mark(h('section', 'slide' + (s.proof ? ' proof-slide' : '')), 'step', s.id, s.title.replace(/\$/g, ''));
  sec.append(widget, side);
  stage.append(sec);
  stage.scrollTop = 0;
  PLOTS = [];
  s.mount(widget, side);
  if (cur === SLIDES.length - 1 && !endSent) { endSent = true; emit('view.action', { action: 'deck-end' }); }
  tex(sec);
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, i) => d.classList.toggle('on', i === cur));
}
// A cue is a state: go to the named step, and do nothing if it is already shown.
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i >= 0 && i !== cur) goTo(i);
}
(function init() {
  const dots = $('#dots');
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = s.title.replace(/\$/g, '');
    b.addEventListener('click', () => goTo(i));
    dots.appendChild(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],textarea,select')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
})();

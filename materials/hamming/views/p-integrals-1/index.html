<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primer · Integrals: accumulated area</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../../components/theme.js"></script>
<style>
/* Colors: white page, blue for the area and the accent, orange for the second strip, grey for the curve. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft); --orange:var(--pal-orange);
  --u:clamp(16px,1.35vw,20px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 24px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(6px,1vh,12px) 24px}
footer{display:flex;align-items:center;gap:10px;padding:8px 24px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Slide frame: widget on the left (3/5), text on the right (2/5). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(18px,2.4vw,40px)}
.widget{min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(4px,0.8vh,8px);overflow:hidden}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(6px,1.1vh,12px);overflow:hidden}
.tag{font:13px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(20px,1.9vw,28px);line-height:1.2;margin:0;font-weight:650}
.question{margin:0;font-size:clamp(16px,1.3vw,18px);font-weight:600}
.formula{font-size:clamp(18px,1.6vw,22px)}
.sym{margin:0;font-size:16px;color:var(--muted)}
.tries{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:4px;font-size:16px}
.tries li::marker{color:var(--accent);font-weight:600}
.takeaway{margin:0;padding:8px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}
.closing{margin:0;font-size:17px;font-weight:600}
.next{margin:0;font-size:16px;color:var(--muted)}

/* Controls and readouts */
.sliders{display:flex;gap:8px 24px;flex-wrap:wrap;width:100%}
.slide-ctl{display:flex;align-items:center;gap:8px;font-size:16px}
.slide-ctl input{width:clamp(120px,11vw,170px);vertical-align:middle;accent-color:var(--accent)}
.slide-ctl .val{min-width:70px}
.btn{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--pal-panel);border-radius:8px;cursor:pointer;font-size:16px}
.btn.on{background:var(--chip);border-color:var(--accent);color:var(--pal-accent-deep)}
.btn:disabled{color:var(--muted);cursor:default}
.readouts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.readout{flex:1 1 150px;min-width:0;padding:4px 8px;border-radius:10px;background:var(--pal-soft);font-size:15px;overflow-wrap:anywhere}
.readout .k{color:var(--muted);font-size:14px}
.readout .val{font-size:16px;font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:20px;height:0;vertical-align:middle;margin-right:6px}
.chip{display:inline-block;width:18px;height:12px;vertical-align:middle;margin-right:6px;border-radius:2px}

/* The plot fills the space left in the widget column */
.fill{flex:1 1 0;min-height:100px;position:relative;width:100%}
.fill>svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* Proof slides: test and picture on the left, the proof (fl-proof-steps) on the right */
.slide.proof-slide{grid-template-columns:minmax(0,11fr) minmax(0,9fr)}
.slide.proof-slide .side{justify-content:flex-start}
.slide.proof-slide .fill{min-height:100px}
.slide.proof-slide .slide-ctl input{width:clamp(90px,8vw,130px)}
.slide.proof-slide .slide-ctl .val{min-width:40px}
.slide.proof-slide .sliders{gap:6px 18px}
.slide.proof-slide .legend{gap:4px 12px}
.part{margin:0;font-weight:600;color:var(--muted)}
.test{display:flex;flex-direction:column;gap:3px}
.test .tries{gap:3px}
.model{margin:0;padding:8px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}
.name i{font-style:italic}

/* Short windows (1100x620 and similar): tighter spacing, text stays 16px */
@media (max-height: 680px){
  header{padding-top:4px}
  #stage{padding:4px 24px}
  footer{padding:4px 24px}
  .widget{gap:4px}
  .side{gap:4px}
  .tries{gap:2px}
  .sym,.tries{line-height:1.2}
  .readout{padding:3px 8px}
  .takeaway{padding:6px 10px}
  .formula{font-size:18px}
  h2{font-size:20px}
}
</style>
</head>
<body>
<header>Primer · Integrals: accumulated area</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script src="../../components/proof-steps.js"></script>
<script>
// ---------- helpers ----------
const $ = s => document.querySelector(s);

// ---------- palette and redraw ----------
// COL holds the palette colors for the SVG being drawn: a plot re-reads it at every paint, and the slide
// re-reads it when it is shown. A theme switch redraws the plots and keeps every control's state.
let COL = {};
const PAL_NAMES = ['accent', 'amber', 'amber-bg', 'amber-deep', 'blue-deep', 'blue-pale', 'blue-strong', 'grey', 'ink', 'line', 'muted', 'orange', 'orange-deep', 'orange-soft', 'panel', 'text-2'];
function readPalette() {
  const o = {};
  for (const n of PAL_NAMES) o[n.replace(/-(\w)/g, (_, c) => c.toUpperCase())] = FluidTheme.color(n);
  return o;
}
let PLOTS = [];   // the plots on the current slide
window.addEventListener('fluid-themechange', () => { COL = readPalette(); PLOTS.forEach(p => p.redraw()); });
const NSV = 'http://www.w3.org/2000/svg', NHT = 'http://www.w3.org/1999/xhtml';
const PI = Math.PI;
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false } ], throwOnError: false };
// Render $...$ and $$...$$ in a node. If the CDN did not load, the text stays as typed.
function tex(node) {
  if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH);
  return node;
}
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function hh(tag, cls, ...kids) {
  const e = h(tag, cls);
  for (const k of kids) if (k) e.append(k);
  return e;
}
function mark(e, kind, id, title) {
  e.dataset.item = kind;
  if (id != null) e.dataset.id = id;
  if (title != null) e.dataset.title = title;
  return e;
}
function svgNode(tag, attrs, parent) {
  const e = document.createElementNS(NSV, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function svgText(parent, x, y, s, attrs) {
  const t = svgNode('text', Object.assign({ x: x, y: y, fill: COL.muted, 'font-size': 14 }, attrs || {}), parent);
  t.textContent = s;
  return t;
}
// A KaTeX label over an SVG: a foreignObject holding a rendered formula.
function svgTex(parent, x, y, s, o) {
  o = o || {};
  const w = o.w || 220, ht = 26, anchor = o.anchor || 'middle';
  const x0 = anchor === 'end' ? x - w : anchor === 'start' ? x : x - w / 2;
  const fo = svgNode('foreignObject', { x: x0, y: y - ht / 2, width: w, height: ht }, parent);
  const d = document.createElementNS(NHT, 'div');
  const jc = anchor === 'end' ? 'flex-end' : anchor === 'start' ? 'flex-start' : 'center';
  d.setAttribute('style', 'display:flex;align-items:center;height:100%;white-space:nowrap;font-size:' +
    (o.size || 15) + 'px;color:' + (o.fill || COL.text2) + ';justify-content:' + jc);
  const span = document.createElementNS(NHT, 'span');
  span.textContent = s;
  if (o.bg) span.setAttribute('style', 'background:' + o.bg + ';border-radius:5px;padding:1px 5px');
  d.appendChild(span);
  fo.appendChild(d);
  tex(span);
  return fo;
}
// Tick label: LaTeX if it has $, plain text otherwise.
function tickLabel(svg, x, y, s, anchor) {
  return s.indexOf('$') >= 0 ? svgTex(svg, x, y, s, { w: 90, size: 14, anchor: anchor }) :
    svgText(svg, x, y + 5, s, { 'text-anchor': anchor, 'font-size': 14 });
}
function path(svg, pts, attrs, close) {
  const d = 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L') + (close ? 'Z' : '');
  return svgNode('path', Object.assign({ d: d, fill: 'none' }, attrs), svg);
}
function dot(svg, x, y, color) {
  return svgNode('circle', { cx: x, cy: y, r: 5, fill: color, stroke: COL.panel, 'stroke-width': 1.5 }, svg);
}
// Plot frame: linear scales from data ranges to the box, with room for labels (m overrides the margins).
function frame(W, H, o, m) {
  const M = Object.assign({ l: 70, r: 20, t: 14, b: 58 }, m || {});
  const X = v => M.l + (v - o.x0) * (W - M.l - M.r) / (o.x1 - o.x0);
  const Y = v => H - M.b - (v - o.y0) * (H - M.t - M.b) / (o.y1 - o.y0);
  return { X: X, Y: Y };
}
// Axes with tick pairs [value, label] and LaTeX axis labels.
function axes(svg, f, o) {
  const left = f.X(o.x0), base = f.Y(o.y0), right = f.X(o.x1), top = f.Y(o.y1);
  path(svg, [[left, top], [left, base], [right, base]], { stroke: COL.grey, 'stroke-width': 1 });
  for (const [v, s] of o.xt) {
    svgNode('line', { x1: f.X(v), x2: f.X(v), y1: base, y2: base + 4, stroke: COL.grey }, svg);
    tickLabel(svg, f.X(v), base + 18, s, 'middle');
  }
  for (const [v, s] of o.yt) {
    svgNode('line', { x1: left - 4, x2: left, y1: f.Y(v), y2: f.Y(v), stroke: COL.grey }, svg);
    tickLabel(svg, left - 8, f.Y(v), s, 'end');
  }
  svgTex(svg, (left + right) / 2, f.Y(o.y0) + 42, o.xlabel, { w: 420, size: 15 });
  const mid = (top + base) / 2;
  const fo = svgTex(svg, 16, mid, o.ylabel, { w: 320, size: 15 });
  fo.setAttribute('transform', 'rotate(-90 16 ' + mid + ')');
}
// Draw into a box that fills its column; redraws when the box changes size.
function fillPlot(box, draw) {
  const go = () => {
    box.textContent = '';
    const W = Math.max(200, box.clientWidth), H = Math.max(160, box.clientHeight);
    const svg = svgNode('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'font-family': 'system-ui, sans-serif' });
    box.append(svg);
    COL = readPalette();
    draw(svg, W, H);
  };
  PLOTS.push({ redraw: go });
  go();
  if (window.ResizeObserver) new ResizeObserver(go).observe(box);
  return go;
}
// A labelled range input. label is LaTeX-ready text; fmt returns the value text (LaTeX-ready).
function slider(label, o) {
  const wrap = h('label', 'slide-ctl');
  const lab = tex(h('span', '', label));
  const val = h('span', 'val');
  const inp = h('input');
  inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step; inp.value = o.value;
  mark(inp, 'control', o.id, o.id);
  wrap.append(lab, inp, val);
  const fmt = o.fmt || String;
  const api = { el: wrap, input: inp, show() { setTex(val, fmt(+inp.value)); } };
  inp.addEventListener('input', () => { api.show(); o.onInput(+inp.value); });
  api.show();
  return api;
}
// A readout box: label and value are LaTeX-ready text.
function readout(id, label) {
  const box = mark(h('div', 'readout'), 'readout', id);
  const k = h('div', 'k');
  setTex(k, label);
  const v = h('div', 'val');
  box.append(k, v);
  return { el: box, set(text) { setTex(v, text); } };
}
function legend(items) {
  const d = h('div', 'legend');
  for (const it of items) {
    const s = h('span');
    const sw = it.chip ? h('span', 'chip') : h('span', 'sw');
    if (it.chip) sw.style.background = it.color;
    else sw.style.borderTop = '2px ' + (it.dash ? 'dashed' : 'solid') + ' ' + it.color;
    const t = h('span');
    setTex(t, it.text);
    s.append(sw, t);
    d.append(s);
  }
  return d;
}
function sym(text) { return setTex(h('p', 'sym'), text); }
function triesList(items) { return hh('ol', 'tries', ...items.map(t => setTex(h('li'), t))); }
function takeLine(text) { return setTex(h('p', 'takeaway'), text); }
// "Names that explain": one line under the symbols; html allows <i> for the word.
function nameLine(html) { const p = h('p', 'sym name'); p.innerHTML = html; return tex(p); }
// Session events. Optional: with no bridge, nothing is sent.
function emit(kind, data) {
  try {
    if (window.fluid && typeof window.fluid.emit === 'function') Promise.resolve(window.fluid.emit(kind, data)).catch(() => {});
  } catch (e) { /* the view works without the bridge */ }
}
// A number with d decimals, without a minus sign on zero.
function fixed(v, d) { return (Math.abs(v) < 0.5 * Math.pow(10, -d) ? 0 : v).toFixed(d); }
// Simpson's rule, for the numeric readouts that test a formula.
function simpson(g, a, b, n) {
  n = n || 400;
  const w = (b - a) / n;
  let s = g(a) + g(b);
  for (let i = 1; i < n; i++) s += g(a + i * w) * (i % 2 ? 4 : 2);
  return s * w / 3;
}

// ---------- proof slides: shared parts ----------
// Amber marks what the newest proof line is about, in the picture and in the proof.
const PM = { t: 32 };   // proof pictures leave a row on top for the caption
function glowPath(svg, pts, wdt) {
  return path(svg, pts, { stroke: COL.amberBg, 'stroke-width': wdt || 12, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
}
function glowFill(svg, pts) {
  return path(svg, pts, { fill: COL.amberBg, 'fill-opacity': .9, stroke: COL.amber, 'stroke-width': 1.5 }, true);
}
// The region between a curve g and the x axis from a to b, in screen points.
function underPts(f, g, a, b, n) {
  n = n || 80;
  const pts = [[f.X(a), f.Y(0)]];
  for (let i = 0; i <= n; i++) { const x = a + (b - a) * i / n; pts.push([f.X(x), f.Y(g(x))]); }
  pts.push([f.X(b), f.Y(0)]);
  return pts;
}
function boxPts(f, x0, x1, y0, y1) {
  return [[f.X(x0), f.Y(y0)], [f.X(x0), f.Y(y1)], [f.X(x1), f.Y(y1)], [f.X(x1), f.Y(y0)]];
}
// While a proof line is lit, a caption in the title row says what the amber part is.
function litCaption(svg, W, text) {
  svgTex(svg, W / 2, 12, text, { w: W - 8, size: 15, fill: COL.ink, bg: COL.amberBg });
}
function plainCaption(svg, W, text) {
  svgTex(svg, W / 2, 12, text, { w: W - 8, size: 14, fill: COL.muted });
}
// Left column of a proof slide: controls, the picture, legend, readouts, the test, the mental model.
function proofLeft(widget, o) {
  if (o.controls && o.controls.length) widget.append(hh('div', 'sliders', ...o.controls));
  const box = h('div', 'fill');
  widget.append(box);
  const redraw = fillPlot(box, o.draw);
  widget.append(legend(o.legend));
  if (o.readouts && o.readouts.length) widget.append(hh('div', 'readouts', ...o.readouts.map(r => r.el)));
  const test = hh('div', 'test', h('p', 'part', 'Test it'), triesList(o.tests));
  const model = h('p', 'model');
  model.append(h('span', 'part', 'The picture: '), tex(h('span', '', o.model)));
  widget.append(test, model);
  return { redraw: redraw, test: test };
}
// Right column: the proof. Each revealed line lights its part of the picture; once the proof is
// done, the look-back questions take the place of the test under the picture.
function proofRight(side, spec, plot, onLight, hint) {
  const el = document.createElement('fl-proof-steps');
  el.onEvent = d => emit('view.action', d);
  el.onHighlight = key => onLight(key);
  el.lookBackHost = plot.test;
  el.lookBackHint = hint || 'Look back: under the picture.';
  el.data = spec;
  side.append(el);
  return el;
}

// ---------- slide 1: what is an integral ----------
function slideTap(widget, side) {
  let T = 4;
  const rate = readout('rate', 'rate at $T$: $r(T)=T$ L/min');
  const tot = readout('total', 'water so far: $V(T)=T^2/2$ L');
  const sl = slider('$T$', { id: 'T', min: 0, max: 6, step: 0.1, value: 4, fmt: v => '$' + v.toFixed(1) + '$ min', onInput: v => { T = v; draw(); } });
  const box = h('div', 'fill');
  const draw = fillPlot(box, (svg, W, H) => {
    const o = { x0: 0, x1: 6, y0: 0, y1: 6.4, xt: [[0, '$0$'], [2, '$2$'], [4, '$4$'], [6, '$6$']],
      yt: [[0, '$0$'], [2, '$2$'], [4, '$4$'], [6, '$6$']], xlabel: '$t$, minutes', ylabel: '$r$, liters per minute' };
    const f = frame(W, H, o);
    axes(svg, f, o);
    path(svg, [[f.X(0), f.Y(0)], [f.X(T), f.Y(0)], [f.X(T), f.Y(T)]], { fill: COL.accent, 'fill-opacity': .25, stroke: 'none' }, true);
    path(svg, [[f.X(0), f.Y(0)], [f.X(6), f.Y(6)]], { stroke: COL.muted, 'stroke-width': 2.5 });
    path(svg, [[f.X(T), f.Y(0)], [f.X(T), f.Y(T)]], { stroke: COL.accent, 'stroke-dasharray': '4 3' });
    dot(svg, f.X(T), f.Y(T), COL.accent);
    svgTex(svg, f.X(T) + 10, f.Y(T) - 16, '$r(T)$', { w: 90, anchor: 'start', fill: COL.accent });
    svgTex(svg, f.X(2 * T / 3), f.Y(T / 3), '$V(T)$', { w: 90, fill: COL.blueDeep });
    rate.set('$' + T.toFixed(1) + '$ L/min');
    tot.set('$' + (T * T / 2).toFixed(2) + '$ L');
  });
  widget.append(
    hh('div', 'sliders', sl.el),
    hh('div', 'readouts', rate.el, tot.el),
    box,
    legend([
      { color: COL.muted, text: 'grey line: $r(t)=t$, the flow rate' },
      { chip: true, color: COL.bluePale, text: 'blue triangle: $V(T)$, the water so far' }]));
  side.append(
    sym('$t$: minutes since the tap opened. $r(t)$: liters per minute at time $t$. Water so far is the area under the rate line.'),
    nameLine('<i>integral</i>: from Latin <i>integer</i>, whole (literally untouched). The integral puts the thin pieces back into one whole.'),
    triesList([
      'Set $T = 2$. The water so far is $2$ L.',
      'Set $T = 6$. The total is $18$ L. A higher rate adds more area per minute.',
      'Drag $T$ to $4$, then read the total: the triangle has area $4\\cdot 4/2=8$ L.']),
    takeLine('An integral adds up a rate over time. The same sum gives Hamming\'s total of all knowledge (L1 12:29).'));
}

// ---------- slide 2: rectangle sums ----------
function slideRect(widget, side) {
  let n = 12, mode = 'left';
  const exact = 4 * Math.log(4) - 3;
  const sl = slider('$n$ pieces', { id: 'n', min: 3, max: 48, step: 1, value: 12, fmt: v => '$' + v + '$', onInput: v => { n = v; draw(); } });
  const bLeft = mark(h('button', 'btn on', 'Left ends'), 'control', 'mode-left');
  const bTrap = mark(h('button', 'btn', 'Trapezoid'), 'control', 'mode-trap');
  const rw = readout('width', 'width $h=3/n$');
  const rs = readout('sum', 'sum of the pieces');
  const rg = readout('gap', 'exact $4\\ln 4-3=2.54518$, minus sum');
  const box = h('div', 'fill');
  function setMode(m) {
    mode = m;
    bLeft.classList.toggle('on', m === 'left');
    bTrap.classList.toggle('on', m === 'trap');
    draw();
  }
  bLeft.addEventListener('click', () => setMode('left'));
  bTrap.addEventListener('click', () => setMode('trap'));
  const draw = fillPlot(box, (svg, W, H) => {
    const o = { x0: 0.6, x1: 4.4, y0: 0, y1: 1.6, xt: [[1, '$1$'], [2, '$2$'], [3, '$3$'], [4, '$4$']],
      yt: [[0, '$0$'], [0.5, '$0.5$'], [1, '$1$'], [1.5, '$1.5$']], xlabel: '$x$', ylabel: '$\\ln x$' };
    const f = frame(W, H, o);
    axes(svg, f, o);
    const w = 3 / n;
    let sum = 0;
    for (let k = 0; k < n; k++) {
      const a = 1 + k * w, b = a + w, ya = Math.log(a), yb = Math.log(b);
      const pts = mode === 'left' ? [[a, 0], [a, ya], [b, ya], [b, 0]] : [[a, 0], [a, ya], [b, yb], [b, 0]];
      path(svg, pts.map(p => [f.X(p[0]), f.Y(p[1])]), { fill: COL.accent, 'fill-opacity': .22, stroke: COL.accent, 'stroke-width': 1 }, true);
      sum += mode === 'left' ? w * ya : w * (ya + yb) / 2;
    }
    const curve = [];
    for (let i = 0; i <= 80; i++) { const x = 1 + 3 * i / 80; curve.push([f.X(x), f.Y(Math.log(x))]); }
    path(svg, curve, { stroke: COL.text2, 'stroke-width': 2.5 });
    svgTex(svg, f.X(3.7), f.Y(Math.log(3.7)) - 18, '$\\ln x$', { w: 70, fill: COL.text2 });
    rw.set('$3/' + n + '=' + w.toFixed(4) + '$');
    rs.set(sum.toFixed(5));
    rg.set((exact - sum).toFixed(5));
  });
  widget.append(
    hh('div', 'sliders', sl.el, bLeft, bTrap),
    hh('div', 'readouts', rw.el, rs.el, rg.el),
    box,
    legend([
      { color: COL.text2, text: 'solid curve: $\\ln x$' },
      { chip: true, color: COL.bluePale, text: 'blue pieces: the area of each rectangle (or trapezoid)' }]));
  side.append(
    sym('$n$: number of pieces on $[1,4]$. $h$: width of one piece. The sum uses the height at each piece. The exact area $4\\ln 4-3$ comes from Integrals: techniques, step 4.'),
    triesList([
      'Set $n = 3$, mode Left ends. The pieces are wide and the gap is big.',
      'Set $n = 48$. Then switch to Trapezoid: the gap is smaller still.',
      'Compare the gap at $n = 12$ for the two modes.']),
    takeLine('Thin pieces give a sum that approaches the integral. Planck found he had to keep his energy pieces finite (L24 03:16).'));
}

// ---------- step 2: why the water is the area T^2/2 (proof) ----------
function drawWater(svg, W, H, T, n, lit) {
  const top = Math.max(6.4, T + T / n + 0.4);   // room for the T by T+h block of line 4
  const o = { x0: 0, x1: 6.2, y0: 0, y1: top, xt: [[0, '$0$'], [2, '$2$'], [4, '$4$'], [6, '$6$']],
    yt: [[0, '$0$'], [2, '$2$'], [4, '$4$'], [6, '$6$'], [8, '$8$']].filter(t => t[0] <= top), xlabel: '$t$, minutes', ylabel: '$r$, liters per minute' };
  const f = frame(W, H, o, PM);
  const hh_ = T / n, kStar = Math.ceil(n / 2);
  const CAP = {
    pieces: String.raw`amber: $n$ pieces of time, each $h=T/n$ long`,
    piece: String.raw`amber: piece $k=${kStar}$; its water is between the low box and the high box`,
    stairs: String.raw`amber: the high staircase $U$; the low one $L$ is blue inside it`,
    double: String.raw`amber: $U$ and a copy turned half round fill $T$ by $T+h$`,
    limit: String.raw`amber: the gap $U-L=T\,h$; it vanishes as $h\to0$` }[lit];
  if (CAP) litCaption(svg, W, CAP);
  else plainCaption(svg, W, String.raw`the rate line, cut into $n=${n}$ pieces of time`);
  axes(svg, f, o);
  // The high staircase U as one polygon: heights kh on piece k.
  const upper = [[f.X(0), f.Y(0)]];
  for (let k = 1; k <= n; k++) upper.push([f.X((k - 1) * hh_), f.Y(k * hh_)], [f.X(k * hh_), f.Y(k * hh_)]);
  upper.push([f.X(T), f.Y(0)]);
  // Lit parts first, so the marks sit on top.
  if (lit === 'pieces') {
    glowPath(svg, [[f.X(0), f.Y(0)], [f.X(T), f.Y(0)]], 10);
    for (let k = 0; k <= n; k++) glowPath(svg, [[f.X(k * hh_), f.Y(0) - 7], [f.X(k * hh_), f.Y(0) + 7]], 5);
  }
  if (lit === 'piece') glowFill(svg, boxPts(f, (kStar - 1) * hh_, kStar * hh_, 0, kStar * hh_));
  if (lit === 'stairs' || lit === 'double') glowFill(svg, upper);
  if (lit === 'double') {
    for (let k = 1; k <= n; k++) path(svg, boxPts(f, (k - 1) * hh_, k * hh_, k * hh_, T + hh_), { fill: COL.amberBg, 'fill-opacity': .35, stroke: COL.amber, 'stroke-width': 1.5, 'stroke-dasharray': '5 3' }, true);
    path(svg, boxPts(f, 0, T, 0, T + hh_), { stroke: COL.amber, 'stroke-width': 2.5 }, true);
    svgTex(svg, f.X(0) + 6, f.Y(T + hh_) - 12, String.raw`height $T+h=${(T + hh_).toFixed(2)}$`, { w: 200, anchor: 'start', size: 15, fill: COL.amberDeep });
  }
  if (lit === 'limit') for (let k = 1; k <= n; k++) glowFill(svg, boxPts(f, (k - 1) * hh_, k * hh_, (k - 1) * hh_, k * hh_));
  // The low staircase L: boxes at the rate at the start of each piece.
  for (let k = 1; k <= n; k++) {
    if (k > 1) path(svg, boxPts(f, (k - 1) * hh_, k * hh_, 0, (k - 1) * hh_), { fill: COL.accent, 'fill-opacity': .22, stroke: COL.accent, 'stroke-width': 1, 'data-item': 'mark', 'data-id': 'low-' + k }, true);
  }
  // The high staircase U: its outline, dashed.
  path(svg, upper, { stroke: COL.blueStrong, 'stroke-width': 1.5, 'stroke-dasharray': '5 3', 'data-item': 'mark', 'data-id': 'high' });
  path(svg, [[f.X(0), f.Y(0)], [f.X(6), f.Y(6)]], { stroke: COL.muted, 'stroke-width': 2.5 });
  path(svg, [[f.X(T), f.Y(0)], [f.X(T), f.Y(T + hh_ + 0.2)]], { stroke: COL.ink, 'stroke-dasharray': '2 3' });
  svgTex(svg, f.X(T) + 4, f.Y(0) - 12, '$T$', { w: 30, anchor: 'start', fill: COL.ink });
  svgTex(svg, f.X(5.2) - 8, f.Y(5.2) - 12, '$r(t)=t$', { w: 80, anchor: 'end', fill: COL.text2 });
}

      { tex: String.raw`h^2(0+\dots+(n-1))\le V\le h^2(1+\dots+n)`, move: 'Rearrange',
        why: 'add the $n$ pieces: the low staircase $L$, then $V$, then the high one $U$', choices: ['Telescope', 'Compute it two ways'], highlight: 'stairs' },
      { tex: String.raw`U=\tfrac{T(T+h)}{2},\quad L=\tfrac{T(T-h)}{2}`, move: 'Use symmetry',
        why: String.raw`two copies of $U$, one turned half round, fill $n$ by $n+1$ boxes: $1+\dots+n=\tfrac{n(n+1)}{2}$`, choices: ['Induction', 'Compare or bound'], highlight: 'double' },
      { tex: String.raw`V=\tfrac{T^2}{2}`, move: 'Take a limit',
        why: String.raw`let $n\to\infty$, so $h\to0$: both bounds go to $\tfrac{T^2}{2}$, and $V$ does not depend on $n$`, choices: ['Contradiction', 'Undo with the inverse'], highlight: 'limit' }],
    lookBack: [
      { q: String.raw`What else did the proof show?`,
        a: String.raw`The triangle sits between the same staircases, so the water equals its area: step 1's claim, for this tap.` },
      { q: 'What did line 4 need that most curves lack?',
        a: String.raw`An exact staircase sum. Under $\ln x$ there is none; step 4 traps the area without one.` }] },
    plot, key => { lit = key || ''; plot.redraw(); });
  function update() {   // the staircases added box by box, not by the formula the proof finds
    const w = T / n;
    let L = 0, U = 0;

    rU.set('$' + U.toFixed(2) + '$');
    plot.redraw();
  }
  update();
}

// ---------- step 4: why thin rectangles close in on the area (proof) ----------
const LN4 = Math.log(4);
function drawRectProof(svg, W, H, n, lit) {
  const o = { x0: 0.6, x1: 5.5, y0: 0, y1: 1.65, xt: [[1, '$1$'], [2, '$2$'], [3, '$3$'], [4, '$4$']],

  const f = frame(W, H, o, PM);
  const w = 3 / n, X0 = 4.3;   // the gap column stands right of the curve, from X0 to X0 + h
  const CAP = {
    stairs: String.raw`amber: the right-end boxes $U$; the left-end boxes $L$ are blue inside`,
    between: String.raw`amber: the area $A$ under $\ln x$; it lies between $L$ and $U$`,
    stack: String.raw`amber: the gap boxes, slid into one column $h$ wide, $\ln 4$ high`,
    limit: String.raw`amber: the column, area $h\,(\ln 4-\ln 1)$; it thins as $h\to0$` }[lit];
  if (CAP) litCaption(svg, W, CAP);
  else plainCaption(svg, W, String.raw`$\ln x$ on $[1,4]$ in $n=${n}$ pieces`);
  axes(svg, f, o);
  const xs = k => 1 + k * w;
  const upper = [[f.X(1), f.Y(0)]];
  for (let k = 0; k < n; k++) upper.push([f.X(xs(k)), f.Y(Math.log(xs(k + 1)))], [f.X(xs(k + 1)), f.Y(Math.log(xs(k + 1)))]);
  upper.push([f.X(4), f.Y(0)]);
  if (lit === 'stairs') glowFill(svg, upper);
  if (lit === 'between') glowFill(svg, underPts(f, Math.log, 1, 4, 120));
  if (lit === 'stack') for (let k = 0; k < n; k++) glowFill(svg, boxPts(f, xs(k), xs(k + 1), Math.log(xs(k)), Math.log(xs(k + 1))));
  if (lit === 'stack' || lit === 'limit') glowFill(svg, boxPts(f, X0, X0 + w, 0, LN4));
  // Left-end boxes L.
  for (let k = 1; k < n; k++) path(svg, boxPts(f, xs(k), xs(k + 1), 0, Math.log(xs(k))), { fill: COL.accent, 'fill-opacity': .22, stroke: COL.accent, 'stroke-width': 1, 'data-item': 'mark', 'data-id': 'left-' + k }, true);

  // The gap column: each piece's gap box, moved sideways; together they span 0 to ln 4.
  for (let k = 0; k < n; k++) path(svg, boxPts(f, X0, X0 + w, Math.log(xs(k)), Math.log(xs(k + 1))), { stroke: COL.muted, 'stroke-width': 1, 'data-item': 'mark', 'data-id': 'gap-column' }, true);
  svgTex(svg, f.X(X0 + w / 2), f.Y(LN4) - 14, 'all gaps', { w: 90, size: 14, fill: COL.text2 });
  const curve = [];
  for (let i = 0; i <= 120; i++) { const x = 1 + 3 * i / 120; curve.push([f.X(x), f.Y(Math.log(x))]); }
  path(svg, curve, { stroke: COL.text2, 'stroke-width': 2.5 });
  svgTex(svg, f.X(1) - 6, f.Y(0.3), '$\\ln x$', { w: 60, anchor: 'end', fill: COL.text2 });
}
function slideWhyRect(widget, side) {
  let n = 6, lit = '';
  const sN = slider('$n$ pieces', { id: 'n', min: 3, max: 24, step: 1, value: n, fmt: v => '$' + v + '$', onInput: v => { n = v; update(); } });
  const rL = readout('L', 'left ends $L$');
  const rU = readout('U', 'right ends $U$');
  const rG = readout('gap', 'gap $U-L$');
  const plot = proofLeft(widget, {
    controls: [sN.el],
    draw: (svg, W, H) => drawRectProof(svg, W, H, n, lit),
    legend: [
      { chip: true, color: COL.bluePale, text: 'blue: $L$ boxes' },
      { dash: true, color: COL.blueStrong, text: 'dashed: $U$ boxes' },
      { color: COL.muted, text: 'grey column: gaps' }],
    readouts: [rL, rU, rG],
    tests: [
      String.raw`Set $n=6$: $L=2.183$, $U=2.876$; the area $4\ln4-3=2.545$ is between.`,
      String.raw`Double $n$ to 12: the gap halves, $0.693$ to $0.347$. Cases are evidence, not proof.`],
    model: String.raw`Each piece misses by at most one small box: the rise on that piece times $h$. Slide the boxes sideways into one column: its height is the whole rise, $\ln 4$.` });
  proofRight(side, {
    id: 'rectangles',
    goal: { tex: String.raw`0\le A-L\le\big(f(b)-f(a)\big)\,h\to0`,
      words: String.raw`for $f$ rising on $[a,b]$, like $\ln x$ on $[1,4]$.` },
    facts: [
      { words: String.raw`$A$ is the area under $f$ on $[a,b]$; $h=\tfrac{b-a}{n}$` },
      { words: String.raw`on each piece a rising $f$ is lowest at the left end, highest at the right` }],
    lines: [
      { tex: String.raw`\textstyle L=\sum_k f(x_k)\,h,\quad U=\sum_k f(x_{k+1})\,h`, move: 'Name a piece',
        why: String.raw`$x_k=a+kh$, $k=0,\dots,n-1$: left ends for $L$, right ends for $U$`, choices: ['Unfold the definition', 'Change variables'], highlight: 'stairs' },
      { tex: String.raw`L\le A\le U`, move: 'Compare or bound',
        why: String.raw`each strip under $f$ lies between its two boxes`, choices: ['Rearrange', 'Use symmetry'], highlight: 'between' },
      { tex: String.raw`U-L=h\,\big(f(b)-f(a)\big)`, move: 'Telescope',
        why: String.raw`in $h\sum_k\big(f(x_{k+1})-f(x_k)\big)$ each middle value comes once with $+$, once with $-$; only the ends stay`, choices: ['Compute it two ways', 'Rearrange'], highlight: 'stack' },
      { tex: String.raw`0\le A-L\le h\,\big(f(b)-f(a)\big)\to0`, move: 'Take a limit',
        why: String.raw`lines 2 and 3, then $h\to0$. For $\ln x$: at most $3\ln4/n=4.16/n$`, choices: ['Contradiction', 'Induction'], highlight: 'limit' }],
    lookBack: [
      { q: String.raw`What if $f$ goes up and down?`,
        a: String.raw`Cut $[a,b]$ where $f$ turns; the proof works on each part. Any unbroken curve needs one more idea (uniform continuity), from real analysis.` },
      { q: 'Why do trapezoids do better?',
        a: String.raw`Their sum is $\tfrac{L+U}{2}$, the middle of the band: $2.5413$ at $n=12$. Its error falls like $h^2$; that proof needs the curve's bending.` }] },
    plot, key => { lit = key || ''; plot.redraw(); });
  function update() {
    const w = 3 / n;
    let L = 0, U = 0;
    for (let k = 0; k < n; k++) { L += Math.log(1 + k * w) * w; U += Math.log(1 + (k + 1) * w) * w; }
    rL.set('$' + L.toFixed(3) + '$');
    rU.set('$' + U.toFixed(3) + '$');
    rG.set('$' + (U - L).toFixed(3) + '$');
    plot.redraw();
  }
  update();
}

// ---------- step 6: why an antiderivative gives the area (proof) ----------
const RK = Math.LN2 / 17;   // knowledge doubles every 17 years
const eR = s => Math.exp(RK * s);
function drawAntiProof(svg, W, H, L, x, w, lit) {
  const o = { x0: -80, x1: 0, y0: 0, y1: 1.1, xt: [[-80, '$-80$'], [-60, '$-60$'], [-40, '$-40$'], [-20, '$-20$'], [0, '$0$']],
    yt: [[0, '$0$'], [0.5, '$0.5$'], [1, '$1$']], xlabel: '$s$, years from now', ylabel: '$e^{rs}$, rate' };
  const f = frame(W, H, o, PM);
  const CAP = {
    area: String.raw`amber: $A(x)$, the area from $L$ to $x$`,
    strip: String.raw`amber: the high box; the new strip and the low box sit inside it`,
    edge: String.raw`amber: the edge at $x$; the area grows at its height $e^{rx}$`,
    ends: String.raw`amber: the two ends: $A=0$ at $L$, and $A(x)$ at $x$`,
    tail: String.raw`amber: the past before $L$, $e^{rL}/r$ in all; it vanishes as $L\to-\infty$` }[lit];
  if (CAP) litCaption(svg, W, CAP);
  else plainCaption(svg, W, String.raw`the area $A(x)$ from $L$ to $x$, and the next strip, $h$ wide`);
  axes(svg, f, o);
  if (lit === 'area') glowFill(svg, underPts(f, eR, L, x));
  if (lit === 'strip') glowFill(svg, boxPts(f, x, x + w, 0, eR(x + w)));
  if (lit === 'tail') glowFill(svg, underPts(f, eR, -80, L));
  // The whole past, lightly; the area A(x); the strip.
  path(svg, underPts(f, eR, -80, 0, 160), { fill: COL.grey, 'fill-opacity': .12, stroke: 'none' }, true);
  if (lit !== 'area') path(svg, underPts(f, eR, L, x), { fill: COL.accent, 'fill-opacity': .25, stroke: 'none', 'data-item': 'mark', 'data-id': 'area' }, true);
  path(svg, underPts(f, eR, x, x + w, 20), { fill: COL.accent, 'fill-opacity': .5, stroke: 'none', 'data-item': 'mark', 'data-id': 'strip' }, true);
  path(svg, boxPts(f, x, x + w, 0, eR(x)), { stroke: COL.ink, 'stroke-width': 1.5 }, true);
  path(svg, boxPts(f, x, x + w, 0, eR(x + w)), { stroke: COL.ink, 'stroke-width': 1.5, 'stroke-dasharray': '4 3' }, true);
  if (lit === 'edge') glowPath(svg, [[f.X(x), f.Y(0)], [f.X(x), f.Y(eR(x))]], 10);
  if (lit === 'ends') for (const s of [L, x]) glowPath(svg, [[f.X(s), f.Y(0)], [f.X(s), f.Y(eR(s))]], 10);
  const curve = [];
  for (let s = -80; s <= 0.001; s += 0.5) curve.push([f.X(s), f.Y(eR(s))]);
  path(svg, curve, { stroke: COL.text2, 'stroke-width': 2.5 });
  svgTex(svg, f.X(L), f.Y(0) - 12, '$L$', { w: 30, fill: COL.blueDeep });
  svgTex(svg, f.X(x) - 3, f.Y(0) - 12, '$x$', { w: 30, anchor: 'end', fill: COL.ink });
  svgTex(svg, f.X(x + w / 2), f.Y(eR(x + w)) - 14, '$h$', { w: 30, fill: COL.ink });
  if (f.X(x) - f.X(L) > 70) svgTex(svg, f.X((L + x) / 2), f.Y(eR((L + x) / 2) / 2.4), '$A(x)$', { w: 70, fill: COL.blueDeep });
  svgTex(svg, f.X(-6), f.Y(0.92), '$e^{rs}$', { w: 60, anchor: 'end', fill: COL.text2 });
}

  update();
}

// ---------- step 8: why the average of cos is sin a / a (proof) ----------
function drawAvgProof(svg, W, H, a, lit) {
  const o = { x0: -PI, x1: PI, y0: -1.3, y1: 1.3, xt: [[-PI, '$-\\pi$'], [-PI / 2, '$-\\frac{\\pi}{2}$'], [0, '$0$'], [PI / 2, '$\\frac{\\pi}{2}$'], [PI, '$\\pi$']],
    yt: [[-1, '$-1$'], [0, '$0$'], [1, '$1$']], xlabel: '$x$', ylabel: '$\\cos x$' };
  const f = frame(W, H, o, PM);
  const avg = Math.sin(a) / a;
  const CAP = {
    halves: String.raw`amber: the left half, the mirror image of the right: $\cos$ is even`,
    area: String.raw`amber: the area on $[-a,a]$, which is $2\sin a$`,
    rect: String.raw`amber: the box $2a$ wide and $\bar f$ high, with the same area` }[lit];
  if (CAP) litCaption(svg, W, CAP);
  else plainCaption(svg, W, String.raw`$\cos x$ on the window $[-a,a]$, and the flat box with the same area`);
  axes(svg, f, o);
  path(svg, [[f.X(-PI), f.Y(0)], [f.X(PI), f.Y(0)]], { stroke: COL.line });
  if (lit === 'halves') glowFill(svg, underPts(f, Math.cos, -a, 0));
  if (lit === 'area') glowFill(svg, underPts(f, Math.cos, -a, a));
  if (lit === 'rect') glowFill(svg, boxPts(f, -a, a, 0, avg));
  path(svg, underPts(f, Math.cos, -a, a), { fill: COL.accent, 'fill-opacity': .25, stroke: 'none', 'data-item': 'mark', 'data-id': 'area' }, true);
  path(svg, boxPts(f, -a, a, 0, avg), { stroke: COL.ink, 'stroke-width': 1.5, 'stroke-dasharray': '6 4', 'data-item': 'mark', 'data-id': 'box' }, true);
  const curve = [];
  for (let i = 0; i <= 200; i++) { const x = -PI + 2 * PI * i / 200; curve.push([f.X(x), f.Y(Math.cos(x))]); }
  path(svg, curve, { stroke: COL.text2, 'stroke-width': 2.5 });
  svgTex(svg, f.X(a) + 6, f.Y(avg) + (avg >= 0 ? -12 : 12), '$\\bar f=' + fixed(avg, 3) + '$', { w: 120, anchor: 'start', fill: COL.ink });
  svgTex(svg, f.X(-a), f.Y(0) + 14, '$-a$', { w: 40, fill: COL.blueDeep });
  svgTex(svg, f.X(a), f.Y(0) + 14, '$a$', { w: 40, fill: COL.blueDeep });
}

      { tex: String.raw`\tfrac{d}{dx}\ln x=\tfrac1x`, move: 'Undo with the inverse',
        why: String.raw`$y=\ln x$ means $x=e^y$, which climbs at slope $e^y=x$; the graph of $\ln$ is its mirror image, so rise and run swap`, choices: ['Change variables', 'Take a limit'], highlight: 'curve' },
      { tex: String.raw`A(x)=\ln x,\quad \text{strip}=A(2)=\ln 2`, move: 'Use an earlier result',
        why: String.raw`$A-\ln$ has slope 0 and is 0 at $x=1$, so it is 0 (step 6); then line 2`, choices: ['Contradiction', 'Induction'], highlight: 'orange' }],
    lookBack: [
      { q: String.raw`Why does line 2 need $1/x$?`,
        a: String.raw`A strip $a$ times wider must sit $a$ times lower; only $c/x$ does that. Under $1/x^2$ the strip from $a$ to $2a$ is $\tfrac{1}{2a}$: it shrinks.` },
      { q: 'What else does line 2 give?',
        a: String.raw`Split the area from 1 to $xy$ at $x$ and put $t=xs$ in the second part: $A(xy)=A(x)+A(y)$, products into sums (Logarithms, step 4).` }] },
    plot, key => { lit = key || ''; plot.redraw(); }, CLOSING);
  side.querySelector('fl-proof-steps').endNote = NEXT;
  function update() {
    rB.set('$' + fixed(simpson(inv, 1, a), 4) + '$');
    rO.set('$' + simpson(inv, a, 2 * a).toFixed(4) + '$');
    plot.redraw();
  }
  update();
}

// The view's close. The primer's last proof lists every move the primer's proofs used, in order of first
// use, once it is proved, so the list never gives a pick away; the last step names what comes next.
const CLOSING = 'Look back: under the picture.';
const NEXT = 'Next: Primer · Integrals: techniques.';

let cur = 0, shownId = null, endSent = false;
function goTo(i) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  if (shownId !== null && shownId !== s.id) emit('view.step', { step: s.id });
  shownId = s.id;
  const stage = $('#stage');
  stage.innerHTML = '';
  PLOTS = [];
  COL = readPalette();
  const widget = h('div', 'widget');
  const side = hh('div', 'side',
    h('div', 'tag', s.tag),
    setTex(h('h2'), s.title),
    setTex(h('p', 'question'), s.question),
    s.formula ? setTex(h('div', 'formula'), s.formula) : null);
  const sec = mark(h('section', 'slide' + (s.proof ? ' proof-slide' : '')), 'step', s.id, s.title.replace(/\$/g, ''));
  sec.append(widget, side);
  stage.append(sec);
  stage.scrollTop = 0;
  s.mount(widget, side);
  if (cur === SLIDES.length - 1 && !endSent) { endSent = true; emit('view.action', { action: 'deck-end' }); }
  tex(sec);
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, i) => d.classList.toggle('on', i === cur));
}
// A cue is a state: go to the named step, and do nothing if it is already shown.
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i >= 0 && i !== cur) goTo(i);
}
(function init() {
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = s.title.replace(/\$/g, '');
    b.addEventListener('click', () => goTo(i));
    $('#dots').append(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],textarea,select')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
})();

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>From surprise to cross-entropy loss</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../../components/theme.js"></script>
<style>
/* Colors: white page, one accent (blue), red only for a failing check. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft);
  --red:var(--pal-red); --redbg:var(--pal-red-bg); --okbg:var(--pal-accent-soft); --okfg:var(--pal-accent-ink);
  --u:clamp(16px,1.35vw,20px);            /* body text: 16px+ at 1280 wide */
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:10px 28px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(8px,1.2vh,16px) 28px}
footer{display:flex;align-items:center;gap:10px;padding:10px 28px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
:root[data-fluid-theme="dark"] svg text:not([fill]){fill:var(--pal-ink)}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Slide frame: widget on the left (60%), text on the right (40%). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(20px,2.6vw,44px)}
.widget{min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(8px,1.2vh,14px);overflow:auto}
.side{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(10px,1.8vh,18px)}
.tag{font:13px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(22px,2.3vw,34px);line-height:1.2;margin:0;font-weight:650}
.formula{font-size:clamp(22px,2.4vw,34px)}
.line-txt{margin:0}

/* Controls and readouts (used by the widgets) */
.sliders{display:flex;gap:10px 28px;flex-wrap:wrap}
.slide-ctl{display:flex;align-items:center;gap:10px;font:16px ui-monospace,Menlo,monospace;color:var(--muted)}
.slide-ctl .lab{min-width:28px;color:var(--fg);font-size:18px}
.slide-ctl input{width:clamp(140px,14vw,200px);vertical-align:middle;accent-color:var(--accent)}
.slide-ctl .val{min-width:56px;color:var(--fg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:5px 14px;border:1px solid var(--line);border-radius:999px;font:inherit;background:var(--pal-panel);cursor:pointer}
.chip.on{background:var(--chip);border-color:var(--accent);color:var(--pal-accent-deep)}
.btn{font:inherit;padding:7px 16px;border:1px solid var(--line);background:var(--pal-panel);border-radius:8px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--pal-on-accent)}
.btn.small{padding:1px 9px}
.btn.on{background:var(--chip);border-color:var(--accent);color:var(--pal-accent-deep)}
.btn:disabled{opacity:.4;cursor:default}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.readout{padding:10px 14px;border-radius:10px;background:var(--pal-soft);width:100%}
.readout.ok{background:var(--okbg);color:var(--okfg)}
.readout.bad{background:var(--redbg);color:var(--red)}
.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;width:100%}
.note{color:var(--muted);width:100%;margin:0}
.cap{color:var(--muted);margin:0;width:100%}
.mono{font:16px ui-monospace,Menlo,monospace}
.plot{width:100%;min-width:0}
.plot svg,.barwrap svg{display:block;width:100%;height:auto;max-height:46vh}
.barwrap{width:100%;touch-action:none;user-select:none;cursor:ns-resize}
.barwrap svg{max-height:22vh}
.surp svg{max-height:18vh}
.row{display:flex;gap:16px;flex-wrap:wrap;width:100%;align-items:flex-start}
.row>*{min-width:0}
.row>.plot{flex:1 1 320px}
.col{display:flex;flex-direction:column;gap:8px;flex:1 1 260px;min-width:0}
.pair{display:flex;gap:16px;flex-wrap:wrap;width:100%}
.card{padding:8px 12px;border:1px solid var(--line);border-radius:10px;width:100%;display:flex;flex-direction:column;gap:6px}
.card .q{font-weight:600}
.symbox{display:flex;flex-direction:column;gap:8px;width:100%}
.symrow{display:grid;grid-template-columns:44px minmax(0,1.4fr) auto auto minmax(0,1fr);gap:10px;align-items:center}
.trow{display:grid;grid-template-columns:44px repeat(3,minmax(0,1fr));gap:10px;align-items:center}
.stepper{display:inline-flex;gap:6px;align-items:center}
.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.legend>span{display:inline-flex;gap:6px;align-items:center}
.swatch{width:14px;height:14px;border-radius:3px;display:inline-block}

/* KaTeX labels inside SVG (foreignObject) */
.svtex-fo{overflow:visible}
.svtex{display:flex;align-items:center;width:100%;height:100%;white-space:nowrap;line-height:1}
.svtex.start{justify-content:flex-start}
.svtex.middle{justify-content:center}
.svtex.end{justify-content:flex-end}

/* Derivation (why-log-proof, kraft-gap): one line per click */
.proof{display:flex;flex-direction:column;gap:4px;min-width:0}
.proof-line{display:grid;grid-template-columns:30px minmax(0,1fr);gap:2px 10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--pal-soft-3)}
.proof-num{font:16px ui-monospace,Menlo,monospace;color:var(--muted)}
.proof-eq{font-size:clamp(19px,1.9vw,27px)}
.proof-eq .katex-display{margin:0;text-align:left}
.proof-eq .katex-display>.katex{text-align:left}
.proof-why{grid-column:2;margin:0;color:var(--muted)}
.proof-line.compact{grid-template-columns:30px auto minmax(0,1fr);gap:0 14px;padding:5px 0}
.proof-line.compact .proof-eq{font-size:clamp(19px,1.7vw,24px)}
.proof-line.compact .proof-why{grid-column:3;align-self:center}
/* Code budget slide: code-space and probability bars, one row per symbol */
.bbar{width:100%;min-width:0;display:flex;flex-direction:column;gap:4px}
.bbar-lab{display:flex;justify-content:space-between;align-items:baseline;gap:12px;color:var(--muted)}
.bbar-bar svg{display:block;width:100%;height:auto}
.bsyms{display:flex;flex-direction:column;gap:4px;width:100%}
.bsym{display:grid;grid-template-columns:90px 110px auto minmax(0,1fr);gap:12px;align-items:center}
.bsym .name{display:inline-flex;gap:8px;align-items:center}
.bstep{display:inline-flex;gap:8px;align-items:center}
.bstep .mono{min-width:88px;text-align:center}
/* Side column: a scrolling side (used when an expanded panel needs room) */
.side.scroll{overflow:auto}
/* Explained widget (kraft-gap): a waterfall from H to L, one row per step, named on the left */
.kg{display:flex;flex-direction:column;gap:12px;flex:1 1 auto;min-height:0;width:100%}
.kg-chart{flex:1 1 auto;min-height:260px;display:grid;grid-template-columns:minmax(200px,38%) minmax(0,1fr);grid-template-rows:repeat(4,minmax(58px,1fr)) 34px}
.kg-head{align-self:center;padding-right:14px;min-width:0}
.kg-head .hd1{font-size:17px}
.kg-head .hd2{color:var(--muted);font-size:16px;line-height:1.3}
.kg-head.bad .hd1,.kg-head.bad .hd2{color:var(--red)}
.kg-over{position:relative;pointer-events:none}
.kg-over i{position:absolute;top:0;bottom:0;width:1px;background:var(--pal-soft-2);transform:translateX(-50%)}
.kg-marker{position:absolute;top:0;bottom:0;width:3px;background:var(--pal-ink);transform:translateX(-50%)}
.kg-track{position:relative;min-width:0}
.kg-bar{position:absolute;top:22%;bottom:22%;min-width:2px;border-radius:4px}
.kg-axis{position:relative}
.kg-axis>span{position:absolute;top:4px;transform:translateX(-50%);color:var(--muted)}
.kg-axis-lab{color:var(--muted);align-self:center}
.kg-table{display:flex;flex-direction:column;font-size:16px}
.kg-tr{display:grid;grid-template-columns:56px 56px 96px minmax(0,1fr) 120px;gap:8px;align-items:center;padding:4px 8px;border-bottom:1px solid var(--pal-soft-3)}
.kg-tr.th{color:var(--muted)}
.kg-tr.foot{border-bottom:none;border-top:2px solid var(--line);font-weight:600}
.kg-tr .mono{font:16px ui-monospace,Menlo,monospace}
.kg-tr .bad{color:var(--red)}
.tries{margin:0;padding-left:1.5em;display:flex;flex-direction:column;gap:8px}
.tries li{padding-left:4px}
.tries li::marker{font-weight:650;color:var(--accent)}
.takeaway{margin:0;padding:10px 14px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px}
/* Labels on the mid-tone grey, orange and teal fills: ink in light, dark ink in dark. */
.lab-mid{color:var(--pal-ink)}
:root[data-fluid-theme="dark"] .lab-mid{color:var(--pal-on-accent)}
.lab-on{color:var(--pal-on-accent)}
.alg-btn.on{background:var(--chip);border-color:var(--accent);color:var(--pal-accent-deep)}
</style>
</head>
<body>
<header>From surprise to cross-entropy loss</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script>
// LOGIC-START
// Pure math for the four slides. No DOM here, so a test can load this block alone.
const TOL = 1e-12;
const CANDS = {
  log2:  { label: '−log2 p', unit: 'bits', f: p => -Math.log2(p) },
  lin:   { label: '1 − p', unit: '', f: p => 1 - p },
  recip: { label: '1/p − 1', unit: '', f: p => 1 / p - 1 },
  ln:    { label: '−ln p', unit: 'nats', f: p => -Math.log(p) }
};
function fmt(x, d = 4) {
  if (!isFinite(x)) return '∞';
  if (Math.abs(x) < 1e-9) return '0';
  return x.toFixed(d);
}
// Entropy in bits: sum of p log2(1/p), with 0 log 0 = 0.
function H2(ps) {
  let h = 0;
  for (const p of ps) if (p > 0) h += p * Math.log2(1 / p);
  return h;
}
// Cross-entropy H(p,q) in bits: sum of p log2(1/q).
function crossH2(p, q) {
  let h = 0;
  for (let i = 0; i < p.length; i++) if (p[i] > 0) h += p[i] * -Math.log2(q[i]);
  return h;
}
// KL(p||q) in bits, from logs so tiny values do not underflow.
function KL2(p, q) {
  let s = 0;
  for (let i = 0; i < p.length; i++) if (p[i] > 0) s += p[i] * (Math.log2(p[i]) - Math.log2(q[i]));
  return s;
}
// Sum of p ln(q/p) in nats: the left side of Gibbs' inequality.
function gibbsNats(p, q) {
  let s = 0;
  for (let i = 0; i < p.length; i++) if (p[i] > 0) s += p[i] * (Math.log(q[i]) - Math.log(p[i]));
  return s;
}
// Set entry i to v (clamped to [lo, hi]) and rescale the others so the total stays 1.
function renorm(arr, i, v, lo = 0, hi = 1) {
  const n = arr.length, out = arr.slice();
  v = Math.min(hi, Math.max(lo, v));
  out[i] = v;
  let S = 0;
  for (let j = 0; j < n; j++) if (j !== i) S += arr[j];
  const rest = 1 - v;
  for (let j = 0; j < n; j++) if (j !== i) out[j] = S > 0 ? rest * arr[j] / S : rest / (n - 1);
  return out;
}
// Kraft sum K = sum of 2^(-l_i).
function kraftK(ls) {
  let k = 0;
  for (const l of ls) k += Math.pow(2, -l);
  return k;
}
// Pseudoprobabilities Q_i = 2^(-l_i) / K, computed as 2^(-l_i - log2 K).
function modelQ(ls) {
  const lk = Math.log2(kraftK(ls));
  return ls.map(l => Math.pow(2, -l - lk));
}
// Average code length L = sum of p_i l_i.
function avgLen(p, ls) {
  let L = 0;
  for (let i = 0; i < p.length; i++) L += p[i] * ls[i];
  return L;
}
// Canonical codewords for lengths ls, or null when K > 1 (no prefix code exists).
function canonical(ls) {
  if (kraftK(ls) > 1 + TOL) return null;
  const order = ls.map((l, i) => i).sort((a, b) => ls[a] - ls[b] || a - b);
  const codes = new Array(ls.length);
  let code = 0, prev = 0;
  order.forEach((i, k) => {
    const l = ls[i];
    code = k === 0 ? 0 : (code + 1) * Math.pow(2, l - prev);
    prev = l;
    codes[i] = code.toString(2).padStart(l, '0');
  });
  return codes;
}
// Binary trie of codewords with x positions (leaves in order) and depths.
function layoutTrie(codes) {
  const root = { kids: {}, d: 0 };
  codes.forEach((c, i) => {
    let n = root;
    for (let d = 0; d < c.length; d++) {
      const b = c[d];
      if (!n.kids[b]) n.kids[b] = { kids: {}, d: d + 1 };
      n = n.kids[b];
    }
    n.leaf = i;
  });
  const nodes = [], edges = [];
  let nx = 0;
  (function place(n) {
    const bs = ['0', '1'].filter(b => n.kids[b]);
    if (bs.length === 0) n.x = nx++;
    else {
      bs.forEach(b => { place(n.kids[b]); edges.push([n, n.kids[b]]); });
      n.x = bs.reduce((s, b) => s + n.kids[b].x, 0) / bs.length;
    }
    nodes.push(n);
  })(root);
  return { nodes, edges, leaves: nx };
}
// LOGIC-END

// ---------- DOM helpers ----------
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (v === undefined || v === null || v === false) continue;
    if (k === 'text') e.textContent = v;
    else e.setAttribute(k, v === true ? '' : String(v));
  }
  for (const c of kids) if (c) e.append(c);
  return e;
}
const NS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (v !== undefined && v !== null && v !== false) e.setAttribute(k, String(v));
  }
  if (text !== undefined) e.textContent = text;
  return e;
}

// ---------- math (KaTeX via auto-render, and katex.render for SVG labels) ----------
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false } ], throwOnError: false };
// Render $...$ and $$...$$ in a node. If the CDN did not load, the text stays as typed.
function tex(node) {
  if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH);
  return node;
}
function setTex(node, text) { node.textContent = text; return tex(node); }
// Render raw TeX (no $ delimiters) into a node.
function renderKatex(node, src) {
  if (typeof katex !== 'undefined') katex.render(src, node, { throwOnError: false });
  else node.textContent = src;
  return node;
}
// A KaTeX label in SVG user units. (x, y): y is the vertical centre; x is the start, middle or end.
// It is HTML inside a foreignObject, so it scales with the viewBox like the bars do.
// Symbol labels on a block: white on blue, violet and pink; ink on grey, orange and teal (see .lab-mid).
const labCls = i => [0, 3, 4].includes(i) ? 'lab-on' : 'lab-mid';
function svTex(x, y, src, o = {}) {
  const w = o.w || 160, h = o.h || 26, anchor = o.anchor || 'middle';
  const x0 = anchor === 'middle' ? x - w / 2 : anchor === 'end' ? x - w : x;
  const fo = sv('foreignObject', { x: x0, y: y - h / 2, width: w, height: h, class: 'svtex-fo' });
  const div = el('div', { class: 'svtex ' + anchor + (o.cls ? ' ' + o.cls : ''), style: `font-size:${o.size || 17}px;` + (o.cls ? '' : `color:${o.color || 'var(--fg)'}`) });
  fo.append(renderKatex(div, src));
  return fo;
}
// Colour swatches with KaTeX labels. items: [colour, text with $ delimiters].
function legend(items) {
  return el('div', { class: 'legend' }, ...items.map(([color, t]) => el('span', {},
    el('i', { class: 'swatch', style: `background:${color}` }), setTex(el('span'), t))));
}
// Stacked segments on one horizontal scale. rows: arrays of {a, b, color, id} (values, drawn from a to b).
// marker (optional): a black vertical line at that value.
function segBar(rows, lo, hi, label, id, marker) {
  const W = 600, RH = 26, GAP = 10, H = rows.length * (RH + GAP) + 4;
  const X = v => 12 + (v - lo) / (hi - lo) * 576;
  const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': label });
  const g = sv('g', { 'data-item': 'bar', 'data-id': id });
  rows.forEach((segs, r) => segs.forEach(s => {
    const x1 = X(Math.min(s.a, s.b)), x2 = X(Math.max(s.a, s.b));
    g.append(sv('rect', { x: x1, y: 2 + r * (RH + GAP), width: Math.max(1.5, x2 - x1), height: RH, fill: s.color, 'data-id': s.id }));
  }));
  svg.append(g);
  svg.append(sv('line', { x1: X(0), y1: 0, x2: X(0), y2: H, stroke: FluidTheme.color('grey'), 'stroke-width': 1 }));
  if (marker !== undefined) svg.append(sv('line', { x1: X(marker), y1: 0, x2: X(marker), y2: H, stroke: FluidTheme.color('ink'), 'stroke-width': 2.5 }));
  return svg;
}
// A labelled range input. Built once; render code only moves its value, so drags keep focus.
// label is TeX with $ delimiters.
function sliderRow(id, label, lo, hi, val, onInput, step = 'any') {
  const out = el('span', { class: 'val', 'data-item': 'readout', 'data-id': id + '-value' });
  const inp = el('input', { type: 'range', min: lo, max: hi, step: step, value: val, 'aria-label': id, 'data-item': 'control', 'data-id': id });
  inp.addEventListener('input', () => onInput(parseFloat(inp.value)));
  const lab = setTex(el('span', { class: 'lab' }), label);
  const wrap = el('label', { class: 'slide-ctl' }, lab, inp, out);
  const set = v => { inp.value = v; out.textContent = fmt(v, 3); };
  set(val);
  return { wrap, inp, set };
}
// Renormalizing sliders for one distribution. onInput(i, v) gets the new value of slider i.
function distSliders(name, arr, lo, hi, onInput) {
  const sl = arr.map((v, i) => sliderRow(name + (i + 1), String.raw`$${name}_{${i + 1}}$`, lo, hi, v, nv => onInput(i, nv)));
  return { wraps: sl.map(s => s.wrap), set: vals => sl.forEach((s, i) => s.set(vals[i])) };
}
// Derivation: one line per click. items: [TeX equation (display), reason]. Used by why-log-proof and kraft-gap.
function revealLines(box, items, prefix, nextId, compact = false) {
  let shown = 0;
  const lines = items.map(([eq, why], i) => tex(el('div',
    { class: 'proof-line' + (compact ? ' compact' : ''), 'data-item': 'line', 'data-id': prefix + (i + 1), hidden: true },
    el('span', { class: 'proof-num', text: (i + 1) + '.' }),
    el('div', { class: 'proof-eq', text: eq }),
    el('p', { class: 'proof-why', text: why }))));
  const nextBtn = el('button', { class: 'btn primary', 'data-item': 'control', 'data-id': nextId, text: 'Next line' });
  nextBtn.addEventListener('click', () => {
    shown = Math.min(items.length, shown + 1);
    renderLines();
    emitEvent('view.action', { action: 'reveal', line: shown });
  });
  box.append(el('div', { class: 'proof' }, ...lines), el('div', { class: 'actions' }, nextBtn));
  function renderLines() {
    lines.forEach((d, i) => { d.hidden = i >= shown; });
    nextBtn.disabled = shown >= items.length;
    nextBtn.textContent = shown >= items.length ? 'Derivation done' : 'Next line';
  }
  renderLines();
}

// ---------- slide 1: which surprise function adds up ----------
const CHIP_TEX = {
  log2: String.raw`$-\log_2 p$`, lin: String.raw`$1-p$`,
  recip: String.raw`$\tfrac{1}{p}-1$`, ln: String.raw`$-\ln p$`
};
function slideWhy(box) {
  const st = { p1: 1 / 6, p2: 1 / 2, cand: 'log2' };
  const s1 = sliderRow('p1', String.raw`$p_1$`, 0.01, 1, st.p1, v => { st.p1 = v; render(); });
  const s2 = sliderRow('p2', String.raw`$p_2$`, 0.01, 1, st.p2, v => { st.p2 = v; render(); });
  const candBtns = Object.keys(CANDS).map(k => {
    const b = el('button', { class: 'chip', 'data-item': 'candidate', 'data-id': k });
    setTex(b, CHIP_TEX[k]);
    b.addEventListener('click', () => { st.cand = k; render(); });
    return b;
  });
  const plot = el('div', { class: 'plot' });
  const gapRo = el('div', { class: 'readout', 'data-item': 'readout', 'data-id': 'gap' });
  const valRo = el('p', { class: 'note', 'data-item': 'readout', 'data-id': 'values' });
  const lnNote = el('p', { class: 'note', 'data-item': 'readout', 'data-id': 'ln-note' });
  box.append(
    el('div', { class: 'sliders' }, s1.wrap, s2.wrap),
    el('div', { class: 'chips' }, ...candBtns),
    plot, gapRo, valRo, lnNote
  );

  function render() {
    const c = CANDS[st.cand];
    const I1 = c.f(st.p1), I2 = c.f(st.p2), I12 = c.f(st.p1 * st.p2);
    const gap = I12 - I1 - I2;
    candBtns.forEach(b => b.classList.toggle('on', b.dataset.id === st.cand));

    // Stacked bars I(p1) + I(p2) beside the single bar I(p1 p2). Shared height scale.
    const top = Math.max(I1 + I2, I12, 1e-9);
    const BASE = 300, scale = 250 / top;
    const h1 = I1 * scale, h2 = I2 * scale, h12 = I12 * scale;
    const svg = sv('svg', { viewBox: '0 0 600 340', role: 'img', 'aria-label': 'Stacked bars for the surprise of p1 and p2, beside the surprise of p1 p2' });
    svg.append(sv('line', { x1: 20, y1: BASE, x2: 580, y2: BASE, stroke: FluidTheme.color('grey'), 'stroke-width': 1.5 }));
    const stack = sv('g', { 'data-item': 'bar', 'data-id': 'stack' });
    stack.append(sv('rect', { x: 110, y: BASE - h1, width: 140, height: h1, fill: FluidTheme.color('muted') }));
    stack.append(sv('rect', { x: 110, y: BASE - h1 - h2, width: 140, height: h2, fill: FluidTheme.color('grey') }));
    if (h1 > 26) stack.append(svTex(180, BASE - h1 / 2, 'I(p_1)', { w: 130, h: 26, size: 18, color: FluidTheme.color('on-accent') }));
    if (h2 > 26) stack.append(svTex(180, BASE - h1 - h2 / 2, 'I(p_2)', { w: 130, h: 26, size: 18, cls: 'lab-mid' }));
    svg.append(stack);
    const joint = sv('g', { 'data-item': 'bar', 'data-id': 'joint' });
    joint.append(sv('rect', { x: 370, y: BASE - h12, width: 140, height: h12, fill: FluidTheme.color('accent') }));
    svg.append(joint);
    svg.append(sv('text', { x: 180, y: BASE - h1 - h2 - 10, 'text-anchor': 'middle', 'font-size': 17 }, fmt(I1 + I2)));
    svg.append(sv('text', { x: 440, y: BASE - h12 - 10, 'text-anchor': 'middle', 'font-size': 17 }, fmt(I12)));
    svg.append(sv('text', { x: 300, y: 190, 'text-anchor': 'middle', 'font-size': 18, fill: FluidTheme.color('muted') }, 'vs'));
    svg.append(svTex(180, 332, 'I(p_1) + I(p_2)', { w: 240, h: 26, size: 18 }));
    svg.append(svTex(440, 332, 'I(p_1 p_2)', { w: 200, h: 26, size: 18 }));
    plot.replaceChildren(svg);

    const bad = Math.abs(gap) > 1e-9;
    setTex(gapRo, String.raw`$\mathrm{gap} = I(p_1 p_2) - I(p_1) - I(p_2) = ${fmt(gap)}$`);
    gapRo.classList.toggle('bad', bad);
    gapRo.classList.toggle('ok', !bad);
    const unit = c.unit ? ' ' + c.unit : '';
    setTex(valRo, String.raw`$I(p_1) = ${fmt(I1)}$, $I(p_2) = ${fmt(I2)}$, $I(p_1 p_2) = ${fmt(I12)}$${unit}`);
    lnNote.hidden = st.cand !== 'ln';
    setTex(lnNote, String.raw`$1\ \text{bit} = \ln 2 \approx 0.693\ \text{nats}$: the base only sets the unit.`);
  }
  PLOTS.push(render);
  render();
}

// ---------- slide 2: why only the log works ----------
const PROOF = [
  [String.raw`$$I(p_1 p_2) = I(p_1) + I(p_2)$$`, 'the rule'],
  [String.raw`$$I(p^n) = n\,I(p)$$`, 'apply it n times'],
  [String.raw`$$I(p^{m/n}) = \tfrac{m}{n}\,I(p)$$`, 'put $q = p^{1/n}$'],
  [String.raw`$$I(p^x) = x\,I(p)$$`, String.raw`continuity, for real $x > 0$`],
  [String.raw`$$I(p) = -\log_2 p \cdot I(\tfrac12)$$`, String.raw`write $p$ as $(\tfrac12)^x$, so $x = -\log_2 p$`],
  [String.raw`$$I(p) = -\log_2 p$$`, String.raw`choose $I(\tfrac12) = 1$ bit`]
];
function slideProof(box) { revealLines(box, PROOF, 'line-', 'next-line'); }

// ---------- slide 3: entropy is average surprise ----------
function slideEntropy(box) {
  const st = { q: 6, p: Array(6).fill(1 / 6), drag: -1 };
  const W = 560, HH = 170, Y0 = 24, YB = 136;
  const SH = 150, SB = 118;
  const sQ = sliderRow('q', String.raw`$q$`, 2, 8, st.q, v => setQ(Math.round(v)), 1);
  const presetDefs = [['fair', 'Fair uniform'], ['loaded', 'Loaded'], ['certain', 'Certain']];
  const presetBtns = presetDefs.map(([k, t]) => {
    const b = el('button', { class: 'btn', 'data-item': 'preset', 'data-id': k, text: t });
    b.addEventListener('click', () => { applyPreset(k); emitEvent('view.action', { action: 'preset', name: k }); });
    return b;
  });
  const barBox = el('div', { class: 'barwrap' });
  const cap1 = setTex(el('p', { class: 'cap' }), String.raw`$p_i$ for each symbol. Drag a bar; the others rescale.`);
  const surpBox = el('div', { class: 'plot surp' });
  const cap2 = el('p', { class: 'cap' });
  const hRo = el('div', { class: 'readout', 'data-item': 'readout', 'data-id': 'H' });

  // Pointer position in the SVG's own units, so the mapping holds when the SVG is letterboxed.
  function toSvg(e) {
    const svg = barBox.querySelector('svg');
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  const levelAt = pt => Math.min(1, Math.max(0, (YB - pt.y) / (YB - Y0)));
  barBox.addEventListener('pointerdown', e => {
    const pt = toSvg(e), i = Math.floor(pt.x / (W / st.q));
    if (pt.x < 0 || pt.x > W || i < 0 || i >= st.q) return;
    st.drag = i;
    barBox.setPointerCapture(e.pointerId);
    st.p = renorm(st.p, i, levelAt(pt));
    render();
  });
  barBox.addEventListener('pointermove', e => {
    if (st.drag < 0) return;
    st.p = renorm(st.p, st.drag, levelAt(toSvg(e)));
    render();
  });
  const endDrag = () => { st.drag = -1; };
  barBox.addEventListener('pointerup', endDrag);
  barBox.addEventListener('pointercancel', endDrag);

  function setQ(n) {
    st.q = n;
    st.p = Array(n).fill(1 / n);
    render();
  }
  function applyPreset(k) {
    st.q = 6;
    if (k === 'fair') st.p = Array(6).fill(1 / 6);
    if (k === 'loaded') st.p = [.5, .1, .1, .1, .1, .1];
    if (k === 'certain') st.p = [1, 0, 0, 0, 0, 0];
    render();
  }
  box.append(
    el('div', { class: 'sliders' }, sQ.wrap),
    el('div', { class: 'chips' }, ...presetBtns),
    cap1, barBox, cap2, surpBox, hRo);

  function render() {
    sQ.set(st.q);
    const q = st.q, p = st.p, slot = W / q, bw = Math.min(60, slot * 0.6);
    // probability bars
    const svg = sv('svg', { viewBox: `0 0 ${W} ${HH}`, role: 'img', 'aria-label': 'Probability bars, drag to set' });
    svg.append(sv('line', { x1: 0, y1: YB, x2: W, y2: YB, stroke: FluidTheme.color('grey') }));
    for (let i = 0; i < q; i++) {
      const cx = (i + 0.5) * slot, h = p[i] * (YB - Y0);
      const g = sv('g', { 'data-item': 'symbol', 'data-id': 's' + (i + 1), 'data-title': 'Symbol ' + (i + 1) });
      g.append(sv('rect', { x: cx - bw / 2, y: YB - h, width: bw, height: h, fill: FluidTheme.color('accent') }));
      g.append(sv('text', { x: cx, y: YB - h - 6, 'text-anchor': 'middle', 'font-size': 15 }, fmt(p[i], 3)));
      g.append(svTex(cx, YB + 16, `s_{${i + 1}}`, { w: 60, h: 22, size: 16 }));
      svg.append(g);
    }
    barBox.replaceChildren(svg);

    // surprise bars: -log2 p_i, with the dashed line at log2 q
    const ps = p.map(v => (v > 0 ? Math.log2(1 / v) : Infinity));
    const finite = ps.filter(isFinite);
    const top = Math.max(Math.log2(q), ...finite, 1e-9) * 1.3;
    const sx = sv('svg', { viewBox: `0 0 ${W} ${SH}`, role: 'img', 'aria-label': 'Surprise bars, with a dashed line at log2 q' });
    for (let i = 0; i < q; i++) {
      const cx = (i + 0.5) * slot;
      const g = sv('g', { 'data-item': 'surprise', 'data-id': 's' + (i + 1) });
      if (isFinite(ps[i])) {
        const h = ps[i] / top * SB;
        g.append(sv('rect', { x: cx - bw / 2, y: SB - h, width: bw, height: h, fill: FluidTheme.color('grey') }));
        g.append(sv('text', { x: cx, y: SB - h - 6, 'text-anchor': 'middle', 'font-size': 15 }, fmt(ps[i], 3)));
      } else {
        g.append(svTex(cx, SB - 14, `p_{${i + 1}} = 0`, { w: slot, h: 22, size: 15 }));
      }
      g.append(svTex(cx, SB + 16, `s_{${i + 1}}`, { w: 60, h: 22, size: 16 }));
      sx.append(g);
    }
    const ly = SB - Math.log2(q) / top * SB;
    sx.append(sv('line', { x1: 0, y1: ly, x2: W, y2: ly, stroke: FluidTheme.color('ink'), 'stroke-dasharray': '6 4' }));
    sx.append(sv('line', { x1: 0, y1: SB, x2: W, y2: SB, stroke: FluidTheme.color('grey') }));
    surpBox.replaceChildren(sx);

    setTex(cap2, String.raw`$-\log_2 p_i$ per symbol. Dashed line: $\log_2 q = ${fmt(Math.log2(q))}$, the largest possible $H$.`);
    setTex(hRo, String.raw`$H = \sum_i p_i \log_2\frac{1}{p_i} = ${fmt(H2(p))}$ bits`);
  }
  PLOTS.push(render);
  render();
}

function slideEntropyCheck(box) {
  const A = [.5, .5, 0, 0, 0, 0], B = [.3, .3, .1, .1, .1, .1];
  const st = { guess: null };
  const W = 260, HH = 150, Y0 = 22, YB = 124;

      });
      col.querySelectorAll('svg').forEach(old => old.remove());
      col.append(svg);
    };

  }
  const guessBtns = ['A', 'B'].map(k => {

    setTex(b, String.raw`$${k}$ is larger`);
    b.addEventListener('click', () => { if (st.guess !== k) emitEvent('view.action', { action: 'predict', choice: k }); st.guess = k; render(); });

  function render() {

  }
  PLOTS.push(render);

}

// ---------- slide 5: Gibbs inequality ----------
function slideGibbs(box) {
  let p = [.5, .25, .25], q = [1 / 3, 1 / 3, 1 / 3];
  const COL = () => [FluidTheme.color('accent'), FluidTheme.color('hue-orange'), FluidTheme.color('hue-teal')];
  const LO = 0.01, HI = 0.98;
  const PW = 320, PH = 216, PL = 40, PT = 12;
  const X = x => PL + x / 3 * PW;
  const Y = y => PT + (2 - y) / 3.5 * PH;
  const clampY = y => Math.min(2, Math.max(-1.5, y));
  const plotBox = el('div', { class: 'plot' });
  const sp = distSliders('p', p, LO, HI, (i, v) => { p = renorm(p, i, v, LO, HI); render(); });
  const sq = distSliders('q', q, LO, HI, (i, v) => { q = renorm(q, i, v, LO, HI); render(); });
  const sumRo = el('div', { class: 'readout', 'data-item': 'readout', 'data-id': 'sum' });
  const klRo = el('div', { class: 'readout', 'data-item': 'readout', 'data-id': 'kl' });
  const termRo = el('p', { class: 'note', 'data-item': 'readout', 'data-id': 'terms' });
  box.append(
    el('div', { class: 'row' }, plotBox, el('div', { class: 'col' }, ...sp.wraps, ...sq.wraps)),
    sumRo, klRo, termRo);

  function render() {
    sp.set(p); sq.set(q);
    const svg = sv('svg', { viewBox: '0 0 380 250', role: 'img', 'aria-label': 'ln x and x minus 1 on (0, 3], with one dot per symbol' });
    let d = '';
    for (let k = 0; k <= 60; k++) {
      const x = 0.2 + (3 - 0.2) * k / 60;
      d += (k ? 'L' : 'M') + X(x).toFixed(1) + ',' + Y(clampY(Math.log(x))).toFixed(1);
    }
    svg.append(sv('line', { x1: X(0), y1: Y(0), x2: X(3), y2: Y(0), stroke: FluidTheme.color('line') }));
    svg.append(sv('line', { x1: X(0), y1: Y(-1.5), x2: X(0), y2: Y(2), stroke: FluidTheme.color('line') }));
    svg.append(sv('path', { d: d, fill: 'none', stroke: FluidTheme.color('text-2'), 'stroke-width': 2 }));
    svg.append(sv('path', { d: `M${X(0)},${Y(-1)} L${X(3)},${Y(2)}`, fill: 'none', stroke: FluidTheme.color('red'), 'stroke-width': 1.5 }));
    svg.append(svTex(X(2.6), Y(Math.log(2.6)) + 18, '\\ln x', { w: 60, h: 22, size: 17, color: FluidTheme.color('text-2') }));
    svg.append(svTex(X(2.6), Y(1.6) - 14, 'x - 1', { w: 60, h: 22, size: 17, color: FluidTheme.color('red') }));
    svg.append(svTex(X(1) + 4, Y(0) + 14, 'x = 1', { w: 60, h: 22, size: 15, color: FluidTheme.color('muted'), anchor: 'start' }));
    const xs = [];
    p.forEach((pi, i) => {
      const x = q[i] / pi;
      xs.push(x);
      const xc = Math.min(3, Math.max(0, x));
      const yl = clampY(Math.log(x)), yt = clampY(x - 1);
      const g = sv('g', { 'data-item': 'term', 'data-id': String(i + 1) });
      g.append(sv('line', { x1: X(xc), y1: Y(yl), x2: X(xc), y2: Y(yt), stroke: COL()[i], 'stroke-width': 2 }));
      g.append(sv('circle', { cx: X(xc), cy: Y(yl), r: 3 + 14 * pi, fill: COL()[i], 'fill-opacity': 0.55, stroke: COL()[i] }));
      svg.append(g);
    });
    plotBox.replaceChildren(svg);

    const S = gibbsNats(p, q);
    const sumP = p.reduce((a, b) => a + b, 0), sumQ = q.reduce((a, b) => a + b, 0);
    setTex(sumRo, String.raw`$\sum_i p_i \ln\frac{q_i}{p_i} = ${fmt(S)} \le \sum_i p_i\Big(\frac{q_i}{p_i} - 1\Big) = \sum_i q_i - \sum_i p_i = ${fmt(sumQ - sumP)}$`);
    sumRo.classList.toggle('bad', S > 1e-12);
    const KL = KL2(p, q);
    setTex(klRo, String.raw`$\mathrm{KL}(p\|q) = \sum_i p_i \log_2\frac{p_i}{q_i} = ${fmt(KL)}$ bits, never below 0`);
    setTex(termRo, String.raw`$x_i = \frac{q_i}{p_i} = ${xs.map(x => fmt(x, 3)).join(', ')}$` + (xs.some(x => x > 3) ? ' Values above 3 are drawn at the plot edge.' : ''));
  }
  PLOTS.push(render);
  render();
}

// ---------- slide 6: cross-entropy = entropy + KL ----------
function slideCross(box) {
  let p = [.5, .25, .25], q = [1 / 3, 1 / 3, 1 / 3];
  const LO = 0.01, HI = 0.98;
  const stackBox = el('div', { class: 'plot' });
  const sp = distSliders('p', p, LO, HI, (i, v) => { p = renorm(p, i, v, LO, HI); render(); });
  const sq = distSliders('q', q, LO, HI, (i, v) => { q = renorm(q, i, v, LO, HI); render(); });
  const hRo = el('div', { class: 'readout', 'data-item': 'readout', 'data-id': 'entropy' });
  const klRo = el('div', { class: 'readout', 'data-item': 'readout', 'data-id': 'kl' });
  const crossRo = el('div', { class: 'readout', 'data-item': 'readout', 'data-id': 'cross' });
  box.append(
    stackBox,
    legend([[FluidTheme.color('muted'), '$H(p)$'], [FluidTheme.color('accent'), String.raw`$\mathrm{KL}(p\|q)$`]]),
    el('div', { class: 'pair' }, el('div', { class: 'col' }, ...sp.wraps), el('div', { class: 'col' }, ...sq.wraps)),
    hRo, klRo, crossRo);

  function render() {
    sp.set(p); sq.set(q);
    const Hp = H2(p), KL = KL2(p, q), Hpq = crossH2(p, q);
    stackBox.replaceChildren(segBar(
      [[{ a: 0, b: Hp, color: FluidTheme.color('muted'), id: 'H' }, { a: Hp, b: Hp + KL, color: FluidTheme.color('accent'), id: 'KL' }]],
      0, Math.max(Hpq, Math.log2(3)), 'Stacked bar: H(p) plus KL equals H(p,q)', 'cross', Hpq));
    setTex(hRo, String.raw`$H(p) = \sum_i p_i \log_2\frac{1}{p_i} = ${fmt(Hp)}$ bits`);
    setTex(klRo, String.raw`$\mathrm{KL}(p\|q) = \sum_i p_i \log_2\frac{p_i}{q_i} = ${fmt(KL)}$ bits`);
    setTex(crossRo, String.raw`$H(p,q) = \sum_i p_i \log_2\frac{1}{q_i} = H(p) + \mathrm{KL}(p\|q) = ${fmt(Hpq)}$ bits`);
  }
  PLOTS.push(render);
  render();
}

// ---------- slide 7: code lengths define a model ----------
// ---------- slide 7b: a code word takes a share of the code space ----------
const BUDGET_SETS = {
  powers: { label: 'Powers of $1/2$', p: [1 / 2, 1 / 4, 1 / 8, 1 / 8], ls: [1, 2, 3, 3] },
  lecture: { label: 'Lecture example', p: [.4, .2, .2, .1, .1], ls: [1, 2, 3, 4, 4] },
  equal: { label: 'All equal', p: [.4, .2, .2, .1, .1], ls: [3, 3, 3, 3, 3] }
};
function slideBudget(box) {
  const W = 680, CH = 60, PH = 34, MAXL = 6;
  // The chain formula is wider than the column at the frame's size: this slide only shrinks its own formula.
  box.closest('.slide').querySelector('.formula').style.fontSize = 'clamp(20px,1.95vw,25px)';
  const COL = () => [FluidTheme.color('accent'), FluidTheme.color('hue-orange'), FluidTheme.color('hue-teal'), FluidTheme.color('hue-violet'), FluidTheme.color('hue-pink')];
  const num = x => String(+x.toFixed(4));
  const st = { set: 'powers', p: BUDGET_SETS.powers.p.slice(), ls: [2, 2, 2, 2] };

  const chipBtns = Object.keys(BUDGET_SETS).map(k => {
    const b = setTex(el('button', { class: 'chip', 'data-item': 'preset', 'data-id': k }), BUDGET_SETS[k].label);
    b.addEventListener('click', () => {
      st.set = k; st.p = BUDGET_SETS[k].p.slice(); st.ls = BUDGET_SETS[k].ls.slice();
      buildRows(); render();
      emitEvent('view.action', { action: 'preset', name: k });
    });
    return b;
  });
  const codeBox = el('div', { class: 'bbar-bar' });
  const probBox = el('div', { class: 'bbar-bar' });
  const symBox = el('div', { class: 'bsyms' });
  const kRo = el('span', { class: 'mono' });
  const codeLab = el('span', { text: 'code space' });
  const lRo = el('div', { class: 'readout', 'data-item': 'readout', 'data-id': 'L' });
  const hRo = el('div', { class: 'readout', 'data-item': 'readout', 'data-id': 'H' });
  const dRo = el('div', { class: 'readout', 'data-item': 'readout', 'data-id': 'L-H' });
  let rows = [];

  // Code space: one block per symbol, width 2^-l, in canonical order so each block starts at its codeword.
  function codeBar(ls, codes) {
    const K = kraftK(ls), S = Math.max(1, K), X = v => v / S * W;
    const svg = sv('svg', { viewBox: `0 0 ${W} ${CH}`, role: 'img', 'aria-label': 'Code space: one block of width 2 to the minus l for each symbol' });
    const defs = sv('defs'), pat = sv('pattern', { id: 'bud-hatch', width: 8, height: 8, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' });
    pat.append(sv('rect', { width: 8, height: 8, fill: FluidTheme.color('soft') }), sv('line', { x1: 0, y1: 0, x2: 0, y2: 8, stroke: FluidTheme.color('grey'), 'stroke-width': 3 }));
    defs.append(pat);
    svg.append(defs, sv('rect', { x: 0, y: 0, width: W, height: CH, fill: FluidTheme.color('panel') }));
    if (K < 1) svg.append(sv('rect', { x: X(K), y: 0, width: X(1) - X(K), height: CH, fill: 'url(#bud-hatch)' }));
    let x = 0;
    ls.map((l, i) => i).sort((a, b) => ls[a] - ls[b] || a - b).forEach(i => {
      const w = Math.pow(2, -ls[i]), x1 = X(x), x2 = X(x + w), cx = (x1 + x2) / 2;
      x += w;
      const g = sv('g', { 'data-item': 'block', 'data-id': 's' + (i + 1), 'data-title': 'Symbol ' + (i + 1) });
      g.append(sv('rect', { x: x1, y: 0, width: x2 - x1, height: CH, fill: COL()[i], stroke: FluidTheme.color('panel'), 'stroke-width': 2 }));
      if (x2 - x1 >= 22) g.append(svTex(cx, CH / 2 - 12, String.raw`s_{${i + 1}}`, { w: x2 - x1, h: 22, size: 16, cls: labCls(i) }));
      if (codes && x2 - x1 >= codes[i].length * 8 + 8) g.append(svTex(cx, CH / 2 + 13, String.raw`\mathtt{${codes[i]}}`, { w: x2 - x1, h: 22, size: 16, cls: labCls(i) }));
      svg.append(g);
    });
    svg.append(sv('rect', { x: 0, y: 0, width: W, height: CH, fill: 'none', stroke: FluidTheme.color('grey'), 'stroke-width': 1 }));
    svg.append(sv('line', { x1: X(1), y1: 0, x2: X(1), y2: CH, stroke: FluidTheme.color('ink'), 'stroke-width': 2, 'stroke-dasharray': '5 4' }));
    if (K > 1) {
      svg.append(sv('rect', { x: X(1), y: 0, width: X(K) - X(1), height: CH, fill: FluidTheme.color('red') }));
    }
    return svg;
  }
  // Probability space: one block per symbol, width p_i, in symbol order.
  function probBar() {
    const svg = sv('svg', { viewBox: `0 0 ${W} ${PH}`, role: 'img', 'aria-label': 'Probability blocks, width p_i for each symbol' });
    let x = 0;
    st.p.forEach((p, i) => {
      const x1 = x * W, x2 = (x + p) * W, cx = (x1 + x2) / 2;
      x += p;
      const g = sv('g', { 'data-item': 'block', 'data-id': 's' + (i + 1), 'data-title': 'Symbol ' + (i + 1) });
      g.append(sv('rect', { x: x1, y: 0, width: x2 - x1, height: PH, fill: COL()[i], stroke: FluidTheme.color('panel'), 'stroke-width': 2 }));
      if (x2 - x1 >= 22) g.append(svTex(cx, PH / 2, String.raw`s_{${i + 1}}`, { w: x2 - x1, h: 22, size: 16, cls: labCls(i) }));
      svg.append(g);
    });
    svg.append(sv('rect', { x: 0, y: 0, width: W, height: PH, fill: 'none', stroke: FluidTheme.color('grey'), 'stroke-width': 1 }));
    return svg;
  }
  function setLen(i, v) {
    v = Math.min(MAXL, Math.max(1, v));
    if (v === st.ls[i]) return;
    st.ls[i] = v; render();
    emitEvent('view.action', { action: 'length', symbol: 's' + (i + 1), length: v });
  }
  function buildRows() {
    rows = st.p.map((p, i) => {
      const lenRo = el('span', { class: 'mono', 'data-item': 'readout', 'data-id': 'len' + (i + 1) });
      const dec = el('button', { class: 'btn small', 'data-item': 'control', 'data-id': 'len' + (i + 1) + '-dec', text: '−' });
      const inc = el('button', { class: 'btn small', 'data-item': 'control', 'data-id': 'len' + (i + 1) + '-inc', text: '+' });
      dec.addEventListener('click', () => setLen(i, st.ls[i] - 1));
      inc.addEventListener('click', () => setLen(i, st.ls[i] + 1));
      const name = el('span', { class: 'name' }, el('i', { class: 'swatch', style: `background:${COL()[i]}` }),
        setTex(el('span', { class: 'mono' }), String.raw`$s_{${i + 1}}$`));
      const pRo = setTex(el('span', { class: 'mono' }), String.raw`$p_{${i + 1}} = ${num(p)}$`);
      const idealRo = setTex(el('span', { class: 'mono', 'data-item': 'readout', 'data-id': 'ideal' + (i + 1) }),
        String.raw`$\log_2\frac{1}{p_{${i + 1}}} = ${num(Math.log2(1 / p))}$`);
      const row = el('div', { class: 'bsym', 'data-item': 'symbol', 'data-id': 's' + (i + 1), 'data-title': 'Symbol ' + (i + 1) },
        name, pRo, el('span', { class: 'bstep' }, dec, lenRo, inc), idealRo);
      return { row, lenRo };
    });
    symBox.replaceChildren(...rows.map(r => r.row));
    probBox.replaceChildren(probBar());
  }
  function render() {
    const ls = st.ls, K = kraftK(ls), L = avgLen(st.p, ls), Hn = H2(st.p), gap = L - Hn;
    rows.forEach((r, i) => setTex(r.lenRo, String.raw`$l_{${i + 1}} = ${ls[i]}$`));
    setTex(kRo, String.raw`$K=\sum_i 2^{-l_i} = ${num(K)}$`);
    codeBox.replaceChildren(codeBar(ls, canonical(ls)));
    if (K > 1 + TOL) { setTex(codeLab, String.raw`$K>1$: not decodable`); codeLab.style.color = 'var(--red)'; }
    else { codeLab.textContent = 'code space'; codeLab.style.color = ''; }
    setTex(lRo, String.raw`$L=\sum_i p_i\, l_i = ${num(L)}$ bits`);
    setTex(hRo, String.raw`$H=\sum_i p_i\log_2\frac{1}{p_i} = ${num(Hn)}$ bits`);
    setTex(dRo, String.raw`$L-H = ${num(gap)}$ bits`);
    dRo.classList.toggle('ok', Math.abs(gap) < 1e-9);
    chipBtns.forEach(b => b.classList.toggle('on', b.dataset.id === st.set));
  }

  box.append(
    el('div', { class: 'bbar' }, el('div', { class: 'bbar-lab' }, codeLab, kRo), codeBox),
    el('div', { class: 'bbar' }, el('div', { class: 'bbar-lab' }, el('span', { text: 'probability' })), probBox),
    symBox,
    el('div', { class: 'readouts' }, lRo, hRo, dRo),
    el('div', { class: 'chips' }, ...chipBtns));
  buildRows();
  PLOTS.push(render);
  render();
}

function slideKraft(box) {
  const SYM = 5, DEF_P = [.4, .2, .2, .1, .1];
  const st = { p: DEF_P.slice(), ls: [1, 2, 3, 4, 4] };
  const rows = [];
  const symBox = el('div', { class: 'symbox' });
  for (let i = 0; i < SYM; i++) {
    const sl = sliderRow('p' + (i + 1), String.raw`$p_{${i + 1}}$`, 0.01, 0.98, st.p[i], v => { st.p = renorm(st.p, i, v, 0.01, 0.98); render(); });
    const lenV = el('span', { class: 'mono', 'data-item': 'readout', 'data-id': 'len' + (i + 1) });
    const dec = el('button', { class: 'btn small', 'data-item': 'control', 'data-id': 'len' + (i + 1) + '-dec', text: '−' });
    const inc = el('button', { class: 'btn small', 'data-item': 'control', 'data-id': 'len' + (i + 1) + '-inc', text: '+' });
    dec.addEventListener('click', () => setLen(i, st.ls[i] - 1));
    inc.addEventListener('click', () => setLen(i, st.ls[i] + 1));
    const code = el('span', { class: 'mono', 'data-item': 'readout', 'data-id': 'code' + (i + 1) });
    const qv = el('span', { class: 'mono', 'data-item': 'readout', 'data-id': 'Q' + (i + 1) });
    symBox.append(el('div', { class: 'symrow', 'data-item': 'symbol', 'data-id': 's' + (i + 1), 'data-title': 'Symbol ' + (i + 1) },
      setTex(el('span', { class: 'mono' }), String.raw`$s_{${i + 1}}$`), sl.wrap,
      el('span', { class: 'stepper' }, el('span', { class: 'mono', text: 'length' }), dec, lenV, inc),
      el('span', { class: 'mono' }, el('span', { text: 'code ' }), code),
      qv));
    rows.push({ sl, lenV, code, qv });
  }
  function setLen(i, v) { st.ls[i] = Math.min(6, Math.max(1, v)); render(); }

  const treeBox = el('div', { class: 'plot' });
  const kRo = el('div', { class: 'readout', 'data-item': 'readout', 'data-id': 'K' });
  const lRo = el('div', { class: 'readout', 'data-item': 'readout', 'data-id': 'L' });
  box.append(symBox, el('div', { class: 'row' }, treeBox, el('div', { class: 'col' }, kRo, lRo)));

  function treeSvg(codes) {
    const T = layoutTrie(codes);
    const sx = 84, sy = 44, px = 44, py = 18;
    const maxD = Math.max(...T.nodes.map(n => n.d));
    const W = px * 2 + Math.max(1, T.leaves - 1) * sx, Hh = py * 2 + maxD * sy + 30;
    const svg = sv('svg', { viewBox: `0 0 ${Math.max(W, 160)} ${Hh}`, role: 'img', 'aria-label': 'Binary code tree' });
    const P = n => [px + n.x * sx, py + n.d * sy];
    T.edges.forEach(([a, b]) => {
      const [x1, y1] = P(a), [x2, y2] = P(b);
      svg.append(sv('line', { x1, y1, x2, y2, stroke: FluidTheme.color('grey') }));
    });
    T.nodes.forEach(n => {
      const [x, y] = P(n);
      if (n.leaf !== undefined) {
        svg.append(sv('circle', { cx: x, cy: y, r: 6, fill: FluidTheme.color('accent'), 'data-item': 'leaf', 'data-id': 's' + (n.leaf + 1) }));
        svg.append(svTex(x, y + 24, String.raw`s_{${n.leaf + 1}}\ \mathtt{${codes[n.leaf]}}`, { w: 84, h: 22, size: 14 }));
      } else {
        svg.append(sv('circle', { cx: x, cy: y, r: 3, fill: FluidTheme.color('muted') }));
      }
    });
    return svg;
  }

  function render() {
    rows.forEach((r, i) => r.sl.set(st.p[i]));
    const ls = st.ls, K = kraftK(ls), Q = modelQ(ls), L = avgLen(st.p, ls);
    const codes = canonical(ls);
    rows.forEach((r, i) => {
      r.lenV.textContent = String(ls[i]);
      if (codes) setTex(r.code, String.raw`$\mathtt{${codes[i]}}$`); else r.code.textContent = 'none';
      setTex(r.qv, String.raw`$Q_{${i + 1}} = ${fmt(Q[i], 4)}$`);
    });
    const bad = K > 1 + TOL;
    setTex(kRo, bad
      ? String.raw`$K = \sum_i 2^{-l_i} = ${fmt(K)} > 1$: not uniquely decodable`
      : String.raw`$K = \sum_i 2^{-l_i} = ${fmt(K)} \le 1$: a prefix code exists`);
    kRo.classList.toggle('bad', bad);
    setTex(lRo, String.raw`$L = \sum_i p_i l_i = ${fmt(L)}$ bits per symbol`);
    treeBox.replaceChildren(codes ? treeSvg(codes)
      : setTex(el('p', { class: 'note' }), String.raw`$K > 1$: no prefix code has these lengths, so there is no tree.`));
  }
  PLOTS.push(render);
  render();
}

// ---------- slide 8: predict first, for the Cheat lengths ----------
function slideKraftCheat(box) {
  const P = [.4, .2, .2, .1, .1], LS = [2, 2, 2, 2, 3];
  const cheatL = avgLen(P, LS), cheatH = H2(P), cheatK = kraftK(LS);
  const ans = cheatL < cheatH ? 'below' : 'above';
  const st = { guess: null };
  const table = el('div', { class: 'symbox' });
  P.forEach((p, i) => {
    table.append(el('div', { class: 'trow', 'data-item': 'symbol', 'data-id': 's' + (i + 1) },
      setTex(el('span', { class: 'mono' }), String.raw`$s_{${i + 1}}$`),
      setTex(el('span'), String.raw`$p_{${i + 1}} = ${fmt(p, 2)}$`),
      setTex(el('span'), String.raw`$l_{${i + 1}} = ${LS[i]}$`),
      setTex(el('span'), String.raw`$2^{-l_{${i + 1}}} = ${fmt(Math.pow(2, -LS[i]), 3)}$`)));
  });
  const predBtns = [['above', String.raw`$L$ above $H$`], ['below', String.raw`$L$ below $H$`]].map(([k, t]) => {
    const b = el('button', { class: 'btn', 'data-item': 'control', 'data-id': 'predict-' + k });
    setTex(b, t);
    b.addEventListener('click', () => { if (st.guess !== k) emitEvent('view.action', { action: 'predict', choice: k }); st.guess = k; render(); });
    return b;
  });
  const predRo = el('div', { class: 'readout', 'data-item': 'readout', 'data-id': 'predict-result' });
  box.append(table, el('div', { class: 'actions' }, ...predBtns), predRo);

  function render() {
    predBtns.forEach(b => b.classList.toggle('on', b.dataset.id === 'predict-' + st.guess));
    if (!st.guess) { predRo.classList.remove('ok', 'bad'); setTex(predRo, 'Pick one to see the values.'); return; }
    const right = st.guess === ans;
    predRo.classList.toggle('ok', right);
    predRo.classList.toggle('bad', !right);
    setTex(predRo, String.raw`$L = ${fmt(cheatL)}$ is ${ans} $H = ${fmt(cheatH)}$, but $K = ${fmt(cheatK)} > 1$, so no uniquely decodable code has these lengths. Your guess ${right ? 'was right' : 'was wrong'}. Kraft rules this out.`);
  }
  PLOTS.push(render);
  render();
}

// ---------- slide 9: the identity L = H + KL - log2 K ----------
const KRAFT_PROOF = [
  [String.raw`$$L - H = \sum_i p_i \log_2\frac{p_i}{2^{-l_i}}$$`, String.raw`definitions of $L$ and $H$`],
  [String.raw`$$= \sum_i p_i \log_2\frac{p_i}{K\,Q_i}$$`, String.raw`$2^{-l_i} = K\,Q_i$, by the definition of $Q$`],
  [String.raw`$$= \mathrm{KL}(p\|Q) - \log_2 K$$`, 'split the log of the quotient'],
  [String.raw`$$L - H \ge \mathrm{KL}(p\|Q) \ge 0$$`, String.raw`$-\log_2 K \ge 0$ when $K \le 1$`]
];
function slideKraftGap(box) {
  const P = [.4, .2, .2, .1, .1];
  const H = H2(P);
  const XMAX = 3.2;                                      // chart scale: 0 to 3.2 bits
  const xp = v => (v / XMAX * 100) + '%';
  const PRESETS = [['huffman', 'Huffman', [1, 2, 3, 4, 4]], ['huffman-alt', 'Huffman alt', [2, 2, 2, 3, 3]],
    ['fixed', 'Fixed', [3, 3, 3, 3, 3]], ['cheat', 'Cheat', [2, 2, 2, 2, 3]]];
  const COL = () => ({ H: FluidTheme.color('muted'), KL: FluidTheme.color('accent'), over: FluidTheme.color('hue-orange'), bad: FluidTheme.color('red') });
  const st = { preset: 'huffman' };
  const f2 = x => x.toFixed(2);
  const fk = x => String(Number(x.toFixed(4)));          // 0.5, 1.125, 1 (no trailing zeros)

  const chips = PRESETS.map(([k, t]) => {
    const b = el('button', { class: 'chip', 'data-item': 'preset', 'data-id': k, text: t });
    b.addEventListener('click', () => { st.preset = k; render(); emitEvent('view.action', { action: 'preset', name: k }); });
    return b;
  });
  const chart = el('div', { class: 'kg-chart' });
  const table = el('div', { class: 'kg-table' });
  box.append(el('div', { class: 'kg' }, el('div', { class: 'chips' }, ...chips), chart, table));

  function render() {
    const ls = PRESETS.find(p => p[0] === st.preset)[2];
    chips.forEach(b => b.classList.toggle('on', b.dataset.id === st.preset));
    const K = kraftK(ls), Q = modelQ(ls), L = avgLen(P, ls);
    const KL = KL2(P, Q), nlk = -Math.log2(K), codes = canonical(ls);
    const CUT = 1e-9;

    // Waterfall rows: H, then + KL, then - log2 K, ending at L.
    const rows = [
      { id: 'H', head: String.raw`$H = ${f2(H)}$`, why: 'the entropy, fixed by $p$', a: 0, b: H, color: COL().H },
      { id: 'KL', head: String.raw`$\mathrm{KL}(p\|Q) = ${f2(KL)}$`, why: 'wasted by lengths that do not match $p$', a: H, b: H + KL, color: COL().KL }
    ];
    if (nlk > CUT) rows.push({ id: 'nlk', head: String.raw`$-\log_2 K = ${f2(nlk)}$`, why: 'unused code space', a: H + KL, b: L, color: COL().over });
    else if (nlk < -CUT) rows.push({ id: 'nlk', head: String.raw`$-\log_2 K = ${f2(nlk)}$`, why: 'borrowed code space: not decodable', a: H + KL, b: L, color: COL().bad, bad: true });
    else rows.push({ id: 'nlk', head: String.raw`$-\log_2 K = 0.00$`, why: 'no unused space: $K = 1$', a: null });

    const kids = [];
    const grid = el('div', { class: 'kg-over', style: 'grid-row:1 / 5;grid-column:2' });
    [0, 1, 2, 3].forEach(v => grid.append(el('i', { style: `left:${xp(v)}` })));
    kids.push(grid);
    rows.forEach((r, i) => {
      kids.push(el('div', { class: 'kg-head' + (r.bad ? ' bad' : ''), style: `grid-row:${i + 1};grid-column:1`, 'data-item': 'row', 'data-id': r.id },
        setTex(el('div', { class: 'hd1' }), r.head), setTex(el('div', { class: 'hd2' }), r.why)));
      const track = el('div', { class: 'kg-track', style: `grid-row:${i + 1};grid-column:2` });
      if (r.a !== null) {
        track.append(el('div', { class: 'kg-bar', 'data-item': 'bar', 'data-id': r.id,
          style: `left:${xp(Math.min(r.a, r.b))};width:${Math.abs(r.b - r.a) / XMAX * 100}%;background:${r.color}` }));
      }
      kids.push(track);
    });
    kids.push(el('div', { class: 'kg-head', style: 'grid-row:4;grid-column:1', 'data-item': 'row', 'data-id': 'L' },
      setTex(el('div', { class: 'hd1' }), String.raw`$L = ${f2(L)}$`),
      setTex(el('div', { class: 'hd2' }), 'the average code length you get')));
    kids.push(el('div', { class: 'kg-track', style: 'grid-row:4;grid-column:2' }));
    kids.push(el('div', { class: 'kg-axis-lab', style: 'grid-row:5;grid-column:1' }, 'bits'));
    const axis = el('div', { class: 'kg-axis', style: 'grid-row:5;grid-column:2' });
    [0, 1, 2, 3].forEach(v => axis.append(setTex(el('span', { style: `left:${xp(v)}` }), `$${v}$`)));
    kids.push(axis);
    // The black line marks L and runs through every row.
    kids.push(el('div', { class: 'kg-over', style: 'grid-row:1 / 5;grid-column:2' },
      el('div', { class: 'kg-marker', style: `left:${xp(L)}`, 'data-item': 'bar', 'data-id': 'L' })));
    chart.replaceChildren(...kids);

    const th = (t) => setTex(el('span'), t);
    const head = el('div', { class: 'kg-tr th' }, th('$s_i$'), th('$p_i$'), th('$l_i$'), th('codeword'), th('$2^{-l_i}$'));
    const body = P.map((p, i) => el('div', { class: 'kg-tr', 'data-item': 'symbol', 'data-id': 's' + (i + 1) },
      setTex(el('span', { class: 'mono' }), String.raw`$s_{${i + 1}}$`),
      el('span', { text: String(p) }),
      el('span', { text: String(ls[i]) }),
      codes ? el('span', { class: 'mono', text: codes[i] }) : setTex(el('span', { class: 'bad' }), 'none: $K > 1$'),
      el('span', { text: fk(Math.pow(2, -ls[i])) })));
    const foot = el('div', { class: 'kg-tr foot' },
      th('$\\sum$'),
      el('span', { text: '1' }),
      setTex(el('span', { 'data-item': 'readout', 'data-id': 'L' }), String.raw`$L = ${f2(L)}$`),
      el('span'),
      setTex(el('span', { 'data-item': 'readout', 'data-id': 'K' }), String.raw`$K = ${fk(K)}$`));
    table.replaceChildren(head, ...body, foot);
  }
  PLOTS.push(render);
  render();
}

// Side column for kraft-gap: the identity, try-steps, the derivation behind a button, the takeaway.
function kraftGapSide(side) {
  side.classList.add('scroll');
  const tries = [
    'Click Huffman. $L$ is just above $H$. The small blue part is the waste.',
    'Click Fixed. Every word has 3 bits. Blue and orange grow.',
    'Click Cheat. $L < H$. Look at $K$: which rule did it break?'
  ];
  const alg = el('div', { class: 'alg', hidden: true });
  revealLines(alg, KRAFT_PROOF, 'line-', 'next-line', true);
  const algBtn = el('button', { class: 'btn alg-btn', 'data-item': 'control', 'data-id': 'show-algebra', text: 'Show the algebra' });
  algBtn.addEventListener('click', () => {
    alg.hidden = !alg.hidden;
    algBtn.textContent = alg.hidden ? 'Show the algebra' : 'Hide the algebra';
    algBtn.classList.toggle('on', !alg.hidden);
  });
  side.append(
    el('div', { class: 'formula', style: 'font-size:clamp(22px,2vw,30px)', text: String.raw`$$L = H + \mathrm{KL}(p\|Q) - \log_2 K$$` }),
    el('ol', { class: 'tries' }, ...tries.map(t => setTex(el('li', { 'data-item': 'try' }), t))),
    el('div', { class: 'actions' }, algBtn),
    alg,
    setTex(el('p', { class: 'takeaway', 'data-item': 'takeaway' }),
      String.raw`Both extra parts are $\ge 0$ for any decodable code, so $L \ge H$. Hamming calls this Shannon's noiseless coding theorem.`));
}

const $ = s => document.querySelector(s);
// Session events. Optional: an older server has no fluid.emit, and then nothing is sent.
function emitEvent(kind, data) {
  if (!window.fluid || typeof fluid.emit !== 'function') return;
  Promise.resolve().then(() => fluid.emit(kind, data)).catch(() => {});
}
// PLOTS: the redraw of each widget on the current slide. A theme switch redraws them; their state is kept.
const PLOTS = [];
window.addEventListener('fluid-themechange', () => PLOTS.forEach(f => f()));
let cur = 0;
function goTo(i) {
  const was = cur;
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  const stage = $('#stage');
  stage.innerHTML = '';
  PLOTS.length = 0;
  const widget = el('div', { class: 'widget' });
  const side = el('div', { class: 'side' },
    el('div', { class: 'tag', text: s.tag }),
    el('h2', { text: s.head || s.title }),
    s.formula ? el('div', { class: 'formula', text: s.formula }) : null,
    ...s.lines.map(t => el('p', { class: 'line-txt', text: t })));
  if (s.sideMount) s.sideMount(side);   // optional: a slide may add more to its text column
  const sec = el('section', { class: 'slide', 'data-item': 'step', 'data-id': s.id, 'data-title': s.title }, widget, side);
  stage.append(sec);
  stage.scrollTop = 0;
  s.mount(widget);
  tex(sec);
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, i) => d.classList.toggle('on', i === cur));
  if (cur !== was) emitEvent('view.step', { step: s.id });
}
// A cue is a state: go to the named step, and do nothing if it is already shown.
function onCue(msg) {
  const i = SLIDES.findIndex(s => s.id === (msg && msg.step));
  if (i >= 0 && i !== cur) goTo(i);
}
(function init() {
  const dots = $('#dots');
  SLIDES.forEach((s, i) => {
    const b = el('button', { 'aria-label': 'Go to step ' + (i + 1) + ': ' + s.title, title: s.title });
    b.addEventListener('click', () => goTo(i));
    dots.append(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=text],input[type=range],textarea,select')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof fluid.onCue === 'function') fluid.onCue(onCue);
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primer · Feedback: recursive filters and amplifiers</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../../components/theme.js"></script>
<style>
/* Colors come from the theme palette (../../components/theme.js): one accent (blue), amber only for proof lights, red only for a failed check. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft);
  --red:var(--pal-red); --redbg:var(--pal-red-bg);
  --u:clamp(16px,1.35vw,20px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 24px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(6px,1vh,12px) 24px}
footer{display:flex;align-items:center;gap:10px;padding:8px 24px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Slide frame: widget on the left (3/5), text on the right (2/5). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(18px,2.4vw,40px)}
.widget{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(6px,1vh,10px);overflow:hidden}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(6px,1.1vh,12px);overflow:hidden}
.tag{font:13px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(20px,1.9vw,28px);line-height:1.2;margin:0;font-weight:650}
.question{margin:0;font-size:clamp(16px,1.3vw,18px);font-weight:600}
.case{margin:0;font-size:16px}
.formula{font-size:clamp(18px,1.8vw,26px)}
.formula .katex-display{margin:.2em 0}
.sym{margin:0;font-size:16px;color:var(--muted)}
.tries{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.tries li::marker{color:var(--accent);font-weight:600}
.takeaway{margin:0;padding:10px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}
.next{margin:0;font-size:16px;color:var(--muted)}

/* Controls, readouts, legend */
.sliders{display:flex;gap:8px 24px;flex-wrap:wrap;width:100%;align-items:center}
.btnrow{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center}
.btnrow .lab{font-size:16px;color:var(--muted);margin-right:2px}
.slide-ctl{display:flex;align-items:center;gap:8px;font-size:16px;flex-wrap:wrap}
.slide-ctl input{width:clamp(120px,12vw,190px);vertical-align:middle;accent-color:var(--accent)}
.slide-ctl .val{min-width:44px}
.btn{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--pal-panel);color:var(--fg);border-radius:8px;cursor:pointer;font-size:16px}
.btn.on{background:var(--chip);border-color:var(--accent);color:var(--pal-accent-deep)}
.btn:disabled{opacity:.4;cursor:default}
.readouts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.readout{flex:1 1 150px;min-width:0;padding:4px 10px;border-radius:10px;background:var(--pal-soft);font-size:16px;overflow-wrap:anywhere;overflow:hidden}
.readout .k{color:var(--pal-text-2);font-size:15px}
.readout .val{font-size:17px;font-weight:600;line-height:1.55}
.readout.bad{background:var(--redbg);color:var(--red)}
.readout.bad .k{color:var(--red)}
.legend{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:16px;color:var(--pal-text-2);align-items:center}
.sw{display:inline-block;width:22px;height:0;vertical-align:middle;margin-right:6px}
.chip{display:inline-block;width:16px;height:12px;vertical-align:middle;margin-right:6px;border-radius:2px}
.ring{display:inline-block;width:13px;height:13px;vertical-align:middle;margin-right:6px;border-radius:50%;border:2px solid var(--pal-ink)}

/* Plots fill the height left in the widget column */
.fill{flex:1 1 0;min-height:90px;position:relative;width:100%}
.fill>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.name i{font-style:italic}
.takeholder{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.takeholder .takeaway{align-self:stretch}

/* Proof slides: test and picture on the left, the proof (fl-proof-steps) on the right */
.slide.proof-slide{grid-template-columns:minmax(0,11fr) minmax(0,9fr)}
.slide.proof-slide .side{justify-content:flex-start}
.fill.proofpic{min-height:150px}
.slide.proof-slide .slide-ctl input{width:clamp(90px,9vw,140px)}
.slide.proof-slide .sliders{gap:6px 16px}
.slide.proof-slide .btn{padding:4px 10px}
.part{margin:0;font-weight:600;color:var(--muted)}
.test{display:flex;flex-direction:column;gap:3px}
.test .tries{gap:3px}
.model{margin:0;padding:8px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}

/* Short windows (1100x620 and similar): tighter spacing, body text stays 16px */
@media (max-height: 680px){
  header{padding-top:4px}
  #stage{padding:4px 24px}
  footer{padding:4px 24px}
  .widget{gap:5px}
  .side{gap:4px}
  .tries{gap:2px}
  .sym,.tries,.takeaway,.case{line-height:1.25}
  .takeaway{padding:6px 10px}
  .formula{font-size:20px}
  h2{font-size:20px}
  .question{font-size:16px}
  .fill{min-height:80px}
  .readout{padding:2px 8px}
  .readout .val{line-height:1.5}
  .fill.proofpic{min-height:130px}
  .model{padding:5px 10px}
  .test .tries{gap:1px}
  .btn{padding:4px 10px}
}
</style>
</head>
<body>
<header>Primer · Feedback: recursive filters and amplifiers</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script src="../../components/proof-steps.js"></script>
<script>
// ---------- palette and redraw ----------
// COL holds the palette for the SVG being drawn; plotBox reads it at every paint, so a draw always uses the
// current theme. A theme switch redraws the current slide's plots and keeps every control's state.
let COL = {};
const PAL_NAMES = ['bg', 'ink', 'fg', 'text-2', 'muted', 'muted-2', 'grey', 'guide', 'grid', 'line', 'panel', 'soft', 'soft-2',
  'accent', 'accent-2', 'accent-3', 'accent-deep', 'accent-tint', 'accent-soft', 'on-accent',
  'amber', 'amber-bg', 'amber-ink', 'red'];
function readPalette() {
  const o = {};
  for (const n of PAL_NAMES) o[n.replace(/-(\w)/g, (_, c) => c.toUpperCase())] = FluidTheme.color(n);
  return o;
}
let PLOTS = [];
window.addEventListener('fluid-themechange', () => PLOTS.forEach(p => p.redraw()));
// A palette color with alpha, e.g. rgbaOf(COL.accent, 0.5). Takes #rgb, #rrggbb or rgb(...).
function rgbaOf(c, a) {
  let r = 0, g = 0, b = 0;
  const m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(c.trim());
  if (m) {
    let hx = m[1]; if (hx.length === 3) hx = hx.split('').map(x => x + x).join('');
    const n = parseInt(hx, 16); r = n >> 16; g = (n >> 8) & 255; b = n & 255;
  } else {
    const v = (c.match(/[\d.]+/g) || [0, 0, 0]).map(Number); [r, g, b] = v;
  }
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

// ---------- DOM helpers ----------
const $ = s => document.querySelector(s);
const NSV = 'http://www.w3.org/2000/svg', NHT = 'http://www.w3.org/1999/xhtml';
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false }], throwOnError: false };
// Render $...$ in a node. If the CDN did not load, the text stays as typed.
function tex(node) { if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH); return node; }
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function hh(tag, cls, ...kids) { const e = h(tag, cls); for (const k of kids) if (k) e.append(k); return e; }
function mark(e, kind, id, title) { e.dataset.item = kind; if (id != null) e.dataset.id = id; if (title != null) e.dataset.title = title; return e; }
function emit(kind, data) {
  try { if (window.fluid && typeof window.fluid.emit === 'function') Promise.resolve(window.fluid.emit(kind, data)).catch(() => {}); }
  catch (e) { /* the view works without the bridge */ }
}
// Fixed decimals, with no minus sign on zero.
function fx(x, d) { const y = Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x; return y.toFixed(d); }
// A short number: up to d decimals, trailing zeros dropped.
function sn(x, d) { return String(+fx(x, d == null ? 3 : d)); }
// Common fractions as TeX, else a short decimal.
function fracTex(v) {
  const F = [[1 / 3, '\\tfrac13'], [-1 / 3, '-\\tfrac13'], [0.5, '\\tfrac12'], [-0.5, '-\\tfrac12'], [0.25, '\\tfrac14'], [2 / 3, '\\tfrac23']];
  for (const [x, t] of F) if (Math.abs(v - x) < 1e-9) return t;
  return sn(v, 3);
}
// Plain-text cell label: 1/3, 1/2, 1/4 as glyphs, blank for 0.
function cellText(v) {
  if (Math.abs(v) < 1e-9) return '';
  const G = [[1 / 3, '⅓'], [0.5, '½'], [0.25, '¼'], [-0.5, '−½']];
  for (const [x, t] of G) if (Math.abs(v - x) < 1e-9) return t;
  return sn(v, 2).replace('-', '−');
}

// ---------- controls ----------
// A labelled range input. o: {id, min, max, step, value, fmt(v) -> TeX-ready text, onInput(v)}.
function ctl(label, o) {
  const wrap = h('label', 'slide-ctl');
  const lab = setTex(h('span'), label);
  const inp = h('input');
  inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step; inp.value = o.value;
  mark(inp, 'control', o.id, o.id);
  const val = h('span', 'val');
  const show = v => setTex(val, o.fmt(v));
  inp.addEventListener('input', () => { show(+inp.value); o.onInput(+inp.value); });
  show(o.value);
  wrap.append(lab, inp, val);
  return { el: wrap, input: inp, set(v) { inp.value = v; show(v); } };
}
// A row of buttons that pick one choice. choices: [[id, label], ...]; getCur() gives the current id.
function choiceRow(label, choices, getCur, onPick) {
  const row = hh('div', 'btnrow', label ? setTex(h('span', 'lab'), label) : null);
  const btns = choices.map(([id, text]) => {
    const b = mark(h('button', 'btn'), 'control', id);
    setTex(b, text);
    b.addEventListener('click', () => { onPick(id); paint(); });
    row.append(b);
    return [id, b];
  });
  function paint() { btns.forEach(([id, b]) => b.classList.toggle('on', id === getCur())); }
  paint();
  return { el: row, paint };
}
function button(id, label, onClick) {
  const b = mark(h('button', 'btn'), 'control', id);
  setTex(b, label);
  b.addEventListener('click', onClick);
  return b;
}
// A readout box: label and value are TeX-ready text.
function readout(id, label) {
  const box = mark(h('div', 'readout'), 'readout', id);
  const k = setTex(h('div', 'k'), label);
  const v = h('div', 'val');
  box.append(k, v);
  return { el: box, set(text, bad) { setTex(v, text); box.classList.toggle('bad', !!bad); }, label(t) { setTex(k, t); } };
}
// Legend: items {color (CSS), text, kind: 'line' | 'dash' | 'chip' | 'ring'}.
function legend(items) {
  const d = h('div', 'legend');
  for (const it of items) {
    const s = h('span');
    let sw;
    if (it.kind === 'chip') { sw = h('span', 'chip'); sw.style.background = it.color; }
    else if (it.kind === 'ring') { sw = h('span', 'ring'); if (it.color) sw.style.borderColor = it.color; }
    else { sw = h('span', 'sw'); sw.style.borderTop = '3px ' + (it.kind === 'dash' ? 'dashed' : 'solid') + ' ' + it.color; }
    s.append(sw, setTex(h('span'), it.text));
    d.append(s);
  }
  return d;
}
function sym(text) { return setTex(h('p', 'sym'), text); }
function caseLine(text) { return setTex(h('p', 'case'), text); }
function nameLine(html) { const p = h('p', 'sym name'); p.innerHTML = html; return tex(p); }
function triesList(items) { return hh('ol', 'tries', ...items.map(t => setTex(h('li'), t))); }
// The takeaway appears after the first try: on the first click, drag or slider move in the widget, or on "Show".
function takeBox(widget, text) {
  const holder = h('div', 'takeholder');
  const btn = mark(h('button', 'btn'), 'control', 'show-takeaway');
  setTex(btn, 'Show the takeaway');
  const tk = setTex(h('p', 'takeaway'), text);
  tk.hidden = true;
  const show = () => { tk.hidden = false; btn.hidden = true; };
  btn.addEventListener('click', show);
  for (const ev of ['input', 'click', 'pointerdown']) widget.addEventListener(ev, show);
  holder.append(btn, tk);
  return holder;
}
// The side column of a formula slide, after the frame's tag, title, question and formula.
// o: {sym, name, tries, take, next}. The everyday case (o.case) goes right under the question.
function sideStd(widget, side, o) {
  if (o.case) side.querySelector('.question').after(caseLine(o.case));
  if (o.sym) side.append(sym(o.sym));
  if (o.name) side.append(nameLine(o.name));
  if (o.tries) side.append(triesList(o.tries));
  if (o.take) side.append(takeBox(widget, o.take));
  if (o.next) side.append(setTex(h('p', 'next'), o.next));
}

// ---------- SVG helpers ----------
function svgNode(tag, attrs, parent) {
  const e = document.createElementNS(NSV, tag);
  for (const k in attrs) if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function svgRoot(w, ht) { return svgNode('svg', { viewBox: '0 0 ' + w + ' ' + ht, role: 'img', 'font-family': 'system-ui, sans-serif', 'font-size': 14 }); }
function svgText(parent, x, y, s, attrs) {
  const t = svgNode('text', Object.assign({ x: x, y: y, fill: COL.muted, 'font-size': 14 }, attrs || {}), parent);
  t.textContent = s;
  return t;
}
// A KaTeX label inside an SVG: a foreignObject holding a rendered formula. o: {w, anchor, size, fill, bg, bold}.
function svgTex(parent, x, y, s, o) {
  o = o || {};
  const w = o.w || 220, ht = o.ht || 26, anchor = o.anchor || 'middle';
  const x0 = anchor === 'end' ? x - w : anchor === 'start' ? x : x - w / 2;
  const fo = svgNode('foreignObject', { x: x0, y: y - ht / 2, width: w, height: ht }, parent);
  const d = document.createElementNS(NHT, 'div');
  const jc = anchor === 'end' ? 'flex-end' : anchor === 'start' ? 'flex-start' : 'center';
  d.setAttribute('style', 'display:flex;align-items:center;height:100%;white-space:nowrap;font-size:' +
    (o.size || 15) + 'px;color:' + (o.fill || COL.text2) + ';justify-content:' + jc + (o.bold ? ';font-weight:600' : ''));
  const span = document.createElementNS(NHT, 'span');
  span.textContent = s;
  if (o.bg) span.setAttribute('style', 'background:' + o.bg + ';border-radius:5px;padding:1px 6px');
  d.appendChild(span);
  fo.appendChild(d);
  tex(span);
  return fo;
}
// The same label with a halo in the page color, so it reads over a curve or bars.
function haloTex(parent, x, y, s, o) {
  const fo = svgTex(parent, x, y, s, o);
  fo.firstChild.style.textShadow = '0 0 3px ' + COL.bg + ', 0 0 3px ' + COL.bg + ', 0 0 2px ' + COL.bg;
  return fo;
}
function line(svg, x1, y1, x2, y2, o) { return svgNode('line', Object.assign({ x1, y1, x2, y2 }, o || {}), svg); }
function dot(svg, x, y, r, fill, o) { return svgNode('circle', Object.assign({ cx: x, cy: y, r, fill }, o || {}), svg); }
function rect(svg, x, y, w, ht, o) { return svgNode('rect', Object.assign({ x, y, width: Math.max(0, w), height: Math.max(0, ht) }, o || {}), svg); }
// An arrow with a head. o: {color, w, dash, id}.
function arrow(svg, x1, y1, x2, y2, o) {
  const g = svgNode('g', { 'data-item': 'mark', 'data-id': o.id }, svg);
  svgNode('line', { x1, y1, x2, y2, stroke: o.color, 'stroke-width': o.w || 2.5, 'stroke-dasharray': o.dash }, g);
  const len = Math.hypot(x2 - x1, y2 - y1), hl = Math.min(9, len * 0.45);
  if (len > 3) {
    const a = Math.atan2(y2 - y1, x2 - x1), s = hl / 2;
    const bx = x2 - hl * Math.cos(a), by = y2 - hl * Math.sin(a);
    svgNode('polygon', { points: [[x2, y2], [bx - s * Math.sin(a), by + s * Math.cos(a)], [bx + s * Math.sin(a), by - s * Math.cos(a)]].map(p => p.join(',')).join(' '), fill: o.color }, g);
  }
  return g;
}
// Amber marks what the newest proof line is about.
function glowRect(svg, x, y, w, ht, pad) {
  pad = pad == null ? 4 : pad;
  return rect(svg, x - pad, y - pad, w + 2 * pad, ht + 2 * pad, { rx: 6, fill: COL.amberBg, stroke: COL.amber, 'stroke-width': 1.5 });
}
function glowLine(svg, d, wdt) { return svgNode('path', { d, fill: 'none', stroke: COL.amberBg, 'stroke-width': wdt || 10, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, svg); }
// The top row of a proof picture: what the amber part is while a line is lit, else a plain hint.
function picCaption(svg, W, litText, plainText) {
  if (litText) return svgTex(svg, W / 2, 12, litText, { w: W - 4, size: 15, fill: COL.amberInk, bg: COL.amberBg });
  if (plainText) return svgTex(svg, 4, 12, plainText, { w: W - 8, anchor: 'start', size: 15, fill: COL.muted });
  return null;
}
// A plot that takes the height left in its parent. draw(svg, W, H) runs on every resize and redraw.
function plotBox(draw, cls, weight) {
  const wrap = h('div', 'fill' + (cls ? ' ' + cls : ''));
  if (weight) wrap.style.flex = weight + ' 1 0';
  let key = '';
  const paint = force => {
    const w = Math.floor(wrap.clientWidth), ht = Math.floor(wrap.clientHeight);
    if (w < 60 || ht < 40) return;
    if (!force && key === w + 'x' + ht) return;
    key = w + 'x' + ht;
    COL = readPalette();
    const svg = svgRoot(w, ht);
    draw(svg, w, ht);
    wrap.replaceChildren(svg);
  };
  new ResizeObserver(() => paint(false)).observe(wrap);
  const plot = { wrap, redraw: () => paint(true) };
  PLOTS.push(plot);
  return plot;
}
// Axes for a plot. o: {x0, x1, y0, y1, L, R, T, B}. y values outside the range are clamped.
function plotFrame(svg, W, H, o) {
  const L = o.L == null ? 46 : o.L, R = o.R == null ? 14 : o.R, T = o.T == null ? 12 : o.T, B = o.B == null ? 40 : o.B;
  const pw = W - L - R, ph = H - T - B, base = T + ph;
  const X = x => L + (x - o.x0) / (o.x1 - o.x0) * pw;
  const Y = y => base - (Math.max(o.y0, Math.min(o.y1, y)) - o.y0) / (o.y1 - o.y0) * ph;
  line(svg, L, base, W - R, base, { stroke: COL.grey });
  line(svg, L, T, L, base, { stroke: COL.grey });
  if (o.y0 < 0 && o.y1 > 0) line(svg, L, Y(0), W - R, Y(0), { stroke: COL.grey, 'stroke-dasharray': '2 3' });
  return { X, Y, L, R, T, B, pw, ph, base, W, H };
}
function pathOf(P, pts) { return pts.map((p, i) => (i ? 'L' : 'M') + P.X(p[0]).toFixed(1) + ' ' + P.Y(p[1]).toFixed(1)).join(''); }
// Stems for values at n = 0 .. len-1. o: {vals, lo, hi, color, id, label, labelFill, values (print values),
// rings (values drawn as rings), band(n) -> true to shade, bandColor, hollow(n) -> true for an open dot, L, T, B, ticks}.
function stems(svg, W, H, o) {
  const len = o.vals.length, L = o.L == null ? 34 : o.L, R = o.R == null ? 10 : o.R, T = o.T == null ? 30 : o.T, B = o.B == null ? 22 : o.B;
  const cw = (W - L - R) / len;
  const X = n => L + (n + 0.5) * cw;
  const Y = v => T + (o.hi - Math.max(o.lo, Math.min(o.hi, v))) / (o.hi - o.lo) * (H - T - B);

let cur = 0, shownId = null, endSent = false;
function goTo(i) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));

  shownId = s.id;

  PLOTS = [];
  const widget = h('div', 'widget');

    h('div', 'tag', s.tag),

    s.formula ? setTex(h('div', 'formula'), s.formula) : null);
  const sec = mark(h('section', 'slide' + (s.proof ? ' proof-slide' : '')), 'step', s.id, s.title.replace(/\$/g, ''));

function onCue(msg) {

    const b = h('button');

    b.addEventListener('click', () => goTo(i));

  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],input[type=number],textarea,select')) return;

  svgTex(svg, (xs + r + bx) / 2, ym - 18, 'sees $' + sciTex(1 / (1 + A * b), 3) + '$', { w: bx - xs - r + 10, size: 14, fill: COL.ink });

  wire(svg, [[bx + bw, ym], [W - 6, ym]], { color: COL.accent, w: 2.5 });
  svgTex(svg, W - 4, ym - 20, '$y=' + gTex(G) + '$', { w: W - bx - bw - 10, anchor: 'end', size: 15, fill: COL.accentDeep, bold: true });
  svgNode('path', { d: `M${xo} ${ym} L${xo} ${yb} L${W * 0.6} ${yb}`, fill: 'none', stroke: COL.ink, 'stroke-width': 2 }, svg);
  blockBox(svg, W * 0.44, yb - 19, W * 0.16, 38, '$\\times\\beta$', { id: 'beta', size: 16 });
  wire(svg, [[W * 0.44, yb], [xs, yb], [xs, ym + r + 1]]);
  if (!o.compact) svgTex(svg, W * 0.62, yb + 26, 'fed back: $\\beta y=' + gTex(b * G) + '$', { w: W * 0.38, anchor: 'start', size: 14, fill: COL.text2 });
}
function slideAmplifier(widget, side) {
  let p = 8, bi = 2;
  const sA = ctl('$A$', { id: 'p', min: 1, max: 9, step: 0.1, value: p, fmt: v => '$10^{' + sn(v, 1) + '}$', onInput: v => { p = v; update(); } });
  const pick = choiceRow('$\\beta$:', BETAS.map((x, i) => ['b' + i, x[1]]), () => 'b' + bi, id => { bi = +id.slice(1); update(); });
  const rG = readout('G', 'the gain $G=y/x$'), rH = readout('G-half', 'the gain if $A$ halves');
  const diag = plotBox((svg, W, H) => drawAmp(svg, W, H, Math.pow(10, p), BETAS[bi][0]), null, 0.8);
  const plot = plotBox((svg, W, H) => {
    const L = 58, R = 16, T = 30, Bm = 34, X = q => L + (q - 1) / 8 * (W - L - R), Y = q => T + (9 - q) / 9 * (H - T - Bm);
    for (let q = 0; q <= 9; q += 3) { line(svg, L, Y(q), W - R, Y(q), { stroke: COL.grid }); svgTex(svg, L - 6, Y(q), '$10^{' + q + '}$', { w: 50, anchor: 'end', size: 13, fill: COL.muted }); }
    for (let q = 1; q <= 9; q += 2) svgTex(svg, X(q), H - 14, '$10^{' + q + '}$', { w: 50, size: 13, fill: COL.muted });
    line(svg, L, Y(0), W - R, Y(0), { stroke: COL.grey }); line(svg, L, T, L, Y(0), { stroke: COL.grey });
    BETAS.forEach(([b], i) => {
      const pts = []; for (let k = 0; k <= 160; k++) { const q = 1 + 8 * k / 160; pts.push((k ? 'L' : 'M') + X(q).toFixed(1) + ' ' + Y(Math.log10(ampG(Math.pow(10, q), b))).toFixed(1)); }
      svgNode('path', { d: pts.join(''), fill: 'none', stroke: i === bi ? COL.accent : COL.grey, 'stroke-width': i === bi ? 2.8 : 1.4, 'data-item': 'mark', 'data-id': 'curve-' + i }, svg);
    });
    const b = BETAS[bi][0];
    if (b > 0) { line(svg, L, Y(Math.log10(1 / b)), W - R, Y(Math.log10(1 / b)), { stroke: COL.ink, 'stroke-dasharray': '6 4' }); haloTex(svg, L + 8, Y(Math.log10(1 / b)) - 13, 'dashed: $1/\\beta=' + sn(1 / b, 2) + '$', { w: 180, anchor: 'start', size: 14, fill: COL.ink }); }
    dot(svg, X(p), Y(Math.log10(ampG(Math.pow(10, p), b))), 6.5, COL.accent, { 'data-item': 'mark', 'data-id': 'now' });
    svgTex(svg, L, 12, 'blue: the gain $G$ against the amplifier’s own gain $A$ (both on log axes); grey: other $\\beta$', { w: W - L, anchor: 'start', size: 14, fill: COL.accentDeep });
  }, null, 1.2);
  function update() {
    const A = Math.pow(10, p), b = BETAS[bi][0];
    rG.set('$' + gTex(ampG(A, b)) + '$'); rH.set('$' + gTex(ampG(A / 2, b)) + '$');
    pick.paint(); diag.redraw(); plot.redraw();
  }
  widget.append(hh('div', 'sliders', sA.el, pick.el), diag.wrap, plot.wrap, hh('div', 'readouts', rG.el, rH.el));
  sideStd(widget, side, {
    case: 'Amplifier tubes drifted with age and heat. Harold Black’s idea, on a Hudson River ferry (L20 25:07): feed part of the output back and subtract it from the input.',
    sym: String.raw`$A$: the amplifier’s own gain, huge and drifting. $\beta$: the part of the output fed back, set by two resistors. The amplifier sees only $x-\beta y$.`,
    tries: [
      String.raw`Keep $A=10^8$, $\beta=0.1$: $G=\frac{10^8}{1+10^7}=9.999999$, almost exactly $\frac1\beta=10$.`,
      String.raw`Read the second box: if $A$ halves, $G=9.999998$. The amplifier changed by half; the gain, in the 7th digit.`,
      String.raw`Press $\beta=0$, no feedback: $G=A$, and every drift of $A$ shows.`],
    take: String.raw`With strong negative feedback the gain is $\frac1\beta$, set by the resistors, and the amplifier’s drift hardly matters.` });
  update();
}

// ---------- 7. Why it's true: G = A/(1 + A beta), close to 1/beta ----------
function slideWhyAmp(widget, side) {
  let p = 2, lit = '';
  const b = 0.1;
  const sA = ctl('$A$', { id: 'p', min: 0, max: 8, step: 0.1, value: p, fmt: v => '$10^{' + sn(v, 1) + '}$', onInput: v => { p = v; plot.redraw(); } });
  const draw = (svg, W, H) => {
    const CAP = {
      loop: String.raw`amber: the amplifier multiplies what it sees, $x-\beta y$`,
      gain: String.raw`amber: the gain $G$ for every $A$`,
      ratio: String.raw`amber: the line $\frac1\beta=10$ that $G$ closes in on`,
      series: String.raw`amber: what is left, about $\frac{1}{A\beta^2}$` }[lit];
    picCaption(svg, W, CAP, String.raw`top: the loop with $x=1$, $\beta=0.1$; bottom: $G$ against $A$ on a log axis`);
    const A = Math.pow(10, p), G = ampG(A, b), top = 26, hd = (H - top) * 0.42;
    const gd = svgNode('g', { transform: 'translate(0,' + top + ')' }, svg);
    drawAmp(gd, W, hd, A, b, { lit: lit === 'loop', compact: true });
    const y0 = top + hd + 8, L = 50, R = 14, Bm = 30, X = q => L + q / 8 * (W - L - R), Y = v => y0 + (11 - v) / 11 * (H - y0 - Bm);
    for (const t of [0, 5, 10]) { line(svg, L, Y(t), W - R, Y(t), { stroke: COL.grid }); svgText(svg, L - 6, Y(t) + 5, String(t), { 'text-anchor': 'end' }); }
    for (let q = 0; q <= 8; q += 2) svgTex(svg, X(q), H - 12, '$10^{' + q + '}$', { w: 50, size: 13, fill: COL.muted });
    const curve = []; for (let k = 0; k <= 160; k++) { const q = 8 * k / 160; curve.push((k ? 'L' : 'M') + X(q).toFixed(1) + ' ' + Y(ampG(Math.pow(10, q), b)).toFixed(1)); }
    if (lit === 'gain') glowLine(svg, curve.join(''), 11);
    if (lit === 'ratio') glowLine(svg, `M${L} ${Y(10)} L${W - R} ${Y(10)}`, 11);
    if (lit === 'series') glowRect(svg, X(p) - 7, Y(10), 14, Math.max(2, Y(G) - Y(10)), 3);
    line(svg, L, Y(10), W - R, Y(10), { stroke: COL.ink, 'stroke-dasharray': '6 4' });
    svgNode('path', { d: curve.join(''), fill: 'none', stroke: COL.accent, 'stroke-width': 2.6, 'data-item': 'mark', 'data-id': 'G-curve' }, svg);
    dot(svg, X(p), Y(G), 6, COL.accent, { 'data-item': 'mark', 'data-id': 'now' });
    haloTex(svg, X(p) + (p > 6 ? -10 : 10), Y(G) + 16, '$G=' + gTex(G) + '$', { w: 160, anchor: p > 6 ? 'end' : 'start', size: 14, fill: COL.accentDeep });
    haloTex(svg, L + 6, Y(10) - 14, 'dashed: $\\frac1\\beta=10$', { w: 140, anchor: 'start', size: 14, fill: COL.ink });
  };
  const plot = proofLeft(widget, {
    controls: [sA.el],
    draw: (svg, W, H) => draw(svg, W, H),
    tests: [
      String.raw`$A=100$, $\beta=0.1$: $G=\frac{100}{11}=9.09$. Guess $G$ at $A=10^4$, then check ($9.990$).`,
      String.raw`$A=1$: $G=\frac{1}{1.1}=0.91$, nowhere near 10: feedback wins only when $A\beta$ is large. Cases are evidence, not proof.`],
    model: String.raw`The amplifier sees only the small difference between the input and the fed-back output. A huge $A$ makes that difference tiny, so the output must be almost exactly $\frac{x}{\beta}$.` });
  proofRight(side, {
    id: 'amplifier',
    goal: { tex: String.raw`G=\frac{A}{1+A\beta}=\frac1\beta\Big(1-\frac{1}{A\beta}+\cdots\Big)`, words: String.raw`for an amplifier of gain $A$ with the part $\beta$ of its output subtracted from its input; the series needs $A\beta>1$.` },
    facts: [{ tex: String.raw`\tfrac{1}{1-r}=1+r+r^2+\cdots,\ \ |r|<1`, ref: 'Primer · Series, step 4' }],
    lines: [
      { tex: String.raw`y=A\,(x-\beta y)`, move: 'Unfold the definition',
        why: 'the amplifier multiplies what it sees: the input minus the part fed back', choices: ['Name a piece', 'Change variables'], highlight: 'loop' },
      { tex: String.raw`y\,(1+A\beta)=A\,x,\ \ G=\frac yx=\frac{A}{1+A\beta}`, move: 'Rearrange',
        why: String.raw`collect $y$, then divide`, choices: ['Telescope', 'Take a limit'], highlight: 'gain' },
      { tex: String.raw`G=\frac1\beta\cdot\frac{1}{1+\frac{1}{A\beta}}`, move: 'Add zero or multiply by one',
        why: String.raw`divide top and bottom by $A\beta$`, choices: ['Use symmetry', 'Induction'], highlight: 'ratio' },
      { tex: String.raw`G=\frac1\beta\Big(1-\frac{1}{A\beta}+\frac{1}{(A\beta)^2}-\cdots\Big)`, move: 'Use an earlier result',
        why: String.raw`the geometric series with $r=-\frac{1}{A\beta}$ (Series, step 4)`, choices: ['Compare or bound', 'Unfold the definition'], highlight: 'series' }],
    lookBack: [
      { q: String.raw`How much does a drift in $A$ move $G$?`,
        a: String.raw`By line 4, $G\approx\frac1\beta-\frac{1}{A\beta^2}$. With $A=10^8$, $\beta=0.1$ that is $10-10^{-6}$; halve $A$ and it is $10-2\cdot10^{-6}$: a change in the 7th digit.` },
      { q: 'What if the fed-back part is added, not subtracted?',
        a: String.raw`Put $-\beta$ for $\beta$: $G=\frac{A}{1-A\beta}$. As $A\beta$ nears $1$ the bottom nears $0$: the next step.` },
      { q: 'Does the output really settle there?',
        a: String.raw`The proof solves for the settled output. A real amplifier also has a small delay in its loop, and a strong, late correction swings (Primer · Feedback: roots, step 1); designers keep that swing from growing.` }] },
    plot, key => { lit = key || ''; plot.redraw(); }, { primerMoves: PRIMER_MOVES });
}

// ---------- 8. Positive feedback amplifies errors ----------
function slidePositive(widget, side) {
  let pos = false, L = 0.9;
  const sL = ctl('loop gain $A\\beta$', { id: 'loop', min: 0, max: 1.3, step: 0.05, value: L, fmt: v => sn(v, 2), onInput: v => { L = v; update(); } });
  const pick = choiceRow('', [['neg', 'negative: subtract'], ['pos', 'positive: add']], () => (pos ? 'pos' : 'neg'), id => { pos = id === 'pos'; update(); });
  const rG = readout('G', 'the gain $G$'), rD = readout('drift', 'a 1% rise in $A$ moves $G$ by');
  const plot = plotBox((svg, W, H) => {
    const Lm = 50, R = 16, T = 30, Bm = 40, XM = 1.3, X = v => Lm + v / XM * (W - Lm - R), Y = v => T + (12 - Math.min(12, v)) / 12 * (H - T - Bm);
    rect(svg, X(1), T, X(XM) - X(1), H - T - Bm, { fill: COL.soft2, 'data-item': 'mark', 'data-id': 'squeal' });
    ['adding:', 'no resting value,', 'it squeals'].forEach((t, i) => svgTex(svg, (X(1) + X(XM)) / 2, T + 22 + 20 * i, t, { w: X(XM) - X(1), size: 13, fill: COL.text2 }));
    for (const t of [0, 4, 8, 12]) { line(svg, Lm, Y(t), X(XM), Y(t), { stroke: COL.grid }); svgText(svg, Lm - 6, Y(t) + 5, String(t), { 'text-anchor': 'end' }); }
    for (const t of [0, 0.2, 0.4, 0.6, 0.8, 1, 1.2]) svgText(svg, X(t), H - Bm + 18, pn(t, 1), { 'text-anchor': 'middle' });
    svgTex(svg, Lm + (W - Lm - R) / 2, H - 10, 'loop gain $A\\beta$', { w: 200, size: 14, fill: COL.muted });
    line(svg, Lm, Y(0), X(XM), Y(0), { stroke: COL.grey });
    const path = f => { const pts = []; for (let k = 0; k <= 260; k++) { const v = XM * k / 260; const y = f(v); if (y == null) break; pts.push((k ? 'L' : 'M') + X(v).toFixed(1) + ' ' + Y(y).toFixed(1)); } return pts.join(''); };
    svgNode('path', { d: path(v => 1 / (1 + v)), fill: 'none', stroke: pos ? COL.grey : COL.accent, 'stroke-width': pos ? 1.6 : 2.8, 'data-item': 'mark', 'data-id': 'neg' }, svg);
    svgNode('path', { d: path(v => (v < 1 && 1 / (1 - v) <= 12 ? 1 / (1 - v) : null)), fill: 'none', stroke: pos ? COL.accent : COL.grey, 'stroke-width': pos ? 2.8 : 1.6, 'data-item': 'mark', 'data-id': 'pos' }, svg);
    haloTex(svg, X(0.55), Y(1 / 1.55) - 14, 'subtract: $\\frac{1}{1+A\\beta}$', { w: 160, anchor: 'start', size: 14, fill: pos ? COL.text2 : COL.accentDeep });
    haloTex(svg, X(0.86) - 6, Y(1 / (1 - 0.86)), 'add: $\\frac{1}{1-A\\beta}$', { w: 140, anchor: 'end', size: 14, fill: pos ? COL.accentDeep : COL.text2 });
    const gv = pos ? (L < 1 ? 1 / (1 - L) : null) : 1 / (1 + L);
    if (gv != null) { dot(svg, X(L), Y(gv), 6.5, COL.accent, { 'data-item': 'mark', 'data-id': 'now' }); if (gv > 12) svgTex(svg, X(L), T - 8, 'off the top', { w: 100, size: 13, fill: COL.text2 }); }
    svgTex(svg, Lm, 12, 'the gain $G$ as a multiple of $A$', { w: W - Lm, anchor: 'start', size: 15, fill: COL.ink });
  });
  function update() {
    const s = pos ? -1 : 1;
    if (pos && L >= 1) { rG.set('none: it squeals'); rD.set('no resting value'); }
    else {
      rG.set('$' + sn(1 / (1 + s * L), 3) + '\\times A$');
      if (pos && 1.01 * L >= 1) rD.set('it squeals');
      else { const ch = (1.01 * (1 + s * L) / (1 + s * 1.01 * L) - 1) * 100; rD.set('$' + sn(ch, 2) + '\\%$'); }
    }
    pick.paint(); plot.redraw();
  }
  widget.append(hh('div', 'sliders', pick.el, sL.el), plot.wrap, hh('div', 'readouts', rG.el, rD.el));
  sideStd(widget, side, {
    case: String.raw`A microphone near its speaker adds the speaker’s sound to your voice (Primer · Feedback: loops, step 2). Hamming: positive feedback “rushes off to one extreme” (L20 46:06).`,
    sym: String.raw`$A\beta$: the loop gain, the $a$ of Primer · Feedback: loops, step 2. Adding puts $-\beta$ for $\beta$ in step 7.`,
    tries: [
      String.raw`Keep subtract and $A\beta=0.9$: a 1% rise in $A$ raises $G$ by only $0.52\%$.`,
      String.raw`Press add: $G=10A$, and the same 1% rise in $A$ raises $G$ by about $11\%$.`,
      String.raw`Slide $A\beta$ up to $1$: the bottom $1-A\beta$ reaches $0$, the gain runs off, and the microphone squeals.`],
    take: String.raw`Negative feedback shrinks errors and positive feedback blows them up; past a loop gain of $1$ there is no resting value at all.`,
    next: NEXT3 });
  update();
}

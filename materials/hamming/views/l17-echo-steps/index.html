<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>A ratio and its echo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../../components/theme.js"></script>
<style>
/* Colors come from the theme palette (../../components/theme.js): grey for inputs and exact values, blue for
   outputs and the reader's choice, amber only for proof lights, red only for a failed check. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft);
  --red:var(--pal-red); --redbg:var(--pal-red-bg); --tint:var(--pal-soft-hover);
  --u:clamp(16px,1.35vw,20px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 24px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(6px,1vh,12px) 24px;overflow:hidden}
footer{display:flex;align-items:center;gap:10px;padding:8px 24px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Slide frame: widget on the left (about 57%), text on the right. */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(18px,2.4vw,40px)}
.slide.wide-side{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.widget{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(6px,1vh,10px);overflow:hidden}
.widget>*{max-width:100%;min-width:0}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(6px,1.1vh,12px);overflow:hidden}
.tag{font:13px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(20px,1.9vw,28px);line-height:1.2;margin:0;font-weight:650}
.question{margin:0;font-size:clamp(16px,1.3vw,18px);font-weight:600}
.case{margin:0;font-size:16px}
.known{margin:0;font-size:16px;color:var(--pal-text-2)}
.formula{font-size:clamp(17px,1.6vw,23px)}
.formula .katex-display{margin:.15em 0}
.sym{margin:0;font-size:16px;color:var(--muted)}
.side p .katex,.side li .katex{white-space:nowrap}
.tries{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.tries li::marker{color:var(--accent);font-weight:600}
.takeaway{margin:0;padding:10px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}
.ai{margin:0;font-size:16px;line-height:1.35;color:var(--pal-text-2)}
.ai .kick{color:var(--muted);font-weight:600}
.ai .src{color:var(--muted);font-size:14px}

/* Controls, readouts, legend */
.sliders{display:flex;gap:8px 24px;flex-wrap:wrap;width:100%;align-items:center}
.btnrow{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center}
.btnrow .lab{font-size:16px;color:var(--muted);margin-right:2px}
.slide-ctl{display:flex;align-items:center;gap:8px;font-size:16px;flex-wrap:wrap}
.slide-ctl input{width:clamp(120px,12vw,190px);vertical-align:middle;accent-color:var(--accent)}
.slide-ctl .val{min-width:44px}
.btn{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--pal-panel);color:var(--fg);border-radius:8px;cursor:pointer;font-size:16px}
.btn.on{background:var(--chip);border-color:var(--accent);color:var(--pal-accent-deep)}
.btn:disabled{opacity:.4;cursor:default}
.readouts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.readout{flex:1 1 150px;min-width:0;padding:4px 10px;border-radius:10px;background:var(--pal-soft);font-size:16px;overflow-wrap:anywhere;overflow:hidden}
.readout .k{color:var(--pal-text-2);font-size:15px}
.readout .val{font-size:17px;font-weight:600;line-height:1.55}
.readout.bad{background:var(--redbg);color:var(--red)}
.readout.bad .k{color:var(--red)}
.legend{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:16px;color:var(--pal-text-2);align-items:center}
.sw{display:inline-block;width:22px;height:0;vertical-align:middle;margin-right:6px}
.chip{display:inline-block;width:16px;height:12px;vertical-align:middle;margin-right:6px;border-radius:2px}
.ring{display:inline-block;width:13px;height:13px;vertical-align:middle;margin-right:6px;border-radius:50%;border:2px solid var(--pal-ink)}
.pt{display:inline-block;width:8px;height:8px;vertical-align:middle;margin:0 8px 0 4px;border-radius:50%}

/* Plots fill the height left in the widget column */
.fill{flex:1 1 0;min-height:90px;position:relative;width:100%}
.fill>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.takeholder{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.takeholder .takeaway,.takeholder .ai{align-self:stretch}
.duo{flex:1 1 0;min-height:0;display:flex;gap:12px}
.duo>.lcol{flex:0 0 38%;min-width:0;display:flex;flex-direction:column;gap:6px}
.lcol>.fill.disk{flex:1 1 0;min-height:0;touch-action:none;cursor:grab}
.readouts.inline{flex-direction:column;gap:4px}
.readouts.inline .readout{flex:0 0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.duo>.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px}

/* Proof slides: test and picture on the left, the proof (fl-proof-steps) on the right */
.slide.proof-slide{grid-template-columns:minmax(0,11fr) minmax(0,9fr)}
.slide.proof-slide .side{justify-content:flex-start}
.fill.proofpic{min-height:150px}
.slide.proof-slide .sliders{gap:6px 16px}
.slide.proof-slide .btn{padding:4px 10px}
.part{margin:0;font-weight:600;color:var(--muted)}
.test{display:flex;flex-direction:column;gap:3px}
.test .tries{gap:3px}
.model{margin:0;padding:8px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}

/* Decision slides (as in Lecture 15): the problem, three cards and the reveal on the left; question,
   the claim, try-steps and takeaway on the right. */
.slide.decision{grid-template-columns:minmax(0,2.05fr) minmax(0,1fr);gap:clamp(20px,2.6vw,40px)}
.decision .widget{gap:6px}
.decision .side{justify-content:space-evenly;gap:clamp(8px,1.8vh,18px)}
.decision h2{font-size:clamp(23px,2.3vw,32px)}
.decision .q{margin:0;font-size:clamp(17px,1.55vw,21px);font-weight:600;line-height:1.35}
.decision .fx{margin:0;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--tint);font-size:clamp(16px,1.4vw,19px);line-height:1.4}
.decision .fx .katex-display{margin:.25em 0}
.decision .kicker{font-size:14px;color:var(--muted);margin:0 0 3px}
.decision .blk{display:flex;flex-direction:column;gap:3px}
.decision .takeaway{padding:11px 14px;line-height:1.4}
.decision .tries{gap:6px;font-size:clamp(16px,1.35vw,18px);line-height:1.4}
.decision .hold{color:var(--muted);font-style:italic;background:var(--tint);border:1px dashed var(--line);border-radius:6px;padding:9px 12px;margin:0;font-size:16px;line-height:1.4}
.prob{flex:0 0 auto;display:flex;gap:12px;align-items:stretch;border:1px solid var(--line);border-radius:10px;padding:6px 14px;background:var(--tint);font-size:16px;line-height:1.4}
.prob .lead{font-weight:650;color:var(--muted)}
.prob p{margin:0;flex:1 1 0;align-self:center}
.prob .fill{flex:0 0 36%;min-height:96px}
.opts{flex:0 0 auto;display:flex;flex-direction:column;gap:clamp(4px,0.5vw,8px)}
.opt{display:grid;grid-template-columns:minmax(0,0.78fr) minmax(0,1.22fr);gap:0 14px;padding:clamp(6px,0.7vw,10px) 12px;border:1px solid var(--line);border-radius:10px;background:var(--pal-panel);color:inherit;text-align:left;cursor:pointer;min-width:0;font:inherit}
.opt .lhs{display:flex;flex-direction:column;gap:3px;min-width:0}
.opt .rhs{display:flex;flex-direction:column;gap:3px;min-width:0;border-left:1px solid var(--pal-soft-2);padding-left:14px}
.opt:not([aria-disabled="true"]):hover{border-color:var(--accent)}
.opt[aria-disabled="true"]{cursor:default}
.opt .top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:16px}
.opt .letter{font-weight:700;color:var(--accent)}
.opt .who{font-size:14px;color:var(--muted);text-align:right}
.opt .body{font-size:clamp(16px,1.4vw,19px);line-height:1.3}
.opt .asm{margin:0;font-size:clamp(16px,1.3vw,18px);line-height:1.33;color:var(--muted)}
.opt .verdict{font-size:clamp(16px,1.3vw,18px);line-height:1.33;color:var(--fg)}
.opt .verdict.idle{color:var(--muted);font-style:italic}
.opt.on{box-shadow:inset 0 0 0 2px var(--pal-ink)}
.opt.chooser{background:var(--chip);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.opt.chooser .who{color:var(--pal-accent-deep);font-weight:600}
.opt.chooser .letter{color:var(--pal-accent-deep)}
.reveal{flex:1 1 auto;min-height:0;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:clamp(16px,1.25vw,18px);display:flex;flex-direction:column;justify-content:center;gap:6px}
.reveal.idle{background:var(--tint);color:var(--muted)}
.rv{margin:0;line-height:1.38}
.rv .k{font-weight:650;color:var(--accent)}
.rv .t{color:var(--muted);font-size:14px;white-space:nowrap}
.rv.hold{color:var(--muted)}
.decision .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px}
.decision .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--pal-on-accent);padding:6px 16px}

/* Short windows (1100x620 and similar): tighter spacing, body text stays 16px */
@media (max-height: 680px){
  header{padding-top:4px}
  #stage{padding:4px 24px}
  footer{padding:4px 24px}
  .widget{gap:5px}
  .side{gap:4px}
  .tries{gap:2px}
  .sym,.tries,.takeaway,.case,.known,.ai{line-height:1.25}
  .takeaway{padding:6px 10px}
  .formula{font-size:18px}
  h2{font-size:20px}
  .question{font-size:16px}
  .fill{min-height:70px}
  .readout{padding:2px 8px}
  .readout .val{line-height:1.45}
  .fill.proofpic{min-height:130px}
  .model{padding:5px 10px}
  .test .tries{gap:1px}
  .btn{padding:4px 10px}
  .decision h2{font-size:23px}
  .decision .side{gap:7px}
  .decision .tries{gap:2px;line-height:1.3}
  .decision .takeaway{padding:7px 12px}
  .reveal{gap:3px;padding:5px 12px}
  .rv{line-height:1.28}
  .opts{gap:3px}
  .opt{padding:4px 12px}
  .opt .body,.opt .asm,.opt .verdict{line-height:1.25}
  .prob{padding:4px 12px;line-height:1.3}
  .prob .fill{min-height:84px}
}
</style>
</head>
<body>
<header>Lecture 17 · A ratio and its echo</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script src="../../components/proof-steps.js"></script>
<script>
// Numbers: lectures/17-digital-filters-part-iv/checks.py (view 2 blocks) and
// workspace/l17-materials-2026-10-24/l17-echo-steps/checks.js (node, written apart from this file).
// Primer pointers: Primer · Feedback (p-feedback-1..3) has no built views yet; its pointers below use the
// step order of lectures/p-feedback/design.md, and each carries the view and step id in a comment.

// ---------- palette and redraw ----------
// COL holds the palette for the SVG being drawn; plotBox reads it at every paint, so a draw always uses the
// current theme. A theme switch redraws the current slide's plots and keeps every control's state.
let COL = {};
const PAL_NAMES = ['bg', 'ink', 'fg', 'text-2', 'muted', 'muted-2', 'grey', 'grey-blue', 'guide', 'grid', 'line', 'panel', 'soft', 'soft-2',
  'accent', 'accent-2', 'accent-3', 'accent-deep', 'accent-tint', 'accent-soft', 'on-accent',
  'amber', 'amber-bg', 'amber-ink', 'red', 'red-bg'];
function readPalette() {
  const o = {};
  for (const n of PAL_NAMES) o[n.replace(/-(\w)/g, (_, c) => c.toUpperCase())] = FluidTheme.color(n);
  return o;
}
let PLOTS = [];
window.addEventListener('fluid-themechange', () => PLOTS.forEach(p => p.redraw()));
// A palette color with alpha, e.g. rgbaOf(COL.accent, 0.5). Takes #rgb, #rrggbb or rgb(...).
function rgbaOf(c, a) {
  let r = 0, g = 0, b = 0;
  const m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(c.trim());
  if (m) {
    let hx = m[1]; if (hx.length === 3) hx = hx.split('').map(x => x + x).join('');
    const n = parseInt(hx, 16); r = n >> 16; g = (n >> 8) & 255; b = n & 255;
  } else {
    const v = (c.match(/[\d.]+/g) || [0, 0, 0]).map(Number); [r, g, b] = v;
  }
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

// ---------- DOM helpers ----------
const $ = s => document.querySelector(s);
const NSV = 'http://www.w3.org/2000/svg', NHT = 'http://www.w3.org/1999/xhtml';
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false }], throwOnError: false };
// Render $...$ in a node. If the CDN did not load, the text stays as typed.
function tex(node) { if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH); return node; }
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function hh(tag, cls, ...kids) { const e = h(tag, cls); for (const k of kids) if (k) e.append(k); return e; }
function mark(e, kind, id, title) { e.dataset.item = kind; if (id != null) e.dataset.id = id; if (title != null) e.dataset.title = title; return e; }
function emit(kind, data) {
  try { if (window.fluid && typeof window.fluid.emit === 'function') Promise.resolve(window.fluid.emit(kind, data)).catch(() => {}); }
  catch (e) { /* the view works without the bridge */ }
}
// Fixed decimals, with no minus sign on zero.
function fx(x, d) { const y = Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x; return y.toFixed(d); }
// A short number: up to d decimals, trailing zeros dropped.
function sn(x, d) { return String(+fx(x, d == null ? 3 : d)); }
// Two significant digits for small numbers: 0.35, 0.0097.
function sig2(x) { return x >= 0.1 ? x.toFixed(2) : x.toPrecision(2); }
// A tiny or huge number as TeX: 2\times10^{-14}.
function expTex(x) {
  if (x === 0) return '0';
  const [m, e] = x.toExponential(0).split('e');
  return (m === '1' ? '' : m + '\\times') + '10^{' + (+e) + '}';
}

// ---------- controls ----------
// A labelled range input. o: {id, min, max, step, value, fmt(v) -> TeX-ready text, onInput(v)}.
function ctl(label, o) {
  const wrap = h('label', 'slide-ctl');
  const lab = setTex(h('span'), label);
  const inp = h('input');
  inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step; inp.value = o.value;
  mark(inp, 'control', o.id, o.id);
  const val = h('span', 'val');
  const show = v => setTex(val, o.fmt(v));
  inp.addEventListener('input', () => { show(+inp.value); o.onInput(+inp.value); });
  show(o.value);
  wrap.append(lab, inp, val);
  return { el: wrap, input: inp, set(v) { inp.value = v; show(v); } };
}
// A row of buttons that pick one choice. choices: [[id, label], ...]; getCur() gives the current id.
function choiceRow(label, choices, getCur, onPick, kind) {
  const row = hh('div', 'btnrow', label ? setTex(h('span', 'lab'), label) : null);
  const btns = choices.map(([id, text]) => {
    const b = mark(h('button', 'btn'), kind || 'control', id);
    setTex(b, text);
    b.addEventListener('click', () => { onPick(id); paint(); });
    row.append(b);
    return [id, b];
  });
  function paint() { btns.forEach(([id, b]) => b.classList.toggle('on', id === getCur())); }
  paint();
  return { el: row, paint };
}
function button(id, label, onClick) {
  const b = mark(h('button', 'btn'), 'control', id);
  setTex(b, label);
  b.addEventListener('click', onClick);
  return b;
}
// A readout box: label and value are TeX-ready text.
function readout(id, label) {
  const box = mark(h('div', 'readout'), 'readout', id);
  const k = setTex(h('div', 'k'), label);
  const v = h('div', 'val');
  box.append(k, v);
  return { el: box, set(text, bad) { setTex(v, text); box.classList.toggle('bad', !!bad); }, label(t) { setTex(k, t); } };
}
// Legend: items {color (CSS), text, kind: 'line' | 'dash' | 'chip' | 'ring' | 'pt'}.
function legend(items) {
  const d = h('div', 'legend');
  for (const it of items) {
    const s = h('span');
    let sw;
    if (it.kind === 'chip') { sw = h('span', 'chip'); sw.style.background = it.color; }
    else if (it.kind === 'ring') { sw = h('span', 'ring'); if (it.color) sw.style.borderColor = it.color; }
    else if (it.kind === 'pt') { sw = h('span', 'pt'); sw.style.background = it.color; }
    else { sw = h('span', 'sw'); sw.style.borderTop = '3px ' + (it.kind === 'dash' ? 'dashed' : 'solid') + ' ' + it.color; }
    s.append(sw, setTex(h('span'), it.text));
    d.append(s);
  }
  return d;
}
function triesList(items) { return hh('ol', 'tries', ...items.map(t => setTex(h('li'), t))); }
// The takeaway (and the AI echo under it) appears after the first try: on the first click, drag or slider
// move in the widget, or on "Show the takeaway".
function takeBox(widget, text, ai) {
  const holder = h('div', 'takeholder');
  const btn = mark(h('button', 'btn'), 'control', 'show-takeaway');
  setTex(btn, 'Show the takeaway');
  const tk = setTex(h('p', 'takeaway'), text);
  const parts = [tk];
  if (ai) {
    const p = h('p', 'ai');
    p.append(h('span', 'kick', 'Same idea in AI research. '), setTex(h('span'), ai.text), ' ', h('span', 'src', '(' + ai.src + ')'));
    parts.push(p);
  }
  parts.forEach(e => { e.hidden = true; });
  const show = () => { parts.forEach(e => { e.hidden = false; }); btn.hidden = true; };
  btn.addEventListener('click', show);
  for (const ev of ['input', 'click', 'pointerdown']) widget.addEventListener(ev, show);
  holder.append(btn, ...parts);
  return holder;
}
// The side column of a content slide, after the frame's tag, title and question:
// the everyday case, the earlier fact it builds on, the symbols, the formula, the tries, the takeaway.
function sideStd(widget, side, o) {
  if (o.case) side.append(setTex(h('p', 'case'), o.case));
  if (o.known) side.append(setTex(h('p', 'known'), o.known));
  if (o.sym) side.append(setTex(h('p', 'sym'), o.sym));
  if (o.formula) side.append(setTex(h('div', 'formula'), o.formula));
  if (o.tries) side.append(triesList(o.tries));
  if (o.take) side.append(takeBox(widget, o.take, o.ai));
}

// ---------- SVG helpers ----------
function svgNode(tag, attrs, parent) {
  const e = document.createElementNS(NSV, tag);
  for (const k in attrs) if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function svgRoot(w, ht) { return svgNode('svg', { viewBox: '0 0 ' + w + ' ' + ht, role: 'img', 'font-family': 'system-ui, sans-serif', 'font-size': 14 }); }
function svgText(parent, x, y, s, attrs) {
  const t = svgNode('text', Object.assign({ x: x, y: y, fill: COL.muted, 'font-size': 14 }, attrs || {}), parent);
  t.textContent = s;
  return t;
}
// A KaTeX label inside an SVG: a foreignObject holding a rendered formula. o: {w, ht, anchor, size, fill, bg, bold}.
function svgTex(parent, x, y, s, o) {
  o = o || {};
  const w = o.w || 220, ht = o.ht || 26, anchor = o.anchor || 'middle';
  const x0 = anchor === 'end' ? x - w : anchor === 'start' ? x : x - w / 2;
  const fo = svgNode('foreignObject', { x: x0, y: y - ht / 2, width: w, height: ht }, parent);
  const d = document.createElementNS(NHT, 'div');

// Input: 300 normal samples from mulberry32(17). checks.py: steps to 1% 44, 459, 4603 for |lam| = 0.9, 0.99, 0.999;

function runSum(u, errAt) {
  const y = []; let last = 0;
  for (let n = 0; n < u.length; n++) { last = last + u[n] - (n >= 5 ? u[n - 5] : 0) + (n === errAt ? 0.001 : 0); y.push(last); }
  return y;
}
function sum5(u) { return u.map((_, n) => { let s = 0; for (let k = Math.max(0, n - 4); k <= n; k++) s += u[k]; return s; }); }
function slideRunningSum(widget, side) {
  let inp = 'tap', err = false;
  const input = () => (inp === 'tap' ? READ12.map((_, n) => +(n === 0)) : READ12.slice());
  const pickU = choiceRow('input:', [['in-tap', 'a tap at step $0$'], ['in-read', 'readings']], () => 'in-' + inp, id => { inp = id.slice(3); update(); });
  const errBtn = button('error', 'a rounding error of $0.001$ at step $3$', () => { err = !err; update(); });
  const rLast = readout('step-11', 'step $11$: the loop, and the direct sum');
  const rDiff = readout('loop-minus-direct', 'the loop minus the direct sum');
  const num = v => sn(v, 3).replace('-', '−');
  const rows = [
    plotBox((svg, W, H) => {
      const u = input(), mx = Math.max(...u);
      stemRow(svg, W, H, { vals: u, lo: -0.12 * mx, hi: 1.3 * mx, color: COL.grey, id: 'u', values: true, fmtVal: num, noX: true, hideZero: true,
        label: 'grey: the readings $u_n$', labelFill: COL.text2 });
    }, null, 1),
    plotBox((svg, W, H) => {
      const u = input(), mx = Math.max(...u);
      stemRow(svg, W, H, { vals: u, lo: -0.12 * mx, hi: 1.3 * mx, color: COL.accent, id: 'added', values: true, fmtVal: v => '+' + num(v), noX: true, hideZero: true,
        label: 'blue, added at step $n$: the new reading $u_n$', labelFill: COL.accentDeep });
    }, null, 1),
    plotBox((svg, W, H) => {
      const u = input(), mx = Math.max(...u);
      const v = u.map((_, n) => (n >= 5 ? -u[n - 5] : 0));
      stemRow(svg, W, H, { vals: v, lo: -1.3 * mx, hi: 0.12 * mx, color: COL.greyBlue, id: 'taken', values: true, fmtVal: num, noX: true, hideZero: true, down: true,
        label: 'grey-blue, taken away at step $n$: $u_{n-5}$, the reading from five steps before', labelFill: COL.text2 });
    }, null, 1),
    plotBox((svg, W, H) => {
      const u = input(), y = runSum(u, err ? 3 : -1), d5 = sum5(u), mx = Math.max(...y, ...d5, 0.001);
      stemRow(svg, W, H, { vals: y, lo: -0.12 * mx, hi: 1.25 * mx, color: COL.accent, id: 'y', values: true, fmtVal: num, rings: d5, T: 40,
        label: 'blue, the output $y_n$; rings: the direct sum of the last five readings', labelFill: COL.accentDeep });
    }, null, 1.25)];
  function update() {
    const u = input(), y = runSum(u, err ? 3 : -1), d5 = sum5(u);
    errBtn.classList.toggle('on', err);
    rLast.set('$' + num(y[11]) + '$ and $' + u.slice(7, 12).map(v => sn(v, 0)).join('+') + '=' + sn(d5[11], 0) + '$', Math.abs(y[11] - d5[11]) > 1e-9);
    const first = y.findIndex((v, n) => Math.abs(v - d5[n]) > 1e-9);
    rDiff.set(first < 0 ? '$0$ at every step' : '$0.001$ from step $' + first + '$ on: it never leaves', first >= 0);
    pickU.paint(); rows.forEach(p => p.redraw());
  }
  widget.append(hh('div', 'sliders', pickU.el, errBtn), ...rows.map(p => p.wrap), hh('div', 'readouts', rLast.el, rDiff.el));
  sideStd(widget, side, {
    case: 'A cashier’s running total of the last five sales: add each new sale, take away the sale from five customers ago.',
    // pointer: p-feedback-1 step 4 'fates' (Feedback: loops)
    known: 'Known: a loop with weight $1$ on its last output adds up and never forgets (Primer · Feedback: loops, step 4).',
    sym: 'Before step $0$ all values are $0$.',
    formula: String.raw`$$y_n=y_{n-1}+u_n-u_{n-5}$$`,
    tries: [
      String.raw`With the tap: $1,1,1,1,1$, then exact zeros. The echo ends.`,
      String.raw`Press readings: rings sit on the stems, so $y_n$ is the sum of the last five readings, for one add and one subtract per step, at any window length.`,
      String.raw`Turn on the error: it stays in every later output. The loop never forgets a mistake.`],
    take: 'Feedback can have a finite echo when the input side takes away what the loop keeps; but weight $1$ keeps every rounding error too.',
    ai: { text: 'The integral image (Viola and Jones) is this filter in two dimensions: running sums give the sum of any rectangle of pixels in four look-ups, whatever its size.',
      src: 'CVPR 2001' } });
  update();
}

// ---------- 6. Why it's true: the loop's echo is cancelled ----------
// The rows y_m - y_{m-1} = u_m - u_{m-5} for m = 0..7, added: the y's cancel in pairs, the u's cancel against the
// copies five rows down, and u_3..u_7 are left. Readings 7,0,1,2,1,7,7,5: y_7 = 2+1+7+7+5 = 22.
const READ8 = [7, 0, 1, 2, 1, 7, 7, 5], TAP8 = [0, 0, 1, 0, 0, 0, 0, 0];
const LIT_ORDER = ['rows', 'cancel-y', 'shift', 'cancel-u'];
function drawLadder(svg, W, H, inp, lit, checked) {
  const u = inp === 'tap' ? TAP8 : READ8, y = runSum(u, -1);
  const lv = LIT_ORDER.indexOf(lit);
  const CAP = {
    rows: String.raw`amber: the rule written once for each step, $m=0$ to $7$`,
    'cancel-y': String.raw`amber: each $y_m$ meets $-y_m$ one row down; $y_7$ and $-y_{-1}=0$ are left`,
    shift: String.raw`amber: $-u_{m-5}$ is $-u_j$ with $j=m-5$; for $m<5$, $j<0$, so it is $0$`,
    'cancel-u': String.raw`amber: $u_0,u_1,u_2$ meet $-u_0,-u_1,-u_2$; $u_3$ to $u_7$ are left` }[lit];
  picCaption(svg, W, CAP, String.raw`The rule for $m=0$ to $7$, one row each. Add all the rows.`);
  const top = 30, nr = 12.9;
  const rh = Math.min(34, (H - top - 2) / nr);
  const cx = [0.07, 0.22, 0.40, 0.53, 0.66, 0.85].map(f => f * W);
  const cwid = W * 0.15;
  const rowY = m => top + rh * (m + 1.5);
  const fs = Math.max(13, Math.min(17, rh * 0.55));
  // header
  const hdr = ['row $m$', '$y_m$', '$-y_{m-1}$', '', '$u_m$', '$-u_{m-5}$'];
  hdr.forEach((t, i) => { if (t) svgTex(svg, cx[i], top + rh * 0.5, t, { w: cwid, size: 14, fill: COL.muted }); });
  // lights under the cells
  if (lit === 'rows') for (let m = 0; m < 8; m++) glowRect(svg, cx[1] - cwid * 0.45, rowY(m) - rh * 0.4, cx[5] - cx[1] + cwid * 0.9, rh * 0.8, 1);
  const link = (x1, y1, x2, y2, amber) => line(svg, x1, y1, x2, y2, { stroke: amber ? COL.amber : COL.grey, 'stroke-width': amber ? 3 : 1.5, 'stroke-linecap': 'round', opacity: amber ? 1 : 0.8 });
  if (lv >= 1) for (let m = 0; m < 7; m++) link(cx[1] + 14, rowY(m) + 4, cx[2] - 14, rowY(m + 1) - 4, lv === 1);
  if (lv >= 1 && lv === 1) { glowRect(svg, cx[1] - 22, rowY(7) - rh * 0.38, 44, rh * 0.76, 1); glowRect(svg, cx[2] - 40, rowY(0) - rh * 0.38, 80, rh * 0.76, 1); }
  if (lv === 2) for (let m = 0; m < 8; m++) glowRect(svg, cx[5] - 34, rowY(m) - rh * 0.38, 68, rh * 0.76, 1);
  if (lv >= 3) for (let m = 0; m < 3; m++) link(cx[4] + 14, rowY(m) + 4, cx[5] - 16, rowY(m + 5) - 4, lv === 3);
  if (lv === 3) for (let m = 3; m < 8; m++) glowRect(svg, cx[4] - 20, rowY(m) - rh * 0.38, 40, rh * 0.76, 1);
  const strike = (x, yy, w) => line(svg, x - w / 2, yy, x + w / 2, yy, { stroke: COL.ink, 'stroke-width': 1.4 });
  for (let m = 0; m < 8; m++) {
    const yy = rowY(m);
    svgText(svg, cx[0], yy + 5, String(m), { 'text-anchor': 'middle', fill: COL.muted, 'font-size': 14 });
    svgTex(svg, cx[1], yy, '$y_{' + m + '}$', { w: cwid, size: fs, fill: COL.ink });
    svgTex(svg, cx[2], yy, '$-y_{' + (m - 1) + '}$' + (m === 0 && lv >= 1 ? '$\\,=0$' : ''), { w: cwid, size: fs, fill: COL.ink });
    svgText(svg, cx[3], yy + 6, '=', { 'text-anchor': 'middle', fill: COL.ink, 'font-size': 18 });
    svgTex(svg, cx[4], yy, '$u_{' + m + '}$', { w: cwid, size: fs, fill: COL.ink });
    const j = m - 5;
    svgTex(svg, cx[5], yy, j < 0 ? (lv >= 2 ? '$0$' : '$-u_{' + j + '}$') : '$-u_{' + j + '}$', { w: cwid * 1.2, size: fs, fill: j < 0 ? COL.muted : COL.ink });
    if (lv >= 1) { if (m < 7) strike(cx[1], yy, 26); if (m > 0) strike(cx[2], yy, 40); }
    if (lv >= 3) { if (m < 3) strike(cx[4], yy, 26); if (m >= 5) strike(cx[5], yy, 36); }
  }
  // the numbers: readings and the loop's outputs
  const sTop = rowY(7) + rh * 1.15, cw = (W - 120) / 8;
  const sx = n => 112 + (n + 0.5) * cw;
  const rowsS = [['input $u$', u.map(v => String(v))], ['the loop $y$', y.map((v, n) => (n === 7 && !checked ? '?' : String(v)))]];
  rowsS.forEach(([lab, vals], r) => {
    const yy = sTop + rh * (r + 0.5);
    svgTex(svg, 4, yy, lab, { w: 108, anchor: 'start', size: 14, fill: COL.text2 });
    vals.forEach((t, n) => {
      const hot = lv === 3 && ((r === 0 && n >= 3) || (r === 1 && n === 7));
      rect(svg, sx(n) - cw / 2 + 2, yy - rh * 0.42, cw - 4, rh * 0.84, { rx: 4, fill: hot ? COL.amberBg : (r === 1 ? COL.accentSoft : COL.soft), stroke: hot ? COL.amber : COL.line, 'data-item': 'mark', 'data-id': (r ? 'y-' : 'u-') + n });
      svgText(svg, sx(n), yy + 5, t, { 'text-anchor': 'middle', fill: COL.ink, 'font-size': 15 });
      if (r === 0) svgText(svg, sx(n), sTop - 3, String(n), { 'text-anchor': 'middle', fill: COL.muted, 'font-size': 12 });
    });
  });
  const res = sTop + rh * 2.55;
  const s5 = u.slice(3, 8);
  svgTex(svg, W / 2, res, checked ? '$y_7=' + y[7] + '$, and $u_3+u_4+u_5+u_6+u_7=' + s5.join('+') + '=' + s5.reduce((a, b) => a + b, 0) + '$'
    : 'Guess $y_7$, then press Check.', { w: W - 8, size: 15, fill: checked ? COL.ink : COL.muted });
}
function slideWhyFiniteEcho(widget, side) {
  let inp = 'read', lit = '', checked = false;
  const pick = choiceRow('', [['in-read', 'readings'], ['in-tap', 'a tap at step $2$']], () => 'in-' + inp, id => { inp = id.slice(3); checked = false; plot.redraw(); });
  const chk = button('check-y7', 'Check $y_7$', () => { checked = true; plot.redraw(); });
  const plot = proofLeft(widget, {
    controls: [pick.el, chk],
    draw: (svg, W, H) => drawLadder(svg, W, H, inp, lit, checked),
    tests: [
      String.raw`Readings: guess $y_7$ from the claim, then press Check. Do the loop and the last five readings agree?`,
      String.raw`A tap at step $2$: the loop gives $1$ at steps $2$ to $6$ only. Cases are evidence, not proof.`],
    model: 'Each reading enters the total once and leaves it once, five steps later.' });
  proofRight(side, {
    id: 'finite-echo',
    goal: { tex: String.raw`y_n=u_{n-4}+u_{n-3}+u_{n-2}+u_{n-1}+u_n`, words: 'started at rest, the loop gives exactly the sum of the last five readings.' },
    facts: [
      { tex: String.raw`y_n=y_{n-1}+u_n-u_{n-5}`, words: 'the rule', ref: 'step 5' },
      { words: String.raw`at rest: every $y$ and $u$ before step $0$ is $0$` }],
    lines: [
      { tex: String.raw`y_m-y_{m-1}=u_m-u_{m-5}\quad(m=0,\dots,n)`, move: 'Rearrange',
        why: String.raw`move $y_{m-1}$ to the left of the rule: one row for each step`, choices: ['Name a piece', 'Take a limit'], highlight: 'rows' },
      { tex: String.raw`y_n=\sum_{m=0}^{n}u_m-\sum_{m=0}^{n}u_{m-5}`, move: 'Telescope',
        why: String.raw`add the rows: each $y_m$ meets $-y_m$ one row down, and $y_{-1}=0$`, choices: ['Induction', 'Compute it two ways'], highlight: 'cancel-y' },
      { tex: String.raw`\sum_{m=0}^{n}u_{m-5}=\sum_{j=0}^{n-5}u_j`, move: 'Change variables',
        why: String.raw`put $j=m-5$; the five terms with $j<0$ are $0$ at rest`, choices: ['Use symmetry', 'Compare or bound'], highlight: 'shift' },
      { tex: String.raw`y_n=\sum_{m=0}^{n}u_m-\sum_{j=0}^{n-5}u_j=u_{n-4}+\dots+u_n`, move: 'Rearrange',
        why: String.raw`both sums hold $u_0$ to $u_{n-5}$; they cancel, and five terms are left`, choices: ['Induction', 'Use symmetry'], highlight: 'cancel-u' }],
    lookBack: [
      { q: 'The same in ratio form?',
        a: String.raw`$H=\frac{1-z^{-5}}{1-z^{-1}}=1+z^{-1}+z^{-2}+z^{-3}+z^{-4}$: the geometric sum of Primer · Series, step 3, read backwards. The bottom divides the top, so the ratio is a polynomial and the echo is finite.` },
      // pointer: p-feedback-3 step 4 'unit-circle' (Feedback: filters)
      { q: 'Why does one error stay forever?',
        a: String.raw`The loop alone, $y_n=y_{n-1}$, has its root at $1$, on the unit circle: it neither grows nor fades (Primer · Feedback: filters, step 4). In float32, after a million readings the loop is off by about $10^{-4}$; the direct 5-sum stays under $6\times10^{-7}$. That is one reason it is “not necessarily the filter you want to design” (10:25).` },
      { q: 'Is this Hamming’s counterexample?',
        a: 'He does not say which filter he found. This is the simplest one we know.' }] },
    plot, key => { lit = key || ''; plot.redraw(); }, { endNote: NEXT });
}

// ---------- frame ----------
const SLIDES = [
  { id: 'ratio-echo', tag: 'Lecture 07:02 to 08:15 · the name at 09:25', title: 'Feedback packs an endless echo into two numbers',
    question: 'How many plain weights does it take to copy one feedback loop?', mount: slideRatioEcho },
  { id: 'no-recipe', tag: 'Lecture 08:15 to 09:25', title: 'The bottom of the ratio has no one-integral recipe',
    question: 'Why can Kaiser’s recipe find a plain filter’s weights, but not a feedback filter’s?', mount: slideNoRecipe },
  { id: 'loop-or-echo', cls: 'wide-side', tag: 'Lecture 09:25 to 09:55', title: 'One filter, two ways to run it',
    question: 'When do you run a feedback filter as a loop, and when as its echo?', mount: slideLoopOrEcho },
  { id: 'pick-finite-echo', kind: 'decision', tag: 'Lecture 09:55, answer 10:25', title: 'Must a feedback filter’s echo go on forever?',
    question: 'Everyone calls recursive filters “infinite impulse response”. What do you do with that claim?' },
  { id: 'running-sum', tag: 'Lecture 10:57 to 11:28', title: 'A feedback filter whose echo stops',
    question: 'Can feedback give an echo that ends after five steps?', mount: slideRunningSum },
  { id: 'why-finite-echo', kind: 'proof', tag: 'Lecture 11:28 to 12:00', title: 'Why it’s true: the loop’s echo is cancelled',
    question: String.raw`Why does $y_n=y_{n-1}+u_n-u_{n-5}$ give exactly the sum of the last five readings?`, mount: slideWhyFiniteEcho },
];

let cur = 0, shownId = null, endSent = false;
function goTo(i) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  if (shownId !== null && shownId !== s.id) emit('view.step', { step: s.id });
  shownId = s.id;
  const stage = $('#stage');
  stage.innerHTML = '';
  PLOTS = [];
  const widget = h('div', 'widget');
  const side = hh('div', 'side', h('div', 'tag', s.tag), setTex(h('h2'), s.title),
    setTex(h('p', s.kind === 'decision' ? 'q' : 'question'), s.question));
  const cls = 'slide' + (s.kind === 'proof' ? ' proof-slide' : s.kind === 'decision' ? ' decision' : '') + (s.cls ? ' ' + s.cls : '');
  const sec = mark(h('section', cls), 'step', s.id, s.title.replace(/\$/g, ''));
  sec.append(widget, side);
  stage.append(sec);
  if (s.kind === 'decision') mountDecision(s, widget, side);
  else s.mount(widget, side);
  if (cur === SLIDES.length - 1 && !endSent) { endSent = true; emit('view.action', { action: 'deck-end' }); }
  tex(sec);
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, k) => d.classList.toggle('on', k === cur));
}
// A cue is a state. {step} goes to the step and does nothing if it is shown. {step, reveal: true} also
// reveals that decision, once; a revealed decision stays revealed.
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i < 0) return;
  const changed = msg.reveal === true && SLIDES[i].kind === 'decision' && revealDecision(SLIDES[i].id, 'cue');
  if (i !== cur || changed) goTo(i);
}
function startDeck() {
  const dots = $('#dots');
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = s.title.replace(/\$/g, '');
    b.addEventListener('click', () => goTo(i));
    dots.appendChild(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],input[type=number],textarea,select')) return;
    if (e.target && e.target.classList && e.target.classList.contains('opt') && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault(); e.target.click(); return;
    }
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
}
startDeck();

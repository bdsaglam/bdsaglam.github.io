<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primer · Signals: what a filter does</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../../components/theme.js"></script>
<style>
/* Colors come from the theme palette (../../components/theme.js): one accent (blue), amber only for proof lights, red only for a failed check. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft);
  --red:var(--pal-red); --redbg:var(--pal-red-bg);
  --u:clamp(16px,1.35vw,20px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 24px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(6px,1vh,12px) 24px}
footer{display:flex;align-items:center;gap:10px;padding:8px 24px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Slide frame: widget on the left (3/5), text on the right (2/5). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(18px,2.4vw,40px)}
.widget{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(6px,1vh,10px);overflow:hidden}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(6px,1.1vh,12px);overflow:hidden}
.tag{font:13px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(20px,1.9vw,28px);line-height:1.2;margin:0;font-weight:650}
.question{margin:0;font-size:clamp(16px,1.3vw,18px);font-weight:600}
.case{margin:0;font-size:16px}
.formula{font-size:clamp(18px,1.8vw,26px)}
.formula .katex-display{margin:.2em 0}
.sym{margin:0;font-size:16px;color:var(--muted)}
.tries{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.tries li::marker{color:var(--accent);font-weight:600}
.takeaway{margin:0;padding:10px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}
.next{margin:0;font-size:16px;color:var(--muted)}

/* Controls, readouts, legend */
.sliders{display:flex;gap:8px 24px;flex-wrap:wrap;width:100%;align-items:center}
.btnrow{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center}
.btnrow .lab{font-size:16px;color:var(--muted);margin-right:2px}
.slide-ctl{display:flex;align-items:center;gap:8px;font-size:16px;flex-wrap:wrap}
.slide-ctl input{width:clamp(120px,12vw,190px);vertical-align:middle;accent-color:var(--accent)}
.slide-ctl .val{min-width:44px}
.btn{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--pal-panel);color:var(--fg);border-radius:8px;cursor:pointer;font-size:16px}
.btn.on{background:var(--chip);border-color:var(--accent);color:var(--pal-accent-deep)}
.btn:disabled{opacity:.4;cursor:default}
.readouts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.readout{flex:1 1 150px;min-width:0;padding:4px 10px;border-radius:10px;background:var(--pal-soft);font-size:16px;overflow-wrap:anywhere;overflow:hidden}
.readout .k{color:var(--pal-text-2);font-size:15px}
.readout .val{font-size:17px;font-weight:600;line-height:1.55}
.readout.bad{background:var(--redbg);color:var(--red)}
.readout.bad .k{color:var(--red)}
.legend{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:16px;color:var(--pal-text-2);align-items:center}
.sw{display:inline-block;width:22px;height:0;vertical-align:middle;margin-right:6px}
.chip{display:inline-block;width:16px;height:12px;vertical-align:middle;margin-right:6px;border-radius:2px}
.ring{display:inline-block;width:13px;height:13px;vertical-align:middle;margin-right:6px;border-radius:50%;border:2px solid var(--pal-ink)}

/* Plots fill the height left in the widget column */
.fill{flex:1 1 0;min-height:90px;position:relative;width:100%}
.fill>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.name i{font-style:italic}
.takeholder{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.takeholder .takeaway{align-self:stretch}

/* Proof slides: test and picture on the left, the proof (fl-proof-steps) on the right */
.slide.proof-slide{grid-template-columns:minmax(0,11fr) minmax(0,9fr)}
.slide.proof-slide .side{justify-content:flex-start}
.fill.proofpic{min-height:150px}
.slide.proof-slide .slide-ctl input{width:clamp(90px,9vw,140px)}
.slide.proof-slide .sliders{gap:6px 16px}
.slide.proof-slide .btn{padding:4px 10px}
.part{margin:0;font-weight:600;color:var(--muted)}
.test{display:flex;flex-direction:column;gap:3px}
.test .tries{gap:3px}
.model{margin:0;padding:8px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}

/* Short windows (1100x620 and similar): tighter spacing, body text stays 16px */
@media (max-height: 680px){
  header{padding-top:4px}
  #stage{padding:4px 24px}
  footer{padding:4px 24px}
  .widget{gap:5px}
  .side{gap:4px}
  .tries{gap:2px}
  .sym,.tries,.takeaway,.case{line-height:1.25}
  .takeaway{padding:6px 10px}
  .formula{font-size:20px}
  h2{font-size:20px}
  .question{font-size:16px}
  .fill{min-height:80px}
  .readout{padding:2px 8px}
  .readout .val{line-height:1.5}
  .fill.proofpic{min-height:130px}
  .model{padding:5px 10px}
  .test .tries{gap:1px}
  .btn{padding:4px 10px}
}
</style>
</head>
<body>
<header>Primer · Signals: what a filter does</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script src="../../components/proof-steps.js"></script>
<script>
// ---------- palette and redraw ----------
// COL holds the palette for the SVG being drawn; plotBox reads it at every paint, so a draw always uses the
// current theme. A theme switch redraws the current slide's plots and keeps every control's state.
let COL = {};
const PAL_NAMES = ['bg', 'ink', 'fg', 'text-2', 'muted', 'muted-2', 'grey', 'guide', 'grid', 'line', 'panel', 'soft', 'soft-2',
  'accent', 'accent-2', 'accent-3', 'accent-deep', 'accent-tint', 'accent-soft', 'on-accent',
  'amber', 'amber-bg', 'amber-ink', 'red'];
function readPalette() {
  const o = {};
  for (const n of PAL_NAMES) o[n.replace(/-(\w)/g, (_, c) => c.toUpperCase())] = FluidTheme.color(n);
  return o;
}
let PLOTS = [];
window.addEventListener('fluid-themechange', () => PLOTS.forEach(p => p.redraw()));
// A palette color with alpha, e.g. rgbaOf(COL.accent, 0.5). Takes #rgb, #rrggbb or rgb(...).
function rgbaOf(c, a) {
  let r = 0, g = 0, b = 0;
  const m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(c.trim());
  if (m) {
    let hx = m[1]; if (hx.length === 3) hx = hx.split('').map(x => x + x).join('');
    const n = parseInt(hx, 16); r = n >> 16; g = (n >> 8) & 255; b = n & 255;
  } else {
    const v = (c.match(/[\d.]+/g) || [0, 0, 0]).map(Number); [r, g, b] = v;
  }
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

// ---------- DOM helpers ----------
const $ = s => document.querySelector(s);
const NSV = 'http://www.w3.org/2000/svg', NHT = 'http://www.w3.org/1999/xhtml';
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false }], throwOnError: false };
// Render $...$ in a node. If the CDN did not load, the text stays as typed.
function tex(node) { if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH); return node; }
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function hh(tag, cls, ...kids) { const e = h(tag, cls); for (const k of kids) if (k) e.append(k); return e; }
function mark(e, kind, id, title) { e.dataset.item = kind; if (id != null) e.dataset.id = id; if (title != null) e.dataset.title = title; return e; }
function emit(kind, data) {
  try { if (window.fluid && typeof window.fluid.emit === 'function') Promise.resolve(window.fluid.emit(kind, data)).catch(() => {}); }
  catch (e) { /* the view works without the bridge */ }
}
// Fixed decimals, with no minus sign on zero.
function fx(x, d) { const y = Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x; return y.toFixed(d); }
// A short number: up to d decimals, trailing zeros dropped.
function sn(x, d) { return String(+fx(x, d == null ? 3 : d)); }
// Common fractions as TeX, else a short decimal.
function fracTex(v) {
  const F = [[1 / 3, '\\tfrac13'], [-1 / 3, '-\\tfrac13'], [0.5, '\\tfrac12'], [-0.5, '-\\tfrac12'], [0.25, '\\tfrac14'], [2 / 3, '\\tfrac23']];
  for (const [x, t] of F) if (Math.abs(v - x) < 1e-9) return t;
  return sn(v, 3);
}
// Plain-text cell label: 1/3, 1/2, 1/4 as glyphs, blank for 0.
function cellText(v) {
  if (Math.abs(v) < 1e-9) return '';
  const G = [[1 / 3, '⅓'], [0.5, '½'], [0.25, '¼'], [-0.5, '−½']];
  for (const [x, t] of G) if (Math.abs(v - x) < 1e-9) return t;
  return sn(v, 2).replace('-', '−');
}

// ---------- controls ----------
// A labelled range input. o: {id, min, max, step, value, fmt(v) -> TeX-ready text, onInput(v)}.
function ctl(label, o) {
  const wrap = h('label', 'slide-ctl');
  const lab = setTex(h('span'), label);
  const inp = h('input');
  inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step; inp.value = o.value;
  mark(inp, 'control', o.id, o.id);
  const val = h('span', 'val');
  const show = v => setTex(val, o.fmt(v));
  inp.addEventListener('input', () => { show(+inp.value); o.onInput(+inp.value); });
  show(o.value);
  wrap.append(lab, inp, val);
  return { el: wrap, input: inp, set(v) { inp.value = v; show(v); } };
}
// A row of buttons that pick one choice. choices: [[id, label], ...]; getCur() gives the current id.
function choiceRow(label, choices, getCur, onPick) {
  const row = hh('div', 'btnrow', label ? setTex(h('span', 'lab'), label) : null);
  const btns = choices.map(([id, text]) => {
    const b = mark(h('button', 'btn'), 'control', id);
    setTex(b, text);
    b.addEventListener('click', () => { onPick(id); paint(); });
    row.append(b);
    return [id, b];
  });
  function paint() { btns.forEach(([id, b]) => b.classList.toggle('on', id === getCur())); }
  paint();
  return { el: row, paint };
}
function button(id, label, onClick) {
  const b = mark(h('button', 'btn'), 'control', id);
  setTex(b, label);
  b.addEventListener('click', onClick);
  return b;
}
// A readout box: label and value are TeX-ready text.
function readout(id, label) {
  const box = mark(h('div', 'readout'), 'readout', id);
  const k = setTex(h('div', 'k'), label);
  const v = h('div', 'val');
  box.append(k, v);
  return { el: box, set(text, bad) { setTex(v, text); box.classList.toggle('bad', !!bad); }, label(t) { setTex(k, t); } };
}
// Legend: items {color (CSS), text, kind: 'line' | 'dash' | 'chip' | 'ring'}.
function legend(items) {
  const d = h('div', 'legend');
  for (const it of items) {
    const s = h('span');
    let sw;
    if (it.kind === 'chip') { sw = h('span', 'chip'); sw.style.background = it.color; }
    else if (it.kind === 'ring') { sw = h('span', 'ring'); if (it.color) sw.style.borderColor = it.color; }
    else { sw = h('span', 'sw'); sw.style.borderTop = '3px ' + (it.kind === 'dash' ? 'dashed' : 'solid') + ' ' + it.color; }
    s.append(sw, setTex(h('span'), it.text));
    d.append(s);
  }
  return d;
}
function sym(text) { return setTex(h('p', 'sym'), text); }
function caseLine(text) { return setTex(h('p', 'case'), text); }
function nameLine(html) { const p = h('p', 'sym name'); p.innerHTML = html; return tex(p); }
function triesList(items) { return hh('ol', 'tries', ...items.map(t => setTex(h('li'), t))); }
// The takeaway appears after the first try: on the first click, drag or slider move in the widget, or on "Show".
function takeBox(widget, text) {
  const holder = h('div', 'takeholder');
  const btn = mark(h('button', 'btn'), 'control', 'show-takeaway');
  setTex(btn, 'Show the takeaway');
  const tk = setTex(h('p', 'takeaway'), text);
  tk.hidden = true;
  const show = () => { tk.hidden = false; btn.hidden = true; };
  btn.addEventListener('click', show);
  for (const ev of ['input', 'click', 'pointerdown']) widget.addEventListener(ev, show);
  holder.append(btn, tk);
  return holder;
}
// The side column of a formula slide, after the frame's tag, title, question and formula.
// o: {sym, name, tries, take, next}. The everyday case (o.case) goes right under the question.
function sideStd(widget, side, o) {
  if (o.case) side.querySelector('.question').after(caseLine(o.case));
  if (o.sym) side.append(sym(o.sym));
  if (o.name) side.append(nameLine(o.name));
  if (o.tries) side.append(triesList(o.tries));
  if (o.take) side.append(takeBox(widget, o.take));
  if (o.next) side.append(setTex(h('p', 'next'), o.next));
}

// ---------- SVG helpers ----------
function svgNode(tag, attrs, parent) {
  const e = document.createElementNS(NSV, tag);
  for (const k in attrs) if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function svgRoot(w, ht) { return svgNode('svg', { viewBox: '0 0 ' + w + ' ' + ht, role: 'img', 'font-family': 'system-ui, sans-serif', 'font-size': 14 }); }
function svgText(parent, x, y, s, attrs) {
  const t = svgNode('text', Object.assign({ x: x, y: y, fill: COL.muted, 'font-size': 14 }, attrs || {}), parent);
  t.textContent = s;
  return t;
}
// A KaTeX label inside an SVG: a foreignObject holding a rendered formula. o: {w, anchor, size, fill, bg, bold}.
function svgTex(parent, x, y, s, o) {
  o = o || {};
  const w = o.w || 220, ht = o.ht || 26, anchor = o.anchor || 'middle';
  const x0 = anchor === 'end' ? x - w : anchor === 'start' ? x : x - w / 2;
  const fo = svgNode('foreignObject', { x: x0, y: y - ht / 2, width: w, height: ht }, parent);
  const d = document.createElementNS(NHT, 'div');
  const jc = anchor === 'end' ? 'flex-end' : anchor === 'start' ? 'flex-start' : 'center';
  d.setAttribute('style', 'display:flex;align-items:center;height:100%;white-space:nowrap;font-size:' +
    (o.size || 15) + 'px;color:' + (o.fill || COL.text2) + ';justify-content:' + jc + (o.bold ? ';font-weight:600' : ''));
  const span = document.createElementNS(NHT, 'span');
  span.textContent = s;
  if (o.bg) span.setAttribute('style', 'background:' + o.bg + ';border-radius:5px;padding:1px 6px');
  d.appendChild(span);
  fo.appendChild(d);
  tex(span);
  return fo;
}
// The same label with a halo in the page color, so it reads over a curve or bars.
function haloTex(parent, x, y, s, o) {
  const fo = svgTex(parent, x, y, s, o);
  fo.firstChild.style.textShadow = '0 0 3px ' + COL.bg + ', 0 0 3px ' + COL.bg + ', 0 0 2px ' + COL.bg;
  return fo;
}
function line(svg, x1, y1, x2, y2, o) { return svgNode('line', Object.assign({ x1, y1, x2, y2 }, o || {}), svg); }
function dot(svg, x, y, r, fill, o) { return svgNode('circle', Object.assign({ cx: x, cy: y, r, fill }, o || {}), svg); }
function rect(svg, x, y, w, ht, o) { return svgNode('rect', Object.assign({ x, y, width: Math.max(0, w), height: Math.max(0, ht) }, o || {}), svg); }
// An arrow with a head. o: {color, w, dash, id}.
function arrow(svg, x1, y1, x2, y2, o) {
  const g = svgNode('g', { 'data-item': 'mark', 'data-id': o.id }, svg);
  svgNode('line', { x1, y1, x2, y2, stroke: o.color, 'stroke-width': o.w || 2.5, 'stroke-dasharray': o.dash }, g);
  const len = Math.hypot(x2 - x1, y2 - y1), hl = Math.min(9, len * 0.45);
  if (len > 3) {
    const a = Math.atan2(y2 - y1, x2 - x1), s = hl / 2;
    const bx = x2 - hl * Math.cos(a), by = y2 - hl * Math.sin(a);
    svgNode('polygon', { points: [[x2, y2], [bx - s * Math.sin(a), by + s * Math.cos(a)], [bx + s * Math.sin(a), by - s * Math.cos(a)]].map(p => p.join(',')).join(' '), fill: o.color }, g);
  }
  return g;
}
// Amber marks what the newest proof line is about.
function glowRect(svg, x, y, w, ht, pad) {
  pad = pad == null ? 4 : pad;
  return rect(svg, x - pad, y - pad, w + 2 * pad, ht + 2 * pad, { rx: 6, fill: COL.amberBg, stroke: COL.amber, 'stroke-width': 1.5 });
}
function glowLine(svg, d, wdt) { return svgNode('path', { d, fill: 'none', stroke: COL.amberBg, 'stroke-width': wdt || 10, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, svg); }
// The top row of a proof picture: what the amber part is while a line is lit, else a plain hint.
function picCaption(svg, W, litText, plainText) {
  if (litText) return svgTex(svg, W / 2, 12, litText, { w: W - 4, size: 15, fill: COL.amberInk, bg: COL.amberBg });
  if (plainText) return svgTex(svg, 4, 12, plainText, { w: W - 8, anchor: 'start', size: 15, fill: COL.muted });
  return null;
}
// A plot that takes the height left in its parent. draw(svg, W, H) runs on every resize and redraw.
function plotBox(draw, cls, weight) {
  const wrap = h('div', 'fill' + (cls ? ' ' + cls : ''));
  if (weight) wrap.style.flex = weight + ' 1 0';
  let key = '';
  const paint = force => {
    const w = Math.floor(wrap.clientWidth), ht = Math.floor(wrap.clientHeight);
    if (w < 60 || ht < 40) return;
    if (!force && key === w + 'x' + ht) return;
    key = w + 'x' + ht;
    COL = readPalette();
    const svg = svgRoot(w, ht);
    draw(svg, w, ht);
    wrap.replaceChildren(svg);
  };
  new ResizeObserver(() => paint(false)).observe(wrap);
  const plot = { wrap, redraw: () => paint(true) };
  PLOTS.push(plot);
  return plot;
}
// Axes for a plot. o: {x0, x1, y0, y1, L, R, T, B}. y values outside the range are clamped.
function plotFrame(svg, W, H, o) {
  const L = o.L == null ? 46 : o.L, R = o.R == null ? 14 : o.R, T = o.T == null ? 12 : o.T, B = o.B == null ? 40 : o.B;
  const pw = W - L - R, ph = H - T - B, base = T + ph;
  const X = x => L + (x - o.x0) / (o.x1 - o.x0) * pw;
  const Y = y => base - (Math.max(o.y0, Math.min(o.y1, y)) - o.y0) / (o.y1 - o.y0) * ph;
  line(svg, L, base, W - R, base, { stroke: COL.grey });
  line(svg, L, T, L, base, { stroke: COL.grey });
  if (o.y0 < 0 && o.y1 > 0) line(svg, L, Y(0), W - R, Y(0), { stroke: COL.grey, 'stroke-dasharray': '2 3' });
  return { X, Y, L, R, T, B, pw, ph, base, W, H };
}
function pathOf(P, pts) { return pts.map((p, i) => (i ? 'L' : 'M') + P.X(p[0]).toFixed(1) + ' ' + P.Y(p[1]).toFixed(1)).join(''); }
// Stems for values at n = 0 .. len-1. o: {vals, lo, hi, color, id, label, labelFill, values (print values),
// rings (values drawn as rings), band(n) -> true to shade, bandColor, hollow(n) -> true for an open dot, L, T, B, ticks}.
function stems(svg, W, H, o) {
  const len = o.vals.length, L = o.L == null ? 34 : o.L, R = o.R == null ? 10 : o.R, T = o.T == null ? 30 : o.T, B = o.B == null ? 22 : o.B;
  const cw = (W - L - R) / len;
  const X = n => L + (n + 0.5) * cw;
  const Y = v => T + (o.hi - Math.max(o.lo, Math.min(o.hi, v))) / (o.hi - o.lo) * (H - T - B);
  if (o.band) for (let n = 0; n < len; n++) if (o.band(n)) rect(svg, X(n) - cw / 2 + 2, T - 4, cw - 4, H - T - B + 8, { rx: 6, fill: o.bandColor || COL.accentTint });
  line(svg, L, Y(0), W - R, Y(0), { stroke: COL.grey });
  for (const t of (o.ticks || [])) svgText(svg, L - 6, Y(t) + 5, sn(t, 2).replace('-', '−'), { 'text-anchor': 'end' });
  for (let n = 0; n < len; n++) svgText(svg, X(n), H - 5, String(n + (o.n0 || 0)), { 'text-anchor': 'middle' });
  o.vals.forEach((v, n) => {
    const open = o.hollow && o.hollow(n);
    line(svg, X(n), Y(0), X(n), Y(v), { stroke: o.color, 'stroke-width': 3 });
    dot(svg, X(n), Y(v), 5.5, open ? COL.panel : o.color, { stroke: o.color, 'stroke-width': 2, 'data-item': 'mark', 'data-id': (o.id || 'stem') + '-' + n });
    if (o.values) {
      const up = v >= 0;
      haloTex(svg, X(n), Y(v) + (up ? -15 : 15), o.fmtVal ? o.fmtVal(v, n) : sn(v, 2), { w: cw + 10, size: 14, fill: COL.ink });
    }
  });
  if (o.rings) o.rings.forEach((v, n) => dot(svg, X(n), Y(v), 9.5, 'none', { stroke: COL.ink, 'stroke-width': 1.6 }));
  if (o.label) svgTex(svg, L, 12, o.label, { w: W - L - 4, anchor: 'start', size: 15, fill: o.labelFill || o.color });
  return { X, Y, cw, L, T, B };
}
// One dial per sample: a circle with the complex value as an arrow. o: {zs, scale, color, id, y, r, labels(n) -> text}.
function dialRow(svg, W, o) {
  const len = o.zs.length, cw = W / len, Rc = o.r || Math.min(cw / 2 - 6, 40);
  o.zs.forEach((z, n) => {
    const cx = (n + 0.5) * cw, cy = o.y;
    dot(svg, cx, cy, Rc, COL.panel, { stroke: COL.line });
    line(svg, cx - Rc, cy, cx + Rc, cy, { stroke: COL.soft2 });
    line(svg, cx, cy - Rc, cx, cy + Rc, { stroke: COL.soft2 });
    const k = (o.scale || 1) * (Rc - 4);
    if (Math.hypot(z.re, z.im) * k > 3) arrow(svg, cx, cy, cx + z.re * k, cy - z.im * k, { color: o.color, id: (o.id || 'z') + '-' + n });
    else dot(svg, cx, cy, 3, o.color);
    if (o.labels) svgTex(svg, cx, cy + Rc + 12, o.labels(n), { w: cw, size: 14, fill: o.labelFill || COL.text2 });
  });
  return { cw, Rc };
}

// ---------- complex numbers ----------
const PI = Math.PI, TAU = 2 * PI;
const cis = t => ({ re: Math.cos(t), im: Math.sin(t) });
const cplx = (re, im) => ({ re, im: im || 0 });
const cxAdd = (a, b) => ({ re: a.re + b.re, im: a.im + b.im });
const cxMul = (a, b) => ({ re: a.re * b.re - a.im * b.im, im: a.re * b.im + a.im * b.re });
const cxScale = (a, s) => ({ re: a.re * s, im: a.im * s });
const cxDiv = (a, b) => { const d = b.re * b.re + b.im * b.im; return { re: (a.re * b.re + a.im * b.im) / d, im: (a.im * b.re - a.re * b.im) / d }; };
const cxAbs = a => Math.hypot(a.re, a.im);
const cxArg = a => Math.atan2(a.im, a.re);
// A complex number as TeX (no $): a real number, or length and angle in degrees.
function polarTex(z, d) {
  d = d == null ? 3 : d;
  if (Math.abs(z.im) < 1e-9) return fx(z.re, d);
  let a = cxArg(z) * 180 / PI;
  return fx(cxAbs(z), d) + '\\angle{' + sn(a, 1) + '^\\circ}';
}
const cv = (x, i) => x[((i % x.length) + x.length) % x.length];   // index that wraps

// ---------- proof slides ----------
// Left column of a proof slide: controls, the picture, the test, the mental model.
function proofLeft(widget, o) {
  if (o.controls && o.controls.length) widget.append(hh('div', 'sliders', ...o.controls));
  const p = plotBox(o.draw, 'proofpic');
  widget.append(p.wrap);
  if (o.legend) widget.append(legend(o.legend));
  const test = hh('div', 'test', h('p', 'part', 'Test it'), triesList(o.tests));
  const model = h('p', 'model');
  model.append(h('span', 'part', 'The picture: '), tex(h('span', '', o.model)));
  widget.append(test, model);
  return { redraw: p.redraw, test };
}
// Right column: the proof. Each revealed line lights its part of the picture; once the proof is done,
// the look-back questions take the place of the test under the picture.
function proofRight(side, spec, plot, onLight, o) {
  o = o || {};
  const el = document.createElement('fl-proof-steps');
  el.onEvent = d => emit('view.action', d);
  el.onHighlight = key => onLight(key);
  el.lookBackHost = plot.test;
  el.lookBackHint = 'Look back: under the picture.';
  if (o.primerMoves) el.primerMoves = o.primerMoves;
  if (o.endNote) el.endNote = o.endNote;
  el.data = spec;
  side.append(el);
  return el;
}

// ---------- frame ----------
// SLIDES (defined by each view): {id, tag, title, question, formula, proof, mount(widget, side)}.
let cur = 0, shownId = null, endSent = false;
function goTo(i) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  if (shownId !== null && shownId !== s.id) emit('view.step', { step: s.id });
  shownId = s.id;
  const stage = $('#stage');
  stage.innerHTML = '';
  PLOTS = [];
  const widget = h('div', 'widget');
  const side = hh('div', 'side',
    h('div', 'tag', s.tag),
    setTex(h('h2'), s.title),
    setTex(h('p', 'question'), s.question),
    s.formula ? setTex(h('div', 'formula'), s.formula) : null);
  const sec = mark(h('section', 'slide' + (s.proof ? ' proof-slide' : '')), 'step', s.id, s.title.replace(/\$/g, ''));
  sec.append(widget, side);
  stage.append(sec);
  s.mount(widget, side);
  if (cur === SLIDES.length - 1 && !endSent) { endSent = true; emit('view.action', { action: 'deck-end' }); }
  tex(sec);
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, k) => d.classList.toggle('on', k === cur));
}
// A cue is a state: go to the named step, and do nothing if it is already shown.
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i >= 0 && i !== cur) goTo(i);
}
function startDeck() {
  const dots = $('#dots');
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = s.title.replace(/\$/g, '');
    b.addEventListener('click', () => goTo(i));
    dots.appendChild(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],input[type=number],textarea,select')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
}

// ===== p-signals-1: What a filter does =====
// 8 readings that close into a loop (the ends wrap). Weights [c_-1, c_0, c_1] multiply u_{n-1}, u_n, u_{n+1}.
const N = 8;
const U0 = [4, 3, 1, 0, 1, 0, 2, 3];
const W3 = { avg: [1 / 3, 1 / 3, 1 / 3], gentle: [0.25, 0.5, 0.25], sharpen: [-0.5, 2, -0.5], delay: [1, 0, 0] };
const W3_LABEL = { avg: '3-point average', gentle: 'gentle', sharpen: 'sharpen', delay: 'delay' };
function apply3(w, x) { return x.map((_, n) => w[0] * cv(x, n - 1) + w[1] * cv(x, n) + w[2] * cv(x, n + 1)); }
const knob = x => x.map((v, n) => n * v);            // the slow volume knob: y_n = n u_n
const shiftS = x => x.map((_, n) => cv(x, n - 1));   // (Su)_n = u_{n-1}
const tap = j => Array.from({ length: N }, (_, i) => +(i === j));
// M[n][j] = F(tap j)[n]
function matrixOf(F) { const cols = Array.from({ length: N }, (_, j) => F(tap(j))); return Array.from({ length: N }, (_, n) => cols.map(c => c[n])); }
const FILT = {
  avg: { label: '3-point average', F: x => apply3(W3.avg, x) },
  gentle: { label: 'gentle', F: x => apply3(W3.gentle, x) },
  sharpen: { label: 'sharpen', F: x => apply3(W3.sharpen, x) },
  delay: { label: 'delay', F: x => apply3(W3.delay, x) },
  knob: { label: 'slow knob', F: knob },
};
const NEXT1 = 'Next: Primer · Signals: waves.';

// Drag a stem of u (stems() geometry: L 34, R 10, T 30, B 22): snap to half units in [lo2, hi2].
function dragStems(plot, get, lo, hi, lo2, hi2, onChange) {
  let dragging = false;
  const pick = ev => {
    const r = plot.wrap.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const L = 34, R = 10, T = 30, B = 22, u = get();
    const n = Math.floor((ev.clientX - r.left - L) / ((r.width - L - R) / u.length));
    if (n < 0 || n >= u.length) return;
    const t = (ev.clientY - r.top - T) / (r.height - T - B);
    u[n] = Math.max(lo2, Math.min(hi2, Math.round((hi - t * (hi - lo)) * 2) / 2));
    onChange();
  };
  plot.wrap.style.cursor = 'ns-resize';
  plot.wrap.style.touchAction = 'none';
  plot.wrap.addEventListener('pointerdown', ev => { dragging = true; plot.wrap.setPointerCapture(ev.pointerId); pick(ev); });
  plot.wrap.addEventListener('pointermove', ev => { if (dragging) pick(ev); });
  plot.wrap.addEventListener('pointerup', () => { dragging = false; });
  plot.wrap.addEventListener('pointercancel', () => { dragging = false; });
}
const num = v => sn(v, 2);                          // a reading as plain text
const numTex = v => (v < 0 ? '(' + fracTex(v) + ')' : fracTex(v));

// ---------- 1. A filter smooths a jittery reading ----------
function slideSmooth(widget, side) {
  let u = U0.slice(), n0 = 3;
  const reads = n => [(n + N - 1) % N, n, (n + 1) % N];
  const sl = ctl('output $n$', { id: 'n', min: 0, max: 7, step: 1, value: n0, fmt: v => String(v), onInput: v => { n0 = v; update(); } });
  const rY = readout('y-n', 'the chosen output, from its three readings');
  const inP = plotBox((svg, W, H) => {
    const rd = reads(n0);
    const S = stems(svg, W, H, { vals: u, lo: -0.7, hi: 5.4, color: COL.muted2, id: 'u', values: true, fmtVal: num,
      band: k => rd.includes(k), label: 'grey: readings $u_n$. Drag a stem up or down.', labelFill: COL.text2 });
    if (n0 === 0) haloTex(svg, S.X(7), S.T + 4, 'wraps round', { w: 110, size: 14, fill: COL.accentDeep });
    if (n0 === 7) haloTex(svg, S.X(0), S.T + 4, 'wraps round', { w: 110, size: 14, fill: COL.accentDeep });
  }, null, 1);
  const outP = plotBox((svg, W, H) => {
    stems(svg, W, H, { vals: apply3(W3.avg, u), lo: -0.7, hi: 5.4, color: COL.accent, id: 'y', values: true, fmtVal: num,
      band: k => k === n0, label: 'blue: smoothed readings $y_n$', labelFill: COL.accentDeep });
  }, null, 1);
  dragStems(inP, () => u, -0.7, 5.4, 0, 4.5, update);
  function update() {
    const rd = reads(n0), y = apply3(W3.avg, u)[n0];
    rY.set('$y_{' + n0 + '}=\\tfrac13(' + rd.map(k => num(u[k])).join('+') + ')=' + sn(y, 3) + '$');
    inP.redraw(); outP.redraw();
  }
  widget.append(hh('div', 'sliders', sl.el), inP.wrap, outP.wrap,
    legend([{ kind: 'chip', color: 'var(--pal-accent-tint)', text: 'blue: the three readings that $y_n$ averages' }]),
    hh('div', 'readouts', rY.el));
  sideStd(widget, side, {
    case: 'A thermometer jitters from one reading to the next. Average each reading with its two neighbours, and the jitter calms down.',
    sym: String.raw`$u_n$: reading number $n$, here 8 of them, $n=0$ to $7$. $y_n$: the smoothed reading. The readings close into a loop like a clock, so the neighbour before $u_0$ is $u_7$.`,
    name: '<i>filter</i>: Medieval Latin <i>filtrum</i>, felt. A felt cloth lets some of a liquid through and holds the rest back.',
    tries: [
      String.raw`Set $n=3$: $y_3=\tfrac13(1+0+1)=0.667$. The dip at $u_3=0$ is half filled in.`,
      String.raw`Drag $u_4$ up to $4$. Only $y_3$, $y_4$ and $y_5$ change, each by $1$.`,
      String.raw`Set $n=0$: $y_0$ reads $u_7$, $u_0$, $u_1$, so $y_0=\tfrac13(3+4+3)=3.333$.`],
    take: 'A filter makes each output from a few nearby inputs; the 3-point average fills dips and cuts peaks.' });
  update();
}

// ---------- 2. Other weights, other filters ----------
function slideWeights(widget, side) {
  let key = 'sharpen', n0 = 3;
  const u = U0;
  const pick = choiceRow('weights:', Object.keys(W3).map(k => ['w-' + k, W3_LABEL[k]]), () => 'w-' + key, id => { key = id.slice(2); update(); });
  const sl = ctl('output $n$', { id: 'n', min: 0, max: 7, step: 1, value: n0, fmt: v => String(v), onInput: v => { n0 = v; update(); } });
  const rY = readout('y-n', 'the chosen output');
  const inP = plotBox((svg, W, H) => {
    const w = W3[key], rd = [(n0 + N - 1) % N, n0, (n0 + 1) % N];
    const S = stems(svg, W, H, { vals: u, lo: -0.7, hi: 5.4, color: COL.muted2, id: 'u', values: true, fmtVal: num,
      band: k => rd.includes(k), label: 'grey: readings $u_n$', labelFill: COL.text2, T: 46 });
    rd.forEach((k, i) => svgTex(svg, S.X(k), 32, '$\\times' + numTex(w[i]) + '$', { w: S.cw, size: 15, fill: COL.accentDeep, bold: true }));
  }, null, 1);
  const outP = plotBox((svg, W, H) => {
    stems(svg, W, H, { vals: apply3(W3[key], u), lo: -2.2, hi: 6, color: COL.accent, id: 'y', values: true, fmtVal: num,
      band: k => k === n0, label: 'blue: output $y_n$', labelFill: COL.accentDeep, ticks: [] });
  }, null, 1);
  function update() {
    const w = W3[key], rd = [(n0 + N - 1) % N, n0, (n0 + 1) % N];
    const y = w[0] * u[rd[0]] + w[1] * u[rd[1]] + w[2] * u[rd[2]];
    rY.set('$y_{' + n0 + '}=' + rd.map((k, i) => fracTex(w[i]) + '\\cdot' + num(u[k])).join('+').replace(/\+-/g, '-') + '=' + sn(y, 3) + '$');
    pick.paint(); inP.redraw(); outP.redraw();
  }
  widget.append(pick.el, hh('div', 'sliders', sl.el), inP.wrap, outP.wrap,
    legend([{ kind: 'chip', color: 'var(--pal-accent-tint)', text: 'blue: where the three weights sit for output $n$' }]),
    hh('div', 'readouts', rY.el));
  sideStd(widget, side, {
    case: 'A photo app’s blur and sharpen work this way: the same sliding recipe, with other weights.',
    sym: String.raw`$c_k$: the weight on the reading $k$ steps away; $k=-1$ is the one before. Step 1 used $c_{-1}=c_0=c_1=\tfrac13$. Lecture 14 writes the rule as $y_n=\sum_kc_k\,u_{n+k}$.`,
    tries: [
      String.raw`Keep sharpen, $n=3$: $y_3=-\tfrac12\cdot1+2\cdot0-\tfrac12\cdot1=-1$. The dip gets deeper.`,
      String.raw`Press delay: weights $(1,0,0)$, so $y_n=u_{n-1}$. Every reading moves one step later.`],
    take: 'A filter is a few weights that slide along the record, and other weights give blur, sharpen or delay.' });
  update();
}

// ---------- matrix picture shared by steps 3, 5 and 6 ----------
// o: {M, x0, y0, c, rowHi, colHi, cellFill(n, j) -> color or null, cellLabel(n, j) -> TeX or null}
function drawGrid(svg, o) {
  const { M, x0, y0, c } = o;
  const fs = Math.min(17, c * 0.46);
  for (let j = 0; j < N; j++) svgText(svg, x0 + (j + 0.5) * c, y0 - 7, String(j), { 'text-anchor': 'middle', 'font-size': 13 });
  for (let n = 0; n < N; n++) svgText(svg, x0 - 7, y0 + (n + 0.5) * c + 4, String(n), { 'text-anchor': 'end', 'font-size': 13 });
  for (let n = 0; n < N; n++) for (let j = 0; j < N; j++) {
    const v = M[n][j], f = o.cellFill ? o.cellFill(n, j) : null;
    rect(svg, x0 + j * c + 1, y0 + n * c + 1, c - 2, c - 2, { rx: 3, fill: f || (Math.abs(v) > 1e-9 ? COL.soft : COL.panel), stroke: COL.line, 'data-item': 'mark', 'data-id': 'M-' + n + '-' + j });
    const lab = o.cellLabel ? o.cellLabel(n, j) : null;
    if (lab) svgTex(svg, x0 + (j + 0.5) * c, y0 + (n + 0.5) * c, lab, { w: c + 8, size: Math.min(15, c * 0.42), fill: COL.ink });
    else svgText(svg, x0 + (j + 0.5) * c, y0 + (n + 0.5) * c + fs * 0.36, cellText(v), { 'text-anchor': 'middle', 'font-size': fs, fill: COL.ink });
  }
  if (o.rowHi != null) rect(svg, x0, y0 + o.rowHi * c, N * c, c, { fill: 'none', stroke: COL.accent, 'stroke-width': 2.5, rx: 4 });
  if (o.colHi != null) rect(svg, x0 + o.colHi * c, y0, c, N * c, { fill: 'none', stroke: COL.accent, 'stroke-width': 2.5, rx: 4 });
}
// A column of 8 numbers beside the grid. o: {vals, x, y0, c, title, hi(n) -> highlight, color, outline}
function drawCol(svg, o) {
  const fs = Math.min(16, o.c * 0.42);
  svgTex(svg, o.x + o.c / 2, o.y0 - 12, o.title, { w: 90, size: 15, fill: o.color || COL.ink });
  for (let n = 0; n < N; n++) {
    const hi = o.hi && o.hi(n);
    rect(svg, o.x + 1, o.y0 + n * o.c + 1, o.c - 2, o.c - 2, { rx: 3, fill: hi ? COL.accentTint : COL.panel, stroke: o.outline || COL.line, 'stroke-width': hi ? 2 : 1, 'data-item': 'mark', 'data-id': (o.id || 'col') + '-' + n });
    svgText(svg, o.x + o.c / 2, o.y0 + (n + 0.5) * o.c + fs * 0.36, o.text ? o.text(o.vals[n]) : sn(o.vals[n], 2).replace('-', '−'), { 'text-anchor': 'middle', 'font-size': fs, fill: COL.ink });
  }
}

// ---------- 3. The same filter as a matrix ----------
function slideMatrix(widget, side) {
  let key = 'avg', n0 = 3;
  const u = U0;
  const pick = choiceRow('filter:', [['avg', '3-point average'], ['sharpen', 'sharpen'], ['delay', 'delay']], () => key, id => { key = id; update(); });
  const sl = ctl('row $n$', { id: 'row', min: 0, max: 7, step: 1, value: n0, fmt: v => String(v), onInput: v => { n0 = v; update(); } });
  const rY = readout('row-times-u', 'row $n$ of $M$ times $u$');
  const plot = plotBox((svg, W, H) => {
    const M = matrixOf(FILT[key].F), y = FILT[key].F(u);
    const c = Math.max(18, Math.min((H - 56) / N, (W - 60) / (N + 3.6), 58));
    const total = c * (N + 3.6), x0 = 22 + Math.max(0, (W - 22 - total) / 2), y0 = 50;
    const reads = j => Math.abs(M[n0][j]) > 1e-9;
    drawGrid(svg, { M, x0, y0, c, rowHi: n0, cellFill: (n, j) => (n === n0 && reads(j) ? COL.accentTint : null) });
    svgTex(svg, x0 + N * c / 2, 14, '$M$, the filter as an $8\\times8$ table', { w: N * c + 40, size: 15, fill: COL.ink });
    const ux = x0 + c * (N + 0.4), yx = ux + c * 2.2;
    drawCol(svg, { vals: u, x: ux, y0, c, title: '$u$', hi: reads, id: 'u' });
    svgText(svg, (ux + c + yx) / 2, y0 + N * c / 2 + 7, '=', { 'text-anchor': 'middle', 'font-size': 22, fill: COL.ink });
    drawCol(svg, { vals: y, x: yx, y0, c, title: '$y$', hi: n => n === n0, color: COL.accentDeep, outline: COL.accent, id: 'y' });
  });
  function update() {
    const M = matrixOf(FILT[key].F), y = FILT[key].F(u)[n0];
    const terms = [];
    for (let j = 0; j < N; j++) if (Math.abs(M[n0][j]) > 1e-9) terms.push(fracTex(M[n0][j]) + '\\cdot' + num(u[j]));
    rY.label('row $' + n0 + '$ of $M$ times $u$ gives $y_{' + n0 + '}$');
    rY.set('$' + terms.join('+').replace(/\+-/g, '-') + '=' + sn(y, 3) + '$');
    pick.paint(); plot.redraw();
  }
  widget.append(pick.el, hh('div', 'sliders', sl.el), plot.wrap,
    legend([{ kind: 'chip', color: 'var(--pal-accent-tint)', text: 'blue: the weights in row $n$ and the readings they meet' },
      { kind: 'chip', color: 'var(--pal-soft)', text: 'filled cell: a weight; blank cell: $0$' }]),
    hh('div', 'readouts', rY.el));
  sideStd(widget, side, {
    case: 'Step 2’s sliding weights, written as one table.',
    sym: String.raw`A matrix is a table of weights: output $n$ is row $n$ times the input, entry by entry, added (Primer · Matrices, step 1). $M$: the filter’s $8\times8$ table; row $n$ holds $c_{-1},c_0,c_1$ under $u_{n-1},u_n,u_{n+1}$.`,
    tries: [
      String.raw`Keep row $3$: it holds $\tfrac13,\tfrac13,\tfrac13$ under $u_2,u_3,u_4$, and gives $y_3=0.667$.`,
      String.raw`Move the row down. Each row is the one above, moved one step right. Rows $0$ and $7$ wrap to the far corner.`,
      String.raw`Press delay: one $1$ in each row, just left of the diagonal.`],
    take: 'A sliding filter is a matrix whose rows all hold the same weights, each moved one step.' });
  update();
}

// ---------- 4. Shift the input, and the output shifts ----------
function slideShift(widget, side) {
  let key = 'avg', inp = 'tap';
  const pickF = choiceRow('filter:', [['f-avg', '3-point average'], ['f-knob', 'slow knob, $y_n=n\\,u_n$']], () => 'f-' + key, id => { key = id.slice(2); update(); });
  const pickU = choiceRow('input:', [['in-tap', 'a tap at $n=2$'], ['in-u', 'the readings']], () => 'in-' + inp, id => { inp = id.slice(3); update(); });
  const rV = readout('verdict', 'the two paths');
  const input = () => (inp === 'tap' ? tap(2) : U0.slice());
  const inP = plotBox((svg, W, H) => {
    const x = input();
    stems(svg, W, H, { vals: x, lo: -0.6, hi: 5.4, color: COL.muted2, id: 'u', values: true, fmtVal: num, label: 'grey: input $u$', labelFill: COL.text2 });
  }, null, 0.8);
  const outP = plotBox((svg, W, H) => {
    const F = FILT[key].F, x = input(), a = F(shiftS(x)), b = shiftS(F(x));
    const mx = Math.max(1, ...a, ...b), mn = Math.min(0, ...a, ...b);
    const bad = n => Math.abs(a[n] - b[n]) > 1e-9;
    const S = stems(svg, W, H, { vals: a, lo: mn - 0.15 * (mx - mn), hi: mx * 1.2 + 0.4, color: COL.accent, id: 'path1', values: true, fmtVal: num,
      band: bad, bandColor: COL.soft, label: 'output of each path', labelFill: COL.ink });
    b.forEach((v, n) => dot(svg, S.X(n), S.Y(v), 10, 'none', { stroke: bad(n) ? COL.red : COL.ink, 'stroke-width': bad(n) ? 2.5 : 1.6, 'data-item': 'mark', 'data-id': 'path2-' + n }));
    b.forEach((v, n) => { if (bad(n)) haloTex(svg, S.X(n) + S.cw * 0.42, S.Y(v), sn(v, 2), { w: 40, size: 14, fill: COL.red }); });
  }, null, 1.2);
  function update() {
    const F = FILT[key].F, x = input(), a = F(shiftS(x)), b = shiftS(F(x));
    const i = a.findIndex((v, n) => Math.abs(v - b[n]) > 1e-9);
    rV.set(i < 0 ? 'the same at every $n$: the filter passes' : 'at $n=' + i + '$: $' + num(a[i]) + '$ against $' + num(b[i]) + '$: the filter fails', i >= 0);
    pickF.paint(); pickU.paint(); inP.redraw(); outP.redraw();
  }
  widget.append(pickF.el, pickU.el, inP.wrap, outP.wrap,
    legend([{ kind: 'line', color: 'var(--pal-accent)', text: 'blue stems: delay, then filter: $M(Su)$' },
      { kind: 'ring', text: 'rings: filter, then delay: $S(Mu)$' },
      { kind: 'ring', color: 'var(--pal-red)', text: 'red: the paths differ' }]),
    hh('div', 'readouts', rV.el));
  sideStd(widget, side, {
    case: 'A fair smoother treats Tuesday like Monday: if the readings arrive a day later, the smoothed readings arrive a day later. A volume knob turned up slowly does not.',
    sym: String.raw`$S$: the delay of step 2, $(Su)_n=u_{n-1}$: every reading one step later. A filter is shift-invariant when both paths agree for every input.`,
    tries: [
      String.raw`Keep the 3-point average: rings sit on the stems, for the tap and for the readings.`,
      String.raw`Press slow knob: at $n=3$ one path gives $3$, the other $2$. Delay first, and the tap meets a louder knob.`],
    take: 'A shift-invariant filter does the same thing at every moment: delay the input, and the output is delayed the same way.' });
  update();
}

// ---------- 5. One tap, one echo ----------
function slideImpulse(widget, side) {
  let key = 'avg', j0 = 2;
  const pick = choiceRow('filter:', [['avg', '3-point average'], ['sharpen', 'sharpen'], ['knob', 'slow knob']], () => key, id => { key = id; update(); });
  const sl = ctl('tap at $j$', { id: 'j', min: 0, max: 7, step: 1, value: j0, fmt: v => String(v), onInput: v => { j0 = v; update(); } });
  const rE = readout('echo', 'column $j$ of $M$, the echo');
  const grid = plotBox((svg, W, H) => {
    const M = matrixOf(FILT[key].F), col = M.map(r => r[j0]);
    const c = Math.max(16, Math.min((H - 52) / N, (W - 60) / (N + 3.6), 46));
    const total = c * (N + 3.6), x0 = 22 + Math.max(0, (W - 22 - total) / 2), y0 = 46;
    drawGrid(svg, { M, x0, y0, c, colHi: j0, cellFill: (n, j) => (j === j0 && Math.abs(M[n][j]) > 1e-9 ? COL.accentTint : null) });
    svgTex(svg, x0 + N * c / 2, 14, '$M$', { w: 60, size: 15, fill: COL.ink });
    const ux = x0 + c * (N + 0.4), yx = ux + c * 2.2;
    drawCol(svg, { vals: tap(j0), x: ux, y0, c, title: '$\\delta_{' + j0 + '}$', hi: n => n === j0, text: v => (v ? '1' : ''), id: 'tap' });
    svgText(svg, (ux + c + yx) / 2, y0 + N * c / 2 + 7, '=', { 'text-anchor': 'middle', 'font-size': 22, fill: COL.ink });
    drawCol(svg, { vals: col, x: yx, y0, c, title: '$M\\delta_{' + j0 + '}$', hi: n => Math.abs(col[n]) > 1e-9, color: COL.accentDeep, outline: COL.accent, text: v => cellText(v) || '0', id: 'echo' });
  }, null, 2.3);
  const echoP = plotBox((svg, W, H) => {
    const col = FILT[key].F(tap(j0));
    const mx = Math.max(1, ...col), mn = Math.min(0, ...col);
    stems(svg, W, H, { vals: col, lo: mn - 0.25, hi: mx * 1.35 + 0.2, color: COL.accent, id: 'echo-stem', values: true, fmtVal: v => cellText(v) || '0',
      label: 'blue: the echo of the tap, as a signal', labelFill: COL.accentDeep, T: 26 });
  }, null, 1);
  function update() {
    const col = FILT[key].F(tap(j0));
    rE.label('column $' + j0 + '$ of $M$: the echo of a tap at $' + j0 + '$');
    rE.set('$(' + col.map(v => fracTex(v)).join(',\\,') + ')$');
    pick.paint(); grid.redraw(); echoP.redraw();
  }
  widget.append(pick.el, hh('div', 'sliders', sl.el), grid.wrap, echoP.wrap, hh('div', 'readouts', rE.el));
  sideStd(widget, side, {
    case: 'Clap once in a hall and listen. The echo tells you how the hall changes any sound.',
    sym: String.raw`$\delta_j$: a tap, $1$ at sample $j$ and $0$ elsewhere. Row $n$ times $\delta_j$ keeps only the entry in column $j$ (Primer · Vectors, step 4: multiply entry by entry, add). $h=M\delta_0$: the echo of a tap at $0$, called the impulse response.`,
    tries: [
      String.raw`3-point average, $j=2$: the echo is $\tfrac13$ at $n=1,2,3$. That is column $2$.`,
      String.raw`Drag $j$ from $0$ to $7$. The echo slides along and keeps its shape.`,
      String.raw`Press slow knob: the echo is $2$ at $j=2$ and $3$ at $j=3$. Not the same echo, moved.`],
    take: 'A tap at $j$ reads out column $j$, and for a shift-invariant filter every column is the same echo, moved.' });
  update();
}

// ---------- 6. Why it's true: the shift test forces one row of weights ----------
const ROW_KEYS = [['avg', '3-point average'], ['delay', 'delay'], ['knob', 'slow knob']];
function drawWhyRow(svg, W, H, key, j, lit) {
  const M = matrixOf(FILT[key].F), j1 = (j + 1) % N;
  const CAP = {
    tap: String.raw`amber: the tap at $j$, and one step later, the tap at $j+1$`,
    shift: String.raw`amber: column $j+1$ is column $j$ moved down one row`,
    all: String.raw`amber: every column is column $0$ moved down, so every weight comes from $h$`,
    slant: String.raw`amber: entry $(n,j)$ is $h_{n-j}$: each slant holds one number` }[lit];
  picCaption(svg, W, CAP, String.raw`$M$, a tap $\delta_j$, and its echo $M\delta_j$, column $j$`);
  const c = Math.max(14, Math.min((H - 30 - 50) / N, (W - 50) / (N + 3.6), 44));
  const total = c * (N + 3.6), x0 = 22 + Math.max(0, (W - 22 - total) / 2), y0 = 52;
  const ux = x0 + c * (N + 0.4), yx = ux + c * 2.2;
  // lights under the cells
  if (lit === 'tap') { glowRect(svg, ux, y0 + j * c, c, c, 3); glowRect(svg, ux, y0 + j1 * c, c, c, 3); }
  if (lit === 'shift') for (const cc of [j, j1]) glowRect(svg, x0 + cc * c, y0, c, N * c, 3);
  const dOf = (n, jj) => { let d = ((n - jj) % N + N) % N; if (d > 4) d -= N; return d; };
  const nonzero = (n, jj) => Math.abs(M[n][jj]) > 1e-9;
  drawGrid(svg, { M, x0, y0, c, colHi: j,
    cellFill: (n, jj) => ((lit === 'all' || lit === 'slant') && nonzero(n, jj) ? COL.amberBg : (jj === j && nonzero(n, jj) ? COL.accentTint : null)),
    cellLabel: (n, jj) => (lit === 'slant' && nonzero(n, jj) ? '$h_{' + dOf(n, jj) + '}$' : null) });
  drawCol(svg, { vals: tap(j), x: ux, y0, c, title: '$\\delta_{' + j + '}$', hi: n => n === j, text: v => (v ? '1' : ''), id: 'tap' });
  svgText(svg, (ux + c + yx) / 2, y0 + N * c / 2 + 7, '=', { 'text-anchor': 'middle', 'font-size': 22, fill: COL.ink });
  const col = M.map(r => r[j]);
  drawCol(svg, { vals: col, x: yx, y0, c, title: '$M\\delta_{' + j + '}$', hi: n => Math.abs(col[n]) > 1e-9, color: COL.accentDeep, outline: COL.accent, text: v => cellText(v) || '0', id: 'echo' });
  // the shift test on columns: is column j column j-1 moved down?
  const jm = (j + N - 1) % N, A = M.map(r => r[j]), B = shiftS(M.map(r => r[jm]));
  const i = A.findIndex((v, n) => Math.abs(v - B[n]) > 1e-9);
  svgTex(svg, W / 2, H - 12, i < 0 ? 'column $' + j + '$ is column $' + jm + '$ moved down one row'
    : 'column $' + j + '$ is not column $' + jm + '$ moved down: row $' + i + '$ has $' + num(A[i]) + '$, not $' + num(B[i]) + '$',
    { w: W - 8, size: 15, fill: i < 0 ? COL.ink : COL.red });
}
function slideWhyRow(widget, side) {
  let key = 'avg', j = 2, lit = '';
  const pick = choiceRow('', ROW_KEYS, () => key, id => { key = id; plot.redraw(); });
  const sJ = ctl('$j$', { id: 'j', min: 0, max: 7, step: 1, value: j, fmt: v => String(v), onInput: v => { j = v; plot.redraw(); } });
  const plot = proofLeft(widget, {
    controls: [pick.el, sJ.el],
    draw: (svg, W, H) => drawWhyRow(svg, W, H, key, j, lit),
    tests: [
      String.raw`3-point average: drag $j$, and column $j$ is always column $j-1$ moved down. Guess column $0$ of delay, then check.`,
      String.raw`Slow knob, $j=3$: column $3$ is not column $2$ moved down. Cases are evidence, not proof; one failure disproves.`],
    model: String.raw`Delay the tap, and its echo is delayed too. So each column is the one before, moved down, and every slant of $M$ holds one number.` });
  proofRight(side, {
    id: 'one-row',
    goal: { tex: String.raw`M_{nj}=h_{n-j}`, words: String.raw`each entry depends only on $n-j$, so every row holds the same weights, moved one step.` },
    facts: [
      { words: String.raw`shift test: $MS=SM$`, ref: 'step 4' },
      { words: String.raw`$M\delta_j$ is column $j$; $h=M\delta_0$`, ref: 'step 5' }],
    lines: [
      { tex: String.raw`\delta_{j+1}=S\,\delta_j`, move: 'Unfold the definition',
        why: String.raw`delay a tap at $j$ and you get a tap at $j+1$`, choices: ['Name a piece', 'Change variables'], highlight: 'tap' },
      { tex: String.raw`M\delta_{j+1}=MS\,\delta_j=SM\,\delta_j`, move: 'Use an earlier result',
        why: String.raw`the shift test: column $j+1$ is column $j$ moved down one row`, choices: ['Rearrange', 'Telescope'], highlight: 'shift' },
      { tex: String.raw`M\delta_j=S^j\,h`, move: 'Induction',
        why: String.raw`$S^j$: delay $j$ times. True at $j=0$; line 2 takes $j$ to $j+1$`, choices: ['Take a limit', 'Telescope'], highlight: 'all' },
      { tex: String.raw`M_{nj}=(S^jh)_n=h_{n-j}`, move: 'Unfold the definition',
        why: String.raw`moving down $j$ rows puts $h_{n-j}$ in row $n$`, choices: ['Change variables', 'Compute it two ways'], highlight: 'slant' }],
    lookBack: [
      { q: 'Where did the proof use the shift test?',
        a: String.raw`Only in line 2. The slow knob fails there: its column 3 is $3\delta_3$, not column 2, $2\delta_2$, moved down.` },
      { q: String.raw`Which weight sits $k$ steps away?`,
        a: String.raw`Row $n$ holds $h_{n-j}$ under $u_j$. Put $j=n+k$: $c_k=h_{-k}$, the echo read backwards. For the 3-point average both are $\tfrac13,\tfrac13,\tfrac13$.` },
      { q: 'Why must the filter be a matrix?',
        a: String.raw`The median of 3 passes the shift test, but it has no weights at all: it fails the add test (Primer · Matrices, step 2).` }] },
    plot, key2 => { lit = key2 || ''; plot.redraw(); }, { endNote: NEXT1 });
}

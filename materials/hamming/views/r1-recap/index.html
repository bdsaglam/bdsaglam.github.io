<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>High dimensions in Hamming so far</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../../components/theme.js"></script>
<style>
/* Same look as the l13 decks: white page, blue accent, red only for a flipped bit or a failing check. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft);
  --red:var(--pal-red); --redbg:var(--pal-red-bg);
  --u:clamp(16px,1.3vw,19px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 28px 0;font-size:clamp(13px,1.1vw,15px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(6px,1.1vh,14px) 28px}
footer{display:flex;align-items:center;gap:10px;padding:8px 28px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Slide frame: widget on the left (3/5), text on the right (2/5). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(20px,2.4vw,40px)}
.widget{min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(6px,1vh,10px);overflow:hidden}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(8px,1.5vh,14px)}
.tag{font:14px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(22px,2.1vw,30px);line-height:1.2;margin:0;font-weight:650}
.q{margin:0;font-size:17px;font-weight:600;line-height:1.35}
.kicker{font-size:14px;color:var(--muted);margin:0 0 4px}
.blk{display:flex;flex-direction:column;gap:4px}
.tries{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:8px;font-size:17px;line-height:1.4}
.tries li::marker{color:var(--accent);font-weight:600}
.takeaway{margin:0;padding:12px 14px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px;line-height:1.4}
.takeaway.idle{background:var(--pal-soft-hover);border-left-color:var(--line);color:var(--muted);font-style:italic}
.next{margin:0;font-size:16px;color:var(--muted)}
.note{color:var(--muted);margin:0;font-size:16px}
.btn{font:inherit;padding:6px 14px;border:1px solid var(--line);background:var(--pal-panel);border-radius:8px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Predict cards: three in a row; the verdict shows after a pick */
.predict{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.hold{flex:1 1 auto;min-height:120px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:16px;text-align:center;padding:12px}
.pq{margin:0;font-size:17px;font-weight:600;line-height:1.35}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opt{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--pal-panel);cursor:pointer;min-width:0}
.opt:not([aria-disabled="true"]):hover{border-color:var(--accent)}
.opt[aria-disabled="true"]{cursor:default}
.opt .top{display:flex;gap:8px;align-items:flex-start}
.opt .letter{font-weight:700;color:var(--accent)}
.opt .body{font-size:16px;line-height:1.3}
.opt .verdict{font-size:15px;line-height:1.3;color:var(--muted);border-top:1px solid var(--pal-soft-2);padding-top:5px}
.opt.right{background:var(--chip);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.on{box-shadow:inset 0 0 0 2px var(--pal-ink)}

/* Controls and readouts */
.sliders{display:flex;gap:6px 22px;flex-wrap:wrap;width:100%}
.slide-ctl{display:flex;align-items:center;gap:8px;font-size:16px}
.slide-ctl input{width:clamp(120px,11vw,170px);vertical-align:middle;accent-color:var(--accent)}
.slide-ctl .val{min-width:44px}
.readouts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.readout{flex:1 1 150px;min-width:0;padding:6px 10px;border-radius:10px;background:var(--pal-soft);font-size:16px;overflow-wrap:anywhere}
.readout .k{color:var(--muted);font-size:14px}
.readout .val{font-size:17px;font-weight:600;margin-top:1px}
.readout.hi{background:var(--chip)}
.readout.bad{background:var(--redbg);color:var(--red)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px;border:1px solid var(--pal-line)}

/* Bits */
.bitrow{display:flex;align-items:center;gap:8px;white-space:nowrap}
.bitrow .lab{flex:0 0 110px;font-size:15px;color:var(--muted)}
.bits{font:17px/1.2 ui-monospace,Menlo,monospace;display:flex;gap:3px}
.bit{display:inline-block;min-width:24px;text-align:center;padding:2px 0;border:1px solid var(--pal-soft-2);border-radius:4px;background:var(--pal-panel)}
.bit.hit{color:var(--red);font-weight:700;background:var(--redbg);border-color:var(--red)}
.bit.edit{cursor:pointer}
.bit.edit:hover{border-color:var(--accent)}
.bit.ok{background:var(--chip)}

/* Tables */
.tbl{border-collapse:collapse;font-size:17px;width:100%}
.tbl th,.tbl td{padding:9px 8px;border-bottom:1px solid var(--pal-soft-2);text-align:left;vertical-align:top;line-height:1.3}
.tbl th{font-weight:600;color:var(--muted);font-size:14px}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--pal-soft-hover)}
.tbl tr.on td{background:var(--chip)}
.tbl td.where{white-space:nowrap;color:var(--muted);font-size:15px}
.tbl td.num{white-space:nowrap;text-align:center}

/* Chips: the parameters of a design */
.params{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 auto;align-content:center;justify-content:center}
.pchip{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:84px;padding:10px 8px;font-size:18px !important;border:1px solid var(--line);border-radius:8px;background:var(--pal-panel);font-size:16px}
.pchip .v{font-size:14px;color:var(--muted)}
.pchip.on{border-color:var(--accent);background:var(--chip)}

svg{display:block;max-width:100%}
.svgbox{width:100%;display:flex;justify-content:center;align-items:center;min-height:0}
.svgbox svg{width:100%;height:clamp(160px,32vh,224px)}
.logbar{height:22px;width:100%;border:1px solid var(--pal-guide);border-radius:6px;background:var(--pal-soft);overflow:hidden}
.logfill{height:100%;width:0;background:var(--accent);transition:width .2s}
.logticks{display:flex;justify-content:space-between;font-size:15px;color:var(--muted)}
.nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
@media (max-height:660px){
  header{padding-top:4px}
  #stage{padding:4px 28px}
  footer{padding:4px 28px}
  .widget{gap:4px}
  .opt{padding:5px 7px;gap:4px}
  .opt .body{font-size:15px}
  .opt .verdict{font-size:14px;padding-top:3px}
  .tbl th,.tbl td{padding:4px 6px;font-size:15px}
  .tbl th{font-size:13px}
  .bit{min-width:19px;font-size:15px;padding:1px 0}
  .bits{gap:2px}
  .bitrow .lab{flex-basis:92px;font-size:14px}
  .readout{padding:4px 8px}
  .readout .val{font-size:16px}
  .tries{font-size:15px;gap:4px}
  .takeaway{font-size:15px;padding:8px 12px}
  .nav .btn{padding:4px 10px}
  .svgbox svg{height:150px}
}
</style>
</head>
<body>
<header>High dimensions in Hamming so far. Lectures 9 and 12. Recitation 1, part 1 of 3.</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script>
// ---------- helpers ----------
const $ = s => document.querySelector(s);
const NSV = 'http://www.w3.org/2000/svg', NHT = 'http://www.w3.org/1999/xhtml';
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false } ], throwOnError: false };
function tex(node) {
  if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH);
  return node;
}
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function hh(tag, cls, ...kids) {
  const e = h(tag, cls);
  for (const k of kids) if (k) e.append(k);
  return e;
}
function mark(e, kind, id, title) {
  e.dataset.item = kind;
  if (id != null) e.dataset.id = id;
  if (title != null) e.dataset.title = title;
  return e;
}
function emit(kind, data) {
  try {
    if (window.fluid && typeof window.fluid.emit === 'function') Promise.resolve(window.fluid.emit(kind, data)).catch(() => {});
  } catch (e) { /* no bridge: the view still works */ }
}
function svgNode(tag, attrs, parent) {
  const e = document.createElementNS(NSV, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function svgRoot(w, ht) {
  return svgNode('svg', { viewBox: '0 0 ' + w + ' ' + ht, role: 'img', 'font-family': 'system-ui, sans-serif', 'font-size': 14 });
}
function svgText(parent, x, y, s, attrs) {
  const t = svgNode('text', Object.assign({ x: x, y: y, fill: FluidTheme.color('text-2') }, attrs || {}), parent);
  t.textContent = s;
  return t;
}
// A KaTeX label inside an SVG: a foreignObject holding a rendered formula.
function svgTex(parent, x, y, s, o) {
  o = o || {};
  const w = o.w || 220, ht = 26, anchor = o.anchor || 'middle';
  const x0 = anchor === 'end' ? x - w : anchor === 'start' ? x : x - w / 2;
  const fo = svgNode('foreignObject', { x: x0, y: y - ht / 2, width: w, height: ht }, parent);
  const d = document.createElementNS(NHT, 'div');
  const jc = anchor === 'end' ? 'flex-end' : anchor === 'start' ? 'flex-start' : 'center';
  d.setAttribute('style', 'display:flex;align-items:center;height:100%;white-space:nowrap;font-size:' +
    (o.size || 15) + 'px;color:' + (o.fill || 'var(--pal-text-2)') + ';justify-content:' + jc);
  const span = document.createElementNS(NHT, 'span');
  span.textContent = s;
  d.appendChild(span);
  fo.appendChild(d);
  tex(span);
  return fo;
}
// A labelled range input. label is LaTeX-ready text; fmt maps the value to text.
function slider(label, o) {
  const wrap = h('label', 'slide-ctl');
  const lab = tex(h('span', '', label));
  const val = h('span', 'val', '');
  const inp = h('input');
  inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step; inp.value = o.value;
  mark(inp, 'control', o.id, o.name || o.id);
  wrap.append(lab, inp, val);
  const fmt = o.fmt || String;
  const api = {
    el: wrap, input: inp,
    get value() { return +inp.value; },
    show() { setTex(val, fmt(+inp.value)); },
    setMax(m) { inp.max = m; if (+inp.value > m) inp.value = m; api.show(); },
  };
  inp.addEventListener('input', () => { api.show(); if (o.onInput) o.onInput(+inp.value); });
  api.show();
  return api;
}
// A readout box: label and value are LaTeX-ready text.
function readout(id, label) {
  const box = mark(h('div', 'readout'), 'readout', id);
  const k = h('div', 'k');
  setTex(k, label);
  const v = h('div', 'val');
  box.append(k, v);
  return { el: box, set(text, cls) { setTex(v, text); box.className = 'readout' + (cls ? ' ' + cls : ''); } };
}
// Numbers for readouts. Large counts become a power of ten.
function powTex(x) {
  if (x === 0) return '0';
  if (x < 10) return x.toPrecision(3);
  if (x < 1e4) return String(Math.round(x));
  const e = Math.floor(Math.log10(x));
  let m = x / Math.pow(10, e);
  if (m >= 9.995) { m = 1; }
  const ms = m.toFixed(2);
  if (ms === '1.00') return '$10^{' + (e + (m === 1 && x / Math.pow(10, e) >= 9.995 ? 1 : 0)) + '}$';
  return '$' + ms + '\\times 10^{' + e + '}$';
}
// Seeded random numbers (same generator as the l13 decks).
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// ---------- the four slides ----------
// Each slide: predict (optional: a question with three cards, widget after the pick), build(box), tries, takeaway.
const SLIDES = [];

// 1. Design space count (predict)
SLIDES.push({
  id: 'design-count', tag: 'Lecture 9 · 03:18 and 44:57', title: 'Design space: one dimension per parameter',
  question: 'How many designs does a problem with ten parameters have, if each parameter takes ten values?',
  predict: {
    prompt: 'Ten parameters, ten values each (Hamming, 44:57). How many designs are there?',
    opts: [
      { text: '$10 \\times 10 = 100$', verdict: 'Adds the choices. A design picks one value for each parameter, so the counts multiply.', ok: false },
      { text: '$10^{5}$', verdict: 'No rule here gives five powers of ten. Each parameter multiplies the count.', ok: false },
      { text: '$10^{10}$', verdict: 'Yes. Each of the 10 parameters multiplies the count by 10. Hamming: "10 to the 10th cases."', ok: true },
    ]
  },
  build(box) {
    let n = 10, v = 10;
    const chips = h('div', 'params');
    const sN = slider('$n$, parameters', { id: 'n', name: 'parameters', min: 1, max: 10, step: 1, value: n, fmt: x => String(x), onInput: x => { n = x; draw(); } });
    const sV = slider('$v$, values each', { id: 'v', name: 'values per parameter', min: 2, max: 10, step: 1, value: v, fmt: x => String(x), onInput: x => { v = x; draw(); } });
    const rN = readout('designs', 'designs: $v^{n}$');
    const rT = readout('years', 'checked at one design per second: years');
    const logBar = h('div', 'logbar');
    const logFill = h('div', 'logfill');
    logBar.append(logFill);
    const logTicks = h('div', 'logticks');
    [0, 3, 6, 9, 12].forEach(e => logTicks.append(setTex(h('span', '', '$10^{' + e + '}$'), '$10^{' + e + '}$')));
    const logLab = setTex(h('p', 'note', 'Size of the design space on a log scale: $\\log_{10}$ of the count.'), 'Size of the design space on a log scale: $\\log_{10}$ of the count.');
    const note = h('p', 'note', 'Each box is one dimension. A design is one point: one value in each box.');
    box.append(hh('div', 'sliders', sN.el, sV.el), note, chips, hh('div', 'readouts', rN.el, rT.el), logLab, logBar, logTicks);
    function draw() {
      chips.replaceChildren();
      for (let i = 1; i <= n; i++) {
        const c = h('div', 'pchip on');
        c.append(setTex(h('span', '', '$p_{' + i + '}$'), '$p_{' + i + '}$'), setTex(h('span', 'v', '$' + v + '$ values'), '$' + v + '$ values'));
        chips.appendChild(c);
      }
      const total = Math.pow(v, n);
      rN.set(powTex(total), 'hi');
      rT.set(powTex(total / 3.156e7), '');
      logFill.style.width = (100 * Math.min(1, Math.log10(total) / 12)).toFixed(1) + '%';
    }
    draw();
  },
  tries: ['Set $n=10$ and $v=10$. Read the designs count.', 'Set $v=2$, then $n=10$. Which setting gives the most designs?', 'Add one parameter. Does the count add or multiply?'],
  takeaway: 'Each parameter is a new dimension, and the count of designs multiplies with it. That is why a search over the design space is hard.'
});

// 2. Distances (predict)
SLIDES.push({
  id: 'distance-metrics', tag: 'Lecture 9 · 34:00–41:46', title: 'Which distance counts the bits that differ?',
  question: 'Two bit strings differ in 3 places. Which distance gives 3?',
  predict: {
    prompt: 'Two bit strings differ in 3 places. Which distance says 3?',
    opts: [
      { text: '$L_\\infty$: the largest coordinate difference', verdict: 'No. For 0 and 1 bits the largest difference is 1, however many bits differ.', ok: false },
      { text: '$L_2$: the Pythagorean distance', verdict: 'No. It gives $\\sqrt{3} \\approx 1.73$. Pythagoras adds squares, so it is not a count here.', ok: false },
      { text: '$L_1$: the sum of the differences', verdict: 'Yes. For bits, $L_1$ is the number of bits that differ. Hamming, 37:07.', ok: true },
    ]
  },
  build(box) {
    let n = 12, k = 3;
    const rowsBox = h('div', 'bitrows');
    rowsBox.style.cssText = 'display:flex;flex-direction:column;gap:6px';
    const sK = slider('$k$, bits that differ', { id: 'k', name: 'bits that differ', min: 0, max: 12, step: 1, value: k, fmt: x => String(x), onInput: x => { k = x; draw(); } });
    const sN = slider('$n$, bits per word', { id: 'n', name: 'bits per word', min: 4, max: 16, step: 1, value: n, fmt: x => String(x), onInput: x => { n = x; sK.setMax(n); k = sK.value; draw(); } });
    const r1 = readout('L1', '$L_1$: sum of differences (bits that differ)');
    const r2 = readout('L2', '$L_2$: $\\sqrt{\\text{sum of squared differences}}$');
    const rI = readout('Linf', '$L_\\infty$: largest difference');
    const shapes = h('div', 'svgbox');
    const sv = svgRoot(470, 150);
    const R = 52, cx = [60, 235, 410];
    // L1 unit ball (diamond), L2 (circle), Linf (square), all radius 1
    const dia = svgNode('polygon', { points: [[cx[0], 75 - R], [cx[0] + R, 75], [cx[0], 75 + R], [cx[0] - R, 75]].map(p => p.join(',')).join(' '), 'stroke-width': 2, 'data-item': 'shape', 'data-id': 'L1' }, sv);
    const circ = svgNode('circle', { cx: cx[1], cy: 75, r: R, 'stroke-width': 2, 'data-item': 'shape', 'data-id': 'L2' }, sv);
    const sq = svgNode('rect', { x: cx[2] - R, y: 75 - R, width: 2 * R, height: 2 * R, 'stroke-width': 2, 'data-item': 'shape', 'data-id': 'Linf' }, sv);
    const paintShapes = () => {   // palette read at paint time; repainted on a theme switch
      dia.setAttribute('fill', FluidTheme.color('accent-soft')); dia.setAttribute('stroke', FluidTheme.color('accent'));
      circ.setAttribute('fill', FluidTheme.color('soft')); circ.setAttribute('stroke', FluidTheme.color('muted'));
      sq.setAttribute('fill', FluidTheme.color('soft-hover')); sq.setAttribute('stroke', FluidTheme.color('muted'));
    };
    paintShapes();
    REDRAW.push(paintShapes);
    svgTex(sv, cx[0], 140, '$L_1$ ball', { w: 130 });
    svgTex(sv, cx[1], 140, '$L_2$ ball', { w: 130 });
    svgTex(sv, cx[2], 140, '$L_\\infty$ ball', { w: 130 });
    shapes.append(sv);
    const note = h('p', 'note', 'Three shapes of radius 1. Which one keeps its size when bits flip?');
    box.append(hh('div', 'sliders', sN.el, sK.el), rowsBox, hh('div', 'readouts', r1.el, r2.el, rI.el), note, shapes);
    function draw() {
      const r = mulberry32(1000 + n * 31);
      const a = [];
      for (let i = 0; i < n; i++) a.push(r() < 0.5 ? 0 : 1);
      const pos = [...Array(n).keys()];
      for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [pos[i], pos[j]] = [pos[j], pos[i]]; }
      const flip = new Set(pos.slice(0, k));
      const b = a.map((x, i) => flip.has(i) ? 1 - x : x);
      const mkRow = (lab, bits, hits) => {
        const line = h('div', 'bitrow');
        line.append(setTex(h('span', 'lab'), lab));
        const cells = h('div', 'bits');
        bits.forEach((x, i) => cells.append(h('span', 'bit' + (hits && hits.has(i) ? ' hit' : ''), String(x))));
        line.append(cells);
        return line;
      };
      rowsBox.replaceChildren(mkRow('word $a$', a, null), mkRow('word $b$', b, flip));
      r1.set(String(k), 'hi');
      r2.set(Math.sqrt(k).toFixed(3), '');
      rI.set(String(k > 0 ? 1 : 0), '');
    }
    draw();
  },
  tries: ['Set $k=3$, then $k=5$. Watch which readout follows the count.', 'Set $k=1$. Which readout still says 1, and which one says 1.000 only by chance?', 'Set $k=0$, then $k=12$. Which distance grows with the number of errors?'],
  takeaway: 'For bit strings, count the bits that differ. That count is $L_1$, and $L_\\infty$ cannot count errors.'
});

// 3. Walk: check bits fall as dimension rises (predict)
const WALK_T = 4096, WALK_D = [2, 3, 4, 6, 12];
SLIDES.push({
  id: 'walk-dimensions', tag: 'Lecture 12 · 05:47–11:38', title: 'Lifting the walk: check bits fall with dimension',
  question: 'When the same 4096 bits move into more dimensions, how many check bits do you need?',
  predict: {
    prompt: 'Hamming\'s walk: 4096 bits in all. Put them in 12 dimensions, so each side has 2 corners. How many check bits?',
    opts: [
      { text: '127: the square\'s count, one check per row and column', verdict: 'That is the square: a 64 × 64 square needs 127. Twelve axes add one check each.', ok: false },
      { text: '13: one overall check, plus one per axis', verdict: 'Yes. Hamming, 11:07: $n+1$ checks for $2^{n}$ bits.', ok: true },
      { text: '2048: half the bits', verdict: 'No layout needs that many. The check bits are a small share here.', ok: false },
    ]
  },
  build(box) {
    let idx = 0;
    const sD = slider('$d$, dimensions', { id: 'd', name: 'dimensions', min: 0, max: WALK_D.length - 1, step: 1, value: idx, fmt: x => '$d=' + WALK_D[x] + '$', onInput: x => { idx = x; draw(); } });
    const shape = h('p', 'note');
    const rS = readout('side', 'side $s = 4096^{1/d}$');
    const rC = readout('checks', 'check bits $1+d(s-1)$');
    const rD = readout('data', 'data bits $4096 - \\text{checks}$');
    const rR = readout('redund', 'redundancy: checks / data');
    const bars = h('div', 'svgbox');
    box.append(sD.el, shape, hh('div', 'readouts', rS.el, rC.el, rD.el, rR.el), bars);
    function draw() {
      const d = WALK_D[idx], s = Math.round(Math.pow(WALK_T, 1 / d));
      const c = 1 + d * (s - 1), data = WALK_T - c, red = c / data;
      rS.set('$' + s + '$', '');
      rC.set('$' + c + '$', 'hi');
      rD.set('$' + data + '$', '');
      rR.set((100 * red).toFixed(2) + '%', '');
      setTex(shape, d === 2 ? 'Side 64: the square. A check per row, a check per column, and one corner check.'
        : d === 3 ? 'Side 16: the cube. A check on each slice of each axis, plus one overall check.'
        : 'Side ' + s + ': ' + d + ' axes, each with ' + (s - 1) + (s - 1 === 1 ? ' slice check' : ' slice checks') + ', plus one overall check.');
      // bar chart of check bits per dimension
      const W = 520, H = 196, L = 40, B = 34, T = 46, bw = 56;
      const svg = svgRoot(W, H);
      const slot = (W - L - 10) / WALK_D.length, base = H - B, maxC = 127, sc = (base - T) / maxC;
      svgNode('line', { x1: L, y1: base, x2: W - 6, y2: base, stroke: FluidTheme.color('grey') }, svg);
      WALK_D.forEach((dd, i) => {
        const ss = Math.round(Math.pow(WALK_T, 1 / dd));
        const cc = 1 + dd * (ss - 1);
        const x = L + slot * i + (slot - bw) / 2;
        const bar = svgNode('rect', { x: x, y: base - cc * sc, width: bw, height: cc * sc, fill: i === idx ? FluidTheme.color('accent') : FluidTheme.color('grey'), 'data-item': 'bar', 'data-id': 'd' + dd, 'data-title': 'd = ' + dd + ', checks ' + cc }, svg);
        svgText(svg, x + bw / 2, base - cc * sc - 6, String(cc), { 'text-anchor': 'middle', fill: FluidTheme.color('ink') });
        svgTex(svg, x + bw / 2, base + 16, '$d=' + dd + '$', { w: 60 });
      });
      svgTex(svg, 4, 10, '$\\text{check bits}$', { w: 120, anchor: 'start' });
      bars.replaceChildren(svg);
    }
    REDRAW.push(draw);
    draw();
  },
  tries: ['Move $d$ to 2, the square. Read the check bits.', 'Move $d$ to 12. Which count falls, and which one stays?', 'In the 12-cube, name the axis that gives each extra check.'],
  takeaway: 'Lifting the same 4096 bits into more dimensions cut the check bits from 127 to 13.'
});

// 4. Code words as packed spheres (predict)
const CW = [];
(function buildCodewords() {
  for (let x = 0; x < 128; x++) {
    const b = [0];
    for (let p = 1; p <= 7; p++) b[p] = (x >> (7 - p)) & 1;
    const ok = [1, 2, 4].every(v => { let s = 0; for (let p = 1; p <= 7; p++) if (p & v) s ^= b[p]; return s === 0; });
    if (ok) CW.push(b.slice(1));
  }
})();
function dist(a, b) { let d = 0; for (let i = 0; i < a.length; i++) d += a[i] !== b[i] ? 1 : 0; return d; }
SLIDES.push({
  id: 'code-spheres', tag: 'Lecture 12 · 28:36–34:58', title: 'Codes as packed spheres in the 7-cube',
  question: 'How can 16 code words cover the 7-cube with no corner left out?',
  predict: {
    prompt: 'Hamming\'s (7,4) code: 16 of the 128 corners of the 7-cube are code words. How many corners lie within distance 1 of one code word?',
    opts: [
      { text: '7: its neighbours only', verdict: 'No. The code word itself is in its sphere too.', ok: false },
      { text: '8: itself and its 7 neighbours', verdict: 'Yes. $1 + 7 = 8$. A sphere of radius 1 holds the centre and each one-bit flip.', ok: true },
      { text: '16: one per code word', verdict: 'No. 16 is how many code words there are, not the size of a sphere.', ok: false },
    ]
  },
  build(box) {
    let ci = 0;
    const rowsBox = h('div', 'bitrows');
    rowsBox.style.cssText = 'display:flex;flex-direction:column;gap:2px';
    const nav = h('div', 'nav');
    const bPrev = h('button', 'btn', 'Previous code word');
    const bNext = h('button', 'btn', 'Next code word');
    const cnt = h('span', 'note');
    nav.append(bPrev, bNext, cnt);
    bPrev.addEventListener('click', () => { ci = (ci + CW.length - 1) % CW.length; draw(); });
    bNext.addEventListener('click', () => { ci = (ci + 1) % CW.length; draw(); });
    // the received word: the user edits it; it starts as the shown code word
    let rx = CW[0].slice();
    const rxRow = h('div', 'bitrow');
    const rxCells = h('div', 'bits');
    const rR = readout('nearest', 'nearest code word and distance');
    const rS = readout('sphere', 'corners covered: 16 code words × 8');
    rS.set('$= 128 = 2^{7}$', '');
    box.append(nav, rowsBox, h('p', 'note', 'Your word (click a bit to flip it):'), rxRow, hh('div', 'readouts', rR.el, rS.el));
    rxRow.append(setTex(h('span', 'lab'), 'your word'), rxCells);
    rxRow.className = 'bitrow';
    rxRow.firstChild.style.cssText = 'flex:0 0 110px;font-size:15px;color:var(--muted)';
    function drawRx() {
      rxCells.replaceChildren();
      rx.forEach((x, i) => {
        const c = mark(h('span', 'bit edit' + (x !== CW[ci][i] ? ' hit' : ''), String(x)), 'bit', 'rx-' + (i + 1));
        c.addEventListener('click', () => { rx[i] ^= 1; drawRx(); });
        rxCells.appendChild(c);
      });
      // nearest code word
      let best = 99, who = -1, ties = 0;
      CW.forEach((w, j) => { const d = dist(rx, w); if (d < best) { best = d; who = j; ties = 1; } else if (d === best) ties++; });
      if (best <= 1 && ties === 1) {
        rR.set('code word ' + (who + 1) + ', distance ' + best, best === 0 ? '' : 'hi');
      } else {
        rR.set('distance ' + best + ' or more: no unique sphere', 'bad');
      }
    }
    function draw() {
      const c = CW[ci];
      cnt.textContent = '';
      setTex(cnt, 'code word ' + (ci + 1) + ' of 16');
      rowsBox.replaceChildren();
      const head = h('div', 'bitrow');
      head.append(h('span', 'lab', ''));
      const hc = h('div', 'bits');
      for (let p = 1; p <= 7; p++) { const s = h('span', 'bit', String(p)); s.style.cssText = 'border:none;color:var(--pal-muted);font-size:14px;background:none'; hc.append(s); }
      head.append(hc);
      rowsBox.append(head);
      const mk = (lab, word, hitPos) => {
        const line = h('div', 'bitrow');
        line.append(setTex(h('span', 'lab'), lab));
        const cells = h('div', 'bits');
        word.forEach((x, i) => cells.append(h('span', 'bit' + (hitPos === i ? ' hit' : ''), String(x))));
        line.append(cells);
        return mark(line, 'row', lab, lab);
      };
      rowsBox.append(mk('code word $c$', c, -1));
      for (let p = 0; p < 7; p++) {
        const w = c.slice(); w[p] ^= 1;
        rowsBox.append(mk('flip bit ' + (p + 1), w, p));
      }
      drawRx();
    }
    rx = CW[0].slice();
    draw();
  },
  tries: ['Click "Next code word". Each sphere has the same 8 corners in its shape.', 'Click bits in "your word" until it is one flip from a code word. Which code word wins?', 'Flip two bits. Does the nearest code word stay unique?'],
  takeaway: 'Each code word claims 8 corners, and 16 × 8 = 2^7. Every corner of the 7-cube belongs to exactly one sphere: the code is perfect.'
});

// ---------- state, drawing, navigation ----------
const state = SLIDES.map(() => ({ pick: null }));
let REDRAW = [];   // repaints the JS-drawn SVG of the current slide; a theme switch calls them
window.addEventListener('fluid-themechange', () => REDRAW.forEach(f => f()));
let cur = 0, shownId = null, deckEnded = false;
const LAST = SLIDES.length - 1;

function pick(L) {
  const i = cur, s = SLIDES[i];
  if (state[i].pick !== null) return;
  const k = 'ABC'.indexOf(L);
  state[i].pick = L;
  emit('view.action', { action: 'pick', step: s.id, option: L, correct: !!s.predict.opts[k].ok });
  draw();
}

function predictCard(s, st) {
  const card = h('div', 'predict');
  card.append(setTex(h('p', 'pq'), s.predict.prompt));
  const opts = h('div', 'opts');
  s.predict.opts.forEach((o, k) => {
    const L = 'ABC'[k];
    const c = mark(h('div', 'opt'), 'option', L, o.text);
    c.setAttribute('role', 'button');
    c.setAttribute('aria-disabled', st.pick !== null ? 'true' : 'false');
    c.tabIndex = st.pick !== null ? -1 : 0;
    c.classList.toggle('on', st.pick === L);
    c.classList.toggle('right', st.pick !== null && !!o.ok);
    c.append(hh('div', 'top', setTex(h('span', 'letter'), L), setTex(h('span', 'body'), o.text)));
    if (st.pick !== null) c.append(setTex(h('div', 'verdict'), o.verdict));
    c.addEventListener('click', () => pick(L));
    opts.append(c);
  });
  card.append(opts);
  return card;
}

function draw() {
  const i = cur, s = SLIDES[i], st = state[i];
  REDRAW = [];
  const sec = mark(h('section', 'slide'), 'step', s.id, s.title);
  const widget = h('div', 'widget');
  if (s.predict) {
    widget.append(predictCard(s, st));
    if (st.pick !== null) { const body = h('div', 'widget'); body.style.gap = 'clamp(6px,1vh,10px)'; body.style.flex = '1 1 auto'; s.build(body); widget.append(body); }
    else widget.append(h('div', 'hold', 'Pick one card. The verdicts and the widget open here.'));
  } else {
    s.build(widget);
  }
  const side = h('div', 'side');
  side.append(h('div', 'tag', s.tag), setTex(h('h2'), s.title), setTex(h('p', 'q'), s.question));
  if (s.tries && s.tries.length) {
    side.append(hh('div', 'blk', h('div', 'kicker', 'Try it'), hh('ol', 'tries', ...s.tries.map(t => setTex(h('li', ''), t)))));
  }
  if (!s.predict || st.pick !== null) side.append(setTex(h('p', 'takeaway'), s.takeaway));
  else side.append(h('p', 'takeaway idle', 'Takeaway: shown after your pick.'));
  if (i === LAST) side.append(setTex(h('p', 'next'), 'Next: what high dimensions look like.'));
  sec.append(widget, side);
  $('#stage').replaceChildren(sec);
  $('#stage').scrollTop = 0;
  tex(sec);
}

function paintNav() {
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === LAST;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, i) => d.classList.toggle('on', i === cur));
}

function goTo(i) {
  cur = Math.max(0, Math.min(LAST, i));
  const s = SLIDES[cur];
  if (shownId !== null && shownId !== s.id) emit('view.step', { step: s.id });
  shownId = s.id;
  draw();
  paintNav();
  if (cur === LAST && !deckEnded) { deckEnded = true; emit('view.action', { action: 'deck-end' }); }
}

// A cue is a state: go to the named step; a repeated cue does nothing.
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i >= 0 && i !== cur) goTo(i);
}

(function init() {
  const dots = $('#dots');
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = s.title;
    b.addEventListener('click', () => goTo(i));
    dots.appendChild(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],textarea,select')) return;
    if (e.target && e.target.classList && e.target.classList.contains('opt') && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault(); e.target.click(); return;
    }
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
})();
</script>

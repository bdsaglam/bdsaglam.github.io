<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Before Lecture 26: inspect the claim</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><script src="../../components/theme.js"></script><style>*{box-sizing:border-box}body{margin:0;background:var(--pal-bg);color:var(--pal-fg);font:18px/1.42 system-ui,sans-serif}main{height:100vh;padding:26px 30px;display:grid;grid-template-rows:58px 1fr 44px;gap:15px}header,footer{display:flex;align-items:center;justify-content:space-between;gap:14px}h1{font-size:24px;margin:0}h2{font-size:29px;line-height:1.15;margin:0 0 12px}p{margin:0 0 14px}.tag{color:var(--pal-muted);font-size:16px}.body{display:grid;grid-template-columns:59% 1fr;gap:28px;min-height:0}.lab{border:1px solid var(--pal-line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:15px;background:var(--pal-panel);min-height:0}.lesson{padding:8px 0;display:flex;flex-direction:column}.question{font-size:20px}.defs{color:var(--pal-text-2);margin-bottom:14px;font-size:17px}.formula{font-size:26px;margin-bottom:10px}.take{background:var(--pal-accent-soft);padding:15px;border-radius:10px;font-size:18px;margin-top:auto}ol{padding-left:25px;margin:5px 0 18px}li{padding:4px 0}button,select{font:inherit;color:var(--pal-fg);background:var(--pal-soft);border:1px solid var(--pal-line);border-radius:8px;padding:9px 14px;cursor:pointer}button:hover{background:var(--pal-accent-soft)}button:disabled{opacity:.45;cursor:default}.chart{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.chart svg{width:100%;height:100%}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:16px}.legend span:before{content:'';display:inline-block;width:20px;height:4px;background:var(--c);margin-right:7px;vertical-align:middle}.readout{padding:13px;background:var(--pal-soft);border-radius:8px;font-size:18px;min-height:55px}.controls{display:flex;align-items:center;gap:16px}.controls label{display:flex;align-items:center;gap:16px;flex:1}input[type=range]{flex:1;accent-color:var(--pal-accent)}.intro,.choices,.proof{display:flex;flex-direction:column;flex:1;gap:17px;justify-content:center}.intro>div{border-left:4px solid var(--pal-accent);background:var(--pal-soft);padding:20px;font-size:22px}.intro small,.choice small{display:block;font-size:17px;margin-top:8px;color:var(--pal-text-2)}.choice{text-align:left;padding:18px;font-size:20px}.verdict{border-top:1px solid var(--pal-line);margin-top:10px;padding-top:10px;font-size:17px;color:var(--pal-accent-deep)}.proof-row{padding:10px;background:var(--pal-soft);font-size:22px;border-left:4px solid var(--pal-line)}.proof-row:last-child{background:var(--pal-amber-row);border-color:var(--pal-amber)}.proof-row small{display:block;font-size:16px;margin-top:3px;color:var(--pal-text-2)}.guess{font-size:17px}.guess button{font-size:16px;padding:5px 8px;margin:4px 4px 0 0}.proof{gap:10px}.choice{font-size:19px;padding:14px}.choice small,.verdict{font-size:16px;line-height:1.35}.source{color:var(--pal-muted);font-size:15px}a{color:var(--pal-accent-deep)}.pages{font-size:16px;color:var(--pal-muted)}.audit-card{padding:20px;text-align:left;font-size:21px}.audit-card small{display:block;margin-top:12px;font-size:18px}.table{width:100%;border-collapse:collapse;font-size:22px}.table td,.table th{padding:23px 14px;border-bottom:1px solid var(--pal-line);text-align:left}.table th{font-size:18px}.big{font-size:36px;color:var(--pal-accent-deep)}.bars{display:flex;flex-direction:column;gap:30px;justify-content:center;flex:1}.bar{height:46px;background:var(--pal-accent);min-width:3px}.barrow>span{display:block;margin-bottom:8px}.marker{border-left:3px solid var(--pal-amber);height:100%}.readout{min-height:68px}.choice{line-height:1.35}</style></head><body><main><header><h1>Before Lecture 26: inspect the claim</h1><span id="tag" class="tag"></span></header><section class="body"><div id="lab" class="lab"></div><article class="lesson"><h2 id="title"></h2><p id="question" class="question"></p><div id="defs" class="defs"></div><div id="formula" class="formula"></div><ol id="tries"></ol><div id="take" class="take"></div></article></section><footer><button id="prev">← Previous</button><span class="pages" id="pages"></span><span class="source">L26 · manual study · <a href="https://www.youtube.com/watch?v=KWNBzAgAiMc" target="_blank">lecture source</a></span><button id="next">Next →</button></footer></main><script>const slides=[{"id": "why", "kind": "intro", "title": "An expert gives you a confident no", "time": "Before \u00b7 supports 09:33; 31:56", "q": "How can you use expertise without inheriting its blind spots?", "defs": "An expert recognizes patterns quickly. The danger begins when a familiar pattern hides a changed condition.", "tries": ["Inspect a claim before accepting or rejecting it.", "Keep a condition that would change your mind."], "take": "Map: problem \u2192 assumptions \u2192 a test. After the lecture, use small models to price changed conditions and attention.", "cards": [["The case", "A colleague says a computation is too slow. That was true on the old machine. What must you check on the new one?"], ["What you will be able to do", "Turn a confident verdict into a claim with a scope and a test."], ["Why study this?", "Lecture 26 examines expertise. In AI work, old cost estimates and impressive benchmark scores can answer an outdated question."]]}, {"id": "problem", "kind": "choice", "title": "A perfect score, a missed need", "time": "Before \u00b7 supports 11:06", "q": "Which check comes before optimizing the model?", "defs": "A toy support assistant answers 95 of 100 FAQ questions correctly. Users mostly need help completing forms. The evaluation contains no form tasks.", "tries": ["Choose the next action before revealing the answers."], "take": "An accurate solution needs the right target before it needs more accuracy.", "options": [["Tune until FAQ accuracy reaches 99", "Assumes FAQ answers are the user\u2019s main need.", "This may improve the wrong task."], ["Sample real user tasks and revise the test", "Assumes the current test may omit the actual work.", "Best next check: measure the task the assistant must perform."], ["Discard machine assistance", "Assumes the task mismatch proves the tool cannot help.", "The mismatch says little about its potential on form tasks."]], "answer": 1}, {"id": "scope", "kind": "audit", "title": "Find the missing condition", "time": "Before \u00b7 supports 09:33", "q": "What must travel with a claim that something cannot be done?", "defs": "Toy claim: \u201cA batch of 100 evaluations cannot finish within one hour.\u201d Open each hidden condition.", "tries": ["Open all three condition cards.", "For each one, ask what observation would invalidate it."], "take": "A proof can be correct while its application to your problem is wrong.", "cards": [["One worker", "The calculation assumes evaluations run sequentially. Parallel workers could change wall time."], ["One minute each", "The estimate came from an older model and machine. Re-measure the current setup."], ["Every case required", "The use case may permit an early screen. Check whether a smaller batch answers the real question."]]}, {"id": "test", "kind": "choice", "title": "Name evidence before defending the claim", "time": "Before \u00b7 supports 32:27\u201333:29", "q": "Which response makes a disagreement testable?", "defs": "Toy claim: \u201cThis cheaper model cannot replace our current assistant.\u201d Both engineers agree on the real task.", "tries": ["Choose what to ask the expert."], "take": "A useful belief says what would change it; the threshold is a decision choice.", "options": [["Could anything ever happen?", "Assumes logical possibility is enough.", "Too broad to choose an action."], ["Are you more experienced than me?", "Assumes rank settles the new case.", "Experience matters, but does not test this model on this task."], ["Would 90 successful tasks out of 100 change your view?", "Assumes this agreed sample and threshold reflect the need.", "A concrete starting test. Agree on errors, costs, and the sample before running it."]], "answer": 2}];

let page=0,revealed=0,picked=-1,guess=-1;const values={speed:10000,prob:0,share:0},opened={};const $=id=>document.getElementById(id);const math=()=>{if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:'$',right:'$',display:false}],throwOnError:false})};
function setPage(i){page=Math.max(0,Math.min(slides.length-1,i));revealed=0;picked=-1;guess=-1;render()}
function render(){let s=slides[page];$('title').textContent=s.title;$('tag').textContent=s.time;$('question').textContent=s.q;$('defs').innerHTML=s.defs||'';$('formula').innerHTML=s.formula||'';$('tries').innerHTML=s.tries.map(t=>'<li>'+t+'</li>').join('');$('take').textContent=s.take;$('take').style.visibility=(s.kind==='choice'&&picked<0)||(s.kind==='proof'&&revealed<s.rows.length)?'hidden':'visible';$('pages').textContent=`${page+1} / ${slides.length}`;$('prev').disabled=page===0;$('next').disabled=page===slides.length-1;let lab=$('lab');
if(s.kind==='intro'){lab.innerHTML='<div class="intro">'+s.cards.map(c=>'<div data-item="case" data-title="'+c[0]+'">'+c[0]+'<small>'+c[1]+'</small></div>').join('')+'</div>'}
else if(s.kind==='audit'){lab.innerHTML='<div class="intro">'+s.cards.map((c,i)=>`<button class="audit-card" data-item="assumption" data-id="${i}">${c[0]}<small>${opened[i]?c[1]:'Click to inspect this assumption'}</small></button>`).join('')+'</div>';lab.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{opened[i]=!opened[i];render()})}
else if(s.kind==='choice'){lab.innerHTML='<div class="choices">'+s.options.map((o,i)=>`<button class="choice" data-item="choice" data-id="${s.id}-${i}">${o[0]}${picked<0?'<small>'+o[1]+'</small>':''}${picked>=0?'<div class="verdict">'+(i===s.answer?'Supported: ':'')+o[2]+'</div>':''}</button>`).join('')+'</div><button id="answer">Show answer</button>';lab.querySelectorAll('.choice').forEach((b,i)=>b.onclick=()=>{picked=i;render()});$('answer').onclick=()=>{picked=s.answer;render()}}
else if(s.kind==='proof'){let opts=revealed<s.rows.length?[s.rows[revealed][1],'Ignore the stated cost','Treat possibility as certainty']:[];lab.innerHTML='<div class="proof">'+s.rows.slice(0,revealed).map(r=>'<div class="proof-row">$'+r[0]+'$<small>'+r[1]+'</small></div>').join('')+(revealed===0?'<p>Make a guess before revealing the next line.</p>':'')+'</div>'+(opts.length?'<div class="guess">Which move comes next?<div>'+opts.map((c,i)=>`<button class="move" data-item="proof-guess" data-id="${i}">${c}</button>`).join('')+'</div><div>'+ (guess<0?'Choose a move, then check.':guess===0?'That move follows from the stated model.':'That move drops a condition the model needs.')+'</div></div>':'')+'<button id="reveal">'+(revealed<s.rows.length?'Reveal next line':'Proof complete')+'</button>';$('reveal').disabled=revealed>=s.rows.length;$('reveal').onclick=()=>{revealed++;guess=-1;render()};lab.querySelectorAll('.move').forEach((b,i)=>b.onclick=()=>{guess=i;render()})}
else{lab.innerHTML='<div class="bars" id="chart"></div><div class="readout" id="readout"></div><div class="controls" id="controls"></div>';draw()}math()}
function slider(key,min,max,step,label){$('controls').innerHTML=`<label>${label}<input aria-label="${label}" type="range" min="${min}" max="${max}" step="${step}" value="${values[key]}"></label><output>${values[key]}</output>`;$('controls').querySelector('input').oninput=e=>{values[key]=+e.target.value;draw();math()}}
function bar(label,value,max,color='accent'){return `<div class="barrow"><span>${label}: ${value}</span><div style="background:var(--pal-grid)"><div class="bar" style="width:${100*value/max}%;background:var(--pal-${color})"></div></div></div>`}
function draw(){let s=slides[page];if(s.kind==='cost'){let t=1e6/values.speed;$('chart').innerHTML=bar('Blue: batch time in seconds',t,100)+bar('Amber: deadline in seconds',10,100,'amber')+'<p>Both bars use the same scale: full width is 100 seconds.</p>';$('readout').innerHTML=`$T=${t.toFixed(2)}$ seconds. ${t<=10?'Meets':'Misses'} the 10-second deadline.`;slider('speed',10000,200000,1000,'Speed (operations per second)')}
else if(s.kind==='attention'){let p=values.prob/100,e=100*p-2;$('chart').innerHTML=bar('Blue: expected useful payoff',100*p,20)+bar('Amber: certain test cost',2,20,'amber')+'<p>Both bars use the same toy-value scale: full width is 20 units.</p>';$('readout').innerHTML=`$p=${p.toFixed(2)}$. Expected net value: $E=${e.toFixed(1)}$. ${e>0?'Positive':e<0?'Negative':'Break-even'}.`;slider('prob',0,20,1,'Chance of useful idea (percent)')}
else if(s.kind==='cooperate'){let v=values.share;$('chart').innerHTML='<table class="table"><tr><th>Outcome</th><th>Withhold</th><th>Share</th></tr><tr><td>Old group’s local credit</td><td>10</td><td>6</td></tr><tr><td>New group’s value</td><td>0</td><td>18</td></tr><tr><td>Combined value</td><td>10</td><td>24</td></tr></table>';$('readout').innerHTML=`Selected: <strong>${v?'share':'withhold'}</strong>. Local credit: ${v?6:10}. Combined value: <span class="big">${v?24:10}</span>.`;$('controls').innerHTML='<button id="withhold">Withhold</button><button id="share">Share</button>';$('withhold').onclick=()=>{values.share=0;draw()};$('share').onclick=()=>{values.share=1;draw()}}math()}
$('prev').onclick=()=>setPage(page-1);$('next').onclick=()=>setPage(page+1);window.addEventListener('fluid-themechange',()=>{if($('chart'))draw()});window.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')setPage(page+1);if(e.key==='ArrowLeft')setPage(page-1)});render();window.addEventListener('load',math);
</script></body></html>

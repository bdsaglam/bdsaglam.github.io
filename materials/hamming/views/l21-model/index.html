<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>After Lecture 21: follow the bottleneck</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><script src="../../components/theme.js"></script><style>*{box-sizing:border-box}body{margin:0;background:var(--pal-bg);color:var(--pal-fg);font:18px/1.42 system-ui,sans-serif}main{height:100vh;padding:26px 30px;display:grid;grid-template-rows:58px 1fr 44px;gap:15px}header,footer{display:flex;align-items:center;justify-content:space-between;gap:14px}h1{font-size:24px;margin:0}h2{font-size:29px;line-height:1.15;margin:0 0 12px}p{margin:0 0 14px}.tag{color:var(--pal-muted);font-size:16px}.body{display:grid;grid-template-columns:59% 1fr;gap:28px;min-height:0}.lab{border:1px solid var(--pal-line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:15px;background:var(--pal-panel);min-height:0}.lesson{padding:8px 0;display:flex;flex-direction:column}.question{font-size:20px}.defs{color:var(--pal-text-2);margin-bottom:14px;font-size:17px}.formula{font-size:26px;margin-bottom:10px}.take{background:var(--pal-accent-soft);padding:15px;border-radius:10px;font-size:18px;margin-top:auto}ol{padding-left:25px;margin:5px 0 18px}li{padding:4px 0}button,select{font:inherit;color:var(--pal-fg);background:var(--pal-soft);border:1px solid var(--pal-line);border-radius:8px;padding:9px 14px;cursor:pointer}button:hover{background:var(--pal-accent-soft)}button:disabled{opacity:.45;cursor:default}.chart{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.chart svg{width:100%;height:100%}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:16px}.legend span:before{content:'';display:inline-block;width:20px;height:4px;background:var(--c);margin-right:7px;vertical-align:middle}.readout{padding:13px;background:var(--pal-soft);border-radius:8px;font-size:18px;min-height:55px}.controls{display:flex;align-items:center;gap:16px}.controls label{display:flex;align-items:center;gap:16px;flex:1}input[type=range]{flex:1;accent-color:var(--pal-accent)}.intro,.choices,.proof{display:flex;flex-direction:column;flex:1;gap:17px;justify-content:center}.intro>div{border-left:4px solid var(--pal-accent);background:var(--pal-soft);padding:20px;font-size:22px}.intro small,.choice small{display:block;font-size:17px;margin-top:8px;color:var(--pal-text-2)}.choice{text-align:left;padding:18px;font-size:20px}.verdict{border-top:1px solid var(--pal-line);margin-top:10px;padding-top:10px;font-size:17px;color:var(--pal-accent-deep)}.proof-row{padding:10px;background:var(--pal-soft);font-size:22px;border-left:4px solid var(--pal-line)}.proof-row:last-child{background:var(--pal-amber-row);border-color:var(--pal-amber)}.proof-row small{display:block;font-size:16px;margin-top:3px;color:var(--pal-text-2)}.guess{font-size:17px}.guess button{font-size:16px;padding:5px 8px;margin:4px 4px 0 0}.proof{gap:10px}.choice{font-size:19px;padding:14px}.choice small,.verdict{font-size:16px;line-height:1.35}.source{color:var(--pal-muted);font-size:15px}a{color:var(--pal-accent-deep)}.pages{font-size:16px;color:var(--pal-muted)}</style></head><body><main><header><h1>After Lecture 21: follow the bottleneck</h1><span id="tag" class="tag"></span></header><section class="body"><div id="lab" class="lab"></div><article class="lesson"><h2 id="title"></h2><p id="question" class="question"></p><div id="defs" class="defs"></div><div id="formula" class="formula"></div><ol id="tries"></ol><div id="take" class="take"></div></article></section><footer><button id="prev">← Previous</button><span class="pages" id="pages"></span><span class="source">L21 · manual study · <a href="https://ocw.mit.edu/courses/3-15-electrical-optical-magnetic-materials-and-devices-fall-2006/1b318e5a5a7d1ba5a21d9ddf6edc5c63_lecture15_16.pdf" target="_blank" rel="noopener">optics source</a></span><button id="next">Next →</button></footer></main><script>const slides=[{"id": "bits", "kind": "bits", "title": "More bits, not faster light", "time": "After \u00b7 29:28", "q": "What changes when a link carries more bits each second?", "defs": "Toy link: the first bit takes 100 ms to propagate. A message contains 1000 bits. The rate control changes how quickly bits enter the link.", "formula": "", "tries": ["Double the bit rate.", "Compare the first-bit arrival and the last-bit arrival."], "take": "The first bit still travels for 100 ms. The message finishes sooner because its bits enter closer together. Bit rate is not optical carrier frequency."}, {"id": "bits-proof", "kind": "proof", "title": "Separate travel from serialization", "time": "After \u00b7 supports 29:28", "q": "Where does the message completion time come from?", "defs": "$B$: message bits; $R$: bits per second; $d$: propagation delay. We count delivery of the final bit\u2019s trailing edge, with no overhead.", "rows": [["s=B/R", "Divide message bits by injection rate"], ["T=d+s", "Add travel time after serialization"], ["T=d+B/R", "Substitute the serialization time"], ["B=1000,\\ R=10000,\\ d=0.1:\\quad T=0.2\\;\\mathrm{s}", "Insert the example values"]], "tries": ["Predict whether doubling rate halves the whole delay.", "Reveal the numbers, then return to the widget to check."], "take": "Doubling rate gives 150 ms, not 100 ms: the fixed 100 ms propagation delay remains."}, {"id": "spread", "kind": "spread", "title": "A pulse arrives by several routes", "time": "After \u00b7 06:54; 21:40", "q": "How can light arrive clearly but still blur neighboring bits?", "defs": "Toy picture: an axial ray takes a straight path; an angled ray zigzags. Both move at the same speed in a uniform core. Three delayed copies form the received pulse.", "tries": ["Increase the zigzag angle.", "Watch the dashed arrival markers spread and the received pulse broaden."], "take": "This illustrates path-length delay in a multimode ray model. Single-mode fiber removes this source of intermodal spreading, but other dispersion remains."}, {"id": "spread-proof", "kind": "proof", "title": "The detour becomes a delay", "time": "After \u00b7 supports 06:54", "q": "How does a longer path turn into pulse spreading?", "defs": "$L$: axial distance; $\\alpha$: ray angle from the axis. $\\ell$: zigzag distance. $v$: light speed in the core; $t_0=L/v$.", "rows": [["\\ell\\cos\\alpha=L", "Project the zigzag path onto the axis"], ["\\ell=L/\\cos\\alpha", "Solve for the path length"], ["t=\\ell/v=t_0/\\cos\\alpha", "Divide distance by the common speed"], ["\\Delta t=t-t_0=t_0(\\sec\\alpha-1)", "Subtract the straight-path arrival"]], "tries": ["Guess why the path grows when the angle grows.", "Look back: what assumptions fail for a graded-index core?"], "take": "In this uniform-core model, the angled ray is late because it travels farther. Graded index changes the speed along the route, so this simple comparison no longer suffices."}, {"id": "reliable", "kind": "choice", "title": "The newer device is faster", "time": "After \u00b7 23:16\u201324:17", "q": "What should decide an undersea cable component?", "defs": "A promising new device competes with a proven one. Repairing a failed submerged repeater is expensive; the cable must last for decades.", "options": [["Choose the newest device", "Assumes peak performance matters more than unproven service life.", "A laboratory advantage does not settle lifetime risk."], ["Reject every new device forever", "Assumes familiarity always outweighs improvement.", "That would prevent progress; the decision depends on evidence and consequences."], ["Compare life evidence and the cost of failure", "Assumes reliability is a system requirement.", "Hamming\u2019s historical example used proven vacuum tubes despite the invention of transistors."]], "answer": 2, "tries": ["Choose before showing every verdict."], "take": "Hamming did not report which signaling scheme the Japan cable chose. His vacuum-tube example explains why a rational deployment can lag a promising invention."}, {"id": "cost", "kind": "cost", "title": "Avoid the excavation", "time": "After \u00b7 04:19; 27:54\u201328:26", "q": "Can a more expensive component make the project cheaper?", "defs": "Illustrative costs, not Bell Labs data. Copper needs new ducts; a fiber design fits existing ducts. The slider changes the excavation bill in cost units.", "tries": ["Start with zero excavation cost.", "Raise it until fiber becomes cheaper overall."], "take": "A component comparison can miss the dominant system cost. AI analogy: a pricier accelerator can be worthwhile if it removes a larger networking or operating cost."}, {"id": "cost-proof", "kind": "proof", "title": "Find the decision boundary", "time": "After \u00b7 supports 04:19", "q": "How much excavation makes the fiber option cheaper?", "defs": "Toy costs: copper equipment 20; fiber equipment 35. $E$: extra excavation for copper. Shared costs cancel.", "rows": [["C_{\\rm copper}=20+E,\\quad C_{\\rm fiber}=35", "Write the two complete toy costs"], ["35<20+E", "Ask when fiber costs less"], ["15<E", "Subtract the copper equipment cost"], ["E>15\\Rightarrow C_{\\rm fiber}<C_{\\rm copper}", "State the break-even rule"]], "tries": ["Guess which cost must cross 15.", "Look back: what changes if fiber also needs excavation?"], "take": "At 15 the options tie. The point is the omitted cost, not the numerical threshold of this invented example."}, {"id": "human", "kind": "choice", "title": "One shared filter or one per device?", "time": "After \u00b7 40:08\u201340:38", "q": "Which design does Hamming expect a household to accept?", "defs": "One programmable filter can select different services when given the right coefficients. Separate devices could arrive with their own filters already configured.", "options": [["Bundle a configured filter with each device", "Assumes saving user effort can justify duplicate hardware.", "Hamming leaned this way: the device would simply take the signal it needs."], ["Make the household enter shared-filter coefficients", "Assumes saving equipment matters more than setup effort.", "Technically possible, but it moves configuration work to the user."], ["Use one fixed filter for every service", "Assumes every service needs the same frequency band.", "It cannot select different allocated channels without reconfiguration."]], "answer": 0, "tries": ["Pick before revealing his choice.", "Name the analogous setup step in an AI tool you use."], "take": "\u201cCheap\u201d must name whose resource is saved: hardware, money, time, attention, or effort."}, {"id": "switch", "kind": "choice", "title": "Switching becomes cheap: now what?", "time": "After \u00b7 34:18\u201335:54", "q": "Which experiment tests a system consequence of cheaper switching?", "defs": "Hamming imagines cheap large optical switches. This is his design question, not evidence that such a machine has been built.", "options": [["Replace one switch and stop", "Assumes the surrounding architecture already fits the new cost.", "This tests a component substitution but can miss the larger opportunity."], ["Compare architectures under a range of switching costs", "Assumes the best design can change when a bottleneck becomes cheap.", "A useful next experiment: hold the workload fixed, vary switching cost, and compare full-system throughput and cost."], ["Predict all computers will become optical", "Assumes one component improvement determines the whole future.", "Too strong: other components, reliability, and human factors still constrain adoption."]], "answer": 1, "tries": ["Choose a small experiment for a distributed AI workload."], "take": "Keep a conditional design ready: if the bottleneck changes, what would you build differently? A possibility becomes useful when it connects to a concrete problem."}];
let page=0,revealed=0,picked=-1,guess=-1;const values={angle:60,rate:10000,path:10,earth:10};const $=id=>document.getElementById(id);const math=()=>{if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});};
function setPage(i){page=Math.max(0,Math.min(slides.length-1,i));revealed=0;picked=-1;guess=-1;render()}
function render(){let s=slides[page];$('title').textContent=s.title;$('tag').textContent=s.time;$('question').textContent=s.q;$('defs').innerHTML=s.defs||'';$('formula').innerHTML=s.formula||'';$('tries').innerHTML=s.tries.map(t=>'<li>'+t+'</li>').join('');$('take').textContent=s.take;$('pages').textContent=`${page+1} / ${slides.length}`;$('prev').disabled=page===0;$('next').disabled=page===slides.length-1;let lab=$('lab');if(s.kind==='intro'){lab.innerHTML='<div class="intro">'+s.cards.map(c=>'<div data-item="case" data-title="'+c[0]+'">'+c[0]+'<small>'+c[1]+'</small></div>').join('')+'</div>';}else if(s.kind==='choice'){lab.innerHTML='<div class="choices">'+s.options.map((o,i)=>`<button class="choice" data-item="choice" data-id="${s.id}-${i}">${o[0]}${picked<0?'<small>'+o[1]+'</small>':''}${picked>=0?'<div class="verdict">'+(i===s.answer?'Supported: ':'')+o[2]+'</div>':''}</button>`).join('')+'</div><button id="answer">Show answer</button>';lab.querySelectorAll('.choice').forEach((b,i)=>b.onclick=()=>{picked=i;render()});$('answer').onclick=()=>{picked=s.answer;render()};}else if(s.kind==='proof'){let choices=revealed<s.rows.length?[s.rows[revealed][1],'Change the physical model','Ignore the limiting case']:[];lab.innerHTML='<div class="proof">'+s.rows.slice(0,revealed).map(r=>'<div class="proof-row">$'+r[0]+'$<small>'+r[1]+'</small></div>').join('')+(revealed===0?'<p>Guess the next move. Each reveal adds one equation and its reason.</p>':'')+'</div>'+(choices.length?'<div class="guess">What move would you try next?<div>'+choices.map((c,i)=>`<button class="move" data-item="proof-guess" data-id="${i}">${c}</button>`).join('')+'</div><div id="feedback">'+(guess<0?'Choose a move, or reveal to check.':guess===0?'That move keeps the model and advances the argument.':'Check whether that move follows from the current assumptions.')+'</div></div>':'')+'<button id="reveal">'+(revealed<s.rows.length?'Reveal next move':'Proof complete')+'</button>';$('reveal').disabled=revealed>=s.rows.length;$('reveal').onclick=()=>{revealed++;guess=-1;render()};lab.querySelectorAll('.move').forEach((b,i)=>b.onclick=()=>{guess=i;render()});}else{lab.innerHTML='<div class="chart" id="chart"></div><div class="legend" id="legend"></div><div class="readout" id="readout"></div><div class="controls" id="controls"></div>';draw()}math()}
const col=x=>FluidTheme.color(x);const line=(x,y,X,Y,c,dash='')=>`<line x1="${x}" y1="${y}" x2="${X}" y2="${Y}" stroke="${col(c)}" stroke-width="3" ${dash?'stroke-dasharray="'+dash+'"':''}/>`;const label=(x,y,t,c='text-2',anchor='start')=>`<text x="${x}" y="${y}" fill="${col(c)}" text-anchor="${anchor}" font-size="18">${t}</text>`;
function slider(key,min,max,step,text){$('controls').innerHTML=`<label>${text}<input aria-label="${text}" type="range" min="${min}" max="${max}" step="${step}" value="${values[key]}"></label><output>${values[key]}</output>`;$('controls').querySelector('input').oninput=e=>{values[key]=+e.target.value;draw();math()};}
function plot(series,xmax,ymax,xname,yname,markers=[],xmin=0){let W=680,H=320,L=60,R=25,T=35,B=45,px=x=>L+(x-xmin)/(xmax-xmin)*(W-L-R),py=y=>H-B-y/ymax*(H-T-B),v='<svg viewBox="0 0 680 320" role="img" aria-label="'+yname+' by '+xname+'">';for(let k=0;k<=4;k++){let y=ymax*k/4;v+=line(L,py(y),W-R,py(y),'line')+label(L-8,py(y)+5,y.toFixed(1),'muted','end');let x=xmin+(xmax-xmin)*k/4;v+=label(px(x),H-18,x.toFixed(0),'muted','middle')}series.forEach(s=>{v+=`<polyline points="${s.p.map(p=>px(p[0])+','+py(p[1])).join(' ')}" fill="none" stroke="${col(s.c)}" stroke-width="3"/>`});markers.forEach(m=>v+=line(px(m),T,px(m),H-B,'guide','6 5'));v+=label(L,20,yname)+label(W-R,H-1,xname,'text-2','end')+'</svg>';$('chart').innerHTML=v;$('legend').innerHTML=series.map(s=>`<span style="--c:var(--pal-${s.c})">${s.label}</span>`).join('')+(markers.length?'<span style="--c:var(--pal-guide)">dashed: path arrival times</span>':'')}
function draw(){let s=slides[page];if(s.kind==='ray'||s.kind==='raylaw'){let a=values.angle*Math.PI/180,ratio=1.5/1.45*Math.sin(a),tir=ratio>1,hit=[350,160],x=350-145*Math.tan(a),v='<svg viewBox="0 0 680 340" role="img" aria-label="Ray at a core and cladding boundary">';v+=`<rect x="0" y="160" width="680" height="180" fill="${col('accent-soft')}"/><rect x="0" y="0" width="680" height="160" fill="${col('soft')}"/>`;v+=line(0,160,680,160,'ink')+line(350,20,350,320,'guide','6 5');let length=190;v+=line(350-length*Math.sin(a),160+length*Math.cos(a),350,160,'accent');if(tir)v+=line(350,160,350+length*Math.sin(a),160+length*Math.cos(a),'accent');else{let b=Math.asin(ratio);v+=line(350,160,350+length*Math.sin(b),160-length*Math.cos(b),'orange');v+=line(350,160,350+length*Math.sin(a),160+length*Math.cos(a),'grey','5 5')}let arc=[];for(let i=0;i<=20;i++){let t=a*i/20;arc.push([350-48*Math.sin(t),160+48*Math.cos(t)])}v+=`<polyline points="${arc.map(z=>z.join(',')).join(' ')}" fill="none" stroke="${col('accent')}" stroke-width="2"/>`;v+=label(18,35,'cladding: lower index')+label(18,318,'core: higher index')+label(365,55,'perpendicular')+label(280,232,'incoming angle')+'</svg>';$('chart').innerHTML=v;$('legend').innerHTML='<span style="--c:var(--pal-accent)">incoming / fully reflected ray</span><span style="--c:var(--pal-orange)">outgoing ray</span><span style="--c:var(--pal-grey)">partial reflection (schematic)</span>';$('readout').textContent=`Incoming angle: ${values.angle} degrees. ${tir?'Total internal reflection.':'Outgoing angle: '+(Math.asin(ratio)*180/Math.PI).toFixed(1)+' degrees.'}`;slider('angle',20,85,1,'Incoming angle (degrees)')}
if(s.kind==='bits'){let r=values.rate,end=100+1000/r*1000;plot([{p:[[0,0],[100,0],[end,1000],[360,1000]],c:'accent',label:'cumulative delivered bits'}],360,1000,'time (milliseconds)','delivered bits');$('readout').textContent=`First-bit leading edge: 100 ms. Whole message: ${end.toFixed(0)} ms. Rate: ${r} bits per second.`;slider('rate',5000,20000,1000,'Bit rate')}
if(s.kind==='spread'){let a=values.path*Math.PI/180,late=100/Math.cos(a),times=[100,100+(late-100)/2,late],sigma=1.6,p=Array.from({length:241},(_,i)=>{let t=90+i*.16;return[t,times.reduce((sum,z)=>sum+Math.exp(-.5*((t-z)/sigma)**2),0)/3]}),base=Array.from({length:241},(_,i)=>{let t=90+i*.16;return[t,Math.exp(-.5*((t-100)/sigma)**2)]});plot([{p:base,c:'grey',label:'one straight path'},{p,c:'accent',label:'mean of three delayed copies'}],130,1.1,'arrival time (nanoseconds)','relative pulse height',times,90);$('readout').textContent=`Straight arrival: 100 ns. Last arrival: ${late.toFixed(2)} ns. Spread: ${(late-100).toFixed(2)} ns. Toy equal path weights.`;slider('path',0,35,1,'Ray angle from axis (degrees)')}
if(s.kind==='cost'){let e=values.earth;plot([{p:[[0,20],[40,60]],c:'orange',label:'copper: equipment + excavation'},{p:[[0,35],[40,35]],c:'accent',label:'fiber: equipment only'}],40,65,'copper excavation cost','total cost (toy units)',[e]);$('readout').textContent=`Copper: ${20+e}. Fiber: 35. ${e===15?'The options tie.':e>15?'Fiber is cheaper by '+(e-15)+'.':'Copper is cheaper by '+(15-e)+'.'}`;$('legend').lastElementChild.textContent='dashed: selected excavation cost';slider('earth',0,40,1,'Excavation cost')}
math()}
$('prev').onclick=()=>setPage(page-1);$('next').onclick=()=>setPage(page+1);window.addEventListener('fluid-themechange',()=>{if($('chart'))draw()});window.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')setPage(page+1);if(e.key==='ArrowLeft')setPage(page-1)});render();window.addEventListener('load',math);

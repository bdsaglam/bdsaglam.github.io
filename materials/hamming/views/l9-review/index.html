<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Lecture 9 review: n-dimensional space</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../../components/theme.js"></script>
<style>
/* Colors: grey for exact values and inputs, blue for outputs and the reader's choice,
   amber for what the newest proof line is about, red only for a failed check. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft); --red:var(--pal-red);
  --u:clamp(16px,1.35vw,20px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 24px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(6px,1vh,12px) 24px;overflow:hidden}
footer{display:flex;align-items:center;gap:10px;padding:8px 24px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Content slide: widget on the left (3/5), text on the right (2/5). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(18px,2.4vw,40px)}
.widget{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(5px,0.9vh,9px);overflow:hidden}
.widget>*{max-width:100%;min-width:0}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(6px,1.1vh,12px);overflow:hidden}
.tag{font:14px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(20px,1.9vw,28px);line-height:1.2;margin:0;font-weight:650}
.question{margin:0;font-size:clamp(16px,1.3vw,18px);font-weight:600}
.formula{font-size:clamp(17px,1.5vw,22px)}
.sym{margin:0;font-size:16px;color:var(--muted)}
.tries{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.tries li::marker{color:var(--accent);font-weight:600}
.where{margin:0;font-size:16px}
.where b{color:var(--accent)}
.takeaway{margin:0;padding:10px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px;transition:opacity .2s}

/* Controls and readouts */
.sliders{display:flex;gap:8px 22px;flex-wrap:wrap;width:100%;align-items:center}
.slide-ctl{display:flex;align-items:center;gap:8px;font-size:16px}
.slide-ctl input{width:clamp(110px,10vw,160px);vertical-align:middle;accent-color:var(--accent)}
.slide-ctl .val{min-width:50px;white-space:nowrap}
.btn{font:inherit;padding:5px 11px;border:1px solid var(--line);background:var(--pal-panel);border-radius:8px;cursor:pointer;font-size:16px;line-height:1.3}
.btn.on{background:var(--chip);border-color:var(--accent);color:var(--accent)}
.btn:disabled{color:var(--muted);cursor:default;opacity:.6}
.btnrow{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap}
.btnrow .lab{font-size:16px;color:var(--muted);margin-right:2px}
.readouts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.readout{flex:1 1 120px;min-width:0;padding:3px 8px;border-radius:10px;background:var(--pal-soft);font-size:15px;overflow-wrap:anywhere}
.readout .k{color:var(--muted);font-size:14px}
.readout .val{font-size:16px;font-weight:600}
.legend{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:15px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:20px;height:0;vertical-align:middle;margin-right:6px}
.chip{display:inline-block;width:18px;height:12px;vertical-align:middle;margin-right:6px;border-radius:2px}
.note{min-height:34px;display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;font-size:16px;padding:2px 10px;border-radius:8px;background:var(--pal-soft);border:1px solid var(--pal-grid)}
.note.ask{background:var(--pal-amber-row);border-color:var(--pal-amber-bg)}
.note .good{color:var(--accent);font-weight:600}

/* Plots fill the space left in the widget column */
.fill{flex:1 1 0;min-height:120px;position:relative;width:100%}
.fill>svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* Proof slides: test and picture on the left, the proof (fl-proof-steps) on the right */
.slide.proof-slide{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(18px,2.2vw,34px)}
.slide.proof-slide h2{font-size:clamp(20px,1.75vw,26px)}
.slide.proof-slide .side{gap:clamp(4px,0.8vh,9px)}
.slide.proof-slide .side{justify-content:flex-start}
.slide.proof-slide .slide-ctl input{width:clamp(90px,8vw,130px)}
.slide.proof-slide .slide-ctl .val{min-width:40px}
.slide.proof-slide .sliders{gap:6px 14px}
.slide.proof-slide .fill{min-height:180px}
.readouts.inline .readout{display:flex;gap:4px 8px;align-items:baseline;flex-wrap:wrap}
.part{margin:0;font-weight:600;color:var(--muted)}
.test{display:flex;flex-direction:column;gap:3px;font-size:16px}
.test .tries{gap:3px}
.model{margin:0;padding:7px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}

/* Decision slides: the problem, three cards and the reveal on the left; question, try-steps,
   AI echo and takeaway on the right. */
.slide.decision{grid-template-columns:minmax(0,2.05fr) minmax(0,1fr);gap:clamp(20px,2.6vw,40px)}
.decision .widget{gap:6px}
.decision .side{justify-content:space-evenly;gap:clamp(8px,1.8vh,18px)}
.decision h2{font-size:clamp(23px,2.3vw,32px)}
.decision .q{margin:0;font-size:clamp(17px,1.55vw,21px);font-weight:600;line-height:1.35}
.decision .fx{margin:0;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--pal-soft);font-size:clamp(17px,1.6vw,22px);line-height:1.4}
.decision .kicker{font-size:14px;color:var(--muted);margin:0 0 3px}
.decision .blk{display:flex;flex-direction:column;gap:3px}
.decision .ai{margin:0;font-size:16px;line-height:1.4}
.decision .ai .src{color:var(--muted);font-size:14px}
.decision .takeaway{padding:11px 14px;line-height:1.4}
.decision .tries{gap:6px;font-size:clamp(16px,1.35vw,18px);line-height:1.4}
.decision .hold{color:var(--muted);font-style:italic;background:var(--pal-soft);border:1px dashed var(--line);border-radius:6px;padding:9px 12px;margin:0;font-size:16px;line-height:1.4}
.prob{flex:0 0 auto;border:1px solid var(--line);border-radius:10px;padding:6px 14px;background:var(--pal-soft);font-size:16px;line-height:1.4}
.prob .lead{font-weight:650;color:var(--muted)}
.prob p{margin:0}
.opts{flex:0 0 auto;display:flex;flex-direction:column;gap:clamp(4px,0.5vw,8px)}
.opt{display:grid;grid-template-columns:minmax(0,0.78fr) minmax(0,1.22fr);gap:0 14px;padding:clamp(6px,0.7vw,10px) 12px;border:1px solid var(--line);border-radius:10px;background:var(--pal-panel);color:inherit;text-align:left;cursor:pointer;min-width:0;font:inherit}
.opt .lhs{display:flex;flex-direction:column;gap:3px;min-width:0}
.opt .rhs{display:flex;flex-direction:column;gap:3px;min-width:0;border-left:1px solid var(--pal-soft-2);padding-left:14px}
.opt:not([aria-disabled="true"]):hover{border-color:var(--accent)}
.opt[aria-disabled="true"]{cursor:default}
.opt .top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:16px}
.opt .letter{font-weight:700;color:var(--pal-accent-deep)}
.opt .who{font-size:14px;color:var(--muted);text-align:right}
.opt .body{font-size:clamp(16px,1.4vw,19px);line-height:1.3}
.opt .asm{margin:0;font-size:clamp(16px,1.3vw,18px);line-height:1.33;color:var(--muted)}
.opt .verdict{font-size:clamp(16px,1.3vw,18px);line-height:1.33;color:var(--fg)}
.opt .verdict.idle{color:var(--muted);font-style:italic}
.opt.on{box-shadow:inset 0 0 0 2px var(--pal-ink)}
.opt.chooser{background:var(--chip);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.opt.chooser .who{color:var(--pal-accent-deep);font-weight:600}
.reveal{flex:1 1 auto;min-height:0;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:clamp(16px,1.25vw,18px);display:flex;flex-direction:column;justify-content:center;gap:6px}
.reveal.idle{background:var(--pal-soft);color:var(--muted)}
.rv{margin:0;line-height:1.38}
.rv .k{font-weight:650;color:var(--accent)}
.rv .t{color:var(--muted);font-size:14px;white-space:nowrap}
.rv.hold{color:var(--muted)}
.decision .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px}
.decision .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--pal-on-accent);padding:6px 16px}

/* Short windows (1100x620 and similar): tighter spacing, body text stays 16px */
@media (max-height: 680px){
  header{padding-top:4px}
  #stage{padding:4px 24px}
  footer{padding:4px 24px}
  .widget{gap:4px}
  .side{gap:4px}
  .tries{gap:2px}
  .sym,.where,.tries,.test,.model{line-height:1.22}
  .readout{padding:2px 8px}
  .takeaway{padding:6px 10px}
  .formula{font-size:18px}
  h2{font-size:20px}
  .fill{min-height:100px}
  .note{min-height:30px;padding:1px 8px}
  .model{padding:5px 10px}
  .btn{padding:3px 9px}
  .slide-ctl input{width:100px}
  .slide.proof-slide .slide-ctl input{width:64px}
  .slide.proof-slide .slide-ctl .val{min-width:30px}
  .slide.proof-slide .sliders{gap:4px 10px}
  .slide.proof-slide .fill{min-height:165px}
  .decision h2{font-size:23px}
  .decision .side{gap:7px}
  .decision .tries{gap:2px;line-height:1.3}
  .decision .takeaway{padding:7px 12px}
  .reveal{gap:3px;padding:5px 12px}
  .rv{line-height:1.28}
  .opts{gap:3px}
  .opt{padding:4px 12px}
  .opt .body,.opt .asm,.opt .verdict{line-height:1.25}
  .prob{padding:4px 12px;line-height:1.3}
}
</style>
</head>
<body>
<header id="head">Lecture 9 review · n-dimensional space</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script src="../../components/proof-steps.js"></script>
<script>
// ---------- numbers (from the frame: PI and text formats) ----------
const PI = Math.PI;
// A number with d decimals, without a minus sign on zero.
const fixed = (v, d) => (Math.abs(v) < 0.5 * Math.pow(10, -d) ? 0 : v).toFixed(d);
// Up to d decimals, trailing zeros dropped: 0.5, -1, 0.866.
const short = (v, d) => { let s = fixed(v, d == null ? 3 : d); if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, ''); return s === '-0' ? '0' : s; };


// ---------- palette and redraw ----------
// COL holds the palette for the SVG being drawn. fillPlot reads it at every paint, so a draw uses the current
// theme. A theme switch redraws every plot on the slide and keeps each control's state.
let COL = {};
const PAL_NAMES = ['ink', 'text-2', 'muted', 'grid', 'guide', 'grey', 'accent', 'accent-2', 'panel', 'on-accent',
  'bg', 'amber', 'amber-bg', 'amber-ink', 'fg', 'soft', 'soft-2', 'line', 'accent-soft', 'amber-row', 'red', 'red-bg', 'grey-bar'];
function readPalette() {
  const o = {};
  for (const n of PAL_NAMES) o[n.replace(/-(\w)/g, (_, c) => c.toUpperCase())] = FluidTheme.color(n);
  return o;
}
let PLOTS = [];   // the plots on the current slide
window.addEventListener('fluid-themechange', () => { COL = readPalette(); PLOTS.forEach(p => p.redraw()); });

// ---------- DOM and drawing helpers ----------
const $ = s => document.querySelector(s);
const NSV = 'http://www.w3.org/2000/svg', NHT = 'http://www.w3.org/1999/xhtml';
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false } ], throwOnError: false };
// Render $...$ in a node. If the CDN did not load, the text stays as typed.
function tex(node) {
  if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH);
  return node;
}
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function hh(tag, cls, ...kids) {
  const e = h(tag, cls);
  for (const k of kids) if (k) e.append(k);
  return e;
}
function mark(e, kind, id, title) {
  e.dataset.item = kind;
  if (id != null) e.dataset.id = id;
  if (title != null) e.dataset.title = title;
  return e;
}
function svgNode(tag, attrs, parent) {
  const e = document.createElementNS(NSV, tag);
  for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function svgRoot(w, ht) {
  return svgNode('svg', { viewBox: '0 0 ' + w + ' ' + ht, role: 'img', 'font-family': 'system-ui, sans-serif', 'font-size': 14 });
}
function svgText(parent, x, y, s, attrs) {
  const t = svgNode('text', Object.assign({ x: x, y: y, fill: COL.muted, 'font-size': 14 }, attrs || {}), parent);
  t.textContent = s;
  return t;
}
// A KaTeX label over an SVG: a foreignObject holding a rendered formula. o.bg paints a background.
function svgTex(parent, x, y, s, o) {
  o = o || {};
  const w = o.w || 220, ht = o.ht || 26, anchor = o.anchor || 'middle';
  const x0 = anchor === 'end' ? x - w : anchor === 'start' ? x : x - w / 2;
  const fo = svgNode('foreignObject', { x: x0, y: y - ht / 2, width: w, height: ht }, parent);
  const d = document.createElementNS(NHT, 'div');
  const jc = anchor === 'end' ? 'flex-end' : anchor === 'start' ? 'flex-start' : 'center';
  d.setAttribute('style', 'display:flex;align-items:center;height:100%;white-space:nowrap;font-size:' +
    (o.size || 15) + 'px;color:' + (o.fill || COL.text2) + ';justify-content:' + jc);
  const span = document.createElementNS(NHT, 'span');
  span.textContent = s;
  if (o.bg) span.setAttribute('style', 'background:' + o.bg + ';border-radius:5px;padding:1px 5px');
  if (o.halo) span.setAttribute('style', 'text-shadow:0 0 3px var(--pal-bg),0 0 3px var(--pal-bg),0 0 2px var(--pal-bg)');
  d.appendChild(span);
  fo.appendChild(d);
  tex(span);
  return fo;
}
const haloTex = (parent, x, y, s, o) => svgTex(parent, x, y, s, Object.assign({ halo: true }, o || {}));
function path(svg, pts, attrs, close) {
  const d = 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L') + (close ? 'Z' : '');
  return svgNode('path', Object.assign({ d: d, fill: 'none' }, attrs), svg);
}
function dot(svg, x, y, color, r) {
  return svgNode('circle', { cx: x, cy: y, r: r || 5, fill: color, stroke: COL.panel, 'stroke-width': 1.5 }, svg);
}
// Tick label: KaTeX if it has $, plain text otherwise.
function tick(svg, x, y, s, anchor) {
  return s.indexOf('$') >= 0 ? svgTex(svg, x, y, s, { w: 80, size: 14, anchor: anchor || 'middle', fill: COL.muted }) :
    svgText(svg, x, y + 5, s, { 'text-anchor': anchor || 'middle' });
}
// A labelled range input. label and the value text are LaTeX-ready.
function slider(label, o) {
  const wrap = h('label', 'slide-ctl');
  const lab = tex(h('span', '', label));
  const val = h('span', 'val', '');
  const inp = h('input');
  inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step; inp.value = o.value;
  mark(inp, 'control', o.id, o.name || o.id);
  wrap.append(lab, inp, val);
  const fmtv = o.fmt || String;
  const api = {
    el: wrap, input: inp,
    get value() { return +inp.value; },
    set(v) { inp.value = v; api.show(); },
    show() { setTex(val, fmtv(+inp.value)); },
  };
  inp.addEventListener('input', () => { api.show(); if (o.onInput) o.onInput(+inp.value); });
  api.show();
  return api;
}
// A readout box: label and value are LaTeX-ready text.
function readout(id, label) {
  const box = mark(h('div', 'readout'), 'readout', id);
  const k = h('div', 'k');
  setTex(k, label);
  const v = h('div', 'val');
  box.append(k, v);
  return { el: box, set(text) { setTex(v, text); }, label(text) { setTex(k, text); } };
}
function legend(items) {
  const d = h('div', 'legend');
  for (const it of items) {
    const s = h('span');
    const sw = it.chip ? h('span', 'chip') : h('span', 'sw');
    if (it.chip) { sw.style.background = it.color; if (it.ring) { sw.style.background = 'var(--pal-panel)'; sw.style.border = '2px solid ' + it.color; sw.style.borderRadius = '50%'; sw.style.width = '13px'; sw.style.height = '13px'; } }
    else sw.style.borderTop = (it.width || 2) + 'px ' + (it.dash ? 'dashed' : 'solid') + ' ' + it.color;
    const t = h('span');
    setTex(t, it.text);
    s.append(sw, t);
    d.appendChild(s);
  }
  return d;
}
// A plot that takes the height left in its box. draw(svg, W, H) runs on every resize and may
// return a geometry object (wrap._geo) that the pointer handlers use.
function fillPlot(box, draw) {
  const wrap = h('div', 'fill');
  box.append(wrap);
  let key = '';
  const paint = force => {
    const w = Math.floor(wrap.clientWidth), ht = Math.floor(wrap.clientHeight);
    if (w < 60 || ht < 60) return;
    if (!force && key === w + 'x' + ht) return;
    key = w + 'x' + ht;
    COL = readPalette();
    const svg = svgRoot(w, ht);
    wrap._geo = draw(svg, w, ht) || null;
    wrap.replaceChildren(svg);
  };
  new ResizeObserver(() => paint(false)).observe(wrap);
  const plot = { wrap, redraw: () => paint(true) };
  PLOTS.push(plot);
  return plot;
}
function sym(text) { return setTex(h('p', 'sym'), text); }
function triesList(items) { return hh('ol', 'tries', ...items.map(t => setTex(h('li'), t))); }
function takeLine(text) { return setTex(h('p', 'takeaway'), text); }
function noticeLine(text) { const p = h('p', 'where'); p.append(h('b', '', 'Notice: ')); p.append(setTex(h('span'), text)); return p; }
// Session events. With no bridge, nothing is sent and the view still works.
function emit(kind, data) {
  try {
    if (window.fluid && typeof window.fluid.emit === 'function') Promise.resolve(window.fluid.emit(kind, data)).catch(() => {});
  } catch (e) { /* no bridge */ }
}

// ---------- proof slides: shared parts ----------
// Amber marks what the newest proof line is about, in the picture and in the proof.
function glowPath(svg, pts, wdt) {
  return path(svg, pts, { stroke: COL.amberBg, 'stroke-width': wdt || 12, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
}
function glowFill(svg, pts) {
  return path(svg, pts, { fill: COL.amberBg, 'fill-opacity': .9, stroke: COL.amber, 'stroke-width': 1.5 }, true);
}
function glowDot(svg, x, y, r) {
  return svgNode('circle', { cx: x, cy: y, r: r || 9, fill: COL.amberBg, stroke: COL.amber, 'stroke-width': 1.5 }, svg);
}
// While a proof line is lit, a caption in the top row says what the amber part is.
function litCaption(svg, W, text) { svgTex(svg, W / 2, 13, text, { w: W - 8, size: 15, fill: COL.ink, bg: COL.amberBg }); }
function plainCaption(svg, W, text) { svgTex(svg, W / 2, 13, text, { w: W - 8, size: 14, fill: COL.muted }); }
// Left column of a proof slide: controls, the picture, legend, readouts, the test, the model.
function proofLeft(widget, o) {
  for (const row of o.controls || []) widget.append(row);
  const plot = fillPlot(widget, o.draw);
  widget.append(legend(o.legend));
  if (o.readouts && o.readouts.length) widget.append(hh('div', 'readouts' + (o.inline ? ' inline' : ''), ...o.readouts.map(r => r.el)));
  const test = hh('div', 'test', h('p', 'part', 'Test it'), triesList(o.tests));
  const model = h('p', 'model');
  model.append(h('span', 'part', 'The picture: '), setTex(h('span'), o.model));
  widget.append(test, model);
  return { redraw: plot.redraw, wrap: plot.wrap, test: test };
}
// Right column: the proof. Each revealed line lights its part of the picture; once the proof is
// done, the look-back questions take the place of the test under the picture.
function proofRight(side, spec, plot, onLight) {
  const el = document.createElement('fl-proof-steps');
  el.onEvent = d => emit('view.action', d);
  el.onHighlight = key => onLight(key);
  el.lookBackHost = plot.test;
  el.lookBackHint = 'Look back: under the picture.';
  el.data = spec;
  side.append(el);
  return el;
}


// ---------- numbers (checked with Python: math.factorial, math.gamma, the sums) ----------
const fact = n => { let f = 1; for (let k = 2; k <= n; k++) f *= k; return f; };
// Stirling's formula with the book's constant: sqrt(2 pi n) (n/e)^n.
const stir = n => Math.sqrt(2 * PI * n) * Math.pow(n / Math.E, n);
// Gamma at an integer or a half integer.
function gammaHalf(x) {
  if (Number.isInteger(x)) return fact(x - 1);
  let g = Math.sqrt(PI);
  for (let j = 0; j < Math.floor(x); j++) g *= j + 0.5;
  return g;
}
// C_n: volume of the ball of radius 1 in n dimensions, pi^(n/2) / Gamma(n/2 + 1).
const ballC = n => Math.pow(PI, n / 2) / gammaHalf(n / 2 + 1);
// Scientific form for TeX: 7.77\times10^{154}; plain fixed form for moderate sizes.
function sciTex(v) {
  if (v === 0) return '0';
  const e = Math.floor(Math.log10(Math.abs(v)));
  if (e >= -2 && e <= 3) return v.toFixed(Math.max(0, 3 - e));
  return (v / Math.pow(10, e)).toFixed(2) + String.raw`\times10^{` + e + '}';
}
const RAT = []; for (let k = 1; k <= 100; k++) RAT.push(stir(k) / fact(k));

// ---------- step 1: Stirling (proof, 06:24 to 10:05) ----------
function slideStirling(widget, side) {
  let n = 10, lit = '';
  const NX = 31, YMAX = 3.6;
  const LIT = {
    bars: String.raw`amber bars: $\sum_{k=1}^{n}\ln k=\ln n!$`,
    trap: String.raw`amber: the chords, area $\sum_{k=1}^{n}\ln k-\tfrac12\ln n$`,
    area: String.raw`amber: the area under $\ln x$, $\int_1^n\ln x\,dx$`,
    half: String.raw`amber: the last bar; half of it is $\tfrac12\ln n$` };
  const sN = slider('$n$', { id: 'n', name: 'n, the number in n factorial', min: 2, max: 30, step: 1, value: n,
    fmt: v => '$' + v + '$', onInput: v => { n = v; update(); } });
  const rT = readout('true', '$n!$');
  const rS = readout('stir', '$S(n)$, Stirling');
  const rR = readout('ratio', String.raw`$S(n)/n!$`);
  const rD = readout('gap', String.raw`$n!-S(n)$`);
  function draw(svg, W, Hh) {
    const L = 40, R = 14, T = 34, B = Hh - 26, pw = W - L - R;
    const X = x => L + x / NX * pw, Y = v => B - v / YMAX * (B - T);
    for (let k = 1; k <= n; k++) {

      svgNode('rect', { x: X(k - 0.5), y: Y(Math.log(k)), width: X(k + 0.5) - X(k - 0.5), height: Y(0) - Y(Math.log(k)),
        fill: hot ? COL.amberBg : COL.greyBar, stroke: hot ? COL.amber : COL.grey, 'stroke-width': 1 }, svg);
    }
    const chords = [];
    for (let k = 1; k <= n; k++) chords.push([X(k), Y(Math.log(k))]);
    path(svg, [[X(1), Y(0)], ...chords, [X(n), Y(0)]],
      { fill: lit === 'trap' ? COL.amberBg : COL.accent, 'fill-opacity': lit === 'trap' ? 1 : 0.10, stroke: COL.accent, 'stroke-width': 2 }, true);
    const curve = [];
    for (let i = 0; i <= 120; i++) { const x = 1 + (n - 1) * i / 120; curve.push([X(x), Y(Math.log(x))]); }
    if (lit === 'area') glowFill(svg, [...curve, [X(n), Y(0)], [X(1), Y(0)]]);
    path(svg, curve, { stroke: COL.ink, 'stroke-width': 2 });
    svgNode('line', { x1: L, y1: B, x2: W - R, y2: B, stroke: COL.grey }, svg);
    svgNode('line', { x1: L, y1: T, x2: L, y2: B, stroke: COL.grey }, svg);
    for (const k of [0, 10, 20, 30]) svgText(svg, X(k), B + 16, String(k), { 'text-anchor': 'middle' });
    for (const v of [1, 2, 3]) svgText(svg, L - 6, Y(v) + 4, String(v), { 'text-anchor': 'end' });
    if (lit) litCaption(svg, W, LIT[lit]);
    return null;
  }
  function update() {
    rT.set('$' + sciTex(fact(n)) + '$');
    rS.set('$' + sciTex(stir(n)) + '$');
    rR.set('$' + fixed(stir(n) / fact(n), 4) + '$');
    rD.set('$' + sciTex(fact(n) - stir(n)) + '$');
    plot.redraw();
  }
  const plot = proofLeft(widget, {
    controls: [hh('div', 'sliders', sN.el)],
    draw: draw,
    legend: [
      { chip: true, color: 'var(--pal-grey-bar)', text: String.raw`grey bars: $\ln k$ for $k=1$ to $n$; together $\ln n!$` },
      { color: 'var(--pal-accent)', width: 3, text: String.raw`blue: chords from $(k,\ln k)$ to $(k+1,\ln(k+1))$` },
      { color: 'var(--pal-ink)', width: 3, text: String.raw`solid line: $\ln x$` },
      { chip: true, color: 'var(--pal-amber-bg)', text: 'amber: what the newest line is about' }],
    readouts: [rT, rS, rR, rD],
    tests: [
      String.raw`Guess: is the sum of the bars close to the area under $\ln x$? Set $n=30$ and look.`,
      String.raw`At $n=30$ the ratio $S(n)/n!$ reads $0.9972$. Close to $1$ is a few cases, not a proof.`],
    model: String.raw`the bars add up to the blue chord area plus half the last bar, and the chords sit just under the curve $\ln x$.` });
  proofRight(side, {
    id: 'stirling',
    goal: { tex: String.raw`n!\approx C\sqrt n\,(n/e)^n`, words: 'for one constant $C$' },
    facts: [
      { tex: String.raw`\ln(ab)=\ln a+\ln b`, words: 'the log of a product is a sum', ref: 'Primer · Logarithms, step 4' }],
    lines: [
      { tex: String.raw`\ln n!=\sum_{k=1}^{n}\ln k`, move: 'Use an earlier result', choices: ['Compare or bound', 'Take a limit'],
        why: String.raw`$n!$ is a product; its log is a sum (Logarithms, step 4)`, highlight: 'bars' },
      { tex: String.raw`\sum_{k=1}^{n}\ln k\approx\int_1^n\ln x\,dx+\tfrac12\ln n`, move: 'Compare or bound', choices: ['Change variables', 'Use symmetry'],
        why: String.raw`the chords sum to the sum less $\tfrac12\ln n$; they lie under $\ln x$`, highlight: 'trap' },
      { tex: String.raw`\int_1^n\ln x\,dx=n\ln n-n+1`, move: 'Use an earlier result', choices: ['Name a piece', 'Telescope'],
        why: String.raw`by parts, $u=\ln x$; $\ln1=0$ (Integrals: techniques, step 3)`, highlight: 'area' },
      { tex: String.raw`\ln n!\approx n\ln n-n+1+\tfrac12\ln n`, move: 'Rearrange', choices: ['Add zero or multiply by one', 'Induction'],
        why: 'put lines 2 and 3 together', highlight: 'half' },
      { tex: String.raw`n!\approx C\sqrt n\,(n/e)^n`, move: 'Undo with the inverse', choices: ['Take a limit', 'Contradiction'],
        why: String.raw`exp undoes ln; $C$ holds the constant` }],
    lookBack: [
      { q: String.raw`Where does $\tfrac12\ln n$ come from?`,
        a: String.raw`The chords give the two ends half weight. $\ln1=0$, so only the end at $n$ is left: half of the last bar.` },
      { q: String.raw`Why a constant $C$, and not $e$?`,
        a: String.raw`The gap between the sum and the chords settles at a constant; it does not go to $0$. The first form has $C$ near $e=2.718$. The limit is $\sqrt{2\pi}=2.5066\ldots$, which chapter 9 states without proof.` }] },
    plot, key => { lit = key || ''; update(); });
  update();
}

// ---------- step 4: surface from volume (17:06) ----------
function slideSurface(widget, side) {
  let n = 3, r = 1, m = 10;
  const A = s => n * ballC(n) * Math.pow(s, n - 1);
  const shellSum = () => { let t = 0; const dr = r / m; for (let i = 0; i < m; i++) t += A((i + 0.5) * dr) * dr; return t; };
  const sN = slider('$n$', { id: 'n', name: 'dimension n', min: 1, max: 10, step: 1, value: n, fmt: v => '$' + v + '$', onInput: v => { n = v; update(); } });
  const sR = slider('$r$', { id: 'r', name: 'radius r', min: 0.2, max: 1.5, step: 0.05, value: r, fmt: v => '$' + v.toFixed(2) + '$', onInput: v => { r = v; update(); } });
  const sM = slider(String.raw`$m$, shells`, { id: 'shells', name: 'number of shells', min: 2, max: 100, step: 1, value: m, fmt: v => '$' + v + '$', onInput: v => { m = v; update(); } });
  const rA = readout('surface', String.raw`$A_n(r)$, the surface at $r$`);
  const rSum = readout('sum', String.raw`sum of $m$ thin shells`);
  const rV = readout('exact', String.raw`$C_nr^n$, exact volume`);
  function draw(svg, W, Hh) {
    const L = 48, R = 16, T = 26, B = Hh - 26, pw = W - L - R, xmax = 1.25 * r;
    const ymax = A(xmax) * 1.05;
    const X = s => L + s / xmax * pw, Y = v => B - v / ymax * (B - T);
    const dr = r / m;
    for (let i = 0; i < m; i++) {
      const s = (i + 0.5) * dr, hgt = A(s);
      svgNode('rect', { x: X(i * dr), y: Y(hgt), width: Math.max(0.5, X(dr) - X(0)), height: Y(0) - Y(hgt),
        fill: COL.greyBar, stroke: COL.muted, 'stroke-width': 0.5 }, svg);
    }
    const pts = [];
    for (let i = 0; i <= 120; i++) { const s = xmax * i / 120; pts.push([X(s), Y(A(s))]); }
    path(svg, pts, { stroke: COL.accent, 'stroke-width': 3 });
    svgNode('line', { x1: X(r), y1: T, x2: X(r), y2: B, stroke: COL.ink, 'stroke-dasharray': '4 3' }, svg);
    svgNode('line', { x1: L, y1: B, x2: W - R, y2: B, stroke: COL.grey }, svg);
    svgNode('line', { x1: L, y1: T, x2: L, y2: B, stroke: COL.grey }, svg);
    svgText(svg, X(0), B + 16, '0', { 'text-anchor': 'middle' });
    svgTex(svg, X(r), B + 16, '$r$', { w: 40, size: 14, fill: COL.text2 });
    return null;
  }
  function update() {
    rA.set('$' + fixed(A(r), 3) + '$');
    rSum.set('$' + fixed(shellSum(), 4) + '$');
    rV.set('$' + fixed(ballC(n) * Math.pow(r, n), 4) + '$');
    plot.redraw();
  }
  widget.append(hh('div', 'sliders', sN.el, sR.el, sM.el),
    legend([
      { color: 'var(--pal-accent)', width: 3, text: String.raw`blue: the surface $A_n(s)$ at each radius $s$` },
      { chip: true, color: 'var(--pal-grey-bar)', text: 'grey bars: m thin shells, each height A times thickness' },
      { color: 'var(--pal-ink)', width: 2, dash: true, text: String.raw`dashed: the radius $r$` }]));
  const plot = fillPlot(widget, draw);
  widget.append(hh('div', 'readouts', rA.el, rSum.el, rV.el));
  side.append(sym(String.raw`$V(r)=C_nr^n$: the ball of radius $r$. $A_n(r)$: the surface, the volume of one thin shell per unit thickness. The shell fraction is in Recitation 1 (step 4).`));
  side.append(setTex(h('p', 'fx'), String.raw`$A_n(r)=\dfrac{dV}{dr}=n\,C_n\,r^{n-1}$`));
  side.append(hh('div', 'blk', h('div', 'kicker', 'Try it'), triesList([
    'Set $n=3$, $r=1$, and $m=10$ shells. How close is the sum to the exact volume?',
    'Raise the shells to $100$. Does the sum get closer?',
    'Set $n=10$, $r=1$. Which is ten times the other: the surface or the volume?'])));
  side.append(takeLine('The surface is the rate at which the volume grows with the radius.'));
  update();
}

    problem: 'Hamming’s example: the lowest point in North Jersey is at the bottom of a mine shaft (21:48). You walk on the land and cannot see the shaft. How do you search?',
    formula: String.raw`$x$ is a local low point if $f(x)\le f(x')$ for every nearby $x'$.`,
    chooser: 1, who: 'Hamming',
    options: [
      { text: 'Walk downhill from where you stand, one lower step at a time.',
        assumes: 'the lowest point is at the end of the nearest downhill path.',
        verdict: 'You stop at the bottom of a local valley. Walking locally does not find the shaft (22:18).' },
      { text: 'Use what you know: go where the mines were, then search around there.',
        assumes: 'good places are known from experience.',
        verdict: 'Hamming: "you need inspiration of where to look" (22:18). This is the way to look for the shaft.' },
      { text: 'Sample random spots across the whole land and keep the lowest.',
        assumes: 'enough random spots will hit the shaft.',
        verdict: 'A shaft is a small spot. Random samples almost never land in it.' }],
    reveal: [
      { k: "Hamming's move", v: 'A local search stops at a local low point. Use inspiration about where the good spots are.', t: '22:18' },
      { k: 'What it bought', v: 'A search that starts where good designs are likely to be.', t: '22:18' },
      { k: 'What it cost', v: 'Good spots can lie far apart with little between: you cannot walk from one to the next (22:51).', t: '22:51' }],
    takeaway: 'A walk finds a local low point; the best one needs a guess about where to look.' }
};

// ---------- frame ----------
const SLIDES = [
  { id: 'stirling', kind: 'proof', tag: 'Lecture 06:24 to 10:05', title: 'The shape of n factorial: Stirling',
    question: String.raw`How can a sum of the logs of $1,\dots,n$ give the size of $n!$?`,
    symbols: String.raw`$n!=1\cdot2\cdots n$. $\ln$: the natural log. $C$: one constant, not yet known.`,
    mount: slideStirling },
  { id: 'ratio-vs-difference', kind: 'content', tag: 'Lecture 10:05', title: 'The ratio goes to 1; the gap grows',
    question: 'As $n$ grows, do the ratio and the gap between $n!$ and its formula settle?', mount: slideRatioDiff },
  { id: 'sphere-volume', kind: 'content', tag: 'Lecture 16:02 to 18:13', title: 'The unit ball: its volume peaks, then goes to 0',
    question: 'How big is a ball of radius 1 as the number of dimensions grows?', mount: slideBall },
  { id: 'surface-from-volume', kind: 'content', tag: 'Lecture 17:06', title: 'The surface is the rate the volume grows',
    question: 'A ball of radius $r$ is many thin shells. How much volume does one shell hold?', mount: slideSurface },
  { id: 'optimum-on-surface', kind: 'decision', tag: 'Lecture 20:46 to 21:17', title: 'Is the best design inside, or on the surface?',
    question: 'Where is the best design when there are very many parameters?' },
  { id: 'mine-shaft', kind: 'decision', tag: 'Lecture 21:48 to 22:51', title: 'The lowest point is a mine shaft',
    question: 'How do you search a space where the best point is hidden?' }
];

// ---------- decision slides: shared ----------
const D_TRIES = ['Read the problem.', 'Pick what you would do before he says it.', 'Read every verdict, not only yours.'];
const DSTATE = {};
Object.keys(DECISIONS).forEach(id => { DSTATE[id] = { pick: null, open: false }; });
// Reveal a decision once; later calls change nothing. by: 'user' (a pick or the button) or 'cue'.
function revealDecision(id, by) {
  const st = DSTATE[id];
  if (!st || st.open) return false;
  st.open = true;
  emit('view.action', { action: 'reveal', step: id, by: by });
  return true;
}
function mountDecision(s, widget, side, sec) {
  const D = DECISIONS[s.id], st = DSTATE[s.id], open = st.open;
  const redraw = () => goTo(cur, true);
  const prob = mark(h('div', 'prob'), 'problem', s.id);
  prob.append(hh('p', '', h('span', 'lead', 'The problem.'), document.createTextNode(' '), setTex(h('span'), D.problem)));
  const opts = h('div', 'opts');
  D.options.forEach((o, k) => {
    const L = 'ABC'[k];
    const card = mark(h('div', 'opt'), 'card', L, o.text.replace(/\$/g, ''));
    card.setAttribute('role', 'button');
    card.setAttribute('aria-disabled', open ? 'true' : 'false');
    card.tabIndex = open ? -1 : 0;
    card.classList.toggle('on', st.pick === L);
    card.classList.toggle('chooser', open && k === D.chooser);
    const who = [];
    if (st.pick === L) who.push('Your pick');
    if (open && k === D.chooser) who.push(D.who);
    const top = hh('div', 'top', h('span', 'letter', L), h('span', 'who', who.join(', ')));
    const asm = setTex(h('p', 'asm'), 'Assumes: ' + o.assumes);
    const verdict = open ? setTex(h('div', 'verdict'), o.verdict) : h('div', 'verdict idle', 'Verdict after your pick.');
    card.append(hh('div', 'lhs', top, setTex(h('div', 'body'), o.text)), hh('div', 'rhs', asm, verdict));
    card.addEventListener('click', () => {
      if (DSTATE[s.id].open) return;
      st.pick = L;
      emit('view.action', { action: 'pick', step: s.id, option: L, correct: k === D.chooser });
      revealDecision(s.id, 'user');
      redraw();
    });
    opts.append(card);
  });
  const rev = mark(h('div', 'reveal'), 'reveal', s.id);
  if (!open) {
    rev.classList.add('idle');
    for (const r of D.reveal) rev.append(hh('p', 'rv hold', h('span', 'k', r.k + '. '), h('span', '', 'Shown after your pick.')));
    const btn = mark(h('button', 'btn primary', 'Show answer'), 'control', 'show-answer');
    btn.addEventListener('click', () => { if (revealDecision(s.id, 'user')) redraw(); });
    rev.append(hh('div', 'actions', btn));
  } else {
    for (const r of D.reveal) {
      const p = hh('p', 'rv', h('span', 'k', r.k + '. '));
      p.append(setTex(h('span'), r.v), h('span', 't', ' (' + r.t + ')'));
      rev.append(p);
    }
  }
  widget.append(prob, opts, rev);
  side.append(setTex(h('p', 'fx'), D.formula));
  if (D.symbols) side.append(sym(D.symbols));
  side.append(hh('div', 'blk', h('div', 'kicker', 'Try it'), hh('ol', 'tries', ...D_TRIES.map(t => h('li', '', t)))));
  if (D.ai) {
    if (open) {
      const p = setTex(h('p', 'ai'), D.ai);
      p.append(' ', h('span', 'src', '(' + D.src + ')'));
      side.append(hh('div', 'blk', h('div', 'kicker', 'Same move in AI research'), p));
    } else side.append(hh('div', 'blk', h('div', 'kicker', 'Same move in AI research'), h('p', 'hold ai', 'Shown after your pick.')));
  }
  side.append(open ? takeLine(D.takeaway) : h('p', 'hold', 'Takeaway: shown after your pick.'));
}

// ---------- frame ----------
let cur = 0, shownId = null, endSent = false;
function goTo(i, same) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  if (shownId !== null && shownId !== s.id) emit('view.step', { step: s.id });
  shownId = s.id;
  const stage = $('#stage');
  stage.innerHTML = '';
  PLOTS = [];
  const widget = h('div', 'widget');
  const side = h('div', 'side');
  side.append(h('div', 'tag', s.tag), setTex(h('h2'), s.title));
  side.append(setTex(h('p', s.kind === 'decision' ? 'q' : 'question'), s.question));
  if (s.symbols) side.append(sym(s.symbols));
  const cls = 'slide' + (s.kind === 'proof' ? ' proof-slide' : s.kind === 'decision' ? ' decision' : '');
  const sec = mark(h('section', cls), 'step', s.id, s.title.replace(/\$/g, ''));
  sec.append(widget, side);
  stage.append(sec);
  stage.scrollTop = 0;
  if (s.kind === 'decision') mountDecision(s, widget, side, sec);
  else s.mount(widget, side);
  // On a content slide the takeaway is dimmed until the user has tried a control.
  const tk = s.kind === 'content' ? side.querySelector('.takeaway') : null;
  if (tk) {
    tk.classList.add('dim');
    const openTk = () => tk.classList.remove('dim');
    sec.addEventListener('input', openTk);
    sec.addEventListener('click', e => { if (e.target.closest('[data-item="control"],[data-item="preset"]')) openTk(); });
    sec.addEventListener('pointerdown', e => { if (e.target.closest('[data-item="control"]')) openTk(); });
  }
  tex(sec);
  if (cur === SLIDES.length - 1 && !endSent) { endSent = true; emit('view.action', { action: 'deck-end' }); }
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, k) => d.classList.toggle('on', k === cur));
}
// A cue is a state. {step} goes to the step and does nothing if it is shown. {step, reveal: true}
// also reveals that decision, once; a revealed decision stays revealed.
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i < 0) return;
  const changed = msg.reveal === true && SLIDES[i].kind === 'decision' && revealDecision(SLIDES[i].id, 'cue');
  if (i !== cur || changed) goTo(i);
}
(function init() {
  const dots = $('#dots');
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = s.title.replace(/\$/g, '');
    b.addEventListener('click', () => goTo(i));
    dots.appendChild(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],textarea,select')) return;
    if (e.target && e.target.classList && e.target.classList.contains('opt') && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault(); e.target.click(); return;
    }
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
})();
</script>
</body>

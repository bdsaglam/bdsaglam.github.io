<!doctype html><html lang="en"><head><meta charset="utf-8"><title>After Lecture 19: test the model from two sides</title><script src="../../components/theme.js"></script><script src="../../lib/fluid.js"></script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font:18px/1.42 system-ui;color:var(--pal-fg);background:var(--pal-bg)}main{height:100%;display:grid;grid-template-rows:66px 1fr 62px;padding:20px 28px;gap:12px}header,footer{display:flex;align-items:center;justify-content:space-between;gap:18px}header{border-bottom:1px solid var(--pal-line)}.tag{color:var(--pal-muted);font-size:15px}h1{font-size:23px;margin:0}h2{font-size:31px;line-height:1.15;margin:0 0 12px}.body{display:grid;grid-template-columns:60% 40%;min-height:0}.lab{display:flex;flex-direction:column;background:var(--pal-soft);border:1px solid var(--pal-line);border-radius:12px;padding:16px;gap:10px;min-height:0}.lesson{padding:20px 0 10px 28px;display:flex;flex-direction:column;min-height:0}.question{font-size:21px;margin:0 0 16px}.formula{font-size:23px;padding:12px;background:var(--pal-accent-soft);border-radius:8px;margin:8px 0 12px}.defs{font-size:17px;color:var(--pal-text-2)}ol{padding-left:24px;margin:8px 0}li{margin-bottom:9px}.take{margin-top:auto;padding:12px;border-left:4px solid var(--pal-accent);background:var(--pal-accent-soft);font-size:18px}.chart{flex:1;min-height:0;position:relative}svg{width:100%;height:100%;display:block}.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:44px}button,select{font:inherit;color:var(--pal-fg);background:var(--pal-panel);border:1px solid var(--pal-line);border-radius:7px;padding:9px 15px;cursor:pointer}button:hover{border-color:var(--pal-accent)}button:disabled{opacity:.4;cursor:default}input{accent-color:var(--pal-accent)}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:16px}.legend span:before{content:'━';margin-right:7px;color:var(--c)}.readout{font-size:19px;min-height:30px}.proof{height:100%;display:flex;flex-direction:column;gap:14px;justify-content:center}.proof-row{font-size:23px;background:var(--pal-panel);border-left:4px solid var(--pal-amber);padding:16px}.proof-row small{display:block;font-size:17px;color:var(--pal-muted);margin-top:7px}.choices{display:flex;flex-direction:column;gap:14px;justify-content:center;height:100%}.choice{text-align:left;padding:14px;font-size:18px}.choice small{display:block;font-size:16px;color:var(--pal-muted);margin-top:7px}.verdict{color:var(--pal-accent);font-size:17px}.intro{display:grid;gap:18px;align-content:center;height:100%}.intro div{background:var(--pal-panel);padding:22px;border-left:4px solid var(--pal-accent);font-size:23px}.intro small{display:block;font-size:18px;color:var(--pal-muted);margin-top:5px}footer{border-top:1px solid var(--pal-line);padding-top:12px}.pages{font-size:16px;color:var(--pal-muted)}.source{font-size:14px;color:var(--pal-muted)}.bigtable{width:100%;border-collapse:collapse;font-size:22px;margin:auto 0}.bigtable th,.bigtable td{padding:18px 10px;text-align:left;border-bottom:1px solid var(--pal-line)}.bigtable th{font-size:18px;color:var(--pal-muted)}.barrow{margin:6px 0;font-size:19px}.track{height:22px;background:var(--pal-grid);position:relative}.bar{height:100%;background:var(--pal-accent)}.bar.alt{background:var(--pal-orange)}.barlabel{display:flex;justify-content:space-between}.diagram{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:auto 0}.node{padding:25px;background:var(--pal-panel);border:2px solid var(--pal-accent);border-radius:12px;font-size:26px}.node small{display:block;font-size:18px;margin-top:8px}.explain{padding:18px;background:var(--pal-panel);font-size:20px}.lab a{color:var(--pal-accent)}.source{font-size:15px} </style></head><body><main><header><h1>After Lecture 19: test the model from two sides</h1><span id="tag" class="tag"></span></header><section class="body"><div id="lab" class="lab"></div><article class="lesson"><h2 id="title"></h2><p id="question" class="question"></p><div id="defs" class="defs"></div><div id="formula" class="formula"></div><ol id="tries"></ol><div id="take" class="take"></div></article></section><footer><button id="prev">← Previous</button><span class="pages" id="pages"></span><span class="source">Hamming · Lecture 19 · manual study</span><button id="next">Next →</button></footer></main><script>
const slides=[{"id": "particles", "title": "One transfer must appear twice", "time": "After \u00b7 24:30\u201326:36", "q": "How can a tiny sign error lose particles?", "kind": "reaction", "defs": "Toy chemistry: particles move from state A to state B. Start with 100 in A and 0 in B. Each step transfers one tenth of A.", "formula": "", "tries": ["Take a step. Check the total.", "Enable the sign bug, then take another step."], "take": "A conservation check can expose a programming error without knowing the detailed trajectory."}, {"id": "balance", "title": "Prove the bookkeeping invariant", "time": "After \u00b7 25:32\u201326:04", "q": "Why should the total remain unchanged?", "kind": "proof", "defs": "$a,b$: particle counts in states A and B. $d$: particles transferred in one step.", "formula": "$a_{\\rm next}+b_{\\rm next}=a+b$", "tries": ["Predict the sign of the transfer in each state.", "Reveal the cancellation."], "take": "Generating both terms from one reaction description makes this pairing structural. The generator itself still needs checking.", "rows": [["a_{\\rm next}=a-d", "Subtract the particles leaving A"], ["b_{\\rm next}=b+d", "Add the same particles entering B"], ["a_{\\rm next}+b_{\\rm next}=a-d+b+d", "Add the two update rules"], ["a_{\\rm next}+b_{\\rm next}=a+b", "Cancel the matched transfer terms"]]}, {"id": "generator", "title": "Put expertise where it matters", "time": "After \u00b7 25:01\u201326:36", "q": "What should be automated in a hundred-equation model?", "kind": "choice", "defs": "Chemists disagree about which reactions to include. Each selected reaction contributes matched terms to several equations.", "formula": "", "tries": ["Pick a workflow, then inspect Hamming\u2019s choice."], "take": "A reaction generator reduces transcription work. Domain experts still choose the reactions and constants.", "options": [["Let the computer choose the chemistry from convenience", "Assumes easy implementation implies physical relevance.", "This removes the expertise the model needs most."], ["Hand-copy each equation for every run", "Assumes repeated entry of matched coefficients stays reliable.", "Hamming expected sign and coefficient mismatches at this scale."], ["Generate equation terms from chosen reaction records", "Assumes one reaction description can supply its matched contributions.", "Hamming chose this so chemists could focus on chemistry."]], "answer": 2}, {"id": "feedback", "title": "A forecast can change its own input", "time": "After \u00b7 17:42\u201320:49", "q": "What if everyone acts on the same prediction?", "kind": "routing", "defs": "Toy route choice: 100 drivers choose A or B. Travel time is 10 minutes plus one tenth of the number on that route.", "formula": "", "tries": ["Start with 20 drivers on A. Read the forecast.", "Send everyone to the currently faster route. Compare forecast with outcome."], "take": "A prediction made before people react may be wrong after they react. This toy illustrates feedback, not a traffic forecast."}, {"id": "check-relevance", "title": "A passing invariant is not enough", "time": "After \u00b7 21:21\u201322:55", "q": "Can a simulator conserve particles and still describe the wrong chemistry?", "kind": "choice", "defs": "A generated model conserves its total perfectly. A chemist suspects it omits an important reaction.", "formula": "", "tries": ["Choose the check that addresses the new concern."], "take": "Internal consistency and external relevance provide different evidence. Neither replaces the other.", "options": [["Compare with measurements in a case sensitive to the missing reaction", "Assumes the measurements can distinguish the competing models.", "This tests the omission against the world."], ["Check the same conserved total again", "Assumes conservation identifies all correct reactions.", "Many wrong reaction networks conserve the same total."], ["Use smaller time steps only", "Assumes numerical error caused the omitted effect.", "A more accurate integration still solves the incomplete model."]], "answer": 0}, {"id": "expert", "title": "When should experience outweigh a model?", "time": "After \u00b7 37:11\u201338:46", "q": "What makes an expert\u2019s disagreement informative?", "kind": "choice", "defs": "An expert says a model\u2019s forecast is implausible. The key question is whether their past experience still fits the new setting.", "formula": "", "tries": ["Choose Hamming\u2019s conditional rule."], "take": "Treat disagreement as evidence to investigate. His rule concerns relevance of experience, not a guarantee that either side is right.", "options": [["Always trust the model because it computes more details", "Assumes detail guarantees relevance.", "A detailed model can still omit a vital effect."], ["Give experience more weight under slow change", "Assumes the past setting resembles the present.", "Hamming favors the expert when technology changes slowly, and discounts old intuition under rapid change."], ["Always trust the most senior expert", "Assumes rank protects against a changed environment.", "Past experience can lose relevance after a large change."]], "answer": 1}];let page=0,revealed=0,picked=-1;let values={fraction:.5,mix:20,shared:50,a:100,b:0,bug:false,drivers:20,reacted:false};const $=x=>document.getElementById(x);const math=()=>{if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})};
function setPage(i){page=Math.max(0,Math.min(slides.length-1,i));revealed=0;picked=-1;render()}
function render(){let s=slides[page];$('title').textContent=s.title;$('tag').textContent=s.time;$('question').textContent=s.q;$('defs').innerHTML=s.defs;$('formula').innerHTML=s.formula;$('formula').style.display=s.formula?'':'none';$('tries').innerHTML=s.tries.map(t=>'<li>'+t+'</li>').join('');$('take').textContent=s.take;$('pages').textContent=`${page+1} / ${slides.length}`;$('prev').disabled=page===0;$('next').disabled=page===slides.length-1;let lab=$('lab');lab.innerHTML='';if(s.kind==='proof'){lab.innerHTML='<div class="proof">'+s.rows.slice(0,revealed).map(r=>'<div class="proof-row">$'+r[0]+'$<small>'+r[1]+'</small></div>').join('')+(revealed===0?'<div class="intro"><div>Predict the first move.<small>Reveal one equation and its reason at a time.</small></div></div>':'')+'</div><button id="reveal">'+(revealed<s.rows.length?'Reveal next move':'Proof complete')+'</button>';$('reveal').disabled=revealed>=s.rows.length;$('reveal').onclick=()=>{revealed++;render()};}else if(s.kind==='choice'){lab.innerHTML='<div class="choices">'+s.options.map((o,i)=>`<button class="choice" data-item="choice" data-id="${s.id}-${i}">${o[0]}<small>${o[1]}</small>${picked>=0?'<div class="verdict">'+(i===s.answer?'✓ ':'')+o[2]+'</div>':''}</button>`).join('')+'</div><button id="answer">Show answer</button>';lab.querySelectorAll('.choice').forEach((b,i)=>b.onclick=()=>{picked=i;render()});$('answer').onclick=()=>{picked=s.answer;render()};}else if(s.kind==='table'){lab.innerHTML='<table class="bigtable"><thead><tr>'+s.headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+s.rows.map((r,i)=>'<tr data-item="task-group" data-id="group-'+i+'">'+r.map(t=>'<td>'+t+'</td>').join('')+'</tr>').join('')+'</tbody></table><p class="explain">A faces 80 hard tasks. B faces only 20 hard tasks.</p>'}else{lab.innerHTML='<div id="visual" style="flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center"></div><div id="readout" class="readout"></div><div id="controls" class="controls"></div>';draw()}math()}
function bars(rows,max){$('visual').innerHTML=rows.map((r,i)=>`<div class="barrow"><div class="barlabel"><span>${r[0]}</span><span>${r[1].toFixed(1)}${r[2]||''}</span></div><div class="track"><div class="bar ${i%2?'alt':''}" style="width:${Math.max(0,Math.min(100,100*r[1]/max))}%"></div></div></div>`).join('')}
function slider(key,min,max,step,label){$('controls').innerHTML=`<label>${label} <input aria-label="${label}" type="range" min="${min}" max="${max}" step="${step}" value="${values[key]}"></label><output>${values[key]}</output>`;$('controls').querySelector('input').oninput=e=>{values[key]=+e.target.value;draw();math()}}
function draw(){let k=slides[page].kind;if(k==='bounce'){bars([['Model rebound height',2*values.fraction,' m'],['Measured rebound height',1.2,' m']],2);slider('fraction',.1,.9,.05,'Retained height fraction');$('readout').textContent='Drop height: 2 m. Model minus measurement: '+(2*values.fraction-1.2).toFixed(2)+' m.'}
if(k==='mix'){let w=values.mix/100;bars([['A on easy tasks',90,'%'],['B on easy tasks',80,'%'],['A on hard tasks',30,'%'],['B on hard tasks',20,'%'],['A total on its mix',30+60*w,'%'],['B total: 80 easy tasks',68,'%']],100);slider('mix',0,100,1,'A easy-task count');$('readout').textContent=`A gets ${values.mix} easy and ${100-values.mix} hard tasks; B gets 80 easy and 20 hard.`}
if(k==='standard'){let w=values.shared/100;bars([['A on common mix',30+60*w,'%'],['B on common mix',20+60*w,'%']],100);slider('shared',0,100,1,'Shared easy-task percentage');$('readout').textContent='A stays ahead by 10 percentage points. Both totals move with the task mix.'}
if(k==='reaction'){let a=values.a,b=values.b;$('visual').innerHTML=`<div class="diagram"><div class="node">State A<small>${a.toFixed(2)} particles</small></div><div class="node">State B<small>${b.toFixed(2)} particles</small></div></div><div class="explain">One transfer: remove from A; ${values.bug?'BUG: remove from':'add to'} B.</div>`;$('readout').textContent=`Total: ${(a+b).toFixed(2)} particles · initial total: 100`;$('controls').innerHTML='<button id="step">One step</button><button id="reset">Reset counts</button><label><input id="bug" type="checkbox"> Sign bug</label>';$('bug').checked=values.bug;$('step').onclick=()=>{let d=.1*values.a;values.a-=d;values.b+=values.bug?-d:d;draw()};$('reset').onclick=()=>{values.a=100;values.b=0;draw()};$('bug').onchange=e=>{values.bug=e.target.checked;draw()}}
if(k==='routing'){let n=values.drivers;bars([['Route A current time',10+.1*n,' min'],['Route B current time',10+.1*(100-n),' min']],20);$('readout').textContent=values.reacted?'Everyone followed the old forecast. The chosen route now takes 20 minutes.':'Before reaction: route A takes 12 minutes; route B takes 18 minutes.';$('controls').innerHTML='<button id="react">Send everyone to faster route</button><button id="reset">Reset</button>';$('react').disabled=values.reacted;$('react').onclick=()=>{values.drivers=n<50?100:0;values.reacted=true;draw()};$('reset').onclick=()=>{values.drivers=20;values.reacted=false;draw()}}
math()}
$('prev').onclick=()=>setPage(page-1);$('next').onclick=()=>setPage(page+1);window.addEventListener('fluid-themechange',()=>{if($('visual'))draw()});window.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')setPage(page+1);if(e.key==='ArrowLeft')setPage(page-1)});render();window.addEventListener('load',math);
</script></body></html>

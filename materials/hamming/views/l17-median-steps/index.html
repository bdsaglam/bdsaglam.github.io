<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>The running median, and what linearity forces</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../../components/theme.js"></script>
<style>
/* Colors come from the theme palette (../../components/theme.js): grey for inputs and exact values, blue for
   outputs and the reader's choice, amber only for proof lights, red only for a failed check. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft);
  --red:var(--pal-red); --redbg:var(--pal-red-bg);
  --tint:var(--pal-soft-hover); --rim:var(--pal-soft-3);
  --u:clamp(16px,1.35vw,20px);
}
:root[data-fluid-theme="dark"]{ --tint:var(--pal-soft); --rim:var(--pal-line); }
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 24px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(6px,1vh,12px) 24px;overflow:hidden}
footer{display:flex;align-items:center;gap:10px;padding:8px 24px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Slide frame: widget on the left (3/5), text on the right (2/5). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(18px,2.4vw,40px)}
.widget{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(6px,1vh,10px);overflow:hidden}
.widget>*{max-width:100%;min-width:0}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(6px,1.1vh,12px);overflow:hidden}
.tag{font:13px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(20px,1.9vw,28px);line-height:1.2;margin:0;font-weight:650}
.question{margin:0;font-size:clamp(16px,1.3vw,18px);font-weight:600}
.case{margin:0;font-size:16px}
.formula{font-size:clamp(18px,1.8vw,26px)}
.formula .katex-display{margin:.2em 0}
.sym{margin:0;font-size:16px;color:var(--muted)}
.tries{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.tries li::marker{color:var(--accent);font-weight:600}
.takeaway{margin:0;padding:10px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}
.echo{margin:0;font-size:16px}
.echo .kicker{display:block;font-size:14px;color:var(--muted)}
.echo .src{color:var(--muted);font-size:14px}

/* Controls, readouts, legend */
.sliders{display:flex;gap:8px 24px;flex-wrap:wrap;width:100%;align-items:center}
.btnrow{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center}
.btnrow .lab{font-size:16px;color:var(--muted);margin-right:2px}
.slide-ctl{display:flex;align-items:center;gap:8px;font-size:16px;flex-wrap:wrap}
.slide-ctl .lab{color:var(--muted)}
.slide-ctl input{width:clamp(120px,12vw,190px);vertical-align:middle;accent-color:var(--accent)}
.slide-ctl .val{min-width:44px}
.btn{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--pal-panel);color:var(--fg);border-radius:8px;cursor:pointer;font-size:16px;line-height:1.3}
.btn.on{background:var(--chip);border-color:var(--accent);color:var(--pal-accent-deep)}
.btn:disabled{opacity:.4;cursor:default}
.readouts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.readout{flex:1 1 150px;min-width:0;padding:4px 10px;border-radius:10px;background:var(--pal-soft);font-size:16px;overflow-wrap:anywhere;overflow:hidden}
.readout .k{color:var(--pal-text-2);font-size:15px}
.readout .val{font-size:17px;font-weight:600;line-height:1.55}
.legend{display:flex;gap:4px 18px;flex-wrap:wrap;font-size:16px;color:var(--pal-text-2);align-items:center}
.sw{display:inline-block;width:22px;height:0;vertical-align:middle;margin-right:6px}
.chip{display:inline-block;width:16px;height:12px;vertical-align:middle;margin-right:6px;border-radius:2px}
.ring{display:inline-block;width:12px;height:12px;vertical-align:middle;margin-right:6px;border-radius:50%;border:2px solid var(--pal-ink)}

/* Plots fill the height left in the widget column */
.fill{flex:1 1 0;min-height:90px;position:relative;width:100%}
.fill>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.name i{font-style:italic}
.takeholder{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.takeholder .takeaway,.takeholder .echo{align-self:stretch}

/* Proof slides: test and picture on the left, the proof (fl-proof-steps) on the right */
.slide.proof-slide{grid-template-columns:minmax(0,11fr) minmax(0,9fr)}
.slide.proof-slide .side{justify-content:flex-start}
.fill.proofpic{min-height:150px}
.slide.proof-slide .slide-ctl input{width:clamp(90px,9vw,140px)}
.slide.proof-slide .sliders{gap:6px 16px}
.slide.proof-slide .btn{padding:4px 10px}
.part{margin:0;font-weight:600;color:var(--muted)}
.test{display:flex;flex-direction:column;gap:3px;font-size:16px}
.test .tries{gap:3px}
.model{margin:0;padding:8px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}

/* Decision slides: the problem with its sketch, three cards and the reveal on the left; formula,
   try-steps and takeaway on the right. */
.slide.decision{grid-template-columns:minmax(0,2.05fr) minmax(0,1fr);gap:clamp(20px,2.6vw,40px)}
.decision .widget{gap:6px}
.decision .side{justify-content:space-evenly;gap:clamp(8px,1.8vh,18px)}
.decision h2{font-size:clamp(22px,2.1vw,30px)}
.decision .q{margin:0;font-size:clamp(17px,1.55vw,21px);font-weight:600;line-height:1.35}
.decision .fx{margin:0;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--tint);font-size:clamp(17px,1.6vw,22px);line-height:1.4}
.decision .kicker{font-size:14px;color:var(--muted);margin:0 0 3px}
.decision .blk{display:flex;flex-direction:column;gap:3px}
.decision .takeaway{padding:11px 14px;line-height:1.4}
.decision .tries{gap:6px;font-size:clamp(16px,1.35vw,18px);line-height:1.4}
.decision .hold{color:var(--muted);font-style:italic;background:var(--tint);border:1px dashed var(--line);border-radius:6px;padding:9px 12px;margin:0;font-size:16px;line-height:1.4}
.prob{flex:0 0 auto;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0 14px;align-items:stretch;border:1px solid var(--line);border-radius:10px;padding:6px 14px;background:var(--tint);font-size:16px;line-height:1.4}
.prob .lead{font-weight:650;color:var(--muted)}
.prob p{margin:0;align-self:center}
.prob .fill.sketch{min-height:118px;flex:none;height:100%}
.opts{flex:0 0 auto;display:flex;flex-direction:column;gap:clamp(4px,0.5vw,8px)}
.opt{display:grid;grid-template-columns:minmax(0,0.78fr) minmax(0,1.22fr);gap:0 14px;padding:clamp(6px,0.7vw,10px) 12px;border:1px solid var(--line);border-radius:10px;background:var(--pal-panel);color:inherit;text-align:left;cursor:pointer;min-width:0;font:inherit}
.opt .lhs{display:flex;flex-direction:column;gap:3px;min-width:0}
.opt .rhs{display:flex;flex-direction:column;gap:3px;min-width:0;border-left:1px solid var(--pal-soft-2);padding-left:14px}
.opt:not([aria-disabled="true"]):hover{border-color:var(--accent)}
.opt[aria-disabled="true"]{cursor:default}
.opt .top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:16px}
.opt .letter{font-weight:700;color:var(--accent)}
.opt .who{font-size:14px;color:var(--muted);text-align:right}
.opt .body{font-size:clamp(16px,1.4vw,19px);line-height:1.3}
.opt .asm{margin:0;font-size:clamp(16px,1.3vw,18px);line-height:1.33;color:var(--muted)}
.opt .verdict{font-size:clamp(16px,1.3vw,18px);line-height:1.33;color:var(--fg)}
.opt .verdict.idle{color:var(--muted);font-style:italic}
.opt.on{box-shadow:inset 0 0 0 2px var(--pal-ink)}
.opt.chooser{background:var(--chip);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.opt.chooser .who{color:var(--pal-accent-deep);font-weight:600}
.reveal{flex:1 1 auto;min-height:0;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:clamp(16px,1.25vw,18px);display:flex;flex-direction:column;justify-content:center;gap:6px}
.reveal.idle{background:var(--tint);color:var(--muted)}
.rv{margin:0;line-height:1.38}
.rv .k{font-weight:650;color:var(--accent)}
.rv .t{color:var(--muted);font-size:14px;white-space:nowrap}
.rv.hold{color:var(--muted)}
.decision .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px}
.decision .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--pal-on-accent);padding:6px 16px}

/* Short windows (1100x620 and similar): tighter spacing, body text stays 16px */
@media (max-height: 680px){
  header{padding-top:4px}
  #stage{padding:4px 24px}
  footer{padding:4px 24px}
  .widget{gap:5px}
  .side{gap:4px}
  .tries{gap:2px}
  .sym,.tries,.takeaway,.case,.echo{line-height:1.25}
  .takeaway{padding:6px 10px}
  .formula{font-size:20px}
  h2{font-size:20px}
  .question{font-size:16px}
  .fill{min-height:80px}
  .readout{padding:2px 8px}
  .readout .val{line-height:1.45}
  .fill.proofpic{min-height:130px}
  .model{padding:5px 10px}
  .test,.model{line-height:1.25}
  .test .tries{gap:1px}
  .btn{padding:4px 10px}
  .decision h2{font-size:21px}
  .decision .side{gap:7px}
  .decision .tries{gap:2px;line-height:1.3}
  .decision .takeaway{padding:7px 12px}
  .reveal{gap:3px;padding:5px 12px}
  .rv{line-height:1.28}
  .opts{gap:3px}
  .opt{padding:4px 12px}
  .opt .body,.opt .asm,.opt .verdict{line-height:1.25}
  .prob{padding:4px 12px;line-height:1.3}
  .prob .fill.sketch{min-height:104px}
  .reveal .rv.hold{padding:5px 10px}
}
</style>
</head>
<body>
<header>Lecture 17 · The running median, and what linearity forces</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script src="../../components/proof-steps.js"></script>
<script>
// Numbers checked against lectures/17-digital-filters-part-iv/checks.py and, for the seeded runs, with node
// (workspace/l17-materials-2026-10-24/l17-median-steps-tools/).

// ---------- palette and redraw ----------
// COL holds the palette for the SVG being drawn; plotBox reads it at every paint, so a draw always uses the
// current theme. A theme switch redraws the current slide's plots and keeps every control's state.
let COL = {};
const PAL_NAMES = ['bg', 'ink', 'fg', 'text-2', 'muted', 'grey', 'guide', 'grid', 'line', 'panel', 'soft', 'soft-2',
  'accent', 'accent-2', 'accent-deep', 'accent-tint', 'accent-soft', 'on-accent', 'slate-4', 'slate-2',
  'amber', 'amber-bg', 'amber-ink', 'red'];
function readPalette() {
  const o = {};
  for (const n of PAL_NAMES) o[n.replace(/-(\w)/g, (_, c) => c.toUpperCase())] = FluidTheme.color(n);
  return o;
}
let PLOTS = [];
window.addEventListener('fluid-themechange', () => PLOTS.forEach(p => p.redraw()));

// ---------- DOM helpers ----------
const $ = s => document.querySelector(s);
const NSV = 'http://www.w3.org/2000/svg', NHT = 'http://www.w3.org/1999/xhtml';
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false }], throwOnError: false };
// Render $...$ in a node. If the CDN did not load, the text stays as typed.
function tex(node) { if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH); return node; }
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function hh(tag, cls, ...kids) { const e = h(tag, cls); for (const k of kids) if (k) e.append(k); return e; }
function mark(e, kind, id, title) { e.dataset.item = kind; if (id != null) e.dataset.id = id; if (title != null) e.dataset.title = title; return e; }
function emit(kind, data) {
  try { if (window.fluid && typeof window.fluid.emit === 'function') Promise.resolve(window.fluid.emit(kind, data)).catch(() => {}); }
  catch (e) { /* the view works without the bridge */ }
}
// Fixed decimals, with no minus sign on zero.
function fx(x, d) { const y = Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x; return y.toFixed(d); }
// A short number: up to d decimals, trailing zeros dropped.
function sn(x, d) { return String(+fx(x, d == null ? 3 : d)); }

// ---------- controls ----------
// A labelled range input. o: {id, min, max, step, value, fmt(v) -> TeX-ready text, onInput(v)}.
function ctl(label, o) {
  const wrap = h('label', 'slide-ctl');
  const lab = setTex(h('span', 'lab'), label);
  const inp = h('input');
  inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step; inp.value = o.value;
  mark(inp, 'control', o.id, o.id);
  const val = h('span', 'val');
  const show = v => setTex(val, o.fmt(v));
  inp.addEventListener('input', () => { show(+inp.value); o.onInput(+inp.value); });
  show(o.value);
  wrap.append(lab, inp, val);
  return { el: wrap, input: inp, set(v) { inp.value = v; show(v); } };
}
// A row of buttons that pick one choice. choices: [[id, label], ...]; getCur() gives the current id.
function choiceRow(label, choices, getCur, onPick) {
  const row = hh('div', 'btnrow', label ? setTex(h('span', 'lab'), label) : null);
  const btns = choices.map(([id, text]) => {
    const b = mark(h('button', 'btn'), 'control', id);
    setTex(b, text);
    b.addEventListener('click', () => { onPick(id); paint(); });
    row.append(b);
    return [id, b];
  });
  function paint() { btns.forEach(([id, b]) => b.classList.toggle('on', id === getCur())); }
  paint();
  return { el: row, paint };
}
// A readout box: label and value are TeX-ready text.
function readout(id, label) {
  const box = mark(h('div', 'readout'), 'readout', id);
  const k = setTex(h('div', 'k'), label);
  const v = h('div', 'val');
  box.append(k, v);
  return { el: box, set(text) { setTex(v, text); }, label(t) { setTex(k, t); } };
}
// Legend: items {color (CSS), text, kind: 'line' | 'dash' | 'chip' | 'ring' | 'dot'}.
function legend(items) {
  const d = h('div', 'legend');
  for (const it of items) {
    const s = h('span');
    let sw;
    if (it.kind === 'chip') { sw = h('span', 'chip'); sw.style.background = it.color; }
    else if (it.kind === 'ring') { sw = h('span', 'ring'); if (it.color) sw.style.borderColor = it.color; }
    else { sw = h('span', 'sw'); sw.style.borderTop = '3px ' + (it.kind === 'dash' ? 'dashed' : 'solid') + ' ' + it.color; }
    s.append(sw, setTex(h('span'), it.text));
    d.append(s);
  }
  return d;
}
function sym(text) { return setTex(h('p', 'sym'), text); }
function caseLine(text) { return setTex(h('p', 'case'), text); }
function nameLine(html) { const p = h('p', 'sym name'); p.innerHTML = html; return tex(p); }
function triesList(items) { return hh('ol', 'tries', ...items.map(t => setTex(h('li'), t))); }
// The takeaway (and the AI echo, if any) appear after the first try: on the first click, drag or slider
// move in the widget, or on "Show the takeaway".
function takeBox(widget, text, echo) {
  const holder = h('div', 'takeholder');
  const btn = mark(h('button', 'btn'), 'control', 'show-takeaway');
  setTex(btn, 'Show the takeaway');
  const tk = setTex(h('p', 'takeaway'), text);
  const parts = [tk];
  if (echo) {
    const p = h('p', 'echo');
    p.append(h('span', 'kicker', 'Same idea in AI research'), setTex(h('span'), echo.text), ' ', h('span', 'src', '(' + echo.src + ')'));
    parts.push(p);
  }
  parts.forEach(e => { e.hidden = true; });
  const show = () => { parts.forEach(e => { e.hidden = false; }); btn.hidden = true; };
  btn.addEventListener('click', show);
  for (const ev of ['input', 'click', 'pointerdown']) widget.addEventListener(ev, show);
  holder.append(btn, ...parts);
  return holder;
}
// The side column of a content slide, after the frame's tag, title, question and formula.
// o: {case, recall, sym, name, tries, take, echo}. The everyday case goes right under the question.
function sideStd(widget, side, o) {
  const q = side.querySelector('.question');
  let at = q;
  if (o.case) { const c = caseLine(o.case); at.after(c); at = c; }
  if (o.recall) { const r = sym(o.recall); at.after(r); at = r; }
  if (o.sym) side.append(sym(o.sym));
  if (o.name) side.append(nameLine(o.name));
  if (o.tries) side.append(triesList(o.tries));
  if (o.take) side.append(takeBox(widget, o.take, o.echo));
}

// ---------- SVG helpers ----------
function svgNode(tag, attrs, parent) {
  const e = document.createElementNS(NSV, tag);
  for (const k in attrs) if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function svgRoot(w, ht) { return svgNode('svg', { viewBox: '0 0 ' + w + ' ' + ht, role: 'img', 'font-family': 'system-ui, sans-serif', 'font-size': 14 }); }
function svgText(parent, x, y, s, attrs) {
  const t = svgNode('text', Object.assign({ x: x, y: y, fill: COL.muted, 'font-size': 14 }, attrs || {}), parent);
  t.textContent = s;
  return t;
}
// A KaTeX label inside an SVG: a foreignObject holding a rendered formula. o: {w, ht, anchor, size, fill, bg, bold}.
function svgTex(parent, x, y, s, o) {
  o = o || {};
  const w = o.w || 220, ht = o.ht || 26, anchor = o.anchor || 'middle';
  const x0 = anchor === 'end' ? x - w : anchor === 'start' ? x : x - w / 2;
  const fo = svgNode('foreignObject', { x: x0, y: y - ht / 2, width: w, height: ht }, parent);
  const d = document.createElementNS(NHT, 'div');
  const jc = anchor === 'end' ? 'flex-end' : anchor === 'start' ? 'flex-start' : 'center';
  d.setAttribute('style', 'display:flex;align-items:center;height:100%;white-space:nowrap;font-size:' +
    (o.size || 15) + 'px;color:' + (o.fill || COL.text2) + ';justify-content:' + jc + (o.bold ? ';font-weight:600' : ''));
  const span = document.createElementNS(NHT, 'span');
  span.textContent = s;
  if (o.bg) span.setAttribute('style', 'background:' + o.bg + ';border-radius:5px;padding:1px 6px');
  d.appendChild(span);
  fo.appendChild(d);
  tex(span);
  return fo;
}
// The same label with a halo in the page color, so it reads over a curve or bars.
function haloTex(parent, x, y, s, o) {
  const fo = svgTex(parent, x, y, s, o);
  fo.firstChild.style.textShadow = '0 0 3px ' + COL.bg + ', 0 0 3px ' + COL.bg + ', 0 0 2px ' + COL.bg;
  return fo;
}
function line(svg, x1, y1, x2, y2, o) { return svgNode('line', Object.assign({ x1, y1, x2, y2 }, o || {}), svg); }
function dot(svg, x, y, r, fill, o) { return svgNode('circle', Object.assign({ cx: x, cy: y, r, fill }, o || {}), svg); }
function rect(svg, x, y, w, ht, o) { return svgNode('rect', Object.assign({ x, y, width: Math.max(0, w), height: Math.max(0, ht) }, o || {}), svg); }
function poly(svg, pts, o) { return svgNode('path', Object.assign({ d: pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(''), fill: 'none' }, o || {}), svg); }
// A horizontal bracket from x1 to x2 at height y, with end ticks.
function hBracket(svg, x1, x2, y, color, w, id) {
  const g = svgNode('g', { 'data-item': 'mark', 'data-id': id }, svg);
  svgNode('path', { d: 'M' + x1 + ' ' + (y - 6) + 'V' + y + 'H' + x2 + 'V' + (y - 6), fill: 'none', stroke: color, 'stroke-width': w || 2 }, g);
  return g;

// A plot that takes the height left in its parent. draw(svg, W, H) runs on every resize and redraw.

// ---------- seeded noise ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// One standard normal draw (Box-Muller).
function gauss(r) { let u = 0; while (u === 0) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }

// ===== the running median =====
const NJ = 40, S_DROP = 20;                                   // 40 samples; the light goes off at sample 20
const CLEAN = Array.from({ length: NJ }, (_, n) => (n < S_DROP ? 1 : 0));
const meanOf = a => a.reduce((x, y) => x + y, 0) / a.length;
const medianOf = a => { const s = a.slice().sort((x, y) => x - y); return s[(s.length - 1) >> 1]; };
const sdOf = a => { const m = meanOf(a); return Math.sqrt(a.reduce((s, v) => s + (v - m) * (v - m), 0) / a.length); };
// A running filter over 2k+1 points; the ends repeat the first and last reading (as checks.py does).
function runFilt(u, k, f) {
  const p = [...Array(k).fill(u[0]), ...u, ...Array(k).fill(u[u.length - 1])];
  return u.map((_, i) => f(p.slice(i, i + 2 * k + 1)));
}
// Samples from the 90% to the 10% crossing of a falling step from 1 to 0 (linear interpolation).
function rampWidth(y) {
  const cross = lev => { for (let i = 1; i < y.length; i++) if (y[i - 1] >= lev && y[i] < lev) return i - 1 + (y[i - 1] - lev) / (y[i - 1] - y[i]); return NaN; };
  return cross(0.1) - cross(0.9);
}
// Where the median's drop lands: the first sample from 10 on below 1/2 (as checks.py does).
function dropAt(m) { let p = 10; while (p < 30 && !(m[p] < 0.5)) p++; return p; }
// The record on screen: one fixed noise shape, scaled by the noise slider.
const Z_SHOW = (() => { const r = mulberry32(9); return CLEAN.map(() => gauss(r)); })();
// 1000 runs at a noise level: how often the median's drop lands on sample 20, and within one sample.
const TALLY = {};
function tally(sd, k) {
  const key = sd.toFixed(2) + '-' + k;
  if (TALLY[key]) return TALLY[key];
  let exact = 0, near = 0;
  for (let s = 0; s < 1000; s++) {
    const r = mulberry32(7000 + s);
    const x = CLEAN.map(v => v + sd * gauss(r));
    const p = dropAt(runFilt(x, k, medianOf));
    if (p === S_DROP) exact++;
    if (Math.abs(p - S_DROP) <= 1) near++;
  }
  return (TALLY[key] = { exact: exact / 10, near: near / 10 });
}

// ---------- 1. Decision: which smoother keeps the jump? ----------
function drawJumpSketch(svg, W, H) {

  const r = mulberry32(11);
  const pts = CLEAN.map((v, n) => [n, v + 0.12 * gauss(r)]);
  poly(svg, [[P.X(-0.5), P.Y(1)], [P.X(19.5), P.Y(1)], [P.X(19.5), P.Y(0)], [P.X(39.5), P.Y(0)]],

// ---------- 2. The median keeps the jump ----------
function slideMedianJump(widget, side) {
  const st = { k: 2, sd: 0, c: 20 };
  const rec = () => CLEAN.map((v, n) => v + st.sd * Z_SHOW[n]);
  const pickW = choiceRow('window $2k+1$:', [['w3', '$3$'], ['w5', '$5$'], ['w9', '$9$']], () => 'w' + (2 * st.k + 1),
    id => { st.k = (+id.slice(1) - 1) / 2; update(); });

    onInput: v => { st.sd = v; update(); } });

  const rM = readout('median-drop', 'median: drops at');
  const rT = readout('median-runs', 'median drop in $1000$ runs');

    rect(svg, xa, P.T - 4, xb - xa, P.ph + 4, { rx: 4, fill: COL.accentTint, 'data-item': 'mark', 'data-id': 'window' });
    hBracket(svg, xa, xb, P.T - 8, COL.accent, 2, 'window-bracket');
    const lab = 'around $n=' + c + '$: average $' + fx(avg[c], 2) + '$, median $' + fx(med[c], 2) + '$';
    const lw = 330, lx = Math.max(P.L + lw / 2, Math.min(W - P.R - lw / 2, (xa + xb) / 2));
    haloTex(svg, lx, 14, lab, { w: lw, size: 15, fill: COL.ink });

      svgText(svg, P.L - 6, P.Y(v) + 5, String(v), { 'text-anchor': 'end', fill: COL.muted });
    }
    poly(svg, [[P.X(-0.5), P.Y(1)], [P.X(19.5), P.Y(1)], [P.X(19.5), P.Y(0)], [P.X(39.5), P.Y(0)]],
      { stroke: COL.guide, 'stroke-width': 1.6, 'stroke-dasharray': '5 4', 'data-item': 'mark', 'data-id': 'true-level' });
    for (let n = 0; n < NJ; n += 5) svgText(svg, P.X(n), P.base + 17, String(n), { 'text-anchor': 'middle', fill: COL.muted });
    svgTex(svg, W - P.R, P.base + 30, 'sample $n$', { w: 120, anchor: 'end', size: 14, fill: COL.muted });
    svgTex(svg, P.X(19.5), P.base + 30, 'light off at $20$', { w: 140, size: 14, fill: COL.ink });
    // readings, then the two outputs
    x.forEach((v, n) => dot(svg, P.X(n), P.Y(v), 3.6, Math.abs(n - c) <= k ? COL.ink : COL.panel, { stroke: Math.abs(n - c) <= k ? COL.ink : COL.grey, 'stroke-width': 1.6, 'data-item': 'mark', 'data-id': 'u-' + n }));
    poly(svg, avg.map((v, n) => [P.X(n), P.Y(v)]), { stroke: COL.slate4, 'stroke-width': 2.6, 'data-item': 'mark', 'data-id': 'average' });

    sym: String.raw`$k$: the readings on each side of sample $n$, so the window holds $2k+1$ (window $5$ means $k=2$).`,

// ---------- 3. Why it's true: the median switches when the middle point switches ----------

// ---------- 4. What the median costs, and what it buys ----------
const COST_RUNS = 20000, COST_SEED = 169;
const COST = {};
// 20000 windows of n readings: the average and the median of each. Seed 169 for every setting.
function costRun(n, spikes) {
  const key = n + (spikes ? 's' : 'g');
  if (COST[key]) return COST[key];
  const r = mulberry32(COST_SEED), A = [], M = [];
  for (let i = 0; i < COST_RUNS; i++) {
    const w = [];
    for (let j = 0; j < n; j++) w.push(gauss(r) + (spikes && r() < 0.05 ? 10 : 0));
    A.push(meanOf(w)); M.push(medianOf(w));
  }
  return (COST[key] = { A, M, sA: sdOf(A), sM: sdOf(M), cA: meanOf(A), cM: meanOf(M) });
}

// ---------- 5 and 6. Pulses and their spectra ----------
const PI = Math.PI;
// g(t), its spectrum G(f) (real, since g is even), and the widths of |g|^2 and |G|^2 (checks.py: narrow-wide).
const SHAPES = {
  gauss: { label: 'Gaussian', g: t => Math.exp(-t * t / 2), G: f => Math.sqrt(2 * PI) * Math.exp(-2 * PI * PI * f * f),
    dt: Math.SQRT1_2, df: 1 / (2 * Math.SQRT2 * PI), L: 40 },
  exp: { label: 'two-sided exponential', g: t => Math.exp(-Math.abs(t)), G: f => 2 / (1 + 4 * PI * PI * f * f),
    dt: Math.SQRT1_2, df: 1 / (2 * PI), L: 60 },
  rcos: { label: 'raised cosine', g: t => (Math.abs(t) <= 1 ? (1 + Math.cos(PI * t)) / 2 : 0),
    G: f => { const a = Math.abs(f); if (a < 1e-7) return 1; if (Math.abs(a - 0.5) < 1e-7) return 0.5; return Math.sin(2 * PI * f) / (2 * PI * f * (1 - 4 * f * f)); },
    dt: Math.sqrt((1 - 7.5 / (PI * PI)) / 3), df: 1 / Math.sqrt(12), L: 1 } };
const SHAPE_CHOICES = [['gauss', 'Gaussian'], ['exp', 'two-sided exponential'], ['rcos', 'raised cosine']];
// Sample a curve on [a, b].
function curve(fn, a, b, n) { const pts = []; for (let i = 0; i <= n; i++) { const x = a + (b - a) * i / n; pts.push([x, fn(x)]); } return pts; }
// Simpson's rule (n even).
function simpson(fn, a, b, n) { const hh2 = (b - a) / n; let s = fn(a) + fn(b); for (let i = 1; i < n; i++) s += (i % 2 ? 4 : 2) * fn(a + i * hh2); return s * hh2 / 3; }

  if (lit === 'squeeze') {
    const t0 = dts, tau = s * t0;
    dot(svg, P.X(t0), P.Y(S.g(s * t0)), 6, COL.amber);
    dot(svg, P.X(tau), P.Y(S.g(tau)), 6, COL.amber);
    poly(svg, [[P.X(t0), P.Y(S.g(tau))], [P.X(tau), P.Y(S.g(tau))]], { stroke: COL.amber, 'stroke-width': 2.5, 'stroke-dasharray': '4 3' });
    haloTex(svg, (P.X(t0) + P.X(tau)) / 2, P.Y(S.g(tau)) - 13, '$t\\to st$', { w: 80, size: 14, fill: COL.amberInk });
  }
  // bottom: G and G_s, true heights
  const Q = plotFrame(svg, W, H, { x0: -1.5, x1: 1.5, y0: -0.05 * G0, y1: 1.12 * G0, L: 14, R: 12, T: 26 + half + 8, B: 22 });
  line(svg, Q.L, Q.Y(0), W - Q.R, Q.Y(0), { stroke: COL.grey });
  for (let f = -1; f <= 1; f += 0.5) svgText(svg, Q.X(f), Q.base + 17, sn(f, 1).replace('-', '−'), { 'text-anchor': 'middle', fill: COL.muted });
  svgTex(svg, W - Q.R, Q.base + 17, '$f$', { w: 30, anchor: 'end', size: 14, fill: COL.muted });
  const Gs = curve(f => Math.abs(S.G(f / s)) / s, -1.5, 1.5, 600).map(p => [Q.X(p[0]), Q.Y(p[1])]);
  if (lit === 'stretch') glowPath(svg, Gs, 11);
  poly(svg, curve(f => Math.abs(S.G(f)), -1.5, 1.5, 600).map(p => [Q.X(p[0]), Q.Y(p[1])]), { stroke: COL.grey, 'stroke-width': 2.4, 'data-item': 'mark', 'data-id': 'G' });
  poly(svg, Gs, { stroke: COL.accent, 'stroke-width': 2.8, 'data-item': 'mark', 'data-id': 'G-s' });
  const df = S.df, dfs = S.df * s;
  const yA = Q.Y(G0 * 0.75), yB = Q.Y(G0 * 0.3);
  if (lit === 'product') glowRect(svg, Q.X(-dfs), yB - 8, Q.X(dfs) - Q.X(-dfs), 10, 3);
  hBracket(svg, Q.X(-df), Q.X(df), yA, COL.grey, 2, 'df');
  hBracket(svg, Q.X(-dfs), Q.X(dfs), yB, COL.accent, 2.4, 'df-s');
  haloTex(svg, Q.X(-df) - 6, yA - 4, '$\\Delta f$', { w: 60, anchor: 'end', size: 15, fill: COL.text2 });
  haloTex(svg, Math.min(W - 80, Q.X(dfs) + 6), yB - 4, '$s\\,\\Delta f$', { w: 70, anchor: 'start', size: 15, fill: COL.accentDeep });
  if (lit === 'stretch') {
    const f0 = Math.min(1.4, dfs), f1 = f0 / s;
    dot(svg, Q.X(f0), Q.Y(Math.abs(S.G(f0 / s)) / s), 6, COL.amber);
    dot(svg, Q.X(f1), Q.Y(Math.abs(S.G(f1))), 6, COL.amber);
    haloTex(svg, Q.X(Math.max(f0, f1)) + 8, Q.Y(Math.abs(S.G(f1))) - 12, '$G$ at $f/s$, $\\times\\frac1s$', { w: 150, anchor: 'start', size: 14, fill: COL.amberInk });
  }
}
function slideWhyScale(widget, side) {
  const st = { shape: 'gauss', s: 1.5, lit: '' };
  const pick = choiceRow('', SHAPE_CHOICES, () => st.shape, id => { st.shape = id; update(); });
  const sS = ctl('squeeze $s$', { id: 's', min: 1, max: 4, step: 0.25, value: st.s, fmt: v => '$' + sn(v, 2) + '$', onInput: v => { st.s = v; update(); } });
  const rP = readout('product', 'widths of $g_s$ and $G_s$, multiplied');
  const rG = readout('two-ways', '$G_s(0.3)$: the integral, and $\\tfrac1sG(\\tfrac{0.3}s)$');
  const plot = proofLeft(widget, {
    controls: [sS.el, pick.el],
    draw: (svg, W, H) => drawWhyScale(svg, W, H, st),
    after: hh('div', 'readouts', rP.el, rG.el),
    tests: [
      String.raw`Guess: squeeze the Gaussian $2$ times. What happens to its spectrum's width? Set $s=2$: it doubles.`,
      String.raw`Two-sided exponential, $s=2$: the product is still $0.1125$. Cases are evidence, not proof.`],
    model: 'A squeezed pulse runs through its shape faster, so every wave in it must turn faster too.' });
  function update() {
    const S = SHAPES[st.shape], s = st.s, f = 0.3;
    rP.set('$' + fx(S.dt / s, 3) + '\\times' + fx(S.df * s, 3) + '=' + fx(S.dt * S.df, 4) + '$');
    const Lt = S.L / s;
    const num = simpson(t => S.g(s * t) * Math.cos(2 * PI * f * t), -Lt, Lt, 4000);
    rG.set('$' + fx(num, 4) + '$ and $' + fx(S.G(f / s) / s, 4) + '$');
    pick.paint(); plot.redraw();
  }
  proofRight(side, {
    id: 'squeeze-stretch',
    goal: { tex: String.raw`G_s(f)=\tfrac1s\,G(f/s)`,
      words: String.raw`for $s>0$. So $\Delta t$ shrinks $s$ times, $\Delta f$ grows $s$ times, and their product stays.` },
    facts: [
      { words: String.raw`$G(f)=\int g(t)\,e^{-i2\pi ft}\,dt$`, ref: 'step 5' },
      { words: String.raw`with $\tau=st$, $dt=d\tau/s$`, ref: 'Primer · Integrals: techniques, step 1' }],
    lines: [
      { tex: String.raw`G_s(f)=\textstyle\int g(st)\,e^{-i2\pi ft}\,dt`, move: 'Unfold the definition',
        why: 'the spectrum of the squeezed pulse', choices: ['Name a piece', 'Rearrange'], highlight: 'pulse' },
      { tex: String.raw`=\tfrac1s\textstyle\int g(\tau)\,e^{-i2\pi(f/s)\tau}\,d\tau`, move: 'Change variables',
        why: String.raw`$\tau=st$, so $ft=(f/s)\tau$ and $dt=d\tau/s$`, choices: ['Use symmetry', 'Telescope'], highlight: 'squeeze' },
      { tex: String.raw`=\tfrac1s\,G(f/s)`, move: 'Unfold the definition',
        why: String.raw`the same integral, at frequency $f/s$`, choices: ['Use an earlier result', 'Take a limit'], highlight: 'stretch' },
      { tex: String.raw`(\Delta t/s)\cdot(s\,\Delta f)=\Delta t\,\Delta f`, move: 'Rearrange',
        why: String.raw`$g(st)$ is narrower by $s$; line 3 stretches $G$ by $s$ along $f$`, choices: ['Compare or bound', 'Compute it two ways'], highlight: 'product' }],
    lookBack: [
      { q: 'What did the proof use?',
        a: String.raw`Only the Fourier integral. It comes from the waves $e^{i2\pi ft}$ that every linear, shift-invariant system keeps (Primer · Signals: waves, step 6). So every such theory has this trade: "every linear theory must have an uncertainty principle" (book).` },
      { q: 'What does it not prove?',
        a: String.raw`That the product has a floor. The floor $\frac1{4\pi}$, reached only by the Gaussian, needs one more inequality (Cauchy-Schwarz on $g$ and its slope), not shown here.` },
      { q: 'Where is quantum mechanics?',
        a: String.raw`Momentum is Planck's $h$ times the spatial frequency (de Broglie), so $\Delta x\cdot\Delta p\ge\frac h{4\pi}$, Heisenberg's bound. Hamming asks if it is "really there" or only his "blue tinted glasses" of linearity (book). Experiments do show it: a beam through a narrow slit fans out. His habit stands: ask what your method puts there, like Eddington's fishermen, whose net set the smallest fish.` }] },
    plot, key => { st.lit = key || ''; plot.redraw(); });
  update();
}

// ---------- frame ----------
let cur = 0, shownId = null, endSent = false;
function goTo(i) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  if (shownId !== null && shownId !== s.id) emit('view.step', { step: s.id });
  shownId = s.id;
  const stage = $('#stage');
  stage.innerHTML = '';
  PLOTS = [];
  const widget = h('div', 'widget');
  const side = h('div', 'side');
  side.append(h('div', 'tag', s.tag), setTex(h('h2'), s.title));
  side.append(setTex(h('p', s.kind === 'decision' ? 'q' : 'question'), s.question));
  if (s.symbols) side.append(sym(s.symbols));
  if (s.formula) side.append(setTex(h('div', 'formula'), s.formula));
  const cls = 'slide' + (s.kind === 'proof' ? ' proof-slide' : s.kind === 'decision' ? ' decision' : '');
  const sec = mark(h('section', cls), 'step', s.id, s.title.replace(/\$/g, ''));
  sec.append(widget, side);
  stage.append(sec);
  if (s.kind === 'decision') mountDecision(s, widget, side);
  else s.mount(widget, side);
  tex(sec);
  if (cur === SLIDES.length - 1 && !endSent) { endSent = true; emit('view.action', { action: 'deck-end' }); }
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, k) => d.classList.toggle('on', k === cur));
}
// A cue is a state. {step} goes to the step and does nothing if it is shown. {step, reveal: true}
// also reveals that decision, once; a revealed decision stays revealed.
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i < 0) return;
  const changed = msg.reveal === true && SLIDES[i].kind === 'decision' && revealDecision(SLIDES[i].id, 'cue');
  if (i !== cur || changed) goTo(i);
}
(function init() {
  const dots = $('#dots');
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = s.title.replace(/\$/g, '');
    b.addEventListener('click', () => goTo(i));
    dots.appendChild(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],input[type=number],textarea,select')) return;
    if (e.target && e.target.classList && e.target.classList.contains('opt') && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault(); e.target.click(); return;
    }
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
})();

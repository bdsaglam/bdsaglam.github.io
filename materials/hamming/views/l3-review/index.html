<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Lecture 3 review: History of computers, hardware</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../../components/theme.js"></script>
<style>
/* Colors: grey for exact values and inputs, blue for outputs and the reader's choice,
   amber for what the newest proof line is about, red only for a failed check. */
:root{
  --fg:var(--pal-fg); --muted:var(--pal-muted); --line:var(--pal-line);
  --accent:var(--pal-accent); --chip:var(--pal-accent-soft); --red:var(--pal-red);
  --paper:#f9fafb; --rule:#eceef2; --amber-line:#f5d48a;
  --u:clamp(16px,1.35vw,20px);
}
/* --paper, --rule, --amber-line: light values the palette does not have, kept so light looks as before. */
:root[data-fluid-theme="dark"]{--paper:var(--pal-soft); --rule:var(--pal-grid); --amber-line:var(--pal-amber-bg)}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:var(--u)/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--pal-bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 24px 0;font-size:clamp(13px,1.1vw,16px);color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;padding:clamp(6px,1vh,12px) 24px;overflow:hidden}
footer{display:flex;align-items:center;gap:10px;padding:8px 24px;border-top:1px solid var(--line)}
footer .btn{min-width:84px}
#dots{display:flex;gap:8px;align-items:center}
#dots button{width:12px;height:12px;border-radius:50%;padding:0;border:1px solid var(--pal-grey);background:var(--pal-panel);cursor:pointer}
#dots button.on{background:var(--accent);border-color:var(--accent)}
#count{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Content slide: widget on the left (3/5), text on the right (2/5). */
.slide{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(18px,2.4vw,40px)}
.widget{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(5px,0.9vh,9px);overflow:hidden}
.widget>*{max-width:100%;min-width:0}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(6px,1.1vh,12px);overflow:hidden}
.tag{font:14px ui-monospace,Menlo,monospace;color:var(--muted)}
h2{font-size:clamp(20px,1.9vw,28px);line-height:1.2;margin:0;font-weight:650}
.question{margin:0;font-size:clamp(16px,1.3vw,18px);font-weight:600}
.formula{font-size:clamp(17px,1.5vw,22px)}
.sym{margin:0;font-size:16px;color:var(--muted)}
.tries{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.tries li::marker{color:var(--accent);font-weight:600}
.where{margin:0;font-size:16px}
.where b{color:var(--accent)}
.takeaway{margin:0;padding:10px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px;transition:opacity .2s}

/* Controls and readouts */
.sliders{display:flex;gap:8px 22px;flex-wrap:wrap;width:100%;align-items:center}
.slide-ctl{display:flex;align-items:center;gap:8px;font-size:16px}
.slide-ctl input{width:clamp(110px,10vw,160px);vertical-align:middle;accent-color:var(--accent)}
.slide-ctl .val{min-width:50px;white-space:nowrap}
.btn{font:inherit;padding:5px 11px;border:1px solid var(--line);background:var(--pal-panel);border-radius:8px;cursor:pointer;font-size:16px;line-height:1.3}
.btn.on{background:var(--chip);border-color:var(--accent);color:var(--pal-accent-deep)}
.btn:disabled{color:var(--muted);cursor:default;opacity:.6}
.btnrow{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap}
.btnrow .lab{font-size:16px;color:var(--muted);margin-right:2px}
.readouts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.readout{flex:1 1 120px;min-width:0;padding:3px 8px;border-radius:10px;background:var(--pal-soft);font-size:15px;overflow-wrap:anywhere}
.readout .k{color:var(--muted);font-size:14px}
.readout .val{font-size:16px;font-weight:600}
.legend{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:15px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:20px;height:0;vertical-align:middle;margin-right:6px}
.chip{display:inline-block;width:18px;height:12px;vertical-align:middle;margin-right:6px;border-radius:2px}
.note{min-height:34px;display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;font-size:16px;padding:2px 10px;border-radius:8px;background:var(--paper);border:1px solid var(--rule)}
.note.ask{background:var(--pal-amber-row);border-color:var(--amber-line)}
.note .good{color:var(--accent);font-weight:600}

/* Plots fill the space left in the widget column */
.fill{flex:1 1 0;min-height:120px;position:relative;width:100%}
.fill>svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* Proof slides: test and picture on the left, the proof (fl-proof-steps) on the right */
.slide.proof-slide{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(18px,2.2vw,34px)}
.slide.proof-slide h2{font-size:clamp(20px,1.75vw,26px)}
.slide.proof-slide .side{gap:clamp(4px,0.8vh,9px)}
.slide.proof-slide .side{justify-content:flex-start}
.slide.proof-slide .slide-ctl input{width:clamp(90px,8vw,130px)}
.slide.proof-slide .slide-ctl .val{min-width:40px}
.slide.proof-slide .sliders{gap:6px 14px}
.slide.proof-slide .fill{min-height:180px}
.readouts.inline .readout{display:flex;gap:4px 8px;align-items:baseline;flex-wrap:wrap}
.part{margin:0;font-weight:600;color:var(--muted)}
.test{display:flex;flex-direction:column;gap:3px;font-size:16px}
.test .tries{gap:3px}
.model{margin:0;padding:7px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:6px;font-size:16px}

/* Decision slides: the problem, three cards and the reveal on the left; question, try-steps,
   AI echo and takeaway on the right. */
.slide.decision{grid-template-columns:minmax(0,2.05fr) minmax(0,1fr);gap:clamp(20px,2.6vw,40px)}
.decision .widget{gap:6px}
.decision .side{justify-content:space-evenly;gap:clamp(8px,1.8vh,18px)}
.decision h2{font-size:clamp(23px,2.3vw,32px)}
.decision .q{margin:0;font-size:clamp(17px,1.55vw,21px);font-weight:600;line-height:1.35}
.decision .fx{margin:0;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:clamp(17px,1.6vw,22px);line-height:1.4}
.decision .kicker{font-size:14px;color:var(--muted);margin:0 0 3px}
.decision .blk{display:flex;flex-direction:column;gap:3px}
.decision .ai{margin:0;font-size:16px;line-height:1.4}
.decision .ai .src{color:var(--muted);font-size:14px}
.decision .takeaway{padding:11px 14px;line-height:1.4}
.decision .tries{gap:6px;font-size:clamp(16px,1.35vw,18px);line-height:1.4}
.decision .hold{color:var(--muted);font-style:italic;background:var(--paper);border:1px dashed var(--line);border-radius:6px;padding:9px 12px;margin:0;font-size:16px;line-height:1.4}
.prob{flex:0 0 auto;border:1px solid var(--line);border-radius:10px;padding:6px 14px;background:var(--paper);font-size:16px;line-height:1.4}
.prob .lead{font-weight:650;color:var(--muted)}
.prob p{margin:0}
.opts{flex:0 0 auto;display:flex;flex-direction:column;gap:clamp(4px,0.5vw,8px)}
.opt{display:grid;grid-template-columns:minmax(0,0.78fr) minmax(0,1.22fr);gap:0 14px;padding:clamp(6px,0.7vw,10px) 12px;border:1px solid var(--line);border-radius:10px;background:var(--pal-panel);color:inherit;text-align:left;cursor:pointer;min-width:0;font:inherit}
.opt .lhs{display:flex;flex-direction:column;gap:3px;min-width:0}
.opt .rhs{display:flex;flex-direction:column;gap:3px;min-width:0;border-left:1px solid var(--pal-soft-2);padding-left:14px}
.opt:not([aria-disabled="true"]):hover{border-color:var(--accent)}
.opt[aria-disabled="true"]{cursor:default}
.opt .top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:16px}
.opt .letter{font-weight:700;color:var(--accent)}
.opt .who{font-size:14px;color:var(--muted);text-align:right}
.opt .body{font-size:clamp(16px,1.4vw,19px);line-height:1.3}
.opt .asm{margin:0;font-size:clamp(16px,1.3vw,18px);line-height:1.33;color:var(--muted)}
.opt .verdict{font-size:clamp(16px,1.3vw,18px);line-height:1.33;color:var(--fg)}
.opt .verdict.idle{color:var(--muted);font-style:italic}
.opt.on{box-shadow:inset 0 0 0 2px var(--pal-ink)}
.opt.chooser{background:var(--chip);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.opt.chooser .who{color:var(--pal-accent-deep);font-weight:600}
.reveal{flex:1 1 auto;min-height:0;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:clamp(16px,1.25vw,18px);display:flex;flex-direction:column;justify-content:center;gap:6px}
.reveal.idle{background:var(--paper);color:var(--muted)}
.rv{margin:0;line-height:1.38}
.rv .k{font-weight:650;color:var(--accent)}
.rv .t{color:var(--muted);font-size:14px;white-space:nowrap}
.rv.hold{color:var(--muted)}
.decision .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px}
.decision .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--pal-on-accent);padding:6px 16px}

/* Short windows (1100x620 and similar): tighter spacing, body text stays 16px */
@media (max-height: 680px){
  header{padding-top:4px}
  #stage{padding:4px 24px}
  footer{padding:4px 24px}
  .widget{gap:4px}
  .side{gap:4px}
  .tries{gap:2px}
  .sym,.where,.tries,.test,.model{line-height:1.22}
  .readout{padding:2px 8px}
  .takeaway{padding:6px 10px}
  .formula{font-size:18px}
  h2{font-size:20px}
  .fill{min-height:100px}
  .note{min-height:30px;padding:1px 8px}
  .model{padding:5px 10px}
  .btn{padding:3px 9px}
  .slide-ctl input{width:100px}
  .slide.proof-slide .slide-ctl input{width:64px}
  .slide.proof-slide .slide-ctl .val{min-width:30px}
  .slide.proof-slide .sliders{gap:4px 10px}
  .slide.proof-slide .fill{min-height:165px}
  .decision h2{font-size:23px}
  .decision .side{gap:7px}
  .decision .tries{gap:2px;line-height:1.3}
  .decision .takeaway{padding:7px 12px}
  .reveal{gap:3px;padding:5px 12px}
  .rv{line-height:1.28}
  .opts{gap:3px}
  .opt{padding:4px 12px}
  .opt .body,.opt .asm,.opt .verdict{line-height:1.25}
  .prob{padding:4px 12px;line-height:1.3}
}
/* Lecture 3: Babbage's columns, the memory of the machine */
.engwrap{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.eng{border-collapse:collapse;font-size:18px}
.eng td{padding:3px 9px;border:1px solid var(--line);text-align:center;min-width:48px;white-space:nowrap}
.eng td:first-child{text-align:left;color:var(--muted);min-width:0}
.eng td.cur{background:var(--chip);color:var(--accent);font-weight:600}
.eng.mem{font-size:16px}
.eng.mem td{padding:1px 9px;min-width:70px}
.eng.mem td:first-child{width:40px}
.eng.mem tr.cur td{background:var(--pal-amber-bg);font-weight:600}
/* Dark only: the address cell on the amber row is grey on amber-bg (3.0:1); amber-ink reads. Light is unchanged. */
:root[data-fluid-theme="dark"] .eng.mem tr.cur td:first-child{color:var(--pal-amber-ink)}
.eng.mem td.wrote{background:var(--chip);color:var(--accent);font-weight:600}
.btnrow .lab{margin-right:4px}
</style>
</head>
<body>
<header id="head">Lecture 3 · History of computers: hardware, review by doing</header>
<main id="stage"></main>
<footer>
  <button class="btn" id="prev">Prev</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="../../lib/fluid.js"></script>
<script>
// ---------- palette and redraw ----------
// COL holds the palette colors for the SVG being drawn. fillPlot reads it at every paint, so a draw always
// uses the current theme. The light values are the old literals, so light looks as before.
let COL = {};
const PAL_NAMES = ['ink', 'text-2', 'muted', 'grid', 'guide', 'grey', 'accent', 'accent-2', 'panel', 'on-accent',
  'bg', 'amber', 'amber-bg', 'amber-ink'];
function readPalette() {
  const o = {};
  for (const n of PAL_NAMES) o[n.replace(/-(\w)/g, (_, c) => c.toUpperCase())] = FluidTheme.color(n);
  // Light values the palette does not have. Dark takes the palette name.
  const dark = FluidTheme.isDark();
  o.deep = dark ? FluidTheme.color('accent') : '#1d4ed8';   // blue text labels
  o.brown = dark ? FluidTheme.color('amber') : '#92400e';   // amber-brown label
  o.rule = dark ? FluidTheme.color('grid') : '#eceef2';     // faint gridlines
  return o;
}
let PLOTS = [];   // the plots on the current slide; a theme switch redraws them and keeps every control's state
window.addEventListener('fluid-themechange', () => PLOTS.forEach(p => p.redraw()));
// A number with d decimals, without a minus sign on zero.
const fixed = (v, d) => (Math.abs(v) < 0.5 * Math.pow(10, -d) ? 0 : v).toFixed(d);
// Up to d decimals, trailing zeros dropped: 0.5, -1, 0.866.
const short = (v, d) => { let s = fixed(v, d == null ? 3 : d); if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, ''); return s === '-0' ? '0' : s; };
// ---------- DOM and drawing helpers ----------
const $ = s => document.querySelector(s);
const NSV = 'http://www.w3.org/2000/svg', NHT = 'http://www.w3.org/1999/xhtml';
const MATH = { delimiters: [
  { left: '$$', right: '$$', display: true },
  { left: '$', right: '$', display: false } ], throwOnError: false };
// Render $...$ in a node. If the CDN did not load, the text stays as typed.
function tex(node) {
  if (node && typeof renderMathInElement === 'function') renderMathInElement(node, MATH);
  return node;
}
function setTex(node, text) { node.textContent = text; return tex(node); }
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function hh(tag, cls, ...kids) {
  const e = h(tag, cls);
  for (const k of kids) if (k) e.append(k);
  return e;
}
function mark(e, kind, id, title) {
  e.dataset.item = kind;
  if (id != null) e.dataset.id = id;
  if (title != null) e.dataset.title = title;
  return e;
}
function svgNode(tag, attrs, parent) {
  const e = document.createElementNS(NSV, tag);
  for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function svgRoot(w, ht) {
  return svgNode('svg', { viewBox: '0 0 ' + w + ' ' + ht, role: 'img', 'font-family': 'system-ui, sans-serif', 'font-size': 14 });
}
function svgText(parent, x, y, s, attrs) {
  const t = svgNode('text', Object.assign({ x: x, y: y, fill: COL.muted, 'font-size': 14 }, attrs || {}), parent);
  t.textContent = s;
  return t;
}
// A KaTeX label over an SVG: a foreignObject holding a rendered formula. o.bg paints a background.
function svgTex(parent, x, y, s, o) {
  o = o || {};
  const w = o.w || 220, ht = o.ht || 26, anchor = o.anchor || 'middle';
  const x0 = anchor === 'end' ? x - w : anchor === 'start' ? x : x - w / 2;
  const fo = svgNode('foreignObject', { x: x0, y: y - ht / 2, width: w, height: ht }, parent);
  const d = document.createElementNS(NHT, 'div');
  const jc = anchor === 'end' ? 'flex-end' : anchor === 'start' ? 'flex-start' : 'center';
  d.setAttribute('style', 'display:flex;align-items:center;height:100%;white-space:nowrap;font-size:' +
    (o.size || 15) + 'px;color:' + (o.fill || COL.text2) + ';justify-content:' + jc);
  const span = document.createElementNS(NHT, 'span');
  span.textContent = s;
  if (o.bg) span.setAttribute('style', 'background:' + o.bg + ';border-radius:5px;padding:1px 5px');
  if (o.halo) span.setAttribute('style', 'text-shadow:0 0 3px ' + COL.bg + ',0 0 3px ' + COL.bg + ',0 0 2px ' + COL.bg);
  d.appendChild(span);
  fo.appendChild(d);
  tex(span);
  return fo;
}
const haloTex = (parent, x, y, s, o) => svgTex(parent, x, y, s, Object.assign({ halo: true }, o || {}));
function path(svg, pts, attrs, close) {
  const d = 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L') + (close ? 'Z' : '');
  return svgNode('path', Object.assign({ d: d, fill: 'none' }, attrs), svg);
}
function dot(svg, x, y, color, r) {
  return svgNode('circle', { cx: x, cy: y, r: r || 5, fill: color, stroke: COL.bg, 'stroke-width': 1.5 }, svg);
}
// Tick label: KaTeX if it has $, plain text otherwise.
function tick(svg, x, y, s, anchor) {
  return s.indexOf('$') >= 0 ? svgTex(svg, x, y, s, { w: 80, size: 14, anchor: anchor || 'middle', fill: COL.muted }) :
    svgText(svg, x, y + 5, s, { 'text-anchor': anchor || 'middle' });
}
// A labelled range input. label and the value text are LaTeX-ready.
function slider(label, o) {
  const wrap = h('label', 'slide-ctl');
  const lab = tex(h('span', '', label));
  const val = h('span', 'val', '');
  const inp = h('input');
  inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step; inp.value = o.value;
  mark(inp, 'control', o.id, o.name || o.id);
  wrap.append(lab, inp, val);
  const fmtv = o.fmt || String;
  const api = {
    el: wrap, input: inp,
    get value() { return +inp.value; },
    set(v) { inp.value = v; api.show(); },
    show() { setTex(val, fmtv(+inp.value)); },
  };
  inp.addEventListener('input', () => { api.show(); if (o.onInput) o.onInput(+inp.value); });
  api.show();
  return api;
}
// A readout box: label and value are LaTeX-ready text.
function readout(id, label) {
  const box = mark(h('div', 'readout'), 'readout', id);
  const k = h('div', 'k');
  setTex(k, label);
  const v = h('div', 'val');
  box.append(k, v);
  return { el: box, set(text) { setTex(v, text); }, label(text) { setTex(k, text); } };
}
function legend(items) {
  const d = h('div', 'legend');
  for (const it of items) {
    const s = h('span');
    const sw = it.chip ? h('span', 'chip') : h('span', 'sw');
    if (it.chip) { sw.style.background = it.color; if (it.ring) { sw.style.background = 'var(--pal-panel)'; sw.style.border = '2px solid ' + it.color; sw.style.borderRadius = '50%'; sw.style.width = '13px'; sw.style.height = '13px'; } }
    else sw.style.borderTop = (it.width || 2) + 'px ' + (it.dash ? 'dashed' : 'solid') + ' ' + it.color;
    const t = h('span');
    setTex(t, it.text);
    s.append(sw, t);
    d.appendChild(s);
  }
  return d;
}
// A plot that takes the height left in its box. draw(svg, W, H) runs on every resize and may
// return a geometry object (wrap._geo) that the pointer handlers use.
function fillPlot(box, draw) {
  const wrap = h('div', 'fill');
  box.append(wrap);
  let key = '';
  const paint = force => {
    const w = Math.floor(wrap.clientWidth), ht = Math.floor(wrap.clientHeight);
    if (w < 60 || ht < 60) return;
    if (!force && key === w + 'x' + ht) return;
    key = w + 'x' + ht;
    COL = readPalette();
    const svg = svgRoot(w, ht);
    wrap._geo = draw(svg, w, ht) || null;
    wrap.replaceChildren(svg);
  };
  new ResizeObserver(() => paint(false)).observe(wrap);
  const plot = { wrap, redraw: () => paint(true) };
  PLOTS.push(plot);
  return plot;
}
function sym(text) { return setTex(h('p', 'sym'), text); }
function triesList(items) { return hh('ol', 'tries', ...items.map(t => setTex(h('li'), t))); }
function takeLine(text) { return setTex(h('p', 'takeaway'), text); }
function noticeLine(text) { const p = h('p', 'where'); p.append(h('b', '', 'Notice: ')); p.append(setTex(h('span'), text)); return p; }
// Session events. With no bridge, nothing is sent and the view still works.
function emit(kind, data) {
  try {
    if (window.fluid && typeof window.fluid.emit === 'function') Promise.resolve(window.fluid.emit(kind, data)).catch(() => {});
  } catch (e) { /* no bridge */ }
}

// ---------- lecture 3: decisions ----------
const D_TRIES = ['Read the problem.', 'Pick what you would do before he says it.', 'Read every verdict, not only yours.'];
const DECISIONS = {
  'why-differences': {
    problem: String.raw`Babbage's tables had errors in them (12:36). Multiplying would also build a table of $x^3$. Why did he build his machine on differences?`,
    formula: String.raw`$\Delta^3 x^3 = 6$: the third difference is constant, so additions alone give $x^3$.`,
    symbols: String.raw`$\Delta^1$: the change from one row to the next. $\Delta^2$: the change of $\Delta^1$. $\Delta^3$: the change of $\Delta^2$.`,
    chooser: 1, who: 'Hamming',
    options: [
      { text: 'Multiplication was not known yet, so he had no choice.',
        assumes: 'the table needs an operation nobody had built.',
        verdict: 'False. Leibniz, of calculus fame, had put multiplication into a machine before him (12:04).' },
      { text: 'Additions are all the machine needs. Most functions are locally polynomials, so repeated additions tabulate them.',
        assumes: 'a machine should do one simple kind of step.',
        verdict: 'Hamming (13:08): "the K differences of a polynomial degree K will be a constant", so repeated additions tabulate any function that a polynomial approximates.' },
      { text: 'Multiplying is too slow for a steam engine, so additions were faster.',
        assumes: 'the time of one step decides the design.',
        verdict: 'Hamming gives no speed argument here. He gives errors in the tables, and printed numbers with no chance of human error (13:08).' }],
    reveal: [
      { k: "Hamming's move", v: String.raw`Reduce the table to additions. A polynomial of degree $k$ has constant $k$-th differences.`, t: '13:08' },
      { k: 'What it bought', v: 'No human error: the machine prints the numbers itself.', t: '13:08' },
      { k: 'What it cost', v: 'The technology of his time could not build it, so he never finished (13:39).', t: '13:39' }],
    takeaway: 'Find the one operation the machine does well, then the problems it solves with that operation.' }
};


const DSTATE = {};
Object.keys(DECISIONS).forEach(id => { DSTATE[id] = { pick: null, open: false }; });
// Reveal a decision once; later calls change nothing. by: 'user' (a pick or the button) or 'cue'.
function revealDecision(id, by) {
  const st = DSTATE[id];
  if (!st || st.open) return false;
  st.open = true;
  emit('view.action', { action: 'reveal', step: id, by: by });
  return true;
}
function mountDecision(s, widget, side, sec) {
  const D = DECISIONS[s.id], st = DSTATE[s.id], open = st.open;
  const redraw = () => goTo(cur, true);
  const prob = mark(h('div', 'prob'), 'problem', s.id);
  prob.append(hh('p', '', h('span', 'lead', 'The problem.'), document.createTextNode(' '), setTex(h('span'), D.problem)));
  const opts = h('div', 'opts');
  D.options.forEach((o, k) => {
    const L = 'ABC'[k];
    const card = mark(h('div', 'opt'), 'card', L, o.text.replace(/\$/g, ''));
    card.setAttribute('role', 'button');
    card.setAttribute('aria-disabled', open ? 'true' : 'false');
    card.tabIndex = open ? -1 : 0;
    card.classList.toggle('on', st.pick === L);
    card.classList.toggle('chooser', open && k === D.chooser);
    const who = [];
    if (st.pick === L) who.push('Your pick');
    if (open && k === D.chooser) who.push(D.who);
    const top = hh('div', 'top', h('span', 'letter', L), h('span', 'who', who.join(', ')));
    const asm = setTex(h('p', 'asm'), 'Assumes: ' + o.assumes);
    const verdict = open ? setTex(h('div', 'verdict'), o.verdict) : h('div', 'verdict idle', 'Verdict after your pick.');
    card.append(hh('div', 'lhs', top, setTex(h('div', 'body'), o.text)), hh('div', 'rhs', asm, verdict));
    card.addEventListener('click', () => {
      if (DSTATE[s.id].open) return;
      st.pick = L;
      emit('view.action', { action: 'pick', step: s.id, option: L, correct: k === D.chooser });
      revealDecision(s.id, 'user');
      redraw();
    });
    opts.append(card);
  });
  const rev = mark(h('div', 'reveal'), 'reveal', s.id);
  if (!open) {
    rev.classList.add('idle');
    for (const r of D.reveal) rev.append(hh('p', 'rv hold', h('span', 'k', r.k + '. '), h('span', '', 'Shown after your pick.')));
    const btn = mark(h('button', 'btn primary', 'Show answer'), 'control', 'show-answer');
    btn.addEventListener('click', () => { if (revealDecision(s.id, 'user')) redraw(); });
    rev.append(hh('div', 'actions', btn));
  } else {
    for (const r of D.reveal) {
      const p = hh('p', 'rv', h('span', 'k', r.k + '. '));
      p.append(setTex(h('span'), r.v), h('span', 't', ' (' + r.t + ')'));
      rev.append(p);
    }
  }
  widget.append(prob, opts, rev);
  side.append(setTex(h('p', 'fx'), D.formula));
  if (D.symbols) side.append(sym(D.symbols));
  side.append(hh('div', 'blk', h('div', 'kicker', 'Try it'), hh('ol', 'tries', ...D_TRIES.map(t => h('li', '', t)))));
  if (D.ai) {
    if (open) {
      const p = setTex(h('p', 'ai'), D.ai);
      p.append(' ', h('span', 'src', '(' + D.src + ')'));
      side.append(hh('div', 'blk', h('div', 'kicker', 'Same move in AI research'), p));
    } else side.append(hh('div', 'blk', h('div', 'kicker', 'Same move in AI research'), h('p', 'hold ai', 'Shown after your pick.')));
  }
  side.append(open ? takeLine(D.takeaway) : h('p', 'hold', 'Takeaway: shown after your pick.'));
}

// ---------- lecture 3: content slides ----------
// Slide rule: C slides along D. Its 1 sits on a; the C mark for b lands on D at a x b.
function slideRule(widget, side) {
  let a = 2, b = 3;
  const mant = () => Math.pow(10, (Math.log10(a) + Math.log10(b)) % 1);
  const sA = slider(String.raw`$a$`, { id: 'factor-a', name: 'first factor a', min: 1, max: 9.9, step: 0.1, value: a,
    fmt: v => '$' + short(v, 1) + '$', onInput: v => { a = v; update(); } });
  const sB = slider(String.raw`$b$`, { id: 'factor-b', name: 'second factor b', min: 1, max: 9.9, step: 0.1, value: b,
    fmt: v => '$' + short(v, 1) + '$', onInput: v => { b = v; update(); } });
  widget.append(hh('div', 'sliders', sA.el, sB.el));
  const plot = fillPlot(widget, draw);
  const rExact = readout('product', String.raw`$a\times b$, exact`);
  const rRule = readout('rule', 'digits the rule shows');
  widget.append(legend([
    { color: 'var(--pal-accent)', width: 2, text: String.raw`$C$ scale: its $1$ sits on $a$` },
    { color: 'var(--pal-muted)', width: 2, text: String.raw`$D$ scale: fixed, read the answer here` },
    { color: 'var(--pal-amber)', width: 3, text: String.raw`cursor: $C$ at $b$, down to $D$` }]));
  widget.append(hh('div', 'readouts', rExact.el, rRule.el));
  function draw(svg, W, Hh) {
    const L = 36, R = W - 36, pw = R - L;
    const xOf = q => L + q * pw;
    const yC = Hh * 0.36, yD = Hh * 0.68;
    const frac = q => q - Math.floor(q);
    // D: the fixed scale, marks at 1 to 9
    svgNode('line', { x1: L, x2: R, y1: yD, y2: yD, stroke: COL.muted, 'stroke-width': 2 }, svg);
    for (let v = 1; v <= 9; v++) {
      const x = xOf(Math.log10(v));
      svgNode('line', { x1: x, x2: x, y1: yD, y2: yD + 9, stroke: COL.muted, 'stroke-width': 1.5 }, svg);
      svgText(svg, x, yD + 28, String(v), { 'text-anchor': 'middle', fill: COL.text2 });
    }
    // C: the sliding scale, shifted by log a
    svgNode('line', { x1: L, x2: R, y1: yC, y2: yC, stroke: COL.accent, 'stroke-width': 2 }, svg);
    for (let v = 1; v <= 9; v++) {
      const x = xOf(frac(Math.log10(a) + Math.log10(v)));
      svgNode('line', { x1: x, x2: x, y1: yC, y2: yC - 9, stroke: COL.accent, 'stroke-width': 1.5 }, svg);
      svgText(svg, x, yC - 16, String(v), { 'text-anchor': 'middle', fill: COL.deep });
    }
    // a: where C's 1 sits on D
    const xa = xOf(frac(Math.log10(a)));
    svgNode('circle', { cx: xa, cy: yD, r: 6, fill: COL.accent, stroke: COL.bg, 'stroke-width': 1.5 }, svg);
    svgTex(svg, xa, yD - 22, String(a.toFixed(1)) + ' = a', { w: 90, size: 15, fill: COL.deep });
    // the cursor: C at b, down to D
    const xb = xOf(frac(Math.log10(a) + Math.log10(b)));
    svgNode('line', { x1: xb, x2: xb, y1: yC, y2: yD, stroke: COL.amber, 'stroke-width': 3 }, svg);
    svgNode('circle', { cx: xb, cy: yC, r: 6, fill: COL.amber, stroke: COL.bg, 'stroke-width': 1.5 }, svg);
    svgTex(svg, xb, yC + 26, String.raw`$b$ on $C$`, { w: 120, size: 15, fill: COL.brown });
    svgTex(svg, xb, yD + 52, String.raw`reads $${short(mant(), 2)}$`, { w: 140, size: 16, fill: COL.amberInk, bg: COL.amberBg });
  }
  function update() {
    rExact.set('$' + short(a * b, 3) + '$');
    rRule.set('$' + short(mant(), 2) + '$');
    plot.redraw();
  }
  update();
  side.append(
    setTex(h('div', 'formula'), String.raw`$\log_{10}(ab)=\log_{10}a+\log_{10}b$`),
    sym(String.raw`Each length is a log, so sliding adds two logs. The rule shows digits only (Primer · Logarithms, step 3; the proof is step 4).`),
    triesList([
      String.raw`Set $a=2$ and $b=3$. The cursor lands on $6$. Hamming reads $5.99$, and $5.995$ if he is very good (05:49).`,
      String.raw`Set $a=3$ and $b=4$. The rule shows $1.20$. Where does the decimal point go?`,
      String.raw`Set $a=5$ and $b=2$. What does the rule show, and what is the product?`]),
    noticeLine(String.raw`the rule knows the digits of $ab$, not the power of ten. You place the point.`),
    takeLine('A slide rule multiplies by adding lengths, and each length is a log.'));
}

// Babbage's columns for f(x) = x^3, shown from x = 0 to the crank. Each turn adds down the columns.
function slideEngine(widget, side) {
  const POLY = x => x * x * x;
  const col = x => ({ x: x, f: POLY(x), d1: POLY(x) - POLY(x - 1), d2: POLY(x) - 2 * POLY(x - 1) + POLY(x - 2), d3: 6 });
  let reg = col(5), pick = null;
  const rX = readout('x', '$x$ now');
  const rF = readout('f', '$f(x)=x^3$ in the machine');
  const rP = readout('pick', 'your prediction of $f(6)$');
  const tbl = h('table', 'eng');
  const note = h('p', 'where');
  const predBtns = [200, 216, 241].map(v => {
    const b = mark(h('button', 'btn', String(v)), 'control', 'predict-' + v);
    b.addEventListener('click', () => {
      if (pick !== null) return;
      pick = v; crank.disabled = false; predBtns.forEach(q => q.disabled = true);
      setTex(note, (v === 216 ? 'Right. ' : 'Not ' + v + '. ') + 'The chain: ' + chain(6));
      rP.set('$' + v + '$');
      render();
    });
    return b;
  });
  const crank = mark(h('button', 'btn primary', 'Turn the crank'), 'control', 'crank');
  const reset = mark(h('button', 'btn', 'Back to x = 5'), 'control', 'reset');
  function chain(x) {
    const r = col(x - 1), n = col(x);
    return String.raw`$\Delta^2$: $${r.d2}+${r.d3}=${n.d2}$; $\Delta^1$: $${r.d1}+${n.d2}=${n.d1}$; $f$: $${r.f}+${n.d1}=${n.f}$.`;
  }
  function render() {
    tbl.replaceChildren();
    const rows = [[String.raw`$x$`, x => x], [String.raw`$x^3$`, x => POLY(x)],
      [String.raw`$\Delta^1$`, x => x >= 1 ? col(x).d1 : ''], [String.raw`$\Delta^2$`, x => x >= 2 ? col(x).d2 : ''],
      [String.raw`$\Delta^3$`, x => x >= 3 ? 6 : '']];
    for (const [lab, fn] of rows) {
      const tr = h('tr');
      tr.append(setTex(h('td'), lab));
      for (let x = 0; x <= reg.x; x++) {
        const td = h('td', x === reg.x ? 'cur' : '', String(fn(x)));
        tr.append(td);
      }
      tbl.append(tr);
    }
    crank.disabled = (reg.x === 5 && pick === null) || reg.x >= 10;
    rX.set('$' + reg.x + '$');
    rF.set('$' + reg.f + '$');
  }
  crank.addEventListener('click', () => {
    if (crank.disabled) return;
    const before = Object.assign({}, reg);
    reg.d2 += reg.d3; reg.d1 += reg.d2; reg.f += reg.d1; reg.x += 1;
    setTex(note, String.raw`Turn: $\Delta^2$ becomes $${before.d2}+${before.d3}=${reg.d2}$; $\Delta^1$ becomes $${before.d1}+${reg.d2}=${reg.d1}$; $f$ becomes $${before.f}+${reg.d1}=${reg.f}$.`);
    render();
  });
  reset.addEventListener('click', () => {
    reg = col(5); pick = null; predBtns.forEach(q => q.disabled = false); rP.set('none yet');
    setTex(note, 'Back at $x=5$. Predict $f(6)$ first.');
    render();
  });
  widget.append(
    hh('div', 'btnrow', h('span', 'lab', 'Predict $f(6)$ from the table:'), ...predBtns),
    hh('div', 'engwrap', tbl), note,
    hh('div', 'btnrow', crank, reset),
    hh('div', 'readouts', rX.el, rF.el, rP.el));
  setTex(note, 'Set-up: the table through $x=5$ is given. Predict $f(6)$ before you turn the crank.');
  rP.set('none yet');
  render();
  side.append(
    setTex(h('div', 'formula'), String.raw`$\Delta^3 x^3 = 6$, so $\Delta^2$, $\Delta^1$ and $f$ grow by adding`),
    sym(String.raw`$f(x)=x^3$. $\Delta^1$: the change from one row to the next. $\Delta^2$: the change of $\Delta^1$. $\Delta^3$: the change of $\Delta^2$ (Primer · Limits and derivatives, step 13 states it, step 14 proves it).`),
    triesList([
      String.raw`Read the table at $x=5$. Predict $f(6)$ before you turn the crank.`,
      String.raw`Turn the crank once. Check the three additions in the order $\Delta^2$, $\Delta^1$, $f$.`,
      String.raw`Turn it again. Is $f(7)=343$? Find where $\Delta^3=6$ shows in the table.`]),
    noticeLine(String.raw`the machine adds only. Nothing multiplies, because $\Delta^3$ is constant.`),
    takeLine('A polynomial has a constant last difference, so additions alone build its table.'));
}

// Light in one tick: d = c / f, with c = 3 x 10^10 cm/s.
function slideLight(widget, side) {
  const C = 3e10;
  let p = 9;   // log10 of the clock rate in hertz: 9 is 1 GHz
  const fHz = q => Math.pow(10, q);
  const rateTex = f => f >= 1e9 ? '$' + short(f / 1e9, 2) + '$ GHz' : '$' + short(f / 1e6, 2) + '$ MHz';
  const dCm = f => C / f;
  const dTex = d => '$' + short(d, 2) + '$ cm';
  const sF = slider(String.raw`clock rate $f$`, { id: 'rate', name: 'clock rate, log scale', min: 6, max: 11, step: 0.05, value: p,
    fmt: v => rateTex(fHz(v)), onInput: v => { p = v; update(); } });
  const presets = [['1 MHz', 6], ['1 GHz', 9], ['10 GHz', 10], ['30 GHz', Math.log10(3e10)]].map(([t, v]) => {
    const b = mark(h('button', 'btn'), 'preset', 'rate-' + t.replace(' ', '-'));
    setTex(b, t);
    b.addEventListener('click', () => { p = v; sF.set(v); update(); });
    return b;
  });
  widget.append(hh('div', 'sliders', sF.el), hh('div', 'btnrow', h('span', 'lab', 'Presets:'), ...presets));
  const plot = fillPlot(widget, draw);
  const rT = readout('tick', String.raw`$1/f$, one tick`);
  const rD = readout('dist', String.raw`$c/f$, light in one tick`);
  widget.append(legend([
    { color: 'var(--pal-accent)', width: 3, text: String.raw`dot: how far light goes in one tick, $c/f$` },
    { color: 'var(--pal-muted)', width: 2, text: String.raw`ruler: distance in cm, log scale` }]));
  widget.append(hh('div', 'readouts', rT.el, rD.el));
  const LO = -7, HI = 6;
  function draw(svg, W, Hh) {
    const L = 40, R = W - 40, y = Hh * 0.55;
    const xOf = lg => L + (lg - LO) / (HI - LO) * (R - L);
    svgNode('line', { x1: L, x2: R, y1: y, y2: y, stroke: COL.muted, 'stroke-width': 2 }, svg);
    for (let k = LO; k <= HI; k++) {
      const x = xOf(k);
      svgNode('line', { x1: x, x2: x, y1: y, y2: y + 8, stroke: COL.muted, 'stroke-width': 1.5 }, svg);
      if ((k - LO) % 2 === 0) tick(svg, x, y + 26, '$10^{' + k + '}$');
    }
    tick(svg, xOf(LO), y + 48, 'cm', 'start');
    // landmarks above the ruler
    const lm = [[-7, 'one atom spacing, 10 Å'], [0, 'a chip, about 1 cm (our figure)']];
    for (const [k, t] of lm) {
      const x = xOf(k);
      svgNode('line', { x1: x, x2: x, y1: y - 10, y2: y, stroke: COL.grey, 'stroke-width': 2 }, svg);
      svgText(svg, Math.min(x, R - 150), y - 30, t, { fill: COL.text2, 'text-anchor': x > R - 150 ? 'end' : (k === LO ? 'start' : 'middle') });
    }
    const d = dCm(fHz(p)), x = xOf(Math.log10(d));
    svgNode('circle', { cx: x, cy: y, r: 9, fill: COL.accent, stroke: COL.bg, 'stroke-width': 1.5 }, svg);
    svgTex(svg, Math.min(Math.max(x, L + 90), R - 90), y + 80, String.raw`light in one tick: ${dTex(d)}`, { w: 260, size: 16, fill: COL.deep });
  }
  function update() {
    const f = fHz(p);
    rT.set('$' + short(1 / f * 1e9, 3) + '$ ns');
    rD.set('$' + short(dCm(f), 3) + '$ cm');
    plot.redraw();
  }
  update();
  side.append(
    setTex(h('div', 'formula'), String.raw`$d=\dfrac{c}{f}$, with $c=3\times10^{10}$ cm/s`),
    sym(String.raw`$f$: ticks per second. $d$: the farthest a signal can go in one tick. A year is about $\pi\times10^7$ s.`),
    triesList([
      String.raw`Press 1 GHz. Read $d$: about $30$ cm, about one foot.`,
      String.raw`Predict $d$ at 10 GHz, then press it. You get about $3$ cm.`,
      String.raw`Find the rate where $d$ is $1$ cm. Why must a chip be small?`]),
    noticeLine(String.raw`light goes about a foot in a nanosecond, and about 1/100 inch in a picosecond (26:15).`),
    takeLine('The faster the clock, the closer the parts must be.'));
}

// Two curves through the same two book points: a logistic that stops, and an exponential that does not.
function slideSpeed(widget, side) {
  const LA = 3.576e9, KS = 0.4815, MS = 1991.97, RE = 0.4013;
  const Sc = t => LA / (1 + Math.exp(-KS * (t - MS)));
  const Ex = t => 1e9 * Math.exp(RE * (t - 1990));
  let year = 2010;
  const sY = slider(String.raw`year $t$`, { id: 'year', name: 'year', min: 1985, max: 2010, step: 1, value: year,
    fmt: v => '$' + v + '$', onInput: v => { year = v; update(); } });
  widget.append(hh('div', 'sliders', sY.el));
  const plot = fillPlot(widget, draw);
  const rE = readout('exp', String.raw`exponential $N_E(t)$, ops per s`);
  const rS = readout('s', String.raw`S-curve $N_S(t)$, ops per s`);
  const rR = readout('ratio', String.raw`$N_E/N_S$`);
  widget.append(legend([
    { color: 'var(--pal-muted)', width: 2, dash: true, text: 'exponential through the two points' },
    { color: 'var(--pal-accent)', width: 3, text: String.raw`S-curve through the same two points` },
    { color: 'var(--pal-grey)', width: 2, dash: true, text: String.raw`asymptote $3.576\times10^9$ (chapter)` },
    { chip: true, color: 'var(--pal-ink)', text: 'the book: 1987 and 1990' }]));
  widget.append(hh('div', 'readouts', rE.el, rS.el, rR.el));
  const Y0 = 1985, Y1 = 2010, Q0 = 8, Q1 = 13;
  function draw(svg, W, Hh) {
    const L = 60, R = W - 24, T = 16, B = Hh - 36;
    const xOf = t => L + (t - Y0) / (Y1 - Y0) * (R - L);
    const yOf = v => B - (Math.log10(v) - Q0) / (Q1 - Q0) * (B - T);
    for (let q = Q0; q <= Q1; q++) {
      const y = yOf(Math.pow(10, q));
      svgNode('line', { x1: L, x2: R, y1: y, y2: y, stroke: COL.rule, 'stroke-width': 1 }, svg);
      tick(svg, L - 6, y, '$10^{' + q + '}$', 'end');
    }
    for (let t = Y0; t <= Y1; t += 5) { const x = xOf(t); svgText(svg, x, B + 18, String(t), { 'text-anchor': 'middle', fill: COL.text2 }); }
    const ya = yOf(LA);
    svgNode('line', { x1: L, x2: R, y1: ya, y2: ya, stroke: COL.grey, 'stroke-width': 2, 'stroke-dasharray': '6 4' }, svg);
    const pts = (fn) => { const out = []; for (let t = Y0; t <= Y1; t += 0.5) out.push([xOf(t), yOf(Math.min(Math.max(fn(t), 1e8), 1e13))]); return out; };
    path(svg, pts(Ex), { stroke: COL.muted, 'stroke-width': 2.5, 'stroke-dasharray': '7 5' });
    path(svg, pts(Sc), { stroke: COL.accent, 'stroke-width': 3.5 });
    const p1 = [1987, 3e8], p2 = [1990, 1e9];
    dot(svg, xOf(p1[0]), yOf(p1[1]), COL.ink, 6);
    dot(svg, xOf(p2[0]), yOf(p2[1]), COL.ink, 6);
    svgTex(svg, xOf(1987) + 10, yOf(3e8) + 22, String.raw`1987: $3\times10^8$`, { w: 130, size: 15, anchor: 'start', fill: COL.ink });
    svgTex(svg, xOf(1990) + 10, yOf(1e9) + 24, String.raw`1990: $10^9$`, { w: 120, size: 15, anchor: 'start', fill: COL.ink });
    svgTex(svg, R - 4, ya - 14, String.raw`asymptote $3.576\times10^9$`, { w: 200, size: 15, anchor: 'end', fill: COL.muted });
    const xt = xOf(year);
    svgNode('line', { x1: xt, x2: xt, y1: T, y2: B, stroke: COL.amber, 'stroke-width': 2 }, svg);
    dot(svg, xt, yOf(Sc(year)), COL.accent, 6);
    dot(svg, xt, yOf(Math.min(Ex(year), 1e13)), COL.muted, 6);
  }
  function fmtN(v) { const e = Math.floor(Math.log10(v)); const m = v / Math.pow(10, e); return '$' + short(m, 2) + '\\times10^{' + e + '}$'; }
  function update() {
    rE.set(fmtN(Ex(year)));
    rS.set(fmtN(Sc(year)));
    rR.set('$' + short(Ex(year) / Sc(year), 2) + '$');
    plot.redraw();
  }
  update();
  side.append(
    setTex(h('div', 'formula'), String.raw`$N_E(t)=10^{9}\,e^{0.4013\,(t-1990)}$`),
    setTex(h('div', 'formula'), String.raw`$N_S(t)=\dfrac{3.576\times10^{9}}{1+e^{-0.4815\,(t-1991.97)}}$`),
    sym(String.raw`Two points only, from the book: about $3\times10^8$ in 1987 (the Los Alamos line, on target) and about $10^9$ in 1990. The S-curve is Lecture 2 (23:01).`),
    triesList([
      String.raw`Before you move the slider, predict the 2010 speed: near $3.6\times10^{9}$, or near $10^{12}$?`,
      String.raw`Move to 1987, then 1990. Both curves pass the two points.`,
      String.raw`Move to 2010. Read both values and their ratio. Which curve stops?`]),
    noticeLine('two points cannot tell the curves apart. The ceiling does.'),
    takeLine('Curves that fit the same points can split by a factor near 850 in 2010; the ceiling decides.'));
}

// A tiny von Neumann machine: the address register CAR, one cycle per Step.
function slideFetch(widget, side) {
  const START = ['LOAD 10', 'ADD 11', 'ADD 12', 'STORE 13', 'STOP', 0, 0, 0, 0, 0, 4, 7, 5, 0];
  let M, msg;
  const reset = () => { M = { car: 0, acc: 0, mem: START.slice(), done: false, wrote: -1 }; msg = 'Press Step. The machine reads the cell at CAR.'; };
  reset();
  const tbl = h('table', 'eng mem');
  const note = h('p', 'note');
  const rC = readout('car', String.raw`CAR, the address register`);
  const rA = readout('acc', String.raw`ACC, the running sum`);
  const rI = readout('ins', String.raw`instruction at CAR`);
  const stepBtn = mark(h('button', 'btn primary', 'Step'), 'control', 'step');
  const resetBtn = mark(h('button', 'btn', 'Reset'), 'control', 'reset');
  function cycle() {
    if (M.done) return;
    const word = String(M.mem[M.car]);
    const [op, arg] = word.split(' ');
    const n = Number(arg);
    let t = 'Fetch: CAR = ' + M.car + ', read "' + word + '". ';
    M.wrote = -1;
    if (op === 'LOAD') { M.acc = M.mem[n]; t += 'Decode: LOAD cell ' + n + '. Execute: ACC = ' + M.acc + '. '; }
    else if (op === 'ADD') { M.acc += M.mem[n]; t += 'Decode: ADD cell ' + n + '. Execute: ACC = ' + M.acc + '. '; }
    else if (op === 'STORE') { M.mem[n] = M.acc; M.wrote = n; t += 'Execute: write ACC into cell ' + n + '. '; }
    if (op === 'STOP') { M.done = true; t = 'Fetch: CAR = ' + M.car + ', read STOP. The machine halts.'; }
    else { M.car += 1; t += 'Then CAR + 1 = ' + M.car + '.'; }
    msg = t;
  }
  function render() {
    tbl.replaceChildren();
    for (let a = 0; a < START.length; a++) {
      const tr = h('tr', a === M.car && !M.done ? 'cur' : '');
      tr.append(h('td', '', String(a)), h('td', a === M.wrote ? 'wrote' : '', String(M.mem[a])));
      tbl.append(tr);
    }
    note.textContent = '';
    setTex(note, msg);
    rC.set('$' + M.car + '$');
    rA.set('$' + M.acc + '$');
    rI.set(M.done ? 'halted' : '"' + String(M.mem[M.car]) + '"');
  }
  stepBtn.addEventListener('click', () => { cycle(); render(); });
  resetBtn.addEventListener('click', () => { reset(); render(); });
  widget.append(hh('div', 'btnrow', stepBtn, resetBtn), hh('div', 'engwrap', tbl), note,
    hh('div', 'readouts', rC.el, rA.el, rI.el));
  render();
  side.append(
    setTex(h('div', 'formula'), String.raw`$\mathrm{CAR}\leftarrow\mathrm{CAR}+1$ after each instruction (a branch sets CAR instead)`),
    sym(String.raw`CAR: the current address register, where the next instruction is read. ACC: the running sum (our name, not Hamming's).`),
    triesList([
      String.raw`Press Step once. Read the four parts of the cycle in the note: fetch, decode, execute, add one to CAR.`,
      String.raw`Predict cell $13$ before the last write, then press Step until STOP.`,
      String.raw`Reset and press Step again. Which cycles change memory, and which only move CAR?`]),
    noticeLine('the machine does not know where it has been or what the bits mean (36:04 to 36:35).'),
    takeLine('A machine that follows addresses runs any program, because it never needs to know what the numbers mean.'));
}

const SLIDES = [
  { id: 'slide-rule', kind: 'content', tag: 'Lecture 04:46 to 05:49', title: 'A slide rule multiplies by adding lengths',
    question: 'How can two sticks with marks multiply two numbers?', mount: slideRule },
  { id: 'difference-engine', kind: 'content', tag: 'Lecture 12:36 to 13:08', title: "Babbage's table: additions only, column by column",
    question: 'Can a machine that only adds print the table of $x^3$ for any $x$?', mount: slideEngine },
  { id: 'why-differences', kind: 'decision', tag: 'Lecture 12:36, answer 13:08', title: 'Why did Babbage build his table from differences?',
    question: 'Before he says it: why differences, and not multiplication?' },
  { id: 'light-limit', kind: 'content', tag: 'Lecture 25:44 to 27:18', title: 'How far can a signal go in one tick?',
    question: 'A faster clock gives each tick less room. How much room does light get?', mount: slideLight },
  { id: 'speed-s-curve', kind: 'content', tag: 'Lecture 29:52 to 30:25', title: 'Two curves through two points: which one stops?',
    question: 'Which curve should you trust for the fastest machine in 2010?', mount: slideSpeed },
  { id: 'fetch-execute', kind: 'content', tag: 'Lecture 34:32 to 36:04', title: 'A machine that only follows its address register',
    question: 'How can a machine with no idea of meaning run a program?', mount: slideFetch },
];

let cur = 0, shownId = null, endSent = false;
function goTo(i, same) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  if (shownId !== null && shownId !== s.id) emit('view.step', { step: s.id });
  shownId = s.id;
  const stage = $('#stage');
  PLOTS = [];
  stage.innerHTML = '';
  const widget = h('div', 'widget');
  const side = h('div', 'side');
  side.append(h('div', 'tag', s.tag), setTex(h('h2'), s.title));
  side.append(setTex(h('p', s.kind === 'decision' ? 'q' : 'question'), s.question));
  if (s.symbols) side.append(sym(s.symbols));
  const cls = 'slide' + (s.kind === 'proof' ? ' proof-slide' : s.kind === 'decision' ? ' decision' : '');
  const sec = mark(h('section', cls), 'step', s.id, s.title.replace(/\$/g, ''));
  sec.append(widget, side);
  stage.append(sec);
  stage.scrollTop = 0;
  if (s.kind === 'decision') mountDecision(s, widget, side, sec);
  else s.mount(widget, side);
  // On a content slide the takeaway is dimmed until the user has tried a control.
  const tk = s.kind === 'content' ? side.querySelector('.takeaway') : null;
  if (tk) {
    tk.classList.add('dim');
    const openTk = () => tk.classList.remove('dim');
    sec.addEventListener('input', openTk);
    sec.addEventListener('click', e => { if (e.target.closest('[data-item="control"],[data-item="preset"]')) openTk(); });
    sec.addEventListener('pointerdown', e => { if (e.target.closest('[data-item="control"]')) openTk(); });
  }
  tex(sec);
  if (cur === SLIDES.length - 1 && !endSent) { endSent = true; emit('view.action', { action: 'deck-end' }); }
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === SLIDES.length - 1;
  $('#count').textContent = 'step ' + (cur + 1) + ' of ' + SLIDES.length;
  [...$('#dots').children].forEach((d, k) => d.classList.toggle('on', k === cur));
}
// A cue is a state. {step} goes to the step and does nothing if it is shown. {step, reveal: true}
// also reveals that decision, once; a revealed decision stays revealed.
function onCue(msg) {
  if (!msg || typeof msg.step !== 'string') return;
  const i = SLIDES.findIndex(s => s.id === msg.step);
  if (i < 0) return;
  const changed = msg.reveal === true && SLIDES[i].kind === 'decision' && revealDecision(SLIDES[i].id, 'cue');
  if (i !== cur || changed) goTo(i);
}
(function init() {
  const dots = $('#dots');
  SLIDES.forEach((s, i) => {
    const b = h('button');
    b.setAttribute('aria-label', 'Go to step ' + (i + 1));
    b.title = s.title.replace(/\$/g, '');
    b.addEventListener('click', () => goTo(i));
    dots.appendChild(b);
  });
  $('#prev').addEventListener('click', () => goTo(cur - 1));
  $('#next').addEventListener('click', () => goTo(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input[type=range],input[type=text],textarea,select')) return;
    if (e.target && e.target.classList && e.target.classList.contains('opt') && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault(); e.target.click(); return;
    }
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
  });
  goTo(0);
  if (window.fluid && typeof window.fluid.onCue === 'function') window.fluid.onCue(onCue);
})();
</script>

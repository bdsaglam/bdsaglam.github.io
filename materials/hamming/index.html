<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fluid</title>
  <link rel="stylesheet" href="viewer/board.css">
  <script>/* the theme before the first paint (board.js keeps it current) */
    try { const t = localStorage.getItem('fluid.theme') || 'auto';
      document.documentElement.dataset.theme = t === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
    } catch {}</script>
</head>
<body>
  <div id="app">
    <main id="stage">
      <div id="world"></div>
      <div id="empty">No views yet. Ask the agent in the terminal; its views appear here.</div>
      <div id="zoom">
        <button data-zoom="out" title="Zoom out">−</button>
        <button data-zoom="reset" id="zoom-level" title="Zoom to 100%">100%</button>
        <button data-zoom="in" title="Zoom in">+</button>
        <button data-zoom="fit" class="ico" data-tip="fit" aria-label="Fit all views"></button>
        <button data-zoom="export" class="ico" data-tip="export" aria-label="Export the open views as an interactive page"></button>
        <button data-zoom="theme" class="ico" data-tip="theme: auto" aria-label="Theme: auto, light, or dark"></button>
      </div>
      <button id="follow" hidden>Follow</button>
      <div id="toast" hidden></div>
      <div id="comment" hidden>
        <div class="what"></div>
        <textarea rows="2" placeholder="What should change here?" aria-label="Comment for the agent"></textarea>
        <div class="hint">Enter sends · Shift+Enter new line · Esc cancels</div>
      </div>
    </main>
    <aside id="side">
      <div id="side-grip" title="Drag to resize · double-click for the default width"></div>
      <button id="side-toggle" title="Collapse"></button>
      <header>
        <span id="dot" title="Disconnected"></span>
        <span id="project"></span>
        <span id="count"></span>
        <button id="collapse-all" class="hbtn" title="Collapse all groups" hidden></button>
        <button id="expand-all" class="hbtn" title="Expand all groups" hidden></button>
        <button id="show-all" class="hbtn" title="Show all groups on the board" hidden></button>
        <button id="hide-all" class="hbtn" title="Hide all groups from the board" hidden></button>
      </header>
      <input id="filter" type="search" placeholder="Filter views" aria-label="Filter views by title, group, or description" hidden>
      <ul id="list"></ul>
      <footer>Alt-click anything in a view to comment on it, or to point at it and talk in the terminal.</footer>
    </aside>
  </div>
  <script src="viewer/stage.js"></script>
  <script src="viewer/notes.js"></script>
  <script src="viewer/board.js"></script>
</body>
</html>
